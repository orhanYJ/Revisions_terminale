<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordsmith — Vocabulaire anglais Terminale</title>
<meta name="description" content="Le vocabulaire anglais qui sert à l'essay et à l'oral : cinq mots par jour, révisions espacées, exercices où l'on produit le mot.">
<meta name="theme-color" content="#3b2257">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocab">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --papier:#f7f3ec; --carte:#fffdf9; --encre:#22172e; --encre2:#6b5f78; --ligne:#e4dcd0;
  --prune:#3b2257; --prune2:#5a3a80; --safran:#e3a03a; --safran-l:#fbe7c4;
  --ok:#1f7a4d; --ok-l:#dff2e7; --ko:#b23a3a; --ko-l:#f8e1df;
  --ombre:0 1px 2px rgba(34,23,46,.06),0 6px 18px rgba(34,23,46,.07);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --papier:#16111d; --carte:#211a2b; --encre:#f1eaf7; --encre2:#a99cb8; --ligne:#352b42;
    --prune:#c9a8f0; --prune2:#b28fe0; --safran:#f0b453; --safran-l:#4a3618;
    --ok:#5fcf93; --ok-l:#173527; --ko:#f08a80; --ko-l:#3d1d1c;
    --ombre:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papier);color:var(--encre);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--prune2)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.haut{padding:18px 0 6px}
.marque{display:flex;align-items:center;gap:10px}
.marque svg{width:34px;height:34px;flex:none}
.marque b{font:700 1.45rem/1 var(--serif);letter-spacing:.01em;color:var(--prune)}
.marque span{display:block;font-size:.78rem;color:var(--encre2);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
h1,h2,h3{font-family:var(--serif);line-height:1.2}
h2{font-size:1.25rem;margin:22px 0 10px;color:var(--prune)}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:16px;box-shadow:var(--ombre);padding:18px}
.muted{color:var(--encre2)}
.petit{font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font-weight:600;background:var(--prune);color:#fff;min-height:48px}
@media (prefers-color-scheme:dark){.btn{color:#16111d}}
.btn.large{width:100%;font-size:1.05rem}
.btn.sec{background:transparent;color:var(--prune);border:1.5px solid var(--prune)}
.btn.safran{background:var(--safran);color:#2a1a05}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.seg button:focus-visible,nav.bas button:focus-visible,.mot-li:focus-visible{outline:3px solid var(--safran);outline-offset:2px}

/* Aujourd'hui */
.jour{position:relative;overflow:hidden}
.jour .date{font-size:.82rem;color:var(--encre2);text-transform:capitalize}
.jour h1{font-size:1.6rem;margin:4px 0 14px}
.compteurs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.compteurs div{background:var(--papier);border:1px solid var(--ligne);border-radius:12px;padding:10px 8px;text-align:center}
.compteurs b{display:block;font:700 1.6rem/1.1 var(--serif);color:var(--prune)}
.compteurs span{font-size:.76rem;color:var(--encre2)}
.fait{background:var(--ok-l);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:12px}
.alerte{display:flex;gap:10px;align-items:flex-start;background:var(--safran-l);border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:.92rem}
.alerte button{margin-left:auto;flex:none;border:0;background:var(--safran);color:#2a1a05;border-radius:9px;padding:7px 11px;font-weight:600;font-size:.85rem}
.seg{display:flex;background:var(--papier);border:1px solid var(--ligne);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--encre2);min-height:42px}
.seg button[aria-pressed="true"]{background:var(--carte);color:var(--prune);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.reglage{margin-top:16px}
.reglage label{display:block;font-size:.86rem;color:var(--encre2);margin-bottom:6px}
.methode li{margin:6px 0}

/* Listes de mots */
.liste-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.liste-t small{color:var(--encre2)}
.mots{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.mot-li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:11px 12px}
.mot-li b{font:600 1.05rem var(--serif)}
.mot-li .fr{color:var(--encre2);font-size:.88rem;margin-left:auto;text-align:right}
.pastilles{display:flex;gap:3px;flex:none}
.pastilles i{width:7px;height:7px;border-radius:50%;background:var(--ligne)}
.pastilles i.on{background:var(--safran)}
.bientot{opacity:.65}
.bientot .tag{font-size:.72rem;background:var(--papier);border:1px solid var(--ligne);border-radius:99px;padding:2px 8px;color:var(--encre2)}

/* Progrès */
.boites{display:flex;align-items:flex-end;gap:8px;height:150px;margin:16px 0 6px;padding:0 4px;border-bottom:1px solid var(--ligne)}
.boite{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.boite .barre{width:100%;background:var(--prune2);border-radius:8px 8px 0 0;min-height:3px;transform-origin:bottom}
.boite:first-child .barre{background:var(--ligne)}
.boite:nth-child(5) .barre,.boite:nth-child(6) .barre{background:var(--safran)}
.boite b{font:700 1rem var(--serif);margin-bottom:4px}
.boites-l{display:flex;gap:8px;padding:0 4px}
.boites-l span{flex:1;text-align:center;font-size:.7rem;color:var(--encre2);line-height:1.2}
.actions{display:grid;gap:8px;margin-top:12px}

/* Fiche d'un mot (dictionnaire) */
.fiche .tete{display:flex;align-items:flex-start;gap:10px}
.fiche .mot{font:700 2rem/1.1 var(--serif);color:var(--prune);margin:0;word-break:break-word}
.fiche .pos{font:italic .95rem var(--serif);color:var(--encre2)}
.fiche .ipa{font:.95rem var(--mono);color:var(--encre2)}
.son{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ligne);background:var(--papier);display:grid;place-items:center}
.son svg{width:20px;height:20px}
.reg{display:inline-block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ligne);border-radius:99px;padding:2px 8px;color:var(--encre2);margin-left:4px;vertical-align:middle}
.sens{font:600 1.15rem/1.35 var(--serif);margin:12px 0 4px}
.def{color:var(--encre2);margin:0 0 12px}
.bloc{margin-top:14px}
.bloc h4{margin:0 0 6px;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--encre2)}
.colls{display:flex;flex-wrap:wrap;gap:6px}
.colls span{background:var(--papier);border:1px solid var(--ligne);border-radius:99px;padding:4px 10px;font-size:.9rem}
.ex{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.ex li{font-family:var(--serif);font-size:1.04rem;border-left:3px solid var(--safran);padding:2px 0 2px 10px}
mark{background:linear-gradient(transparent 55%,var(--safran-l) 55%);color:inherit;font-weight:700;padding:0 1px}
.piege{background:var(--ko-l);border-radius:12px;padding:10px 12px;font-size:.93rem}
.piege b{color:var(--ko)}
.famille{font-size:.92rem}

/* Séance */
#seance{position:fixed;inset:0;background:var(--papier);z-index:50;display:none;flex-direction:column;overflow-y:auto}
#seance.on{display:flex}
.s-haut{position:sticky;top:0;background:var(--papier);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px;z-index:2}
.s-haut button{border:0;background:transparent;width:40px;height:40px;border-radius:50%;font-size:1.3rem;color:var(--encre2)}
.prog{flex:1;height:8px;background:var(--ligne);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--safran);border-radius:99px;transition:width .35s}
.s-corps{flex:1;width:100%;max-width:640px;margin:0 auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
body:not(.sans-ia) .s-corps{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.etape{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--encre2);margin:4px 0 10px}
.consigne{font-weight:600;margin:0 0 10px}
.phrase{font:1.25rem/1.75 var(--serif);margin:6px 0 14px}
.phrase input{font:inherit;font-weight:700;color:var(--prune);background:transparent;border:0;border-bottom:2.5px solid var(--prune2);padding:0 4px;min-width:4ch;text-align:center;border-radius:0}
.phrase input:focus{outline:0;border-bottom-color:var(--safran);background:var(--safran-l)}
.indice{background:var(--papier);border:1px dashed var(--ligne);border-radius:12px;padding:10px 12px;font-size:.95rem;margin-bottom:12px}
.indice .fr-ph{font-style:italic}
.ligne-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ligne-btn .btn{flex:1}
.lien{border:0;background:transparent;color:var(--prune2);text-decoration:underline;padding:6px 0;font-size:.92rem}
textarea{width:100%;min-height:110px;font:1.1rem/1.5 var(--serif);color:var(--encre);background:var(--carte);border:1.5px solid var(--ligne);border-radius:12px;padding:12px}
textarea:focus{outline:0;border-color:var(--prune2)}
.retour{border-radius:14px;padding:14px;margin:14px 0 4px}
.retour.ok{background:var(--ok-l)}
.retour.ok b.titre{color:var(--ok)}
.retour.ko{background:var(--ko-l)}
.retour.ko b.titre{color:var(--ko)}
.retour.presque{background:var(--safran-l)}
.retour p{margin:6px 0 0}
.retour .phrase-ok{font-family:var(--serif);font-size:1.05rem}
.bilan{text-align:center;padding-top:30px}
.bilan .grand{font:700 3rem/1 var(--serif);color:var(--prune)}
.bilan ul{text-align:left}

nav.bas{position:fixed;left:0;right:0;bottom:0;background:var(--carte);border-top:1px solid var(--ligne);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.bas div{display:flex;max-width:640px;width:100%}
nav.bas button{flex:1;border:0;background:transparent;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--encre2);min-height:58px}
nav.bas svg{width:23px;height:23px}
nav.bas button[aria-current="page"]{color:var(--prune)}
.vue{display:none}
.vue.on{display:block}
#modale{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(20,12,28,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#modale.on{display:flex}
#modale .carte{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#modale .fermer{display:block;margin:-6px auto 8px;width:44px;height:5px;border-radius:99px;background:var(--ligne);border:0;padding:0}
body.sans-ia .asr-btn{display:none!important}
.vf{margin:6px 0 4px}
.vf summary{cursor:pointer;color:var(--prune2);font-size:.9rem;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:6px 0;min-height:36px}
.vf summary::-webkit-details-marker{display:none}
.vf summary::before{content:"FR";font:700 .66rem var(--sans);letter-spacing:.04em;border:1.5px solid currentColor;border-radius:5px;padding:1px 4px}
.vf[open] summary{color:var(--encre2)}
.vf p{margin:2px 0 6px;font-weight:600}
.indice .en{font-weight:600}
.qcm{display:grid;gap:8px;margin:4px 0 6px}
.opt{text-align:left;border:1.5px solid var(--ligne);background:var(--carte);border-radius:12px;padding:12px 14px;font-size:.98rem;line-height:1.4;min-height:48px}
.opt:not(:disabled):hover{border-color:var(--prune2)}
.opt:focus-visible{outline:3px solid var(--safran);outline-offset:2px}
.opt.juste{border-color:var(--ok);background:var(--ok-l)}
.opt.faux{border-color:var(--ko);background:var(--ko-l)}
.opt:disabled{cursor:default;color:var(--encre)}
.filtre{width:100%;font:inherit;color:var(--encre);background:var(--carte);border:1.5px solid var(--ligne);border-radius:12px;padding:12px 14px;margin:0 0 4px}
.filtre:focus{outline:0;border-color:var(--prune2)}
details.liste{margin-top:10px}
details.liste>summary{cursor:pointer;list-style:none}
details.liste>summary::-webkit-details-marker{display:none}
details.liste>summary .liste-t b::after{content:" ▾";color:var(--encre2);font-size:.8em}
details.liste[open]>summary .liste-t b::after{content:" ▴"}
.actif{display:flex;gap:10px;align-items:center;font-size:.9rem;margin:12px 0 2px;color:var(--encre2)}
.actif input{width:20px;height:20px;accent-color:var(--prune)}
.par-liste{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.par-liste li{display:flex;justify-content:space-between;gap:10px}
.par-liste b{font-family:var(--serif)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Mouvement : seulement si l'appareil ne demande pas d'en réduire */
@media (prefers-reduced-motion:no-preference){
  html.mo .vue.on>*{animation:monte .42s cubic-bezier(.2,.8,.2,1) both}
  html.mo .vue.on>*:nth-child(2){animation-delay:.05s}
  html.mo .vue.on>*:nth-child(3){animation-delay:.1s}
  html.mo .vue.on>*:nth-child(4){animation-delay:.15s}
  html.mo .vue.on>*:nth-child(5){animation-delay:.2s}
  html.mo .s-corps>*{animation:entre .38s cubic-bezier(.2,.8,.2,1) both}
  html.mo .retour.ok{animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
  html.mo .retour.ko{animation:secoue .42s both}
  html.mo .boite .barre{animation:pousse .7s cubic-bezier(.2,.8,.2,1) both}
  html.mo .boite:nth-child(2) .barre{animation-delay:.06s}
  html.mo .boite:nth-child(3) .barre{animation-delay:.12s}
  html.mo .boite:nth-child(4) .barre{animation-delay:.18s}
  html.mo .boite:nth-child(5) .barre{animation-delay:.24s}
  html.mo .boite:nth-child(6) .barre{animation-delay:.3s}
  html.mo #modale.on .carte{animation:feuille .36s cubic-bezier(.2,.8,.2,1) both}
  html.mo .btn{transition:transform .12s}
  html.mo .btn:active{transform:scale(.97)}
  html.mo .marque svg .plume{animation:plume 3.2s ease-in-out infinite;transform-origin:50% 90%}
  html.mo .bilan .grand{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
  html.mo mark{background-size:0 100%;background-repeat:no-repeat;background-image:linear-gradient(transparent 55%,var(--safran-l) 55%);background-color:transparent;animation:surligne .7s .25s ease-out forwards}
}
@keyframes monte{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes entre{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes secoue{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes pousse{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes feuille{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes plume{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes surligne{to{background-size:100% 100%}}
</style>
<!-- assistant:debut — bouton « Demander à une IA » maintenu à part (assistant.js) ; à conserver lors des mises à jour -->
<script src="assistant.js?v=10" defer></script>
<!-- assistant:fin -->
</head>
<body>
<script>
if (window.matchMedia && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("mo");
</script>

<div class="wrap">
  <header class="haut">
    <div class="marque">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="var(--prune)"/><path d="M9 12l4.2 16h1.6L20 15.5 25.2 28h1.6L31 12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><g class="plume"><rect x="11" y="31" width="18" height="2.6" rx="1.3" fill="var(--safran)"/></g></svg>
      <div><b>Wordsmith</b><span>Vocabulaire anglais · BFI</span></div>
    </div>
  </header>
</div>

<main class="wrap">
  <!-- Aujourd'hui -->
  <section class="vue on" id="v-jour" aria-labelledby="t-jour"></section>
  <!-- Mots -->
  <section class="vue" id="v-mots" aria-labelledby="t-mots"></section>
  <!-- Progrès -->
  <section class="vue" id="v-progres" aria-labelledby="t-progres"></section>
</main>

<nav class="bas" aria-label="Navigation">
  <div>
    <button data-vue="jour" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui</button>
    <button data-vue="mots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"/><path d="M8 7h7M8 11h5"/></svg>Mots</button>
    <button data-vue="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progrès</button>
  </div>
</nav>

<div id="seance" role="dialog" aria-modal="true" aria-label="Séance du jour">
  <div class="s-haut"><button id="s-quitter" aria-label="Quitter la séance">✕</button><div class="prog" aria-hidden="true"><i id="s-prog"></i></div></div>
  <div class="s-corps" id="s-corps"></div>
</div>

<div id="modale" role="dialog" aria-modal="true" aria-label="Fiche du mot"><div class="carte"><button class="fermer" aria-label="Fermer"></button><div id="m-corps"></div></div></div>
<input type="file" id="f-import" accept="application/json,.json" class="sr" aria-hidden="true" tabindex="-1">
<div class="sr" aria-live="polite" id="annonce"></div>

<script>
/* ============================================================
   DONNÉES — listes de mots
   Les trois premières listes sont injectées entre deux marqueurs en commentaire
   (mots:<id> … fin) depuis outils/vocab/listes/<id>.json par outils/vocab/integrer.py.
   Chaque mot : w (entrée), pos, ipa, reg (registre), fr (sens en français),
   def (définition anglaise), col (collocations), ex (exemples, [[mot]] surligné),
   piege, fam (famille), trous (phrases à compléter : s avec ___, a = réponse,
   alt = autres réponses acceptées, fr = traduction), ecris (sujet de la phrase
   personnelle), formes (formes acceptées dans la phrase personnelle).
   Exemples et phrases : rédigés pour le site (pas de citation d'œuvre).
   ============================================================ */
var LISTES = [
{ id: "soutenu", titre: "Mots soutenus du quotidien", sous: "Des mots riches mais pratiques partout : à l'oral, à l'écrit, en lisant.", dispo: true, mots: /*mots:soutenu*/[]/*fin*/ },

{ id: "emotions", titre: "Les gens et les émotions", sous: "Caractère, attitudes, sentiments : pour parler d'une personne, d'un personnage, de soi.", dispo: true, mots: /*mots:emotions*/[]/*fin*/ },

   boîte 0 = jamais vu ; une bonne réponse fait monter d'une boîte,
   une erreur renvoie en boîte 1. Intervalles en jours.

var INTERVALLES = [0, 1, 3, 7, 14, 30];
var MAITRISE = 4;   /* boîte à partir de laquelle un mot compte comme acquis */

/* ============================================================
   PROGRESSION — enregistrée toute seule sur l'appareil
   (localStorage, clé « wordsmith » ; exception à la règle du projet
   accordée pour cette appli, 27/11/2026). L'export / import d'un
   fichier JSON reste possible pour changer d'appareil.
   ============================================================ */
var CLE = "wordsmith";
var Stockage = {
  lire: function () {
    try { var t = localStorage.getItem(CLE); return t ? Stockage.valider(JSON.parse(t)) : null; }
    catch (e) { return null; }
  },
  ecrire: function (etat) {
    try { localStorage.setItem(CLE, JSON.stringify(etat)); return true; }
    catch (e) { return false; }
  },
  valider: function (e) {
    if (!e || e.app !== "wordsmith" || typeof e.mots !== "object") throw new Error("format");
    e.jours = e.jours || {}; e.off = e.off || {}; e.parJour = e.parJour || 5;
    return e;
  },
  exporter: function (etat) {
    var blob = new Blob([JSON.stringify(etat, null, 1)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "wordsmith-progression-" + dateISO(new Date()) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
};
if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }

var params = new URLSearchParams(location.search);
var DECALAGE = parseInt(params.get("decalage") || "0", 10) || 0;   /* pour tester : ?decalage=3 avance de 3 jours */
function dateISO(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function jourNum(d) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
function aujourdhui() { return jourNum(new Date()) + DECALAGE; }

function etatNeuf() { return { app: "wordsmith", v: 2, parJour: 5, mots: {}, jours: {}, off: {} }; }
var etat = Stockage.lire() || etatNeuf();
var stockageOk = true;
function enregistrer() { stockageOk = Stockage.ecrire(etat); }

var ACTIVES = LISTES.filter(function (l) { return l.dispo; });
var MOTS = []; ACTIVES.forEach(function (l) { l.mots.forEach(function (m) { m.liste = l.id; MOTS.push(m); }); });
var PAR_ID = {}; MOTS.forEach(function (m) { PAR_ID[m.id] = m; });
var LISTE_DE = {}; LISTES.forEach(function (l) { LISTE_DE[l.id] = l; });
function suivi(id) { return etat.mots[id] || { b: 0, due: 0, ok: 0, ko: 0 }; }

/* Mots nouveaux du jour : pris à tour de rôle dans chaque liste active,
   dans l'ordre de chaque liste (les plus utiles d'abord). */
function nouveauxDuJour() {
  var d = aujourdhui(), deja = (etat.jours[d] && etat.jours[d].nv) || 0;
  var reste = Math.max(0, etat.parJour - deja), choisis = [];
  var pools = ACTIVES.filter(function (l) { return !etat.off[l.id]; })
    .map(function (l) { return l.mots.filter(function (m) { return !etat.mots[m.id]; }); });
  var tour = (etat.tour || 0);
  while (choisis.length < reste && pools.some(function (p) { return p.length; })) {
    var p = pools[tour % pools.length]; tour++;
    if (p.length) choisis.push(p.shift());
  }
  return choisis;
}
function revisionsDuJour() {
  var d = aujourdhui();
  return MOTS.filter(function (m) { var s = etat.mots[m.id]; return s && s.b > 0 && s.due <= d; });
}
function serie() {
  var d = aujourdhui(), n = 0;
  if (!(etat.jours[d] && etat.jours[d].fini)) d--;
  while (etat.jours[d] && etat.jours[d].fini) { n++; d--; }
  return n;
}

/* ---------- outils ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function surligne(s) { return s.replace(/\[\[(.+?)\]\]/g, "<mark>$1</mark>"); }
function norm(s) { return String(s).toLowerCase().replace(/[’‘]/g, "'").replace(/[‐-—]/g, "-").replace(/[.,;:!?"]/g, " ").replace(/\s+/g, " ").trim(); }
function distance(a, b) {
  var m = a.length, n = b.length, d = [], i, j;
  for (i = 0; i <= m; i++) { d[i] = [i]; }
  for (j = 0; j <= n; j++) { d[0][j] = j; }
  for (i = 1; i <= m; i++) for (j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function melange(t) { t = t.slice(); for (var i = t.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = t[i]; t[i] = t[j]; t[j] = x; } return t; }
function annonce(t) { var a = document.getElementById("annonce"); a.textContent = ""; setTimeout(function () { a.textContent = t; }, 30); }
function pluriel(n, s, p) { return n + " " + (n > 1 ? (p || s + "s") : s); }
var ICONE_SON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
function prononcer(t) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t.replace(/\bsb\b/g, "somebody").replace(/\bsth\b/g, "something"));
  u.lang = "en-GB"; u.rate = 0.92;
  var v = speechSynthesis.getVoices().filter(function (x) { return /^en-GB/i.test(x.lang); })[0];
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.getVoices();

/* ---------- fiche d'un mot : l'anglais d'abord, le français sur demande ---------- */
function ficheHTML(m) {
  var s = suivi(m.id);
  return '<div class="fiche">' +
    '<div class="tete"><div><p class="mot">' + esc(m.w) + '</p>' +
    '<span class="pos">' + esc(m.pos) + '</span> <span class="ipa">' + esc(m.ipa) + '</span><span class="reg">' + esc(m.reg) + '</span></div>' +
    '<button class="son" data-dire="' + esc(m.w) + '" aria-label="Écouter la prononciation">' + ICONE_SON + '</button></div>' +
    '<p class="sens en">' + esc(m.def) + '</p>' +
    '<details class="vf"><summary>Voir en français</summary><p>' + esc(m.fr) + '</p></details>' +
    '<div class="bloc"><h4>Goes with</h4><div class="colls">' + m.col.map(function (c) { return '<span>' + esc(c) + '</span>'; }).join("") + '</div></div>' +
    '<div class="bloc"><h4>In context</h4><ul class="ex">' + m.ex.map(function (e) { return '<li>' + surligne(e) + '</li>'; }).join("") + '</ul></div>' +
    '<div class="bloc piege">⚠ ' + m.piege + '</div>' +
    (m.fam && m.fam !== "—" ? '<div class="bloc famille"><h4>Word family</h4>' + esc(m.fam) + '</div>' : '') +
    (s.b > 0 ? '<p class="petit muted bloc">Boîte ' + s.b + ' sur 5 · ' + pluriel(s.ok, "bonne réponse", "bonnes réponses") + ', ' + pluriel(s.ko, "erreur") + '</p>' : '') +
    '</div>';
}
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-dire]");
  if (b) prononcer(b.getAttribute("data-dire"));
});

/* ---------- vues ---------- */
function rendreJour() {
  var nv = nouveauxDuJour(), rv = revisionsDuJour(), d = aujourdhui();
  var fini = etat.jours[d] && etat.jours[d].fini && !nv.length && !rv.length;
  var acquis = MOTS.filter(function (m) { return suivi(m.id).b >= MAITRISE; }).length;
  var vus = MOTS.filter(function (m) { return etat.mots[m.id]; }).length;
  var dateTxt = new Date(Date.now() + DECALAGE * 864e5).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  var restants = MOTS.length - vus, s = serie();
  var minutes = Math.max(2, Math.round(nv.length * 2 + rv.length * 0.6));
  var h = '<div class="carte jour">' +
    '<div class="date">' + esc(dateTxt) + '</div>' +
    '<h1 id="t-jour">' + (fini ? "Séance du jour terminée" : "Ta séance du jour") + '</h1>' +
    (fini ? '<div class="fait">✓ Tout est fait pour aujourd\'hui. Reviens demain : tes mots reviendront juste avant que tu les oublies.</div>' : '') +
    '<div class="compteurs">' +
    '<div><b>' + nv.length + '</b><span>nouveaux</span></div>' +
    '<div><b>' + rv.length + '</b><span>à revoir</span></div>' +
    '<div><b>' + s + '</b><span>' + (s > 1 ? "jours" : "jour") + ' d\'affilée</span></div></div>' +
    (nv.length || rv.length ? '<button class="btn large" id="go">Commencer · environ ' + minutes + ' min</button>' +
      '<p class="petit muted" style="margin:10px 0 0">' + (nv.length ? 'D\'abord tes ' + pluriel(nv.length, "mot nouveau", "mots nouveaux") : '') + (nv.length && rv.length ? ', ensuite ' : (rv.length ? 'Les ' : '')) + (rv.length ? pluriel(rv.length, "révision") + ' des jours précédents' : '') + '.</p>'
      : (!restants ? '<p class="muted">Tous les mots ont été vus : continue les révisions chaque jour.</p>' : '')) +
    (!stockageOk ? '<div class="alerte" role="status"><span>Ce navigateur refuse l\'enregistrement (navigation privée ?) : ta progression sera perdue à la fermeture.</span></div>' : '') +
    '</div>' +
    '<div class="carte reglage"><label id="l-rythme">Mots nouveaux par jour</label><div class="seg" role="group" aria-labelledby="l-rythme">' +
    [3, 5, 8].map(function (n) { return '<button data-par="' + n + '" aria-pressed="' + (etat.parJour === n) + '">' + n + '</button>'; }).join("") +
    '</div><p class="petit muted" style="margin:8px 0 0">' + pluriel(acquis, "mot acquis", "mots acquis") + ' · ' + vus + ' vus sur ' + MOTS.length + '. Avec 5 mots par jour, compte 10 à 15 minutes, révisions comprises.</p></div>' +
    '<div class="carte" style="margin-top:16px"><h2 style="margin-top:0">Comment ça marche</h2><ol class="methode">' +
    '<li><b>Découvrir</b> : la définition en anglais, les mots qui vont avec, deux exemples, le piège. Le français reste caché : touche « Voir en français » si besoin.</li>' +
    '<li><b>Comprendre</b> : retrouver le bon sens du mot dans une phrase.</li>' +
    '<li><b>Retrouver</b> : écrire le mot dans une phrase à trous. Le produire soi-même fixe bien mieux que le reconnaître.</li>' +
    '<li><b>Revoir</b> : après les mots du jour, les anciens reviennent après 1, 3, 7, 14 puis 30 jours. Une erreur fait revenir le mot le lendemain.</li>' +
    '<li><b>L\'employer</b> : au bout de quelques révisions, tu écris ta propre phrase.</li></ol>' +
    '<p class="petit muted" style="margin:0">Ta progression s\'enregistre toute seule sur ce téléphone.</p></div>';
  document.getElementById("v-jour").innerHTML = h;
  var go = document.getElementById("go"); if (go) go.onclick = demarrer;
  document.querySelectorAll("[data-par]").forEach(function (b) {
    b.onclick = function () { etat.parJour = +b.getAttribute("data-par"); enregistrer(); rendreJour(); };
  });
}

var filtre = "";
function rendreMots() {
  var v = document.getElementById("v-mots");
  if (!v.querySelector("#filtre")) {
    v.innerHTML = '<h2 id="t-mots" style="margin-top:6px">Les listes</h2>' +
      '<label class="sr" for="filtre">Chercher un mot</label><input id="filtre" class="filtre" type="search" placeholder="Chercher un mot (anglais ou français)…" autocomplete="off" autocapitalize="off" spellcheck="false">' +
      '<div id="listes"></div><p class="petit muted">Touche un mot pour ouvrir sa fiche. Les pastilles montrent sa boîte de révision (5 = acquis pour longtemps). Une liste mise en pause ne donne plus de mots nouveaux ; ses mots déjà vus continuent d\'être révisés.</p>';
    var f = v.querySelector("#filtre");
    f.value = filtre;
    f.addEventListener("input", function () { filtre = f.value; rendreListes(); });
  }
  rendreListes();
}
function rendreListes() {
  var q = norm(filtre), h = "";
  LISTES.forEach(function (l) {
    if (!l.dispo) return;
    var mots = q ? l.mots.filter(function (m) { return norm(m.w + " " + m.fr + " " + m.def).indexOf(q) >= 0; }) : l.mots;
    if (q && !mots.length) return;
    var vus = l.mots.filter(function (m) { return etat.mots[m.id]; }).length, off = !!etat.off[l.id];
    h += '<details class="carte liste"' + (q ? ' open' : '') + '><summary><div class="liste-t"><b>' + esc(l.titre) + '</b><small>' + vus + ' / ' + l.mots.length + ' vus</small></div>' +
      '<p class="petit muted" style="margin:4px 0 0">' + esc(l.sous) + '</p></summary>' +
      '<label class="actif"><input type="checkbox" data-liste="' + l.id + '"' + (off ? '' : ' checked') + '> Mots nouveaux de cette liste dans mes séances</label>' +
      '<ul class="mots">' +
      mots.map(function (m) {
        var b = suivi(m.id).b, p = "";
        for (var i = 1; i <= 5; i++) p += '<i class="' + (i <= b ? "on" : "") + '"></i>';
        return '<li><button class="mot-li" data-mot="' + m.id + '"><span class="pastilles" aria-label="boîte ' + b + ' sur 5">' + p + '</span><b>' + esc(m.w) + '</b><span class="fr">' + esc(m.fr.split(",")[0].replace(/^1\. /, "")) + '</span></button></li>';
      }).join("") + '</ul></details>';
  });
  if (!h) h = '<p class="muted">Aucun mot ne correspond.</p>';
  document.getElementById("listes").innerHTML = h;
  document.querySelectorAll("[data-mot]").forEach(function (b) { b.onclick = function () { ouvrirFiche(b.getAttribute("data-mot")); }; });
  document.querySelectorAll("[data-liste]").forEach(function (c) {
    c.onchange = function () { var id = c.getAttribute("data-liste"); if (c.checked) delete etat.off[id]; else etat.off[id] = true; enregistrer(); };
  });
}

function rendreProgres() {
  var compte = [0, 0, 0, 0, 0, 0];
  MOTS.forEach(function (m) { compte[suivi(m.id).b]++; });
  var max = Math.max.apply(null, compte.concat([1]));
  var noms = ["pas vus", "boîte 1<br>1 j", "boîte 2<br>3 j", "boîte 3<br>7 j", "boîte 4<br>14 j", "boîte 5<br>30 j"];
  var tot = 0, ok = 0;
  MOTS.forEach(function (m) { var s = suivi(m.id); tot += s.ok + s.ko; ok += s.ok; });
  var parListe = LISTES.filter(function (l) { return l.dispo; }).map(function (l) {
    var a = l.mots.filter(function (m) { return suivi(m.id).b >= MAITRISE; }).length;
    return '<li><span>' + esc(l.titre) + '</span><b>' + a + ' / ' + l.mots.length + '</b></li>';
  }).join("");
  var h = '<h2 id="t-progres" style="margin-top:6px">Tes progrès</h2><div class="carte">' +
    '<div class="boites" role="img" aria-label="Répartition des mots par boîte">' +
    compte.map(function (c) { return '<div class="boite"><b>' + c + '</b><div class="barre" style="height:' + Math.round(c / max * 110) + 'px"></div></div>'; }).join("") +
    '</div><div class="boites-l">' + noms.map(function (n) { return '<span>' + n + '</span>'; }).join("") + '</div>' +
    '<p class="petit muted" style="margin:12px 0 0">' + (tot ? Math.round(ok / tot * 100) + ' % de bonnes réponses sur ' + tot + ' exercices. ' : '') + 'Un mot est acquis à partir de la boîte 4.</p></div>' +
    '<h2>Mots acquis par liste</h2><div class="carte"><ul class="par-liste">' + parListe + '</ul></div>' +
    '<h2>Changer de téléphone</h2><div class="carte"><p style="margin-top:0">Ta progression s\'enregistre toute seule sur cet appareil. Pour la retrouver sur un autre, exporte-la ici puis importe le fichier là-bas.</p>' +
    '<div class="actions"><button class="btn sec" id="exporter">Exporter ma progression</button><button class="btn sec" id="charger">Importer un fichier</button></div>' +
    '<p class="petit muted" id="msg-imp" style="margin:10px 0 0" aria-live="polite"></p></div>';
  document.getElementById("v-progres").innerHTML = h;
  document.getElementById("exporter").onclick = function () { Stockage.exporter(etat); annonce("Progression exportée."); };
  document.getElementById("charger").onclick = function () { document.getElementById("f-import").click(); };
}

document.getElementById("f-import").addEventListener("change", function (e) {
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    var m = document.getElementById("msg-imp");
    try {
      var nouv = Stockage.valider(JSON.parse(r.result));
      if (Object.keys(etat.mots).length && !confirm("Remplacer la progression de cet appareil par celle du fichier ?")) { e.target.value = ""; return; }
      etat = nouv; enregistrer(); rendreTout(); montrer("jour"); annonce("Progression importée.");
    } catch (err) { if (m) m.textContent = "Ce fichier n'est pas une progression Wordsmith."; }
    e.target.value = "";
  };
  r.readAsText(f);
});

function rendreTout() { rendreJour(); rendreMots(); rendreProgres(); }
function montrer(v) {
  document.querySelectorAll(".vue").forEach(function (s) { s.classList.toggle("on", s.id === "v-" + v); });
  document.querySelectorAll("nav.bas button").forEach(function (b) {
    if (b.getAttribute("data-vue") === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  if (v === "jour") rendreJour(); else if (v === "mots") rendreMots(); else rendreProgres();
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav.bas button").forEach(function (b) { b.onclick = function () { montrer(b.getAttribute("data-vue")); }; });

/* ---------- fiche en feuille du bas ---------- */
var modale = document.getElementById("modale");
function ouvrirFiche(id) {
  document.getElementById("m-corps").innerHTML = ficheHTML(PAR_ID[id]);
  modale.classList.add("on");
  document.body.classList.add("sans-ia");
  history.pushState({ fiche: 1 }, "");
  modale.querySelector(".fermer").focus();
}
function fermerFiche(retour) { if (!modale.classList.contains("on")) return; modale.classList.remove("on"); document.body.classList.remove("sans-ia"); if (!retour) history.back(); }
modale.addEventListener("click", function (e) { if (e.target === modale || e.target.classList.contains("fermer")) fermerFiche(); });

/* ============================================================
   SÉANCE
   1. les mots nouveaux : découverte, puis « quel sens ? » (QCM),
      puis phrase à trous à écrire ;
   2. les révisions des jours précédents (phrase à trous, ou phrase
      personnelle à partir de la boîte 3) ;
   une erreur fait revenir le mot une fois, à la fin de sa partie ;
   3. bilan.
   ============================================================ */
var S = null;
var seanceEl = document.getElementById("seance"), corps = document.getElementById("s-corps");

function typeRevision(m) {
  var s = suivi(m.id);
  if (s.b >= 3 && s.ok % 2 === 1) return "phrase";
  if (s.b === 1 && s.ko > 0 && Math.random() < 0.5) return "sens";
  return "trou";
}
function demarrer() {
  var nv = nouveauxDuJour(), rv = revisionsDuJour();
  var aSens = melange(nv).map(function (m) { return { id: m.id, type: "sens", nouveau: true }; });
  var aTrou = melange(nv).map(function (m) { return { id: m.id, type: "trou", k: 0, nouveau: true }; });
  var rev = melange(rv).map(function (m) { var t = typeRevision(m); return { id: m.id, type: t, k: Math.floor(Math.random() * m.trous.length), nouveau: false }; });
  S = { decouvrir: nv.map(function (m) { return m.id; }), i: 0, phase: nv.length ? "decouvrir" : "exo",
        file: aSens.concat(aTrou, rev), finNouveaux: aSens.length + aTrou.length, j: 0, reprises: {}, bons: 0, total: 0, rates: [], transition: !!(nv.length && rv.length) };
  seanceEl.classList.add("on");
  document.body.classList.add("sans-ia");
  document.body.style.overflow = "hidden";
  history.pushState({ seance: 1 }, "");
  etape();
}
function progres() {
  var fait = (S.phase === "decouvrir" ? S.i : S.decouvrir.length + S.j);
  var tot = S.decouvrir.length + S.file.length;
  document.getElementById("s-prog").style.width = Math.min(100, Math.round(fait / Math.max(1, tot) * 100)) + "%";
}
function etape() {
  progres();
  if (S) document.body.classList.add("sans-ia");
  seanceEl.scrollTop = 0;
  if (S.phase === "decouvrir") {
    if (S.i >= S.decouvrir.length) { S.phase = "exo"; return etape(); }
    var m = PAR_ID[S.decouvrir[S.i]];
    corps.innerHTML = '<div class="etape">Mot nouveau ' + (S.i + 1) + ' / ' + S.decouvrir.length + '</div>' +
      '<div class="carte">' + ficheHTML(m) + '</div>' +
      '<div class="ligne-btn" style="margin-top:14px"><button class="btn large" id="suite">' + (S.i + 1 < S.decouvrir.length ? "Mot suivant" : "Passer aux exercices") + '</button></div>';
    document.getElementById("suite").onclick = function () { S.i++; etape(); };
    document.getElementById("suite").focus({ preventScroll: true });
    return;
  }
  if (S.j >= S.file.length) return bilan();
  if (S.transition && S.j === S.finNouveaux) {
    S.transition = false;
    var n = S.file.length - S.finNouveaux;
    corps.innerHTML = '<div class="bilan"><div class="etape">Mots du jour terminés</div><div class="grand">✓</div>' +
      '<p>Place aux révisions : ' + pluriel(n, "exercice") + ' sur les mots des jours précédents.</p>' +
      '<div class="actions" style="margin-top:18px"><button class="btn large" id="suite">Commencer les révisions</button></div></div>';
    document.getElementById("suite").onclick = etape;
    document.getElementById("suite").focus({ preventScroll: true });
    return;
  }
  var it = S.file[S.j];
  if (it.type === "phrase") exoPhrase(it); else if (it.type === "sens") exoSens(it); else exoTrou(it);
}
function entete(it, nom) {
  var dansNv = S.j < S.finNouveaux;
  var pos = dansNv ? (S.j + 1) + ' / ' + S.finNouveaux : (S.j - S.finNouveaux + 1) + ' / ' + (S.file.length - S.finNouveaux);
  return '<div class="etape">' + (it.reprise ? "Encore une fois" : (dansNv ? "Mots du jour" : "Révisions")) + ' · ' + nom + ' · ' + pos + '</div>';
}

/* Comprendre : quel est le sens du mot dans cette phrase ? */
function exoSens(it) {
  var m = PAR_ID[it.id];
  var autres = melange((LISTE_DE[m.liste].mots.length > 4 ? LISTE_DE[m.liste].mots : MOTS).filter(function (x) { return x.id !== m.id && x.def !== m.def; })).slice(0, 3);
  var choix = melange([m].concat(autres));
  var ex = m.ex[Math.floor(Math.random() * m.ex.length)];
  corps.innerHTML = entete(it, "comprendre") +
    '<p class="consigne">Que veut dire <b>' + esc(m.w) + '</b> dans cette phrase ?</p>' +
    '<p class="phrase">' + surligne(ex) + '</p>' +
    '<div class="qcm" role="group" aria-label="Choisis le sens">' + choix.map(function (c) { return '<button class="opt" data-c="' + c.id + '">' + esc(c.def) + '</button>'; }).join("") + '</div>' +
    '<div id="retour"></div><div class="ligne-btn" id="btns"></div>';
  corps.querySelectorAll(".opt").forEach(function (b) {
    b.onclick = function () {
      var bon = b.getAttribute("data-c") === m.id;
      corps.querySelectorAll(".opt").forEach(function (o) { o.disabled = true; if (o.getAttribute("data-c") === m.id) o.classList.add("juste"); });
      if (!bon) b.classList.add("faux");
      document.getElementById("retour").innerHTML = '<div class="retour ' + (bon ? 'ok' : 'ko') + '" role="status"><b class="titre">' + (bon ? '✓ Exact' : 'Pas tout à fait') + '</b>' +
        '<p><b>' + esc(m.w) + '</b> : ' + esc(m.def) + '</p><details class="vf"><summary>Voir en français</summary><p>' + esc(m.fr) + '</p></details></div>';
      annonce(bon ? "Exact." : "Pas tout à fait.");
      noter(it, bon);
      document.getElementById("btns").innerHTML = '<button class="btn large" id="cont">Continuer</button>';
      document.getElementById("cont").onclick = suivant;
      document.getElementById("cont").focus({ preventScroll: true });
    };
  });
}

/* Retrouver : écrire le mot qui manque */
function exoTrou(it) {
  var m = PAR_ID[it.id], t = m.trous[it.k];
  var largeur = Math.max(t.a.length, 5) + 1;
  var phrase = esc(t.s).replace("___", '<input id="rep" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Mot manquant" style="width:' + largeur + 'ch">');
  corps.innerHTML = entete(it, "écrire") +
    '<p class="consigne">Écris le mot qui manque, à la bonne forme.</p>' +
    '<div class="indice"><span class="en">' + esc(m.def) + '</span>' +
    '<details class="vf"><summary>Indice en français</summary><p><b>' + esc(m.fr) + '</b><br><span class="fr-ph">' + esc(t.fr) + '</span></p></details></div>' +
    '<p class="phrase">' + phrase + '</p>' +
    '<button class="lien" id="lettre">Voir la première lettre</button>' +
    '<div id="retour"></div>' +
    '<div class="ligne-btn" id="btns"><button class="btn large" id="valider">Vérifier</button></div>';
  var rep = document.getElementById("rep");
  setTimeout(function () { rep.focus({ preventScroll: true }); }, 60);
  document.getElementById("lettre").onclick = function () { rep.placeholder = t.a.charAt(0) + "…"; rep.focus(); this.remove(); };
  rep.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); verifier(); } });
  document.getElementById("valider").onclick = verifier;
  function verifier() {
    var v = norm(rep.value);
    if (!v) { rep.focus(); return; }
    var bonnes = [t.a].concat(t.alt || []).map(norm);
    var juste = bonnes.indexOf(v) >= 0;
    var presque = !juste && t.a.length > 4 && distance(v, norm(t.a)) === 1;
    rep.readOnly = true;
    var complet = surligne(t.s.replace("___", "[[" + t.a + "]]"));
    var r = document.getElementById("retour");
    var rappel = (norm(t.a) === norm(m.w) ? '' : esc(m.w) + ' · ') + esc(m.fr);
    if (juste) {
      r.innerHTML = '<div class="retour ok" role="status"><b class="titre">✓ Exact</b><p class="phrase-ok">' + complet + '</p></div>';
      annonce("Exact.");
      noter(it, true); continuer();
    } else {
      r.innerHTML = '<div class="retour ' + (presque ? 'presque' : 'ko') + '" role="status"><b class="titre">' + (presque ? 'Presque : vérifie l\'orthographe' : 'Pas tout à fait') + '</b>' +
        '<p>' + (presque ? 'Tu as écrit « ' + esc(rep.value) + ' ». ' : '') + 'La réponse : <b>' + esc(t.a) + '</b> (' + rappel + ')</p>' +
        '<p class="phrase-ok">' + complet + '</p>' + (presque ? '' : '<p class="petit">⚠ ' + m.piege + '</p>') + '</div>';
      annonce((presque ? "Presque. " : "Pas tout à fait. ") + "La réponse est " + t.a);
      document.getElementById("btns").innerHTML = '<button class="btn sec" id="jav">J\'avais bon</button><button class="btn" id="cont">Continuer</button>';
      document.getElementById("jav").onclick = function () { noter(it, true); suivant(); };
      document.getElementById("cont").onclick = function () { noter(it, false); suivant(); };
      document.getElementById("cont").focus({ preventScroll: true });
    }
  }
  function continuer() {
    document.getElementById("btns").innerHTML = '<button class="btn large" id="cont">Continuer</button>';
    document.getElementById("cont").onclick = suivant;
    document.getElementById("cont").focus({ preventScroll: true });
  }
}

/* L'employer : écrire sa propre phrase */
function exoPhrase(it) {
  var m = PAR_ID[it.id];
  corps.innerHTML = entete(it, "employer") +
    '<p class="consigne">Écris ta propre phrase avec <b>' + esc(m.w) + '</b>.</p>' +
    '<div class="indice"><span class="en">' + esc(m.def) + '</span><br>Idée : ' + esc(m.ecris) + '.<br><span class="muted petit">Goes with: ' + esc(m.col.slice(0, 3).join(" · ")) + '</span></div>' +
    '<label class="sr" for="ta">Ta phrase</label><textarea id="ta" autocapitalize="sentences" spellcheck="true" placeholder="Ta phrase en anglais…"></textarea>' +
    '<div id="retour"></div><div class="ligne-btn" id="btns"><button class="btn large" id="valider">Comparer</button></div>';
  var ta = document.getElementById("ta");
  setTimeout(function () { ta.focus({ preventScroll: true }); }, 60);
  document.getElementById("valider").onclick = function () {
    var v = norm(ta.value);
    if (v.split(" ").length < 4) { ta.focus(); return; }
    var present = m.formes.some(function (f) { return (" " + v + " ").indexOf(" " + norm(f) + " ") >= 0; });
    ta.readOnly = true;
    document.body.classList.remove("sans-ia");
    document.getElementById("retour").innerHTML = '<div class="retour ' + (present ? 'presque' : 'ko') + '" role="status">' +
      (present ? '<b class="titre">Relis-toi avec ces trois questions</b>' : '<b class="titre">Le mot n\'apparaît pas dans ta phrase</b><p>Formes attendues : ' + esc(m.formes.join(", ")) + '.</p>') +
      '<p>1. Le sens est-il bien « ' + esc(m.def) + ' » ?<br>2. La construction est-elle juste (' + esc(m.col[0]) + '…) ?<br>3. Le piège est-il évité ?</p>' +
      '<p class="phrase-ok">Exemple : ' + surligne(m.ex[1] || m.ex[0]) + '</p>' +
      '<p class="petit muted">Un doute ? Le bouton rond « Demander à une IA », en bas, peut corriger ta phrase.</p></div>';
    document.getElementById("btns").innerHTML = '<button class="btn sec" id="non">À revoir</button><button class="btn" id="oui">Ma phrase est juste</button>';
    document.getElementById("oui").onclick = function () { noter(it, present); suivant(); };
    document.getElementById("non").onclick = function () { noter(it, false); suivant(); };
  };
}

/* Résultat d'un exercice. Le QCM de compréhension d'un mot nouveau ne
   change pas sa boîte : c'est la phrase à trous qui décide. */
function noter(it, bon) {
  var m = PAR_ID[it.id], d = aujourdhui();
  var s = etat.mots[it.id] || { b: 0, due: 0, ok: 0, ko: 0 };
  var j = etat.jours[d] || (etat.jours[d] = { nv: 0, rv: 0 });
  S.total++; if (bon) S.bons++;
  var compte = !it.reprise && !(it.nouveau && it.type === "sens");
  if (compte) {
    if (it.nouveau) { j.nv++; etat.tour = (etat.tour || 0) + 1; } else j.rv++;
    if (bon) { s.ok++; s.b = Math.min(5, s.b + 1); s.due = d + INTERVALLES[s.b]; }
    else { s.ko++; s.b = 1; s.due = d + 1; if (S.rates.indexOf(m.w) < 0) S.rates.push(m.w); }
  }
  etat.mots[it.id] = s;
  if (!bon && !S.reprises[it.id + it.type]) {
    S.reprises[it.id + it.type] = 1;
    var r = { id: it.id, type: it.type === "phrase" ? "trou" : it.type, k: ((it.k || 0) + 1) % m.trous.length, nouveau: it.nouveau, reprise: true };
    if (S.j < S.finNouveaux) { S.file.splice(S.finNouveaux, 0, r); S.finNouveaux++; }
    else S.file.push(r);
  }
  enregistrer();
}
function suivant() { S.j++; etape(); }

function bilan() {
  var d = aujourdhui();
  (etat.jours[d] || (etat.jours[d] = { nv: 0, rv: 0 })).fini = true;
  enregistrer();
  document.getElementById("s-prog").style.width = "100%";
  var taux = S.total ? Math.round(S.bons / S.total * 100) : 100;
  corps.innerHTML = '<div class="bilan"><div class="etape">Séance terminée</div><div class="grand">' + taux + ' %</div>' +
    '<p>de bonnes réponses · ' + pluriel(S.decouvrir.length, "mot nouveau", "mots nouveaux") + ' · série de ' + pluriel(serie(), "jour") + '</p>' +
    (S.rates.length ? '<div class="carte" style="text-align:left"><b>Ils reviendront demain :</b><ul>' + S.rates.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join("") + '</ul></div>' : '') +
    '<div class="actions" style="margin-top:18px"><button class="btn large" id="b-fin">Terminer</button></div>' +
    '<p class="petit muted">Ta progression est enregistrée sur ce téléphone.</p></div>';
  document.getElementById("b-fin").onclick = function () { quitter(); };
  document.getElementById("b-fin").focus({ preventScroll: true });
}
function quitter(retour) {
  if (!S) return;
  S = null;
  seanceEl.classList.remove("on");
  document.body.classList.remove("sans-ia");
  document.body.style.overflow = "";
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (!retour) history.back();
  rendreTout();
}
document.getElementById("s-quitter").onclick = function () {
  if (S && S.phase === "exo" && S.j < S.file.length && !confirm("Quitter la séance ? Les réponses déjà données sont enregistrées.")) return;
  quitter();
};
window.addEventListener("popstate", function () {
  if (modale.classList.contains("on")) fermerFiche(true);
  else if (S) quitter(true);
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { if (modale.classList.contains("on")) fermerFiche(); }
});

rendreTout();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
