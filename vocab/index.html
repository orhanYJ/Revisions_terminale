<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordsmith — Vocabulaire anglais Terminale</title>
<meta name="description" content="Le vocabulaire anglais qui sert à l'essay et à l'oral : cinq mots par jour, révisions espacées, exercices où l'on produit le mot.">
<meta name="theme-color" content="#3b2257">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocab">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --papier:#f7f3ec; --carte:#fffdf9; --encre:#22172e; --encre2:#6b5f78; --ligne:#e4dcd0;
  --prune:#3b2257; --prune2:#5a3a80; --safran:#e3a03a; --safran-l:#fbe7c4;
  --ok:#1f7a4d; --ok-l:#dff2e7; --ko:#b23a3a; --ko-l:#f8e1df;
  --ombre:0 1px 2px rgba(34,23,46,.06),0 6px 18px rgba(34,23,46,.07);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --papier:#16111d; --carte:#211a2b; --encre:#f1eaf7; --encre2:#a99cb8; --ligne:#352b42;
    --prune:#c9a8f0; --prune2:#b28fe0; --safran:#f0b453; --safran-l:#4a3618;
    --ok:#5fcf93; --ok-l:#173527; --ko:#f08a80; --ko-l:#3d1d1c;
    --ombre:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papier);color:var(--encre);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--prune2)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.haut{padding:18px 0 6px}
.marque{display:flex;align-items:center;gap:10px}
.marque svg{width:34px;height:34px;flex:none}
.marque b{font:700 1.45rem/1 var(--serif);letter-spacing:.01em;color:var(--prune)}
.marque span{display:block;font-size:.78rem;color:var(--encre2);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
h1,h2,h3{font-family:var(--serif);line-height:1.2}
h2{font-size:1.25rem;margin:22px 0 10px;color:var(--prune)}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:16px;box-shadow:var(--ombre);padding:18px}
.muted{color:var(--encre2)}
.petit{font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font-weight:600;background:var(--prune);color:#fff;min-height:48px}
@media (prefers-color-scheme:dark){.btn{color:#16111d}}
.btn.large{width:100%;font-size:1.05rem}
.btn.sec{background:transparent;color:var(--prune);border:1.5px solid var(--prune)}
.btn.safran{background:var(--safran);color:#2a1a05}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.seg button:focus-visible,nav.bas button:focus-visible,.mot-li:focus-visible{outline:3px solid var(--safran);outline-offset:2px}

/* Aujourd'hui */
.jour{position:relative;overflow:hidden}
.jour .date{font-size:.82rem;color:var(--encre2);text-transform:capitalize}
.jour h1{font-size:1.6rem;margin:4px 0 14px}
.compteurs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.compteurs div{background:var(--papier);border:1px solid var(--ligne);border-radius:12px;padding:10px 8px;text-align:center}
.compteurs b{display:block;font:700 1.6rem/1.1 var(--serif);color:var(--prune)}
.compteurs span{font-size:.76rem;color:var(--encre2)}
.fait{background:var(--ok-l);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:12px}
.alerte{display:flex;gap:10px;align-items:flex-start;background:var(--safran-l);border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:.92rem}
.alerte button{margin-left:auto;flex:none;border:0;background:var(--safran);color:#2a1a05;border-radius:9px;padding:7px 11px;font-weight:600;font-size:.85rem}
.seg{display:flex;background:var(--papier);border:1px solid var(--ligne);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--encre2);min-height:42px}
.seg button[aria-pressed="true"]{background:var(--carte);color:var(--prune);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.reglage{margin-top:16px}
.reglage label{display:block;font-size:.86rem;color:var(--encre2);margin-bottom:6px}
.methode li{margin:6px 0}

/* Listes de mots */
.liste-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.liste-t small{color:var(--encre2)}
.mots{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.mot-li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:11px 12px}
.mot-li b{font:600 1.05rem var(--serif)}
.mot-li .fr{color:var(--encre2);font-size:.88rem;margin-left:auto;text-align:right}
.pastilles{display:flex;gap:3px;flex:none}
.pastilles i{width:7px;height:7px;border-radius:50%;background:var(--ligne)}
.pastilles i.on{background:var(--safran)}
.bientot{opacity:.65}
.bientot .tag{font-size:.72rem;background:var(--papier);border:1px solid var(--ligne);border-radius:99px;padding:2px 8px;color:var(--encre2)}

/* Progrès */
.boites{display:flex;align-items:flex-end;gap:8px;height:150px;margin:16px 0 6px;padding:0 4px;border-bottom:1px solid var(--ligne)}
.boite{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.boite .barre{width:100%;background:var(--prune2);border-radius:8px 8px 0 0;min-height:3px;transform-origin:bottom}
.boite:first-child .barre{background:var(--ligne)}
.boite:nth-child(5) .barre,.boite:nth-child(6) .barre{background:var(--safran)}
.boite b{font:700 1rem var(--serif);margin-bottom:4px}
.boites-l{display:flex;gap:8px;padding:0 4px}
.boites-l span{flex:1;text-align:center;font-size:.7rem;color:var(--encre2);line-height:1.2}
.actions{display:grid;gap:8px;margin-top:12px}

/* Fiche d'un mot (dictionnaire) */
.fiche .tete{display:flex;align-items:flex-start;gap:10px}
.fiche .mot{font:700 2rem/1.1 var(--serif);color:var(--prune);margin:0;word-break:break-word}
.fiche .pos{font:italic .95rem var(--serif);color:var(--encre2)}
.fiche .ipa{font:.95rem var(--mono);color:var(--encre2)}
.son{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ligne);background:var(--papier);display:grid;place-items:center}
.son svg{width:20px;height:20px}
.reg{display:inline-block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ligne);border-radius:99px;padding:2px 8px;color:var(--encre2);margin-left:4px;vertical-align:middle}
.sens{font:600 1.15rem/1.35 var(--serif);margin:12px 0 4px}
.def{color:var(--encre2);margin:0 0 12px}
.bloc{margin-top:14px}
.bloc h4{margin:0 0 6px;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--encre2)}
.colls{display:flex;flex-wrap:wrap;gap:6px}
.colls span{background:var(--papier);border:1px solid var(--ligne);border-radius:99px;padding:4px 10px;font-size:.9rem}
.ex{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.ex li{font-family:var(--serif);font-size:1.04rem;border-left:3px solid var(--safran);padding:2px 0 2px 10px}
mark{background:linear-gradient(transparent 55%,var(--safran-l) 55%);color:inherit;font-weight:700;padding:0 1px}
.piege{background:var(--ko-l);border-radius:12px;padding:10px 12px;font-size:.93rem}
.piege b{color:var(--ko)}
.famille{font-size:.92rem}

/* Séance */
#seance{position:fixed;inset:0;background:var(--papier);z-index:50;display:none;flex-direction:column;overflow-y:auto}
#seance.on{display:flex}
.s-haut{position:sticky;top:0;background:var(--papier);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px;z-index:2}
.s-haut button{border:0;background:transparent;width:40px;height:40px;border-radius:50%;font-size:1.3rem;color:var(--encre2)}
.prog{flex:1;height:8px;background:var(--ligne);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--safran);border-radius:99px;transition:width .35s}
.s-corps{flex:1;width:100%;max-width:640px;margin:0 auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
body:not(.sans-ia) .s-corps{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.etape{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--encre2);margin:4px 0 10px}
.consigne{font-weight:600;margin:0 0 10px}
.phrase{font:1.25rem/1.75 var(--serif);margin:6px 0 14px}
.phrase input{font:inherit;font-weight:700;color:var(--prune);background:transparent;border:0;border-bottom:2.5px solid var(--prune2);padding:0 4px;min-width:4ch;text-align:center;border-radius:0}
.phrase input:focus{outline:0;border-bottom-color:var(--safran);background:var(--safran-l)}
.indice{background:var(--papier);border:1px dashed var(--ligne);border-radius:12px;padding:10px 12px;font-size:.95rem;margin-bottom:12px}
.indice .fr-ph{font-style:italic}
.ligne-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ligne-btn .btn{flex:1}
.lien{border:0;background:transparent;color:var(--prune2);text-decoration:underline;padding:6px 0;font-size:.92rem}
textarea{width:100%;min-height:110px;font:1.1rem/1.5 var(--serif);color:var(--encre);background:var(--carte);border:1.5px solid var(--ligne);border-radius:12px;padding:12px}
textarea:focus{outline:0;border-color:var(--prune2)}
.retour{border-radius:14px;padding:14px;margin:14px 0 4px}
.retour.ok{background:var(--ok-l)}
.retour.ok b.titre{color:var(--ok)}
.retour.ko{background:var(--ko-l)}
.retour.ko b.titre{color:var(--ko)}
.retour.presque{background:var(--safran-l)}
.retour p{margin:6px 0 0}
.retour .phrase-ok{font-family:var(--serif);font-size:1.05rem}
.bilan{text-align:center;padding-top:30px}
.bilan .grand{font:700 3rem/1 var(--serif);color:var(--prune)}
.bilan ul{text-align:left}

nav.bas{position:fixed;left:0;right:0;bottom:0;background:var(--carte);border-top:1px solid var(--ligne);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.bas div{display:flex;max-width:640px;width:100%}
nav.bas button{flex:1;border:0;background:transparent;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--encre2);min-height:58px}
nav.bas svg{width:23px;height:23px}
nav.bas button[aria-current="page"]{color:var(--prune)}
.vue{display:none}
.vue.on{display:block}
#modale{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(20,12,28,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#modale.on{display:flex}
#modale .carte{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#modale .fermer{display:block;margin:-6px auto 8px;width:44px;height:5px;border-radius:99px;background:var(--ligne);border:0;padding:0}
body.sans-ia .asr-btn{display:none!important}
.vf{margin:6px 0 4px}
.vf summary{cursor:pointer;color:var(--prune2);font-size:.9rem;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:6px 0;min-height:36px}
.vf summary::-webkit-details-marker{display:none}
.vf summary::before{content:"FR";font:700 .66rem var(--sans);letter-spacing:.04em;border:1.5px solid currentColor;border-radius:5px;padding:1px 4px}
.vf[open] summary{color:var(--encre2)}
.vf p{margin:2px 0 6px;font-weight:600}
.indice .en{font-weight:600}
.qcm{display:grid;gap:8px;margin:4px 0 6px}
.opt{text-align:left;border:1.5px solid var(--ligne);background:var(--carte);border-radius:12px;padding:12px 14px;font-size:.98rem;line-height:1.4;min-height:48px}
.opt:not(:disabled):hover{border-color:var(--prune2)}
.opt:focus-visible{outline:3px solid var(--safran);outline-offset:2px}
.opt.juste{border-color:var(--ok);background:var(--ok-l)}
.opt.faux{border-color:var(--ko);background:var(--ko-l)}
.opt:disabled{cursor:default;color:var(--encre)}
.filtre{width:100%;font:inherit;color:var(--encre);background:var(--carte);border:1.5px solid var(--ligne);border-radius:12px;padding:12px 14px;margin:0 0 4px}
.filtre:focus{outline:0;border-color:var(--prune2)}
details.liste{margin-top:10px}
details.liste>summary{cursor:pointer;list-style:none}
details.liste>summary::-webkit-details-marker{display:none}
details.liste>summary .liste-t b::after{content:" ▾";color:var(--encre2);font-size:.8em}
details.liste[open]>summary .liste-t b::after{content:" ▴"}
.actif{display:flex;gap:10px;align-items:center;font-size:.9rem;margin:12px 0 2px;color:var(--encre2)}
.actif input{width:20px;height:20px;accent-color:var(--prune)}
.par-liste{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.par-liste li{display:flex;justify-content:space-between;gap:10px}
.par-liste b{font-family:var(--serif)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Jeu : Blot, niveaux, chemin, badges ---------- */
.blot{display:inline-block;flex:none;line-height:0;cursor:default}
.blot-svg{width:100%;height:auto;overflow:visible}
.b-goutte{fill:#5a3a80}
.b-reflet{fill:rgba(255,255,255,.22)}
.b-ombre{fill:rgba(34,23,46,.13)}
.b-bras{fill:none;stroke:#4a2d6b;stroke-width:7;stroke-linecap:round}
.b-pied{fill:#3b2257}
.b-pup{fill:#1b1026}
.b-joue{fill:#e88fb5;opacity:.55}
.b-bouche{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.b-ouverte{fill:#2a0f3a}
.b-yeux-joie,.b-yeux-dort{fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round}
.b-yeux-joie,.b-yeux-dort,.b-ouverte,.b-moue,.b-zzz{display:none}
.blot.joie .b-yeux,.blot.dort .b-yeux{display:none}
.blot.joie .b-yeux-joie,.blot.dort .b-yeux-dort{display:inline}
.blot.joie .b-sourire,.blot.triste .b-sourire{display:none}
.blot.joie .b-ouverte,.blot.triste .b-moue{display:inline}
.blot.dort .b-zzz{display:inline}
.b-zzz text{font:700 13px var(--sans);fill:var(--prune2)}
.blot.triste .b-pup{transform:translateY(1.5px)}
@media (prefers-color-scheme:dark){.b-goutte{fill:#7a52aa}.b-pied{fill:#5a3a80}.b-bras{stroke:#6a46a0}.b-ombre{fill:rgba(0,0,0,.35)}}

.heros{display:flex;flex-direction:column;gap:12px}
.heros-haut{display:flex;align-items:center;gap:12px}
.heros .blot{cursor:pointer}
.bulle{position:relative;background:var(--papier);border:1.5px solid var(--ligne);border-radius:16px;padding:11px 13px;font-size:.95rem;line-height:1.4}
.bulle::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--ligne);border-left:0}
.bulle::after{content:"";position:absolute;left:-6px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:var(--papier);border-left:0}
.niv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.92rem}
.niv-t b{font-family:var(--serif);font-size:1.08rem;color:var(--prune)}
.niv-xp{color:var(--encre2);font-size:.82rem;white-space:nowrap}
.jauge{height:12px;background:var(--ligne);border-radius:99px;overflow:hidden}
.jauge i{display:block;height:100%;background:linear-gradient(90deg,var(--safran),#f2c46a);border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.puces{display:flex;gap:6px;flex-wrap:wrap}
.puce{background:var(--papier);border:1px solid var(--ligne);border-radius:99px;padding:4px 10px;font-size:.82rem;font-weight:600;color:var(--encre2)}
.puce.feu.on{color:#c2410c;border-color:#f6c08a;background:#fff3e6}
@media (prefers-color-scheme:dark){.puce.feu.on{color:#fdba74;border-color:#7c3f12;background:#3a2212}}
.jour{margin-top:14px}
.jour h1{font-size:1.35rem;margin:0 0 12px}
.comment{margin-top:16px}
.comment summary{cursor:pointer;list-style:none}
.comment summary::-webkit-details-marker{display:none}
.comment summary h2::after{content:" ▾";font-size:.8em;color:var(--encre2)}

.chemin{position:relative;margin:6px 0 10px}
.chemin-trace{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:visible}
.chemin-trace polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.t-fond{stroke:var(--ligne);stroke-width:10;stroke-dasharray:2 16}
.t-fait{stroke:var(--safran);stroke-width:10;stroke-dasharray:2 16}
.noeud{position:absolute;width:68px;height:68px}
.n-btn{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;border:0;padding:0;position:relative;color:#fff}
.n-btn svg{width:30px;height:30px}
.n-btn .ic-e{font-size:28px;line-height:1}
.noeud.n-fait .n-btn{background:var(--safran);box-shadow:0 6px 0 #c98a1e}
.noeud.courant .n-btn{background:var(--prune2);box-shadow:0 6px 0 var(--prune),0 0 0 6px rgba(138,92,196,.2);cursor:pointer}
.noeud.verrou .n-btn{background:var(--ligne);color:var(--encre2);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.noeud.palier.verrou .n-btn{background:#f3e3c3}
.noeud.palier.n-fait .n-btn{background:#f0b453}
.n-num{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:.7rem;color:var(--encre2);font-weight:600}
.bulle-go{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--carte);border:2px solid var(--prune2);color:var(--prune);font-weight:700;font-size:.8rem;padding:5px 10px;border-radius:10px;z-index:1}
.bulle-go::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--prune2)}
.bulle-go.demain{border-color:var(--ligne);color:var(--encre2)}
.bulle-go.demain::after{border-top-color:var(--ligne)}
.chemin-blot{position:absolute;width:80px}

.r-tete{display:flex;align-items:center;gap:10px}
.r-tete .blot{margin:-4px 0}
.combo{margin-left:4px;font-weight:800;color:#c2410c;font-size:.95rem;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;min-width:44px;text-align:right}
.combo.on{opacity:1;transform:none}
@media (prefers-color-scheme:dark){.combo{color:#fdba74}}
.gains{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.gain{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:12px 6px}
.gain b{display:block;font:700 1.5rem/1.1 var(--serif);color:var(--prune)}
.gain span{font-size:.74rem;color:var(--encre2)}
.bilan .niv{margin-top:6px;text-align:left}
.bilan .jauge{margin-top:6px}
.badges,.nouv-badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.nouv-badges{margin-top:14px}
.badge{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;opacity:.55}
.badge.on{opacity:1;border-color:#f0c77a}
.badge .b-ic{font-size:1.8rem;line-height:1.2}
.badge b{font-size:.9rem}

{"id":"s-arguably","w":"arguably","pos":"adverb","ipa":"/ˈɑːɡjuəbli/","reg":"courant","fr":"sans doute, on peut soutenir que","def":"Used when giving an opinion that you believe can be supported with good reasons.","col":["arguably the best","arguably the most important","is arguably","arguably more"],"ex":["This is [[arguably]] the best pizza I have ever eaten.","The Marshall Plan was [[arguably]] the most successful foreign policy of the twentieth century."],"piege":"Idéal à l'essay pour avancer un jugement avec prudence. Il <b>renforce</b> l'affirmation (« on peut soutenir que »), il ne marque pas le doute comme <i>perhaps</i>.","fam":"arguable (adj.) · argue (v.)","trous":[{"s":"Shakespeare is ___ the most influential writer in the English language.","a":"arguably","fr":"Shakespeare est sans doute l'écrivain le plus influent de la langue anglaise."},

{"id":"s-deter","w":"deter","pos":"verb","ipa":"/dɪˈtɜː/","reg":"formel","fr":"dissuader, décourager","def":"To make someone decide not to do something by making it difficult or frightening.","col":["deter crime","deter someone from doing","be deterred by","deter potential attackers"],"ex":["The heavy rain did not [[deter]] thousands of fans from attending the concert.","Nuclear weapons were supposed to [[deter]] either superpower from launching an attack."],"piege":"Construction : <i>deter someone <b>from</b> doing something</i>. Le nom <i>deterrent</i> (moyen de dissuasion) est très fréquent : <i>a nuclear deterrent</i>. Accent sur la dernière syllabe.","fam":"deterrent (n./adj.) · deterrence (n.)","trous":[{"s":"High fines are meant to ___ drivers from using their phones at the wheel.","a":"deter","alt":["discourage"],"fr":"Les fortes amendes sont censées dissuader les conducteurs d'utiliser leur téléphone au volant."},

{"id":"e-vain","w":"vain","pos":"adjective","ipa":"/veɪn/","reg":"courant","fr":"1. vaniteux, coquet · 2. vain, inutile","def":"Too proud of your appearance or abilities; also describes an effort that fails.","col":["vain about her looks","in vain","a vain attempt","shallow and vain"],"ex":["He's so [[vain]] that he checks his reflection in every shop window.","Diplomats tried in [[vain]] to prevent the outbreak of war in 1939."],"piege":"Deux sens : <b>vaniteux</b> (une personne) et <b>vain, inutile</b> (<i>a vain attempt</i>, <i>in vain</i> = en vain). Le nom de la qualité est <i>vanity</i> (et non <i>*vainness</i>).","fam":"vanity (n.) · vainly (adv.)","trous":[{"s":"Rescuers searched in ___ for survivors under the rubble.","a":"vain","fr":"Les secouristes cherchèrent en vain des survivants sous les décombres."},

{"id":"e-selfless","w":"selfless","pos":"adjective","ipa":"/ˈselfləs/","reg":"courant","fr":"désintéressé, altruiste","def":"Caring more about other people's needs than about your own.","col":["a selfless act","selfless devotion","selfless courage","selflessly devoted"],"ex":["Giving up her weekend to help at the food bank was a truly [[selfless]] act.","Resistance fighters showed [[selfless]] courage, risking their lives for strangers."],"piege":"Positif, contraire de <i>selfish</i> (égoïste). Plus courant et plus simple que <i>altruistic</i>. Ne pas confondre avec <i>self-effacing</i> (effacé, modeste).","fam":"selflessly (adv.) · selflessness (n.)","trous":[{"s":"The nurses worked ___ through the night to save the injured.","a":"selflessly","fr":"Les infirmières travaillèrent sans compter toute la nuit pour sauver les blessés."},

{"id":"e-considerate","w":"considerate","pos":"adjective","ipa":"/kənˈsɪdərət/","reg":"courant","fr":"prévenant, attentionné","def":"Always thinking about other people's feelings and needs.","col":["considerate towards","it was considerate of you to","kind and considerate","considerate neighbours"],"ex":["It was very [[considerate]] of you to call and say you'd be late.","A [[considerate]] employer takes workers' family lives into account when planning shifts."],"piege":"<b>Faux ami</b> : <i>considerate</i> ≠ <b>considérable</b> (= <i>considerable</i>). <i>Considerate</i> = <b>attentionné</b>. Construction : <i>it was considerate <b>of</b> you <b>to</b></i>… Contraire : <i>inconsiderate</i>.","fam":"consideration (n.) · inconsiderate (adj.) · considerately (adv.)","trous":[{"s":"Playing loud music at 2 a.m. is extremely ___ towards your neighbours.","a":"inconsiderate","fr":"Mettre de la musique forte à deux heures du matin est extrêmement irrespectueux envers tes voisins."},

{"id":"e-blunt","w":"blunt","pos":"adjective","ipa":"/blʌnt/","reg":"courant","fr":"direct, abrupt, sans détour","def":"Saying what you think directly, without trying to be polite or kind.","col":["to be blunt","a blunt warning","brutally blunt","blunt about"],"ex":["To be [[blunt]], your essay needs a lot more work.","The report delivered a [[blunt]] warning: without action, the coast will flood."],"piege":"Neutre ou négatif : <b>franchise brutale</b>, sans ménagement (plus dur que <i>candid</i> ou <i>frank</i>). Sens propre : émoussé (<i>a blunt knife</i>). Adverbe : <i>bluntly</i> (<i>to put it bluntly</i>).","fam":"bluntly (adv.) · bluntness (n.)","trous":[{"s":"To put it ___, the plan is a disaster.","a":"bluntly","fr":"Pour parler franchement, le plan est un désastre."},

function nouveauxDuJour() {
  var d = aujourdhui(), deja = (etat.jours[d] && etat.jours[d].nv) || 0;
  var reste = Math.max(0, etat.parJour - deja), choisis = [];
  var pools = ACTIVES.filter(function (l) { return !etat.off[l.id]; })
    .map(function (l) { return l.mots.filter(function (m) { return !etat.mots[m.id]; }); });
  var tour = (etat.tour || 0);
  while (choisis.length < reste && pools.some(function (p) { return p.length; })) {
    var p = pools[tour % pools.length]; tour++;
    if (p.length) choisis.push(p.shift());
  }
  return choisis;
}
function revisionsDuJour() {

}

  var m = a.length, n = b.length, d = [], i, j;
  for (i = 0; i <= m; i++) { d[i] = [i]; }

    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];

var audio = null;
function son(type) {
  if (etat.son === false) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    var NOTES = { ok: [[660, 0], [990, .09]], ko: [[247, 0], [196, .12]], niveau: [[523, 0], [659, .1], [784, .2], [1047, .32]],
                  fin: [[523, 0], [659, .12], [784, .24], [1047, .4], [784, .55], [1047, .7]], badge: [[880, 0], [1175, .1], [1568, .2]] }[type];
    var t0 = audio.currentTime + .02;
    NOTES.forEach(function (n) {
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type === "ko" ? "sine" : "triangle";
      o.frequency.value = n[0];
      g.gain.setValueAtTime(0, t0 + n[1]);
      g.gain.linearRampToValueAtTime(type === "ko" ? .09 : .12, t0 + n[1] + .015);
      g.gain.exponentialRampToValueAtTime(.0008, t0 + n[1] + (type === "ko" ? .32 : .28));
      o.connect(g); g.connect(audio.destination);
      o.start(t0 + n[1]); o.stop(t0 + n[1] + .35);
    });
  } catch (e) {}
}

  (function pas(t) {
    var k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);

    var etatN = k <= fait ? "n-fait" : (k === fait + 1 && !fini ? "courant" : "verrou");
    var palier = k % 10 === 0;
    var ic = etatN === "n-fait" ? '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : palier ? '<span class="ic-e">🏆</span>'
      : etatN === "courant" ? '<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>';
    var etiquette = etatN === "courant" ? '<span class="bulle-go">C\'est parti !</span>' : (k === fait + 1 && fini ? '<span class="bulle-go demain">Demain</span>' : '');
    nodes += '<div class="noeud ' + etatN + (palier ? ' palier' : '') + '" style="top:' + (y - 34) + 'px;left:calc(50% + ' + (x - 34) + 'px)">' + etiquette +
      (etatN === "courant" ? '<button class="n-btn" data-go aria-label="Commencer la séance ' + k + '">' : '<div class="n-btn" aria-label="Séance ' + k + (etatN === "n-fait" ? ', faite' : ', à venir') + '">') + ic +
      (etatN === "courant" ? '</button>' : '</div>') + '<span class="n-num">' + k + '</span></div>';
    if (k === fait + 1) {
      var cote = x >= 0 ? -1 : 1;
      mascotte = '<div class="chemin-blot" style="top:' + (y - 50) + 'px;left:calc(50% + ' + (x + cote * 96 - 40) + 'px)">' + blot(fini ? "dort" : "", 80) + '</div>';
    }
  }
  var fait2 = Math.min(n, Math.max(0, fait - debut + 1));
  return '<div class="chemin" style="height:' + (n * H) + 'px">' +
    '<svg class="chemin-trace" viewBox="0 0 300 ' + (n * H) + '" width="300" height="' + (n * H) + '" aria-hidden="true">' +
    '<polyline points="' + pts.join(" ") + '" class="t-fond"/>' +
    (fait2 > 1 ? '<polyline points="' + pts.slice(0, fait2 + (fini ? 0 : 1)).join(" ") + '" class="t-fait"/>' : '') +
    '</svg>' + nodes + mascotte + '</div>';
}

/* ============================================================
   SÉANCE
   1. les mots nouveaux : découverte, puis « quel sens ? » (QCM),
      puis phrase à trous à écrire ;
   2. les révisions des jours précédents (phrase à trous, ou phrase
      personnelle à partir de la boîte 3) ;
   une erreur fait revenir le mot une fois, à la fin de sa partie ;
   3. bilan.
   ============================================================ */
var S = null;
var seanceEl = document.getElementById("seance"), corps = document.getElementById("s-corps");

function typeRevision(m) {
  var s = suivi(m.id);
  if (s.b >= 3 && s.ok % 2 === 1) return "phrase";
  if (s.b === 1 && s.ko > 0 && Math.random() < 0.5) return "sens";
  return "trou";
}
function demarrer() {
  var nv = nouveauxDuJour(), rv = revisionsDuJour();
  var aSens = melange(nv).map(function (m) { return { id: m.id, type: "sens", nouveau: true }; });
  var aTrou = melange(nv).map(function (m) { return { id: m.id, type: "trou", k: 0, nouveau: true }; });
  var rev = melange(rv).map(function (m) { var t = typeRevision(m); return { id: m.id, type: t, k: Math.floor(Math.random() * m.trous.length), nouveau: false }; });
  S = { decouvrir: nv.map(function (m) { return m.id; }), i: 0, phase: nv.length ? "decouvrir" : "exo",
        file: aSens.concat(aTrou, rev), finNouveaux: aSens.length + aTrou.length, j: 0, reprises: {}, bons: 0, total: 0, rates: [], transition: !!(nv.length && rv.length),
        xp: 0, combo: 0, comboMax: 0, xpAvant: etat.xp || 0 };
  majCombo();
  seanceEl.classList.add("on");
  document.body.classList.add("sans-ia");
  document.body.style.overflow = "hidden";
  history.pushState({ seance: 1 }, "");
  etape();
}
function progres() {
  var fait = (S.phase === "decouvrir" ? S.i : S.decouvrir.length + S.j);
  var tot = S.decouvrir.length + S.file.length;
  document.getElementById("s-prog").style.width = Math.min(100, Math.round(fait / Math.max(1, tot) * 100)) + "%";
}
function etape() {
  progres();
  if (S) document.body.classList.add("sans-ia");
  seanceEl.scrollTop = 0;
  if (S.phase === "decouvrir") {
    if (S.i >= S.decouvrir.length) { S.phase = "exo"; return etape(); }
    var m = PAR_ID[S.decouvrir[S.i]];
    corps.innerHTML = '<div class="etape">Mot nouveau ' + (S.i + 1) + ' / ' + S.decouvrir.length + '</div>' +
      '<div class="carte">' + ficheHTML(m) + '</div>' +
      '<div class="ligne-btn" style="margin-top:14px"><button class="btn large" id="suite">' + (S.i + 1 < S.decouvrir.length ? "Mot suivant" : "Passer aux exercices") + '</button></div>';
    document.getElementById("suite").onclick = function () { S.i++; etape(); };
    document.getElementById("suite").focus({ preventScroll: true });
    return;
  }
  if (S.j >= S.file.length) return bilan();
  if (S.transition && S.j === S.finNouveaux) {
    S.transition = false;
    var n = S.file.length - S.finNouveaux;
    corps.innerHTML = '<div class="bilan">' + blot("joie", 110, "saute") + '<div class="etape">Mots du jour terminés</div>' +
      '<p>Place aux révisions : ' + pluriel(n, "exercice") + ' sur les mots des jours précédents.</p>' +
      '<div class="actions" style="margin-top:18px"><button class="btn large" id="suite">Commencer les révisions</button></div></div>';
    document.getElementById("suite").onclick = etape;
    document.getElementById("suite").focus({ preventScroll: true });
    return;
  }
  var it = S.file[S.j];
  if (it.type === "phrase") exoPhrase(it); else if (it.type === "sens") exoSens(it); else exoTrou(it);
}
function entete(it, nom) {
  var dansNv = S.j < S.finNouveaux;
  var pos = dansNv ? (S.j + 1) + ' / ' + S.finNouveaux : (S.j - S.finNouveaux + 1) + ' / ' + (S.file.length - S.finNouveaux);
  return '<div class="etape">' + (it.reprise ? "Encore une fois" : (dansNv ? "Mots du jour" : "Révisions")) + ' · ' + nom + ' · ' + pos + '</div>';
}

var BRAVO = ["Exact !", "Bien vu !", "Parfait !", "Nickel !", "Yes!", "Spot on!", "Bravo !", "Well done!"];
var ZUT = ["Pas tout à fait", "Presque…", "Pas grave, il reviendra", "On le retient pour la prochaine fois"];
function retourHTML(classe, titreTxt, corpsTxt) {
  var humeur = classe === "ok" ? "joie" : (classe === "ko" ? "triste" : "");
  return '<div class="retour ' + classe + '" role="status"><div class="r-tete">' + blot(humeur, 46, "mini") + '<b class="titre">' + titreTxt + '</b></div>' + corpsTxt + '</div>';
}
function reagir(bon) {
  var b = corps.querySelector(".retour .blot");
  animerBlot(b, bon ? "saute" : "secoue");
  son(bon ? "ok" : "ko"); vibre(bon ? 12 : [30, 40, 30]);
}
function majCombo() {
  var c = document.getElementById("combo");
  if (!c) return;
  if (S && S.combo >= 3) {
    c.innerHTML = '🔥 ' + S.combo; c.classList.add("on");
    c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
  } else c.classList.remove("on");
}

/* Comprendre : quel est le sens du mot dans cette phrase ? */
function exoSens(it) {
  var m = PAR_ID[it.id];
  var autres = melange((LISTE_DE[m.liste].mots.length > 4 ? LISTE_DE[m.liste].mots : MOTS).filter(function (x) { return x.id !== m.id && x.def !== m.def; })).slice(0, 3);
  var choix = melange([m].concat(autres));
  var ex = m.ex[Math.floor(Math.random() * m.ex.length)];
  corps.innerHTML = entete(it, "comprendre") +
    '<p class="consigne">Que veut dire <b>' + esc(m.w) + '</b> dans cette phrase ?</p>' +
    '<p class="phrase">' + surligne(ex) + '</p>' +
    '<div class="qcm" role="group" aria-label="Choisis le sens">' + choix.map(function (c) { return '<button class="opt" data-c="' + c.id + '">' + esc(c.def) + '</button>'; }).join("") + '</div>' +
    '<div id="retour"></div><div class="ligne-btn" id="btns"></div>';
  corps.querySelectorAll(".opt").forEach(function (b) {
    b.onclick = function () {
      var bon = b.getAttribute("data-c") === m.id;
      corps.querySelectorAll(".opt").forEach(function (o) { o.disabled = true; if (o.getAttribute("data-c") === m.id) o.classList.add("juste"); });
      if (!bon) b.classList.add("faux");
      document.getElementById("retour").innerHTML = retourHTML(bon ? "ok" : "ko", bon ? pick(BRAVO) : pick(ZUT),
        '<p><b>' + esc(m.w) + '</b> : ' + esc(m.def) + '</p><details class="vf"><summary>Voir en français</summary><p>' + esc(m.fr) + '</p></details>');
      annonce(bon ? "Exact." : "Pas tout à fait.");
      reagir(bon);
      noter(it, bon);
      document.getElementById("btns").innerHTML = '<button class="btn large" id="cont">Continuer</button>';
      document.getElementById("cont").onclick = suivant;
      document.getElementById("cont").focus({ preventScroll: true });
      if (bon) plusXP(gainXP(it), document.getElementById("cont"));
    };
  });
}

/* Retrouver : écrire le mot qui manque */
function exoTrou(it) {
  var m = PAR_ID[it.id], t = m.trous[it.k];
  var largeur = Math.max(t.a.length, 5) + 1;
  var phrase = esc(t.s).replace("___", '<input id="rep" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Mot manquant" style="width:' + largeur + 'ch">');
  corps.innerHTML = entete(it, "écrire") +
    '<p class="consigne">Écris le mot qui manque, à la bonne forme.</p>' +
    '<div class="indice"><span class="en">' + (norm(t.a) === norm(m.w) ? '' : '<i>' + esc(m.w) + '</i> — ') + esc(m.def) + '</span>' +
    '<details class="vf"><summary>Indice en français</summary><p><b>' + esc(m.fr) + '</b><br><span class="fr-ph">' + esc(t.fr) + '</span></p></details></div>' +
    '<p class="phrase">' + phrase + '</p>' +
    '<button class="lien" id="lettre">Voir la première lettre</button>' +
    '<div id="retour"></div>' +
    '<div class="ligne-btn" id="btns"><button class="btn large" id="valider">Vérifier</button></div>';
  var rep = document.getElementById("rep");
  setTimeout(function () { rep.focus({ preventScroll: true }); }, 60);
  document.getElementById("lettre").onclick = function () { rep.placeholder = t.a.charAt(0) + "…"; rep.focus(); this.remove(); };
  rep.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); verifier(); } });
  document.getElementById("valider").onclick = verifier;
  function verifier() {
    var v = norm(rep.value);
    if (!v) { rep.focus(); return; }
    var bonnes = [t.a].concat(t.alt || []).map(norm);
    var juste = bonnes.indexOf(v) >= 0;
    var presque = !juste && t.a.length > 4 && distance(v, norm(t.a)) === 1;
    rep.readOnly = true;
    var complet = surligne(t.s.replace("___", "[[" + t.a + "]]"));
    var r = document.getElementById("retour");
    var rappel = (norm(t.a) === norm(m.w) ? '' : esc(m.w) + ' · ') + esc(m.fr);
    if (juste) {
      r.innerHTML = retourHTML("ok", pick(BRAVO), '<p class="phrase-ok">' + complet + '</p>');
      annonce("Exact.");
      reagir(true);
      noter(it, true);
      document.getElementById("btns").innerHTML = '<button class="btn large" id="cont">Continuer</button>';
      document.getElementById("cont").onclick = suivant;
      document.getElementById("cont").focus({ preventScroll: true });
      plusXP(gainXP(it), document.getElementById("cont"));
    } else {
      r.innerHTML = retourHTML(presque ? "presque" : "ko", presque ? 'Presque : vérifie l\'orthographe' : pick(ZUT),
        '<p>' + (presque ? 'Tu as écrit « ' + esc(rep.value) + ' ». ' : '') + 'La réponse : <b>' + esc(t.a) + '</b> (' + rappel + ')</p>' +
        '<p class="phrase-ok">' + complet + '</p>' + (presque ? '' : '<p class="petit">⚠ ' + m.piege + '</p>'));
      annonce((presque ? "Presque. " : "Pas tout à fait. ") + "La réponse est " + t.a);
      reagir(false);
      document.getElementById("btns").innerHTML = '<button class="btn sec" id="jav">J\'avais bon</button><button class="btn" id="cont">Continuer</button>';
      document.getElementById("jav").onclick = function () { noter(it, true); suivant(); };
      document.getElementById("cont").onclick = function () { noter(it, false); suivant(); };
      document.getElementById("cont").focus({ preventScroll: true });
    }
  }
}

/* L'employer : écrire sa propre phrase */
function exoPhrase(it) {
  var m = PAR_ID[it.id];
  corps.innerHTML = entete(it, "employer") +
    '<p class="consigne">Écris ta propre phrase avec <b>' + esc(m.w) + '</b>.</p>' +
    '<div class="indice"><span class="en">' + esc(m.def) + '</span><br>Idée : ' + esc(m.ecris) + '.<br><span class="muted petit">Goes with: ' + esc(m.col.slice(0, 3).join(" · ")) + '</span></div>' +
    '<label class="sr" for="ta">Ta phrase</label><textarea id="ta" autocapitalize="sentences" spellcheck="true" placeholder="Ta phrase en anglais…"></textarea>' +
    '<div id="retour"></div><div class="ligne-btn" id="btns"><button class="btn large" id="valider">Comparer</button></div>';
  var ta = document.getElementById("ta");
  setTimeout(function () { ta.focus({ preventScroll: true }); }, 60);
  document.getElementById("valider").onclick = function () {
    var v = norm(ta.value);
    if (v.split(" ").length < 4) { ta.focus(); return; }
    var present = m.formes.some(function (f) { return (" " + v + " ").indexOf(" " + norm(f) + " ") >= 0; });
    ta.readOnly = true;
    document.body.classList.remove("sans-ia");
    document.getElementById("retour").innerHTML = retourHTML(present ? "presque" : "ko", present ? 'Relis-toi avec ces trois questions' : 'Le mot n\'apparaît pas dans ta phrase',
      (present ? '' : '<p>Formes attendues : ' + esc(m.formes.join(", ")) + '.</p>') +
      '<p>1. Le sens est-il bien « ' + esc(m.def) + ' » ?<br>2. La construction est-elle juste (' + esc(m.col[0]) + '…) ?<br>3. Le piège est-il évité ?</p>' +
      '<p class="phrase-ok">Exemple : ' + surligne(m.ex[1] || m.ex[0]) + '</p>' +
      '<p class="petit muted">Un doute ? Le bouton rond « Demander à une IA », en bas, peut corriger ta phrase.</p>');
    document.getElementById("btns").innerHTML = '<button class="btn sec" id="non">À revoir</button><button class="btn" id="oui">Ma phrase est juste</button>';
    document.getElementById("oui").onclick = function () { etat.phrases = (etat.phrases || 0) + 1; noter(it, present); if (present) son("ok"); suivant(); };
    document.getElementById("non").onclick = function () { noter(it, false); suivant(); };
  };
}

/* XP rapportés par une bonne réponse */
function gainXP(it) { return it.reprise ? 3 : it.type === "sens" ? 5 : it.type === "phrase" ? 15 : 10; }

/* Résultat d'un exercice. Le QCM de compréhension d'un mot nouveau ne
   change pas sa boîte : c'est la phrase à trous qui décide. */
function noter(it, bon) {
  var m = PAR_ID[it.id], d = aujourdhui();
  var s = etat.mots[it.id] || { b: 0, due: 0, ok: 0, ko: 0 };
  var j = etat.jours[d] || (etat.jours[d] = { nv: 0, rv: 0 });
  S.total++;
  if (bon) { S.bons++; S.combo++; S.comboMax = Math.max(S.comboMax, S.combo); var g = gainXP(it); S.xp += g; etat.xp = (etat.xp || 0) + g; }
  else S.combo = 0;
  majCombo();
  var compte = !it.reprise && !(it.nouveau && it.type === "sens");
  if (compte) {
    if (it.nouveau) { j.nv++; etat.tour = (etat.tour || 0) + 1; } else j.rv++;
    if (bon) { s.ok++; s.b = Math.min(5, s.b + 1); s.due = d + INTERVALLES[s.b]; }
    else { s.ko++; s.b = 1; s.due = d + 1; if (S.rates.indexOf(m.w) < 0) S.rates.push(m.w); }
  }
  etat.mots[it.id] = s;
  if (!bon && !S.reprises[it.id + it.type]) {
    S.reprises[it.id + it.type] = 1;
    var r = { id: it.id, type: it.type === "phrase" ? "trou" : it.type, k: ((it.k || 0) + 1) % m.trous.length, nouveau: it.nouveau, reprise: true };
    if (S.j < S.finNouveaux) { S.file.splice(S.finNouveaux, 0, r); S.finNouveaux++; }
    else S.file.push(r);
  }
  enregistrer();
}
function suivant() { S.j++; etape(); }

function bilan() {
  var d = aujourdhui();
  var dejaFini = etat.jours[d] && etat.jours[d].fini;
  (etat.jours[d] || (etat.jours[d] = { nv: 0, rv: 0 })).fini = true;
  etat.seances = (etat.seances || 0) + 1;
  var bonus = 20 + (S.total >= 5 && S.bons === S.total ? 20 : 0);
  S.xp += bonus; etat.xp = (etat.xp || 0) + bonus;
  etat.record = Math.max(etat.record || 0, serie());
  var nAvant = niveau(S.xpAvant), nApres = niveau(etat.xp), badges = nouveauxBadges();
  enregistrer();
  document.getElementById("s-prog").style.width = "100%";
  var taux = S.total ? Math.round(S.bons / S.total * 100) : 100;
  var bas = seuil(nApres), haut = seuil(nApres + 1);
  var depart = nApres > nAvant ? 0 : Math.round((S.xpAvant - bas) / (haut - bas) * 100);
  var acc = ACCESSOIRES.filter(function (a) { return a.niv > nAvant && a.niv <= nApres; })[0];
  corps.innerHTML = '<div class="bilan">' + blot("joie", 130, "fete") +
    '<div class="etape">Séance terminée' + (dejaFini ? '' : ' · série de ' + pluriel(serie(), "jour")) + '</div>' +
    '<div class="gains"><div class="gain"><b id="g-xp">0</b><span>XP gagnés</span></div><div class="gain"><b>' + taux + ' %</b><span>de réussite</span></div><div class="gain"><b>' + (S.comboMax >= 3 ? '🔥 ' : '') + S.comboMax + '</b><span>meilleure série</span></div></div>' +
    '<div class="niv"><div class="niv-t"><b>Niveau ' + nApres + '</b> · ' + esc(titre(nApres)) + '</div><div class="niv-xp">' + (etat.xp - bas) + ' / ' + (haut - bas) + ' XP</div></div>' +
    '<div class="jauge"><i id="g-jauge" style="width:' + depart + '%"></i></div>' +
    (badges.length ? '<div class="nouv-badges">' + badges.map(function (b) { return '<div class="badge on neuf"><span class="b-ic">' + b.ic + '</span><b>' + esc(b.nom) + '</b><small>' + esc(b.txt) + '</small></div>'; }).join("") + '</div>' : '') +
    (S.rates.length ? '<div class="carte" style="text-align:left;margin-top:14px"><b>Ils reviendront demain :</b> ' + S.rates.map(esc).join(", ") + '</div>' : '') +
    '<div class="actions" style="margin-top:18px"><button class="btn large" id="b-fin">Terminer</button></div>' +
    '<p class="petit muted">Ta progression est enregistrée sur ce téléphone.</p></div>';
  compter(document.getElementById("g-xp"), 0, S.xp, 1100);
  setTimeout(function () { var g = document.getElementById("g-jauge"); if (g) g.style.width = Math.round((etat.xp - bas) / (haut - bas) * 100) + "%"; }, 350);
  son("fin"); confettis(80);
  document.getElementById("b-fin").onclick = function () { quitter(); };
  document.getElementById("b-fin").focus({ preventScroll: true });
  if (nApres > nAvant) setTimeout(function () { montrerNiveau(nApres, acc); }, 1500);
  else if (badges.length) setTimeout(function () { son("badge"); }, 1300);
}
function montrerNiveau(n, acc) {
  var o = document.createElement("div");
  o.className = "niveau-up"; o.setAttribute("role", "dialog"); o.setAttribute("aria-label", "Niveau supérieur");
  o.innerHTML = '<div class="nu-carte">' + blot("joie", 140, "fete") + '<div class="etape">Niveau supérieur !</div><div class="nu-n">' + n + '</div><p class="nu-t">' + esc(titre(n)) + '</p>' +
    (acc ? '<p>Blot gagne ' + esc(acc.nom) + ' !</p>' : '') + '<button class="btn large safran">Continuer</button></div>';
  document.body.appendChild(o);
  son("niveau"); confettis(120); vibre([20, 60, 20]);
  var b = o.querySelector("button"); b.focus();
  b.onclick = function () { o.remove(); };
}
function quitter(retour) {
  if (!S) return;
  S = null;
  seanceEl.classList.remove("on");
  document.body.classList.remove("sans-ia");
  document.body.style.overflow = "";
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (!retour) history.back();
  rendreTout();
}
document.getElementById("s-quitter").onclick = function () {
  if (S && S.phase === "exo" && S.j < S.file.length && !confirm("Quitter la séance ? Les réponses déjà données sont enregistrées.")) return;
  quitter();
};
window.addEventListener("popstate", function () {
  if (modale.classList.contains("on")) fermerFiche(true);
  else if (S) quitter(true);
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { if (modale.classList.contains("on")) fermerFiche(); }
});

rendreTout();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
