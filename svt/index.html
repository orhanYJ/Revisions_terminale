rin matrice, par complémentarité, uniquement dans le sens 5' vers 3'.", "place": "C'est l'ouvrière centrale de la réplication. Sa contrainte de sens explique à elle seule le brin continu et le brin discontinu. Son activité de relecture explique la fidélité de la copie.", "piege": "Ne pas confondre avec l'ARN polymérase, qui fabrique de l'ARN lors de la transcription.", "voir": ["complementarite", "fragment-okazaki", "relecture"]}, "ligase": {"mot": "Ligase", "mots": ["ligase"], "definition": "Enzyme qui soude bout à bout deux fragments d'ADN.", "place": "Elle intervient en dernier, uniquement sur le brin discontinu, pour relier les fragments d'Okazaki en un brin continu.", "voir": ["fragment-okazaki", "brin-discontinu"]}, "nucleotide": {"mot": "Nucléotide", "mots": ["nucléotide", "nucléotides"], "definition": "Unité de base des acides nucléiques : un sucre, un groupement phosphate et une base azotée (A, T, G, C dans l'ADN ; A, U, G, C dans l'ARN).", "place": "C'est la brique élémentaire. La séquence des nucléotides est l'information ; tout le reste du programme découle de cet enchaînement.", "voir": ["complementarite", "codon"]}, "liaison-hydrogene": {"mot": "Liaison hydrogène", "mots": ["liaisons hydrogène", "liaison hydrogène"], "definition": "Liaison chimique faible unissant les bases appariées des deux brins : deux entre A et T, trois entre C et G.", "place": "Faible individuellement, mais nombreuse : c'est ce qui tient la double hélice fermée tout en permettant à l'hélicase de l'ouvrir sans casser la molécule.", "voir": ["helicase", "complementarite"]}, "complementarite": {"mot": "Complémentarité des bases", "mots": ["complémentarité des bases", "complémentarité", "complémentaire", "complémentaires"], "definition": "Règle d'appariement stricte : A avec T (ou U dans l'ARN), C avec G.", "place": "C'est le principe qui rend possible aussi bien la réplication que la transcription : une seule séquence est possible en face d'une matrice donnée.", "voir": ["nucleotide", "brin-matrice"]}, "brin-matrice": {"mot": "Brin matrice", "mots": ["brin matrice", "brins matrices"], "definition": "Brin parental sur lequel une polymérase se cale pour placer les nucléotides complémentaires.", "place": "Dans la réplication, les deux brins servent de matrice. Dans la transcription, un seul est utilisé — le brin transcrit.", "voir": ["complementarite", "brin-transcrit"]}, "origine-replication": {"mot": "Origine de réplication", "mots": ["origine de réplication", "origines de réplication"], "definition": "Séquence d'ADN où l'ouverture de la double hélice commence.", "place": "Il en existe des dizaines de milliers chez les eucaryotes. C'est ce parallélisme qui permet de copier 3 milliards de paires de bases en quelques heures.", "voir": ["oeil-replication", "helicase"]}, "oeil-replication": {"mot": "Œil de réplication", "mots": ["œil de réplication", "yeux de réplication"], "definition": "Bulle ouverte dans la double hélice, bordée à chaque extrémité par une fourche de réplication.", "place": "C'est ce qu'on observe au microscope électronique. Un œil = une origine + deux fourches qui s'écartent en sens opposés.", "voir": ["fourche", "origine-replication"]}, "fourche": {"mot": "Fourche de réplication", "mots": ["fourche de réplication", "fourche", "fourches"], "definition": "Point en forme de Y où la double hélice est ouverte et où se fait la synthèse des nouveaux brins.", "place": "C'est le chantier proprement dit : hélicase en tête, polymérases derrière. Elle avance à mesure que l'ouverture progresse.", "voir": ["helicase", "brin-continu", "brin-discontinu"]}, "antiparalleles": {"mot": "Brins antiparallèles", "mots": ["antiparallèles", "antiparallèle"], "definition": "Se dit des deux brins de l'ADN, orientés en sens inverse l'un de l'autre (5'→3' pour l'un, 3'→5' pour l'autre).", "place": "C'est la cause géométrique de toute l'asymétrie de la réplication : puisque la polymérase ne travaille que dans un sens, un brin est copié en continu et l'autre par morceaux.", "voir": ["brin-continu", "brin-discontinu", "adn-polymerase"]}, "fragment-okazaki": {"mot": "Fragment d'Okazaki", "mots": ["fragments d'Okazaki", "fragment d'Okazaki"], "definition": "Court segment d'ADN néosynthétisé sur le brin discontinu, ensuite relié aux fragments voisins.", "place": "Conséquence directe de l'antiparallélisme. Leur existence est la preuve que la polymérase ne peut pas revenir en arrière.", "voir": ["brin-discontinu", "ligase", "antiparalleles"]}, "brin-continu": {"mot": "Brin continu (direct)", "mots": ["brin continu", "brin direct"], "definition": "Brin néoformé synthétisé d'un seul tenant, du côté où la polymérase avance dans le sens de l'ouverture de la fourche.", "place": "C'est le cas « facile ». À comparer systématiquement avec le brin discontinu pour montrer que la différence vient de l'orientation, pas de l'enzyme.", "voir": ["brin-discontinu", "fourche"]}, "brin-discontinu": {"mot": "Brin discontinu (indirect)", "mots": ["brin discontinu", "brin indirect"], "definition": "Brin néoformé synthétisé par courts fragments, du côté où la polymérase doit travailler à contresens de l'ouverture.", "place": "Il nécessite deux enzymes au lieu d'une : la polymérase pour fabriquer, la ligase pour recoller.", "voir": ["fragment-okazaki", "ligase"]}, "double-helice": {"mot": "Double hélice", "mots": ["double hélice"], "definition": "Structure de l'ADN : deux brins complémentaires et antiparallèles enroulés l'un autour de l'autre.", "place": "Elle doit être ouverte localement pour toute opération sur l'ADN : réplication comme transcription.", "voir": ["liaison-hydrogene", "antiparalleles"]}, "relecture": {"mot": "Relecture (correction d'épreuves)", "mots": ["relecture", "relit"], "definition": "Activité de l'ADN polymérase qui vérifie le nucléotide qu'elle vient d'incorporer et remplace celui qui est mal apparié.", "place": "C'est le second niveau de fidélité, après la complémentarité. Il ramène le taux d'erreur à environ 1 pour 10⁹ nucléotides. Les erreurs qui échappent aux deux niveaux deviennent des mutations.", "voir": ["adn-polymerase", "mutation"]}, "mutation": {"mot": "Mutation", "mots": ["mutation", "mutations", "muté", "mutée"], "definition": "Modification durable de la séquence des nucléotides de l'ADN.", "place": "Elle est le résidu inévitable de la réplication et la seule source de nouveaux allèles. Elle relie ce chapitre à la fiche 5 et, en Terminale, à l'évolution des populations.", "voir": ["relecture", "allele"]}, "gene": {"mot": "Gène", "mots": ["gène", "gènes"], "definition": "Portion d'ADN portant l'information nécessaire à la synthèse d'un ARN, et le plus souvent d'une protéine.", "place": "C'est l'unité d'expression. Attention : le gène est la position et la fonction ; l'allèle est la version que porte un individu.", "piege": "On ne dit pas « le gène de la mucoviscidose » mais « un allèle muté du gène CFTR ».", "voir": ["allele", "transcription"]}, "allele": {"mot": "Allèle", "mots": ["allèle", "allèles"], "definition": "Version particulière d'un gène, née d'une mutation.", "place": "Tout le monde possède les mêmes gènes ; ce sont les allèles qui diffèrent. C'est la base de la génétique de la fiche 10 et de l'évolution en Terminale.", "voir": ["gene", "mutation"]}, "transcription": {"mot": "Transcription", "mots": ["transcription", "transcrit", "transcrite"], "definition": "Synthèse d'un ARN complémentaire d'un brin de l'ADN, réalisée dans le noyau par l'ARN polymérase.", "place": "Première des deux grandes étapes de l'expression. Elle produit une copie de travail, l'ARN pré-messager, qui sera ensuite maturé puis traduit.", "piege": "Transcription : ADN → ARN. Réplication : ADN → ADN. Traduction : ARN → protéine.", "voir": ["arn-polymerase", "brin-transcrit", "traduction"]}, "arn-polymerase": {"mot": "ARN polymérase", "mots": ["ARN polymérase"], "definition": "Enzyme qui ouvre localement l'ADN et assemble un ARN complémentaire du brin transcrit.", "place": "Équivalent fonctionnel de l'ADN polymérase, mais pour l'ARN — et sans activité de relecture, ce qui est sans conséquence puisque l'ARNm est une copie éphémère.", "voir": ["transcription", "adn-polymerase"]}, "brin-transcrit": {"mot": "Brin transcrit", "mots": ["brin transcrit"], "definition": "Le brin de l'ADN qui sert de matrice à l'ARN polymérase. L'autre brin est dit non transcrit.", "place": "Conséquence pratique à savoir manier : l'ARN obtenu a la même séquence que le brin NON transcrit, avec U à la place de T.", "voir": ["brin-matrice", "uracile"]}, "arn-pre-messager": {"mot": "ARN pré-messager", "mots": ["ARN pré-messager", "pré-ARNm"], "definition": "Produit direct de la transcription, contenant encore les introns.", "place": "Étape intermédiaire, propre aux eucaryotes. Il doit être maturé avant de pouvoir quitter le noyau.", "voir": ["epissage", "arn-messager"]}, "arn-messager": {"mot": "ARN messager (ARNm)", "mots": ["ARN messager", "ARNm"], "definition": "ARN mature, formé des seuls exons, qui porte l'information du noyau jusqu'au ribosome.", "place": "C'est la copie de travail, jetable : l'ADN ne sort jamais du noyau. Sa longueur est exactement celle des exons cumulés.", "voir": ["exon", "traduction", "pore-nucleaire"]}, "exon": {"mot": "Exon", "mots": ["exon", "exons"], "definition": "Segment du gène conservé dans l'ARN messager mature.", "place": "Ce sont les exons retenus qui déterminent la protéine obtenue. Faire varier la sélection, c'est l'épissage alternatif.", "voir": ["intron", "epissage-alternatif"]}, "intron": {"mot": "Intron", "mots": ["intron", "introns"], "definition": "Segment du gène excisé lors de la maturation, absent de l'ARN messager mature.", "place": "Sa présence explique pourquoi l'ARNm est plus court que le gène — un calcul de longueur classique en exercice.", "voir": ["exon", "epissage"]}, "epissage": {"mot": "Épissage", "mots": ["épissage", "maturation"], "definition": "Excision des introns et raboutage des exons, dans le noyau, après la transcription.", "place": "Étape charnière entre transcription et traduction. Sans elle, le ribosome traduirait des séquences non codantes.", "voir": ["epissage-alternatif", "arn-messager"]}, "epissage-alternatif": {"mot": "Épissage alternatif", "mots": ["épissage alternatif"], "definition": "Sélection variable des exons conservés, produisant plusieurs ARN messagers différents à partir d'un même pré-ARNm.", "place": "C'est la principale explication du décalage entre ~20 000 gènes et plusieurs centaines de milliers de protéines. Il varie souvent d'un type cellulaire à l'autre.", "voir": ["exon", "proteine"]}, "pore-nucleaire": {"mot": "Pore nucléaire", "mots": ["pore nucléaire", "pores nucléaires"], "definition": "Ouverture contrôlée de l'enveloppe nucléaire, laissant passer certaines molécules.", "place": "Il laisse sortir l'ARNm mature et retient l'ADN. C'est la traduction concrète de la séparation noyau / cytoplasme propre aux eucaryotes.", "voir": ["enveloppe-nucleaire", "arn-messager"]}, "traduction": {"mot": "Traduction", "mots": ["traduction", "traduit", "traduite"], "definition": "Lecture de l'ARN messager par le ribosome et assemblage des acides aminés en une chaîne polypeptidique.", "place": "Seconde grande étape de l'expression, dans le cytoplasme. Elle convertit un langage de nucléotides en un langage d'acides aminés.", "voir": ["ribosome", "codon", "arn-transfert"]}, "ribosome": {"mot": "Ribosome", "mots": ["ribosome", "ribosomes"], "definition": "Complexe cytoplasmique qui se déplace le long de l'ARNm, positionne les ARN de transfert et catalyse la liaison peptidique.", "place": "C'est l'atelier d'assemblage. Il ne choisit rien : c'est l'appariement codon-anticodon qui décide de l'acide aminé placé.", "voir": ["traduction", "liaison-peptidique"]}, "arn-transfert": {"mot": "ARN de transfert (ARNt)", "mots": ["ARN de transfert", "ARNt"], "definition": "Petit ARN portant un anticodon d'un côté et l'acide aminé correspondant de l'autre.", "place": "C'est le véritable traducteur : il fait le lien physique entre le langage des nucléotides et celui des protéines.", "voir": ["anticodon", "acide-amine"]}, "codon": {"mot": "Codon", "mots": ["codon", "codons"], "definition": "Triplet de nucléotides de l'ARN messager, correspondant à un acide aminé ou à un signal d'arrêt.", "place": "Unité de lecture du ribosome. 64 codons possibles pour 20 acides aminés : d'où la redondance du code génétique.", "piege": "Le codon est sur l'ARNm. Le triplet correspondant sur l'ADN n'est pas un codon.", "voir": ["anticodon", "code-genetique"]}, "anticodon": {"mot": "Anticodon", "mots": ["anticodon", "anticodons"], "definition": "Triplet de nucléotides de l'ARN de transfert, complémentaire d'un codon de l'ARN messager.", "place": "C'est lui qui garantit que le bon acide aminé arrive au bon endroit : l'appariement codon-anticodon est le point de contrôle de la traduction.", "voir": ["codon", "arn-transfert"]}, "acide-amine": {"mot": "Acide aminé", "mots": ["acide aminé", "acides aminés"], "definition": "Molécule élémentaire des protéines. Vingt acides aminés différents entrent dans la composition des protéines du vivant.", "place": "Leur ordre, dicté par la séquence des codons, détermine le repliement de la protéine, donc sa forme, donc sa fonction.", "voir": ["proteine", "liaison-peptidique"]}, "liaison-peptidique": {"mot": "Liaison peptidique", "mots": ["liaisons peptidiques", "liaison peptidique"], "definition": "Liaison covalente unissant deux acides aminés successifs dans une protéine.", "place": "Elle est formée par le ribosome à chaque codon lu. C'est elle qui transforme une suite d'acides aminés isolés en une chaîne.", "voir": ["ribosome", "acide-amine"]}, "code-genetique": {"mot": "Code génétique", "mots": ["code génétique"], "definition": "Table de correspondance entre les 64 codons et les acides aminés (ou les signaux stop).", "place": "Universel, redondant, non ambigu et ponctué. Son universalité fonde les biotechnologies et, en Terminale, l'argument d'une origine commune des êtres vivants.", "voir": ["codon", "acide-amine"]}, "uracile": {"mot": "Uracile (U)", "mots": ["uracile"], "definition": "Base azotée propre à l'ARN, qui y remplace la thymine de l'ADN.", "place": "C'est le marqueur immédiat pour reconnaître un ARN d'un ADN dans un exercice : s'il y a des U, c'est de l'ARN.", "voir": ["nucleotide", "brin-transcrit"]}, "proteine": {"mot": "Protéine", "mots": ["protéine", "protéines"], "definition": "Chaîne d'acides aminés repliée dans l'espace, assurant une fonction précise (enzyme, récepteur, transport, structure).", "place": "C'est le produit final de l'expression et le lien entre génotype et phénotype : la séquence détermine la forme, la forme détermine la fonction.", "voir": ["acide-amine", "phenotype"]}, "phenotype": {"mot": "Phénotype", "mots": ["phénotype", "phénotypes"], "definition": "Ensemble des caractères observables d'un individu, à l'échelle moléculaire, cellulaire ou macroscopique.", "place": "Il découle du génotype par l'intermédiaire des protéines, mais dépend aussi de l'environnement et des gènes réellement exprimés dans chaque cellule.", "voir": ["genotype", "proteine"]}, "genotype": {"mot": "Génotype", "mots": ["génotype"], "definition": "Ensemble des allèles que possède un individu.", "place": "Toutes les cellules d'un organisme ont le même génotype ; ce qui les différencie, c'est quels gènes y sont exprimés.", "voir": ["phenotype", "allele"]}, "enzyme": {"mot": "Enzyme", "mots": ["enzyme", "enzymes", "enzymatique"], "definition": "Protéine qui accélère une réaction chimique sans être consommée ni modifiée : un catalyseur biologique.", "place": "Elle ne rend pas la réaction possible — celle-ci l'était déjà — elle la rend assez rapide pour être compatible avec la vie, à 37 °C.", "piege": "On ne dit pas qu'une enzyme est « détruite » par la chaleur : elle est <b>dénaturée</b>.", "voir": ["site-actif", "catalyseur", "denaturation"]}, "catalyseur": {"mot": "Catalyseur", "mots": ["catalyseur", "catalyse", "catalytique", "catalyse"], "definition": "Substance qui accélère une réaction sans figurer dans le bilan, en abaissant l'énergie d'activation.", "place": "C'est la définition de fond de tout le chapitre : l'enzyme est réutilisable immédiatement après chaque cycle.", "voir": ["enzyme", "energie-activation"]}, "substrat": {"mot": "Substrat", "mots": ["substrat", "substrats"], "definition": "Molécule sur laquelle l'enzyme agit et qu'elle transforme en produit.", "place": "C'est sa complémentarité de forme avec le site actif qui fonde la spécificité de substrat.", "voir": ["site-actif", "produit"]}, "site-actif": {"mot": "Site actif", "mots": ["site actif"], "definition": "Petite région de l'enzyme, formée de quelques acides aminés, où le substrat se fixe et où la réaction est catalysée.", "place": "Il a deux fonctions à distinguer : reconnaître (spécificité de substrat) et transformer (spécificité d'action). Sa forme dépend du repliement de toute la protéine — d'où l'effet du pH et de la température.", "voir": ["specificite-substrat", "denaturation", "acide-amine"]}, "energie-activation": {"mot": "Énergie d'activation", "mots": ["énergie d'activation"], "definition": "Barrière énergétique à franchir pour qu'une réaction démarre.", "place": "L'enzyme l'abaisse en rapprochant et en déformant les réactifs. Elle ne modifie ni le sens ni le bilan de la réaction.", "voir": ["catalyseur"]}, "specificite-substrat": {"mot": "Spécificité de substrat", "mots": ["spécificité de substrat"], "definition": "Propriété d'une enzyme de ne reconnaître qu'un substrat, ou une famille très proche.", "place": "Elle vient de la complémentarité de forme. Exemple à citer : la saccharase n'hydrolyse que le saccharose.", "voir": ["specificite-action", "site-actif"]}, "specificite-action": {"mot": "Spécificité d'action", "mots": ["spécificité d'action"], "definition": "Propriété d'une enzyme de ne catalyser qu'un seul type de réaction.", "place": "À ne pas confondre avec la précédente : une hydrolase ne fera jamais une synthèse, même sur un substrat qu'elle reconnaît.", "voir": ["specificite-substrat"]}, "denaturation": {"mot": "Dénaturation", "mots": ["dénature", "dénaturée", "dénaturation", "dénaturé"], "definition": "Perte de la structure tridimensionnelle d'une protéine, donc de sa fonction.", "place": "Elle explique la chute brutale de l'activité au-delà de la température optimale : le site actif n'a plus la bonne forme.", "voir": ["site-actif", "enzyme"]}, "inhibiteur": {"mot": "Inhibiteur", "mots": ["inhibiteur", "inhibiteurs"], "definition": "Molécule qui diminue l'activité d'une enzyme, soit en occupant le site actif (compétitif), soit en déformant l'enzyme ailleurs (non compétitif).", "place": "De très nombreux médicaments sont des inhibiteurs enzymatiques — les anti-inflammatoires en sont l'exemple du programme.", "voir": ["site-actif", "ains"]}, "cofacteur": {"mot": "Cofacteur", "mots": ["cofacteur", "cofacteurs"], "definition": "Ion ou petite molécule (souvent une vitamine) indispensable au fonctionnement de certaines enzymes.", "place": "Il explique qu'une carence alimentaire puisse bloquer une voie métabolique entière.", "voir": ["enzyme"]}, "saturation": {"mot": "Saturation", "mots": ["saturation"], "definition": "État atteint quand tous les sites actifs sont occupés en permanence : la vitesse ne dépend plus de la concentration en substrat.", "place": "C'est le palier des courbes vitesse = f([substrat]). Ajouter du substrat ne change plus rien ; ajouter de l'enzyme relève le palier.", "voir": ["site-actif", "substrat"]}, "substitution": {"mot": "Substitution", "mots": ["substitution"], "definition": "Remplacement d'un nucléotide par un autre.", "place": "C'est la mutation la moins grave en général : le cadre de lecture est conservé. Elle peut être silencieuse, faux-sens ou non-sens.", "voir": ["silencieuse", "faux-sens", "non-sens"]}, "deletion": {"mot": "Délétion", "mots": ["délétion", "délétions"], "definition": "Perte d'un ou plusieurs nucléotides dans une séquence.", "place": "Grave si le nombre perdu n'est pas un multiple de trois : tout le cadre de lecture est décalé à partir de là.", "voir": ["cadre-lecture", "insertion"]}, "insertion": {"mot": "Insertion (addition)", "mots": ["insertion"], "definition": "Ajout d'un ou plusieurs nucléotides dans une séquence.", "place": "Même logique que la délétion : c'est le décalage du cadre de lecture qui fait les dégâts, pas la longueur ajoutée.", "voir": ["cadre-lecture", "deletion"]}, "cadre-lecture": {"mot": "Cadre de lecture", "mots": ["cadre de lecture"], "definition": "Découpage de l'ARN messager en codons successifs à partir du codon initiateur.", "place": "Toute insertion ou délétion non multiple de 3 le décale : à partir du point de mutation, tous les codons suivants sont faux.", "voir": ["codon", "deletion"]}, "silencieuse": {"mot": "Mutation silencieuse", "mots": ["silencieuse", "silencieuses"], "definition": "Mutation qui ne change pas l'acide aminé codé.", "place": "Elle est rendue possible par la <b>redondance</b> du code génétique : plusieurs codons désignent le même acide aminé.", "voir": ["code-genetique", "substitution"]}, "faux-sens": {"mot": "Mutation faux-sens", "mots": ["faux-sens"], "definition": "Mutation qui remplace un acide aminé par un autre.", "place": "Effet variable : nul si l'acide aminé est loin du site fonctionnel, majeur s'il est au cœur du site actif. La drépanocytose en est l'exemple type.", "voir": ["substitution", "drepanocytose"]}, "non-sens": {"mot": "Mutation non-sens", "mots": ["non-sens"], "definition": "Mutation qui crée un codon stop prématuré.", "place": "C'est en général la plus grave : la protéine est tronquée, donc presque toujours non fonctionnelle.", "voir": ["codon", "substitution"]}, "mutagene": {"mot": "Agent mutagène", "mots": ["agent mutagène", "agents mutagènes", "mutagène", "mutagènes"], "definition": "Facteur qui augmente la fréquence des mutations : UV, rayonnements ionisants, substances chimiques, certains virus.", "place": "Il ne crée pas une mutation choisie : il augmente le taux d'erreurs, au hasard. C'est le lien direct avec les facteurs de risque des cancers.", "voir": ["mutation", "reparation", "facteur-risque"]}, "reparation": {"mot": "Systèmes de réparation", "mots": ["systèmes de réparation"], "definition": "Ensemble de mécanismes enzymatiques qui détectent et corrigent les lésions de l'ADN.", "place": "Une mutation ne s'installe que si la réparation échoue <b>avant</b> la réplication suivante. C'est la dernière ligne de défense.", "voir": ["mutation", "relecture"]}, "germinale": {"mot": "Mutation germinale", "mots": ["germinale", "germinales"], "definition": "Mutation survenue dans une cellule de la lignée reproductrice.", "place": "Elle est <b>transmissible à la descendance</b> et peut devenir un nouvel allèle dans la population. C'est le lien avec l'évolution.", "voir": ["somatique", "allele"]}, "somatique": {"mot": "Mutation somatique", "mots": ["somatique", "somatiques"], "definition": "Mutation survenue dans une cellule non reproductrice.", "place": "Elle n'affecte que le clone issu de cette cellule et <b>n'est pas transmise aux enfants</b>. C'est le point de départ des cancers.", "voir": ["germinale", "clone"]}, "polymorphisme": {"mot": "Polymorphisme", "mots": ["polymorphisme", "polymorphismes"], "definition": "Différence de séquence entre individus d'une même espèce, souvent portant sur un seul nucléotide.", "place": "C'est le marqueur qui permet de comparer les populations : plus deux populations partagent de polymorphismes, plus elles ont divergé récemment.", "voir": ["allele", "adn-mitochondrial"]}, "adn-mitochondrial": {"mot": "ADN mitochondrial", "mots": ["ADN mitochondrial"], "definition": "Petit génome contenu dans les mitochondries, transmis uniquement par la mère.", "place": "Il retrace les lignées maternelles. Son mode de transmission particulier est un vestige de l'origine endosymbiotique des mitochondries.", "voir": ["chromosome-y", "polymorphisme"]}, "chromosome-y": {"mot": "Chromosome Y", "mots": ["chromosome Y"], "definition": "Chromosome sexuel transmis de père en fils, sans recombinaison sur l'essentiel de sa longueur.", "place": "Il retrace les lignées paternelles, en miroir de l'ADN mitochondrial.", "voir": ["adn-mitochondrial"]}, "neandertal": {"mot": "Néandertal", "mots": ["néandertalien", "Néandertal"], "definition": "Espèce humaine disparue il y a environ 40 000 ans, dont le génome a pu être séquencé à partir de fossiles.", "place": "Les humains non africains actuels portent 1 à 4 % d'ADN néandertalien : la preuve de métissages, qui interdit de penser les lignées comme un arbre strictement ramifié.", "voir": ["denisova", "polymorphisme"]}, "denisova": {"mot": "Denisova", "mots": ["dénisovien", "Denisova", "Dénisoviens"], "definition": "Population humaine archaïque identifiée uniquement par son ADN, extrait de quelques fossiles sibériens.", "place": "Jusqu'à 5 % du génome des populations d'Océanie en provient. Un allèle dénisovien explique l'adaptation à l'altitude des Tibétains.", "voir": ["neandertal"]}, "selection-naturelle": {"mot": "Sélection naturelle", "mots": ["sélection naturelle"], "definition": "Tri des individus par l'environnement, selon leur succès reproducteur : les porteurs d'allèles avantageux laissent plus de descendants.", "place": "Elle ne crée rien — les mutations préexistent, au hasard — elle trie. Elle agit encore sur notre espèce : lactase, altitude, drépanocytose.", "piege": "Jamais de formulation finaliste : un organisme ne mute pas « pour » s'adapter.", "voir": ["mutation", "allele", "pression-selection"]}, "onde-p": {"mot": "Ondes P", "mots": ["ondes P", "onde P"], "definition": "Ondes sismiques de compression, les plus rapides, qui traversent solides et liquides.", "place": "Elles se propagent partout, y compris dans le noyau externe liquide : c'est leur contraste avec les ondes S qui a révélé la structure interne.", "voir": ["onde-s", "discontinuite"]}, "onde-s": {"mot": "Ondes S", "mots": ["ondes S", "onde S"], "definition": "Ondes sismiques de cisaillement, plus lentes, qui ne se propagent pas dans les liquides.", "place": "Leur disparition au-delà de 2900 km de profondeur est la preuve directe que le noyau externe est liquide.", "voir": ["onde-p", "noyau-externe"]}, "discontinuite": {"mot": "Discontinuité", "mots": ["discontinuité", "discontinuités"], "definition": "Profondeur à laquelle la vitesse des ondes sismiques change brutalement, signalant un changement de milieu.", "place": "Chaque discontinuité délimite une enveloppe : Moho, Gutenberg, Lehmann. C'est l'outil de base pour lire l'intérieur du globe.", "voir": ["moho", "onde-p"]}, "moho": {"mot": "Moho", "mots": ["Moho", "Mohorovičić"], "definition": "Discontinuité séparant la croûte du manteau, vers 7 km sous les océans et 30 km sous les continents.", "place": "C'est une limite <b>chimique</b> : la nature des roches change. À ne pas confondre avec la limite lithosphère/asthénosphère, qui est mécanique.", "voir": ["croute", "manteau", "lithosphere"]}, "lvz": {"mot": "LVZ (zone à moindre vitesse)", "mots": ["LVZ", "zone à moindre vitesse"], "definition": "Niveau du manteau supérieur, vers 100–200 km, où les ondes sismiques ralentissent.", "place": "Ce ralentissement traduit une roche proche de sa température de fusion, donc ductile : la LVZ correspond à l'asthénosphère.", "voir": ["asthenosphere", "lithosphere"]}, "lithosphere": {"mot": "Lithosphère", "mots": ["lithosphère", "lithosphérique"], "definition": "Enveloppe externe rigide et cassante, comprenant la croûte et la partie supérieure du manteau, sur une centaine de kilomètres.", "place": "C'est l'unité découpée en plaques. Limite <b>mécanique</b>, définie par le comportement de la roche, pas par sa composition.", "piege": "La lithosphère n'est pas la croûte : elle contient la croûte ET le sommet du manteau.", "voir": ["asthenosphere", "croute", "moho"]}, "asthenosphere": {"mot": "Asthénosphère", "mots": ["asthénosphère"], "definition": "Partie du manteau située sous la lithosphère, de même composition mais au comportement ductile.", "place": "C'est sur elle que glissent les plaques. Sa densité, comparée à celle de la lithosphère océanique vieillissante, décide du déclenchement de la subduction.", "voir": ["lithosphere", "lvz", "subduction"]}, "croute": {"mot": "Croûte", "mots": ["croûte", "croûte continentale", "croûte océanique"], "definition": "Enveloppe la plus superficielle : granitique, épaisse et peu dense sous les continents ; basaltique, fine et plus dense sous les océans.", "place": "Cette différence de densité explique que la croûte océanique puisse plonger en subduction, et pas la croûte continentale.", "voir": ["manteau", "moho", "subduction"]}, "manteau": {"mot": "Manteau", "mots": ["manteau", "manteau inférieur", "manteau supérieur"], "definition": "Enveloppe solide constituée de péridotite, entre la croûte et le noyau ; elle représente l'essentiel du volume terrestre.", "place": "Solide mais déformable sur de longues durées : c'est le siège de la convection qui évacue la chaleur interne.", "voir": ["peridotite", "convection", "noyau-externe"]}, "noyau-externe": {"mot": "Noyau externe", "mots": ["noyau externe"], "definition": "Enveloppe de fer liquide, de 2900 à 5100 km de profondeur.", "place": "Mis en évidence par la zone d'ombre des ondes S. Ses mouvements engendrent le champ magnétique terrestre.", "voir": ["onde-s", "graine"]}, "graine": {"mot": "Graine (noyau interne)", "mots": ["graine", "noyau interne"], "definition": "Sphère de fer solide au centre de la Terre, malgré une température supérieure à 5000 °C.", "place": "Elle reste solide à cause de la pression. Sa cristallisation progressive libère de l'énergie qui entretient les mouvements du noyau externe.", "voir": ["noyau-externe"]}, "flux-geothermique": {"mot": "Flux géothermique", "mots": ["flux géothermique", "flux de chaleur"], "definition": "Quantité de chaleur évacuée par la Terre par unité de surface et de temps.", "place": "Il provient à ~80 % de la radioactivité naturelle. Très inégal : fort aux dorsales, faible sur les vieux continents — cette carte est un argument tectonique.", "voir": ["convection", "dorsale"]}, "convection": {"mot": "Convection", "mots": ["convection", "convectifs"], "definition": "Transfert de chaleur par déplacement de matière : le chaud monte, le froid descend.", "place": "Mode dominant dans le manteau, bien plus efficace que la conduction. Les tomographies sismiques en donnent l'image directe.", "voir": ["conduction", "tomographie", "manteau"]}, "conduction": {"mot": "Conduction", "mots": ["conduction"], "definition": "Transfert de chaleur de proche en proche, sans déplacement de matière.", "place": "C'est le mode de transfert dans la lithosphère rigide. Lent : c'est pourquoi la lithosphère se refroidit et s'épaissit en s'éloignant de la dorsale.", "voir": ["convection", "lithosphere"]}, "tomographie": {"mot": "Tomographie sismique", "mots": ["tomographies sismiques", "tomographie sismique", "tomographies"], "definition": "Imagerie de l'intérieur du globe par analyse des vitesses des ondes sismiques.", "place": "Elle révèle les zones froides (plaques plongeantes) et chaudes (panaches) : la preuve que la convection concerne le manteau entier.", "voir": ["convection", "onde-p"]}, "peridotite": {"mot": "Péridotite", "mots": ["péridotite", "péridotites"], "definition": "Roche du manteau, riche en olivine, dense et sombre.", "place": "C'est la roche qui fond partiellement pour donner les magmas, aussi bien à la dorsale (par décompression) qu'en subduction (par hydratation).", "voir": ["fusion-partielle", "manteau"]}, "dorsale": {"mot": "Dorsale océanique", "mots": ["dorsale", "dorsales", "dorsale océanique"], "definition": "Chaîne sous-marine marquant une frontière de plaques divergente, où se fabrique la lithosphère océanique.", "place": "Point de départ du cycle : la lithosphère y naît chaude, mince et peu dense. Tout le chapitre suit ensuite son vieillissement.", "voir": ["accretion", "fusion-partielle", "subduction"]}, "accretion": {"mot": "Accrétion", "mots": ["accrétion"], "definition": "Formation de lithosphère océanique nouvelle à l'axe d'une dorsale.", "place": "Elle compense exactement la disparition de lithosphère en subduction : la surface de la Terre reste constante.", "voir": ["dorsale", "subduction"]}, "subduction": {"mot": "Subduction", "mots": ["subduction"], "definition": "Enfoncement d'une plaque lithosphérique océanique sous une autre plaque, dans le manteau.", "place": "Elle se déclenche quand la lithosphère océanique, refroidie et épaissie, devient plus dense que l'asthénosphère — vers 30 millions d'années.", "piege": "La plaque ne plonge pas parce qu'on la pousse : elle plonge sous son propre poids.", "voir": ["slab-pull", "benioff", "asthenosphere"]}, "fusion-partielle": {"mot": "Fusion partielle", "mots": ["fusion partielle"], "definition": "Fusion d'une fraction seulement de la roche, donnant un magma de composition différente de la roche mère.", "place": "Deux causes à distinguer absolument : la <b>décompression</b> à la dorsale, l'<b>hydratation</b> en zone de subduction.", "voir": ["peridotite", "dorsale", "subduction"]}, "basalte": {"mot": "Basalte", "mots": ["basalte", "basaltique", "basaltes"], "definition": "Roche volcanique sombre, à refroidissement rapide, formant l'essentiel du plancher océanique.", "place": "Avec le gabbro, il constitue la croûte océanique fabriquée à la dorsale. Refroidissement rapide = petits cristaux.", "voir": ["gabbro", "dorsale"]}, "gabbro": {"mot": "Gabbro", "mots": ["gabbro", "gabbros"], "definition": "Roche magmatique de même composition que le basalte, mais refroidie lentement en profondeur, donc à gros cristaux.", "place": "Basalte et gabbro forment le couple caractéristique de la croûte océanique — même magma, deux vitesses de refroidissement.", "voir": ["basalte", "dorsale"]}, "andesite": {"mot": "Andésite", "mots": ["andésite", "andésites", "rhyolite"], "definition": "Roche volcanique claire, riche en silice, typique des zones de subduction.", "place": "Sa richesse en silice rend le magma visqueux et retient les gaz : c'est la cause du volcanisme explosif d'arc.", "voir": ["subduction", "fusion-partielle"]}, "slab-pull": {"mot": "Slab pull (traction de la plaque plongeante)", "mots": ["slab pull", "traction de la plaque plongeante"], "definition": "Force exercée par le poids de la plaque plongeante, qui tire le reste de la plaque derrière elle.", "place": "C'est le moteur principal de la tectonique : les plaques dotées d'une longue zone de subduction sont les plus rapides.", "voir": ["subduction", "ridge-push"]}, "ridge-push": {"mot": "Ridge push (poussée à la dorsale)", "mots": ["ridge push", "poussée à la dorsale"], "definition": "Force de glissement gravitaire de la lithosphère depuis le relief de la dorsale vers les bassins.", "place": "Elle contribue au mouvement, mais reste secondaire devant le slab pull.", "voir": ["slab-pull", "dorsale"]}, "benioff": {"mot": "Plan de Bénioff", "mots": ["plan de Bénioff", "Bénioff"], "definition": "Plan incliné dessiné par les foyers des séismes, de plus en plus profonds vers le continent.", "place": "C'est la preuve directe qu'une plaque rigide s'enfonce : sans plongement, pas de séismes à 600 km de profondeur.", "voir": ["subduction"]}, "anomalie-magnetique": {"mot": "Anomalies magnétiques", "mots": ["anomalies magnétiques", "anomalie magnétique"], "definition": "Bandes du plancher océanique aimantées alternativement dans un sens puis dans l'autre, enregistrant les inversions du champ terrestre.", "place": "Leur symétrie de part et d'autre de la dorsale a démontré l'expansion océanique et permet de dater le plancher.", "voir": ["dorsale", "accretion"]}, "plaque": {"mot": "Plaque lithosphérique", "mots": ["plaque lithosphérique", "plaques lithosphériques", "plaques"], "definition": "Fragment rigide de lithosphère se déplaçant d'un seul tenant sur l'asthénosphère.", "place": "Ses limites sont dessinées par les séismes et les volcans. Son mouvement se mesure aujourd'hui directement au GPS, quelques centimètres par an.", "voir": ["lithosphere", "subduction", "dorsale"]}, "ecosysteme": {"mot": "Écosystème", "mots": ["écosystème", "écosystèmes"], "definition": "Ensemble formé par une biocénose, son biotope, et surtout <b>l'ensemble de leurs interactions</b>.", "place": "Le troisième terme est celui qu'on oublie et qu'on attend : sans les interactions, ce n'est qu'une liste d'espèces et un lieu.", "voir": ["biocenose", "biotope", "niveau-trophique"]}, "biocenose": {"mot": "Biocénose", "mots": ["biocénose"], "definition": "Ensemble des êtres vivants d'un écosystème.", "place": "La partie vivante du couple. À associer systématiquement au biotope dans une définition.", "voir": ["biotope", "ecosysteme"]}, "biotope": {"mot": "Biotope", "mots": ["biotope"], "definition": "Ensemble des conditions physico-chimiques d'un milieu : sol, climat, eau, lumière.", "place": "La partie non vivante. C'est lui qui fixe les contraintes auxquelles la biocénose est adaptée.", "voir": ["biocenose", "ecosysteme"]}, "niveau-trophique": {"mot": "Niveau trophique", "mots": ["niveau trophique", "niveaux trophiques", "réseau trophique", "chaîne trophique", "chaînes trophiques"], "definition": "Position d'un organisme dans la chaîne alimentaire : producteur, consommateur de rang 1, de rang 2, décomposeur.", "place": "À chaque passage d'un niveau au suivant, environ 90 % de l'énergie est perdue : c'est pourquoi les chaînes dépassent rarement 4 ou 5 maillons.", "voir": ["producteur", "consommateur", "biomasse"]}, "producteur": {"mot": "Producteur primaire", "mots": ["producteurs primaires", "producteur primaire", "producteurs", "autotrophe", "autotrophes"], "definition": "Organisme autotrophe qui fabrique sa matière organique à partir de matière minérale et de lumière.", "place": "Base de tout réseau trophique. Moins de 1 % de l'énergie lumineuse reçue est convertie en biomasse : c'est la productivité primaire.", "voir": ["productivite", "niveau-trophique"]}, "consommateur": {"mot": "Consommateur", "mots": ["consommateurs", "consommateur", "hétérotrophe", "hétérotrophes"], "definition": "Organisme hétérotrophe qui prélève sa matière organique sur d'autres êtres vivants.", "place": "Il ne récupère qu'une faible part de la biomasse du niveau inférieur : une partie n'est pas consommée, une autre n'est pas assimilée.", "voir": ["niveau-trophique", "decomposeur"]}, "decomposeur": {"mot": "Décomposeur", "mots": ["décomposeurs", "décomposeur", "détritivores"], "definition": "Bactérie, champignon ou détritivore qui dégrade la matière organique morte et libère des sels minéraux.", "place": "C'est lui qui referme le cycle de la matière. Sans décomposeurs, les producteurs manqueraient de minéraux et l'écosystème s'arrêterait.", "voir": ["producteur", "ecosysteme"]}, "biomasse": {"mot": "Biomasse", "mots": ["biomasse"], "definition": "Masse totale de matière organique présente à un niveau trophique donné.", "place": "Sa décroissance d'un niveau au suivant donne la forme en pyramide caractéristique des écosystèmes.", "voir": ["niveau-trophique", "productivite"]}, "productivite": {"mot": "Productivité primaire", "mots": ["productivité primaire", "productivité"], "definition": "Quantité de matière organique produite par les autotrophes par unité de surface et de temps.", "place": "Elle mesure l'entrée d'énergie dans l'écosystème, et donc plafonne tout ce que les niveaux supérieurs pourront consommer.", "voir": ["producteur", "biomasse"]}, "resilience": {"mot": "Résilience", "mots": ["résilience", "résilient"], "definition": "Capacité d'un écosystème à retrouver un état comparable après une perturbation.", "place": "Elle augmente avec la biodiversité : plus les liens trophiques sont redondants, plus la disparition d'une espèce peut être compensée. Au-delà d'un seuil, l'écosystème bascule vers un autre état stable.", "voir": ["succession", "ecosysteme"]}, "succession": {"mot": "Succession écologique", "mots": ["succession écologique", "successions écologiques"], "definition": "Remplacement progressif des communautés après une perturbation : sol nu, herbacées, arbustes, forêt.", "place": "C'est le mécanisme concret de la résilience — et il se compte en décennies, pas en saisons.", "voir": ["resilience"]}, "agrosysteme": {"mot": "Agrosystème", "mots": ["agrosystème", "agrosystèmes"], "definition": "Écosystème modifié et entretenu par l'humain pour la production agricole.", "place": "Sa particularité tient en un mot : son cycle de matière est <b>ouvert</b>. La récolte exporte la matière, qu'il faut compenser par des intrants.", "voir": ["eutrophisation", "ecosysteme"]}, "eutrophisation": {"mot": "Eutrophisation", "mots": ["eutrophisation"], "definition": "Enrichissement excessif d'un milieu aquatique en azote et phosphore, provoquant une prolifération d'algues puis une anoxie.", "place": "C'est la conséquence type d'un excès de fertilisation en agrosystème — l'exemple à mobiliser sur les limites de l'agriculture intensive.", "voir": ["agrosysteme"]}, "service-ecosystemique": {"mot": "Service écosystémique", "mots": ["services écosystémiques", "service écosystémique"], "definition": "Bénéfice que les sociétés humaines retirent du fonctionnement des écosystèmes.", "place": "Trois familles à savoir citer : approvisionnement (nourriture, bois), régulation (climat, pollinisation, épuration), culturel (paysages, loisirs).", "voir": ["ecosysteme", "symbiose"]}, "symbiose": {"mot": "Symbiose", "mots": ["symbiose", "symbiotique"], "definition": "Association durable entre deux espèces, dont chacune tire un bénéfice.", "place": "L'exemple du programme est la mycorhize : le champignon améliore l'absorption minérale de la plante, qui lui fournit du sucre.", "voir": ["mycorhize", "ecosysteme"]}, "mycorhize": {"mot": "Mycorhize", "mots": ["mycorhizes", "mycorhize"], "definition": "Association symbiotique entre les racines d'une plante et un champignon du sol.", "place": "Elle démultiplie la surface d'absorption des racines. Plus de 90 % des plantes terrestres en dépendent.", "voir": ["symbiose"]}, "monogenique": {"mot": "Maladie monogénique", "mots": ["monogénique", "monogéniques"], "definition": "Maladie déterminée par les allèles d'un seul gène.", "place": "Sa transmission suit des règles strictes, donc prévisibles : c'est le seul cas où un arbre généalogique permet de calculer des probabilités exactes.", "voir": ["multifactorielle", "recessif", "mucoviscidose"]}, "multifactorielle": {"mot": "Maladie multifactorielle", "mots": ["multifactorielle", "multifactorielles"], "definition": "Maladie résultant de la combinaison de plusieurs gènes de prédisposition et de facteurs d'environnement.", "place": "C'est le cas de la plupart des maladies fréquentes : diabète de type 2, obésité, hypertension, la majorité des cancers. Aucune transmission mendélienne simple.", "voir": ["predisposition", "monogenique"]}, "dominant": {"mot": "Allèle dominant", "mots": ["allèle dominant", "allèles dominants"], "definition": "Allèle qui s'exprime dans le phénotype même chez un individu hétérozygote.", "place": "Signature dans un arbre : un enfant sain né de deux parents atteints prouve que l'allèle responsable est dominant.", "voir": ["recessif", "heterozygote"]}, "recessif": {"mot": "Allèle récessif", "mots": ["récessif", "récessive"], "definition": "Allèle qui ne s'exprime que chez un individu homozygote pour cet allèle.", "place": "Signature dans un arbre : deux parents sains ayant un enfant atteint — les parents sont alors hétérozygotes, donc porteurs sains.", "voir": ["dominant", "homozygote"]}, "homozygote": {"mot": "Homozygote", "mots": ["homozygote", "homozygotes"], "definition": "Individu possédant deux fois le même allèle pour un gène donné.", "place": "Seul état qui révèle un allèle récessif dans le phénotype.", "voir": ["heterozygote", "recessif"]}, "heterozygote": {"mot": "Hétérozygote", "mots": ["hétérozygote", "hétérozygotes"], "definition": "Individu possédant deux allèles différents pour un gène donné.", "place": "Il peut être porteur sain d'un allèle récessif. Cas remarquable : l'hétérozygote pour la drépanocytose est partiellement protégé du paludisme.", "voir": ["homozygote", "drepanocytose"]}, "predisposition": {"mot": "Prédisposition génétique", "mots": ["prédisposition", "prédispositions"], "definition": "Allèle qui augmente la probabilité de développer une maladie, sans la déterminer.", "place": "Probabilité, pas destin. Les études de jumeaux le prouvent : la concordance entre vrais jumeaux est élevée mais jamais totale.", "piege": "Porter un allèle de prédisposition n'est pas être malade.", "voir": ["multifactorielle", "facteur-risque"]}, "mucoviscidose": {"mot": "Mucoviscidose", "mots": ["mucoviscidose"], "definition": "Maladie monogénique autosomique récessive due à un allèle muté du gène CFTR, codant un canal à ions chlorure.", "place": "Exemple type de la chaîne gène → protéine → phénotype : la délétion de trois nucléotides fait perdre un acide aminé, la protéine mal repliée n'atteint pas la membrane, le mucus devient épais.", "piege": "On ne dit pas « le gène de la mucoviscidose » mais « un allèle muté du gène CFTR ».", "voir": ["cftr", "deletion", "recessif"]}, "cftr": {"mot": "CFTR", "mots": ["CFTR"], "definition": "Gène codant un canal transmembranaire à ions chlorure, présent chez tout le monde.", "place": "C'est le gène ; la mucoviscidose vient d'un de ses allèles mutés. Distinguer les deux est exactement ce qu'on évalue.", "voir": ["mucoviscidose", "gene"]}, "drepanocytose": {"mot": "Drépanocytose", "mots": ["drépanocytose"], "definition": "Maladie génétique due à la substitution d'un seul nucléotide dans le gène de la bêta-globine.", "place": "Un acide aminé changé suffit à faire polymériser l'hémoglobine et à déformer les hématies en faucille. À l'état hétérozygote, elle protège partiellement du paludisme — d'où sa fréquence en zone impaludée.", "voir": ["faux-sens", "heterozygote", "selection-naturelle"]}, "depistage": {"mot": "Dépistage", "mots": ["dépistage", "dépister"], "definition": "Recherche systématique d'une maladie ou d'un risque chez des personnes sans symptôme.", "place": "Néonatal, il permet une prise en charge précoce ; organisé (mammographie, frottis), il vise un diagnostic avant l'apparition des signes.", "voir": ["conseil-genetique", "facteur-risque"]}, "conseil-genetique": {"mot": "Conseil génétique", "mots": ["conseil génétique"], "definition": "Accompagnement médical informant une famille sur le risque de transmission d'une maladie génétique.", "place": "Il s'appuie sur l'arbre généalogique et les probabilités calculées. Il soulève des questions éthiques : dépister quoi, jusqu'où, avec quel consentement.", "voir": ["depistage", "monogenique"]}, "proto-oncogene": {"mot": "Proto-oncogène", "mots": ["proto-oncogènes", "proto-oncogène"], "definition": "Gène normal dont le produit stimule la division cellulaire.", "place": "Muté, il devient un oncogène hyperactif : l'accélérateur reste bloqué. Une seule copie mutée suffit à produire l'effet.", "voir": ["oncogene", "suppresseur"]}, "oncogene": {"mot": "Oncogène", "mots": ["oncogène", "oncogènes"], "definition": "Version mutée et hyperactive d'un proto-oncogène, qui pousse la cellule à se diviser sans signal.", "place": "Premier des deux dérèglements de la cancérisation, à mettre en regard de la perte des gènes suppresseurs.", "voir": ["proto-oncogene", "suppresseur"]}, "suppresseur": {"mot": "Gène suppresseur de tumeur", "mots": ["gènes suppresseurs de tumeurs", "gène suppresseur de tumeur", "gènes suppresseurs", "suppresseurs de tumeurs"], "definition": "Gène dont le produit freine la division ou déclenche l'apoptose des cellules anormales (p53, BRCA1, BRCA2).", "place": "Muté, il perd sa fonction : le frein est cassé. Il faut que les deux copies soient touchées, d'où le rôle des prédispositions héritées.", "voir": ["apoptose", "oncogene", "predisposition"]}, "apoptose": {"mot": "Apoptose", "mots": ["apoptose"], "definition": "Mort cellulaire programmée, déclenchée par la cellule elle-même quand elle est anormale ou inutile.", "place": "C'est la solution normale du problème : une cellule à l'ADN irréparable doit se suicider. Le cancer commence quand ce programme ne se déclenche plus.", "voir": ["suppresseur", "point-de-controle"]}, "tumeur-benigne": {"mot": "Tumeur bénigne", "mots": ["tumeur bénigne", "tumeurs bénignes"], "definition": "Amas de cellules qui prolifèrent de façon incontrôlée mais restent groupées et n'envahissent pas les tissus voisins.", "place": "Stade intermédiaire : la prolifération est déjà anormale, mais l'invasion et les métastases ne sont pas acquises.", "voir": ["tumeur-maligne", "metastase"]}, "tumeur-maligne": {"mot": "Tumeur maligne", "mots": ["tumeur maligne", "tumeurs malignes"], "definition": "Tumeur dont les cellules ont acquis la capacité d'envahir les tissus voisins et de se disséminer.", "place": "Le passage bénin → malin suppose de nouvelles mutations, notamment celles qui permettent l'angiogenèse et la migration.", "voir": ["metastase", "angiogenese"]}, "angiogenese": {"mot": "Angiogenèse", "mots": ["angiogenèse"], "definition": "Formation de nouveaux vaisseaux sanguins, déclenchée ici par la tumeur pour s'alimenter.", "place": "Étape décisive : sans vaisseaux, une tumeur ne dépasse pas quelques millimètres. Certaines thérapies ciblent précisément ce mécanisme.", "voir": ["tumeur-maligne"]}, "metastase": {"mot": "Métastase", "mots": ["métastases", "métastase"], "definition": "Foyer tumoral secondaire, formé par des cellules ayant migré par le sang ou la lymphe.", "place": "C'est ce qui rend un cancer difficile à traiter : la maladie n'est plus localisée. D'où l'enjeu du dépistage précoce.", "voir": ["tumeur-maligne", "depistage"]}, "facteur-risque": {"mot": "Facteur de risque", "mots": ["facteurs de risque", "facteur de risque"], "definition": "Élément qui augmente la probabilité de développer une maladie, sans en être la cause suffisante.", "place": "Tabac, UV, virus, alimentation, sédentarité. Une large part des cancers leur est attribuable, donc évitable : c'est l'argument central de la prévention.", "voir": ["mutagene", "predisposition", "hpv"]}, "hpv": {"mot": "HPV (papillomavirus)", "mots": ["HPV", "papillomavirus"], "definition": "Virus sexuellement transmissible dont certains types provoquent des cancers, notamment du col de l'utérus.", "place": "Il insère des gènes viraux qui perturbent le cycle cellulaire. C'est le cas où la vaccination prévient directement un cancer.", "voir": ["facteur-risque", "vaccination"]}, "antibiotique": {"mot": "Antibiotique", "mots": ["antibiotique", "antibiotiques"], "definition": "Substance qui tue les bactéries ou bloque leur multiplication, sans effet sur les virus.", "place": "Le rappel « inefficace contre les virus » est attendu : il justifie la moitié des messages de santé publique du chapitre.", "voir": ["resistance", "antibiogramme"]}, "resistance": {"mot": "Résistance aux antibiotiques", "mots": ["résistance aux antibiotiques", "résistance", "résistantes", "résistante"], "definition": "Capacité d'une bactérie à survivre en présence d'un antibiotique.", "place": "Elle apparaît par mutation ou par transfert horizontal, <b>avant</b> tout contact avec l'antibiotique. Celui-ci ne fait que sélectionner.", "piege": "Une bactérie ne « devient » pas résistante face à l'antibiotique : elle l'était déjà, ou elle meurt.", "voir": ["pression-selection", "plasmide", "transfert-horizontal"]}, "plasmide": {"mot": "Plasmide", "mots": ["plasmide", "plasmides"], "definition": "Petit ADN circulaire, indépendant du chromosome bactérien, échangeable entre bactéries.", "place": "C'est le véhicule principal des gènes de résistance, y compris entre espèces différentes : il explique la vitesse de diffusion des résistances.", "voir": ["conjugaison", "transfert-horizontal"]}, "conjugaison": {"mot": "Conjugaison", "mots": ["conjugaison"], "definition": "Transfert direct d'un plasmide d'une bactérie à une autre par un pont cytoplasmique.", "place": "L'un des trois modes de transfert horizontal, avec la transformation et la transduction.", "voir": ["plasmide", "transfert-horizontal"]}, "transfert-horizontal": {"mot": "Transfert horizontal", "mots": ["transferts horizontaux", "transfert horizontal"], "definition": "Passage de matériel génétique entre organismes contemporains, sans lien de descendance.", "place": "À opposer au transfert vertical, de parent à descendant. Il revient en Terminale pour expliquer la complexification des génomes.", "voir": ["plasmide", "conjugaison"]}, "pression-selection": {"mot": "Pression de sélection", "mots": ["pression de sélection"], "definition": "Contrainte exercée par un facteur du milieu, qui favorise les individus porteurs de certains allèles.", "place": "L'antibiotique en est l'exemple le plus net : il élimine les sensibles et laisse le champ libre aux résistantes, qui se multiplient en quelques heures.", "voir": ["selection-naturelle", "resistance"]}, "antibiogramme": {"mot": "Antibiogramme", "mots": ["antibiogramme"], "definition": "Test évaluant la sensibilité d'une souche bactérienne à différents antibiotiques.", "place": "Le diamètre du disque d'inhibition mesure l'efficacité : plus il est grand, plus la souche est sensible. C'est le TP du chapitre.", "voir": ["antibiotique", "resistance"]}, "beta-lactamase": {"mot": "Bêta-lactamase", "mots": ["bêta-lactamase", "bêta-lactamases"], "definition": "Enzyme bactérienne qui détruit certains antibiotiques avant qu'ils n'agissent.", "place": "Premier des quatre mécanismes de résistance, avec la modification de la cible, les pompes d'efflux et l'imperméabilité de la paroi.", "voir": ["resistance", "pompe-efflux", "enzyme"]}, "pompe-efflux": {"mot": "Pompe d'efflux", "mots": ["pompes d'efflux", "pompe d'efflux"], "definition": "Protéine membranaire qui expulse l'antibiotique hors de la bactérie.", "place": "Mécanisme redoutable car peu spécifique : une seule pompe peut conférer une résistance à plusieurs familles d'antibiotiques.", "voir": ["resistance", "beta-lactamase"]}, "immunite-innee": {"mot": "Immunité innée", "mots": ["immunité innée"], "definition": "Première ligne de défense : immédiate, non spécifique, sans mémoire, présente chez tous les animaux.", "place": "Elle suffit à régler la grande majorité des infections. Ses trois caractères sont exactement l'inverse de ceux de l'immunité adaptative.", "voir": ["inflammation", "immunite-adaptative", "phagocytose"]}, "cellule-sentinelle": {"mot": "Cellule sentinelle", "mots": ["cellules sentinelles", "cellule sentinelle"], "definition": "Cellule immunitaire présente dans tous les tissus (macrophage, mastocyte, cellule dendritique), capable de détecter un microbe.", "place": "Elle déclenche tout : elle reconnaît des motifs communs aux microbes et libère les médiateurs qui lancent l'inflammation.", "voir": ["mediateur", "inflammation", "cellule-dendritique"]}, "mediateur": {"mot": "Médiateur chimique", "mots": ["médiateurs chimiques", "médiateurs", "médiateur chimique"], "definition": "Molécule libérée par les cellules sentinelles — histamine, prostaglandines, cytokines — qui organise la réaction inflammatoire.", "place": "Ce sont eux qui provoquent la vasodilatation, la perméabilité vasculaire et la douleur, donc les quatre signes cardinaux.", "voir": ["histamine", "prostaglandine", "inflammation"]}, "histamine": {"mot": "Histamine", "mots": ["histamine"], "definition": "Médiateur libéré notamment par les mastocytes, provoquant vasodilatation et augmentation de la perméabilité des vaisseaux.", "place": "Responsable direct de la rougeur et du gonflement — et des symptômes de l'allergie, d'où les antihistaminiques.", "voir": ["mediateur", "vasodilatation"]}, "prostaglandine": {"mot": "Prostaglandine", "mots": ["prostaglandines", "prostaglandine"], "definition": "Médiateur de l'inflammation, responsable de la douleur et de la fièvre.", "place": "C'est leur synthèse que bloquent les anti-inflammatoires, en inhibant l'enzyme qui les produit.", "voir": ["ains", "mediateur"]}, "inflammation": {"mot": "Réaction inflammatoire aiguë", "mots": ["réaction inflammatoire aiguë", "réaction inflammatoire", "inflammation", "inflammatoire"], "definition": "Réponse immédiate et locale à une agression, caractérisée par quatre signes : rougeur, chaleur, gonflement, douleur.", "place": "Ce n'est pas un dysfonctionnement : ces signes traduisent l'arrivée massive des cellules immunitaires sur le site. Elle ne pose problème que si elle devient chronique.", "voir": ["mediateur", "diapedese", "phagocytose"]}, "vasodilatation": {"mot": "Vasodilatation", "mots": ["vasodilatation"], "definition": "Élargissement du diamètre des vaisseaux sanguins locaux.", "place": "Elle augmente le débit sanguin : c'est la cause directe de la rougeur et de la chaleur.", "voir": ["inflammation", "histamine"]}, "diapedese": {"mot": "Diapédèse", "mots": ["diapédèse"], "definition": "Passage des cellules immunitaires du sang vers le tissu infecté, en traversant la paroi des vaisseaux.", "place": "Elle est rendue possible par l'augmentation de la perméabilité vasculaire — le même phénomène qui provoque l'œdème.", "voir": ["inflammation", "phagocyte"]}, "phagocytose": {"mot": "Phagocytose", "mots": ["phagocytose"], "definition": "Ingestion et digestion d'un microbe par une cellule immunitaire, en quatre temps : adhésion, ingestion, digestion, élimination.", "place": "C'est le mécanisme qui met fin à la plupart des infections. Le pus est constitué des cellules mortes et des débris de ce processus.", "voir": ["phagocyte", "immunite-innee"]}, "phagocyte": {"mot": "Phagocyte", "mots": ["phagocytes", "phagocyte"], "definition": "Cellule capable de phagocytose : granulocyte ou macrophage.", "place": "Les granulocytes arrivent les premiers, les macrophages ensuite et durablement. Les anticorps facilitent leur travail en marquant la cible.", "voir": ["macrophage", "granulocyte", "anticorps"]}, "macrophage": {"mot": "Macrophage", "mots": ["macrophage", "macrophages"], "definition": "Grande cellule phagocytaire présente dans les tissus, également cellule sentinelle.", "place": "Double rôle à retenir : il détruit, et il alerte en libérant des médiateurs.", "voir": ["phagocyte", "cellule-sentinelle"]}, "granulocyte": {"mot": "Granulocyte", "mots": ["granulocytes", "granulocyte"], "definition": "Leucocyte phagocytaire, très abondant dans le sang, premier arrivé sur le site inflammatoire.", "place": "Sa durée de vie est courte : sa mort massive sur place forme le pus.", "voir": ["phagocyte", "diapedese"]}, "cellule-dendritique": {"mot": "Cellule dendritique", "mots": ["cellule dendritique", "cellules dendritiques"], "definition": "Cellule sentinelle qui, après avoir phagocyté un microbe, expose des fragments d'antigène à sa surface et migre vers un ganglion.", "place": "C'est le <b>pont entre immunité innée et adaptative</b>. Sans elle, aucune réponse spécifique ne démarre.", "voir": ["cpa", "immunite-adaptative", "immunite-innee"]}, "cpa": {"mot": "Cellule présentatrice d'antigène", "mots": ["cellule présentatrice d'antigène", "cellules présentatrices d'antigène"], "definition": "Cellule qui expose à sa surface des fragments d'antigène reconnaissables par les lymphocytes T.", "place": "Fonction assurée surtout par la cellule dendritique. C'est l'étape obligatoire d'activation de l'immunité adaptative.", "voir": ["cellule-dendritique", "lt4"]}, "ains": {"mot": "Anti-inflammatoire non stéroïdien (AINS)", "mots": ["AINS", "anti-inflammatoires", "anti-inflammatoire"], "definition": "Médicament qui inhibe l'enzyme produisant les prostaglandines : aspirine, ibuprofène.", "place": "Bon exemple de médicament inhibiteur enzymatique. Il soulage, mais atténue aussi une réponse utile — d'où l'usage raisonné.", "voir": ["prostaglandine", "inhibiteur"]}, "immunite-adaptative": {"mot": "Immunité adaptative", "mots": ["immunité adaptative"], "definition": "Réponse spécifique d'un antigène, lente à se mettre en place (plusieurs jours) mais dotée d'une mémoire durable.", "place": "Elle prend le relais quand l'immunité innée ne suffit pas. Ses trois caractères s'opposent terme à terme à ceux de l'innée.", "voir": ["immunite-innee", "selection-clonale", "cellule-memoire"]}, "antigene": {"mot": "Antigène", "mots": ["antigène", "antigènes", "antigénique"], "definition": "Molécule reconnue comme étrangère par le système immunitaire.", "place": "Un antigène porte plusieurs épitopes, ce qui explique qu'une infection déclenche la production de plusieurs anticorps différents.", "voir": ["epitope", "anticorps"]}, "epitope": {"mot": "Épitope (déterminant antigénique)", "mots": ["épitope", "épitopes", "déterminant antigénique", "déterminants antigéniques"], "definition": "Petite portion d'un antigène effectivement reconnue par un anticorps ou un récepteur lymphocytaire.", "place": "C'est l'unité réelle de la reconnaissance : la spécificité se joue à cette échelle, pas à celle de l'antigène entier.", "voir": ["antigene", "anticorps"]}, "lymphocyte": {"mot": "Lymphocyte", "mots": ["lymphocyte", "lymphocytes"], "definition": "Leucocyte porteur d'un récepteur d'un seul type, acteur de l'immunité adaptative.", "place": "L'organisme en produit des millions de spécificités différentes, au hasard, <b>avant</b> toute rencontre avec un antigène.", "voir": ["selection-clonale", "lt4", "lb"]}, "selection-clonale": {"mot": "Sélection clonale", "mots": ["sélection clonale", "sélection et amplification clonales", "amplification clonale"], "definition": "Mécanisme par lequel l'antigène active uniquement les rares lymphocytes dont le récepteur le reconnaît, qui se multiplient ensuite.", "place": "Le point à comprendre : le répertoire préexiste, l'antigène ne fabrique rien, il <b>trie</b>. C'est le pendant, à   id:"p1", num:"1", title:"Les divisions cellulaires des eucaryotes",
  lede:"Comment une cellule transmet-elle un patrimoine génétique identique à ses descendantes ?",
  notions:["cycle cellulaire","mitose","chromatide","caryotype","clone"],
  html:`
<h2>1. Le cycle cellulaire</h2>
<p>Toute cellule issue d'une division suit un <span class="kw">cycle cellulaire</span> qui alterne deux grandes périodes :</p>
<ul>
  <li><b>L'interphase</b> (la plus longue) : phase <b>G1</b> (croissance), phase <b>S</b> (réplication de l'ADN), phase <b>G2</b> (préparation).</li>
  <li><b>La mitose</b> : la division proprement dite, suivie de la <b>cytodiérèse</b> (partage du cytoplasme).</li>
</ul>
<div class="box def"><h4>Le point clé quantitatif</h4>
<p>Pendant la phase S, chaque chromosome passe de <b>1 à 2 chromatides</b> : la <b>quantité d'ADN double</b>, mais le <b>nombre de chromosomes ne change pas</b>. En anaphase, les chromatides se séparent : la quantité d'ADN par cellule est divisée par deux, le nombre de chromosomes reste identique.</p></div>

<h2>2. Les quatre phases de la mitose</h2>
<div data-schema="mitose"></div>

<h2>3. Ce que la mitose garantit</h2>
<p>La mitose produit deux cellules filles <b>génétiquement identiques entre elles et à la cellule mère</b> : ce sont des <span class="kw">clones</span>. Cette conformité repose sur deux mécanismes enchaînés :</p>
<ol>
  <li>la <b>réplication semi-conservative</b> de l'ADN en phase S, qui fabrique une copie exacte ;</li>
  <li>la <b>séparation rigoureuse des chromatides sœurs</b> en anaphase, qui répartit une copie dans chaque cellule fille.</li>
</ol>
<p>Chez un organisme pluricellulaire, la mitose assure la <b>croissance</b>, le <b>renouvellement</b> des tissus (peau, sang, épithélium intestinal) et la <b>réparation</b>. Chez les organismes unicellulaires, elle assure la reproduction asexuée.</p>

<h2>4. Le caryotype</h2>
<p>Le <span class="kw">caryotype</span> est la photographie ordonnée des chromosomes d'une cellule, réalisée en <b>métaphase</b> (moment où ils sont le plus condensés). Chez l'humain : <b>23 paires</b>, soit 46 chromosomes, dont une paire de chromosomes sexuels (XX ou XY). Il révèle les anomalies de nombre (trisomie 21) ou de structure (délétion, translocation).</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« Après la mitose, la cellule fille a deux fois moins de chromosomes. » <b>Faux.</b> Elle a le <b>même nombre de chromosomes</b> (46 chez l'humain), mais chacun n'a plus qu'<b>une chromatide</b>. Toujours raisonner séparément sur le <b>nombre de chromosomes</b> et la <b>quantité d'ADN</b> — c'est exactement ce qu'on attend de toi pour lire un graphique d'évolution de la quantité d'ADN au cours du cycle.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Cycle = interphase (G1–S–G2) + mitose.</li>
<li>Phase S : quantité d'ADN ×2, nombre de chromosomes inchangé.</li>
<li>P-M-A-T : condensation → alignement → séparation des chromatides → reconstitution des noyaux.</li>
<li>Résultat : deux cellules filles clones.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>En Terminale, tu compareras la mitose à la <b>méiose</b>, qui réalise l'inverse : deux divisions successives, un seul doublement de l'ADN, et une <b>production de diversité</b> (brassage interchromosomique et intrachromosomique). Tout le chapitre « L'origine du génotype des individus » repose sur la maîtrise du schéma de la mitose.</p></div>`

{
  id:"p2", num:"2", title:"La réplication de l'ADN",
  lede:"Comment une molécule d'ADN est-elle copiée à l'identique, et pourquoi cette copie n'est-elle jamais parfaite ?",

  html:`
<h2>1. Un mécanisme semi-conservatif</h2>
<p>L'expérience de <b>Meselson et Stahl</b> (1958), sur des bactéries cultivées sur azote lourd puis léger, a tranché entre trois hypothèses. Résultat : chaque molécule fille est constituée d'<b>un brin parental et d'un brin néoformé</b>. On parle de réplication <span class="kw">semi-conservative</span>.</p>

<h2>2. Le déroulement à la fourche de réplication</h2>
<div data-schema="replication"></div>

<h2>3. Pourquoi la copie est fidèle</h2>
<p>La fidélité repose entièrement sur la <span class="kw">complémentarité des bases</span> : A avec T, C avec G. Chaque brin parental sert de <b>matrice</b>, donc la séquence de la molécule fille est entièrement déterminée par celle de la molécule mère. L'ADN polymérase possède en outre une activité de <b>relecture</b> qui corrige la plupart des erreurs d'appariement.</p>
<p>Ordre de grandeur : environ <b>une erreur non corrigée pour 10⁹ à 10¹⁰ nucléotides</b> répliqués. C'est très peu… mais sur 3 milliards de paires de bases et des milliards de cellules, cela reste une source permanente de nouveaux allèles.</p>

<div class="box plus"><h4>Approfondir — pourquoi tant d'origines de réplication ?</h4>
<p>L'ADN polymérase avance à environ 50 nucléotides par seconde chez l'humain. À une seule origine, copier un chromosome prendrait des semaines. Avec des <b>dizaines de milliers d'origines</b> fonctionnant en parallèle et de façon bidirectionnelle, la phase S ne dure que quelques heures. C'est un raisonnement quantitatif typique d'exercice : compare toujours la longueur à copier, la vitesse et la durée disponible.</p></div>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>Ne confonds pas <b>réplication</b> (ADN → ADN, dans le noyau, en phase S, pour transmettre l'information) et <b>transcription</b> (ADN → ARN, à tout moment, pour exprimer l'information). Le vocabulaire du sujet suffit souvent à trancher : « polymérase » seule = ADN polymérase ; « ARN polymérase » = transcription.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Réplication semi-conservative, démontrée par Meselson et Stahl.</li>
<li>Ouverture par l'hélicase → fourche → deux brins matrices.</li>
<li>Synthèse 5'→3' : un brin continu, un brin discontinu (fragments d'Okazaki).</li>
<li>Fidélité assurée par la complémentarité + relecture ; erreurs résiduelles = mutations.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Les erreurs de réplication sont la matière première de l'évolution : en Terminale, tu verras comment ces variations, une fois soumises à la <b>dérive génétique</b> et à la <b>sélection naturelle</b>, font évoluer la fréquence des allèles dans une population.</p></div>`
},

  lede:"Comment l'information portée par un gène devient-elle une protéine, et pourquoi y a-t-il beaucoup plus de protéines que de gènes ?",

  html:`
<h2>1. Du gène à la protéine : deux étapes séparées</h2>
<div data-schema="expression"></div>

<h2>2. Le code génétique</h2>
<p>Le <span class="kw">code génétique</span> est la table de correspondance entre les <b>codons</b> (triplets de nucléotides de l'ARNm) et les acides aminés. Ses propriétés sont à connaître par cœur :</p>
<div class="tablewrap"><table>
<tr><th>Propriété</th><th>Signification</th><th>Conséquence</th></tr>
<tr><td><b>Universel</b></td><td>Le même chez presque tous les êtres vivants</td><td>Preuve d'une origine commune ; rend possibles les OGM et la production d'insuline humaine par des bactéries</td></tr>
<tr><td><b>Redondant</b></td><td>64 codons pour 20 acides aminés</td><td>Une mutation peut être <b>silencieuse</b> (même acide aminé malgré le changement de nucléotide)</td></tr>
<tr><td><b>Non ambigu</b></td><td>Un codon = un seul acide aminé</td><td>La lecture est sans équivoque</td></tr>
<tr><td><b>Ponctué</b></td><td>AUG initiateur, UAA/UAG/UGA stop</td><td>Une mutation créant un codon stop tronque brutalement la protéine</td></tr>
</table></div>

<h2>3. Un gène, plusieurs protéines</h2>
<p>L'humain compte environ <b>20 000 gènes</b> mais fabrique <b>plusieurs centaines de milliers de protéines</b>. L'explication principale est l'<span class="kw">épissage alternatif</span> : selon les exons retenus, un même pré-ARNm donne des ARNm différents, donc des protéines différentes, souvent selon le type cellulaire. S'y ajoutent les modifications chimiques de la protéine après traduction.</p>

<h2>4. Du génotype au phénotype</h2>
<p>La séquence des nucléotides détermine la séquence des acides aminés, qui détermine la <b>structure tridimensionnelle</b> de la protéine, donc sa <b>fonction</b>. Le phénotype macroscopique n'est que la conséquence visible du phénotype moléculaire. Mais toutes les cellules d'un organisme ont le même génome : ce qui les différencie, c'est <b>quels gènes y sont exprimés</b>, et l'environnement module cette expression.</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« L'ARNm est traduit dans le noyau. » <b>Faux</b> chez les eucaryotes : la traduction se fait dans le <b>cytoplasme</b>, par les ribosomes. Autre confusion fréquente : le <b>codon</b> est sur l'ARNm, l'<b>anticodon</b> sur l'ARNt ; le triplet correspondant sur l'ADN n'est pas un codon.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Transcription (noyau) → maturation/épissage → traduction (cytoplasme).</li>
<li>ARN : uracile à la place de la thymine, simple brin, ribose.</li>
<li>Code génétique universel, redondant, non ambigu, ponctué.</li>
<li>Épissage alternatif : un gène → plusieurs protéines.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>L'universalité du code génétique est l'un des arguments majeurs du chapitre « <b>complexification des génomes</b> » : c'est parce que le code est partagé que des <b>transferts horizontaux</b> de gènes entre espèces différentes peuvent fonctionner.</p></div>`
},

  html:`
<h2>1. Qu'est-ce qu'un catalyseur biologique ?</h2>
<p>Une <span class="kw">enzyme</span> est une protéine qui <b>accélère une réaction chimique</b> sans être consommée ni modifiée en fin de réaction. Elle ne crée pas la réaction et ne change pas son sens : elle abaisse l'<b>énergie d'activation</b>, c'est-à-dire la barrière énergétique à franchir.</p>

<h2>2. Le site actif</h2>
<div data-schema="enzyme"></div>

<h2>3. Deux spécificités à distinguer</h2>
<div class="tablewrap"><table>
<tr><th></th><th>Spécificité de substrat</th><th>Spécificité d'action</th></tr>
<tr><td>Définition</td><td>L'enzyme ne reconnaît qu'un substrat (ou une famille très proche)</td><td>L'enzyme ne catalyse qu'un seul type de réaction</td></tr>
<tr><td>Origine</td><td>Complémentarité de forme site actif / substrat</td><td>Nature des acides aminés catalytiques du site actif</td></tr>
<tr><td>Exemple</td><td>La saccharase n'hydrolyse que le saccharose</td><td>Une hydrolase ne fait que des hydrolyses, jamais des synthèses</td></tr>
</table></div>

<h2>4. Ce qui modifie l'activité enzymatique</h2>
<ul>
  <li><b>La température</b> : l'activité augmente jusqu'à un optimum puis <b>chute brutalement</b> car la protéine se <b>dénature</b> (le site actif perd sa forme). C'est irréversible.</li>
  <li><b>Le pH</b> : chaque enzyme a un pH optimal (pepsine ≈ 2 dans l'estomac, amylase ≈ 7).</li>
  <li><b>La concentration en substrat</b> : la vitesse augmente puis atteint un <b>palier de saturation</b> — toutes les enzymes sont occupées.</li>
  <li><b>Les inhibiteurs</b> : compétitifs (ils occupent le site actif) ou non compétitifs (ils déforment l'enzyme ailleurs). De nombreux médicaments sont des inhibiteurs enzymatiques.</li>
  <li><b>Les cofacteurs</b> : ions ou vitamines indispensables à certaines enzymes.</li>
</ul>

<div class="box plus"><h4>Approfondir — lire une courbe de saturation</h4>
<p>Face à une courbe vitesse = f([substrat]), le raisonnement attendu est en deux temps : (1) <b>partie linéaire</b> — les sites actifs sont libres, plus il y a de substrat, plus il y a de rencontres ; (2) <b>plateau</b> — tous les sites actifs sont occupés en permanence, la vitesse ne dépend plus que de la quantité d'enzyme. Ajouter de l'enzyme relève le plateau ; ajouter du substrat ne change rien.</p></div>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>Ne dis jamais qu'une enzyme est « tuée » ou « détruite » par la chaleur : elle est <b>dénaturée</b>, sa structure tridimensionnelle est défaite. Et ne dis pas qu'elle « rend la réaction possible » : la réaction était thermodynamiquement possible, elle était seulement <b>trop lente</b>.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Enzyme = catalyseur biologique, non consommé, réutilisable.</li>
<li>Site actif = poche de quelques acides aminés, complémentaire du substrat.</li>
<li>Double spécificité : de substrat et d'action.</li>
<li>Activité modulée par température, pH, concentrations, inhibiteurs.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Tu retrouveras les enzymes partout : dans la <b>photosynthèse</b> (RuBisCO), dans la <b>contraction musculaire</b> et la régénération de l'ATP, dans la <b>glycolyse</b>, et dans les mécanismes de <b>résistance bactérienne</b> (bêta-lactamases qui détruisent les antibiotiques).</p></div>`
},

/* ---------------- P5 ---------------- */
{
  id:"p5", num:"5", title:"Mutations de l'ADN et variabilité génétique",
  lede:"D'où vient la diversité des allèles, et pourquoi toutes les mutations n'ont-elles pas les mêmes conséquences ?",
  notions:["mutation","agent mutagène","réparation","germinale / somatique","allèle"],
  html:`
<h2>1. Trois types de mutations ponctuelles</h2>
<div class="tablewrap"><table>
<tr><th>Type</th><th>Description</th><th>Conséquence sur la protéine</th></tr>
<tr><td><b>Substitution</b></td><td>Un nucléotide remplacé par un autre</td><td>Souvent limitée : mutation <b>silencieuse</b> (code redondant), <b>faux-sens</b> (1 acide aminé changé) ou <b>non-sens</b> (codon stop précoce)</td></tr>
<tr><td><b>Délétion</b></td><td>Perte d'un ou plusieurs nucléotides</td><td>Grave si le nombre perdu n'est pas multiple de 3 : <b>décalage du cadre de lecture</b>, toute la suite est fausse</td></tr>
<tr><td><b>Insertion / addition</b></td><td>Ajout d'un ou plusieurs nucléotides</td><td>Même logique : décalage du cadre de lecture</td></tr>
</table></div>

<h2>2. Origine des mutations</h2>
<ul>
  <li><b>Spontanées</b> : erreurs de l'ADN polymérase non corrigées lors de la réplication. Rares mais inévitables.</li>
  <li><b>Induites par des agents mutagènes</b> : <b>UV</b> (dimères de thymine), rayonnements ionisants, substances chimiques (benzopyrène du tabac), certains virus.</li>
</ul>
<p>Les cellules disposent de <b>systèmes de réparation</b> très efficaces qui reconnaissent et corrigent la plupart des lésions. Une mutation ne s'installe que si la réparation échoue <b>avant</b> la réplication suivante.</p>

<h2>3. Germinale ou somatique : une distinction décisive</h2>
<div class="box def"><h4>La distinction à ne jamais rater</h4>
<ul>
<li><b>Mutation somatique</b> — dans une cellule de l'organisme. Elle n'affecte que le clone issu de cette cellule, <b>n'est pas transmise à la descendance</b>. C'est le point de départ des cancers.</li>
<li><b>Mutation germinale</b> — dans une cellule de la lignée reproductrice. Elle est <b>transmissible aux descendants</b> et peut devenir un nouvel allèle dans la population.</li>
</ul></div>

<h2>4. Mutations et diversité</h2>
<p>Les mutations sont la <b>seule source de nouveaux allèles</b>. Elles sont <b>aléatoires</b> : elles ne surviennent pas parce que l'organisme en aurait besoin. Leurs effets vont du neutre (le plus fréquent) au délétère, et parfois au bénéfique dans un environnement donné. C'est ensuite l'environnement qui trie.</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« Les bactéries mutent <i>pour</i> résister à l'antibiotique. » <b>Faux et lourdement sanctionné.</b> Les mutations préexistent, au hasard ; l'antibiotique ne fait que <b>sélectionner</b> les bactéries déjà résistantes. Bannis tout vocabulaire finaliste (« pour », « afin de », « la nature a voulu »).</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Substitution, délétion, insertion ; décalage du cadre de lecture si non multiple de 3.</li>
<li>Spontanées ou induites (UV, radiations, chimie) ; systèmes de réparation.</li>
<li>Somatique = non transmise ; germinale = transmise.</li>
<li>Mutations aléatoires = seule source de nouveaux allèles.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Ce chapitre est le socle direct de « <b>L'inéluctable évolution des génomes au sein des populations</b> » : mutation (source de variation) → dérive et sélection (tri) → évolution des fréquences alléliques, quantifiée par le modèle de <b>Hardy-Weinberg</b>.</p></div>`
},
