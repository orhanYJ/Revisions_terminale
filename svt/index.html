plaque lithosphérique", "plaques lithosphériques", "plaques"], "definition": "Fragment rigide de lithosphère se déplaçant d'un seul tenant sur l'asthénosphère.", "place": "Ses limites sont dessinées par les séismes et les volcans. Son mouvement se mesure aujourd'hui directement au GPS, quelques centimètres par an.", "voir": ["lithosphere", "subduction", "dorsale"]}, "ecosysteme": {"mot": "Écosystème", "mots": ["écosystème", "écosystèmes"], "definition": "Ensemble formé par une biocénose, son biotope, et surtout <b>l'ensemble de leurs interactions</b>.", "place": "Le troisième terme est celui qu'on oublie et qu'on attend : sans les interactions, ce n'est qu'une liste d'espèces et un lieu.", "voir": ["biocenose", "biotope", "niveau-trophique"]}, "biocenose": {"mot": "Biocénose", "mots": ["biocénose"], "definition": "Ensemble des êtres vivants d'un écosystème.", "place": "La partie vivante du couple. À associer systématiquement au biotope dans une définition.", "voir": ["biotope", "ecosysteme"]}, "biotope": {"mot": "Biotope", "mots": ["biotope"], "definition": "Ensemble des conditions physico-chimiques d'un milieu : sol, climat, eau, lumière.", "place": "La partie non vivante. C'est lui qui fixe les contraintes auxquelles la biocénose est adaptée.", "voir": ["biocenose", "ecosysteme"]}, "niveau-trophique": {"mot": "Niveau trophique", "mots": ["niveau trophique", "niveaux trophiques", "réseau trophique", "chaîne trophique", "chaînes trophiques"], "definition": "Position d'un organisme dans la chaîne alimentaire : producteur, consommateur de rang 1, de rang 2, décomposeur.", "place": "À chaque passage d'un niveau au suivant, environ 90 % de l'énergie est perdue : c'est pourquoi les chaînes dépassent rarement 4 ou 5 maillons.", "voir": ["producteur", "consommateur", "biomasse"]}, "producteur": {"mot": "Producteur primaire", "mots": ["producteurs primaires", "producteur primaire", "producteurs", "autotrophe", "autotrophes"], "definition": "Organisme autotrophe qui fabrique sa matière organique à partir de matière minérale et de lumière.", "place": "Base de tout réseau trophique. Moins de 1 % de l'énergie lumineuse reçue est convertie en biomasse : c'est la productivité primaire.", "voir": ["productivite", "niveau-trophique"]}, "consommateur": {"mot": "Consommateur", "mots": ["consommateurs", "consommateur", "hétérotrophe", "hétérotrophes"], "definition": "Organisme hétérotrophe qui prélève sa matière organique sur d'autres êtres vivants.", "place": "Il ne récupère qu'une faible part de la biomasse du niveau inférieur : une partie n'est pas consommée, une autre n'est pas assimilée.", "voir": ["niveau-trophique", "decomposeur"]}, "decomposeur": {"mot": "Décomposeur", "mots": ["décomposeurs", "décomposeur", "détritivores"], "definition": "Bactérie, champignon ou détritivore qui dégrade la matière organique morte et libère des sels minéraux.", "place": "C'est lui qui referme le cycle de la matière. Sans décomposeurs, les producteurs manqueraient de minéraux et l'écosystème s'arrêterait.", "voir": ["producteur", "ecosysteme"]}, "biomasse": {"mot": "Biomasse", "mots": ["biomasse"], "definition": "Masse totale de matière organique présente à un niveau trophique donné.", "place": "Sa décroissance d'un niveau au suivant donne la forme en pyramide caractéristique des écosystèmes.", "voir": ["niveau-trophique", "productivite"]}, "productivite": {"mot": "Productivité primaire", "mots": ["productivité primaire", "productivité"], "definition": "Quantité de matière organique produite par les autotrophes par unité de surface et de temps.", "place": "Elle mesure l'entrée d'énergie dans l'écosystème, et donc plafonne tout ce que les niveaux supérieurs pourront consommer.", "voir": ["producteur", "biomasse"]}, "resilience": {"mot": "Résilience", "mots": ["résilience", "résilient"], "definition": "Capacité d'un écosystème à retrouver un état comparable après une perturbation.", "place": "Elle augmente avec la biodiversité : plus les liens trophiques sont redondants, plus la disparition d'une espèce peut être compensée. Au-delà d'un seuil, l'écosystème bascule vers un autre état stable.", "voir": ["succession", "ecosysteme"]}, "succession": {"mot": "Succession écologique", "mots": ["succession écologique", "successions écologiques"], "definition": "Remplacement progressif des communautés après une perturbation : sol nu, herbacées, arbustes, forêt.", "place": "C'est le mécanisme concret de la résilience — et il se compte en décennies, pas en saisons.", "voir": ["resilience"]}, "agrosysteme": {"mot": "Agrosystème", "mots": ["agrosystème", "agrosystèmes"], "definition": "Écosystème modifié et entretenu par l'humain pour la production agricole.", "place": "Sa particularité tient en un mot : son cycle de matière est <b>ouvert</b>. La récolte exporte la matière, qu'il faut compenser par des intrants.", "voir": ["eutrophisation", "ecosysteme"]}, "eutrophisation": {"mot": "Eutrophisation", "mots": ["eutrophisation"], "definition": "Enrichissement excessif d'un milieu aquatique en azote et phosphore, provoquant une prolifération d'algues puis une anoxie.", "place": "C'est la conséquence type d'un excès de fertilisation en agrosystème — l'exemple à mobiliser sur les limites de l'agriculture intensive.", "voir": ["agrosysteme"]}, "service-ecosystemique": {"mot": "Service écosystémique", "mots": ["services écosystémiques", "service écosystémique"], "definition": "Bénéfice que les sociétés humaines retirent du fonctionnement des écosystèmes.", "place": "Trois familles à savoir citer : approvisionnement (nourriture, bois), régulation (climat, pollinisation, épuration), culturel (paysages, loisirs).", "voir": ["ecosysteme", "symbiose"]}, "symbiose": {"mot": "Symbiose", "mots": ["symbiose", "symbiotique"], "definition": "Association durable entre deux espèces, dont chacune tire un bénéfice.", "place": "L'exemple du programme est la mycorhize : le champignon améliore l'absorption minérale de la plante, qui lui fournit du sucre.", "voir": ["mycorhize", "ecosysteme"]}, "mycorhize": {"mot": "Mycorhize", "mots": ["mycorhizes", "mycorhize"], "definition": "Association symbiotique entre les racines d'une plante et un champignon du sol.", "place": "Elle démultiplie la surface d'absorption des racines. Plus de 90 % des plantes terrestres en dépendent.", "voir": ["symbiose"]}, "monogenique": {"mot": "Maladie monogénique", "mots": ["monogénique", "monogéniques"], "definition": "Maladie déterminée par les allèles d'un seul gène.", "place": "Sa transmission suit des règles strictes, donc prévisibles : c'est le seul cas où un arbre généalogique permet de calculer des probabilités exactes.", "voir": ["multifactorielle", "recessif", "mucoviscidose"]}, "multifactorielle": {"mot": "Maladie multifactorielle", "mots": ["multifactorielle", "multifactorielles"], "definition": "Maladie résultant de la combinaison de plusieurs gènes de prédisposition et de facteurs d'environnement.", "place": "C'est le cas de la plupart des maladies fréquentes : diabète de type 2, obésité, hypertension, la majorité des cancers. Aucune transmission mendélienne simple.", "voir": ["predisposition", "monogenique"]}, "dominant": {"mot": "Allèle dominant", "mots": ["allèle dominant", "allèles dominants"], "definition": "Allèle qui s'exprime dans le phénotype même chez un individu hétérozygote.", "place": "Signature dans un arbre : un enfant sain né de deux parents atteints prouve que l'allèle responsable est dominant.", "voir": ["recessif", "heterozygote"]}, "recessif": {"mot": "Allèle récessif", "mots": ["récessif", "récessive"], "definition": "Allèle qui ne s'exprime que chez un individu homozygote pour cet allèle.", "place": "Signature dans un arbre : deux parents sains ayant un enfant atteint — les parents sont alors hétérozygotes, donc porteurs sains.", "voir": ["dominant", "homozygote"]}, "homozygote": {"mot": "Homozygote", "mots": ["homozygote", "homozygotes", "homozygotie"], "definition": "Individu possédant deux fois le même allèle pour un gène donné.", "place": "Seul état qui révèle un allèle récessif dans le phénotype.", "voir": ["heterozygote", "recessif"]}, "heterozygote": {"mot": "Hétérozygote", "mots": ["hétérozygote", "hétérozygotes", "hétérozygotie"], "definition": "Individu possédant deux allèles différents pour un gène donné.", "place": "Il peut être porteur sain d'un allèle récessif. Cas remarquable : l'hétérozygote pour la drépanocytose est partiellement protégé du paludisme.", "voir": ["homozygote", "drepanocytose"]}, "predisposition": {"mot": "Prédisposition génétique", "mots": ["prédisposition", "prédispositions"], "definition": "Allèle qui augmente la probabilité de développer une maladie, sans la déterminer.", "place": "Probabilité, pas destin. Les études de jumeaux le prouvent : la concordance entre vrais jumeaux est élevée mais jamais totale.", "piege": "Porter un allèle de prédisposition n'est pas être malade.", "voir": ["multifactorielle", "facteur-risque"]}, "mucoviscidose": {"mot": "Mucoviscidose", "mots": ["mucoviscidose"], "definition": "Maladie monogénique autosomique récessive due à un allèle muté du gène CFTR, codant un canal à ions chlorure.", "place": "Exemple type de la chaîne gène → protéine → phénotype : la délétion de trois nucléotides fait perdre un acide aminé, la protéine mal repliée n'atteint pas la membrane, le mucus devient épais.", "piege": "On ne dit pas « le gène de la mucoviscidose » mais « un allèle muté du gène CFTR ».", "voir": ["cftr", "deletion", "recessif"]}, "cftr": {"mot": "CFTR", "mots": ["CFTR"], "definition": "Gène codant un canal transmembranaire à ions chlorure, présent chez tout le monde.", "place": "C'est le gène ; la mucoviscidose vient d'un de ses allèles mutés. Distinguer les deux est exactement ce qu'on évalue.", "voir": ["mucoviscidose", "gene"]}, "drepanocytose": {"mot": "Drépanocytose", "mots": ["drépanocytose"], "definition": "Maladie génétique due à la substitution d'un seul nucléotide dans le gène de la bêta-globine.", "place": "Un acide aminé changé suffit à faire polymériser l'hémoglobine et à déformer les hématies en faucille. À l'état hétérozygote, elle protège partiellement du paludisme — d'où sa fréquence en zone impaludée.", "voir": ["faux-sens", "heterozygote", "selection-naturelle"]}, "depistage": {"mot": "Dépistage", "mots": ["dépistage", "dépister"], "definition": "Recherche systématique d'une maladie ou d'un risque chez des personnes sans symptôme.", "place": "Néonatal, il permet une prise en charge précoce ; organisé (mammographie, frottis), il vise un diagnostic avant l'apparition des signes.", "voir": ["conseil-genetique", "facteur-risque"]}, "conseil-genetique": {"mot": "Conseil génétique", "mots": ["conseil génétique"], "definition": "Accompagnement médical informant une famille sur le risque de transmission d'une maladie génétique.", "place": "Il s'appuie sur l'arbre généalogique et les probabilités calculées. Il soulève des questions éthiques : dépister quoi, jusqu'où, avec quel consentement.", "voir": ["depistage", "monogenique"]}, "proto-oncogene": {"mot": "Proto-oncogène", "mots": ["proto-oncogènes", "proto-oncogène"], "definition": "Gène normal dont le produit stimule la division cellulaire.", "place": "Muté, il devient un oncogène hyperactif : l'accélérateur reste bloqué. Une seule copie mutée suffit à produire l'effet.", "voir": ["oncogene", "suppresseur"]}, "oncogene": {"mot": "Oncogène", "mots": ["oncogène", "oncogènes"], "definition": "Version mutée et hyperactive d'un proto-oncogène, qui pousse la cellule à se diviser sans signal.", "place": "Premier des deux dérèglements de la cancérisation, à mettre en regard de la perte des gènes suppresseurs.", "voir": ["proto-oncogene", "suppresseur"]}, "suppresseur": {"mot": "Gène suppresseur de tumeur", "mots": ["gènes suppresseurs de tumeurs", "gène suppresseur de tumeur", "gènes suppresseurs", "suppresseurs de tumeurs"], "definition": "Gène dont le produit freine la division ou déclenche l'apoptose des cellules anormales (p53, BRCA1, BRCA2).", "place": "Muté, il perd sa fonction : le frein est cassé. Il faut que les deux copies soient touchées, d'où le rôle des prédispositions héritées.", "voir": ["apoptose", "oncogene", "predisposition"]}, "apoptose": {"mot": "Apoptose", "mots": ["apoptose"], "definition": "Mort cellulaire programmée, déclenchée par la cellule elle-même quand elle est anormale ou inutile.", "place": "C'est la solution normale du problème : une cellule à l'ADN irréparable doit se suicider. Le cancer commence quand ce programme ne se déclenche plus.", "voir": ["suppresseur", "point-de-controle"]}, "tumeur-benigne": {"mot": "Tumeur bénigne", "mots": ["tumeur bénigne", "tumeurs bénignes"], "definition": "Amas de cellules qui prolifèrent de façon incontrôlée mais restent groupées et n'envahissent pas les tissus voisins.", "place": "Stade intermédiaire : la prolifération est déjà anormale, mais l'invasion et les métastases ne sont pas acquises.", "voir": ["tumeur-maligne", "metastase"]}, "tumeur-maligne": {"mot": "Tumeur maligne", "mots": ["tumeur maligne", "tumeurs malignes"], "definition": "Tumeur dont les cellules ont acquis la capacité d'envahir les tissus voisins et de se disséminer.", "place": "Le passage bénin → malin suppose de nouvelles mutations, notamment celles qui permettent l'angiogenèse et la migration.", "voir": ["metastase", "angiogenese"]}, "angiogenese": {"mot": "Angiogenèse", "mots": ["angiogenèse"], "definition": "Formation de nouveaux vaisseaux sanguins, déclenchée ici par la tumeur pour s'alimenter.", "place": "Étape décisive : sans vaisseaux, une tumeur ne dépasse pas quelques millimètres. Certaines thérapies ciblent précisément ce mécanisme.", "voir": ["tumeur-maligne"]}, "metastase": {"mot": "Métastase", "mots": ["métastases", "métastase"], "definition": "Foyer tumoral secondaire, formé par des cellules ayant migré par le sang ou la lymphe.", "place": "C'est ce qui rend un cancer difficile à traiter : la maladie n'est plus localisée. D'où l'enjeu du dépistage précoce.", "voir": ["tumeur-maligne", "depistage"]}, "facteur-risque": {"mot": "Facteur de risque", "mots": ["facteurs de risque", "facteur de risque"], "definition": "Élément qui augmente la probabilité de développer une maladie, sans en être la cause suffisante.", "place": "Tabac, UV, virus, alimentation, sédentarité. Une large part des cancers leur est attribuable, donc évitable : c'est l'argument central de la prévention.", "voir": ["mutagene", "predisposition", "hpv"]}, "hpv": {"mot": "HPV (papillomavirus)", "mots": ["HPV", "papillomavirus"], "definition": "Virus sexuellement transmissible dont certains types provoquent des cancers, notamment du col de l'utérus.", "place": "Il insère des gènes viraux qui perturbent le cycle cellulaire. C'est le cas où la vaccination prévient directement un cancer.", "voir": ["facteur-risque", "vaccination"]}, "antibiotique": {"mot": "Antibiotique", "mots": ["antibiotique", "antibiotiques"], "definition": "Substance qui tue les bactéries ou bloque leur multiplication, sans effet sur les virus.", "place": "Le rappel « inefficace contre les virus » est attendu : il justifie la moitié des messages de santé publique du chapitre.", "voir": ["resistance", "antibiogramme"]}, "resistance": {"mot": "Résistance aux antibiotiques", "mots": ["résistance aux antibiotiques", "résistance", "résistantes", "résistante"], "definition": "Capacité d'une bactérie à survivre en présence d'un antibiotique.", "place": "Elle apparaît par mutation ou par transfert horizontal, <b>avant</b> tout contact avec l'antibiotique. Celui-ci ne fait que sélectionner.", "piege": "Une bactérie ne « devient » pas résistante face à l'antibiotique : elle l'était déjà, ou elle meurt.", "voir": ["pression-selection", "plasmide", "transfert-horizontal"]}, "plasmide": {"mot": "Plasmide", "mots": ["plasmide", "plasmides"], "definition": "Petit ADN circulaire, indépendant du chromosome bactérien, échangeable entre bactéries.", "place": "C'est le véhicule principal des gènes de résistance, y compris entre espèces différentes : il explique la vitesse de diffusion des résistances.", "voir": ["conjugaison", "transfert-horizontal"]}, "conjugaison": {"mot": "Conjugaison", "mots": ["conjugaison"], "definition": "Transfert direct d'un plasmide d'une bactérie à une autre par un pont cytoplasmique.", "place": "L'un des trois modes de transfert horizontal, avec la transformation et la transduction.", "voir": ["plasmide", "transfert-horizontal"]}, "transfert-horizontal": {"mot": "Transfert horizontal", "mots": ["transferts horizontaux", "transfert horizontal"], "definition": "Passage de matériel génétique entre organismes contemporains, sans lien de descendance.", "place": "À opposer au transfert vertical, de parent à descendant. Il revient en Terminale pour expliquer la complexification des génomes.", "voir": ["plasmide", "conjugaison"]}, "pression-selection": {"mot": "Pression de sélection", "mots": ["pression de sélection"], "definition": "Contrainte exercée par un facteur du milieu, qui favorise les individus porteurs de certains allèles.", "place": "L'antibiotique en est l'exemple le plus net : il élimine les sensibles et laisse le champ libre aux résistantes, qui se multiplient en quelques heures.", "voir": ["selection-naturelle", "resistance"]}, "antibiogramme": {"mot": "Antibiogramme", "mots": ["antibiogramme"], "definition": "Test évaluant la sensibilité d'une souche bactérienne à différents antibiotiques.", "place": "Le diamètre du disque d'inhibition mesure l'efficacité : plus il est grand, plus la souche est sensible. C'est le TP du chapitre.", "voir": ["antibiotique", "resistance"]}, "beta-lactamase": {"mot": "Bêta-lactamase", "mots": ["bêta-lactamase", "bêta-lactamases"], "definition": "Enzyme bactérienne qui détruit certains antibiotiques avant qu'ils n'agissent.", "place": "Premier des quatre mécanismes de résistance, avec la modification de la cible, les pompes d'efflux et l'imperméabilité de la paroi.", "voir": ["resistance", "pompe-efflux", "enzyme"]}, "pompe-efflux": {"mot": "Pompe d'efflux", "mots": ["pompes d'efflux", "pompe d'efflux"], "definition": "Protéine membranaire qui expulse l'antibiotique hors de la bactérie.", "place": "Mécanisme redoutable car peu spécifique : une seule pompe peut conférer une résistance à plusieurs familles d'antibiotiques.", "voir": ["resistance", "beta-lactamase"]}, "immunite-innee": {"mot": "Immunité innée", "mots": ["immunité innée"], "definition": "Première ligne de défense : immédiate, non spécifique, sans mémoire, présente chez tous les animaux.", "place": "Elle suffit à régler la grande majorité des infections. Ses trois caractères sont exactement l'inverse de ceux de l'immunité adaptative.", "voir": ["inflammation", "immunite-adaptative", "phagocytose"]}, "cellule-sentinelle": {"mot": "Cellule sentinelle", "mots": ["cellules sentinelles", "cellule sentinelle"], "definition": "Cellule immunitaire présente dans tous les tissus (macrophage, mastocyte, cellule dendritique), capable de détecter un microbe.", "place": "Elle déclenche tout : elle reconnaît des motifs communs aux microbes et libère les médiateurs qui lancent l'inflammation.", "voir": ["mediateur", "inflammation", "cellule-dendritique"]}, "mediateur": {"mot": "Médiateur chimique", "mots": ["médiateurs chimiques", "médiateurs", "médiateur chimique"], "definition": "Molécule libérée par les cellules sentinelles — histamine, prostaglandines, cytokines — qui organise la réaction inflammatoire.", "place": "Ce sont eux qui provoquent la vasodilatation, la perméabilité vasculaire et la douleur, donc les quatre signes cardinaux.", "voir": ["histamine", "prostaglandine", "inflammation"]}, "histamine": {"mot": "Histamine", "mots": ["histamine"], "definition": "Médiateur libéré notamment par les mastocytes, provoquant vasodilatation et augmentation de la perméabilité des vaisseaux.", "place": "Responsable direct de la rougeur et du gonflement — et des symptômes de l'allergie, d'où les antihistaminiques.", "voir": ["mediateur", "vasodilatation"]}, "prostaglandine": {"mot": "Prostaglandine", "mots": ["prostaglandines", "prostaglandine"], "definition": "Médiateur de l'inflammation, responsable de la douleur et de la fièvre.", "place": "C'est leur synthèse que bloquent les anti-inflammatoires, en inhibant l'enzyme qui les produit.", "voir": ["ains", "mediateur"]}, "inflammation": {"mot": "Réaction inflammatoire aiguë", "mots": ["réaction inflammatoire aiguë", "réaction inflammatoire", "inflammation", "inflammatoire"], "definition": "Réponse immédiate et locale à une agression, caractérisée par quatre signes : rougeur, chaleur, gonflement, douleur.", "place": "Ce n'est pas un dysfonctionnement : ces signes traduisent l'arrivée massive des cellules immunitaires sur le site. Elle ne pose problème que si elle devient chronique.", "voir": ["mediateur", "diapedese", "phagocytose"]}, "vasodilatation": {"mot": "Vasodilatation", "mots": ["vasodilatation"], "definition": "Élargissement du diamètre des vaisseaux sanguins locaux.", "place": "Elle augmente le débit sanguin : c'est la cause directe de la rougeur et de la chaleur.", "voir": ["inflammation", "histamine"]}, "diapedese": {"mot": "Diapédèse", "mots": ["diapédèse"], "definition": "Passage des cellules immunitaires du sang vers le tissu infecté, en traversant la paroi des vaisseaux.", "place": "Elle est rendue possible par l'augmentation de la perméabilité vasculaire — le même phénomène qui provoque l'œdème.", "voir": ["inflammation", "phagocyte"]}, "phagocytose": {"mot": "Phagocytose", "mots": ["phagocytose"], "definition": "Ingestion et digestion d'un microbe par une cellule immunitaire, en quatre temps : adhésion, ingestion, digestion, élimination.", "place": "C'est le mécanisme qui met fin à la plupart des infections. Le pus est constitué des cellules mortes et des débris de ce processus.", "voir": ["phagocyte", "immunite-innee"]}, "phagocyte": {"mot": "Phagocyte", "mots": ["phagocytes", "phagocyte"], "definition": "Cellule capable de phagocytose : granulocyte ou macrophage.", "place": "Les granulocytes arrivent les premiers, les macrophages ensuite et durablement. Les anticorps facilitent leur travail en marquant la cible.", "voir": ["macrophage", "granulocyte", "anticorps"]}, "macrophage": {"mot": "Macrophage", "mots": ["macrophage", "macrophages"], "definition": "Grande cellule phagocytaire présente dans les tissus, également cellule sentinelle.", "place": "Double rôle à retenir : il détruit, et il alerte en libérant des médiateurs.", "voir": ["phagocyte", "cellule-sentinelle"]}, "granulocyte": {"mot": "Granulocyte", "mots": ["granulocytes", "granulocyte"], "definition": "Leucocyte phagocytaire, très abondant dans le sang, premier arrivé sur le site inflammatoire.", "place": "Sa durée de vie est courte : sa mort massive sur place forme le pus.", "voir": ["phagocyte", "diapedese"]}, "cellule-dendritique": {"mot": "Cellule dendritique", "mots": ["cellule dendritique", "cellules dendritiques"], "definition": "Cellule sentinelle qui, après avoir phagocyté un microbe, expose des fragments d'antigène à sa surface et migre vers un ganglion.", "place": "C'est le <b>pont entre immunité innée et adaptative</b>. Sans elle, aucune réponse spécifique ne démarre.", "voir": ["cpa", "immunite-adaptative", "immunite-innee"]}, "cpa": {"mot": "Cellule présentatrice d'antigène", "mots": ["cellule présentatrice d'antigène", "cellules présentatrices d'antigène"], "definition": "Cellule qui expose à sa surface des fragments d'antigène reconnaissables par les lymphocytes T.", "place": "Fonction assurée surtout par la cellule dendritique. C'est l'étape obligatoire d'activation de l'immunité adaptative.", "voir": ["cellule-dendritique", "lt4"]}, "ains": {"mot": "Anti-inflammatoire non stéroïdien (AINS)", "mots": ["AINS", "anti-inflammatoires", "anti-inflammatoire"], "definition": "Médicament qui inhibe l'enzyme produisant les prostaglandines : aspirine, ibuprofène.", "place": "Bon exemple de médicament inhibiteur enzymatique. Il soulage, mais atténue aussi une réponse utile — d'où l'usage raisonné.", "voir": ["prostaglandine", "inhibiteur"]}, "immunite-adaptative": {"mot": "Immunité adaptative", "mots": ["immunité adaptative"], "definition": "Réponse spécifique d'un antigène, lente à se mettre en place (plusieurs jours) mais dotée d'une mémoire durable.", "place": "Elle prend le relais quand l'immunité innée ne suffit pas. Ses trois caractères s'opposent terme à terme à ceux de l'innée.", "voir": ["immunite-innee", "selection-clonale", "cellule-memoire"]}, "antigene": {"mot": "Antigène", "mots": ["antigène", "antigènes", "antigénique"], "definition": "Molécule reconnue comme étrangère par le système immunitaire.", "place": "Un antigène porte plusieurs épitopes, ce qui explique qu'une infection déclenche la production de plusieurs anticorps différents.", "voir": ["epitope", "anticorps"]}, "epitope": {"mot": "Épitope (déterminant antigénique)", "mots": ["épitope", "épitopes", "déterminant antigénique", "déterminants antigéniques"], "definition": "Petite portion d'un antigène effectivement reconnue par un anticorps ou un récepteur lymphocytaire.", "place": "C'est l'unité réelle de la reconnaissance : la spécificité se joue à cette échelle, pas à celle de l'antigène entier.", "voir": ["antigene", "anticorps"]}, "lymphocyte": {"mot": "Lymphocyte", "mots": ["lymphocyte", "lymphocytes"], "definition": "Leucocyte porteur d'un récepteur d'un seul type, acteur de l'immunité adaptative.", "place": "L'organisme en produit des millions de spécificités différentes, au hasard, <b>avant</b> toute rencontre avec un antigène.", "voir": ["selection-clonale", "lt4", "lb"]}, "selection-clonale": {"mot": "Sélection clonale", "mots": ["sélection clonale", "sélection et amplification clonales", "amplification clonale"], "definition": "Mécanisme par lequel l'antigène active uniquement les rares lymphocytes dont le récepteur le reconnaît, qui se multiplient ensuite.", "place": "Le point à comprendre : le répertoire préexiste, l'antigène ne fabrique rien, il <b>trie</b>. C'est le pendant, à l'échelle d'un organisme, de la sélection naturelle.", "voir": ["lymphocyte", "cellule-memoire"]}, "lt4": {"mot": "Lymphocyte T4 (auxiliaire)", "mots": ["LT4", "lymphocytes T4", "T4 auxiliaire"], "definition": "Lymphocyte activé par une cellule présentatrice d'antigène, qui sécrète des interleukines.", "place": "C'est le chef d'orchestre : sans lui, ni les LB ni les LT8 ne s'activent pleinement. Le VIH le détruit, et paralyse ainsi toute l'immunité adaptative.", "voir": ["interleukine", "lb", "lt8", "vih"]}, "lb": {"mot": "Lymphocyte B", "mots": ["LB", "lymphocytes B", "lymphocyte B"], "definition": "Lymphocyte reconnaissant l'antigène sous sa forme libre et se différenciant en plasmocyte.", "place": "Il porte la réponse <b>humorale</b> : la production d'anticorps circulants.", "voir": ["plasmocyte", "anticorps", "immunite-humorale"]}, "lt8": {"mot": "Lymphocyte T8 (cytotoxique)", "mots": ["LT8", "lymphocytes T8", "LT cytotoxique", "cytotoxiques"], "definition": "Lymphocyte qui reconnaît l'antigène présenté par une cellule infectée et la détruit.", "place": "Il porte la réponse <b>cellulaire</b>, indispensable contre les virus et les cellules cancéreuses, que les anticorps ne peuvent pas atteindre.", "voir": ["immunite-cellulaire", "lt4"]}, "plasmocyte": {"mot": "Plasmocyte", "mots": ["plasmocyte", "plasmocytes"], "definition": "Lymphocyte B différencié, spécialisé dans la sécrétion massive d'anticorps.", "place": "Étape terminale de la réponse humorale : un plasmocyte peut sécréter plusieurs milliers d'anticorps par seconde.", "voir": ["lb", "anticorps"]}, "interleukine": {"mot": "Interleukine", "mots": ["interleukines", "interleukine"], "definition": "Molécule de communication sécrétée par les lymphocytes T4, qui stimule la prolifération et la différenciation des autres lymphocytes.", "place": "C'est le signal par lequel le LT4 exerce son rôle de chef d'orchestre.", "voir": ["lt4"]}, "anticorps": {"mot": "Anticorps", "mots": ["anticorps"], "definition": "Immunoglobuline en forme de Y sécrétée par les plasmocytes, portant deux sites de fixation identiques.", "place": "Il ne détruit pas : il <b>neutralise</b> l'antigène et forme des complexes immuns que les phagocytes éliminent ensuite.", "piege": "Les anticorps ne tuent pas les microbes ; ils les marquent et les agglutinent.", "voir": ["complexe-immun", "plasmocyte", "epitope"]}, "complexe-immun": {"mot": "Complexe immun", "mots": ["complexes immuns", "complexe immun"], "definition": "Agrégat formé par des anticorps reliant plusieurs antigènes entre eux.", "place": "Sa formation est possible parce que l'anticorps est <b>bivalent</b>. L'agrégat précipite et devient une cible facile pour la phagocytose.", "voir": ["anticorps", "phagocytose"]}, "cellule-memoire": {"mot": "Cellule mémoire", "mots": ["cellules mémoire", "cellule mémoire", "mémoire immunitaire"], "definition": "Lymphocyte à longue durée de vie, issu d'une première rencontre avec un antigène.", "place": "Elle explique que la réponse secondaire soit plus rapide, plus intense et plus durable — et c'est tout le principe de la vaccination.", "voir": ["selection-clonale", "vaccination"]}, "immunite-humorale": {"mot": "Immunité humorale", "mots": ["immunité humorale"], "definition": "Volet de la réponse adaptative reposant sur les anticorps circulants.", "place": "Efficace contre ce qui circule dans les liquides : bactéries, toxines, virus hors des cellules.", "voir": ["anticorps", "immunite-cellulaire"]}, "immunite-cellulaire": {"mot": "Immunité cellulaire", "mots": ["immunité cellulaire"], "definition": "Volet de la réponse adaptative reposant sur les lymphocytes T8 cytotoxiques.", "place": "Seule voie efficace contre ce qui est caché <b>dans</b> les cellules : virus intracellulaires, cellules cancéreuses.", "voir": ["lt8", "immunite-humorale"]}, "vih": {"mot": "VIH", "mots": ["VIH"], "definition": "Virus qui infecte et détruit les lymphocytes T4.", "place": "En supprimant le chef d'orchestre, il paralyse toute l'immunité adaptative : le malade meurt d'infections normalement bénignes. C'est la démonstration du rôle pivot du LT4.", "voir": ["lt4", "immunite-adaptative"]}, "vaccination": {"mot": "Vaccination", "mots": ["vaccination", "vaccin", "vaccins", "vaccinale"], "definition": "Injection d'un antigène rendu inoffensif, déclenchant une réponse primaire complète et donc la formation de cellules mémoire.", "place": "Elle provoque la mémoire sans la maladie. C'est une immunité <b>active</b> et durable, à distinguer nettement de la sérothérapie.", "voir": ["adjuvant", "rappel", "serotherapie", "cellule-memoire"]}, "adjuvant": {"mot": "Adjuvant", "mots": ["adjuvants", "adjuvant"], "definition": "Substance ajoutée au vaccin pour stimuler l'immunité innée locale et renforcer la réponse adaptative.", "place": "La petite inflammation au point d'injection est son effet attendu : elle signe le bon fonctionnement du vaccin.", "voir": ["vaccination", "inflammation"]}, "rappel": {"mot": "Rappel vaccinal", "mots": ["rappel vaccinal"], "definition": "Nouvelle injection du même antigène, à distance de la première.", "place": "Il exploite la réponse secondaire : taux d'anticorps plus élevé, plus durable, et stock de cellules mémoire enrichi.", "voir": ["vaccination", "cellule-memoire"]}, "serotherapie": {"mot": "Sérothérapie", "mots": ["sérothérapie", "sérum"], "definition": "Injection d'anticorps déjà formés, prélevés sur un organisme immunisé.", "place": "Protection <b>immédiate mais brève</b>, sans aucune mémoire : c'est un traitement d'urgence (morsure de serpent, tétanos), pas une prévention.", "piege": "Le sérum n'immunise pas : quand les anticorps injectés disparaissent, la protection disparaît avec eux.", "voir": ["vaccination", "immunite-passive"]}, "immunite-passive": {"mot": "Immunité passive", "mots": ["immunité passive"], "definition": "Protection apportée par des anticorps produits par un autre organisme.", "place": "Cas de la sérothérapie et des anticorps maternels transmis au nourrisson. L'organisme protégé ne travaille pas, donc ne mémorise rien.", "voir": ["serotherapie", "immunite-active"]}, "immunite-active": {"mot": "Immunité active", "mots": ["immunité active"], "definition": "Protection acquise par le système immunitaire de l'individu lui-même, après infection ou vaccination.", "place": "Plus lente à s'installer, mais durable grâce aux cellules mémoire.", "voir": ["vaccination", "immunite-passive"]}, "couverture-vaccinale": {"mot": "Couverture vaccinale", "mots": ["couverture vaccinale", "taux de couverture vaccinale"], "definition": "Proportion d'une population vaccinée contre une maladie donnée.", "place": "Au-delà d'un seuil qui dépend de la contagiosité — environ 95 % pour la rougeole — la transmission s'effondre et protège même les non-vaccinés.", "voir": ["immunite-collective", "vaccination"]}, "immunite-collective": {"mot": "Immunité collective", "mots": ["immunité collective"], "definition": "Protection indirecte des personnes non immunisées, obtenue quand une proportion suffisante de la population l'est.", "place": "C'est l'argument central de toute politique vaccinale : elle protège les nourrissons et les immunodéprimés, qui ne peuvent pas être vaccinés.", "voir": ["couverture-vaccinale"]}, "anticorps-monoclonal": {"mot": "Anticorps monoclonal", "mots": ["anticorps monoclonaux", "anticorps monoclonal", "monoclonaux"], "definition": "Anticorps tous identiques, produits à partir d'un unique clone de plasmocyte et dirigés contre une cible choisie.", "place": "Trois usages à citer : diagnostic (tests de grossesse, tests antigéniques), thérapie ciblée (cancers, maladies auto-immunes), recherche.", "voir": ["anticorps", "clone"]}, "sous-clone": {"mot": "Sous-clone", "mots": ["sous-clone", "sous-clones"], "definition": "Groupe de cellules d'un clone portant une mutation apparue après le départ, et donc génétiquement distinctes du reste du clone.", "place": "C'est l'unité de base de l'évolution clonale : un secteur blanc dans une colonie rouge de levures, une couleur dans la mosaïque d'une tumeur.", "voir": ["clone", "evolution-clonale", "somatique"]}
, "evolution-clonale": {"mot": "Évolution clonale", "mots": ["évolution clonale"], "definition": "Diversification génétique d'un clone au fil des mitoses, par accumulation de mutations formant des sous-clones successifs.", "place": "Elle explique qu'un organe issu d'une seule cellule-œuf présente des phénotypes différents, et que les cellules d'une même tumeur n'aient pas le même génome.", "piege": "La mitose reste conforme : ce n'est pas elle qui diversifie, ce sont les erreurs non réparées.", "voir": ["sous-clone", "reparation", "tumeur-maligne"]}
, "sequence-regulatrice": {"mot": "Séquence régulatrice", "mots": ["séquence régulatrice", "séquences régulatrices", "site régulateur", "sites régulateurs"], "definition": "Portion d'ADN située hors de la partie codante d'un gène, sur laquelle se fixent des protéines qui commandent sa transcription.", "place": "Une mutation y tombant ne change pas la protéine mais la quantité produite : surexpression ou inactivation. C'est le cas du gène TERT dans les cellules cancéreuses.", "voir": ["tert", "transcription", "mutation"]}
, "tert": {"mot": "Gène TERT", "mots": ["TERT", "Tert"], "definition": "Gène codant une protéine qui confère aux cellules la capacité de se diviser indéfiniment.", "place": "Deux substitutions dans sa séquence régulatrice suffisent à le surexprimer ; on retrouve cette suractivation dans environ 90 % des cellules cancéreuses.", "voir": ["sequence-regulatrice", "tumeur-maligne", "substitution"]}
, "p53": {"mot": "p53", "mots": ["p53", "P53"], "definition": "Protéine suppresseur de tumeur qui se lie à l'ADN lésé et active les gènes de réparation.", "place": "Elle arrête la division le temps de réparer, ou déclenche l'apoptose si les dégâts sont irréparables. Sans elle, les cellules à l'ADN endommagé survivent et accumulent les mutations.", "voir": ["suppresseur", "apoptose", "reparation"]}
, "meiose": {"mot": "Méiose", "mots": ["méiose"], "definition": "Succession de deux divisions cellulaires qui, à partir d'une cellule diploïde, produit quatre cellules haploïdes génétiquement différentes : les gamètes.", "place": "Elle divise le nombre de chromosomes par deux et brasse l'information. Opposée terme à terme à la mitose, qui conserve.", "piege": "La méiose ne fait pas que diviser par deux : c'est aussi le siège des deux brassages.", "voir": ["mitose", "gamete", "brassage-interchromosomique", "brassage-intrachromosomique"]}
, "fecondation": {"mot": "Fécondation", "mots": ["fécondation"], "definition": "Réunion de deux gamètes haploïdes aboutissant à une cellule-œuf diploïde.", "place": "Avec la méiose, elle assure la stabilité du caryotype de l'espèce ; et comme elle combine deux gamètes au hasard, elle multiplie encore la diversité issue des brassages.", "voir": ["meiose", "zygote", "gamete"]}
, "gamete": {"mot": "Gamète", "mots": ["gamète", "gamètes"], "definition": "Cellule reproductrice haploïde : spermatozoïde ou ovule.", "place": "Chaque gamète ne reçoit qu'un exemplaire de chaque paire de chromosomes. C'est ce tri, et non la fécondation, qui crée la diversité initiale.", "voir": ["meiose", "haploide", "fecondation"]}
, "haploide": {"mot": "Haploïde", "mots": ["haploïde", "haploïdes"], "definition": "Se dit d'une cellule ne possédant qu'un seul exemplaire de chaque chromosome, notée n.", "place": "État des gamètes. Chez l'humain, n = 23.", "voir": ["diploide", "gamete"]}
, "diploide": {"mot": "Diploïde", "mots": ["diploïde", "diploïdes"], "definition": "Se dit d'une cellule possédant deux exemplaires de chaque chromosome, réunis en paires d'homologues, notée 2n.", "place": "État des cellules somatiques. Chez l'humain, 2n = 46.", "voir": ["haploide", "homologues"]}
, "zygote": {"mot": "Zygote (cellule-œuf)", "mots": ["zygote", "cellule-œuf"], "definition": "Cellule diploïde formée par la fécondation, à l'origine de toutes les cellules de l'organisme.", "place": "Point de départ du clone que constitue un individu entier : toutes ses cellules en descendent par mitoses.", "voir": ["fecondation", "clone"]}
, "homologues": {"mot": "Chromosomes homologues", "mots": ["chromosomes homologues", "homologues"], "definition": "Les deux chromosomes d'une même paire, portant les mêmes gènes aux mêmes emplacements, mais pas forcément les mêmes allèles.", "place": "L'un vient du père, l'autre de la mère. Leur séparation en anaphase I est le cœur du brassage interchromosomique.", "voir": ["diploide", "brassage-interchromosomique", "allele"]}
, "brassage-interchromosomique": {"mot": "Brassage interchromosomique", "mots": ["brassage interchromosomique"], "definition": "Répartition aléatoire des chromosomes d'origine paternelle et maternelle dans les gamètes, lors de la première division de méiose.", "place": "Il concerne les gènes indépendants. Avec n paires, il produit 2 puissance n gamètes équiprobables : 8 388 608 chez l'humain.", "voir": ["brassage-intrachromosomique", "homologues", "genes-independants"]}
, "brassage-intrachromosomique": {"mot": "Brassage intrachromosomique", "mots": ["brassage intrachromosomique"], "definition": "Échange de segments entre chromatides non sœurs de chromosomes homologues, en prophase de première division de méiose.", "place": "Il concerne les gènes liés et casse leur solidarité. Comme il n'a pas lieu dans toutes les cellules, les gamètes recombinés restent minoritaires.", "voir": ["crossing-over", "genes-lies", "brassage-interchromosomique"]}
, "crossing-over": {"mot": "Crossing-over (enjambement)", "mots": ["crossing-over", "enjambement"], "definition": "Cassure puis échange réciproque de segments entre deux chromatides non sœurs appariées.", "place": "Mécanisme concret du brassage intrachromosomique. Il laisse deux chromatides parentales et deux chromatides recombinées.", "voir": ["chiasma", "brassage-intrachromosomique", "recombine"]}
, "chiasma": {"mot": "Chiasma", "mots": ["chiasma", "chiasmas"], "definition": "Point de croisement visible entre deux chromatides non sœurs lors de l'appariement des homologues.", "place": "C'est la figure observable du crossing-over. Sa position varie d'une cellule à l'autre, ce qui multiplie les combinaisons possibles.", "voir": ["crossing-over"]}
, "test-cross": {"mot": "Test-cross (croisement-test)", "mots": ["test-cross", "croisement-test", "croisement test"], "definition": "Croisement entre un individu double hétérozygote et un individu double homozygote récessif.", "place": "Outil central du chapitre : le parent récessif ne masque rien, donc les phénotypes obtenus reflètent directement les gamètes produits par la F1. Les proportions révèlent si les gènes sont liés ou indépendants.", "voir": ["genes-lies", "genes-independants", "recombine"]}
, "lignee-pure": {"mot": "Lignée pure", "mots": ["lignée pure", "lignées pures"], "definition": "Lignée dont un caractère reste inchangé de génération en génération, car elle est homozygote pour le gène considéré.", "place": "Obtenue par autofécondation. C'est le point de départ obligatoire de tout croisement exploitable : chaque parent ne transmet qu'une version du caractère.", "voir": ["hybridation", "homozygote"]}
, "hybridation": {"mot": "Hybridation", "mots": ["hybridation", "hybridations"], "definition": "Croisement entre deux variétés d'une même espèce, obtenu en contrôlant la fécondation.", "place": "Méthode expérimentale de Mendel chez le pois. Elle suppose d'empêcher l'autopollinisation naturelle.", "voir": ["lignee-pure", "monohybridisme"]}
, "monohybridisme": {"mot": "Monohybridisme", "mots": ["monohybridisme", "mono-hybridisme"], "definition": "Hybridation entre deux lignées pures ne différant que par un seul caractère.", "place": "C'est le montage qui a permis à Mendel d'isoler l'effet d'un gène à la fois, et d'établir la dominance puis la ségrégation.", "voir": ["hybridation", "dominant"]}
, "genes-lies": {"mot": "Gènes liés (partiellement liés)", "mots": ["gènes partiellement liés", "gènes liés", "gène lié", "partiellement liés"], "definition": "Gènes portés par la même paire de chromosomes, dont les allèles tendent à être transmis ensemble.", "place": "Signature dans un test-cross : deux phénotypes majoritaires (parentaux) et deux minoritaires (recombinés), au lieu de quatre classes égales.", "voir": ["genes-independants", "crossing-over", "test-cross"]}
, "genes-independants": {"mot": "Gènes indépendants", "mots": ["gènes indépendants", "gène indépendant"], "definition": "Gènes portés par des paires de chromosomes différentes, dont les allèles se répartissent sans influence mutuelle.", "place": "Signature dans un test-cross : quatre phénotypes à 25 % chacun. C'est le cas qui vérifie la troisième loi de Mendel.", "voir": ["genes-lies", "brassage-interchromosomique"]}
, "recombine": {"mot": "Phénotype recombiné", "mots": ["recombiné", "recombinés", "phénotypes recombinés", "phénotype recombiné"], "definition": "Phénotype portant une combinaison d'allèles nouvelle, différente de celle des deux parents.", "place": "C'est là qu'est créée la diversité génétique. À opposer aux phénotypes parentaux, qui reproduisent les combinaisons de départ.", "voir": ["parental", "crossing-over", "test-cross"]}
, "parental": {"mot": "Phénotype parental", "mots": ["phénotype parental", "phénotypes parentaux", "parentaux"], "definition": "Phénotype reproduisant une combinaison d'allèles déjà présente dans la génération parentale.", "place": "Avec des gènes liés, ils sont majoritaires : c'est cette dissymétrie qui révèle la liaison.", "voir": ["recombine", "genes-lies"]}, "prophase-1": {"mot": "Prophase I", "mots": ["prophase I"], "definition": "Première étape de la méiose : les chromosomes se condensent et les homologues s'apparient étroitement, formant des bivalents.", "place": "C'est la seule étape où peut se produire le crossing-over, donc le siège du brassage intrachromosomique.", "voir": ["appariement", "crossing-over", "bivalent"]}
, "metaphase-1": {"mot": "Métaphase I", "mots": ["métaphase I"], "definition": "Étape où les paires de chromosomes homologues se placent de part et d'autre du plan équatorial, dans une position aléatoire.", "place": "Elle <b>prépare</b> le brassage interchromosomique : c'est ici que le hasard décide de quel côté chaque paire se range.", "piege": "En métaphase I ce sont des <b>paires</b> qui s'alignent ; en métaphase de mitose, des chromosomes individuels.", "voir": ["anaphase-1", "brassage-interchromosomique", "plaque-equatoriale"]}
, "anaphase-1": {"mot": "Anaphase I", "mots": ["anaphase I"], "definition": "Étape où les deux chromosomes de chaque paire se séparent et migrent vers les pôles opposés.", "place": "Elle <b>effectue</b> le brassage interchromosomique et fait passer la cellule de 2n à n. Chaque chromosome garde ses deux chromatides.", "piege": "L'anaphase I sépare les <b>homologues</b> ; c'est l'anaphase II qui sépare les chromatides.", "voir": ["metaphase-1", "brassage-interchromosomique", "homologues"]}
, "autofecondation": {"mot": "Autofécondation", "mots": ["autofécondation", "autopollinisation"], "definition": "Fécondation d'un individu par ses propres gamètes.", "place": "C'est le procédé qui permet d'obtenir et d'entretenir une lignée pure, et celui que Mendel a utilisé pour produire sa génération F2.", "voir": ["lignee-pure", "hybridation"]}
, "codominance": {"mot": "Codominance", "mots": ["codominants", "codominant", "codominance", "codominante"], "definition": "Situation où deux allèles d'un même gène s'expriment tous les deux chez l'hétérozygote, sans qu'aucun ne masque l'autre.", "place": "Le groupe sanguin AB en est l'exemple du programme : A et B sont codominants, alors que tous deux dominent O.", "voir": ["dominant", "recessif"]}
, "locus": {"mot": "Locus", "mots": ["locus"], "definition": "Emplacement précis et fixe qu'occupe un gène sur un chromosome.", "place": "Les allèles d'un même gène occupent le même locus sur les deux homologues. La distance entre deux locus conditionne la fréquence des crossing-over entre eux.", "voir": ["gene", "crossing-over", "genes-lies"]}

{
  id:"p1", num:"1", title:"Les divisions cellulaires des eucaryotes",
  lede:"Comment une cellule transmet-elle un patrimoine génétique identique à ses descendantes ?",
  notions:["cycle cellulaire","mitose","chromatide","caryotype","clone"],
  html:`
<h2>1. Le cycle cellulaire</h2>
<p>Toute cellule issue d'une division suit un <span class="kw">cycle cellulaire</span> qui alterne deux grandes périodes :</p>
<ul>
  <li><b>L'interphase</b> (la plus longue) : phase <b>G1</b> (croissance), phase <b>S</b> (réplication de l'ADN), phase <b>G2</b> (préparation).</li>
  <li><b>La mitose</b> : la division proprement dite, suivie de la <b>cytodiérèse</b> (partage du cytoplasme).</li>
</ul>
<div class="box def"><h4>Le point clé quantitatif</h4>
<p>Pendant la phase S, chaque chromosome passe de <b>1 à 2 chromatides</b> : la <b>quantité d'ADN double</b>, mais le <b>nombre de chromosomes ne change pas</b>. En anaphase, les chromatides se séparent : la quantité d'ADN par cellule est divisée par deux, le nombre de chromosomes reste identique.</p></div>

<h2>2. Les quatre phases de la mitose</h2>
<div data-schema="mitose"></div>

<h2>3. Ce que la mitose garantit</h2>
<p>La mitose produit deux cellules filles <b>génétiquement identiques entre elles et à la cellule mère</b> : ce sont des <span class="kw">clones</span>. Cette conformité repose sur deux mécanismes enchaînés :</p>
<ol>
  <li>la <b>réplication semi-conservative</b> de l'ADN en phase S, qui fabrique une copie exacte ;</li>
  <li>la <b>séparation rigoureuse des chromatides sœurs</b> en anaphase, qui répartit une copie dans chaque cellule fille.</li>
</ol>
<p>Chez un organisme pluricellulaire, la mitose assure la <b>croissance</b>, le <b>renouvellement</b> des tissus (peau, sang, épithélium intestinal) et la <b>réparation</b>. Chez les organismes unicellulaires, elle assure la reproduction asexuée.</p>

<h2>4. Le caryotype</h2>
<p>Le <span class="kw">caryotype</span> est la photographie ordonnée des chromosomes d'une cellule, réalisée en <b>métaphase</b> (moment où ils sont le plus condensés). Chez l'humain : <b>23 paires</b>, soit 46 chromosomes, dont une paire de chromosomes sexuels (XX ou XY). Il révèle les anomalies de nombre (trisomie 21) ou de structure (délétion, translocation).</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« Après la mitose, la cellule fille a deux fois moins de chromosomes. » <b>Faux.</b> Elle a le <b>même nombre de chromosomes</b> (46 chez l'humain), mais chacun n'a plus qu'<b>une chromatide</b>. Toujours raisonner séparément sur le <b>nombre de chromosomes</b> et la <b>quantité d'ADN</b> — c'est exactement ce qu'on attend de toi pour lire un graphique d'évolution de la quantité d'ADN au cours du cycle.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Cycle = interphase (G1–S–G2) + mitose.</li>
<li>Phase S : quantité d'ADN ×2, nombre de chromosomes inchangé.</li>
<li>P-M-A-T : condensation → alignement → séparation des chromatides → reconstitution des noyaux.</li>
<li>Résultat : deux cellules filles clones.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>En Terminale, tu compareras la mitose à la <b>méiose</b>, qui réalise l'inverse : deux divisions successives, un seul doublement de l'ADN, et une <b>production de diversité</b> (brassage interchromosomique et intrachromosomique). Tout le chapitre « L'origine du génotype des individus » repose sur la maîtrise du schéma de la mitose.</p></div>`
},

/* ---------------- P2 ---------------- */
{
  id:"p2", num:"2", title:"La réplication de l'ADN",
  lede:"Comment une molécule d'ADN est-elle copiée à l'identique, et pourquoi cette copie n'est-elle jamais parfaite ?",
  notions:["semi-conservative","ADN polymérase","complémentarité","œil de réplication","fidélité"],
  html:`
<h2>1. Un mécanisme semi-conservatif</h2>
<p>L'expérience de <b>Meselson et Stahl</b> (1958), sur des bactéries cultivées sur azote lourd puis léger, a tranché entre trois hypothèses. Résultat : chaque molécule fille est constituée d'<b>un brin parental et d'un brin néoformé</b>. On parle de réplication <span class="kw">semi-conservative</span>.</p>

<h2>2. Le déroulement à la fourche de réplication</h2>
<div data-schema="replication"></div>

<h2>3. Pourquoi la copie est fidèle</h2>
<p>La fidélité repose entièrement sur la <span class="kw">complémentarité des bases</span> : A avec T, C avec G. Chaque brin parental sert de <b>matrice</b>, donc la séquence de la molécule fille est entièrement déterminée par celle de la molécule mère. L'ADN polymérase possède en outre une activité de <b>relecture</b> qui corrige la plupart des erreurs d'appariement.</p>
<p>Ordre de grandeur : environ <b>une erreur non corrigée pour 10⁹ à 10¹⁰ nucléotides</b> répliqués. C'est très peu… mais sur 3 milliards de paires de bases et des milliards de cellules, cela reste une source permanente de nouveaux allèles.</p>

<div class="box plus"><h4>Approfondir — pourquoi tant d'origines de réplication ?</h4>
<p>L'ADN polymérase avance à environ 50 nucléotides par seconde chez l'humain. À une seule origine, copier un chromosome prendrait des semaines. Avec des <b>dizaines de milliers d'origines</b> fonctionnant en parallèle et de façon bidirectionnelle, la phase S ne dure que quelques heures. C'est un raisonnement quantitatif typique d'exercice : compare toujours la longueur à copier, la vitesse et la durée disponible.</p></div>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>Ne confonds pas <b>réplication</b> (ADN → ADN, dans le noyau, en phase S, pour transmettre l'information) et <b>transcription</b> (ADN → ARN, à tout moment, pour exprimer l'information). Le vocabulaire du sujet suffit souvent à trancher : « polymérase » seule = ADN polymérase ; « ARN polymérase » = transcription.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Réplication semi-conservative, démontrée par Meselson et Stahl.</li>
<li>Ouverture par l'hélicase → fourche → deux brins matrices.</li>
<li>Synthèse 5'→3' : un brin continu, un brin discontinu (fragments d'Okazaki).</li>
<li>Fidélité assurée par la complémentarité + relecture ; erreurs résiduelles = mutations.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Les erreurs de réplication sont la matière première de l'évolution : en Terminale, tu verras comment ces variations, une fois soumises à la <b>dérive génétique</b> et à la <b>sélection naturelle</b>, font évoluer la fréquence des allèles dans une population.</p></div>`
},

/* ---------------- P3 ---------------- */
{
  id:"p3", num:"3", title:"L'expression du patrimoine génétique",
  lede:"Comment l'information portée par un gène devient-elle une protéine, et pourquoi y a-t-il beaucoup plus de protéines que de gènes ?",
  notions:["transcription","épissage alternatif","code génétique","traduction","phénotype"],
  html:`
<h2>1. Du gène à la protéine : deux étapes séparées</h2>
<div data-schema="expression"></div>

<h2>2. Le code génétique</h2>
<p>Le <span class="kw">code génétique</span> est la table de correspondance entre les <b>codons</b> (triplets de nucléotides de l'ARNm) et les acides aminés. Ses propriétés sont à connaître par cœur :</p>
<div class="tablewrap"><table>
<tr><th>Propriété</th><th>Signification</th><th>Conséquence</th></tr>
<tr><td><b>Universel</b></td><td>Le même chez presque tous les êtres vivants</td><td>Preuve d'une origine commune ; rend possibles les OGM et la production d'insuline humaine par des bactéries</td></tr>
<tr><td><b>Redondant</b></td><td>64 codons pour 20 acides aminés</td><td>Une mutation peut être <b>silencieuse</b> (même acide aminé malgré le changement de nucléotide)</td></tr>
<tr><td><b>Non ambigu</b></td><td>Un codon = un seul acide aminé</td><td>La lecture est sans équivoque</td></tr>
<tr><td><b>Ponctué</b></td><td>AUG initiateur, UAA/UAG/UGA stop</td><td>Une mutation créant un codon stop tronque brutalement la protéine</td></tr>
</table></div>

<h2>3. Un gène, plusieurs protéines</h2>
<p>L'humain compte environ <b>20 000 gènes</b> mais fabrique <b>plusieurs centaines de milliers de protéines</b>. L'explication principale est l'<span class="kw">épissage alternatif</span> : selon les exons retenus, un même pré-ARNm donne des ARNm différents, donc des protéines différentes, souvent selon le type cellulaire. S'y ajoutent les modifications chimiques de la protéine après traduction.</p>

<h2>4. Du génotype au phénotype</h2>
<p>La séquence des nucléotides détermine la séquence des acides aminés, qui détermine la <b>structure tridimensionnelle</b> de la protéine, donc sa <b>fonction</b>. Le phénotype macroscopique n'est que la conséquence visible du phénotype moléculaire. Mais toutes les cellules d'un organisme ont le même génome : ce qui les différencie, c'est <b>quels gènes y sont exprimés</b>, et l'environnement module cette expression.</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« L'ARNm est traduit dans le noyau. » <b>Faux</b> chez les eucaryotes : la traduction se fait dans le <b>cytoplasme</b>, par les ribosomes. Autre confusion fréquente : le <b>codon</b> est sur l'ARNm, l'<b>anticodon</b> sur l'ARNt ; le triplet correspondant sur l'ADN n'est pas un codon.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Transcription (noyau) → maturation/épissage → traduction (cytoplasme).</li>
<li>ARN : uracile à la place de la thymine, simple brin, ribose.</li>
<li>Code génétique universel, redondant, non ambigu, ponctué.</li>
<li>Épissage alternatif : un gène → plusieurs protéines.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>L'universalité du code génétique est l'un des arguments majeurs du chapitre « <b>complexification des génomes</b> » : c'est parce que le code est partagé que des <b>transferts horizontaux</b> de gènes entre espèces différentes peuvent fonctionner.</p></div>`
},

/* ---------------- P4 ---------------- */
{
  id:"p4", num:"4", title:"Les enzymes et leurs propriétés catalytiques",
  lede:"Comment une protéine peut-elle rendre possible, à 37 °C, une réaction qui n'aurait autrement pas lieu ?",
  notions:["catalyseur","site actif","spécificité","énergie d'activation","cofacteur"],
  html:`
<h2>1. Qu'est-ce qu'un catalyseur biologique ?</h2>
<p>Une <span class="kw">enzyme</span> est une protéine qui <b>accélère une réaction chimique</b> sans être consommée ni modifiée en fin de réaction. Elle ne crée pas la réaction et ne change pas son sens : elle abaisse l'<b>énergie d'activation</b>, c'est-à-dire la barrière énergétique à franchir.</p>

<h2>2. Le site actif</h2>
<div data-schema="enzyme"></div>

<h2>3. Deux spécificités à distinguer</h2>
<div class="tablewrap"><table>
<tr><th></th><th>Spécificité de substrat</th><th>Spécificité d'action</th></tr>
<tr><td>Définition</td><td>L'enzyme ne reconnaît qu'un substrat (ou une famille très proche)</td><td>L'enzyme ne catalyse qu'un seul type de réaction</td></tr>
<tr><td>Origine</td><td>Complémentarité de forme site actif / substrat</td><td>Nature des acides aminés catalytiques du site actif</td></tr>
<tr><td>Exemple</td><td>La saccharase n'hydrolyse que le saccharose</td><td>Une hydrolase ne fait que des hydrolyses, jamais des synthèses</td></tr>
</table></div>

<h2>4. Ce qui modifie l'activité enzymatique</h2>
<ul>
  <li><b>La température</b> : l'activité augmente jusqu'à un optimum puis <b>chute brutalement</b> car la protéine se <b>dénature</b> (le site actif perd sa forme). C'est irréversible.</li>
  <li><b>Le pH</b> : chaque enzyme a un pH optimal (pepsine ≈ 2 dans l'estomac, amylase ≈ 7).</li>
  <li><b>La concentration en substrat</b> : la vitesse augmente puis atteint un <b>palier de saturation</b> — toutes les enzymes sont occupées.</li>
  <li><b>Les inhibiteurs</b> : compétitifs (ils occupent le site actif) ou non compétitifs (ils déforment l'enzyme ailleurs). De nombreux médicaments sont des inhibiteurs enzymatiques.</li>
  <li><b>Les cofacteurs</b> : ions ou vitamines indispensables à certaines enzymes.</li>
</ul>

<div class="box plus"><h4>Approfondir — lire une courbe de saturation</h4>
<p>Face à une courbe vitesse = f([substrat]), le raisonnement attendu est en deux temps : (1) <b>partie linéaire</b> — les sites actifs sont libres, plus il y a de substrat, plus il y a de rencontres ; (2) <b>plateau</b> — tous les sites actifs sont occupés en permanence, la vitesse ne dépend plus que de la quantité d'enzyme. Ajouter de l'enzyme relève le plateau ; ajouter du substrat ne change rien.</p></div>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>Ne dis jamais qu'une enzyme est « tuée » ou « détruite » par la chaleur : elle est <b>dénaturée</b>, sa structure tridimensionnelle est défaite. Et ne dis pas qu'elle « rend la réaction possible » : la réaction était thermodynamiquement possible, elle était seulement <b>trop lente</b>.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Enzyme = catalyseur biologique, non consommé, réutilisable.</li>
<li>Site actif = poche de quelques acides aminés, complémentaire du substrat.</li>
<li>Double spécificité : de substrat et d'action.</li>
<li>Activité modulée par température, pH, concentrations, inhibiteurs.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Tu retrouveras les enzymes partout : dans la <b>photosynthèse</b> (RuBisCO), dans la <b>contraction musculaire</b> et la régénération de l'ATP, dans la <b>glycolyse</b>, et dans les mécanismes de <b>résistance bactérienne</b> (bêta-lactamases qui détruisent les antibiotiques).</p></div>`
},

/* ---------------- P5 ---------------- */
{
  id:"p5", num:"5", title:"Mutations de l'ADN et variabilité génétique",
  lede:"D'où vient la diversité des allèles, et pourquoi toutes les mutations n'ont-elles pas les mêmes conséquences ?",
  notions:["mutation","agent mutagène","réparation","germinale / somatique","allèle"],
  html:`
<h2>1. Trois types de mutations ponctuelles</h2>
<div class="tablewrap"><table>
<tr><th>Type</th><th>Description</th><th>Conséquence sur la protéine</th></tr>
<tr><td><b>Substitution</b></td><td>Un nucléotide remplacé par un autre</td><td>Souvent limitée : mutation <b>silencieuse</b> (code redondant), <b>faux-sens</b> (1 acide aminé changé) ou <b>non-sens</b> (codon stop précoce)</td></tr>
<tr><td><b>Délétion</b></td><td>Perte d'un ou plusieurs nucléotides</td><td>Grave si le nombre perdu n'est pas multiple de 3 : <b>décalage du cadre de lecture</b>, toute la suite est fausse</td></tr>
<tr><td><b>Insertion / addition</b></td><td>Ajout d'un ou plusieurs nucléotides</td><td>Même logique : décalage du cadre de lecture</td></tr>
</table></div>

<h2>2. Origine des mutations</h2>
<ul>
  <li><b>Spontanées</b> : erreurs de l'ADN polymérase non corrigées lors de la réplication. Rares mais inévitables.</li>
  <li><b>Induites par des agents mutagènes</b> : <b>UV</b> (dimères de thymine), rayonnements ionisants, substances chimiques (benzopyrène du tabac), certains virus.</li>
</ul>
<p>Les cellules disposent de <b>systèmes de réparation</b> très efficaces qui reconnaissent et corrigent la plupart des lésions. Une mutation ne s'installe que si la réparation échoue <b>avant</b> la réplication suivante.</p>

<h2>3. Germinale ou somatique : une distinction décisive</h2>
<div class="box def"><h4>La distinction à ne jamais rater</h4>
<ul>
<li><b>Mutation somatique</b> — dans une cellule de l'organisme. Elle n'affecte que le clone issu de cette cellule, <b>n'est pas transmise à la descendance</b>. C'est le point de départ des cancers.</li>
<li><b>Mutation germinale</b> — dans une cellule de la lignée reproductrice. Elle est <b>transmissible aux descendants</b> et peut devenir un nouvel allèle dans la population.</li>
</ul></div>

<h2>4. Mutations et diversité</h2>
<p>Les mutations sont la <b>seule source de nouveaux allèles</b>. Elles sont <b>aléatoires</b> : elles ne surviennent pas parce que l'organisme en aurait besoin. Leurs effets vont du neutre (le plus fréquent) au délétère, et parfois au bénéfique dans un environnement donné. C'est ensuite l'environnement qui trie.</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« Les bactéries mutent <i>pour</i> résister à l'antibiotique. » <b>Faux et lourdement sanctionné.</b> Les mutations préexistent, au hasard ; l'antibiotique ne fait que <b>sélectionner</b> les bactéries déjà résistantes. Bannis tout vocabulaire finaliste (« pour », « afin de », « la nature a voulu »).</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Substitution, délétion, insertion ; décalage du cadre de lecture si non multiple de 3.</li>
<li>Spontanées ou induites (UV, radiations, chimie) ; systèmes de réparation.</li>
<li>Somatique = non transmise ; germinale = transmise.</li>
<li>Mutations aléatoires = seule source de nouveaux allèles.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Ce chapitre est le socle direct de « <b>L'inéluctable évolution des génomes au sein des populations</b> » : mutation (source de variation) → dérive et sélection (tri) → évolution des fréquences alléliques, quantifiée par le modèle de <b>Hardy-Weinberg</b>.</p></div>`
},

  html:`
<h2>1. Une espèce peu diverse, mais informative</h2>
<p>Deux humains pris au hasard partagent environ <b>99,9 % de leur séquence d'ADN</b>. Les différences, appelées <span class="kw">polymorphismes</span> (souvent des SNP, substitutions d'un seul nucléotide), sont malgré tout des milliers de marqueurs exploitables. Plus deux populations partagent de polymorphismes, plus elles ont divergé récemment.</p>
<p>Point contre-intuitif à connaître : la <b>diversité génétique est maximale en Afrique</b>, et diminue à mesure qu'on s'éloigne du continent africain — la signature d'une <b>expansion à partir de l'Afrique</b> par vagues successives de petits effectifs.</p>

<h2>2. L'ADN ancien</h2>
<p>Le séquençage d'ADN fossile (Néandertal, Denisova) a établi que <i>Homo sapiens</i> s'est <b>croisé</b> avec ces populations :</p>
<ul>
  <li><b>1 à 4 % d'ADN néandertalien</b> chez les humains non africains actuels ;</li>
  <li><b>jusqu'à 5 % d'ADN dénisovien</b> chez les populations d'Océanie.</li>
</ul>
<p>Ces lignées ne forment donc pas un arbre strictement ramifié : il faut penser en <b>réseau</b>, avec des flux de gènes entre lignées.</p>

<h2>3. Des marqueurs à transmission particulière</h2>
<div class="tablewrap"><table>
<tr><th>Marqueur</th><th>Transmission</th><th>Ce qu'il retrace</th></tr>
<tr><td><b>ADN mitochondrial</b></td><td>Uniquement par la mère</td><td>Les lignées maternelles</td></tr>
<tr><td><b>Chromosome Y</b></td><td>De père en fils</td><td>Les lignées paternelles</td></tr>
<tr><td><b>ADN nucléaire autosomique</b></td><td>Les deux parents, avec brassage</td><td>L'ensemble des ancêtres, mais mélangé</td></tr>
</table></div>

<h2>4. Une évolution encore active</h2>
<p>Certains allèles ont été <b>sélectionnés très récemment</b>, à l'échelle de quelques milliers d'années :</p>
<ul>
  <li>la <b>persistance de la lactase</b> à l'âge adulte, sélectionnée dans les populations d'éleveurs ;</li>
  <li>l'adaptation à l'<b>altitude</b> chez les Tibétains, via un allèle hérité des Dénisoviens ;</li>
  <li>la <b>drépanocytose</b> à l'état hétérozygote, qui protège partiellement du paludisme.</li>
</ul>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>Les « races humaines » n'ont <b>aucun fondement génétique</b> : la variabilité génétique <b>à l'intérieur</b> d'une population est bien plus grande qu'entre populations. Un raisonnement solide s'appuie sur ce chiffre, pas sur des impressions.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>99,9 % d'identité entre humains ; diversité maximale en Afrique.</li>
<li>Métissages avec Néandertal (1–4 %) et Denisova (jusqu'à 5 % en Océanie).</li>
<li>ADN mitochondrial = lignée maternelle ; chromosome Y = lignée paternelle.</li>
<li>La sélection naturelle agit encore sur notre espèce.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Ce chapitre prépare directement l'étude des <b>mécanismes de diversification</b> et de la <b>spéciation</b> : Néandertal et <i>sapiens</i> pouvaient se reproduire ensemble — cela interroge la définition même de l'espèce, un débat que tu traiteras en Terminale.</p></div>`
}

{
  id:"p7", num:"7", title:"La structure du globe terrestre",
  lede:"Comment connaît-on l'intérieur de la Terre alors que le forage le plus profond n'atteint que 12 km ?",
  notions:["ondes sismiques","discontinuité","Moho","LVZ","lithosphère / asthénosphère"],
  html:`
<h2>1. Les ondes sismiques, sondes du globe</h2>
<ul>
  <li><b>Ondes P</b> (primaires) : ondes de compression, les plus rapides, se propagent dans les <b>solides et les liquides</b>.</li>
  <li><b>Ondes S</b> (secondaires) : ondes de cisaillement, plus lentes, <b>bloquées par les liquides</b>.</li>
</ul>
<p>La vitesse des ondes dépend des propriétés du milieu (densité, rigidité, état). Une <b>variation brutale de vitesse</b> signale un changement de milieu : c'est une <span class="kw">discontinuité</span>. Une <b>zone d'ombre</b> pour les ondes S entre 103° et 180° de l'épicentre a permis d'affirmer que le noyau externe est <b>liquide</b>.</p>

<h2>2. Deux découpages superposés</h2>
<div data-schema="globe"></div>

<h2>3. Les discontinuités à connaître</h2>
<div class="tablewrap"><table>
<tr><th>Discontinuité</th><th>Profondeur</th><th>Sépare</th></tr>
<tr><td><b>Moho</b> (Mohorovičić)</td><td>~7 km sous les océans, ~30 km sous les continents</td><td>Croûte / manteau — c'est une limite <b>chimique</b></td></tr>
<tr><td><b>LVZ</b> (zone à moindre vitesse)</td><td>~100–200 km</td><td>Lithosphère / asthénosphère — limite <b>mécanique</b></td></tr>
<tr><td><b>Gutenberg</b></td><td>2900 km</td><td>Manteau / noyau externe (disparition des ondes S)</td></tr>
<tr><td><b>Lehmann</b></td><td>5100 km</td><td>Noyau externe liquide / graine solide</td></tr>
</table></div>

<h2>4. La chaleur interne</h2>
<p>Le <b>flux géothermique</b> provient à environ 80 % de la <b>désintégration d'éléments radioactifs</b> (uranium, thorium, potassium) dans le manteau et la croûte, le reste étant la chaleur résiduelle de l'accrétion. Il est très inégalement réparti : <b>fort aux dorsales</b>, faible dans les vieux domaines continentaux. Deux modes de transfert : la <b>conduction</b> (dans la lithosphère rigide) et la <b>convection</b> (dans le manteau, bien plus efficace).</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>Ne mélange pas les deux découpages. <b>Croûte / manteau</b> = critère <b>chimique</b> (nature des roches). <b>Lithosphère / asthénosphère</b> = critère <b>mécanique</b> (rigide / ductile). La lithosphère contient la croûte ET le sommet du manteau : dire « la lithosphère, c'est la croûte » est une erreur classique.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Ondes P partout, ondes S seulement dans les solides.</li>
<li>Moho = limite chimique ; LVZ = limite mécanique.</li>
<li>Noyau externe liquide (zone d'ombre des ondes S), graine solide.</li>
<li>Chaleur interne surtout radioactive ; conduction + convection.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Ces notions sont indispensables pour « <b>Les traces du passé mouvementé de la Terre</b> » : reconnaître une <b>ophiolite</b>, comprendre l'épaississement crustal d'une chaîne de montagnes ou dater un métamorphisme suppose de savoir ce qu'est une croûte, un manteau et une lithosphère.</p></div>`
},

{
  id:"p8", num:"8", title:"La dynamique de la lithosphère",
  lede:"Qu'est-ce qui met les plaques en mouvement, et que deviennent-elles ?",
  notions:["accrétion","subduction","densité","convection","slab pull"],
  html:`
<h2>1. Naissance et mort de la lithosphère océanique</h2>
<div data-schema="tectonique"></div>

<h2>2. Le moteur : une histoire de densité</h2>
<p>Le mécanisme central du chapitre tient en une chaîne logique qu'il faut savoir dérouler :</p>
<ol>
  <li>À la dorsale, la lithosphère océanique est <b>chaude, mince et peu dense</b> (moins dense que l'asthénosphère).</li>
  <li>En s'éloignant, elle <b>refroidit</b> ; l'isotherme 1300 °C s'enfonce, donc la lithosphère <b>s'épaissit</b>.</li>
  <li>En refroidissant, elle se <b>contracte et se densifie</b>.</li>
  <li>Au-delà de <b>~30 millions d'années</b>, sa densité dépasse celle de l'asthénosphère : elle devient <b>instable</b>.</li>
  <li>Elle plonge alors sous son propre poids : c'est la <b>traction de la plaque plongeante</b> (<i>slab pull</i>), moteur principal du déplacement.</li>
</ol>
<p>La convection du manteau et la poussée à la dorsale (<i>ridge push</i>) y contribuent, mais le <i>slab pull</i> reste dominant : les plaques qui possèdent une longue zone de subduction sont aussi les plus rapides.</p>

<h2>3. Deux magmatismes à ne pas confondre</h2>
<div class="tablewrap"><table>
<tr><th></th><th>Dorsale</th><th>Zone de subduction</th></tr>
<tr><td>Cause de la fusion</td><td><b>Décompression</b> (remontée de l'asthénosphère)</td><td><b>Hydratation</b> (eau libérée par la plaque plongeante)</td></tr>
<tr><td>Roche fondue</td><td>Péridotite</td><td>Péridotite du manteau sus-jacent</td></tr>
<tr><td>Magma</td><td>Fluide, basaltique</td><td>Visqueux, riche en silice et en gaz</td></tr>
<tr><td>Roches formées</td><td>Basalte (rapide) et gabbro (lent)</td><td>Andésite / rhyolite et granodiorite</td></tr>
<tr><td>Volcanisme</td><td>Effusif</td><td><b>Explosif</b></td></tr>
</table></div>
<p>Dans les deux cas, la fusion est <b>partielle</b> : seule une fraction de la péridotite fond, ce qui explique que le magma ait une composition différente de la roche mère.</p>

<h2>4. Les preuves du mouvement</h2>
<ul>
  <li>Les <b>anomalies magnétiques</b> du plancher océanique, symétriques de part et d'autre de la dorsale, qui enregistrent les inversions du champ magnétique.</li>
  <li>L'<b>âge du plancher</b> qui augmente régulièrement avec la distance à la dorsale (aucun plancher océanique n'a plus de 200 Ma).</li>
  <li>Les mesures <b>GPS</b> actuelles, de l'ordre de quelques centimètres par an.</li>
  <li>La répartition des <b>séismes et volcans</b>, qui dessine les frontières de plaques.</li>
</ul>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« La plaque plonge parce que l'autre la pousse. » <b>Non</b> : elle plonge parce qu'elle est devenue <b>plus dense que l'asthénosphère</b>. Et l'eau ne fait pas fondre la plaque plongeante : elle <b>abaisse le point de fusion de la péridotite du manteau situé au-dessus</b>. C'est une confusion très fréquente et très pénalisée.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Dorsale : accrétion, fusion partielle par décompression, basalte + gabbro.</li>
<li>Vieillissement : refroidissement → épaississement → densification.</li>
<li>Subduction : slab pull, plan de Bénioff, fusion par hydratation, volcanisme explosif.</li>
<li>Preuves : anomalies magnétiques, âge du plancher, GPS.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Prérequis direct du thème « <b>À la recherche du passé géologique</b> » : reconnaître les <b>ophiolites</b> (restes d'une lithosphère océanique disparue) et les marqueurs d'une <b>collision continentale</b> suppose de maîtriser ce cycle.</p></div>`
}
      ]
    }
  ]
},

{
  id:"p9", num:"9", title:"Écosystèmes, dynamique et services environnementaux",
  lede:"Comment fonctionne un écosystème, qu'est-ce qui le déstabilise, et que nous apporte-t-il ?",
  notions:["biocénose / biotope","réseau trophique","résilience","agrosystème","services écosystémiques"],
  html:`
<h2>1. Définir un écosystème</h2>
<div class="box def"><h4>Vocabulaire de base</h4>
<p><b>Écosystème</b> = <b>biocénose</b> (ensemble des êtres vivants) + <b>biotope</b> (milieu physico-chimique : sol, climat, eau) + <b>l'ensemble de leurs interactions</b>. Oublier le troisième terme, c'est perdre l'essentiel de la définition.</p></div>
<p>Les interactions sont de plusieurs types : <b>trophiques</b> (qui mange qui), mais aussi <b>compétition</b>, <b>prédation</b>, <b>coopération</b>, <b>symbiose</b> (mycorhizes entre champignons et racines, indispensables à l'absorption minérale) ou <b>parasitisme</b>.</p>

<h2>2. Flux d'énergie et cycle de la matière</h2>
<div data-schema="ecosysteme"></div>

<h2>3. Perturbations et résilience</h2>
<p>Un écosystème n'est pas figé : il est en <b>équilibre dynamique</b>. Face à une perturbation (incendie, tempête, pollution, espèce invasive), deux issues :</p>
<ul>
  <li>la <b>résilience</b> : l'écosystème retrouve progressivement un état comparable, par une <b>succession écologique</b> (sol nu → herbacées → arbustes → forêt) ;</li>
  <li>le <b>basculement</b> : si la perturbation est trop intense ou trop répétée, l'écosystème bascule vers un <b>nouvel état stable, différent</b>, sans retour possible à court terme.</li>
</ul>
<p>La <b>biodiversité est un facteur de résilience</b> : plus les espèces sont nombreuses et les liens trophiques redondants, plus la disparition d'une espèce peut être compensée.</p>

<h2>4. L'agrosystème, un écosystème sous contrôle</h2>
<div class="tablewrap"><table>
<tr><th></th><th>Écosystème naturel</th><th>Agrosystème</th></tr>
<tr><td>Biodiversité</td><td>Élevée</td><td>Faible (souvent une seule espèce, voire une variété)</td></tr>
<tr><td>Cycle de la matière</td><td>Fermé, recyclage complet</td><td><b>Ouvert</b> : la récolte exporte la matière → il faut <b>fertiliser</b></td></tr>
<tr><td>Énergie</td><td>Solaire uniquement</td><td>Solaire + intrants, machines, transport (énergie fossile)</td></tr>
<tr><td>Stabilité</td><td>Résilience élevée</td><td>Fragile, dépendant des interventions humaines</td></tr>
</table></div>
<p>Conséquences des pratiques intensives : <b>eutrophisation</b> des eaux (excès d'azote et de phosphore → prolifération d'algues → anoxie → mortalité), érosion des sols, résistances aux pesticides, effondrement des pollinisateurs.</p>

<h2>5. Les services écosystémiques</h2>
<ul>
  <li><b>Services d'approvisionnement</b> : nourriture, bois, eau, molécules médicinales.</li>
  <li><b>Services de régulation</b> : stockage du carbone, épuration de l'eau, <b>pollinisation</b>, régulation du climat local, protection contre l'érosion.</li>
  <li><b>Services culturels</b> : loisirs, paysages, valeur patrimoniale et esthétique.</li>
</ul>
<p>La <b>gestion durable</b> vise à exploiter sans dépasser la capacité de renouvellement : rotation des cultures, agroforesterie, lutte biologique, aires protégées, restauration écologique.</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« L'énergie circule en cycle dans l'écosystème. » <b>Faux.</b> La <b>matière</b> est recyclée (grâce aux décomposeurs), l'<b>énergie</b> est dégradée en chaleur et perdue : elle <b>traverse</b> l'écosystème en flux, d'où la nécessité d'un apport solaire permanent.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Écosystème = biocénose + biotope + interactions.</li>
<li>Énergie : flux ouvert, ~90 % perdus par niveau trophique. Matière : cycle fermé.</li>
<li>Résilience ↔ biodiversité ; au-delà d'un seuil, basculement irréversible.</li>
<li>Agrosystème = cycle ouvert, faible biodiversité, besoin d'intrants.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Base indispensable pour deux chapitres : « <b>De la plante sauvage à la plante domestiquée</b> » (photosynthèse, interactions plantes–animaux, sélection variétale) et « <b>Les climats de la Terre</b> » (rôle des puits de carbone et des écosystèmes dans le cycle du carbone).</p></div>`
}

    }
