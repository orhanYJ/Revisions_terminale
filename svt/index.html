{
  id:"p6", num:"6", title:"L'histoire humaine lue dans son génome",
  lede:"Que révèle la comparaison des génomes humains actuels et anciens sur notre passé ?",
  notions:["polymorphisme","Néandertal","Denisova","migrations","sélection récente"],
  html:`
<h2>1. Une espèce peu diverse, mais informative</h2>
<p>Deux humains pris au hasard partagent environ <b>99,9 % de leur séquence d'ADN</b>. Les différences, appelées <span class="kw">polymorphismes</span> (souvent des SNP, substitutions d'un seul nucléotide), sont malgré tout des milliers de marqueurs exploitables. Plus deux populations partagent de polymorphismes, plus elles ont divergé récemment.</p>
<p>Point contre-intuitif à connaître : la <b>diversité génétique est maximale en Afrique</b>, et diminue à mesure qu'on s'éloigne du continent africain — la signature d'une <b>expansion à partir de l'Afrique</b> par vagues successives de petits effectifs.</p>

<h2>2. L'ADN ancien</h2>
<p>Le séquençage d'ADN fossile (Néandertal, Denisova) a établi que <i>Homo sapiens</i> s'est <b>croisé</b> avec ces populations :</p>
<ul>
  <li><b>1 à 4 % d'ADN néandertalien</b> chez les humains non africains actuels ;</li>
  <li><b>jusqu'à 5 % d'ADN dénisovien</b> chez les populations d'Océanie.</li>
</ul>
<p>Ces lignées ne forment donc pas un arbre strictement ramifié : il faut penser en <b>réseau</b>, avec des flux de gènes entre lignées.</p>

<h2>3. Des marqueurs à transmission particulière</h2>
<div class="tablewrap"><table>
<tr><th>Marqueur</th><th>Transmission</th><th>Ce qu'il retrace</th></tr>
<tr><td><b>ADN mitochondrial</b></td><td>Uniquement par la mère</td><td>Les lignées maternelles</td></tr>
<tr><td><b>Chromosome Y</b></td><td>De père en fils</td><td>Les lignées paternelles</td></tr>
<tr><td><b>ADN nucléaire autosomique</b></td><td>Les deux parents, avec brassage</td><td>L'ensemble des ancêtres, mais mélangé</td></tr>
</table></div>

<h2>4. Une évolution encore active</h2>
<p>Certains allèles ont été <b>sélectionnés très récemment</b>, à l'échelle de quelques milliers d'années :</p>
<ul>
  <li>la <b>persistance de la lactase</b> à l'âge adulte, sélectionnée dans les populations d'éleveurs ;</li>
  <li>l'adaptation à l'<b>altitude</b> chez les Tibétains, via un allèle hérité des Dénisoviens ;</li>
  <li>la <b>drépanocytose</b> à l'état hétérozygote, qui protège partiellement du paludisme.</li>
</ul>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>Les « races humaines » n'ont <b>aucun fondement génétique</b> : la variabilité génétique <b>à l'intérieur</b> d'une population est bien plus grande qu'entre populations. Un raisonnement solide s'appuie sur ce chiffre, pas sur des impressions.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>99,9 % d'identité entre humains ; diversité maximale en Afrique.</li>
<li>Métissages avec Néandertal (1–4 %) et Denisova (jusqu'à 5 % en Océanie).</li>
<li>ADN mitochondrial = lignée maternelle ; chromosome Y = lignée paternelle.</li>
<li>La sélection naturelle agit encore sur notre espèce.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Ce chapitre prépare directement l'étude des <b>mécanismes de diversification</b> et de la <b>spéciation</b> : Néandertal et <i>sapiens</i> pouvaient se reproduire ensemble — cela interroge la définition même de l'espèce, un débat que tu traiteras en Terminale.</p></div>`

{
  id:"p7", num:"7", title:"La structure du globe terrestre",
  lede:"Comment connaît-on l'intérieur de la Terre alors que le forage le plus profond n'atteint que 12 km ?",
  notions:["ondes sismiques","discontinuité","Moho","LVZ","lithosphère / asthénosphère"],
  html:`
<h2>1. Les ondes sismiques, sondes du globe</h2>
<ul>
  <li><b>Ondes P</b> (primaires) : ondes de compression, les plus rapides, se propagent dans les <b>solides et les liquides</b>.</li>
  <li><b>Ondes S</b> (secondaires) : ondes de cisaillement, plus lentes, <b>bloquées par les liquides</b>.</li>
</ul>
<p>La vitesse des ondes dépend des propriétés du milieu (densité, rigidité, état). Une <b>variation brutale de vitesse</b> signale un changement de milieu : c'est une <span class="kw">discontinuité</span>. Une <b>zone d'ombre</b> pour les ondes S entre 103° et 180° de l'épicentre a permis d'affirmer que le noyau externe est <b>liquide</b>.</p>

<h2>2. Deux découpages superposés</h2>
<div data-schema="globe"></div>

<h2>3. Les discontinuités à connaître</h2>
<div class="tablewrap"><table>
<tr><th>Discontinuité</th><th>Profondeur</th><th>Sépare</th></tr>
<tr><td><b>Moho</b> (Mohorovičić)</td><td>~7 km sous les océans, ~30 km sous les continents</td><td>Croûte / manteau — c'est une limite <b>chimique</b></td></tr>
<tr><td><b>LVZ</b> (zone à moindre vitesse)</td><td>~100–200 km</td><td>Lithosphère / asthénosphère — limite <b>mécanique</b></td></tr>
<tr><td><b>Gutenberg</b></td><td>2900 km</td><td>Manteau / noyau externe (disparition des ondes S)</td></tr>
<tr><td><b>Lehmann</b></td><td>5100 km</td><td>Noyau externe liquide / graine solide</td></tr>
</table></div>

<h2>4. La chaleur interne</h2>
<p>Le <b>flux géothermique</b> provient à environ 80 % de la <b>désintégration d'éléments radioactifs</b> (uranium, thorium, potassium) dans le manteau et la croûte, le reste étant la chaleur résiduelle de l'accrétion. Il est très inégalement réparti : <b>fort aux dorsales</b>, faible dans les vieux domaines continentaux. Deux modes de transfert : la <b>conduction</b> (dans la lithosphère rigide) et la <b>convection</b> (dans le manteau, bien plus efficace).</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>Ne mélange pas les deux découpages. <b>Croûte / manteau</b> = critère <b>chimique</b> (nature des roches). <b>Lithosphère / asthénosphère</b> = critère <b>mécanique</b> (rigide / ductile). La lithosphère contient la croûte ET le sommet du manteau : dire « la lithosphère, c'est la croûte » est une erreur classique.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Ondes P partout, ondes S seulement dans les solides.</li>
<li>Moho = limite chimique ; LVZ = limite mécanique.</li>
<li>Noyau externe liquide (zone d'ombre des ondes S), graine solide.</li>
<li>Chaleur interne surtout radioactive ; conduction + convection.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Ces notions sont indispensables pour « <b>Les traces du passé mouvementé de la Terre</b> » : reconnaître une <b>ophiolite</b>, comprendre l'épaississement crustal d'une chaîne de montagnes ou dater un métamorphisme suppose de savoir ce qu'est une croûte, un manteau et une lithosphère.</p></div>`
},

/* ---------------- P8 ---------------- */
{
  id:"p8", num:"8", title:"La dynamique de la lithosphère",
  lede:"Qu'est-ce qui met les plaques en mouvement, et que deviennent-elles ?",
  notions:["accrétion","subduction","densité","convection","slab pull"],
  html:`
<h2>1. Naissance et mort de la lithosphère océanique</h2>
<div data-schema="tectonique"></div>

<h2>2. Le moteur : une histoire de densité</h2>
<p>Le mécanisme central du chapitre tient en une chaîne logique qu'il faut savoir dérouler :</p>
<ol>
  <li>À la dorsale, la lithosphère océanique est <b>chaude, mince et peu dense</b> (moins dense que l'asthénosphère).</li>
  <li>En s'éloignant, elle <b>refroidit</b> ; l'isotherme 1300 °C s'enfonce, donc la lithosphère <b>s'épaissit</b>.</li>
  <li>En refroidissant, elle se <b>contracte et se densifie</b>.</li>
  <li>Au-delà de <b>~30 millions d'années</b>, sa densité dépasse celle de l'asthénosphère : elle devient <b>instable</b>.</li>
  <li>Elle plonge alors sous son propre poids : c'est la <b>traction de la plaque plongeante</b> (<i>slab pull</i>), moteur principal du déplacement.</li>
</ol>
<p>La convection du manteau et la poussée à la dorsale (<i>ridge push</i>) y contribuent, mais le <i>slab pull</i> reste dominant : les plaques qui possèdent une longue zone de subduction sont aussi les plus rapides.</p>

<h2>3. Deux magmatismes à ne pas confondre</h2>
<div class="tablewrap"><table>
<tr><th></th><th>Dorsale</th><th>Zone de subduction</th></tr>
<tr><td>Cause de la fusion</td><td><b>Décompression</b> (remontée de l'asthénosphère)</td><td><b>Hydratation</b> (eau libérée par la plaque plongeante)</td></tr>
<tr><td>Roche fondue</td><td>Péridotite</td><td>Péridotite du manteau sus-jacent</td></tr>
<tr><td>Magma</td><td>Fluide, basaltique</td><td>Visqueux, riche en silice et en gaz</td></tr>
<tr><td>Roches formées</td><td>Basalte (rapide) et gabbro (lent)</td><td>Andésite / rhyolite et granodiorite</td></tr>
<tr><td>Volcanisme</td><td>Effusif</td><td><b>Explosif</b></td></tr>
</table></div>
<p>Dans les deux cas, la fusion est <b>partielle</b> : seule une fraction de la péridotite fond, ce qui explique que le magma ait une composition différente de la roche mère.</p>

<h2>4. Les preuves du mouvement</h2>
<ul>
  <li>Les <b>anomalies magnétiques</b> du plancher océanique, symétriques de part et d'autre de la dorsale, qui enregistrent les inversions du champ magnétique.</li>
  <li>L'<b>âge du plancher</b> qui augmente régulièrement avec la distance à la dorsale (aucun plancher océanique n'a plus de 200 Ma).</li>
  <li>Les mesures <b>GPS</b> actuelles, de l'ordre de quelques centimètres par an.</li>
  <li>La répartition des <b>séismes et volcans</b>, qui dessine les frontières de plaques.</li>
</ul>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« La plaque plonge parce que l'autre la pousse. » <b>Non</b> : elle plonge parce qu'elle est devenue <b>plus dense que l'asthénosphère</b>. Et l'eau ne fait pas fondre la plaque plongeante : elle <b>abaisse le point de fusion de la péridotite du manteau situé au-dessus</b>. C'est une confusion très fréquente et très pénalisée.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Dorsale : accrétion, fusion partielle par décompression, basalte + gabbro.</li>
<li>Vieillissement : refroidissement → épaississement → densification.</li>
<li>Subduction : slab pull, plan de Bénioff, fusion par hydratation, volcanisme explosif.</li>
<li>Preuves : anomalies magnétiques, âge du plancher, GPS.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Prérequis direct du thème « <b>À la recherche du passé géologique</b> » : reconnaître les <b>ophiolites</b> (restes d'une lithosphère océanique disparue) et les marqueurs d'une <b>collision continentale</b> suppose de maîtriser ce cycle.</p></div>`
}
      ]
    }
  ]
},

/* ---------------- P9 ---------------- */
{
  id:"p9", num:"9", title:"Écosystèmes, dynamique et services environnementaux",
  lede:"Comment fonctionne un écosystème, qu'est-ce qui le déstabilise, et que nous apporte-t-il ?",
  notions:["biocénose / biotope","réseau trophique","résilience","agrosystème","services écosystémiques"],
  html:`
<h2>1. Définir un écosystème</h2>
<div class="box def"><h4>Vocabulaire de base</h4>
<p><b>Écosystème</b> = <b>biocénose</b> (ensemble des êtres vivants) + <b>biotope</b> (milieu physico-chimique : sol, climat, eau) + <b>l'ensemble de leurs interactions</b>. Oublier le troisième terme, c'est perdre l'essentiel de la définition.</p></div>
<p>Les interactions sont de plusieurs types : <b>trophiques</b> (qui mange qui), mais aussi <b>compétition</b>, <b>prédation</b>, <b>coopération</b>, <b>symbiose</b> (mycorhizes entre champignons et racines, indispensables à l'absorption minérale) ou <b>parasitisme</b>.</p>

<h2>2. Flux d'énergie et cycle de la matière</h2>
<div data-schema="ecosysteme"></div>

<h2>3. Perturbations et résilience</h2>
<p>Un écosystème n'est pas figé : il est en <b>équilibre dynamique</b>. Face à une perturbation (incendie, tempête, pollution, espèce invasive), deux issues :</p>
<ul>
  <li>la <b>résilience</b> : l'écosystème retrouve progressivement un état comparable, par une <b>succession écologique</b> (sol nu → herbacées → arbustes → forêt) ;</li>
  <li>le <b>basculement</b> : si la perturbation est trop intense ou trop répétée, l'écosystème bascule vers un <b>nouvel état stable, différent</b>, sans retour possible à court terme.</li>
</ul>
<p>La <b>biodiversité est un facteur de résilience</b> : plus les espèces sont nombreuses et les liens trophiques redondants, plus la disparition d'une espèce peut être compensée.</p>

<h2>4. L'agrosystème, un écosystème sous contrôle</h2>
<div class="tablewrap"><table>
<tr><th></th><th>Écosystème naturel</th><th>Agrosystème</th></tr>
<tr><td>Biodiversité</td><td>Élevée</td><td>Faible (souvent une seule espèce, voire une variété)</td></tr>
<tr><td>Cycle de la matière</td><td>Fermé, recyclage complet</td><td><b>Ouvert</b> : la récolte exporte la matière → il faut <b>fertiliser</b></td></tr>
<tr><td>Énergie</td><td>Solaire uniquement</td><td>Solaire + intrants, machines, transport (énergie fossile)</td></tr>
<tr><td>Stabilité</td><td>Résilience élevée</td><td>Fragile, dépendant des interventions humaines</td></tr>
</table></div>
<p>Conséquences des pratiques intensives : <b>eutrophisation</b> des eaux (excès d'azote et de phosphore → prolifération d'algues → anoxie → mortalité), érosion des sols, résistances aux pesticides, effondrement des pollinisateurs.</p>

<h2>5. Les services écosystémiques</h2>
<ul>
  <li><b>Services d'approvisionnement</b> : nourriture, bois, eau, molécules médicinales.</li>
  <li><b>Services de régulation</b> : stockage du carbone, épuration de l'eau, <b>pollinisation</b>, régulation du climat local, protection contre l'érosion.</li>
  <li><b>Services culturels</b> : loisirs, paysages, valeur patrimoniale et esthétique.</li>
</ul>
<p>La <b>gestion durable</b> vise à exploiter sans dépasser la capacité de renouvellement : rotation des cultures, agroforesterie, lutte biologique, aires protégées, restauration écologique.</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« L'énergie circule en cycle dans l'écosystème. » <b>Faux.</b> La <b>matière</b> est recyclée (grâce aux décomposeurs), l'<b>énergie</b> est dégradée en chaleur et perdue : elle <b>traverse</b> l'écosystème en flux, d'où la nécessité d'un apport solaire permanent.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Écosystème = biocénose + biotope + interactions.</li>
<li>Énergie : flux ouvert, ~90 % perdus par niveau trophique. Matière : cycle fermé.</li>
<li>Résilience ↔ biodiversité ; au-delà d'un seuil, basculement irréversible.</li>
<li>Agrosystème = cycle ouvert, faible biodiversité, besoin d'intrants.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Base indispensable pour deux chapitres : « <b>De la plante sauvage à la plante domestiquée</b> » (photosynthèse, interactions plantes–animaux, sélection variétale) et « <b>Les climats de la Terre</b> » (rôle des puits de carbone et des écosystèmes dans le cycle du carbone).</p></div>`
}

  id:"p10", num:"10", title:"Patrimoine génétique et santé",
  lede:"Pourquoi certaines maladies se transmettent-elles selon des règles strictes, et d'autres pas du tout ?",

  html:`
<h2>1. Les maladies monogéniques</h2>
<p>Une seule paire d'allèles suffit à déterminer le phénotype. Deux exemples de référence :</p>
<div class="tablewrap"><table>
<tr><th>Maladie</th><th>Gène / protéine</th><th>Transmission</th><th>Mécanisme</th></tr>
<tr><td><b>Mucoviscidose</b></td><td>CFTR — canal à ions chlorure</td><td>Autosomique <b>récessive</b></td><td>Délétion la plus fréquente : perte de 3 nucléotides → un acide aminé manquant → protéine mal repliée, non adressée à la membrane → mucus épais</td></tr>
<tr><td><b>Drépanocytose</b></td><td>Bêta-globine de l'hémoglobine</td><td>Autosomique récessive</td><td>Substitution d'un seul nucléotide → un acide aminé changé → l'hémoglobine polymérise → hématies en faucille</td></tr>
</table></div>
<p>Ces exemples illustrent parfaitement la chaîne <b>gène → protéine → phénotype cellulaire → phénotype macroscopique</b>. Sache la dérouler dans les deux sens.</p>

<h2>2. Lire un arbre généalogique</h2>
<div class="box def"><h4>Méthode en 3 réflexes</h4>
<ol>
<li><b>Récessif ou dominant ?</b> Deux parents sains ayant un enfant atteint ⇒ l'allèle est <b>récessif</b> (et les parents sont hétérozygotes). Un enfant sain de deux parents atteints ⇒ l'allèle est <b>dominant</b>.</li>
<li><b>Autosomique ou lié à X ?</b> Une fille atteinte dont le père est sain élimine la transmission liée à X récessive. Une nette majorité de garçons atteints oriente vers X.</li>
<li><b>Écris les génotypes</b> case par case, puis calcule les probabilités avec un échiquier de croisement. Ne conclus jamais sans avoir posé les génotypes.</li>
</ol></div>

<h2>3. Les maladies multifactorielles</h2>
<p>La plupart des maladies fréquentes (diabète de type 2, obésité, hypertension, maladies cardiovasculaires, la plupart des cancers) résultent de la combinaison de <b>plusieurs gènes de prédisposition</b> et de <b>facteurs environnementaux</b> (alimentation, activité physique, tabac, stress).</p>
<div class="box def"><h4>Prédisposition ≠ fatalité</h4>
<p>Porter un allèle de prédisposition augmente la <b>probabilité</b> de développer la maladie, il ne la détermine pas. Les <b>études de jumeaux</b> le montrent : pour le diabète de type 2, la concordance entre vrais jumeaux est élevée mais loin de 100 %, ce qui prouve le poids de l'environnement.</p></div>

<h2>4. Enjeux médicaux</h2>
<p>Le <b>dépistage néonatal</b> permet une prise en charge précoce ; le <b>diagnostic prénatal</b> et le <b>conseil génétique</b> posent des questions éthiques (dépister quoi, jusqu'où, avec quel consentement). Les <b>thérapies géniques</b> et les techniques d'édition du génome (CRISPR-Cas9) ouvrent des perspectives, mais restent limitées et encadrées.</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« Le gène de la mucoviscidose. » Formulation à éviter : c'est le <b>gène CFTR</b>, et c'est un <b>allèle muté</b> de ce gène qui est responsable. Tout le monde possède le gène ; tout le monde n'a pas l'allèle muté. Distingue rigoureusement <b>gène</b> (position, fonction) et <b>allèle</b> (version).</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Monogénique : un gène, transmission mendélienne prévisible.</li>
<li>Mucoviscidose (CFTR, délétion) et drépanocytose (substitution) : les deux exemples à maîtriser.</li>
<li>Multifactoriel : gènes de prédisposition × environnement.</li>
<li>Prédisposition = probabilité accrue, pas destin.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Le raisonnement sur les génotypes et les échiquiers de croisement est directement réinvesti dans « <b>L'origine du génotype des individus</b> » (brassages méiotiques) et dans les calculs de fréquences alléliques (<b>Hardy-Weinberg</b>).</p></div>`
},

{
  id:"p11", num:"11", title:"Altérations du génome et cancérisation",
  lede:"Comment une cellule normale devient-elle une cellule cancéreuse ?",
  notions:["mutation somatique","oncogène","gène suppresseur","clone","facteur de risque"],
  html:`
<h2>1. Le cancer, une maladie du contrôle de la division</h2>
<p>Le cycle cellulaire est normalement surveillé par des <b>points de contrôle</b> : la cellule ne se divise que si son ADN est intact et si les signaux du milieu l'y autorisent. Le cancer naît quand ces contrôles sont perdus.</p>
<p>Deux familles de gènes sont impliquées :</p>
<ul>
  <li>les <b>proto-oncogènes</b>, qui stimulent normalement la division. Mutés, ils deviennent des <span class="kw">oncogènes</span> hyperactifs : l'accélérateur reste bloqué.</li>
  <li>les <b>gènes suppresseurs de tumeurs</b> (p53, BRCA1/2), qui freinent la division ou déclenchent l'<b>apoptose</b>. Mutés, ils perdent leur fonction : le frein est cassé.</li>
</ul>

<h2>2. Un processus par accumulation</h2>
<p>Une seule mutation ne suffit jamais. La cancérisation exige l'<b>accumulation de plusieurs mutations somatiques</b> dans une même lignée cellulaire, sur des années. À chaque étape, la cellule mutée se divise davantage que ses voisines et transmet ses mutations à son <b>clone</b> : c'est une véritable <b>sélection naturelle à l'échelle du tissu</b>.</p>
<p>Étapes : cellule initiée → prolifération incontrôlée → <b>tumeur bénigne</b> → acquisition de la capacité d'invasion et de l'<b>angiogenèse</b> → <b>tumeur maligne</b> → <b>métastases</b> par dissémination sanguine ou lymphatique.</p>

<h2>3. Les facteurs de risque</h2>
<div class="tablewrap"><table>
<tr><th>Facteur</th><th>Mécanisme</th><th>Exemple</th></tr>
<tr><td><b>Tabac</b></td><td>Agents mutagènes chimiques (benzopyrène) qui altèrent l'ADN, notamment p53</td><td>Cancer du poumon</td></tr>
<tr><td><b>UV</b></td><td>Dimères de thymine, erreurs de réparation</td><td>Mélanome</td></tr>
<tr><td><b>Virus</b></td><td>Insertion de gènes viraux perturbant le cycle cellulaire</td><td><b>HPV</b> → cancer du col de l'utérus ; hépatite B → foie</td></tr>
<tr><td><b>Hérédité</b></td><td>Une mutation germinale préexistante réduit le nombre de mutations restant à accumuler</td><td>BRCA1/2 (sein, ovaire)</td></tr>
</table></div>

<h2>4. Prévention et dépistage</h2>
<p>Une large part des cancers est <b>évitable</b> : arrêt du tabac, protection solaire, alimentation, activité physique, <b>vaccination contre HPV et hépatite B</b>. Le dépistage organisé (mammographie, frottis, test colorectal) permet un diagnostic précoce, quand le traitement est le plus efficace.</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« Le cancer est héréditaire. » À nuancer fortement : les mutations responsables sont <b>somatiques</b> dans l'immense majorité des cas, donc <b>non transmissibles</b>. Seule une <b>prédisposition</b> (mutation germinale d'un gène suppresseur, comme BRCA1) est héritée — elle augmente le risque, elle n'est pas le cancer lui-même.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Cancer = perte du contrôle du cycle cellulaire.</li>
<li>Oncogènes (accélérateur bloqué) et gènes suppresseurs (frein cassé).</li>
<li>Accumulation de mutations somatiques → clone → tumeur → métastases.</li>
<li>Facteurs de risque en grande partie évitables ; prédisposition ≠ transmission du cancer.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>La logique « mutation → avantage de division → expansion du clone » est <b>exactement</b> celle de la sélection naturelle que tu formaliseras en Terminale. Le cancer est un excellent exemple d'évolution observable à l'échelle d'un organisme.</p></div>`
},

{
  id:"p12", num:"12", title:"Variation génétique bactérienne et résistance aux antibiotiques",
  lede:"Pourquoi les antibiotiques deviennent-ils de moins en moins efficaces ?",
  notions:["antibiotique","résistance","transfert horizontal","plasmide","pression de sélection"],
  html:`
<h2>1. Comment une bactérie devient résistante</h2>
<p>Deux origines, à bien distinguer :</p>
<div class="tablewrap"><table>
<tr><th></th><th>Transfert vertical</th><th>Transfert horizontal</th></tr>
<tr><td>Mécanisme</td><td><b>Mutation spontanée</b> transmise à la descendance lors de la division</td><td>Échange de gènes entre bactéries <b>contemporaines</b>, parfois d'espèces différentes</td></tr>
<tr><td>Support</td><td>Chromosome bactérien</td><td><b>Plasmide</b> (conjugaison), transformation, transduction par bactériophage</td></tr>
<tr><td>Vitesse de diffusion</td><td>Lente (limitée par le taux de mutation)</td><td><b>Très rapide</b> — explique les résistances multiples</td></tr>
</table></div>
<p>Les mécanismes de résistance eux-mêmes sont variés : production d'une <b>enzyme qui dégrade l'antibiotique</b> (bêta-lactamase), modification de la cible, <b>pompes d'efflux</b> qui expulsent la molécule, imperméabilité de la paroi.</p>

<h2>2. La pression de sélection</h2>
<div class="box def"><h4>Le raisonnement à connaître par cœur</h4>
<ol>
<li>Dans une population bactérienne, quelques individus portent <b>par hasard</b> une mutation de résistance — <b>avant tout contact</b> avec l'antibiotique.</li>
<li>L'antibiotique élimine les bactéries sensibles : il ne crée rien, il <b>trie</b>.</li>
<li>Les résistantes, désormais sans concurrence et disposant de toutes les ressources, se multiplient.</li>
<li>En quelques générations (20 min chacune !), la population est majoritairement résistante.</li>
</ol>
<p>C'est une <b>sélection naturelle en accéléré</b>, observable en TP par un <b>antibiogramme</b> : le diamètre du disque d'inhibition mesure la sensibilité de la souche.</p></div>

<h2>3. Un enjeu de santé publique</h2>
<p>Facteurs aggravants : prescriptions inutiles (les antibiotiques sont <b>inefficaces contre les virus</b>), traitements interrompus trop tôt, usage massif en <b>élevage</b>, diffusion internationale. Conséquence : des impasses thérapeutiques croissantes, alors que peu de nouvelles familles d'antibiotiques sont découvertes.</p>
<p>Leviers d'action : bon usage (« les antibiotiques, c'est pas automatique »), respect de la durée, hygiène hospitalière, vaccination, restriction en élevage, recherche d'alternatives (phagothérapie).</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>Trois formulations à bannir : « la bactérie s'adapte à l'antibiotique », « elle mute pour survivre », « elle devient immunisée ». La bonne formulation : <b>les mutations préexistent au hasard, l'antibiotique sélectionne les bactéries déjà résistantes</b>. Cette phrase, bien placée, rapporte souvent des points à elle seule.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Résistance par mutation (verticale) ou par transfert horizontal (plasmides).</li>
<li>L'antibiotique = agent de sélection, jamais cause de la mutation.</li>
<li>Antibiogramme : diamètre d'inhibition ↔ sensibilité.</li>
<li>Antibiotiques inefficaces contre les virus.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Chapitre prérequis majeur : les <b>transferts horizontaux</b> reviennent dans « La complexification des génomes », et la résistance bactérienne est l'exemple canonique du chapitre « <b>L'humain influe sur l'évolution biologique</b> ».</p></div>`
}

/* ---------------- P13 ---------------- */
{
  id:"p13", num:"13", title:"L'immunité innée",
  lede:"Quelle est la première ligne de défense, celle qui agit en quelques minutes ?",
  notions:["inflammation","médiateurs","phagocytose","cellules sentinelles","AINS"],
  html:`
<h2>1. Trois caractères définissent l'immunité innée</h2>
<ul>
  <li><b>Immédiate</b> : elle se déclenche en quelques minutes.</li>
  <li><b>Non spécifique</b> : elle répond de la même façon à des agresseurs très différents, car elle reconnaît des <b>motifs moléculaires communs</b> aux microbes.</li>
  <li><b>Sans mémoire</b> : elle est identique au premier et au centième contact.</li>
</ul>
<p>Elle est <b>très ancienne dans l'évolution</b> : on la retrouve chez tous les animaux, ce qui montre son efficacité. Elle suffit à régler la grande majorité des infections.</p>

<h2>2. La réaction inflammatoire aiguë</h2>
<div data-schema="immunite"></div>

<h2>3. Les quatre signes cardinaux et leur explication</h2>
<div class="tablewrap"><table>
<tr><th>Signe</th><th>Mécanisme</th></tr>
<tr><td><b>Rougeur</b></td><td>Vasodilatation locale des capillaires</td></tr>
<tr><td><b>Chaleur</b></td><td>Augmentation du débit sanguin local</td></tr>
<tr><td><b>Gonflement (œdème)</b></td><td>Augmentation de la perméabilité des vaisseaux → passage de plasma dans les tissus</td></tr>
<tr><td><b>Douleur</b></td><td>Action des médiateurs (prostaglandines) sur les terminaisons nerveuses + compression par l'œdème</td></tr>
</table></div>
<p>Ces signes ne sont pas des « dégâts » : ils traduisent l'<b>arrivée massive de cellules immunitaires</b> sur le site de l'infection.</p>

<h2>4. Acteurs et molécules</h2>
<ul>
  <li><b>Cellules sentinelles</b> (macrophages, mastocytes, cellules dendritiques) présentes dans tous les tissus : elles détectent et déclenchent.</li>
  <li><b>Médiateurs chimiques</b> : histamine, prostaglandines, cytokines. Ils provoquent la vasodilatation et attirent les autres cellules.</li>
  <li><b>Phagocytes</b> : granulocytes puis macrophages. Phagocytose en 4 temps : <b>adhésion → ingestion → digestion → élimination</b> des déchets (le pus est constitué de cellules mortes et de débris).</li>
</ul>

<div class="box plus"><h4>Approfondir — pourquoi les anti-inflammatoires soulagent</h4>
<p>Les <b>AINS</b> (aspirine, ibuprofène) inhibent une enzyme, la <b>cyclo-oxygénase</b>, qui produit les <b>prostaglandines</b>. Moins de prostaglandines = moins de douleur, moins de vasodilatation, moins de fièvre. Mais attention au raisonnement : en atténuant l'inflammation, on atténue aussi une <b>réponse utile</b>. C'est un bon exemple de lien avec le chapitre sur les enzymes : un médicament est très souvent un <b>inhibiteur enzymatique</b>.</p></div>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>L'inflammation n'est pas une maladie ni un dysfonctionnement : c'est une <b>réponse adaptée et bénéfique</b>. Elle ne devient problématique que si elle est <b>chronique</b> ou disproportionnée.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Innée = immédiate, non spécifique, sans mémoire, universelle chez les animaux.</li>
<li>4 signes : rougeur, chaleur, gonflement, douleur.</li>
<li>Cellules sentinelles → médiateurs → recrutement → phagocytose (4 étapes).</li>
<li>AINS = inhibiteurs de la synthèse des prostaglandines.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Le programme de Terminale reprend intégralement le système immunitaire dans « <b>Le fonctionnement du système immunitaire humain</b> » : ce chapitre en est le socle, notamment le rôle charnière de la <b>cellule dendritique</b>.</p></div>`
},

/* ---------------- P14 ---------------- */
{
  id:"p14", num:"14", title:"L'immunité adaptative",
  lede:"Comment l'organisme fabrique-t-il une réponse sur mesure contre un agresseur précis ?",
  notions:["antigène","LB / LT4 / LT8","sélection clonale","anticorps","mémoire immunitaire"],
  html:`
<h2>1. Une réponse spécifique, lente, mais dotée d'une mémoire</h2>
<p>Quand l'immunité innée ne suffit pas, la cellule dendritique migre vers un <b>ganglion lymphatique</b> et y présente l'antigène. S'enclenche alors une réponse <b>spécifique d'un antigène</b>, qui met <b>plusieurs jours</b> à se mettre en place mais laisse une <b>mémoire durable</b>.</p>

<h2>2. La sélection clonale</h2>
<div class="box def"><h4>Le mécanisme central</h4>
<p>Chaque lymphocyte possède, avant tout contact, un récepteur d'un <b>seul type</b>. L'organisme en produit des millions de spécificités différentes, au hasard. L'antigène ne « fabrique » donc rien : il <b>sélectionne</b> les rares lymphocytes capables de le reconnaître, qui se <b>multiplient</b> (amplification clonale) puis se <b>différencient</b> en cellules effectrices. Le répertoire précède la rencontre.</p></div>

<h2>3. Les trois acteurs</h2>
<div class="tablewrap"><table>
<tr><th>Lymphocyte</th><th>Reconnaît</th><th>Devient</th><th>Action</th></tr>
<tr><td><b>LT4 auxiliaire</b></td><td>L'antigène présenté par la cellule dendritique</td><td>LT4 sécréteur d'interleukines</td><td><b>Chef d'orchestre</b> : sans lui, ni LB ni LT8 ne s'activent pleinement</td></tr>
<tr><td><b>LB</b></td><td>L'antigène <b>libre</b>, sous sa forme native</td><td><b>Plasmocyte</b></td><td>Sécrète des <b>anticorps</b> → immunité humorale</td></tr>
<tr><td><b>LT8</b></td><td>L'antigène présenté par une cellule infectée</td><td><b>LT cytotoxique</b></td><td>Détruit les cellules infectées → immunité cellulaire</td></tr>
</table></div>

<h2>4. Les anticorps</h2>
<div data-schema="anticorps"></div>

<h2>5. La mémoire immunitaire</h2>
<p>Une partie des lymphocytes sélectionnés devient des <b>cellules mémoire</b>, à longue durée de vie. Lors d'un second contact avec le même antigène, la réponse est :</p>
<ul>
  <li>plus <b>rapide</b> (quelques jours au lieu de deux semaines) ;</li>
  <li>plus <b>intense</b> (bien plus d'anticorps produits) ;</li>
  <li>plus <b>durable</b>.</li>
</ul>
<p>C'est cette différence entre réponse primaire et réponse secondaire qui fonde la <b>vaccination</b> — savoir commenter les deux courbes est un grand classique d'exercice.</p>

<div class="box plus"><h4>Approfondir — pourquoi le VIH est-il si dévastateur</h4>
<p>Le VIH infecte et détruit précisément les <b>LT4</b>. Or les LT4 sont indispensables à l'activation des LB comme des LT8. En supprimant le chef d'orchestre, le virus paralyse <b>toute</b> l'immunité adaptative : le malade meurt d'infections opportunistes normalement bénignes. C'est l'argument qui démontre le rôle pivot du LT4 — attends-toi à devoir le construire à partir de courbes de charge virale et de taux de LT4.</p></div>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« Les anticorps détruisent les microbes. » <b>Non</b> : ils les <b>neutralisent</b> et forment des <b>complexes immuns</b> ; la destruction est ensuite assurée par la <b>phagocytose</b>. Autre confusion : anticorps = molécules (immunité humorale) ; LT8 = cellules (immunité cellulaire).</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Adaptative = spécifique, lente, avec mémoire.</li>
<li>Sélection clonale : le répertoire préexiste, l'antigène trie.</li>
<li>LT4 = chef d'orchestre ; LB → plasmocytes → anticorps ; LT8 → cytotoxiques.</li>
<li>Réponse secondaire plus rapide, plus intense, plus durable.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Ce chapitre est repris et approfondi en Terminale (phénotype immunitaire, immunothérapies). Les schémas de sélection clonale sont attendus tels quels au bac.</p></div>`
},

/* ---------------- P15 ---------------- */
{
  id:"p15", num:"15", title:"L'utilisation de l'immunité adaptative en santé",
  lede:"Comment la médecine exploite-t-elle les mécanismes immunitaires ?",
  notions:["vaccination","adjuvant","couverture vaccinale","sérothérapie","anticorps monoclonaux"],
  html:`
<h2>1. La vaccination : provoquer la mémoire sans la maladie</h2>
<p>Un vaccin contient un <b>antigène rendu inoffensif</b> (agent inactivé, atténué, fragment protéique, ou ARN messager codant un antigène). Il déclenche une <b>réponse primaire complète</b>, donc la formation de <b>cellules mémoire</b>, sans provoquer la maladie.</p>
<p>Les <b>adjuvants</b> stimulent l'immunité innée locale, ce qui renforce l'activation de l'immunité adaptative — d'où la petite inflammation au point d'injection, signe que le vaccin fonctionne.</p>
<p>Les <b>rappels</b> exploitent la réponse secondaire pour maintenir un taux protecteur d'anticorps et enrichir le stock de cellules mémoire.</p>

<div class="box def"><h4>L'immunité collective</h4>
<p>Au-delà d'un certain <b>taux de couverture vaccinale</b>, la transmission de l'agent s'effondre : les personnes non vaccinables (nourrissons, immunodéprimés) sont protégées indirectement. Le seuil dépend de la contagiosité — environ <b>95 % pour la rougeole</b>, très contagieuse. C'est l'argument central de tout raisonnement sur les politiques vaccinales.</p></div>

<h2>2. Vaccination et sérothérapie : ne pas confondre</h2>
<div class="tablewrap"><table>
<tr><th></th><th>Vaccination</th><th>Sérothérapie</th></tr>
<tr><td>Ce qu'on injecte</td><td>Un antigène inoffensif</td><td>Des <b>anticorps déjà formés</b></td></tr>
<tr><td>Type d'immunité</td><td><b>Active</b> — l'organisme travaille</td><td><b>Passive</b> — l'organisme ne fait rien</td></tr>
<tr><td>Délai d'action</td><td>Plusieurs semaines</td><td><b>Immédiat</b></td></tr>
<tr><td>Durée</td><td>Longue (mémoire)</td><td>Courte (quelques semaines), <b>aucune mémoire</b></td></tr>
<tr><td>Usage</td><td>Prévention</td><td>Urgence : morsure de serpent, tétanos après blessure</td></tr>
</table></div>

<h2>3. Les anticorps monoclonaux</h2>
<p>Ce sont des anticorps <b>tous identiques</b>, produits en masse à partir d'un unique clone de plasmocyte, et dirigés contre une cible unique choisie. Applications :</p>
<ul>
  <li><b>Diagnostic</b> : tests de grossesse, tests antigéniques rapides.</li>
  <li><b>Thérapie</b> : ciblage de cellules cancéreuses, traitement de maladies auto-immunes.</li>
  <li><b>Recherche</b> : identification et localisation de protéines.</li>
</ul>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« Le sérum est un vaccin qui agit vite. » <b>Non</b> : le sérum n'immunise pas. Aucune cellule mémoire n'est produite, la protection disparaît avec les anticorps injectés. Vaccin = <b>préventif et durable</b> ; sérum = <b>curatif et transitoire</b>.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>

<script>

});

}

function pageChapitre(c){
  const list = ORDER[c.kind], i = list.indexOf(c.id);
  const prev = i>0 ? CH[list[i-1]] : null, next = i<list.length-1 ? CH[list[i+1]] : null;
  const idxInTheme = c.theme.parts.reduce((acc,pa)=>acc.concat(pa.chapters),[]).indexOf(c);
  let h = `<div class="chaphead" style="--c:${c.theme.color}"><div class="ph-txt">
    <div class="crumb">
      <a href="#${c.kind==='t'?'terminale':'premiere'}">${c.kind==='t'?'Terminale':'Rappels de Première'}</a> ›
      <span>${c.theme.n}</span> › <span>${c.part.title}</span>
    </div>
    <h1 class="page">${c.title}</h1>
    <p class="lede">${c.lede}</p></div>
    ${medal(c.id)}</div>`;

  if(c.kind==="t"){
    h += rappelBlock(c);
    h += `<div class="box def"><h4>Ce que tu dois savoir faire</h4><ul>${c.objectifs.map(o=>"<li>"+o+"</li>").join("")}</ul></div>`;
    h += `<div class="soon">
      ${spec("seedling")}
      <b>Cours en préparation</b>Ce chapitre sera rempli avec le cours complet, les schémas et les exercices. Pour l'instant, révise les rappels de Première ci-dessus : ce sont les prérequis exacts de ce chapitre.</div>`;
  } else {
    if(c.notions) h += '<div class="notions">'+c.notions.map(n=>'<span class="notion">'+n+'</span>').join("")+'</div>';
    h += '<article>'+c.html+'</article>';
  }

  h += '<div class="pager">';
  h += prev ? `<button onclick="go('${prev.id}')"><div class="l">← Précédent</div><div class="v">${prev.title}</div></button>` : '<div style="flex:1"></div>';
  h += next ? `<button class="r" onclick="go('${next.id}')"><div class="l">Suivant →</div><div class="v">${next.title}</div></button>` : '<div style="flex:1"></div>';
  h += '</div>';
  return h;
}

/* ---------- recherche ---------- */
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function pageRecherche(q){
  q = (q||"").trim();
  if(q.length < 2) return `<h1 class="page">Recherche</h1><p class="lede">Tape au moins deux lettres. La recherche balaie les titres, les notions et le texte de toutes les fiches.</p>`;
  const nq = norm(q), words = nq.split(/\s+/).filter(Boolean);
  const hits = [];
  Object.values(CH).forEach(c => {
    let score = 0;
    words.forEach(w => {
      if(norm(c.title).includes(w)) score += 12;
      if((c.notions||[]).some(n=>norm(n).includes(w))) score += 8;
      if(norm(c.lede).includes(w)) score += 5;
      const m = c.norm.split(w).length - 1;
      score += Math.min(m,6);
    });
    if(score>0) hits.push({c,score});
  });
  hits.sort((a,b)=>b.score-a.score);
  if(!hits.length) return `<h1 class="page">Recherche</h1><p class="lede">Aucun résultat pour « ${q} ».</p>`;
  let h = `<div class="pagehead">${bot("umbel","pagebot")}<h1 class="page">Recherche</h1><p class="lede">${hits.length} résultat${hits.length>1?"s":""} pour « ${q} ».</p></div>`;
  hits.slice(0,30).forEach(({c}) => {
    const i = c.norm.indexOf(norm(words[0]));
    let ex = "";
    if(i>-1){
      const s = Math.max(0,i-70), e = Math.min(c.plain.length,i+140);
      ex = (s>0?"… ":"")+c.plain.slice(s,e)+" …";
      const re = new RegExp("("+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
      ex = ex.replace(re,"<mark>$1</mark>");
    }
    h += `<button class="res" onclick="go('${c.id}')">
      <div class="p">${c.kind==="t"?"Terminale":"Rappel 1ère"} · ${c.theme.n} · ${c.kind==="t"?"chap. "+c.num:"fiche "+c.num}</div>
      <div class="t">${c.title}</div><div class="s">${ex||c.lede}</div></button>`;
  });
  return h;
}

/* ---------- schémas ---------- */
function mountSchemas(root){
  root.querySelectorAll("[data-schema]").forEach(slot => {
    const s = SCHEMAS[slot.dataset.schema];
    if(!s){ slot.remove(); return; }
    const fig = document.createElement("figure");
    fig.className = "schema";
    fig.innerHTML = `<div class="stitle">${SPRIG}${s.title}</div>
      <div class="svgbox">${s.svg}</div>
      <div class="scrollhint">↔ fais glisser le schéma pour le voir en entier</div>
      <div class="ctrls"></div><div class="info"></div>
      <figcaption>${s.caption}</figcaption>`;
    slot.replaceWith(fig);
    const ctrls = fig.querySelector(".ctrls"), info = fig.querySelector(".info");

    if(s.mode === "steps"){
      const setStep = k => {
        s.groups.forEach((g,j) => {
          const el = fig.querySelector("#"+g);
          if(el){ el.style.opacity = j<=k ? 1 : .12; el.style.transition="opacity .3s"; }
        });
        [...ctrls.querySelectorAll("button[data-k]")].forEach((b,j)=>b.classList.toggle("on", j===k));
        info.innerHTML = s.steps[k].info;
        ctrls.querySelector(".step").textContent = "Étape " + (k+1) + " / " + s.steps.length;
      };
      s.steps.forEach((st,k) => {
        const b = document.createElement("button");
        b.textContent = st.label; b.dataset.k = k;
        b.onclick = () => setStep(k);
        ctrls.appendChild(b);
      });
      const sp = document.createElement("span"); sp.className="step"; ctrls.appendChild(sp);
      setStep(0);
    } else {
      const keys = Object.keys(s.spots);
      info.innerHTML = "<b>Clique sur une zone du schéma</b> pour afficher son explication.";
      fig.querySelectorAll("[data-spot]").forEach(g => {
        g.addEventListener("click", () => {
          info.innerHTML = s.spots[g.dataset.spot] || "";
          fig.querySelectorAll("[data-spot] .hitbg").forEach(x=>x.style.opacity=0);
          const bg = g.querySelector(".hitbg"); if(bg) bg.style.opacity=.2;
        });
      });
      const b = document.createElement("button");
      b.textContent = "Tout parcourir";
      let k = 0;
      b.onclick = () => {
        const el = fig.querySelector('[data-spot="'+keys[k]+'"]');
        if(el) el.dispatchEvent(new Event("click"));
        k = (k+1) % keys.length;
      };
      ctrls.appendChild(b);
    }
  });
}


/* =======================================================================
   GLOSSAIRE — repérage automatique des termes et bulle de définition
   ======================================================================= */
let GL_RE = null, GL_MAP = {};
function glRegex(){
  const alts = [];
  for(const id in GLOSSAIRE)
    for(const m of GLOSSAIRE[id].mots) alts.push([m, id]);
  alts.sort((a,b) => b[0].length - a[0].length);
  alts.forEach(([m,id]) => { GL_MAP[m.toLowerCase()] = id; });
  const esc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const src = "(" + alts.map(a => esc(a[0])).join("|") + ")";
  try { return new RegExp("(?<![\\p{L}\\p{N}])" + src + "(?![\\p{L}\\p{N}])", "giu"); }
  catch(e){ return new RegExp("\\b" + src + "\\b", "gi"); }
}

const GL_SKIP = "h1,h2,h3,h4,figure,button,.gl,.glpop,.tag,.crumb,.notion,.notions,.rappel,.soon,.pager,nav";
function tagGlossaire(root){
  if(!GL_RE) GL_RE = glRegex();
  const compte = {};
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      if(n.parentElement.closest(GL_SKIP)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const noeuds = [];
  while(w.nextNode()) noeuds.push(w.currentNode);
  noeuds.forEach(node => {
    const txt = node.nodeValue;
    GL_RE.lastIndex = 0;
    let m, dernier = 0, frag = null;
    while((m = GL_RE.exec(txt)) !== null){
      const id = GL_MAP[m[1].toLowerCase()];
      if(!id) continue;
      compte[id] = (compte[id] || 0) + 1;
      if(compte[id] > 2) continue;
      frag = frag || document.createDocumentFragment();
      if(m.index > dernier) frag.appendChild(document.createTextNode(txt.slice(dernier, m.index)));
      const sp = document.createElement("span");
      sp.className = "gl"; sp.dataset.g = id; sp.textContent = m[1];
      frag.appendChild(sp);
      dernier = m.index + m[1].length;
    }
    if(frag){
      if(dernier < txt.length) frag.appendChild(document.createTextNode(txt.slice(dernier)));
      node.parentNode.replaceChild(frag, node);
    }
  });
}

let glAncre = null, glFixe = false, glT = null;
function glContenu(e){
  let h = '<button class="glclose" aria-label="Fermer">&times;</button>';
  h += '<div class="glmot">' + e.mot + '</div><div class="gldef">' + e.definition + '</div>';
  h += '<div class="glplace"><span class="lbl">Où ça intervient</span>' + e.place + '</div>';
  if(e.piege) h += '<div class="glpiege"><span class="lbl">Attention</span>' + e.piege + '</div>';
  if(e.voir && e.voir.length){
    const v = e.voir.filter(x => GLOSSAIRE[x]);
    if(v.length) h += '<div class="glsec"><span class="lbl">Voir aussi</span><div class="glvoir">' +
      v.map(x => '<button data-v="' + x + '">' + GLOSSAIRE[x].mot + '</button>').join("") + '</div></div>';
  }
  return h;
}
function glPlacer(){
  const pop = $("#glpop");
  if(!glAncre || !pop.classList.contains("on")) return;
  const bar = document.querySelector("header.top");
  const hautSafe = bar ? bar.getBoundingClientRect().bottom + 10 : 12;
  const r = glAncre.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const basNav = window.innerWidth <= 1000 ? 84 : 12;
  const placeDessous = vh - r.bottom - 22 - basNav;
  const placeDessus = r.top - hautSafe - 12;
  const dessous = placeDessous >= placeDessus;
  pop.style.maxHeight = Math.min(400, Math.max(150, dessous ? placeDessous : placeDessus)) + "px";
  const w = pop.offsetWidth, hgt = pop.offsetHeight;
  const left = Math.min(Math.max(12, r.left + r.width/2 - w/2), Math.max(12, vw - w - 12));
  const top = dessous ? r.bottom + 12 : Math.max(hautSafe, r.top - 12 - hgt);
  pop.style.left = left + "px"; pop.style.top = top + "px";
  pop.classList.toggle("below", dessous);
  pop.classList.toggle("above", !dessous);
  pop.style.setProperty("--cx", Math.min(Math.max(16, r.left + r.width/2 - left), w - 16) + "px");
}
function glOuvrir(id, ancre, fixe){
  const e = GLOSSAIRE[id];
  if(!e) return;
  clearTimeout(glT);
  const pop = $("#glpop");
  pop.innerHTML = glContenu(e);
  glAncre = ancre || glAncre;
  glFixe = !!fixe || glFixe;
  document.querySelectorAll(".gl.act").forEach(x => x.classList.remove("act"));
  if(glAncre) glAncre.classList.add("act");
  pop.classList.add("on");
  glPlacer();
  pop.querySelector(".glclose").onclick = glFermer;
  pop.querySelectorAll(".glvoir button").forEach(b =>
    b.onclick = ev => { ev.stopPropagation(); glOuvrir(b.dataset.v, glAncre, true); });
}
function glFermer(){
  clearTimeout(glT); glFixe = false; glAncre = null;
  $("#glpop").classList.remove("on");
  document.querySelectorAll(".gl.act").forEach(x => x.classList.remove("act"));
}
function glFermerDifferee(){ clearTimeout(glT); glT = setTimeout(() => { if(!glFixe) glFermer(); }, 220); }

const GL_FIN = matchMedia("(hover:hover) and (pointer:fine)").matches;
document.addEventListener("mouseover", ev => {
  if(!GL_FIN) return;
  const t = ev.target.closest(".gl");
  if(t){ clearTimeout(glT); glT = setTimeout(() => glOuvrir(t.dataset.g, t, false), 180); return; }
  if(ev.target.closest("#glpop")) clearTimeout(glT);
});
document.addEventListener("mouseout", ev => {
  if(!GL_FIN) return;
  if(ev.target.closest(".gl") || ev.target.closest("#glpop")) glFermerDifferee();
});
document.addEventListener("click", ev => {
  const t = ev.target.closest(".gl");
  if(t){ ev.stopPropagation(); glOuvrir(t.dataset.g, t, true); return; }
  if(!ev.target.closest("#glpop")) glFermer();
});
document.addEventListener("keydown", e => { if(e.key === "Escape") glFermer(); });
window.addEventListener("scroll", () => { if(glFixe) glPlacer(); else glFermer(); }, {passive:true});
window.addEventListener("resize", glPlacer);

/* ---------- routeur ---------- */
function go(r){ location.hash = r; }
function render(){
  const r = decodeURIComponent(location.hash.slice(1)) || "accueil";
  let html;
  if(r === "accueil") html = pageAccueil();
  else if(r === "terminale") html = pageListe("t");
  else if(r === "premiere") html = pageListe("p");
  else if(r === "recherche") html = pageRecherche($("#q").value);
  else if(CH[r]) html = pageChapitre(CH[r]);
  else html = pageAccueil();
  view.innerHTML = html;
  mountSchemas(view);
  glFermer();
  if(CH[r] && CH[r].html) tagGlossaire(view);
  window.scrollTo(0,0);

  side.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#"+r));
  const on = side.querySelector("a.on");
  if(on) on.closest(".grp").classList.add("open");
  const ch = CH[r];
  document.querySelectorAll("#bottomnav button").forEach(b => {
    const k = b.dataset.go;
    // toujours un booléen : avec undefined, classList.toggle inverse la classe au lieu de la retirer
    const actif = k === r
      || (!!ch && k === "terminale" && ch.kind === "t")
      || (!!ch && k === "premiere"  && ch.kind === "p");
    b.classList.toggle("on", actif);
  });
  side.classList.remove("open"); $("#backdrop").classList.remove("on");
}
window.addEventListener("hashchange", render);

/* ---------- interactions ---------- */
$("#menubtn").onclick = () => { side.classList.toggle("open"); $("#backdrop").classList.toggle("on"); };
$("#backdrop").onclick = () => { side.classList.remove("open"); $("#backdrop").classList.remove("on"); };
document.querySelectorAll("#bottomnav button").forEach(b => b.onclick = () => {
  if(b.dataset.go === "recherche"){ go("recherche"); $("#q").focus(); } else go(b.dataset.go);
});
let tmr;
$("#q").addEventListener("input", () => {
  clearTimeout(tmr);
  tmr = setTimeout(() => {
    if($("#q").value.trim().length >= 2){
      if(location.hash !== "#recherche") go("recherche"); else render();
    }
  }, 200);
});
$("#q").addEventListener("keydown", e => { if(e.key === "Enter"){ go("recherche"); render(); } });

let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
function applyTheme(){ document.documentElement.setAttribute("data-theme", theme); }
$("#themebtn").onclick = () => { theme = theme==="dark" ? "light" : "dark"; applyTheme(); };
applyTheme();

buildSide();
render();
</script>
