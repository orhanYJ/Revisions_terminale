let VS = null;

function vocChap(r){ return r.slice(4); }

function pageVoc(num){
  const v = VOCAB[num];
  if(!v) return `<div class="pagehead"><h1 class="page">Vocabulaire indisponible</h1></div>`;
  const c = CH[v.unites[0]];
  motifSeed = 0;
  return `<div class="pagehead" style="--c:${c.theme.color}">${bot(c.theme.motif, "pagebot")}
      <div class="crumb"><a href="#${v.unites[0]}">${v.titre}</a> › <span>Vocabulaire</span></div>
      <h1 class="page">Le vocabulaire du chapitre</h1>
      <p class="lede">Ne pas relire : se tester. Pour chaque carte, dis la définition à voix haute ou écris-la, puis vérifie.</p>
    </div>
    <div id="voczone"></div>`;
}

function vocAccueil(num){
  const z = document.getElementById("voczone");
  const v = VOCAB[num];
  if(!z || !v) return;
  const nP = v.mots.filter(x => x.prof).length;
  const liste = v.mots.filter(x => x.prof).map(x => x.m).join(", ");
  z.innerHTML = `
    <div class="box retenir"><h4>La liste de Mme Philip</h4><p>${liste}.</p></div>
    <div class="qmodes">
      <button class="qmode" onclick="vocInit('${num}','prof','mot')"><b>La liste de la prof</b><span class="fl">→</span><span>${nP} mots — je vois le mot, je donne la définition</span></button>
      <button class="qmode" onclick="vocInit('${num}','prof','def')"><b>La liste, dans l'autre sens</b><span class="fl">→</span><span>${nP} définitions — je dois retrouver le mot exact</span></button>
      <button class="qmode" onclick="vocInit('${num}','tout','mot')"><b>Tout le vocabulaire du chapitre</b><span class="fl">→</span><span>${v.mots.length} mots, la liste de la prof et les autres notions clés</span></button>
    </div>`;
}

function vocInit(num, portee, sens, seulement){
  const v = VOCAB[num];
  let idx = [];
  v.mots.forEach((x, i) => { if(portee === "tout" || x.prof) idx.push(i); });
  if(seulement && seulement.length) idx = seulement;
  VS = {num, portee, sens, liste: melange(idx), pos: 0, su: [], rate: [], vu: false};
  vocRendre();
}

function vocRendre(){
  const z = document.getElementById("voczone");
  if(!z || !VS) return;
  const x = VOCAB[VS.num].mots[VS.liste[VS.pos]];
  const recto = VS.sens === "mot" ? `<div class="vmot">${x.m}</div>` : `<div class="vdef">${x.d}</div>`;
  const verso = VS.sens === "mot" ? `<div class="vdef">${x.d}</div>` : `<div class="vmot">${x.m}</div>`;
  const q = VS.sens === "mot" ? "Donne la définition, à voix haute ou par écrit." : "Quel est le mot exact ?";
  const pct = Math.round(VS.pos / VS.liste.length * 100);
  z.innerHTML = `<div class="qprog"><span>Carte ${VS.pos + 1} / ${VS.liste.length}</span>
      <span class="bar"><i style="width:${pct}%"></i></span><span>${VS.su.length} sue${VS.su.length > 1 ? "s" : ""}</span></div>
    <div class="vcard">
      ${x.prof ? '<span class="qtag rap">Liste de la prof</span>' : '<span class="qtag cou">Notion du chapitre</span>'}
      ${recto}
      <p class="vconsigne">${q}</p>
      <div id="vverso">
        <button class="qnext" onclick="vocRetourner()">Voir la réponse</button>
      </div>
    </div>`;
  VS.vu = false;
}

function vocRetourner(){
  if(!VS || VS.vu) return;
  VS.vu = true;
  const x = VOCAB[VS.num].mots[VS.liste[VS.pos]];
  const verso = VS.sens === "mot" ? `<div class="vdef">${x.d}</div>` : `<div class="vmot">${x.m}</div>`;
  document.getElementById("vverso").innerHTML = `<div class="vrep">${verso}</div>
    <p class="vconsigne">Honnêtement, tu la savais ?</p>
    <div class="vboutons">
      <button class="vbt oui" onclick="vocNoter(true)">Je savais</button>
      <button class="vbt non" onclick="vocNoter(false)">À revoir</button>
    </div>`;
}

function vocNoter(ok){
  if(!VS || !VS.vu) return;
  const i = VS.liste[VS.pos];
  (ok ? VS.su : VS.rate).push(i);
  if(VS.pos >= VS.liste.length - 1){ vocBilan(); return; }
  VS.pos++;
  vocRendre();
  const z = document.getElementById("voczone");
  if(z) z.scrollIntoView({block:"start", behavior:"smooth"});
}

function vocBilan(){
  const z = document.getElementById("voczone");
  if(!z || !VS) return;
  const v = VOCAB[VS.num];
  const n = VS.liste.length, s = VS.su.length;
  const autre = VS.sens === "mot" ? "def" : "mot";
  const rates = VS.rate.map(i => v.mots[i].m);
  z.innerHTML = `<div class="qbilan ${s === n ? "bon" : "moyen"}">
      <div class="qscore">${s} / ${n}</div>
      <p>${s === n ? "Tout est su. Passe maintenant à la rédaction : c'est là que le vocabulaire doit servir." : "Mots à revoir : <b>" + rates.join(", ") + "</b>."}</p>
    </div>
    <div class="qactions">
      ${VS.rate.length ? `<button class="qnext" onclick="vocInit('${VS.num}','${VS.portee}','${VS.sens}',[${VS.rate.join(",")}])">Revoir les ${VS.rate.length} mot${VS.rate.length > 1 ? "s" : ""} ratés</button>` : ""}
      <button class="qnext ghost" onclick="vocInit('${VS.num}','${VS.portee}','${autre}')">Refaire dans l'autre sens</button>
      <button class="qnext ghost" onclick="vocAccueil('${VS.num}')">Choisir une autre série</button>
    </div>`;
  z.scrollIntoView({block:"start", behavior:"smooth"});
}

/* ---------------- moteur de rédaction ---------------- */
function pageRedac(id){
  const c = CH[id], L = REDAC[id];
  if(!c || !L) return `<div class="pagehead"><h1 class="page">Exercices indisponibles</h1></div>`;
  motifSeed = 0;
  let h = `<div class="pagehead" style="--c:${c.theme.color}">${bot(c.theme.motif, "pagebot")}
      <div class="crumb"><a href="#${id}">${c.title}</a> › <span>Rédiger</span></div>
      <h1 class="page">S'entraîner à rédiger</h1>
      <p class="lede">Écris d'abord, seul et sans le cours. Ensuite seulement, compare avec la correction et coche ce que tu avais.</p>
    </div>
    <details class="tp"><summary><span class="lab">Méthode</span>Comment rédiger, d'après Mme Philip</summary><div class="tpin">${METHODE_PHILIP}</div></details>`;
  L.forEach((ex, k) => {
    h += `<section class="redex" id="ex-${ex.id}">
      <div class="redhead"><span class="rednum">${k + 1}</span><div><h2 class="redtit">${ex.titre}</h2><span class="redduree">${ex.duree} environ</span></div></div>
      <p class="redcons">${ex.consigne}</p>
      <textarea class="redta" id="ta-${ex.id}" rows="9" placeholder="Rédige ici, ou sur une copie. Ton texte n'est pas enregistré : il reste tant que tu ne quittes pas la page." oninput="redCompter('${ex.id}')"></textarea>
      <div class="redbar"><span id="nb-${ex.id}">0 mot</span>
        <button class="qnext" onclick="redReveler('${id}','${ex.id}')">J'ai fini — voir la correction</button></div>
      <div id="cor-${ex.id}"></div>
    </section>`;
  });
  return h;
}

function redCompter(eid){
  const t = document.getElementById("ta-" + eid), n = document.getElementById("nb-" + eid);
  if(!t || !n) return;
  const k = (t.value.trim().match(/\S+/g) || []).length;
  n.textContent = k + " mot" + (k > 1 ? "s" : "");
}

function redReveler(uid, eid){
  const ex = REDAC[uid].find(e => e.id === eid);
  const z = document.getElementById("cor-" + eid);
  if(!ex || !z || z.innerHTML) return;
  z.innerHTML = `<div class="redcor">
      <p class="redsrc">${ex.source}</p>
      ${ex.corrige}
    </div>
    <div class="redcheck">
      <h4>Ce qu'il fallait avoir — coche ce qui est dans ta copie</h4>
      ${ex.points.map((p, i) => `<label class="redpt"><input type="checkbox" onchange="redScore('${eid}',${ex.points.length})"><span>${p}</span></label>`).join("")}
      <p class="redscore" id="sc-${eid}">0 / ${ex.points.length}</p>
    </div>`;
  z.scrollIntoView({block:"start", behavior:"smooth"});
}

function redScore(eid, n){
  const z = document.getElementById("cor-" + eid), s = document.getElementById("sc-" + eid);
  if(!z || !s) return;
  const k = z.querySelectorAll("input:checked").length;
  let m = "";
  if(k === n) m = " — complet. Réécris-la de mémoire dans quelques jours pour vérifier que ça tient.";
  else if(k >= n * 0.7) m = " — solide. Reprends seulement les points manquants.";
  else if(k > 0) m = " — il manque l'essentiel. Relis la correction, puis réécris sans la regarder.";
  s.textContent = k + " / " + n + m;
}
</script>
<script>
/* =======================================================================
   APPLICATION
   ======================================================================= */
const $ = s => document.querySelector(s);
const view = $("#view");
const side = $("#side");

/* ---------- index plat ---------- */
const CH = {};          // id -> chapitre enrichi
const TH = {};          // id -> {theme, kind} : permet une page par thème
const ORDER = {p:[], t:[]};
function indexAll(tree, kind){
  tree.forEach(th => { TH[th.id] = {theme:th, kind:kind}; th.parts.forEach(pa => pa.chapters.forEach(c => {
    c.kind = kind; c.theme = th; c.part = pa;
    CH[c.id] = c; ORDER[kind].push(c.id);
  })); });
}
indexAll(PREMIERE,"p");
indexAll(TERMINALE,"t");

const strip = h => h.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
Object.values(CH).forEach(c => {
  c.plain = strip([c.title, c.lede, (c.notions||[]).join(" "),
    (c.objectifs||[]).join(" "), c.html||""].join(" "));
  c.norm = c.plain.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
});

/* ---------- petits motifs végétaux ---------- */
function leafDot(c){
  return '<svg class="leafdot" viewBox="0 0 20 20" fill="none" aria-hidden="true">'+
    '<path d="M16.5 3.5C17.4 11 14 16 8.6 16.9c-2.9.5-5-.7-5.6-2.9C2 10.6 5.4 6.6 10.2 4.8 12.4 4 14.6 3.5 16.5 3.5z" fill="'+c+'" opacity=".9"/>'+
    '<path d="M4 17c2.4-6.2 6.6-10.2 12.4-12.8" stroke="'+c+'" stroke-width="1.5" stroke-linecap="round" opacity=".55"/></svg>';
}
const SPRIG = '<svg class="sprig" viewBox="0 0 20 20" fill="none" aria-hidden="true">'+
  '<path d="M16.5 3.5C17.4 11 14 16 8.6 16.9c-2.9.5-5-.7-5.6-2.9C2 10.6 5.4 6.6 10.2 4.8 12.4 4 14.6 3.5 16.5 3.5z" fill="currentColor" opacity=".8"/>'+
  '<path d="M4 17c2.4-6.2 6.6-10.2 12.4-12.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".45"/></svg>';

const MOTIF_CYCLE = ["fern","branch","umbel","leafskeleton","vine","roots"];
let motifSeed = 0;
function botCycle(cls){ return bot(MOTIF_CYCLE[(motifSeed++) % MOTIF_CYCLE.length], cls); }

function iconMark(id){
  const d = ICONS[id];
  if(!d) return "";
  return '<svg class="cardicon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8" '+
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
}

function medal(id, cls){
  const d = ICONS[id];
  if(!d) return "";
  return '<figure class="medal'+(cls?" "+cls:"")+'"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" '+
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg></figure>';
}

function spec(name, cls){
  const src = SPECIMENS[name];
  if(!src) return "";
  return '<figure class="specimen'+(cls?" "+cls:"")+'"><img src="'+src+'" alt="" loading="lazy"></figure>';
}
function specOf(theme, i){
  const list = theme.specs || ["fern"];
  return list[i % list.length];
}

function bot(motif, cls){
  return '<svg class="'+cls+'" viewBox="0 0 200 220" aria-hidden="true"><use href="#bot-'+motif+'"/></svg>';
}

/* ---------- barre latérale ---------- */
function buildSide(){
  let h = '<h4>Programme de Terminale</h4>';
  TERMINALE.forEach(th => {
    h += '<div class="grp" data-g="'+th.id+'"><button onclick="tog(this)">'+
      leafDot(th.color)+th.n+' · '+th.short+
      '<svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M9 6l6 6-6 6"/></svg></button><div class="kids">';
    th.parts.forEach(pa => {
      h += '<div class="part">'+pa.title+'</div>';
      let lastChap = null;
      pa.chapters.forEach(c => {
        if(c.chap && c.chap.num !== lastChap){
          h += '<div class="chaplab">Chapitre '+c.chap.num+' — '+c.chap.title+'</div>';
          lastChap = c.chap.num;
        }
        if(!c.chap) lastChap = null;
        h += '<a href="#'+c.id+'"'+(c.chap?' class="sub"':'')+'><span class="n">'+c.num+'</span>'+c.title+'</a>';
      });
    });
    h += '</div></div>';
  });
  h += '<h4>Rappels de Première</h4>';
  PREMIERE.forEach(th => {
    h += '<div class="grp" data-g="'+th.id+'"><button onclick="tog(this)">'+
      leafDot(th.color)+th.n+' · '+th.short+
      '<svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M9 6l6 6-6 6"/></svg></button><div class="kids">';
    th.parts.forEach(pa => {
      h += '<div class="part">'+pa.title+'</div>';
      let lastChap = null;
      pa.chapters.forEach(c => {
        if(c.chap && c.chap.num !== lastChap){
          h += '<div class="chaplab">Chapitre '+c.chap.num+' — '+c.chap.title+'</div>';
          lastChap = c.chap.num;
        }
        if(!c.chap) lastChap = null;
        h += '<a href="#'+c.id+'"'+(c.chap?' class="sub"':'')+'><span class="n">'+c.num+'</span>'+c.title+'</a>';
      });
    });
    h += '</div></div>';
  });
  h += bot("branch","sidebot");
  side.innerHTML = h;
}
function tog(b){ b.parentNode.classList.toggle("open"); }

/* ---------- pages ---------- */
function pageAccueil(){
  const nT = ORDER.t.length, nP = ORDER.p.length;
  let h = `<div class="hero">
    <svg class="blob" style="right:-70px;top:-90px" width="320" height="320" viewBox="0 0 200 200" fill="none">
      <path d="M158 34c22 26 24 66 6 94s-56 44-88 36S18 128 24 96 56 38 88 28s48-20 70 6z" fill="rgba(255,255,255,.13)"/>
      <path d="M150 44c-4 44-30 74-70 82" stroke="rgba(255,255,255,.3)" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <svg class="blob" style="right:14px;bottom:-56px" width="190" height="190" viewBox="0 0 120 120" fill="none">
      <path d="M96 14c6 42-14 70-46 76-18 3-31-5-34-19C11 46 40 22 68 12c10-4 20-6 28 2z" fill="rgba(183,217,76,.22)"/>
      <path d="M18 96C30 58 56 32 92 18" stroke="rgba(183,217,76,.45)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M56 62c8-10 18-18 30-24M40 78c4-10 10-19 17-27" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>Réviser la SVT,<br><em>chapitre après chapitre</em></h1>
    <p>Le cours de Terminale se remplit unité par unité, au rythme de la classe. Les <b>rappels de Première</b> sont déjà rédigés en entier, et chaque unité renvoie vers les bases dont elle a besoin.</p>
    <div class="chips"><span class="chip">${nT} chapitres de Terminale</span><span class="chip">${nP} fiches de rappel</span><span class="chip">12 schémas interactifs</span><span class="chip">Hors ligne</span></div>
  </div>`;
  h += '<h2 class="sec">'+SPRIG+'Programme de Terminale</h2><div class="grid">';
  TERMINALE.forEach(th => {
    const n = th.parts.reduce((a,p)=>a+p.chapters.length,0);
    const fait = th.parts.reduce((a,p)=>a+p.chapters.filter(c=>c.html).length,0);
    const pct = Math.round(fait/n*100);
    h += `<button class="card withspec" style="--c:${th.color}" onclick="go('${th.id}')">
      ${spec(th.specs[0])}
      <div class="tag" style="color:${th.color}">${leafDot(th.color)}${th.n}</div>
      <h3>${th.title}</h3>
      <p>${th.parts.map(p=>p.title.replace(/^[A-C]\. /,"")).join(" · ")}</p>
      <div class="meta">${n} chapitres <span class="bar"><i style="width:${pct}%;background:${th.color}"></i></span> ${pct} %</div>
    </button>`;
  });
  h += '</div>';
  h += '<h2 class="sec">'+SPRIG+'Rappels de Première — prêts à réviser</h2><div class="grid">';
  PREMIERE.forEach(th => {
    const n = th.parts.reduce((a,p)=>a+p.chapters.length,0);
    h += `<button class="card withspec" style="--c:${th.color}" onclick="go('${th.id}')">
      ${spec(th.specs[0])}
      <div class="tag" style="color:${th.color}">${leafDot(th.color)}${th.n}</div>
      <h3>${th.title}</h3>
      <p>${th.parts.map(p=>p.title.replace(/^[A-C]\. /,"")).join(" · ")}</p>
      <div class="meta">${n} fiche${n>1?"s":""} <span class="bar"><i style="width:100%;background:${th.color}"></i></span> 100 %</div>
    </button>`;
  });
  h += '</div>';
  h += '<h2 class="sec">'+SPRIG+"Comment s'en servir</h2>"+
  `<div class="box def"><h4>Mode d'emploi</h4>
  <ul>
    <li><b>Les rappels de Première</b> sont complets : cours, schémas interactifs, pièges classiques et encadrés « Vers la Terminale ».</li>
    <li><b>Les chapitres de Terminale</b> suivent le découpage de la classe : chapitre, puis unités. Ceux qui sont rédigés portent la mention « Cours complet » ; les autres affichent leurs objectifs et un bouton <b>Rappels de 1ère</b> vers les fiches utiles.</li>
    <li><b>La recherche</b> (en haut) balaie tout le contenu : tape une notion, un mot du cours, un nom de molécule.</li>
    <li>Le fichier est <b>autonome</b> : aucune connexion nécessaire, il fonctionne depuis un téléphone comme depuis un ordinateur.</li>
  </ul></div>`;
  return h;
}

function pageListe(kind, seul){
  motifSeed = 0;
  const tree = seul ? [seul] : (kind==="t" ? TERMINALE : PREMIERE);
  const racine = kind==="t" ? "terminale" : "premiere";
  const nomRacine = kind==="t" ? "Programme de Terminale" : "Rappels de Première";
  const titre = seul ? seul.title : nomRacine;
  const sous = seul
    ? seul.parts.map(p=>p.title.replace(/^[A-C]\. /,"")).join(" · ")
    : (kind==="t"
      ? "Le découpage suit celui de la classe : chapitre, puis unités. Le cours arrive unité par unité ; partout ailleurs, les objectifs et les rappels de Première sont déjà en place."
      : "Quinze fiches complètes couvrant tout le programme de spécialité de Première.");
  let h = `<div class="pagehead" style="--c:${tree[0].color}">${bot(tree[0].motif,"pagebot")}
    ${seul ? `<div class="crumb"><a href="#${racine}">${nomRacine}</a> › <span>${seul.n}</span></div>` : ""}
    <h1 class="page">${titre}</h1><p class="lede">${sous}</p></div>`;
  tree.forEach(th => {
    if(!seul) h += `<h2 class="sec" style="color:${th.color}">${leafDot(th.color)}${th.n} — ${th.title}</h2>`;
    th.parts.forEach(pa => {
      h += `<div class="parthead">${pa.title}</div>`;
      // regrouper les chapitres-unités sous leur chapitre, les autres ensemble
      const groupes = [];
      pa.chapters.forEach(c => {
        const cle = c.chap ? c.chap.num : null;
        const dern = groupes[groupes.length-1];
        if(dern && dern.cle === cle) dern.items.push(c);
        else groupes.push({cle:cle, chap:c.chap, items:[c]});
      });
      const carte = c => {
        const etat = (c.kind==="p" || c.html
          ? '<span style="color:var(--leaf-2);font-weight:600">' + (c.kind==="p" ? "Fiche complète" : "Cours complet") + '</span>'
          : '<span style="color:var(--bark);font-weight:600">Objectifs + rappels 1ère</span>')
          + (QCM[c.id] ? ' <span class="pastille">QCM</span>' : '')
          + (typeof REDAC !== "undefined" && REDAC[c.id] ? ' <span class="pastille">Rédaction</span>' : '');
        return `<button class="card" style="--c:${th.color}" onclick="go('${c.id}')">
          ${iconMark(c.id)}
          <div class="tag" style="color:${th.color}">${kind==="t"?(c.chap?c.num:"Chapitre "+c.num):"Fiche "+c.num}</div>
          <h3>${c.title}</h3><p>${c.lede}</p>
          <div class="meta">${etat}</div>
        </button>`;
      };
      groupes.forEach(g => {
        if(g.chap){
          h += `<section class="chapgrp" style="--c:${th.color}">
            <div class="chaphead-l"><span>Chapitre ${g.chap.num}</span>${g.chap.title}</div>
            <div class="grid">${g.items.map(carte).join("")}</div></section>`;
        } else {
          h += `<div class="grid">${g.items.map(carte).join("")}</div>`;
        }
      });
    });
  });
  if(seul){
    const voisins = (kind==="t" ? TERMINALE : PREMIERE).filter(t => t.id !== seul.id);
    h += `<h2 class="sec">${SPRIG}Les autres thèmes</h2><div class="grid">`;
    voisins.forEach(t => {
      const n = t.parts.reduce((a,p)=>a+p.chapters.length,0);
      h += `<button class="card" style="--c:${t.color}" onclick="go('${t.id}')">
        <div class="tag" style="color:${t.color}">${leafDot(t.color)}${t.n}</div>
        <h3>${t.title}</h3>
        <p>${t.parts.map(p=>p.title.replace(/^[A-C]\. /,"")).join(" · ")}</p>
        <div class="meta">${n} ${kind==="t" ? "chapitre"+(n>1?"s":"") : "fiche"+(n>1?"s":"")}</div>
      </button>`;
    });
    h += '</div>';
  }
  return h;
}

function rappelBlock(c){
  if(!c.rappels || !c.rappels.length) return "";
  return `<div class="rappel">
    <div class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--bark)" stroke-width="1.9" stroke-linejoin="round"><path d="M4 5.6A2.6 2.6 0 016.6 3H19v15.4H6.6A2.6 2.6 0 004 21z"/><path d="M4 18.4h15"/></svg></div>
    <div style="flex:1">
      <div class="t">Rappels de 1ère</div>
      <div class="d">Avant d'attaquer ce chapitre, assure-toi que ces bases sont solides :</div>
      <div class="links">${c.rappels.map(r=>'<button class="rlink" onclick="go(\''+r[0]+'\')">'+r[1]+' →</button>').join("")}</div>
    </div></div>`;
}

function pageChapitre(c){
  const list = ORDER[c.kind], i = list.indexOf(c.id);
  const prev = i>0 ? CH[list[i-1]] : null, next = i<list.length-1 ? CH[list[i+1]] : null;
  const idxInTheme = c.theme.parts.reduce((acc,pa)=>acc.concat(pa.chapters),[]).indexOf(c);
  let h = `<div class="chaphead" style="--c:${c.theme.color}"><div class="ph-txt">
    <div class="crumb">
      <a href="#${c.kind==='t'?'terminale':'premiere'}">${c.kind==='t'?'Terminale':'Rappels de Première'}</a> ›
      <span>${c.theme.n}</span> › <span>${c.part.title}</span>${c.chap ? ' › <span>Chapitre '+c.chap.num+'</span>' : ''}
    </div>
    <h1 class="page">${c.title}</h1>
    <p class="lede">${c.lede}</p></div>
    ${medal(c.id)}</div>`;

  if(c.kind==="t"){
    h += rappelBlock(c);
    h += `<div class="box def"><h4>Ce que tu dois savoir faire</h4><ul>${c.objectifs.map(o=>"<li>"+o+"</li>").join("")}</ul></div>`;
    if(c.html){
      if(c.notions) h += '<div class="notions">'+c.notions.map(n=>'<span class="notion">'+n+'</span>').join("")+'</div>';
      h += '<article>'+c.html+'</article>';
      const vc = c.chap && VOCAB[c.chap.num];
      if(vc || REDAC[c.id] || QCM[c.id]){
        h += `<section class="revbloc"><h3 class="revtit">Réviser cette unité</h3>
          <p class="revsous">Dans cet ordre : apprendre les mots, puis rédiger sans le cours, puis se tester.</p>`;
        if(vc) h += `<button class="qcta" onclick="go('voc-${c.chap.num}')"><span class="revn">1</span><div>
            <b>Le vocabulaire</b>
            <span>La liste de Mme Philip en cartes : ${vc.mots.filter(x=>x.prof).map(x=>x.m.toLowerCase()).join(", ")}.</span>
          </div><span class="fl">→</span></button>`;
        if(REDAC[c.id]) h += `<button class="qcta" onclick="go('red-${c.id}')"><span class="revn">2</span><div>
            <b>S'entraîner à rédiger</b>
            <span>${REDAC[c.id].map(e=>e.titre.toLowerCase()).join(" ; ")} — puis comparer à la correction.</span>
          </div><span class="fl">→</span></button>`;
        if(QCM[c.id]) h += `<button class="qcta" onclick="go('qcm-${c.id}')"><span class="revn">3</span><div>
            <b>Le QCM</b>
            <span>${QCM[c.id].filter(q=>q.t==="cours").length} questions de cours, ${QCM[c.id].filter(q=>q.t==="rappel").length} de rappels de 1ère.</span>
          </div><span class="fl">→</span></button>`;
        h += `</section>`;
      }
    } else {
      h += `<div class="soon">
      ${spec("seedling")}
      <b>Cours en préparation</b>Ce chapitre sera rempli avec le cours complet, les schémas et les exercices. Pour l'instant, révise les rappels de Première ci-dessus : ce sont les prérequis exacts de ce chapitre.</div>`;
    }
  } else {
    if(c.notions) h += '<div class="notions">'+c.notions.map(n=>'<span class="notion">'+n+'</span>').join("")+'</div>';
    h += '<article>'+c.html+'</article>';
  }

  h += '<div class="pager">';
  h += prev ? `<button onclick="go('${prev.id}')"><div class="l">← Précédent</div><div class="v">${prev.title}</div></button>` : '<div style="flex:1"></div>';
  h += next ? `<button class="r" onclick="go('${next.id}')"><div class="l">Suivant →</div><div class="v">${next.title}</div></button>` : '<div style="flex:1"></div>';
  h += '</div>';
  return h;
}

/* ---------- recherche ---------- */
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function pageRecherche(q){
  q = (q||"").trim();
  if(q.length < 2) return `<h1 class="page">Recherche</h1><p class="lede">Tape au moins deux lettres. La recherche balaie les titres, les notions et le texte de toutes les fiches.</p>`;
  const nq = norm(q), words = nq.split(/\s+/).filter(Boolean);
  const hits = [];
  Object.values(CH).forEach(c => {
    let score = 0;
    words.forEach(w => {
      if(norm(c.title).includes(w)) score += 12;
      if((c.notions||[]).some(n=>norm(n).includes(w))) score += 8;
      if(norm(c.lede).includes(w)) score += 5;
      const m = c.norm.split(w).length - 1;
      score += Math.min(m,6);
    });
    if(score>0) hits.push({c,score});
  });
  hits.sort((a,b)=>b.score-a.score);
  if(!hits.length) return `<h1 class="page">Recherche</h1><p class="lede">Aucun résultat pour « ${q} ».</p>`;
  let h = `<div class="pagehead">${bot("umbel","pagebot")}<h1 class="page">Recherche</h1><p class="lede">${hits.length} résultat${hits.length>1?"s":""} pour « ${q} ».</p></div>`;
  hits.slice(0,30).forEach(({c}) => {
    const i = c.norm.indexOf(norm(words[0]));
    let ex = "";
    if(i>-1){
      const s = Math.max(0,i-70), e = Math.min(c.plain.length,i+140);
      ex = (s>0?"… ":"")+c.plain.slice(s,e)+" …";
      const re = new RegExp("("+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
      ex = ex.replace(re,"<mark>$1</mark>");
    }
    h += `<button class="res" onclick="go('${c.id}')">
      <div class="p">${c.kind==="t"?"Terminale":"Rappel 1ère"} · ${c.theme.n} · ${c.kind==="t"?(c.chap?"chap. "+c.chap.num+" · "+c.num.toLowerCase():"chap. "+c.num):"fiche "+c.num}</div>
      <div class="t">${c.title}</div><div class="s">${ex||c.lede}</div></button>`;
  });
  return h;
}

/* ---------- schémas ---------- */
function mountSchemas(root){
  root.querySelectorAll("[data-schema]").forEach(slot => {
    const s = SCHEMAS[slot.dataset.schema];
    if(!s){ slot.remove(); return; }
    const fig = document.createElement("figure");
    fig.className = "schema";
    fig.innerHTML = `<div class="stitle">${SPRIG}${s.title}</div>
      <div class="svgbox">${s.svg}</div>
      <div class="scrollhint">↔ fais glisser le schéma pour le voir en entier</div>
      <div class="ctrls"></div><div class="info"></div>
      <figcaption>${s.caption}</figcaption>`;
    slot.replaceWith(fig);
    const ctrls = fig.querySelector(".ctrls"), info = fig.querySelector(".info");

    if(s.mode === "steps"){
      const setStep = k => {
        s.groups.forEach((g,j) => {
          const el = fig.querySelector("#"+g);
          if(el){ el.style.opacity = j<=k ? 1 : .12; el.style.transition="opacity .3s"; }
        });
        [...ctrls.querySelectorAll("button[data-k]")].forEach((b,j)=>b.classList.toggle("on", j===k));
        info.innerHTML = s.steps[k].info;
        ctrls.querySelector(".step").textContent = "Étape " + (k+1) + " / " + s.steps.length;
      };
      s.steps.forEach((st,k) => {
        const b = document.createElement("button");
        b.textContent = st.label; b.dataset.k = k;
        b.onclick = () => setStep(k);
        ctrls.appendChild(b);
      });
      const sp = document.createElement("span"); sp.className="step"; ctrls.appendChild(sp);
      setStep(0);
    } else {
      const keys = Object.keys(s.spots);
      info.innerHTML = "<b>Clique sur une zone du schéma</b> pour afficher son explication.";
      fig.querySelectorAll("[data-spot]").forEach(g => {
        g.addEventListener("click", () => {
          info.innerHTML = s.spots[g.dataset.spot] || "";
          fig.querySelectorAll("[data-spot] .hitbg").forEach(x=>x.style.opacity=0);
          const bg = g.querySelector(".hitbg"); if(bg) bg.style.opacity=.2;
        });
      });
      const b = document.createElement("button");
      b.textContent = "Tout parcourir";
      let k = 0;
      b.onclick = () => {
        const el = fig.querySelector('[data-spot="'+keys[k]+'"]');
        if(el) el.dispatchEvent(new Event("click"));
        k = (k+1) % keys.length;
      };
      ctrls.appendChild(b);
    }
  });
}


/* =======================================================================
   GLOSSAIRE — repérage automatique des termes et bulle de définition
   ======================================================================= */
let GL_RE = null, GL_MAP = {};
function glRegex(){
  const alts = [];
  for(const id in GLOSSAIRE)
    for(const m of GLOSSAIRE[id].mots) alts.push([m, id]);
  alts.sort((a,b) => b[0].length - a[0].length);
  alts.forEach(([m,id]) => { GL_MAP[m.toLowerCase()] = id; });
  const esc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const src = "(" + alts.map(a => esc(a[0])).join("|") + ")";
  try { return new RegExp("(?<![\\p{L}\\p{N}])" + src + "(?![\\p{L}\\p{N}])", "giu"); }
  catch(e){ return new RegExp("\\b" + src + "\\b", "gi"); }
}

const GL_SKIP = "h1,h2,h3,h4,summary,figure,button,.gl,.glpop,.tag,.crumb,.notion,.notions,.rappel,.soon,.pager,nav";
function tagGlossaire(root){
  if(!GL_RE) GL_RE = glRegex();
  const compte = {};
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      if(n.parentElement.closest(GL_SKIP)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const noeuds = [];
  while(w.nextNode()) noeuds.push(w.currentNode);
  noeuds.forEach(node => {
    const txt = node.nodeValue;
    GL_RE.lastIndex = 0;
    let m, dernier = 0, frag = null;
    while((m = GL_RE.exec(txt)) !== null){
      const id = GL_MAP[m[1].toLowerCase()];
      if(!id) continue;
      compte[id] = (compte[id] || 0) + 1;
      if(compte[id] > 2) continue;
      frag = frag || document.createDocumentFragment();
      if(m.index > dernier) frag.appendChild(document.createTextNode(txt.slice(dernier, m.index)));
      const sp = document.createElement("span");
      sp.className = "gl"; sp.dataset.g = id; sp.textContent = m[1];
      frag.appendChild(sp);
      dernier = m.index + m[1].length;
    }
    if(frag){
      if(dernier < txt.length) frag.appendChild(document.createTextNode(txt.slice(dernier)));
      node.parentNode.replaceChild(frag, node);
    }
  });
}

let glAncre = null, glFixe = false, glT = null;
function glContenu(e){
  let h = '<button class="glclose" aria-label="Fermer">&times;</button>';
  h += '<div class="glmot">' + e.mot + '</div><div class="gldef">' + e.definition + '</div>';
  h += '<div class="glplace"><span class="lbl">Où ça intervient</span>' + e.place + '</div>';
  if(e.piege) h += '<div class="glpiege"><span class="lbl">Attention</span>' + e.piege + '</div>';
  if(e.voir && e.voir.length){
    const v = e.voir.filter(x => GLOSSAIRE[x]);
    if(v.length) h += '<div class="glsec"><span class="lbl">Voir aussi</span><div class="glvoir">' +
      v.map(x => '<button data-v="' + x + '">' + GLOSSAIRE[x].mot + '</button>').join("") + '</div></div>';
  }
  return h;
}
function glPlacer(){
  const pop = $("#glpop");
  if(!glAncre || !pop.classList.contains("on")) return;
  const bar = document.querySelector("header.top");
  const hautSafe = bar ? bar.getBoundingClientRect().bottom + 10 : 12;
  const r = glAncre.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const basNav = window.innerWidth <= 1000 ? 84 : 12;
  const placeDessous = vh - r.bottom - 22 - basNav;
  const placeDessus = r.top - hautSafe - 12;
  const dessous = placeDessous >= placeDessus;
  pop.style.maxHeight = Math.min(400, Math.max(150, dessous ? placeDessous : placeDessus)) + "px";
  const w = pop.offsetWidth, hgt = pop.offsetHeight;
  const left = Math.min(Math.max(12, r.left + r.width/2 - w/2), Math.max(12, vw - w - 12));
  const top = dessous ? r.bottom + 12 : Math.max(hautSafe, r.top - 12 - hgt);
  pop.style.left = left + "px"; pop.style.top = top + "px";
  pop.classList.toggle("below", dessous);
  pop.classList.toggle("above", !dessous);
  pop.style.setProperty("--cx", Math.min(Math.max(16, r.left + r.width/2 - left), w - 16) + "px");
}
function glOuvrir(id, ancre, fixe){
  const e = GLOSSAIRE[id];
  if(!e) return;
  clearTimeout(glT);
  const pop = $("#glpop");
  pop.innerHTML = glContenu(e);
  glAncre = ancre || glAncre;
  glFixe = !!fixe || glFixe;
  document.querySelectorAll(".gl.act").forEach(x => x.classList.remove("act"));
  if(glAncre) glAncre.classList.add("act");
  pop.classList.add("on");
  glPlacer();
  pop.querySelector(".glclose").onclick = glFermer;
  pop.querySelectorAll(".glvoir button").forEach(b =>
    b.onclick = ev => { ev.stopPropagation(); glOuvrir(b.dataset.v, glAncre, true); });
}
function glFermer(){
  clearTimeout(glT); glFixe = false; glAncre = null;
  $("#glpop").classList.remove("on");
  document.querySelectorAll(".gl.act").forEach(x => x.classList.remove("act"));
}
function glFermerDifferee(){ clearTimeout(glT); glT = setTimeout(() => { if(!glFixe) glFermer(); }, 220); }

const GL_FIN = matchMedia("(hover:hover) and (pointer:fine)").matches;
document.addEventListener("mouseover", ev => {
  if(!GL_FIN) return;
  const t = ev.target.closest(".gl");
  if(t){ clearTimeout(glT); glT = setTimeout(() => glOuvrir(t.dataset.g, t, false), 180); return; }
  if(ev.target.closest("#glpop")) clearTimeout(glT);
});
document.addEventListener("mouseout", ev => {
  if(!GL_FIN) return;
  if(ev.target.closest(".gl") || ev.target.closest("#glpop")) glFermerDifferee();
});
document.addEventListener("click", ev => {
  const t = ev.target.closest(".gl");
  if(t){ ev.stopPropagation(); glOuvrir(t.dataset.g, t, true); return; }
  if(!ev.target.closest("#glpop")) glFermer();
});
document.addEventListener("keydown", e => { if(e.key === "Escape") glFermer(); });
window.addEventListener("scroll", () => { if(glFixe) glPlacer(); else glFermer(); }, {passive:true});
window.addEventListener("resize", glPlacer);

/* ---------- routeur ---------- */
function go(r){ location.hash = r; }
function render(){
  const r = decodeURIComponent(location.hash.slice(1)) || "accueil";
  let html;
  if(r === "accueil") html = pageAccueil();
  else if(r === "terminale") html = pageListe("t");
  else if(r === "premiere") html = pageListe("p");
  else if(r === "recherche") html = pageRecherche($("#q").value);
  else if(TH[r]) html = pageListe(TH[r].kind, TH[r].theme);
  else if(r.startsWith("qcm-") && CH[r.slice(4)]) html = pageQcm(r.slice(4));
  else if(r.startsWith("voc-") && VOCAB[r.slice(4)]) html = pageVoc(r.slice(4));
  else if(r.startsWith("red-") && REDAC[r.slice(4)]) html = pageRedac(r.slice(4));
  else if(CH[r]) html = pageChapitre(CH[r]);
  else html = pageAccueil();
  view.innerHTML = html;
  if(r.startsWith("qcm-") && QCM[r.slice(4)]) qcmAccueil(r.slice(4));
  if(r.startsWith("voc-") && VOCAB[r.slice(4)]) vocAccueil(r.slice(4));
  mountSchemas(view);
  glFermer();
  if(CH[r] && CH[r].html) tagGlossaire(view);
  window.scrollTo(0,0);

  side.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#"+r));
  const on = side.querySelector("a.on");
  if(on) on.closest(".grp").classList.add("open");
  const ch = CH[r] || CH[r.replace(/^(qcm|red)-/, "")]
    || (r.startsWith("voc-") && VOCAB[r.slice(4)] ? CH[VOCAB[r.slice(4)].unites[0]] : undefined);
  const th = TH[r];
  document.querySelectorAll("#bottomnav button").forEach(b => {
    const k = b.dataset.go;
    // toujours un booléen : avec undefined, classList.toggle inverse la classe au lieu de la retirer
    const actif = k === r
      || (!!ch && k === "terminale" && ch.kind === "t")
      || (!!ch && k === "premiere"  && ch.kind === "p")
      || (!!th && k === "terminale" && th.kind === "t")
      || (!!th && k === "premiere"  && th.kind === "p");
    b.classList.toggle("on", actif);
  });
  // sur la page d'un thème, déplier son groupe dans le volet latéral
  if(th){
    const grp = side.querySelector('.grp[data-g="'+r+'"]');
    if(grp) grp.classList.add("open");
  }
  side.classList.remove("open"); $("#backdrop").classList.remove("on");
}
window.addEventListener("hashchange", render);

/* ---------- interactions ---------- */
$("#menubtn").onclick = () => { side.classList.toggle("open"); $("#backdrop").classList.toggle("on"); };
$("#backdrop").onclick = () => { side.classList.remove("open"); $("#backdrop").classList.remove("on"); };
document.querySelectorAll("#bottomnav button").forEach(b => b.onclick = () => {
  if(b.dataset.go === "recherche"){ go("recherche"); $("#q").focus(); } else go(b.dataset.go);
});
let tmr;
$("#q").addEventListener("input", () => {
  clearTimeout(tmr);
  tmr = setTimeout(() => {
    if($("#q").value.trim().length >= 2){
      if(location.hash !== "#recherche") go("recherche"); else render();
    }
  }, 200);
});
$("#q").addEventListener("keydown", e => { if(e.key === "Enter"){ go("recherche"); render(); } });

let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
function applyTheme(){ document.documentElement.setAttribute("data-theme", theme); }
$("#themebtn").onclick = () => { theme = theme==="dark" ? "light" : "dark"; applyTheme(); };
applyTheme();

buildSide();
render();
</script>
