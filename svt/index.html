{
  id:"p10", num:"10", title:"Patrimoine génétique et santé",
  lede:"Pourquoi certaines maladies se transmettent-elles selon des règles strictes, et d'autres pas du tout ?",
  notions:["maladie monogénique","récessif / dominant","multifactoriel","prédisposition","dépistage"],
  html:`
<h2>1. Les maladies monogéniques</h2>
<p>Une seule paire d'allèles suffit à déterminer le phénotype. Deux exemples de référence :</p>
<div class="tablewrap"><table>
<tr><th>Maladie</th><th>Gène / protéine</th><th>Transmission</th><th>Mécanisme</th></tr>
<tr><td><b>Mucoviscidose</b></td><td>CFTR — canal à ions chlorure</td><td>Autosomique <b>récessive</b></td><td>Délétion la plus fréquente : perte de 3 nucléotides → un acide aminé manquant → protéine mal repliée, non adressée à la membrane → mucus épais</td></tr>
<tr><td><b>Drépanocytose</b></td><td>Bêta-globine de l'hémoglobine</td><td>Autosomique récessive</td><td>Substitution d'un seul nucléotide → un acide aminé changé → l'hémoglobine polymérise → hématies en faucille</td></tr>
</table></div>
<p>Ces exemples illustrent parfaitement la chaîne <b>gène → protéine → phénotype cellulaire → phénotype macroscopique</b>. Sache la dérouler dans les deux sens.</p>

<h2>2. Lire un arbre généalogique</h2>
<div class="box def"><h4>Méthode en 3 réflexes</h4>
<ol>
<li><b>Récessif ou dominant ?</b> Deux parents sains ayant un enfant atteint ⇒ l'allèle est <b>récessif</b> (et les parents sont hétérozygotes). Un enfant sain de deux parents atteints ⇒ l'allèle est <b>dominant</b>.</li>
<li><b>Autosomique ou lié à X ?</b> Une fille atteinte dont le père est sain élimine la transmission liée à X récessive. Une nette majorité de garçons atteints oriente vers X.</li>
<li><b>Écris les génotypes</b> case par case, puis calcule les probabilités avec un échiquier de croisement. Ne conclus jamais sans avoir posé les génotypes.</li>
</ol></div>

<h2>3. Les maladies multifactorielles</h2>
<p>La plupart des maladies fréquentes (diabète de type 2, obésité, hypertension, maladies cardiovasculaires, la plupart des cancers) résultent de la combinaison de <b>plusieurs gènes de prédisposition</b> et de <b>facteurs environnementaux</b> (alimentation, activité physique, tabac, stress).</p>
<div class="box def"><h4>Prédisposition ≠ fatalité</h4>
<p>Porter un allèle de prédisposition augmente la <b>probabilité</b> de développer la maladie, il ne la détermine pas. Les <b>études de jumeaux</b> le montrent : pour le diabète de type 2, la concordance entre vrais jumeaux est élevée mais loin de 100 %, ce qui prouve le poids de l'environnement.</p></div>

<h2>4. Enjeux médicaux</h2>
<p>Le <b>dépistage néonatal</b> permet une prise en charge précoce ; le <b>diagnostic prénatal</b> et le <b>conseil génétique</b> posent des questions éthiques (dépister quoi, jusqu'où, avec quel consentement). Les <b>thérapies géniques</b> et les techniques d'édition du génome (CRISPR-Cas9) ouvrent des perspectives, mais restent limitées et encadrées.</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« Le gène de la mucoviscidose. » Formulation à éviter : c'est le <b>gène CFTR</b>, et c'est un <b>allèle muté</b> de ce gène qui est responsable. Tout le monde possède le gène ; tout le monde n'a pas l'allèle muté. Distingue rigoureusement <b>gène</b> (position, fonction) et <b>allèle</b> (version).</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Monogénique : un gène, transmission mendélienne prévisible.</li>
<li>Mucoviscidose (CFTR, délétion) et drépanocytose (substitution) : les deux exemples à maîtriser.</li>
<li>Multifactoriel : gènes de prédisposition × environnement.</li>
<li>Prédisposition = probabilité accrue, pas destin.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Le raisonnement sur les génotypes et les échiquiers de croisement est directement réinvesti dans « <b>L'origine du génotype des individus</b> » (brassages méiotiques) et dans les calculs de fréquences alléliques (<b>Hardy-Weinberg</b>).</p></div>`
},

{
  id:"p11", num:"11", title:"Altérations du génome et cancérisation",
  lede:"Comment une cellule normale devient-elle une cellule cancéreuse ?",
  notions:["mutation somatique","oncogène","gène suppresseur","clone","facteur de risque"],
  html:`
<h2>1. Le cancer, une maladie du contrôle de la division</h2>
<p>Le cycle cellulaire est normalement surveillé par des <b>points de contrôle</b> : la cellule ne se divise que si son ADN est intact et si les signaux du milieu l'y autorisent. Le cancer naît quand ces contrôles sont perdus.</p>
<p>Deux familles de gènes sont impliquées :</p>
<ul>
  <li>les <b>proto-oncogènes</b>, qui stimulent normalement la division. Mutés, ils deviennent des <span class="kw">oncogènes</span> hyperactifs : l'accélérateur reste bloqué.</li>
  <li>les <b>gènes suppresseurs de tumeurs</b> (p53, BRCA1/2), qui freinent la division ou déclenchent l'<b>apoptose</b>. Mutés, ils perdent leur fonction : le frein est cassé.</li>
</ul>

<h2>2. Un processus par accumulation</h2>
<p>Une seule mutation ne suffit jamais. La cancérisation exige l'<b>accumulation de plusieurs mutations somatiques</b> dans une même lignée cellulaire, sur des années. À chaque étape, la cellule mutée se divise davantage que ses voisines et transmet ses mutations à son <b>clone</b> : c'est une véritable <b>sélection naturelle à l'échelle du tissu</b>.</p>
<p>Étapes : cellule initiée → prolifération incontrôlée → <b>tumeur bénigne</b> → acquisition de la capacité d'invasion et de l'<b>angiogenèse</b> → <b>tumeur maligne</b> → <b>métastases</b> par dissémination sanguine ou lymphatique.</p>

<h2>3. Les facteurs de risque</h2>
<div class="tablewrap"><table>
<tr><th>Facteur</th><th>Mécanisme</th><th>Exemple</th></tr>
<tr><td><b>Tabac</b></td><td>Agents mutagènes chimiques (benzopyrène) qui altèrent l'ADN, notamment p53</td><td>Cancer du poumon</td></tr>
<tr><td><b>UV</b></td><td>Dimères de thymine, erreurs de réparation</td><td>Mélanome</td></tr>
<tr><td><b>Virus</b></td><td>Insertion de gènes viraux perturbant le cycle cellulaire</td><td><b>HPV</b> → cancer du col de l'utérus ; hépatite B → foie</td></tr>
<tr><td><b>Hérédité</b></td><td>Une mutation germinale préexistante réduit le nombre de mutations restant à accumuler</td><td>BRCA1/2 (sein, ovaire)</td></tr>
</table></div>

<h2>4. Prévention et dépistage</h2>
<p>Une large part des cancers est <b>évitable</b> : arrêt du tabac, protection solaire, alimentation, activité physique, <b>vaccination contre HPV et hépatite B</b>. Le dépistage organisé (mammographie, frottis, test colorectal) permet un diagnostic précoce, quand le traitement est le plus efficace.</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« Le cancer est héréditaire. » À nuancer fortement : les mutations responsables sont <b>somatiques</b> dans l'immense majorité des cas, donc <b>non transmissibles</b>. Seule une <b>prédisposition</b> (mutation germinale d'un gène suppresseur, comme BRCA1) est héritée — elle augmente le risque, elle n'est pas le cancer lui-même.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Cancer = perte du contrôle du cycle cellulaire.</li>
<li>Oncogènes (accélérateur bloqué) et gènes suppresseurs (frein cassé).</li>
<li>Accumulation de mutations somatiques → clone → tumeur → métastases.</li>
<li>Facteurs de risque en grande partie évitables ; prédisposition ≠ transmission du cancer.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>La logique « mutation → avantage de division → expansion du clone » est <b>exactement</b> celle de la sélection naturelle que tu formaliseras en Terminale. Le cancer est un excellent exemple d'évolution observable à l'échelle d'un organisme.</p></div>`
},

{
  id:"p12", num:"12", title:"Variation génétique bactérienne et résistance aux antibiotiques",
  lede:"Pourquoi les antibiotiques deviennent-ils de moins en moins efficaces ?",
  notions:["antibiotique","résistance","transfert horizontal","plasmide","pression de sélection"],
  html:`
<h2>1. Comment une bactérie devient résistante</h2>
<p>Deux origines, à bien distinguer :</p>
<div class="tablewrap"><table>
<tr><th></th><th>Transfert vertical</th><th>Transfert horizontal</th></tr>
<tr><td>Mécanisme</td><td><b>Mutation spontanée</b> transmise à la descendance lors de la division</td><td>Échange de gènes entre bactéries <b>contemporaines</b>, parfois d'espèces différentes</td></tr>
<tr><td>Support</td><td>Chromosome bactérien</td><td><b>Plasmide</b> (conjugaison), transformation, transduction par bactériophage</td></tr>
<tr><td>Vitesse de diffusion</td><td>Lente (limitée par le taux de mutation)</td><td><b>Très rapide</b> — explique les résistances multiples</td></tr>
</table></div>
<p>Les mécanismes de résistance eux-mêmes sont variés : production d'une <b>enzyme qui dégrade l'antibiotique</b> (bêta-lactamase), modification de la cible, <b>pompes d'efflux</b> qui expulsent la molécule, imperméabilité de la paroi.</p>

<h2>2. La pression de sélection</h2>
<div class="box def"><h4>Le raisonnement à connaître par cœur</h4>
<ol>
<li>Dans une population bactérienne, quelques individus portent <b>par hasard</b> une mutation de résistance — <b>avant tout contact</b> avec l'antibiotique.</li>
<li>L'antibiotique élimine les bactéries sensibles : il ne crée rien, il <b>trie</b>.</li>
<li>Les résistantes, désormais sans concurrence et disposant de toutes les ressources, se multiplient.</li>
<li>En quelques générations (20 min chacune !), la population est majoritairement résistante.</li>
</ol>
<p>C'est une <b>sélection naturelle en accéléré</b>, observable en TP par un <b>antibiogramme</b> : le diamètre du disque d'inhibition mesure la sensibilité de la souche.</p></div>

<h2>3. Un enjeu de santé publique</h2>
<p>Facteurs aggravants : prescriptions inutiles (les antibiotiques sont <b>inefficaces contre les virus</b>), traitements interrompus trop tôt, usage massif en <b>élevage</b>, diffusion internationale. Conséquence : des impasses thérapeutiques croissantes, alors que peu de nouvelles familles d'antibiotiques sont découvertes.</p>
<p>Leviers d'action : bon usage (« les antibiotiques, c'est pas automatique »), respect de la durée, hygiène hospitalière, vaccination, restriction en élevage, recherche d'alternatives (phagothérapie).</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>Trois formulations à bannir : « la bactérie s'adapte à l'antibiotique », « elle mute pour survivre », « elle devient immunisée ». La bonne formulation : <b>les mutations préexistent au hasard, l'antibiotique sélectionne les bactéries déjà résistantes</b>. Cette phrase, bien placée, rapporte souvent des points à elle seule.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Résistance par mutation (verticale) ou par transfert horizontal (plasmides).</li>
<li>L'antibiotique = agent de sélection, jamais cause de la mutation.</li>
<li>Antibiogramme : diamètre d'inhibition ↔ sensibilité.</li>
<li>Antibiotiques inefficaces contre les virus.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Chapitre prérequis majeur : les <b>transferts horizontaux</b> reviennent dans « La complexification des génomes », et la résistance bactérienne est l'exemple canonique du chapitre « <b>L'humain influe sur l'évolution biologique</b> ».</p></div>`

{
  id:"p13", num:"13", title:"L'immunité innée",
  lede:"Quelle est la première ligne de défense, celle qui agit en quelques minutes ?",
  notions:["inflammation","médiateurs","phagocytose","cellules sentinelles","AINS"],
  html:`
<h2>1. Trois caractères définissent l'immunité innée</h2>
<ul>
  <li><b>Immédiate</b> : elle se déclenche en quelques minutes.</li>
  <li><b>Non spécifique</b> : elle répond de la même façon à des agresseurs très différents, car elle reconnaît des <b>motifs moléculaires communs</b> aux microbes.</li>
  <li><b>Sans mémoire</b> : elle est identique au premier et au centième contact.</li>
</ul>
<p>Elle est <b>très ancienne dans l'évolution</b> : on la retrouve chez tous les animaux, ce qui montre son efficacité. Elle suffit à régler la grande majorité des infections.</p>

<h2>2. La réaction inflammatoire aiguë</h2>
<div data-schema="immunite"></div>

<h2>3. Les quatre signes cardinaux et leur explication</h2>
<div class="tablewrap"><table>
<tr><th>Signe</th><th>Mécanisme</th></tr>
<tr><td><b>Rougeur</b></td><td>Vasodilatation locale des capillaires</td></tr>
<tr><td><b>Chaleur</b></td><td>Augmentation du débit sanguin local</td></tr>
<tr><td><b>Gonflement (œdème)</b></td><td>Augmentation de la perméabilité des vaisseaux → passage de plasma dans les tissus</td></tr>
<tr><td><b>Douleur</b></td><td>Action des médiateurs (prostaglandines) sur les terminaisons nerveuses + compression par l'œdème</td></tr>
</table></div>
<p>Ces signes ne sont pas des « dégâts » : ils traduisent l'<b>arrivée massive de cellules immunitaires</b> sur le site de l'infection.</p>

<h2>4. Acteurs et molécules</h2>
<ul>
  <li><b>Cellules sentinelles</b> (macrophages, mastocytes, cellules dendritiques) présentes dans tous les tissus : elles détectent et déclenchent.</li>
  <li><b>Médiateurs chimiques</b> : histamine, prostaglandines, cytokines. Ils provoquent la vasodilatation et attirent les autres cellules.</li>
  <li><b>Phagocytes</b> : granulocytes puis macrophages. Phagocytose en 4 temps : <b>adhésion → ingestion → digestion → élimination</b> des déchets (le pus est constitué de cellules mortes et de débris).</li>
</ul>

<div class="box plus"><h4>Approfondir — pourquoi les anti-inflammatoires soulagent</h4>
<p>Les <b>AINS</b> (aspirine, ibuprofène) inhibent une enzyme, la <b>cyclo-oxygénase</b>, qui produit les <b>prostaglandines</b>. Moins de prostaglandines = moins de douleur, moins de vasodilatation, moins de fièvre. Mais attention au raisonnement : en atténuant l'inflammation, on atténue aussi une <b>réponse utile</b>. C'est un bon exemple de lien avec le chapitre sur les enzymes : un médicament est très souvent un <b>inhibiteur enzymatique</b>.</p></div>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>L'inflammation n'est pas une maladie ni un dysfonctionnement : c'est une <b>réponse adaptée et bénéfique</b>. Elle ne devient problématique que si elle est <b>chronique</b> ou disproportionnée.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Innée = immédiate, non spécifique, sans mémoire, universelle chez les animaux.</li>
<li>4 signes : rougeur, chaleur, gonflement, douleur.</li>
<li>Cellules sentinelles → médiateurs → recrutement → phagocytose (4 étapes).</li>
<li>AINS = inhibiteurs de la synthèse des prostaglandines.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Le programme de Terminale reprend intégralement le système immunitaire dans « <b>Le fonctionnement du système immunitaire humain</b> » : ce chapitre en est le socle, notamment le rôle charnière de la <b>cellule dendritique</b>.</p></div>`
},

{
  id:"p14", num:"14", title:"L'immunité adaptative",
  lede:"Comment l'organisme fabrique-t-il une réponse sur mesure contre un agresseur précis ?",
  notions:["antigène","LB / LT4 / LT8","sélection clonale","anticorps","mémoire immunitaire"],
  html:`
<h2>1. Une réponse spécifique, lente, mais dotée d'une mémoire</h2>
<p>Quand l'immunité innée ne suffit pas, la cellule dendritique migre vers un <b>ganglion lymphatique</b> et y présente l'antigène. S'enclenche alors une réponse <b>spécifique d'un antigène</b>, qui met <b>plusieurs jours</b> à se mettre en place mais laisse une <b>mémoire durable</b>.</p>

<h2>2. La sélection clonale</h2>
<div class="box def"><h4>Le mécanisme central</h4>
<p>Chaque lymphocyte possède, avant tout contact, un récepteur d'un <b>seul type</b>. L'organisme en produit des millions de spécificités différentes, au hasard. L'antigène ne « fabrique » donc rien : il <b>sélectionne</b> les rares lymphocytes capables de le reconnaître, qui se <b>multiplient</b> (amplification clonale) puis se <b>différencient</b> en cellules effectrices. Le répertoire précède la rencontre.</p></div>

<h2>3. Les trois acteurs</h2>
<div class="tablewrap"><table>
<tr><th>Lymphocyte</th><th>Reconnaît</th><th>Devient</th><th>Action</th></tr>
<tr><td><b>LT4 auxiliaire</b></td><td>L'antigène présenté par la cellule dendritique</td><td>LT4 sécréteur d'interleukines</td><td><b>Chef d'orchestre</b> : sans lui, ni LB ni LT8 ne s'activent pleinement</td></tr>
<tr><td><b>LB</b></td><td>L'antigène <b>libre</b>, sous sa forme native</td><td><b>Plasmocyte</b></td><td>Sécrète des <b>anticorps</b> → immunité humorale</td></tr>
<tr><td><b>LT8</b></td><td>L'antigène présenté par une cellule infectée</td><td><b>LT cytotoxique</b></td><td>Détruit les cellules infectées → immunité cellulaire</td></tr>
</table></div>

<h2>4. Les anticorps</h2>
<div data-schema="anticorps"></div>

<h2>5. La mémoire immunitaire</h2>
<p>Une partie des lymphocytes sélectionnés devient des <b>cellules mémoire</b>, à longue durée de vie. Lors d'un second contact avec le même antigène, la réponse est :</p>
<ul>
  <li>plus <b>rapide</b> (quelques jours au lieu de deux semaines) ;</li>
  <li>plus <b>intense</b> (bien plus d'anticorps produits) ;</li>
  <li>plus <b>durable</b>.</li>
</ul>
<p>C'est cette différence entre réponse primaire et réponse secondaire qui fonde la <b>vaccination</b> — savoir commenter les deux courbes est un grand classique d'exercice.</p>

<div class="box plus"><h4>Approfondir — pourquoi le VIH est-il si dévastateur</h4>
<p>Le VIH infecte et détruit précisément les <b>LT4</b>. Or les LT4 sont indispensables à l'activation des LB comme des LT8. En supprimant le chef d'orchestre, le virus paralyse <b>toute</b> l'immunité adaptative : le malade meurt d'infections opportunistes normalement bénignes. C'est l'argument qui démontre le rôle pivot du LT4 — attends-toi à devoir le construire à partir de courbes de charge virale et de taux de LT4.</p></div>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« Les anticorps détruisent les microbes. » <b>Non</b> : ils les <b>neutralisent</b> et forment des <b>complexes immuns</b> ; la destruction est ensuite assurée par la <b>phagocytose</b>. Autre confusion : anticorps = molécules (immunité humorale) ; LT8 = cellules (immunité cellulaire).</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Adaptative = spécifique, lente, avec mémoire.</li>
<li>Sélection clonale : le répertoire préexiste, l'antigène trie.</li>
<li>LT4 = chef d'orchestre ; LB → plasmocytes → anticorps ; LT8 → cytotoxiques.</li>
<li>Réponse secondaire plus rapide, plus intense, plus durable.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Ce chapitre est repris et approfondi en Terminale (phénotype immunitaire, immunothérapies). Les schémas de sélection clonale sont attendus tels quels au bac.</p></div>`
},

{
  id:"p15", num:"15", title:"L'utilisation de l'immunité adaptative en santé",
  lede:"Comment la médecine exploite-t-elle les mécanismes immunitaires ?",
  notions:["vaccination","adjuvant","couverture vaccinale","sérothérapie","anticorps monoclonaux"],
  html:`
<h2>1. La vaccination : provoquer la mémoire sans la maladie</h2>
<p>Un vaccin contient un <b>antigène rendu inoffensif</b> (agent inactivé, atténué, fragment protéique, ou ARN messager codant un antigène). Il déclenche une <b>réponse primaire complète</b>, donc la formation de <b>cellules mémoire</b>, sans provoquer la maladie.</p>
<p>Les <b>adjuvants</b> stimulent l'immunité innée locale, ce qui renforce l'activation de l'immunité adaptative — d'où la petite inflammation au point d'injection, signe que le vaccin fonctionne.</p>
<p>Les <b>rappels</b> exploitent la réponse secondaire pour maintenir un taux protecteur d'anticorps et enrichir le stock de cellules mémoire.</p>

<div class="box def"><h4>L'immunité collective</h4>
<p>Au-delà d'un certain <b>taux de couverture vaccinale</b>, la transmission de l'agent s'effondre : les personnes non vaccinables (nourrissons, immunodéprimés) sont protégées indirectement. Le seuil dépend de la contagiosité — environ <b>95 % pour la rougeole</b>, très contagieuse. C'est l'argument central de tout raisonnement sur les politiques vaccinales.</p></div>

<h2>2. Vaccination et sérothérapie : ne pas confondre</h2>
<div class="tablewrap"><table>
<tr><th></th><th>Vaccination</th><th>Sérothérapie</th></tr>
<tr><td>Ce qu'on injecte</td><td>Un antigène inoffensif</td><td>Des <b>anticorps déjà formés</b></td></tr>
<tr><td>Type d'immunité</td><td><b>Active</b> — l'organisme travaille</td><td><b>Passive</b> — l'organisme ne fait rien</td></tr>
<tr><td>Délai d'action</td><td>Plusieurs semaines</td><td><b>Immédiat</b></td></tr>
<tr><td>Durée</td><td>Longue (mémoire)</td><td>Courte (quelques semaines), <b>aucune mémoire</b></td></tr>
<tr><td>Usage</td><td>Prévention</td><td>Urgence : morsure de serpent, tétanos après blessure</td></tr>
</table></div>

<h2>3. Les anticorps monoclonaux</h2>
<p>Ce sont des anticorps <b>tous identiques</b>, produits en masse à partir d'un unique clone de plasmocyte, et dirigés contre une cible unique choisie. Applications :</p>
<ul>
  <li><b>Diagnostic</b> : tests de grossesse, tests antigéniques rapides.</li>
  <li><b>Thérapie</b> : ciblage de cellules cancéreuses, traitement de maladies auto-immunes.</li>
  <li><b>Recherche</b> : identification et localisation de protéines.</li>
</ul>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>« Le sérum est un vaccin qui agit vite. » <b>Non</b> : le sérum n'immunise pas. Aucune cellule mémoire n'est produite, la protection disparaît avec les anticorps injectés. Vaccin = <b>préventif et durable</b> ; sérum = <b>curatif et transitoire</b>.</p></div>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Vaccin = antigène inoffensif + adjuvant → réponse primaire → cellules mémoire.</li>
<li>Rappels = exploitation de la réponse secondaire.</li>
<li>Immunité collective : seuil de couverture (~95 % pour la rougeole).</li>
<li>Vaccination = immunité active durable ; sérothérapie = immunité passive immédiate et brève.</li>
</ul></div>

<div class="box next"><h4>Vers la Terminale</h4>
<p>Le programme de Terminale prolonge ce chapitre avec le <b>phénotype immunitaire</b> (qui évolue au cours de la vie selon les rencontres antigéniques) et les <b>immunothérapies</b> anticancéreuses.</p></div>`
}

        html:`<h2>A. Le problème</h2>
<p>Tu es parti d'une seule cellule. Une cellule-œuf, un seul noyau, un seul lot d'information génétique. Aujourd'hui tu en comptes des dizaines de milliers de milliards, et chacune descend de celle-là par une chaîne ininterrompue de divisions.</p>
<p>Deux constats s'opposent alors, et c'est leur tension qui fait toute l'unité.</p>
<ul>
  <li><b>La stabilité.</b> Toutes ces cellules portent, à très peu de chose près, la même information. Le caryotype de l'espèce humaine se maintient identique d'une division à l'autre, et d'une génération à l'autre.</li>
  <li><b>La diversité.</b> Et pourtant, un même organe peut présenter des phénotypes différents. La peau bicolore d'un chat en donne l'image la plus immédiate : toutes ces cellules de peau descendent de la même cellule-œuf, et elles ne font pas la même chose.</li>
</ul>

<div class="box def"><h4>La question à laquelle l'unité répond</h4>
<p>Quelles peuvent être les conséquences des modifications génétiques survenant au cours de la multiplication d'un clone cellulaire ?</p></div>

<p>On va donc procéder dans cet ordre : d'abord comprendre ce qu'est un clone et à quoi il sert, puis par quel mécanisme il reste conforme, puis pourquoi cette conformité n'est jamais parfaite, et enfin ce que cette imperfection produit — du grain de beauté à la tumeur.</p>

<h2>B. Le clone, unité de base du vivant pluricellulaire</h2>

<h3>1. Définition</h3>
<div class="box def"><h4>Clone</h4>
<p>Un <span class="kw">clone</span> est un ensemble de cellules qui, par <b>mitoses successives</b>, se copient pour donner des cellules filles génétiquement identiques à la cellule de départ. Le mot désigne aussi bien cet ensemble que l'unique cellule qui en est à l'origine.</p>
<p>Un clone est donc une <b>reproduction exacte</b> de l'information génétique du vivant : de la copie, pas de la création.</p></div>

<p>Attention au mot : dans le langage courant, « clonage » évoque la brebis Dolly et le laboratoire. En biologie cellulaire, c'est un phénomène parfaitement ordinaire, qui se produit dans ton corps à chaque seconde. Ton intestin en fabrique plusieurs milliards par jour.</p>

<h3>2. Deux formes, une même mécanique</h3>
<p>Les cellules d'un clone ne sont pas forcément collées les unes aux autres :</p>
<ul>
  <li>elles peuvent rester <b>associées et jointives</b> — on parle alors d'un <b>tissu</b>, comme l'épiderme ou l'épithélium intestinal ;</li>
  <li>elles peuvent <b>se séparer</b> et circuler indépendamment — c'est le cas des lymphocytes B issus d'un même lymphocyte activé.</li>
</ul>
<p>La différence est spatiale, pas génétique. Dans les deux cas, la parenté est la même : une cellule mère, des mitoses, des copies.</p>

<h3>3. Cinq fonctions essentielles du vivant</h3>
<p>C'est le point que l'on attend en devoir. Une seule mécanique, la mitose, rend possibles des fonctions qui n'ont apparemment rien à voir entre elles :</p>
<ol>
  <li>la <b>croissance</b> des tissus : un organisme grandit parce que ses cellules se copient ;</li>
  <li>la <b>régénération</b> des tissus lésés : cicatrisation d'une plaie, renouvellement des cellules intestinales mortes ;</li>
  <li>la <b>reproduction asexuée</b> chez les végétaux et les bactéries : des individus entiers produits par simples mitoses, sans intervention de deux partenaires ;</li>
  <li>la <b>défense immunitaire</b> : face à un antigène, le lymphocyte qui le reconnaît se multiplie à l'identique pour produire une armée de cellules de même spécificité ;</li>
  <li>le <b>partage et la collaboration</b> entre cellules d'un même organisme.</li>
</ol>

<div class="box plus"><h4>Approfondir — Pando, un clone de 80 000 ans</h4>
<p>Dans l'Utah, une colonie de peupliers faux-trembles nommée Pando couvre 43 hectares. Ce qui ressemble à une forêt de dizaines de milliers d'arbres est en réalité <b>un seul individu</b> : tous les troncs sont reliés par un unique système racinaire et sont génétiquement identiques. Ils sont apparus par drageonnage, c'est-à-dire par mitoses à partir des racines.</p>
<p>L'intérêt pour l'organisme est direct : les racines partagent eau et nutriments entre tous les troncs. Un tronc à l'ombre est nourri par ses voisins au soleil — la cinquième fonction, la collaboration, à l'échelle d'un hectare.</p></div>

<h3>4. Une conséquence médicale : l'autogreffe</h3>
<p>Les cellules d'un clone sont identiques <b>phénotypiquement et génétiquement</b>. Elles portent donc exactement les mêmes marqueurs de surface — ces molécules par lesquelles le système immunitaire distingue le « soi » du « non-soi ».</p>
<p>D'où la possibilité de cultiver en laboratoire, à partir d'un fragment de peau du patient, un clone de cellules d'épiderme que l'on greffe ensuite sur ses brûlures. Le système immunitaire ne réagit pas : il ne voit que du « soi ». C'est précisément ce que l'on ne peut pas faire avec la peau d'un donneur, qui serait rejetée.</p>

</div>

<h2>C. Le mécanisme de la conformité : la mitose</h2>
<div data-schema="mitose"></div>

<h3>1. Ce qui varie, ce qui ne varie pas</h3>
<p>C'est la distinction qui fait tomber la moitié des copies. Reprends le cycle cellulaire :</p>
<div class="tablewrap"><table>
<tr><th>Étape</th><th>Nombre de chromosomes</th><th>Chromatides par chromosome</th><th>Quantité d'ADN</th></tr>
<tr><td>G1</td><td>2n</td><td>1</td><td>Q</td></tr>
<tr><td>Après la phase S</td><td>2n</td><td>2</td><td>2Q</td></tr>
<tr><td>Métaphase</td><td>2n</td><td>2</td><td>2Q</td></tr>
<tr><td>Après l'anaphase, par futur noyau</td><td>2n</td><td>1</td><td>Q</td></tr>
</table></div>
<p>Une seule colonne ne bouge jamais : le <b>nombre de chromosomes</b>. Ce que la phase S double, ce n'est pas le nombre de chromosomes mais le nombre de chromatides — donc la quantité d'ADN. Et l'anaphase ne divise pas le nombre de chromosomes : elle sépare les deux chromatides de chacun, si bien que chaque pôle reçoit un lot complet de 2n chromosomes à une chromatide.</p>

<h3>2. Pourquoi cela garantit la conformité</h3>
<p>La conformité de la mitose n'est pas une propriété de la mitose elle-même. Elle est <b>héritée de la réplication</b>, qui a eu lieu bien avant, en phase S.</p>
<p>Le raisonnement tient en trois maillons :</p>
<ol>
  <li>en phase S, chaque molécule d'ADN est copiée de façon <b>semi-conservative</b> : chaque copie garde un brin parental comme référence, ce qui rend l'erreur peu probable ;</li>
  <li>les deux chromatides sœurs qui en résultent sont donc, sauf accident, <b>strictement identiques</b> ;</li>
  <li>la mitose se contente de distribuer une chromatide à chaque cellule fille.</li>
</ol>
<p>Autrement dit : la mitose ne vérifie rien et ne copie rien. Elle partage un travail déjà fait. Si le travail était bon, les deux cellules filles sont des clones ; s'il ne l'était pas, elles héritent toutes deux de l'erreur.</p>

<div class="box plus"><h4>Approfondir — les points de contrôle du cycle</h4>
<p>La cellule ne se lance pas en mitose sans vérifications. À plusieurs endroits du cycle, des <span class="kw">points de contrôle</span> bloquent la progression tant qu'une condition n'est pas remplie : ADN intact avant d'entrer en S, réplication achevée avant d'entrer en mitose, tous les chromosomes correctement accrochés au fuseau avant de déclencher l'anaphase.</p>
<p>Retiens ce point, parce qu'il resurgit plus bas : ce sont les <b>protéines de ces points de contrôle</b> — p53 la première — qui sont mutées dans les cancers. Un cancer n'est pas une cellule qui se divise plus vite ; c'est une cellule qui a perdu ses freins.</p></div>

<h2>D. Pourquoi la conformité n'est jamais parfaite</h2>

<h3>1. L'erreur est statistique, pas exceptionnelle</h3>
<p>Copier trois milliards de paires de bases, plusieurs milliards de fois par jour, sans jamais se tromper est impossible. Deux niveaux de sécurité existent pourtant :</p>
<ul>
  <li>la <b>complémentarité des bases</b> ne laisse qu'un seul nucléotide possible en face de chaque base de la matrice ;</li>
  <li>l'ADN polymérase <b>relit</b> ce qu'elle vient de poser et remplace le nucléotide mal apparié.</li>
</ul>
<p>Ces deux filtres ramènent le taux d'erreur à environ une pour un milliard de nucléotides. Reste les systèmes de <span class="kw">réparation</span>, dernière ligne de défense, qui corrigent les lésions avant la division suivante. <b>Une mutation ne s'installe que si la réparation échoue avant la réplication suivante.</b></p>

<h3>2. Et l'environnement en rajoute</h3>
<p>Aux erreurs spontanées s'ajoutent les <span class="kw">agents mutagènes</span> : UV, rayonnements ionisants, substances chimiques du tabac, certains virus. Ils n'orientent rien : ils augmentent le taux d'erreurs, au hasard.</p>

<div class="box piege"><h4>⚠ Formulation</h4>
<p>Ne dis jamais qu'une cellule « mute pour s'adapter » ni qu'un agent mutagène « provoque une mutation précise ». La mutation est <b>aléatoire</b> quant à sa position et à ses conséquences. C'est ensuite, et seulement ensuite, que la sélection trie.</p></div>

<details class="tp">
<summary><span class="lab">Activité 2</span>Les documents, en détail</summary>
<div class="tpin">
<p><b>Document 1 — les colonies de levures ade2.</b> La souche initiale synthétise un pigment rouge caractéristique. Après sept jours de culture à 30 °C, on observe des colonies rouges dont certaines portent un <b>secteur blanc</b> : une cellule a muté au cours de la multiplication et a perdu le pigment. Toutes ses descendantes sont blanches.</p>
<p><b>Document 2 — la modélisation d'une tumeur.</b> Chaque point coloré représente une cellule ; plus les couleurs sont proches, plus les génomes le sont. L'image donne une mosaïque : les cellules d'une même tumeur présentent de nombreuses mutations différentes.</p>
<p><b>Document 4 — l'ordre de grandeur.</b> Le nouveau-né compte environ <b>1,25 × 10<sup>12</sup> cellules</b>, chacune portant <b>6,4 × 10<sup>9</sup> nucléotides</b>, avec un taux de mutation de <b>2,66 × 10<sup>-9</sup> par nucléotide</b>. La mutation n'est donc pas un accident rare : c'est le bruit de fond inévitable de la réplication.</p>
<p><b>Document 5 — deux embryons de souris.</b> Même mutation, même moment du développement, mais selon la lignée touchée la tache apparaît sur la peau de l'animal seul, ou se retrouve chez tous ses descendants.</p>
<p><b>Document 6 — le gène TERT.</b> Les cellules cancéreuses montrent une suractivation de la protéine TERT. En comparant les séquences d'un témoin et de deux cancers, on relève <b>deux substitutions</b> dans la séquence régulatrice du gène — pas dans sa partie codante.</p>
</div>
</details>

<h2>E. L'évolution clonale : quand une erreur devient une lignée</h2>
<div data-schema="clonal"></div>

<h3>1. Le sous-clone</h3>
<div class="box def"><h4>Sous-clone</h4>
<p>Lorsqu'une mutation s'installe dans une cellule d'un clone, <b>toutes ses descendantes la portent</b>. Ce groupe, génétiquement distinct du reste du clone, est un <span class="kw">sous-clone</span>.</p>
<p>La diversification progressive d'un clone par accumulation de sous-clones successifs s'appelle l'<span class="kw">évolution clonale</span>.</p></div>

<p>Le phénomène s'observe à toutes les échelles du vivant :</p>
<ul>
  <li><b>chez un unicellulaire</b> : une colonie rouge de levures dont un secteur devient blanc — la mutation est visible à l'œil nu ;</li>
  <li><b>chez un pluricellulaire</b> : une tumeur dont les cellules ne partagent pas toutes le même génome, ce que l'on appelle l'<span class="kw">hétérogénéité tumorale</span>.</li>
</ul>

<h3>2. Le mosaïcisme est la règle, pas l'exception</h3>
<p>Compte tenu des ordres de grandeur ci-dessus, chacun naît déjà <b>mosaïque</b> : un organisme n'est jamais un clone parfait de sa cellule-œuf, mais un assemblage de sous-clones légèrement différents. La très grande majorité de ces différences est sans aucune conséquence.</p>

<div class="box plus"><h4>Approfondir — pourquoi la peau du chat est bicolore <span class="hp">hors programme</span></h4>
<p>L'exemple du chat mérite une précision, parce que son mécanisme réel n'est pas une mutation. Chez les mammifères femelles, chaque cellule de l'embryon précoce <b>inactive au hasard l'un de ses deux chromosomes X</b>, et cette inactivation est ensuite transmise à toute sa descendance.</p>
<p>Or le gène de la couleur orange du pelage est porté par le X. Chez une chatte hétérozygote, les cellules qui ont inactivé le X portant l'allèle orange donnent du poil noir, les autres du poil orange. Chaque plage de couleur est donc <b>le clone d'une cellule embryonnaire</b> — d'où les taches, et d'où le fait que les chats tricolores soient presque toujours des femelles.</p>
<p>La leçon est la même que celle du chapitre, et c'est pour cela que l'exemple est pertinent : au sein d'un clone, des cellules génétiquement quasi identiques peuvent présenter des phénotypes différents. Simplement, ici, la diversité ne vient pas d'une mutation mais d'un choix aléatoire d'expression, lui aussi transmis clonalement.</p></div>

<h2>F. Où tombe la mutation décide de tout</h2>
<p>C'est le cœur du chapitre. Les conséquences dépendent moins de la mutation elle-même que de <b>l'endroit où elle tombe</b>. Trois cas, par gravité croissante.</p>

<div class="tablewrap"><table>
<tr><th>La mutation touche…</th><th>Ce qui change</th><th>Exemple</th></tr>
<tr><td>Une <b>séquence codante</b></td><td>La protéine elle-même, donc le phénotype de la cellule mutée et de tout son sous-clone</td><td>Levure ade2 : perte du pigment rouge</td></tr>
<tr><td>Une <b>séquence régulatrice</b></td><td>Pas la protéine, mais son <b>niveau d'expression</b> : surexpression ou inactivation</td><td>Gène <b>TERT</b> surexprimé</td></tr>
<tr><td>Un gène du <b>contrôle du cycle</b></td><td>La cellule endommagée n'est plus ni réparée ni éliminée : elle prolifère et accumule d'autres mutations</td><td>Gène <b>p53</b></td></tr>
</table></div>

<h3>1. p53, le frein</h3>
<div class="box def"><h4>Comment p53 agit</h4>
<p>Découverte en 1979, la protéine p53 est un <span class="kw">facteur de transcription</span> : elle se lie à l'ADN et commande l'expression d'autres gènes. En temps normal, elle est maintenue à un niveau très bas par une protéine partenaire, <b>mdm2</b>, qui l'envoie en permanence à la destruction.</p>
<p>Quand une lésion de l'ADN apparaît, p53 échappe à mdm2, s'accumule, et déclenche l'une de deux réponses :</p>
<ul>
  <li><b>arrêt de la division</b>, le temps que les systèmes de réparation fassent leur travail ;</li>
  <li><b>apoptose</b>, la mort programmée de la cellule, si les dégâts sont irréparables.</li>
</ul></div>

<p>Sans p53 fonctionnelle, aucune de ces deux issues ne se déclenche. Les cellules à l'ADN endommagé survivent, se divisent, et accumulent les mutations suivantes. C'est pourquoi p53 est le gène le plus fréquemment altéré dans les cellules tumorales — on l'appelle parfois « le gardien du génome ».</p>

<h3>2. TERT, l'accélérateur</h3>
<p>Le cas de TERT est plus subtil et c'est ce qui le rend intéressant : la mutation n'est pas dans le gène, elle est <b>à côté</b>. Deux substitutions dans la séquence régulatrice suffisent à faire fabriquer beaucoup plus de protéine TERT. La protéine, elle, est parfaitement normale.</p>

<div class="box plus"><h4>Approfondir — pourquoi TERT donne l'immortalité <span class="hp">hors programme</span></h4>
<p>Les extrémités des chromosomes portent des séquences répétées, les <b>télomères</b>, qui ne codent rien. À chaque réplication, la machinerie ne parvient pas à copier tout à fait le bout du brin : le chromosome se raccourcit un peu. Les télomères servent donc de marge de sécurité — on ronge du texte inutile plutôt que des gènes.</p>
<p>Cette marge est finie. Après une cinquantaine de divisions, les télomères sont trop courts, la cellule cesse de se diviser : c'est la <b>limite de Hayflick</b>, décrite en 1961. Elle agit comme un compteur qui plafonne la durée de vie de tout clone cellulaire.</p>
<p>TERT est la sous-unité catalytique de la <b>télomérase</b>, l'enzyme qui reconstruit les télomères. Elle est active dans les cellules germinales et les cellules souches, éteinte dans la plupart des cellules adultes. La surexprimer, c'est remettre le compteur à zéro indéfiniment : la cellule devient <b>immortelle</b>. C'est le cas dans environ 90 % des cellules cancéreuses.</p></div>

<h3>3. Du sous-clone à la tumeur</h3>
<p>Réunis les deux : un accélérateur bloqué (division sans fin) et un frein cassé (ni réparation ni apoptose). Le sous-clone se multiplie indéfiniment, accumule de nouvelles mutations à chaque cycle, et engendre lui-même de nouveaux sous-clones. Cet empilement de lignées est ce qu'on appelle une <b>tumeur</b>.</p>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>Ne dis pas que « la mutation provoque le cancer ». Une mutation isolée ne suffit jamais : il faut une <b>accumulation</b> de mutations successives, touchant à la fois l'accélérateur et les freins. Le cancer est un processus, étalé souvent sur des années, pas un événement.</p>
<p>C'est d'ailleurs ce qui explique l'hétérogénéité tumorale, et pourquoi certains traitements échouent : il suffit qu'un sous-clone porte par hasard une mutation qui le rend insensible au médicament pour qu'il repeuple la tumeur à lui seul.</p></div>

<h2>G. Qui hérite ? Somatique ou germinale</h2>
<div class="box def"><h4>La distinction décisive</h4>
<ul>
  <li><b>Mutation somatique</b> — dans une cellule du corps. Elle modifie le phénotype de l'individu, mais <b>n'est pas transmise à ses enfants</b>.</li>
  <li><b>Mutation germinale</b> — dans une cellule de la lignée reproductrice. Elle peut ne rien changer chez l'individu, et pourtant être <b>transmise à toute sa descendance</b>.</li>
</ul></div>

<p>Les deux embryons de souris du document 5 le montrent en une image : même mutation, même moment du développement, mais selon la lignée touchée, la tache apparaît sur l'animal seul, ou chez tous ses descendants.</p>
<p>Noter que les deux questions sont <b>indépendantes</b> : une mutation germinale peut être totalement invisible chez son porteur et ressortir chez un petit-enfant ; une mutation somatique peut être spectaculaire chez l'individu et disparaître avec lui.</p>

<div class="box plus"><h4>Approfondir — la troisième possibilité <span class="hp">hors programme</span></h4>
<p>La distinction paraît binaire, mais il existe un cas intermédiaire qui explique des situations médicales déroutantes : le <b>mosaïcisme germinal</b>. Si une mutation survient tôt dans le développement, avant que la lignée germinale ne se sépare des autres, elle peut toucher <b>une partie seulement</b> des futurs gamètes.</p>
<p>Conséquence : des parents en apparence indemnes, chez qui aucun test sanguin ne détecte la mutation, peuvent avoir plusieurs enfants atteints de la même maladie génétique. La mutation n'est pas dans leur sang, elle est dans une fraction de leurs gamètes.</p></div>

<h3>Le bilan général</h3>
<p>Les conséquences d'une mutation sont donc variables selon <b>trois critères</b>, qui font un plan de paragraphe argumenté tout prêt :</p>
<ol>
  <li>sa <b>nature</b> : silencieuse ou non ;</li>
  <li>la <b>portion du chromosome</b> affectée : séquence codante, séquence régulatrice, gène du contrôle du cycle ;</li>
  <li>la <b>lignée cellulaire</b> concernée : somatique ou germinale.</li>
</ol>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Clone = cellules génétiquement identiques issues de mitoses successives d'une même cellule.</li>
<li>Cinq fonctions : croissance, régénération, reproduction asexuée, immunité, collaboration.</li>
<li>La conformité de la mitose est héritée de la réplication semi-conservative : la mitose ne fait que distribuer.</li>
<li>Nombre de chromosomes : jamais modifié. Quantité d'ADN et nombre de chromatides : variables.</li>
<li>Une mutation s'installe si la réparation échoue avant la réplication suivante ; sa descendance forme un sous-clone.</li>
<li>Séquence codante → protéine modifiée ; séquence régulatrice → expression modifiée (TERT) ; gène du contrôle → prolifération (p53).</li>
<li>Somatique = non transmise ; germinale = transmise à la descendance.</li>
</ul></div>

        html:`<h2>A. Le problème</h2>
<p>Deux parents, quatre enfants. Aucun n'est identique aux autres, et aucun n'est identique à ses parents. Pourtant, tous appartiennent à la même espèce, et tous possèdent 46 chromosomes comme leurs père et mère.</p>
<p>Il y a donc deux exigences contradictoires à satisfaire en même temps :</p>
<ul>

<div class="box def"><h4>La question à laquelle l'unité répond</h4>
<p>Comment expliquer la diversité génétique des individus lors de la reproduction sexuée ?</p></div>

<p>La réponse tient en deux mécanismes complémentaires. La <b>méiose</b> fabrique des gamètes tous différents ; la <b>fécondation</b> en combine deux au hasard. On va d'abord poser le cadre, puis remonter l'histoire de la découverte avec Mendel, puis détailler les deux brassages de la méiose, et enfin voir l'outil expérimental qui permet de les distinguer.</p>

<h2>B. Le cadre : méiose et fécondation</h2>

<h3>1. Diploïde, haploïde</h3>
<div class="box def"><h4>Les deux états</h4>
<ul>
  <li>Les cellules <b>somatiques</b> possèdent deux exemplaires de chaque information génétique, portés par des <span class="kw">chromosomes homologues</span> réunis en paires. Elles sont <b>diploïdes</b>, notées 2n. Chez l'humain, 2n = 46.</li>
  <li>Les <span class="kw">gamètes</span> ne possèdent qu'un exemplaire de chaque paire. Ils sont <b>haploïdes</b>, notés n. Chez l'humain, n = 23.</li>
</ul></div>

<p>Un point de vocabulaire à ne pas laisser flou : deux chromosomes <b>homologues</b> portent les mêmes gènes, aux mêmes emplacements — mais pas forcément les mêmes <b>allèles</b>. L'un vient du père, l'autre de la mère. Tout le chapitre découle de cette dissymétrie : s'ils portaient les mêmes allèles, il n'y aurait rien à brasser.</p>

<h3>2. Les deux phénomènes se compensent exactement</h3>
<ul>
  <li>La <span class="kw">méiose</span>, dans les gonades, forme les gamètes : elle divise le nombre de chromosomes par deux (2n → n).</li>
  <li>La <span class="kw">fécondation</span> réunit deux gamètes, donc deux génomes haploïdes d'origine indépendante, et rétablit la diploïdie (n + n → 2n). La cellule obtenue est le <b>zygote</b>, ou cellule-œuf.</li>
</ul>
<p>C'est cet aller-retour qui maintient 2n = 46 d'une génération à la suivante. Sans méiose, le nombre de chromosomes doublerait à chaque génération.</p>

<div class="box piege"><h4>⚠ À ne pas confondre</h4>
<p>Toute division cellulaire ne mène pas à la production d'un clone. La <b>mitose</b> répartit équitablement le matériel génétique dans chaque cellule fille et forme des clones. La <b>méiose</b> ne transmet que <b>la moitié</b> de l'information génétique de la cellule initiale, et s'accompagne d'un <b>brassage</b> des allèles maternels et paternels. La reproduction sexuée ne produit donc pas de clones.</p></div>

<div class="box retenir"><h4>Le bilan de cette partie</h4>
<p>La fécondation entre gamètes haploïdes rassemble, <b>au hasard</b>, dans une même cellule diploïde, deux génomes d'origine indépendante apportant chacun un lot d'allèles. Chaque paire d'allèles résultante est constituée de deux allèles identiques (<b>homozygotie</b>) ou de deux allèles différents (<b>hétérozygotie</b>).</p></div>

<div class="box plus"><h4>Approfondir — pourquoi le sexe ? <span class="hp">hors programme</span></h4>
<p>La question paraît naïve mais elle occupe la biologie évolutive depuis cinquante ans, car la reproduction sexuée est coûteuse. Il faut trouver un partenaire, et surtout : une femelle qui se reproduirait seule transmettrait 100 % de ses gènes à chaque descendant, contre 50 % en reproduction sexuée. À court terme, la reproduction asexuée devrait donc l'emporter partout.</p>
<p>L'explication la plus solide est que le brassage produit à chaque génération des <b>combinaisons d'allèles inédites</b>, et que cela est décisif face aux parasites. Un parasite s'adapte à la combinaison la plus répandue dans une population ; une population clonale lui offre une cible fixe, une population sexuée une cible qui se dérobe à chaque génération. C'est l'hypothèse dite de la <b>Reine Rouge</b>, du nom du personnage de Lewis Carroll qui doit courir pour rester à la même place.</p>
<p>Autrement dit, ce que le chapitre décrit comme un mécanisme — le brassage — est aussi une stratégie : payer 50 % de ses gènes pour n'être jamais prévisible.</p></div>

<h2>C. Comment on l'a compris : Mendel</h2>

<h3>1. La théorie qu'il a fallu démolir</h3>
<p>Jusqu'au XVIII<sup>e</sup> siècle, on croyait à l'hérédité <b>par mélange</b> : les caractères des deux parents se mélangeraient comme deux liquides, une fleur rouge croisée avec une blanche devant donner une fleur rose.</p>
<p>Cette théorie a un défaut fatal, et il est facile à voir : si les caractères se mélangeaient, toute variation s'effacerait en quelques générations, et une population finirait uniforme. On n'observe rien de tel.</p>

<h3>2. Le dispositif de Mendel</h3>
<div class="box def"><h4>Le vocabulaire à maîtriser</h4>
<ul>
  <li><span class="kw">Lignée pure</span> — lignée dont le caractère reste inchangé de génération en génération, obtenue par autofécondation. Elle ne porte qu'une seule version du caractère et la transmet obligatoirement. En termes modernes : elle est homozygote.</li>
  <li><span class="kw">Hybridation</span> — croisement entre deux variétés de la même espèce, réalisé en contrôlant la fécondation.</li>
  <li><span class="kw">Monohybridisme</span> — hybridation entre deux lignées pures qui ne diffèrent que par <b>un seul</b> caractère.</li>
</ul></div>

<p>Le choix du pois n'est pas anodin : il s'autoféconde naturellement, ce qui permet d'obtenir des lignées pures, et on peut empêcher cette autofécondation pour réaliser les croisements que l'on veut. Mendel a de plus compté ses plants — des milliers — là où ses prédécesseurs décrivaient des impressions. C'est la première fois que la statistique entre en biologie de l'hérédité.</p>

<h3>3. Les deux observations décisives</h3>
<p>En croisant deux lignées pures de pois, (V//V) violette × (v//v) blanche :</p>
<ul>
  <li><b>en F1</b>, tous les plants sont <b>violets</b>, et pas roses. La théorie du mélange tombe ;</li>
  <li><b>en F2</b>, obtenue par autofécondation des F1, le blanc <b>réapparaît</b>, dans un rapport de 3/4 – 1/4.</li>
</ul>
<p>C'est la réapparition qui est le coup décisif. Un caractère qui disparaît puis revient intact n'a pas été dilué : il a été <b>transmis sans s'exprimer</b>. Il existe donc, dans l'hybride, deux éléments distincts qui ne se mélangent pas — ce que nous appelons aujourd'hui des allèles.</p>

<h3>4. Les trois lois</h3>
<div class="box def"><h4>Dans l'ordre du cours</h4>
<ol>
  <li><b>Loi de pureté des gamètes</b> — aussi appelée loi de ségrégation, ou loi de disjonction des allèles. Lors de la formation des gamètes, les deux allèles d'un même gène, portés par les deux chromosomes d'une même paire, se séparent obligatoirement : chaque gamète ne reçoit <b>qu'un seul</b> des deux allèles.</li>
  <li><b>Loi de dominance</b> — chez un individu hétérozygote, un allèle (<b>dominant</b>) l'emporte sur l'autre (<b>récessif</b>) et masque son expression dans le phénotype. Conséquence : tous les descendants hybrides d'un croisement entre deux lignées pures contrastées présentent uniquement le caractère dominant, d'où l'<b>uniformité de la F1</b>.</li>
  <li><b>Loi de ségrégation indépendante</b> — aussi appelée loi de l'assortiment indépendant. Les allèles de gènes différents sont distribués dans les gamètes indépendamment les uns des autres.</li>
</ol></div>

<div class="box piege"><h4>⚠ Deux numérotations circulent</h4>
<p>La fiche d'activité distribuée en classe numérote les lois autrement (uniformité, puis ségrégation, puis indépendance). Retiens celle du diaporama, ci-dessus : c'est elle qui sera utilisée en cours — et notamment quand l'hérédité liée au sexe viendra les contredire.</p></div>

<div class="box plus"><h4>Approfondir — d'où vient ce que tu apprends <span class="hp">hors programme</span></h4>
<p>Mendel publie en 1866. Personne ne comprend. Son mémoire est cité une poignée de fois en trente-cinq ans, et il meurt en 1884 sans savoir ce qu'il avait trouvé.</p>
<p>En <b>1900</b>, trois botanistes — de Vries, Correns et Tschermak — refont indépendamment les mêmes expériences, retrouvent les mêmes rapports, et exhument son article. Entre-temps, une chose a changé : on a observé les chromosomes au microscope et on a vu qu'ils se séparent par paires lors de la formation des gamètes.</p>
<p>Le rapprochement est immédiat. En <b>1902</b>, Sutton et Boveri énoncent la <b>théorie chromosomique de l'hérédité</b> : les « éléments transmissibles » de Mendel sont portés par les chromosomes. Le raisonnement est un modèle du genre — les deux comportements se superposent terme à terme :</p>
<div class="tablewrap"><table>
<tr><th>Ce que dit Mendel</th><th>Ce qu'on voit au microscope</th></tr>
<tr><td>Les éléments vont par deux</td><td>Les chromosomes vont par paires</td></tr>
<tr><td>Chaque gamète n'en reçoit qu'un</td><td>Les homologues se séparent en anaphase I</td></tr>
<tr><td>Deux caractères se transmettent indépendamment</td><td>Deux paires s'orientent indépendamment en métaphase I</td></tr>
</table></div>
<p>C'est exactement le contenu de la partie D. Ce que tu vas apprendre comme un mécanisme a d'abord été déduit, avant d'être observé.</p></div>

<details class="tp">
<summary><span class="lab">Activité 1</span>L'expérience de Mendel, chiffres et échiquiers</summary>
<div class="tpin">
<p><b>Les données.</b> Sur la F2 issue de l'autopollinisation des hybrides F1, Mendel compte <b>705 plants à fleurs violettes</b> et <b>224 à fleurs blanches</b>, soit très exactement le rapport 3/4 – 1/4.</p>
<p><b>Croisement des parents de lignée pure</b> — chaque parent ne produit qu'un seul type de gamète, d'où une F1 uniforme :</p>
<div class="tablewrap"><table>
<tr><th>(V//V) × (v//v)</th><th>gamète V</th><th>gamète V</th></tr>
<tr><td><b>gamète v</b></td><td>(V//v) → [violet]</td><td>(V//v) → [violet]</td></tr>
<tr><td><b>gamète v</b></td><td>(V//v) → [violet]</td><td>(V//v) → [violet]</td></tr>
</table></div>
<p><b>Autofécondation des F1 (V//v)</b> — chaque F1 produit deux types de gamètes, d'où la réapparition du blanc :</p>
<div class="tablewrap"><table>
<tr><th>(V//v) × (V//v)</th><th>gamète V</th><th>gamète v</th></tr>
<tr><td><b>gamète V</b></td><td>(V//V) → [violet]</td><td>(V//v) → [violet]</td></tr>
<tr><td><b>gamète v</b></td><td>(V//v) → [violet]</td><td>(v//v) → [blanc]</td></tr>
</table></div>
<p>Trois cases sur quatre donnent du violet, une seule du blanc : le 3/4 – 1/4 observé est retrouvé par le raisonnement.</p>
</div>
</details>

<h3>5. Une application immédiate : les groupes sanguins</h3>
<p>Le caractère « groupe sanguin » est déterminé par un gène qui possède <b>trois allèles</b> — A, B et O — alors qu'un individu n'en porte que deux. Cette asymétrie suffit à produire toutes les relations entre allèles du programme.</p>

<div class="tablewrap"><table>
<tr><th>Génotype</th><th>Phénotype</th><th>Relation entre allèles</th></tr>
<tr><td>(A//A) ou (A//O)</td><td>[A]</td><td>A est <b>dominant</b> sur O : un seul allèle A suffit</td></tr>
<tr><td>(B//B) ou (B//O)</td><td>[B]</td><td>Idem pour B</td></tr>
<tr><td>(A//B)</td><td>[AB]</td><td>A et B sont <b>codominants</b> : aucun ne masque l'autre</td></tr>
<tr><td>(O//O)</td><td>[O]</td><td>O est <b>récessif</b> : il faut les deux allèles pour qu'il s'exprime</td></tr>
</table></div>

<p>Conséquence pratique : un individu de groupe [A] peut <b>cacher</b> un allèle O. Un homme (A//O) et une femme (B//O) auront donc des enfants de tous les groupes possibles, en proportions égales.</p>

<div class="tablewrap"><table>
<tr><th>♂ (A//O) × ♀ (B//O)</th><th>gamète B</th><th>gamète O</th></tr>
<tr><td><b>gamète A</b></td><td>(A//B) → [AB]</td><td>(A//O) → [A]</td></tr>
<tr><td><b>gamète O</b></td><td>(B//O) → [B]</td><td>(O//O) → [O]</td></tr>
</table></div>

<div class="box piege"><h4>⚠ Écriture</h4>
<p>Le <b>génotype</b> s'écrit entre parenthèses avec une double barre séparant les deux allèles : (A//O). Le <b>phénotype</b> s'écrit entre crochets : [A]. Cette convention est exigée à chaque exercice, et elle se perd vite.</p></div>

<h2>D. Le premier brassage : interchromosomique</h2>
<div class="box def"><h4>Définition</h4>
<p>Le <span class="kw">brassage interchromosomique</span> est le mécanisme de la méiose qui <b>répartit au hasard les chromosomes paternels et maternels</b> dans les cellules reproductrices. Il concerne les gènes portés par des paires de chromosomes différentes, c'est-à-dire des <b>gènes indépendants</b>.</p></div>

<div data-schema="interchrom"></div>

<h3>1. Le mécanisme, en deux temps</h3>
<p>La formulation compte, et les deux verbes sont attendus :</p>
<ul>
  <li>il est <b>préparé en métaphase I</b> : les paires de chromosomes homologues se placent de part et d'autre du plan équatorial, dans une position <b>aléatoire</b> ;</li>
  <li>il <b>s'effectue en anaphase I</b>, lorsque les paires d'homologues se séparent et migrent vers les pôles opposés. La séparation des homologues entraîne celle des allèles.</li>
</ul>
<p>Le mot décisif est <b>indépendant</b> : l'orientation d'une paire ne dit rien de l'orientation des autres. Chaque allèle a donc la même probabilité de se retrouver avec l'un ou l'autre des allèles des autres paires. L'issue est <b>quatre gamètes équiprobables</b> au contenu allélique différent.</p>

<div class="box plus"><h4>Approfondir — pourquoi l'orientation est-elle vraiment aléatoire ? <span class="hp">hors programme</span></h4>
<p>Rien ne marque un chromosome comme « paternel » ou « maternel ». Ce qui se passe en métaphase I est mécanique : chaque chromosome porte un <b>kinétochore</b>, une plateforme protéique sur laquelle les fibres du fuseau viennent s'accrocher. Les fibres arrivent des deux pôles, à l'aveugle, et testent des attachements successifs.</p>
<p>La configuration ne se stabilise que lorsque les deux homologues d'une paire sont tirés vers des pôles <b>opposés</b> — la tension qui en résulte verrouille l'attachement. Mais lequel des deux part à gauche ? Cela dépend uniquement de quelle fibre est arrivée la première. C'est une loterie, paire par paire, et c'est là, très exactement, que réside le hasard de l'hérédité.</p></div>

<h3>2. Combien de gamètes différents ?</h3>
<p>Chaque paire offre deux possibilités, et les paires sont indépendantes. Avec n paires, on obtient donc 2<sup>n</sup> gamètes possibles.</p>

<div class="tablewrap"><table>
<tr><th>Gènes hétérozygotes</th><td>1</td><td>2</td><td>3</td><td>4</td><td>X</td></tr>
<tr><th>Gamètes possibles</th><td>2</td><td>4</td><td>8</td><td>16</td><td>2<sup>X</sup></td></tr>
</table></div>

<p>Chez l'humain, 23 paires donnent <b>2<sup>23</sup>, soit environ 8 millions</b> de gamètes génétiquement différents chez un seul individu. Et la fécondation en combine deux au hasard : environ 8 millions multipliés par 8 millions, soit de l'ordre de <b>70 000 milliards</b> de zygotes différents possibles pour un seul couple.</p>

<div class="box retenir"><h4>Le bilan à retenir</h4>
<p>Le nombre de combinaisons génétiques possibles dans les gamètes est d'autant plus élevé que le nombre de gènes à l'état <b>hétérozygote</b> est grand chez les parents. Un gène homozygote donne toujours le même allèle, quelle que soit l'orientation de la paire : il ne contribue pas à la diversité.</p></div>

<h2>E. Le second brassage : intrachromosomique</h2>
<p>Le brassage interchromosomique a une limite évidente : il ne peut rien pour deux gènes situés sur <b>la même paire</b> de chromosomes. Ceux-là devraient voyager ensemble, indéfiniment, et la troisième loi de Mendel serait fausse pour eux.</p>
<p>L'expérience montre qu'elle l'est presque. Les quatre phénotypes attendus apparaissent bien, mais <b>pas en proportions égales</b> : deux sont largement majoritaires, deux sont rares. Les allèles restent donc solidaires la plupart du temps — mais pas toujours. Il existe un mécanisme qui casse cette solidarité.</p>

<div class="box def"><h4>Ce que révèle la dissymétrie</h4>
<p>Lorsque les phénotypes recombinés sont en proportions <b>inférieures</b> à celles des phénotypes parentaux dans le résultat d'un test-cross, cela signifie que les gènes sont <b>partiellement liés</b> : situés sur la même paire de chromosomes, avec échange possible de portions de chromatide entre l'un et l'autre chromosome de la paire.</p>
<p>L'individu de la F1 produit donc quatre types de gamètes <b>non équiprobables</b>.</p></div>

<div data-schema="crossing"></div>

<h3>1. Le crossing-over</h3>
<div class="box def"><h4>Le mécanisme</h4>
<p>En <b>prophase I</b>, les chromosomes homologues s'apparient étroitement sur toute leur longueur, formant un <b>bivalent</b> de quatre chromatides. Deux chromatides <b>non sœurs</b> se croisent en un point appelé <b>chiasma</b>, se cassent au même niveau et <b>échangent leurs segments</b> : c'est le <span class="kw">crossing-over</span>, ou enjambement.</p>
<p>Sur les quatre chromatides du bivalent, deux restent parentales et deux deviennent <b>recombinées</b>.</p></div>

<p>Deux précisions qui font la différence en devoir :</p>
<ul>
  <li>l'échange a lieu entre chromatides <b>non sœurs</b>. Échanger entre chromatides sœurs, qui sont identiques, ne produirait rigoureusement rien ;</li>
  <li>le crossing-over ne se produit pas dans toutes les cellules, ni toujours au même endroit du chromosome. C'est pourquoi les gamètes recombinés restent <b>minoritaires</b>.</li>
</ul>

<div class="box piege"><h4>⚠ Le piège classique</h4>
<p>Ne confonds pas les deux brassages. L'<b>interchromosomique</b> concerne des paires différentes, se joue en métaphase I puis en anaphase I, et donne des gamètes <b>équiprobables</b>. L'<b>intrachromosomique</b> concerne une seule paire, se joue en prophase I, et donne des gamètes <b>non équiprobables</b>. Et surtout : ils ne s'excluent pas, ils se cumulent à chaque méiose — leurs effets se multiplient.</p></div>

<div class="box plus"><h4>Approfondir — mesurer une distance avec des pourcentages <span class="hp">hors programme</span></h4>
<p>Si le crossing-over se produit en un point variable du chromosome, alors plus deux gènes sont <b>éloignés</b> l'un de l'autre, plus il y a de place entre eux pour qu'un échange tombe — donc plus les gamètes recombinés sont fréquents. Deux gènes voisins donneront 1 % de recombinés, deux gènes éloignés 30 %.</p>
<p>En 1913, Alfred Sturtevant, alors étudiant chez Morgan, en tire une conséquence que personne n'avait vue : le pourcentage de recombinaison <b>est</b> une mesure de distance. Il passe une nuit à classer les données de laboratoire et produit la première <b>carte génétique</b> d'un chromosome. L'unité porte aujourd'hui le nom de son directeur : 1 <b>centimorgan</b> = 1 % de descendants recombinés.</p>
<p>Ce raisonnement est la raison d'être du test-cross. Le pourcentage que tu calcules en exercice n'est pas seulement un indice de liaison : c'est une distance sur le chromosome.</p></div>

<h2>F. L'outil : le test-cross</h2>
<div class="box def"><h4>Principe</h4>
<p>Un <span class="kw">test-cross</span> est un croisement entre un individu <b>double hétérozygote</b> issu de la F1 et un individu <b>double homozygote récessif</b>. Les descendants obtenus forment la <b>F2</b>.</p></div>

<p>Tout l'intérêt réside dans le choix du second partenaire. Le double homozygote récessif ne transmet que des allèles récessifs : il ne masque rien. Chaque descendant exprime donc directement l'allèle qu'il a reçu de la F1. On lit les gamètes de la F1 sur les phénotypes de la F2 — c'est un révélateur transparent.</p>

<h3>1. Parentaux et recombinés</h3>
<div class="box def"><h4>Deux familles de phénotypes</h4>
<ul>
  <li><b>Phénotypes parentaux</b> : ils reproduisent les combinaisons d'allèles de la génération P.</li>
  <li><b>Phénotypes recombinés</b> : ils portent une combinaison de gènes <b>nouvelle</b>, différente de celle des deux parents. C'est là qu'est créée la diversité génétique.</li>
</ul></div>

<h3>2. Méthode — lire un test-cross en trois réflexes</h3>
<div class="box def"><h4>À appliquer sur n'importe quel énoncé</h4>
<ol>
  <li><b>Compte les phénotypes.</b> Quatre phénotypes apparaissent : les deux gènes sont bien portés par des chromosomes, chacun avec deux allèles.</li>
  <li><b>Regarde les proportions.</b> Quatre classes à <b>25 % chacune</b>, donc des gamètes équiprobables → gènes <b>indépendants</b>, brassage interchromosomique seul. Deux classes majoritaires et deux minoritaires, donc des gamètes non équiprobables → gènes <b>partiellement liés</b>, et les minoritaires sont le produit d'un crossing-over.</li>
  <li><b>Identifie parentaux et recombinés.</b> Les phénotypes majoritaires reproduisent les combinaisons de la génération P ; les minoritaires sont les recombinés. Vérifie toujours en revenant au phénotype des parents de lignée pure.</li>
</ol></div>

<details class="tp">
<summary><span class="lab">TP 2</span>Deux gènes indépendants chez la drosophile</summary>
<div class="tpin">
<p><b>Les gènes étudiés</b>, situés sur deux paires de chromosomes différentes :</p>
<ul>
  <li>couleur du corps — allèle sauvage corps clair <b>eb+</b>, allèle muté corps sombre (ebony) <b>eb</b> ;</li>
  <li>longueur des ailes — allèle sauvage ailes longues <b>vg+</b>, allèle muté ailes courtes (vestigial) <b>vg</b>.</li>
</ul>
<p><b>Les parents de lignée pure</b>, donc homozygotes pour chaque gène :</p>
<ul>
  <li>P1 souche sauvage, [corps clair ; ailes longues] : (eb+//eb+ ; vg+//vg+)</li>
  <li>P2 souche mutée, [corps sombre ; ailes courtes] : (eb//eb ; vg//vg)</li>
</ul>
<p><b>La F1</b> est uniforme à 100 % [ailes longues ; corps clair], de génotype (eb+//eb ; vg+//vg). On en déduit que <b>vg+ et eb+ sont dominants</b>.</p>
<p><b>Le test-cross</b> croise cette F1 avec P2. Résultats de la correction, sur 54 drosophiles :</p>
<div class="tablewrap"><table>
<tr><th>Phénotype de la F2</th><th>Effectif</th><th>Proportion</th><th>Attendu</th></tr>
<tr><td>[ailes longues ; corps sombre]</td><td>17 / 54</td><td>≈ 31 %</td><td>25 %</td></tr>
<tr><td>[ailes longues ; corps clair]</td><td>14 / 54</td><td>≈ 26 %</td><td>25 %</td></tr>
<tr><td>[ailes courtes ; corps clair]</td><td>12 / 54</td><td>≈ 22 %</td><td>25 %</td></tr>
<tr><td>[ailes courtes ; corps sombre]</td><td>11 / 54</td><td>≈ 20 %</td><td>25 %</td></tr>
</table></div>
<p>Les écarts sont des fluctuations d'échantillonnage sur un petit effectif — ton propre comptage, 40 mouches réparties en 9, 10, 10 et 11 individus, donne la même image. Aucune classe n'est massivement majoritaire : l'hypothèse de <b>gènes indépendants</b> est validée.</p>
</div>
</details>

<details class="tp">
<summary><span class="lab">TP 3</span>Deux gènes liés chez la drosophile</summary>
<div class="tpin">
<p><b>Les gènes étudiés</b>, cette fois situés sur la <b>même</b> paire de chromosomes :</p>
<ul>
  <li>couleur du corps — allèle sauvage corps gris <b>b+</b>, allèle muté corps noir (black) <b>b</b> ;</li>
  <li>longueur des ailes — allèle sauvage ailes normales <b>vg+</b>, allèle muté ailes courtes <b>vg</b>.</li>
</ul>
<p><b>Les parents de lignée pure.</b> Comme les deux gènes sont sur le même chromosome, on les écrit du même côté de la double barre :</p>

  <li>P1 souche sauvage, [corps gris ; ailes normales] : (vg+ b+ // vg+ b+)</li>

<div class="box retenir"><h4>À retenir</h4>
<ul>
<li>Méiose (2n → n) et fécondation (n + n → 2n) assurent ensemble la stabilité du caryotype.</li>
<li>Mendel : pureté des gamètes, dominance (d'où l'uniformité de la F1), ségrégation indépendante.</li>
<li>Brassage interchromosomique : préparé en métaphase I, effectué en anaphase I, orientation aléatoire et indépendante des paires, 2<sup>23</sup> gamètes équiprobables chez l'humain.</li>
<li>Brassage intrachromosomique : crossing-over en prophase I, entre chromatides non sœurs d'un bivalent.</li>
<li>Les deux brassages se cumulent à chaque méiose ; la fécondation multiplie encore le résultat.</li>
<li>Test-cross = F1 double hétérozygote × double homozygote récessif ; les phénotypes de la F2 donnent directement les gamètes de la F1.</li>
<li>4 × 25 % → gènes indépendants. Deux classes majoritaires + deux minoritaires → gènes partiellement liés.</li>
</ul></div>

/* ---------------- moteur ---------------- */

let QS = null;

const QCAT = {
  rappel: {lab:"Rappel de 1ère", cls:"rap"},
  cours:  {lab:"Cours",          cls:"cou"},
  tp:     {lab:"TP",             cls:"tpq"}
};

function melange(t){
  const a = t.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function qcmIdx(id, filtre){
  const l = [];
  QCM[id].forEach((q, i) => { if(filtre(q)) l.push(i); });
  return l;
}

function qcmAccueil(id){
  const zone = document.getElementById("qcmzone");
  if(!zone || !QCM[id]) return;
  const nR = qcmIdx(id, q => q.t === "rappel").length;
  const nC = qcmIdx(id, q => q.t === "cours").length;
  const nT = qcmIdx(id, q => q.t === "tp").length;
  const modes = [
    ["cours",  "Le cours",            nC + " questions sur les idées et les mécanismes du chapitre"],
    ["rappel", "Les rappels de 1ère",  nR + " questions sur les prérequis, avec renvoi vers la fiche"],
    ["rapide", "Série rapide",        "10 questions tirées au hasard dans le cours et les rappels"],
    ["tout",   "Tout, TP compris",    (nR + nC + nT) + " questions, dont " + nT + " sur le détail des activités"]
  ];
  zone.innerHTML = '<div class="qmodes">' + modes.map(m =>
    `<button class="qmode" onclick="qcmInit('${id}','${m[0]}')">
       <b>${m[1]}</b><span>${m[2]}</span><span class="fl">→</span>
     </button>`).join("") + '</div>';
}

function qcmInit(id, mode, seulement){
  let base;
  if(seulement && seulement.length) base = seulement;
  else if(mode === "rappel") base = qcmIdx(id, q => q.t === "rappel");
  else if(mode === "cours")  base = qcmIdx(id, q => q.t === "cours");
  else if(mode === "rapide") base = melange(qcmIdx(id, q => q.t !== "tp")).slice(0, 10);
  else base = qcmIdx(id, () => true);

  QS = {id: id, mode: mode || "tout", liste: melange(base), ordres: {}, pos: 0, score: 0, faux: [], repondu: false};
  QCM[id].forEach((q, i) => { QS.ordres[i] = melange([...Array(q.o.length).keys()]); });
  qcmRendre();
}

function qcmRendre(){
  const zone = document.getElementById("qcmzone");
  if(!zone || !QS) return;
  const qi = QS.liste[QS.pos];
  const q = QCM[QS.id][qi];
  const cat = QCAT[q.t] || QCAT.cours;
  const ordre = QS.ordres[qi];
  const pct = Math.round(QS.pos / QS.liste.length * 100);
  let h = `<div class="qprog"><span>Question ${QS.pos + 1} / ${QS.liste.length}</span>
      <span class="bar"><i style="width:${pct}%"></i></span>
      <span>${QS.score} bonne${QS.score > 1 ? "s" : ""}</span></div>
    <div class="qcard"><span class="qtag ${cat.cls}">${cat.lab}</span>
      <p class="qq">${q.q}</p><div class="qopts">`;
  ordre.forEach((oi, rang) => {
    h += `<button class="qopt" data-o="${oi}" onclick="qcmChoisir(${oi})">
      <span class="qlet">${String.fromCharCode(65 + rang)}</span><span>${q.o[oi]}</span></button>`;
  });
  h += `</div><div id="qfb"></div></div>`;
  zone.innerHTML = h;
  QS.repondu = false;
}

function qcmChoisir(oi){
  if(!QS || QS.repondu) return;
  QS.repondu = true;
  const qi = QS.liste[QS.pos];
  const q = QCM[QS.id][qi];
  const juste = oi === q.b;
  if(juste) QS.score++; else QS.faux.push(qi);
  document.querySelectorAll("#qcmzone .qopt").forEach(bt => {
    const v = Number(bt.dataset.o);
    bt.disabled = true;
    if(v === q.b) bt.classList.add("ok");
    else if(v === oi) bt.classList.add("ko");
    else bt.classList.add("pale");
  });
  const fiche = q.f && CH[q.f]
    ? ` <a class="qlien" href="#${q.f}">Revoir la fiche ${CH[q.f].num} — ${CH[q.f].title} →</a>` : "";
  const dernier = QS.pos >= QS.liste.length - 1;
  document.getElementById("qfb").innerHTML =
    `<div class="qfb ${juste ? "bon" : "mauvais"}">
       <b>${juste ? "Exact." : "Non."}</b> ${q.e}${fiche}
     </div>
     <button class="qnext" onclick="qcmSuivant()">${dernier ? "Voir mon résultat" : "Question suivante"} →</button>`;
}

function qcmSuivant(){
  if(!QS) return;
  if(QS.pos >= QS.liste.length - 1){ qcmBilan(); return; }
  QS.pos++;
  qcmRendre();
  const z = document.getElementById("qcmzone");
  if(z) z.scrollIntoView({block:"start", behavior:"smooth"});
}

function qcmBilan(){
  const zone = document.getElementById("qcmzone");
  if(!zone || !QS) return;
  const n = QS.liste.length, s = QS.score;
  const pct = Math.round(s / n * 100);
  let mot, ton;
  if(pct === 100){ mot = "Sans faute. C'est solide."; ton = "bon"; }
  else if(pct >= 80){ mot = "Bien maîtrisé. Reprends seulement les questions ratées."; ton = "bon"; }
  else if(pct >= 50){ mot = "Les grandes idées sont là, mais les détails manquent. Relis le cours puis refais la série."; ton = "moyen"; }
  else { mot = "Ce n'est pas encore en place. Relis le chapitre en entier avant de recommencer."; ton = "moyen"; }
  const faux = [...new Set(QS.faux)];
  const parCat = {};
  faux.forEach(i => { const t = QCM[QS.id][i].t; parCat[t] = (parCat[t] || 0) + 1; });
  const detail = Object.keys(parCat).length
    ? `<p class="qdet">Erreurs : ${Object.keys(parCat).map(k => parCat[k] + " en « " + QCAT[k].lab.toLowerCase() + " »").join(", ")}.</p>` : "";
  zone.innerHTML = `<div class="qbilan ${ton}">
      <div class="qscore">${s} / ${n}</div>
      <p>${mot}</p>${detail}
    </div>
    <div class="qactions">
      ${faux.length ? `<button class="qnext" onclick="qcmInit('${QS.id}',null,[${faux.join(",")}])">Refaire mes ${faux.length} erreur${faux.length > 1 ? "s" : ""}</button>` : ""}
      <button class="qnext ghost" onclick="qcmAccueil('${QS.id}')">Choisir une autre série</button>
      <button class="qnext ghost" onclick="go('${QS.id}')">Retourner au cours</button>
    </div>`;
  zone.scrollIntoView({block:"start", behavior:"smooth"});
}

function pageQcm(id){
  const c = CH[id];
