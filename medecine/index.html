<ul>
<li>La <strong>petite circulation</strong> (pulmonaire) : VD → tronc et artères pulmonaires → capillaires des poumons, où le sang se charge en O<sub>2</sub> et perd son CO<sub>2</sub> (hématose) → veines pulmonaires → AG. Basse pression (≈ 25/10 mmHg).</li>

</ul>
<div class="cle"><b>Idée et exemple : l'embolie pulmonaire</b>Les deux circulations sont branchées en série, et le sang les parcourt dans un ordre fixe. Un caillot formé dans une veine profonde de la jambe (phlébite) remonte par la veine cave inférieure, traverse l'AD puis le VD, et se bloque dans les artères pulmonaires, de plus en plus fines : c'est l'<strong>embolie pulmonaire</strong>, qui donne un essoufflement brutal et une douleur thoracique.</div>
<div class="piege"><b>Piège de concours</b>Une artère part du cœur, une veine y revient, <strong>quel que soit son contenu en O<sub>2</sub></strong>. Les artères pulmonaires transportent donc du sang <strong>pauvre</strong> en O<sub>2</sub>, et les veines pulmonaires du sang <strong>riche</strong> en O<sub>2</sub>.</div>

<h2>5. La vascularisation du cœur : les coronaires</h2>
<p>Le myocarde ne se nourrit pas du sang qui remplit ses cavités : il a ses propres artères, les <strong>artères coronaires</strong>, qui naissent de l'aorte juste au-dessus de la valve aortique.</p>
<ul>
<li>L'<strong>artère coronaire gauche</strong> se divise vite en artère <strong>interventriculaire antérieure</strong> (IVA), dans le sillon du même nom, et artère <strong>circonflexe</strong>, dans le sillon coronaire gauche. Elle irrigue la plus grande partie du VG et du septum.</li>
<li>L'<strong>artère coronaire droite</strong> chemine dans le sillon coronaire droit. Elle irrigue le cœur droit, une partie de la face inférieure et, chez la plupart des personnes, le nœud atrio-ventriculaire (et souvent le nœud sinusal).</li>
</ul>
<p>Le sang veineux du cœur est collecté par des veines qui rejoignent le <strong>sinus coronaire</strong>, lequel s'ouvre dans l'AD. Deux particularités : les coronaires se remplissent surtout pendant la <strong>diastole</strong>, car pendant la systole le muscle contracté écrase les vaisseaux qui le traversent ; et leurs branches sont presque <strong>terminales</strong> (peu d'anastomoses efficaces) : une branche bouchée prive de sang tout son territoire.</p>
<div class="cle"><b>Idée et exemple : l'infarctus du myocarde</b>Une plaque d'athérome se rompt, un caillot se forme et bouche la coronaire. Le territoire privé d'O<sub>2</sub> souffre (ischémie), puis meurt (nécrose) : les premières lésions irréversibles apparaissent en 20 à 30 minutes et s'étendent en quelques heures. Signe typique : douleur thoracique en étau, derrière le sternum, irradiant au bras gauche et à la mâchoire, durant plus de 20 minutes. L'ECG montre souvent un <strong>sus-décalage du segment ST</strong> ; la troponine augmente dans le sang. Il faut appeler le 15 : le traitement consiste à déboucher l'artère au plus vite (angioplastie avec pose d'un stent, ou médicament thrombolytique). L'occlusion de l'IVA donne un infarctus antérieur, souvent étendu ; celle de la coronaire droite, un infarctus inférieur, parfois compliqué d'un ralentissement du cœur, car le nœud atrio-ventriculaire n'est plus irrigué.</div>

<h2>6. Le tissu nodal : le cœur bat tout seul</h2>
<p>Le cœur est <strong>automatique</strong> : il contient des cellules musculaires spécialisées, le <strong>tissu nodal</strong>, qui se dépolarisent spontanément et propagent l'excitation. Preuve : un cœur greffé, dont les nerfs ont été coupés, continue de battre.</p>
<ol>
<li>Le <strong>nœud sinusal</strong> (sino-atrial), dans la paroi de l'AD près de l'abouchement de la veine cave supérieure, est le <strong>pacemaker</strong> naturel : il impose le rythme, environ 60 à 100 battements par minute au repos (rythme sinusal).</li>
<li>L'excitation gagne les deux atriums, qui se contractent.</li>
<li>Le <strong>nœud atrio-ventriculaire</strong>, dans la partie basse du septum interatrial, près de l'orifice du sinus coronaire, <strong>ralentit</strong> la conduction (≈ 0,1 s). Ce délai laisse aux atriums le temps de finir de remplir les ventricules avant que ceux-ci se contractent.</li>
<li>Le <strong>faisceau de His</strong> traverse le squelette fibreux : c'est la <strong>seule</strong> voie électrique normale entre atriums et ventricules. Il se divise dans le septum interventriculaire en une branche droite et une branche gauche.</li>
<li>Le <strong>réseau de Purkinje</strong>, sous l'endocarde, distribue très vite l'excitation à tout le myocarde ventriculaire, de la pointe vers la base : les ventricules se contractent en chassant le sang vers les orifices artériels, situés en haut.</li>
</ol>
<p>Si le nœud sinusal fait défaut, un relais plus lent prend la main : le nœud atrio-ventriculaire (≈ 40 à 60 par minute), puis le tissu ventriculaire (≈ 20 à 40 par minute).</p>
<div class="cle"><b>Idée et exemple : le bloc atrio-ventriculaire complet</b>Si la conduction est interrompue entre atriums et ventricules, les ventricules ne reçoivent plus les ordres du nœud sinusal : ils battent à leur propre rythme d'échappement, lent (≈ 30 à 40 par minute). Le débit cardiaque baisse ; le patient fait des malaises, voire perd connaissance. Le traitement est la pose d'un <strong>stimulateur cardiaque</strong> (pacemaker artificiel), qui envoie des impulsions au ventricule par une sonde.</div>
<p>Le système nerveux autonome module ce rythme sans le créer : le <strong>sympathique</strong> (noradrénaline) accélère le cœur et renforce sa contraction ; le <strong>parasympathique</strong> (nerf vague, acétylcholine) le ralentit. Au repos, le frein vagal domine : sans lui, le nœud sinusal battrait vers 100 par minute. Les <strong>bêtabloquants</strong>, qui bloquent l'action de la noradrénaline sur le cœur, le ralentissent.</p>

<h2>7. Le cycle cardiaque</h2>
<p>Un cycle comprend la <strong>systole</strong> (contraction des ventricules) et la <strong>diastole</strong> (relâchement et remplissage). À 75 battements par minute, il dure 0,8 s : environ 0,3 s de systole et 0,5 s de diastole. Quand le cœur accélère, c'est surtout la diastole qui raccourcit.</p>
<ol>
<li><strong>Remplissage</strong> (diastole) : les valves atrio-ventriculaires sont ouvertes ; le sang passe des atriums aux ventricules, d'abord passivement (la plus grande partie, ≈ 70 à 80 %), puis grâce à la <strong>contraction des atriums</strong>, qui ajoute le reste.</li>
<li><strong>Contraction isovolumétrique</strong> (début de systole) : la pression ventriculaire dépasse la pression atriale et les valves mitrale et tricuspide se ferment. Toutes les valves sont fermées : la pression monte, le volume ne change pas.</li>
<li><strong>Éjection</strong> : quand la pression du VG dépasse celle de l'aorte (≈ 80 mmHg), les valves aortique et pulmonaire s'ouvrent et le sang est éjecté.</li>
<li><strong>Relaxation isovolumétrique</strong> (début de diastole) : la pression ventriculaire repasse sous celle des artères, les valves sigmoïdes se ferment. Toutes les valves sont fermées, jusqu'à ce que la pression ventriculaire passe sous la pression atriale : les valves atrio-ventriculaires se rouvrent.</li>
</ol>
<div class="defile"><table>
<tr><th>Grandeur (VG, adulte au repos)</th><th>Valeur</th></tr>
<tr><td>Volume télédiastolique (VTD, fin de remplissage)</td><td>≈ 120 à 130 mL</td></tr>
<tr><td>Volume télésystolique (VTS, ce qui reste après l'éjection)</td><td>≈ 50 à 60 mL</td></tr>
<tr><td>Volume d'éjection systolique (VES = VTD − VTS)</td><td>≈ 70 mL</td></tr>
<tr><td>Fraction d'éjection (VES ÷ VTD)</td><td>≈ 55 à 70 % ; elle baisse dans l'insuffisance cardiaque</td></tr>
</table></div>
<h3>Les bruits du cœur</h3>
<ul>
<li><strong>B1</strong> (« toum »), sourd : fermeture des valves <strong>atrio-ventriculaires</strong> (mitrale et tricuspide), au début de la systole ;</li>
<li><strong>B2</strong> (« ta »), plus sec : fermeture des valves <strong>sigmoïdes</strong> (aortique et pulmonaire), au début de la diastole.</li>
</ul>
<p>Entre B1 et B2, le petit silence correspond à la systole ; entre B2 et le B1 suivant, le grand silence correspond à la diastole. Normalement, l'ouverture des valves est silencieuse.</p>
<div class="piege"><b>Piège de concours</b>Les bruits du cœur viennent de la <strong>fermeture</strong> des valves, pas de la contraction du muscle ni de l'ouverture des valves. B1 marque le début de la systole ventriculaire, pas la contraction des atriums.</div>

<h2>8. Le débit cardiaque</h2>
<div class="def"><b>Définition</b>Le <strong>débit cardiaque</strong> (Qc) est le volume de sang éjecté par chaque ventricule en une minute : <strong>Qc = FC × VES</strong> (fréquence cardiaque × volume d'éjection systolique).</div>
<p>Au repos : 70 battements/min × 70 mL ≈ <strong>5 L/min</strong>, à peu près le volume sanguin total chaque minute. À l'effort, il peut atteindre 20 à 25 L/min, davantage chez un athlète d'endurance. Le VES dépend de trois facteurs :</p>
<ul>
<li>la <strong>précharge</strong>, c'est-à-dire le remplissage du ventricule : plus il est étiré en fin de diastole, plus il se contracte fort (<strong>loi de Frank-Starling</strong>) ; le cœur éjecte ainsi ce qu'il reçoit ;</li>
<li>la <strong>contractilité</strong>, la force propre du muscle, augmentée par le sympathique ;</li>
<li>la <strong>postcharge</strong>, la résistance à l'éjection (pression artérielle, valve aortique rétrécie) : plus elle est forte, plus l'éjection est difficile.</li>
</ul>
<div class="cle"><b>Idée et exemple : le cœur de l'athlète</b>Un sportif d'endurance a souvent une fréquence de repos de 40 à 50 par minute. Son cœur entraîné éjecte un plus grand volume à chaque battement : le débit de repos reste ≈ 5 L/min avec moins de battements. À l'inverse, lors d'une hémorragie, le retour veineux et donc le VES baissent : le cœur accélère (tachycardie) pour maintenir le débit.</div>

<h2>9. Initiation à l'électrocardiogramme</h2>
<p>L'<strong>ECG</strong> enregistre, par des électrodes posées sur la peau, l'activité <strong>électrique</strong> du cœur, pas sa contraction. Sur le papier qui défile à 25 mm/s, un petit carreau (1 mm) vaut 0,04 s et un grand carreau (5 mm), 0,20 s.</p>

<p>Le rythme est dit <strong>sinusal</strong> quand chaque QRS est précédé d'une onde P, régulièrement, entre 60 et 100 par minute. En dessous de 60, c'est une bradycardie ; au-dessus de 100, une tachycardie. Calcul rapide : FC ≈ 300 ÷ nombre de grands carreaux entre deux QRS.</p>
<div class="piege"><b>Piège de concours</b>L'onde P n'est pas la contraction des atriums : c'est leur dépolarisation, qui la précède de peu. L'onde T est la <strong>repolarisation</strong> des ventricules, pas celle des atriums, cachée dans le QRS.</div>

<div class="cle"><b>Bilan</b>Cœur droit vers les poumons (basse pression), cœur gauche vers le corps (haute pression) : même débit, VG plus épais. Valves passives : fermeture des atrio-ventriculaires (B1), puis des sigmoïdes (B2). Coronaires presque terminales, remplies en diastole : leur occlusion donne l'infarctus. Nœud sinusal (rythme), nœud atrio-ventriculaire (délai), His et Purkinje (distribution). Qc = FC × VES ≈ 5 L/min au repos. ECG : P (atriums), QRS (ventricules), T (repolarisation ventriculaire).</div>

<details><summary>Hors programme : la circulation du fœtus</summary>
<div class="hp"><b>Hors programme</b>Avant la naissance, les poumons ne respirent pas : l'O<sub>2</sub> vient du placenta. Deux courts-circuits évitent la circulation pulmonaire : le <strong>foramen ovale</strong>, entre AD et AG, et le <strong>canal artériel</strong>, entre tronc pulmonaire et aorte. À la naissance, les poumons se déploient, la pression s'inverse entre les atriums et ces passages se ferment. Le foramen ovale laisse une trace, la fosse ovale ; il reste perméable chez environ un adulte sur quatre, souvent sans conséquence.</div>
</details>

<p class="lead">Respirer, c'est faire entrer l'O<sub>2</sub> dans le sang et en faire sortir le CO<sub>2</sub> : c'est l'<strong>hématose</strong>. L'appareil respiratoire associe des conduits qui amènent l'air, une immense surface d'échange, et une pompe faite de muscles et de plèvres. Chaque élément explique une situation clinique fréquente.</p>

<h2>1. Le plan d'ensemble</h2>
<p>L'air suit un trajet continu : fosses nasales, pharynx, larynx, trachée, bronches, bronchioles, alvéoles. On distingue deux zones fonctionnelles :</p>
<ul>
<li>la <strong>zone de conduction</strong>, du nez aux bronchioles terminales : elle conduit, filtre, réchauffe et humidifie l'air, mais ne fait <strong>aucun échange</strong>. Son volume, environ <strong>150 mL</strong>, est l'<strong>espace mort anatomique</strong> ;</li>
<li>la <strong>zone respiratoire</strong> : bronchioles respiratoires, canaux alvéolaires et <strong>alvéoles</strong>, où se font les échanges gazeux.</li>
</ul>
<p>Entre la trachée et les alvéoles, l'arbre bronchique se divise environ <strong>23 fois</strong> de suite, chaque conduit donnant deux conduits plus fins.</p>

<h2>2. Les voies aériennes supérieures</h2>
<ul>
<li>Les <strong>fosses nasales</strong>, cloisonnées par trois cornets, filtrent l'air (poils, mucus), le <strong>réchauffent</strong> et l'<strong>humidifient</strong> ; leur toit porte la muqueuse olfactive.</li>
<li>Le <strong>pharynx</strong> est un carrefour commun à l'air et aux aliments (rhinopharynx, oropharynx, laryngopharynx).</li>
<li>Le <strong>larynx</strong>, dans le cou, en avant des vertèbres C4 à C6, est un squelette de cartilages : le <strong>thyroïde</strong> (la « pomme d'Adam »), le <strong>cricoïde</strong> en dessous (seul anneau complet), les deux <strong>aryténoïdes</strong>, qui orientent les cordes vocales, et l'<strong>épiglotte</strong>, qui bascule sur l'entrée du larynx pendant la déglutition. Les <strong>plis vocaux</strong> (cordes vocales) délimitent la <strong>glotte</strong> et produisent la voix.</li>
</ul>
<p>Selon les ouvrages, le larynx est rangé dans les voies supérieures (usage français courant) ou inférieures.</p>
<div class="cle"><b>Idée et exemple</b>Presque tous les muscles du larynx sont commandés par le <strong>nerf laryngé récurrent</strong>, branche du nerf vague. À gauche, il descend dans le thorax et remonte sous la crosse de l'aorte : une chirurgie de la thyroïde ou un cancer du poumon peuvent le léser. La corde vocale est alors paralysée et la voix devient rauque (<strong>dysphonie</strong>).</div>

<h2>3. La trachée et les bronches</h2>
<p>La <strong>trachée</strong> est un tube d'environ <strong>12 cm</strong> de long et <strong>2 cm</strong> de diamètre, qui descend du cou (C6) dans le médiastin jusqu'à sa bifurcation, la <strong>carène</strong>, vers T4-T5. Elle est maintenue ouverte par <strong>16 à 20 anneaux cartilagineux en fer à cheval</strong>, ouverts en arrière ; la paroi postérieure, membraneuse et musculaire, est au contact de l'œsophage, qu'elle laisse se dilater au passage des aliments.</p>
<p>Elle est tapissée, comme les bronches, d'un <strong>épithélium cilié</strong> riche en cellules à mucus (cellules caliciformes) : les poussières collent au mucus, que les cils font remonter vers le pharynx, où il est avalé. C'est l'<strong>escalator mucociliaire</strong>, ralenti par le tabac.</p>
<p>La trachée se divise en deux <strong>bronches souches</strong> (principales), très différentes :</p>
<div class="defile"><table>
<tr><th>Bronche souche droite</th><th>Bronche souche gauche</th></tr>
<tr><td>courte (≈ 2,5 cm), large</td><td>longue (≈ 5 cm), plus étroite</td></tr>
<tr><td>presque verticale (≈ 25° avec la verticale)</td><td>plus horizontale (≈ 45°), elle passe sous la crosse de l'aorte</td></tr>
<tr><td>donne 3 bronches lobaires</td><td>donne 2 bronches lobaires</td></tr>
</table></div>
<div class="cle"><b>Idée et exemple : les corps étrangers inhalés</b>Une cacahuète inhalée par un enfant suit la voie la plus directe : elle tombe le plus souvent dans la <strong>bronche droite</strong>, plus verticale et plus large. Pour la même raison, une sonde d'intubation enfoncée trop loin glisse dans la bronche droite : seul le poumon droit est ventilé.</div>
<p>Les bronches lobaires se divisent en bronches <strong>segmentaires</strong> (une dizaine par poumon), qui définissent les <strong>segments pulmonaires</strong>, unités que le chirurgien peut retirer isolément. Puis viennent les <strong>bronchioles</strong> (moins de 1 mm de diamètre). En descendant, le cartilage diminue puis <strong>disparaît</strong> (les bronchioles n'en ont plus), tandis que la part de <strong>muscle lisse</strong> augmente. Ce muscle est contracté par le système parasympathique et relâché par l'adrénaline, via des récepteurs <strong>β2</strong>.</p>
<div class="cle"><b>Idée et exemple : l'asthme</b>Dans la crise d'asthme, le muscle lisse des petites bronches se contracte et la muqueuse, enflammée, gonfle : l'air passe mal, surtout à l'expiration (sifflements). Le traitement de la crise est un <strong>bronchodilatateur</strong> inhalé, le salbutamol, qui stimule les récepteurs β2 et relâche le muscle lisse.</div>

<h2>4. Les poumons et la plèvre</h2>
<h3>Les poumons</h3>
<p>Les deux poumons occupent le thorax de part et d'autre du <strong>médiastin</strong> (cœur, gros vaisseaux, trachée, œsophage). Chacun a la forme d'un demi-cône : un <strong>sommet</strong> (apex) qui dépasse la clavicule de 2 à 3 cm, une <strong>base</strong> posée sur le diaphragme, et une face médiale creusée par le <strong>hile</strong>, porte d'entrée de la bronche souche, de l'artère pulmonaire, des veines pulmonaires et des nerfs.</p>

98H234"/><path d="M280 156L254 160"/><path d="M280 212L218 214"/><path d="M280 244H254"/></g><g fill="currentColor"><circle cx="104" cy="98" r="2"/><circle cx="86" cy="188" r="2"/><circle cx="134" cy="238" r="2"/><circle cx="234" cy="98" r="2"/><circle cx="254" cy="244" r="2"/></g><g font-family="system-ui,sans-serif" font-size="11" fill="currentColor"><text x="4" y="16">bronche souche droite</text><text x="336" y="16" text-anchor="end">bronche souche gauche</text><text x="184" y="40">trachée</text><text x="4" y="94">lobe</text><text x="4" y="106">supérieur</text><text x="4" y="138" fill="var(--m3)">scissure</text><text x="4" y="150" fill="var(--m3)">horizontale</text><text x="4" y="184">lobe</text><text x="4" y="196">inférieur</text><text x="4" y="236">lobe</text><text x="4" y="248">moyen</text><text x="284" y="94">lobe</text><text x="284" y="106">supérieur</text><text x="284" y="152" fill="var(--m3)">scissure</text><text x="284" y="164" fill="var(--m3)">oblique</text><text x="284" y="208">incisure</text><text x="284" y="220">cardiaque</text><text x="284" y="240">lobe</text><text x="284" y="252">inférieur</text><text x="30" y="306">poumon droit</text><text x="170" y="306" text-anchor="middle" fill="var(--m2)">diaphragme</text><text x="310" y="306" text-anchor="end">poumon gauche</text></g></svg><figcaption>Vue de face : le poumon droit du patient est à gauche de l'image. Pointillés : scissures.</figcaption></figure>
<ul>
<li>Le <strong>poumon droit</strong> a <strong>3 lobes</strong> (supérieur, moyen, inférieur), séparés par <strong>2 scissures</strong> (oblique et horizontale). Il est plus large, mais plus court, car le foie soulève la coupole droite du diaphragme.</li>
<li>Le <strong>poumon gauche</strong> a <strong>2 lobes</strong> (supérieur, inférieur), séparés par <strong>1 scissure</strong> (oblique). Il est creusé par le cœur : c'est l'<strong>incisure cardiaque</strong>, sous laquelle une languette du lobe supérieur, la <strong>lingula</strong>, tient la place du lobe moyen.</li>
</ul>
<p>Les poumons ont deux circulations. La circulation <strong>fonctionnelle</strong> sert aux échanges : les <strong>artères pulmonaires</strong>, issues du ventricule droit, apportent un sang <strong>pauvre en O<sub>2</sub></strong> ; les <strong>veines pulmonaires</strong> ramènent au cœur gauche un sang <strong>riche en O<sub>2</sub></strong>. La circulation <strong>nourricière</strong> passe par les petites artères bronchiques, issues de l'aorte.</p>
<div class="piege"><b>Pièges de concours</b>Artère ne veut pas dire « sang riche en O<sub>2</sub> » : l'artère pulmonaire transporte du sang pauvre en O<sub>2</sub>, la veine pulmonaire du sang riche en O<sub>2</sub>. Sur une vue de face, le poumon droit du patient est à <strong>gauche</strong> de l'image. Droite : 3 lobes, 2 scissures ; gauche : 2 lobes, 1 scissure.</div>

<h3>La plèvre</h3>
<p>Chaque poumon est enveloppé d'une séreuse à deux feuillets : la <strong>plèvre viscérale</strong>, collée au poumon (elle s'enfonce dans les scissures), et la <strong>plèvre pariétale</strong>, qui tapisse la paroi du thorax, le diaphragme et le médiastin. Les deux feuillets se rejoignent au hile. Entre eux, la <strong>cavité pleurale</strong> est un espace virtuel contenant quelques millilitres de liquide.</p>
<p>Le poumon, élastique, tend à se rétracter vers le hile ; la paroi thoracique tend à s'écarter. Ces deux forces opposées créent dans la cavité pleurale une <strong>pression négative</strong> (inférieure à la pression atmosphérique d'environ 5 cmH<sub>2</sub>O au repos). Le film liquide colle le poumon à la paroi, comme deux lames de verre mouillées : quand le thorax s'agrandit, le poumon suit.</p>
<div class="cle"><b>Idée et exemple : le pneumothorax</b>Si de l'air entre dans la cavité pleurale (rupture d'une petite bulle à la surface du poumon, typiquement chez un homme jeune, grand, mince et fumeur, ou plaie du thorax), la pression pleurale devient égale à la pression atmosphérique : plus rien ne retient le poumon, qui se <strong>rétracte</strong> vers le hile. Le patient ressent une douleur thoracique brutale et un essoufflement. Si l'air s'accumule sous pression (pneumothorax compressif), c'est une urgence : il faut l'évacuer par une aiguille ou un drain.</div>

<h2>5. Les alvéoles et la barrière alvéolo-capillaire</h2>
<p>Les deux poumons comptent environ <strong>300 à 500 millions d'alvéoles</strong> (≈ 0,2 mm de diamètre chacune), soit une surface d'échange d'environ <strong>70 à 100 m²</strong>, entourée d'un réseau serré de capillaires. La paroi alvéolaire contient :</p>
<ul>
<li>les <strong>pneumocytes de type I</strong>, cellules très aplaties qui couvrent environ 95 % de la surface et laissent passer les gaz ;</li>
<li>les <strong>pneumocytes de type II</strong>, cellules cubiques qui sécrètent le <strong>surfactant</strong> et peuvent remplacer les pneumocytes I ;</li>
<li>des <strong>macrophages alvéolaires</strong>, qui avalent les poussières et les microbes.</li>
</ul>
<div class="def"><b>Définition</b>La <strong>barrière alvéolo-capillaire</strong> est la paroi que les gaz traversent : le pneumocyte I, les lames basales (souvent fusionnées) et la cellule endothéliale du capillaire. Son épaisseur n'est que d'environ <strong>0,5 µm</strong>.</div>
<p>Le <strong>surfactant</strong>, mélange de phospholipides et de protéines, abaisse la tension superficielle du film d'eau qui tapisse les alvéoles. Sans lui, les petites alvéoles s'affaisseraient à chaque expiration et l'inspiration demanderait un effort considérable.</p>
<div class="cle"><b>Idée et exemple : le grand prématuré</b>Le surfactant n'est produit en quantité suffisante qu'en fin de grossesse (vers 34-35 semaines). Le grand prématuré en manque : ses alvéoles s'affaissent, c'est la <strong>maladie des membranes hyalines</strong> (détresse respiratoire du nouveau-né). On la prévient par des corticoïdes donnés à la mère avant l'accouchement (ils accélèrent la maturation du poumon) et on la traite en instillant du surfactant dans la trachée du bébé.</div>

<h2>6. Les muscles et la mécanique ventilatoire</h2>
<h3>Le diaphragme</h3>
<p>Le <strong>diaphragme</strong> est une cloison musculaire en forme de double coupole qui sépare le thorax de l'abdomen. C'est le <strong>principal muscle inspiratoire</strong> : en se contractant, il s'abaisse (de 1 à 2 cm au repos, jusqu'à une dizaine en inspiration forcée) et agrandit le thorax de haut en bas. Il est commandé par le <strong>nerf phrénique</strong>, issu des racines cervicales <strong>C3, C4 et C5</strong>.</p>
<div class="cle"><b>Idée et exemple</b>Parce que le nerf phrénique naît haut dans le cou, une section de la moelle épinière <strong>au-dessus de C3</strong> paralyse le diaphragme : le blessé ne peut survivre que sous ventilation artificielle. Une lésion sous C5 épargne le diaphragme : le patient tétraplégique respire seul, même si ses muscles intercostaux sont paralysés.</div>
<h3>Les autres muscles</h3>
<ul>
<li>Les <strong>intercostaux externes</strong> soulèvent les côtes à l'inspiration et agrandissent le thorax d'avant en arrière et sur les côtés.</li>
<li>À l'effort ou en cas de gêne respiratoire, des muscles <strong>inspiratoires accessoires</strong> s'y ajoutent : sterno-cléido-mastoïdiens, scalènes.</li>
<li>Les muscles <strong>expiratoires</strong> (abdominaux, intercostaux internes) n'interviennent que dans l'expiration <strong>forcée</strong> : effort, toux, souffler une bougie.</li>
</ul>
<h3>Inspiration active, expiration passive</h3>
<p>Loi de Boyle-Mariotte : à température constante, quand le volume d'un gaz augmente, sa pression diminue.</p>
<ul>
<li><strong>Inspiration</strong> (active) : les muscles se contractent, le thorax et donc les poumons s'agrandissent, la pression dans les alvéoles descend d'environ 1 mmHg sous la pression atmosphérique, et l'air entre.</li>
<li><strong>Expiration au repos</strong> (passive) : les muscles se relâchent, le poumon revient à sa taille par sa seule <strong>élasticité</strong>, la pression alvéolaire dépasse un peu la pression atmosphérique, et l'air sort. <strong>Aucun muscle</strong> n'est nécessaire.</li>
</ul>
<div class="piege"><b>Pièges de concours</b>Au repos, l'expiration est <strong>passive</strong>. L'air entre parce que le thorax s'agrandit, et non l'inverse : ce sont les poumons qui suivent la paroi. Le diaphragme <strong>s'abaisse</strong> quand il se contracte.</div>

<h2>7. Les volumes pulmonaires</h2>
<p>La <strong>spirométrie</strong> mesure les volumes d'air mobilisés. Ordres de grandeur chez un homme jeune (plus faibles chez la femme, variables avec la taille et l'âge) :</p>

<tr><td><b>Volume résiduel</b> (VR)</td><td>ce qui reste après une expiration forcée</td><td>≈ 1,2 L</td></tr>
<tr><td><b>Capacité vitale</b> (CV)</td><td>VT + VRI + VRE : le plus grand volume mobilisable</td><td>≈ <strong>4 à 5 L</strong></td></tr>

<p>Au repos, on respire 12 à 16 fois par minute : la <strong>ventilation</strong> est d'environ 6 à 8 L/min. Comme les 150 premiers millilitres de chaque inspiration restent dans l'espace mort, seuls ≈ 350 mL par cycle atteignent les alvéoles.</p>
<div class="cle"><b>Idée et exemple : la BPCO</b>Le spiromètre mesure aussi le <strong>VEMS</strong>, volume expiré pendant la première seconde d'une expiration forcée. Le rapport VEMS/CV dépasse normalement 70 %. Dans la <strong>bronchopneumopathie chronique obstructive</strong> (BPCO) du fumeur, comme dans l'asthme, les bronches rétrécies freinent l'expiration : le VEMS s'effondre et le rapport passe sous 70 %. C'est un <strong>trouble obstructif</strong>.</div>
<div class="piege"><b>Piège de concours</b>Le <strong>volume résiduel</strong> ne peut jamais être expiré : un spiromètre simple ne le mesure pas, ni donc la CRF et la CPT, qui le contiennent.</div>

<h2>8. Les échanges gazeux</h2>
<p>Les gaz traversent la barrière par <strong>diffusion passive</strong>, sans transporteur, de la pression partielle la plus haute vers la plus basse. Le débit est d'autant plus grand que la surface est vaste, la paroi mince et la différence de pression élevée (loi de Fick).</p>
<div class="def"><b>Définition</b>La <strong>pression partielle</strong> d'un gaz dans un mélange est la part de la pression totale due à ce gaz : pression totale × fraction du gaz. L'air contient 21 % d'O<sub>2</sub> ; au niveau de la mer (760 mmHg), la PO<sub>2</sub> de l'air sec est donc d'environ 160 mmHg (1 kPa ≈ 7,5 mmHg).</div>
<div class="defile"><table>
<tr><th></th><th>PO<sub>2</sub></th><th>PCO<sub>2</sub></th></tr>
<tr><td>Air sec</td><td>≈ 160 mmHg (21 kPa)</td><td>≈ 0,3 mmHg</td></tr>
<tr><td>Air alvéolaire</td><td>≈ 100 mmHg (13 kPa)</td><td>≈ 40 mmHg (5,3 kPa)</td></tr>
<tr><td>Sang veineux arrivant au poumon</td><td>≈ 40 mmHg</td><td>≈ 46 mmHg</td></tr>
<tr><td>Sang artériel quittant le poumon</td><td>≈ 95 mmHg (normes : 80 à 100)</td><td>≈ 40 mmHg</td></tr>
</table></div>
<p>L'O<sub>2</sub> passe de l'alvéole au sang (différence ≈ 60 mmHg) ; le CO<sub>2</sub> passe du sang à l'alvéole (différence ≈ 6 mmHg seulement). Le CO<sub>2</sub> diffuse pourtant aussi bien, car il est environ <strong>20 fois plus soluble</strong> que l'O<sub>2</sub>. Au repos, une hématie reste environ 0,75 s dans le capillaire, alors que l'équilibre est atteint en 0,25 s : il reste une marge pour l'effort.</p>
<p>Exemples : la fibrose pulmonaire épaissit la barrière ; l'emphysème détruit les parois alvéolaires et réduit la surface : l'O<sub>2</sub> passe mal.</p>
<div class="piege"><b>Piège de concours</b>En altitude, l'air contient toujours <strong>21 %</strong> d'O<sub>2</sub> : c'est la pression totale qui baisse (environ de moitié vers 5 500 m), donc la PO<sub>2</sub>. D'où l'essoufflement et le mal aigu des montagnes.</div>

<h2>9. Le transport des gaz dans le sang</h2>
<h3>L'O<sub>2</sub></h3>
<p>Environ <strong>98,5 %</strong> de l'O<sub>2</sub> voyage fixé sur l'<strong>hémoglobine</strong> des hématies ; à peine 1,5 % est dissous dans le plasma. Chaque hémoglobine, tétramère à 4 hèmes (avec un fer Fe<sup>2+</sup> chacun), fixe jusqu'à <strong>4 O<sub>2</sub></strong>. Avec ≈ 15 g d'hémoglobine par décilitre, le sang artériel transporte environ 20 mL d'O<sub>2</sub> pour 100 mL. Il est saturé à ≈ 97 % ; le sang veineux revient encore saturé à ≈ 75 % au repos : les tissus ne prélèvent qu'un quart de l'O<sub>2</sub> offert.</p>
<p>La courbe de fixation est <strong>sigmoïde</strong> (coopérativité, chapitre « protéines »). L'affinité de l'hémoglobine pour l'O<sub>2</sub> <strong>baisse</strong> (la courbe se déplace vers la droite) quand la PCO<sub>2</sub>, l'acidité (effet Bohr), la température ou le 2,3-BPG augmentent : c'est le cas dans un muscle à l'effort, qui reçoit ainsi plus d'O<sub>2</sub>.</p>
<div class="cle"><b>Idée et exemple : le monoxyde de carbone</b>Le CO, produit par un chauffage mal réglé, se fixe sur l'hémoglobine environ <strong>200 fois plus fort</strong> que l'O<sub>2</sub> (carboxyhémoglobine) : le sang ne transporte plus l'O<sub>2</sub>, sans que la PO<sub>2</sub> baisse. Piège pratique : un oxymètre de pouls ordinaire confond les deux formes et affiche une saturation faussement normale. Le traitement est l'O<sub>2</sub> pur, parfois en caisson hyperbare.</div>
<h3>Le CO<sub>2</sub></h3>
<ul>
<li>≈ <strong>70 %</strong> sous forme d'<strong>ions bicarbonate</strong> (HCO<sub>3</sub><sup>−</sup>) : dans l'hématie, l'<strong>anhydrase carbonique</strong> accélère la réaction CO<sub>2</sub> + H<sub>2</sub>O ⇌ H<sub>2</sub>CO<sub>3</sub> ⇌ H<sup>+</sup> + HCO<sub>3</sub><sup>−</sup>, et le bicarbonate sort dans le plasma en échange d'un ion Cl<sup>−</sup> ;</li>
<li>≈ <strong>20 %</strong> fixé sur l'hémoglobine (carbaminohémoglobine), sur les fonctions amine de la globine, <strong>pas sur l'hème</strong> ;</li>
<li>≈ <strong>7 à 10 %</strong> dissous.</li>
</ul>
<p>Le CO<sub>2</sub> fabrique donc de l'acide : si on hypoventile, le CO<sub>2</sub> s'accumule et le sang s'acidifie (<strong>acidose respiratoire</strong>) ; si on hyperventile, par exemple dans une crise d'angoisse, le CO<sub>2</sub> baisse et le sang devient alcalin (<strong>alcalose respiratoire</strong>, avec des fourmillements des doigts et des lèvres).</p>

<h2>10. La commande de la respiration</h2>
<p>Le rythme respiratoire est produit automatiquement par des neurones du <strong>tronc cérébral</strong>, surtout du <strong>bulbe rachidien</strong>, modulés par le pont ; ils commandent le diaphragme et les intercostaux. Le cortex peut la modifier volontairement (parler, retenir sa respiration), pour un temps seulement. Ce rythme est ajusté par des <strong>chémorécepteurs</strong> :</p>
<ul>
<li><strong>centraux</strong>, dans le bulbe, sensibles à l'acidité du liquide cérébrospinal, donc à la <strong>PCO<sub>2</sub></strong> : c'est le principal stimulus en temps normal ;</li>
<li><strong>périphériques</strong>, dans les glomus carotidiens et aortiques, sensibles surtout à une forte <strong>baisse de la PO<sub>2</sub></strong> (sous ≈ 60 mmHg).</li>
</ul>
<div class="cle"><b>Idée et exemple : l'hyperventilation avant l'apnée</b>Un plongeur qui hyperventile avant une apnée abaisse son CO<sub>2</sub> : l'envie de respirer, déclenchée surtout par le CO<sub>2</sub>, arrive plus tard. L'O<sub>2</sub>, lui, continue de baisser : le plongeur peut perdre connaissance sous l'eau sans avoir ressenti le besoin de remonter.</div>

<div class="cle"><b>Bilan</b>Conduction (150 mL d'espace mort) puis échanges. Bronche droite courte, large, verticale : corps étrangers. Poumon droit 3 lobes, gauche 2. Cavité pleurale en pression négative : le pneumothorax affaisse le poumon. Barrière de 0,5 µm sur 70 à 100 m², surfactant. Inspiration active (diaphragme, nerf phrénique C3-C5), expiration passive au repos. VT 0,5 L, CV 4 à 5 L, CPT 6 L. Diffusion selon les pressions partielles. O<sub>2</sub> sur l'hémoglobine, CO<sub>2</sub> surtout en bicarbonate. Commande bulbaire, pilotée surtout par le CO<sub>2</sub>.</div>

<details><summary>Hors programme : la compliance pulmonaire</summary>
<div class="hp"><b>Hors programme</b>La <strong>compliance</strong> mesure la facilité avec laquelle le poumon se laisse distendre : c'est le volume gagné pour une variation de pression donnée. Elle <strong>diminue</strong> dans la fibrose (poumon raide, inspiration pénible) et <strong>augmente</strong> dans l'emphysème (poumon trop mou, qui perd son élasticité : c'est alors l'expiration qui devient difficile).</div>
</details>
<p class="src">Fiche originale rédigée pour ce site, niveau début de première année, vérifiée sur les ouvrages de référence (Marieb, <em>Anatomie et physiologie humaines</em> ; Guyton et Hall, <em>Physiologie médicale</em> ; Kamina, <em>Anatomie clinique</em>). Elle ne remplace pas le cours de la faculté.</p>

<p class="lead">Les reins filtrent chaque jour environ 180 litres de plasma pour n'en rejeter, sous forme d'urine, qu'un litre et demi. Ils éliminent les déchets, règlent l'eau, les ions et le pH du sang, et fabriquent des hormones. Cette fiche décrit leur anatomie, le néphron, les trois processus qui forment l'urine, puis les voies qui l'évacuent.</p>

<h2>1. Situation des reins</h2>
<p>L'appareil urinaire comprend les <strong>deux reins</strong>, qui fabriquent l'urine, et les <strong>voies urinaires</strong>, qui l'évacuent : uretères, vessie, urètre.</p>
<ul>
<li>Les reins sont placés dans la région lombaire, de part et d'autre de la colonne vertébrale, contre la paroi postérieure de l'abdomen (muscles psoas et carré des lombes).</li>
<li>Ils sont <strong>rétropéritonéaux</strong> : en arrière du péritoine, la membrane qui tapisse la cavité abdominale. On peut donc les aborder par le dos ou le flanc sans ouvrir le péritoine.</li>
<li>Ils s'étendent environ de la <strong>12<sup>e</sup> vertèbre thoracique à la 3<sup>e</sup> vertèbre lombaire</strong> (T12 à L3). Le <strong>rein droit est plus bas</strong> que le gauche, d'environ 1 à 2 cm, car le foie le repousse. Tous deux descendent de quelques centimètres à chaque inspiration profonde.</li>
<li>En forme de haricot, chaque rein mesure environ <strong>12 cm de haut, 6 cm de large et 3 cm d'épaisseur</strong>, pour environ <strong>150 g</strong>. Son bord médial, concave, porte le <strong>hile</strong>.</li>
<li>De dedans en dehors, il est entouré par sa <strong>capsule fibreuse</strong>, une couche de graisse (la graisse périrénale) et le <strong>fascia rénal</strong>. La <strong>glande surrénale</strong> coiffe son pôle supérieur, mais c'est un organe distinct.</li>
</ul>
<p>En avant, le rein droit répond au foie, au duodénum et au côlon ; le gauche, à la rate, à la queue du pancréas, à l'estomac et au côlon.</p>
<div class="cle"><b>Idée et exemple : la greffe rénale</b>Le rein greffé n'est pas placé dans la région lombaire mais dans la <strong>fosse iliaque</strong>, en bas de l'abdomen, toujours en dehors du péritoine. Ses vaisseaux sont branchés sur les vaisseaux iliaques et son uretère dans la vessie, toute proche. Les reins malades du receveur sont le plus souvent laissés en place : on peut donc vivre avec trois reins, dont un seul fonctionne.</div>

<h2>2. Configuration interne</h2>
<p>Sur une coupe frontale, on distingue de la périphérie vers le hile :</p>
<ul>
<li>la <strong>capsule</strong>, fine et résistante ;</li>
<li>le <strong>cortex</strong>, zone externe d'environ 1 cm d'épaisseur, d'aspect granuleux : il contient les glomérules ;</li>
<li>la <strong>médullaire</strong>, formée de 8 à 18 <strong>pyramides rénales</strong> (de Malpighi), striées, dont la base regarde le cortex et le sommet, la <strong>papille</strong>, regarde le centre du rein. Entre les pyramides, le cortex s'enfonce en <strong>colonnes rénales</strong> (de Bertin). Une pyramide et le cortex qui la coiffe forment un <strong>lobe</strong> rénal ;</li>
<li>le <strong>sinus rénal</strong>, cavité ouverte au hile, qui contient de la graisse, les vaisseaux et les premières voies urinaires.</li>
</ul>
<p>L'urine sort par les orifices des papilles dans les <strong>calices mineurs</strong> (une dizaine), qui se réunissent en 2 ou 3 <strong>calices majeurs</strong>, lesquels se jettent dans le <strong>bassinet</strong> (pelvis rénal), entonnoir qui se prolonge par l'uretère. Au <strong>hile</strong>, les éléments se placent, d'avant en arrière : la <strong>veine</strong> rénale, l'<strong>artère</strong> rénale, le bassinet qui devient l'uretère (moyen mnémotechnique : « VAU »).</p>

<div class="piege"><b>Piège de concours</b>Les pyramides appartiennent à la <strong>médullaire</strong>, les colonnes rénales au <strong>cortex</strong>. Les glomérules sont tous dans le cortex : la médullaire ne contient que des anses de Henlé, des tubes collecteurs et des vaisseaux.</div>

<h2>3. La vascularisation</h2>
<p>Les reins reçoivent environ <strong>1,2 L de sang par minute</strong>, soit <strong>20 à 25 % du débit cardiaque</strong>, alors qu'ils ne représentent qu'environ 0,5 % du poids du corps. Ce débit énorme ne sert pas à les nourrir : il sert à filtrer.</p>
<ul>
<li>Chaque <strong>artère rénale</strong> naît de l'<strong>aorte abdominale</strong>, vers L1-L2. La droite, plus longue, passe en arrière de la veine cave inférieure.</li>
<li>Dans le rein, elle se divise en <strong>artères segmentaires</strong>, <strong>terminales</strong> (sans anastomoses entre elles), puis en artères interlobaires (dans les colonnes), arquées (à la limite entre cortex et médullaire) et interlobulaires (dans le cortex).</li>
<li>Chaque <strong>artériole afférente</strong> forme un glomérule, peloton de capillaires, d'où repart une <strong>artériole efférente</strong>. Celle-ci donne un second réseau de capillaires autour des tubules (capillaires péritubulaires) et, pour les néphrons profonds, des vaisseaux droits qui descendent dans la médullaire.</li>
<li>Les <strong>veines rénales</strong> rejoignent la veine cave inférieure. La gauche, plus longue, passe en avant de l'aorte et reçoit la veine gonadique gauche (testiculaire ou ovarienne) ; à droite, la veine gonadique se jette directement dans la veine cave.</li>
</ul>
<div class="cle"><b>Idée et exemple</b>Le glomérule est un réseau de capillaires placé <strong>entre deux artérioles</strong>, et non entre une artériole et une veinule. En réglant le calibre de l'une ou de l'autre, le rein règle la pression dans le glomérule, donc la filtration. Les artères segmentaires étant terminales, l'obstruction de l'une d'elles (par un caillot venu du cœur, par exemple) tue le territoire qu'elle irrigue : c'est l'<strong>infarctus rénal</strong>.</div>

<h2>4. Le néphron, unité fonctionnelle</h2>
<div class="def"><b>Définition</b>Le <strong>néphron</strong> est l'unité structurale et fonctionnelle du rein : un minuscule tube qui fabrique l'urine à partir du plasma. Chaque rein en compte environ <strong>1 million</strong>, avec de grandes variations d'une personne à l'autre. Leur nombre est fixé à la naissance : un néphron détruit n'est pas remplacé.</div>
<p>Il comprend, dans l'ordre suivi par le liquide :</p>
<ol>
<li>le <strong>corpuscule rénal</strong> (de Malpighi), dans le cortex : le <strong>glomérule</strong>, peloton de capillaires, entouré par la <strong>capsule de Bowman</strong>, coupe à double paroi qui recueille le filtrat. Son feuillet interne est fait de cellules à prolongements, les <strong>podocytes</strong>, qui enlacent les capillaires ;</li>
<li>le <strong>tubule contourné proximal</strong>, dans le cortex : ses cellules portent une bordure en brosse (microvillosités) et sont riches en mitochondries, car elles réabsorbent l'essentiel du filtrat par des transports actifs ;</li>
<li>l'<strong>anse de Henlé</strong>, en épingle à cheveux : une branche descendante plonge dans la médullaire, une branche ascendante remonte vers le cortex ;</li>
<li>le <strong>tubule contourné distal</strong>, dans le cortex, qui revient au contact de son propre glomérule (appareil juxtaglomérulaire, partie 6) ;</li>
<li>le <strong>tube collecteur</strong>, commun à plusieurs néphrons, qui descend à travers la médullaire jusqu'à une papille.</li>
</ol>
<p>Environ 85 % des néphrons sont <strong>corticaux</strong>, à anse courte ; les autres, <strong>juxtamédullaires</strong>, ont une anse longue qui plonge profondément dans la médullaire et permettent de concentrer l'urine.</p>

<h2>5. Les trois processus qui forment l'urine</h2>
<h3>La filtration glomérulaire</h3>
<p>Dans le glomérule, la pression du sang pousse l'eau et les petites molécules du plasma vers la capsule de Bowman, à travers la <strong>barrière de filtration</strong>. Ce passage est <strong>passif</strong>. La barrière a trois couches : l'endothélium des capillaires, percé de pores (fenêtré) ; la membrane basale ; les fentes entre les prolongements des podocytes. Elle trie selon la <strong>taille</strong> et la <strong>charge</strong> :</p>
<ul>
<li>passent librement : l'eau, les ions, le glucose, les acides aminés, l'urée, la créatinine ;</li>
<li>ne passent presque pas : les protéines de la taille de l'albumine (chargée négativement) et au-delà ;</li>
<li>ne passent pas : les cellules du sang.</li>
</ul>
<p>Le filtrat, ou <strong>urine primitive</strong>, a donc la composition du plasma <strong>sans ses protéines</strong>.</p>
<div class="def"><b>Définition</b>Le <strong>débit de filtration glomérulaire</strong> (DFG) est le volume de plasma filtré par l'ensemble des glomérules par unité de temps. Chez l'adulte jeune, il vaut environ <strong>120 mL/min</strong>, soit environ <strong>180 L par jour</strong> : le plasma (≈ 3 L) est filtré une soixantaine de fois par jour.</div>
<p>En pratique, on estime le DFG à partir de la <strong>créatinine</strong> du sang, un déchet produit par les muscles à débit à peu près constant, filtré et non réabsorbé : quand le DFG baisse, la créatininémie monte. Des formules (comme CKD-EPI) tiennent compte de l'âge et du sexe.</p>
<h3>La réabsorption tubulaire</h3>
<p>Le long du tubule, l'essentiel du filtrat repasse dans le sang des capillaires péritubulaires : <strong>plus de 99 % de l'eau</strong> et du sodium, la totalité du glucose et des acides aminés. Le tubule proximal en assure la plus grande part : environ deux tiers de l'eau et du sodium filtrés, et tout le glucose.</p>
<div class="defile"><table>
<tr><th>Par jour</th><th>Filtré</th><th>Excrété dans l'urine</th><th>Part réabsorbée</th></tr>
<tr><td>Eau</td><td>≈ 180 L</td><td>≈ 1,5 L</td><td>≈ 99 %</td></tr>
<tr><td>Sodium</td><td>≈ 25 000 mmol</td><td>≈ 150 mmol (selon les apports)</td><td>≈ 99,5 %</td></tr>
<tr><td>Glucose</td><td>≈ 180 g</td><td>0</td><td>100 %</td></tr>
<tr><td>Urée</td><td>filtrée librement</td><td>environ la moitié</td><td>≈ 50 %</td></tr>
</table></div>
<div class="cle"><b>Idée et exemple : le glucose dans l'urine</b>Le glucose est réabsorbé dans le tubule proximal par des cotransporteurs sodium-glucose, surtout <strong>SGLT2</strong> (chapitre de la membrane). Ces transporteurs sont saturables : au-delà d'une glycémie d'environ <strong>1,8 g/L</strong> (10 mmol/L), le glucose filtré dépasse leur capacité et passe dans l'urine. C'est la <strong>glycosurie</strong> du diabète mal équilibré. Des médicaments, les <strong>gliflozines</strong> (dapagliflozine, empagliflozine), bloquent volontairement SGLT2 : le patient diabétique élimine ainsi une partie de son glucose dans l'urine.</div>
<h3>La sécrétion tubulaire</h3>
<p>À l'inverse, les cellules du tubule prennent certaines substances dans le sang des capillaires péritubulaires et les déversent dans le tubule : des ions <strong>H<sup>+</sup></strong> (équilibre acide-base), du <strong>K<sup>+</sup></strong> et de nombreux <strong>médicaments</strong>. La pénicilline, par exemple, est si vite sécrétée par le tubule proximal qu'on l'a autrefois associée au probénécide, qui freine cette sécrétion, pour prolonger son action.</p>
<p>Au total : <strong>excrété = filtré − réabsorbé + sécrété</strong>.</p>
<p>La <strong>diurèse</strong>, volume d'urine émis, est d'environ <strong>1,5 L par jour</strong> chez l'adulte, selon ce qu'il boit et ce qu'il perd par la sueur. On parle d'<strong>oligurie</strong> en dessous de 500 mL par jour, d'<strong>anurie</strong> en dessous de 100 mL par jour, de <strong>polyurie</strong> au-delà de 3 L par jour. L'urine normale ne contient ni glucose ni cellules sanguines, et presque pas de protéines.</p>
<div class="piege"><b>Pièges de concours</b>Le DFG (≈ 120 mL/min, 180 L/j) n'est pas la diurèse (≈ 1,5 L/j) : la différence est réabsorbée. La filtration est passive ; la réabsorption du glucose et du sodium est active. Sécrétion (du sang vers le tubule) et réabsorption (du tubule vers le sang) vont en sens inverses.</div>

<h2>6. Les rôles endocrines du rein</h2>
<ul>
<li><strong>Rénine</strong> : libérée par des cellules de la paroi de l'artériole afférente (appareil juxtaglomérulaire) quand la pression artérielle ou le volume sanguin baissent. C'est une enzyme : elle coupe l'angiotensinogène, fabriqué par le foie, en angiotensine I, que l'<strong>enzyme de conversion</strong> transforme en <strong>angiotensine II</strong>. Celle-ci resserre les artérioles et stimule la sécrétion d'aldostérone : la pression remonte. Des médicaments très prescrits contre l'hypertension bloquent ce système (inhibiteurs de l'enzyme de conversion, sartans).</li>
<li><strong>Érythropoïétine</strong> (EPO) : produite par des cellules du tissu situé entre les tubules du cortex quand le sang apporte trop peu d'O<sub>2</sub>, elle stimule la production des globules rouges par la moelle osseuse.</li>
<li><strong>Activation de la vitamine D</strong> : le tubule proximal ajoute un groupement –OH à la 25-hydroxyvitamine D venue du foie et la transforme en <strong>calcitriol</strong> (1,25-dihydroxyvitamine D), forme active qui augmente l'absorption intestinale du calcium.</li>
</ul>
<div class="cle"><b>Idée et exemple : l'insuffisance rénale chronique</b>C'est la perte progressive et irréversible de néphrons, définie par un DFG inférieur à 60 mL/min (rapporté à 1,73 m<sup>2</sup> de surface corporelle), ou par des signes d'atteinte rénale comme des protéines dans l'urine, pendant plus de 3 mois. Ses premières causes sont le <strong>diabète</strong> et l'<strong>hypertension</strong>. Ses complications reproduisent la liste des fonctions perdues : urée, créatinine et potassium s'accumulent ; une <strong>anémie</strong> apparaît faute d'EPO (on injecte de l'EPO de synthèse) ; le calcium baisse et les os souffrent faute de calcitriol ; la pression artérielle monte. Au stade terminal (DFG inférieur à 15 mL/min), il faut une <strong>dialyse</strong> ou une <strong>greffe</strong>.</div>

<h2>7. Deux hormones qui règlent l'urine</h2>
<div class="defile"><table>
<tr><th></th><th>Hormone antidiurétique (ADH, vasopressine)</th><th>Aldostérone</th></tr>
<tr><td>Nature, origine</td><td>peptide de 9 acides aminés fabriqué par l'<strong>hypothalamus</strong>, libéré par la <strong>posthypophyse</strong></td><td>stéroïde fabriqué par la <strong>corticosurrénale</strong></td></tr>
<tr><td>Stimulus principal</td><td>hausse de l'osmolarité du plasma (déshydratation) ; forte baisse du volume sanguin</td><td>angiotensine II ; hausse du potassium sanguin</td></tr>
<tr><td>Cible</td><td>tube collecteur</td><td>fin du tubule distal et tube collecteur</td></tr>
<tr><td>Effet</td><td>insertion d'<strong>aquaporines</strong> dans la membrane : réabsorption d'<strong>eau</strong> ; urine concentrée et peu abondante</td><td>réabsorption de <strong>Na<sup>+</sup></strong> (l'eau suit) et sécrétion de <strong>K<sup>+</sup></strong></td></tr>
</table></div>
<div class="cle"><b>Idée et exemple : le diabète insipide</b>Sans ADH (lésion de l'hypothalamus ou de l'hypophyse), ou quand le rein n'y répond plus, le tube collecteur reste imperméable à l'eau. Le patient urine plusieurs litres par jour d'une urine très diluée et boit énormément pour compenser. Plus banal : l'alcool freine la sécrétion d'ADH, d'où l'envie fréquente d'uriner après en avoir bu. Côté aldostérone, la <strong>spironolactone</strong>, qui bloque son récepteur, est un diurétique qui épargne le potassium.</div>

<h2>8. Les voies urinaires</h2>
<h3>Les uretères</h3>
<p>Chaque <strong>uretère</strong> conduit l'urine du bassinet à la vessie. C'est un conduit musculaire d'environ <strong>25 à 30 cm</strong>, rétropéritonéal, qui descend contre le muscle psoas, croise les vaisseaux iliaques à l'entrée du petit bassin et pénètre obliquement dans la paroi de la vessie. Ce trajet oblique fait office de valve et empêche l'urine de remonter vers le rein. L'urine y progresse par des ondes de contraction (<strong>péristaltisme</strong>), et pas seulement par gravité.</p>
<div class="cle"><b>Idée et exemple : la colique néphrétique</b>L'uretère présente trois rétrécissements : à sa sortie du bassinet, au croisement des vaisseaux iliaques et à son entrée dans la vessie. C'est là que se bloquent les <strong>calculs</strong> (les « pierres » urinaires). En amont de l'obstacle, la pression monte brutalement et distend l'uretère et le bassinet : douleur lombaire soudaine, très intense, qui irradie vers l'aine et les organes génitaux. C'est la <strong>colique néphrétique</strong>.</div>
<h3>La vessie</h3>
<p>La <strong>vessie</strong> est un réservoir musculaire situé dans le petit bassin, en arrière de la symphyse pubienne, sous le péritoine. Sa paroi contient un muscle lisse, le <strong>détrusor</strong>, et est tapissée d'un épithélium très extensible, l'urothélium. Sa capacité physiologique est d'environ <strong>300 à 500 mL</strong> ; l'envie d'uriner apparaît vers 150 à 300 mL. Pleine, elle remonte au-dessus du pubis et devient palpable (on parle de <strong>globe vésical</strong> en cas de rétention). Sur sa face interne, le <strong>trigone</strong> est un triangle lisse limité par les deux orifices des uretères et l'orifice de l'urètre. En arrière de la vessie se trouvent le rectum chez l'homme, l'utérus et le vagin chez la femme.</p>
<h3>L'urètre</h3>
<p>L'<strong>urètre</strong> conduit l'urine de la vessie à l'extérieur. Deux <strong>sphincters</strong> le contrôlent : un sphincter lisse, involontaire, au col de la vessie, et un sphincter strié, volontaire. La miction associe la contraction du détrusor et le relâchement des sphincters.</p>
<div class="defile"><table>
<tr><th></th><th>Femme</th><th>Homme</th></tr>
<tr><td>Longueur</td><td>≈ 3 à 4 cm</td><td>≈ 16 à 20 cm</td></tr>
<tr><td>Fonction</td><td>urinaire seulement</td><td>urinaire et génitale (sperme)</td></tr>
<tr><td>Trajet</td><td>court, presque rectiligne ; s'ouvre dans la vulve, entre le clitoris et l'orifice du vagin</td><td>traverse la <strong>prostate</strong> (urètre prostatique), le périnée (urètre membraneux) puis la verge (urètre spongieux)</td></tr>
</table></div>
<div class="cle"><b>Idée et exemple : les infections urinaires</b>Les infections urinaires sont beaucoup plus fréquentes chez la femme : environ une femme sur deux en fera au moins une dans sa vie. L'urètre féminin est <strong>court</strong> et son orifice est <strong>proche de l'anus</strong> : les bactéries du tube digestif, surtout <em>Escherichia coli</em>, remontent facilement jusqu'à la vessie (<strong>cystite</strong>). Si elles remontent par l'uretère jusqu'au rein, c'est une <strong>pyélonéphrite</strong>, avec fièvre et douleur lombaire. Chez l'homme âgé, c'est surtout l'augmentation de volume de la prostate, qui gêne l'écoulement de l'urine, qui favorise les infections.</div>
<div class="piege"><b>Piège de concours</b>L'<strong>uretère</strong> (un de chaque côté) va du rein à la vessie ; l'<strong>urètre</strong> (unique) va de la vessie à l'extérieur. Et c'est le rein <strong>droit</strong> qui est le plus bas.</div>

<div class="cle"><b>Bilan</b>Deux reins rétropéritonéaux (T12 à L3, le droit plus bas), de 150 g environ : cortex avec les glomérules, médullaire en pyramides, calices, bassinet. Ils reçoivent 20 à 25 % du débit cardiaque. Environ 1 million de néphrons par rein (glomérule et capsule de Bowman, tubule proximal, anse de Henlé, tubule distal), qui se déversent dans les tubes collecteurs. Filtration passive (DFG ≈ 120 mL/min, 180 L/j), réabsorption de plus de 99 % de l'eau, sécrétion : diurèse ≈ 1,5 L/j. Hormones : rénine, EPO, calcitriol ; l'ADH fait réabsorber l'eau, l'aldostérone le sodium. Uretères de 25 à 30 cm, vessie, urètre court chez la femme, d'où ses infections plus fréquentes.</div>

<details><summary>Hors programme : comment l'anse de Henlé concentre l'urine</summary>
<div class="hp"><b>Hors programme</b>La branche ascendante de l'anse pompe du NaCl hors du tubule mais reste imperméable à l'eau ; la branche descendante laisse sortir l'eau. Ce dispositif à contre-courant crée dans la médullaire une concentration croissante vers les papilles (jusqu'à environ 1 200 mOsm/L, quatre fois celle du plasma). En présence d'ADH, le tube collecteur, qui traverse cette médullaire très concentrée, perd son eau par osmose : l'urine peut alors atteindre cette concentration. Les diurétiques de l'anse (furosémide) bloquent le cotransporteur Na<sup>+</sup>-K<sup>+</sup>-2Cl<sup>−</sup> de la branche ascendante.</div>
</details>

/* Barème à discordances, le plus répandu en première année :
   0 erreur sur les 5 propositions = 1 ; 1 = 0,5 ; 2 = 0,2 ; 3 et plus = 0. */
function noteQ(sel, props) {
  var d = 0;
  props.forEach(function (p, i) { if ((sel.indexOf(i) >= 0) !== !!p.v) d++; });
  return d === 0 ? 1 : d === 1 ? 0.5 : d === 2 ? 0.2 : 0;
}

  out += '<div class="conf">' + [["s", "Sûr"], ["h", "Hésitant"], ["x", "Au hasard"]].map(function (c) { return '<button data-c="' + c[0] + '" class="' + (r.conf === c[0] ? "on" : "") + '">' + c[1] + "</button>"; }).join("") + "</div>";
  out += '<div class="rangee" style="margin-top:14px">' + (i > 0 ? '<button class="btn sec" id="qprev">Précédente</button>' : "") + '<span class="espace"></span><button class="btn" id="qnext"' + (!r.sel.length || !r.conf ? " disabled" : "") + ">" + (i === liste.length - 1 ? "Rendre la copie" : "Suivante") + "</button></div>";

}
function correction(id, type) {

    q.p.forEach(function (p, k) {
      var coche = r.sel.indexOf(k) >= 0, cl = p.v ? (coche ? "vrai" : "oubli") : (coche ? "faux-coche" : "");
      out += '<div class="prop ' + cl + '" style="cursor:default"><span class="lettre">' + "ABCDE"[k] + '</span><span>' + h(p.t) + ' <b>' + (p.v ? "Vrai" : "Faux") + "</b>" + (p.e ? '<span class="expl">' + h(p.e) + "</span>" : "") + "</span></div>";

}
function num(x) { return (Math.round(x * 100) / 100).toString().replace(".", ","); }

/* ---------- résultats ---------- */
function stats(id) {

  ["cloture", "retard"].forEach(function (t) {

    var sur = 0, surJ = 0;

      var pts = noteQ(res.rep[i].sel, x.p), mat = CHAPITRES[x.ch].mat;
      parMat[mat] = parMat[mat] || [0, 0]; parMat[mat][0] += pts; parMat[mat][1]++;
      if (res.rep[i].conf === "s") { sur++; if (pts === 1) surJ++; }
    });
    o[t] = { pct: 100 * res.points / liste.length, parMat: parMat, fiab: sur ? 100 * surJ / sur : null, sur: sur };
  });
  if (o.cloture && o.min) o.pph = (o.cloture.pct / 100 * QCM[id].cloture.length) / (o.min / 60);
  return o;
}

/* ============================================================
   ROUTEUR ET ÉVÉNEMENTS
   ============================================================ */
function route() {
  var r = location.hash.replace(/^#\/?/, "").split("/"), v = r[0] || "accueil", html;
  if (v === "methodes") html = vueMethodes();
  else if (v === "protocole") html = vueProtocole();
  else if (v === "m") html = vueMethode(r[1], r[2] !== undefined ? +r[2] : undefined);
  else if (v === "cours") html = vueCours();
  else if (v === "c") html = vueChapitre(r[1]);
  else if (v === "qcm") html = vueQCM(r[1], r[2]);
  else if (v === "pq") html = vuePourquoi(r[1]);
  else if (v === "ent") html = vueEntrain(r.slice(1).join("/"));
  else if (v === "cartes") html = vueCartes(r.slice(1).join("/"));
  else if (v === "resultats") html = vueResultats();
  else if (v === "journal") html = vueJournal();
  else { v = "accueil"; html = vueAccueil(); }
  app.innerHTML = html;
  var onglet = { accueil: "accueil", methodes: "methodes", protocole: "methodes", m: "methodes", qcm: "methodes", pq: "methodes", ent: "methodes", cartes: "methodes", cours: "cours", c: "cours", resultats: "resultats", journal: "journal" }[v];
  document.querySelectorAll("nav.bas a").forEach(function (a) { a.classList.toggle("on", a.dataset.r === onglet); });
  lier(v, r);
}
function rendre() { var y = window.scrollY; route(); window.scrollTo(0, y); }

function lier(v, r) {
  var $ = function (id) { return document.getElementById(id); };
  if (v === "accueil" && $("go")) $("go").onclick = function () {
    var m = blocCourant(), d = $("j0").value; if (!d) return;
    bloc(m.id).j0 = d; marquer(); rendre();
  };
  if (v === "c") {
    var ol = $("somm");
    if (ol) document.querySelectorAll("article.cours h2").forEach(function (t, k) {
      var li = document.createElement("li"), bt = document.createElement("button");
      bt.textContent = t.textContent.replace(/^\d+\.\s*/, ""); bt.onclick = function () { t.scrollIntoView({ behavior: "smooth", block: "start" }); };
      li.appendChild(bt); ol.appendChild(li);
    });
  }
  if (v === "m") {
    var id = r[1], i = +r[2];
    if ($("j0maj")) $("j0maj").onclick = function () { if ($("j0b").value) { bloc(id).j0 = $("j0b").value; marquer(); rendre(); } };
    if (r[2] !== undefined) {
      var el = $("s" + i); if (el && !CHR) setTimeout(function () { el.scrollIntoView({ block: "start", behavior: "smooth" }); }, 30);
      if ($("start")) $("start").onclick = function () { var t = Date.now(); CHR = { id: id, i: i, debut: t, etape: 0, debutEtape: t, vibre: {} }; rendre(); };
      if ($("gnext")) $("gnext").onclick = function () { CHR.etape++; CHR.debutEtape = Date.now(); rendre(); };
      if ($("gprev")) $("gprev").onclick = function () { CHR.etape--; CHR.debutEtape = Date.now(); rendre(); };
      if ($("stop")) $("stop").onclick = function () {
        var min = Math.max(1, Math.round(tempsChr() / 60)); CHR = null;
        enregistrerSeance(id, i, min, "faite"); toast("Séance enregistrée : " + min + " min. Pense au journal."); location.hash = "#m/" + id;
      };
      if ($("faite")) $("faite").onclick = function () { enregistrerSeance(id, i, Math.max(0, +$("mins").value || 0), "faite"); CHR = null; toast("Séance enregistrée."); location.hash = "#m/" + id; };
      if ($("sautee")) $("sautee").onclick = function () { enregistrerSeance(id, i, 0, "sautee"); CHR = null; location.hash = "#m/" + id; };
    }
    document.querySelectorAll(".etoiles button").forEach(function (b) { b.onclick = function () { bloc(id).ressenti[b.dataset.r] = +b.dataset.v; marquer(); rendre(); }; });
    if ($("remarque")) $("remarque").oninput = function () { bloc(id).ressenti.remarque = this.value; marquer(); };
  }
  if (v === "pq" && $("rec")) {
    if (REC && REC.url) $("ecoute").innerHTML = '<audio controls src="' + REC.url + '"></audio>';
    $("rec").onclick = function () {
      if (REC && REC.actif) { REC.mr.stop(); return; }
      if (!navigator.mediaDevices || !window.MediaRecorder) { $("recinfo").textContent = "Enregistrement impossible sur ce navigateur : utilise l'application Dictaphone du téléphone."; return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (flux) {
        var mr = new MediaRecorder(flux), morceaux = [];
        if (REC && REC.url) URL.revokeObjectURL(REC.url);
        REC = { actif: true, mr: mr, debut: Date.now() };
        mr.ondataavailable = function (e) { morceaux.push(e.data); };
        mr.onstop = function () { flux.getTracks().forEach(function (t) { t.stop(); }); REC.actif = false; REC.url = URL.createObjectURL(new Blob(morceaux, { type: mr.mimeType })); rendre(); };
        mr.start(); rendre(); $("recinfo").textContent = "Enregistrement en cours…";
      }).catch(function () { $("recinfo").textContent = "Micro refusé : autorise-le dans les réglages du navigateur."; });
    };
  }
  if (v === "ent") {
    var cle = r.slice(1).join("/");
    var go = function () { TR = { cle: cle, liste: listeEntrain(cle), i: 0, sel: [], valide: false, pts: 0 }; route(); window.scrollTo(0, 0); };
    if ($("tgo")) $("tgo").onclick = go;
    if ($("tagain")) $("tagain").onclick = go;
    if (TR && TR.cle === cle && TR.i < TR.liste.length) {
      if (!TR.valide) document.querySelectorAll(".prop[data-k]").forEach(function (b) { b.onclick = function () { var k = +b.dataset.k, p = TR.sel.indexOf(k); if (p >= 0) TR.sel.splice(p, 1); else TR.sel.push(k); rendre(); }; });
      if ($("tval")) $("tval").onclick = function () { TR.valide = true; TR.pts += noteQ(TR.sel, TR.liste[TR.i].p); rendre(); };
      if ($("tnext")) $("tnext").onclick = function () {
        TR.i++; TR.sel = []; TR.valide = false;
        if (TR.i >= TR.liste.length) { var e = bloc("M4").entr; e[cle] = (e[cle] || []).concat({ date: auj(), pts: Math.round(TR.pts * 100) / 100, n: TR.liste.length }); marquer(); }
        route(); window.scrollTo(0, 0);
      };
    }
  }
  if (v === "cartes") {
    var ck = r.slice(1).join("/");
    if ($("cgo")) $("cgo").onclick = function () { CR = { cle: ck, ids: idsCartes(ck), i: 0, montre: false, ratees: [], su: 0 }; route(); };
    if ($("cratees")) $("cratees").onclick = function () { CR = { cle: ck, ids: melanger(CR.ratees), i: 0, montre: false, ratees: [], su: 0 }; route(); };
    if ($("cvoir")) $("cvoir").onclick = function () { CR.montre = true; route(); };
    var noter = function (ok) {
      var id = CR.ids[CR.i], c = bloc("M5").cartes;
      c[id] = ok ? Math.min(3, boite(id) + 1) : 1;
      if (ok) CR.su++; else CR.ratees.push(id);
      CR.i++; CR.montre = false; marquer(); route();
    };
    if ($("coui")) $("coui").onclick = function () { noter(true); };
    if ($("cnon")) $("cnon").onclick = function () { noter(false); };
  }
  if (v === "qcm") {
    var qid = r[1], type = r[2], liste = QCM[qid] && QCM[qid][type];
    if ($("qgo")) $("qgo").onclick = function () { RUN = { id: qid, type: type, i: 0, debut: Date.now(), rep: liste.map(function () { return { sel: [], conf: "" }; }) }; rendre(); };
    if (RUN && RUN.id === qid && RUN.type === type) {
      var rep = RUN.rep[RUN.i];
      document.querySelectorAll(".prop[data-k]").forEach(function (b) { b.onclick = function () { var k = +b.dataset.k, p = rep.sel.indexOf(k); if (p >= 0) rep.sel.splice(p, 1); else rep.sel.push(k); rendre(); }; });
      document.querySelectorAll(".conf button").forEach(function (b) { b.onclick = function () { rep.conf = b.dataset.c; rendre(); }; });
      if ($("qprev")) $("qprev").onclick = function () { RUN.i--; route(); window.scrollTo(0, 0); };
      if ($("qnext")) $("qnext").onclick = function () {
        if (RUN.i < liste.length - 1) { RUN.i++; route(); window.scrollTo(0, 0); return; }
        var pts = 0; liste.forEach(function (q, k) { pts += noteQ(RUN.rep[k].sel, q.p); });
        bloc(qid).qcm[type] = { date: auj(), duree: Math.round((Date.now() - RUN.debut) / 1000), points: Math.round(pts * 100) / 100, rep: RUN.rep.map(function (x) { return { sel: x.sel.slice().sort(), conf: x.conf }; }) };
        RUN = null; marquer(); route(); window.scrollTo(0, 0); toast("Copie rendue. Enregistre le journal.");
      };
    }
  }
  if (v === "journal") {
    $("exp").onclick = function () { exporter(); rendre(); toast("Journal téléchargé."); };
    $("imp").onchange = function () {
      var f = this.files[0]; if (!f) return;
      var lec = new FileReader();
      lec.onload = function () { try { charger(lec.result); toast("Journal chargé."); location.hash = "#"; } catch (e) { toast("Ce fichier n'est pas un journal valide."); } };
      lec.readAsText(f);
    };
    $("copier").onclick = function () { var t = $("txt"); t.select(); try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand("copy"); } toast("Copié."); };
    $("coller").onclick = function () { try { charger($("txt").value); toast("Journal chargé."); location.hash = "#"; } catch (e) { toast("Texte illisible."); } };
  }
}

window.addEventListener("hashchange", function () { route(); window.scrollTo(0, 0); });
window.addEventListener("beforeunload", function (e) { if (SALE || CHR) { e.preventDefault(); e.returnValue = ""; } });
document.getElementById("theme").onclick = function () {
  var r = document.documentElement, sombre = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = sombre ? "light" : "dark";
};
route();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
