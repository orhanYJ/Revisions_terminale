<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protocole Santé</title>
<meta name="description" content="Initiation à la licence portail santé : cinq méthodes de travail testées sur trois matières, mesurées par des QCM de type concours.">
<meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A20" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --papier:#F4F3EE; --carte:#FFFFFF; --encre:#18232C; --doux:#5B6770; --trait:#DAD8CF;
  --accent:#16707A; --accent-p:#E2F0EF; --alerte:#B8432F; --alerte-p:#F8E6E1; --ok:#2B7A4B; --ok-p:#E3F1E7;
  --or:#A8741A; --or-p:#F6EEDC;
  --m1:#6A737D; --m2:#B4740C; --m3:#6A4BA6; --m4:#C2414F; --m5:#23805E;
  --rayon:14px; --ombre:0 1px 2px rgba(24,35,44,.06),0 4px 14px rgba(24,35,44,.05);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papier:#121A20; --carte:#1A242B; --encre:#E6E9E7; --doux:#9AA6AD; --trait:#2C3941;
    --accent:#4FB3B8; --accent-p:#183238; --alerte:#E5856F; --alerte-p:#3A2420; --ok:#6CC38E; --ok-p:#1C3326;
    --or:#D9A64A; --or-p:#352B18;
    --m1:#9AA3AC; --m2:#E0A23A; --m3:#A88BE0; --m4:#E87A86; --m5:#5CC39A;
    --ombre:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papier:#121A20; --carte:#1A242B; --encre:#E6E9E7; --doux:#9AA6AD; --trait:#2C3941;
  --accent:#4FB3B8; --accent-p:#183238; --alerte:#E5856F; --alerte-p:#3A2420; --ok:#6CC38E; --ok-p:#1C3326;
  --or:#D9A64A; --or-p:#352B18;
  --m1:#9AA3AC; --m2:#E0A23A; --m3:#A88BE0; --m4:#E87A86; --m5:#5CC39A;
  --ombre:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papier);color:var(--encre);font:16px/1.6 var(--sans);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.25;letter-spacing:-.005em}
h1{font-size:1.75rem;margin:.2em 0 .4em}
h2{font-size:1.3rem;margin:1.8em 0 .6em}
h3{font-size:1.08rem;margin:1.4em 0 .4em}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papier) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--trait)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.marque{display:flex;align-items:center;gap:10px;white-space:nowrap;text-decoration:none;color:var(--encre);font-family:var(--serif);font-weight:600;font-size:1.1rem}
.marque svg{flex:none}
.espace{flex:1}
.pastille{font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--alerte-p);color:var(--alerte);border:0;cursor:pointer;white-space:nowrap}
.pastille[hidden]{display:none}
.theme{border:1px solid var(--trait);background:var(--carte);border-radius:99px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center}
nav.bas{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--carte);border-top:1px solid var(--trait);padding-bottom:env(safe-area-inset-bottom)}
nav.bas .wrap{display:flex;justify-content:space-around;padding:0 4px}
nav.bas a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;text-decoration:none;color:var(--doux);font-size:.72rem;font-weight:500}
nav.bas a svg{width:22px;height:22px}
nav.bas a.on{color:var(--accent)}
main{padding:18px 0 30px}
.sur{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--doux);font-weight:600;margin:0}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);padding:16px 18px;box-shadow:var(--ombre);margin:12px 0}
.carte h3:first-child,.carte h2:first-child{margin-top:0}
.lead{font-size:1.05rem;color:var(--doux)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;text-decoration:none;font-size:.95rem}
.btn.sec{background:transparent;color:var(--accent)}
.btn.petit{padding:6px 12px;font-size:.85rem}
.btn.danger{background:transparent;border-color:var(--alerte);color:var(--alerte)}
.btn:disabled{opacity:.45;cursor:default}
.rangee{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.methode-tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid currentColor}
.bande{border-left:5px solid var(--c,var(--accent))}
.imperatif{background:var(--or-p);border:1px solid color-mix(in srgb,var(--or) 40%,transparent);border-radius:var(--rayon);padding:16px 18px;margin:12px 0}
.imperatif .sur{color:var(--or)}
.imperatif h2{margin:.25em 0 .3em;font-size:1.35rem}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lien-carte{display:block;text-decoration:none;color:inherit}
.lien-carte:hover .carte{border-color:var(--accent)}
.etat{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.etat.fait{background:var(--ok-p);color:var(--ok)}
.etat.retard{background:var(--alerte-p);color:var(--alerte)}
.etat.jour{background:var(--or-p);color:var(--or)}
.etat.avenir{background:var(--accent-p);color:var(--accent)}
.etat.saute{background:var(--trait);color:var(--doux)}
.seance{display:grid;gap:6px}
.seance-tete{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.seance-tete b{font-family:var(--serif);font-size:1.05rem}
.j{font-family:var(--serif);font-weight:700;color:var(--c,var(--accent));min-width:2.6em}
ol.etapes{margin:.3em 0 .2em;padding-left:1.3em}
ol.etapes li{margin:.25em 0}
.min{color:var(--doux);font-size:.85rem;white-space:nowrap}
.chrono{font-variant-numeric:tabular-nums;font-family:var(--serif);font-size:1.6rem;font-weight:700}
.interdit{background:var(--alerte-p);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.94rem}
.interdit b{color:var(--alerte)}
.note{font-size:.88rem;color:var(--doux)}
table{border-collapse:collapse;width:100%;font-size:.92rem;margin:10px 0}
th,td{border-bottom:1px solid var(--trait);padding:7px 8px;text-align:left;vertical-align:top}
th{font-weight:600;background:color-mix(in srgb,var(--trait) 35%,transparent)}
.defile{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* cours */
.cours p{margin:.6em 0}
.cours ul,.cours ol{padding-left:1.3em}
.cours li{margin:.2em 0}
.def,.cle,.piege,.hp,.lienT,.src{border-radius:10px;padding:10px 14px;margin:14px 0;font-size:.96rem}
.def{background:var(--accent-p);border-left:4px solid var(--accent)}
.cle{background:var(--ok-p);border-left:4px solid var(--ok)}
.piege{background:var(--alerte-p);border-left:4px solid var(--alerte)}
.hp{background:color-mix(in srgb,var(--trait) 45%,transparent);border-left:4px dashed var(--doux)}
.lienT{background:var(--or-p);border-left:4px solid var(--or)}
.src{font-size:.85rem;color:var(--doux);border:1px dashed var(--trait)}
.def>b:first-child,.cle>b:first-child,.piege>b:first-child,.hp>b:first-child,.lienT>b:first-child{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.cle>b:first-child{color:var(--ok)} .piege>b:first-child{color:var(--alerte)} .def>b:first-child{color:var(--accent)} .lienT>b:first-child{color:var(--or)} .hp>b:first-child{color:var(--doux)}
details{border:1px solid var(--trait);border-radius:10px;padding:0 14px;margin:12px 0;background:var(--carte)}
details summary{cursor:pointer;padding:10px 0;font-weight:600}
details[open]{padding-bottom:10px}
figure{margin:16px 0;text-align:center}
figure svg{max-width:100%;height:auto}
figcaption{font-size:.85rem;color:var(--doux);margin-top:4px}
.placeholder{border:2px dashed var(--trait);border-radius:var(--rayon);padding:22px;text-align:center;color:var(--doux)}
/* qcm */
.q-enonce{font-weight:600;margin:.4em 0 .8em}
.prop{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--carte);border:1.5px solid var(--trait);border-radius:10px;padding:11px 13px;margin:8px 0;cursor:pointer;line-height:1.45}
.prop .lettre{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-weight:700;border:1.5px solid var(--trait);font-size:.9rem}
.prop.sel{border-color:var(--accent);background:var(--accent-p)}
.prop.sel .lettre{background:var(--accent);border-color:var(--accent);color:#fff}
.prop.vrai{border-color:var(--ok)} .prop.vrai .lettre{background:var(--ok);border-color:var(--ok);color:#fff}
.prop.faux-coche{border-color:var(--alerte);background:var(--alerte-p)}
.prop.oubli{border-color:var(--ok);border-style:dashed}
.expl{font-size:.88rem;color:var(--doux);margin-top:3px}
.conf{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.conf button{flex:1;min-width:90px;border:1.5px solid var(--trait);background:var(--carte);border-radius:10px;padding:8px 6px;cursor:pointer;font-size:.88rem}
.conf button.on{border-color:var(--or);background:var(--or-p);font-weight:600}
.barre-prog{height:6px;border-radius:99px;background:var(--trait);overflow:hidden;margin:8px 0 14px}
.barre-prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.score{font-family:var(--serif);font-size:2.2rem;font-weight:700}
.barre{height:12px;border-radius:99px;background:var(--trait);overflow:hidden}
.barre i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.ligne-res{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
input[type=date],input[type=number],textarea,select{font:inherit;color:inherit;background:var(--carte);border:1px solid var(--trait);border-radius:8px;padding:7px 10px}
input[type=number]{width:90px}
textarea{width:100%;min-height:70px}
.etoiles{display:flex;gap:4px}
.etoiles button{border:1px solid var(--trait);background:var(--carte);border-radius:8px;width:38px;height:36px;cursor:pointer}
.etoiles button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.frise{display:flex;gap:6px;margin:10px 0}
.frise a{flex:1;text-decoration:none;color:inherit;text-align:center;font-size:.72rem}
.frise a i{display:block;height:8px;border-radius:99px;background:var(--trait);margin-bottom:4px}
.frise a.fait i{background:var(--c)}
.frise a.cours i{background:linear-gradient(90deg,var(--c) 50%,var(--trait) 50%)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--encre);color:var(--papier);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}
@media (min-width:700px){h1{font-size:2rem}}
@media print{nav.bas,header.top{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="marque" href="#">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M4 17h6l2.5-6 4 12 3-9 1.8 3H28" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Protocole Santé
  </a>
  <span class="espace"></span>
  <button class="pastille" id="sale" hidden onclick="location.hash='#journal'">Non enregistré</button>
  <button class="theme" id="theme" aria-label="Changer de thème">◐</button>
</div></header>

<main><div class="wrap" id="app"></div></main>

<nav class="bas"><div class="wrap">
  <a href="#" data-r="accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Aujourd'hui</a>
  <a href="#methodes" data-r="methodes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6M10 4v5L5 19a1.5 1.5 0 0 0 1.3 2h11.4a1.5 1.5 0 0 0 1.3-2L14 9V4"/><path d="M7.5 15h9"/></svg>Méthodes</a>
  <a href="#cours" data-r="cours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/></svg>Cours</a>
  <a href="#resultats" data-r="resultats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Résultats</a>
  <a href="#journal" data-r="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Journal</a>

<script>
"use strict";
/* ============================================================
   DONNÉES — le protocole
   ============================================================ */
var MATIERES = {
  bc:  { nom: "Biologie cellulaire", court: "Bio. cell." },
  bio: { nom: "Biochimie", court: "Biochimie" },
  ana: { nom: "Anatomie", court: "Anatomie" }
};

/* Calendrier commun à toutes les méthodes : même nombre de séances, mêmes durées,
   mêmes jours. Seule la manière de travailler change. J0 = un mercredi. */
var SEANCES = [
  { j: 0,  min: 60, type: "app", mat: "bc"  },
  { j: 2,  min: 60, type: "app", mat: "bio" },
  { j: 3,  min: 60, type: "app", mat: "ana" },
  { j: 4,  min: 40, type: "cons" },
  { j: 7,  min: 40, type: "cons" },
  { j: 9,  min: 40, type: "cons" },
  { j: 11, min: 40, type: "cons" }
];
var J_CLOTURE = 14, J_RETARD = 28;

var METHODES = [
 { id: "M1", nom: "Relire", sous: "La méthode habituelle", c: "var(--m1)",
   idee: "Lire la fiche, la surligner, puis la relire. C'est la façon de travailler la plus répandue chez les lycéens et les étudiants.",
   pourquoi: "Elle passe en premier parce qu'elle sert de point de comparaison : une fois les autres méthodes apprises, on ne saurait plus relire « naïvement ». Si une méthode fait mieux qu'elle, c'est qu'elle apporte vraiment quelque chose.",
   app: [["Lire la fiche en entier, sans s'arrêter.", 20], ["La relire en surlignant l'essentiel.", 20], ["La relire une troisième fois, en s'arrêtant sur chaque passage surligné.", 20]],
   cons: [["Relire attentivement les trois fiches, en insistant sur les passages surlignés.", 40]],
   interdit: "cacher la fiche pour réciter, se faire interroger, faire des QCM sur ces chapitres. Ce serait une autre méthode : la mesure serait faussée." },
 { id: "M2", nom: "La feuille blanche", sous: "Rappel libre", c: "var(--m2)",
   idee: "Après une lecture, fermer la fiche et écrire de mémoire tout ce dont on se souvient, puis corriger en vert. Le vert montre exactement ce qu'il reste à apprendre.",
   pourquoi: "Aller chercher une information dans sa mémoire la consolide bien plus que la relire : c'est l'effet de test, l'un des résultats les plus solides de la psychologie cognitive.",
   app: [["Lire la fiche une fois, en repérant son plan.", 20], ["Tout fermer. Feuille blanche : écrire de mémoire le plan, les définitions, les chiffres, les schémas.", 15], ["Rouvrir la fiche et compléter en vert ce qui manquait ou était faux.", 15], ["Nouvelle feuille blanche, seulement sur ce qui était en vert, puis contrôle.", 10]],
   cons: [["Pour chacun des trois chapitres : feuille blanche de 7 minutes, sans rien relire avant.", 21], ["Correction en vert de chaque feuille, fiche ouverte (6 minutes par chapitre).", 19]],
   interdit: "relire la fiche avant la feuille blanche. La feuille blanche n'est pas une fiche à refaire : elle sert seulement à se tester. Garder les feuilles datées pour voir le vert diminuer." },
 { id: "M3", nom: "Expliquer (Feynman)", sous: "Enseigner pour comprendre", c: "var(--m3)",
   idee: "Expliquer chaque notion à voix haute, avec des mots simples, comme à un élève de troisième. Là où l'explication bloque, on n'a pas compris : on retourne à la fiche.",
   pourquoi: "Reformuler oblige à relier les idées entre elles au lieu de réciter des mots. La méthode porte le nom du physicien Richard Feynman, réputé pour expliquer simplement des choses difficiles.",
   app: [["Lire la fiche.", 20], ["Pour 3 notions clés : les expliquer à voix haute sans support (mots simples, une analogie, un exemple), en s'enregistrant au téléphone.", 20], ["Réécouter : repérer chaque endroit où tu bloques ou récites un mot sans pouvoir l'expliquer, retourner à la fiche sur ces trous, puis réexpliquer.", 20]],
   cons: [["Pour chaque chapitre : l'expliquer en entier, de mémoire, en 5 minutes enregistrées.", 15], ["Réécouter fiche en main et repérer les erreurs.", 15], ["Répondre à voix haute aux questions « pourquoi ? » du chapitre.", 10]],
   interdit: "lire la fiche pendant l'explication. Une explication lue n'est pas une explication." },
 { id: "M4", nom: "Tester d'abord", sous: "Pré-test et séries mélangées", c: "var(--m4)",
   idee: "Commencer par un test sur un chapitre qu'on n'a pas encore lu (se tromper est voulu), lire ensuite la fiche en cherchant les réponses, puis s'entraîner sur des séries où les trois matières sont mélangées.",
   pourquoi: "Un pré-test prépare la mémoire à repérer ce qui compte. Mélanger les questions oblige à identifier à chaque fois de quoi il s'agit, ce qui est exactement la situation du concours.",
   app: [["Pré-test du chapitre, avant toute lecture.", 10], ["Lire la fiche en cherchant les réponses.", 25], ["Refaire le test, corriger, et pour chaque erreur dire en une phrase pourquoi.", 15], ["Série d'entraînement du chapitre.", 10]],
   cons: [["Série mélangée des trois chapitres (questions dans le désordre).", 25], ["Pour chaque erreur : retrouver le passage de la fiche et dire la règle à voix haute.", 15]],
   interdit: "regarder la correction avant d'avoir répondu à toute la série. Les questions d'entraînement ne sont jamais celles du QCM de mesure." },
 { id: "M5", nom: "La méthode des J", sous: "Cartes et répétition espacée", c: "var(--m5)",
   idee: "Réciter des cartes question / réponse tirées des fiches, à intervalles de plus en plus longs (J0, J4, J7, J9, J11). Une carte ratée revient plus souvent, une carte sue s'espace. Les cartes sont fournies : rien à fabriquer.",
   pourquoi: "On oublie vite après avoir appris, mais chaque rappel réussi ralentit l'oubli suivant. Espacer les rappels est la base des logiciels de cartes (Anki) très utilisés en médecine.",
   app: [["Lire la fiche.", 20], ["Premier passage des cartes du chapitre : dire la réponse avant de retourner chaque carte.", 30], ["Reprendre tout de suite les cartes ratées.", 10]],
   cons: [["Passer les cartes des trois chapitres : réussie, elle avance d'une boîte ; ratée, elle revient en boîte 1. J4 et J11 : toutes les boîtes. J7 et J9 : boîtes 1 et 2.", 35], ["Reprendre les cartes ratées deux fois de suite.", 5]],
   interdit: "retourner la carte avant d'avoir dit la réponse en entier, à voix haute ou dans sa tête." }
];

/* Plan d'expérience : chaque méthode voit les trois matières, avec des chapitres
   différents. Ainsi la méthode n'est jamais confondue avec l'aisance dans une matière. */
var PLAN = {
  M1: { bc: "bc1", bio: "bio1", ana: "ana1" },
  M2: { bc: "bc2", bio: "bio2", ana: "ana2" },
  M3: { bc: "bc3", bio: "bio3", ana: "ana3" },
  M4: { bc: "bc4", bio: "bio4", ana: "ana4" },
  M5: { bc: "bc5", bio: "bio5", ana: "ana5" }
};

/* ============================================================
   DONNÉES — les cours
   ============================================================ */
var CHAPITRES = {
 bc1: { mat: "bc", titre: "La cellule eucaryote : organisation et outils d'observation", html: `
<p class="lead">La cellule est l'unité de base du vivant. Ce chapitre fait le tour de ses compartiments et des techniques qui permettent de les voir et de les séparer : tout le reste de la biologie cellulaire s'appuie dessus.</p>

<h2>1. La théorie cellulaire</h2>
<div class="def"><b>Définition</b>La <strong>théorie cellulaire</strong> pose trois principes : tout être vivant est fait d'une ou de plusieurs cellules ; la cellule est l'unité de structure et de fonctionnement du vivant ; toute cellule provient d'une cellule préexistante.</div>
<p>Elle s'est construite au XIX<sup>e</sup> siècle : Schleiden pour les végétaux (1838), Schwann pour les animaux (1839), puis Virchow (1855) avec la formule <em>omnis cellula e cellula</em>, « toute cellule vient d'une cellule ». Le mot « cellule » remonte à Hooke (1665), qui observait les logettes vides d'une lame de liège.</p>

<h2>2. Deux plans d'organisation</h2>
<p>Les cellules se rangent en deux grands types. La différence essentielle est la présence, chez les eucaryotes, de <strong>compartiments internes limités par des membranes</strong>, dont le noyau.</p>
<div class="defile"><table>
<tr><th></th><th>Procaryote (bactérie)</th><th>Eucaryote (animal, végétal, champignon)</th></tr>
<tr><td>Taille typique</td><td>1 à 5 µm</td><td>10 à 100 µm</td></tr>
<tr><td>ADN</td><td>dans le cytoplasme (nucléoïde), un chromosome en général circulaire, souvent des plasmides</td><td>dans un noyau limité par une enveloppe à deux membranes ; plusieurs chromosomes linéaires associés à des histones</td></tr>
<tr><td>Organites membranaires</td><td>absents</td><td>nombreux (réticulum, Golgi, mitochondries…)</td></tr>
<tr><td>Ribosomes</td><td>70S</td><td>80S dans le cytosol</td></tr>
<tr><td>Cytosquelette</td><td>protéines apparentées, rudimentaire</td><td>développé (actine, microtubules, filaments intermédiaires)</td></tr>
</table></div>
<div class="cle"><b>L'idée à retenir</b>La <strong>compartimentation</strong> permet de faire coexister dans la même cellule des réactions aux conditions incompatibles. Exemple : le lysosome maintient un pH d'environ 4,5 à 5 pour ses enzymes digestives, alors que le cytosol reste vers 7,2 ; si ces enzymes se répandaient dans le cytosol, elles y seraient peu actives, ce qui protège la cellule.</div>
<div class="lienT"><b>Lien avec la Terminale</b>Les mitochondries et les chloroplastes possèdent leur propre ADN circulaire et des ribosomes de type bactérien : ce sont des traces de l'endosymbiose vue en SVT (chapitre 2, partie III).</div>

<h2>3. Visite des compartiments</h2>
<div class="defile"><table>
<tr><th>Compartiment</th><th>Structure</th><th>Rôle principal</th></tr>
<tr><td><b>Membrane plasmique</b></td><td>bicouche lipidique d'environ 7,5 nm, avec des protéines</td><td>limite la cellule, contrôle les échanges, reconnaissance</td></tr>
<tr><td><b>Cytosol</b></td><td>gel aqueux riche en protéines</td><td>nombreuses réactions du métabolisme (glycolyse), synthèse des protéines sur les ribosomes libres</td></tr>
<tr><td><b>Noyau</b></td><td>enveloppe nucléaire à deux membranes, percée de pores ; chromatine ; nucléole</td><td>conserve l'ADN, lieu de la transcription ; le nucléole fabrique les ARN ribosomiques et assemble les sous-unités des ribosomes</td></tr>
<tr><td><b>Réticulum endoplasmique rugueux (RER)</b></td><td>sacs aplatis couverts de ribosomes sur leur face cytosolique ; en continuité avec la membrane externe de l'enveloppe nucléaire</td><td>synthèse des protéines destinées à être sécrétées, insérées dans les membranes ou envoyées aux lysosomes</td></tr>
<tr><td><b>Réticulum endoplasmique lisse (REL)</b></td><td>tubules sans ribosomes</td><td>synthèse des lipides, détoxification (très développé dans les hépatocytes), réserve de calcium (réticulum sarcoplasmique du muscle)</td></tr>
<tr><td><b>Appareil de Golgi</b></td><td>empilement de saccules (dictyosome) avec une face <em>cis</em> tournée vers le RE et une face <em>trans</em> de sortie</td><td>maturation des protéines (glycosylation), tri et expédition</td></tr>
<tr><td><b>Lysosomes</b></td><td>vésicules à pH acide (≈ 4,5 à 5)</td><td>digestion intracellulaire grâce à des hydrolases acides</td></tr>
<tr><td><b>Peroxysomes</b></td><td>vésicules à une membrane</td><td>réactions d'oxydation ; la catalase détruit l'eau oxygénée (H<sub>2</sub>O<sub>2</sub>) produite</td></tr>
<tr><td><b>Mitochondries</b></td><td>deux membranes ; l'interne forme des crêtes ; matrice ; ADN propre</td><td>respiration cellulaire et production d'ATP</td></tr>
<tr><td><b>Cytosquelette</b></td><td>microfilaments d'actine (≈ 7 nm), filaments intermédiaires (≈ 10 nm), microtubules (≈ 25 nm)</td><td>forme, mouvements, transport intracellulaire</td></tr>
</table></div>
<p>Pour fixer les ordres de grandeur, la répartition du volume dans un hépatocyte (cellule du foie) : cytosol ≈ 54 %, mitochondries ≈ 22 %, RER ≈ 9 %, REL et Golgi ≈ 6 %, noyau ≈ 6 %, peroxysomes, lysosomes et endosomes ≈ 1 % chacun. <span class="note">(chiffres tirés d'Alberts, <em>Biologie moléculaire de la cellule</em>)</span></p>
<div class="piege"><b>Piège de concours</b>« Le RE lisse porte des ribosomes » : faux, c'est ce qui le distingue du RE rugueux. Autre classique : la membrane externe de l'enveloppe nucléaire est en continuité avec le RER, et peut elle aussi porter des ribosomes.</div>

<h2>4. Voir la cellule : les microscopes</h2>
<div class="def"><b>Définition</b>Le <strong>pouvoir de résolution</strong> est la plus petite distance qui sépare deux points encore vus distincts. Plus il est petit, plus l'image est détaillée. À ne pas confondre avec le <strong>grossissement</strong> : agrandir une image floue n'apporte aucun détail.</div>
<div class="defile"><table>
<tr><th>Instrument</th><th>Résolution</th><th>Ce qu'on voit</th></tr>
<tr><td>Œil nu</td><td>≈ 0,1 à 0,2 mm</td><td>un ovocyte humain, à peine</td></tr>
<tr><td>Microscope optique (MO)</td><td>≈ 0,2 µm</td><td>cellules, noyaux, grosses structures</td></tr>
<tr><td>Microscope électronique à transmission (MET)</td><td>de l'ordre du nm sur un échantillon biologique</td><td>ultrastructure : organites, membranes</td></tr>
</table></div>
<p>La résolution du microscope optique est limitée par la <strong>longueur d'onde de la lumière visible</strong> (400 à 700 nm) : on ne peut pas descendre sous environ la moitié de cette longueur d'onde. Les électrons ont une longueur d'onde bien plus courte, d'où le gain du microscope électronique.</p>

<h3>Le microscope optique et les colorations</h3>
<p>Préparation classique d'un tissu : <strong>fixation</strong> (formol, pour figer les structures), <strong>inclusion</strong> en paraffine, <strong>coupe</strong> au microtome (environ 5 µm d'épaisseur), puis <strong>coloration</strong>, car les cellules sont presque transparentes.</p>
<p>La coloration la plus courante est l'<strong>HES</strong> (hématoxyline, éosine, safran) :</p>
<ul>
<li>l'<strong>hématoxyline</strong>, colorant basique, colore en violet-bleu les structures acides : le noyau (ADN), et le RER (riche en ARN). Ces structures sont dites <strong>basophiles</strong> ;</li>
<li>l'<strong>éosine</strong>, colorant acide, colore en rose les structures basiques : la plupart des protéines du cytoplasme. Elles sont dites <strong>acidophiles</strong> (ou éosinophiles) ;</li>
<li>le safran colore le collagène en jaune.</li>
</ul>
<div class="piege"><b>Piège de concours</b>« Basophile » signifie « qui aime le colorant basique », donc que la structure est <strong>acide</strong>. Une structure basophile n'est pas basique.</div>

<h3>La fluorescence</h3>
<p>Un <strong>fluorochrome</strong> absorbe une lumière et en réémet une autre, de <strong>longueur d'onde plus grande</strong> (le fluorochrome perd un peu d'énergie au passage). En <strong>immunofluorescence</strong>, un anticorps qui reconnaît une protéine précise est couplé à un fluorochrome : on voit où se trouve cette protéine. La <strong>GFP</strong> (protéine fluorescente verte d'une méduse, <em>Aequorea victoria</em>), fusionnée à une protéine par génie génétique, permet de suivre cette protéine dans une cellule <strong>vivante</strong>.</p>

<h3>Les microscopes électroniques</h3>
<ul>
<li><strong>MET (transmission)</strong> : les électrons traversent une coupe ultrafine (50 à 100 nm), après fixation au glutaraldéhyde et au tétroxyde d'osmium et inclusion en résine. Le contraste vient de sels de métaux lourds (uranyle, plomb) : les zones qui les fixent arrêtent les électrons et apparaissent <strong>sombres</strong> (« denses aux électrons »). La membrane plasmique y apparaît en trois feuillets, sombre-clair-sombre (aspect <strong>trilamellaire</strong>). L'échantillon est mort.</li>
<li><strong>MEB (balayage)</strong> : un faisceau d'électrons balaie la <strong>surface</strong> d'un échantillon recouvert d'une fine couche de métal. On obtient une image en relief de la surface, sans voir l'intérieur.</li>
</ul>

<h2>5. Séparer les organites : le fractionnement cellulaire</h2>
<p>Pour étudier un organite, on l'isole. Les cellules sont d'abord <strong>broyées</strong> (homogénéisation) dans un milieu <strong>isotonique</strong> (souvent du saccharose) et <strong>au froid</strong> (4 °C), pour que les organites ne gonflent pas et que les enzymes ne les dégradent pas.</p>
<p>La <strong>centrifugation différentielle</strong> consiste à centrifuger le broyat à des accélérations croissantes. À chaque étape, les éléments les plus gros et les plus denses tombent au fond (le culot) ; on récupère le liquide (le surnageant) pour l'étape suivante.</p>
<div class="defile"><table>
<tr><th>Accélération (ordre de grandeur)</th><th>Le culot contient</th></tr>
<tr><td>≈ 1 000 g, 10 min</td><td>noyaux (et cellules non broyées)</td></tr>
<tr><td>≈ 20 000 g</td><td>mitochondries, lysosomes, peroxysomes</td></tr>
<tr><td>≈ 100 000 g</td><td>microsomes (fragments de RE et de membranes)</td></tr>
<tr><td>≈ 200 000 g et plus</td><td>ribosomes</td></tr>
<tr><td>dernier surnageant</td><td>le cytosol</td></tr>
</table></div>
<p>Pour séparer plus finement, on centrifuge sur un <strong>gradient de densité</strong> (de saccharose, par exemple) : chaque organite s'arrête au niveau où la densité du milieu égale la sienne.</p>
<div class="piege"><b>Piège de concours</b>La vitesse de sédimentation s'exprime en <strong>Svedberg (S)</strong>. Elle dépend de la masse <em>et</em> de la forme : les S ne s'additionnent pas. Un ribosome eucaryote 80S est fait d'une sous-unité 60S et d'une sous-unité 40S (et 60 + 40 ≠ 80).</div>

<div class="cle"><b>Bilan</b>La cellule eucaryote est compartimentée : chaque organite a sa composition et ses fonctions. Le microscope optique (résolution ≈ 0,2 µm) montre les cellules, le microscope électronique (≈ 1 nm) leur ultrastructure ; le fractionnement isole les organites pour les étudier.</div>

<details><summary>Hors programme : voir encore plus fin</summary>
<div class="hp"><b>Hors programme</b>La microscopie de <strong>super-résolution</strong> contourne la limite optique grâce à la fluorescence (prix Nobel de chimie 2014 : Betzig, Hell, Moerner). La <strong>cryo-microscopie électronique</strong> observe des molécules congelées sans coloration et reconstruit leur structure en 3D (prix Nobel de chimie 2017).</div>
</details>
<p class="src">Contenu original rédigé pour ce site, niveau début de première année, vérifié sur les ouvrages de référence (Alberts, <em>Biologie moléculaire de la cellule</em>). Il ne remplace pas le cours de la faculté.</p>
` },

 bio1: { mat: "bio", titre: "Les acides aminés", html: `
<p class="lead">Les protéines sont des chaînes d'acides aminés. Avant d'étudier les protéines, il faut connaître ces briques : leur structure commune, ce qui les distingue, et leur comportement selon le pH, très souvent interrogé au concours.</p>

<h2>1. Une structure commune</h2>
<div class="def"><b>Définition</b>Un <strong>acide aminé</strong> (α-aminé) porte, sur un même carbone appelé <strong>carbone α</strong> : une fonction <strong>amine</strong> (–NH<sub>2</sub>), une fonction <strong>acide carboxylique</strong> (–COOH), un atome d'<strong>hydrogène</strong> et une <strong>chaîne latérale R</strong>, propre à chaque acide aminé.</div>
<figure><svg viewBox="0 0 300 150" width="300" role="img" aria-label="Formule générale d'un acide aminé">
<g font-family="system-ui,sans-serif" font-size="18" fill="currentColor" text-anchor="middle">
<text x="150" y="82" font-weight="700">C</text><text x="168" y="70" font-size="12">α</text>
<text x="62" y="82">H₂N</text><text x="245" y="82">COOH</text>
<text x="150" y="30">R</text><text x="150" y="135">H</text></g>
<g stroke="currentColor" stroke-width="2"><line x1="88" y1="76" x2="136" y2="76"/><line x1="164" y1="76" x2="212" y2="76"/><line x1="150" y1="38" x2="150" y2="62"/><line x1="150" y1="88" x2="150" y2="116"/></g>
</svg><figcaption>Formule générale : seule la chaîne R change d'un acide aminé à l'autre.</figcaption></figure>
<p>Le code génétique utilise <strong>20 acides aminés standard</strong>. Chacun a un nom, un code à trois lettres et un code à une lettre (Gly / G pour la glycine, Trp / W pour le tryptophane…).</p>

<h2>2. Chiralité : la série L</h2>
<p>Le carbone α porte quatre groupements différents : il est <strong>asymétrique</strong> (chiral). Un acide aminé existe donc sous deux formes images l'une de l'autre dans un miroir, notées <strong>D</strong> et <strong>L</strong>. Les protéines humaines n'utilisent que la forme <strong>L</strong>.</p>
<p>Seule exception : la <strong>glycine</strong>, dont la chaîne latérale est un simple atome d'hydrogène. Son carbone α porte deux H : il n'est pas asymétrique.</p>
<div class="piege"><b>Piège de concours</b>D/L et R/S sont deux nomenclatures différentes. Presque tous les acides aminés L sont de configuration S, mais la L-cystéine est R (à cause de l'atome de soufre, prioritaire). « Tous les acides aminés des protéines sont S » est donc faux.</div>

<h2>3. Classer les acides aminés par leur chaîne latérale</h2>
<p>La chaîne R donne à chaque acide aminé son caractère, et à la protéine sa forme : les chaînes apolaires se cachent à l'intérieur de la protéine, loin de l'eau ; les chaînes polaires et chargées restent en surface.</p>
<div class="defile"><table>
<tr><th>Famille</th><th>Acides aminés (code à 1 lettre)</th><th>Repère</th></tr>
<tr><td>Apolaires aliphatiques</td><td>glycine (G), alanine (A), valine (V), leucine (L), isoleucine (I), méthionine (M), proline (P)</td><td>chaînes carbonées ; la méthionine porte un soufre ; la proline forme un cycle avec sa propre amine (amine secondaire)</td></tr>
<tr><td>Aromatiques</td><td>phénylalanine (F), tyrosine (Y), tryptophane (W)</td><td>cycle benzénique ; la tyrosine porte un phénol (–OH) ; le tryptophane un noyau indole</td></tr>
<tr><td>Polaires non chargés</td><td>sérine (S), thréonine (T), cystéine (C), asparagine (N), glutamine (Q)</td><td>Ser et Thr : fonction alcool ; Cys : fonction thiol (–SH) ; Asn et Gln : fonction amide</td></tr>
<tr><td>Chargés + (basiques)</td><td>lysine (K), arginine (R), histidine (H)</td><td>chaîne portant une fonction amine (ou apparentée) qui capte un proton</td></tr>
<tr><td>Chargés − (acides)</td><td>aspartate (D), glutamate (E)</td><td>chaîne portant une deuxième fonction acide carboxylique</td></tr>
</table></div>
<div class="piege"><b>Piège de concours</b>Les codes à une lettre qui ne sont pas l'initiale : <strong>K</strong> lysine, <strong>R</strong> arginine, <strong>D</strong> aspartate, <strong>E</strong> glutamate, <strong>N</strong> asparagine, <strong>Q</strong> glutamine, <strong>F</strong> phénylalanine, <strong>Y</strong> tyrosine, <strong>W</strong> tryptophane.</div>
<p>Deux cystéines peuvent s'unir par <strong>oxydation</strong> de leurs fonctions thiol : elles forment un <strong>pont disulfure</strong> (–S–S–), qui stabilise la forme de nombreuses protéines (on appelle « cystine » le dimère formé).</p>

<h2>4. Les acides aminés essentiels</h2>
<div class="def"><b>Définition</b>Un acide aminé est <strong>essentiel</strong> (ou indispensable) quand l'organisme ne sait pas le fabriquer, ou pas en quantité suffisante : il doit être apporté par l'alimentation.</div>
<p>Chez l'humain, ils sont neuf : leucine, thréonine, lysine, tryptophane, phénylalanine, valine, méthionine, isoleucine, et l'histidine. Moyen mnémotechnique classique pour les huit premiers : « <strong>Le Très Lyrique Tristan Fait Vachement Méditer Iseult</strong> » (Leu, Thr, Lys, Trp, Phe, Val, Met, Ile), auquel on ajoute l'histidine.</p>

<h2>5. Les propriétés acido-basiques</h2>
<p>C'est la partie la plus interrogée. Les fonctions acide et amine captent ou libèrent un proton (H<sup>+</sup>) selon le pH :</p>
<ul>
<li>la fonction α-COOH a un pK<sub>a</sub> d'environ <strong>2</strong> : au-dessus de pH 2, elle est surtout sous forme COO<sup>−</sup> ;</li>
<li>la fonction α-NH<sub>3</sub><sup>+</sup> a un pK<sub>a</sub> d'environ <strong>9 à 10</strong> : en dessous, elle est surtout sous forme NH<sub>3</sub><sup>+</sup>.</li>
</ul>
<div class="cle"><b>L'idée à retenir</b>À pH physiologique (≈ 7,4), un acide aminé porte donc à la fois une charge + (NH<sub>3</sub><sup>+</sup>) et une charge − (COO<sup>−</sup>) : c'est un <strong>zwitterion</strong> (ion mixte), de charge nette nulle pour un acide aminé dont la chaîne n'est pas ionisable.</div>
<h3>Le point isoélectrique (pHi)</h3>
<div class="def"><b>Définition</b>Le <strong>pHi</strong> est le pH auquel la charge nette moyenne de l'acide aminé est nulle. À son pHi, il <strong>ne migre pas</strong> dans un champ électrique.</div>
<ul>
<li>Acide aminé à chaîne non ionisable : pHi = (pK<sub>a1</sub> + pK<sub>a2</sub>) / 2. Pour la glycine (pK<sub>a</sub> 2,3 et 9,6) : pHi ≈ <strong>6,0</strong>.</li>
<li>Acide aminé acide (Asp, Glu) : moyenne des <strong>deux pK<sub>a</sub> les plus bas</strong>, d'où un pHi vers 3.</li>
<li>Acide aminé basique (Lys, Arg) : moyenne des <strong>deux pK<sub>a</sub> les plus élevés</strong>, d'où un pHi vers 10.</li>
</ul>
<div class="cle"><b>La règle de migration</b>pH du milieu <strong>inférieur</strong> au pHi : la molécule est chargée <strong>+</strong> et migre vers la <strong>cathode</strong> (pôle −). pH <strong>supérieur</strong> au pHi : elle est chargée <strong>−</strong> et migre vers l'<strong>anode</strong> (pôle +). C'est le principe de l'électrophorèse.</div>
<p>pK<sub>a</sub> approximatifs des chaînes latérales ionisables : aspartate ≈ 3,9 ; glutamate ≈ 4,1 ; <strong>histidine ≈ 6</strong> ; cystéine ≈ 8,3 ; tyrosine ≈ 10 ; lysine ≈ 10,5 ; arginine ≈ 12,5. L'histidine est la seule dont la chaîne a un pK<sub>a</sub> proche du pH physiologique : elle peut capter ou céder un proton dans la cellule, ce qui en fait un acteur fréquent des sites actifs d'enzymes.</p>

<details><summary>Méthode : déterminer la charge d'un acide aminé à un pH donné</summary>
<p>Pour chaque fonction ionisable, comparer le pH à son pK<sub>a</sub> : si pH &lt; pK<sub>a</sub>, la forme protonée domine (COOH neutre, NH<sub>3</sub><sup>+</sup> chargé +) ; si pH &gt; pK<sub>a</sub>, la forme déprotonée domine (COO<sup>−</sup> chargé −, NH<sub>2</sub> neutre). On additionne ensuite les charges.</p>
<p>Exemple, la lysine (pK<sub>a</sub> 2,2 ; 9,0 ; 10,5) à pH 7 : COO<sup>−</sup> (−1), α-NH<sub>3</sub><sup>+</sup> (+1), chaîne NH<sub>3</sub><sup>+</sup> (+1). Charge nette ≈ <strong>+1</strong> : elle migre vers la cathode.</p>
</details>

<h2>6. Propriétés et dérivés utiles</h2>
<ul>
<li><strong>Absorption à 280 nm</strong> : les cycles aromatiques du tryptophane et de la tyrosine absorbent les ultraviolets vers 280 nm. On s'en sert pour doser les protéines dans une solution.</li>
<li><strong>Précurseurs de molécules de signalisation</strong> : le tryptophane donne la sérotonine ; la tyrosine les catécholamines (dopamine, adrénaline) et les hormones thyroïdiennes ; l'histidine l'histamine ; le glutamate le GABA.</li>
</ul>
<div class="cle"><b>Bilan</b>Vingt acides aminés standard, tous de série L, tous chiraux sauf la glycine. La chaîne latérale les classe en apolaires, aromatiques, polaires, basiques, acides. À pH 7,4, ce sont des zwitterions ; leur charge dépend de la position du pH par rapport à leur pHi.</div>

<details><summary>Hors programme : les 21<sup>e</sup> et 22<sup>e</sup> acides aminés</summary>
<div class="hp"><b>Hors programme</b>La <strong>sélénocystéine</strong> (une cystéine dont le soufre est remplacé par du sélénium) est incorporée dans quelques protéines humaines grâce à un codon UGA détourné. La <strong>pyrrolysine</strong> n'existe que chez certains microorganismes.</div>
</details>
<p class="src">Contenu original rédigé pour ce site, niveau début de première année ; valeurs de pK<sub>a</sub> arrondies d'après Lehninger, <em>Principes de biochimie</em>. Il ne remplace pas le cours de la faculté.</p>
` },

 ana1: { mat: "ana", titre: "Le langage de l'anatomie : position, plans, axes et mouvements", html: `
<p class="lead">L'anatomie a sa langue. Avant d'apprendre un seul os, il faut savoir décrire sans ambiguïté où se trouve une structure et comment bouge une articulation. Tout le reste de l'anatomie, et l'imagerie médicale, utilisent ce vocabulaire.</p>

<h2>1. La position anatomique de référence</h2>
<div class="def"><b>Définition</b>Toute description se fait sur un sujet en <strong>position anatomique</strong> : debout, face à l'observateur, regard horizontal, membres supérieurs le long du corps, <strong>paumes tournées vers l'avant</strong>, membres inférieurs joints, pieds parallèles.</div>
<p>Conséquence : en position anatomique, le pouce est <strong>latéral</strong> et l'auriculaire (petit doigt) médial. La droite et la gauche sont toujours celles <strong>du sujet</strong>, jamais celles de l'observateur.</p>
<figure><svg viewBox="0 0 320 260" width="320" role="img" aria-label="Les trois plans anatomiques">
<g fill="none" stroke="currentColor" stroke-width="1.6">
<circle cx="160" cy="40" r="16"/><path d="M160 56v84M160 70l-34 54M160 70l34 54M160 140l-22 90M160 140l22 90"/></g>

<h2>2. Les plans et les axes</h2>
<div class="defile"><table>
<tr><th>Plan</th><th>Orientation</th><th>Sépare</th></tr>
<tr><td><b>Sagittal</b></td><td>vertical, d'avant en arrière ; le <strong>plan sagittal médian</strong> passe par le milieu du corps</td><td>droite et gauche (le médian en deux moitiés symétriques)</td></tr>
<tr><td><b>Frontal</b> (ou coronal)</td><td>vertical, parallèle au front</td><td>une partie antérieure et une partie postérieure</td></tr>
<tr><td><b>Transversal</b> (ou horizontal, axial)</td><td>perpendiculaire au grand axe du corps</td><td>une partie supérieure et une partie inférieure</td></tr>
</table></div>
<p>À chaque plan correspond un axe qui lui est perpendiculaire : l'axe <strong>vertical</strong> (ou longitudinal), l'axe <strong>sagittal</strong> (antéro-postérieur) et l'axe <strong>transversal</strong> (de droite à gauche). Un mouvement se fait <strong>dans un plan</strong>, <strong>autour de l'axe perpendiculaire</strong> à ce plan.</p>
<div class="piege"><b>Piège de concours (imagerie)</b>Les coupes axiales de scanner et d'IRM sont regardées <strong>par les pieds</strong> du patient couché : le côté droit du patient apparaît à <strong>gauche de l'image</strong>. Une coupe « coronale » est une coupe frontale, pas une coupe transversale.</div>

<h2>3. Les termes de direction</h2>
<div class="defile"><table>
<tr><th>Termes</th><th>Sens</th><th>Exemple</th></tr>
<tr><td>Supérieur (crânial) / inférieur (caudal)</td><td>vers la tête / vers les pieds</td><td>le nez est supérieur à la bouche</td></tr>
<tr><td>Antérieur (ventral) / postérieur (dorsal)</td><td>vers l'avant / vers l'arrière</td><td>le sternum est antérieur au cœur</td></tr>
<tr><td>Médial / latéral</td><td>plus près / plus loin du plan sagittal médian</td><td>le sternum est médial par rapport aux poumons</td></tr>
<tr><td>Proximal / distal</td><td>plus près / plus loin de la racine du membre</td><td>le coude est proximal par rapport au poignet</td></tr>
<tr><td>Superficiel / profond</td><td>plus près / plus loin de la surface du corps</td><td>la peau est superficielle par rapport aux muscles</td></tr>
<tr><td>Interne / externe</td><td>à l'intérieur / à l'extérieur d'une cavité ou d'un organe creux</td><td>la paroi interne de l'estomac</td></tr>
<tr><td>Homolatéral (ipsilatéral) / controlatéral</td><td>du même côté / du côté opposé</td><td>une lésion cérébrale gauche paralyse le côté droit : la paralysie est controlatérale</td></tr>
</table></div>
<p>Pour la main, on parle de face <strong>palmaire</strong> (la paume, antérieure en position anatomique) et de face <strong>dorsale</strong> ; pour le pied, de face <strong>plantaire</strong> et de face <strong>dorsale</strong> (le dessus du pied).</p>
<div class="piege"><b>Piège de concours</b>Dans l'ancienne nomenclature française, « interne » et « externe » voulaient dire « médial » et « latéral ». Aujourd'hui, interne / externe sont réservés aux cavités et aux organes creux.</div>

<h2>4. Les mouvements</h2>
<div class="defile"><table>
<tr><th>Mouvement</th><th>Plan</th><th>Définition</th></tr>
<tr><td><b>Flexion / extension</b></td><td>sagittal (autour d'un axe transversal)</td><td>la flexion plie l'articulation et rapproche en général les segments par l'avant ; l'extension la déplie</td></tr>
<tr><td><b>Abduction / adduction</b></td><td>frontal (autour d'un axe sagittal)</td><td>l'abduction <strong>éloigne</strong> le membre du plan médian ; l'adduction l'en <strong>rapproche</strong></td></tr>
<tr><td><b>Rotation médiale / latérale</b></td><td>transversal (autour d'un axe vertical)</td><td>le segment tourne sur son propre axe, vers l'intérieur ou l'extérieur</td></tr>
<tr><td><b>Circumduction</b></td><td>plusieurs plans</td><td>enchaînement flexion, abduction, extension, adduction : le membre décrit un cône (épaule, hanche)</td></tr>
</table></div>
<p>Des mouvements propres à certaines articulations :</p>
<ul>
<li><strong>pronation / supination</strong> de l'avant-bras : en pronation, la paume regarde en arrière (ou vers le bas, coude fléchi) ; en supination, elle regarde en avant (position anatomique) ;</li>
<li><strong>flexion dorsale / flexion plantaire</strong> de la cheville : la flexion dorsale rapproche le dos du pied de la jambe ; la flexion plantaire pointe le pied (se mettre sur la pointe des pieds) ;</li>
<li><strong>inversion / éversion</strong> du pied : la plante se tourne vers le dedans / vers le dehors ;</li>
<li><strong>opposition</strong> du pouce : la pulpe du pouce vient au contact de celle des autres doigts.</li>
</ul>

<h2>5. Les grandes régions et les cavités</h2>
<p>Le corps se divise en tête, cou, tronc (thorax, abdomen, pelvis) et membres. Le tronc contient deux grandes cavités séparées par le <strong>diaphragme</strong> :</p>
<ul>
<li>la <strong>cavité thoracique</strong>, avec les deux cavités pleurales (les poumons) et, entre elles, le <strong>médiastin</strong>, qui contient le cœur, l'œsophage, la trachée et les gros vaisseaux ;</li>
<li>la <strong>cavité abdomino-pelvienne</strong>, où l'abdomen se prolonge sans séparation par la cavité pelvienne (vessie, rectum, organes génitaux internes).</li>
</ul>
<h3>Les neuf régions de l'abdomen</h3>
<p>Deux lignes verticales et deux lignes horizontales découpent la paroi abdominale en neuf régions, très utilisées pour décrire une douleur :</p>
<div class="defile"><table>
<tr><td>hypochondre droit<br><span class="note">(foie, vésicule biliaire)</span></td><td>épigastre<br><span class="note">(estomac)</span></td><td>hypochondre gauche<br><span class="note">(rate)</span></td></tr>
<tr><td>flanc droit</td><td>région ombilicale</td><td>flanc gauche</td></tr>
<tr><td>fosse iliaque droite<br><span class="note">(appendice : douleur de l'appendicite)</span></td><td>hypogastre<br><span class="note">(vessie)</span></td><td>fosse iliaque gauche</td></tr>
</table></div>
<p class="note">Rappel : la droite est celle du patient. Sur le tableau, vu de face, l'hypochondre droit est donc à gauche.</p>

<h2>6. La nomenclature</h2>
<p>La référence internationale est la <strong>Terminologia Anatomica</strong> (1998). La nomenclature française s'y est alignée, et plusieurs noms ont changé : péroné → <strong>fibula</strong>, rotule → <strong>patella</strong>, omoplate → <strong>scapula</strong>, cubitus → <strong>ulna</strong>, astragale → <strong>talus</strong>. Les anciens noms restent courants à l'hôpital ; au concours, on attend les nouveaux.</p>

<div class="cle"><b>Bilan</b>Une position de référence (paumes en avant), trois plans (sagittal, frontal, transversal) et leurs axes, des couples de termes de direction (supérieur / inférieur, antérieur / postérieur, médial / latéral, proximal / distal, superficiel / profond) et des couples de mouvements (flexion / extension, abduction / adduction, rotations, pronation / supination).</div>

/* Barème à discordances, le plus répandu en première année :
   0 erreur sur les 5 propositions = 1 ; 1 = 0,5 ; 2 = 0,2 ; 3 et plus = 0. */
function noteQ(sel, props) {
  var d = 0;
  props.forEach(function (p, i) { if ((sel.indexOf(i) >= 0) !== !!p.v) d++; });
  return d === 0 ? 1 : d === 1 ? 0.5 : d === 2 ? 0.2 : 0;
}

function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function parse(s) { var a = s.split("-"); return new Date(+a[0], +a[1] - 1, +a[2]); }
function plus(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
function ecart(a, b) { return Math.round((Date.UTC.apply(null, ymd(b)) - Date.UTC.apply(null, ymd(a))) / 864e5); }
function ymd(s) { var a = s.split("-"); return [+a[0], +a[1] - 1, +a[2]]; }

function etatSeance(id, i) {
  var b = bloc(id), s = b.seances[i];

  var out = '<p class="sur">Les cours</p><h1>Quinze fiches d\'initiation</h1><p class="lead">Chaque chapitre est une fiche complète : rien à recopier ni à refaire. Une fiche s\'ouvre quand sa méthode arrive. Niveau : début de première année, sans prérequis au-delà de la Terminale.</p>';
  METHODES.forEach(function (m) {
    out += "<h2 style=\"color:" + m.c + "\">" + m.id + " · " + h(m.nom) + "</h2>";
    Object.keys(MATIERES).forEach(function (k) {
      var c = PLAN[m.id][k];
      out += '<a class="lien-carte" href="#c/' + c + '"><div class="carte"><p class="sur">' + MATIERES[k].nom + "</p><b>" + h(CHAPITRES[c].titre) + "</b>" + (CHAPITRES[c].html ? "" : ' <span class="etat saute">en préparation</span>') + "</div></a>";
    });
  });
  return out;
}

function vueChapitre(id) {
  var c = CHAPITRES[id]; if (!c) return vueCours();
  var m = METHODES.filter(function (x) { return Object.keys(PLAN[x.id]).some(function (k) { return PLAN[x.id][k] === id; }); })[0];
  var out = '<p class="sur"><a href="#cours">Cours</a> · ' + MATIERES[c.mat].nom + '</p><h1>' + h(c.titre) + '</h1><p>' + tag(m) + "</p>";
  if (!c.html) return out + '<div class="placeholder"><p><strong>En préparation.</strong></p><p>Ce chapitre sera en ligne avant le début de la méthode ' + m.id.slice(1) + ".</p></div>";
  out += '<div class="interdit" style="background:color-mix(in srgb,' + m.c + ' 12%,transparent)"><b style="color:' + m.c + '">Avec cette méthode :</b> ' + h(m.app.map(function (e) { return e[0]; }).join(" ")) + "</div>";
  return out + '<article class="cours">' + c.html + "</article>";
}

/* ---------- QCM ---------- */
var RUN = null; /* { id, type, i, rep: [{sel:[], conf:""}], debut } */
function vueQCM(id, type) {
  var m = methode(id), b = bloc(id), liste = QCM[id] && QCM[id][type];
  var nom = type === "cloture" ? "QCM de clôture" : "QCM de rappel tardif";
  var out = '<p class="sur"><a href="#m/' + id + '">' + h(m.nom) + "</a></p><h1>" + nom + "</h1>";
  if (!liste) return out + '<div class="placeholder">Ce QCM sera en ligne avec les cours de la méthode.</div>';
  if (b.qcm[type]) return out + correction(id, type);
  if (!b.j0) return out + '<p>Lance d\'abord la méthode depuis <a href="#">Aujourd\'hui</a>.</p>';
  if (type === "retard" && !b.qcm.cloture) return out + "<p>Le rappel tardif vient après le QCM de clôture.</p>";
  var jour = type === "cloture" ? J_CLOTURE : J_RETARD, dprev = plus(b.j0, jour);
  if (!RUN || RUN.id !== id || RUN.type !== type) {
    var avert = auj() < dprev ? '<div class="interdit"><b>Trop tôt.</b> Ce QCM est prévu le ' + h(joli(dprev)) + " (J" + jour + "). Le passer avant fausse la mesure du délai.</div>" : "";
    return out + avert + '<div class="carte"><p><strong>' + liste.length + " questions</strong>, environ " + Math.round(liste.length * 1.5) + " minutes. Sans document, d'une traite.</p><ul><li>Chaque question a de 1 à 5 propositions justes.</li><li>Barème : 0 erreur = 1 point, 1 erreur = 0,5, 2 erreurs = 0,2, 3 et plus = 0.</li><li>Pour chaque question, indique si tu es <strong>sûr</strong>, <strong>hésitant</strong> ou si tu réponds <strong>au hasard</strong>.</li><li>Le QCM ne se repasse pas : c'est une mesure.</li></ul><button class=\"btn\" id=\"qgo\">Commencer</button></div>";
  }
  var i = RUN.i, q = liste[i], r = RUN.rep[i];
  out += '<div class="rangee note"><span>Question ' + (i + 1) + " / " + liste.length + "</span><span class=\"espace\"></span><span>" + MATIERES[CHAPITRES[q.ch].mat].court + '</span></div><div class="barre-prog"><i style="width:' + (100 * i / liste.length) + '%"></i></div>';
  out += '<p class="q-enonce">' + h(q.q) + "</p>";
  q.p.forEach(function (p, k) { out += '<button class="prop' + (r.sel.indexOf(k) >= 0 ? " sel" : "") + '" data-k="' + k + '"><span class="lettre">' + "ABCDE"[k] + "</span><span>" + h(p.t) + "</span></button>"; });
  out += '<div class="conf">' + [["s", "Sûr"], ["h", "Hésitant"], ["x", "Au hasard"]].map(function (c) { return '<button data-c="' + c[0] + '" class="' + (r.conf === c[0] ? "on" : "") + '">' + c[1] + "</button>"; }).join("") + "</div>";
  out += '<div class="rangee" style="margin-top:14px">' + (i > 0 ? '<button class="btn sec" id="qprev">Précédente</button>' : "") + '<span class="espace"></span><button class="btn" id="qnext"' + (!r.sel.length || !r.conf ? " disabled" : "") + ">" + (i === liste.length - 1 ? "Rendre la copie" : "Suivante") + "</button></div>";
  if (!r.sel.length || !r.conf) out += '<p class="note">Coche au moins une proposition et indique ta confiance.</p>';
  return out;
}
function correction(id, type) {
  var res = bloc(id).qcm[type], liste = QCM[id][type], out = "";
  out += '<div class="carte"><p class="sur">Fait le ' + h(joli(res.date)) + " · " + fmt(res.duree) + '</p><div class="score">' + num(res.points) + " / " + liste.length + '</div><p>Soit <strong>' + Math.round(100 * res.points / liste.length) + " %</strong>.</p></div>";
  liste.forEach(function (q, i) {
    var r = res.rep[i], pts = noteQ(r.sel, q.p);
    out += '<div class="carte"><div class="rangee note"><span>Question ' + (i + 1) + "</span><span class=\"espace\"></span><span>" + ({ s: "sûr", h: "hésitant", x: "au hasard" }[r.conf] || "") + " · " + num(pts) + ' pt</span></div><p class="q-enonce">' + h(q.q) + "</p>";
    q.p.forEach(function (p, k) {
      var coche = r.sel.indexOf(k) >= 0, cl = p.v ? (coche ? "vrai" : "oubli") : (coche ? "faux-coche" : "");
      out += '<div class="prop ' + cl + '" style="cursor:default"><span class="lettre">' + "ABCDE"[k] + '</span><span>' + h(p.t) + ' <b>' + (p.v ? "Vrai" : "Faux") + "</b>" + (p.e ? '<div class="expl">' + h(p.e) + "</div>" : "") + "</span></div>";
    });
    out += "</div>";
  });
  return out;
}
function num(x) { return (Math.round(x * 100) / 100).toString().replace(".", ","); }

/* ---------- résultats ---------- */
function stats(id) {
  var b = bloc(id), q = QCM[id], o = { min: minutesBloc(id) };
  ["cloture", "retard"].forEach(function (t) {
    if (!b.qcm[t] || !q) return;
    var liste = q[t], res = b.qcm[t], parMat = {};
    var sur = 0, surJ = 0;
    liste.forEach(function (x, i) {
      var pts = noteQ(res.rep[i].sel, x.p), mat = CHAPITRES[x.ch].mat;
      parMat[mat] = parMat[mat] || [0, 0]; parMat[mat][0] += pts; parMat[mat][1]++;
      if (res.rep[i].conf === "s") { sur++; if (pts === 1) surJ++; }
    });
    o[t] = { pct: 100 * res.points / liste.length, parMat: parMat, fiab: sur ? 100 * surJ / sur : null, sur: sur };
  });
  if (o.cloture && o.min) o.pph = (o.cloture.pct / 100 * QCM[id].cloture.length) / (o.min / 60);
  return o;
}
function vueResultats() {
  var out = '<p class="sur">Le bilan</p><h1>Quelle méthode marche pour Orhan ?</h1>';
  var faites = METHODES.filter(function (m) { return clotureFaite(m.id); });
  if (!faites.length) return out + '<div class="placeholder"><p>Les résultats apparaissent après le premier QCM de clôture.</p><p class="note">Pense à importer ton journal si tu viens d\'ouvrir le site.</p></div>';
  function barres(titre, f, unite, max, dec) {
    var r = '<div class="carte"><h3>' + titre + "</h3>";
    METHODES.forEach(function (m) {
      var v = f(m); if (v === null || v === undefined) return;
      r += '<div class="ligne-res" style="--c:' + m.c + '"><span><b style="color:' + m.c + '">' + m.id + "</b> " + h(m.nom.split(" ")[0]) + '</span><div class="barre"><i style="width:' + Math.min(100, 100 * v / max) + '%"></i></div><b>' + (dec ? num(Math.round(v * 10) / 10) : Math.round(v)) + unite + "</b></div>";
    });
    return r + "</div>";
  }
  var st = {}; METHODES.forEach(function (m) { st[m.id] = stats(m.id); });
  out += barres("Ce qui est appris · QCM de clôture (J14)", function (m) { return st[m.id].cloture ? st[m.id].cloture.pct : null; }, " %", 100);
  out += barres("Ce qui reste · rappel tardif (J28)", function (m) { return st[m.id].retard ? st[m.id].retard.pct : null; }, " %", 100);
  var maxp = 0; METHODES.forEach(function (m) { if (st[m.id].pph > maxp) maxp = st[m.id].pph; });
  out += barres("Rendement · points par heure de travail", function (m) { return st[m.id].pph ? st[m.id].pph : null; }, "", maxp || 1, 1);
  out += barres("Fiabilité du « sûr » · justes quand sûr", function (m) { return st[m.id].cloture && st[m.id].cloture.fiab !== null ? st[m.id].cloture.fiab : null; }, " %", 100);
  out += '<div class="carte"><h3>Détail par matière (clôture)</h3><div class="defile"><table><tr><th>Méthode</th>' + Object.keys(MATIERES).map(function (k) { return "<th>" + MATIERES[k].court + "</th>"; }).join("") + "<th>Temps</th><th>Ressenti</th></tr>" +
    faites.map(function (m) {
      var s = st[m.id], r = bloc(m.id).ressenti;
      return '<tr><td><b style="color:' + m.c + '">' + m.id + "</b></td>" + Object.keys(MATIERES).map(function (k) { var p = s.cloture && s.cloture.parMat[k]; return "<td>" + (p ? Math.round(100 * p[0] / p[1]) + " %" : "–") + "</td>"; }).join("") + "<td>" + Math.round(s.min / 6) / 10 + " h</td><td>" + (r.plaisir ? r.plaisir + "/5 · " + (r.tenable || "–") + "/5" : "–") + "</td></tr>";
    }).join("") + "</table></div></div>";
  if (faites.length >= 2) {
    var tri = faites.slice().sort(function (a, b) { return st[b.id].cloture.pct - st[a.id].cloture.pct; });
    var e = st[tri[0].id].cloture.pct - st[tri[1].id].cloture.pct;
    out += '<div class="carte"><h3>Lecture</h3><p>En tête au QCM de clôture : <b style="color:' + tri[0].c + '">' + h(tri[0].nom) + "</b>, avec " + Math.round(e) + " points d'avance sur la suivante.</p><p class=\"note\">" + (e < 12 ? "Écart inférieur à environ 12 points : avec ce nombre de questions, il peut venir du hasard. Regarder aussi le rappel tardif et le ressenti." : "Écart net : il dépasse ce que le hasard explique d'habitude avec ce nombre de questions.") + " Rappel : la dernière méthode profite de l'expérience accumulée.</p></div>";
  }
  return out;
}

/* ---------- journal ---------- */
function vueJournal() {
  var n = 0; METHODES.forEach(function (m) { n += Object.keys(bloc(m.id).seances).length + Object.keys(bloc(m.id).qcm).length; });
  return '<p class="sur">Le journal</p><h1>Enregistrer et reprendre</h1>' +
  '<p class="lead">Le site ne garde rien quand on le ferme. Les séances, les temps et les QCM vivent dans un petit fichier que tu télécharges après chaque séance et que tu réimportes la fois suivante.</p>' +
  '<div class="carte"><h3>1. Reprendre</h3><p>Au début de chaque séance, importe le <strong>dernier</strong> fichier enregistré (le plus récent dans Téléchargements).</p><label class="btn sec"><input type="file" id="imp" accept="application/json,.json" hidden>Importer le journal</label></div>' +
  '<div class="carte"><h3>2. Enregistrer</h3><p>À la fin de chaque séance ou de chaque QCM.</p><button class="btn" id="exp">Télécharger le journal</button> <p class="note">' + n + " élément(s) enregistré(s) dans le journal en cours." + (SALE ? " <b style=\"color:var(--alerte)\">Des changements ne sont pas encore enregistrés.</b>" : "") + "</p></div>" +
  '<details><summary>Sauvegarde de secours : copier le texte</summary><p class="note">Si le téléchargement ne marche pas, copie ce texte dans une note ou un mail à toi-même. Pour le recharger, colle-le ici puis « Charger ».</p><textarea id="txt" rows="5">' + h(JSON.stringify(S)) + '</textarea><div class="rangee"><button class="btn sec petit" id="copier">Copier</button><button class="btn sec petit" id="coller">Charger ce texte</button></div></details>';
}
function charger(txt) {
  var d = JSON.parse(txt);
  if (!d || !d.blocs) throw new Error("format");
  METHODES.forEach(function (m) { var b = d.blocs[m.id] || {}; S.blocs[m.id] = { j0: b.j0 || null, seances: b.seances || {}, qcm: b.qcm || {}, ressenti: b.ressenti || {} }; });
  SALE = false; document.getElementById("sale").hidden = true;
}
function exporter() {
  var blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
  var a = document.createElement("a"), d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = "journal-sante-" + iso(d) + "-" + String(d.getHours()).padStart(2, "0") + "h" + String(d.getMinutes()).padStart(2, "0") + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  SALE = false; document.getElementById("sale").hidden = true;
}

/* ============================================================
   ROUTEUR ET ÉVÉNEMENTS
   ============================================================ */
function route() {
  var r = location.hash.replace(/^#\/?/, "").split("/"), v = r[0] || "accueil", html;
  if (v === "methodes") html = vueMethodes();
  else if (v === "protocole") html = vueProtocole();
  else if (v === "m") html = vueMethode(r[1], r[2] !== undefined ? +r[2] : undefined);
  else if (v === "cours") html = vueCours();
  else if (v === "c") html = vueChapitre(r[1]);
  else if (v === "qcm") html = vueQCM(r[1], r[2]);
  else if (v === "resultats") html = vueResultats();
  else if (v === "journal") html = vueJournal();
  else { v = "accueil"; html = vueAccueil(); }
  app.innerHTML = html;
  var onglet = { accueil: "accueil", methodes: "methodes", protocole: "methodes", m: "methodes", qcm: "methodes", cours: "cours", c: "cours", resultats: "resultats", journal: "journal" }[v];
  document.querySelectorAll("nav.bas a").forEach(function (a) { a.classList.toggle("on", a.dataset.r === onglet); });
  lier(v, r);
}
function rendre() { var y = window.scrollY; route(); window.scrollTo(0, y); }

function lier(v, r) {
  var $ = function (id) { return document.getElementById(id); };
  if (v === "accueil" && $("go")) $("go").onclick = function () {
    var m = blocCourant(), d = $("j0").value; if (!d) return;
    bloc(m.id).j0 = d; marquer(); rendre();
  };
  if (v === "m") {
    var id = r[1], i = +r[2];
    if ($("j0maj")) $("j0maj").onclick = function () { if ($("j0b").value) { bloc(id).j0 = $("j0b").value; marquer(); rendre(); } };
    if (r[2] !== undefined) {
      var el = $("s" + i); if (el) setTimeout(function () { el.scrollIntoView({ block: "start", behavior: "smooth" }); }, 30);
      if ($("start")) $("start").onclick = function () { CHR = { id: id, i: i, debut: Date.now() }; rendre(); };
      if ($("stop")) $("stop").onclick = function () {
        var min = Math.max(1, Math.round(tempsChr() / 60)); CHR = null;
        enregistrerSeance(id, i, min, "faite"); toast("Séance enregistrée : " + min + " min. Pense au journal."); location.hash = "#m/" + id;
      };
      if ($("faite")) $("faite").onclick = function () { enregistrerSeance(id, i, Math.max(0, +$("mins").value || 0), "faite"); toast("Séance enregistrée."); location.hash = "#m/" + id; };
      if ($("sautee")) $("sautee").onclick = function () { enregistrerSeance(id, i, 0, "sautee"); location.hash = "#m/" + id; };
    }
    document.querySelectorAll(".etoiles button").forEach(function (b) { b.onclick = function () { bloc(id).ressenti[b.dataset.r] = +b.dataset.v; marquer(); rendre(); }; });
    if ($("remarque")) $("remarque").oninput = function () { bloc(id).ressenti.remarque = this.value; marquer(); };
  }
  if (v === "qcm") {
    var qid = r[1], type = r[2], liste = QCM[qid] && QCM[qid][type];
    if ($("qgo")) $("qgo").onclick = function () { RUN = { id: qid, type: type, i: 0, debut: Date.now(), rep: liste.map(function () { return { sel: [], conf: "" }; }) }; rendre(); };
    if (RUN && RUN.id === qid && RUN.type === type) {
      var rep = RUN.rep[RUN.i];
      document.querySelectorAll(".prop[data-k]").forEach(function (b) { b.onclick = function () { var k = +b.dataset.k, p = rep.sel.indexOf(k); if (p >= 0) rep.sel.splice(p, 1); else rep.sel.push(k); rendre(); }; });
      document.querySelectorAll(".conf button").forEach(function (b) { b.onclick = function () { rep.conf = b.dataset.c; rendre(); }; });
      if ($("qprev")) $("qprev").onclick = function () { RUN.i--; route(); window.scrollTo(0, 0); };
      if ($("qnext")) $("qnext").onclick = function () {
        if (RUN.i < liste.length - 1) { RUN.i++; route(); window.scrollTo(0, 0); return; }
        var pts = 0; liste.forEach(function (q, k) { pts += noteQ(RUN.rep[k].sel, q.p); });
        bloc(qid).qcm[type] = { date: auj(), duree: Math.round((Date.now() - RUN.debut) / 1000), points: Math.round(pts * 100) / 100, rep: RUN.rep.map(function (x) { return { sel: x.sel.slice().sort(), conf: x.conf }; }) };
        RUN = null; marquer(); route(); window.scrollTo(0, 0); toast("Copie rendue. Enregistre le journal.");
      };
    }
  }
  if (v === "journal") {
    $("exp").onclick = function () { exporter(); rendre(); toast("Journal téléchargé."); };
    $("imp").onchange = function () {
      var f = this.files[0]; if (!f) return;
      var lec = new FileReader();
      lec.onload = function () { try { charger(lec.result); toast("Journal chargé."); location.hash = "#"; } catch (e) { toast("Ce fichier n'est pas un journal valide."); } };
      lec.readAsText(f);
    };
    $("copier").onclick = function () { var t = $("txt"); t.select(); try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand("copy"); } toast("Copié."); };
    $("coller").onclick = function () { try { charger($("txt").value); toast("Journal chargé."); location.hash = "#"; } catch (e) { toast("Texte illisible."); } };
  }
}

window.addEventListener("hashchange", function () { route(); window.scrollTo(0, 0); });
window.addEventListener("beforeunload", function (e) { if (SALE) { e.preventDefault(); e.returnValue = ""; } });
document.getElementById("theme").onclick = function () {
  var r = document.documentElement, sombre = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = sombre ? "light" : "dark";
};
route();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
