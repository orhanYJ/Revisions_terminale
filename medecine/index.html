<text x="6" y="100" fill="var(--m4)">cartilage de</text><text x="6" y="114" fill="var(--m4)">conjugaison</text>
<text x="44" y="194">diaphyse</text>
<text x="230" y="146">cavité médullaire</text><text x="230" y="160" fill="var(--doux)">(moelle jaune)</text>
<text x="230" y="194">os compact</text>
<text x="230" y="234" fill="var(--m3)">périoste</text>
<text x="234" y="304">épiphyse</text></g>
</svg><figcaption>Coupe d'un os long d'enfant. Chez l'adulte, le cartilage de conjugaison est remplacé par de l'os.</figcaption></figure>
<ul>
<li>La <strong>diaphyse</strong> est le corps de l'os : un tube d'<strong>os compact</strong> autour de la <strong>cavité médullaire</strong>, qui contient de la moelle jaune (graisse) chez l'adulte.</li>
<li>Les <strong>épiphyses</strong> sont les extrémités, faites d'<strong>os spongieux</strong> (des travées dont les espaces contiennent de la moelle rouge) sous une fine coque compacte. Les surfaces articulaires sont couvertes de <strong>cartilage articulaire</strong>.</li>
<li>Les <strong>métaphyses</strong> font la jonction. Chez l'enfant, elles portent le <strong>cartilage de conjugaison</strong> (ou de croissance), qui fait grandir l'os en longueur et disparaît en fin de puberté.</li>
<li>Le <strong>périoste</strong> est la membrane fibreuse qui enveloppe l'os, <strong>sauf</strong> les surfaces articulaires. Il est vascularisé et innervé (c'est lui qui fait mal dans une fracture), fait croître l'os en épaisseur et répare les fractures. L'<strong>endoste</strong> tapisse la cavité médullaire.</li>
<li>Une <strong>artère nourricière</strong> pénètre dans la diaphyse par le trou nourricier.</li>
</ul>
<div class="cle"><b>Idée et exemple</b>Chez l'enfant, une fracture qui passe par le cartilage de conjugaison peut perturber la croissance de l'os : c'est pourquoi les fractures de l'enfant sont classées selon leur rapport avec ce cartilage.</div>

<h2>4. Le tissu osseux</h2>
<p>L'os est un tissu vivant, sans cesse détruit et reconstruit (<strong>remodelage</strong>).</p>
<ul>
<li>Les <strong>ostéoblastes</strong> fabriquent la matrice osseuse.</li>
<li>Les <strong>ostéocytes</strong> sont d'anciens ostéoblastes emmurés dans la matrice qu'ils ont produite, logés dans de petites cavités.</li>
<li>Les <strong>ostéoclastes</strong> détruisent (résorbent) l'os : ce sont de grandes cellules à plusieurs noyaux, issues de la lignée des monocytes.</li>
</ul>
<p>La matrice associe environ <strong>deux tiers de minéral</strong>, des cristaux d'<strong>hydroxyapatite</strong> (phosphate de calcium) qui donnent la dureté, et <strong>un tiers de matière organique</strong>, surtout du <strong>collagène de type I</strong>, qui donne la souplesse.</p>
<p>Dans l'os compact, la matrice s'organise en <strong>ostéons</strong> (systèmes de Havers) : des lamelles concentriques autour d'un <strong>canal de Havers</strong> qui contient vaisseaux et nerfs, parallèle à l'axe de l'os. Des <strong>canaux de Volkmann</strong>, transversaux, relient ces canaux entre eux. L'os spongieux, lui, n'a pas d'ostéons.</p>
<p>Deux modes de formation : l'<strong>ossification endochondrale</strong> remplace une maquette de cartilage (la plupart des os, dont les os longs) ; l'<strong>ossification membranaire</strong> se fait directement dans un tissu conjonctif (os plats de la voûte du crâne).</p>

<h2>5. Les reliefs osseux : le vocabulaire</h2>
<div class="defile"><table>
<tr><th>Terme</th><th>Sens</th></tr>
<tr><td>Tête, condyle</td><td>extrémité ou surface <strong>articulaire</strong> arrondie</td></tr>
<tr><td>Épicondyle</td><td>saillie située au-dessus d'un condyle (insertions musculaires)</td></tr>
<tr><td>Tubercule, tubérosité</td><td>saillie, petite ou grosse et rugueuse, où s'insère un tendon ou un ligament</td></tr>
<tr><td>Processus, épine, crête</td><td>saillie allongée, pointue, en arête</td></tr>
<tr><td>Fosse, sillon, incisure</td><td>creux, gouttière, échancrure</td></tr>
<tr><td>Foramen, canal, méat</td><td>orifice, conduit dans l'os</td></tr>
<tr><td>Facette</td><td>petite surface articulaire plane</td></tr>
</table></div>
<p>Rappel : un <strong>tendon</strong> relie un muscle à un os ; un <strong>ligament</strong> relie deux os.</p>

<h2>6. Les articulations</h2>
<p>Une articulation unit deux os ou plus. On les classe selon leur mobilité et le tissu qui unit les os.</p>
<div class="defile"><table>
<tr><th>Classe</th><th>Mobilité</th><th>Tissu d'union</th><th>Exemples</th></tr>
<tr><td><b>Synarthroses</b></td><td>nulle ou presque</td><td>fibreux</td><td>sutures du crâne, dent dans son alvéole</td></tr>
<tr><td><b>Amphiarthroses</b></td><td>faible</td><td>cartilage (souvent fibrocartilage)</td><td><strong>symphyse pubienne</strong>, disques intervertébraux</td></tr>
<tr><td><b>Diarthroses</b> (synoviales)</td><td>grande</td><td>capsule et cavité articulaire</td><td>épaule, coude, hanche, genou, doigts</td></tr>
</table></div>

<h3>Anatomie d'une diarthrose</h3>
<ul>
<li>des <strong>surfaces articulaires</strong> recouvertes de <strong>cartilage hyalin</strong>, lisse, <strong>sans vaisseaux ni nerfs</strong>, nourri par la synovie ;</li>
<li>une <strong>capsule articulaire</strong>, manchon fibreux qui entoure l'articulation, doublée à l'intérieur par la <strong>membrane synoviale</strong>, qui sécrète la <strong>synovie</strong> (liquide visqueux lubrifiant) ;</li>
<li>des <strong>ligaments</strong> qui renforcent l'ensemble ;</li>
<li>parfois des <strong>fibrocartilages</strong> qui améliorent l'emboîtement : les <strong>ménisques</strong> du genou, le labrum (bourrelet) de la hanche et de l'épaule.</li>
</ul>

<h3>Les types de diarthroses selon la forme des surfaces</h3>
<div class="defile"><table>
<tr><th>Type</th><th>Surfaces</th><th>Axes de mouvement</th><th>Exemple</th></tr>
<tr><td><b>Sphéroïde</b> (énarthrose)</td><td>une tête sphérique dans une cavité</td><td>3</td><td>épaule (gléno-humérale), hanche (coxo-fémorale)</td></tr>
<tr><td><b>Ellipsoïde</b></td><td>surfaces ovales</td><td>2</td><td>poignet (radio-carpienne)</td></tr>
<tr><td><b>En selle</b></td><td>deux selles de cheval emboîtées</td><td>2</td><td>trapézo-métacarpienne (base du pouce)</td></tr>
<tr><td><b>Bicondylaire</b></td><td>deux condyles sur une surface plane</td><td>2</td><td>genou (fémoro-tibiale)</td></tr>
<tr><td><b>Trochléenne</b> (charnière, ginglyme)</td><td>une poulie et une crête</td><td>1 (flexion-extension)</td><td>coude (huméro-ulnaire), interphalangiennes</td></tr>
<tr><td><b>Trochoïde</b> (pivot)</td><td>un cylindre dans un anneau</td><td>1 (rotation)</td><td>radio-ulnaire proximale (pronation-supination), atlas sur la dent de l'axis</td></tr>
<tr><td><b>Plane</b> (arthrodie)</td><td>surfaces planes</td><td>glissements</td><td>entre les os du carpe</td></tr>
</table></div>
<div class="cle"><b>Idée et exemple : mobilité contre stabilité</b>Plus une articulation est mobile, moins elle est stable. L'épaule et la hanche sont toutes deux sphéroïdes, mais la cavité de l'épaule est plate et peu profonde, alors que celle de la hanche (l'acétabulum) enveloppe profondément la tête du fémur. Résultat : l'épaule est l'articulation la plus mobile du corps et la plus souvent luxée ; la hanche, très stable, se luxe rarement, et presque seulement lors de traumatismes violents.</div>

<div class="cle"><b>Bilan</b>206 os, classés par forme (long, court, plat, irrégulier, sésamoïde, pneumatisé). L'os long : diaphyse compacte et creuse, épiphyses spongieuses, cartilage de conjugaison chez l'enfant, périoste partout sauf sur le cartilage articulaire. Trois classes d'articulations (synarthroses, amphiarthroses, diarthroses) ; les diarthroses se classent par la forme de leurs surfaces, qui fixe le nombre d'axes de mouvement.</div>

    return out + boites + '<div class="carte"><div class="score">' + CR.su + " / " + CR.ids.length + '</div><p>cartes sues du premier coup.</p><div class="rangee">' + (CR.ratees.length ? '<button class="btn" id="cratees">Reprendre les ' + CR.ratees.length + " ratées</button>" : "") + '<a class="btn sec" href="#m/M5">Retour à la méthode</a></div></div>';
  }

  out += '<div class="flash' + (CR.montre ? " retournee" : "") + '"><p class="sur">Question</p><p class="f-q">' + h(x[0]) + "</p>" + (CR.montre ? '<hr><p class="sur">Réponse</p><p class="f-r">' + h(x[1]) + "</p>" : "") + "</div>";
  out += CR.montre ? '<div class="rangee duo"><button class="btn danger" id="cnon">Pas su</button><button class="btn" id="coui">Je savais</button></div>' : '<div class="rangee duo"><button class="btn" id="cvoir">Voir la réponse</button></div>';
  return out;
}

/* ---------- QCM de mesure ---------- */
var RUN = null; /* { id, type, i, rep: [{sel:[], conf:""}], debut } */
function vueQCM(id, type) {
  var m = methode(id), b = bloc(id), liste = QCM[id] && QCM[id][type];
  var nom = type === "cloture" ? "QCM de clôture" : "QCM de rappel tardif";
  var out = '<p class="sur"><a href="#m/' + id + '">' + h(m.nom) + "</a></p><h1>" + nom + "</h1>";
  if (!liste) return out + '<div class="placeholder">Ce QCM sera en ligne avec les fiches de la méthode.</div>';
  if (b.qcm[type]) return out + correction(id, type);
  if (!b.j0) return out + '<p>Lance d\'abord la méthode depuis <a href="#">Aujourd\'hui</a>.</p>';
  if (type === "retard" && !b.qcm.cloture) return out + "<p>Le rappel tardif vient après le QCM de clôture.</p>";
  var jour = type === "cloture" ? J_CLOTURE : J_RETARD, dprev = plus(b.j0, jour);
  if (!RUN || RUN.id !== id || RUN.type !== type) {
    var avert = auj() < dprev ? '<div class="interdit"><b>Trop tôt.</b> Ce QCM est prévu le ' + h(joli(dprev)) + " (J" + jour + "). Le passer avant fausse la mesure du délai.</div>" : "";
    return out + avert + '<div class="carte"><p><strong>' + liste.length + " questions</strong>, environ " + Math.round(liste.length * 1.5) + " minutes. Sans document, d'une traite.</p><ul><li>Chaque question a de 1 à 5 propositions justes.</li><li>Barème : 0 erreur = 1 point, 1 erreur = 0,5, 2 erreurs = 0,2, 3 et plus = 0.</li><li>Pour chaque question, indique si tu es <strong>sûr</strong>, <strong>hésitant</strong> ou si tu réponds <strong>au hasard</strong>.</li><li>Le QCM ne se repasse pas : c'est une mesure.</li></ul><button class=\"btn\" id=\"qgo\">Commencer</button></div>";
  }
  var i = RUN.i, q = liste[i], r = RUN.rep[i];
  out += '<div class="rangee note"><span>Question ' + (i + 1) + " / " + liste.length + "</span><span class=\"espace\"></span><span>" + MATIERES[CHAPITRES[q.ch].mat].court + '</span></div><div class="barre-prog"><i style="width:' + (100 * i / liste.length) + '%"></i></div>';
  out += '<p class="q-enonce">' + h(q.q) + "</p>";
  q.p.forEach(function (p, k) { out += '<button class="prop' + (r.sel.indexOf(k) >= 0 ? " sel" : "") + '" data-k="' + k + '"><span class="lettre">' + "ABCDE"[k] + "</span><span>" + h(p.t) + "</span></button>"; });
  out += '<div class="conf">' + [["s", "Sûr"], ["h", "Hésitant"], ["x", "Au hasard"]].map(function (c) { return '<button data-c="' + c[0] + '" class="' + (r.conf === c[0] ? "on" : "") + '">' + c[1] + "</button>"; }).join("") + "</div>";
  out += '<div class="rangee" style="margin-top:14px">' + (i > 0 ? '<button class="btn sec" id="qprev">Précédente</button>' : "") + '<span class="espace"></span><button class="btn" id="qnext"' + (!r.sel.length || !r.conf ? " disabled" : "") + ">" + (i === liste.length - 1 ? "Rendre la copie" : "Suivante") + "</button></div>";
  if (!r.sel.length || !r.conf) out += '<p class="note">Coche au moins une proposition et indique ta confiance.</p>';
  return out;
}
function correction(id, type) {
  var res = bloc(id).qcm[type], liste = QCM[id][type], out = "";
  out += '<div class="carte"><p class="sur">Fait le ' + h(joli(res.date)) + " · " + fmt(res.duree) + '</p><div class="score">' + num(res.points) + " / " + liste.length + '</div><p>Soit <strong>' + Math.round(100 * res.points / liste.length) + " %</strong>.</p></div>";
  liste.forEach(function (q, i) {
    var r = res.rep[i], pts = noteQ(r.sel, q.p);
    out += '<div class="carte"><div class="rangee note"><span>Question ' + (i + 1) + "</span><span class=\"espace\"></span><span>" + ({ s: "sûr", h: "hésitant", x: "au hasard" }[r.conf] || "") + " · " + num(pts) + ' pt</span></div><p class="q-enonce">' + h(q.q) + "</p>";
    q.p.forEach(function (p, k) {
      var coche = r.sel.indexOf(k) >= 0, cl = p.v ? (coche ? "vrai" : "oubli") : (coche ? "faux-coche" : "");
      out += '<div class="prop ' + cl + '" style="cursor:default"><span class="lettre">' + "ABCDE"[k] + '</span><span>' + h(p.t) + ' <b>' + (p.v ? "Vrai" : "Faux") + "</b>" + (p.e ? '<span class="expl">' + h(p.e) + "</span>" : "") + "</span></div>";
    });
    out += "</div>";
  });
  return out;
}
function num(x) { return (Math.round(x * 100) / 100).toString().replace(".", ","); }

/* ---------- résultats ---------- */
function stats(id) {
  var b = bloc(id), q = QCM[id], o = { min: minutesBloc(id) };
  ["cloture", "retard"].forEach(function (t) {
    if (!b.qcm[t] || !q) return;
    var liste = q[t], res = b.qcm[t], parMat = {};
    var sur = 0, surJ = 0;
    liste.forEach(function (x, i) {
      var pts = noteQ(res.rep[i].sel, x.p), mat = CHAPITRES[x.ch].mat;
      parMat[mat] = parMat[mat] || [0, 0]; parMat[mat][0] += pts; parMat[mat][1]++;
      if (res.rep[i].conf === "s") { sur++; if (pts === 1) surJ++; }
    });
    o[t] = { pct: 100 * res.points / liste.length, parMat: parMat, fiab: sur ? 100 * surJ / sur : null, sur: sur };
  });
  if (o.cloture && o.min) o.pph = (o.cloture.pct / 100 * QCM[id].cloture.length) / (o.min / 60);
  return o;
}
function vueResultats() {
  var out = '<p class="sur">Le bilan</p><h1>Quelle méthode marche pour Orhan ?</h1>';
  var faites = METHODES.filter(function (m) { return clotureFaite(m.id); });
  if (!faites.length) return out + '<div class="placeholder"><p>Les résultats apparaissent après le premier QCM de clôture.</p><p class="note">Pense à importer ton journal si tu viens d\'ouvrir le site.</p></div>';
  function barres(titre, f, unite, max, dec) {
    var r = '<div class="carte"><h3>' + titre + "</h3>";
    METHODES.forEach(function (m) {
      var v = f(m); if (v === null || v === undefined) return;
      r += '<div class="ligne-res" style="--c:' + m.c + '"><span><b style="color:' + m.c + '">' + m.id + "</b> " + h(m.nom.split(" ")[0]) + '</span><div class="barre"><i style="width:' + Math.min(100, 100 * v / max) + '%"></i></div><b>' + (dec ? num(Math.round(v * 10) / 10) : Math.round(v)) + unite + "</b></div>";
    });
    return r + "</div>";
  }
  var st = {}; METHODES.forEach(function (m) { st[m.id] = stats(m.id); });
  out += barres("Ce qui est appris · QCM de clôture (J14)", function (m) { return st[m.id].cloture ? st[m.id].cloture.pct : null; }, " %", 100);
  out += barres("Ce qui reste · rappel tardif (J28)", function (m) { return st[m.id].retard ? st[m.id].retard.pct : null; }, " %", 100);
  var maxp = 0; METHODES.forEach(function (m) { if (st[m.id].pph > maxp) maxp = st[m.id].pph; });
  out += barres("Rendement · points par heure de travail", function (m) { return st[m.id].pph ? st[m.id].pph : null; }, "", maxp || 1, 1);
  out += barres("Fiabilité du « sûr » · justes quand sûr", function (m) { return st[m.id].cloture && st[m.id].cloture.fiab !== null ? st[m.id].cloture.fiab : null; }, " %", 100);
  out += '<div class="carte"><h3>Détail par matière (clôture)</h3><div class="defile"><table><tr><th>Méthode</th>' + Object.keys(MATIERES).map(function (k) { return "<th>" + MATIERES[k].court + "</th>"; }).join("") + "<th>Temps</th><th>Ressenti</th></tr>" +
    faites.map(function (m) {
      var s = st[m.id], r = bloc(m.id).ressenti;
      return '<tr><td><b style="color:' + m.c + '">' + m.id + "</b></td>" + Object.keys(MATIERES).map(function (k) { var p = s.cloture && s.cloture.parMat[k]; return "<td>" + (p ? Math.round(100 * p[0] / p[1]) + " %" : "–") + "</td>"; }).join("") + "<td>" + Math.round(s.min / 6) / 10 + " h</td><td>" + (r.plaisir ? r.plaisir + "/5 · " + (r.tenable || "–") + "/5" : "–") + "</td></tr>";
    }).join("") + "</table></div></div>";
  if (faites.length >= 2) {
    var tri = faites.slice().sort(function (a, b) { return st[b.id].cloture.pct - st[a.id].cloture.pct; });
    var e = st[tri[0].id].cloture.pct - st[tri[1].id].cloture.pct;
    out += '<div class="carte"><h3>Lecture</h3><p>En tête au QCM de clôture : <b style="color:' + tri[0].c + '">' + h(tri[0].nom) + "</b>, avec " + Math.round(e) + " points d'avance sur la suivante.</p><p class=\"note\">" + (e < 12 ? "Écart inférieur à environ 12 points : avec ce nombre de questions, il peut venir du hasard. Regarder aussi le rappel tardif et le ressenti." : "Écart net : il dépasse ce que le hasard explique d'habitude avec ce nombre de questions.") + " Rappel : la dernière méthode profite de l'expérience accumulée.</p></div>";
  }
  return out;
}

/* ---------- journal ---------- */
function vueJournal() {
  var n = 0; METHODES.forEach(function (m) { n += Object.keys(bloc(m.id).seances).length + Object.keys(bloc(m.id).qcm).length; });
  return '<p class="sur">Le journal</p><h1>Enregistrer et reprendre</h1>' +
  '<p class="lead">Le site ne garde rien quand on le ferme. Les séances, les temps, les QCM et les boîtes de cartes vivent dans un petit fichier que tu télécharges après chaque séance et que tu réimportes la fois suivante.</p>' +
  '<div class="carte"><h3>1. Reprendre</h3><p>Au début de chaque séance, importe le <strong>dernier</strong> fichier enregistré (le plus récent dans Téléchargements).</p><label class="btn sec"><input type="file" id="imp" accept="application/json,.json" hidden>Importer le journal</label></div>' +
  '<div class="carte"><h3>2. Enregistrer</h3><p>À la fin de chaque séance ou de chaque QCM.</p><button class="btn" id="exp">Télécharger le journal</button> <p class="note">' + n + " élément(s) enregistré(s) dans le journal en cours." + (SALE ? " <b style=\"color:var(--alerte)\">Des changements ne sont pas encore enregistrés.</b>" : "") + "</p></div>" +
  '<details><summary>Sauvegarde de secours : copier le texte</summary><p class="note">Si le téléchargement ne marche pas, copie ce texte dans une note ou un mail à toi-même. Pour le recharger, colle-le ici puis « Charger ».</p><textarea id="txt" rows="5">' + h(JSON.stringify(S)) + '</textarea><div class="rangee"><button class="btn sec petit" id="copier">Copier</button><button class="btn sec petit" id="coller">Charger ce texte</button></div></details>';
}
function charger(txt) {
  var d = JSON.parse(txt);
  if (!d || !d.blocs) throw new Error("format");
  METHODES.forEach(function (m) { var b = d.blocs[m.id] || {}, v = blocVide(); Object.keys(v).forEach(function (k) { if (b[k] !== undefined) v[k] = b[k]; }); S.blocs[m.id] = v; });
  SALE = false; document.getElementById("sale").hidden = true;
}
function exporter() {
  var blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
  var a = document.createElement("a"), d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = "journal-sante-" + iso(d) + "-" + String(d.getHours()).padStart(2, "0") + "h" + String(d.getMinutes()).padStart(2, "0") + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  SALE = false; document.getElementById("sale").hidden = true;
}

/* ============================================================
   ROUTEUR ET ÉVÉNEMENTS
   ============================================================ */
function route() {
  var r = location.hash.replace(/^#\/?/, "").split("/"), v = r[0] || "accueil", html;
  if (v === "methodes") html = vueMethodes();
  else if (v === "protocole") html = vueProtocole();
  else if (v === "m") html = vueMethode(r[1], r[2] !== undefined ? +r[2] : undefined);
  else if (v === "cours") html = vueCours();
  else if (v === "c") html = vueChapitre(r[1]);
  else if (v === "qcm") html = vueQCM(r[1], r[2]);
  else if (v === "pq") html = vuePourquoi(r[1]);
  else if (v === "ent") html = vueEntrain(r.slice(1).join("/"));
  else if (v === "cartes") html = vueCartes(r.slice(1).join("/"));
  else if (v === "resultats") html = vueResultats();
  else if (v === "journal") html = vueJournal();
  else { v = "accueil"; html = vueAccueil(); }
  app.innerHTML = html;
  var onglet = { accueil: "accueil", methodes: "methodes", protocole: "methodes", m: "methodes", qcm: "methodes", pq: "methodes", ent: "methodes", cartes: "methodes", cours: "cours", c: "cours", resultats: "resultats", journal: "journal" }[v];
  document.querySelectorAll("nav.bas a").forEach(function (a) { a.classList.toggle("on", a.dataset.r === onglet); });
  lier(v, r);
}
function rendre() { var y = window.scrollY; route(); window.scrollTo(0, y); }

  if (v === "accueil" && $("go")) $("go").onclick = function () {
    var m = blocCourant(), d = $("j0").value; if (!d) return;

      if ($("gnext")) $("gnext").onclick = function () { CHR.etape++; CHR.debutEtape = Date.now(); rendre(); };
      if ($("gprev")) $("gprev").onclick = function () { CHR.etape--; CHR.debutEtape = Date.now(); rendre(); };
      if ($("stop")) $("stop").onclick = function () {
        var min = Math.max(1, Math.round(tempsChr() / 60)); CHR = null;
        enregistrerSeance(id, i, min, "faite"); toast("Séance enregistrée : " + min + " min. Pense au journal."); location.hash = "#m/" + id;
      };
      if ($("faite")) $("faite").onclick = function () { enregistrerSeance(id, i, Math.max(0, +$("mins").value || 0), "faite"); CHR = null; toast("Séance enregistrée."); location.hash = "#m/" + id; };
      if ($("sautee")) $("sautee").onclick = function () { enregistrerSeance(id, i, 0, "sautee"); CHR = null; location.hash = "#m/" + id; };
    }
    document.querySelectorAll(".etoiles button").forEach(function (b) { b.onclick = function () { bloc(id).ressenti[b.dataset.r] = +b.dataset.v; marquer(); rendre(); }; });
    if ($("remarque")) $("remarque").oninput = function () { bloc(id).ressenti.remarque = this.value; marquer(); };
  }
  if (v === "pq" && $("rec")) {
    if (REC && REC.url) $("ecoute").innerHTML = '<audio controls src="' + REC.url + '"></audio>';
    $("rec").onclick = function () {
      if (REC && REC.actif) { REC.mr.stop(); return; }
      if (!navigator.mediaDevices || !window.MediaRecorder) { $("recinfo").textContent = "Enregistrement impossible sur ce navigateur : utilise l'application Dictaphone du téléphone."; return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (flux) {
        var mr = new MediaRecorder(flux), morceaux = [];
        if (REC && REC.url) URL.revokeObjectURL(REC.url);
        REC = { actif: true, mr: mr, debut: Date.now() };
        mr.ondataavailable = function (e) { morceaux.push(e.data); };
        mr.onstop = function () { flux.getTracks().forEach(function (t) { t.stop(); }); REC.actif = false; REC.url = URL.createObjectURL(new Blob(morceaux, { type: mr.mimeType })); rendre(); };
        mr.start(); rendre(); $("recinfo").textContent = "Enregistrement en cours…";
      }).catch(function () { $("recinfo").textContent = "Micro refusé : autorise-le dans les réglages du navigateur."; });
    };
  }
  if (v === "ent") {

        route(); window.scrollTo(0, 0);
      };

  if (v === "cartes") {

    if ($("cgo")) $("cgo").onclick = function () { CR = { cle: ck, ids: idsCartes(ck), i: 0, montre: false, ratees: [], su: 0 }; route(); };
    if ($("cratees")) $("cratees").onclick = function () { CR = { cle: ck, ids: melanger(CR.ratees), i: 0, montre: false, ratees: [], su: 0 }; route(); };
    if ($("cvoir")) $("cvoir").onclick = function () { CR.montre = true; route(); };
    var noter = function (ok) {
      var id = CR.ids[CR.i], c = bloc("M5").cartes;
      c[id] = ok ? Math.min(3, boite(id) + 1) : 1;
      if (ok) CR.su++; else CR.ratees.push(id);

  if (v === "qcm") {
    var qid = r[1], type = r[2], liste = QCM[qid] && QCM[qid][type];
    if ($("qgo")) $("qgo").onclick = function () { RUN = { id: qid, type: type, i: 0, debut: Date.now(), rep: liste.map(function () { return { sel: [], conf: "" }; }) }; rendre(); };

        RUN = null; marquer(); route(); window.scrollTo(0, 0); toast("Copie rendue. Enregistre le journal.");
      };
    }
  }
  if (v === "journal") {
    $("exp").onclick = function () { exporter(); rendre(); toast("Journal téléchargé."); };
    $("imp").onchange = function () {
      var f = this.files[0]; if (!f) return;
      var lec = new FileReader();
      lec.onload = function () { try { charger(lec.result); toast("Journal chargé."); location.hash = "#"; } catch (e) { toast("Ce fichier n'est pas un journal valide."); } };

  }
}

window.addEventListener("beforeunload", function (e) { if (SALE || CHR) { e.preventDefault(); e.returnValue = ""; } });
document.getElementById("theme").onclick = function () {
  var r = document.documentElement, sombre = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = sombre ? "light" : "dark";
};
route();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
