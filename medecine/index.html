<div class="cle"><b>Idée et exemple</b>On a suivi ce trajet en direct. <strong>Expérience de Palade</strong> (années 1960, prix Nobel 1974) : des cellules du pancréas exocrine reçoivent pendant quelques minutes un acide aminé radioactif (l'impulsion), puis un acide aminé normal (la chasse). L'autoradiographie au microscope électronique montre les protéines marquées dans le RE rugueux après quelques minutes, dans le Golgi une vingtaine de minutes plus tard, puis dans les grains de sécrétion au bout d'une à deux heures.</div>

<h2>2. Le RE rugueux : fabriquer et contrôler</h2>
<h3>Deux populations de ribosomes</h3>
<p>Toute traduction commence sur un ribosome libre du cytosol. Les protéines du cytosol, du noyau, des mitochondries et des peroxysomes y sont terminées. Celles qui doivent être <strong>sécrétées</strong>, <strong>insérées dans une membrane</strong> (plasmique, du RE, du Golgi) ou envoyées aux <strong>lysosomes</strong> sont terminées sur des ribosomes fixés au RE : ce sont eux qui le rendent « rugueux ».</p>
<div class="lienT"><b>Lien avec la Terminale</b>La traduction de l'ARNm par les ribosomes, vue en SVT, est le point de départ : cette fiche suit la protéine une fois qu'elle sort du ribosome.</div>
<h3>Le peptide signal et la SRP</h3>
<div class="def"><b>Définition</b>Le <strong>peptide signal</strong> est une courte séquence (souvent 15 à 30 acides aminés), placée en général à l'extrémité <strong>N-terminale</strong> de la protéine et organisée autour d'un cœur de résidus <strong>hydrophobes</strong>. C'est l'« adresse » du RE.</div>
<ol>
<li>Dès qu'il sort du ribosome, le peptide signal est reconnu par la <strong>SRP</strong> (<em>signal recognition particle</em>, particule de reconnaissance du signal), un complexe d'ARN et de protéines. La SRP freine la traduction.</li>
<li>La SRP conduit le complexe ribosome-ARNm vers son <strong>récepteur</strong>, dans la membrane du RE.</li>
<li>Le ribosome est confié à un canal de la membrane, le <strong>translocon</strong>, et la SRP est libérée pour resservir. La traduction reprend : la chaîne passe dans la lumière du RE au fur et à mesure de sa fabrication.</li>
<li>Dans la lumière, la <strong>signal peptidase</strong> coupe le peptide signal ; la protéine soluble est libérée.</li>
</ol>
<p>Pour une protéine transmembranaire, un segment hydrophobe interne (séquence d'arrêt de transfert) bloque le passage et sort latéralement du translocon dans la bicouche : il devient une hélice transmembranaire.</p>
<div class="piege"><b>Piège de concours</b>Les ribosomes libres et ceux du RE sont <strong>identiques</strong>. Ce n'est pas le ribosome qui choisit sa destination, c'est la protéine qu'il fabrique, grâce à son peptide signal. Et la protéine entre dans le RE <strong>pendant</strong> sa traduction (on dit cotraductionnelle), pas une fois terminée.</div>
<div class="cle"><b>Idée et exemple</b>Le peptide signal se voit dans le tube à essai. Si l'on traduit in vitro l'ARNm d'une protéine sécrétée (une chaîne d'anticorps, par exemple) <strong>sans</strong> RE, on obtient une protéine un peu plus longue que la protéine réellement sécrétée : son peptide signal n'a pas été coupé. Si l'on ajoute des <strong>microsomes</strong> (fragments de RE isolés par fractionnement), la protéine se retrouve à l'intérieur des microsomes, à sa taille normale. C'est la base de l'« hypothèse du signal » de Günter Blobel (prix Nobel 1999).</div>

<h3>La N-glycosylation</h3>
<p>La plupart des protéines qui entrent dans le RE sont glycosylées. Une enzyme de la membrane (l'oligosaccharyltransférase) transfère <strong>en bloc</strong> un oligosaccharide préfabriqué de <strong>14 sucres</strong> (2 N-acétylglucosamines, 9 mannoses, 3 glucoses), assemblé à l'avance sur un lipide de la membrane du RE, le <strong>dolichol phosphate</strong>. Il se fixe sur l'azote de la chaîne latérale d'une <strong>asparagine</strong> (d'où le « N ») située dans la séquence <strong>Asn-X-Ser</strong> ou <strong>Asn-X-Thr</strong>, X étant n'importe quel acide aminé sauf la proline. Cet oligosaccharide est ensuite raccourci dans le RE, puis remanié dans le Golgi.</p>

<h3>Le contrôle qualité</h3>
<p>Le RE vérifie que chaque protéine est correctement repliée avant de la laisser partir :</p>
<ul>
<li>des <strong>protéines chaperons</strong>, comme <strong>BiP</strong> (famille des Hsp70), se fixent aux segments hydrophobes encore exposés et empêchent l'agrégation ;</li>
<li>la <strong>calnexine</strong> et la <strong>calréticuline</strong> retiennent les glycoprotéines qui portent encore un glucose sur leur oligosaccharide, le temps qu'elles se replient ;</li>
<li>la <strong>PDI</strong> (protéine disulfure isomérase) forme et corrige les <strong>ponts disulfures</strong>, favorisés par le milieu oxydant de la lumière ;</li>
<li>beaucoup de protéines s'y assemblent en complexes (structure quaternaire), comme les anticorps.</li>
</ul>
<p>Une protéine qui n'arrive pas à se replier est retenue, puis renvoyée vers le cytosol, marquée par l'<strong>ubiquitine</strong> et détruite par le <strong>protéasome</strong>.</p>
<div class="cle"><b>Idée et exemple : la mucoviscidose</b>La mutation la plus fréquente du gène <em>CFTR</em> (ΔF508, perte d'une phénylalanine) donne un canal à chlorures mal replié. Le contrôle qualité le retient dans le RE et le fait dégrader : il n'atteint presque jamais la membrane plasmique, alors qu'il garderait une partie de son activité. Les sécrétions des bronches et du pancréas s'épaississent. Des médicaments dits « correcteurs » (élexacaftor, tézacaftor) aident la protéine à se replier et à quitter le RE.</div>

<h2>3. Le RE lisse</h2>
<p>Le RE lisse, sans ribosomes, est un réseau de tubules en continuité avec le RE rugueux. Son importance varie selon les cellules :</p>
<ul>
<li><strong>synthèse des lipides membranaires</strong> : phospholipides et cholestérol sont fabriqués dans la membrane du RE, puis distribués aux autres membranes ;</li>
<li><strong>hormones stéroïdes</strong> : il est très développé dans la corticosurrénale et dans les cellules de Leydig du testicule ;</li>
<li><strong>détoxification</strong> dans l'hépatocyte : des enzymes, les <strong>cytochromes P450</strong>, rendent médicaments et toxiques plus solubles pour faciliter leur élimination ;</li>
<li><strong>réserve de calcium</strong>, surtout dans le muscle, où il s'appelle <strong>réticulum sarcoplasmique</strong> : la libération de son Ca<sup>2+</sup> déclenche la contraction ;</li>
<li>dans le foie, la <strong>glucose-6-phosphatase</strong> de sa membrane libère le glucose issu du glycogène (voir la fiche « Les glucides »).</li>
</ul>
<div class="cle"><b>Idée et exemple</b>Le RE lisse s'adapte à la demande. Chez une personne qui prend au long cours un <strong>inducteur enzymatique</strong> (la rifampicine, un antibiotique, ou certains antiépileptiques), les hépatocytes fabriquent davantage de RE lisse et de cytochromes P450. Les autres médicaments sont alors dégradés plus vite : une <strong>pilule contraceptive</strong> peut perdre son efficacité. C'est une interaction médicamenteuse classique.</div>

<h2>4. L'appareil de Golgi : modifier, trier, expédier</h2>
<p>Le Golgi est un empilement de <strong>saccules</strong> aplatis (un dictyosome), souvent situé près du noyau. Il est <strong>polarisé</strong> :</p>
<ul>
<li>la face <strong>cis</strong>, tournée vers le RE, reçoit les vésicules qui en arrivent ;</li>
<li>les saccules <strong>médians</strong> poursuivent les modifications ;</li>
<li>la face <strong>trans</strong>, prolongée par le <strong>réseau trans-golgien</strong> (TGN), trie les protéines et les expédie.</li>
</ul>
<p>Chaque compartiment possède ses propres enzymes : les protéines y subissent leurs modifications dans un ordre fixé.</p>
<h3>Les modifications</h3>
<ul>
<li>Les <strong>N-glycanes</strong> venus du RE sont remaniés : des mannoses sont retirés, d'autres sucres ajoutés (N-acétylglucosamine, galactose, puis acide sialique dans la région trans).</li>
<li>La <strong>O-glycosylation</strong> a lieu essentiellement dans le Golgi : des sucres sont ajoutés <strong>un par un</strong> sur l'oxygène de la fonction –OH d'une <strong>sérine</strong> ou d'une <strong>thréonine</strong>. Les <strong>mucines</strong> du mucus, très O-glycosylées, en sont l'exemple type.</li>
<li>Le Golgi fabrique aussi les longues chaînes de sucres des <strong>protéoglycanes</strong> de la matrice extracellulaire.</li>
<li>Des précurseurs sont coupés. Dans le TGN et les grains de sécrétion, la <strong>proinsuline</strong> est coupée en <strong>insuline</strong> et <strong>peptide C</strong>, libérés en quantités égales. Doser le peptide C renseigne donc sur la sécrétion d'insuline propre d'un patient, même s'il reçoit de l'insuline en injection.</li>
</ul>
<div class="piege"><b>Piège de concours</b>La N-glycosylation <strong>commence dans le RE</strong> (transfert en bloc sur une asparagine) et s'achève dans le Golgi ; la O-glycosylation se fait <strong>dans le Golgi</strong>, sucre par sucre, sur une sérine ou une thréonine. Les sucres ajoutés dans la lumière se retrouvent sur la <strong>face externe</strong> de la membrane plasmique : c'est l'origine du glycocalyx.</div>

<h3>L'adressage aux lysosomes : le mannose-6-phosphate</h3>
<ol>
<li>Dans le Golgi cis, une enzyme reconnaît les hydrolases lysosomales (par un motif de leur surface repliée) et, en deux étapes, greffe un <strong>phosphate</strong> sur le carbone 6 de mannoses de leurs N-glycanes : c'est le marqueur <strong>mannose-6-phosphate</strong> (M6P).</li>
<li>Dans le TGN, des <strong>récepteurs du M6P</strong> fixent ces enzymes et les concentrent dans des vésicules recouvertes de clathrine.</li>
<li>Les vésicules rejoignent les <strong>endosomes</strong>, dont le pH plus acide détache les enzymes de leur récepteur. Le phosphate est retiré ; les récepteurs retournent au Golgi pour un nouveau cycle.</li>
</ol>
<div class="cle"><b>Idée et exemple : la maladie des inclusions cellulaires</b>Dans cette maladie héréditaire rare (mucolipidose de type II), l'enzyme qui pose le M6P est absente. Les hydrolases sont fabriquées normalement mais, faute d'étiquette, elles partent par défaut vers la sécrétion : on les retrouve en excès dans le sang, alors que les lysosomes en manquent et se remplissent de déchets non digérés, les « inclusions » visibles au microscope. Une seule étiquette manquante prive la cellule de dizaines d'enzymes à la fois.</div>

<h2>5. Les vésicules et leurs manteaux</h2>
<p>Une vésicule se forme grâce à un <strong>manteau</strong> de protéines qui s'assemble sur la face cytosolique de la membrane : il la courbe et sélectionne la cargaison. Le manteau se détache peu après le bourgeonnement.</p>
<div class="defile"><table>
<tr><th>Manteau</th><th>Trajet</th><th>À retenir</th></tr>
<tr><td><b>COPII</b></td><td>RE → Golgi (aller)</td><td>exporte les protéines bien repliées</td></tr>
<tr><td><b>COPI</b></td><td>Golgi → RE (retour), et entre saccules du Golgi</td><td>récupère les protéines du RE parties par erreur</td></tr>
<tr><td><b>Clathrine</b></td><td>membrane plasmique → endosomes (endocytose) ; TGN → endosomes</td><td>panier fait de « triskèles » ; la <strong>dynamine</strong> étrangle le col de la vésicule</td></tr>
</table></div>
<p>Les protéines solubles qui doivent rester dans le RE (BiP, PDI) portent à leur extrémité C-terminale le signal <strong>KDEL</strong> (Lys-Asp-Glu-Leu). Si elles s'échappent vers le Golgi, un récepteur du KDEL les capture et les renvoie au RE par des vésicules COPI.</p>
<p>Arrivée à destination, la vésicule fusionne grâce aux <strong>SNARE</strong> : une v-SNARE de la vésicule s'enroule avec des t-SNARE de la membrane cible (<em>target</em>), ce qui rapproche les deux bicouches jusqu'à la fusion. Des petites protéines G, les <strong>Rab</strong>, aident à reconnaître la bonne cible.</p>
<div class="cle"><b>Idée et exemple : la toxine botulique</b>Les neurotoxines botuliques sont des enzymes qui coupent les SNARE des terminaisons nerveuses motrices. Les vésicules d'acétylcholine ne fusionnent plus : le muscle ne reçoit plus d'ordre, d'où la paralysie flasque du <strong>botulisme</strong>. Injectée à très faible dose dans un muscle, la même toxine traite des contractures (et, en esthétique, les rides).</div>
<div class="piege"><b>Piège de concours</b>Les numéros sont trompeurs : <strong>COPII part du RE</strong> vers le Golgi, <strong>COPI revient</strong> vers le RE. La clathrine n'intervient pas entre le RE et le Golgi.</div>

<h2>6. L'exocytose</h2>
<div class="defile"><table>
<tr><th></th><th>Exocytose constitutive</th><th>Exocytose régulée</th></tr>
<tr><td>Cellules</td><td>toutes</td><td>cellules spécialisées (endocrines, exocrines, neurones)</td></tr>
<tr><td>Rythme</td><td>continue, sans signal</td><td>stockage dans des <strong>grains de sécrétion</strong>, libération sur signal, le plus souvent une hausse du <strong>Ca<sup>2+</sup></strong> cytosolique</td></tr>
<tr><td>Exemples</td><td>renouvellement de la membrane plasmique ; collagène des fibroblastes ; albumine des hépatocytes ; anticorps des plasmocytes</td><td>insuline des cellules β du pancréas après un repas ; neurotransmetteurs ; enzymes du pancréas exocrine ; histamine des mastocytes dans l'allergie</td></tr>
</table></div>
<p>Une protéine soluble sans signal particulier suit par défaut la voie constitutive. L'exocytose ajoute de la membrane à la membrane plasmique, l'endocytose en retire : les deux s'équilibrent.</p>

<h2>7. L'endocytose</h2>
<ul>
<li>La <strong>phagocytose</strong> engloutit de grosses particules (bactéries, débris, cellules mortes) grâce à des pseudopodes. Elle est le fait de cellules spécialisées : macrophages, polynucléaires neutrophiles. Le phagosome fusionne ensuite avec un lysosome.</li>
<li>La <strong>pinocytose</strong> fait entrer du liquide extracellulaire et ce qu'il contient, sans sélection.</li>
<li>L'<strong>endocytose par récepteurs</strong> est sélective : le ligand se fixe à son récepteur, les complexes se regroupent dans des <strong>puits recouverts de clathrine</strong>, qui s'invaginent et se détachent en vésicules. Après perte du manteau, la vésicule fusionne avec un <strong>endosome précoce</strong>, dont le pH légèrement acide (≈ 6) sépare le ligand du récepteur. Le récepteur est recyclé vers la membrane ; le ligand continue vers les endosomes tardifs puis les lysosomes.</li>
</ul>
<div class="cle"><b>Idée et exemple : le récepteur des LDL</b>Le cholestérol circule dans le sang surtout dans les <strong>LDL</strong>, des lipoprotéines reconnues par le <strong>récepteur des LDL</strong> grâce à leur apolipoprotéine B-100. Les LDL entrent par endocytose par récepteurs ; dans l'endosome, elles se détachent et le récepteur repart vers la membrane (il fait des centaines de cycles) ; dans le lysosome, le cholestérol est libéré pour la cellule, qui freine alors sa propre synthèse. Dans l'<strong>hypercholestérolémie familiale</strong> (autosomique dominante, environ 1 personne sur 250 à 500 pour la forme hétérozygote), les récepteurs sont absents ou anormaux : les LDL restent dans le sang, où le LDL-cholestérol double (hétérozygotes) ou plus encore (homozygotes). Le cholestérol se dépose dans les artères (athérosclérose) : risque d'<strong>infarctus</strong> précoce, parfois dès l'enfance chez les homozygotes. Brown et Goldstein ont reçu le prix Nobel 1985 pour ces travaux.</div>
<p>Selon la mutation, le récepteur n'est pas fabriqué, reste bloqué dans le RE par le contrôle qualité, ne fixe pas les LDL, ou les fixe sans se regrouper dans les puits de clathrine. Les <strong>statines</strong>, qui freinent la synthèse de cholestérol, poussent les hépatocytes à fabriquer plus de récepteurs et donc à capter plus de LDL : elles agissent bien chez les hétérozygotes, qui gardent un allèle normal, beaucoup moins chez les homozygotes sans récepteur fonctionnel.</p>

<h2>8. Les lysosomes</h2>
<p>Les lysosomes sont des vésicules à une membrane, à <strong>pH ≈ 4,5 à 5</strong>, maintenu par une <strong>pompe à protons</strong> (ATPase de type V) qui y fait entrer des H<sup>+</sup> en consommant de l'ATP. Ils contiennent une cinquantaine d'<strong>hydrolases acides</strong> (protéases, nucléases, lipases, glycosidases, phosphatases, sulfatases), actives seulement à pH acide : si un lysosome se rompt, elles sont peu actives au pH neutre du cytosol (≈ 7,2). Leur membrane est protégée de la digestion par des protéines très glycosylées.</p>
<p>Trois voies apportent du matériel à digérer : l'<strong>endocytose</strong>, la <strong>phagocytose</strong> et l'<strong>autophagie</strong>, où la cellule entoure ses propres organites usés d'une double membrane (l'autophagosome) qui fusionne avec un lysosome. Les produits de la digestion (acides aminés, sucres, nucléotides) repartent vers le cytosol par des transporteurs.</p>
<div class="def"><b>Définition</b>Une <strong>maladie lysosomale</strong> (ou maladie de surcharge) est due au déficit d'une enzyme lysosomale ou de son adressage : le substrat non dégradé s'accumule dans les lysosomes, qui gonflent et perturbent la cellule. On en connaît plus de 50 ; la plupart se transmettent sur le mode autosomique récessif.</div>
<div class="cle"><b>Idée et exemple : la maladie de Gaucher</b>C'est l'une des plus fréquentes. Le déficit en <strong>glucocérébrosidase</strong> fait s'accumuler un glycolipide, le glucocérébroside, surtout dans les <strong>macrophages</strong>, qui deviennent de grosses « cellules de Gaucher ». Elles envahissent la rate, le foie et la moelle osseuse : grosse rate, gros foie, anémie, baisse des plaquettes, douleurs et lésions osseuses. Elle a été l'une des premières maladies traitées par <strong>enzymothérapie substitutive</strong> : une enzyme produite par génie génétique est perfusée, ses sucres ayant été modifiés pour qu'elle soit captée par les macrophages.</div>

<div class="cle"><b>Bilan</b>Peptide signal, SRP et translocon font entrer la protéine dans le RE pendant sa traduction ; elle y est N-glycosylée et contrôlée. Le Golgi la modifie de cis à trans, le TGN la trie : lysosomes (M6P), sécrétion constitutive ou régulée. COPII va du RE au Golgi, COPI revient, la clathrine sert à l'endocytose ; les SNARE font fusionner. L'endocytose par récepteurs (LDL) mène aux lysosomes, dont les hydrolases acides digèrent ; un déficit donne une maladie lysosomale.</div>

<details><summary>Hors programme : le RE débordé et la traversée du Golgi</summary>
<div class="hp"><b>Hors programme</b>Quand trop de protéines mal repliées s'accumulent, le RE déclenche la <strong>réponse UPR</strong> (<em>unfolded protein response</em>) : la traduction ralentit, la cellule fabrique plus de chaperons et dégrade davantage ; si le stress dure, elle entre en apoptose. Pour la traversée du Golgi, deux modèles se sont opposés : des vésicules qui sautent entre saccules fixes, ou des saccules qui mûrissent eux-mêmes de cis à trans, leurs enzymes étant renvoyées en arrière par COPI. Le second est aujourd'hui le plus soutenu.</div>
</details>

<p class="lead">Le cytosquelette est un réseau de filaments de protéines qui donne sa forme à la cellule, la fait bouger, transporte ses organites et sépare ses chromosomes. Les jonctions l'accrochent à celui des cellules voisines ou à la matrice : ensemble, ils font tenir les tissus.</p>

<h2>1. Trois familles de filaments</h2>
<p>On distingue trois familles de filaments : les <strong>microfilaments d'actine</strong> (≈ 7 nm, les plus fins), les <strong>microtubules</strong> (≈ 25 nm, des tubes creux) et les <strong>filaments intermédiaires</strong> (≈ 10 nm). Les deux premiers sont des <strong>polymères dynamiques</strong> : ils s'assemblent et se défont sans cesse à partir de sous-unités qui fixent un nucléotide (ATP pour l'actine, GTP pour la tubuline) ; ils sont <strong>polarisés</strong> et servent de rails à des <strong>protéines motrices</strong>. Les filaments intermédiaires sont stables, non polarisés et sans moteur : ce sont des câbles de résistance mécanique.</p>

<h2>2. Les microfilaments d'actine</h2>
<h3>De l'actine G à l'actine F</h3>
<p>L'actine est l'une des protéines les plus abondantes des cellules eucaryotes. Le monomère, globulaire, s'appelle <strong>actine G</strong> ; il fixe une molécule d'<strong>ATP</strong>. Les monomères s'assemblent en un filament, l'<strong>actine F</strong> (filamenteuse), fait de deux brins enroulés en hélice.</p>
<div class="def"><b>Définition</b>Un filament d'actine est <strong>polarisé</strong> : tous ses monomères sont orientés dans le même sens. L'extrémité <strong>(+)</strong>, dite barbelée, s'allonge vite ; l'extrémité <strong>(−)</strong>, dite pointue, s'allonge lentement.</div>
<p>La polymérisation commence par une <strong>nucléation</strong> (quelques monomères s'associent en un petit noyau : c'est l'étape lente, contrôlée par la cellule), suivie d'une <strong>élongation</strong> : des actines G liées à l'ATP s'ajoutent, surtout à l'extrémité (+). Une fois incorporée, l'actine hydrolyse son ATP en ADP ; l'actine-ADP se détache plus facilement, surtout par l'extrémité (−). À l'état stationnaire, des monomères s'ajoutent en (+) pendant que d'autres partent en (−) : la longueur reste constante, mais les sous-unités défilent le long du filament. C'est le <strong>tapis roulant</strong> (<em>treadmilling</em>).</p>
<div class="cle"><b>Idée et exemple</b>La polymérisation de l'actine produit à elle seule une force capable de pousser. La bactérie <strong><em>Listeria monocytogenes</em></strong>, responsable de la listériose (grave chez la femme enceinte et la personne immunodéprimée), détourne cette machinerie : elle fait polymériser l'actine de la cellule infectée derrière elle, en une « comète » qui la propulse dans le cytoplasme puis jusque dans la cellule voisine, sans repasser par le milieu extérieur.</div>

<h3>Où trouve-t-on l'actine ?</h3>
<ul>
<li>Le <strong>cortex</strong>, réseau serré sous la membrane plasmique, qui lui donne forme et résistance.</li>
<li>Les <strong>microvillosités</strong> : chacune contient un faisceau rigide de 20 à 30 filaments parallèles, extrémité (+) au sommet, reliés entre eux par des protéines de liaison (villine, fimbrine). Exemple : la <strong>bordure en brosse</strong> des entérocytes de l'intestin grêle, qui multiplie la surface d'absorption.</li>
<li>Les <strong>fibres de stress</strong>, faisceaux contractiles qui ancrent la cellule à la matrice.</li>
<li>Les <strong>lamellipodes</strong> et les <strong>filopodes</strong>, expansions poussées par la polymérisation, qui font ramper la cellule. Exemple : le polynucléaire neutrophile qui migre vers un foyer infectieux.</li>
</ul>

<h3>Les myosines, moteurs de l'actine</h3>
<p>Les <strong>myosines</strong> sont des protéines motrices : leur tête se fixe à l'actine et hydrolyse l'ATP pour avancer le long du filament, presque toujours vers l'extrémité (+). Il en existe de nombreuses classes.</p>
<ul>
<li>La <strong>myosine II</strong> s'assemble en filaments épais. Dans le muscle strié, les filaments épais de myosine tirent sur les filaments fins d'actine du sarcomère et les font glisser : c'est la <strong>contraction</strong>, déclenchée par une élévation du Ca<sup>2+</sup> dans le cytosol. Les filaments ne raccourcissent pas : ils glissent les uns sur les autres.</li>
<li>Pendant la <strong>cytocinèse</strong>, dernière étape de la division, un <strong>anneau contractile</strong> d'actine et de myosine II se forme sous la membrane, à l'équateur de la cellule. En se resserrant comme un cordon de bourse, il étrangle la cellule et sépare les deux cellules filles.</li>
<li>La <strong>myosine V</strong> transporte des vésicules le long des filaments d'actine, sur de courtes distances, près de la membrane.</li>
</ul>
<div class="cle"><b>Idée et exemple</b>Un moteur défectueux suffit à rendre malade. La <strong>cardiomyopathie hypertrophique</strong>, cause classique de mort subite chez le jeune sportif, est souvent due à la mutation d'un gène d'une protéine du sarcomère, en particulier la chaîne lourde de la myosine cardiaque.</div>
<p>Deux toxines servent d'outils au laboratoire : la <strong>phalloïdine</strong> (tirée de l'amanite phalloïde) stabilise les filaments d'actine et, rendue fluorescente, permet de les voir au microscope ; les <strong>cytochalasines</strong> bloquent l'allongement à l'extrémité (+), si bien que la cytocinèse échoue.</p>

<h2>3. Les microtubules</h2>
<h3>Structure et polarité</h3>
<p>La sous-unité des microtubules est un <strong>hétérodimère de tubulines α et β</strong>, chacune liée à une molécule de <strong>GTP</strong>. Les dimères s'alignent bout à bout en <strong>protofilaments</strong> ; <strong>13 protofilaments</strong> s'associent côte à côte en un <strong>tube creux</strong> d'environ 25 nm de diamètre. Le microtubule est polarisé : la tubuline β est exposée à l'extrémité <strong>(+)</strong>, qui s'allonge vite, la tubuline α à l'extrémité <strong>(−)</strong>.</p>

<h3>Le centrosome, centre organisateur</h3>
<p>Dans une cellule animale, les microtubules partent d'un centre organisateur situé près du noyau : le <strong>centrosome</strong>. Il contient deux <strong>centrioles</strong> disposés à angle droit, chacun étant un petit cylindre de <strong>9 triplets</strong> de microtubules, entourés d'un matériel riche en <strong>tubuline γ</strong>. Ce sont des anneaux de tubuline γ qui amorcent (nucléent) les microtubules. Les extrémités (−) restent ancrées dans le centrosome ; les extrémités (+) rayonnent vers la périphérie.</p>

<h3>L'instabilité dynamique</h3>
<p>Après l'incorporation d'un dimère, la tubuline β hydrolyse son GTP en GDP ; le GTP de la tubuline α, lui, n'est jamais hydrolysé. Tant que l'extrémité (+) porte une <strong>coiffe de tubuline-GTP</strong>, le microtubule s'allonge. Si l'hydrolyse rattrape l'extrémité, la coiffe disparaît : les protofilaments chargés de GDP s'écartent en se recourbant et le microtubule se raccourcit très vite (<strong>catastrophe</strong>). Il peut ensuite repartir (<strong>sauvetage</strong>).</p>
<div class="def"><b>Définition</b>L'<strong>instabilité dynamique</strong> est l'alternance, pour chaque microtubule, de phases de croissance lente et de raccourcissement rapide. Elle permet aux microtubules d'explorer en permanence le cytoplasme et de se stabiliser là où ils rencontrent une cible, par exemple un chromosome pendant la mitose.</div>
<p>Des protéines associées aux microtubules (MAP) les stabilisent. Exemple : la <strong>protéine tau</strong> des axones. Dans la <strong>maladie d'Alzheimer</strong>, tau, anormalement phosphorylée, se détache des microtubules et s'agrège dans les neurones en dégénérescences neurofibrillaires.</p>

<h3>Kinésines et dynéines : le transport sur rails</h3>
<p>Deux familles de moteurs, qui hydrolysent l'ATP, se déplacent le long des microtubules en portant des vésicules ou des organites :</p>
<ul>
<li>la plupart des <strong>kinésines</strong> vont vers l'extrémité <strong>(+)</strong>, donc du centre vers la périphérie ;</li>
<li>les <strong>dynéines</strong> vont vers l'extrémité <strong>(−)</strong>, donc de la périphérie vers le centrosome.</li>
</ul>
<p>Exemple : l'<strong>axone</strong>, qui peut mesurer près d'un mètre (de la moelle épinière au pied). Ses microtubules ont tous leur extrémité (+) vers la terminaison. Les protéines, fabriquées dans le corps cellulaire, descendent vers la synapse par les kinésines (<strong>transport antérograde</strong>) ; d'autres vésicules remontent par les dynéines (<strong>transport rétrograde</strong>).</p>
<div class="cle"><b>Idée et exemple</b>Certains virus voyagent sur ces rails. Le <strong>virus de la rage</strong>, inoculé par une morsure, remonte les axones jusqu'au système nerveux central par transport rétrograde ; l'incubation est d'autant plus courte que la morsure est proche de la tête. Le virus de l'herpès remonte de même jusqu'aux ganglions sensitifs, où il reste latent.</div>

<h3>Cils et flagelles</h3>
<p>Les cils et flagelles mobiles sont des prolongements de la membrane soutenus par un <strong>axonème</strong> : <strong>9 doublets</strong> de microtubules en périphérie et <strong>2 microtubules</strong> isolés au centre, d'où la formule <strong>« 9 + 2 »</strong>. Des bras de <strong>dynéine</strong>, fixés sur chaque doublet, tirent sur le doublet voisin ; les doublets étant reliés entre eux, ce glissement devient une courbure : le cil bat. À sa base, l'axonème part d'un <strong>corps basal</strong>, de même structure qu'un centriole (9 triplets, sans paire centrale).</p>

<ul>
<li>Les <strong>cils</strong>, courts et nombreux, battent de façon coordonnée. Exemples : l'épithélium des voies respiratoires, qui fait remonter le mucus et les poussières vers le pharynx (l'escalator mucociliaire) ; la trompe utérine, qui fait progresser l'ovocyte.</li>
<li>Le <strong>flagelle</strong>, long et unique, propulse le spermatozoïde.</li>
<li>La plupart des cellules portent aussi un <strong>cil primaire</strong>, immobile, sans paire centrale (« 9 + 0 »), qui sert d'antenne sensorielle.</li>
</ul>
<div class="cle"><b>Idée et exemple</b>Dans la <strong>dyskinésie ciliaire primitive</strong>, maladie génétique, les bras de dynéine manquent ou fonctionnent mal : les cils ne battent plus. Le mucus stagne dans les bronches et les sinus (infections à répétition) et les hommes sont souvent stériles (spermatozoïdes immobiles). Environ la moitié des malades ont un <strong>situs inversus</strong> (organes inversés en miroir), car des cils de l'embryon fixent la gauche et la droite : c'est le <strong>syndrome de Kartagener</strong>.</div>

<h3>Le fuseau mitotique et ses poisons</h3>
<p>Au début de la mitose, le centrosome, dupliqué, forme deux pôles d'où partent les microtubules du <strong>fuseau mitotique</strong> : certains s'accrochent aux chromosomes par leurs <strong>kinétochores</strong>, d'autres se chevauchent entre les pôles. En anaphase, les microtubules kinétochoriens raccourcissent et tirent les chromatides sœurs vers les pôles opposés. Le fuseau ne fonctionne que si ses microtubules peuvent <strong>à la fois</strong> s'allonger et se raccourcir.</p>
<div class="lienT"><b>Lien avec la Terminale</b>La mitose et la méiose vues au lycée reposent entièrement sur ce fuseau.</div>
<p>Les <strong>poisons du fuseau</strong> bloquent les cellules en métaphase, par deux mécanismes opposés :</p>
<div class="defile"><table>
<tr><th>Poison</th><th>Origine</th><th>Action</th><th>Usage médical</th></tr>
<tr><td><b>Colchicine</b></td><td>colchique (plante)</td><td>se fixe à la tubuline libre et <strong>empêche la polymérisation</strong></td><td><strong>crise de goutte</strong> (elle freine les polynucléaires), péricardite ; au laboratoire, arrêt des cellules en métaphase pour établir un caryotype</td></tr>
<tr><td><b>Vinca-alcaloïdes</b> (vincristine, vinblastine)</td><td>pervenche de Madagascar</td><td><strong>empêchent la polymérisation</strong></td><td>chimiothérapie (leucémies, lymphomes)</td></tr>
<tr><td><b>Taxanes</b> (taxol ou paclitaxel, docétaxel)</td><td>if (arbre)</td><td><strong>stabilisent</strong> les microtubules, <strong>empêchent la dépolymérisation</strong></td><td>chimiothérapie (cancers du sein, de l'ovaire, du poumon)</td></tr>
</table></div>
<p>Ces anticancéreux frappent les cellules qui se divisent vite : tumeur, mais aussi moelle osseuse (baisse des globules blancs). Ils perturbent aussi le transport axonal, d'où des <strong>neuropathies périphériques</strong> (fourmillements des mains et des pieds).</p>
<div class="piege"><b>Pièges de concours</b>La colchicine et le taxol bloquent tous deux la mitose, mais en sens <strong>opposés</strong> : la colchicine empêche l'assemblage, le taxol empêche le désassemblage. Le centriole et le corps basal sont faits de 9 <strong>triplets</strong> ; l'axonème, de 9 <strong>doublets</strong> + 2. Les <strong>microvillosités</strong> contiennent de l'actine ; les <strong>cils</strong>, des microtubules. Les kinésines vont (le plus souvent) vers le (+), les dynéines vers le (−).</div>

<h2>4. Les filaments intermédiaires</h2>
<p>Les filaments intermédiaires sont faits de protéines <strong>fibreuses</strong> dont la partie centrale est une hélice α. Deux monomères s'enroulent en dimère ; deux dimères s'accolent tête-bêche (antiparallèles) en tétramère ; les tétramères s'assemblent en une corde. Le tétramère étant symétrique, le filament <strong>n'a pas de polarité</strong> : aucun moteur ne peut s'y déplacer. L'assemblage ne consomme ni ATP ni GTP.</p>
<p>Leur rôle est <strong>mécanique</strong> : ils résistent bien mieux à l'étirement que l'actine et les microtubules et, reliés de cellule à cellule par les desmosomes, répartissent les forces dans tout le tissu. Ils abondent dans l'épiderme, le muscle, l'axone.</p>
<div class="defile"><table>
<tr><th>Famille</th><th>Où ?</th></tr>
<tr><td><b>Kératines</b> (une cinquantaine)</td><td>cellules <strong>épithéliales</strong> ; formes dures dans les cheveux et les ongles</td></tr>
<tr><td><b>Vimentine</b></td><td>cellules d'origine <strong>mésenchymateuse</strong> : fibroblastes, cellules endothéliales, leucocytes</td></tr>
<tr><td><b>Desmine</b></td><td>cellules <strong>musculaires</strong> (striées et lisses)</td></tr>
<tr><td><b>GFAP</b> (protéine gliale fibrillaire acide)</td><td>astrocytes (cellules gliales)</td></tr>
<tr><td><b>Neurofilaments</b></td><td><strong>neurones</strong>, surtout l'axone, dont ils règlent le calibre</td></tr>
<tr><td><b>Lamines</b></td><td><strong>noyau</strong> de toutes les cellules : elles forment la lamina nucléaire, sous la membrane interne de l'enveloppe ; leur phosphorylation au début de la mitose fait se désassembler l'enveloppe</td></tr>
</table></div>
<div class="cle"><b>Idée et exemple : l'épidermolyse bulleuse simple</b>Dans cette maladie génétique, une mutation touche les <strong>kératines 5 ou 14</strong>, propres aux cellules de la couche basale de l'épiderme. Leurs filaments, défectueux, ne résistent plus aux contraintes : au moindre frottement, ces cellules se rompent et la peau forme des <strong>bulles</strong>. La maladie montre directement le rôle mécanique de ces filaments.</div>
<div class="cle"><b>Idée et exemple : le diagnostic en cancérologie</b>Une tumeur garde en règle le type de filament intermédiaire de son tissu d'origine. En révélant ces protéines par des anticorps sur une biopsie (<strong>immunohistochimie</strong>), le pathologiste oriente le diagnostic, même devant une métastase dont l'origine est inconnue : <strong>cytokératines</strong> → carcinome (tumeur épithéliale, la plus fréquente) ; <strong>vimentine</strong> → sarcome (tumeur du tissu conjonctif) ; <strong>desmine</strong> → tumeur musculaire ; <strong>GFAP</strong> → tumeur gliale.</div>

<h2>6. Les jonctions cellulaires</h2>
<p>Dans un épithélium, chaque cellule est reliée à ses voisines et à la <strong>lame basale</strong> (fine couche de matrice sous l'épithélium). Chaque jonction associe une <strong>protéine transmembranaire</strong> et, le plus souvent, un élément du cytosquelette, par l'intermédiaire de protéines d'ancrage.</p>

var(--m5)"/><rect x="189" y="179" width="10" height="4" rx="1" fill="var(--m5)"/><rect x="189" y="186" width="10" height="4" rx="1" fill="var(--m5)"/><rect x="189" y="193" width="10" height="4" rx="1" fill="var(--m5)"/><rect x="86" y="248" width="26" height="4" fill="currentColor"/><path d="M90 252V261" stroke="var(--accent)" stroke-width="1.4"/><path d="M96 252V261" stroke="var(--accent)" stroke-width="1.4"/><path d="M102 252V261" stroke="var(--accent)" stroke-width="1.4"/><path d="M108 252V261" stroke="var(--accent)" stroke-width="1.4"/><path d="M92 248C80 226 118 226 106 248" fill="none" stroke="var(--m2)" stroke-width="1.6"/><rect x="14" y="260" width="228" height="5" rx="2" fill="var(--doux)"/><g stroke="currentColor" stroke-width="1" opacity=".55" fill="none"><path d="M62 28V39"/><path d="M200 69L244 58"/><path d="M209 94H244"/><path d="M205 135H244"/><path d="M200 186H244"/><path d="M104 267L118 284"/></g><g font-family="system-ui,sans-serif" font-size="11" fill="currentColor"><text x="20" y="22">microvillosités</text><text x="248" y="61">jonction serrée</text><text x="248" y="91">jonction</text><text x="248" y="103">adhérente</text><text x="248" y="139">desmosome</text><text x="248" y="183">jonction</text><text x="248" y="195">communicante</text><text x="248" y="267">lame basale</text><text x="112" y="297">hémidesmosome</text></g></svg><figcaption>Deux cellules épithéliales voisines (espace entre elles exagéré). Ocre : filaments intermédiaires ; points rouges : faisceau d'actine coupé en travers ; traits bleu-vert : cadhérines et intégrines ; violet : claudines ; vert : connexons.</figcaption></figure>

<h3>Les jonctions serrées (étanches)</h3>
<p>Situées au pôle apical, elles forment une ceinture continue où les membranes de deux cellules voisines semblent soudées, grâce aux protéines transmembranaires <strong>claudines</strong> et <strong>occludine</strong>, reliées à l'actine. Elles ont deux rôles :</p>
<ul>
<li><strong>barrière</strong> : elles bloquent le passage <em>entre</em> les cellules (voie paracellulaire) ; pour traverser l'épithélium, une molécule doit passer <em>à travers</em> les cellules, par leurs transporteurs ;</li>
<li><strong>clôture</strong> : elles empêchent les protéines membranaires de diffuser de la face apicale à la face basolatérale, ce qui maintient la <strong>polarité</strong> de la cellule.</li>
</ul>
<p>Exemple : la <strong>barrière hémato-encéphalique</strong>. Les cellules des capillaires du cerveau sont unies par des jonctions serrées très étanches : beaucoup de médicaments n'atteignent pas le cerveau.</p>

<h3>Les jonctions adhérentes</h3>
<p>Juste sous les jonctions serrées, une ceinture d'adhérence unit les cellules par des <strong>cadhérines</strong> : la cadhérine d'une cellule se lie à la même cadhérine de la cellule voisine, en présence de <strong>Ca<sup>2+</sup></strong> (le nom vient de <em>calcium-dependent adhesion</em>). Côté cytosol, les cadhérines sont reliées par les <strong>caténines</strong> à un faisceau de filaments d'<strong>actine</strong>.</p>
<div class="cle"><b>Idée et exemple</b>La <strong>E-cadhérine</strong> (épithéliale) maintient les cellules épithéliales ensemble. Sa perte est une étape clé de l'invasion tumorale : les cellules de carcinome qui ne l'expriment plus se détachent et migrent, d'où des métastases.</div>

<h3>Les desmosomes</h3>
<p>Ce sont des points d'ancrage très solides, comme des boutons-pression entre deux cellules. Leurs protéines transmembranaires sont des cadhérines particulières, les <strong>desmogléines</strong> et les <strong>desmocollines</strong>. Côté cytosol, une plaque dense (desmoplakine) les relie aux <strong>filaments intermédiaires</strong> : kératines dans l'épiderme, desmine dans le muscle cardiaque. Les desmosomes abondent là où les contraintes sont fortes : <strong>épiderme</strong>, <strong>myocarde</strong>.</p>

<h3>Les hémidesmosomes et les contacts focaux</h3>
<p>Ils attachent la cellule à la <strong>matrice</strong>, par une <strong>intégrine</strong> qui se lie à des protéines de la matrice (la laminine de la lame basale, par exemple). Dans l'<strong>hémidesmosome</strong>, l'intégrine est reliée aux <strong>filaments intermédiaires</strong> (kératines) ; dans le <strong>contact focal</strong>, elle est reliée à l'<strong>actine</strong> des fibres de stress et sert notamment à la migration.</p>
<div class="cle"><b>Idée et exemple : deux maladies bulleuses auto-immunes</b>Dans le <strong>pemphigus</strong>, le patient fabrique des anticorps contre ses propres <strong>desmogléines</strong>. Les cellules de l'épiderme se détachent les unes des autres : des bulles se forment <em>dans</em> l'épiderme, fragiles, vite rompues en érosions, y compris dans la bouche. Dans la <strong>pemphigoïde bulleuse</strong>, plus fréquente chez le sujet âgé, les anticorps visent des protéines des <strong>hémidesmosomes</strong> : l'épiderme entier se décolle du derme, et les bulles, situées <em>sous</em> l'épiderme, sont tendues et solides.</div>

<h3>Les jonctions communicantes (gap)</h3>
<p>Six <strong>connexines</strong> forment un <strong>connexon</strong>, demi-canal qui traverse la membrane. Deux connexons alignés forment un canal d'environ 1,5 nm qui relie directement deux cytoplasmes. Y passent les <strong>ions</strong> et les petites molécules (jusqu'à environ 1 000 Da : glucose, AMPc), pas les protéines. Ces jonctions ne font pas adhérer les cellules et ne sont reliées à aucun filament.</p>
<p>Elles assurent un <strong>couplage électrique</strong>. Exemples : dans le <strong>myocarde</strong>, elles propagent la dépolarisation de cellule en cellule, si bien que le cœur se contracte d'un bloc ; dans l'utérus, leur nombre augmente fortement en fin de grossesse, ce qui synchronise les contractions de l'accouchement. Une mutation de la connexine 26 est la cause la plus fréquente des surdités héréditaires isolées de l'enfant.</p>
<div class="defile"><table>
<tr><th>Jonction</th><th>Protéine transmembranaire</th><th>Relie la cellule à…</th><th>Cytosquelette</th><th>Rôle</th></tr>
<tr><td><b>Serrée</b></td><td>claudines, occludine</td><td>la cellule voisine</td><td>actine</td><td>étanchéité, polarité</td></tr>
<tr><td><b>Adhérente</b></td><td>cadhérines (E-cadhérine)</td><td>la cellule voisine</td><td>actine (via les caténines)</td><td>adhérence</td></tr>
<tr><td><b>Desmosome</b></td><td>desmogléines, desmocollines</td><td>la cellule voisine</td><td>filaments intermédiaires</td><td>résistance mécanique</td></tr>
<tr><td><b>Hémidesmosome</b></td><td>intégrines</td><td>la lame basale</td><td>filaments intermédiaires</td><td>ancrage</td></tr>
<tr><td><b>Contact focal</b></td><td>intégrines</td><td>la matrice</td><td>actine</td><td>ancrage, migration</td></tr>
<tr><td><b>Communicante</b></td><td>connexines</td><td>la cellule voisine</td><td>aucun</td><td>passage d'ions et de petites molécules</td></tr>
</table></div>
<div class="piege"><b>Pièges de concours</b>Desmosomes et hémidesmosomes sont reliés aux <strong>filaments intermédiaires</strong> ; jonctions adhérentes et contacts focaux, à l'<strong>actine</strong>. Les <strong>cadhérines</strong> unissent deux cellules ; les <strong>intégrines</strong> unissent une cellule à la matrice. Les cadhérines exigent du Ca<sup>2+</sup>. Les jonctions communicantes ne font pas adhérer les cellules. Pemphigus : bulle <em>dans</em> l'épiderme (desmosomes) ; pemphigoïde : bulle <em>sous</em> l'épiderme (hémidesmosomes).</div>

<div class="cle"><b>Bilan</b>Actine (7 nm, ATP, myosines) : forme, mouvement, contraction, cytocinèse. Microtubules (25 nm, GTP, instabilité dynamique, kinésines vers le +, dynéines vers le −) : transport, cils 9 + 2, fuseau, cible de la colchicine et du taxol. Filaments intermédiaires (10 nm, non polarisés, propres à chaque tissu) : résistance mécanique, diagnostic des tumeurs. Jonctions serrées : étanchéité ; adhérentes et desmosomes : solidité ; hémidesmosomes : ancrage à la lame basale ; communicantes : échanges entre cellules.</div>

<details><summary>Hors programme : comment la cellule amorce ses filaments d'actine</summary>
<div class="hp"><b>Hors programme</b>Le <strong>complexe Arp2/3</strong> fait naître un filament sur le flanc d'un autre : il construit le réseau ramifié des lamellipodes, et <em>Listeria</em> le recrute. Les <strong>formines</strong> produisent des filaments longs et non ramifiés.</div>
</details>

<p class="lead">Une cellule consomme de l'ATP sans arrêt. L'essentiel sort des mitochondries, qui brûlent les nutriments avec l'oxygène respiré. Les peroxysomes réalisent d'autres oxydations et détruisent l'eau oxygénée qu'ils produisent. Cette fiche relie leur structure à leur fonction, puis aux maladies et aux poisons qui les touchent.</p>

<h2>1. La structure de la mitochondrie</h2>
<p>Les mitochondries sont des organites allongés d'environ <strong>0,5 à 1 µm de diamètre</strong> et de 1 à plusieurs µm de long : à peu près la taille d'une bactérie. Une cellule en contient de quelques centaines à quelques milliers, d'autant plus qu'elle dépense d'énergie. Elles occupent environ 22 % du volume d'un hépatocyte (chapitre 1), et environ 25 à 35 % de celui d'une cellule du muscle cardiaque. L'<strong>hématie</strong> mature, elle, n'en a <strong>aucune</strong>. Elles forment un réseau mobile qui fusionne et se divise sans cesse.</p>
<p>On y distingue quatre compartiments, de l'extérieur vers l'intérieur :</p>
<div class="defile"><table>
<tr><th>Compartiment</th><th>Caractéristiques</th><th>Ce qui s'y passe</th></tr>
<tr><td><b>Membrane externe</b></td><td>lisse ; percée de <strong>porines</strong>, de larges canaux qui laissent passer les molécules jusqu'à environ 5 000 Da</td><td>échanges avec le cytosol ; entrée des protéines importées</td></tr>
<tr><td><b>Espace intermembranaire</b></td><td>étroit ; pour les petites molécules, composition proche de celle du cytosol</td><td>accumulation des protons (H<sup>+</sup>) pompés par la chaîne respiratoire ; contient le <strong>cytochrome c</strong></td></tr>
<tr><td><b>Membrane interne</b></td><td>repliée en <strong>crêtes</strong> qui multiplient sa surface ; très riche en protéines (≈ 75 % de sa masse) et en <strong>cardiolipine</strong>, un phospholipide à quatre acides gras ; <strong>imperméable aux ions</strong>, H<sup>+</sup> compris</td><td>porte la <strong>chaîne respiratoire</strong> et l'<strong>ATP synthase</strong> ; transporteurs spécifiques (ADP/ATP, pyruvate, phosphate)</td></tr>
<tr><td><b>Matrice</b></td><td>gel très concentré en enzymes ; contient l'ADN mitochondrial et des ribosomes propres</td><td><strong>cycle de Krebs</strong>, oxydation du pyruvate, <strong>β-oxydation</strong> des acides gras</td></tr>
</table></div>
<figure><svg viewBox="0 0 340 222" width="340" role="img" aria-label="Coupe d'une mitochondrie : membrane externe, espace intermembranaire, membrane interne repliée en crêtes, matrice avec ADN et ribosomes"><rect x="20" y="64" width="300" height="104" rx="52" fill="var(--carte)" stroke="currentColor" stroke-width="2"/><path d="M72 74H91V119A5 5 0 0 0 101 119V74H147V119A5 5 0 0 0 157 119V74H203V119A5 5 0 0 0 213 119V74H268A42 42 0 0 1 268 158H241V113A5 5 0 0 0 231 113V158H185V113A5 5 0 0 0 175 113V158H129V113A5 5 0 0 0 119 113V158H72A42 42 0 0 1 72 74Z" fill="var(--m5)" fill-opacity=".14" stroke="var(--m5)" stroke-width="2"/><circle cx="56" cy="112" r="7" fill="none" stroke="var(--or)" stroke-width="1.8"/><circle cx="66" cy="132" r="5" fill="none" stroke="var(--or)" stroke-width="1.8"/><circle cx="281" cy="118" r="6" fill="none" stroke="var(--or)" stroke-width="1.8"/><circle cx="140" cy="146" r="2.2" fill="var(--m3)"/><circle cx="148" cy="139" r="2.2" fill="var(--m3)"/><circle cx="159" cy="147" r="2.2" fill="var(--m3)"/><circle cx="166" cy="138" r="2.2" fill="var(--m3)"/><circle cx="196" cy="92" r="2.2" fill="var(--m3)"/><circle cx="204" cy="100" r="2.2" fill="var(--m3)"/><circle cx="110" cy="92" r="2.2" fill="var(--m3)"/><circle cx="258" cy="136" r="2.2" fill="var(--m3)"/><circle cx="264" cy="146" r="2.2" fill="var(--m3)"/><g stroke="currentColor" stroke-width="1" opacity=".55" fill="none"><path d="M46 21L80 63"/><path d="M170 45V68"/><path d="M300 21L262 73"/><path d="M90 186L100 146"/><path d="M262 185L242 140"/><path d="M30 204L52 120"/><path d="M156 204V150"/></g><g font-family="system-ui,sans-serif" font-size="12" fill="currentColor"><text x="4" y="16">membrane externe</text><text x="170" y="40" text-anchor="middle">espace intermembranaire</text><text x="336" y="16" text-anchor="end" fill="var(--m5)">membrane interne</text><text x="70" y="198">matrice</text><text x="252" y="198" fill="var(--m5)">crête</text><text x="4" y="216" fill="var(--or)">ADN mitochondrial</text><text x="140" y="216" fill="var(--m3)">ribosomes</text></g></svg><figcaption>Les crêtes sont des replis de la membrane interne ; l'espace qu'elles enferment communique avec l'espace intermembranaire.</figcaption></figure>
<div class="cle"><b>Idée et exemple</b>Plus une cellule a besoin d'ATP, plus ses mitochondries sont nombreuses et riches en crêtes. Les cellules du muscle cardiaque en sont remplies. Les cellules qui fabriquent des hormones stéroïdes (corticosurrénale, gonades) ont des crêtes de forme <strong>tubulaire</strong> : une partie de la synthèse du cortisol se déroule dans leurs mitochondries.</div>
<div class="piege"><b>Piège de concours</b>C'est la membrane <strong>interne</strong>, et non l'externe, qui est imperméable aux ions et qui porte la chaîne respiratoire. La membrane externe, grâce à ses porines, est au contraire très perméable aux petites molécules.</div>

<h2>2. L'ADN mitochondrial</h2>
<p>La mitochondrie possède son propre génome, l'<strong>ADN mitochondrial</strong> (ADNmt) :</p>
<ul>
<li><strong>circulaire</strong>, double brin, sans histones, présent en plusieurs copies par mitochondrie, donc en centaines à milliers de copies par cellule ;</li>
<li>minuscule : environ <strong>16,6 kb</strong> (16 569 paires de bases) ;</li>
<li><strong>37 gènes</strong> : <strong>13 protéines</strong>, toutes des sous-unités de la chaîne respiratoire ou de l'ATP synthase, et 24 ARN (22 ARN de transfert et 2 ARN ribosomiques) qui servent à les traduire sur place ;</li>
<li>très compact, sans introns.</li>
</ul>
<p>Or une mitochondrie contient plus d'un millier de protéines. Toutes les autres sont codées par le <strong>noyau</strong>, fabriquées dans le cytosol puis <strong>importées</strong> à travers les deux membranes. Une maladie mitochondriale peut donc venir d'une mutation de l'ADNmt <em>ou</em> d'un gène nucléaire.</p>
<h3>Une hérédité maternelle</h3>
<p>L'ovocyte apporte au zygote plusieurs centaines de milliers de copies d'ADNmt. Les mitochondries du spermatozoïde, logées dans sa pièce intermédiaire, sont détruites peu après la fécondation. L'ADNmt se transmet donc <strong>par la mère seule</strong> : une mère porteuse d'une mutation peut la transmettre à tous ses enfants, filles et garçons ; un père porteur ne la transmet à aucun.</p>
<p>Une cellule peut contenir un mélange d'ADNmt normal et muté (<strong>hétéroplasmie</strong>). Les symptômes n'apparaissent qu'au-delà d'une certaine proportion de copies mutées (<strong>effet de seuil</strong>) : la gravité varie donc beaucoup entre enfants d'une même famille. Les organes les plus touchés sont les plus gourmands en énergie : cerveau, muscles, cœur, rétine, oreille interne.</p>
<div class="cle"><b>Idée et exemple : la neuropathie optique de Leber</b>Une mutation ponctuelle de l'ADNmt, dans un gène d'une sous-unité du complexe I de la chaîne respiratoire, provoque une perte brutale de la vision centrale chez l'adolescent ou l'adulte jeune, plus souvent chez l'homme. Les cellules du nerf optique, très consommatrices d'ATP, meurent les premières. La mutation se transmet par la mère, mais tous les porteurs ne tombent pas malades. Autre exemple, le <strong>syndrome MELAS</strong> associe atteinte musculaire, épisodes qui ressemblent à des accidents vasculaires cérébraux et <strong>acidose lactique</strong> (voir la fermentation, partie 5).</div>
<div class="piege"><b>Pièges de concours</b>« Toutes les protéines de la mitochondrie sont codées par l'ADNmt » : faux, seulement 13. « Une maladie mitochondriale se transmet toujours par la mère » : faux si le gène en cause est nucléaire (transmission mendélienne classique).</div>

<h2>3. Une ancienne bactérie</h2>
<div class="lienT"><b>Lien avec la Terminale</b>La mitochondrie descend d'une bactérie (une <strong>α-protéobactérie</strong>) englobée par une cellule hôte il y a environ 1,5 à 2 milliards d'années : c'est la <strong>théorie endosymbiotique</strong>, vue en SVT (chapitre 2, partie III). Arguments à citer : double membrane ; membrane interne riche en cardiolipine, comme celle des bactéries ; ADN circulaire sans histones ; ribosomes proches de ceux des bactéries ; division par scission. Au fil de l'évolution, la plupart des gènes de la bactérie sont passés dans le noyau.</div>
<p>Conséquence médicale : les aminosides (gentamicine), antibiotiques qui visent les ribosomes bactériens, peuvent aussi gêner les ribosomes mitochondriaux et rendre sourd, surtout en cas de mutation particulière de l'ARN ribosomique mitochondrial.</p>

<h2>4. La respiration cellulaire</h2>
<p>La respiration cellulaire oxyde complètement les nutriments, par exemple le glucose, et récupère l'énergie libérée sous forme d'<strong>ATP</strong> :</p>
<p><strong>C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6 O<sub>2</sub> → 6 CO<sub>2</sub> + 6 H<sub>2</sub>O + énergie</strong></p>
<div class="def"><b>Définition</b>L'<strong>ATP</strong> (adénosine triphosphate) est la « monnaie énergétique » de la cellule. Son hydrolyse en ADP + phosphate (P<sub>i</sub>) libère environ <strong>30 kJ/mol</strong> dans les conditions standard, davantage dans la cellule. L'organisme n'en stocke presque pas : il le régénère en continu.</div>
<p>Les électrons arrachés aux nutriments sont confiés à deux <strong>coenzymes transporteurs</strong> : le NAD<sup>+</sup>, qui devient <strong>NADH</strong>, et le FAD, qui devient <strong>FADH<sub>2</sub></strong>. Ils alimentent la chaîne respiratoire. Le glucose est traité en quatre étapes.</p>
<h3>Étape 1 : la glycolyse, dans le cytosol</h3>
<p>Une molécule de glucose (6 carbones) est coupée en <strong>2 pyruvates</strong> (3 carbones). Bilan net : <strong>2 ATP</strong> et <strong>2 NADH</strong>. La glycolyse ne consomme <strong>pas d'oxygène</strong> : c'est la seule voie qui reste quand l'O<sub>2</sub> manque.</p>
<h3>Étape 2 : l'oxydation du pyruvate, dans la matrice</h3>
<p>Dans la matrice, le complexe de la <strong>pyruvate déshydrogénase</strong> transforme le pyruvate en <strong>acétyl-CoA</strong> (2 carbones), en libérant <strong>1 CO<sub>2</sub></strong> et <strong>1 NADH</strong>. Ce complexe a besoin d'un coenzyme dérivé de la vitamine B1 (chapitre des enzymes).</p>
<h3>Étape 3 : le cycle de Krebs, dans la matrice</h3>
<p>L'acétyl-CoA se combine à l'oxaloacétate (4 C) pour former du citrate (6 C), oxydé ensuite pas à pas jusqu'à régénérer l'oxaloacétate. Chaque tour produit <strong>2 CO<sub>2</sub></strong>, <strong>3 NADH</strong>, <strong>1 FADH<sub>2</sub></strong> et <strong>1 GTP</strong> (l'équivalent d'un ATP). Il faut <strong>deux tours</strong> par glucose. C'est aussi le carrefour où aboutissent les acides gras et une partie des acides aminés.</p>
<h3>Étape 4 : la chaîne respiratoire et l'ATP synthase, sur la membrane interne</h3>
<p>Le NADH et le FADH<sub>2</sub> cèdent leurs électrons à quatre complexes protéiques, qui se les passent grâce à deux transporteurs mobiles, l'<strong>ubiquinone</strong> (coenzyme Q, dans la membrane) et le <strong>cytochrome c</strong> (dans l'espace intermembranaire), jusqu'à l'<strong>O<sub>2</sub>, accepteur final</strong>, réduit en eau au niveau du complexe IV.</p>
<ul>
<li>Complexe I (NADH déshydrogénase) : reçoit les électrons du NADH.</li>
<li>Complexe II (succinate déshydrogénase) : reçoit ceux du FADH<sub>2</sub> ; c'est aussi une enzyme du cycle de Krebs.</li>
<li>Complexe III, puis complexe IV (<strong>cytochrome c oxydase</strong>), qui transfère les électrons à l'O<sub>2</sub>.</li>
</ul>
<p>L'énergie libérée par ce transfert sert aux complexes <strong>I, III et IV</strong> à <strong>pomper des protons</strong> de la matrice vers l'espace intermembranaire (le complexe II n'en pompe pas). Comme la membrane interne est imperméable aux ions, il se crée un <strong>gradient électrochimique de protons</strong>, comparable à l'eau retenue par un barrage. Les protons ne peuvent revenir dans la matrice qu'en traversant l'<strong>ATP synthase</strong> : ce flux fait tourner une partie de l'enzyme, et cette rotation assemble l'ATP à partir d'ADP et de P<sub>i</sub>.</p>

ui,sans-serif" font-size="11" fill="var(--or)">trajet des électrons</text></svg><figcaption>Sur la membrane interne (bande grise), les complexes I, III et IV pompent des protons ; leur retour par l'ATP synthase fabrique l'ATP. Q : ubiquinone ; c : cytochrome c.</figcaption></figure>
<div class="def"><b>Définition</b>La <strong>phosphorylation oxydative</strong> est la synthèse d'ATP couplée au transfert d'électrons vers l'O<sub>2</sub>, par l'intermédiaire du gradient de protons. Ce mécanisme, le <strong>couplage chimiosmotique</strong>, a été proposé par Peter Mitchell en 1961 (prix Nobel 1978).</div>
<h3>Le bilan</h3>
<div class="defile"><table>
<tr><th>Étape (pour 1 glucose)</th><th>Lieu</th><th>ATP produits directement</th><th>Coenzymes réduits</th><th>CO<sub>2</sub></th></tr>
<tr><td>Glycolyse</td><td>cytosol</td><td>2</td><td>2 NADH</td><td>0</td></tr>
<tr><td>Oxydation des 2 pyruvates</td><td>matrice</td><td>0</td><td>2 NADH</td><td>2</td></tr>
<tr><td>Cycle de Krebs (2 tours)</td><td>matrice</td><td>2 (GTP)</td><td>6 NADH, 2 FADH<sub>2</sub></td><td>4</td></tr>
<tr><td>Phosphorylation oxydative</td><td>membrane interne</td><td>≈ 26 à 28</td><td>réoxyde les 10 NADH et les 2 FADH<sub>2</sub></td><td>0</td></tr>
</table></div>
<p>Chaque NADH rapporte environ <strong>2,5 ATP</strong> et chaque FADH<sub>2</sub> environ <strong>1,5 ATP</strong>. Le total est donc d'environ <strong>30 à 32 ATP par glucose</strong>, dont près de 90 % viennent de la phosphorylation oxydative. Les manuels anciens donnaient 36 à 38 ATP (3 par NADH, 2 par FADH<sub>2</sub>) : ces valeurs ont été <strong>révisées à la baisse</strong> quand on a mesuré le nombre réel de protons nécessaires par ATP, transport de l'ADP, de l'ATP et du phosphate compris. Le reste de l'énergie part en <strong>chaleur</strong>.</p>
<div class="piege"><b>Pièges de concours</b>Le CO<sub>2</sub> est produit dans la <strong>matrice</strong> (pyruvate déshydrogénase et cycle de Krebs), pas par la chaîne respiratoire ; l'O<sub>2</sub> consommé finit dans l'<strong>eau</strong>, pas dans le CO<sub>2</sub>. La glycolyse se déroule dans le <strong>cytosol</strong>, pas dans la mitochondrie. Seule enzyme du cycle de Krebs à ne pas être libre dans la matrice : la succinate déshydrogénase, enchâssée dans la membrane interne (c'est le complexe II).</div>

<h2>5. Sans oxygène : la fermentation lactique</h2>
<p>Quand l'O<sub>2</sub> manque, la chaîne respiratoire s'arrête faute d'accepteur final. Le NADH n'est plus réoxydé et le NAD<sup>+</sup> vient à manquer, ce qui bloquerait aussi la glycolyse. La <strong>lactate déshydrogénase</strong> (LDH) réduit alors le pyruvate en <strong>lactate</strong>, ce qui régénère le NAD<sup>+</sup>. La glycolyse peut continuer, mais ne fournit que <strong>2 ATP par glucose</strong>, soit environ 15 fois moins que la respiration.</p>
<div class="cle"><b>Idée et exemple : le muscle à l'effort</b>Pendant un effort intense et bref (un 400 m couru à fond), l'apport d'O<sub>2</sub> ne suit plus la demande des fibres musculaires : elles fermentent, et le lactate passe dans le sang. Le foie le reconvertit en glucose (<strong>cycle de Cori</strong>) et le cœur l'utilise comme carburant. Contrairement à une idée reçue, les <strong>courbatures</strong> du lendemain ne sont pas dues au lactate, éliminé dans l'heure qui suit l'effort, mais à de petites lésions des fibres musculaires.</div>
<p>L'<strong>hématie</strong>, sans mitochondries, tire tout son ATP de la glycolyse suivie de la fermentation lactique. En réanimation, une <strong>lactatémie</strong> élevée (la normale est inférieure à environ 2 mmol/L) signale que des tissus manquent d'oxygène, par exemple au cours d'un état de choc.</p>

<h2>6. Les poisons de la chaîne respiratoire</h2>
<p>Bloquer la chaîne respiratoire prive les cellules d'ATP ; le cœur et le cerveau, les plus gourmands, sont touchés les premiers.</p>
<div class="defile"><table>
<tr><th>Poison</th><th>Cible</th><th>Circonstances</th><th>Traitement</th></tr>
<tr><td><b>Cyanure</b> (CN<sup>−</sup>)</td><td>se fixe sur le fer de la <strong>cytochrome c oxydase</strong> (complexe IV) : les électrons ne passent plus à l'O<sub>2</sub></td><td>fumées d'incendie (plastiques, laine), industrie, amandes de noyaux d'abricot</td><td>antidote : l'<strong>hydroxocobalamine</strong> (une forme de vitamine B12), qui capte le cyanure</td></tr>
<tr><td><b>Monoxyde de carbone</b> (CO)</td><td>surtout l'<strong>hémoglobine</strong>, qu'il fixe environ 200 fois mieux que l'O<sub>2</sub> (carboxyhémoglobine) ; il inhibe aussi le complexe IV</td><td>chaudières mal entretenues, braseros en lieu clos, incendies ; gaz incolore et inodore</td><td>oxygène à fort débit, parfois en caisson hyperbare</td></tr>
</table></div>
<div class="cle"><b>Idée et exemple : la victime d'incendie</b>Une victime de fumées d'incendie est souvent intoxiquée à la fois par le CO et par le cyanure. Dans l'intoxication au cyanure, le sang reste bien oxygéné mais les cellules ne peuvent plus utiliser l'O<sub>2</sub> : le sang veineux reste rouge vif, et une <strong>acidose lactique</strong> apparaît, signe que les cellules se sont rabattues sur la fermentation.</div>

<h2>7. La mitochondrie et l'apoptose</h2>
<p>La mitochondrie décide aussi de la mort de la cellule. L'<strong>apoptose</strong> est une mort programmée, propre et sans inflammation (chapitre de la membrane).</p>
<p>Dans la <strong>voie mitochondriale</strong> (ou intrinsèque), un stress grave (ADN endommagé, par exemple) active des protéines de la famille <strong>Bcl-2</strong> (Bax, Bak) qui percent la membrane externe. Le <strong>cytochrome c</strong> s'échappe alors de l'espace intermembranaire vers le cytosol. Il s'y associe à la protéine Apaf-1 pour former l'<strong>apoptosome</strong>, qui active une cascade de protéases, les <strong>caspases</strong> (caspase 9, puis caspase 3), qui découpent les protéines de la cellule. Bcl-2 lui-même, au contraire, empêche cette fuite et protège la cellule.</p>
<div class="cle"><b>Idée et exemple</b>Le cytochrome c a deux rôles selon l'endroit où il se trouve : transporteur d'électrons dans l'espace intermembranaire, signal de mort dans le cytosol. Certains cancers du sang fabriquent trop de Bcl-2 : leurs cellules ne meurent plus quand elles le devraient. Un médicament, le <strong>vénétoclax</strong>, bloque Bcl-2 et rend à ces cellules la capacité d'entrer en apoptose ; il est utilisé dans la leucémie lymphoïde chronique.</div>

<h2>8. Les peroxysomes</h2>
<p>Les peroxysomes sont de petites vésicules d'environ 0,1 à 1 µm, limitées par <strong>une seule membrane</strong>. Ils n'ont <strong>ni ADN ni ribosomes</strong> : toutes leurs protéines (au moins une cinquantaine d'enzymes) sont fabriquées dans le cytosol puis importées grâce à un court signal d'adressage. Ils sont particulièrement nombreux dans le <strong>foie</strong> et le <strong>rein</strong>.</p>
<h3>Des oxydations qui produisent de l'eau oxygénée</h3>
<p>Leurs <strong>oxydases</strong> utilisent l'O<sub>2</sub> pour oxyder divers substrats (notés RH<sub>2</sub>) en produisant du <strong>peroxyde d'hydrogène</strong> (H<sub>2</sub>O<sub>2</sub>, l'eau oxygénée), toxique :</p>
<p><strong>RH<sub>2</sub> + O<sub>2</sub> → R + H<sub>2</sub>O<sub>2</sub></strong></p>
<p>La <strong>catalase</strong>, enzyme marqueur du peroxysome, le détruit aussitôt (2 H<sub>2</sub>O<sub>2</sub> → 2 H<sub>2</sub>O + O<sub>2</sub>), ou s'en sert pour oxyder d'autres molécules, dont une partie de l'alcool dans le foie. Contrairement à la mitochondrie, ces oxydations ne fabriquent <strong>pas d'ATP</strong> : l'énergie part en chaleur.</p>
<h3>Le métabolisme des lipides</h3>
<ul>
<li>La <strong>β-oxydation des acides gras à très longue chaîne</strong> (22 carbones et plus) commence obligatoirement dans le peroxysome, qui les raccourcit ; les chaînes raccourcies sont achevées dans la mitochondrie. Les acides gras plus courts sont oxydés directement dans la mitochondrie.</li>
<li>La synthèse des <strong>plasmalogènes</strong>, des phospholipides abondants dans la <strong>myéline</strong>.</li>
</ul>
<div class="cle"><b>Idée et exemple : l'adrénoleucodystrophie liée à l'X</b>Le gène <em>ABCD1</em>, porté par le chromosome X, code un transporteur de la membrane du peroxysome qui y fait entrer les acides gras à très longue chaîne. Muté, il les laisse s'accumuler dans le sang et les tissus. Chez le garçon, qui n'a qu'un X, la forme cérébrale détruit la myéline du cerveau, souvent entre 4 et 10 ans, et s'associe à une insuffisance des glandes surrénales. On dose ces acides gras dans le plasma pour le diagnostic ; une greffe de cellules souches hématopoïétiques, faite tôt, peut stopper l'évolution. Plus grave, le <strong>syndrome de Zellweger</strong> (mutation d'un gène <em>PEX</em>) empêche la formation de peroxysomes fonctionnels : le nourrisson meurt le plus souvent avant un an.</div>
<div class="defile"><table>
<tr><th></th><th>Mitochondrie</th><th>Peroxysome</th></tr>
<tr><td>Membranes</td><td>deux</td><td>une</td></tr>
<tr><td>ADN, ribosomes</td><td>oui</td><td>non</td></tr>
<tr><td>Devenir de l'O<sub>2</sub></td><td>réduit en H<sub>2</sub>O par la chaîne respiratoire</td><td>réduit en H<sub>2</sub>O<sub>2</sub> par les oxydases</td></tr>
<tr><td>Production d'ATP</td><td>oui, l'essentiel de celui de la cellule</td><td>non</td></tr>
<tr><td>β-oxydation</td><td>acides gras courts, moyens et longs</td><td>acides gras à très longue chaîne (début)</td></tr>
</table></div>
<div class="piege"><b>Piège de concours</b>Ne pas confondre peroxysome et lysosome, deux vésicules à une membrane. Le lysosome contient des <strong>hydrolases acides</strong> et digère ; le peroxysome contient des <strong>oxydases et la catalase</strong> et oxyde. Le peroxysome ne bourgeonne pas de l'appareil de Golgi et ne produit pas d'ATP.</div>

<div class="cle"><b>Bilan</b>La mitochondrie, ancienne bactérie à deux membranes et à ADN circulaire maternel, fait le cycle de Krebs dans sa matrice et la phosphorylation oxydative sur sa membrane interne : électrons jusqu'à l'O<sub>2</sub>, gradient de protons, ATP synthase, environ 30 à 32 ATP par glucose. Sans O<sub>2</sub>, la fermentation lactique n'en donne que 2. Le cyanure et le CO bloquent la chaîne ; le cytochrome c libéré déclenche l'apoptose. Le peroxysome, à une membrane et sans ADN, produit de l'H<sub>2</sub>O<sub>2</sub> détruite par la catalase et raccourcit les acides gras à très longue chaîne.</div>

<details><summary>Hors programme : le découplage et la graisse brune</summary>
<div class="hp"><b>Hors programme</b>Si les protons rentrent dans la matrice sans passer par l'ATP synthase, la chaîne respiratoire tourne « à vide » : l'énergie part en chaleur. Le nouveau-né utilise ce <strong>découplage</strong> pour se réchauffer : sa <strong>graisse brune</strong>, très riche en mitochondries, possède une protéine, la <strong>thermogénine</strong> (UCP1), qui laisse fuir les protons à travers la membrane interne.</div>
</details>

<p class="lead">Une protéine est une chaîne d'acides aminés repliée dans une forme précise, et c'est cette forme qui lui donne sa fonction. On décrit cette construction en quatre niveaux, de la séquence à l'assemblage de plusieurs chaînes.</p>

<h2>1. La liaison peptidique</h2>
<div class="def"><b>Définition</b>La <strong>liaison peptidique</strong> unit la fonction α-carboxyle (–COOH) d'un acide aminé à la fonction α-amine (–NH<sub>2</sub>) du suivant. Sa formation libère une molécule d'<strong>eau</strong> (condensation). C'est une liaison <strong>amide</strong> : –CO–NH–.</div>
<figure><svg viewBox="0 0 330 120" width="330" role="img" aria-label="La liaison peptidique est plane">
<rect x="96" y="22" width="140" height="78" rx="10" fill="var(--accent)" opacity=".12"/>
<g font-family="system-ui,sans-serif" font-size="17" fill="currentColor" text-anchor="middle">
<text x="60" y="66">C<tspan font-size="11" dy="-7">α</tspan></text>
<text x="128" y="66" font-weight="700">C</text><text x="128" y="22" font-size="15">O</text>
<text x="204" y="66" font-weight="700">N</text><text x="204" y="112" font-size="15">H</text>
<text x="272" y="66">C<tspan font-size="11" dy="-7">α</tspan></text></g>
<g stroke="currentColor" stroke-width="2"><line x1="76" y1="60" x2="116" y2="60"/><line x1="140" y1="60" x2="190" y2="60"/><line x1="140" y1="65" x2="190" y2="65" stroke-dasharray="4 4"/><line x1="124" y1="44" x2="124" y2="28"/><line x1="132" y1="44" x2="132" y2="28"/><line x1="204" y1="72" x2="204" y2="96"/><line x1="218" y1="60" x2="258" y2="60"/></g>
<text x="165" y="18" font-family="system-ui,sans-serif" font-size="11" fill="var(--accent)" text-anchor="middle">plan rigide</text>
</svg><figcaption>Les six atomes encadrés sont dans le même plan ; la liaison C–N a un caractère partiel de double liaison (pointillé).</figcaption></figure>
<p>Ses propriétés, très interrogées :</p>
<ul>
<li>par <strong>résonance</strong> (mésomérie) entre C=O et C–N, la liaison C–N a un <strong>caractère partiel de double liaison</strong> : elle est plus courte qu'une liaison simple et <strong>ne tourne pas</strong> ;</li>
<li>les six atomes Cα–C(=O)–N(–H)–Cα sont <strong>coplanaires</strong> : la liaison est plane et rigide ;</li>
<li>la configuration <strong>trans</strong> (les deux Cα de part et d'autre) est très largement majoritaire ; la configuration cis se rencontre surtout devant une proline ;</li>
<li>la chaîne garde sa souplesse grâce aux rotations possibles <strong>de part et d'autre du Cα</strong> (angles φ et ψ).</li>
</ul>
<p>La liaison peptidique est stable. On la coupe par des <strong>enzymes</strong> (protéases) ou par une hydrolyse acide forte à chaud (HCl 6 mol/L, 110 °C, 24 h), qui a l'inconvénient de détruire le <strong>tryptophane</strong>.</p>

<h2>2. Peptides et protéines</h2>
<ul>
<li>Un acide aminé engagé dans une chaîne s'appelle un <strong>résidu</strong>.</li>
<li>Par convention, une séquence s'écrit de l'extrémité <strong>N-terminale</strong> (amine libre, à gauche) vers l'extrémité <strong>C-terminale</strong> (carboxyle libre, à droite). Ala-Gly et Gly-Ala sont donc deux dipeptides différents.</li>
<li>On parle d'<strong>oligopeptide</strong> pour quelques résidus, de <strong>polypeptide</strong> au-delà, et de <strong>protéine</strong> à partir d'environ 50 résidus.</li>
<li>Ordre de grandeur : un résidu pèse en moyenne <strong>110 Da</strong>. Une protéine de 300 acides aminés pèse donc environ 33 kDa.</li>
</ul>
<p>Exemples de peptides actifs : l'<strong>ocytocine</strong> et la <strong>vasopressine</strong> (hormone antidiurétique), 9 acides aminés chacune ; l'<strong>insuline</strong>, 51 acides aminés en deux chaînes A (21) et B (30) reliées par deux ponts disulfures.</p>

<h2>3. La structure primaire</h2>
<div class="def"><b>Définition</b>La <strong>structure primaire</strong> est la <strong>séquence</strong> des acides aminés, de N- à C-terminal. Elle est dictée par le gène.</div>
<div class="cle"><b>Idée et exemple</b>La séquence contient toute l'information nécessaire au repliement. <strong>Expérience d'Anfinsen</strong> (années 1950-1960, prix Nobel 1972) : la ribonucléase, dépliée par l'urée et le β-mercaptoéthanol, perd son activité ; quand on retire lentement ces agents, elle se replie seule et retrouve son activité.</div>
<div class="cle"><b>Idée et exemple</b>Changer un seul acide aminé peut suffire à rendre malade. Dans la <strong>drépanocytose</strong>, l'hémoglobine S porte une <strong>valine à la place d'un glutamate en position 6 de la chaîne β</strong>. Ce résidu apolaire en surface fait s'agréger les hémoglobines quand elles manquent d'oxygène, et les hématies se déforment en faucille.</div>
<div class="lienT"><b>Lien avec la Terminale</b>Les familles multigéniques (globines, TP du chapitre 1 de SVT) se comparent justement par leurs structures primaires.</div>

<h2>4. La structure secondaire</h2>
<div class="def"><b>Définition</b>La <strong>structure secondaire</strong> est un repliement <strong>local</strong> et régulier de la chaîne, stabilisé par des <strong>liaisons hydrogène entre les C=O et les N–H de la chaîne principale</strong> (pas entre les chaînes latérales).</div>
<h3>L'hélice α</h3>
<ul>
<li>hélice <strong>droite</strong>, <strong>3,6 résidus par tour</strong>, pas de 0,54 nm ;</li>
<li>le C=O du résidu <em>n</em> est lié par liaison hydrogène au N–H du résidu <strong><em>n</em> + 4</strong>, parallèlement à l'axe ;</li>
<li>les chaînes latérales pointent <strong>vers l'extérieur</strong> de l'hélice ;</li>
<li>la <strong>proline</strong> casse les hélices (son azote n'a pas de H et son cycle bloque la rotation) ; la glycine, trop souple, les déstabilise aussi.</li>
</ul>
<p>Exemple : les hélices transmembranaires (chapitre membrane) ; la kératine α des cheveux, faite d'hélices α enroulées entre elles.</p>
<h3>Le feuillet β</h3>
<ul>
<li>des segments étirés (<strong>brins β</strong>) côte à côte, reliés par des liaisons hydrogène <strong>entre brins voisins</strong> ;</li>
<li>brins <strong>parallèles</strong> (même sens) ou <strong>antiparallèles</strong> (sens opposés, liaisons hydrogène mieux alignées, plus stables) ;</li>
<li>aspect plissé ; les chaînes latérales pointent alternativement d'un côté et de l'autre du feuillet.</li>
</ul>
<p>Exemple : la fibroïne de la soie, faite presque entièrement de feuillets β.</p>
<p>Entre ces éléments, des <strong>coudes</strong> (souvent riches en glycine et en proline) et des <strong>boucles</strong> changent la direction de la chaîne.</p>

<h2>5. La structure tertiaire</h2>
<div class="def"><b>Définition</b>La <strong>structure tertiaire</strong> est la forme en trois dimensions d'une chaîne entière, stabilisée par des interactions entre <strong>chaînes latérales</strong>, parfois très éloignées dans la séquence.</div>
<ul>
<li>l'<strong>effet hydrophobe</strong>, force principale : les chaînes apolaires se regroupent <strong>au cœur</strong> de la protéine, loin de l'eau ; les chaînes polaires et chargées restent en surface ;</li>
<li>des <strong>liaisons hydrogène</strong>, des <strong>liaisons ioniques</strong> (ponts salins), des forces de van der Waals ;</li>
<li>des <strong>ponts disulfures</strong> entre cystéines : les seules liaisons <strong>covalentes</strong> de la liste, fréquentes dans les protéines extracellulaires (le cytosol, réducteur, les défait).</li>
</ul>
<p>Une grande protéine se replie souvent en plusieurs <strong>domaines</strong>, unités compactes qui se forment indépendamment et portent chacune une fonction.</p>
<div class="defile"><table>
<tr><th>Protéines globulaires</th><th>Protéines fibreuses</th></tr>
<tr><td>compactes, solubles</td><td>allongées, insolubles</td></tr>
<tr><td>rôles dynamiques : enzymes, transport (myoglobine, hémoglobine), anticorps</td><td>rôles de structure : collagène, kératine, fibroïne</td></tr>
</table></div>
<div class="cle"><b>Idée et exemple : le collagène</b>Protéine la plus abondante du corps, il est fait de <strong>trois chaînes enroulées en triple hélice</strong>. Sa séquence répète le motif <strong>Gly-X-Y</strong> (une glycine tous les trois résidus, la seule assez petite pour tenir au centre de la triple hélice), X étant souvent une proline et Y une hydroxyproline. L'hydroxylation de la proline exige de la <strong>vitamine C</strong> : sans elle, le collagène est fragile, c'est le <strong>scorbut</strong> (gencives qui saignent, mauvaise cicatrisation).</div>
<p>Le repliement est aidé dans la cellule par des <strong>protéines chaperons</strong>. Une protéine mal repliée peut s'agréger : les maladies à prions et la maladie d'Alzheimer impliquent des agrégats riches en feuillets β.</p>

<h2>6. La structure quaternaire</h2>
<div class="def"><b>Définition</b>La <strong>structure quaternaire</strong> est l'<strong>association de plusieurs chaînes polypeptidiques</strong> (sous-unités), le plus souvent par des liaisons non covalentes. Une protéine faite d'une seule chaîne n'en a pas.</div>
<div class="cle"><b>Idée et exemple : myoglobine et hémoglobine</b>La <strong>myoglobine</strong> du muscle est un monomère (une chaîne, un hème) : pas de structure quaternaire, courbe de fixation de l'O<sub>2</sub> hyperbolique. L'<strong>hémoglobine</strong> est un <strong>tétramère α<sub>2</sub>β<sub>2</sub></strong> : la fixation d'un O<sub>2</sub> sur une sous-unité facilite la fixation sur les autres (coopérativité), d'où une courbe <strong>sigmoïde</strong>. Cette propriété permet à l'hémoglobine de charger l'O<sub>2</sub> dans les poumons et de le libérer dans les tissus.</div>
<p>Autre exemple : les anticorps (IgG), faits de deux chaînes lourdes et deux chaînes légères reliées par des ponts disulfures.</p>

<h2>7. La dénaturation</h2>
<div class="def"><b>Définition</b>La <strong>dénaturation</strong> est la perte des structures secondaire, tertiaire et quaternaire, donc de la fonction, <strong>sans rupture des liaisons peptidiques</strong> : la structure primaire est conservée.</div>
<p>Agents dénaturants : la <strong>chaleur</strong>, les pH extrêmes, l'<strong>urée</strong>, les détergents (SDS), les solvants organiques. Les <strong>réducteurs</strong> (β-mercaptoéthanol) coupent les <strong>ponts disulfures</strong>, pas les liaisons peptidiques. La dénaturation est souvent irréversible (le blanc d'œuf cuit ne redevient pas transparent), parfois réversible (Anfinsen).</p>
<div class="piege"><b>Pièges de concours</b>Les liaisons hydrogène de la structure secondaire concernent la chaîne principale ; celles de la structure tertiaire, les chaînes latérales. « La dénaturation rompt les liaisons peptidiques » : faux. « Le β-mercaptoéthanol hydrolyse la protéine » : faux, il réduit les ponts disulfures.</div>

<div class="cle"><b>Bilan</b>Primaire : la séquence, liée par des liaisons peptidiques planes et trans. Secondaire : hélices α et feuillets β, tenus par des liaisons hydrogène du squelette. Tertiaire : la forme 3D, tenue surtout par l'effet hydrophobe et, à l'extérieur des cellules, par des ponts disulfures. Quaternaire : l'association de sous-unités, qui permet la coopérativité de l'hémoglobine.</div>

<details><summary>Hors programme : séparer les protéines par électrophorèse SDS-PAGE</summary>
<div class="hp"><b>Hors programme</b>Le SDS, détergent chargé négativement, dénature les protéines et les recouvre de charges négatives proportionnellement à leur longueur. Dans un gel de polyacrylamide soumis à un courant, elles migrent alors vers l'anode selon leur seule taille : les plus petites vont le plus loin. On en déduit leur masse.</div>
</details>
