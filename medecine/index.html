<p class="lead">Les glucides sont la première source d'énergie de l'organisme, mais aussi des réserves (glycogène), des matériaux (cellulose), des pièces de l'ADN et de l'ARN, et des signaux de reconnaissance à la surface des cellules. Tout part d'une petite famille de molécules, les oses.</p>

<h2>1. Classer les glucides</h2>
<ul>
<li>Les <strong>oses</strong> (monosaccharides, « sucres simples ») ne peuvent pas être hydrolysés en molécules plus petites. Beaucoup ont pour formule C<sub>n</sub>(H<sub>2</sub>O)<sub>n</sub>, d'où l'ancien nom d'« hydrates de carbone ».</li>
<li>Les <strong>osides</strong> libèrent des oses par hydrolyse. Les <strong>holosides</strong> ne contiennent que des oses : diholosides (2 oses), oligosides (quelques-uns), polyosides (des centaines à des milliers). Les <strong>hétérosides</strong> associent des oses à une partie non glucidique : glycoprotéines, glycolipides, nucléosides.</li>
</ul>
<p>Valeur énergétique des glucides digestibles : environ <strong>4 kcal (17 kJ) par gramme</strong>.</p>

<h2>2. Les oses : structure et nomenclature</h2>
<div class="def"><b>Définition</b>Un <strong>ose</strong> est une chaîne de 3 à 7 carbones portant une fonction <strong>carbonyle</strong> et une fonction <strong>alcool</strong> (–OH) sur chacun des autres carbones. Si le carbonyle est un <strong>aldéhyde</strong> (–CHO, en C1), c'est un <strong>aldose</strong> ; si c'est une <strong>cétone</strong> (C=O, en général en C2), c'est un <strong>cétose</strong>.</div>
<p>On combine fonction et nombre de carbones : le glucose est un <strong>aldohexose</strong> (aldose à 6 carbones), le fructose un <strong>cétohexose</strong>, le ribose un <strong>aldopentose</strong>. Les plus petits oses sont deux trioses : le <strong>glycéraldéhyde</strong> (aldose) et la <strong>dihydroxyacétone</strong> (cétose).</p>

<h3>Carbones asymétriques et séries D et L</h3>
<p>Un carbone qui porte quatre substituants différents est <strong>asymétrique</strong> : deux arrangements existent, images l'un de l'autre dans un miroir et non superposables, les <strong>énantiomères</strong>. Le glycéraldéhyde en a un (son C2), d'où le D- et le L-glycéraldéhyde. La dihydroxyacétone n'en a aucun : c'est le seul ose sans carbone asymétrique.</p>
<p>Un aldose à <em>n</em> carbones possède <em>n</em> − 2 carbones asymétriques, donc 2<sup><em>n</em>−2</sup> stéréo-isomères : il existe 16 aldohexoses (8 D et 8 L). Un cétohexose a 3 carbones asymétriques, donc 8 stéréo-isomères.</p>

<h3>La représentation de Fischer</h3>
<ul>
<li>La chaîne est verticale, le carbone le plus oxydé (le C1 d'un aldose) en haut.</li>
<li>Les liaisons horizontales pointent vers l'observateur, les verticales vers l'arrière.</li>
<li>La série dépend du <strong>carbone asymétrique le plus éloigné du carbonyle</strong> (l'avant-dernier carbone, le C5 d'un hexose) : –OH à <strong>droite</strong>, série <strong>D</strong> ; à <strong>gauche</strong>, série <strong>L</strong>.</li>
</ul>
<p>Les oses naturels de l'organisme sont presque tous de la série D.</p>

<div class="def"><b>Définition</b>Deux <strong>épimères</strong> sont des oses qui ne diffèrent que par la configuration d'<strong>un seul</strong> carbone asymétrique. Le galactose est l'épimère en C4 du glucose ; le mannose, son épimère en C2.</div>
<div class="cle"><b>Idée et exemple : la galactosémie congénitale</b>Un seul carbone de différence suffit pour que le galactose ait besoin de ses propres enzymes avant de rejoindre la voie du glucose. Dans la galactosémie congénitale, maladie héréditaire, l'une de ces enzymes manque : nourri au lait, le nouveau-né accumule du galactose et ses dérivés, qui sont toxiques (vomissements, ictère, atteinte du foie, cataracte). Le traitement est un régime sans lactose ni galactose.</div>
<div class="piege"><b>Pièges de concours</b>D et L ne disent rien du sens de rotation de la lumière polarisée, noté (+) dextrogyre ou (−) lévogyre : le D-glucose est dextrogyre mais le D-fructose est lévogyre. Glucose et fructose ne sont pas épimères : l'un est un aldose, l'autre un cétose ; ce sont des isomères de fonction, de même formule C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>.</div>

<h2>3. La cyclisation</h2>
<p>En solution, les oses de 5 carbones et plus existent surtout sous forme <strong>cyclique</strong>. Une fonction –OH de la chaîne réagit avec le carbonyle de la même molécule et forme un <strong>hémiacétal</strong> interne :</p>
<ul>
<li>pour le glucose, l'–OH du C5 réagit avec l'aldéhyde du C1 : on obtient un cycle à 6 sommets (5 carbones et 1 oxygène), dit <strong>pyranose</strong> ;</li>
<li>le fructose peut faire réagir l'–OH du C5 avec la cétone du C2 : cycle à 5 sommets (4 carbones et 1 oxygène), dit <strong>furanose</strong>, la forme qu'il a dans le saccharose. Le ribose de l'ARN et de l'ATP est lui aussi un furanose.</li>
</ul>
<h3>La représentation de Haworth</h3>
<p>Le cycle est dessiné à plat, vu en perspective, l'oxygène en arrière à droite. Règle de passage : un –OH à droite en Fischer est placé <strong>sous</strong> le plan en Haworth ; un –OH à gauche, <strong>au-dessus</strong>. Pour un ose D, le CH<sub>2</sub>OH (le C6) est au-dessus du plan.</p>
<h3>Les anomères α et β</h3>
<p>La cyclisation crée un nouveau carbone asymétrique, le <strong>carbone anomérique</strong> (C1 d'un aldose, C2 d'un cétose), qui porte l'–OH dit hémiacétalique. Deux formes en découlent, les <strong>anomères</strong> :</p>
<ul>
<li><strong>α</strong> : l'–OH anomérique est du côté opposé au CH<sub>2</sub>OH (sous le plan pour un ose D) ;</li>
<li><strong>β</strong> : l'–OH anomérique est du même côté que le CH<sub>2</sub>OH (au-dessus du plan).</li>
</ul>

<div class="def"><b>Définition</b>La <strong>mutarotation</strong> est l'interconversion spontanée des anomères α et β en solution, en passant par la forme ouverte. On la repère parce que le pouvoir rotatoire de la solution change jusqu'à un équilibre. Pour le glucose, cet équilibre contient environ <strong>un tiers d'α et deux tiers de β</strong>, et moins de 1 % de forme ouverte.</div>
<div class="piege"><b>Piège de concours</b>α et β ne sont pas des énantiomères : ils ne diffèrent que par le carbone anomérique (ce sont des épimères particuliers). L'α-D-glucose et le β-D-glucose sont tous deux de la série D.</div>

<h2>4. Les oses à connaître</h2>
<div class="defile"><table>
<tr><th>Ose</th><th>Type</th><th>Où on le trouve, rôle</th></tr>
<tr><td><b>D-glucose</b></td><td>aldohexose</td><td>carburant universel des cellules, sucre du sang ; unité de l'amidon, du glycogène et de la cellulose</td></tr>
<tr><td><b>D-fructose</b></td><td>cétohexose</td><td>fruits, miel ; avec le glucose dans le saccharose ; utilisé surtout par le foie</td></tr>
<tr><td><b>D-galactose</b></td><td>aldohexose, épimère en C4 du glucose</td><td>avec le glucose dans le lactose du lait ; dans des glycolipides et glycoprotéines</td></tr>
<tr><td><b>D-ribose</b></td><td>aldopentose</td><td>ARN, ATP, NAD</td></tr>
<tr><td><b>2-désoxy-D-ribose</b></td><td>aldopentose sans –OH en C2</td><td>ADN (le « désoxy » de l'acide désoxyribonucléique)</td></tr>
</table></div>
<p>Dérivés à connaître de nom : la <strong>N-acétylglucosamine</strong> (ose aminé des N-glycanes et de la chitine), l'<strong>acide sialique</strong> (au bout des chaînes du glycocalyx), l'<strong>acide glucuronique</strong> (le foie l'accroche à la bilirubine pour pouvoir l'éliminer).</p>

<h2>5. Le pouvoir réducteur</h2>
<p>Un ose dont le carbone anomérique est <strong>libre</strong> peut s'ouvrir et présenter sa fonction carbonyle, capable de <strong>réduire</strong> un oxydant doux. Test classique : la <strong>liqueur de Fehling</strong>, bleue (ions Cu<sup>2+</sup>), donne à chaud un précipité <strong>rouge brique</strong> d'oxyde de cuivre (Cu<sub>2</sub>O) avec un sucre réducteur.</p>
<p>Tous les oses sont réducteurs, <strong>y compris le fructose</strong> : en milieu basique, il se réarrange en aldose. Un diholoside est réducteur s'il garde au moins un carbone anomérique libre.</p>
<div class="cle"><b>Idée et exemple : l'hémoglobine glyquée (HbA1c)</b>Le glucose, par sa fonction carbonyle, se fixe lentement et sans enzyme sur les fonctions amine des protéines : c'est la <strong>glycation</strong>. Plus la glycémie est haute, plus la part d'hémoglobine glyquée augmente. Comme une hématie vit environ <strong>120 jours</strong>, le taux d'<strong>HbA1c</strong> reflète la glycémie moyenne des 2 à 3 derniers mois : c'est l'examen de suivi des diabétiques (≈ 4 à 6 % chez une personne non diabétique ; objectif fréquent chez le diabétique ≈ 7 %). La glycation des protéines des vaisseaux et du cristallin participe aux complications du diabète.</div>

<h2>6. La liaison osidique</h2>
<div class="def"><b>Définition</b>La <strong>liaison osidique</strong> (ou glycosidique) unit le <strong>carbone anomérique</strong> d'un ose à une fonction –OH d'une autre molécule (liaison O-osidique), avec élimination d'une molécule d'eau. Faite sur un azote, elle est N-osidique : c'est le cas entre la base azotée et le ribose d'un nucléotide, ou entre un N-glycane et une asparagine.</div>
<ul>
<li>On la nomme par la configuration (α ou β) du carbone anomérique engagé, suivie des numéros des carbones liés : α(1→4), β(1→4), α(1→6).</li>
<li>Une fois engagé, le carbone anomérique est <strong>bloqué</strong> : plus de mutarotation ni de pouvoir réducteur pour cet ose.</li>
<li>L'hydrolyse se fait par des enzymes, les <strong>glycosidases</strong>, spécifiques à la fois des oses et du type de liaison (α ou β).</li>
</ul>

<h2>7. Les diholosides</h2>
<div class="defile"><table>
<tr><th>Diholoside</th><th>Composition et liaison</th><th>Réducteur ?</th><th>Origine, enzyme</th></tr>
<tr><td><b>Maltose</b></td><td>glucose α(1→4) glucose</td><td>oui</td><td>digestion de l'amidon ; maltase</td></tr>
<tr><td><b>Lactose</b></td><td>galactose β(1→4) glucose</td><td>oui</td><td>sucre du lait (≈ 50 g/L dans le lait de vache, ≈ 70 g/L dans le lait maternel) ; lactase</td></tr>
<tr><td><b>Saccharose</b></td><td>glucose α(1→2)β fructose : la liaison unit les deux carbones anomériques</td><td><strong>non</strong></td><td>sucre de table (canne, betterave) ; saccharase</td></tr>
</table></div>
<div class="cle"><b>Idée et exemple : l'intolérance au lactose</b>La lactase est une enzyme de la bordure en brosse de l'intestin grêle. Chez la plupart des humains (environ deux tiers de la population mondiale), son activité baisse après le sevrage : c'est l'hypolactasie primaire de l'adulte, rare en Europe du Nord, majoritaire en Asie et en Afrique. Le lactose non digéré arrive dans le côlon : il y attire l'eau par osmose (diarrhée) et y est fermenté par les bactéries (gaz, ballonnements, douleurs). Le diagnostic repose sur un test respiratoire à l'hydrogène. Ce n'est pas une allergie : il suffit de réduire le lactose (les fromages affinés en contiennent très peu) ou de prendre de la lactase en comprimés.</div>

<h2>8. Les polyosides</h2>
<h3>Les réserves de glucose : amidon et glycogène</h3>
<ul>
<li>L'<strong>amidon</strong>, réserve des végétaux (céréales, pommes de terre, légumineuses), est la première source de glucides de notre alimentation. Il associe deux polymères de glucose :
 <ul>
 <li>l'<strong>amylose</strong> (≈ 20 à 30 %) : longue chaîne <strong>linéaire</strong> liée en <strong>α(1→4)</strong>, enroulée en hélice ; c'est elle qui se colore en bleu par l'eau iodée ;</li>
 <li>l'<strong>amylopectine</strong> (≈ 70 à 80 %) : chaînes α(1→4) portant des <strong>ramifications α(1→6)</strong> environ tous les 24 à 30 glucoses.</li>
 </ul></li>
<li>Le <strong>glycogène</strong>, réserve des animaux, est construit comme l'amylopectine mais <strong>plus ramifié</strong> (un branchement tous les 8 à 12 glucoses) et plus compact. Il est stocké surtout dans le <strong>foie</strong> et les <strong>muscles</strong>.</li>
</ul>
<p>Les ramifications multiplient les extrémités non réductrices, d'où les enzymes détachent les glucoses : le glycogène se mobilise très vite. Celui du foie maintient la glycémie entre les repas, car le foie possède la <strong>glucose-6-phosphatase</strong> qui libère le glucose dans le sang ; celui du muscle est consommé sur place, le muscle n'ayant pas cette enzyme.</p>
<div class="cle"><b>Idée et exemple : pourquoi stocker du glycogène plutôt que du glucose</b>La pression osmotique dépend du <strong>nombre</strong> de particules dissoutes, pas de leur taille. Une molécule de glycogène contient des dizaines de milliers de glucoses mais ne compte que pour une particule. Si l'hépatocyte gardait ce stock sous forme de glucose libre, l'eau entrerait massivement par osmose et la cellule gonflerait jusqu'à éclater (voir la fiche « La membrane plasmique »).</div>
<h3>La cellulose</h3>
<p>La <strong>cellulose</strong>, constituant des parois végétales, est la molécule organique la plus abondante sur Terre. C'est une chaîne <strong>linéaire</strong> de glucoses liés en <strong>β(1→4)</strong>. Avec cette liaison, chaque glucose est retourné par rapport au précédent : la chaîne est droite et rigide, et des chaînes parallèles s'associent par de très nombreuses liaisons hydrogène en <strong>microfibrilles</strong> insolubles et résistantes.</p>
<div class="cle"><b>Idée et exemple : pourquoi l'humain ne digère pas la cellulose</b>Nos enzymes digestives ne coupent que des liaisons précises : les α(1→4) et α(1→6) de l'amidon et du glycogène (amylases salivaire et pancréatique, puis enzymes de la bordure en brosse), la liaison du lactose, celle du saccharose. Nous n'avons pas de <strong>cellulase</strong>, l'enzyme qui hydrolyse la liaison β(1→4) entre deux glucoses. La cellulose traverse donc l'intestin grêle intacte : c'est une <strong>fibre alimentaire</strong>, qui augmente le volume des selles et facilite le transit. Les ruminants la digèrent grâce aux micro-organismes de leur panse, qui possèdent des cellulases.</div>
<div class="piege"><b>Pièges de concours</b>Le saccharose est le seul des trois diholosides à ne pas être réducteur : ses deux carbones anomériques sont engagés. « L'humain ne digère aucune liaison β » : faux, le lactose est lié en β(1→4) et la lactase (une β-galactosidase) le coupe. Ce qui nous manque, c'est l'enzyme de la cellulose.</div>
<p>Au bout de la digestion, seuls les <strong>oses</strong> sont absorbés par l'intestin, grâce à des transporteurs : SGLT1 pour le glucose et le galactose, GLUT5 pour le fructose. Autres polyosides à connaître de nom : la <strong>chitine</strong> (carapace des insectes, paroi des champignons) et les <strong>glycosaminoglycanes</strong>, faits d'unités de deux oses différents, comme l'acide hyaluronique de la synovie ou l'<strong>héparine</strong>, un anticoagulant.</p>

<h2>9. La glycémie et le diabète</h2>
<div class="def"><b>Définition</b>La <strong>glycémie</strong> est la concentration du glucose dans le plasma. À jeun, elle est normalement d'environ <strong>0,70 à 1,10 g/L</strong> (3,9 à 6,1 mmol/L ; la masse molaire du glucose étant 180 g/mol, 1 g/L ≈ 5,5 mmol/L). Deux heures après un repas, elle reste en général sous 1,40 g/L.</div>
<p>Elle est maintenue par deux hormones du pancréas endocrine (îlots de Langerhans) :</p>
<ul>
<li>l'<strong>insuline</strong> (cellules β), seule hormone <strong>hypoglycémiante</strong> : elle fait entrer le glucose dans le muscle et le tissu adipeux (transporteur GLUT4) et favorise son stockage en glycogène ;</li>
<li>le <strong>glucagon</strong> (cellules α), <strong>hyperglycémiant</strong> : il fait dégrader le glycogène du foie et fabriquer du glucose neuf (néoglucogenèse). L'adrénaline, le cortisol et l'hormone de croissance élèvent aussi la glycémie.</li>
</ul>
<p>Le cerveau consomme environ 120 g de glucose par jour et en dépend presque exclusivement : une <strong>hypoglycémie</strong> (seuil d'alerte habituel : 0,70 g/L chez le diabétique traité) donne sueurs, tremblements, confusion, voire coma.</p>
<div class="def"><b>Définition</b>Le <strong>diabète</strong> sucré est défini par une glycémie à jeun ≥ <strong>1,26 g/L</strong> (7 mmol/L) à deux reprises, ou ≥ 2 g/L (11,1 mmol/L) à n'importe quel moment avec des symptômes. Les recommandations internationales admettent aussi une HbA1c ≥ 6,5 %.</div>
<ul>
<li><strong>Type 1</strong> (≈ 10 % des cas) : destruction auto-immune des cellules β, donc manque d'insuline ; début souvent chez l'enfant ou l'adulte jeune ; traitement par insuline, à vie.</li>
<li><strong>Type 2</strong> (≈ 90 %) : <strong>résistance des tissus à l'insuline</strong> associée à un déficit progressif de sa sécrétion ; favorisé par le surpoids et la sédentarité ; traitement par l'hygiène de vie puis des médicaments (la metformine en premier), parfois l'insuline.</li>
</ul>
<div class="cle"><b>Idée et exemple : la glycosurie</b>Le rein filtre le glucose puis le réabsorbe entièrement grâce aux transporteurs SGLT, qui sont <strong>saturables</strong>. Au-delà d'une glycémie d'environ <strong>1,8 g/L</strong> (le seuil rénal), ils sont débordés : du glucose passe dans les urines (glycosurie) et entraîne de l'eau par osmose. D'où les signes du diabète déséquilibré : urines abondantes (polyurie) et soif intense (polydipsie). Une classe de médicaments du diabète de type 2, les <strong>gliflozines</strong>, bloque SGLT2 pour faire éliminer volontairement du glucose dans les urines.</div>
<div class="lienT"><b>Pour la suite</b>La régulation de la glycémie par l'insuline et le glucagon, et les deux types de diabète, relèvent de la physiologie : ils seront approfondis dans la suite du programme.</div>

<div class="cle"><b>Bilan</b>Aldoses ou cétoses de 3 à 7 carbones ; série D si l'–OH de l'avant-dernier carbone est à droite en Fischer. Cyclisés (pyranose, furanose), ils ont deux anomères, α et β, qui s'interconvertissent (mutarotation). Carbone anomérique libre : sucre réducteur ; engagé dans une liaison osidique : bloqué (saccharose non réducteur). Amidon et glycogène : glucose en α(1→4) et α(1→6), digérés ; cellulose : β(1→4), non digérée. Glycémie à jeun ≈ 0,70 à 1,10 g/L ; diabète à partir de 1,26 g/L.</div>

<details><summary>Hors programme : pourquoi le β domine</summary>
<div class="hp"><b>Hors programme</b>Le cycle pyranose n'est pas plat : il adopte une conformation en <strong>chaise</strong>. Dans le β-D-glucopyranose, tous les gros substituants (–OH et CH<sub>2</sub>OH) sont en position équatoriale, la plus dégagée ; dans l'anomère α, l'–OH du C1 est axial, plus encombré. C'est pourquoi la forme β est majoritaire à l'équilibre, et pourquoi le glucose est l'ose le plus répandu dans la nature.</div>
</details>

<p class="lead">Les lipides ne forment pas une famille chimique unique : ce qui les réunit, c'est une propriété, leur insolubilité dans l'eau. Elle explique tout leur destin dans l'organisme : stockage sans eau, membranes, transport sanguin dans des particules spéciales, et maladies quand ce transport se dérègle.</p>

<h2>1. Définition et classement</h2>
<div class="def"><b>Définition</b>Les <strong>lipides</strong> sont des molécules biologiques <strong>insolubles (ou très peu solubles) dans l'eau</strong> et solubles dans les solvants organiques (éther, chloroforme). Ils sont surtout faits de carbone et d'hydrogène, avec peu d'oxygène.</div>
<p>On les classe en deux groupes :</p>
<ul>
<li>les lipides <strong>à acides gras</strong>, liés par une liaison <strong>ester</strong> (ou amide dans les sphingolipides) : triglycérides, glycérophospholipides, sphingolipides, esters de cholestérol. Les liaisons ester sont coupées par une base forte à chaud : on dit ces lipides <strong>saponifiables</strong> ;</li>
<li>les lipides <strong>sans acide gras</strong>, construits à partir d'une petite unité à 5 carbones, l'isoprène : les <strong>stérols</strong> (cholestérol), les vitamines liposolubles A, D, E et K. Ils sont <strong>insaponifiables</strong>.</li>
</ul>

<h2>2. Les acides gras</h2>
<div class="def"><b>Définition</b>Un <strong>acide gras</strong> est un acide carboxylique à longue chaîne carbonée, en général <strong>non ramifiée</strong> et à <strong>nombre pair de carbones</strong> (le plus souvent de 14 à 24, surtout 16 et 18), car l'organisme les fabrique en ajoutant les carbones deux par deux.</div>
<p>C'est une molécule <strong>amphiphile</strong> : la fonction acide (–COOH) est polaire et, au pH du sang (≈ 7,4), elle est ionisée en carboxylate (–COO<sup>−</sup>) ; la longue chaîne est hydrophobe.</p>

<h3>La nomenclature</h3>
<p>Les carbones se numérotent <strong>à partir du carbone de la fonction acide</strong>, qui porte le numéro 1. Le dernier carbone, celui du groupe méthyle (–CH<sub>3</sub>) au bout de la chaîne, s'appelle le carbone <strong>ω</strong> (oméga).</p>
<ul>
<li><strong>Cn:m</strong> : n est le nombre de carbones, m le nombre de doubles liaisons. L'acide stéarique s'écrit C18:0 ; l'acide oléique, C18:1.</li>
<li><strong>Δ</strong> (delta) donne la position des doubles liaisons <strong>en partant de la fonction acide</strong> : Δ9 signifie une double liaison entre le carbone 9 et le carbone 10.</li>
<li><strong>ω</strong> (ou n−) donne la position de la <strong>première double liaison en partant du méthyle</strong>, le carbone ω comptant pour 1. On l'obtient par soustraction : ω = n − (position Δ de la dernière double liaison). Pour l'acide oléique, C18:1 Δ9 : 18 − 9 = 9, c'est un <strong>ω9</strong>.</li>
</ul>

2)">C18 = ω</text></g></svg><figcaption>Chaque sommet du zigzag est un carbone. Saturée, la chaîne est droite ; la double liaison cis la coude.</figcaption></figure>

<tr><th>Acide gras</th><th>Formule</th><th>Série</th><th>Où le trouve-t-on ?</th></tr>
<tr><td><b>Palmitique</b></td><td>C16:0</td><td>saturé</td><td>graisses animales, huile de palme ; le saturé le plus abondant du corps</td></tr>

<tr><td><b>Linoléique</b></td><td>C18:2 Δ9,12</td><td>ω6</td><td>huiles de tournesol, de maïs</td></tr>
<tr><td><b>α-linolénique</b></td><td>C18:3 Δ9,12,15</td><td>ω3</td><td>huiles de colza, de noix, de lin</td></tr>
<tr><td><b>Arachidonique</b></td><td>C20:4 Δ5,8,11,14</td><td>ω6</td><td>membranes ; précurseur des prostaglandines</td></tr>
<tr><td><b>EPA, DHA</b></td><td>C20:5, C22:6</td><td>ω3</td><td>poissons gras ; DHA abondant dans le cerveau et la rétine</td></tr>
</table></div>
<p>Dans les acides gras polyinsaturés naturels, les doubles liaisons sont séparées par un CH<sub>2</sub> : elles se suivent de 3 en 3 carbones (Δ9, 12, 15). Ce rythme permet de retrouver toutes les positions à partir d'une seule.</p>
<div class="piege"><b>Piège de concours</b>Δ se compte depuis la fonction acide, ω depuis le méthyle. L'acide linoléique est Δ9,12 <em>et</em> ω6 (18 − 12 = 6) : il n'y a là aucune contradiction. Autre classique : l'acide α-linolénique (C18:3, ω3) et l'acide linoléique (C18:2, ω6) ne diffèrent que d'une double liaison, mais n'appartiennent pas à la même série.</div>

<h3>Saturés et insaturés</h3>
<ul>
<li>Un acide gras <strong>saturé</strong> n'a aucune double liaison. Sa chaîne est droite ; les chaînes s'empilent serré et fondent à température élevée : les graisses riches en saturés (beurre, saindoux) sont <strong>solides</strong> à température ambiante. L'acide stéarique fond vers 70 °C.</li>
<li>Un acide gras <strong>insaturé</strong> porte une double liaison (<strong>mono-insaturé</strong>) ou plusieurs (<strong>polyinsaturé</strong>). Les doubles liaisons naturelles sont presque toutes <strong>cis</strong> : elles coudent la chaîne, qui s'empile mal. Les huiles, riches en insaturés, sont <strong>liquides</strong> ; l'acide oléique fond vers 13 °C.</li>
</ul>
<p>Le point de fusion monte avec la longueur de la chaîne et baisse avec le nombre de doubles liaisons. On retrouve la fluidité des membranes vue au chapitre précédent.</p>

<h3>Cis, trans et acides gras trans</h3>
<p>Dans une double liaison <strong>cis</strong>, les deux atomes d'hydrogène sont du même côté : la chaîne fait un coude. En <strong>trans</strong>, ils sont de part et d'autre : la chaîne reste presque droite et se comporte comme celle d'un acide gras saturé.</p>
<div class="cle"><b>Idée et exemple : les acides gras trans industriels</b>L'<strong>hydrogénation partielle</strong> des huiles végétales, longtemps utilisée pour fabriquer des margarines et des pâtisseries industrielles solides et stables, crée des doubles liaisons trans. Ces acides gras trans augmentent le LDL-cholestérol et diminuent le HDL-cholestérol : ils accroissent le risque d'infarctus. L'OMS recommande leur suppression, et l'Union européenne les limite strictement dans les aliments depuis 2021. Les graisses des ruminants (lait, viande) en contiennent naturellement de petites quantités.</div>

<h3>Les acides gras essentiels</h3>
<p>Nos cellules savent créer une double liaison en Δ9, mais pas au-delà du carbone 9 vers le méthyle. Elles ne peuvent donc pas fabriquer deux acides gras, qui doivent être apportés par l'alimentation : ils sont dits <strong>essentiels</strong>.</p>
<ul>
<li>l'<strong>acide linoléique</strong> (C18:2, <strong>ω6</strong>), tête de la série ω6, à partir duquel nous fabriquons l'acide arachidonique ;</li>
<li>l'<strong>acide α-linolénique</strong> (C18:3, <strong>ω3</strong>), tête de la série ω3, à partir duquel nous fabriquons, en petite quantité, l'EPA et le DHA.</li>
</ul>
<p>L'organisme allonge ces chaînes et y ajoute des doubles liaisons du côté de la fonction acide, mais il ne peut <strong>jamais passer d'une série à l'autre</strong> : un ω6 ne devient pas un ω3.</p>
<div class="cle"><b>Idée et exemple : l'aspirine</b>L'acide arachidonique (ω6), libéré des phospholipides membranaires, est transformé par la <strong>cyclo-oxygénase</strong> (COX) en prostaglandines (inflammation, douleur, fièvre) et en thromboxane (agrégation des plaquettes). L'<strong>aspirine</strong> et les anti-inflammatoires non stéroïdiens bloquent la COX : ils calment douleur, fièvre et inflammation ; à faible dose, l'aspirine prévient les caillots chez les patients à risque cardiovasculaire.</div>

<h2>3. Les triglycérides</h2>
<div class="def"><b>Définition</b>Un <strong>triglycéride</strong> (triacylglycérol) est formé d'une molécule de <strong>glycérol</strong> (un alcool à 3 carbones portant 3 fonctions –OH) dont chaque fonction alcool est estérifiée par un acide gras : <strong>3 liaisons ester</strong>. Les trois acides gras sont souvent différents.</div>
<p>Le triglycéride n'a plus aucune partie polaire libre : il est <strong>totalement hydrophobe</strong> (on dit neutre). Il ne peut donc pas former de membrane ; il se regroupe en gouttelettes. C'est la forme de <strong>stockage</strong> des acides gras, dans les <strong>adipocytes</strong> du tissu adipeux, qui contiennent chacun une grosse gouttelette.</p>
<div class="cle"><b>Idée et exemple : une réserve sans eau</b>Un gramme de triglycérides fournit environ <strong>9 kcal</strong>, contre environ 4 pour un gramme de glucides. Et les triglycérides se stockent <strong>sans eau</strong>, alors que le glycogène est très hydraté (environ 2 g d'eau par gramme). Résultat : un adulte de poids normal porte environ 10 à 15 kg de triglycérides, de quoi tenir plusieurs semaines de jeûne, alors que ses réserves de glycogène (quelques centaines de grammes) couvrent à peine une journée.</div>
<p>Au besoin, des <strong>lipases</strong> du tissu adipeux hydrolysent les triglycérides (<strong>lipolyse</strong>) en glycérol et en acides gras libres. Ces derniers voyagent dans le sang liés à l'<strong>albumine</strong> et sont oxydés dans les mitochondries des muscles et du foie (chapitre « mitochondrie »). Les hématies, sans mitochondries, ne peuvent pas les utiliser.</p>
<p>Dans l'intestin, la <strong>lipase pancréatique</strong> digère les triglycérides alimentaires, à condition que les sels biliaires les aient d'abord dispersés en fines gouttelettes (émulsion). Exemple : l'<strong>orlistat</strong>, médicament contre l'obésité, bloque les lipases digestives ; les graisses non digérées passent dans les selles, qui deviennent grasses (stéatorrhée).</p>
<h3>La saponification</h3>
<p>Chauffés avec une base forte (soude NaOH ou potasse KOH), les triglycérides sont hydrolysés : on obtient du <strong>glycérol</strong> et des sels d'acides gras, les <strong>savons</strong>. La réaction est totale. Le savon est amphiphile : il entoure les gouttelettes de graisse (têtes vers l'eau, queues vers la graisse) en <strong>micelles</strong> que l'eau emporte.</p>
<div class="piege"><b>Piège de concours</b>Le <strong>cholestérol</strong> n'a pas d'acide gras : il est <strong>insaponifiable</strong>. Ses <strong>esters</strong>, eux, sont saponifiables. Les triglycérides n'entrent pas dans les membranes : ils sont trop hydrophobes.</div>

<h2>4. Les lipides des membranes</h2>
<p>Rappel du chapitre sur la membrane : ces lipides sont <strong>amphiphiles</strong> et s'organisent en bicouche.</p>
<ul>
<li>Les <strong>glycérophospholipides</strong> sont construits sur le glycérol : deux acides gras sur les carbones 1 et 2, un <strong>phosphate</strong> sur le carbone 3, lui-même lié à un petit groupement (choline, éthanolamine, sérine, inositol). Exemple : la phosphatidylcholine. L'acide gras du carbone 2 est souvent insaturé, par exemple l'acide arachidonique ; une enzyme, la phospholipase A<sub>2</sub>, le libère quand la cellule en a besoin.</li>
<li>Les <strong>sphingolipides</strong> sont construits sur la <strong>sphingosine</strong>, un alcool aminé à longue chaîne. Sphingosine + acide gras (liaison amide) = <strong>céramide</strong>. Céramide + phosphocholine = <strong>sphingomyéline</strong>, abondante dans la myéline. Céramide + sucres = <strong>glycosphingolipides</strong> (cérébrosides, gangliosides), sur le feuillet externe.</li>
</ul>
<p>Exemple médical : les <strong>maladies de surcharge</strong>. Quand une enzyme du lysosome qui dégrade un sphingolipide manque, ce lipide s'accumule : glucocérébroside dans la maladie de Gaucher, ganglioside GM2 dans les neurones dans la maladie de Tay-Sachs.</p>

<h2>5. Le cholestérol</h2>
<h3>Structure</h3>
<p>Le cholestérol est un <strong>stérol</strong> à <strong>27 carbones</strong>, construit sur le <strong>noyau stérane</strong> : <strong>4 cycles accolés</strong> (trois à 6 carbones, nommés A, B, C, et un à 5 carbones, D). Il porte une fonction <strong>alcool (–OH) sur le carbone 3</strong>, sa seule partie polaire, une double liaison entre C5 et C6 et une chaîne carbonée ramifiée sur le carbone 17. Le noyau est plan et rigide. L'ensemble est très hydrophobe, à peine amphiphile.</p>
<p>Dans le sang et les cellules, une grande partie du cholestérol est <strong>estérifiée</strong> : un acide gras est fixé sur son –OH. L'<strong>ester de cholestérol</strong>, sans plus aucune partie polaire, est la forme de stockage et de transport.</p>
<h3>Origine</h3>
<p>Le cholestérol vient de l'alimentation (produits <strong>animaux</strong> seulement : œufs, abats, viandes, produits laitiers) et surtout d'une <strong>synthèse</strong> par l'organisme, principalement dans le foie, à partir de l'acétyl-CoA. L'enzyme qui limite cette synthèse est l'<strong>HMG-CoA réductase</strong>. Les végétaux n'en contiennent pas : ils ont d'autres stérols (phytostérols).</p>
<h3>Rôles</h3>
<ul>
<li><strong>Membranes</strong> : il règle leur fluidité (effet tampon vu au chapitre membrane).</li>
<li><strong>Hormones stéroïdes</strong> : cortisol et aldostérone (glande corticosurrénale), testostérone, œstradiol et progestérone (gonades, placenta). Toutes gardent le noyau stérane.</li>
<li><strong>Acides biliaires</strong> : le foie transforme le cholestérol en acides biliaires, sécrétés dans la bile sous forme de sels biliaires qui émulsionnent les graisses de l'intestin. C'est la principale voie d'<strong>élimination</strong> du cholestérol, car l'organisme ne sait pas détruire son noyau stérane.</li>
<li><strong>Vitamine D</strong> : dans la peau, les <strong>UVB</strong> transforment un dérivé du cholestérol (le 7-déhydrocholestérol) en vitamine D<sub>3</sub>, ensuite activée par deux hydroxylations successives, dans le foie puis dans le rein (calcitriol). Elle permet l'absorption intestinale du calcium ; sa carence provoque le rachitisme chez l'enfant.</li>
</ul>
<div class="cle"><b>Idée et exemple : les statines</b>Les <strong>statines</strong>, médicaments très prescrits, inhibent l'<strong>HMG-CoA réductase</strong>. Privées de leur synthèse, les cellules du foie fabriquent davantage de récepteurs aux LDL et captent plus de LDL dans le sang : le LDL-cholestérol baisse, et avec lui le risque d'infarctus et d'accident vasculaire cérébral.</div>

<h2>6. Le transport dans le sang : les lipoprotéines</h2>
<p>Le plasma est de l'eau : les triglycérides et le cholestérol ne peuvent pas y circuler seuls. Ils voyagent dans des <strong>lipoprotéines</strong>, particules sphériques faites :</p>
<ul>
<li>d'un <strong>cœur hydrophobe</strong> : triglycérides et esters de cholestérol ;</li>
<li>d'une <strong>enveloppe</strong> à <strong>une seule couche</strong> (et non une bicouche) de phospholipides et de cholestérol libre, têtes polaires vers le plasma ;</li>
<li>de protéines de surface, les <strong>apolipoprotéines</strong>, qui stabilisent la particule et servent d'adresse (reconnues par des récepteurs ou activant des enzymes).</li>
</ul>

<p>On les sépare par ultracentrifugation selon leur <strong>densité</strong> : plus une particule est riche en lipides, plus elle est grosse et légère ; plus elle est riche en protéines, plus elle est petite et dense.</p>
<div class="defile"><table>
<tr><th>Lipoprotéine</th><th>Fabriquée par</th><th>Contenu dominant</th><th>Rôle</th></tr>
<tr><td><b>Chylomicrons</b> (les plus gros, les moins denses)</td><td>l'intestin</td><td>triglycérides alimentaires</td><td>apporter les graisses du repas aux muscles et au tissu adipeux ; ils passent d'abord par la lymphe</td></tr>
<tr><td><b>VLDL</b> (très basse densité)</td><td>le foie</td><td>triglycérides fabriqués par le foie</td><td>les distribuer aux tissus ; appauvries en triglycérides, elles deviennent des LDL</td></tr>
<tr><td><b>LDL</b> (basse densité)</td><td>issues des VLDL</td><td><strong>cholestérol</strong> (estérifié)</td><td>apporter le cholestérol aux cellules, qui les captent par un récepteur aux LDL</td></tr>
<tr><td><b>HDL</b> (haute densité, les plus petites)</td><td>le foie, l'intestin</td><td>protéines, phospholipides</td><td>ramener le cholestérol en excès des tissus vers le foie</td></tr>
</table></div>
<p>Dans les capillaires des muscles et du tissu adipeux, une enzyme, la <strong>lipoprotéine lipase</strong>, hydrolyse les triglycérides des chylomicrons et des VLDL ; les acides gras libérés entrent dans les cellules. Après un repas très gras, les chylomicrons rendent le plasma trouble, voire laiteux ; à jeun, ils ont disparu.</p>
<div class="cle"><b>Idée et exemple : l'athérosclérose</b>Quand les LDL sont trop abondantes, elles s'infiltrent dans la paroi des artères, s'y oxydent et sont avalées par des macrophages, qui se gorgent de lipides (<strong>cellules spumeuses</strong>). Une <strong>plaque d'athérome</strong> se forme : un cœur lipidique sous une chape fibreuse. Elle rétrécit l'artère (angine de poitrine) ; si elle se rompt, un caillot se forme et bouche l'artère : <strong>infarctus du myocarde</strong> ou <strong>accident vasculaire cérébral</strong>. Dans l'<strong>hypercholestérolémie familiale</strong>, maladie génétique fréquente, le récepteur aux LDL est défectueux : les LDL s'accumulent dans le sang dès la naissance, et les infarctus surviennent tôt.</div>
<div class="piege"><b>Pièges de concours</b>« Bon » et « mauvais » cholestérol désignent la <strong>même molécule</strong> : seul le transporteur diffère (LDL vers les tissus, HDL vers le foie). Les chylomicrons sont les plus riches en triglycérides, les LDL les plus riches en cholestérol, les HDL les plus denses. L'enveloppe d'une lipoprotéine est une <strong>monocouche</strong>. Les acides gras libres voyagent liés à l'albumine, pas dans des lipoprotéines.</div>

<h2>7. Les rôles des lipides</h2>
<div class="defile"><table>
<tr><th>Rôle</th><th>Exemples</th></tr>
<tr><td><b>Énergie</b></td><td>≈ <strong>9 kcal/g</strong>, contre ≈ <strong>4 kcal/g</strong> pour les glucides et les protéines : leurs carbones, très réduits (pauvres en oxygène), ont plus d'électrons à céder lors de l'oxydation. Réserve : triglycérides du tissu adipeux</td></tr>
<tr><td><b>Structure</b></td><td>membranes (phospholipides, cholestérol, sphingolipides) ; myéline ; isolation thermique et amortissement (graisse autour des reins, sous la plante des pieds) ; surfactant pulmonaire, un mélange riche en phospholipides qui empêche les alvéoles de s'affaisser</td></tr>
<tr><td><b>Signalisation</b></td><td>hormones stéroïdes (qui traversent la membrane et agissent sur des récepteurs intracellulaires) ; prostaglandines et thromboxane (médiateurs locaux issus de l'acide arachidonique) ; dérivés du phosphatidylinositol (seconds messagers) ; vitamine D</td></tr>
<tr><td><b>Transport</b></td><td>absorption des vitamines liposolubles A, D, E et K, qui suivent les graisses du repas : une mauvaise absorption des graisses entraîne leur carence</td></tr>
</table></div>

<div class="cle"><b>Bilan</b>Lipides = insolubles dans l'eau. Acides gras : chaîne paire, Cn:m, Δ compté depuis la fonction acide, ω depuis le méthyle ; doubles liaisons naturelles cis ; deux essentiels, linoléique (ω6) et α-linolénique (ω3). Triglycérides : glycérol + 3 acides gras, réserve anhydre à 9 kcal/g, saponifiables. Phospholipides et sphingolipides : membranes. Cholestérol : 27 carbones, 4 cycles, –OH en 3, précurseur des stéroïdes, des acides biliaires et de la vitamine D. Transport : chylomicrons et VLDL (triglycérides), LDL (cholestérol vers les tissus, athérosclérose), HDL (retour au foie).</div>

<details><summary>Hors programme : le récepteur aux LDL et le prix Nobel</summary>
<div class="hp"><b>Hors programme</b>Brown et Goldstein (prix Nobel 1985) ont découvert le récepteur aux LDL en étudiant des enfants atteints de la forme homozygote de l'hypercholestérolémie familiale. Le récepteur reconnaît l'apolipoprotéine B-100 des LDL, qui sont alors captées par endocytose dans des vésicules recouvertes de clathrine (chapitre « système endomembranaire »), puis dégradées dans les lysosomes. Le cholestérol libéré freine à son tour la synthèse de l'HMG-CoA réductase et celle des récepteurs : une boucle de rétrocontrôle.</div>
</details>

<p class="lead">À 37 °C, presque toutes les réactions du vivant seraient beaucoup trop lentes sans catalyseur. Les enzymes les accélèrent de façon spécifique et réglable. Elles sont aussi la cible d'une grande partie des médicaments et, dosées dans le sang, des marqueurs de maladies.</p>

<h2>1. Qu'est-ce qu'une enzyme ?</h2>
<div class="def"><b>Définition</b>Une <strong>enzyme</strong> est un <strong>catalyseur biologique</strong>, presque toujours une protéine. Elle accélère une réaction sans être consommée : on la retrouve intacte à la fin, prête à recommencer. La molécule transformée est le <strong>substrat</strong>, celle qui est formée le <strong>produit</strong>.</div>
<p>Comme tout catalyseur, une enzyme :</p>
<ul>
<li><strong>abaisse l'énergie d'activation</strong>, la « marche » d'énergie à franchir pour passer des réactifs aux produits, en stabilisant l'<strong>état de transition</strong> (la forme intermédiaire, instable, de la réaction) ;</li>
<li><strong>ne modifie pas l'équilibre</strong> : elle accélère autant la réaction dans un sens que dans l'autre, et l'équilibre est seulement atteint plus vite ;</li>
<li><strong>ne rend pas possible une réaction impossible</strong> : elle ne change pas la variation d'énergie (ΔG) entre réactifs et produits. Une réaction défavorable doit être couplée à une réaction favorable, souvent l'hydrolyse de l'ATP ;</li>
<li>agit en très petite quantité, avec des accélérations considérables (souvent d'un facteur un million ou davantage).</li>
</ul>
<figure><svg viewBox="0 0 330 214" width="330" role="img" aria-label="Profil énergétique d'une réaction avec et sans enzyme : l'enzyme abaisse l'énergie d'activation sans changer l'écart entre réactifs et produits"><defs><marker id="bio5-fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--m4)"/></marker><marker id="bio5-fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--accent)"/></marker><marker id="bio5-fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker></defs><path d="M36 190V10M36 190H322" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M80 130H300" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity=".5" fill="none"/><path d="M46 130H80C120 130 135 40 165 40C195 40 210 165 250 165H300" fill="none" stroke="var(--m4)" stroke-width="2.4"/><path d="M46 130H80C120 130 135 95 165 95C195 95 210 165 250 165H300" fill="none" stroke="var(--accent)" stroke-width="2.4"/><path d="M174 128V44" stroke="var(--m4)" stroke-width="1.4" marker-start="url(#bio5-fr)" marker-end="url(#bio5-fr)" fill="none"/><path d="M156 128V99" stroke="var(--accent)" stroke-width="1.4" marker-start="url(#bio5-fa)" marker-end="url(#bio5-fa)" fill="none"/><path d="M290 132V163" stroke="currentColor" stroke-width="1.4" marker-start="url(#bio5-fn)" marker-end="url(#bio5-fn)" fill="none"/><g stroke="currentColor" stroke-width="1" opacity=".5" fill="none"><path d="M216 64L177 76"/><path d="M220 118L159 114"/></g><g font-family="system-ui,sans-serif" font-size="12" fill="currentColor"><text transform="translate(22 100) rotate(-90)" text-anchor="middle">énergie</text><text x="322" y="206" text-anchor="end">avancement de la réaction</text><text x="46" y="148">réactifs</text><text x="250" y="182">produits</text><text x="220" y="68" fill="var(--m4)">E<tspan font-size="9" dy="3">a</tspan><tspan dy="-3"> sans enzyme</tspan></text><text x="224" y="122" fill="var(--accent)">E<tspan font-size="9" dy="3">a</tspan><tspan dy="-3"> avec enzyme</tspan></text><text x="298" y="152">ΔG</text></g><g font-family="system-ui,sans-serif" font-size="11"><path d="M216 16H236" stroke="var(--m4)" stroke-width="2.4"/><text x="242" y="20" fill="var(--m4)">sans enzyme</text><path d="M216 32H236" stroke="var(--accent)" stroke-width="2.4"/><text x="242" y="36" fill="var(--accent)">avec enzyme</text></g></svg><figcaption>L'enzyme abaisse la « bosse » de l'énergie d'activation (E<sub>a</sub>) ; l'écart ΔG entre réactifs et produits, donc l'équilibre, ne change pas.</figcaption></figure>
<div class="cle"><b>Idée et exemple : l'anhydrase carbonique</b>Dans les hématies, l'anhydrase carbonique catalyse CO<sub>2</sub> + H<sub>2</sub>O ⇌ HCO<sub>3</sub><sup>−</sup> + H<sup>+</sup>. Chaque molécule d'enzyme traite environ un million de molécules par seconde, assez pour charger le CO<sub>2</sub> dans les tissus et le décharger dans les poumons pendant le court passage du sang. Elle accélère les deux sens : celui qui l'emporte dépend seulement des concentrations. Son inhibiteur, l'<strong>acétazolamide</strong>, est utilisé contre le glaucome et le mal aigu des montagnes.</div>
<p>Quelques catalyseurs biologiques ne sont pas des protéines : ce sont des ARN, les <strong>ribozymes</strong>. Dans le ribosome, par exemple, c'est un ARN ribosomique qui forme la liaison peptidique.</p>

<h2>2. Le site actif</h2>
<div class="def"><b>Définition</b>Le <strong>site actif</strong> est la petite région de l'enzyme, souvent une poche ou une fente, où le substrat se fixe et se transforme. Il réunit quelques acides aminés parfois très éloignés dans la séquence, rapprochés par le repliement de la chaîne (structure tertiaire, chapitre des protéines).</div>
<p>On y distingue les acides aminés du <strong>site de fixation</strong>, qui reconnaissent et retiennent le substrat par des liaisons faibles (hydrogène, ioniques, hydrophobes), et ceux du <strong>site catalytique</strong>, qui réalisent la transformation. Il se forme un <strong>complexe enzyme-substrat</strong> (ES) transitoire : E + S ⇌ ES → E + P.</p>
<p>Conséquence directe : tout ce qui détruit la structure tertiaire (chaleur, pH extrême, agents dénaturants) détruit le site actif, donc l'activité.</p>

<h2>3. La spécificité</h2>
<p>Une enzyme est spécifique <strong>du substrat</strong>, de façon étroite (l'uréase n'hydrolyse que l'urée) ou plus large (une lipase attaque de nombreux triglycérides), et <strong>de la réaction</strong> : elle catalyse un seul type de transformation. Elle est souvent <strong>stéréospécifique</strong> : elle distingue deux énantiomères, comme les acides aminés L et D (chapitre des acides aminés). Deux modèles décrivent la reconnaissance :</p>
<div class="defile"><table>
<tr><th>Modèle</th><th>Idée</th><th>Limite ou exemple</th></tr>
<tr><td><b>Clé-serrure</b> (Emil Fischer, 1894)</td><td>le site actif a d'emblée une forme rigide, exactement complémentaire du substrat</td><td>explique la spécificité, mais pas les changements de forme observés</td></tr>
<tr><td><b>Ajustement induit</b> (Daniel Koshland, 1958)</td><td>le site actif est souple ; la fixation du substrat <strong>modifie la conformation</strong> de l'enzyme, qui se referme sur lui</td><td>l'<strong>hexokinase</strong> se referme comme une mâchoire autour du glucose ; c'est le modèle retenu aujourd'hui</td></tr>
</table></div>

<h2>4. Cofacteurs et coenzymes</h2>
<p>Beaucoup d'enzymes ont besoin d'un partenaire non protéique, le <strong>cofacteur</strong>. La partie protéique seule, inactive, s'appelle l'<strong>apoenzyme</strong> ; associée à son cofacteur, elle forme l'<strong>holoenzyme</strong>, active.</p>
<ul>
<li>Le cofacteur peut être un <strong>ion métallique</strong> : Zn<sup>2+</sup> de l'anhydrase carbonique, Mg<sup>2+</sup> associé à l'ATP dans les kinases, fer ou cuivre des cytochromes.</li>
<li>Ce peut être une molécule organique, un <strong>coenzyme</strong>. Lié très solidement, parfois de façon covalente, c'est un <strong>groupement prosthétique</strong> (l'hème des cytochromes, le FAD de la succinate déshydrogénase). S'il se fixe et se détache à chaque réaction, comme le NAD<sup>+</sup>, c'est un cosubstrat, régénéré par une autre réaction.</li>
</ul>
<p>Nous ne savons pas fabriquer la plupart des coenzymes : ils dérivent des <strong>vitamines</strong>, surtout celles du groupe B, d'où les maladies de carence.</p>
<div class="defile"><table>
<tr><th>Vitamine</th><th>Coenzyme</th><th>Exemple de rôle</th></tr>
<tr><td>B1 (thiamine)</td><td>thiamine pyrophosphate</td><td>pyruvate déshydrogénase (chapitre de la mitochondrie)</td></tr>
<tr><td>B2 (riboflavine)</td><td>FAD, FMN</td><td>succinate déshydrogénase, chaîne respiratoire</td></tr>
<tr><td>B3 (niacine)</td><td>NAD<sup>+</sup>, NADP<sup>+</sup></td><td>déshydrogénases</td></tr>
<tr><td>B5 (acide pantothénique)</td><td>coenzyme A</td><td>acétyl-CoA</td></tr>
<tr><td>B6 (pyridoxine)</td><td>phosphate de pyridoxal</td><td><strong>transaminases</strong> (partie 10)</td></tr>
<tr><td>B8 (biotine)</td><td>biotine</td><td>carboxylases</td></tr>
</table></div>
<div class="cle"><b>Idée et exemple : la vitamine B1 chez le patient alcoolique</b>L'alcoolisme chronique avec dénutrition entraîne souvent une carence en thiamine. Privée de son coenzyme, la pyruvate déshydrogénase fonctionne mal et les neurones, très dépendants du glucose, manquent d'énergie : c'est l'<strong>encéphalopathie de Gayet-Wernicke</strong> (confusion, troubles de l'équilibre et des mouvements des yeux). D'où une règle des urgences : chez un patient alcoolique dénutri, on donne de la vitamine B1 <strong>avant</strong> de perfuser du glucose, qui épuiserait le peu de thiamine restant.</div>

<h2>5. La classification internationale</h2>
<p>Chaque enzyme reçoit un <strong>numéro EC</strong> (<em>Enzyme Commission</em>) de quatre nombres : classe, sous-classe, sous-sous-classe et numéro d'ordre. Par exemple, l'acétylcholinestérase est EC 3.1.1.7 : une hydrolase (3) qui coupe une liaison ester (3.1). Depuis 2018, on compte <strong>7 classes</strong>, définies par le type de réaction :</p>
<div class="defile"><table>
<tr><th>Classe</th><th>Réaction catalysée</th><th>Exemple</th></tr>
<tr><td><b>1. Oxydoréductases</b></td><td>transferts d'électrons (oxydations, réductions)</td><td>lactate déshydrogénase, catalase</td></tr>
<tr><td><b>2. Transférases</b></td><td>transfert d'un groupement d'une molécule à une autre</td><td><strong>kinases</strong> (phosphate venu de l'ATP), transaminases</td></tr>
<tr><td><b>3. Hydrolases</b></td><td>coupure d'une liaison par l'eau</td><td>pepsine, lipase, phosphatases</td></tr>
<tr><td><b>4. Lyases</b></td><td>coupure ou formation d'une liaison sans eau ni oxydation, souvent avec formation ou disparition d'une double liaison</td><td>anhydrase carbonique, aldolase</td></tr>
<tr><td><b>5. Isomérases</b></td><td>réarrangement à l'intérieur d'une molécule</td><td>triose phosphate isomérase</td></tr>
<tr><td><b>6. Ligases</b></td><td>union de deux molécules couplée à l'hydrolyse de l'ATP</td><td>ADN ligase, pyruvate carboxylase</td></tr>
<tr><td><b>7. Translocases</b></td><td>déplacement d'ions ou de molécules à travers une membrane</td><td>Na<sup>+</sup>/K<sup>+</sup>-ATPase, ATP synthase (autrefois classées parmi les hydrolases)</td></tr>
</table></div>
<div class="piege"><b>Pièges de concours</b>Une <strong>kinase</strong> est une transférase, pas une ligase ; une <strong>phosphatase</strong>, qui retire un phosphate grâce à l'eau, est une hydrolase. Les « synthétases » consomment de l'ATP (ligases), les « synthases » non. Les manuels d'avant 2018 ne comptent que 6 classes : les translocases sont la 7<sup>e</sup>.</div>

<h2>6. La cinétique michaélienne</h2>
<h3>La vitesse initiale</h3>
<p>On mesure l'activité d'une enzyme par la vitesse d'apparition du produit. On retient la <strong>vitesse initiale</strong> (v<sub>0</sub>), mesurée au tout début de la réaction : le substrat n'a presque pas été consommé et le produit, encore rare, ne donne pas de réaction inverse. Sur la courbe [P] en fonction du temps, c'est la pente de la partie rectiligne du départ.</p>
<h3>L'effet de la concentration en substrat</h3>
<p>À quantité d'enzyme fixée, v<sub>0</sub> augmente avec la concentration en substrat [S], d'abord presque proportionnellement, puis de moins en moins, jusqu'à un plateau : la <strong>vitesse maximale</strong> (V<sub>max</sub>). Tous les sites actifs sont alors occupés : l'enzyme est <strong>saturée</strong>, comme un transporteur membranaire (chapitre de la membrane). La courbe est une <strong>hyperbole</strong>, décrite par l'équation de <strong>Michaelis-Menten</strong> (1913) :</p>
<p><strong>v<sub>0</sub> = V<sub>max</sub> × [S] / (K<sub>m</sub> + [S])</strong></p>

 fill="currentColor"><text x="54" y="18">v<tspan font-size="9" dy="3">0</tspan></text><text x="318" y="204" text-anchor="end">[S]</text><text x="44" y="54" text-anchor="end">V<tspan font-size="9" dy="3">max</tspan></text><text x="44" y="116" text-anchor="end">V<tspan font-size="9" dy="3">max</tspan></text><text x="44" y="130" text-anchor="end">/ 2</text><text x="98" y="202" text-anchor="middle" fill="var(--accent)">K<tspan font-size="9" dy="3">m</tspan></text><text x="148" y="202" text-anchor="middle" fill="var(--m3)">K<tspan font-size="9" dy="3">0,5</tspan></text><text x="56" y="72" fill="var(--accent)">hyperbole</text><text x="56" y="86" fill="var(--accent)">(michaélienne)</text><text x="206" y="134" fill="var(--m3)">sigmoïde</text><text x="206" y="148" fill="var(--m3)">(allostérique)</text></g></svg><figcaption>À V<sub>max</sub>/2, on lit K<sub>m</sub> sur l'axe des abscisses. Une enzyme allostérique donne une courbe en S.</figcaption></figure>
<div class="def"><b>Définition</b>La <strong>constante de Michaelis</strong> (K<sub>m</sub>) est la concentration en substrat pour laquelle la vitesse initiale vaut la <strong>moitié de V<sub>max</sub></strong>. Elle s'exprime en concentration (mol/L), est propre à un couple enzyme-substrat et ne dépend pas de la quantité d'enzyme. Elle reflète, de façon approchée, l'<strong>affinité</strong> de l'enzyme pour son substrat, en sens inverse : <strong>plus K<sub>m</sub> est petit, plus l'affinité est grande</strong> (il faut peu de substrat pour occuper la moitié des sites).</div>
<p>V<sub>max</sub>, elle, est proportionnelle à la quantité d'enzyme : doubler l'enzyme double V<sub>max</sub> sans changer K<sub>m</sub>. Rapportée à un seul site actif, elle donne le <strong>nombre de rotations</strong> (k<sub>cat</sub>), nombre de molécules de substrat transformées par seconde par chaque site. Deux cas limites : si [S] est très inférieure à K<sub>m</sub>, v<sub>0</sub> est à peu près proportionnelle à [S] ; si [S] est très supérieure à K<sub>m</sub>, v<sub>0</sub> ≈ V<sub>max</sub>, et ajouter du substrat ne sert plus à rien.</p>
<div class="cle"><b>Idée et exemple : hexokinase et glucokinase</b>Deux enzymes phosphorylent le glucose qui entre dans les cellules. L'<strong>hexokinase</strong> du muscle et du cerveau a un K<sub>m</sub> très bas (≈ 0,1 mmol/L) : à la glycémie normale (≈ 5 mmol/L), elle est saturée, et ces tissus captent le glucose même quand il se fait rare. La <strong>glucokinase</strong> du foie et des cellules β du pancréas n'est à demi saturée que vers 10 mmol/L : son activité suit les variations de la glycémie, ce qui permet au foie de stocker le glucose après un repas et au pancréas de « mesurer » la glycémie pour libérer l'insuline. Une mutation qui affaiblit la glucokinase donne une forme héréditaire de diabète modéré (MODY 2).</div>
<h3>La représentation de Lineweaver-Burk</h3>
<p>Une hyperbole se lit mal : V<sub>max</sub> n'est jamais atteinte sur le graphique. On trace donc les inverses (représentation en « double inverse ») :</p>
<p><strong>1/v<sub>0</sub> = (K<sub>m</sub>/V<sub>max</sub>) × 1/[S] + 1/V<sub>max</sub></strong></p>
<p>On obtient une <strong>droite</strong> de pente K<sub>m</sub>/V<sub>max</sub>, qui coupe l'axe des ordonnées en <strong>1/V<sub>max</sub></strong> et l'axe des abscisses en <strong>−1/K<sub>m</sub></strong>. Elle sert à déterminer K<sub>m</sub> et V<sub>max</sub>, et à reconnaître le type d'un inhibiteur (partie 8).</p>

<h2>7. Température et pH</h2>
<ul>
<li><strong>Température</strong> : la vitesse augmente d'abord avec la température (les molécules se rencontrent plus souvent), jusqu'à un <strong>optimum</strong> voisin de 37 à 40 °C pour la plupart des enzymes humaines. Au-delà, l'enzyme se <strong>dénature</strong> et l'activité chute brutalement, souvent de façon irréversible. Le froid ralentit les enzymes sans les détruire : c'est pourquoi on conserve les organes à greffer vers 4 °C.</li>
<li><strong>pH</strong> : chaque enzyme a un <strong>pH optimal</strong>. Le pH modifie la charge des acides aminés du site actif et du substrat (chapitre des acides aminés) ; loin de l'optimum, l'activité s'effondre, voire l'enzyme se dénature.</li>
</ul>
<div class="cle"><b>Idée et exemple : pepsine et trypsine</b>Deux protéases digestives, deux milieux. La <strong>pepsine</strong>, sécrétée dans l'estomac, a un pH optimal d'environ <strong>2</strong>, adapté au suc gastrique très acide. La <strong>trypsine</strong>, d'origine pancréatique, agit dans l'intestin grêle à un pH optimal d'environ <strong>8</strong>, une fois l'acidité neutralisée par les bicarbonates. Toutes deux sont sécrétées sous forme inactive (<strong>pepsinogène</strong>, <strong>trypsinogène</strong> : des <strong>zymogènes</strong>), activée seulement dans la lumière digestive, si bien que la cellule qui les fabrique ne se digère pas elle-même. Si la trypsine s'active trop tôt, dans le pancréas, l'organe s'autodigère : c'est la <strong>pancréatite aiguë</strong>.</div>

<h2>8. Les inhibitions</h2>
<p>Un <strong>inhibiteur</strong> diminue l'activité d'une enzyme. Il est <strong>réversible</strong> s'il se fixe par des liaisons faibles et peut se détacher, <strong>irréversible</strong> s'il se lie de façon covalente et inactive l'enzyme définitivement.</p>
<h3>Les trois inhibitions réversibles</h3>
<ul>
<li><strong>Compétitive</strong> : l'inhibiteur ressemble au substrat et se fixe sur le <strong>site actif</strong> de l'enzyme libre. Substrat et inhibiteur sont en compétition : un <strong>excès de substrat lève l'inhibition</strong>. Il faut plus de substrat pour atteindre la moitié de V<sub>max</sub> : le K<sub>m</sub> apparent <strong>augmente</strong>, V<sub>max</sub> est <strong>inchangée</strong>.</li>
<li><strong>Non compétitive</strong> : l'inhibiteur se fixe sur un <strong>autre site</strong>, aussi bien sur l'enzyme libre que sur le complexe ES, et met une partie des enzymes hors service. Ajouter du substrat n'y change rien : V<sub>max</sub> <strong>diminue</strong>, K<sub>m</sub> est <strong>inchangé</strong>.</li>
<li><strong>Incompétitive</strong> : l'inhibiteur se fixe <strong>seulement sur le complexe ES</strong>. Il diminue V<sub>max</sub> et K<sub>m</sub> <strong>dans la même proportion</strong>.</li>
</ul>
<div class="defile"><table>
<tr><th>Inhibition</th><th>Se fixe sur</th><th>K<sub>m</sub> apparent</th><th>V<sub>max</sub> apparente</th><th>Lineweaver-Burk</th><th>Exemple</th></tr>
<tr><td><b>Compétitive</b></td><td>E (site actif)</td><td>↑</td><td>=</td><td>droites sécantes sur l'axe des ordonnées</td><td><strong>statines</strong> sur l'HMG-CoA réductase</td></tr>
<tr><td><b>Non compétitive</b></td><td>E et ES (autre site)</td><td>=</td><td>↓</td><td>droites sécantes sur l'axe des abscisses</td><td>névirapine (anti-VIH) sur la transcriptase inverse</td></tr>
<tr><td><b>Incompétitive</b></td><td>ES seulement</td><td>↓</td><td>↓</td><td>droites parallèles</td><td>lithium sur l'inositol monophosphatase</td></tr>
</table></div>

<div class="cle"><b>Idée et exemple : les statines</b>L'<strong>HMG-CoA réductase</strong> catalyse l'étape limitante de la synthèse du cholestérol dans le foie. Les statines (atorvastatine, rosuvastatine) portent une partie qui ressemble à son substrat et occupent son site actif : ce sont des inhibiteurs <strong>compétitifs</strong>. Le foie, qui fabrique moins de cholestérol, capte alors davantage de cholestérol LDL dans le sang. Autre exemple compétitif : dans l'intoxication au méthanol ou à l'éthylène glycol (antigel), le <strong>fomépizole</strong> occupe l'alcool déshydrogénase et empêche la formation des dérivés toxiques.</div>
<h3>Les inhibitions irréversibles</h3>
<p>L'inhibiteur se lie de façon <strong>covalente</strong>, souvent à un acide aminé du site actif. L'activité ne revient que lorsque la cellule a fabriqué de <strong>nouvelles molécules d'enzyme</strong>.</p>
<div class="cle"><b>Idée et exemple : l'aspirine</b>L'aspirine (acide acétylsalicylique) <strong>acétyle</strong> une sérine de la <strong>cyclo-oxygénase</strong> (COX), de façon irréversible. Dans les plaquettes, la COX ne fabrique plus de thromboxane A<sub>2</sub>, qui favorise l'agrégation. Or les plaquettes n'ont <strong>pas de noyau</strong> : elles ne peuvent pas refaire l'enzyme. L'effet antiagrégant dure donc toute leur vie, <strong>7 à 10 jours</strong>, bien après l'élimination de l'aspirine. L'ibuprofène, lui, inhibe la COX de façon réversible et compétitive. Autres inhibiteurs irréversibles : la pénicilline, qui bloque les enzymes de construction de la paroi bactérienne, et les organophosphorés (insecticides, gaz sarin), qui bloquent l'acétylcholinestérase.</div>
<div class="piege"><b>Pièges de concours</b>Non compétitive n'est pas incompétitive : la première ne change pas K<sub>m</sub>, la seconde le diminue. Une inhibition compétitive ne change pas V<sub>max</sub> : avec assez de substrat, on l'atteint toujours. Une inhibition irréversible ne se lève ni par un excès de substrat ni par dilution.</div>

<h2>9. Les enzymes allostériques</h2>
<p>Certaines enzymes, faites de plusieurs sous-unités, possèdent en plus du site actif des <strong>sites régulateurs</strong> (dits allostériques, « autre site »). Un <strong>effecteur</strong> qui s'y fixe modifie la conformation de l'enzyme : un activateur augmente son activité, un inhibiteur la diminue. Les sous-unités s'influencent aussi entre elles : la fixation d'un substrat facilite celle des suivants (<strong>coopérativité</strong>), comme pour l'O<sub>2</sub> sur l'hémoglobine (chapitre des protéines).</p>
<p>Leur courbe v<sub>0</sub> = f([S]) n'est pas une hyperbole mais une <strong>sigmoïde</strong> (en S, voir la figure de la partie 6) : elles ne suivent pas l'équation de Michaelis-Menten, et l'on parle de K<sub>0,5</sub> plutôt que de K<sub>m</sub>. Autour de K<sub>0,5</sub>, une petite variation de [S] fait beaucoup varier la vitesse : l'enzyme fonctionne comme un interrupteur.</p>
<div class="cle"><b>Idée et exemple : la phosphofructokinase-1</b>Elle catalyse une étape clé et irréversible de la glycolyse. Elle est <strong>inhibée par l'ATP</strong> et par le citrate, signes que la cellule a assez d'énergie, et <strong>activée par l'AMP</strong>, signe que l'ATP s'épuise : la glycolyse ralentit d'elle-même quand l'énergie abonde. Les enzymes allostériques sont souvent placées au début d'une voie et freinées par son produit final : c'est la <strong>rétro-inhibition</strong>.</div>

<h2>10. Les enzymes du sang, outils de diagnostic</h2>
<p>La plupart des enzymes travaillent à l'intérieur des cellules. Quand des cellules sont détruites, leurs enzymes passent dans le sang : une hausse de leur concentration sérique signale une souffrance de l'organe dont elles viennent. On mesure leur activité en <strong>unités internationales</strong> (UI : 1 µmol de substrat transformé par minute) ; l'unité du système international est le katal (1 mol/s).</p>
<ul>
<li><strong>Transaminases</strong> (ALAT, ASAT), enzymes à phosphate de pyridoxal. L'ALAT est surtout hépatique ; l'ASAT se trouve aussi dans le cœur, les muscles et les hématies. Une forte hausse signe une <strong>cytolyse hépatique</strong> : hépatite virale aiguë, intoxication au paracétamol.</li>
<li><strong>Lipase</strong>, d'origine pancréatique : un taux supérieur à <strong>3 fois la normale</strong>, avec une douleur abdominale typique, fait retenir une <strong>pancréatite aiguë</strong>. Elle a remplacé l'amylase, moins spécifique.</li>
<li><strong>Créatine kinase</strong> (CK) : souffrance musculaire (rhabdomyolyse, myopathies).</li>
<li><strong>γ-GT et phosphatases alcalines</strong> : gêne à l'écoulement de la bile (cholestase) ; les γ-GT montent aussi avec l'alcool.</li>
</ul>
<div class="piege"><b>Piège de concours</b>La <strong>troponine</strong>, marqueur de référence de l'infarctus du myocarde, n'est <strong>pas une enzyme</strong> : c'est une protéine de l'appareil contractile du muscle cardiaque, libérée quand les cardiomyocytes meurent. On la dose par immunoanalyse, en concentration (ng/L), et non par une activité enzymatique.</div>

<div class="cle"><b>Bilan</b>Catalyseur protéique, l'enzyme abaisse l'énergie d'activation sans changer l'équilibre, grâce à un site actif spécifique (ajustement induit), souvent avec un coenzyme dérivé d'une vitamine. Sept classes depuis 2018. Cinétique michaélienne : hyperbole, V<sub>max</sub> à saturation, K<sub>m</sub> = [S] à V<sub>max</sub>/2, petit si l'affinité est grande. Inhibition compétitive : K<sub>m</sub> ↑, V<sub>max</sub> = ; non compétitive : K<sub>m</sub> =, V<sub>max</sub> ↓ ; incompétitive : les deux ↓ ; l'aspirine est irréversible. Enzymes allostériques : sigmoïde. Transaminases et lipase sériques signent une lésion d'organe ; la troponine n'est pas une enzyme.</div>

<details><summary>Hors programme : d'où vient l'équation de Michaelis-Menten</summary>
<div class="hp"><b>Hors programme</b>On écrit E + S ⇌ ES → E + P avec trois constantes de vitesse : k<sub>1</sub> (formation de ES), k<sub>−1</sub> (dissociation de ES) et k<sub>2</sub> = k<sub>cat</sub> (formation du produit). En supposant que [ES] reste constante pendant la mesure (état stationnaire), on obtient l'équation de la fiche avec K<sub>m</sub> = (k<sub>−1</sub> + k<sub>2</sub>)/k<sub>1</sub>. K<sub>m</sub> ne mesure donc vraiment l'affinité que si k<sub>2</sub> est petit devant k<sub>−1</sub>. Le rapport k<sub>cat</sub>/K<sub>m</sub> mesure l'efficacité de l'enzyme ; pour l'anhydrase carbonique ou l'acétylcholinestérase, il approche la limite fixée par la vitesse de diffusion des molécules dans l'eau.</div>
</details>

<p class="lead">Avant d'apprendre les os un par un, il faut savoir ce qu'est un os, comment il est construit et comment deux os s'articulent. Ce vocabulaire servira pour chaque membre, chaque articulation, chaque fracture.</p>

<h2>1. Le squelette et ses rôles</h2>
<p>Le squelette adulte compte environ <strong>206 os</strong>. Le nouveau-né en a davantage (près de 300 pièces), car plusieurs os fusionnent pendant la croissance. On distingue :</p>
<ul>
<li>le <strong>squelette axial</strong> (80 os) : crâne, colonne vertébrale, côtes, sternum ;</li>
<li>le <strong>squelette appendiculaire</strong> (126 os) : les <strong>ceintures</strong> (scapulaire : scapula et clavicule ; pelvienne : os coxaux) et les membres.</li>
</ul>
<p>Ses rôles : <strong>soutien</strong> ; <strong>protection</strong> (le crâne pour l'encéphale, la cage thoracique pour le cœur et les poumons) ; <strong>mouvement</strong> (les os sont des leviers actionnés par les muscles) ; <strong>réserve minérale</strong> (environ 99 % du calcium et 85 % du phosphore de l'organisme) ; <strong>hématopoïèse</strong> (fabrication des cellules du sang dans la moelle rouge).</p>

<h2>2. Classer les os par leur forme</h2>
<div class="defile"><table>
<tr><th>Type</th><th>Définition</th><th>Exemples</th></tr>
<tr><td><b>Long</b></td><td>une dimension prédomine ; un corps et deux extrémités</td><td>fémur, humérus, tibia, et aussi les métacarpiens et les <strong>phalanges</strong></td></tr>
<tr><td><b>Court</b></td><td>trois dimensions voisines</td><td>os du carpe (poignet), la plupart des os du tarse</td></tr>
<tr><td><b>Plat</b></td><td>deux dimensions prédominent</td><td>os de la voûte du crâne (pariétal), sternum, scapula, côtes</td></tr>
<tr><td><b>Irrégulier</b></td><td>forme complexe</td><td>vertèbres, certains os de la face</td></tr>
<tr><td><b>Sésamoïde</b></td><td>développé dans un tendon</td><td>la <strong>patella</strong> (le plus gros)</td></tr>
<tr><td><b>Pneumatisé</b></td><td>creusé de cavités remplies d'air (sinus)</td><td>frontal, maxillaire, ethmoïde, sphénoïde</td></tr>
</table></div>
<div class="piege"><b>Piège de concours</b>Le type dépend de la forme, pas de la taille : une phalange, minuscule, est un <strong>os long</strong>.</div>

<h2>3. L'anatomie d'un os long</h2>

<ul>
<li>La <strong>diaphyse</strong> est le corps de l'os : un tube d'<strong>os compact</strong> autour de la <strong>cavité médullaire</strong>, qui contient de la moelle jaune (graisse) chez l'adulte.</li>
<li>Les <strong>épiphyses</strong> sont les extrémités, faites d'<strong>os spongieux</strong> (des travées dont les espaces contiennent de la moelle rouge) sous une fine coque compacte. Les surfaces articulaires sont couvertes de <strong>cartilage articulaire</strong>.</li>
<li>Les <strong>métaphyses</strong> font la jonction. Chez l'enfant, elles portent le <strong>cartilage de conjugaison</strong> (ou de croissance), qui fait grandir l'os en longueur et disparaît en fin de puberté.</li>
<li>Le <strong>périoste</strong> est la membrane fibreuse qui enveloppe l'os, <strong>sauf</strong> les surfaces articulaires. Il est vascularisé et innervé (c'est lui qui fait mal dans une fracture), fait croître l'os en épaisseur et répare les fractures. L'<strong>endoste</strong> tapisse la cavité médullaire.</li>
<li>Une <strong>artère nourricière</strong> pénètre dans la diaphyse par le trou nourricier.</li>
</ul>
<div class="cle"><b>Idée et exemple</b>Chez l'enfant, une fracture qui passe par le cartilage de conjugaison peut perturber la croissance de l'os : c'est pourquoi les fractures de l'enfant sont classées selon leur rapport avec ce cartilage.</div>

<h2>4. Le tissu osseux</h2>
<p>L'os est un tissu vivant, sans cesse détruit et reconstruit (<strong>remodelage</strong>).</p>
<ul>
<li>Les <strong>ostéoblastes</strong> fabriquent la matrice osseuse.</li>
<li>Les <strong>ostéocytes</strong> sont d'anciens ostéoblastes emmurés dans la matrice qu'ils ont produite, logés dans de petites cavités.</li>
<li>Les <strong>ostéoclastes</strong> détruisent (résorbent) l'os : ce sont de grandes cellules à plusieurs noyaux, issues de la lignée des monocytes.</li>
</ul>
<p>La matrice associe environ <strong>deux tiers de minéral</strong>, des cristaux d'<strong>hydroxyapatite</strong> (phosphate de calcium) qui donnent la dureté, et <strong>un tiers de matière organique</strong>, surtout du <strong>collagène de type I</strong>, qui donne la souplesse.</p>
<p>Dans l'os compact, la matrice s'organise en <strong>ostéons</strong> (systèmes de Havers) : des lamelles concentriques autour d'un <strong>canal de Havers</strong> qui contient vaisseaux et nerfs, parallèle à l'axe de l'os. Des <strong>canaux de Volkmann</strong>, transversaux, relient ces canaux entre eux. L'os spongieux, lui, n'a pas d'ostéons.</p>
<p>Deux modes de formation : l'<strong>ossification endochondrale</strong> remplace une maquette de cartilage (la plupart des os, dont les os longs) ; l'<strong>ossification membranaire</strong> se fait directement dans un tissu conjonctif (os plats de la voûte du crâne).</p>

<h2>5. Les reliefs osseux : le vocabulaire</h2>
<div class="defile"><table>
<tr><th>Terme</th><th>Sens</th></tr>
<tr><td>Tête, condyle</td><td>extrémité ou surface <strong>articulaire</strong> arrondie</td></tr>
<tr><td>Épicondyle</td><td>saillie située au-dessus d'un condyle (insertions musculaires)</td></tr>
<tr><td>Tubercule, tubérosité</td><td>saillie, petite ou grosse et rugueuse, où s'insère un tendon ou un ligament</td></tr>
<tr><td>Processus, épine, crête</td><td>saillie allongée, pointue, en arête</td></tr>
<tr><td>Fosse, sillon, incisure</td><td>creux, gouttière, échancrure</td></tr>
<tr><td>Foramen, canal, méat</td><td>orifice, conduit dans l'os</td></tr>
<tr><td>Facette</td><td>petite surface articulaire plane</td></tr>
</table></div>
<p>Rappel : un <strong>tendon</strong> relie un muscle à un os ; un <strong>ligament</strong> relie deux os.</p>

<h2>6. Les articulations</h2>
<p>Une articulation unit deux os ou plus. On les classe selon leur mobilité et le tissu qui unit les os.</p>
<div class="defile"><table>
<tr><th>Classe</th><th>Mobilité</th><th>Tissu d'union</th><th>Exemples</th></tr>
<tr><td><b>Synarthroses</b></td><td>nulle ou presque</td><td>fibreux</td><td>sutures du crâne, dent dans son alvéole</td></tr>
<tr><td><b>Amphiarthroses</b></td><td>faible</td><td>cartilage (souvent fibrocartilage)</td><td><strong>symphyse pubienne</strong>, disques intervertébraux</td></tr>
<tr><td><b>Diarthroses</b> (synoviales)</td><td>grande</td><td>capsule et cavité articulaire</td><td>épaule, coude, hanche, genou, doigts</td></tr>
</table></div>

<h3>Anatomie d'une diarthrose</h3>
<ul>
<li>des <strong>surfaces articulaires</strong> recouvertes de <strong>cartilage hyalin</strong>, lisse, <strong>sans vaisseaux ni nerfs</strong>, nourri par la synovie ;</li>
<li>une <strong>capsule articulaire</strong>, manchon fibreux qui entoure l'articulation, doublée à l'intérieur par la <strong>membrane synoviale</strong>, qui sécrète la <strong>synovie</strong> (liquide visqueux lubrifiant) ;</li>
<li>des <strong>ligaments</strong> qui renforcent l'ensemble ;</li>
<li>parfois des <strong>fibrocartilages</strong> qui améliorent l'emboîtement : les <strong>ménisques</strong> du genou, le labrum (bourrelet) de la hanche et de l'épaule.</li>
</ul>

<h3>Les types de diarthroses selon la forme des surfaces</h3>
<div class="defile"><table>
<tr><th>Type</th><th>Surfaces</th><th>Axes de mouvement</th><th>Exemple</th></tr>

<p class="lead">Le cœur est une double pompe musculaire d'environ 300 g qui fait circuler près de 5 litres de sang par minute au repos, soit plus de 7 000 litres par jour. Son anatomie explique le trajet du sang ; son tissu nodal explique l'électrocardiogramme.</p>

<h2>1. Situation et enveloppes</h2>
<p>Le cœur est dans le thorax, au sein du <strong>médiastin</strong>, la région médiane comprise entre les deux poumons, derrière le sternum, au-dessus du diaphragme et en avant de l'œsophage (médiastin moyen selon la Terminologia Anatomica ; le découpage du médiastin varie selon les écoles).</p>
<ul>
<li>Il a la forme d'une pyramide couchée dont l'axe est oblique <strong>en avant, à gauche et en bas</strong> : environ deux tiers de sa masse sont à gauche de la ligne médiane.</li>
<li>Sa <strong>base</strong>, où arrivent et partent les gros vaisseaux, regarde en arrière, en haut et à droite. Sa <strong>pointe</strong> (apex) est en avant, en bas et à gauche, contre la paroi, au niveau du <strong>5<sup>e</sup> espace intercostal gauche</strong> sur la ligne médio-claviculaire : c'est là qu'on sent battre le cœur (choc de pointe).</li>
<li>Il pèse environ <strong>250 à 300 g</strong> chez l'adulte, la taille d'un poing.</li>
<li>Sa face antérieure (sterno-costale) est formée surtout par le <strong>ventricule droit</strong> ; sa face gauche (pulmonaire) et sa pointe, par le <strong>ventricule gauche</strong> ; sa face inférieure repose sur le diaphragme.</li>
</ul>
<h3>Le péricarde</h3>
<ul>
<li>Le <strong>péricarde fibreux</strong> est un sac résistant et <strong>inextensible</strong>, fixé au centre tendineux du diaphragme et au sternum : il maintient le cœur en place.</li>
<li>Le <strong>péricarde séreux</strong> a deux feuillets : le feuillet <strong>pariétal</strong> tapisse le péricarde fibreux, le feuillet <strong>viscéral</strong>, ou <strong>épicarde</strong>, recouvre le cœur. Entre eux, la <strong>cavité péricardique</strong> contient quelques dizaines de millilitres de liquide qui permettent au cœur de glisser à chaque battement.</li>
</ul>
<div class="cle"><b>Idée et exemple : la tamponnade</b>Le péricarde fibreux ne se dilate pas. Si du liquide ou du sang s'accumule vite dans la cavité péricardique (péricardite, plaie du cœur), il comprime les cavités, qui ne peuvent plus se remplir : le débit cardiaque s'effondre. Urgence vitale, traitée en évacuant le liquide par ponction.</div>
<p>La paroi du cœur compte trois couches : l'épicarde, le <strong>myocarde</strong> (le muscle, fait de cardiomyocytes) et l'<strong>endocarde</strong>, fine couche qui tapisse les cavités et les valves, en continuité avec l'endothélium des vaisseaux.</p>

<h2>2. Configuration externe et interne</h2>
<p>Le cœur a <strong>quatre cavités</strong> : deux <strong>atriums</strong> (anciennement oreillettes), qui reçoivent le sang, et deux <strong>ventricules</strong>, qui l'éjectent. On parle de cœur droit (atrium droit, AD, et ventricule droit, VD) et de cœur gauche (AG et VG). Chez l'adulte, les deux moitiés <strong>ne communiquent pas</strong> : le septum interatrial et le septum interventriculaire les séparent.</p>
<p>En surface, le <strong>sillon coronaire</strong> (ou atrio-ventriculaire) fait le tour du cœur entre atriums et ventricules ; les <strong>sillons interventriculaires</strong> antérieur et postérieur (inférieur) marquent la limite entre les deux ventricules. Ces sillons logent les vaisseaux coronaires. Chaque atrium porte un petit prolongement en cul-de-sac, l'<strong>auricule</strong>.</p>
<div class="defile"><table>
<tr><th>Cavité</th><th>Reçoit</th><th>Envoie vers</th><th>Particularités</th></tr>
<tr><td><b>AD</b></td><td>veines caves supérieure et inférieure, sinus coronaire</td><td>VD, par la valve tricuspide</td><td>contient le nœud sinusal</td></tr>
<tr><td><b>VD</b></td><td>AD</td><td>tronc pulmonaire, par la valve pulmonaire</td><td>paroi mince (≈ 3 à 5 mm), section en croissant</td></tr>
<tr><td><b>AG</b></td><td>4 veines pulmonaires</td><td>VG, par la valve mitrale</td><td>cavité la plus postérieure, au contact de l'œsophage</td></tr>
<tr><td><b>VG</b></td><td>AG</td><td>aorte, par la valve aortique</td><td>paroi épaisse (≈ 10 mm), forme la pointe</td></tr>
</table></div>
<div class="cle"><b>Idée et exemple</b>L'épaisseur de la paroi suit la pression à vaincre. Le VG éjecte dans l'aorte à environ 120 mmHg, le VD dans l'artère pulmonaire à environ 25 mmHg : la paroi du VG est environ trois fois plus épaisse. Quand la pression à vaincre augmente durablement (hypertension artérielle, rétrécissement de la valve aortique), le VG s'épaissit encore : c'est l'<strong>hypertrophie ventriculaire gauche</strong>.</div>
<div class="piege"><b>Piège de concours</b>Le VG est plus épais, mais il n'éjecte <strong>pas plus de sang</strong> que le VD : les deux pompes sont montées en série et ont le même débit (≈ 5 L/min au repos). Il éjecte le même volume, à une pression bien plus forte.</div>

<h2>3. Les valves</h2>
<p>Quatre valves imposent au sang un <strong>sens unique</strong>. Elles s'ouvrent et se ferment <strong>passivement</strong>, sous l'effet des différences de pression de part et d'autre.</p>
<div class="defile"><table>
<tr><th>Valve</th><th>Position</th><th>Structure</th></tr>
<tr><td><b>Tricuspide</b></td><td>entre AD et VD</td><td>3 cuspides, retenues par des cordages tendineux attachés aux muscles papillaires (piliers)</td></tr>
<tr><td><b>Mitrale</b></td><td>entre AG et VG</td><td>2 cuspides (bicuspide), cordages et piliers</td></tr>
<tr><td><b>Pulmonaire</b></td><td>entre VD et tronc pulmonaire</td><td>3 valvules semi-lunaires (sigmoïdes) « en nid de pigeon », sans cordages</td></tr>
<tr><td><b>Aortique</b></td><td>entre VG et aorte</td><td>3 valvules semi-lunaires, sans cordages ; les artères coronaires naissent juste au-dessus</td></tr>
</table></div>
<p>Moyen mnémotechnique : la mitrale, comme la mitre d'un évêque, a deux pointes, et elle est à gauche. Pendant la contraction des ventricules, les <strong>piliers</strong> se contractent aussi et tendent les cordages : ils empêchent les valves atrio-ventriculaires de se retourner dans les atriums. Ils ne servent pas à les ouvrir.</p>
<p>Les quatre valves sont fixées sur le <strong>squelette fibreux</strong> du cœur, un plan de tissu conjonctif dense situé entre atriums et ventricules. Il sert de charpente et <strong>isole électriquement</strong> les atriums des ventricules.</p>
<p>Une valve peut être malade de deux façons : elle s'ouvre mal (<strong>rétrécissement</strong>, ou sténose) ou se ferme mal (<strong>insuffisance</strong>, avec une fuite). Dans les deux cas, le sang devient turbulent et produit un <strong>souffle</strong> à l'auscultation. Exemple : le rétrécissement aortique calcifié, valvulopathie la plus fréquente du sujet âgé dans les pays développés.</p>

<h2>4. Les gros vaisseaux et les deux circulations</h2>
<ul>
<li>Les <strong>veines caves</strong> supérieure (sang de la tête, du cou et des membres supérieurs) et inférieure (sang de la partie du corps sous le diaphragme) arrivent à l'AD.</li>
<li>Le <strong>tronc pulmonaire</strong> part du VD et se divise en artères pulmonaires droite et gauche.</li>
<li>Les <strong>veines pulmonaires</strong>, au nombre de quatre (deux par poumon), arrivent à l'AG.</li>
<li>L'<strong>aorte</strong> part du VG, monte (aorte ascendante, qui donne les coronaires), décrit une crosse d'où naissent le tronc brachio-céphalique, l'artère carotide commune gauche et l'artère subclavière gauche, puis descend dans le thorax et l'abdomen.</li>
</ul>
