    { id: "e3-1", titre: "Qu’appelle-t-on le « moi » ?", html: `
<p class="lettrine">Il faut distinguer des mots voisins. Le <b>moi</b> désigne l’ensemble de ce que je suis pour moi-même : mon caractère, mes souvenirs, mes désirs. Le <b>sujet</b> est celui qui pense, perçoit, agit (le « je » de la phrase). La <b>personne</b> est le moi en tant qu’être moral et juridique, responsable. L’<b>individu</b>, enfin, est l’être singulier, indivisible, distinct des autres. Le mot latin <i>persona</i> désignait le masque de l’acteur : la personne a d’abord été un rôle.</p>
<p>La question n’est pas neuve. Le programme cite saint Augustin : « Je suis devenu pour moi-même une énigme » (<i>Confessions</i>, IV, 4, vers 400). Pascal écrit « Le moi est haïssable » (<i>Pensées</i>, publiées en 1670) : le moi se fait le centre de tout. Il demande aussi « Qu’est-ce que le moi ? » : si l’on m’aime pour ma beauté ou mon jugement, qu’on peut perdre, aime-t-on vraiment « moi » ?</p>
<div class="ex"><b class="l">Exemple</b>L’argument de Pascal : un homme à la fenêtre qui regarde les passants ne s’y est pas mis pour me voir ; celui qui aime quelqu’un pour sa beauté cessera de l’aimer quand la petite vérole l’aura défiguré. On n’aime jamais que des qualités : le moi lui-même échappe.</div>` },
    { id: "e3-2", titre: "Montaigne et Descartes : le moi qui change, le moi qui pense", html: `
<p>Montaigne invente l’<b>autoportrait</b> littéraire. Dès l’avis « Au lecteur » des <i>Essais</i> (1580), il annonce : « je suis moi-même la matière de mon livre ». Mais ce moi est mouvant : « Je ne peins pas l’être. Je peins le passage » (<i>Essais</i>, III, 2, « Du repentir »). Le monde est une « branloire pérenne » (une balançoire perpétuelle) et le moi aussi : il se contredit, et l’écriture doit suivre ses variations « de jour en jour, de minute en minute ».</p>
<p>Descartes cherche au contraire un point fixe. Dans le <i>Discours de la méthode</i> (1637), après avoir douté de tout, il trouve une certitude : « Je pense, donc je suis ». Dans la deuxième des <i>Méditations métaphysiques</i> (1641), il précise : « Je suis, j’existe, cela est certain ; mais combien de temps ? autant de temps que je pense », et définit le moi comme « une chose qui pense ». Le moi est une <b>substance</b>, connue par la conscience avant le corps.</p>
<div class="ex"><b class="l">Exemple</b>Pour Descartes, l’esprit se connaît plus facilement que le corps : le morceau de cire de la deuxième Méditation change de forme, d’odeur et de couleur près du feu, mais c’est l’esprit seul qui le reconnaît comme le même.</div>
<div class="plus"><b class="l">Pour aller plus loin</b>David Hume (<i>Traité de la nature humaine</i>, 1739) répond qu’en regardant en lui il ne trouve jamais un « moi », seulement des perceptions particulières (chaud, froid, plaisir…) : le moi serait un « faisceau » de perceptions qui se succèdent. Locke (1694) avait déjà fondé l’identité personnelle sur la conscience et la mémoire.</div>` },
    { id: "e3-3", titre: "Rousseau : se montrer « dans toute la vérité de la nature »", html: `
<p>Les <i>Confessions</i> (livres I à VI publiés en 1782, livres VII à XII en 1789) s’ouvrent sur un défi : « Je forme une entreprise qui n’eut jamais d’exemple, et dont l’exécution n’aura point d’imitateur. Je veux montrer à mes semblables un homme dans toute la vérité de la nature, et cet homme, ce sera moi. » Puis : « Moi seul. […] Si je ne vaux pas mieux, au moins je suis autre. »</p>
<p>Rousseau fonde l’<b>autobiographie</b> moderne sur deux idées : la <b>singularité</b> (la nature a « brisé le moule » après l’avoir fait) et la <b>sincérité</b> (« J’ai dit le bien et le mal avec la même franchise »). Mais il avoue aussi les limites de sa mémoire : il a pu employer « quelque ornement indifférent » pour « remplir un vide ». La sincérité n’est pas la vérité : on peut être sincère et se tromper sur soi.</p>
<div class="ex"><b class="l">Exemple</b>L’épisode du ruban volé (livre II) : Rousseau, jeune laquais, vole un ruban et accuse une servante, Marion, qui est renvoyée. Il dit n’avoir jamais pu se pardonner ce mensonge : l’autobiographie se fait aveu et examen de conscience.</div>` },
    { id: "e3-4", titre: "Le moi romantique : exhibé, élargi, masqué", html: `
<p>Le romantisme fait du moi la matière même de l’œuvre. Hugo justifie ce lyrisme dans la préface des <i>Contemplations</i> (1856) : « On se plaint quelquefois des écrivains qui disent moi. Parlez-nous de nous, leur crie-t-on. Hélas ! quand je vous parle de moi, je vous parle de vous. » Le moi lyrique se veut <b>universel</b> : « Ah ! insensé, qui crois que je ne suis pas toi ! » Chateaubriand construit dans les <i>Mémoires d’outre-tombe</i> (publiés en 1849-1850) un moi monumental, qui se confond avec l’histoire de son siècle.</p>
<p>D’autres explorent le <b>masque</b>. Dans <i>Lorenzaccio</i> (Musset, 1834), Lorenzo de Médicis joue le débauché pour approcher le tyran qu’il veut tuer, et finit par ne plus pouvoir quitter son rôle : « Le vice a été pour moi un vêtement ; maintenant il est collé à ma peau » (acte III, scène 3). Stendhal, lui, parle d’<b>égotisme</b> : l’analyse minutieuse et lucide de soi (<i>Souvenirs d’égotisme</i>, écrits en 1832).</p>
<div class="ex"><b class="l">Exemple</b>Lorenzo montre que le moi peut être transformé par ce qu’il joue : on devient ce qu’on fait semblant d’être. C’est un exemple précis pour un sujet sur l’identité et le regard des autres.</div>` },
    { id: "e3-5", titre: "Le moi divisé : le double et la folie", html: `
<p>Au XIX<sup>e</sup> siècle, la littérature multiplie les figures du <b>double</b>. Nerval, dans le sonnet « El Desdichado » (<i>Les Chimères</i>, 1854), s’attribue des identités multiples : « Je suis le ténébreux, — le veuf, — l’inconsolé », puis « Suis-je Amour ou Phébus ?… Lusignan ou Biron ? ». <i>Aurélia</i> (1855) s’ouvre sur « Le rêve est une seconde vie » et raconte une expérience de la folie.</p>
<p>Baudelaire se dit à la fois bourreau et victime : « Je suis la plaie et le couteau ! » (« L’Héautontimorouménos », <i>Les Fleurs du mal</i> ; le titre grec signifie « le bourreau de soi-même »). Stevenson (<i>L’Étrange Cas du docteur Jekyll et de M. Hyde</i>, 1886) sépare chimiquement les deux faces d’un même homme. Maupassant (<i>Le Horla</i>, 1887) fait tenir son journal à un narrateur qui se sent possédé : « Je suis perdu ! Quelqu’un possède mon âme et la gouverne ! » (14 août).</p>
<div class="ex"><b class="l">Exemple</b>Dans <i>Le Horla</i>, la forme du journal intime rend le lecteur témoin de la perte de soi, date après date, sans recul du narrateur : on ne sait pas s’il est fou ou si un être invisible existe vraiment.</div>` },
    { id: "e3-6", titre: "« Je est un autre » : Rimbaud", html: `
<p>Rimbaud a seize ans quand il écrit les deux lettres dites « du voyant ». Le 13 mai 1871, à son professeur Georges Izambard : « C’est faux de dire : Je pense. On devrait dire : On me pense. […] JE est un autre. » Le 15 mai, à Paul Demeny : « Car Je est un autre. Si le cuivre s’éveille clairon, il n’y a rien de sa faute. »</p>
<p>Le moi n’est plus l’auteur souverain de ses pensées : il est l’<b>instrument</b> où quelque chose se joue (le cuivre devient clairon, « le bois […] se trouve violon »). Le poète doit donc se connaître, puis se travailler : « La première étude de l’homme qui veut être poète est sa propre connaissance, entière. » Il se fait « voyant » par un « long, immense et raisonné dérèglement de tous les sens ». Rimbaud critique au passage le lyrisme romantique, qui n’aurait trouvé « du Moi que la signification fausse ».</p>
<div class="ex"><b class="l">Exemple</b>La faute de grammaire volontaire (« Je est » au lieu de « je suis ») fait du « je » un objet dont on parle à la troisième personne : la langue même montre le dédoublement.</div>` },
    { id: "e3-7", titre: "Le soupçon : Nietzsche, Freud, Bergson", html: `
<p>Nietzsche conteste l’évidence du « je pense » : une pensée vient quand elle veut, non quand « je » veux ; le « je » serait une habitude de la grammaire (<i>Par-delà bien et mal</i>, 1886, § 17). Il fait pourtant du devenir soi une tâche : « Tu dois devenir celui que tu es » (<i>Le Gai Savoir</i>, § 270, 1882, trad. H. Albert).</p>
<p>Freud, dans <i>L’Interprétation du rêve</i> (1900), fait du rêve un accès privilégié à l’<b>inconscient</b> : le rêve réalise de façon déguisée un désir refoulé. Il décrit plus tard trois instances : le <b>ça</b> (les pulsions), le <b>surmoi</b> (les interdits intériorisés) et le <b>moi</b>, qui tente de concilier les deux avec la réalité (<i>Le Moi et le Ça</i>, 1923). Il parle de trois « blessures » infligées au narcissisme humain : Copernic, Darwin, puis la psychanalyse, qui montre que le moi « n’est pas maître dans sa propre maison » (« Une difficulté de la psychanalyse », 1917).</p>
<p>Bergson distingue enfin un <b>moi superficiel</b>, social, découpé par le langage, et un <b>moi profond</b>, durée vivante. Pour lui, « nous sommes libres quand nos actes émanent de notre personnalité entière, quand ils l’expriment » (<i>Essai sur les données immédiates de la conscience</i>, 1889).</p>
<div class="ex"><b class="l">Exemple</b>Le lapsus et l’acte manqué (<i>Psychopathologie de la vie quotidienne</i>, 1901) : oublier un nom ou se tromper de mot trahit, selon Freud, un désir que la conscience refuse.</div>` },
    { id: "e3-8", titre: "Le XX<sup>e</sup> siècle : moi successifs, rôles et regard d’autrui", html: `
<p>Proust montre que nous changeons au point de ne plus être la même personne : l’amour, le deuil, l’habitude remplacent nos « moi » successifs. Pirandello, dans <i>Un, personne et cent mille</i> (1926), fait découvrir à son héros, à partir d’une remarque de sa femme sur son nez, qu’il est un autre pour chacun de ceux qui le regardent. Kafka, dans <i>La Métamorphose</i> (1915), montre un homme devenu insecte dont la famille ne voit plus que la charge qu’il représente.</p>
<p>Sartre (protégé : on résume) refuse l’idée d’une nature humaine fixée d’avance : chacun se fait par ses actes. Dans <i>L’Être et le Néant</i> (1943), la <b>mauvaise foi</b> consiste à se mentir sur sa liberté, comme le garçon de café qui « joue » à être garçon de café. Dans <i>Huis clos</i> (1944), la réplique « l’enfer, c’est les autres » exprime notre dépendance au regard d’autrui pour savoir qui nous sommes.</p>
<div class="ex"><b class="l">Exemple</b>Sujet zéro de l’épreuve (Éduscol, 2020) : la lettre de Jacques Rivière à Antonin Artaud du 8 juin 1924, sur un poète qui souffre de ne pouvoir se saisir lui-même. Question posée : « En quoi la réflexion de Jacques Rivière expose-t-elle les déchirements du Moi ? »</div>` },
    { id: "e3-9", titre: "Écrire sur soi : se connaître ou se construire ?", html: `
<p>Les formes d’écriture de soi sont multiples : <b>autobiographie</b> (récit rétrospectif de sa vie), <b>mémoires</b> (sa vie mêlée à l’histoire), <b>journal intime</b> (au jour le jour : le <i>Journal</i> d’Amiel, publié en partie en 1882-1884), <b>autoportrait</b> (Montaigne, Leiris), <b>roman autobiographique</b> (Vallès). Chaque forme choisit un rapport au temps et à la vérité.</p>
<p>Faut-il conclure que l’écriture révèle un moi déjà là, ou qu’elle le <b>fabrique</b> ? Montaigne le dit lui-même : « Je n’ai pas plus fait mon livre que mon livre m’a fait » (<i>Essais</i>, II, 18, « Du démentir »). Michel Leiris, dans la préface ajoutée en 1946 à <i>L’Âge d’homme</i> (1939), « De la littérature considérée comme une tauromachie », compare l’écriture de soi à une corrida : l’écrivain doit accepter un vrai risque pour que son livre compte.</p>
<div class="plus"><b class="l">Pour aller plus loin</b>Philippe Lejeune (<i>Le Pacte autobiographique</i>, 1975) définit l’autobiographie par l’identité de l’auteur, du narrateur et du personnage, garantie par le nom. Paul Ricœur (<i>Soi-même comme un autre</i>, 1990) propose l’idée d’<b>identité narrative</b> : nous sommes l’histoire que nous racontons de nous-mêmes.</div>
<div class="cle"><b class="l">Pour la copie</b>Voilà de quoi répondre à la question du programme : nous n’accédons jamais à un moi « en soi », mais à des moi racontés, joués, interprétés ; la connaissance de soi est une tâche, pas un constat.</div>` }

  textesIntro: "Sept extraits, du XVI<sup>e</sup> siècle au tournant du XX<sup>e</sup>. Les textes de Montaigne sont cités en orthographe modernisée.",
  textes: [
    { id: "t3-1", auteur: "Montaigne", oeuvre: "Essais, III, 2, « Du repentir »", ref: "1588 (texte de 1595), orthographe modernisée",
      extrait: "Je ne peins pas l’être. Je peins le passage : non un passage d’âge en autre, ou, comme dit le peuple, de sept en sept ans, mais de jour en jour, de minute en minute.",
      contexte: "Montaigne s’est retiré dans sa tour et écrit les <i>Essais</i> de 1572 à sa mort (1592). Le livre III paraît en 1588. Le chapitre s’ouvre sur une comparaison : « Les autres forment l’homme ; je le récite ».",
      analyse: "<p>Deux phrases brèves en <b>parallélisme</b> (« Je ne peins pas… Je peins… ») opposent l’être, immobile, et le passage, mouvant. La correction qui suit (« non… mais… ») et la <b>gradation</b> vers le plus petit (« de jour en jour, de minute en minute ») font entendre l’instabilité même.</p>",
      enjeu: "<p>Si le moi change sans cesse, se connaître ne peut pas consister à saisir une essence : il faut suivre ses variations. L’écriture de soi devient un « essai » au sens propre, une tentative toujours reprise.</p>",
      liens: "Pascal (« Qu’est-ce que le moi ? ») ; Rousseau (<i>Confessions</i>) ; Bergson (la durée) ; Proust (les moi successifs)." },
    { id: "t3-2", auteur: "Rousseau", oeuvre: "Les Confessions, livre I", ref: "rédigé à partir de 1765, publié en 1782",
      extrait: "Je forme une entreprise qui n’eut jamais d’exemple, et dont l’exécution n’aura point d’imitateur. Je veux montrer à mes semblables un homme dans toute la vérité de la nature, et cet homme, ce sera moi.\nMoi seul. Je sens mon cœur, et je connais les hommes. Je ne suis fait comme aucun de ceux que j’ai vus ; j’ose croire n’être fait comme aucun de ceux qui existent. Si je ne vaux pas mieux, au moins je suis autre.",
      contexte: "Rousseau, attaqué de toutes parts après l’<i>Émile</i>, veut répondre à ses ennemis en se montrant tel qu’il est. Le livre est publié après sa mort (1778).",
      analyse: "<p>Le texte procède par <b>hyperboles</b> (« jamais d’exemple », « point d’imitateur ») et retarde le mot décisif : « ce sera moi », relancé par la phrase nominale « Moi seul. » L’<b>anaphore</b> de « je » et la chute paradoxale « au moins je suis autre » font de la singularité une valeur.</p>",
      enjeu: "<p>Peut-on se connaître assez pour se montrer « dans toute la vérité » ? Le pari de la transparence fonde l’autobiographie, mais repose sur une confiance dans le sentiment intérieur (« Je sens mon cœur ») que le XIX<sup>e</sup> et le XX<sup>e</sup> siècle ébranleront.</p>",
      liens: "Saint Augustin (des confessions adressées à Dieu) ; Montaigne ; Chateaubriand ; Freud (ce que le moi ignore de lui-même)." },
    { id: "t3-3", auteur: "Nerval", oeuvre: "Les Chimères, « El Desdichado »", ref: "1854", vers: true,
      extrait: "Je suis le ténébreux, — le veuf, — l’inconsolé,\nLe prince d’Aquitaine à la tour abolie :\nMa seule étoile est morte, — et mon luth constellé\nPorte le Soleil noir de la Mélancolie.",
      contexte: "Nerval a connu plusieurs crises de folie (dès 1841). Le titre espagnol signifie « le déshérité ». Les <i>Chimères</i> paraissent à la suite des <i>Filles du feu</i>.",
      analyse: "<p>La phrase d’ouverture est une <b>définition de soi</b> par accumulation d’attributs, isolés par des tirets : chaque mot semble un masque. L’<b>oxymore</b> « Soleil noir », souvent rapproché de la gravure de Dürer <i>Melencolia I</i>, condense l’éclat et le deuil. Le sonnet passe ensuite à la question : « Suis-je Amour ou Phébus ?… »</p>",
      enjeu: "<p>Le moi se cherche dans des identités empruntées (mythe, histoire, légende) : se dire, c’est se multiplier. L’identité devient une énigme poétique.</p>",
      liens: "Rimbaud (« Je est un autre ») ; Baudelaire (« L’Héautontimorouménos ») ; <i>Aurélia</i> (le rêve comme « seconde vie »)." },
    { id: "t3-4", auteur: "Hugo", oeuvre: "Les Contemplations, préface", ref: "Guernesey, mars 1856",
      extrait: "Est-ce donc la vie d’un homme ? Oui, et la vie des autres hommes aussi. Nul de nous n’a l’honneur d’avoir une vie qui soit à lui. Ma vie est la vôtre, votre vie est la mienne, vous vivez ce que je vis ; la destinée est une. Prenez donc ce miroir, et regardez-vous-y.",
      contexte: "Hugo est en exil depuis le coup d’État de 1851. Le recueil est organisé en deux parties, « Autrefois » et « Aujourd’hui », séparées par la mort de sa fille Léopoldine (1843).",
      analyse: "<p>Question et réponse (<b>dialogisme</b>), puis <b>chiasme</b> (« Ma vie est la vôtre, votre vie est la mienne ») : la construction même échange les places du poète et du lecteur. La métaphore du <b>miroir</b> transforme le livre en lieu de reconnaissance.</p>",
      enjeu: "<p>Le moi lyrique n’est pas égoïste s’il atteint l’universel : parler de soi, c’est parler de tous. Mais cette universalité peut aussi effacer la singularité que revendiquait Rousseau.</p>",
      liens: "Montaigne (« chaque homme porte la forme entière de l’humaine condition », III, 2) ; Rousseau ; Rimbaud, qui critique ce lyrisme." },
    { id: "t3-5", auteur: "Rimbaud", oeuvre: "Lettre à Paul Demeny dite « du voyant »", ref: "15 mai 1871",
      extrait: "Car Je est un autre. Si le cuivre s’éveille clairon, il n’y a rien de sa faute. Cela m’est évident : j’assiste à l’éclosion de ma pensée : je la regarde, je l’écoute : je lance un coup d’archet : la symphonie fait son remuement dans les profondeurs, ou vient d’un bond sur la scène.",
      contexte: "Rimbaud a seize ans ; il vit à Charleville pendant la Commune de Paris. Il envoie à Demeny, poète ami d’Izambard, une lettre-manifeste avec des poèmes. La lettre n’est publiée qu’en 1912.",
      analyse: "<p>La <b>faute grammaticale</b> voulue (« Je est ») et les <b>métaphores musicales</b> (cuivre, clairon, archet, symphonie) font du moi un instrument. Les deux-points enchaînés imitent une pensée qui jaillit. Le poète est spectateur (« j’assiste ») de ce qui naît en lui.</p>",
      enjeu: "<p>Le moi n’est pas l’auteur de ses pensées : quelque chose pense en lui. Ce renversement annonce le soupçon de Nietzsche et de Freud.</p>",
      liens: "Lettre à Izambard du 13 mai (« On me pense ») ; Freud (l’inconscient) ; le surréalisme et l’écriture automatique (Breton, 1924)." },
    { id: "t3-6", auteur: "Maupassant", oeuvre: "Le Horla (version de 1887)", ref: "journal du narrateur, 14 août",
      extrait: "Je suis perdu ! Quelqu’un possède mon âme et la gouverne ! quelqu’un ordonne tous mes actes, tous mes mouvements, toutes mes pensées. Je ne suis plus rien en moi, rien qu’un spectateur esclave et terrifié de toutes les choses que j’accomplis.",
      contexte: "Nouvelle fantastique (une première version paraît en 1886, la version définitive, sous forme de journal, en 1887). Maupassant fréquente les cours du neurologue Charcot sur l’hypnose et l’hystérie.",
      analyse: "<p>Phrases <b>exclamatives</b>, <b>gradation</b> ternaire (« tous mes actes, tous mes mouvements, toutes mes pensées »), répétition de « rien » : l’écriture mime la dépossession. Le paradoxe « spectateur […] de toutes les choses que j’accomplis » sépare l’agent et la conscience.</p>",
      enjeu: "<p>Si mes actes ne viennent plus de « moi », qui agit ? Le fantastique laisse la question ouverte (folie ou être invisible ?) et rejoint l’interrogation du programme : « Toutes mes actions et toutes mes pensées émanent-elles de “moi” au même degré ? »</p>",

    { id: "t3-7", auteur: "Nietzsche", oeuvre: "Le Gai Savoir, § 270", ref: "1882, trad. Henri Albert (1901)",
      extrait: "Que dit ta conscience ? — « Tu dois devenir celui que tu es. »",
      contexte: "L’aphorisme appartient à une série de questions et réponses brèves à la fin du livre III. La formule reprend un vers du poète grec Pindare (« Deviens ce que tu es »).",
      analyse: "<p>Forme de <b>dialogue</b> intérieur réduit à une question et une réponse. Le <b>paradoxe</b> est dans la formule : il faudrait devenir ce qu’on est déjà. L’impératif moral (« Tu dois ») vient de la conscience, mais pour commander une création de soi.</p>",

(function () {
  var e = HLP.ENTREES[HLP.ENTREES.length - 1];
  e.sujet.q1.intro = `<p>« On se plaint quelquefois des écrivains qui disent moi » : en 1856, depuis son exil de Guernesey, Hugo anticipe dans la préface des <i>Contemplations</i> le reproche fait au lyrisme romantique, celui de l’égoïsme. Il présente pourtant son recueil comme les « Mémoires d’une âme », c’est-à-dire comme l’histoire la plus intime qui soit. Comment le récit d’une vie singulière peut-il devenir, selon le mot du texte, un « miroir » où le lecteur se reconnaît ? Nous verrons d’abord comment Hugo définit son livre comme l’histoire d’une conscience, puis comment cette histoire se généralise jusqu’à devenir celle de tous, avant d’étudier la manière dont il retourne contre ses critiques l’accusation de parler de soi.</p>`;
  e.sujet.q1.plan = [
    ["I. Les « Mémoires d’une âme » : l’histoire d’une conscience (l. 1-11)", `<ul class="puces"><li>Une définition par question-réponse et par <b>modalisation</b> (« si le mot n’avait quelque prétention ») : le genre des mémoires, d’ordinaire consacré aux événements publics, est appliqué à l’âme.</li><li>L’<b>énumération</b> (« toutes les impressions, tous les souvenirs, toutes les réalités, tous les fantômes ») et les rythmes doubles (« rayon à rayon, soupir à soupir ») disent une totalité intérieure, lumière et douleur mêlées.</li><li>Une vie entière en <b>antithèses</b> : « l’énigme du berceau » / « l’énigme du cercueil », « un sourire » / « un sanglot » / « le clairon de l’abîme ». Le parcours de « lueur en lueur » dessine un itinéraire spirituel vers « l’infini ».</li></ul>` ],
    ["II. Du « je » au « nous » : une destinée commune (l. 12-14)", `<ul class="puces"><li>La question rhétorique « Est-ce donc la vie d’un homme ? » appelle une réponse qui élargit : « Oui, et la vie des autres hommes aussi. »</li><li>Le <b>chiasme</b> « Ma vie est la vôtre, votre vie est la mienne » échange les places ; la formule brève « la destinée est une » a la force d’une maxime.</li><li>La métaphore du <b>miroir</b> et l’impératif (« Prenez donc », « regardez-vous-y ») font du lecteur un acteur : lire, c’est se reconnaître.</li></ul>` ],
    ["III. Retourner l’accusation : « quand je vous parle de moi, je vous parle de vous » (l. 15-17)", `<ul class="puces"><li>Hugo met en scène ses critiques au <b>discours rapporté</b> (« Parlez-nous de nous, leur crie-t-on ») pour mieux les réfuter.</li><li>Le <b>parallélisme</b> « je vous parle de moi / je vous parle de vous » répond terme à terme ; l’interjection « Hélas ! » donne au poète le rôle de celui qui comprend.</li><li>La dernière phrase, au tutoiement (« Ah ! insensé, qui crois que je ne suis pas toi ! »), abolit la distance : le moi lyrique se veut universel. Limite : cette fusion peut effacer la singularité du lecteur, ce que Rimbaud reprochera aux romantiques.</li></ul>` ]
  ];
  e.sujet.q1.concl = `<p>Hugo transforme le récit de son âme en miroir par un double mouvement : il donne à sa vie intime l’ampleur d’une destinée, de « l’énigme du berceau » à « l’énigme du cercueil », puis il fait glisser les pronoms du « je » au « vous » et au « toi », jusqu’à affirmer l’identité du poète et du lecteur. Le lyrisme n’est plus égoïsme mais partage. Cette ambition universelle sera contestée : Rimbaud, quinze ans plus tard, écrira « Je est un autre », non pour dire que le poète est tout le monde, mais qu’il ne coïncide même pas avec lui-même.</p>`;
  e.sujet.q2.intro = `<p>« Hélas ! quand je vous parle de moi, je vous parle de vous » : dans la préface des <i>Contemplations</i> (1856), Hugo répond à ceux qui reprochent aux écrivains de dire « moi » que l’expérience intime est aussi celle de tous. Cette thèse heurte pourtant une conviction répandue : le moi serait ce que j’ai de plus propre, l’intériorité que personne ne peut connaître à ma place. Parler de soi, c’est se décrire, se raconter ou s’exprimer ; parler des autres, c’est dire leur expérience ou parler d’eux. Le problème est alors le suivant : la parole sur soi est-elle nécessairement une parole sur l’humanité commune, ou bien la singularité du moi résiste-t-elle à tout partage ? Nous verrons d’abord que parler de soi semble nous enfermer dans une expérience incommunicable, puis que l’on ne peut pourtant se dire qu’avec et par les autres, avant de chercher à quelles conditions la parole sur soi devient vraiment une parole sur tous.</p>`;
  e.sujet.q2.plan = [
    ["I. Parler de soi, c’est d’abord dire ce qui n’appartient qu’à soi", `<ul class="puces"><li>Rousseau, <i>Confessions</i> : « Je ne suis fait comme aucun de ceux que j’ai vus » ; l’autobiographie fonde sa valeur sur la singularité.</li><li>L’expérience vécue est en première personne : ma douleur, mon souvenir ne se transmettent pas tels quels. Bergson : « le mot brutal » écrase les impressions individuelles.</li><li>Parler de soi peut même se faire contre les autres : se justifier, se distinguer (Rousseau répond à ses « ennemis »).</li></ul>` ],
    ["II. Mais on ne se dit qu’avec les autres", `<ul class="puces"><li>Le langage est commun : pour me dire, j’emploie des mots appris des autres, qui ont un usage public (Wittgenstein).</li><li>Le moi se forme dans le regard et le jugement d’autrui : Sartre, <i>Huis clos</i> (1944) ; Pirandello, <i>Un, personne et cent mille</i> (1926). Parler de soi, c’est toujours parler de ce que les autres ont fait de nous.</li><li>Montaigne : « chaque homme porte la forme entière de l’humaine condition » (<i>Essais</i>, III, 2). En se peignant, il peint l’homme.</li></ul>` ],
    ["III. Ce n’est pas automatique : parler de soi devient parler de tous par un travail", `<ul class="puces"><li>Le bavardage sur soi n’intéresse personne : Pascal, « Le moi est haïssable » quand il se fait centre de tout.</li><li>C’est la forme qui universalise : Hugo construit sa vie en destinée (texte) ; Proust : « Par l’art seulement, nous pouvons sortir de nous ».</li><li>Et cette universalité n’efface pas l’écart : Rimbaud, « Je est un autre », rappelle que parler de soi, c’est aussi découvrir un autre en soi. Parler de soi, c’est parler d’autrui en nous.</li></ul>` ]
  ];
  e.sujet.q2.concl = `<p>Parler de soi semble d’abord nous isoler, tant l’expérience vécue est singulière ; mais on ne se dit qu’avec la langue des autres, et l’on ne se connaît que sous leur regard, si bien que toute parole sur soi porte la trace d’autrui. Ce n’est pourtant pas « toujours » une parole sur tous : il faut un travail de la forme, celui de Montaigne, de Hugo ou de Proust, pour que le récit d’une vie devienne miroir. Parler de soi n’est donc pas nécessairement parler des autres, mais c’est la seule manière de leur parler vraiment de ce qu’ils vivent.</p>`;

<section><h3>Définitions</h3><ul class="puces"><li><b>Moi</b> (ce que je suis pour moi) / <b>sujet</b> (qui pense, agit) / <b>personne</b> (être moral, responsable) / <b>individu</b> (être singulier).</li><li><b>Sincérité</b> (dire ce qu’on pense) ≠ <b>authenticité</b> (être ce qu’on vit) ≠ <b>vérité</b>.</li><li><b>Inconscient</b> (Freud) ; <b>mauvaise foi</b> (Sartre) ; <b>aliénation</b> ; <b>double</b>.</li></ul></section>
<section><h3>Thèses et auteurs</h3><ul class="puces"><li><b>Augustin</b> : « Je suis devenu pour moi-même une énigme ».</li><li><b>Montaigne</b> : « Je ne peins pas l’être. Je peins le passage » ; « Je n’ai pas plus fait mon livre que mon livre m’a fait ».</li><li><b>Descartes</b> : « Je pense, donc je suis » (1637) ; « une chose qui pense » (1641).</li><li><b>Pascal</b> : « Le moi est haïssable » ; on n’aime que des qualités.</li><li><b>Rousseau</b> : « Si je ne vaux pas mieux, au moins je suis autre » ; sincérité et singularité.</li><li><b>Hugo</b> : « quand je vous parle de moi, je vous parle de vous ».</li><li><b>Musset</b>, Lorenzo : le masque « collé à ma peau ».</li><li><b>Nerval, Baudelaire, Stevenson, Maupassant</b> : le moi divisé, le double.</li><li><b>Rimbaud</b> : « Je est un autre », « On me pense » (1871).</li><li><b>Nietzsche</b> : « Tu dois devenir celui que tu es ». <b>Freud</b> : le moi « n’est pas maître dans sa propre maison ». <b>Bergson</b> : moi profond / moi superficiel.</li><li><b>Sartre</b> : mauvaise foi (le garçon de café) ; le regard d’autrui.</li></ul></section>
<section><h3>Le problème en une phrase</h3><p>Le moi se croit transparent et unifié ; la littérature et la philosophie modernes montrent qu’il est mouvant, divisé et en partie inconnu de lui-même : se connaître est une tâche, souvent une écriture.</p></section>
<section><h3>Trois citations à savoir par cœur</h3><ul class="puces"><li>« Je ne peins pas l’être. Je peins le passage » (Montaigne)</li><li>« Car Je est un autre. » (Rimbaud)</li><li>« Hélas ! quand je vous parle de moi, je vous parle de vous. » (Hugo)</li></ul></section>`;

<p>L’intitulé du sujet dit toujours quelle approche est attendue. Si l’interprétation est littéraire, l’essai est philosophique, et inversement : sur les sujets de métropole de 2023 à 2026, les deux combinaisons sont tombées.</p>

<p><b>Essai</b> : « attention portée à la question posée, à ce qui la justifie, en général mais toujours aussi au regard du texte étudié » ; réponse précise, ordonnée, argumentée ; mobilisation « à bon escient » des connaissances acquises.</p>

<section id="ep-interp"><h2>Méthode : la question d’interprétation</h2>
<p>Il ne s’agit ni d’un commentaire composé complet, ni d’une explication linéaire : tu réponds à <b>une question précise</b> en t’appuyant sur les éléments du texte qui l’éclairent le mieux.</p>
<ol class="plan-l">
<li><b>1. Lire le texte trois fois (20 min)</b><br>Une lecture pour comprendre (thème, thèse ou situation), une pour repérer les mouvements (avec les lignes), une crayon en main pour souligner ce qui répond à la question.</li>

<li><b>3. Brouillon en tableau (30 min)</b><br>Trois colonnes : <i>citation (avec ligne)</i> · <i>ce que je remarque</i> (procédé, concept, argument) · <i>ce que ça signifie pour la question</i>. Regroupe ensuite en deux ou trois idées : ce seront tes parties.</li>
<li><b>4. Rédiger l’introduction (au propre directement ou presque)</b><br>Amorce liée au texte · présentation (auteur, œuvre, date, situation) · reformulation de la question en problème · réponse annoncée (thèse) · plan.</li>

<section id="ep-essai"><h2>Méthode : l’essai</h2>
<p>L’essai répond à une question « soulevée par le texte ». C’est une réflexion argumentée, construite comme une dissertation courte, qui doit <b>partir du texte et y revenir</b>.</p>

<li><b>1. Analyser les termes (15 min)</b><br>Définis chaque mot important, cherche ses sens différents, les mots voisins et contraires. « Peut-on être heureux sans penser ? » : « peut-on » (possibilité ? droit ?), « heureux » (bonheur ≠ plaisir), « penser » (réfléchir ? juger ? se représenter l’avenir ?).</li>
<li><b>2. Trouver le problème (15 min)</b><br>Une tension entre deux réponses également défendables. Formule-la en une phrase : « D’un côté… mais de l’autre… ». La thèse du texte est souvent l’une des deux réponses.</li>
<li><b>3. Construire un plan (30 min)</b><br>Deux ou trois parties qui <b>progressent</b> : la réponse la plus évidente, ses limites, une réponse plus juste qui tient compte des deux. Chaque partie : deux ou trois arguments, chacun avec un exemple précis (une œuvre, un auteur, une scène, une date).</li>

<section id="ep-erreurs"><h2>Les erreurs fréquentes</h2>
<ul class="puces">
<li><b>La paraphrase</b> : répéter le texte avec d’autres mots. Remède : chaque citation doit être suivie d’une analyse (« le verbe… montre que… »).</li>
<li><b>Le catalogue</b> : « il y a une métaphore, une anaphore, une hyperbole ». Remède : un procédé n’a d’intérêt que par ce qu’il fait au sens.</li>
<li><b>La récitation du cours</b> dans l’essai, sans rapport avec la question. Le barème la place entre 2 et 4.</li>
<li><b>Oublier le texte dans l’essai</b> : l’échelle officielle demande de répondre « toujours aussi au regard du texte étudié ».</li>

<li><b>Négliger la langue</b> : elle compte dans la note des deux parties.</li>

<h3>Interprétation philosophique : la copie rédigée</h3>
<div class="copie">
<div class="seg"><p>On imagine volontiers que l’école sert d’abord à instruire : apprendre à lire, à compter, à raisonner. Dans ce passage des <i>Cinq mémoires sur l’instruction publique</i> (1791), Condorcet, philosophe des Lumières élu député à l’Assemblée législative la même année, affirme pourtant que les « premiers sentiments auxquels il faut exercer l’âme des enfants » sont la pitié pour l’homme et pour les animaux, et l’affection pour ceux qui nous font du bien.</p></div>
<div class="marge">Amorce qui part d’une idée reçue que le texte contredit. Présentation exacte : auteur, œuvre, date, sujet.</div>
<div class="seg"><p>Pourquoi un penseur si attaché à la raison place-t-il un sentiment au fondement de l’éducation ? Condorcet répond que la pitié, naturelle mais fragile, est le principe actif de toute moralité et une condition de la liberté du peuple : il faut l’exercer pour qu’elle ne s’éteigne pas. Nous verrons d’abord que la pitié est un sentiment naturel que l’éducation doit seulement rendre attentif (l. 1-8), puis qu’elle fonde la moralité et qu’une mauvaise habitude peut la détruire (l. 9-17), avant de montrer sa portée politique (l. 17-21).</p></div>
<div class="marge">La question devient un problème (un paradoxe : raison / sentiment). La thèse est annoncée avec ses raisons, le plan suit les mouvements du texte, lignes à l’appui.</div>
<div class="seg"><p><b>I.</b> Condorcet ne demande pas à l’école de créer la pitié. Ces sentiments sont « de tous les âges » et « fondés sur des motifs simples et voisins de nos sensations immédiates de plaisir ou de peine » : ils sont naturels et précoces, puisqu’ils existent « aussitôt que nous pouvons avoir l’idée distincte d’un individu ». Le rôle de l’éducation est donc modeste et précis : « nous n’avons besoin que d’en être avertis pour apprendre à les apercevoir, à les reconnaître, à les distinguer ». La gradation des trois verbes décrit une éducation de l’<b>attention</b> : percevoir le sentiment, l’identifier, puis le différencier des autres. Le verbe « exercer » le confirme : on exerce ce qui existe déjà, comme un muscle. On retrouve ici une idée de Rousseau, pour qui la pitié est un sentiment naturel antérieur à la réflexion ; mais Condorcet en tire une tâche pour l’école.</p></div>
<div class="marge">Citations courtes, intégrées à la phrase, analysées (gradation, sens du verbe « exercer »). Une connaissance (Rousseau) est mobilisée « à bon escient » : elle éclaire le texte au lieu de le remplacer.</div>
<div class="seg"><p><b>II.</b> Pourquoi cette éducation est-elle si importante ? Parce que la pitié est « le premier principe actif de toute moralité comme de toute vertu ». Condorcet l’explique par son origine : une « douleur irréfléchie et presque organique » produite par la vue des souffrances « d’un autre être sensible ». Le critère n’est pas l’espèce mais la sensibilité ; c’est pourquoi « la pitié pour les animaux a le même principe que la pitié pour les hommes ». L’argument est alors redoutable : habituer un enfant à voir souffrir des animaux « avec indifférence ou même avec plaisir », c’est détruire en lui, « même à l’égard des hommes », le germe de la moralité. La gradation « on affaiblit, on détruit » montre qu’une habitude suffit à corrompre une nature. Sans ce sentiment, la morale ne serait plus qu’« un calcul d’intérêt », « une froide combinaison de la raison » : pour un rationaliste des Lumières, l’aveu est remarquable. La raison calcule, mais seule la sensibilité met en mouvement. D’où l’impératif collectif « Gardons-nous » et la métaphore de la « plante faible encore, qu’un instant peut flétrir » : l’éducation doit protéger une fragilité.</p></div>
<div class="marge">Le cœur de l’argument est reconstitué (principe → conséquence → menace). Les concepts sont nommés (moralité, raison, sensibilité) et le texte est situé dans son époque sans hors-sujet.</div>
<div class="seg"><p><b>III.</b> La dernière phrase élargit la perspective : de l’enfant, on passe au « peuple ». Chez l’homme « occupé de travaux grossiers qui émoussent sa sensibilité », « l’habitude de la dureté » produit une « disposition à la férocité ». Or cette férocité est « le plus grand ennemi des vertus et de la liberté du peuple, la seule excuse des tyrans, le seul prétexte spécieux de toutes les lois inégales ». La phrase culmine en trois groupes de plus en plus politiques : si le peuple paraît féroce, les tyrans justifient leur pouvoir par la nécessité de le contenir, et les lois inégales par son incapacité supposée à être libre. Éduquer la sensibilité de tous, c’est donc retirer aux despotes leur meilleur argument. On comprend alors pourquoi ce passage figure dans un mémoire sur l’<b>instruction publique</b> : l’égalité des droits suppose des citoyens que la dureté n’a pas abrutis. On peut seulement regretter que Condorcet attribue la dureté au travail « grossier » plutôt qu’aux conditions qui l’imposent ; mais sa conclusion est justement qu’il faut une éducation pour tous.</p></div>
<div class="marge">Mise au jour d’un implicite (la logique des tyrans), lien avec le projet d’ensemble de l’œuvre, et une nuance critique, brève et argumentée : c’est ce qui fait passer au-dessus de 8.</div>
<div class="seg"><p>Il faut donc exercer l’âme des enfants à la pitié parce que ce sentiment, naturel mais fragile, est le principe actif de toute moralité, et parce que, laissé s’émousser, il fait place à une férocité dont les tyrans font leur excuse. Condorcet donne ainsi à l’éducation de la sensibilité une portée à la fois morale et politique. Reste à savoir quels moyens permettent cet exercice : la littérature, qui nous fait éprouver la souffrance de personnages imaginaires, pourrait en être un.</p></div>
<div class="marge">Réponse nette à la question posée, en reprenant ses termes. Ouverture qui prépare l’essai sans le traiter.</div>
</div>

<h3>Essai littéraire : introduction, plan et conclusion</h3>
<div class="copie">
<div class="seg"><p>Condorcet voulait qu’on exerce « l’âme des enfants » à la pitié pour que ne naisse pas la férocité. La littérature, qui nous fait pleurer sur des personnages qui n’existent pas, semble l’instrument idéal de cette éducation. Pourtant, faire de l’éducation de la sensibilité sa « vocation », c’est-à-dire sa raison d’être, revient à la juger sur sa moralité plutôt que sur sa beauté, et l’histoire littéraire montre qu’elle peut aussi égarer nos émotions. La littérature a-t-elle pour fin d’éduquer notre sensibilité, ou cette éducation n’est-elle qu’un effet, parfois ambigu, de ce qu’elle fait d’abord : donner forme à ce que l’on sent ?</p></div>
<div class="marge">Amorce par le texte. Le mot « vocation » est défini : c’est lui qui crée le problème.</div>
<div class="seg"><p><b>I. La littérature affine la sensibilité.</b> Elle fait éprouver la pitié et la crainte (Aristote, <i>Poétique</i>, à propos de la tragédie) ; les lecteurs de <i>La Nouvelle Héloïse</i> (1761) pleurent et écrivent à Rousseau ; Hugo, dans « Melancholia » (<i>Les Contemplations</i>, 1856), fait voir des enfants au travail pour éveiller la pitié sociale. Proust : « Par l’art seulement, nous pouvons sortir de nous ».<br><b>II. Mais ce n’est pas sa vocation, et elle peut dérégler la sensibilité.</b> Emma Bovary a une sensibilité faussée par les romans lus au couvent (Flaubert, 1857). Gautier proclame que rien n’est vraiment beau que ce qui ne sert à rien (préface de <i>Mademoiselle de Maupin</i>, 1835). Diderot montre que l’art émeut par la maîtrise et non par la sensibilité.<br><b>III. Elle éduque la sensibilité en la rendant lucide.</b> Flaubert, en montrant les clichés d’Emma, apprend au lecteur à reconnaître les siens ; Baudelaire invente des manières de sentir (correspondances) ; Rimbaud fait du « dérèglement » une méthode « raisonnée ». Comme le voulait Condorcet, il s’agit moins d’imposer des émotions que d’apprendre à les « apercevoir », « reconnaître », « distinguer ».</p></div>
<div class="marge">Un plan qui progresse : thèse, limites, dépassement. Chaque argument porte un exemple précis (titre, date, scène). La troisième partie revient au texte.</div>
<div class="seg"><p>La littérature éduque bien la sensibilité, mais ce n’est pas sa vocation première : lorsqu’elle se fait leçon, elle risque de fabriquer des émotions convenues, et elle peut même égarer ceux qui confondent la vie et les livres. Son pouvoir est plus subtil : en donnant forme à ce que nous sentons, elle nous apprend à distinguer nos émotions vraies de celles que nous croyons éprouver. Elle n’éduque pas comme un maître qui commande, mais comme une expérience qui rend attentif.</p></div>
<div class="marge">La réponse est nuancée sans être tiède : elle reprend le mot « vocation » et tranche.</div>
</div>
</section>

<section id="ep-go"><h2>Le Grand oral en quelques lignes</h2>
<p>À partir de la session 2027 (note de service du 10 septembre 2026) : 20 minutes de préparation, 20 minutes d’épreuve, <b>coefficient 8</b>. Tu présentes au jury <b>deux questions</b> adossées à tes deux spécialités (une par spécialité, ou transversales) ; le jury en choisit une. Premier temps (10 min, debout) : tu expliques pourquoi tu as choisi la question, tu la développes et tu y réponds. Second temps (10 min) : échange avec le jury, qui peut t’interroger sur tout le programme du cycle terminal de tes spécialités. Aucun matériel autorisé hormis de quoi écrire ; un support peut être préparé pendant les 20 minutes, il n’est pas évalué.</p>
<div class="ex"><b class="l">Idées de questions HLP</b>« Peut-on se connaître en écrivant sur soi ? » · « L’école libère-t-elle ? » · « Faut-il se méfier de ses émotions ? » · « Les réseaux sociaux changent-ils notre rapport à nous-mêmes ? » (à croiser avec l’entrée « L’humain et ses limites »).</div>
</section>

    INDEX = [];
    D.ENTREES.forEach(function (e) {
      INDEX.push({ t: e.titre, c: "Entrée " + e.num, h: "#" + e.id, x: brut(e.chapo + " " + e.essentiel.join(" ")) });
      e.cours.forEach(function (c) { INDEX.push({ t: c.titre, c: e.titre, h: "#" + e.id, g: c.id, x: brut(c.html) }); });
      e.textes.forEach(function (t) { INDEX.push({ t: t.auteur + ", " + brut(t.oeuvre), c: "Texte clé · " + e.titre, h: "#" + e.id + "/textes", g: t.id, x: brut(t.extrait + " " + t.contexte + " " + t.analyse) }); });
      e.notions.forEach(function (n) { INDEX.push({ t: brut(n[0]), c: "Notion · " + e.titre, h: "#" + e.id, x: brut(n[1]) }); });
      INDEX.push({ t: "Sujet type bac : " + brut(e.sujet.ref), c: e.titre, h: "#" + e.id + "/sujet", x: brut(e.sujet.q1.q + " " + e.sujet.q2.q) });
    });
    D.NOTIONS.forEach(function (n) { INDEX.push({ t: brut(n.n), c: "Tableau des notions", h: "#notions", x: brut(n.d + " " + n.dist + " " + n.a) }); });
    D.FRISE.forEach(function (p) { p.evts.forEach(function (ev) { INDEX.push({ t: ev[0] + " — " + brut(ev[1]).slice(0, 80), c: "Frise · " + brut(p.nom), h: "#frise", x: brut(ev[1]) }); }); });
    D.S2.forEach(function (e) { INDEX.push({ t: e.titre, c: "Semestre 2 · Bientôt", h: "#s2", x: brut(e.resume + " " + e.questions.join(" ")) }); });
    D.QUI.forEach(function (q) { INDEX.push({ t: "« " + brut(q.c) + " »", c: "Citation · " + q.a, h: "#qui", x: q.a + " " + q.o }); });
    D.PAGES_IDX.forEach(function (p) { INDEX.push(p); });
    INDEX.forEach(function (it) { it.n = norm(it.t + " " + it.c + " " + it.x); it.nt = norm(it.t); });
  }
  var srch = $("#srch"), sq = $("#sq"), sres = $("#sres"), srchOuvert = false;
  function ouvrirRecherche() {
    if (srchOuvert) return;
    if (!INDEX) construireIndex();
    srchOuvert = true; srch.classList.add("on");
    history.pushState({ srch: 1 }, "");
    sq.value = ""; sres.innerHTML = '<p class="mute">Tape un auteur, une œuvre, une notion, une date…</p>';
    setTimeout(function () { sq.focus(); }, 30);
  }
  function fermerRecherche(depuisPop) {
    if (!srchOuvert) return;
    srchOuvert = false; srch.classList.remove("on");
    if (!depuisPop && history.state && history.state.srch) history.back();
  }
  var minuteur = null;
  sq.addEventListener("input", function () {
    clearTimeout(minuteur);
    minuteur = setTimeout(function () {
      var q = norm(sq.value).trim();
      if (q.length < 2) { sres.innerHTML = '<p class="mute">Au moins deux lettres.</p>'; return; }
      var mots = q.split(/\s+/), r = [];
      INDEX.forEach(function (it) {
        var ok = mots.every(function (m) { return it.n.indexOf(m) >= 0; }); if (!ok) return;
        var sc = mots.reduce(function (s, m) { return s + (it.nt.indexOf(m) >= 0 ? 3 : 1); }, 0);
        r.push([sc, it]);
      });
      r.sort(function (a, b) { return b[0] - a[0]; });
      if (!r.length) { sres.innerHTML = '<p class="mute">Rien trouvé. Essaie un autre mot.</p>'; return; }
      sres.innerHTML = ty(r.slice(0, 40).map(function (x, k) {
        var it = x[1], ex = "", nx = norm(it.x), p = nx.indexOf(mots[0]);
        if (p >= 0) { var d = Math.max(0, p - 50); ex = (d ? "…" : "") + esc(it.x.slice(d, p + 110)) + "…"; }
        return '<a href="' + it.h + '" data-res="' + k + '"' + (it.g ? ' data-g="' + it.g + '"' : "") + "><span>" + esc(it.c) + "</span><b>" + esc(it.t) + "</b>" + (ex ? "<small>" + ex + "</small>" : "") + "</a>";
      }).join(""));
    }, 120);
  });
  sres.addEventListener("click", function (ev) {
    var a = ev.target.closest("a"); if (!a) return;
    ev.preventDefault();
    srchOuvert = false; srch.classList.remove("on");
    allerA = a.getAttribute("data-g");
    history.replaceState(null, "", a.getAttribute("href"));
    router();
  });
  $("#btn-cherche").addEventListener("click", ouvrirRecherche);
  $("#srch-fermer").addEventListener("click", function () { fermerRecherche(false); });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName))) { e.preventDefault(); ouvrirRecherche(); }
    else if (e.key === "Escape") { if (srchOuvert) fermerRecherche(false); else if (menu.classList.contains("ouvert")) ouvrirMenu(false); }
  });
  window.addEventListener("popstate", function (e) { if (srchOuvert && !(e.state && e.state.srch)) fermerRecherche(true); });

  /* ---------- routeur ---------- */
  var allerA = null;
  function router() {
    var h = (location.hash || "#accueil").slice(1), parts = h.split("/"), r = parts[0] || "accueil", sous = parts[1] || "";
    var e = entree(r), html;
    if (e) html = pageEntree(e, ONGLETS.some(function (o) { return o[0] === sous; }) ? sous : "");
    else if (PAGES[r]) html = PAGES[r]();
    else { r = "accueil"; html = PAGES.accueil(); }
    main.innerHTML = ty(html) + '<footer class="pied">' + D.PIED + "</footer>";
    $$("#menu a").forEach(function (a) { var x = a.getAttribute("data-r"); a.classList.toggle("actif", x === r && r !== "s2"); if (x === r) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    document.title = (e ? e.titre : (D.TITRES[r] || "Accueil")) + " · L’Heure bleue — HLP Terminale";
    if (e && sous === "qcm") lancerQCM($("#qcm-zone"), melange(e.qcm));
    if (e && sous === "cartes") lancerCartes($("#fc-zone"), e.cartes);
    if (r === "entrainement") {
      var tous = []; D.ENTREES.forEach(function (x) { x.qcm.forEach(function (q) { tous.push(q); }); });
      lancerQCM($("#qcm-zone"), melange(tous).slice(0, 15));
      lancerCartes($("#fc-zone"), toutesCartes());
    }
    if (r === "qui") lancerQui();
    if (r === "atelier") remplirAtelier(0);
    if (r === "notions") remplirNotions();
    if (r === "frise") observerFrise();
    observerSchemas();
    if (allerA) {
      var cible = document.getElementById(allerA); allerA = null;
      if (cible) {
        cible.scrollIntoView({ block: "start" });
        if (cible.classList.contains("idee")) { cible.classList.add("surligne"); setTimeout(function () { cible.classList.add("fini"); }, 60); }
        return;
      }
    }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", router);

  /* ---------- délégation ---------- */
  main.addEventListener("click", function (ev) {
    var g = ev.target.closest("[data-goto]");
    if (g) { ev.preventDefault(); allerA = g.getAttribute("data-goto"); var hh = g.getAttribute("href"); if (location.hash === hh) router(); else location.hash = hh; return; }
    if (ev.target.closest("[data-imprimer]")) { window.print(); return; }
    var at = ev.target.closest("[data-at]");
    if (at) { $$("[data-at]").forEach(function (b) { b.setAttribute("aria-pressed", b === at ? "true" : "false"); }); remplirAtelier(+at.getAttribute("data-at")); return; }
    var cal = ev.target.closest("[data-cal]");
    if (cal) { cal.setAttribute("aria-pressed", cal.getAttribute("aria-pressed") === "true" ? "false" : "true"); appliquerCalques(); return; }
    var seg = ev.target.closest(".seg-a");
    if (seg) { montrerNote(seg); return; }
    var ff = ev.target.closest("[data-ff]");
    if (ff) {
      $$("[data-ff]").forEach(function (b) { b.setAttribute("aria-pressed", b === ff ? "true" : "false"); });
      var f = ff.getAttribute("data-ff");
      $$(".evt").forEach(function (x) { x.style.display = !f || x.getAttribute("data-f") === f ? "" : "none"; });
      return;
    }
    var fn = ev.target.closest("[data-fn]");
    if (fn) { $$("[data-fn]").forEach(function (b) { b.setAttribute("aria-pressed", b === fn ? "true" : "false"); }); remplirNotions(); return; }
    var fct = ev.target.closest("[data-fct]");
    if (fct) {
      $$("[data-fct]").forEach(function (b) { b.setAttribute("aria-pressed", b === fct ? "true" : "false"); });
      var c = fct.getAttribute("data-fct");
      lancerCartes($("#fc-zone"), toutesCartes().filter(function (x) { return !c || x.t === c; }));
    }
  });
  main.addEventListener("keydown", function (ev) { if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList.contains("seg-a")) { ev.preventDefault(); montrerNote(ev.target); } });
  main.addEventListener("input", function (ev) { if (ev.target.id === "filtre-n") remplirNotions(); });
  function montrerNote(seg) {
    var i = +$(".puce-f[data-at][aria-pressed='true']").getAttribute("data-at"), t = D.ATELIER[i], s = t.segs[+seg.getAttribute("data-k")];
    $$(".seg-a.choisi").forEach(function (x) { x.classList.remove("choisi"); }); seg.classList.add("choisi");
    var n = $("#note-a"); n.hidden = false;
    n.innerHTML = ty("<h4>" + (s.m ? "Mouvement " + s.m + " · " : "") + (s.titre || "Note") + '</h4><p style="margin:0">' + s.n + "</p>");
    n.classList.remove("neuf"); void n.offsetWidth; n.classList.add("neuf");
  }

  /* ---------- mouvement ---------- */
  var io = ("IntersectionObserver" in window) && !reduit ? new IntersectionObserver(function (l) {
    l.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add(x.target.classList.contains("evt") ? "vu" : "joue"); io.unobserve(x.target); } });
  }, { rootMargin: "0px 0px -12% 0px" }) : null;
  function observerSchemas() {
    if (!io) return;
    $$("[data-schema]").forEach(function (f) {
      $$(".trace", f).forEach(function (p) { try { p.style.setProperty("--l", Math.ceil(p.getTotalLength()) + 1); } catch (e) {} });
      var r = f.getBoundingClientRect(); if (r.top > innerHeight * 0.88) io.observe(f);
    });
  }
  function observerFrise() {
    if (!io) return;
    $$(".evt").forEach(function (x) { if (x.getBoundingClientRect().top > innerHeight) io.observe(x); });
  }

  construireMenu();
  router();
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(function () {});
})();

</script>
</body>
