  textesIntro: "Sept extraits du domaine public, de Montaigne à Valéry. Ceux de Montaigne sont donnés en orthographe modernisée. Pour les auteurs protégés (Levi, Antelme, Camus, Arendt, Semprun…), le cours résume et cite très brièvement.",
  textes: [
    { id: "t5-1", auteur: "Montaigne", oeuvre: "Essais, I, 31, « Des cannibales »", ref: "1580, orthographe modernisée",
      extrait: "Or je trouve, pour revenir à mon propos, qu’il n’y a rien de barbare et de sauvage en cette nation, à ce qu’on m’en a rapporté : sinon que chacun appelle barbarie ce qui n’est pas de son usage. […] Je pense qu’il y a plus de barbarie à manger un homme vivant qu’à le manger mort, à déchirer par tourments et par géhennes un corps encore plein de sentiment, le faire rôtir par le menu, le faire mordre et meurtrir aux chiens et aux pourceaux (comme nous l’avons non seulement lu, mais vu de fraîche mémoire, non entre des ennemis anciens, mais entre des voisins et concitoyens, et, qui pis est, sous prétexte de piété et de religion), que de le rôtir et manger après qu’il est trépassé.",
      contexte: "Montaigne écrit pendant les guerres de Religion (1562-1598), qui opposent catholiques et protestants. Il a rencontré à Rouen, en 1562, des Indiens du Brésil (Tupinambas) amenés en France.",
      analyse: "<p>Le texte procède par <b>renversement</b> : le mot « barbarie », réservé aux autres, est retourné contre « nous ». La <b>comparaison</b> (« plus de barbarie à… qu’à… ») et l’<b>accumulation</b> des supplices (« déchirer », « rôtir », « faire mordre ») mettent sous les yeux une cruauté que la parenthèse ancre dans l’actualité (« vu de fraîche mémoire »). La chute (« sous prétexte de piété ») dénonce la justification religieuse.</p>",
      enjeu: "<p>La violence la pire n’est pas celle des « sauvages », mais celle qui se donne bonne conscience. Le relativisme du jugement (« chacun appelle barbarie… ») oblige à se demander d’où l’on juge la violence.</p>",
      liens: "Voltaire, <i>Candide</i> (la « boucherie héroïque ») ; Lévi-Strauss, <i>Race et histoire</i> (1952), qui prolonge l’argument contre l’ethnocentrisme ; Césaire, <i>Discours sur le colonialisme</i>." },
    { id: "t5-2", auteur: "Voltaire", oeuvre: "Candide ou l’Optimisme, chapitre 3", ref: "1759",
      extrait: "Rien n’était si beau, si leste, si brillant, si bien ordonné que les deux armées. Les trompettes, les fifres, les hautbois, les tambours, les canons, formaient une harmonie telle qu’il n’y en eut jamais en enfer. Les canons renversèrent d’abord à peu près six mille hommes de chaque côté ; ensuite la mousqueterie ôta du meilleur des mondes environ neuf à dix mille coquins qui en infectaient la surface. La baïonnette fut aussi la raison suffisante de la mort de quelques milliers d’hommes. Le tout pouvait bien se monter à une trentaine de mille âmes. Candide, qui tremblait comme un philosophe, se cacha du mieux qu’il put pendant cette boucherie héroïque.",
      contexte: "Conte philosophique écrit pendant la guerre de Sept Ans (1756-1763). Candide, chassé du château, a été enrôlé de force par les Bulgares (figure des Prussiens), en guerre contre les Abares.",
      analyse: "<p>L’<b>ironie</b> repose sur le décalage entre l’éloge (« si beau, si leste, si brillant ») et la chute « en enfer ». Les chiffres, d’une précision comptable, transforment les morts en quantités. Le vocabulaire de l’optimisme de Leibniz (« meilleur des mondes », « raison suffisante ») est retourné contre lui. L’<b>oxymore</b> « boucherie héroïque » condense la dénonciation.</p>",
      enjeu: "<p>La guerre se présente comme un spectacle ordonné et glorieux ; l’ironie en révèle la vérité de massacre. Elle vise aussi la philosophie qui justifie le mal au nom d’un ordre supérieur, comme le feront plus tard certaines philosophies de l’histoire.</p>",
      liens: "Montaigne ; Apollinaire, « Ah Dieu ! que la guerre est jolie » ; Barbusse, <i>Le Feu</i>." },
    { id: "t5-3", auteur: "Kant", oeuvre: "Projet de paix perpétuelle, deuxième section", ref: "1795, trad. Jules Barni (1853)",
      extrait: "L’état de paix parmi les hommes vivant les uns à côté des autres n’est pas un état de nature (status naturalis), lequel est bien plutôt un état de guerre, sinon toujours déclarée, du moins toujours menaçante. Il a donc besoin d’être établi ; car la cessation des hostilités n’est pas encore une garantie, et si un voisin n’obtient pas d’un autre cette garantie (ce qui ne peut avoir lieu que dans un état légal), il peut traiter en ennemi celui de qui il l’a vainement sollicitée.",
      contexte: "Kant écrit après le traité de Bâle (1795) entre la Prusse et la France révolutionnaire. L’ouvrage imite la forme d’un traité diplomatique, avec des articles « préliminaires » et « définitifs ».",
      analyse: "<p>Une <b>définition négative</b> (« n’est pas un état de nature ») suivie d’une <b>correction</b> (« bien plutôt un état de guerre ») ; la gradation « sinon toujours déclarée, du moins toujours menaçante » élargit la guerre à la simple menace. La conséquence (« Il a donc besoin d’être établi ») fait de la paix une <b>tâche</b>.</p>",
      enjeu: "<p>La paix n’est pas l’absence de combats mais un état <b>juridique</b>, garanti par des lois communes. D’où le projet d’une fédération d’États et d’un droit cosmopolitique : réponse à la question du programme sur le droit capable de limiter durablement la violence.</p>",
      liens: "Hobbes (l’état de nature comme guerre) ; Hugo, 1849 ; la Société des Nations (1920) et l’ONU (1945) ; Pascal (la justice et la force)." },
    { id: "t5-4", auteur: "Hugo", oeuvre: "Actes et paroles, Congrès de la paix, discours d’ouverture", ref: "Paris, 21 août 1849",
      extrait: "Un jour viendra où les armes vous tomberont des mains, à vous aussi ! Un jour viendra où la guerre paraîtra aussi absurde et sera aussi impossible entre Paris et Londres, entre Pétersbourg et Berlin, entre Vienne et Turin, qu’elle serait impossible et qu’elle paraîtrait absurde aujourd’hui entre Rouen et Amiens, entre Boston et Philadelphie. […] Un jour viendra où les boulets et les bombes seront remplacés par les votes, par le suffrage universel des peuples, par le vénérable arbitrage d’un grand sénat souverain qui sera à l’Europe ce que le parlement est à l’Angleterre, ce que la diète est à l’Allemagne, ce que l’assemblée législative est à la France !",
      contexte: "Hugo, député, préside le Congrès international de la paix réuni à Paris, un an après les révolutions de 1848. Le compte rendu note les « applaudissements » de la salle.",
      analyse: "<p>L’<b>anaphore</b> « Un jour viendra » donne au discours la force d’une prophétie. Les <b>parallélismes</b> (Paris et Londres / Rouen et Amiens) rendent la paix future aussi évidente que la paix entre provinces d’un même pays. L’<b>antithèse</b> « les boulets et les bombes » / « les votes » oppose deux manières de régler les conflits.</p>",
      enjeu: "<p>Hugo croit à une histoire orientée vers la paix par l’union politique des peuples. Le XX<sup>e</sup> siècle semblera le démentir (1914, 1939), puis en partie lui donner raison : la construction européenne a rendu la guerre entre la France et l’Allemagne impensable.</p>",

    { id: "t5-5", auteur: "Barbusse", oeuvre: "Le Feu, journal d’une escouade, chapitre XXIV, « L’Aube »", ref: "1916",
      extrait: "— Deux armées qui se battent, c’est comme une grande armée qui se suicide !\n— Tout de même, qu’est-ce que nous sommes depuis deux ans ? De pauvres malheureux incroyables, mais aussi des sauvages, des brutes, des bandits, des salauds.\n[…] ces hommes […] entrevoyaient à quel point la guerre, aussi hideuse au moral qu’au physique, non seulement viole le bon sens, avilit les grandes idées, commande tous les crimes – mais ils se rappelaient combien elle avait développé en eux et autour d’eux tous les mauvais instincts sans en excepter un seul : la méchanceté jusqu’au sadisme, l’égoïsme jusqu’à la férocité, le besoin de jouir jusqu’à la folie.",
      contexte: "Barbusse, engagé volontaire à 41 ans, a combattu en première ligne. <i>Le Feu</i> paraît en feuilleton en 1916, puis en volume ; il reçoit le prix Goncourt en décembre 1916. Le dernier chapitre montre les soldats au matin d’une nuit d’inondation.",
      analyse: "<p>Le chapitre fait entendre des <b>voix</b> de soldats (tirets du dialogue), puis la voix du narrateur qui généralise. La <b>comparaison</b> « une grande armée qui se suicide » renverse la logique des camps : l’humanité se tue elle-même. L’<b>énumération</b> « des sauvages, des brutes, des bandits, des salauds » et le parallélisme « la méchanceté jusqu’au sadisme, l’égoïsme jusqu’à la férocité » disent l’ensauvagement.</p>",
      enjeu: "<p>La guerre ne détruit pas seulement les corps : elle dégrade ceux qui la font. C’est la question du bac 2024 : « Peut-on perdre son humanité ? » Le témoignage devient aussi accusation (le livre finit par un appel à la paix).</p>",
      liens: "Remarque, <i>À l’Ouest, rien de nouveau</i> ; Simone Weil (la force pétrifie aussi ceux qui la manient) ; Aragon, « Classe 17 » (bac 2024)." },
    { id: "t5-6", auteur: "Apollinaire", oeuvre: "Calligrammes, « L’Adieu du cavalier »", ref: "Mercure de France, 1918", vers: true,
      extrait: "Ah Dieu ! que la guerre est jolie\nAvec ses chants ses longs loisirs\nCette bague je l’ai polie\nLe vent se mêle à vos soupirs\n\nAdieu ! voici le boute-selle\nIl disparut dans un tournant\nEt mourut là-bas tandis qu’elle\nRiait au destin surprenant",
      contexte: "Apollinaire s’est engagé en 1914 (artilleur, puis fantassin). Le poème vient d’une lettre de 1915 à Lou. Blessé à la tête le 17 mars 1916, il meurt de la grippe le 9 novembre 1918. Le « boute-selle » est la sonnerie qui ordonne aux cavaliers de seller les chevaux.",
      analyse: "<p>Deux quatrains d’octosyllabes, sans ponctuation, à rimes croisées, comme une <b>chanson</b>. La première strophe accumule les clichés d’une guerre aimable (« chants », « loisirs », bague polie dans les tranchées). La seconde, au passé simple, tue le cavalier en un vers : la <b>rupture de ton</b> et l’<b>ellipse</b> (« Il disparut dans un tournant ») rendent la mort soudaine. Le rire final de la femme, qui ne sait pas, est d’une cruauté glaçante.</p>",
      enjeu: "<p>Le poème ne dénonce pas directement : il fait éprouver l’écart entre l’image de la guerre et sa réalité. Une réponse possible au sujet de 2021 : on peut « représenter la guerre sans la dénoncer », mais la forme dénonce alors à la place du discours.</p>",
      liens: "Voltaire (l’ironie de la « belle » bataille) ; Barbusse ; Éluard, « La Victoire de Guernica »." },
    { id: "t5-7", auteur: "Valéry", oeuvre: "« La Crise de l’esprit », première lettre", ref: "<i>The Athenaeum</i>, avril-mai 1919 ; texte français, <i>NRF</i>, 1919",
      extrait: "Nous autres, civilisations, nous savons maintenant que nous sommes mortelles.\n[…] Et nous voyons maintenant que l’abîme de l’histoire est assez grand pour tout le monde. Nous sentons qu’une civilisation a la même fragilité qu’une vie. […]\nTant d’horreurs n’auraient pas été possibles sans tant de vertus. Il a fallu, sans doute, beaucoup de science pour tuer tant d’hommes, dissiper tant de biens, anéantir tant de villes en si peu de temps ; mais il a fallu non moins de qualités morales. Savoir et Devoir, vous êtes donc suspects ?",
      contexte: "Valéry écrit deux lettres pour une revue londonienne au lendemain de la Grande Guerre (numéros des 11 avril et 2 mai 1919) ; la <i>NRF</i> en publie le texte français la même année.",
      analyse: "<p>La première phrase, isolée, a la force d’une <b>maxime</b> ; le « nous » inclut le lecteur européen. La <b>comparaison</b> (« la même fragilité qu’une vie ») rapproche l’histoire d’une biographie. Le <b>paradoxe</b> « Tant d’horreurs […] sans tant de vertus » et l’<b>apostrophe</b> finale aux allégories « Savoir et Devoir » renversent les valeurs de la civilisation.</p>",
      enjeu: "<p>Le progrès des sciences et des vertus morales n’empêche pas la barbarie : il peut la rendre plus efficace. C’est la crise de la confiance « humaniste » en un progrès continu dont parle le programme.</p>",

  e.sujet.q1.intro = `<p>« Ceux qui avaient rêvé que la force, grâce au progrès, appartenait désormais au passé » : en 1940, alors que la France vient d’être vaincue et occupée, Simone Weil relit l’<i>Iliade</i> comme un miroir du présent. Le poème d’Homère, qui semblait raconter une guerre lointaine et héroïque, devient pour elle l’analyse la plus exacte de ce que la violence fait aux hommes. Sa thèse tient en une définition : « La force, c’est ce qui fait de quiconque lui est soumis une chose. » On pourrait n’y voir qu’une image : un homme menacé reste un homme, libre au moins de penser. Pourquoi, selon Simone Weil, la force transforme-t-elle réellement l’homme en chose ? Nous verrons d’abord qu’elle fait de la force le vrai sujet de toute histoire humaine, puis que cette transformation va du cadavre au vivant pétrifié, avant de montrer qu’elle atteint aussi ceux qui croient posséder la force.</p>`;

    ["I. La force, « centre de toute histoire humaine » (l. 1-8)", `<ul class="puces"><li>Une définition par <b>substitution</b> : le héros de l’<i>Iliade</i> n’est ni Achille ni Hector, mais la force. La reprise anaphorique (« la force qui… la force qui… la force devant quoi… ») en décline les trois rapports : manier, soumettre, faire reculer la chair.</li><li>L’âme est toujours « modifiée » par la force, qu’elle l’exerce (« aveuglée ») ou la subisse (« courbée ») : aucune position n’échappe à son effet.</li><li>Portée historique : contre l’idée d’un progrès qui aurait relégué la force « au passé », le poème est un « miroir » du présent. Lien avec Valéry (1919) : la civilisation n’a pas aboli la barbarie.</li></ul>` ],
    ["II. Du cadavre à la « chose qui a une âme » (l. 9-19)", `<ul class="puces"><li>Premier sens, « littéral » : tuer, c’est faire d’un sujet un objet. La phrase « Il y avait quelqu’un, et, un instant plus tard, il n’y a personne » oppose deux pronoms : la personne disparaît, reste une chose.</li><li>Deuxième sens, plus profond : la force « qui ne tue pas encore ». La gradation (« sûrement », « peut-être », « suspendue ») montre que la simple menace suffit : « elle change l’homme en pierre » ; l’homme menacé ne peut plus délibérer, choisir, agir ; il obéit.</li><li>Le paradoxe central : « Il est vivant, il a une âme ; il est pourtant une chose. » L’esclave, le prisonnier, le suppliant gardent une conscience, mais sont traités et se vivent comme des instruments. On peut éclairer par Kant : une personne a une <b>dignité</b>, une chose a un <b>prix</b> ; la force efface cette différence.</li></ul>` ],
    ["III. Personne ne possède la force (l. 20-21)", `<ul class="puces"><li>Le parallélisme « Aussi impitoyablement la force écrase, aussi impitoyablement elle enivre » met sur le même plan la victime et le vainqueur.</li><li>« Personne ne la possède véritablement » : celui qui croit manier la force est lui-même manié par elle (ivresse, aveuglement, démesure). Le vainqueur devient à son tour une chose, entraînée par l’élan de la violence.</li><li>Conséquence : la force n’est pas un instrument neutre au service d’une volonté libre ; elle dégrade tous ceux qu’elle touche. D’où la valeur de l’<i>Iliade</i>, qui ne prend parti pour aucun camp.</li></ul>` ]

  e.sujet.q2.intro = `<p>Simone Weil admire l’<i>Iliade</i> parce que le poème montre la force sans jamais l’admirer : il fait voir la mort d’un guerrier sans en faire une gloire. Pourtant, l’épopée a longtemps servi à exalter la guerre, et l’on pourrait penser que toute représentation de la violence l’embellit : mettre en forme, c’est rendre beau ; raconter, c’est donner un sens ; montrer, c’est déjà fasciner. Montrer la violence, c’est la faire voir, la décrire, la représenter ; la rendre séduisante, c’est la rendre belle, héroïque ou désirable. La littérature peut-elle faire voir la violence telle qu’elle est, sans que la beauté de la forme la rende attirante ? Nous verrons d’abord que la littérature risque toujours d’embellir la violence, puis qu’elle dispose de moyens propres pour la montrer sans la glorifier, avant de nous demander si ce n’est pas justement en faisant éprouver la fascination qu’elle permet de la comprendre.</p>`;

  chapo: "« Jusqu’où peut-on aller ? » : c’est, selon le programme, la question de l’âge moderne. La technique a promis un pouvoir sans limite, de la machine à vapeur à l’intelligence artificielle ; elle a aussi produit la bombe, la crise écologique et de nouvelles dépendances. Qu’est-ce qu’un être humain quand il peut se réparer, s’augmenter, et détruire son propre monde ?",

  cours: [
    { id: "e6-1", titre: "« Jusqu’où peut-on aller ? » : les deux sens de la limite", html: `
<p class="lettrine">Le mot <b>limite</b> vient du latin <i>limes</i>, le chemin qui borde un champ, puis la frontière fortifiée de l’Empire romain. Une limite peut être une <b>borne de fait</b>, ce qu’on ne peut pas dépasser (la vitesse de la lumière, la mort), ou une <b>norme</b>, ce qu’on ne doit pas dépasser (l’interdit, la loi). La technique moderne recule sans cesse les premières : la question devient alors de savoir s’il faut poser les secondes.</p>
<p>Les Grecs avaient un mot pour le dépassement fautif des limites : l’<b>hybris</b> (la démesure), que punit la <b>Némésis</b>. Icare, qui vole trop près du soleil avec les ailes de cire fabriquées par son père Dédale, en est l’image. La <b>finitude</b> désigne la condition d’un être limité : mortel, dépendant d’un corps, ignorant d’une partie du monde et de lui-même.</p>
<p>Pascal donne la formule la plus forte de cette condition : « L’homme n’est qu’un roseau le plus faible de la nature ; mais c’est un roseau pensant. » Une goutte d’eau suffit pour le tuer, mais il sait qu’il meurt, et l’univers n’en sait rien : « toute notre dignité consiste dans la pensée ». La limite du corps n’est pas la limite de l’esprit : « l’homme passe infiniment l’homme » (<i>Pensées</i>).</p>
<div class="ex"><b class="l">Exemple</b>Le programme parle d’un être « fini » qui fait l’expérience de l’illimité : l’astronome qui calcule des distances de milliards d’années-lumière, le lecteur qui vit d’autres vies, l’amoureux dont le désir semble sans fin. La finitude n’empêche pas l’infini ; elle le rend sensible.</div>` },
    { id: "e6-2", titre: "L’homme, animal technique : Prométhée et la perfectibilité", html: `
<p>Dans le <i>Protagoras</i> de Platon, le sophiste raconte un mythe : chargé de distribuer les qualités aux animaux, Épiméthée a tout donné aux bêtes (griffes, fourrures, vitesse) et laissé l’homme « nu, sans chaussures, ni couverture, ni armes ». Prométhée vole alors à Héphaïstos et à Athéna « la connaissance des arts avec le feu ». L’homme peut survivre, « mais il n’avait pas la science politique » : il faudra que Zeus lui donne la justice et la pudeur pour que les hommes vivent ensemble sans se détruire.</p>
<p>Le mythe dit deux choses : la technique compense un <b>manque</b> originel ; et elle ne suffit pas, il faut encore une sagesse pour l’employer. Rousseau, dans le <i>Discours sur l’origine de l’inégalité</i> (1755), fait de la <b>perfectibilité</b> le propre de l’homme : un animal est, au bout de quelques mois, ce qu’il sera toute sa vie, alors que l’homme se transforme sans cesse. Mais cette faculté « presque illimitée » est aussi « la source de tous les malheurs de l’homme » et le rend « à la longue le tyran de lui-même et de la nature ».</p>
<div class="ex"><b class="l">Exemple</b>Bergson propose de définir l’homme comme <i>homo faber</i> plutôt que comme <i>homo sapiens</i> (<i>L’Évolution créatrice</i>, 1907) : l’intelligence est d’abord la faculté de fabriquer des outils, et des outils à faire des outils. Freud, dans <i>Malaise dans la civilisation</i> (1930), compare l’homme équipé de ses instruments à une sorte de « dieu prothétique » (<i>Prothesengott</i>, selon la traduction courante) : grandiose quand il revêt ses organes auxiliaires, mais qui n’a pas fait corps avec eux.</div>
<div class="plus"><b class="l">Pour aller plus loin</b>Mary Shelley sous-titre son roman <i>Frankenstein</i> (1818) « ou le Prométhée moderne » : le savant crée la vie, puis abandonne sa créature. Le mythe de la technique qui échappe à son créateur est né.</div>` },
    { id: "e6-3", titre: "« Maîtres et possesseurs de la nature » : le projet moderne", html: `
<p>Au XVII<sup>e</sup> siècle, la science moderne change de but : il ne s’agit plus seulement de contempler le monde, mais de le <b>transformer</b>. Francis Bacon écrit dans le <i>Novum Organum</i> (1620) que la science et la puissance humaines coïncident (<i>scientia et potentia humana in idem coincidunt</i>) : on ne commande à la nature qu’en lui obéissant, c’est-à-dire en connaissant ses lois.</p>
<p>Descartes, dans la sixième partie du <i>Discours de la méthode</i> (1637), oppose à la « philosophie spéculative » des écoles une philosophie « pratique », par laquelle nous pourrions « nous rendre comme maîtres et possesseurs de la nature ». Le but est d’abord la santé : Descartes espère qu’on pourra s’exempter d’une infinité de maladies, « et même aussi peut-être de l’affaiblissement de la vieillesse ». Le mot « comme » est important : l’homme n’est pas Dieu, il agit comme s’il était maître.</p>
<p>Au XIX<sup>e</sup> siècle, ce projet devient une foi dans le <b>progrès</b> : la vapeur, le chemin de fer, l’électricité semblent prouver que l’humanité avance. Baudelaire s’en moque en 1855 : l’idée du progrès est un « fanal obscur », qui confond les « choses de l’ordre matériel et de l’ordre spirituel » ; avoir la vapeur et l’éclairage au gaz ne rend pas meilleur.</p>
<div class="ex"><b class="l">Exemple</b>Vigny, dans « La Maison du berger » (1844), voit le train comme un « taureau de fer qui fume, souffle et beugle » sur lequel « L’homme a monté trop tôt ». Deux ans plus tôt, le 8 mai 1842, la catastrophe ferroviaire de Meudon avait fait plusieurs dizaines de morts, dont l’explorateur Dumont d’Urville, brûlés dans des wagons fermés à clé.</div>
<div data-anim="e6-vigny"></div>` },
    { id: "e6-4", titre: "L’envers du progrès : machines, travail, dépendances", html: `
<p>La machine promet de libérer l’homme du travail pénible. Mais elle impose aussi son rythme. Charlie Chaplin, dans <i>Les Temps modernes</i> (1936), montre l’ouvrier pris dans les engrenages de la chaîne. Jean Giono, dans <i>Triomphe de la vie</i> (1941), texte du bac 2026, décrit « l’immense armée des machines » et affirme que chaque machine transforme deux matières : celle pour laquelle on l’a inventée, « et l’homme qui se sert de la machine ».</p>
<p>Les philosophes du XX<sup>e</sup> siècle approfondissent ce soupçon. Martin Heidegger (« La question de la technique », 1954) voit dans la technique moderne une manière de <b>« arraisonner »</b> la nature (<i>Gestell</i>) : le fleuve devient un fournisseur d’énergie, la forêt un stock de bois. Günther Anders (<i>L’Obsolescence de l’homme</i>, 1956) parle de « honte prométhéenne » : l’homme se sent inférieur aux machines qu’il a produites, plus parfaites et plus durables que lui. Hannah Arendt (<i>Condition de l’homme moderne</i>, 1958) s’inquiète d’une société de travailleurs privés de travail, qui ne connaît plus d’autre activité que produire et consommer.</p>
<div class="ex"><b class="l">Exemple</b>Arendt ouvre son livre sur le lancement de Spoutnik, le 4 octobre 1957 : pour la première fois, un objet fabriqué par l’homme tourne autour de la Terre. Elle note qu’on a salué l’événement comme un premier pas pour échapper à la prison terrestre, comme si la condition humaine était une prison.</div>
<div class="cle"><b class="l">Pour la copie</b>Ne pas faire de la technique un monstre extérieur : la question est plutôt celle de la <b>maîtrise</b>. Qui décide de son usage ? Peut-on encore choisir de s’en passer ? C’est le sens du sujet de 2026 : « Dans quelle mesure les machines échappent-elles à l’humain ? »</div>` },
    { id: "e6-5", titre: "Changement d’échelle : pouvoir détruire le monde", html: `
<p>Le 6 août 1945, une bombe atomique détruit Hiroshima ; le 9 août, Nagasaki. Pour la première fois, l’humanité a les moyens de se détruire elle-même. Hannah Arendt le note dès 1953 dans son <i>Journal de pensée</i> (texte du bac 2021) : aucune guerre ne devrait avoir le droit de mettre en jeu l’existence de l’humanité, « Or c’est précisément cela qui est devenu une possibilité ». Le film d’Alain Resnais sur un scénario de Marguerite Duras, <i>Hiroshima mon amour</i> (1959), fait dialoguer la mémoire d’une histoire d’amour et celle de la ville détruite.</p>
<p>Hans Jonas en tire une éthique nouvelle dans <i>Le Principe responsabilité</i> (1979). Les morales traditionnelles concernaient le prochain, ici et maintenant ; la technique moderne agit à distance et pour des siècles. Il faut donc un nouvel impératif : « Agis de façon que les effets de ton action soient compatibles avec la permanence d’une vie authentiquement humaine sur terre » (traduction usuelle de Jean Greisch). Jonas propose une <b>« heuristique de la peur »</b> : imaginer le pire pour savoir ce qu’il faut préserver.</p>
<div class="ex"><b class="l">Exemple</b>L’accident de la centrale de Tchernobyl (26 avril 1986) puis celui de Fukushima (11 mars 2011) montrent qu’une technique maîtrisée en temps normal peut produire des effets qui dépassent les frontières et les générations : une zone d’exclusion existe toujours autour de Tchernobyl.</div>` },
    { id: "e6-6", titre: "Exploiter ou conserver la nature ?", html: `
<p>Le programme note que la question écologique n’est plus seulement la préservation des espèces : elle laisse entrevoir « le spectre d’un monde inhabitable ». Les alertes se succèdent : Rachel Carson, <i>Printemps silencieux</i> (1962), sur les pesticides ; le rapport Meadows pour le Club de Rome (1972, <i>The Limits to Growth</i>, publié en français sous le titre <i>Halte à la croissance ?</i>) ; la création du GIEC (1988) ; l’accord de Paris (12 décembre 2015), qui vise à contenir le réchauffement nettement en dessous de 2 °C par rapport à l’ère préindustrielle.</p>
<p>Deux attitudes s’opposent. La première <b>gère</b> la nature comme une ressource à exploiter durablement. La seconde lui reconnaît une <b>valeur propre</b> : Aldo Leopold, forestier américain (<i>Almanach d’un comté des sables</i>, 1949), propose une « éthique de la terre » où l’homme devient un simple membre de la communauté biotique. Claude Lévi-Strauss, à la fin de <i>Tristes tropiques</i> (1955), rappelle que le monde a commencé sans l’homme et s’achèvera sans lui.</p>
<p>La littérature imagine l’effondrement : René Barjavel, dans <i>Ravage</i> (1943), prive brusquement une société hypertechnique d’électricité ; C. F. Ramuz, dans <i>La Grande Peur dans la montagne</i> (1926), raconte comment des villageois envoient leurs bêtes dans un alpage réputé maudit, malgré l’avertissement des anciens, jusqu’à la catastrophe.</p>
<div class="ex"><b class="l">Exemple</b>Le chimiste Paul Crutzen propose en 2000 le mot <b>Anthropocène</b> : une époque où l’homme est devenu une force géologique. La commission internationale chargée de la stratigraphie a refusé en mars 2024 d’en faire officiellement une époque géologique, mais le mot reste employé partout pour dire ce changement d’échelle.</div>` },
    { id: "e6-7", titre: "L’homme réparé, l’homme augmenté", html: `
<p>La médecine <b>répare</b> : vaccins, antibiotiques, greffes (premier cœur greffé par Christiaan Barnard, au Cap, le 3 décembre 1967), prothèses. Mais elle peut aussi <b>augmenter</b> : modifier le génome (l’outil CRISPR-Cas9, décrit en 2012 par Emmanuelle Charpentier et Jennifer Doudna, prix Nobel de chimie en 2020), prolonger la vie, connecter le cerveau à des machines. En 2018, le chercheur chinois He Jiankui annonce la naissance de jumelles dont il a modifié le génome ; il est condamné à trois ans de prison en 2019.</p>
<p>Le <b>transhumanisme</b> (mot employé par le biologiste Julian Huxley en 1957) veut dépasser les limites biologiques : vieillissement, maladie, peut-être la mort. Le programme pose la question : « Quelle sorte de bonheur et quelle durée de vie pour un homme entièrement “réparé”, voire “augmenté” ? » Son frère Aldous Huxley avait imaginé dans <i>Le Meilleur des mondes</i> (1932) une société où les enfants sont fabriqués en laboratoire et conditionnés au bonheur : on n’y souffre plus, mais on n’y aime plus, on n’y lit plus.</p>
<p>Où passe la limite de l’humain ? Vercors, dans <i>Les Animaux dénaturés</i> (1952), imagine un procès où il faut décider si des êtres mi-singes mi-hommes sont humains : c’est l’occasion de chercher une définition. Philip K. Dick, dans <i>Les androïdes rêvent-ils de moutons électriques ?</i> (1968), fait de l’<b>empathie</b> le critère qui distingue l’humain de l’androïde.</p>
<div class="ex"><b class="l">Exemple</b>En France, les lois de bioéthique (première loi en 1994, révisée en 2004, 2011 et 2021) interdisent le clonage reproductif et les modifications génétiques transmissibles à la descendance : le droit pose des limites là où la technique n’en a plus.</div>
<div class="cle"><b class="l">Pour la copie</b>Distinction utile : <b>réparer</b> (revenir à une norme de santé) / <b>augmenter</b> (dépasser la norme). La frontière est floue : des lunettes augmentent-elles ? Un vaccin ? Mais elle permet de poser la question de la « vie humaine désirable ».</div>` },
    { id: "e6-8", titre: "Le numérique, l’intelligence artificielle et la nouvelle sociabilité", html: `
<p>En 1950, le mathématicien Alan Turing propose, dans l’article « Computing Machinery and Intelligence », un « jeu de l’imitation » : une machine pense-t-elle si l’on ne peut plus la distinguer d’un humain dans une conversation écrite ? Le 11 mai 1997, l’ordinateur Deep Blue bat le champion du monde d’échecs Garry Kasparov ; le 30 novembre 2022, l’entreprise OpenAI met en ligne ChatGPT, un programme qui produit des textes. La question de 2026 se pose avec force : les machines échappent-elles à l’humain ?</p>
<p>Le programme demande si l’univers numérique et ses réseaux créent une <b>nouvelle sociabilité</b>. Michel Serres, dans <i>Petite Poucette</i> (2012), décrit avec bienveillance une génération qui a le savoir dans la poche et pense autrement. D’autres soulignent la <b>surveillance</b> et la dépendance : Orwell, dans <i>1984</i> (1949), imagine le « télécran » qui voit et entend tout. Rousseau avait écrit que « l’homme sociable, toujours hors de lui, ne sait vivre que dans l’opinion des autres » : les réseaux, avec leurs compteurs de « j’aime », en sont une version mesurée.</p>
<div class="ex"><b class="l">Exemple</b>Isaac Asimov formule dès 1942, dans la nouvelle « Cercle vicieux » (« Runaround »), les « trois lois de la robotique » : un robot ne peut nuire à un humain, doit lui obéir, doit se protéger, dans cet ordre. Toute son œuvre montre que des règles simples produisent des situations imprévues : on ne programme pas l’éthique comme une machine.</div>` },
    { id: "e6-9", titre: "Que signifie aujourd’hui l’idée d’humanité ?", html: `
<p>Le programme conclut : il s’agit de réfléchir à « ce que peut signifier aujourd’hui l’idée d’humanité ». Trois pistes. D’abord, l’humanité comme <b>espèce</b> menacée : Jonas fait de sa survie un devoir. Ensuite, l’humanité comme <b>valeur</b> : ce que l’on doit à tout homme (Levinas, <i>Humanisme de l’autre homme</i>, 1972, fonde l’éthique sur le visage d’autrui qui m’interdit de tuer). Enfin, l’humanité comme <b>condition</b> : être fini, mortel, qui donne sens à sa vie parce qu’elle est limitée.</p>
<p>Valéry place en épigraphe du « Cimetière marin » (1920) deux vers de Pindare qui invitent l’âme à ne pas aspirer à la vie immortelle, mais à épuiser le champ du possible. Le poème s’achève sur un élan : « Le vent se lève !… Il faut tenter de vivre ! » Arendt, dans le texte du bac 2021, remarquait déjà que c’est parce que nous savons que nous devons mourir que nous pouvons risquer notre vie pour quelque chose : un être immortel n’aurait plus rien à sacrifier.</p>
<div class="ex"><b class="l">Exemple</b>Saint-Exupéry, pilote de l’Aéropostale, raconte dans <i>Terre des hommes</i> (1939) comment son ami Guillaumet, perdu dans les Andes après un accident d’avion en 1930, marche pendant cinq jours et quatre nuits pour survivre. L’homme se mesure à l’obstacle : la limite révèle ce qu’il est.</div>
<div class="cle"><b class="l">Pour la copie</b>Conclusion possible de beaucoup de sujets : la limite n’est pas seulement ce qui nous arrête, c’est aussi ce qui nous définit. Une humanité sans limites ne serait plus une humanité, mais elle n’est pas non plus condamnée à se résigner : elle doit choisir ses limites.</div>` },
    { id: "e6-10", titre: "Ce qui est déjà tombé au bac", html: `
<p>Cette entrée tombe moins souvent que « Histoire et violence », mais le sujet de 2026 montre qu’elle est bien au programme de l’écrit, et le Grand oral s’y prête très bien.</p>
<details class="pli"><summary>Les sujets de métropole depuis 2021</summary><div class="dedans"><ul class="puces">
<li><b>2021</b> (9 septembre, sujet 2) : Hannah Arendt, <i>Journal de pensée</i> (1953), sur la guerre à l’âge de la bombe. Le texte touche les deux entrées du semestre 2. Interprétation philosophique : « À quelles conditions peut-on, selon Hannah Arendt, prendre le risque de la guerre ? » Essai littéraire : « La littérature et les arts peuvent-ils représenter la guerre sans la dénoncer ? »</li>
<li><b>2026</b> (16 juin) : Jean Giono, <i>Triomphe de la vie</i> (1941), « l’immense armée des machines ». Interprétation littéraire : « Quel regard Jean Giono porte-t-il sur le travail de la machine ? » Essai philosophique : « Dans quelle mesure les machines échappent-elles à l’humain ? »</li>
</ul></div></details>
<div class="cle"><b class="l">Ce qu’il faut en tirer</b>Les sujets associent souvent un texte littéraire d’avant le numérique (Giono, 1941) à une question très actuelle (les machines qui échappent à l’humain). Prépare des exemples des deux époques : Vigny ou Giono d’un côté, l’intelligence artificielle ou le climat de l’autre.</div>` }
  ],
  notions: [
    ["Limite / borne / norme", "<b>Limite</b> : ce qui sépare, termine. <b>Borne</b> (de fait) : ce qu’on ne peut pas dépasser. <b>Norme</b> : ce qu’on ne doit pas dépasser."],
    ["Finitude", "Condition d’un être limité : mortel, dépendant d’un corps, ignorant d’une partie de lui-même et du monde."],
    ["Hybris", "Mot grec : la démesure, le dépassement orgueilleux des limites humaines, puni par les dieux (Némésis)."],

  textesIntro: "Six extraits du domaine public, de Platon à Valéry. Les textes de Descartes sont cités en orthographe modernisée ; Platon dans la traduction d’Émile Chambry. Pour les auteurs protégés (Jonas, Arendt, Anders, Huxley, Saint-Exupéry, Serres…), le cours résume et cite très brièvement.",
  textes: [
    { id: "t6-1", auteur: "Platon", oeuvre: "Protagoras, 320c-322d, le mythe de Prométhée", ref: "vers 390 av. J.-C., trad. Émile Chambry",
      extrait: "Dans cet embarras, Prométhée vient pour examiner le partage ; il voit les animaux bien pourvus, mais l’homme nu, sans chaussures, ni couverture, ni armes, et le jour fixé approchait où il fallait l’amener du sein de la terre à la lumière. Alors Prométhée, ne sachant qu’imaginer pour donner à l’homme le moyen de se conserver, vole à Héphaïstos et à Athéna la connaissance des arts avec le feu ; car, sans le feu, la connaissance des arts était impossible et inutile ; et il en fait présent à l’homme. L’homme eut ainsi la science propre à conserver sa vie ; mais il n’avait pas la science politique ; celle-ci se trouvait chez Zeus […].",
      contexte: "Dans ce dialogue, Socrate se demande si la vertu peut s’enseigner. Le sophiste Protagoras répond par un mythe : Épiméthée (« celui qui réfléchit après coup ») a distribué toutes les qualités aux animaux et n’a rien laissé à l’homme.",
      analyse: "<p>Le récit oppose l’homme « nu », décrit par une <b>énumération négative</b> (« sans chaussures, ni couverture, ni armes »), aux animaux « bien pourvus ». Le don de Prométhée est un <b>vol</b> : la technique a une origine transgressive. La dernière phrase, construite sur une <b>opposition</b> (« L’homme eut ainsi… ; mais il n’avait pas… »), annonce la suite du mythe.</p>",
      enjeu: "<p>L’homme n’a pas de nature fixe : sa faiblesse l’oblige à inventer. Mais la technique, qui permet de survivre, ne dit pas comment vivre ensemble : il faut une autre science, politique et morale. C’est déjà la question de la maîtrise.</p>",
      liens: "Rousseau (la perfectibilité) ; Mary Shelley, <i>Frankenstein ou le Prométhée moderne</i> ; Anders (la « honte prométhéenne ») ; Jonas, qui ouvre <i>Le Principe responsabilité</i> sur l’image d’un Prométhée désormais déchaîné." },
    { id: "t6-2", auteur: "Descartes", oeuvre: "Discours de la méthode, sixième partie", ref: "1637, orthographe modernisée",
      extrait: "elles m’ont fait voir qu’il est possible de parvenir à des connaissances qui soient fort utiles à la vie ; et qu’au lieu de cette philosophie spéculative qu’on enseigne dans les écoles, on en peut trouver une pratique, par laquelle, connaissant la force et les actions du feu, de l’eau, de l’air, des astres, des cieux, et de tous les autres corps qui nous environnent, aussi distinctement que nous connaissons les divers métiers de nos artisans, nous les pourrions employer en même façon à tous les usages auxquels ils sont propres, et ainsi nous rendre comme maîtres et possesseurs de la nature. Ce qui n’est pas seulement à désirer pour l’invention d’une infinité d’artifices, qui feraient qu’on jouirait sans aucune peine des fruits de la terre et de toutes les commodités qui s’y trouvent, mais principalement aussi pour la conservation de la santé.",
      contexte: "Le <i>Discours</i> est publié en français (et non en latin), pour être lu de tous. Dans la sixième partie, Descartes explique pourquoi il publie ses recherches de physique : elles peuvent servir « le bien général de tous les hommes ».",
      analyse: "<p>Une <b>opposition</b> structure la phrase : philosophie « spéculative » / philosophie « pratique ». L’<b>énumération</b> des éléments (« du feu, de l’eau, de l’air, des astres, des cieux ») embrasse toute la nature, et la <b>comparaison</b> avec les « métiers de nos artisans » fait de la nature un atelier. La modalisation « comme maîtres et possesseurs » nuance l’ambition.</p>",
      enjeu: "<p>C’est l’acte de naissance du projet technique moderne : connaître pour agir, agir pour le confort et surtout la santé. Le texte pose aussi la question de la limite : l’homme maître de la nature reste une créature, et le « comme » rappelle sa finitude.</p>",
      liens: "Bacon (savoir et pouvoir) ; Heidegger (la nature « arraisonnée ») ; Jonas (la responsabilité qu’impose ce pouvoir) ; l’homme « réparé » du programme." },
    { id: "t6-3", auteur: "Pascal", oeuvre: "Pensées, « le roseau pensant »", ref: "édition de 1670 (Port-Royal)",
      extrait: "L’homme n’est qu’un roseau le plus faible de la nature ; mais c’est un roseau pensant. Il ne faut pas que l’univers entier s’arme pour l’écraser. Une vapeur, une goutte d’eau suffit pour le tuer. Mais quand l’univers l’écraserait, l’homme serait encore plus noble que ce qui le tue ; parce qu’il sait qu’il meurt ; et l’avantage que l’univers a sur lui, l’univers n’en sait rien. Ainsi toute notre dignité consiste dans la pensée. C’est de là qu’il faut nous relever, non de l’espace et de la durée.",
      contexte: "Pascal, mathématicien et physicien (il a inventé une machine à calculer, la pascaline), prépare une apologie de la religion chrétienne. Ses notes, publiées après sa mort (1662), décrivent la « misère » et la « grandeur » de l’homme.",
      analyse: "<p>La <b>métaphore</b> du roseau dit la fragilité ; l’ajout de l’adjectif « pensant » la renverse. Le texte avance par <b>paradoxes</b> : l’univers qui écrase est moins « noble » que l’homme écrasé. L’<b>antithèse</b> savoir / ne pas savoir (« il sait qu’il meurt » / « l’univers n’en sait rien ») fonde la conclusion, introduite par « Ainsi ».</p>",
      enjeu: "<p>La grandeur de l’homme ne vient pas de sa puissance sur la nature (« non de l’espace et de la durée ») mais de sa conscience. Réponse possible au rêve d’un homme « augmenté » : allonger la vie ou étendre le pouvoir ne rend pas plus digne ; c’est la pensée qui fait l’humanité.</p>",
      liens: "Descartes (la pensée comme essence) ; Valéry (« Il faut tenter de vivre ! ») ; Jonas (la vulnérabilité comme fondement de la responsabilité)." },
    { id: "t6-4", auteur: "Rousseau", oeuvre: "Discours sur l’origine et les fondements de l’inégalité parmi les hommes, première partie", ref: "1755",
      extrait: "il y a une autre qualité très spécifique qui les distingue, et sur laquelle il ne peut y avoir de contestation ; c’est la faculté de se perfectionner ; faculté qui, à l’aide des circonstances, développe successivement toutes les autres, et réside parmi nous tant dans l’espèce que dans l’individu, au lieu qu’un animal est, au bout de quelques mois, ce qu’il sera toute sa vie, et son espèce, au bout de mille ans, ce qu’elle était la première année de ces mille ans. […] Il serait triste pour nous d’être forcés de convenir que cette faculté distinctive et presque illimitée, est la source de tous les malheurs de l’homme ; que c’est elle qui le tire, à force de temps, de cette condition originaire, dans laquelle il coulerait des jours tranquilles et innocents ; que c’est elle qui, faisant éclore avec les siècles ses lumières et ses erreurs, ses vices et ses vertus, le rend à la longue le tyran de lui-même et de la nature ?",
      contexte: "Rousseau répond à une question de l’Académie de Dijon sur l’origine de l’inégalité. Il imagine un « homme naturel » pour distinguer ce qui vient de la nature et ce qui vient de la société.",
      analyse: "<p>Une <b>comparaison</b> entre l’homme et l’animal, appuyée sur une opposition temporelle (« au bout de quelques mois » / « au bout de mille ans »), définit l’homme par son <b>historicité</b>. La seconde phrase, <b>interrogation oratoire</b> introduite par « Il serait triste », accumule les relatives (« que c’est elle qui… ») et les <b>antithèses</b> (« ses lumières et ses erreurs, ses vices et ses vertus »).</p>",
      enjeu: "<p>La faculté qui fait la grandeur de l’homme fait aussi son malheur : « presque illimitée », elle le pousse à dominer jusqu’à devenir « le tyran de lui-même et de la nature ». Formule prophétique pour penser la crise écologique et l’homme augmenté.</p>",
      liens: "Platon (Prométhée) ; Descartes (la maîtrise) ; Kant (l’éducation, entrée I) ; Jonas." },
    { id: "t6-5", auteur: "Baudelaire", oeuvre: "Curiosités esthétiques, « Exposition universelle, 1855 »", ref: "article de 1855, recueilli en 1868",
      extrait: "Je veux parler de l’idée du progrès. Ce fanal obscur, invention du philosophisme actuel, breveté sans garantie de la Nature ou de la Divinité, cette lanterne moderne jette des ténèbres sur tous les objets de la connaissance ; la liberté s’évanouit, le châtiment disparaît. […] Demandez à tout bon Français qui lit tous les jours son journal dans son estaminet ce qu’il entend par progrès, il répondra que c’est la vapeur, l’électricité et l’éclairage au gaz, miracles inconnus aux Romains, et que ces découvertes témoignent pleinement de notre supériorité sur les anciens ; tant il s’est fait de ténèbres dans ce malheureux cerveau et tant les choses de l’ordre matériel et de l’ordre spirituel s’y sont si bizarrement confondues !",
      contexte: "Baudelaire rend compte de l’Exposition universelle de Paris (1855), vitrine de l’industrie et des arts. Il s’en prend à la croyance, très répandue, en un progrès général et automatique.",
      analyse: "<p>L’<b>oxymore</b> « fanal obscur » (une lumière qui obscurcit) et sa reprise ironique « lanterne moderne » qui « jette des ténèbres » condensent la critique. Le vocabulaire commercial (« breveté sans garantie ») ridiculise l’idée. Le <b>discours rapporté</b> du « bon Français » de l’estaminet, avec son énumération (« la vapeur, l’électricité et l’éclairage au gaz »), donne un exemple de la confusion dénoncée.</p>",
      enjeu: "<p>Distinguer progrès technique et progrès moral : avoir plus de moyens ne rend ni plus libre ni meilleur. L’idée du progrès automatique « a déchargé chacun de son devoir » : la responsabilité disparaît.</p>",
      liens: "Rousseau (le progrès des arts n’épure pas les mœurs) ; Vigny, « La Maison du berger » ; Valéry, « La Crise de l’esprit » (entrée « Histoire et violence »)." },
    { id: "t6-6", auteur: "Valéry", oeuvre: "Charmes, « Le Cimetière marin », dernière strophe", ref: "1920", vers: true,
      extrait: "Le vent se lève !… Il faut tenter de vivre !\nL’air immense ouvre et referme mon livre,\nLa vague en poudre ose jaillir des rocs !\nEnvolez-vous, pages tout éblouies !\nRompez, vagues ! Rompez d’eaux réjouies\nCe toit tranquille où picoraient des focs !",
      contexte: "Le poème médite, face à la mer, dans le cimetière de Sète où Valéry sera enterré. Pendant des strophes, le poète contemple l’immobilité de midi, la mort, les morts « cachés » sous la terre, la tentation d’une pensée pure et immobile.",
      analyse: "<p>Rupture de ton : <b>exclamations</b>, <b>impératifs</b> (« Envolez-vous », « Rompez ») et verbes de mouvement (« se lève », « jaillir ») succèdent à la contemplation immobile. Le « toit tranquille » de la première strophe (la mer où passent les voiles) est ici brisé : la <b>reprise</b> de l’image signale le renversement. Le livre qui s’ouvre et se ferme seul dit que la vie l’emporte sur la pensée abstraite.</p>",
      enjeu: "<p>La finitude n’est pas une raison de désespérer : parce que nous sommes mortels, il faut « tenter de vivre ». La limite devient appel à l’action. Une réponse poétique à l’idée d’un homme qui voudrait abolir la mort.</p>",
      liens: "Pascal (le roseau pensant) ; Arendt, <i>Journal de pensée</i> (bac 2021) ; Saint-Exupéry, <i>Terre des hommes</i>." }

    q1: { type: "interprétation littéraire", q: "Comment Vigny fait-il du chemin de fer une figure inquiétante du progrès ?",
      methode: `<ol class="puces"><li><b>Partir de l’image centrale</b> : le « taureau de fer », puis le « dragon mugissant » (v. 1 et 13). Le train est un monstre ; il faut montrer comment les images, les rythmes et les oppositions construisent l’inquiétude.</li><li>Mouvements : le monstre et ses victimes (v. 1-7) ; la course que personne ne maîtrise (v. 8-14) ; le voyage perdu (v. 16-29) ; le monde rétréci (v. 30-36).</li><li>Outils : métaphores et allégories (taureau, dragon, « Dieu de l’or »), mythe antique, champ lexical du feu et de la mort, anaphores et énumérations (v. 25-29), rythme des alexandrins (coupes, rejets : « L’homme a monté trop tôt »), passage du « il » au « nous ».</li></ol>` },
    q2: { type: "essai philosophique", q: "Le progrès technique nous rend-il maîtres de notre destin ?",
      methode: `<ol class="puces"><li><b>Les termes</b> : « progrès technique » (accroissement des moyens d’agir sur la nature) ; « maîtres » (qui décide, qui commande, qui n’est pas commandé) ; « destin » (ce qui nous arrive sans que nous le choisissions : maladie, mort, hasard, histoire).</li><li><b>Problème</b> : la technique semble faire reculer le destin (maladies vaincues, distances abolies) ; mais Vigny écrit « aucun n’est le maître / Du dragon mugissant » : la technique ne crée-t-elle pas un nouveau destin, auquel nous sommes soumis ?</li><li>Ne pas oublier le texte du sujet : la formule « Nous nous sommes joués à plus fort que nous tous » peut servir de point de départ et de fil conducteur.</li></ol>` }

    ["II. Une course que personne ne maîtrise (v. 8-14)", `<ul class="puces"><li>Le <b>discours</b> de l’époque est cité pour être jugé : « Mais il faut triompher du temps et de l’espace, / Arriver ou mourir » ; l’alternative brutale révèle l’absurdité de la vitesse érigée en absolu.</li><li>Le moteur caché, c’est le commerce : « Les marchands sont jaloux », « L’or pleut ». Le progrès technique est aussi un système de captation des richesses (le programme le note).</li><li>Le tiret marque le retournement : « Mais aucun n’est le maître / Du dragon mugissant qu’un savant a fait naître ». La créature échappe à son créateur ; le dernier vers, au « nous », généralise : « Nous nous sommes joués à plus fort que nous tous. »</li></ul>` ],

  e.sujet.q1.concl = `<p>Vigny fait du chemin de fer une figure inquiétante du progrès en le transformant en monstre mythologique, taureau sacrificiel et dragon que personne ne maîtrise, puis en montrant ce que sa victoire sur l’espace fait perdre : la lenteur, le hasard, la rencontre, le regard sur le monde. Le poème ne refuse pas la technique en bloc ; il en dénonce l’imprudence (« trop tôt ») et l’asservissement à l’or. Un siècle plus tard, Giono décrira de même « l’immense armée des machines » qui transforme l’homme qui s’en sert : la question de Vigny, celle de la maîtrise, est restée la nôtre.</p>`;
  e.sujet.q2.intro = `<p>« Mais aucun n’est le maître / Du dragon mugissant qu’un savant a fait naître » : en 1844, Vigny voit dans le chemin de fer une puissance que les hommes ont créée et qui les entraîne. On pense pourtant spontanément que le progrès technique nous libère : il guérit des maladies, abolit les distances, protège des famines, bref il fait reculer ce qui nous arrivait autrefois sans que nous puissions rien y faire. Le progrès technique désigne l’accroissement de nos moyens d’agir sur la nature ; être maître, c’est décider et ne pas être commandé ; le destin, c’est ce qui nous arrive sans que nous l’ayons choisi. Le problème est donc le suivant : la technique, en nous donnant du pouvoir, nous rend-elle maîtres de ce qui nous arrive, ou bien crée-t-elle un nouveau destin, auquel nous sommes d’autant plus soumis que nous l’avons nous-mêmes produit ? Nous verrons d’abord que la technique fait reculer le destin, puis qu’elle produit de nouvelles fatalités, avant de montrer que la maîtrise ne dépend pas de la technique seule, mais de notre capacité à en fixer les fins et les limites.</p>`;
  e.sujet.q2.plan = [
    ["I. La technique fait reculer le destin", `<ul class="puces"><li>L’homme naît démuni ; la technique est sa manière de survivre (Platon, mythe de Prométhée). Ce qui était fatalité devient problème à résoudre.</li><li>Descartes (1637) : la science pratique doit nous rendre « comme maîtres et possesseurs de la nature », d’abord pour la santé. Exemples : vaccins, greffes (1967), prévisions météorologiques.</li><li>Les distances et le temps ne s’imposent plus : « La distance et le temps sont vaincus » (Vigny). La technique élargit le champ de nos choix.</li></ul>` ],
    ["II. Mais elle crée un nouveau destin", `<ul class="puces"><li>La puissance technique échappe à ceux qui l’ont produite : « Nous nous sommes joués à plus fort que nous tous » (Vigny) ; Frankenstein (1818) ; Giono (bac 2026) : la machine transforme l’homme qui s’en sert.</li><li>Elle devient un système dont on dépend : impossible de vivre sans électricité (Barjavel, <i>Ravage</i>, 1943), sans réseaux numériques. Rousseau : la perfectibilité rend l’homme « tyran de lui-même et de la nature ».</li><li>Elle change l’échelle des risques : Hiroshima (1945), Tchernobyl (1986), dérèglement climatique ; l’humanité peut désormais se détruire (Arendt, bac 2021). Le destin collectif est plus menaçant que jamais.</li></ul>` ],

  e.sujet.q2.concl = `<p>Le progrès technique fait réellement reculer une part du destin : maladies, distances, famines. Mais il crée aussi un nouveau destin, celui d’un système que personne ne commande et de risques à l’échelle de l’humanité entière, comme le pressentait Vigny devant son « dragon mugissant ». La maîtrise de notre destin ne peut donc venir de la technique seule : elle dépend de notre capacité à décider de ses fins et de ses limites, c’est-à-dire de la morale et de la politique, et à accepter la finitude qui nous définit.</p>`;

<section><h3>Définitions</h3><ul class="puces"><li><b>Limite</b> : borne (ce qu’on ne peut pas) / norme (ce qu’on ne doit pas dépasser). <b>Finitude</b> : condition d’un être mortel et limité. <b>Hybris</b> : démesure.</li><li><b>Technique</b> (<i>technè</i>) ; <b>perfectibilité</b> (Rousseau) ; <b>progrès technique</b> ≠ <b>progrès moral</b> (Baudelaire).</li><li><b>Réparer</b> ≠ <b>augmenter</b> ; <b>transhumanisme</b> ; <b>dystopie</b> ; <b>Anthropocène</b> (Crutzen, 2000).</li></ul></section>
<section><h3>Thèses et auteurs</h3><ul class="puces"><li><b>Platon</b>, <i>Protagoras</i> : Prométhée donne les arts et le feu, pas la « science politique ».</li><li><b>Bacon</b> (1620) : savoir et pouvoir coïncident. <b>Descartes</b> (1637) : « comme maîtres et possesseurs de la nature », pour la santé d’abord.</li><li><b>Pascal</b> : « un roseau pensant » ; « toute notre dignité consiste dans la pensée ».</li><li><b>Rousseau</b> (1755) : la perfectibilité « presque illimitée » rend l’homme « le tyran de lui-même et de la nature ».</li><li><b>Vigny</b> (1844) : « Sur le taureau de fer […] L’homme a monté trop tôt ». <b>Baudelaire</b> (1855) : le progrès, « fanal obscur ».</li><li><b>Freud</b> : l’homme, « dieu prothétique ». <b>Heidegger</b> : la nature « arraisonnée ». <b>Anders</b> : la « honte prométhéenne ». <b>Arendt</b> : Spoutnik, la société de travailleurs.</li><li><b>Jonas</b> (1979) : « Agis de façon que les effets de ton action soient compatibles avec la permanence d’une vie authentiquement humaine sur terre » (traduction usuelle).</li><li><b>Huxley</b> (1932), <b>Orwell</b> (1949), <b>Barjavel</b> (1943), <b>Dick</b> (1968) : les dystopies. <b>Valéry</b> (1920) : « Il faut tenter de vivre ! »</li></ul></section>
<section><h3>Le problème en une phrase</h3><p>La technique, qui compense la faiblesse humaine, donne un pouvoir sans limite apparente ; mais ce pouvoir se retourne contre l’homme et la nature : la question n’est plus de savoir jusqu’où l’on peut aller, mais jusqu’où l’on doit aller.</p></section>
<section><h3>Trois citations à savoir par cœur</h3><ul class="puces"><li>« nous rendre comme maîtres et possesseurs de la nature » (Descartes, 1637)</li><li>« L’homme n’est qu’un roseau le plus faible de la nature ; mais c’est un roseau pensant. » (Pascal)</li><li>« Le vent se lève !… Il faut tenter de vivre ! » (Valéry, 1920)</li></ul></section>`;

  "e5-kant": { type: "graphe", titre: "Kant : comment la discorde mène (peut-être) à la paix", w: 640, h: 530,

  "e5-weil": { type: "texte", titre: "Lecture animée : Simone Weil, « L’Iliade ou le poème de la force »",
    intro: "Les trois mouvements du texte du sujet type bac s’allument au fil de la lecture. Bleu : la force au centre de l’histoire ; rose : de l’homme à la chose ; cuivre : personne ne possède la force.",
    segs: [
      { t: "Le vrai héros, le vrai sujet, le centre de l’Iliade, c’est la force.", m: 1, p: 1, titre: "Une définition par substitution", n: "Le rythme ternaire (« héros », « sujet », « centre ») retarde la révélation : ni Achille ni Hector, mais une abstraction. Le présentatif « c’est » donne à la phrase la force d’une thèse." },
      " ",
      { t: "La force qui est maniée par les hommes, la force qui soumet les hommes, la force devant quoi la chair des hommes se rétracte.", m: 1, p: 1, titre: "L’anaphore", n: "« la force » est repris trois fois, et « les hommes » aussi : la phrase passe de l’homme qui agit à l’homme qui subit, jusqu’à la « chair » qui recule. Tous les rapports à la force sont couverts." },
      " ",
      { t: "Ceux qui avaient rêvé que la force, grâce au progrès, appartenait désormais au passé, ont pu voir dans ce poème un document ; ceux qui savent discerner la force, aujourd’hui comme autrefois, au centre de toute histoire humaine, y trouvent le plus beau, le plus pur des miroirs.", m: 1, titre: "Deux lectures, deux philosophies de l’histoire", n: "L’opposition « document » / « miroir » oppose ceux qui croient au progrès (la force serait du passé) et ceux qui voient la force « au centre de toute histoire humaine ». En 1940, Simone Weil a choisi." },
      "\n",
      { t: "La force, c’est ce qui fait de quiconque lui est soumis une chose.", m: 2, p: 1, titre: "La thèse", n: "Définition générale (« quiconque ») et radicale : la force ne blesse pas seulement, elle change la nature de celui qu’elle touche. Sujet devient objet." },
      " Quand elle s’exerce jusqu’au bout, elle fait de l’homme une chose au sens le plus littéral, car elle en fait un cadavre. ",
      { t: "Il y avait quelqu’un, et, un instant plus tard, il n’y a personne.", m: 2, p: 1, titre: "Deux pronoms", n: "« quelqu’un » / « personne » : la phrase, au rythme brisé par les virgules, fait disparaître le sujet. Passage de l’imparfait au présent : la mort est immédiate et définitive." },
      " […] ",
      { t: "La force qui tue est une forme sommaire, grossière de la force.", m: 2, titre: "La gradation vers le pire", n: "Tuer n’est que la forme « grossière » : le texte annonce une force plus « surprenante », celle qui menace sans tuer encore." },
      " […] de toutes façons, elle change l’homme en pierre. […] ",
      { t: "Il est vivant, il a une âme ; il est pourtant une chose.", m: 2, p: 1, titre: "Le paradoxe central", n: "Trois propositions courtes ; « pourtant » renverse les deux premières. C’est l’esclave, le prisonnier, le suppliant : vivants, conscients, traités et se vivant comme des choses." },
      "\n",
      { t: "Aussi impitoyablement la force écrase, aussi impitoyablement elle enivre quiconque la possède, ou croit la posséder.", m: 3, p: 1, titre: "Le parallélisme", n: "« Aussi… aussi… » met sur le même plan la victime et le vainqueur. La correction « ou croit la posséder » prépare la chute." },
      " ",
      { t: "Personne ne la possède véritablement.", m: 3, titre: "La chute", n: "Phrase brève, négation totale : celui qui manie la force est lui-même manié par elle. Le vainqueur devient une chose à son tour. C’est la grande leçon du texte, à placer dans la troisième partie de l’explication." }
    ] },

<div class="lecture entre">
<section id="ep-format"><h2>Le format officiel (session 2027)</h2>
<p class="lettrine">La note de service du 11 septembre 2026 (BO spécial n° 4 du 17 septembre 2026) définit l’épreuve « à compter de la session 2027 » ; elle remplace celle du 11 février 2020.</p>
<div class="defile"><table class="t kv"><tbody>
<tr><th>Durée</th><td>4 heures.</td></tr>
<tr><th>Coefficient</th><td>16, comme chacune des deux épreuves de spécialité.</td></tr>
<tr><th>Support</th><td>Un <b>texte</b> « relatif à l’un des thèmes du programme » de Terminale.</td></tr>
<tr><th>Première question</th><td>« <b>Interprétation littéraire</b> » <i>ou</i> « <b>interprétation philosophique</b> » : un développement qui expose « la compréhension et l’analyse d’un enjeu majeur du texte ». <b>10 points.</b></td></tr>
<tr><th>Deuxième question</th><td>« <b>Essai littéraire</b> » <i>ou</i> « <b>essai philosophique</b> » : une « réponse étayée à une question soulevée par le texte ». <b>10 points.</b></td></tr>
<tr><th>Copies</th><td>Deux copies distinctes, questions clairement identifiées, corrigées l’une par un professeur de lettres, l’autre par un professeur de philosophie. Les deux développements ont une « ampleur comparable ».</td></tr>
<tr><th>Matériel</th><td>Calculatrice et dictionnaire interdits (mention portée sur les sujets de 2022 à 2026).</td></tr>
<tr><th>Langue</th><td>La qualité de l’expression entre dans la note : une copie « défaillante sur l’ensemble des aspects relatifs à la maîtrise de la langue ne peut avoir la moyenne ».</td></tr>
</tbody></table></div>
<p>L’intitulé du sujet dit toujours quelle approche est attendue. Si l’interprétation est littéraire, l’essai est philosophique, et inversement : sur les sujets de métropole de 2023 à 2026, les deux combinaisons sont tombées.</p>
<div class="cle"><b class="l">Quelles parties du programme ?</b><b>Tout le programme de Terminale, soit les six entrées.</b> Pour les sessions 2021 à 2023, un « programme limitatif » réduisait l’écrit à quatre entrées (« Les expressions de la sensibilité », « Les métamorphoses du moi », « Histoire et violence », « L’humain et ses limites »). Depuis la session 2024, l’épreuve « porte sur le programme de l’enseignement de spécialité de la classe de terminale en vigueur » (version consolidée d’Éduscol, août 2024), et la note de 2026 reprend cette formule. « Éducation, transmission et émancipation » et « Création, continuités et ruptures » peuvent donc tomber : le sujet de 2025 (Condorcet, sur l’éducation de la sensibilité) en est un exemple. Les notions de Première « doivent être connues et mobilisables », sans pouvoir être « un ressort essentiel du sujet ».</div>
<p class="petit mute">Depuis 2024, l’épreuve a lieu en juin (19-20 juin 2024, 17-18 juin 2025, 16-17 juin 2026, avec un sujet différent chaque jour). La date de 2027 est fixée par le calendrier officiel de l’examen.</p>
<h3>L’oral de contrôle (second groupe)</h3><p>20 minutes de préparation, 20 minutes d’épreuve : une question de littérature ou de philosophie selon l’examinateur, liée au thème de l’écrit ; 10 minutes de réponse au maximum, puis un entretien.</p>
</section>
<details class="pli" open><summary>Ce que valorise le barème officiel (échelle descriptive)</summary><div class="dedans">
<p><b>Interprétation</b> : « compréhension et élucidation du sens du texte […] non pas dans son intégralité, mais dans certains de ses éléments les plus significatifs » ; précision de la lecture, attention aux choix d’écriture, au lexique, aux arguments ; organisation d’une explication argumentée « en prise sur la lettre et sur l’esprit du texte ».</p>
<p><b>Essai</b> : « attention portée à la question posée, à ce qui la justifie, en général mais toujours aussi au regard du texte étudié » ; réponse précise, ordonnée, argumentée ; mobilisation « à bon escient » des connaissances acquises.</p>
<p>À partir de 5/10 : une copie construite, sans contresens majeur, qui s’appuie sur le texte et formule une réponse. Pour 8/10 et plus : attention aux implicites et aux enjeux, position située par rapport au texte et à d’autres textes, culture « précise et pertinemment utilisée ». Une copie « qui aurait pu être rédigée au début de l’année » reste entre 2 et 4.</p>
</div></details>

<section id="ep-interp"><h2>Méthode : la question d’interprétation</h2>
<p>Il ne s’agit ni d’un commentaire composé complet, ni d’une explication linéaire : tu réponds à <b>une question précise</b> en t’appuyant sur les éléments du texte qui l’éclairent le mieux.</p>
<ol class="plan-l">
<li><b>1. Lire le texte trois fois (20 min)</b><br>Une lecture pour comprendre (thème, thèse ou situation), une pour repérer les mouvements (avec les lignes), une crayon en main pour souligner ce qui répond à la question.</li>
<li><b>2. Décortiquer la question (10 min)</b><br>Chaque mot compte : « comment » appelle les moyens d’écriture, « pourquoi » des raisons, « en quoi » une démonstration. Reformule-la en problème : qu’est-ce qui ne va pas de soi ?</li>
<li><b>3. Brouillon en tableau (30 min)</b><br>Trois colonnes : <i>citation (avec ligne)</i> · <i>ce que je remarque</i> (procédé, concept, argument) · <i>ce que ça signifie pour la question</i>. Regroupe ensuite en deux ou trois idées : ce seront tes parties.</li>
<li><b>4. Rédiger l’introduction (au propre directement ou presque)</b><br>Amorce liée au texte · présentation (auteur, œuvre, date, situation) · reformulation de la question en problème · réponse annoncée (thèse) · plan.</li>
<li><b>5. Développer (50 min)</b><br>Chaque paragraphe : une idée → une citation courte intégrée à ta phrase → l’analyse (le procédé ou le concept, nommé avec précision) → l’interprétation (ce que cela apporte à la réponse). Transitions entre parties.</li>
<li><b>6. Conclure et relire (10 min)</b><br>Réponse nette à la question, puis une ouverture vers une autre œuvre ou un autre auteur. Relecture pour la langue : accords, ponctuation, guillemets.</li>
</ol>
<div class="defile"><table class="t"><thead><tr><th></th><th>Interprétation littéraire</th><th>Interprétation philosophique</th></tr></thead><tbody>
<tr><th>On cherche</th><td>Comment le texte produit du sens et des effets</td><td>Ce que le texte soutient et comment il le justifie</td></tr>
<tr><th>Outils</th><td>Genre, énonciation, figures, rythme, lexique, registres, composition</td><td>Thèse, concepts, distinctions, arguments, exemples, présupposés, objections</td></tr>
<tr><th>Piège</th><td>Le catalogue de procédés sans interprétation</td><td>La dissertation générale qui oublie le texte</td></tr>
<tr><th>Point commun</th><td colspan="2">Citer précisément, situer dans le texte (lignes), relier chaque remarque à la question posée.</td></tr>
</tbody></table></div>
</section>

<section id="ep-essai"><h2>Méthode : l’essai</h2>
<p>L’essai répond à une question « soulevée par le texte ». C’est une réflexion argumentée, construite comme une dissertation courte, qui doit <b>partir du texte et y revenir</b>.</p>
<ol class="plan-l">
<li><b>1. Analyser les termes (15 min)</b><br>Définis chaque mot important, cherche ses sens différents, les mots voisins et contraires. « Peut-on être heureux sans penser ? » : « peut-on » (possibilité ? droit ?), « heureux » (bonheur ≠ plaisir), « penser » (réfléchir ? juger ? se représenter l’avenir ?).</li>
<li><b>2. Trouver le problème (15 min)</b><br>Une tension entre deux réponses également défendables. Formule-la en une phrase : « D’un côté… mais de l’autre… ». La thèse du texte est souvent l’une des deux réponses.</li>
<li><b>3. Construire un plan (30 min)</b><br>Deux ou trois parties qui <b>progressent</b> : la réponse la plus évidente, ses limites, une réponse plus juste qui tient compte des deux. Chaque partie : deux ou trois arguments, chacun avec un exemple précis (une œuvre, un auteur, une scène, une date).</li>
<li><b>4. Rédiger (60 min)</b><br>Introduction : amorce (souvent le texte), définition des termes, problème, plan. Conclusion : réponse claire, sans formule creuse.</li>
</ol>
<div class="defile"><table class="t"><thead><tr><th></th><th>Essai littéraire</th><th>Essai philosophique</th></tr></thead><tbody>
<tr><th>Arguments appuyés sur</th><td>Des œuvres analysées (passages, personnages, procédés) et l’histoire littéraire</td><td>Des concepts, des distinctions, des raisonnements, des thèses d’auteurs</td></tr>
<tr><th>Exemple attendu</th><td>« Dans <i>L’Enfant</i> (1878), Vallès fait raconter le collège par un enfant… »</td><td>« Kant distingue l’usage privé et l’usage public de la raison… »</td></tr>
<tr><th>Le « je »</th><td colspan="2">Un « je » qui argumente, jamais un récit de ta vie. Les exemples de la vie courante sont permis s’ils servent un argument.</td></tr>
</tbody></table></div>
<div data-anim="ep-essai"></div>
<div class="cle"><b class="l">Gérer les 4 heures</b>Lis le sujet entier d’abord, puis 1 h 55 environ par question, 10 minutes de relecture. Commence par la question qui t’inspire le plus, mais garde du temps pour l’autre : deux copies équilibrées valent mieux qu’une excellente et une bâclée.</div>
</section>

<section id="ep-erreurs"><h2>Les erreurs fréquentes</h2>
<ul class="puces">
<li><b>La paraphrase</b> : répéter le texte avec d’autres mots. Remède : chaque citation doit être suivie d’une analyse (« le verbe… montre que… »).</li>
<li><b>Le catalogue</b> : « il y a une métaphore, une anaphore, une hyperbole ». Remède : un procédé n’a d’intérêt que par ce qu’il fait au sens.</li>
<li><b>La récitation du cours</b> dans l’essai, sans rapport avec la question. Le barème la place entre 2 et 4.</li>
<li><b>Oublier le texte dans l’essai</b> : l’échelle officielle demande de répondre « toujours aussi au regard du texte étudié ».</li>
<li><b>Le plan « oui / non »</b> sans progression : la troisième partie doit dépasser l’opposition, pas faire la moyenne.</li>
<li><b>Les citations inexactes ou mal attribuées</b> : mieux vaut une paraphrase honnête (« Kant invite à penser par soi-même ») qu’une citation inventée.</li>
<li><b>Mélanger les deux copies</b> : chaque partie sur sa propre copie, avec l’intitulé de la question.</li>
<li><b>Négliger la langue</b> : elle compte dans la note des deux parties.</li>
</ul></section>

<li>sentiment dans sa naissance ; conservons-le comme une plante faible encore, qu’un</li>
<li>instant peut flétrir et dessécher pour jamais. N’oublions pas surtout que dans l’homme</li>
<li>occupé de travaux grossiers qui émoussent sa sensibilité, et le ramènent aux sentiments</li>
<li>personnels, l’habitude de la dureté produit cette disposition à la férocité qui est le plus</li>
<li>grand ennemi des vertus et de la liberté du peuple, la seule excuse des tyrans, le seul</li>
<li>prétexte spécieux de toutes les lois inégales.</li>
</ol><p class="ref" style="text-align:right">Condorcet, <i>Cinq mémoires sur l’instruction publique</i>, 1791. (« spécieux » : qui a une belle apparence, mais qui est faux.)</p>
<div class="q"><b>Première partie : interprétation philosophique</b>Pourquoi, d’après ce texte, faut-il « exercer l’âme des enfants » à la pitié ?</div>
<div class="q"><b>Deuxième partie : essai littéraire</b>La littérature a-t-elle pour vocation d’éduquer à la sensibilité ?</div></div>

<h3>Interprétation philosophique : la copie rédigée</h3>
<div class="copie">
<div class="seg"><p>On imagine volontiers que l’école sert d’abord à instruire : apprendre à lire, à compter, à raisonner. Dans ce passage des <i>Cinq mémoires sur l’instruction publique</i> (1791), Condorcet, philosophe des Lumières élu député à l’Assemblée législative la même année, affirme pourtant que les « premiers sentiments auxquels il faut exercer l’âme des enfants » sont la pitié pour l’homme et pour les animaux, et l’affection pour ceux qui nous font du bien.</p></div>
<div class="marge">Amorce qui part d’une idée reçue que le texte contredit. Présentation exacte : auteur, œuvre, date, sujet.</div>
<div class="seg"><p>Pourquoi un penseur si attaché à la raison place-t-il un sentiment au fondement de l’éducation ? Condorcet répond que la pitié, naturelle mais fragile, est le principe actif de toute moralité et une condition de la liberté du peuple : il faut l’exercer pour qu’elle ne s’éteigne pas. Nous verrons d’abord que la pitié est un sentiment naturel que l’éducation doit seulement rendre attentif (l. 1-8), puis qu’elle fonde la moralité et qu’une mauvaise habitude peut la détruire (l. 9-17), avant de montrer sa portée politique (l. 17-21).</p></div>
<div class="marge">La question devient un problème (un paradoxe : raison / sentiment). La thèse est annoncée avec ses raisons, le plan suit les mouvements du texte, lignes à l’appui.</div>
<div class="seg"><p><b>I.</b> Condorcet ne demande pas à l’école de créer la pitié. Ces sentiments sont « de tous les âges » et « fondés sur des motifs simples et voisins de nos sensations immédiates de plaisir ou de peine » : ils sont naturels et précoces, puisqu’ils existent « aussitôt que nous pouvons avoir l’idée distincte d’un individu ». Le rôle de l’éducation est donc modeste et précis : « nous n’avons besoin que d’en être avertis pour apprendre à les apercevoir, à les reconnaître, à les distinguer ». La gradation des trois verbes décrit une éducation de l’<b>attention</b> : percevoir le sentiment, l’identifier, puis le différencier des autres. Le verbe « exercer » le confirme : on exerce ce qui existe déjà, comme un muscle. On retrouve ici une idée de Rousseau, pour qui la pitié est un sentiment naturel antérieur à la réflexion ; mais Condorcet en tire une tâche pour l’école.</p></div>
<div class="marge">Citations courtes, intégrées à la phrase, analysées (gradation, sens du verbe « exercer »). Une connaissance (Rousseau) est mobilisée « à bon escient » : elle éclaire le texte au lieu de le remplacer.</div>
<div class="seg"><p><b>II.</b> Pourquoi cette éducation est-elle si importante ? Parce que la pitié est « le premier principe actif de toute moralité comme de toute vertu ». Condorcet l’explique par son origine : une « douleur irréfléchie et presque organique » produite par la vue des souffrances « d’un autre être sensible ». Le critère n’est pas l’espèce mais la sensibilité ; c’est pourquoi « la pitié pour les animaux a le même principe que la pitié pour les hommes ». L’argument est alors redoutable : habituer un enfant à voir souffrir des animaux « avec indifférence ou même avec plaisir », c’est détruire en lui, « même à l’égard des hommes », le germe de la moralité. La gradation « on affaiblit, on détruit » montre qu’une habitude suffit à corrompre une nature. Sans ce sentiment, la morale ne serait plus qu’« un calcul d’intérêt », « une froide combinaison de la raison » : pour un rationaliste des Lumières, l’aveu est remarquable. La raison calcule, mais seule la sensibilité met en mouvement. D’où l’impératif collectif « Gardons-nous » et la métaphore de la « plante faible encore, qu’un instant peut flétrir » : l’éducation doit protéger une fragilité.</p></div>
<div class="marge">Le cœur de l’argument est reconstitué (principe → conséquence → menace). Les concepts sont nommés (moralité, raison, sensibilité) et le texte est situé dans son époque sans hors-sujet.</div>
<div class="seg"><p><b>III.</b> La dernière phrase élargit la perspective : de l’enfant, on passe au « peuple ». Chez l’homme « occupé de travaux grossiers qui émoussent sa sensibilité », « l’habitude de la dureté » produit une « disposition à la férocité ». Or cette férocité est « le plus grand ennemi des vertus et de la liberté du peuple, la seule excuse des tyrans, le seul prétexte spécieux de toutes les lois inégales ». La phrase culmine en trois groupes de plus en plus politiques : si le peuple paraît féroce, les tyrans justifient leur pouvoir par la nécessité de le contenir, et les lois inégales par son incapacité supposée à être libre. Éduquer la sensibilité de tous, c’est donc retirer aux despotes leur meilleur argument. On comprend alors pourquoi ce passage figure dans un mémoire sur l’<b>instruction publique</b> : l’égalité des droits suppose des citoyens que la dureté n’a pas abrutis. On peut seulement regretter que Condorcet attribue la dureté au travail « grossier » plutôt qu’aux conditions qui l’imposent ; mais sa conclusion est justement qu’il faut une éducation pour tous.</p></div>
<div class="marge">Mise au jour d’un implicite (la logique des tyrans), lien avec le projet d’ensemble de l’œuvre, et une nuance critique, brève et argumentée : c’est ce qui fait passer au-dessus de 8.</div>
<div class="seg"><p>Il faut donc exercer l’âme des enfants à la pitié parce que ce sentiment, naturel mais fragile, est le principe actif de toute moralité, et parce que, laissé s’émousser, il fait place à une férocité dont les tyrans font leur excuse. Condorcet donne ainsi à l’éducation de la sensibilité une portée à la fois morale et politique. Reste à savoir quels moyens permettent cet exercice : la littérature, qui nous fait éprouver la souffrance de personnages imaginaires, pourrait en être un.</p></div>
<div class="marge">Réponse nette à la question posée, en reprenant ses termes. Ouverture qui prépare l’essai sans le traiter.</div>
</div>

<h3>Essai littéraire : introduction, plan et conclusion</h3>
<div class="copie">
<div class="seg"><p>Condorcet voulait qu’on exerce « l’âme des enfants » à la pitié pour que ne naisse pas la férocité. La littérature, qui nous fait pleurer sur des personnages qui n’existent pas, semble l’instrument idéal de cette éducation. Pourtant, faire de l’éducation de la sensibilité sa « vocation », c’est-à-dire sa raison d’être, revient à la juger sur sa moralité plutôt que sur sa beauté, et l’histoire littéraire montre qu’elle peut aussi égarer nos émotions. La littérature a-t-elle pour fin d’éduquer notre sensibilité, ou cette éducation n’est-elle qu’un effet, parfois ambigu, de ce qu’elle fait d’abord : donner forme à ce que l’on sent ?</p></div>
<div class="marge">Amorce par le texte. Le mot « vocation » est défini : c’est lui qui crée le problème.</div>
<div class="seg"><p><b>I. La littérature affine la sensibilité.</b> Elle fait éprouver la pitié et la crainte (Aristote, <i>Poétique</i>, à propos de la tragédie) ; les lecteurs de <i>La Nouvelle Héloïse</i> (1761) pleurent et écrivent à Rousseau ; Hugo, dans « Melancholia » (<i>Les Contemplations</i>, 1856), fait voir des enfants au travail pour éveiller la pitié sociale. Proust : « Par l’art seulement, nous pouvons sortir de nous ».<br><b>II. Mais ce n’est pas sa vocation, et elle peut dérégler la sensibilité.</b> Emma Bovary a une sensibilité faussée par les romans lus au couvent (Flaubert, 1857). Gautier proclame que rien n’est vraiment beau que ce qui ne sert à rien (préface de <i>Mademoiselle de Maupin</i>, 1835). Diderot montre que l’art émeut par la maîtrise et non par la sensibilité.<br><b>III. Elle éduque la sensibilité en la rendant lucide.</b> Flaubert, en montrant les clichés d’Emma, apprend au lecteur à reconnaître les siens ; Baudelaire invente des manières de sentir (correspondances) ; Rimbaud fait du « dérèglement » une méthode « raisonnée ». Comme le voulait Condorcet, il s’agit moins d’imposer des émotions que d’apprendre à les « apercevoir », « reconnaître », « distinguer ».</p></div>
<div class="marge">Un plan qui progresse : thèse, limites, dépassement. Chaque argument porte un exemple précis (titre, date, scène). La troisième partie revient au texte.</div>
<div class="seg"><p>La littérature éduque bien la sensibilité, mais ce n’est pas sa vocation première : lorsqu’elle se fait leçon, elle risque de fabriquer des émotions convenues, et elle peut même égarer ceux qui confondent la vie et les livres. Son pouvoir est plus subtil : en donnant forme à ce que nous sentons, elle nous apprend à distinguer nos émotions vraies de celles que nous croyons éprouver. Elle n’éduque pas comme un maître qui commande, mais comme une expérience qui rend attentif.</p></div>
<div class="marge">La réponse est nuancée sans être tiède : elle reprend le mot « vocation » et tranche.</div>
</div>
</section>
