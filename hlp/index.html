<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L’Heure bleue — HLP Terminale</title>
<meta name="description" content="Réviser la spécialité Humanités, littérature et philosophie en Terminale : cours, textes clés, sujets type bac corrigés, méthode de l’épreuve.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#11172a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --fond:#f4eedf; --surface:#fbf8f0; --surface2:#efe6d2; --encre:#1f2338; --encre2:#5d5866;
  --cuivre:#9a552a; --cuivre2:#b8733f; --rose:#9b4b57; --brume:#34497a; --filet:#ddd0b5; --filet2:#cbbb9a;
  --voile:rgba(31,35,56,.42); --ombre:0 1px 2px rgba(60,45,20,.06),0 8px 28px rgba(60,45,20,.08);
  --t-m1:rgba(52,73,122,.2); --t-m2:rgba(155,75,87,.19); --t-m3:rgba(154,85,42,.22);
  --ciel1:#2a3560; --ciel2:#6f6f9a; --ciel3:#e7c9b2; --astre:#f6ecd6;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",P052,Charter,"Bitstream Charter",Georgia,serif;
  --titre:"Baskerville","Baskerville Old Face","Libre Baskerville","Hoefler Text","Garamond","EB Garamond","Iowan Old Style",Georgia,serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fond:#11172a; --surface:#182038; --surface2:#202a47; --encre:#ede4d0; --encre2:#aaa59b;
    --cuivre:#d69c6b; --cuivre2:#e8b78c; --rose:#dfa7ab; --brume:#a3b6dc; --filet:rgba(237,228,208,.13); --filet2:rgba(237,228,208,.24);
    --voile:rgba(5,8,18,.62); --ombre:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.28);
    --t-m1:rgba(163,182,220,.17); --t-m2:rgba(223,167,171,.16); --t-m3:rgba(214,156,107,.18);
    --ciel1:#0b1022; --ciel2:#26305a; --ciel3:#6b5a74; --astre:#f2e6cc;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fond:#11172a; --surface:#182038; --surface2:#202a47; --encre:#ede4d0; --encre2:#aaa59b;
  --cuivre:#d69c6b; --cuivre2:#e8b78c; --rose:#dfa7ab; --brume:#a3b6dc; --filet:rgba(237,228,208,.13); --filet2:rgba(237,228,208,.24);
  --voile:rgba(5,8,18,.62); --ombre:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.28);
  --t-m1:rgba(163,182,220,.17); --t-m2:rgba(223,167,171,.16); --t-m3:rgba(214,156,107,.18);
  --ciel1:#0b1022; --ciel2:#26305a; --ciel3:#6b5a74; --astre:#f2e6cc;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--serif);font-size:17.5px;line-height:1.62;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--cuivre);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--rose)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cuivre);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--titre);font-weight:400;line-height:1.2;letter-spacing:.01em;margin:1.4em 0 .5em}
h2{font-size:1.65rem} h3{font-size:1.28rem} h4{font-size:1.08rem;font-style:italic}
p{margin:.65em 0}
.pc{font-variant:small-caps;letter-spacing:.08em;text-transform:lowercase}
.ui{font-family:var(--ui)}
em,i{font-style:italic}
blockquote{margin:1em 0;padding:.2em 0 .2em 1.1em;border-left:2px solid var(--cuivre);font-style:italic}
hr.fil{border:0;height:1px;background:var(--filet2);margin:2em 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
small,.petit{font-size:.86em}
.mute{color:var(--encre2)}

/* ---------- en-tête ---------- */
.tete{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top,0px));
  background:color-mix(in srgb,var(--fond) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--filet)}
.tete .marque{display:flex;align-items:center;gap:9px;flex:1;min-width:0;text-decoration:none;color:var(--encre);padding:4px 2px}
.marque svg{width:30px;height:30px;flex:none}
.marque b{font-family:var(--titre);font-weight:400;font-size:1.28rem;letter-spacing:.02em;white-space:nowrap}
.marque .m-txt{display:block;min-width:0;line-height:1.15}
.marque b{display:block}
.marque small{display:block;font-family:var(--ui);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--encre2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--encre);flex:none}
.ico:hover{background:var(--surface2)}
.ico svg{width:22px;height:22px}
.cherche-btn{display:none}

/* ---------- menu ---------- */
.menu{position:fixed;z-index:60;top:0;bottom:0;left:0;width:min(86vw,320px);background:var(--surface);border-right:1px solid var(--filet);
  transform:translateX(-102%);visibility:hidden;overflow-y:auto;padding:14px 10px calc(90px + env(safe-area-inset-bottom,0px));transition:transform .28s ease,visibility 0s .28s}
.menu.ouvert{transform:none;visibility:visible;transition:transform .28s ease}
.voile-menu{position:fixed;inset:0;z-index:55;background:var(--voile);display:none}
.voile-menu.on{display:block}
.menu .m-tete{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--filet);margin-bottom:8px}
.menu .m-tete svg{width:40px;height:40px}
.menu .m-tete b{font-family:var(--titre);font-weight:400;font-size:1.35rem}
.menu .m-tete small{display:block;font-family:var(--ui);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--encre2)}
.menu h6{font-family:var(--ui);font-weight:600;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--encre2);margin:16px 10px 6px}
.menu a{display:flex;align-items:center;gap:11px;min-height:44px;padding:7px 10px;border-radius:10px;color:var(--encre);text-decoration:none;line-height:1.25}
.menu a svg{width:20px;height:20px;flex:none;color:var(--cuivre)}
.menu a:hover{background:var(--surface2)}
.menu a.actif{background:var(--surface2);box-shadow:inset 3px 0 0 var(--cuivre)}
.menu a .num{font-family:var(--titre);color:var(--cuivre);width:20px;text-align:center;flex:none}
.menu a .bientot{margin-left:auto;font-family:var(--ui);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--encre2);border:1px solid var(--filet2);border-radius:20px;padding:1px 7px}

/* ---------- page ---------- */
main{padding:0 16px 120px;max-width:980px;margin:0 auto}
.lecture{max-width:44rem}
.page-entete{padding:26px 0 8px}
.surtitre{font-family:var(--ui);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cuivre);margin:0 0 6px}
.page-entete h1{font-size:clamp(1.9rem,6.4vw,2.9rem);margin:0 0 .25em}
.page-entete .chapo{font-size:1.08rem;color:var(--encre2);max-width:40rem;font-style:italic}
.orn{display:flex;align-items:center;gap:12px;color:var(--cuivre);margin:18px 0}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--filet2))}
.orn::after{background:linear-gradient(90deg,var(--filet2),transparent)}
.orn svg{width:46px;height:14px;flex:none}

/* lettrine */
.lettrine::first-letter{font-family:var(--titre);float:left;font-size:3.3em;line-height:.82;padding:.06em .1em 0 0;color:var(--cuivre)}

/* ---------- onglets ---------- */
.onglets{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:30;background:var(--fond);margin:8px -16px 0;padding:0 16px;border-bottom:1px solid var(--filet);
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglets a{flex:none;display:flex;align-items:center;min-height:46px;padding:0 13px;color:var(--encre2);text-decoration:none;font-family:var(--ui);font-size:.86rem;border-bottom:2px solid transparent;white-space:nowrap}
.onglets a.actif{color:var(--encre);border-bottom-color:var(--cuivre)}

/* ---------- blocs ---------- */
.carte{background:var(--surface);border:1px solid var(--filet);border-radius:14px;padding:16px 18px;margin:14px 0;box-shadow:var(--ombre)}
.essentiel{position:relative;background:var(--surface);border:1px solid var(--filet);border-radius:4px 22px 4px 22px;padding:18px 18px 12px;margin:18px 0}
.essentiel h2{margin:0 0 6px;font-size:1.15rem;font-style:italic;color:var(--cuivre)}
.essentiel ol{margin:0;padding-left:1.2em}
.essentiel li{margin:.38em 0}
.cadre-prog{border:1px dashed var(--filet2);border-radius:12px;padding:12px 16px;margin:16px 0}
.cadre-prog h3{margin:.2em 0 .4em;font-size:1.05rem;font-family:var(--ui);font-weight:600;letter-spacing:.02em}
.cadre-prog ul{margin:0;padding-left:1.1em}
.idee{position:relative;padding:4px 0 6px;margin:26px 0;scroll-margin-top:120px}
.idee>h3{margin:0 0 .35em;display:flex;gap:10px;align-items:baseline}
.idee>h3 .n{font-family:var(--titre);color:var(--cuivre);font-size:.95em;flex:none}
.idee.surligne{background:var(--t-m3);box-shadow:0 0 0 10px var(--t-m3);transition:background 1.2s ease 1.6s,box-shadow 1.2s ease 1.6s}
.idee.surligne.fini{background:transparent;box-shadow:0 0 0 10px transparent}
.ex{border-left:3px solid var(--rose);background:var(--surface);padding:10px 14px;border-radius:0 10px 10px 0;margin:.8em 0}
.ex b.l,.cle b.l,.attention b.l,.plus b.l{display:block;font-family:var(--ui);font-weight:600;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);margin-bottom:2px}
.cle{border-left:3px solid var(--brume);background:var(--surface);padding:10px 14px;border-radius:0 10px 10px 0;margin:.8em 0}
.cle b.l{color:var(--brume)}
.attention{border:1px solid var(--rose);padding:10px 14px;border-radius:10px;margin:.8em 0}
.plus{border:1px dotted var(--filet2);padding:10px 14px;border-radius:10px;margin:.8em 0;background:var(--surface)}
.plus b.l{color:var(--encre2)}
.cit{font-style:italic}
.ref{font-family:var(--ui);font-size:.78rem;color:var(--encre2);font-style:normal}
details.pli{border:1px solid var(--filet);border-radius:12px;margin:12px 0;background:var(--surface)}
details.pli>summary{cursor:pointer;list-style:none;padding:12px 44px 12px 16px;min-height:46px;position:relative;font-family:var(--ui);font-size:.92rem;font-weight:600}
details.pli>summary::-webkit-details-marker{display:none}
details.pli>summary::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid var(--cuivre);border-bottom:2px solid var(--cuivre);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
details.pli[open]>summary::after{transform:translateY(-30%) rotate(-135deg)}
details.pli>.dedans{padding:0 16px 14px}
.grille{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.grille.g2{grid-template-columns:1fr 1fr}.grille.g3{grid-template-columns:repeat(3,1fr)}}
.tag{display:inline-block;font-family:var(--ui);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--filet2);border-radius:20px;padding:1px 9px;color:var(--encre2);margin:2px 4px 2px 0}
.tag.e1{color:var(--brume);border-color:var(--brume)} .tag.e2{color:var(--rose);border-color:var(--rose)} .tag.e3{color:var(--cuivre);border-color:var(--cuivre)}
.puces{padding-left:1.15em} .puces li{margin:.3em 0}
.defs dt{font-weight:700;margin-top:.7em}
.defs dd{margin:0 0 0 1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:24px;border:1px solid var(--filet2);background:var(--surface);color:var(--encre);
  cursor:pointer;font-family:var(--ui);font-size:.9rem;text-decoration:none}
.btn:hover{border-color:var(--cuivre);color:var(--encre)}
.btn.plein{background:var(--cuivre);border-color:var(--cuivre);color:var(--fond)}
.btn.plein:hover{background:var(--rose);border-color:var(--rose);color:var(--fond)}
.btn svg{width:18px;height:18px}
.rang{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.puce-f{min-height:40px;padding:6px 13px;border-radius:22px;border:1px solid var(--filet2);background:transparent;cursor:pointer;font-family:var(--ui);font-size:.82rem;color:var(--encre2)}
.puce-f[aria-pressed="true"]{background:var(--encre);color:var(--fond);border-color:var(--encre)}
.defile{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;border:1px solid var(--filet);border-radius:12px}
table.t{border-collapse:collapse;width:100%;min-width:520px;font-size:.93rem;background:var(--surface)}
table.t.kv{min-width:0}
table.t.kv th{width:32%}
table.t th,table.t td{border-bottom:1px solid var(--filet);padding:9px 11px;text-align:left;vertical-align:top}
table.t th{font-family:var(--ui);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--encre2);font-weight:600;background:var(--surface2)}

/* ---------- accueil ---------- */
.ciel{position:relative;margin:0 -16px;min-height:300px;overflow:hidden;color:#f3ead6;
  background:linear-gradient(180deg,var(--ciel1) 0%,var(--ciel2) 62%,var(--ciel3) 100%)}
.ciel svg.decor{position:absolute;inset:0;width:100%;height:100%}
.ciel .txt{position:relative;padding:210px 20px 30px;max-width:620px}
@media(min-width:700px){.ciel .txt{padding:56px 28px 40px}}
.ciel h1{font-size:clamp(2.4rem,10vw,3.6rem);margin:0;color:#f6eedc;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.ciel .sous{font-family:var(--ui);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:#f0dcc7;margin:0 0 10px}
.ciel p.acc{font-size:1.08rem;font-style:italic;color:#efe5d2;max-width:30rem;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.ciel .rang .btn{background:rgba(246,238,220,.12);border-color:rgba(246,238,220,.45);color:#f6eedc}
.ciel .rang .btn.plein{background:#f2dcc4;color:#1b2140;border-color:#f2dcc4}
.semestre{margin:28px 0}
.semestre>h2{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.semestre>h2 small{font-family:var(--ui);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--encre2)}
.entree-c{display:block;position:relative;text-decoration:none;color:var(--encre);background:var(--surface);border:1px solid var(--filet);border-radius:16px;padding:16px 16px 14px 76px;min-height:110px;box-shadow:var(--ombre);transition:transform .2s,border-color .2s}
.entree-c:hover{border-color:var(--cuivre);color:var(--encre)}
.entree-c .chiffre{position:absolute;left:14px;top:12px;width:48px;height:48px;color:var(--cuivre)}
.entree-c h3{margin:0 0 4px;font-size:1.18rem}
.entree-c p{margin:0;font-size:.93rem;color:var(--encre2)}
.entree-c .etat{display:inline-block;margin-top:8px}
.entree-c.bientot{box-shadow:none;background:transparent;border-style:dashed}
.entree-c.bientot .chiffre{color:var(--encre2)}
.acces{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.acces{grid-template-columns:repeat(4,1fr)}}
.acces a{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;border:1px solid var(--filet);background:var(--surface);text-decoration:none;color:var(--encre);min-height:96px}
.acces a svg{width:28px;height:28px;color:var(--cuivre)}
.acces a b{font-weight:400;font-family:var(--titre);font-size:1.05rem}
.acces a small{color:var(--encre2);font-family:var(--ui);font-size:.74rem;line-height:1.3}

/* ---------- textes clés ---------- */
.texte{background:var(--surface);border:1px solid var(--filet);border-radius:16px;margin:18px 0;overflow:hidden}
.texte header{padding:14px 18px 10px;border-bottom:1px solid var(--filet)}
.texte header h3{margin:0;font-size:1.2rem}
.texte header .ref{display:block;margin-top:3px}
.texte .extrait{margin:0;padding:16px 20px;font-size:1.02rem;background:linear-gradient(180deg,var(--surface2),var(--surface));border-bottom:1px solid var(--filet);white-space:pre-line;font-style:normal;border-left:0}
.texte .extrait.vers{white-space:pre-line}
.texte .corps{padding:6px 18px 14px}
.texte .corps h4{margin:.9em 0 .2em;font-family:var(--ui);font-style:normal;font-weight:600;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cuivre)}

/* ---------- sujet ---------- */
.sujet{border:1px solid var(--filet2);border-radius:6px;background:var(--surface);padding:20px 18px;margin:16px 0;font-size:1rem}
.sujet .en-tete-bac{font-family:var(--ui);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--encre2);text-align:center;border-bottom:1px solid var(--filet);padding-bottom:10px;margin-bottom:12px}
.sujet .txt-num{counter-reset:ligne}
.sujet .q{margin:14px 0 0;padding:10px 12px;border-left:3px solid var(--cuivre);background:var(--surface2);border-radius:0 8px 8px 0}
.sujet .q b{font-family:var(--ui);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;display:block;color:var(--cuivre)}
.lignes{counter-reset:l;padding:0;margin:0;list-style:none}
.lignes li{counter-increment:l;position:relative;padding-left:34px}
.lignes li::before{content:counter(l);position:absolute;left:0;width:24px;text-align:right;font-family:var(--ui);font-size:.68rem;color:var(--encre2);top:.35em}
.lignes li:not(:nth-child(5n))::before{color:transparent}
.redige{font-size:1rem;background:var(--surface);border-left:2px solid var(--filet2);padding:4px 14px;margin:10px 0}
.plan-l{counter-reset:p;list-style:none;padding:0}
.plan-l>li{margin:12px 0;padding:10px 14px;border:1px solid var(--filet);border-radius:12px;background:var(--surface)}
.plan-l>li>b{font-family:var(--titre);font-weight:400;font-size:1.06rem}

/* ---------- copie commentée ---------- */
.copie{display:grid;grid-template-columns:1fr;gap:0;margin:14px 0}
.copie .seg{padding:10px 14px;border-left:2px solid var(--filet2);background:var(--surface)}
.copie .seg p{margin:.2em 0}
.copie .marge{font-family:var(--ui);font-size:.8rem;line-height:1.45;color:var(--rose);padding:6px 14px 12px 14px;border-left:2px solid var(--rose);margin-bottom:8px;background:transparent}
.copie .marge::before{content:"✎ ";}
@media(min-width:860px){.copie{grid-template-columns:minmax(0,1fr) 230px;column-gap:18px}.copie .marge{border-left:0;border-top:1px solid var(--rose);padding:6px 0;margin:0 0 8px;align-self:start}}

/* ---------- QCM ---------- */
.qcm{background:var(--surface);border:1px solid var(--filet);border-radius:16px;padding:16px;margin:14px 0}
.qcm .prog{display:flex;align-items:center;gap:10px;font-family:var(--ui);font-size:.78rem;color:var(--encre2)}
.qcm .barre{flex:1;height:4px;background:var(--surface2);border-radius:4px;overflow:hidden}
.qcm .barre i{display:block;height:100%;background:var(--cuivre);transition:width .3s}
.qcm .question{font-size:1.12rem;margin:14px 0 12px;font-family:var(--titre)}
.qcm .choix{display:grid;gap:8px}
.qcm .choix button{text-align:left;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--filet2);background:var(--fond);cursor:pointer;font-family:var(--serif);font-size:1rem;line-height:1.35;color:var(--encre)}
.qcm .choix button:hover:not([disabled]){border-color:var(--cuivre)}
.qcm .choix button.bon{border-color:#3f7d5a;background:color-mix(in srgb,#3f7d5a 14%,var(--fond))}
.qcm .choix button.faux{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 14%,var(--fond))}
.qcm .choix button[disabled]{cursor:default}
.qcm .expl{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--surface2);font-size:.97rem}

.score{font-family:var(--titre);font-size:2.4rem;color:var(--cuivre);margin:6px 0}

  -webkit-backface-visibility:hidden;backface-visibility:hidden;font-size:1.12rem;line-height:1.45}

.fc .verso{transform:rotateY(180deg);background:var(--surface2)}
.fc.tourne .recto{transform:rotateY(180deg)} .fc.tourne .verso{transform:rotateY(360deg)}

/* ---------- atelier ---------- */
.atelier-txt{background:var(--surface);border:1px solid var(--filet);border-radius:14px;padding:16px 18px;font-size:1.05rem;line-height:1.85;white-space:pre-line}

.calques-m .seg-a[data-m="1"]{background:var(--t-m1)} .calques-m .seg-a[data-m="2"]{background:var(--t-m2)} .calques-m .seg-a[data-m="3"]{background:var(--t-m3)}

.note-a[hidden]{display:none}
#atelier-zone{padding-bottom:40px}

.note-a h4{margin:0 0 4px;font-family:var(--ui);font-style:normal;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cuivre)}
.legende-m{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--ui);font-size:.78rem;color:var(--encre2);margin:8px 0}

.periode{position:relative;margin:26px 0 8px;font-family:var(--titre);font-size:1.22rem}
.periode::before{content:"";position:absolute;left:-22px;top:.45em;width:14px;height:14px;border-radius:50%;background:var(--fond);border:2px solid var(--cuivre)}
.periode small{display:block;font-family:var(--ui);font-size:.72rem;letter-spacing:.08em;color:var(--encre2)}
.evt{position:relative;margin:8px 0;padding:9px 12px;border-radius:12px;border:1px solid var(--filet);background:var(--surface)}
.evt::before{content:"";position:absolute;left:-19px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--cuivre)}
.evt .an{font-family:var(--ui);font-weight:700;font-size:.82rem;color:var(--cuivre);margin-right:6px}

.qui-c{background:var(--surface);border:1px solid var(--filet);border-radius:18px;padding:22px 18px;text-align:center;margin:14px 0}

.qui-c .choix button.bon{border-color:#3f7d5a;background:color-mix(in srgb,#3f7d5a 14%,var(--fond))}
.qui-c .choix button.faux{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 14%,var(--fond))}

.notion-l{display:grid;gap:10px}
.notion{background:var(--surface);border:1px solid var(--filet);border-radius:14px;padding:12px 16px}
.notion h3{margin:0 0 4px;font-size:1.12rem}
.notion .dist{font-size:.93rem;color:var(--encre2)}
.champ{width:100%;min-height:46px;border-radius:24px;border:1px solid var(--filet2);background:var(--surface);color:var(--encre);padding:8px 16px;font-family:var(--ui);font-size:16px}

/* ---------- schémas ---------- */
.schema{margin:18px 0;background:var(--surface);border:1px solid var(--filet);border-radius:16px;padding:12px}
.schema svg{display:block;width:100%;height:auto;max-width:640px;margin:0 auto}
.schema figcaption{font-family:var(--ui);font-size:.78rem;color:var(--encre2);text-align:center;margin-top:6px}
.sch-trait{fill:none;stroke:var(--filet2);stroke-width:1.5}
.sch-fort{fill:none;stroke:var(--cuivre);stroke-width:2}
.sch-txt{font-family:var(--ui);font-size:13px;fill:var(--encre)}
.sch-txt2{font-family:var(--ui);font-size:11px;fill:var(--encre2)}
.sch-tit{font-family:var(--titre);font-size:17px;fill:var(--encre)}
.sch-boite{fill:var(--surface2);stroke:var(--filet2)}

/* ---------- recherche ---------- */
.srch{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;background:color-mix(in srgb,var(--fond) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

.srch .res{flex:1;overflow-y:auto;padding:8px 16px 40px;max-width:760px;width:100%;margin:0 auto}

.srch .res a small{display:block;color:var(--encre2);font-size:.86rem;line-height:1.4}
.srch mark{background:var(--t-m3);color:inherit;border-radius:2px}

/* ---------- pied ---------- */
.pied{margin-top:50px;padding:20px 0 10px;border-top:1px solid var(--filet);font-family:var(--ui);font-size:.75rem;color:var(--encre2)}

    "L’éducation est <b>nécessaire</b> (« L’homme ne peut devenir homme que par l’éducation », Kant) mais <b>ambivalente</b> : elle peut libérer comme elle peut dresser et conformer.",
    "Avec Condorcet (1791) puis les lois Ferry (1881-1882), l’instruction devient une <b>affaire politique</b> : sans citoyens éclairés, pas de liberté réelle.",
    "S’émanciper, c’est « sortir de la minorité » (Kant, 1784) : <b>penser par soi-même</b>, ce qui suppose d’avoir reçu… et parfois de rompre avec ce qu’on a reçu.",
    "Les <b>récits d’enfance et d’apprentissage</b> (Vallès, Flaubert, Chateaubriand) montrent comment un individu devient lui-même entre héritage et révolte."

  cours: [
    { id: "e1-1", titre: "L’héritage humaniste : « une tête bien faite »", html: `
<p class="lettrine">L’entrée part d’une rupture, il faut donc savoir avec quoi l’on rompt. Les humanistes de la Renaissance ont déjà critiqué l’école de leur temps. Dans le chapitre « De l’institution des enfants » (<i>Essais</i>, I, 26, 1580), Montaigne souhaite pour l’enfant un précepteur qui ait « plutôt la tête bien faite que bien pleine » : mieux vaut former le <b>jugement</b> que gaver la mémoire. Il veut qu’on fasse « passer » les idées des livres « par l’étamine » (le tamis) du jugement de l’élève.</p>
<p>Mais l’éducation humaniste reste une éducation par les <b>textes anciens</b> : le latin, le grec, la rhétorique, l’imitation des modèles. C’est cette « culture des mots » que les Lumières vont contester.</p>
<div class="ex"><b class="l">Exemple</b>Chez Rabelais, les chapitres consacrés à l’éducation de Gargantua par Ponocrates (<i>Gargantua</i>, 1534) opposent déjà une éducation mécanique, faite de récitations, à un emploi du temps encyclopédique qui mêle lectures, observation de la nature et exercices du corps.</div>
<div class="attention"><b class="l">Attention</b>La formule de Montaigne porte sur le <i>choix du précepteur</i> (« conducteur »), pas sur l’élève lui-même. Elle est citée ici en orthographe modernisée.</div>` },
    { id: "e1-2", titre: "Rousseau : l’enfant n’est pas un adulte en petit", html: `
<p>Dans <i>Émile ou De l’éducation</i> (1762), Rousseau imagine l’éducation d’un enfant fictif par un gouverneur, de la naissance au mariage. Sa thèse centrale : l’enfance est un âge à part, avec sa propre logique. « La nature veut que les enfants soient enfants avant que d’être hommes » (livre II). Vouloir des enfants raisonneurs, c’est produire « de jeunes docteurs et de vieux enfants ».</p>
<p>D’où deux principes. D’abord l’<b>éducation négative</b> : « La première éducation doit donc être purement négative. Elle consiste, non point à enseigner la vertu ni la vérité, mais à garantir le cœur du vice et l’esprit de l’erreur » (livre II). Ensuite <b>les choses avant les mots</b> : l’enfant apprend par l’expérience et par le besoin, pas par des leçons abstraites. Le but n’est pas un métier mais l’humanité : « Vivre est le métier que je lui veux apprendre » (livre I).</p>
<div class="ex"><b class="l">Exemple</b>Au livre III, une leçon de géographie et d’astronomie se fait près de la forêt de Montmorency : Émile, qui trouvait ces observations inutiles, comprend leur intérêt quand il faut retrouver son chemin. Et le seul livre qu’il lira longtemps est <i>Robinson Crusoé</i> : un homme seul qui pourvoit à ses besoins.</div>
<div class="cle"><b class="l">Postérité</b>Ces idées nourrissent jusqu’au XX<sup>e</sup> siècle les mouvements d’« éducation nouvelle » : John Dewey (<i>Mon credo pédagogique</i>, 1897) ou Célestin Freinet (imprimerie à l’école, textes libres des élèves).</div>` },
    { id: "e1-3", titre: "Une nécessité ambivalente : éduquer, est-ce dénaturer ?", html: `
<p>L’<i>Émile</i> s’ouvre sur un paradoxe : « Tout est bien sortant des mains de l’Auteur des choses : tout dégénère entre les mains de l’homme. » L’homme « mutile », « défigure », veut tout « dresser » à sa mode. Pourtant Rousseau ajoute aussitôt : « Sans cela, tout irait plus mal encore ». Un enfant abandonné à lui-même dans la société serait « le plus défiguré de tous ». L’éducation est donc à la fois <b>un danger</b> (le conformisme) et <b>une nécessité</b> (protéger la nature de la société).</p>
<p>Kant radicalise la nécessité : « L’homme ne peut devenir homme que par l’éducation. Il n’est que ce qu’elle le fait » (<i>Traité de pédagogie</i>, publié en 1803, trad. Barni). Il distingue la <b>discipline</b>, qui arrache l’homme à la sauvagerie, et l’<b>instruction</b>, qui le cultive. Et il ajoute qu’on ne peut être éduqué que par d’autres hommes, eux-mêmes éduqués : toute éducation est une <b>transmission</b>.</p>
<div class="ex"><b class="l">Exemple</b>Rousseau compare l’enfant à un « arbrisseau que le hasard fait naître au milieu d’un chemin, et que les passants font bientôt périr » : l’éducation est une enceinte protectrice, pas un moule.</div>
<div class="plus"><b class="l">Pour aller plus loin</b>Rousseau parle ailleurs de la <i>perfectibilité</i> (<i>Discours sur l’origine de l’inégalité</i>, 1755) : l’homme se distingue de l’animal par sa capacité à se transformer, en bien comme en mal.</div>` },
    { id: "e1-4", titre: "Condorcet : instruire pour rendre les citoyens libres", html: `
<p>Pendant la Révolution, la question devient politique. Dans ses <i>Cinq mémoires sur l’instruction publique</i> (1791), Condorcet pose que « l’instruction publique est un devoir de la société à l’égard des citoyens ». Pourquoi ? Parce que l’égalité des droits resterait vaine si « l’inégalité dans les facultés morales » empêchait le plus grand nombre d’en jouir. Un homme qui dépend d’un autre faute de savoir lire ou compter n’est pas « véritablement libre ».</p>
<p>Condorcet en tire une exigence d’<b>esprit critique</b> : « Le but de l’instruction n’est pas de faire admirer aux hommes une législation toute faite, mais de les rendre capables de l’apprécier et de la corriger. » L’école ne doit pas fabriquer une « religion politique ». Il distingue l’<b>instruction</b> (transmettre des vérités et leurs preuves), qui revient à la puissance publique, et l’<b>éducation</b> morale et religieuse, qui revient aux familles.</p>
<div class="ex"><b class="l">Exemple</b>Le premier mémoire contient une section intitulée « L’instruction doit être la même pour les femmes et pour les hommes » : en 1791, c’est une position très en avance. Condorcet présente ensuite à l’Assemblée législative, en avril 1792, un rapport sur l’organisation de l’instruction publique, qui ne sera pas appliqué.</div>` },
    { id: "e1-5", titre: "L’école de la République : instruire, unir, émanciper", html: `
<p>Le XIX<sup>e</sup> siècle construit peu à peu un système d’éducation publique : loi Guizot (1833) sur les écoles primaires de garçons, loi Camille Sée (1880) sur l’enseignement secondaire des jeunes filles, puis les <b>lois Ferry</b> : gratuité de l’école primaire publique (1881), instruction obligatoire de 6 à 13 ans et laïcité de l’enseignement public (1882).</p>
<p>Dans sa <i>Lettre aux instituteurs</i> du 17 novembre 1883, Jules Ferry leur confie l’enseignement moral et leur donne une règle de prudence : avant de dire une maxime, « demandez-vous si un père de famille, je dis un seul, présent à votre classe et vous écoutant, pourrait de bonne foi refuser son assentiment à ce qu’il vous entendrait dire ». L’instituteur est « l’auxiliaire et, à certains égards, le suppléant du père de famille ».</p>
<div class="ex"><b class="l">Exemple</b>Au début du XX<sup>e</sup> siècle, le sociologue Émile Durkheim formule la fonction sociale de l’école : « l’éducation consiste en une socialisation méthodique de la jeune génération » (<i>Éducation et sociologie</i>, publié en 1922). L’école intègre à une société autant qu’elle émancipe : c’est toute la tension de l’entrée.</div>
<div class="plus"><b class="l">Pour aller plus loin</b>Au XX<sup>e</sup> siècle, la sociologie montre que l’école peut aussi reproduire les inégalités (Bourdieu et Passeron, <i>Les Héritiers</i>, 1964) : la promesse d’émancipation n’est pas toujours tenue. Le programme invite justement à réfléchir à « la justice sociale et l’équité au sein d’un système éducatif ».</div>` },
    { id: "e1-6", titre: "Kant : sortir de la minorité", html: `
<p>Dans <i>Réponse à la question : Qu’est-ce que les Lumières ?</i> (1784), Kant définit l’émancipation comme une sortie : « Les lumières sont ce qui fait sortir l’homme de la minorité qu’il doit s’imputer à lui-même. » La <b>minorité</b> est « l’incapacité où il est de se servir de son intelligence sans être dirigé par autrui ». Elle n’est pas un défaut d’intelligence mais un défaut de <b>courage</b>. D’où la devise : « <i>Sapere aude</i>, aie le courage de te servir de ta propre intelligence ! » (trad. Barni, 1853).</p>
<p>Pourquoi reste-t-on mineur ? Par « paresse » et « lâcheté » : « Il est si commode d’être mineur ! J’ai un livre qui a de l’esprit pour moi, un directeur qui a de la conscience pour moi, un médecin qui juge pour moi du régime qui me convient ». Les « tuteurs » profitent de ce confort. Kant ajoute qu’un individu seul s’en sort difficilement, mais qu’un <b>public</b> peut s’éclairer lui-même s’il a la liberté de faire un « usage public » de sa raison.</p>
<div class="ex"><b class="l">Exemple</b>Kant distingue l’usage <i>privé</i> de la raison (l’officier qui reçoit un ordre doit obéir dans son service) et son usage <i>public</i> (le même homme, comme savant, peut écrire pour critiquer l’organisation de l’armée). L’émancipation passe par la liberté d’écrire et de publier.</div>` },
    { id: "e1-7", titre: "Raconter son éducation : le récit d’enfance et la rupture", html: `
<p>Le programme le souligne : le rôle nouveau de l’école se marque par la place des <b>souvenirs d’écoliers</b> dans les récits du XIX<sup>e</sup> siècle. Ces récits cherchent à comprendre ce qu’un individu est devenu à partir de ce qu’il a reçu, mais aussi de ce avec quoi il a rompu.</p>
<p>Jules Vallès en donne l’exemple le plus violent. <i>L’Enfant</i> (1878), premier volet de la trilogie de Jacques Vingtras (avec <i>Le Bachelier</i>, 1881, et <i>L’Insurgé</i>, 1886), raconte une enfance battue et un collège ennuyeux, vus à hauteur d’enfant et avec une ironie mordante. La trilogie mène de l’enfant humilié à l’insurgé de la Commune de 1871 : la révolte politique prolonge la révolte contre l’éducation reçue.</p>
<div class="ex"><b class="l">Exemple</b>La dédicace : « À tous ceux qui crevèrent d’ennui au collège ou qu’on fit pleurer dans la famille, qui, pendant leur enfance, furent tyrannisés par leurs maîtres ou rossés par leurs parents, je dédie ce livre. »</div>
<div class="cle"><b class="l">D’autres souvenirs d’école</b>Chateaubriand, <i>Mémoires d’outre-tombe</i>, livres I à V (enfance à Combourg et collèges) ; Colette, <i>Claudine à l’école</i> (1900), école de village racontée avec insolence ; Renan, <i>Souvenirs d’enfance et de jeunesse</i> (1883). Pour aller plus loin, au XX<sup>e</sup> siècle : Annie Ernaux, <i>La Place</i> (1983), sur la distance que les études créent avec un père ouvrier puis commerçant.</div>` },
    { id: "e1-8", titre: "Le roman d’apprentissage, ou l’éducation par la vie", html: `
<p>Le <b>roman d’apprentissage</b> (en allemand <i>Bildungsroman</i>, « roman de formation ») suit un jeune héros qui se forme au contact du monde. Le modèle est Goethe, <i>Les Années d’apprentissage de Wilhelm Meister</i> (1795-1796). En France, Stendhal (<i>Le Rouge et le Noir</i>, 1830) montre Julien Sorel, fils de charpentier, qui se forme par les livres et l’ambition, et Balzac multiplie les jeunes provinciaux qui « montent » à Paris.</p>
<p>Flaubert retourne le modèle : <i>L’Éducation sentimentale</i> (1869) est l’histoire d’un apprentissage <b>raté</b>. Frédéric Moreau rencontre Mme Arnoux (« Ce fut comme une apparition »), traverse la révolution de 1848, et ne devient rien. À la fin, avec son ami Deslauriers, il évoque une visite manquée à une maison close, quand ils étaient adolescents : « C’est là ce que nous avons eu de meilleur ! »</p>
<div class="ex"><b class="l">Exemple</b>Le titre de Flaubert est ironique : l’« éducation » ne mène à aucune sagesse. Cela permet, dans une copie, de nuancer l’idée que l’expérience forme toujours.</div>` },
    { id: "e1-9", titre: "Transmettre ou rompre ? Les débats du XX<sup>e</sup> siècle", html: `
<p>Faut-il transmettre un héritage ou laisser chacun s’inventer ? Nietzsche attaque dès 1872 l’enseignement de son temps (<i>Sur l’avenir de nos établissements d’enseignement</i>) et fait du devenir soi une tâche : « Tu dois devenir celui que tu es » (<i>Le Gai Savoir</i>, § 270, 1882, trad. H. Albert). L’éducation devient alors <b>formation de soi</b>, parfois contre les institutions.</p>
<p>Simone de Beauvoir montre que l’éducation fabrique aussi des rôles : « On ne naît pas femme : on le devient » (<i>Le Deuxième Sexe</i>, t. II, 1949). L’émancipation suppose de prendre conscience de ce qu’on a reçu comme une évidence. À l’inverse, Hannah Arendt (« La crise de l’éducation », dans <i>La Crise de la culture</i>, 1961) soutient que l’école doit rester <b>conservatrice</b> au sens où elle transmet un monde ancien, pour protéger ce que chaque enfant apporte de nouveau : on ne peut renouveler que ce qu’on a reçu.</p>
<div class="ex"><b class="l">Exemple</b>Arendt critique l’idée d’une éducation qui préparerait directement les enfants à changer le monde selon les projets des adultes : ce serait leur voler leur propre nouveauté. (Résumé de la thèse, l’ouvrage étant protégé.)</div>
<div class="cle"><b class="l">Pour la copie</b>Cette idée permet de dépasser l’opposition « transmettre / émanciper » : la transmission est la condition de l’émancipation, à condition de donner à l’élève les moyens de juger ce qu’il reçoit (Condorcet).</div>` }
  ],

    { id: "t1-1", auteur: "Montaigne", oeuvre: "Essais, I, 26, « De l’institution des enfants »", ref: "1580 (texte de 1595), orthographe modernisée",
      extrait: "Je voudrais aussi qu’on fût soigneux de lui choisir un conducteur qui eût plutôt la tête bien faite que bien pleine, et qu’on y requît tous les deux, mais plus les mœurs et l’entendement que la science.",
      contexte: "Montaigne s’adresse à Diane de Foix, comtesse de Gurson, qui attend un enfant. Le chapitre critique les « pédants » qui farcissent la mémoire sans former le jugement.",
      analyse: "<p>La phrase repose sur une <b>antithèse</b> devenue proverbiale (« bien faite » / « bien pleine ») : deux images de la tête, l’une architecturale, l’autre comme un récipient. Le comparatif « plutôt… que » ne rejette pas le savoir, il le hiérarchise ; la fin de phrase le confirme (« tous les deux, mais plus… »).</p>",
      enjeu: "<p>Former le <b>jugement</b> plutôt qu’accumuler : c’est l’idéal d’une éducation qui rend autonome. Mais ce jugement passe encore par les livres anciens : les Lumières iront plus loin en privilégiant l’expérience des choses.</p>",
      liens: "Rousseau reprend l’idée en la radicalisant (<i>Émile</i>) ; Condorcet : former des citoyens capables de juger la loi." },
    { id: "t1-2", auteur: "Rousseau", oeuvre: "Émile ou De l’éducation, livre I", ref: "1762, éd. de 1782, orthographe modernisée",
      extrait: "Tout est bien, sortant des mains de l’Auteur des choses : tout dégénère entre les mains de l’homme. […] On façonne les plantes par la culture, et les hommes par l’éducation.",
      contexte: "Ouverture du traité. Rousseau a déjà publié le <i>Discours sur l’origine de l’inégalité</i> (1755) ; l’<i>Émile</i> est condamné et brûlé à Paris et à Genève en 1762, notamment pour la « Profession de foi du vicaire savoyard » du livre IV.",
      analyse: "<p>La première phrase est construite en <b>chiasme</b> et en antithèse (« bien » / « dégénère », « mains de l’Auteur » / « mains de l’homme ») : elle oppose deux créateurs. L’accumulation de verbes violents qui suit (« il mutile », « il bouleverse tout, il défigure tout ») fait de l’homme un faiseur de monstres. La <b>métaphore végétale</b> (« arbrisseau », « culture ») organise tout le passage : éduquer, c’est cultiver, pas fabriquer.</p>",
      enjeu: "<p>Nature contre culture ? Pas exactement : Rousseau reconnaît que, dans l’état social, l’éducation est indispensable. La question devient : <b>quelle</b> éducation respecte la nature au lieu de la déformer ?</p>",
      liens: "Kant (« L’homme ne peut devenir homme que par l’éducation ») ; Vallès, qui montre une éducation qui « défigure » ; Montessori et Freinet au XX<sup>e</sup> siècle." },
    { id: "t1-3", auteur: "Kant", oeuvre: "Réponse à la question : Qu’est-ce que les Lumières ?", ref: "1784, trad. Jules Barni (1853)",
      extrait: "Les lumières sont ce qui fait sortir l’homme de la minorité qu’il doit s’imputer à lui-même. La minorité consiste dans l’incapacité où il est de se servir de son intelligence sans être dirigé par autrui. […] Sapere aude, aie le courage de te servir de ta propre intelligence ! voilà donc la devise des lumières.",
      contexte: "Article publié en décembre 1784 dans la <i>Berlinische Monatsschrift</i>, en réponse à une question posée dans la même revue. Kant écrit sous Frédéric II de Prusse, roi réputé tolérant en matière de pensée.",
      analyse: "<p>Le texte procède par <b>définitions</b> enchaînées (lumières → minorité → faute imputable), puis par une <b>devise</b> latine traduite à l’impératif. Le tutoiement de la devise transforme la définition en appel : chaque lecteur est sommé de penser. La suite emploie l’<b>ironie</b> (« Il est si commode d’être mineur ! »).</p>",
      enjeu: "<p>L’émancipation n’est pas donnée par un maître : elle est un <b>acte</b> du sujet. Mais elle a des conditions politiques (la liberté de publier). D’où la tension de l’entrée : on ne peut pas forcer quelqu’un à être libre, mais on peut lui en donner les moyens.</p>",
      liens: "Condorcet (l’instruction comme condition de la liberté) ; Nietzsche (« devenir celui que tu es ») ; Beauvoir (sortir des rôles appris)." },
    { id: "t1-4", auteur: "Condorcet", oeuvre: "Cinq mémoires sur l’instruction publique, premier mémoire", ref: "1791, Œuvres, éd. Didot, 1847",
      extrait: "Le but de l’instruction n’est pas de faire admirer aux hommes une législation toute faite, mais de les rendre capables de l’apprécier et de la corriger. Il ne s’agit pas de soumettre chaque génération aux opinions comme à la volonté de celle qui la précède, mais de les éclairer de plus en plus, afin que chacune devienne de plus en plus digne de se gouverner par sa propre raison.",
      contexte: "Condorcet, mathématicien et philosophe, député à l’Assemblée législative, écrit ces mémoires en 1791. Proscrit pendant la Terreur, il meurt en prison en 1794 après avoir rédigé l’<i>Esquisse d’un tableau historique des progrès de l’esprit humain</i>.",
      analyse: "<p>Deux phrases construites sur le même moule <b>« ne… pas… mais »</b> : le texte réfute une conception (l’admiration, la soumission) pour en imposer une autre (le jugement, la raison). La répétition de « de plus en plus » fait entendre l’idée de <b>progrès</b> indéfini.</p>",
      enjeu: "<p>Une école démocratique ne transmet pas des dogmes, même républicains : elle transmet les moyens de les critiquer. Transmettre et émanciper ne s’opposent donc pas.</p>",
      liens: "Kant (usage public de la raison) ; Ferry (prudence de l’enseignement moral) ; Arendt (transmettre l’ancien pour protéger le nouveau)." },
    { id: "t1-5", auteur: "Jules Ferry", oeuvre: "Lettre aux instituteurs", ref: "17 novembre 1883",
      extrait: "Demandez-vous si un père de famille, je dis un seul, présent à votre classe et vous écoutant, pourrait de bonne foi refuser son assentiment à ce qu’il vous entendrait dire. Si oui, abstenez-vous de le dire ; sinon, parlez hardiment",
      contexte: "Ministre de l’Instruction publique, Ferry écrit aux instituteurs après la loi du 28 mars 1882, qui remplace l’instruction religieuse par l’« instruction morale et civique » à l’école primaire publique.",
      analyse: "<p>Le texte est une <b>règle pratique</b> à l’impératif. L’incise « je dis un seul » durcit le critère : il suffit d’un désaccord pour se taire. La construction en alternative (« Si oui… sinon… ») donne une méthode simple, presque juridique.</p>",
      enjeu: "<p>Comment transmettre une morale commune sans heurter la liberté de conscience ? La laïcité scolaire est une limite que l’école se donne à elle-même.</p>",
      liens: "Condorcet (instruction publique / éducation familiale) ; Durkheim (l’éducation comme socialisation)." },
    { id: "t1-6", auteur: "Jules Vallès", oeuvre: "L’Enfant, dédicace", ref: "1878 (éd. Charpentier, 1889)",
      extrait: "À tous ceux\nqui crevèrent d’ennui au collège\nou\nqu’on fit pleurer dans la famille\nqui, pendant leur enfance,\nfurent tyrannisés par leurs maîtres\nou\nrossés par leurs parents\nJe dédie ce livre.",
      contexte: "Vallès, journaliste et membre de la Commune de Paris (1871), écrit la trilogie de Jacques Vingtras en exil à Londres. <i>L’Enfant</i> paraît d’abord en feuilleton en 1878, sous pseudonyme.",
      analyse: "<p>La dédicace, disposée comme une <b>inscription</b>, s’adresse à une communauté de victimes. Le parallélisme (collège / famille, maîtres / parents) met l’école et la famille sur le même plan. Le <b>registre familier</b> (« crevèrent », « rossés ») tranche avec la solennité de la forme : c’est déjà de la révolte.</p>",
      enjeu: "<p>L’éducation peut être une <b>violence</b>. Mais écrire ce récit, c’est retourner l’éducation reçue contre elle-même : l’enfant humilié devient l’écrivain qui juge.</p>",
      liens: "Rousseau (l’éducation qui « défigure ») ; Colette, <i>Claudine à l’école</i> ; au XX<sup>e</sup> siècle, Ernaux, <i>La Place</i>." }

(function () {
  var e = HLP.ENTREES[HLP.ENTREES.length - 1];
  e.sujet.q1.intro = `<p>« On façonne les plantes par la culture, et les hommes par l’éducation » : la formule qui clôt cet extrait de l’ouverture d’<i>Émile ou De l’éducation</i> (1762) semble faire de l’éducation une simple technique, comparable au jardinage. Pourtant, quelques lignes plus haut, Rousseau dénonçait l’homme qui veut tout « dresser » et « contourner à sa mode », comme on traite un cheval ou un arbre. Le texte pose ainsi un problème : comment l’éducation, qui ressemble à la manière dont l’homme défigure la nature, peut-elle être aussi ce qui la sauve ? Rousseau soutient que, dans une société corrompue, l’éducation est indispensable pour protéger la nature en l’homme, à condition de cultiver au lieu de dresser. Nous verrons d’abord le réquisitoire contre l’homme qui dénature tout (l. 1-7), puis le retournement par lequel l’éducation devient une nécessité (l. 8-14), avant de dégager la conception de l’éducation comme culture qui en résulte (l. 15).</p>`;
  e.sujet.q1.plan = [
    ["I. Une menace : l’homme qui « défigure tout » (l. 1-7)", `<ul class="puces"><li>L’antithèse initiale oppose deux « mains » : celles de l’« Auteur des choses » (bien) et celles de l’homme (dégénérescence). L’homme est un créateur rival qui défait l’ordre naturel.</li><li>L’énumération des violences (forcer, mêler, mutiler, bouleverser, défigurer) va de la terre à l’animal puis à l’« esclave » : la domination de la nature se prolonge en domination de l’homme par l’homme.</li><li>Sommet : « pas même l’homme ». L’éducation ordinaire est un <b>dressage</b> (« cheval de manège ») et une mise en forme arbitraire (« à sa mode ») : elle sert le désir du maître, pas l’être de l’enfant. La menace, c’est le <b>conformisme</b>.</li></ul>` ],
    ["II. Une nécessité : « Sans cela, tout irait plus mal encore » (l. 8-14)", `<ul class="puces"><li>Le connecteur marque un retournement : refuser toute éducation serait pire. L’argument est <b>historique</b> : « dans l’état où sont désormais les choses ». On ne revient pas à l’état de nature.</li><li>La société n’est pas neutre : préjugés, autorité, exemple « étoufferaient » la nature. Un enfant sans éducation ne serait pas libre, il serait façonné par le hasard des influences : « le plus défiguré de tous ».</li><li>L’image de l’arbrisseau au milieu du chemin montre que l’absence d’éducation n’est pas la liberté mais l’exposition. L’éducation devient une <b>protection</b>.</li></ul>` ],
    ["III. Cultiver plutôt que dresser : une autre idée de l’éducation (l. 15)", `<ul class="puces"><li>La métaphore végétale change de sens : le jardinier du premier paragraphe « contournait » l’arbre ; la « culture » accompagne une croissance qui vient de la plante elle-même.</li><li>D’où le projet de l’<i>Émile</i> : une éducation « négative » qui garantit l’enfant « du vice » et « de l’erreur » plutôt que de lui imposer des leçons (livre II).</li><li>Limite et prolongement : cette culture reste dirigée par un gouverneur. Kant dira que « l’homme ne peut devenir homme que par l’éducation » : la question n’est plus « faut-il éduquer ? » mais « comment éduquer sans asservir ? ».</li></ul>` ]
  ];
  e.sujet.q1.concl = `<p>L’éducation est une menace lorsqu’elle prolonge la volonté de l’homme de tout plier à sa mode ; elle est une nécessité parce que, dans la société telle qu’elle est, l’enfant laissé à lui-même serait livré aux préjugés. Rousseau ne choisit donc pas entre nature et culture : il cherche une culture qui respecte la nature. Ce paradoxe fonde toute la pédagogie moderne, des « méthodes actives » aux débats sur l’autorité du maître : la question qu’il pose — comment former sans déformer ? — reste celle de toute école.</p>`;
  e.sujet.q2.intro = `<p>« À tous ceux qui crevèrent d’ennui au collège ou qu’on fit pleurer dans la famille […] je dédie ce livre » : en ouvrant <i>L’Enfant</i> (1878) par cette dédicace, Jules Vallès place son récit sous le signe de la révolte contre l’éducation reçue. Beaucoup de récits d’enfance et d’apprentissage semblent ainsi raconter une libération : on deviendrait soi-même en rompant avec sa famille, son école, son milieu. Devenir soi-même, c’est pourtant un processus, et ce processus a des matériaux : une langue, des livres, des modèles, qui sont eux aussi des héritages. La littérature montre-t-elle vraiment que l’on se construit contre son éducation, ou bien que la rupture elle-même est le produit de ce que l’on a reçu ? Nous verrons que les récits de formation mettent en scène la révolte, puis que cette révolte doit beaucoup à l’éducation qu’elle combat, avant de montrer que l’écriture elle-même est la manière la plus juste de devenir soi avec et contre son éducation.</p>`;
  e.sujet.q2.plan = [
    ["I. La littérature raconte des ruptures : on devient soi contre ce qu’on a reçu", `<ul class="puces"><li>Vallès, <i>L’Enfant</i> (1878) : la famille et le collège humilient ; la trilogie mène Jacques Vingtras jusqu’à la Commune (<i>L’Insurgé</i>, 1886). La révolte politique prolonge la révolte contre l’éducation.</li><li>Rimbaud, lettre à Paul Demeny (15 mai 1871) : la poésie nouvelle commence par la liquidation des modèles scolaires (« Après Racine, le jeu moisit »).</li><li>Le héros romanesque s’invente contre son milieu : Julien Sorel, fils de charpentier, dans <i>Le Rouge et le Noir</i> (1830).</li></ul>` ],
    ["II. Mais la révolte doit beaucoup à l’éducation qu’elle combat", `<ul class="puces"><li>Julien Sorel se forme par les livres (le <i>Mémorial de Sainte-Hélène</i>) et par le latin que lui apprend le curé : son ambition est nourrie de ce qu’il a reçu.</li><li>Rimbaud est un élève brillant, nourri de vers latins : son « dérèglement » est « raisonné ». On rompt avec ce qu’on connaît.</li><li>Flaubert, <i>L’Éducation sentimentale</i> (1869) : Frédéric Moreau, nourri de rêves romantiques, ne devient rien. La rupture ne suffit pas à faire un soi : sans forme, la liberté tourne à vide.</li></ul>` ],
    ["III. Écrire son éducation : devenir soi en la reprenant", `<ul class="puces"><li>Le récit d’enfance est un regard d’adulte sur l’enfant : en racontant, l’écrivain ne rejette pas son passé, il le <b>transforme</b> en œuvre (Chateaubriand, <i>Mémoires d’outre-tombe</i>, livres I à V).</li><li>Rousseau, <i>Confessions</i> (1782) : la fessée de Mlle Lambercier ou l’épisode du peigne cassé montrent comment l’enfance forme les penchants de l’homme ; se connaître, c’est comprendre ce qu’on a reçu.</li><li>Ouverture contemporaine : Annie Ernaux, <i>La Place</i> (1983), écrit avec la culture acquise à l’école pour rendre justice au monde qu’elle a quitté. Devenir soi, c’est tenir ensemble l’héritage et l’écart.</li></ul>` ]
  ];
  e.sujet.q2.concl = `<p>La littérature montre bien des ruptures : on ne devient pas soi-même en reproduisant docilement ce que l’on a reçu. Mais elle montre aussi que ces ruptures se font avec les armes de l’éducation, la langue, les livres, l’ambition, et qu’une révolte sans forme peut tourner à vide. Le récit d’enfance accomplit ce mouvement : il juge l’éducation reçue tout en la transformant en œuvre. On ne devient donc pas soi « contre » son éducation, mais en la reprenant pour son propre compte, ce qui rejoint le souhait de Kant : penser par soi-même, après avoir appris à penser.</p>`;
  e.retenir = `
<section><h3>Définitions</h3><ul class="puces"><li><b>Instruction</b> : transmission de savoirs et de leurs preuves. <b>Éducation</b> : formation de la personne entière.</li><li><b>Minorité</b> (Kant) : incapacité de penser sans être dirigé, par paresse et lâcheté. <b>Émancipation</b> : sortie d’une tutelle.</li><li><b>Éducation négative</b> (Rousseau) : protéger l’enfant du vice et de l’erreur plutôt que lui enseigner la vertu.</li><li><b>Bildungsroman</b> : roman d’apprentissage (Goethe ; version ironique chez Flaubert).</li></ul></section>
<section><h3>Thèses et auteurs</h3><ul class="puces"><li><b>Montaigne</b> (1580) : une « tête bien faite » plutôt que « bien pleine ».</li><li><b>Rousseau</b> (1762) : l’enfance a sa logique ; les choses avant les mots ; l’éducation menace et protège.</li><li><b>Kant</b> (1784) : « <i>Sapere aude</i> » ; (1803) « L’homme ne peut devenir homme que par l’éducation ».</li><li><b>Condorcet</b> (1791) : l’instruction publique rend l’égalité réelle ; former des citoyens capables de corriger la loi.</li><li><b>Ferry</b> (1881-1883) : école gratuite, obligatoire, laïque ; la règle du « père de famille ».</li><li><b>Vallès</b> (1878) : l’éducation comme violence ; récit de la révolte.</li><li><b>Flaubert</b> (1869) : l’éducation qui ne forme rien.</li><li><b>Beauvoir</b> (1949) : « On ne naît pas femme : on le devient ».</li><li><b>Arendt</b> (1961) : transmettre l’ancien pour protéger le nouveau.</li></ul></section>
<section><h3>Le problème en une phrase</h3><p>L’éducation est la condition de la liberté (on ne pense pas seul sans avoir appris) et sa menace (elle peut dresser) : l’émancipation consiste à <b>reprendre pour son compte</b> ce que l’on a reçu.</p></section>

    { id: "e2-1", titre: "Les « droits de la sensibilité » au XVIII<sup>e</sup> siècle", html: `
<p class="lettrine">Le mot <b>sensibilité</b> a plusieurs sens qu’il faut savoir distinguer : la capacité de recevoir des sensations (sens physique), de s’émouvoir (sens affectif), de juger du beau (sens esthétique) et de compatir à la souffrance d’autrui (sens moral). Au XVIII<sup>e</sup> siècle, ces sens se rejoignent : le cœur devient un organe de connaissance et de moralité.</p>
<p>Rousseau fait de la <b>pitié</b> un sentiment naturel antérieur à la raison (<i>Discours sur l’origine de l’inégalité</i>, 1755). Son roman par lettres <i>Julie ou la Nouvelle Héloïse</i> (1761) est un immense succès de librairie : les lecteurs pleurent et écrivent à l’auteur. Goethe, avec <i>Les Souffrances du jeune Werther</i> (1774), donne à l’Europe un héros que la passion conduit au suicide.</p>
<div class="ex"><b class="l">Exemple</b>Condorcet veut qu’on exerce « l’âme des enfants » à « la pitié pour l’homme et pour les animaux » : habituer un enfant à voir souffrir les animaux avec indifférence détruirait « le germe de la sensibilité naturelle, premier principe actif de toute moralité » (<i>Cinq mémoires sur l’instruction publique</i>, 1791 ; texte tombé au bac en 2025).</div>
<div class="cle"><b class="l">Un contrepoint</b>Diderot, dans le <i>Paradoxe sur le comédien</i> (écrit dans les années 1770, publié en 1830), soutient que le grand acteur n’éprouve pas ce qu’il joue : c’est la maîtrise, non la sensibilité, qui émeut le public. Utile pour nuancer.</div>` },
    { id: "e2-2", titre: "Rousseau : le sentiment de l’existence", html: `
<p>Dans la cinquième des <i>Rêveries du promeneur solitaire</i> (écrites de 1776 à 1778, publiées en 1782), Rousseau se souvient de son séjour sur l’île de Saint-Pierre, sur le lac de Bienne, en 1765. Au bord de l’eau, le bruit des vagues « suffisaient pour me faire sentir avec plaisir mon existence sans prendre la peine de penser ».</p>
<p>Il décrit un état où le présent « dure toujours sans néanmoins marquer sa durée », sans désir ni crainte : « De quoi jouit-on dans une pareille situation ? De rien d’extérieur à soi, de rien sinon de soi-même et de sa propre existence ». C’est une découverte philosophique : avant toute pensée, il y a un <b>sentir</b> de soi, et ce sentir peut suffire au bonheur.</p>
<div class="ex"><b class="l">Exemple</b>Le rythme de la phrase imite le mouvement de l’eau : longues périodes, rythme binaire (« le flux et reflux »), mots du bercement (« uniformité du mouvement continu qui me berçait »). Le style fait éprouver ce qu’il décrit : voir l’Atelier de lecture et le sujet type bac.</div>` },
    { id: "e2-3", titre: "Le lyrisme romantique : l’âme et la nature", html: `
<p>Le <b>lyrisme</b> est l’expression des sentiments personnels d’un « je » (le mot vient de la lyre d’Orphée). Le romantisme français s’ouvre en poésie avec les <i>Méditations poétiques</i> de Lamartine (1820). Dans « Le Lac », le poète revient seul au bord d’un lac où il a aimé une femme, et la nature devient <b>témoin</b> et <b>mémoire</b> du bonheur perdu.</p>
<p>Le célèbre vers « Ô temps ! suspends ton vol » est placé dans la bouche de la femme aimée, ce qui crée une polyphonie : le poème cite une voix absente. À la fin, le poète demande à la nature de garder le souvenir : « Tout dise : Ils ont aimé ! » Hugo théorise ce lyrisme dans la préface des <i>Contemplations</i> (1856), « les Mémoires d’une âme » : « Hélas ! quand je vous parle de moi, je vous parle de vous ».</p>
<div class="ex"><b class="l">Exemple</b>Musset, « La Nuit de mai » (1835), fait dire à la Muse : « Les plus désespérés sont les chants les plus beaux, / Et j’en sais d’immortels qui sont de purs sanglots. » La douleur devient la source de la beauté.</div>
<div class="attention"><b class="l">Attention</b>Dans l’édition originale de 1820, la strophe commence par « Ô temps ! suspends ton vol ; et vous, heures propices ». Beaucoup d’éditions modernes ponctuent autrement : cite sans inventer de ponctuation.</div>` },
    { id: "e2-4", titre: "Le « mal du siècle »", html: `
<p>Le <b>mal du siècle</b> désigne la mélancolie d’une génération née avec la Révolution et l’Empire : ennui, sentiment d’inutilité, désirs sans objet. Chateaubriand en fixe la figure avec <i>René</i> (1802) : un jeune homme qui erre et appelle la tempête pour être emporté. « Levez-vous vite, orages désirés qui devez emporter René dans les espaces d’une autre vie ! »</p>
<p>Musset en donne l’analyse historique dans <i>La Confession d’un enfant du siècle</i> (1836) : « Toute la maladie du siècle présent vient de deux causes ; le peuple qui a passé par 93 et par 1814 porte au cœur deux blessures. Tout ce qui était n’est plus ; tout ce qui sera n’est pas encore. » La sensibilité individuelle est donc aussi un <b>symptôme historique</b>.</p>
<div class="ex"><b class="l">Exemple</b>Dans <i>René</i>, la nature d’automne (oiseaux de passage, vent, landes) n’est pas décrite pour elle-même : elle est l’image de l’âme inquiète. C’est le procédé du <b>paysage état d’âme</b>.</div>` },
    { id: "e2-5", titre: "Baudelaire : correspondances, spleen et modernité", html: `
<p>Avec <i>Les Fleurs du mal</i> (1857, condamné la même année pour six poèmes), Baudelaire transforme la sensibilité romantique. Dans « Correspondances », « La Nature est un temple » où l’homme passe « à travers des forêts de symboles » ; « Les parfums, les couleurs et les sons se répondent ». Ces <b>synesthésies</b> (« doux comme les hautbois, verts comme les prairies ») relient les sens entre eux et le visible à l’invisible.</p>
<p>Baudelaire invente aussi une sensibilité de la <b>ville</b> et du présent. Dans <i>Le Peintre de la vie moderne</i> (1863), il définit la modernité : « La modernité, c’est le transitoire, le fugitif, le contingent, la moitié de l’art, dont l’autre moitié est l’éternel et l’immuable. » Le <b>spleen</b>, enfin, est un ennui oppressant, qui succède au mal du siècle.</p>
<div class="ex"><b class="l">Exemple</b>Rimbaud pousse plus loin : « Le poète se fait voyant par un long, immense et raisonné dérèglement de tous les sens » (lettre à Paul Demeny, 15 mai 1871). Le dérèglement est « raisonné » : c’est une méthode, pas un abandon.</div>` },
    { id: "e2-6", titre: "Le roman et la vie intérieure : de Flaubert au flux de conscience", html: `
<p>Le roman du XIX<sup>e</sup> siècle cherche à rendre la vie intérieure des personnages. Flaubert perfectionne le <b>discours indirect libre</b> : les pensées d’un personnage passent dans la voix du narrateur sans « il pensait que ». Dans <i>Madame Bovary</i> (1857), on suit Emma de l’intérieur, et l’on voit que sa sensibilité a été <b>façonnée par ses lectures</b> romanesques au couvent : elle cherche dans la vie les émotions des livres.</p>
<p>Dans <i>L’Éducation sentimentale</i> (1869), la première vision de Mme Arnoux est donnée par une phrase isolée : « Ce fut comme une apparition : ». La comparaison et les deux-points mettent le lecteur dans l’éblouissement de Frédéric. Plus tard, le <b>monologue intérieur</b> et le « flux de conscience » (Édouard Dujardin, <i>Les Lauriers sont coupés</i>, 1887 ; Virginia Woolf, <i>Les Vagues</i>, 1931) tentent de saisir les pensées « telles qu’elles surviennent ».</p>
<div class="plus"><b class="l">Pour aller plus loin</b>Le mot « bovarysme » (Jules de Gaultier, 1892) désigne la tendance à se concevoir autre qu’on n’est, sous l’influence des modèles. Utile pour un sujet sur l’éducation de la sensibilité par la littérature.</div>` },
    { id: "e2-7", titre: "Proust : la mémoire involontaire et la vérité du style", html: `
<p>Dans <i>Du côté de chez Swann</i> (1913), un morceau de madeleine trempé dans le thé provoque chez le narrateur une joie inexplicable : « cette essence n’était pas en moi, elle était moi ». Puis « tout d’un coup le souvenir m’est apparu » : Combray, la tante Léonie. C’est la <b>mémoire involontaire</b> : une sensation présente fait revivre un passé que la mémoire volontaire ne retrouvait pas.</p>
<p>Dans <i>Le Temps retrouvé</i> (1927), Proust en tire une théorie de l’art : le style « est une question non de technique, mais de vision ». Seul l’art peut nous faire partager une sensibilité singulière : « Par l’art seulement, nous pouvons sortir de nous, savoir ce que voit un autre de cet univers qui n’est pas le même que le nôtre ».</p>
<div class="ex"><b class="l">Exemple</b>Proust répond ainsi à la question du programme sur le langage commun : les mots de tous, travaillés par un style, peuvent transmettre ce qui resterait sinon « le secret éternel de chacun ».</div>
<div class="attention"><b class="l">Attention</b>La phrase qu’on cite souvent (« La vraie vie […] c’est la littérature ») n’a pas la même forme selon les éditions du <i>Temps retrouvé</i>. Préfère les passages cités ici, vérifiés sur l’édition de 1927.</div>` },
    { id: "e2-8", titre: "Penser la sensibilité : goût, sublime, durée", html: `
<p>Les philosophes s’emparent de l’expérience esthétique. Kant, dans la <i>Critique de la faculté de juger</i> (1790), distingue l’<b>agréable</b> (ce qui plaît aux sens, chacun son goût) et le <b>beau</b>, qui plaît « sans concept » mais avec une prétention à l’accord de tous. Il distingue aussi le beau, harmonieux, et le <b>sublime</b>, qui naît devant ce qui nous dépasse (l’océan déchaîné, les montagnes). Burke avait déjà opposé le beau et le sublime en 1757.</p>
<p>Bergson, dans l’<i>Essai sur les données immédiates de la conscience</i> (1889), décrit la <b>durée</b> vécue : « La durée toute pure est la forme que prend la succession de nos états de conscience quand notre moi se laisse vivre ». Nos états intérieurs se fondent les uns dans les autres, comme les notes d’une mélodie, au lieu de se juxtaposer comme des objets dans l’espace.</p>
<div class="ex"><b class="l">Exemple</b>Le tableau de Caspar David Friedrich, <i>Le Voyageur contemplant une mer de nuages</i> (vers 1818), est souvent cité comme image du sublime romantique : un homme de dos face à l’immensité.</div>` },
    { id: "e2-9", titre: "Dire l’intime avec les mots de tous", html: `
<p>Le programme pose une question décisive : « lorsque nous communiquons les uns avec les autres, comment faisons-nous pour donner le même sens aux mots que nous employons ? » Bergson montre le danger : « le mot aux contours bien arrêtés, le mot brutal, qui emmagasine ce qu’il y a de stable, de commun et par conséquent d’impersonnel dans les impressions de l’humanité, écrase ou tout au moins recouvre les impressions délicates et fugitives de notre conscience individuelle ».</p>
<p>Trois réponses sont possibles. 1) Le <b>silence</b> ou l’ineffable : certaines expériences ne se disent pas. 2) Le <b>travail du style</b> : l’écrivain invente des images et des rythmes pour suggérer ce que le mot ordinaire écrase (Baudelaire, Proust). 3) La réponse de Wittgenstein (<i>Recherches philosophiques</i>, 1953) : la signification d’un mot dépend de son <b>usage public</b> ; un langage strictement privé, que personne d’autre ne pourrait comprendre, est impossible. Nos sentiments ne sont donc pas enfermés : nous apprenons à les nommer avec les autres.</p>
<div class="ex"><b class="l">Exemple</b>Bergson donne l’exemple d’un mets « réputé exquis » : son nom, « gros de l’approbation qu’on lui donne », s’interpose entre la sensation et la conscience, au point qu’on croit aimer une saveur qu’on n’aime pas.</div>` }

(function () {
  var e = HLP.ENTREES[HLP.ENTREES.length - 1];
  e.sujet.q1.intro = `<p>Dans la cinquième de ses <i>Rêveries du promeneur solitaire</i>, publiées après sa mort en 1782, Rousseau évoque les soirées passées au bord du lac de Bienne, quand il séjournait sur l’île de Saint-Pierre. Le passage décrit une expérience singulière : une rêverie où le bruit et le mouvement de l’eau suffisent à faire « sentir avec plaisir » à l’auteur son « existence sans prendre la peine de penser ». Or cet état est fait d’absence de pensée, et il faut pourtant des mots, des phrases, une construction pour le transmettre. Comment l’écriture parvient-elle à faire éprouver au lecteur ce qui se passe en deçà de la pensée ? Nous verrons d’abord comment Rousseau compose un décor qui apaise et absorbe les sens, puis comment le rythme même de la phrase imite le bercement de l’eau, avant de montrer que cette expérience sensible débouche sur une vérité presque métaphysique : se suffire à soi-même.</p>`;
  e.sujet.q1.plan = [
    ["I. Un décor qui capte les sens et apaise l’âme (l. 1-5)", `<ul class="puces"><li>Le cadre : l’heure du soir, la descente (« je descendais des cimes ») et le refuge (« quelque asile caché ») : une retraite hors du monde. L’imparfait d’habitude (« approchait », « allais ») fait de la scène un rituel.</li><li>Le paradoxe : « l’agitation de l’eau » chasse « toute autre agitation ». La répétition du mot fait comprendre qu’une agitation régulière remplace l’agitation intérieure : c’est une <b>substitution</b>.</li><li>La perte de la conscience du temps : « la nuit me surprenait souvent sans que je m’en fusse aperçu ». Le lecteur entre dans un temps sans repères.</li></ul>` ],
    ["II. Une phrase qui berce : faire sentir par le rythme (l. 5-13)", `<ul class="puces"><li>Rythmes binaires et sonorités : « le flux et reflux », « son bruit continu mais renflé par intervalles », allitérations en [r] et en [f] qui imitent le ressac. La syntaxe ample, faiblement ponctuée, retarde le verbe principal (« suppléaient », « suffisaient ») comme une vague qui monte.</li><li>Le cœur de la phrase : « me faire sentir avec plaisir mon existence sans prendre la peine de penser ». Le sujet grammatical n’est plus « je » mais l’eau : le moi devient passif, il se laisse faire.</li><li>La pensée affleure puis s’efface : « quelque faible et courte réflexion » sur « l’instabilité des choses » disparaît dans « l’uniformité du mouvement continu qui me berçait ». Le verbe « bercer » fait du promeneur un enfant ; le lecteur suit la même pente.</li></ul>` ],
    ["III. De la sensation à la vérité : « on se suffit à soi-même, comme Dieu » (l. 14-16)", `<ul class="puces"><li>Changement de registre : le récit au passé devient réflexion au présent de vérité générale, avec le pronom « on ». L’expérience personnelle prend valeur universelle.</li><li>La question rhétorique et la réponse par soustraction (« De rien […] de rien sinon ») isolent le pur sentiment d’exister. La comparaison « comme Dieu » est audacieuse : la plénitude est atteinte sans rien posséder.</li><li>Mais l’effort final (« je ne pouvais m’arracher de là sans effort ») et la restriction « tant que cet état dure » rappellent la fragilité de ce bonheur : l’écriture le fixe parce qu’il ne dure pas.</li></ul>` ]
  ];
  e.sujet.q1.concl = `<p>Rousseau ne se contente pas de décrire un état : il le fait éprouver, en composant un décor de retraite, en donnant à sa phrase le mouvement même de l’eau qui berce, puis en tirant de cette expérience une vérité générale sur le bonheur de se sentir exister. Le paradoxe n’est qu’apparent : il faut beaucoup d’art pour écrire ce qui se passe « sans prendre la peine de penser ». Cette page annonce le lyrisme romantique, de Lamartine au bord du lac du Bourget jusqu’à Proust, chez qui une sensation ordinaire ouvre aussi sur une « essence » qui « était moi ».</p>`;
  e.sujet.q2.intro = `<p>« Le flux et reflux de cette eau […] suffisaient pour me faire sentir avec plaisir mon existence sans prendre la peine de penser » : dans la cinquième <i>Rêverie</i>, Rousseau décrit un bonheur parfait, qui naît justement quand la pensée se tait. Nous associons pourtant volontiers la pensée à la dignité humaine, et le bonheur à une vie réussie, donc réfléchie. Si le bonheur est une satisfaction durable et complète, et si penser c’est réfléchir, comparer, se représenter le passé et l’avenir, alors la pensée semble l’ennemie du bonheur : elle inquiète, elle juge, elle prévoit la fin. Mais un bonheur que l’on ne pense pas est-il encore un bonheur, c’est-à-dire l’état conscient d’un être qui sait qu’il est heureux ? Le problème est donc de savoir si la pensée est un obstacle au bonheur ou sa condition. Nous verrons d’abord que la pensée semble empêcher d’être heureux, puis qu’un bonheur sans pensée ne serait pas un bonheur humain, avant de chercher quelle pensée rend possible le bonheur.</p>`;
  e.sujet.q2.plan = [
    ["I. La pensée, obstacle au bonheur", `<ul class="puces"><li>La pensée nous arrache au présent : Pascal montre que nous ne nous tenons jamais au temps présent, que nous pensons au passé et à l’avenir, si bien que nous ne vivons jamais (<i>Pensées</i>). Rousseau, au contraire, décrit un présent qui « dure toujours ».</li><li>La conscience fait souffrir : savoir qu’on va mourir, se comparer aux autres. Le mal du siècle (Musset, <i>La Confession d’un enfant du siècle</i>, 1836) est une maladie de la réflexion.</li><li>D’où l’idéal du <b>sentiment de l’existence</b> : un bonheur « suffisant, parfait et plein » sans désir ni crainte (texte).</li></ul>` ],
    ["II. Mais un bonheur sans pensée serait-il un bonheur humain ?", `<ul class="puces"><li>L’état décrit est fragile (« tant que cet état dure ») et réservé à quelques-uns ; Rousseau reconnaît lui-même qu’il pourrait détourner de « la vie active ». Un bonheur qui exige l’absence du monde est-il durable ?</li><li>Sans conscience, pas de différence entre bonheur et simple bien-être : on peut dire qu’une pierre ou un animal repu est content, pas heureux. Le bonheur suppose de se savoir heureux, voire de pouvoir le dire.</li><li>Kant montre que le bonheur est un idéal de l’imagination plutôt que de la raison : personne ne peut dire avec certitude ce qui le rendrait heureux (<i>Fondements de la métaphysique des mœurs</i>, 1785). La morale ne promet pas le bonheur ; elle nous rend <b>dignes</b> d’être heureux.</li></ul>` ],
    ["III. Penser autrement pour être heureux", `<ul class="puces"><li>La pensée qui nuit au bonheur est l’inquiétude et le calcul ; une autre pensée le rend possible : Épicure distingue les désirs naturels et nécessaires des désirs vains (<i>Lettre à Ménécée</i>) pour atteindre l’ataraxie, absence de trouble. C’est par la réflexion qu’on se délivre des faux maux.</li><li>Le texte lui-même le montre : l’instant vécu sans penser n’existe pour nous que parce que Rousseau le pense et l’écrit ensuite. La rêverie est un bonheur ; l’écriture en fait une sagesse.</li><li>Bergson : la durée vécue n’est pas l’absence de pensée mais une pensée qui « se laisse vivre » au lieu de tout découper. Être heureux, ce serait penser sans se séparer de ce qu’on vit.</li></ul>` ]
  ];
  e.sujet.q2.concl = `<p>La pensée semble l’ennemie du bonheur, quand elle se fait inquiétude, comparaison ou prévoyance, et Rousseau décrit une plénitude qui naît de son silence. Mais un bonheur que personne ne penserait ne serait plus le bonheur d’un homme : il faut se savoir heureux, et c’est la réflexion qui nous délivre des désirs et des peurs inutiles. On ne peut donc pas être heureux sans penser, mais on peut l’être en pensant autrement : non plus en se projetant hors du présent, mais en le reconnaissant. La littérature, qui transforme l’instant vécu en page, est peut-être la forme la plus haute de cette pensée heureuse.</p>`;
