    { id: "e2-1", titre: "Les « droits de la sensibilité » au XVIII<sup>e</sup> siècle", html: `
<p class="lettrine">Le mot <b>sensibilité</b> a plusieurs sens qu’il faut savoir distinguer : la capacité de recevoir des sensations (sens physique), de s’émouvoir (sens affectif), de juger du beau (sens esthétique) et de compatir à la souffrance d’autrui (sens moral). Au XVIII<sup>e</sup> siècle, ces sens se rejoignent : le cœur devient un organe de connaissance et de moralité.</p>
<p>Rousseau fait de la <b>pitié</b> un sentiment naturel antérieur à la raison (<i>Discours sur l’origine de l’inégalité</i>, 1755). Son roman par lettres <i>Julie ou la Nouvelle Héloïse</i> (1761) est un immense succès de librairie : les lecteurs pleurent et écrivent à l’auteur. Goethe, avec <i>Les Souffrances du jeune Werther</i> (1774), donne à l’Europe un héros que la passion conduit au suicide.</p>
<div class="ex"><b class="l">Exemple</b>Condorcet veut qu’on exerce « l’âme des enfants » à « la pitié pour l’homme et pour les animaux » : habituer un enfant à voir souffrir les animaux avec indifférence détruirait « le germe de la sensibilité naturelle, premier principe actif de toute moralité » (<i>Cinq mémoires sur l’instruction publique</i>, 1791 ; texte tombé au bac en 2025).</div>
<div class="cle"><b class="l">Un contrepoint</b>Diderot, dans le <i>Paradoxe sur le comédien</i> (écrit dans les années 1770, publié en 1830), soutient que le grand acteur n’éprouve pas ce qu’il joue : c’est la maîtrise, non la sensibilité, qui émeut le public. Utile pour nuancer.</div>` },
    { id: "e2-2", titre: "Rousseau : le sentiment de l’existence", html: `
<p>Dans la cinquième des <i>Rêveries du promeneur solitaire</i> (écrites de 1776 à 1778, publiées en 1782), Rousseau se souvient de son séjour sur l’île de Saint-Pierre, sur le lac de Bienne, en 1765. Au bord de l’eau, le bruit des vagues « suffisaient pour me faire sentir avec plaisir mon existence sans prendre la peine de penser ».</p>
<p>Il décrit un état où le présent « dure toujours sans néanmoins marquer sa durée », sans désir ni crainte : « De quoi jouit-on dans une pareille situation ? De rien d’extérieur à soi, de rien sinon de soi-même et de sa propre existence ». C’est une découverte philosophique : avant toute pensée, il y a un <b>sentir</b> de soi, et ce sentir peut suffire au bonheur.</p>
<div class="ex"><b class="l">Exemple</b>Le rythme de la phrase imite le mouvement de l’eau : longues périodes, rythme binaire (« le flux et reflux »), mots du bercement (« uniformité du mouvement continu qui me berçait »). Le style fait éprouver ce qu’il décrit : voir l’Atelier de lecture et le sujet type bac.</div>` },
    { id: "e2-3", titre: "Le lyrisme romantique : l’âme et la nature", html: `
<p>Le <b>lyrisme</b> est l’expression des sentiments personnels d’un « je » (le mot vient de la lyre d’Orphée). Le romantisme français s’ouvre en poésie avec les <i>Méditations poétiques</i> de Lamartine (1820). Dans « Le Lac », le poète revient seul au bord d’un lac où il a aimé une femme, et la nature devient <b>témoin</b> et <b>mémoire</b> du bonheur perdu.</p>
<p>Le célèbre vers « Ô temps ! suspends ton vol » est placé dans la bouche de la femme aimée, ce qui crée une polyphonie : le poème cite une voix absente. À la fin, le poète demande à la nature de garder le souvenir : « Tout dise : Ils ont aimé ! » Hugo théorise ce lyrisme dans la préface des <i>Contemplations</i> (1856), « les Mémoires d’une âme » : « Hélas ! quand je vous parle de moi, je vous parle de vous ».</p>
<div class="ex"><b class="l">Exemple</b>Musset, « La Nuit de mai » (1835), fait dire à la Muse : « Les plus désespérés sont les chants les plus beaux, / Et j’en sais d’immortels qui sont de purs sanglots. » La douleur devient la source de la beauté.</div>
<div class="attention"><b class="l">Attention</b>Dans l’édition originale de 1820, la strophe commence par « Ô temps ! suspends ton vol ; et vous, heures propices ». Beaucoup d’éditions modernes ponctuent autrement : cite sans inventer de ponctuation.</div>
<div data-anim="e2-lac-lecture"></div>` },
    { id: "e2-4", titre: "Le « mal du siècle »", html: `
<p>Le <b>mal du siècle</b> désigne la mélancolie d’une génération née avec la Révolution et l’Empire : ennui, sentiment d’inutilité, désirs sans objet. Chateaubriand en fixe la figure avec <i>René</i> (1802) : un jeune homme qui erre et appelle la tempête pour être emporté. « Levez-vous vite, orages désirés qui devez emporter René dans les espaces d’une autre vie ! »</p>
<p>Musset en donne l’analyse historique dans <i>La Confession d’un enfant du siècle</i> (1836) : « Toute la maladie du siècle présent vient de deux causes ; le peuple qui a passé par 93 et par 1814 porte au cœur deux blessures. Tout ce qui était n’est plus ; tout ce qui sera n’est pas encore. » La sensibilité individuelle est donc aussi un <b>symptôme historique</b>.</p>
<div class="ex"><b class="l">Exemple</b>Dans <i>René</i>, la nature d’automne (oiseaux de passage, vent, landes) n’est pas décrite pour elle-même : elle est l’image de l’âme inquiète. C’est le procédé du <b>paysage état d’âme</b>.</div>` },
    { id: "e2-5", titre: "Baudelaire : correspondances, spleen et modernité", html: `
<p>Avec <i>Les Fleurs du mal</i> (1857, condamné la même année pour six poèmes), Baudelaire transforme la sensibilité romantique. Dans « Correspondances », « La Nature est un temple » où l’homme passe « à travers des forêts de symboles » ; « Les parfums, les couleurs et les sons se répondent ». Ces <b>synesthésies</b> (« doux comme les hautbois, verts comme les prairies ») relient les sens entre eux et le visible à l’invisible.</p>
<p>Baudelaire invente aussi une sensibilité de la <b>ville</b> et du présent. Dans <i>Le Peintre de la vie moderne</i> (1863), il définit la modernité : « La modernité, c’est le transitoire, le fugitif, le contingent, la moitié de l’art, dont l’autre moitié est l’éternel et l’immuable. » Le <b>spleen</b>, enfin, est un ennui oppressant, qui succède au mal du siècle.</p>
<div class="ex"><b class="l">Exemple</b>Rimbaud pousse plus loin : « Le poète se fait voyant par un long, immense et raisonné dérèglement de tous les sens » (lettre à Paul Demeny, 15 mai 1871). Le dérèglement est « raisonné » : c’est une méthode, pas un abandon.</div>` },
    { id: "e2-6", titre: "Le roman et la vie intérieure : de Flaubert au flux de conscience", html: `
<p>Le roman du XIX<sup>e</sup> siècle cherche à rendre la vie intérieure des personnages. Flaubert perfectionne le <b>discours indirect libre</b> : les pensées d’un personnage passent dans la voix du narrateur sans « il pensait que ». Dans <i>Madame Bovary</i> (1857), on suit Emma de l’intérieur, et l’on voit que sa sensibilité a été <b>façonnée par ses lectures</b> romanesques au couvent : elle cherche dans la vie les émotions des livres.</p>
<p>Dans <i>L’Éducation sentimentale</i> (1869), la première vision de Mme Arnoux est donnée par une phrase isolée : « Ce fut comme une apparition : ». La comparaison et les deux-points mettent le lecteur dans l’éblouissement de Frédéric. Plus tard, le <b>monologue intérieur</b> et le « flux de conscience » (Édouard Dujardin, <i>Les Lauriers sont coupés</i>, 1887 ; Virginia Woolf, <i>Les Vagues</i>, 1931) tentent de saisir les pensées « telles qu’elles surviennent ».</p>
<div class="plus"><b class="l">Pour aller plus loin</b>Le mot « bovarysme » (Jules de Gaultier, 1892) désigne la tendance à se concevoir autre qu’on n’est, sous l’influence des modèles. Utile pour un sujet sur l’éducation de la sensibilité par la littérature.</div>` },
    { id: "e2-7", titre: "Proust : la mémoire involontaire et la vérité du style", html: `
<p>Dans <i>Du côté de chez Swann</i> (1913), un morceau de madeleine trempé dans le thé provoque chez le narrateur une joie inexplicable : « cette essence n’était pas en moi, elle était moi ». Puis « tout d’un coup le souvenir m’est apparu » : Combray, la tante Léonie. C’est la <b>mémoire involontaire</b> : une sensation présente fait revivre un passé que la mémoire volontaire ne retrouvait pas.</p>
<p>Dans <i>Le Temps retrouvé</i> (1927), Proust en tire une théorie de l’art : le style « est une question non de technique, mais de vision ». Seul l’art peut nous faire partager une sensibilité singulière : « Par l’art seulement, nous pouvons sortir de nous, savoir ce que voit un autre de cet univers qui n’est pas le même que le nôtre ».</p>
<div class="ex"><b class="l">Exemple</b>Proust répond ainsi à la question du programme sur le langage commun : les mots de tous, travaillés par un style, peuvent transmettre ce qui resterait sinon « le secret éternel de chacun ».</div>
<div class="attention"><b class="l">Attention</b>La phrase qu’on cite souvent (« La vraie vie […] c’est la littérature ») n’a pas la même forme selon les éditions du <i>Temps retrouvé</i>. Préfère les passages cités ici, vérifiés sur l’édition de 1927.</div>
<div data-anim="e2-madeleine"></div>` },
    { id: "e2-8", titre: "Penser la sensibilité : goût, sublime, durée", html: `
<p>Les philosophes s’emparent de l’expérience esthétique. Kant, dans la <i>Critique de la faculté de juger</i> (1790), distingue l’<b>agréable</b> (ce qui plaît aux sens, chacun son goût) et le <b>beau</b>, qui plaît « sans concept » mais avec une prétention à l’accord de tous. Il distingue aussi le beau, harmonieux, et le <b>sublime</b>, qui naît devant ce qui nous dépasse (l’océan déchaîné, les montagnes). Burke avait déjà opposé le beau et le sublime en 1757.</p>
<p>Bergson, dans l’<i>Essai sur les données immédiates de la conscience</i> (1889), décrit la <b>durée</b> vécue : « La durée toute pure est la forme que prend la succession de nos états de conscience quand notre moi se laisse vivre ». Nos états intérieurs se fondent les uns dans les autres, comme les notes d’une mélodie, au lieu de se juxtaposer comme des objets dans l’espace.</p>
<div class="ex"><b class="l">Exemple</b>Le tableau de Caspar David Friedrich, <i>Le Voyageur contemplant une mer de nuages</i> (vers 1818), est souvent cité comme image du sublime romantique : un homme de dos face à l’immensité.</div>` },
    { id: "e2-9", titre: "Dire l’intime avec les mots de tous", html: `
<p>Le programme pose une question décisive : « lorsque nous communiquons les uns avec les autres, comment faisons-nous pour donner le même sens aux mots que nous employons ? » Bergson montre le danger : « le mot aux contours bien arrêtés, le mot brutal, qui emmagasine ce qu’il y a de stable, de commun et par conséquent d’impersonnel dans les impressions de l’humanité, écrase ou tout au moins recouvre les impressions délicates et fugitives de notre conscience individuelle ».</p>
<p>Trois réponses sont possibles. 1) Le <b>silence</b> ou l’ineffable : certaines expériences ne se disent pas. 2) Le <b>travail du style</b> : l’écrivain invente des images et des rythmes pour suggérer ce que le mot ordinaire écrase (Baudelaire, Proust). 3) La réponse de Wittgenstein (<i>Recherches philosophiques</i>, 1953) : la signification d’un mot dépend de son <b>usage public</b> ; un langage strictement privé, que personne d’autre ne pourrait comprendre, est impossible. Nos sentiments ne sont donc pas enfermés : nous apprenons à les nommer avec les autres.</p>
<div class="ex"><b class="l">Exemple</b>Bergson donne l’exemple d’un mets « réputé exquis » : son nom, « gros de l’approbation qu’on lui donne », s’interpose entre la sensation et la conscience, au point qu’on croit aimer une saveur qu’on n’aime pas.</div>
<div data-anim="e2-dire"></div>` }

    { id: "t2-1", auteur: "Rousseau", oeuvre: "Les Rêveries du promeneur solitaire, cinquième promenade", ref: "rédigées en 1776-1778, publiées en 1782",
      extrait: "De quoi jouit-on dans une pareille situation ? De rien d’extérieur à soi, de rien sinon de soi-même et de sa propre existence, tant que cet état dure on se suffit à soi-même, comme Dieu.",
      contexte: "À la fin de sa vie, persécuté ou se croyant tel, Rousseau écrit dix promenades (la dixième reste inachevée). La cinquième revient sur les semaines passées en 1765 à l’île de Saint-Pierre, sur le lac de Bienne, en Suisse.",
      analyse: "<p>Une <b>question rhétorique</b> suivie d’une réponse par la négative (« De rien… de rien sinon ») : la jouissance se définit par soustraction. La comparaison finale « comme Dieu » est audacieuse : la créature se suffit, comme le créateur.</p>",
      enjeu: "<p>Le bonheur peut-il être un simple sentir, sans action ni pensée ? Rousseau ajoute lui-même qu’un tel état ne conviendrait pas à tous : il pourrait détourner de « la vie active ».</p>",
      liens: "Lamartine, « Le Lac » (la nature et le temps) ; Bergson (la durée) ; Proust (l’essence qui « était moi »)." },
    { id: "t2-2", auteur: "Lamartine", oeuvre: "Méditations poétiques, « Le Lac »", ref: "1820, édition originale", vers: true,
      extrait: "« Ô temps ! suspends ton vol ; et vous, heures propices\n« Suspendez votre cours :\n« Laissez-nous savourer les rapides délices\n« Des plus beaux de nos jours ! »",
      contexte: "Le poème est lié au souvenir de Julie Charles, rencontrée en 1816 au lac du Bourget, et morte en décembre 1817. Le titre original est « Le Lac de B*** ».",
      analyse: "<p>L’<b>apostrophe</b> au temps le personnifie et l’<b>impératif</b> exprime un désir impossible. L’alternance d’alexandrins et d’hexasyllabes donne un rythme de vague, ample puis bref. L’oxymore discret « rapides délices » dit tout le drame : le bonheur est menacé par sa vitesse même.</p>",
      enjeu: "<p>La sensibilité romantique est d’abord une conscience aiguë du <b>temps</b>. La poésie tente de fixer ce qui passe : « L’homme n’a point de port, le temps n’a point de rive ».</p>",
      liens: "Ronsard (« Cueillez dès aujourd’hui les roses de la vie ») ; Hugo, « Tristesse d’Olympio » (1840), autre retour sur les lieux de l’amour." },
    { id: "t2-3", auteur: "Musset", oeuvre: "La Confession d’un enfant du siècle, première partie, chapitre II", ref: "1836",
      extrait: "Toute la maladie du siècle présent vient de deux causes ; le peuple qui a passé par 93 et par 1814 porte au cœur deux blessures. Tout ce qui était n’est plus ; tout ce qui sera n’est pas encore. Ne cherchez pas ailleurs le secret de nos maux.",
      contexte: "Roman en partie autobiographique (la liaison de Musset avec George Sand). Le chapitre II est un tableau historique de la jeunesse née sous l’Empire. « 93 » renvoie à la Terreur, « 1814 » à la chute de Napoléon.",
      analyse: "<p>Un vocabulaire <b>médical</b> (« maladie », « blessures ») pour une réalité historique. Le <b>parallélisme</b> et le <b>chiasme</b> temporel (« Tout ce qui était n’est plus ; tout ce qui sera n’est pas encore ») enferment la génération entre deux vides.</p>",
      enjeu: "<p>La sensibilité n’est pas seulement individuelle : elle porte la marque d’une époque. Une souffrance intime peut avoir des causes collectives.</p>",
      liens: "Chateaubriand, <i>René</i> ; Baudelaire et le spleen ; programme de l’entrée « Les métamorphoses du moi »." },
    { id: "t2-4", auteur: "Baudelaire", oeuvre: "Les Fleurs du mal, « Correspondances »", ref: "1857 (texte de l’édition de 1861)", vers: true,
      extrait: "La Nature est un temple où de vivants piliers\nLaissent parfois sortir de confuses paroles ;\nL’homme y passe à travers des forêts de symboles\nQui l’observent avec des regards familiers.",
      contexte: "Quatrième poème de la section « Spleen et Idéal ». Baudelaire s’inspire notamment de la pensée de Swedenborg sur les correspondances entre monde visible et monde spirituel.",
      analyse: "<p>Une <b>métaphore filée</b> (temple, piliers, paroles) fait de la nature un lieu sacré qui parle. Le renversement est frappant : ce sont les symboles qui « observent » l’homme. Le sonnet passe ensuite des correspondances verticales (nature / esprit) aux <b>synesthésies</b> horizontales (parfums, couleurs, sons).</p>",
      enjeu: "<p>Sentir, c’est déchiffrer : la sensibilité poétique devient une forme de connaissance. Le poète est l’interprète d’un sens caché.</p>",
      liens: "Rimbaud, « Voyelles » (1871-1872) et la lettre du voyant ; Proust et la sensation qui ouvre sur le passé." },
    { id: "t2-5", auteur: "Proust", oeuvre: "Du côté de chez Swann, « Combray »", ref: "1913",
      extrait: "Un plaisir délicieux m’avait envahi, isolé, sans la notion de sa cause. […] ou plutôt cette essence n’était pas en moi, elle était moi. J’avais cessé de me sentir médiocre, contingent, mortel.",
      contexte: "Le narrateur adulte, un jour d’hiver, accepte un peu de thé et une madeleine. L’épisode précède la résurrection de Combray, le village de son enfance.",
      analyse: "<p>Le passage décrit une <b>enquête</b> : questions (« D’où avait pu me venir cette puissante joie ? »), gorgées successives qui donnent « de moins en moins ». L’<b>épanorthose</b> (« ou plutôt… ») corrige la pensée en train de se faire. Le rythme ternaire « médiocre, contingent, mortel » dit l’arrachement à la condition ordinaire.</p>",
      enjeu: "<p>La sensation la plus banale peut révéler une vérité sur le temps et sur le moi. La connaissance de soi passe par la sensibilité, pas seulement par la raison.</p>",
      liens: "Chateaubriand, la grive de Montboissier (<i>Mémoires d’outre-tombe</i>, livre III) ; Rousseau et le sentiment de l’existence ; Bergson." },
    { id: "t2-6", auteur: "Bergson", oeuvre: "Essai sur les données immédiates de la conscience, chapitre II", ref: "1889",
      extrait: "Bref, le mot aux contours bien arrêtés, le mot brutal, qui emmagasine ce qu’il y a de stable, de commun et par conséquent d’impersonnel dans les impressions de l’humanité, écrase ou tout au moins recouvre les impressions délicates et fugitives de notre conscience individuelle.",
      contexte: "Première grande œuvre de Bergson (sa thèse de doctorat). Il y oppose le temps mesuré des sciences et la durée vécue de la conscience.",
      analyse: "<p>La phrase est longue et <b>accumule</b> les qualifications du mot (« bien arrêtés », « brutal », « stable », « commun », « impersonnel ») face aux impressions « délicates et fugitives » : l’<b>antithèse</b> oppose deux régimes, solide et fluide. Le correctif « ou tout au moins » montre la précision du philosophe.</p>",
      enjeu: "<p>Le langage, fait pour la vie sociale, trahit la vie intérieure. D’où la tâche de l’art : retrouver sous les mots communs la nuance singulière.</p>",
      liens: "Proust (le style comme vision) ; Wittgenstein (contre l’idée d’un langage privé) ; Flaubert et la recherche du mot juste." }

(function () {
  var e = HLP.ENTREES[HLP.ENTREES.length - 1];
  e.sujet.q1.intro = `<p>Dans la cinquième de ses <i>Rêveries du promeneur solitaire</i>, publiées après sa mort en 1782, Rousseau évoque les soirées passées au bord du lac de Bienne, quand il séjournait sur l’île de Saint-Pierre. Le passage décrit une expérience singulière : une rêverie où le bruit et le mouvement de l’eau suffisent à faire « sentir avec plaisir » à l’auteur son « existence sans prendre la peine de penser ». Or cet état est fait d’absence de pensée, et il faut pourtant des mots, des phrases, une construction pour le transmettre. Comment l’écriture parvient-elle à faire éprouver au lecteur ce qui se passe en deçà de la pensée ? Nous verrons d’abord comment Rousseau compose un décor qui apaise et absorbe les sens, puis comment le rythme même de la phrase imite le bercement de l’eau, avant de montrer que cette expérience sensible débouche sur une vérité presque métaphysique : se suffire à soi-même.</p>`;
  e.sujet.q1.plan = [
    ["I. Un décor qui capte les sens et apaise l’âme (l. 1-5)", `<ul class="puces"><li>Le cadre : l’heure du soir, la descente (« je descendais des cimes ») et le refuge (« quelque asile caché ») : une retraite hors du monde. L’imparfait d’habitude (« approchait », « allais ») fait de la scène un rituel.</li><li>Le paradoxe : « l’agitation de l’eau » chasse « toute autre agitation ». La répétition du mot fait comprendre qu’une agitation régulière remplace l’agitation intérieure : c’est une <b>substitution</b>.</li><li>La perte de la conscience du temps : « la nuit me surprenait souvent sans que je m’en fusse aperçu ». Le lecteur entre dans un temps sans repères.</li></ul>` ],
    ["II. Une phrase qui berce : faire sentir par le rythme (l. 5-13)", `<ul class="puces"><li>Rythmes binaires et sonorités : « le flux et reflux », « son bruit continu mais renflé par intervalles », allitérations en [r] et en [f] qui imitent le ressac. La syntaxe ample, faiblement ponctuée, retarde le verbe principal (« suppléaient », « suffisaient ») comme une vague qui monte.</li><li>Le cœur de la phrase : « me faire sentir avec plaisir mon existence sans prendre la peine de penser ». Le sujet grammatical n’est plus « je » mais l’eau : le moi devient passif, il se laisse faire.</li><li>La pensée affleure puis s’efface : « quelque faible et courte réflexion » sur « l’instabilité des choses » disparaît dans « l’uniformité du mouvement continu qui me berçait ». Le verbe « bercer » fait du promeneur un enfant ; le lecteur suit la même pente.</li></ul>` ],
    ["III. De la sensation à la vérité : « on se suffit à soi-même, comme Dieu » (l. 14-16)", `<ul class="puces"><li>Changement de registre : le récit au passé devient réflexion au présent de vérité générale, avec le pronom « on ». L’expérience personnelle prend valeur universelle.</li><li>La question rhétorique et la réponse par soustraction (« De rien […] de rien sinon ») isolent le pur sentiment d’exister. La comparaison « comme Dieu » est audacieuse : la plénitude est atteinte sans rien posséder.</li><li>Mais l’effort final (« je ne pouvais m’arracher de là sans effort ») et la restriction « tant que cet état dure » rappellent la fragilité de ce bonheur : l’écriture le fixe parce qu’il ne dure pas.</li></ul>` ]

  e.sujet.q1.concl = `<p>Rousseau ne se contente pas de décrire un état : il le fait éprouver, en composant un décor de retraite, en donnant à sa phrase le mouvement même de l’eau qui berce, puis en tirant de cette expérience une vérité générale sur le bonheur de se sentir exister. Le paradoxe n’est qu’apparent : il faut beaucoup d’art pour écrire ce qui se passe « sans prendre la peine de penser ». Cette page annonce le lyrisme romantique, de Lamartine au bord du lac du Bourget jusqu’à Proust, chez qui une sensation ordinaire ouvre aussi sur une « essence » qui « était moi ».</p>`;
  e.sujet.q2.intro = `<p>« Le flux et reflux de cette eau […] suffisaient pour me faire sentir avec plaisir mon existence sans prendre la peine de penser » : dans la cinquième <i>Rêverie</i>, Rousseau décrit un bonheur parfait, qui naît justement quand la pensée se tait. Nous associons pourtant volontiers la pensée à la dignité humaine, et le bonheur à une vie réussie, donc réfléchie. Si le bonheur est une satisfaction durable et complète, et si penser c’est réfléchir, comparer, se représenter le passé et l’avenir, alors la pensée semble l’ennemie du bonheur : elle inquiète, elle juge, elle prévoit la fin. Mais un bonheur que l’on ne pense pas est-il encore un bonheur, c’est-à-dire l’état conscient d’un être qui sait qu’il est heureux ? Le problème est donc de savoir si la pensée est un obstacle au bonheur ou sa condition. Nous verrons d’abord que la pensée semble empêcher d’être heureux, puis qu’un bonheur sans pensée ne serait pas un bonheur humain, avant de chercher quelle pensée rend possible le bonheur.</p>`;

    ["III. Penser autrement pour être heureux", `<ul class="puces"><li>La pensée qui nuit au bonheur est l’inquiétude et le calcul ; une autre pensée le rend possible : Épicure distingue les désirs naturels et nécessaires des désirs vains (<i>Lettre à Ménécée</i>) pour atteindre l’ataraxie, absence de trouble. C’est par la réflexion qu’on se délivre des faux maux.</li><li>Le texte lui-même le montre : l’instant vécu sans penser n’existe pour nous que parce que Rousseau le pense et l’écrit ensuite. La rêverie est un bonheur ; l’écriture en fait une sagesse.</li><li>Bergson : la durée vécue n’est pas l’absence de pensée mais une pensée qui « se laisse vivre » au lieu de tout découper. Être heureux, ce serait penser sans se séparer de ce qu’on vit.</li></ul>` ]

  e.sujet.q2.concl = `<p>La pensée semble l’ennemie du bonheur, quand elle se fait inquiétude, comparaison ou prévoyance, et Rousseau décrit une plénitude qui naît de son silence. Mais un bonheur que personne ne penserait ne serait plus le bonheur d’un homme : il faut se savoir heureux, et c’est la réflexion qui nous délivre des désirs et des peurs inutiles. On ne peut donc pas être heureux sans penser, mais on peut l’être en pensant autrement : non plus en se projetant hors du présent, mais en le reconnaissant. La littérature, qui transforme l’instant vécu en page, est peut-être la forme la plus haute de cette pensée heureuse.</p>`;

  cours: [
    { id: "e3-1", titre: "Qu’appelle-t-on le « moi » ?", html: `
<p class="lettrine">Il faut distinguer des mots voisins. Le <b>moi</b> désigne l’ensemble de ce que je suis pour moi-même : mon caractère, mes souvenirs, mes désirs. Le <b>sujet</b> est celui qui pense, perçoit, agit (le « je » de la phrase). La <b>personne</b> est le moi en tant qu’être moral et juridique, responsable. L’<b>individu</b>, enfin, est l’être singulier, indivisible, distinct des autres. Le mot latin <i>persona</i> désignait le masque de l’acteur : la personne a d’abord été un rôle.</p>
<p>La question n’est pas neuve. Le programme cite saint Augustin : « Je suis devenu pour moi-même une énigme » (<i>Confessions</i>, IV, 4, vers 400). Pascal écrit « Le moi est haïssable » (<i>Pensées</i>, publiées en 1670) : le moi se fait le centre de tout. Il demande aussi « Qu’est-ce que le moi ? » : si l’on m’aime pour ma beauté ou mon jugement, qu’on peut perdre, aime-t-on vraiment « moi » ?</p>
<div class="ex"><b class="l">Exemple</b>L’argument de Pascal : un homme à la fenêtre qui regarde les passants ne s’y est pas mis pour me voir ; celui qui aime quelqu’un pour sa beauté cessera de l’aimer quand la petite vérole l’aura défiguré. On n’aime jamais que des qualités : le moi lui-même échappe.</div>` },
    { id: "e3-2", titre: "Montaigne et Descartes : le moi qui change, le moi qui pense", html: `
<p>Montaigne invente l’<b>autoportrait</b> littéraire. Dès l’avis « Au lecteur » des <i>Essais</i> (1580), il annonce : « je suis moi-même la matière de mon livre ». Mais ce moi est mouvant : « Je ne peins pas l’être. Je peins le passage » (<i>Essais</i>, III, 2, « Du repentir »). Le monde est une « branloire pérenne » (une balançoire perpétuelle) et le moi aussi : il se contredit, et l’écriture doit suivre ses variations « de jour en jour, de minute en minute ».</p>
<p>Descartes cherche au contraire un point fixe. Dans le <i>Discours de la méthode</i> (1637), après avoir douté de tout, il trouve une certitude : « Je pense, donc je suis ». Dans la deuxième des <i>Méditations métaphysiques</i> (1641), il précise : « Je suis, j’existe, cela est certain ; mais combien de temps ? autant de temps que je pense », et définit le moi comme « une chose qui pense ». Le moi est une <b>substance</b>, connue par la conscience avant le corps.</p>
<div class="ex"><b class="l">Exemple</b>Pour Descartes, l’esprit se connaît plus facilement que le corps : le morceau de cire de la deuxième Méditation change de forme, d’odeur et de couleur près du feu, mais c’est l’esprit seul qui le reconnaît comme le même.</div>
<div class="plus"><b class="l">Pour aller plus loin</b>David Hume (<i>Traité de la nature humaine</i>, 1739) répond qu’en regardant en lui il ne trouve jamais un « moi », seulement des perceptions particulières (chaud, froid, plaisir…) : le moi serait un « faisceau » de perceptions qui se succèdent. Locke (1694) avait déjà fondé l’identité personnelle sur la conscience et la mémoire.</div>` },
    { id: "e3-3", titre: "Rousseau : se montrer « dans toute la vérité de la nature »", html: `
<p>Les <i>Confessions</i> (livres I à VI publiés en 1782, livres VII à XII en 1789) s’ouvrent sur un défi : « Je forme une entreprise qui n’eut jamais d’exemple, et dont l’exécution n’aura point d’imitateur. Je veux montrer à mes semblables un homme dans toute la vérité de la nature, et cet homme, ce sera moi. » Puis : « Moi seul. […] Si je ne vaux pas mieux, au moins je suis autre. »</p>
<p>Rousseau fonde l’<b>autobiographie</b> moderne sur deux idées : la <b>singularité</b> (la nature a « brisé le moule » après l’avoir fait) et la <b>sincérité</b> (« J’ai dit le bien et le mal avec la même franchise »). Mais il avoue aussi les limites de sa mémoire : il a pu employer « quelque ornement indifférent » pour « remplir un vide ». La sincérité n’est pas la vérité : on peut être sincère et se tromper sur soi.</p>
<div class="ex"><b class="l">Exemple</b>L’épisode du ruban volé (livre II) : Rousseau, jeune laquais, vole un ruban et accuse une servante, Marion, qui est renvoyée. Il dit n’avoir jamais pu se pardonner ce mensonge : l’autobiographie se fait aveu et examen de conscience.</div>` },
    { id: "e3-4", titre: "Le moi romantique : exhibé, élargi, masqué", html: `
<p>Le romantisme fait du moi la matière même de l’œuvre. Hugo justifie ce lyrisme dans la préface des <i>Contemplations</i> (1856) : « On se plaint quelquefois des écrivains qui disent moi. Parlez-nous de nous, leur crie-t-on. Hélas ! quand je vous parle de moi, je vous parle de vous. » Le moi lyrique se veut <b>universel</b> : « Ah ! insensé, qui crois que je ne suis pas toi ! » Chateaubriand construit dans les <i>Mémoires d’outre-tombe</i> (publiés en 1849-1850) un moi monumental, qui se confond avec l’histoire de son siècle.</p>
<p>D’autres explorent le <b>masque</b>. Dans <i>Lorenzaccio</i> (Musset, 1834), Lorenzo de Médicis joue le débauché pour approcher le tyran qu’il veut tuer, et finit par ne plus pouvoir quitter son rôle : « Le vice a été pour moi un vêtement ; maintenant il est collé à ma peau » (acte III, scène 3). Stendhal, lui, parle d’<b>égotisme</b> : l’analyse minutieuse et lucide de soi (<i>Souvenirs d’égotisme</i>, écrits en 1832).</p>
<div class="ex"><b class="l">Exemple</b>Lorenzo montre que le moi peut être transformé par ce qu’il joue : on devient ce qu’on fait semblant d’être. C’est un exemple précis pour un sujet sur l’identité et le regard des autres.</div>` },
    { id: "e3-5", titre: "Le moi divisé : le double et la folie", html: `
<p>Au XIX<sup>e</sup> siècle, la littérature multiplie les figures du <b>double</b>. Nerval, dans le sonnet « El Desdichado » (<i>Les Chimères</i>, 1854), s’attribue des identités multiples : « Je suis le ténébreux, — le veuf, — l’inconsolé », puis « Suis-je Amour ou Phébus ?… Lusignan ou Biron ? ». <i>Aurélia</i> (1855) s’ouvre sur « Le rêve est une seconde vie » et raconte une expérience de la folie.</p>
<p>Baudelaire se dit à la fois bourreau et victime : « Je suis la plaie et le couteau ! » (« L’Héautontimorouménos », <i>Les Fleurs du mal</i> ; le titre grec signifie « le bourreau de soi-même »). Stevenson (<i>L’Étrange Cas du docteur Jekyll et de M. Hyde</i>, 1886) sépare chimiquement les deux faces d’un même homme. Maupassant (<i>Le Horla</i>, 1887) fait tenir son journal à un narrateur qui se sent possédé : « Je suis perdu ! Quelqu’un possède mon âme et la gouverne ! » (14 août).</p>
<div class="ex"><b class="l">Exemple</b>Dans <i>Le Horla</i>, la forme du journal intime rend le lecteur témoin de la perte de soi, date après date, sans recul du narrateur : on ne sait pas s’il est fou ou si un être invisible existe vraiment.</div>` },
    { id: "e3-6", titre: "« Je est un autre » : Rimbaud", html: `
<p>Rimbaud a seize ans quand il écrit les deux lettres dites « du voyant ». Le 13 mai 1871, à son professeur Georges Izambard : « C’est faux de dire : Je pense. On devrait dire : On me pense. […] JE est un autre. » Le 15 mai, à Paul Demeny : « Car Je est un autre. Si le cuivre s’éveille clairon, il n’y a rien de sa faute. »</p>
<p>Le moi n’est plus l’auteur souverain de ses pensées : il est l’<b>instrument</b> où quelque chose se joue (le cuivre devient clairon, « le bois […] se trouve violon »). Le poète doit donc se connaître, puis se travailler : « La première étude de l’homme qui veut être poète est sa propre connaissance, entière. » Il se fait « voyant » par un « long, immense et raisonné dérèglement de tous les sens ». Rimbaud critique au passage le lyrisme romantique, qui n’aurait trouvé « du Moi que la signification fausse ».</p>
<div class="ex"><b class="l">Exemple</b>La faute de grammaire volontaire (« Je est » au lieu de « je suis ») fait du « je » un objet dont on parle à la troisième personne : la langue même montre le dédoublement.</div>
<div data-anim="e3-rimbaud-lecture"></div>` },
    { id: "e3-7", titre: "Le soupçon : Nietzsche, Freud, Bergson", html: `
<p>Nietzsche conteste l’évidence du « je pense » : une pensée vient quand elle veut, non quand « je » veux ; le « je » serait une habitude de la grammaire (<i>Par-delà bien et mal</i>, 1886, § 17). Il fait pourtant du devenir soi une tâche : « Tu dois devenir celui que tu es » (<i>Le Gai Savoir</i>, § 270, 1882, trad. H. Albert).</p>
<p>Freud, dans <i>L’Interprétation du rêve</i> (1900), fait du rêve un accès privilégié à l’<b>inconscient</b> : le rêve réalise de façon déguisée un désir refoulé. Il décrit plus tard trois instances : le <b>ça</b> (les pulsions), le <b>surmoi</b> (les interdits intériorisés) et le <b>moi</b>, qui tente de concilier les deux avec la réalité (<i>Le Moi et le Ça</i>, 1923). Il parle de trois « blessures » infligées au narcissisme humain : Copernic, Darwin, puis la psychanalyse, qui montre que le moi « n’est pas maître dans sa propre maison » (« Une difficulté de la psychanalyse », 1917).</p>
<p>Bergson distingue enfin un <b>moi superficiel</b>, social, découpé par le langage, et un <b>moi profond</b>, durée vivante. Pour lui, « nous sommes libres quand nos actes émanent de notre personnalité entière, quand ils l’expriment » (<i>Essai sur les données immédiates de la conscience</i>, 1889).</p>
<div class="ex"><b class="l">Exemple</b>Le lapsus et l’acte manqué (<i>Psychopathologie de la vie quotidienne</i>, 1901) : oublier un nom ou se tromper de mot trahit, selon Freud, un désir que la conscience refuse.</div>
<div data-anim="e3-soupcon"></div>` },
    { id: "e3-8", titre: "Le XX<sup>e</sup> siècle : moi successifs, rôles et regard d’autrui", html: `
<p>Proust montre que nous changeons au point de ne plus être la même personne : l’amour, le deuil, l’habitude remplacent nos « moi » successifs. Pirandello, dans <i>Un, personne et cent mille</i> (1926), fait découvrir à son héros, à partir d’une remarque de sa femme sur son nez, qu’il est un autre pour chacun de ceux qui le regardent. Kafka, dans <i>La Métamorphose</i> (1915), montre un homme devenu insecte dont la famille ne voit plus que la charge qu’il représente.</p>
<p>Sartre (protégé : on résume) refuse l’idée d’une nature humaine fixée d’avance : chacun se fait par ses actes. Dans <i>L’Être et le Néant</i> (1943), la <b>mauvaise foi</b> consiste à se mentir sur sa liberté, comme le garçon de café qui « joue » à être garçon de café. Dans <i>Huis clos</i> (1944), la réplique « l’enfer, c’est les autres » exprime notre dépendance au regard d’autrui pour savoir qui nous sommes.</p>
<div class="ex"><b class="l">Exemple</b>Sujet zéro de l’épreuve (Éduscol, 2020) : la lettre de Jacques Rivière à Antonin Artaud du 8 juin 1924, sur un poète qui souffre de ne pouvoir se saisir lui-même. Question posée : « En quoi la réflexion de Jacques Rivière expose-t-elle les déchirements du Moi ? »</div>` },
    { id: "e3-9", titre: "Écrire sur soi : se connaître ou se construire ?", html: `
<p>Les formes d’écriture de soi sont multiples : <b>autobiographie</b> (récit rétrospectif de sa vie), <b>mémoires</b> (sa vie mêlée à l’histoire), <b>journal intime</b> (au jour le jour : le <i>Journal</i> d’Amiel, publié en partie en 1882-1884), <b>autoportrait</b> (Montaigne, Leiris), <b>roman autobiographique</b> (Vallès). Chaque forme choisit un rapport au temps et à la vérité.</p>
<p>Faut-il conclure que l’écriture révèle un moi déjà là, ou qu’elle le <b>fabrique</b> ? Montaigne le dit lui-même : « Je n’ai pas plus fait mon livre que mon livre m’a fait » (<i>Essais</i>, II, 18, « Du démentir »). Michel Leiris, dans la préface ajoutée en 1946 à <i>L’Âge d’homme</i> (1939), « De la littérature considérée comme une tauromachie », compare l’écriture de soi à une corrida : l’écrivain doit accepter un vrai risque pour que son livre compte.</p>
<div class="plus"><b class="l">Pour aller plus loin</b>Philippe Lejeune (<i>Le Pacte autobiographique</i>, 1975) définit l’autobiographie par l’identité de l’auteur, du narrateur et du personnage, garantie par le nom. Paul Ricœur (<i>Soi-même comme un autre</i>, 1990) propose l’idée d’<b>identité narrative</b> : nous sommes l’histoire que nous racontons de nous-mêmes.</div>
<div class="cle"><b class="l">Pour la copie</b>Voilà de quoi répondre à la question du programme : nous n’accédons jamais à un moi « en soi », mais à des moi racontés, joués, interprétés ; la connaissance de soi est une tâche, pas un constat.</div>` }

    { id: "t3-1", auteur: "Montaigne", oeuvre: "Essais, III, 2, « Du repentir »", ref: "1588 (texte de 1595), orthographe modernisée",
      extrait: "Je ne peins pas l’être. Je peins le passage : non un passage d’âge en autre, ou, comme dit le peuple, de sept en sept ans, mais de jour en jour, de minute en minute.",
      contexte: "Montaigne s’est retiré dans sa tour et écrit les <i>Essais</i> de 1572 à sa mort (1592). Le livre III paraît en 1588. Le chapitre s’ouvre sur une comparaison : « Les autres forment l’homme ; je le récite ».",
      analyse: "<p>Deux phrases brèves en <b>parallélisme</b> (« Je ne peins pas… Je peins… ») opposent l’être, immobile, et le passage, mouvant. La correction qui suit (« non… mais… ») et la <b>gradation</b> vers le plus petit (« de jour en jour, de minute en minute ») font entendre l’instabilité même.</p>",

      liens: "Pascal (« Qu’est-ce que le moi ? ») ; Rousseau (<i>Confessions</i>) ; Bergson (la durée) ; Proust (les moi successifs)." },
    { id: "t3-2", auteur: "Rousseau", oeuvre: "Les Confessions, livre I", ref: "rédigé à partir de 1765, publié en 1782",
      extrait: "Je forme une entreprise qui n’eut jamais d’exemple, et dont l’exécution n’aura point d’imitateur. Je veux montrer à mes semblables un homme dans toute la vérité de la nature, et cet homme, ce sera moi.\nMoi seul. Je sens mon cœur, et je connais les hommes. Je ne suis fait comme aucun de ceux que j’ai vus ; j’ose croire n’être fait comme aucun de ceux qui existent. Si je ne vaux pas mieux, au moins je suis autre.",
      contexte: "Rousseau, attaqué de toutes parts après l’<i>Émile</i>, veut répondre à ses ennemis en se montrant tel qu’il est. Le livre est publié après sa mort (1778).",
      analyse: "<p>Le texte procède par <b>hyperboles</b> (« jamais d’exemple », « point d’imitateur ») et retarde le mot décisif : « ce sera moi », relancé par la phrase nominale « Moi seul. » L’<b>anaphore</b> de « je » et la chute paradoxale « au moins je suis autre » font de la singularité une valeur.</p>",
      enjeu: "<p>Peut-on se connaître assez pour se montrer « dans toute la vérité » ? Le pari de la transparence fonde l’autobiographie, mais repose sur une confiance dans le sentiment intérieur (« Je sens mon cœur ») que le XIX<sup>e</sup> et le XX<sup>e</sup> siècle ébranleront.</p>",

  cours: [
    { id: "e4-1", titre: "Le XX<sup>e</sup> siècle, âge des manifestes", html: `
<p class="lettrine">Le programme le dit d’emblée : le XX<sup>e</sup> siècle a été « dans tous les domaines de la culture, une ère de ruptures et de transgressions ». Les artistes ne se contentent plus de créer des œuvres : ils publient des <b>manifestes</b>, textes collectifs et provocateurs qui annoncent un art nouveau et condamnent l’ancien. Le mot <b>avant-garde</b> vient du vocabulaire militaire : la troupe qui marche devant.</p>
<p>Le premier grand manifeste est celui du <b>futurisme</b>, publié en français à la une du <i>Figaro</i> le 20 février 1909 par l’Italien Filippo Tommaso Marinetti. Il célèbre la vitesse, la machine, la ville moderne, et veut en finir avec le culte du passé : « Nous voulons démolir les musées, les bibliothèques ». Le même texte glorifie la guerre, « seule hygiène du monde » : les ruptures esthétiques sont souvent aussi des choix politiques, et Marinetti se ralliera au fascisme.</p>
<div class="ex"><b class="l">Exemple</b>Point 4 du manifeste : « une automobile rugissante, qui a l’air de courir sur de la mitraille, est plus belle que la Victoire de Samothrace ». La statue grecque du Louvre (II<sup>e</sup> siècle av. J.-C.) incarne la beauté héritée ; la machine prétend la détrôner.</div>
<div class="cle"><b class="l">Autres manifestes</b>Breton, <i>Manifeste du surréalisme</i> (1924) ; dans les arts, l’expressionnisme allemand, le cubisme (Picasso, <i>Les Demoiselles d’Avignon</i>, 1907), le suprématisme de Malevitch (<i>Carré noir</i>, 1915).</div>` },
    { id: "e4-2", titre: "Aux sources de la rupture : « Il faut être absolument moderne »", html: `
<p>La passion du nouveau ne naît pas en 1909. Baudelaire avait défini la <b>modernité</b> comme « le transitoire, le fugitif, le contingent, la moitié de l’art, dont l’autre moitié est l’éternel et l’immuable » (<i>Le Peintre de la vie moderne</i>, 1863) : une modernité qui ne rejette pas l’éternel. Rimbaud est plus radical. À la fin d’<i>Une saison en enfer</i> (1873), dans « Adieu », il écrit : « Il faut être absolument moderne. »</p>
<p>Le XIX<sup>e</sup> siècle invente aussi le scandale artistique. En 1874, des peintres en marge du Salon officiel exposent ensemble dans l’ancien atelier du photographe Nadar ; un critique moqueur les appelle « impressionnistes », d’après le tableau de Monet <i>Impression, soleil levant</i>. Le nom de l’injure devient celui du mouvement.</p>
<div class="ex"><b class="l">Exemple</b>Le 29 mai 1913, la création du ballet <i>Le Sacre du printemps</i> de Stravinsky au Théâtre des Champs-Élysées provoque un tumulte dans la salle : la rupture se joue désormais aussi devant le public.</div>
<div class="attention"><b class="l">Attention</b>Baudelaire n’est pas un « avant-gardiste » au sens du XX<sup>e</sup> siècle : sa modernité est une moitié de l’art, l’autre restant « l’éternel ». C’est une nuance précieuse dans un essai.</div>` },
    { id: "e4-3", titre: "Dada et le surréalisme : la table rase et l’inconscient", html: `
<p><b>Dada</b> naît en février 1916 au Cabaret Voltaire, à Zurich, en pleine guerre : poèmes sonores, collages, provocations. Puisque la civilisation qui se disait raisonnable a produit le massacre, Dada en rejette toutes les valeurs, y compris l’art. Marcel Duchamp envoie en 1917 à une exposition new-yorkaise un urinoir signé « R. Mutt » et intitulé <i>Fontaine</i> : un objet manufacturé devient œuvre parce qu’un artiste le choisit (le <b>ready-made</b>).</p>
<p>Le <b>surréalisme</b> prolonge et dépasse Dada. Breton et Soupault écrivent <i>Les Champs magnétiques</i> (1920), premier texte d’écriture automatique. Le <i>Manifeste du surréalisme</i> (1924) définit le mouvement comme un « automatisme psychique pur » : laisser parler la pensée sans contrôle de la raison, sous l’influence de Freud. La rupture vise ici la logique elle-même.</p>
<div class="ex"><b class="l">Exemple</b>La rupture surréaliste se cherche pourtant des ancêtres : les surréalistes se réclament de Lautréamont, de Rimbaud, de Nerval. Même la table rase se fabrique une généalogie.</div>
<div class="plus"><b class="l">Pour aller plus loin</b>Breton (mort en 1966) est protégé par le droit d’auteur : on le cite très brièvement. Les sujets de bac peuvent proposer des textes du XX<sup>e</sup> siècle protégés ; le site les résume.</div>` },
    { id: "e4-4", titre: "Apollinaire : le nouveau qui hérite", html: `
<p><i>Alcools</i> (1913) s’ouvre sur « Zone », dont le premier vers dit la lassitude du passé : « À la fin tu es las de ce monde ancien ». Le poème célèbre la tour Eiffel, les affiches, les prospectus, une « rue industrielle » ; la ponctuation est supprimée dans tout le recueil. Mais le même poème parle du Christ, de l’enfance, des « livraisons à 25 centimes » : l’ancien et le nouveau y sont mêlés.</p>
<p>En 1918, dans la conférence « L’Esprit nouveau et les poètes », Apollinaire précise sa position. L’esprit nouveau « prétend avant tout hériter des classiques un solide bon sens » et « hériter des romantiques une curiosité ». Il refuse l’idée d’un progrès continu : « le nouveau existe bien, sans être en progrès. Il est tout dans la surprise. »</p>
<div class="ex"><b class="l">Exemple</b>Le deuxième vers de « Zone », « Bergère ô tour Eiffel le troupeau des ponts bêle ce matin », applique à la tour Eiffel une image pastorale venue de la poésie antique : la modernité est dite avec les mots de la tradition.</div>
<div class="cle"><b class="l">Pour la copie</b>Apollinaire est l’exemple idéal d’une modernité sans table rase : c’est lui que propose le sujet type bac de cette entrée.</div>` },
    { id: "e4-5", titre: "La crise de la rationalité", html: `
<p>Les savoirs connaissent eux aussi des ruptures. En physique, la relativité (Einstein, 1905 puis 1915) et la mécanique quantique bouleversent les notions d’espace, de temps et de causalité. En psychologie, Freud montre que la conscience n’est qu’une partie de la vie psychique (<i>L’Interprétation du rêve</i>, 1900). En philosophie, la <b>phénoménologie</b> de Husserl veut revenir « aux choses mêmes », c’est-à-dire à la façon dont elles nous apparaissent ; l’<b>empirisme logique</b> du cercle de Vienne veut éliminer la métaphysique par l’analyse du langage.</p>
<p>Après la Première Guerre mondiale, Paul Valéry ouvre ainsi « La Crise de l’esprit » (1919) : « Nous autres, civilisations, nous savons maintenant que nous sommes mortelles. » La guerre a montré que la science et la culture n’empêchaient pas la destruction : la confiance dans le progrès vacille.</p>
<div class="ex"><b class="l">Exemple</b>Bergson, dans <i>L’Évolution créatrice</i> (1907), oppose à l’intelligence qui fabrique et découpe une durée créatrice, imprévisible : la nouveauté est réelle, l’avenir n’est pas contenu dans le passé.</div>` },
    { id: "e4-6", titre: "Les techniques nouvelles transforment l’art", html: `
<p>Transports, radio, cinéma « redessinent la physionomie du monde », dit le programme. Le 28 décembre 1895, les frères Lumière organisent à Paris, au Salon indien du Grand Café, la première projection publique payante de leur cinématographe. Le cinéma devient en quelques décennies un art à part entière, qui transforme aussi la manière de raconter (montage, gros plan, ellipse).</p>
<p>La littérature s’en empare. Blaise Cendrars publie en 1913 <i>La Prose du Transsibérien</i>, poème illustré par Sonia Delaunay et imprimé sur une feuille dépliante de près de deux mètres : la vitesse du train passe dans la forme du livre. En 1935-1936, Walter Benjamin analyse ce que la <b>reproductibilité technique</b> (photographie, cinéma) fait à l’œuvre d’art : elle perd son « aura », sa présence unique, mais devient accessible à tous.</p>
<div class="ex"><b class="l">Exemple</b>L’idée que l’innovation ira toujours s’accélérant nourrit l’imaginaire d’anticipation, entre enthousiasme (le futurisme) et peur (les dystopies, étudiées dans l’entrée « L’humain et ses limites »).</div>` },
    { id: "e4-7", titre: "Éclatement du récit, absurde, contraintes", html: `
<p>Après 1945, la rupture touche le roman et le théâtre. Le <b>Nouveau Roman</b> conteste le personnage, l’intrigue et le narrateur omniscient hérités de Balzac : Nathalie Sarraute parle d’une « ère du soupçon » (<i>L’Ère du soupçon</i>, 1956) envers le personnage ; Alain Robbe-Grillet théorise un roman des objets et des surfaces (<i>Pour un nouveau roman</i>, 1963).</p>
<p>Le <b>théâtre de l’absurde</b> défait le dialogue et l’action : Ionesco sous-titre <i>La Cantatrice chauve</i> (créée en 1950) « anti-pièce » ; dans <i>En attendant Godot</i> de Beckett (créé en 1953), deux personnages attendent quelqu’un qui ne vient pas. D’autres créent par la <b>contrainte</b> : l’Oulipo, fondé en 1960 autour de Raymond Queneau, invente des règles pour produire des textes.</p>
<div class="ex"><b class="l">Exemple</b>Queneau, <i>Cent mille milliards de poèmes</i> (1961) : dix sonnets dont chaque vers peut se combiner avec ceux des autres, soit 10<sup>14</sup> poèmes possibles. La contrainte, loin de brider, multiplie la création.</div>` },
    { id: "e4-8", titre: "Continuités : l’ancien dans le nouveau", html: `
<p>Le programme invite à se demander si l’ancien, « qui remplit les musées, les bibliothèques, les cinémathèques », ne subsiste pas à côté du nouveau ou à travers lui. Au XX<sup>e</sup> siècle, on <b>réécrit</b> sans cesse les mythes : Cocteau (<i>La Machine infernale</i>, 1934), Giraudoux (<i>La guerre de Troie n’aura pas lieu</i>, 1935), Anouilh (<i>Antigone</i>, 1944) ; Marguerite Yourcenar fait parler un empereur romain dans <i>Mémoires d’Hadrien</i> (1951).</p>
<p>Les querelles elles-mêmes sont anciennes. En 1687, Charles Perrault lit à l’Académie française <i>Le Siècle de Louis le Grand</i>, qui déclenche la <b>querelle des Anciens et des Modernes</b> : « La belle antiquité fut toujours vénérable ; / Mais je ne crus jamais qu’elle fût adorable. » La bataille d’<i>Hernani</i> (1830) rejoue l’opposition entre classiques et romantiques.</p>
<div class="ex"><b class="l">Exemple</b>En 1957, Picasso peint une série de 58 toiles d’après <i>Les Ménines</i> de Velázquez (1656), conservée au musée Picasso de Barcelone : le peintre de la rupture cubiste passe des mois à dialoguer avec un maître ancien.</div>
<div class="cle"><b class="l">Une idée à retenir</b>Le poète T. S. Eliot (« La tradition et le talent individuel », 1919) soutient qu’une œuvre vraiment nouvelle modifie l’ordre de toutes les œuvres anciennes : la tradition n’est pas un dépôt mort, elle se réorganise à chaque création. (Thèse résumée.)</div>` },
    { id: "e4-9", titre: "Qu’est-ce que créer ? De l’originalité à la « fin de l’art »", html: `
<p>Les philosophes ont pensé la création bien avant les avant-gardes. Pour Kant (<i>Critique de la faculté de juger</i>, 1790), le <b>génie</b> est un talent naturel qui donne ses règles à l’art : son œuvre est originale, mais aussi <b>exemplaire</b>, c’est-à-dire capable de servir de modèle. L’originalité seule ne suffit pas : l’absurde aussi peut être original.</p>
<p>Hegel affirme dans ses cours d’esthétique que l’art, sous sa forme la plus haute, est « pour nous » une chose du passé : la pensée a pris le relais. Au XX<sup>e</sup> siècle, plusieurs propositions proclament la « fin » de l’art ou de la littérature (le ready-made, le monochrome, l’anti-pièce). Mais chacune est aussitôt exposée, commentée, conservée. Le critique Harold Rosenberg parle en 1959 d’une « tradition du nouveau » : rompre est devenu une habitude.</p>
<div class="ex"><b class="l">Exemple</b>Michel Foucault, « Qu’est-ce qu’un auteur ? » (1969) : l’auteur n’est pas une origine absolue, mais une « fonction » qui organise la circulation des textes. La création elle-même est prise dans une histoire. (Thèse résumée.)</div>
<div class="cle"><b class="l">Pour la copie</b>Trois positions à opposer dans un essai : la rupture radicale (Marinetti), l’héritage transformé (Apollinaire, Eliot, Picasso), la rupture comme nouvelle tradition (Rosenberg).</div>` }

  textesIntro: "Six textes du domaine public, d’après Wikisource, et des œuvres protégées seulement résumées.",
  textes: [
    { id: "t4-1", auteur: "Perrault", oeuvre: "Le Siècle de Louis le Grand", ref: "1687 (texte de l’édition de 1826)", vers: true,
      extrait: "La belle antiquité fut toujours vénérable ;\nMais je ne crus jamais qu’elle fût adorable.\nJe vois les anciens, sans plier les genoux ;\nIls sont grands, il est vrai, mais hommes comme nous",
      contexte: "Lu à l’Académie française le 27 janvier 1687, le poème irrite Boileau et ouvre la querelle des Anciens et des Modernes : les modernes peuvent-ils égaler, voire dépasser, les auteurs de l’Antiquité ?",
      analyse: "<p>Le premier vers concède (« vénérable »), le second refuse (« Mais […] adorable ») : l’<b>antithèse</b> sépare le respect de l’adoration. L’image « sans plier les genoux » et la formule « hommes comme nous » <b>désacralisent</b> les Anciens.</p>",

    { id: "t4-2", auteur: "Rimbaud", oeuvre: "Une saison en enfer, « Adieu »", ref: "1873",

      contexte: "Le poète italien publie son manifeste en français, à la une d’un grand quotidien parisien : Paris est alors la capitale des arts. Les points sont numérotés comme un programme.",

    { id: "t4-4", auteur: "Apollinaire", oeuvre: "Alcools, « Zone »", ref: "1913 (édition NRF, 1920)", vers: true,
      extrait: "À la fin tu es las de ce monde ancien\nBergère ô tour Eiffel le troupeau des ponts bêle ce matin\nTu en as assez de vivre dans l’antiquité grecque et romaine\nIci même les automobiles ont l’air d’être anciennes",

      enjeu: "<p>Le poème rejette le « monde ancien » avec les images de l’Antiquité : la rupture se dit dans la langue de la tradition.</p>",

  e.sujet.q1.intro = `<p>On associe volontiers la nouveauté au progrès : ce qui vient après serait meilleur que ce qui précède. Dans la conférence « L’Esprit nouveau et les poètes », publiée en 1918, Guillaume Apollinaire, qui a renouvelé la poésie avec <i>Alcools</i> (1913), refuse pourtant cette confusion. Le texte pose une question décisive pour l’art : si le nouveau n’est pas le progrès, en quoi consiste-t-il, et que garde-t-il du passé ? Apollinaire soutient que l’esprit nouveau hérite du passé et que le progrès existe dans l’ordre des combinaisons de la nature, mais que la nouveauté artistique est d’une autre nature : elle est « tout dans la surprise ». Nous verrons d’abord que le nouveau se définit par un héritage (l. 1-9), puis en quel sens limité le progrès existe (l. 10-13), avant de dégager ce qui fait la nouveauté propre : la surprise (l. 14-16).</p>`;
  e.sujet.q1.plan = [
    ["I. Un nouveau qui hérite (l. 1-9)", `<ul class="puces"><li>Le verbe « hériter », répété (l. 1 et 5), structure le passage : l’esprit nouveau ne fait pas table rase. Aux classiques, il prend le « bon sens », l’« esprit critique », le « sens du devoir » ; aux romantiques, la « curiosité ».</li><li>Le verbe « prétend » marque une revendication : c’est un programme, pas un constat. La nouveauté se définit par une synthèse inédite d’héritages opposés (classiques et romantiques).</li><li>Les infinitifs « Explorer la vérité, la chercher » donnent la fin commune : connaître, dans le réel (« domaine ethnique ») comme dans l’imaginaire. Le nouveau est une recherche, non une rupture.</li></ul>` ],
    ["II. Le progrès : un sens limité (l. 10-13)", `<ul class="puces"><li>Le progrès est défini comme la réalisation de « combinaisons naturelles qui n’ont jamais été composées » : il est cumulatif, comme dans les sciences et les techniques.</li><li>La formule « En ce sens, il existe » est une concession restrictive : Apollinaire n’est pas hostile au progrès, mais il le borne à un domaine.</li><li>L’expression « l’art de vie » élargit la notion d’art : inventer, c’est déjà composer avec la nature. Mais cette continuité laisse de côté ce qui fait la nouveauté d’une œuvre.</li></ul>` ],
    ["III. Le nouveau, « tout dans la surprise » (l. 14-16)", `<ul class="puces"><li>Le connecteur « Mais » et l’adverbe « bien » affirment l’existence du nouveau contre ceux qui disent qu’il n’y a « rien de nouveau sous le soleil » : il existe, « sans être en progrès ».</li><li>La surprise n’est pas un perfectionnement : elle ne rend pas l’œuvre meilleure que les anciennes, elle la rend imprévisible. Une œuvre nouvelle n’annule donc pas le passé.</li><li>Portée : cette distinction permet d’échapper à la logique des avant-gardes (toujours plus loin, toujours contre) et rejoint Bergson, pour qui la création est jaillissement imprévisible. Limite : la surprise s’use (« Ici même les automobiles ont l’air d’être anciennes », dit « Zone »).</li></ul>` ]

  e.sujet.q1.concl = `<p>Le nouveau se distingue du progrès parce qu’il n’est pas cumulatif : le progrès réalise des combinaisons de plus en plus nombreuses, alors que la nouveauté artistique tient à la surprise, qui ne rend pas l’œuvre supérieure à celles du passé. Apollinaire peut ainsi revendiquer à la fois l’héritage des classiques et des romantiques et la plus grande audace. Cette conception éclaire la poésie de son temps et ouvre une question pour tout créateur : comment surprendre encore, quand la surprise elle-même devient une habitude ?</p>`;
  e.sujet.q2.intro = `<p>« Nous voulons démolir les musées, les bibliothèques » : en 1909, le <i>Manifeste du futurisme</i> de Marinetti faisait de la destruction du passé la condition de l’art nouveau. Neuf ans plus tard, Apollinaire affirme au contraire que l’esprit nouveau « prétend avant tout hériter des classiques ». Créer, c’est faire exister une œuvre qui n’existait pas ; rompre, c’est refuser ou s’écarter de ce qui précède. Si créer, c’est produire du nouveau, il semble nécessaire de s’écarter du passé ; mais on ne crée jamais qu’avec une langue, des formes, des œuvres héritées. Faut-il donc rompre avec le passé pour créer, ou la création n’est-elle qu’une manière nouvelle de le reprendre ? Nous verrons que la création semble exiger la rupture, puis que toute rupture dépend de ce qu’elle rejette, avant de montrer que créer consiste à transformer le passé plutôt qu’à l’abolir.</p>`;

  e.sujet.q2.concl = `<p>La création semble exiger la rupture : sans écart, il n’y aurait que répétition, et les avant-gardes ont fait de la table rase un programme. Mais la rupture reste prisonnière de ce qu’elle rejette, et l’histoire montre que les querelles du nouveau sont elles-mêmes une tradition. Créer n’est donc pas rompre avec le passé, mais le reprendre pour le transformer, au point qu’il nous surprenne encore. C’est peut-être la leçon la plus durable des modernes : Apollinaire ou Picasso n’ont jamais cessé de dialoguer avec les anciens.</p>`;

<section><h3>Définitions</h3><ul class="puces"><li><b>Avant-garde</b>, <b>manifeste</b>, <b>modernité</b>, <b>ready-made</b>, <b>écriture automatique</b>, <b>réécriture</b>, <b>aura</b>.</li><li><b>Nouveau</b> (surprise, imprévisible) ≠ <b>progrès</b> (cumulatif) — Apollinaire.</li><li><b>Originalité</b> ≠ <b>exemplarité</b> : le génie selon Kant réunit les deux.</li></ul></section>

  cours: [
    { id: "e5-1", titre: "Qu’appelle-t-on « violence » ?", html: `
<p class="lettrine">Le mot vient du latin <i>violentia</i>, de <i>vis</i>, la force. Mais toute force n’est pas violence : la pesanteur, le courant d’un fleuve sont des forces. On parle de <b>violence</b> quand une force s’exerce <b>contre</b> une volonté, un corps, une dignité, qu’elle les <b>viole</b> (<i>violare</i>). La violence suppose donc une victime, et elle appelle un jugement : on la subit, on la dénonce, on la justifie.</p>
<p>Il faut distinguer la violence de notions voisines. La <b>force</b> peut être légitime (la police qui arrête un criminel). La <b>contrainte</b> oblige sans forcément blesser (la loi). Le <b>pouvoir</b>, pour Hannah Arendt (<i>Du mensonge à la violence</i>, essai « Sur la violence », 1970), naît de l’accord de ceux qui agissent ensemble, alors que la violence est un <b>instrument</b> : là où le pouvoir se défait, la violence prend sa place ; elle peut détruire le pouvoir, jamais le créer.</p>
<p>Le programme demande de ne pas tout confondre. Une <b>guerre de conquête</b> n’est pas une <b>guerre de libération</b>. Un <b>régime oppressif</b> (une dictature militaire qui censure et emprisonne) n’est pas nécessairement une <b>entreprise totalitaire</b> (qui veut contrôler toute la vie et refaire l’homme). Et il existe des violences <b>diffuses</b>, quotidiennes, qui ne prennent pas la forme de l’agression physique : humiliation, misère, exclusion.</p>
<div class="ex"><b class="l">Exemple</b>Max Weber, dans la conférence <i>Le Métier et la vocation d’homme politique</i> (Munich, 28 janvier 1919), définit l’État moderne comme la communauté humaine qui revendique avec succès, sur un territoire, le <b>« monopole de la violence physique légitime »</b>. La violence n’est pas supprimée par l’État : elle est confisquée et encadrée par le droit.</div>
<div class="plus"><b class="l">Pour aller plus loin</b>Pierre Bourdieu et Jean-Claude Passeron parlent de « violence symbolique » (<i>La Reproduction</i>, 1970) : une domination qui s’impose sans coups, parce que ceux qui la subissent la jugent normale. Utile pour la question des violences « diffuses », mais à présenter comme une référence de sociologie.</div>` },
    { id: "e5-2", titre: "Une violence de toujours ? Les références antérieures", html: `
<p>Thomas Hobbes, dans le <i>Léviathan</i> (1651, chapitre XIII), imagine les hommes sans pouvoir commun pour les tenir en respect : chacun, craignant l’autre, attaque le premier. C’est une guerre de chacun contre chacun, où il n’y a ni industrie, ni arts, ni sécurité, et où la vie est brève. Pour en sortir, les hommes confient leur force à un souverain. La violence est première ; la paix est construite.</p>
<p>Rousseau répond dans le <i>Discours sur l’origine de l’inégalité</i> (1755) que Hobbes prête à l’homme naturel des passions qui sont celles de l’homme social : la guerre naît avec la propriété et la société, non avant elles ; l’homme naturel a la <b>pitié</b>. Le débat est posé pour toute l’entrée : la violence est-elle dans la nature humaine ou dans l’histoire ?</p>
<p>La littérature, elle, démasque les justifications. Montaigne, dans « Des cannibales » (<i>Essais</i>, I, 31, 1580), retourne l’accusation de barbarie contre les Européens des guerres de Religion : « chacun appelle barbarie ce qui n’est pas de son usage », et il y a « plus de barbarie à manger un homme vivant qu’à le manger mort ». Voltaire, dans <i>Candide</i> (1759, chapitre 3), décrit une bataille en termes de spectacle (« Rien n’était si beau, si leste, si brillant ») pour mieux montrer la « boucherie héroïque ».</p>
<div class="ex"><b class="l">Exemple</b>Chez Voltaire, le village brûlé « selon les lois du droit public » : l’ironie oppose le vocabulaire juridique à l’horreur des corps. La violence de guerre se donne toujours un langage qui la rend acceptable.</div>` },
    { id: "e5-3", titre: "L’histoire a-t-elle un sens ? Kant, Hegel, Marx", html: `
<p>Kant, dans l’<i>Idée d’une histoire universelle d’un point de vue cosmopolitique</i> (1784), part d’un constat : les hommes ne sont ni des animaux guidés par l’instinct, ni des citoyens raisonnables. Ils ont une <b>« insociable sociabilité »</b> (<i>ungesellige Geselligkeit</i>) : ils ont besoin les uns des autres et pourtant se repoussent, par ambition, désir de domination, cupidité. Or cet <b>antagonisme</b> est fécond : la rivalité pousse à développer les talents, et l’insécurité contraint à fonder des États, puis à chercher une paix entre États.</p>
<p>Dans le <i>Projet de paix perpétuelle</i> (1795), il précise : l’état de paix n’est pas un état de nature : il « a donc besoin d’être établi ». Il propose une <b>fédération</b> d’États libres et un droit cosmopolitique (l’hospitalité). Une guerre d’extermination, au contraire, ne laisserait de place à la paix perpétuelle « que dans le vaste cimetière du genre humain ».</p>
<p>Hegel (<i>Leçons sur la philosophie de l’histoire</i>, cours publiés en 1837) voit dans l’histoire un « abattoir » (<i>Schlachtbank</i>) où sont sacrifiés le bonheur des peuples et la vertu des individus ; mais la raison s’y réalise par une <b>« ruse »</b> : elle se sert des passions des grands hommes pour accomplir le progrès de la liberté. Marx, enfin, écrit dans <i>Le Capital</i> (1867) que « la force est l’accoucheuse de toute vieille société en travail » (trad. Joseph Roy) : la violence accompagne les changements de société.</p>
<div class="ex"><b class="l">Exemple</b>Victor Hugo, président du Congrès de la paix à Paris (21 août 1849) : « Un jour viendra où les armes vous tomberont des mains, à vous aussi ! » Il annonce des « États-Unis d’Europe » où les votes remplaceront les boulets. L’optimisme du XIX<sup>e</sup> siècle sera mis à l’épreuve par 1914.</div>
<div class="cle"><b class="l">Pour la copie</b>Ces philosophies de l’histoire ne nient pas la violence : elles lui donnent un <b>sens</b>. C’est ce qui devient difficile après Auschwitz : quel progrès pourrait « justifier » un génocide ?</div>` },
    { id: "e5-4", titre: "1914-1918 : la guerre industrielle et la fin d’une confiance", html: `
<p>La Première Guerre mondiale fait environ 10 millions de morts parmi les soldats (dont près de 1,4 million de Français). C’est une guerre <b>industrielle</b> : artillerie lourde, mitrailleuses, gaz (Ypres, 1915), tranchées. À Verdun (21 février – 18 décembre 1916), les combats font environ 300 000 morts. La violence devient anonyme et massive.</p>
<p>Les écrivains combattants inventent une littérature du <b>témoignage</b>. Henri Barbusse publie <i>Le Feu, journal d’une escouade</i> (prix Goncourt 1916) : la langue des poilus, la boue, et la révolte : « Deux armées qui se battent, c’est comme une grande armée qui se suicide ! » Erich Maria Remarque, dans <i>À l’Ouest, rien de nouveau</i> (1929), raconte la même guerre du côté allemand. Céline (<i>Voyage au bout de la nuit</i>, 1932) fait de Bardamu un soldat qui découvre l’absurdité du massacre et refuse l’héroïsme.</p>
<p>Apollinaire, engagé volontaire, blessé à la tête en mars 1916, publie <i>Calligrammes</i> en 1918. Dans « L’Adieu du cavalier », le vers « Ah Dieu ! que la guerre est jolie » est démenti par la mort du cavalier à la fin du poème : la légèreté apparente rend la violence plus saisissante.</p>
<div class="ex"><b class="l">Exemple</b>Paul Valéry, « La Crise de l’esprit » (1919) : « Nous autres, civilisations, nous savons maintenant que nous sommes mortelles. » Plus grave encore : « Tant d’horreurs n’auraient pas été possibles sans tant de vertus. » La science, la discipline, le travail ont servi à tuer.</div>
<div class="plus"><b class="l">Pour aller plus loin</b>Freud, dans <i>Considérations actuelles sur la guerre et sur la mort</i> (1915), parle de la « désillusion » des Européens : ils croyaient les États civilisés capables de régler leurs conflits autrement. Dans <i>Malaise dans la civilisation</i> (1930), il reprend la formule de Plaute <i>Homo homini lupus</i> (l’homme est un loup pour l’homme) : la culture ne fait que contenir une agressivité qui ne disparaît pas.</div>` },
    { id: "e5-5", titre: "Le totalitarisme, les camps, le génocide : un mal sans précédent", html: `
<p>Le XX<sup>e</sup> siècle invente des violences d’une <b>nature nouvelle</b>. Le <b>génocide</b> (mot forgé en 1944 par le juriste Raphael Lemkin) vise la destruction d’un groupe humain en tant que tel : génocide des Arméniens par l’Empire ottoman (1915-1916, plus d’un million de morts), <b>Shoah</b> (environ six millions de Juifs assassinés par les nazis), génocide des Tutsi au Rwanda (avril-juillet 1994, au moins 800 000 morts). Le Goulag soviétique enferme des millions de détenus (Soljenitsyne, <i>L’Archipel du Goulag</i>, 1973).</p>
<p>Hannah Arendt (<i>Les Origines du totalitarisme</i>, 1951) distingue le <b>totalitarisme</b> des tyrannies anciennes : il ne se contente pas d’interdire, il veut transformer la nature humaine par l’<b>idéologie</b> et la <b>terreur</b> ; les camps en sont le laboratoire, où l’on rend les hommes « superflus ». Après le procès Eichmann (Jérusalem, 1961), elle parle de la <b>« banalité du mal »</b> (<i>Eichmann à Jérusalem</i>, 1963) : un des organisateurs de la déportation n’était pas un monstre, mais un fonctionnaire qui ne pensait pas.</p>
<p>La violence passe aussi par la <b>langue</b>. Victor Klemperer, philologue juif resté à Dresde, note dans <i>LTI, la langue du Troisième Reich</i> (1947) comment les mots du régime (euphémismes, superlatifs, vocabulaire mécanique) ont préparé les esprits.</p>
<div class="ex"><b class="l">Exemple</b>La distinction du programme : la France de Vichy est un régime <b>oppressif</b> et collaborateur, qui participe à la déportation des Juifs (rafle du Vél’d’Hiv, 16-17 juillet 1942) ; l’Allemagne nazie et l’URSS stalinienne sont des entreprises <b>totalitaires</b>.</div>
<div class="cle"><b class="l">Pour la copie</b>« Toutes les violences sont-elles comparables ? » : on peut comparer pour distinguer, pas pour confondre. Le génocide n’est pas une guerre plus meurtrière : il vise à effacer un peuple, sans qu’aucune conduite des victimes puisse les sauver.</div>` },
    { id: "e5-6", titre: "Témoigner : dire l’indicible", html: `
<p>Le <b>témoignage</b> repose sur un pacte : « j’y étais ». Il demande un effort d’<b>objectivation</b> : dire précisément, sans effet, ce qui s’est passé. Primo Levi, chimiste italien déporté à Auschwitz de février 1944 à la libération du camp (27 janvier 1945), écrit <i>Si c’est un homme</i> (1947) dans une langue sobre, presque scientifique, qui décrit la destruction méthodique de l’humanité des détenus. Robert Antelme, déporté à Buchenwald puis Gandersheim, conclut <i>L’Espèce humaine</i> (1947) sur une idée forte : les SS ont voulu faire des déportés une autre espèce, et ils ont échoué ; l’espèce humaine est une.</p>
<p>Mais l’expérience extrême semble dépasser les mots. Jorge Semprun, déporté à Buchenwald, attend des décennies pour écrire <i>L’Écriture ou la vie</i> (1994) : il défend l’idée que seul l’<b>artifice</b> de la littérature peut transmettre la vérité vécue. Georges Perec, dont la mère a été déportée à Auschwitz, construit <i>W ou le souvenir d’enfance</i> (1975) en alternant une fiction et des souvenirs lacunaires : le vide du texte dit la disparition.</p>
<p>Le philosophe Theodor Adorno écrit en 1949 qu’écrire un poème après Auschwitz serait barbare (formule publiée en 1951, qu’il nuancera plus tard). La littérature d’après les camps se construit en partie contre cette interdiction : ne pas embellir, mais ne pas se taire.</p>
<div class="ex"><b class="l">Exemple</b>Dans <i>W ou le souvenir d’enfance</i>, une page presque blanche, marquée de points de suspension entre parenthèses, sépare les deux parties du livre : la forme même montre ce que l’enfant n’a pas pu savoir ni dire.</div>` },
    { id: "e5-7", titre: "Dénoncer, s’engager : la littérature agit-elle sur l’histoire ?", html: `
<p>La littérature d’<b>engagement</b> prétend agir sur le cours des événements. Hugo, exilé après le coup d’État de 1851, écrit <i>Les Châtiments</i> (1853) contre Napoléon III. Zola publie « J’accuse… ! » dans <i>L’Aurore</i> (13 janvier 1898) pour défendre Dreyfus, condamné à tort. Éluard écrit « La Victoire de Guernica » (<i>Cours naturel</i>, 1938) après le bombardement de la ville basque par l’aviation allemande et italienne (26 avril 1937), que Picasso peint la même année.</p>
<p>L’engagement a ses formes indirectes : l’<b>allégorie</b> (Camus, <i>La Peste</i>, 1947, où l’épidémie d’Oran figure l’Occupation et toute violence collective), le théâtre (Giraudoux, <i>La guerre de Troie n’aura pas lieu</i>, 1935), le roman (Malraux, <i>La Condition humaine</i>, 1933).</p>
<p>Mais l’engagement a ses risques : la <b>propagande</b> (mettre la littérature au service d’un camp), l’<b>esthétisation</b> (rendre la violence belle, donc désirable : le <i>Manifeste du futurisme</i> de Marinetti, publié dans <i>Le Figaro</i> le 20 février 1909, glorifiait la guerre). Simone Weil admire au contraire l’<i>Iliade</i> parce qu’elle montre la force avec une égale amertume pour les deux camps.</p>
<div data-anim="e5-weil"></div>
<div class="ex"><b class="l">Exemple</b>Le sujet du bac 2021 demandait : « La littérature et les arts peuvent-ils représenter la guerre sans la dénoncer ? » Voltaire (ironie), Apollinaire (fausse légèreté), Barbusse (témoignage) et Picasso (déformation) donnent quatre réponses différentes.</div>` },
    { id: "e5-8", titre: "Violence coloniale et combats pour la dignité", html: `
<p>Le programme rappelle que l’histoire contemporaine a vu « de nombreux peuples soumis » revendiquer leur dignité et leur indépendance. La <b>colonisation</b> repose sur une violence de conquête puis de domination, souvent justifiée par une prétendue mission « civilisatrice ». Joseph Conrad, dans <i>Au cœur des ténèbres</i> (1899), montre le Congo exploité par l’Europe : le personnage de Kurtz, arrivé en apôtre du progrès, sombre dans la sauvagerie qu’il prétendait combattre.</p>
<p>Aimé Césaire, dans le <i>Discours sur le colonialisme</i> (1950), retourne l’accusation : la colonisation ensauvage le colonisateur lui-même, et le nazisme a appliqué à l’Europe des procédés jusque-là réservés aux peuples colonisés. Frantz Fanon, dans <i>Les Damnés de la terre</i> (1961, préface de Sartre), voit dans la violence du colonisé une réponse à la violence première du colonisateur.</p>
<p>D’autres choisissent la <b>non-violence</b> : Gandhi, dont la campagne de désobéissance civile conduit l’Inde à l’indépendance (15 août 1947) ; Martin Luther King aux États-Unis. La question devient : une violence de libération est-elle comparable à une violence d’oppression ?</p>
<div class="ex"><b class="l">Exemple</b>Le 8 mai 1945, jour de la victoire en Europe, des manifestations nationalistes à Sétif (Algérie) sont suivies d’une répression qui fait des milliers de morts. La guerre d’Algérie (1954-1962) mêlera ensuite attentats, torture et répression.</div>` },
    { id: "e5-9", titre: "Le droit peut-il limiter la violence ?", html: `
<p>« Si la violence précède le droit, quel droit pourra la limiter […] ? » demande le programme. Après 1918, la <b>Société des Nations</b> (1920) et le pacte Briand-Kellogg (1928), par lequel les signataires renoncent à la guerre comme instrument de politique nationale, échouent à empêcher la Seconde Guerre mondiale. Après 1945, le droit se renforce : la <b>Charte des Nations unies</b> (26 juin 1945) interdit le recours à la force entre États ; le tribunal de Nuremberg (1945-1946) juge les dirigeants nazis pour <b>crimes contre la paix</b>, <b>crimes de guerre</b> et <b>crimes contre l’humanité</b> ; la Convention contre le génocide (9 décembre 1948) et la Déclaration universelle des droits de l’homme (10 décembre 1948) suivent ; la <b>Cour pénale internationale</b> est créée par le statut de Rome (1998) et fonctionne depuis 2002.</p>
<p>Ces institutions réalisent en partie le projet kantien d’une fédération des peuples. Mais elles se heurtent à une difficulté ancienne : sans force, le droit reste lettre morte. Pascal l’avait formulé : « La justice sans la force est impuissante : la force sans la justice est tyrannique » (<i>Pensées</i>). Le Rwanda (1994), où les casques bleus présents n’ont pas reçu les moyens d’intervenir, en est un exemple tragique.</p>
<div class="ex"><b class="l">Exemple</b>Le crime contre l’humanité est <b>imprescriptible</b> en droit français (loi du 26 décembre 1964) : Klaus Barbie a été jugé à Lyon en 1987, plus de quarante ans après les faits. Le droit ne répare pas, mais il nomme et il juge.</div>
<div class="cle"><b class="l">Pour la copie</b>Plan possible pour « Le droit peut-il mettre fin à la violence ? » : I. Le droit naît pour sortir de la violence (Hobbes, Kant, Weber) ; II. Mais il n’est rien sans force et peut lui-même couvrir la violence (Pascal ; le « droit public » ironique de Voltaire ; les lois de Vichy) ; III. Il ne la supprime pas, il la transforme en jugement et en mémoire (Nuremberg, imprescriptibilité, témoignage).</div>` },
