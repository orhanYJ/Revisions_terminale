  notions: ["inégalités économiques", "inégalités sociales", "caractère multiforme et cumulatif", "revenu, patrimoine", "rapport inter-quantiles (D9/D1, S80/S20)", "courbe de Lorenz", "coefficient de Gini", "top 1 %", "corrélation des revenus parents-enfants", "égalité des droits", "égalité des chances", "égalité des situations", "justice sociale", "utilitarisme", "libertarisme", "égalitarisme libéral", "égalitarisme strict", "redistribution", "fiscalité (progressive, proportionnelle)", "protection sociale (assurance, assistance)", "services collectifs", "discriminations", "contrainte de financement", "consentement à l’impôt", "désincitations"],
  sections: [
    { id: "r1-1", t: "Un siècle d’inégalités : une courbe en U, des inégalités cumulatives", h:
      '<div class="def"><b>Inégalité</b> — différence d’accès à des ressources rares et valorisées (revenu, patrimoine, diplôme, santé, pouvoir) qui se traduit par une hiérarchie entre individus ou groupes. Les inégalités <b>économiques</b> portent sur le revenu et le patrimoine ; les inégalités <b>sociales</b> sur l’accès à l’école, à la santé, au logement, à la culture, au pouvoir.</div>' +
      '<h3>La grande tendance : un U</h3>' +
      '<div data-chain="r1-u"></div>' +
      '<p>Les travaux de Thomas Piketty et de ses coauteurs (World Inequality Database) montrent qu’en France, au début du XX<sup>e</sup> siècle, les 10 % les plus aisés perçoivent environ la moitié des revenus avant impôts, et le 1 % le plus aisé plus d’un cinquième (22 à 23 % entre 1900 et 1910). Leur part s’effondre avec les deux guerres et la crise des années 1930, puis reste basse : les 10 % les plus aisés reçoivent environ 30 % des revenus au début des années 1980, le 1 % le plus aisé moins de 8 % en 1983. Elle remonte ensuite : plus de 12 % pour le 1 % le plus aisé à la veille de la crise de 2008 (Garbinti, Goupille-Lebret et Piketty, 2018), 9,8 % en 2017, et 32 % pour les 10 % les plus aisés (Observatoire des inégalités, d’après la WID).</p>' +
      '<div class="aut"><span class="mono">TP</span><span class="an">Thomas Piketty<small><i>Le Capital au XXI<sup>e</sup> siècle</i>, 2013</small></span><span class="ad">Quand le rendement du capital (r) dépasse durablement la croissance (g), les patrimoines hérités croissent plus vite que les revenus du travail : les inégalités se creusent. La baisse du XX<sup>e</sup> siècle tient aux chocs (guerres, crises) et à des politiques (impôt progressif, État social), pas à une loi automatique.</span></div>' +
      '<div class="plus"><p>L’économiste Simon Kuznets (1955) pensait que les inégalités augmentent puis diminuent naturellement avec le développement (courbe en U inversé). La remontée depuis les années 1980 dans les pays riches a fragilisé cette idée.</p></div>' +
      '<p>Sur la période récente, l’Insee mesure une hausse modérée : l’indice de Gini des niveaux de vie passe de 0,274 en 1996 à 0,302 en 2024, son plus haut niveau depuis le début de la série.</p>' +
      '<div data-graph="r1-ineg"></div>' +
      '<h3>Le patrimoine, beaucoup plus inégal que le revenu</h3><div data-graph="r1-patri"></div>' +
      '<p>Début 2021, la moitié la moins dotée des ménages détient 8 % du patrimoine brut ; les 10 % les mieux dotés possèdent au moins 716 300 euros, les 10 % les moins dotés moins de 4 400 euros, soit un rapport D9/D1 d’environ 160 (calcul du site). L’indice de Gini du patrimoine brut (hors biens durables) atteint 0,662, contre 0,294 pour le niveau de vie en 2021 ; il était de 0,639 en 1998 (Insee). La hausse des prix de l’immobilier depuis le début des années 2000 a creusé l’écart entre propriétaires et non-propriétaires.</p>' +
      '<h3>Des inégalités multiformes et cumulatives</h3>' +
      '<div data-chain="r1-cumul"></div>' +
      '<div class="ex"><p>Santé : selon l’Insee (Insee Première n° 1687, 2018), l’espérance de vie à la naissance des hommes parmi les 5 % les plus aisés dépasse de 13 ans celle des 5 % les plus modestes (8 ans pour les femmes). École : 53,7 % des élèves de classes préparatoires sont enfants de cadres (voir <a href="#s2">S2</a>). Logement, emploi, patrimoine, réseau : les avantages s’additionnent.</p></div>' },

    { id: "r1-2", t: "Mesurer les inégalités : outils statiques et dynamiques", h:
      '<h3>1. Les rapports inter-quantiles</h3><p>On range la population par revenu croissant et on la découpe en dix (déciles) ou en cinq (quintiles). En 2024 (niveau de vie annuel par unité de consommation, Insee) : D1 = 13 970 €, médiane = 26 740 €, D9 = 48 580 €.</p><ul><li><b>D9/D1 = 3,48</b> : le seuil des 10 % les plus aisés est 3,48 fois plus élevé que le plafond des 10 % les plus modestes. C’est un rapport de <b>seuils</b>.</li><li><b>(100 − S80)/S20 = 4,62</b> : les 20 % les plus aisés perçoivent une masse de niveaux de vie 4,62 fois plus élevée que les 20 % les plus modestes. C’est un rapport de <b>masses</b> (parts du total).</li></ul>' +
      '<div class="attn"><p>Ces rapports ignorent ce qui se passe à l’intérieur des déciles extrêmes : D9/D1 ne bouge pas si les revenus des 1 % les plus riches doublent. D’où l’intérêt du top 1 %.</p></div>' +
      '<h3>2. La courbe de Lorenz et le coefficient de Gini</h3><div data-anim="r1-lorenz"></div>' +
      '<div class="def"><b>Courbe de Lorenz</b> — courbe qui associe à chaque part cumulée de la population, rangée du plus modeste au plus aisé (en abscisse), la part cumulée des revenus qu’elle reçoit (en ordonnée). L’égalité parfaite est la diagonale.</div>' +
      '<div class="def"><b>Coefficient (indice) de Gini</b> — rapport entre la surface comprise entre la diagonale et la courbe de Lorenz, et la surface totale sous la diagonale. Il vaut 0 en cas d’égalité parfaite et 1 si une seule personne reçoit tout.</div>' +
      '<p>En 2024, les 20 % les plus modestes perçoivent 8,4 % de la masse des niveaux de vie, les 50 % les plus modestes 30,1 %, et les 10 % les plus aisés 24,9 % (Insee). Gini : 0,302. Le Gini résume toute la distribution, mais deux courbes qui se croisent peuvent avoir le même Gini.</p>' +
      '<h3>3. Le top 1 %</h3><p>La <b>part du revenu (ou du patrimoine) détenue par le 1 % le plus aisé</b> mesure la concentration tout en haut. Elle s’appuie sur les données fiscales, plus fiables que les enquêtes pour les très hauts revenus. C’est elle qui révèle la courbe en U du siècle (section 1).</p>' +
      '<h3>4. Un outil dynamique : la corrélation des revenus parents-enfants</h3><p>Les outils précédents sont des photographies. Pour savoir si les inégalités se <b>transmettent</b>, on mesure le lien entre le revenu des parents et celui des enfants devenus adultes : coefficient de <b>corrélation</b> (ou élasticité) entre les rangs ou les revenus. 0 : le revenu des enfants ne dépend pas de celui des parents ; 1 : il en dépend entièrement.</p>' +
      '<div class="ex"><p>Pour les enfants nés entre 1972 et 1981, la corrélation entre le rang de revenu des parents et celui des enfants est de 0,30 en France, contre 0,34 aux États-Unis ; 9,7 % des enfants des 20 % de familles les plus modestes atteignent les 20 % les plus aisés, environ quatre fois moins que les enfants des familles les plus aisées (Gustave Kenedi et Louis Sirugue, note IPP n° 95, 2023). L’OCDE (<i>Un ascenseur social en panne ?</i>, 2018) estimait qu’il faudrait six générations à une famille modeste française pour atteindre le revenu moyen, contre quatre et demie en moyenne dans l’OCDE.</p></div>' +
      '<div class="attn"><p>Une corrélation n’est pas une causalité : elle mesure un lien statistique, sans dire s’il passe par l’héritage, l’école, le réseau ou le lieu de vie (voir la mobilité sociale en <a href="#s3">S3</a>).</p></div>' },

    { id: "r1-3", t: "Égalité des droits, des chances, des situations", h:
      '<div class="def"><b>Égalité des droits</b> — tous les individus sont soumis aux mêmes règles et disposent des mêmes droits civils et politiques. « Les hommes naissent et demeurent libres et égaux en droits » (Déclaration des droits de l’homme et du citoyen, 1789, article 1<sup>er</sup>).</div>' +
      '<div class="ex"><p>Le suffrage universel étendu aux femmes (1944), l’égalité de tous devant l’impôt et la justice, l’interdiction des discriminations à l’embauche.</p></div>' +
      '<div class="def"><b>Égalité des chances</b> — chacun doit avoir les mêmes possibilités d’accéder aux positions sociales, quelle que soit son origine : les inégalités de résultat sont acceptées si elles reflètent le mérite (talent, effort).</div>' +
      '<div class="ex"><p>Bourses sur critères sociaux, éducation prioritaire, conventions d’éducation prioritaire de Sciences Po (2001) : on corrige les handicaps de départ sans égaliser les arrivées.</p></div>' +
      '<div class="def"><b>Égalité des situations (ou des positions, des résultats)</b> — réduction des écarts de conditions de vie réelles entre les individus : revenus, logement, santé.</div>' +
      '<div class="ex"><p>Le salaire minimum, les minima sociaux, la gratuité des soins essentiels réduisent directement les écarts de situation.</p></div>' +
      '<div class="aut"><span class="mono">FD</span><span class="an">François Dubet<small><i>Les Places et les chances</i>, 2010</small></span><span class="ad">Deux conceptions de la justice sociale s’opposent : l’<b>égalité des places</b> (réduire les écarts entre les positions) et l’<b>égalité des chances</b> (permettre à chacun d’accéder à toutes les positions). Dubet défend la priorité de la première : plus les places sont proches, plus les chances sont égales.</span></div>' +
      '<div class="cle"><p>Les trois formes ne s’excluent pas, mais elles entrent en tension : l’égalité des situations peut limiter certaines libertés (impôt) ; l’égalité des chances peut légitimer de fortes inégalités de résultat (« méritocratie »).</p></div>' },

    { id: "r1-4", t: "Quatre conceptions de la justice sociale", h:
      '<p class="lede">La <b>justice sociale</b> désigne la répartition jugée juste des ressources et des positions dans une société. Chaque conception dit quelles inégalités sont acceptables.</p>' +
      '<h3>1. L’utilitarisme</h3><div class="aut"><span class="mono">JB</span><span class="an">Jeremy Bentham et John Stuart Mill<small>1789 ; <i>L’Utilitarisme</i>, 1861</small></span><span class="ad">Est juste ce qui maximise la <b>somme des utilités</b> (le bien-être total) : « le plus grand bonheur du plus grand nombre ».</span></div><p>Les inégalités sont acceptables si elles augmentent le bien-être total. Comme un euro de plus compte davantage pour un pauvre que pour un riche (utilité marginale décroissante), l’utilitarisme peut justifier une redistribution ; mais il peut aussi accepter le sacrifice d’une minorité si la somme augmente.</p>' +
      '<h3>2. Le libertarisme</h3><div class="aut"><span class="mono">RN</span><span class="an">Robert Nozick<small><i>Anarchie, État et utopie</i>, 1974</small></span><span class="ad">Une répartition est juste si les biens ont été <b>acquis</b> et <b>transmis</b> de façon juste (travail, échange libre, don), quel que soit le résultat. L’impôt redistributif est une atteinte aux droits de propriété ; seul un <b>État minimal</b> (police, justice, défense) est légitime.</span></div><p>Friedrich Hayek parle du « mirage de la justice sociale » (1976) : le marché n’est l’œuvre de personne, ses résultats ne peuvent être dits justes ou injustes. Seule compte l’<b>égalité des droits</b> ; toutes les inégalités de situation issues d’échanges libres sont acceptables.</p>' +
      '<h3>3. L’égalitarisme libéral</h3><div class="aut"><span class="mono">JR</span><span class="an">John Rawls<small><i>Théorie de la justice</i>, 1971</small></span><span class="ad">Placés sous un <b>voile d’ignorance</b>, des individus rationnels choisiraient deux principes : 1) des <b>libertés de base égales</b> pour tous ; 2) des inégalités économiques et sociales acceptables seulement si a) elles sont attachées à des positions ouvertes à tous selon une <b>juste égalité des chances</b> et b) elles profitent aux plus défavorisés (<b>principe de différence</b>).</span></div><div data-chain="r1-rawls"></div><div class="ex"><p>Un salaire élevé pour un chirurgien est juste, selon Rawls, s’il est nécessaire pour que des personnes se forment à ce métier long et difficile, et si les plus modestes en bénéficient (soins de qualité accessibles à tous).</p></div>' +
      '<div class="plus"><p>Amartya Sen (prix Nobel 1998, <i>Repenser l’inégalité</i>, 1992) propose d’égaliser les <b>capabilités</b> : les libertés réelles de faire et d’être (se soigner, s’instruire, participer). Deux personnes avec le même revenu n’ont pas les mêmes capabilités si l’une est handicapée.</p></div>' +
      '<h3>4. L’égalitarisme strict</h3><p>La justice exige l’<b>égalité des situations</b> : toute inégalité de revenu ou de condition est suspecte. Gracchus Babeuf et la Conjuration des Égaux (1796) réclamaient l’égalité réelle des biens ; Karl Marx formule le principe « de chacun selon ses capacités, à chacun selon ses besoins » (<i>Critique du programme de Gotha</i>, 1875).</p>' +
      '<div data-anim="r1-voile"></div>' +
      '<div class="tbl"><table><thead><tr><th>Conception</th><th>Égalité visée</th><th>Inégalités acceptées</th><th>Rôle de l’État</th></tr></thead><tbody>' +
      '<tr><td><b>Utilitarisme</b></td><td>Aucune en soi : maximiser le bien-être total</td><td>Celles qui augmentent la somme des utilités</td><td>Variable, selon ce qui maximise le bien-être</td></tr>' +
      '<tr><td><b>Libertarisme</b> (Nozick, Hayek)</td><td>Droits</td><td>Toutes celles issues d’acquisitions et d’échanges libres</td><td>Minimal</td></tr>' +
      '<tr><td><b>Égalitarisme libéral</b> (Rawls)</td><td>Droits et chances</td><td>Celles qui profitent aux plus défavorisés</td><td>Garantir les libertés, l’égalité des chances, redistribuer</td></tr>' +
      '<tr><td><b>Égalitarisme strict</b></td><td>Situations</td><td>Aucune, ou très peu</td><td>Très étendu</td></tr></tbody></table></div>' },

    { id: "r1-5", t: "L’action des pouvoirs publics : instruments, financement, débats", h:
      '<h3>Quatre instruments</h3><ul>' +
      '<li><b>La fiscalité</b>. Un impôt <b>progressif</b> prélève une part plus élevée des revenus élevés (impôt sur le revenu, créé par la loi du 15 juillet 1914 ; droits de succession). Un impôt <b>proportionnel</b> prélève le même taux (CSG, 1991). Un impôt est dit <b>régressif</b> quand il pèse proportionnellement plus sur les modestes : la TVA, car ils consomment une plus grande part de leur revenu.</li>' +
      '<li><b>La protection sociale</b>, créée sous sa forme actuelle en 1945. Logique d’<b>assurance</b> (cotisations, prestations liées aux cotisations : retraites, chômage) et d’<b>assistance</b> (prestations sous conditions de ressources, financées par l’impôt : RSA, prime d’activité, minimum vieillesse). Les prestations sociales représentent 31,9 % du PIB en 2024 (Drees).</li>' +
      '<li><b>Les services collectifs</b> : école, hôpital, transports, culture, gratuits ou peu chers. Ils agissent comme un revenu en nature, qui profite relativement plus aux ménages modestes.</li>' +
      '<li><b>La lutte contre les discriminations</b> : interdiction légale (le Défenseur des droits, institué en 2011, peut être saisi), testings, mesures de discrimination positive (parité en politique, loi du 6 juin 2000 ; éducation prioritaire).</li></ul>' +
      '<div data-graph="r1-redis"></div><div data-chain="r1-redis"></div>' +
      '<div class="ex"><p>Une vaste campagne de testing (2 400 offres d’emploi, plus de 2 200 entreprises de toutes tailles, 12 métiers, de décembre 2019 à avril 2021) a montré qu’à profil identique, les candidatures dont l’identité suggère une origine maghrébine sont rappelées 22,8 fois sur 100, contre 33,3 fois pour les candidatures à consonance française, soit environ 31,5 % de rappels en moins (Dares Analyses n° 67, novembre 2021).</p></div>' +
      '<h3>La contrainte de financement</h3><p>Ces politiques coûtent cher : les prélèvements obligatoires (impôts et cotisations sociales) atteignent 43,6 % du PIB en 2025 et le déficit public 5,1 % du PIB (Insee). Toute dépense nouvelle exige des recettes nouvelles, des économies ailleurs ou de la dette.</p>' +
      '<h3>Trois débats</h3>' +
      '<p><b>L’efficacité</b> : réduit-on vraiment les inégalités ? La redistribution divise le rapport D9/D1 par 1,7 en 2024. Mais une partie des personnes éligibles ne demandent pas les aides : selon la Drees, environ un tiers des foyers éligibles au RSA ne le perçoivent pas (<b>non-recours</b>). Et les prestations universelles profitent aussi aux aisés.</p>' +
      '<p><b>La légitimité</b> : le <b>consentement à l’impôt</b> est au cœur de la démocratie (article 14 de la Déclaration de 1789 : les citoyens ont le droit de constater la nécessité de la contribution publique et de la « consentir librement »). Il s’affaiblit quand l’impôt paraît injuste ou inutile : le mouvement des gilets jaunes est né en novembre 2018 du refus d’une hausse de la fiscalité sur les carburants.</p>' +
      '<p><b>Les effets pervers</b> : des prélèvements trop élevés ou des aides mal conçues peuvent décourager le travail ou l’investissement.</p><div data-chain="r1-pervers"></div>' +
      '<div class="plus"><p>La « courbe de Laffer » (économiste américain Arthur Laffer, années 1970) illustre l’idée que « trop d’impôt tue l’impôt » : au-delà d’un certain taux, les recettes baissent. Le niveau de ce taux fait débat parmi les économistes.</p></div>' +
      '<div class="cle"><p>Ces débats renvoient aux conceptions de la justice : un libertarien juge la redistribution illégitime ; un rawlsien l’accepte tant qu’elle améliore le sort des plus défavorisés, y compris en tenant compte des effets incitatifs ; un égalitariste strict la juge insuffisante.</p></div>' }
  ],
  pieges: [
    { f: "« D9/D1 = 3,48 : les 10 % les plus riches gagnent 3,48 fois plus que les 10 % les plus pauvres. »", v: "C’est un rapport de <b>seuils</b> : le plancher des 10 % les plus aisés est 3,48 fois le plafond des 10 % les plus modestes. Le rapport des <b>masses</b> serait bien plus élevé." },
    { f: "« Un Gini de 0,302 signifie que 30,2 % de la population est pauvre. »", v: "Le Gini mesure la <b>concentration</b> de toute la distribution (0 = égalité, 1 = un seul reçoit tout). Le taux de pauvreté est un autre indicateur (15,4 % en 2024)." },

  retenir:
    '<h3>Définitions</h3><ul>' +
    '<li><b>Inégalités</b> : économiques (revenu, patrimoine) et sociales (école, santé, logement…), <b>multiformes</b> et <b>cumulatives</b>.</li>' +
    '<li><b>Tendance</b> : U au XX<sup>e</sup> siècle (top 1 % ≈ un cinquième des revenus avant 1914, &lt; 8 % en 1983, &gt; 12 % en 2007 ; Piketty, r &gt; g).</li>' +
    '<li><b>Outils</b> : D9/D1 (seuils), (100 − S80)/S20 (masses), courbe de Lorenz, Gini (0 à 1), top 1 %, corrélation des revenus parents-enfants (France : 0,30).</li>' +
    '<li><b>Égalités</b> : des droits (DDHC, art. 1), des chances (mérite), des situations (conditions réelles). Dubet : places contre chances.</li>' +
    '<li><b>Conceptions</b> : utilitarisme (Bentham, Mill : maximiser le bien-être total) ; libertarisme (Nozick 1974, Hayek : droits de propriété, État minimal) ; égalitarisme libéral (Rawls 1971 : voile d’ignorance, libertés égales, égalité équitable des chances, principe de différence ; Sen : capabilités) ; égalitarisme strict (égalité des situations).</li>' +

    '<h3>Chiffres à citer</h3><ul><li>Niveau de vie 2024 : D9/D1 = 3,48 ; S80/S20 = 4,62 ; Gini 0,302 ; avant redistribution D9/D1 = 5,89, Gini 0,378 (Insee).</li><li>Patrimoine 2021 : la moitié la moins dotée détient 8 % ; D1 4 400 €, D9 716 300 € ; Gini 0,662.</li><li>Prélèvements obligatoires 43,6 % du PIB (2025) ; prestations sociales 31,9 % du PIB (2024).</li></ul>',

  bac: [
    { type: "Savoir-faire", origine: "Exercice inventé pour le site, données Insee", t: "Lire une courbe de Lorenz et des rapports inter-quantiles", enonce:
      '<p>En 2024 (Insee), les 20 % de personnes les plus modestes perçoivent 8,4 % de la masse des niveaux de vie, les 50 % les plus modestes 30,1 %, les 80 % les plus modestes 61,2 % et les 90 % les plus modestes 75,1 %.</p><ol><li>Quelle part de la masse perçoivent les 20 % les plus aisés ? les 10 % les plus aisés ?</li><li>Calcule le rapport (100 − S80)/S20 et rédige une phrase.</li><li>Place ces points sur une courbe de Lorenz : où se situent-ils par rapport à la diagonale ?</li></ol>',
      corrige: '<ol><li>Les 20 % les plus aisés : 100 − 61,2 = 38,8 % ; les 10 % les plus aisés : 100 − 75,1 = 24,9 %.</li><li>38,8 ÷ 8,4 ≈ 4,62. « En 2024, selon l’Insee, les 20 % de personnes les plus aisées perçoivent une masse de niveaux de vie 4,62 fois plus élevée que les 20 % les plus modestes. »</li><li>Points (20 ; 8,4), (50 ; 30,1), (80 ; 61,2), (90 ; 75,1) : tous sous la diagonale (qui passerait par (20 ; 20), (50 ; 50)…), ce qui traduit une répartition inégale. L’écart à la diagonale est le plus grand vers le milieu de la distribution (50 − 30,1 ≈ 20 points).</li></ol>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet inventé pour le site", t: "Distinguez égalité des chances et égalité des situations.", enonce: "<p>Sans document. Rappel : cette question n’est pas évaluée à l’écrit en 2027 ; l’exercice entraîne la méthode.</p>",
      corrige: '<div class="copie"><p>L’égalité est un idéal des sociétés démocratiques, mais elle peut porter sur des objets différents.</p><p>L’égalité des chances vise à donner à chacun les mêmes possibilités d’accéder aux différentes positions sociales, quelle que soit son origine. Elle accepte les inégalités de résultat si elles reflètent le mérite, c’est-à-dire le talent et l’effort. Les bourses sur critères sociaux ou l’éducation prioritaire en sont des exemples : on corrige les handicaps de départ, sans égaliser les arrivées. Elle se mesure par exemple par la corrélation des revenus parents-enfants, de 0,30 en France.</p><p>L’égalité des situations vise au contraire à réduire directement les écarts de conditions de vie réelles : revenus, logement, santé. Le salaire minimum, les minima sociaux ou la gratuité des soins y contribuent. La redistribution réduit ainsi le rapport D9/D1 des niveaux de vie de 5,89 à 3,48 en 2024 selon l’Insee.</p><p>Les deux se complètent mais peuvent s’opposer : François Dubet montre que plus les places sont inégales, plus la compétition pour y accéder est rude, ce qui rend l’égalité des chances plus difficile à atteindre.</p></div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice inventé pour le site, document Insee", t: "Ce que change la redistribution", enonce:
      '<p>Document : le graphique « Ce que change la redistribution, 2024 » du <a href="#r1:r1-5">cours</a> (Insee).</p><ol><li>Présentez l’effet de la redistribution sur le rapport D9/D1. (2 points)</li><li>À l’aide du document et de vos connaissances, montrez que l’action des pouvoirs publics réduit les inégalités mais fait l’objet de débats. (4 points)</li></ol>',
      corrige: '<ol><li>Selon l’Insee, en 2024, avant redistribution, le niveau de vie plancher des 10 % les plus aisés est 5,89 fois plus élevé que le plafond des 10 % les plus modestes ; après impôts directs et prestations sociales, ce rapport n’est plus que de 3,48 : il est divisé par 1,7 environ.</li><li>La redistribution réduit les inégalités par des prélèvements progressifs (impôt sur le revenu), des prestations sous conditions de ressources (RSA, prime d’activité, aides au logement) et des services collectifs gratuits. Le rapport des masses (100 − S80)/S20 passe ainsi de 8,37 à 4,62. Mais elle fait débat. Son <b>efficacité</b> est limitée par le non-recours (fin 2021, 33 à 37 % des foyers éligibles au RSA ne le percevaient pas, selon la Drees) et par des impôts régressifs comme la TVA. Sa <b>légitimité</b> dépend du consentement à l’impôt, mis à l’épreuve par les gilets jaunes en 2018, dans un pays où les prélèvements obligatoires atteignent 43,6 % du PIB (2025). Enfin, elle peut avoir des <b>effets pervers</b> : des taux marginaux élevés ou des aides qui diminuent quand on reprend un emploi peuvent décourager le travail, d’où la création de la prime d’activité en 2016.</li></ol>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet inventé pour le site", t: "Toutes les inégalités sont-elles injustes ?", enonce: "<p>Construis la problématique et le plan, puis compare. Rappel : question non évaluée à l’écrit en 2027 ; sujet utile pour le Grand oral.</p>",
      corrige: '<p><b>Problématique.</b> Les inégalités de revenu et de patrimoine ont augmenté depuis les années 1980 (Gini 0,302 en 2024). Mais juger qu’une inégalité est injuste suppose un critère de justice : selon la conception retenue, certaines inégalités sont acceptables, d’autres non.</p><p><b>I. Certaines inégalités peuvent être jugées justes</b><br>A. Libertarisme : inégalités issues d’échanges libres et d’acquisitions justes (Nozick, Hayek).<br>B. Utilitarisme : inégalités qui augmentent le bien-être total (incitations à innover, à se former).<br>C. Égalitarisme libéral : inégalités qui profitent aux plus défavorisés et sont ouvertes à tous (Rawls).</p><p><b>II. Mais beaucoup d’inégalités sont injustes</b><br>A. Elles ne reflètent pas le mérite : corrélation parents-enfants de 0,30, 9,7 % seulement des enfants modestes atteignent le haut (Kenedi et Sirugue) ; discriminations (testing).<br>B. Elles sont cumulatives : patrimoine (8 % pour la moitié la moins dotée), santé (13 ans d’espérance de vie).<br>C. Elles menacent la cohésion et les capabilités (Sen) ; égalitarisme strict.</p><p><b>III. D’où une action publique, elle-même débattue</b><br>A. Fiscalité, protection sociale, services collectifs, lutte contre les discriminations (D9/D1 de 5,89 à 3,48).<br>B. Sous contrainte de financement et de légitimité (43,6 % du PIB de prélèvements, consentement à l’impôt).<br>C. Avec un risque d’effets pervers (désincitations) qu’il faut limiter.</p>' }
  ]
};

  rendu: function (A, i, p) {
    var X0 = 38, Y0 = 268, S = 200, s = "";
    var X = function (v) { return X0 + S * v / 100; }, Y = function (v) { return Y0 - S * v / 100; };
    function courbeRev(r) { var tot = r.reduce(function (a, b) { return a + b; }, 0), c = 0, pts = [[0, 0]]; r.forEach(function (v, k) { c += v; pts.push([20 * (k + 1), 100 * c / tot]); }); return pts; }
    var FR = [[0, 0], [20, 8.4], [40, 21.9], [50, 30.1], [80, 61.2], [90, 75.1], [100, 100]];
    function val(pts, x) { for (var k = 1; k < pts.length; k++) if (x <= pts[k][0]) { var a = pts[k - 1], b = pts[k]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]); } return 100; }
    var ets = this.etapes;

      '<div class="def"><b>Problème public</b> — situation que des acteurs ont réussi à faire reconnaître comme problématique et comme relevant de l’action des pouvoirs publics. Un problème n’est pas « public » par nature : il le devient par un travail de mobilisation et de définition.</div>' +
      '<div class="def"><b>Mise à l’agenda politique</b> — processus par lequel un problème entre dans la liste des sujets que les pouvoirs publics examinent et sur lesquels ils décident.</div>' +
      '<div data-chain="r2-agenda"></div>' +
      '<div class="tbl"><table><thead><tr><th>Acteur</th><th>Rôle</th><th>Exemple</th></tr></thead><tbody>' +
      '<tr><td><b>Experts, scientifiques</b></td><td>Établir les faits, alerter</td><td>Le GIEC, créé en 1988, synthétise l’état des connaissances sur le climat dans des rapports réguliers.</td></tr>' +
      '<tr><td><b>ONG</b></td><td>Alerter, mobiliser, plaider, poursuivre en justice</td><td>« L’Affaire du siècle » : quatre associations attaquent l’État ; le tribunal administratif de Paris reconnaît sa faute le 3 février 2021.</td></tr>' +
      '<tr><td><b>Mouvements citoyens</b></td><td>Rendre le problème visible, faire pression</td><td>Grève scolaire de Greta Thunberg (août 2018), puis marches pour le climat de 2019 dans de nombreux pays.</td></tr>' +
      '<tr><td><b>Partis</b></td><td>Porter le problème dans la compétition électorale</td><td>Partis écologistes ; reprise du thème par les autres partis.</td></tr>' +
      '<tr><td><b>Entreprises</b></td><td>Innover, mais aussi défendre leurs intérêts (lobbying)</td><td>Secteurs émetteurs qui freinent certaines normes ; entreprises qui investissent dans les technologies propres.</td></tr>' +
      '<tr><td><b>Pouvoirs publics</b></td><td>Décider, légiférer, négocier</td><td>Convention citoyenne pour le climat (150 citoyens tirés au sort, 2019-2020), suivie de la loi Climat et résilience du 22 août 2021.</td></tr>' +
      '</tbody></table></div>' +
      '<p>Ces acteurs <b>coopèrent</b> (scientifiques et ONG qui s’appuient les uns sur les autres, entreprises associées à des politiques publiques) et <b>s’opposent</b> (ONG contre l’État en justice, lobbies contre réglementations, mouvements sociaux contre une taxe jugée injuste).</p>' +
      '<div class="ex src"><p>Le livre de la biologiste Rachel Carson, <i>Silent Spring</i> (1962), sur les effets des pesticides, a joué un grand rôle dans la mise à l’agenda des questions environnementales aux États-Unis ; le DDT y est interdit pour l’agriculture en 1972. Exemple historique, hors des documents du programme.</p></div>' +
      '<div class="ex"><p>Le sujet de dissertation du bac 2026 (jour 1) : « Comment les questions environnementales peuvent-elles devenir un problème public ? ». Plan corrigé dans l’onglet <a href="#r2/bac">Sujets bac</a>.</p></div>' },

    { id: "r2-2", t: "Une action publique à plusieurs échelles", h:
      '<div class="tbl"><table><thead><tr><th>Échelle</th><th>Exemples d’action</th></tr></thead><tbody>' +
      '<tr><td><b>Mondiale</b></td><td>Convention-cadre des Nations unies sur les changements climatiques (Rio, 1992) ; protocole de Kyoto (1997) ; accord de Paris (2015) : limiter le réchauffement « nettement en dessous de 2 °C » et poursuivre les efforts pour 1,5 °C ; conférences annuelles (COP).</td></tr>' +
      '<tr><td><b>Européenne</b></td><td>Système d’échange de quotas d’émission (SEQE, 2005) ; loi européenne sur le climat (2021) : −55 % d’émissions nettes en 2030 par rapport à 1990 et neutralité climatique en 2050 ; mécanisme d’ajustement carbone aux frontières.</td></tr>' +
      '<tr><td><b>Nationale</b></td><td>Stratégie nationale bas-carbone ; Haut Conseil pour le climat ; taxe carbone ; MaPrimeRénov’ ; loi Climat et résilience (2021).</td></tr>' +
      '<tr><td><b>Locale</b></td><td>Plans climat-air-énergie territoriaux des intercommunalités ; transports en commun, pistes cyclables, rénovation des bâtiments publics.</td></tr>' +
      '</tbody></table></div>' +
      '<p>Ces échelles <b>s’emboîtent</b> : l’accord de Paris fixe un objectif mondial, l’Union le traduit en objectifs pour ses États, la France en budgets carbone par secteur, et les collectivités les mettent en œuvre sur le terrain. Elles peuvent aussi entrer en <b>tension</b> : les engagements nationaux sont volontaires, une commune peut aller plus loin que l’État, une règle européenne peut être contestée localement.</p>' +
      '<div class="ex"><p>La France vise −50 % d’émissions brutes en 2030 par rapport à 1990 ; selon le Citepa, ses émissions ont baissé de 34,3 % entre 1990 et 2025 (359,4 millions de tonnes équivalent CO₂ en 2025). Le rythme de baisse doit s’accélérer pour atteindre l’objectif.</p></div>' },

    { id: "r2-3", t: "Les instruments face aux externalités négatives", h:
      '<div class="def"><b>Externalité négative</b> — effet défavorable de l’activité d’un agent sur d’autres agents, sans compensation monétaire. Les émissions de gaz à effet de serre en sont l’exemple type : celui qui émet ne paie pas les dommages du réchauffement.</div>' +
      '<div data-chain="r2-externalite"></div>' +
      '<h3>1. La réglementation</h3><p>Interdire ou imposer des normes : normes d’émission des véhicules, interdiction d’installer des chaudières neuves au fioul ou au charbon en France depuis le 1er juillet 2022, normes de performance énergétique des bâtiments.<br><b>Avantage</b> : efficace et simple à comprendre quand le danger est grave. <b>Limites</b> : coûts de contrôle ; même effort exigé de tous, même de ceux pour qui réduire coûte très cher ; pas d’incitation à faire mieux que la norme.</p>' +
      '<h3>2. La taxation</h3><div class="aut"><span class="mono">AP</span><span class="an">Arthur Cecil Pigou<small>1877-1959</small></span><span class="ad"><i>The Economics of Welfare</i> (1920) : une taxe égale au dommage causé fait « internaliser » l’externalité : le pollueur paie le coût social de son activité. C’est la <b>taxe pigouvienne</b>, à l’origine du principe pollueur-payeur.</span></div>' +
      '<div data-chain="r2-taxe"></div>' +
      '<p><b>Avantage</b> : chacun réduit ses émissions là où c’est le moins coûteux pour lui ; recettes publiques. <b>Limites</b> : on ne sait pas à l’avance de combien les émissions baisseront ; la taxe pèse davantage sur les ménages modestes et ruraux ; elle doit être acceptée.</p>' +
      '<div class="ex"><p>En France, la composante carbone des taxes sur l’énergie est créée en 2014 ; elle atteint 44,6 € par tonne de CO₂ en 2018. La hausse prévue pour 2019 est abandonnée après le mouvement des Gilets jaunes, parti le 17 novembre 2018 d’une contestation de la hausse des prix des carburants.</p></div>' +
      '<h3>3. Le marché de quotas d’émission</h3><p>L’autorité fixe un <b>plafond</b> total d’émissions et distribue ou vend des <b>quotas</b> (droits d’émettre une tonne). Les entreprises qui réduisent facilement leurs émissions revendent leurs quotas à celles pour qui c’est plus coûteux. L’idée vient de John H. Dales (1968), dans le prolongement de Ronald Coase (1960).</p>' +
      '<div data-anim="r2-quotas"></div>' +
      '<p><b>Avantage</b> : la quantité totale d’émissions est garantie ; la réduction se fait au moindre coût. <b>Limites</b> : le prix peut être trop bas si trop de quotas sont distribués (le prix du SEQE est resté longtemps très faible avant les réformes de la fin des années 2010) ; prix instable ; risque de <b>fuites de carbone</b> (production déplacée vers des pays sans contrainte), d’où le mécanisme d’ajustement carbone aux frontières de l’Union, dans sa phase définitive depuis le 1er janvier 2026.</p>' +
      '<h3>4. La subvention à l’innovation verte</h3><p>Financer la recherche et la diffusion de technologies propres (énergies renouvelables, rénovation thermique, véhicules électriques) : MaPrimeRénov’ depuis 2020 en France. <b>Avantage</b> : corrige une autre défaillance, le sous-investissement privé dans l’innovation (les connaissances se diffusent, <a href="#e1:e1-3">É1</a>) ; politiquement plus facile qu’une taxe. <b>Limites</b> : coût pour les finances publiques ; effets d’aubaine ; risque d’effet rebond (<a href="#e1:e1-6">É1</a>).</p>' +
      '<h3>Les dysfonctionnements de l’action publique</h3><ul><li><b>Problèmes d’acceptabilité</b> : l’écotaxe poids lourds, votée en 2009, est abandonnée en 2014 après la mobilisation des « Bonnets rouges » en Bretagne.</li><li><b>Influence des groupes d’intérêt</b> (lobbying) qui obtiennent exemptions ou délais.</li><li><b>Horizon court</b> des responsables politiques face à un problème de long terme.</li><li><b>Inefficacité ou injustice</b> : des mesures mal ciblées pèsent sur les plus modestes sans réduire fortement les émissions.</li></ul>' },

    { id: "r2-4", t: "Bien commun, passager clandestin et inégalités de développement", h:
      '<div class="def"><b>Bien commun</b> — bien <b>non excluable</b> (on ne peut empêcher personne d’en profiter) mais <b>rival</b> (l’usage par les uns réduit ce qui reste pour les autres). Le climat, les océans, la biodiversité en sont des exemples.</div>' +
      '<div class="aut"><span class="mono">GH</span><span class="an">Garrett Hardin<small>1915-2003</small></span><span class="ad">« La tragédie des biens communs » (<i>Science</i>, 1968) : chaque utilisateur d’un pâturage commun a intérêt à y mettre une bête de plus ; si tous le font, le pâturage est détruit. Sans règles, un bien commun est surexploité.</span></div>' +
      '<div class="aut"><span class="mono">EO</span><span class="an">Elinor Ostrom<small>1933-2012 · Nobel 2009</small></span><span class="ad"><i>Governing the Commons</i> (1990) : des communautés savent gérer durablement des biens communs (pêcheries, irrigation) grâce à des règles collectives, sans passer ni par l’État ni par le marché.</span></div>' +
      '<div class="def"><b>Passager clandestin</b> — agent qui profite d’un bien collectif sans contribuer à son coût. Dans les négociations climatiques, un pays profite des efforts des autres sans réduire lui-même ses émissions.</div>' +
      '<div data-anim="r2-passager"></div>' +
      '<div data-chain="r2-passager"></div>' +
      '<div class="ex"><p>Les États-Unis n’ont jamais ratifié le protocole de Kyoto. Ils ont quitté l’accord de Paris une première fois (retrait effectif en 2020), l’ont réintégré en 2021, puis s’en sont retirés de nouveau en janvier 2025, sur décision du président Trump, avec effet un an plus tard.</p></div>' +
      '<h3>Les inégalités de développement</h3>' +
      '<div data-graph="r2-ges"></div>' +
      '<p>Les pays riches ont émis l’essentiel des gaz accumulés depuis la révolution industrielle ; les pays émergents émettent aujourd’hui beaucoup (la Chine représente 32 % des émissions mondiales de CO₂ fossile en 2024) mais moins par habitant que les États-Unis ; les pays pauvres émettent peu et subissent fortement les effets du réchauffement. D’où le principe des « <b>responsabilités communes mais différenciées</b> » (Rio, 1992) et les demandes de financements :</p>' +
      '<ul><li>en 2009, les pays riches promettent 100 milliards de dollars par an de financements climatiques d’ici 2020 (objectif atteint en 2022 selon l’OCDE) ;</li><li>en 2024, la COP29 de Bakou fixe un objectif d’au moins 300 milliards de dollars par an d’ici 2035 ;</li><li>la COP28 (Dubaï, 2023) rend opérationnel un fonds pour les « pertes et dommages » subis par les pays vulnérables.</li></ul>' +
      '<div class="cle"><p><b>Pourquoi l’accord de Paris (2015) est différent :</b> au lieu d’objectifs imposés, chaque pays présente ses propres engagements (contributions déterminées au niveau national), révisés tous les cinq ans. Plus de pays participent, mais les engagements additionnés restent insuffisants pour tenir l’objectif de température : le problème du passager clandestin n’a pas disparu.</p></div>' +
      '<div class="ex"><p>Un succès souvent cité : le protocole de Montréal (1987) sur les gaz détruisant la couche d’ozone (CFC). Peu de producteurs, des substituts disponibles, un danger clairement identifié : la couche d’ozone est aujourd’hui en voie de reconstitution.</p></div>' }
  ],

    '<li><b>Externalité négative</b> ; instruments : <b>réglementation</b> (normes) ; <b>taxe</b> pigouvienne (Pigou, 1920) ; <b>marché de quotas</b> (plafond + échange ; Dales, 1968) ; <b>subvention à l’innovation verte</b>. Dysfonctionnements : acceptabilité (Gilets jaunes 2018, Bonnets rouges 2013-2014), lobbying, fuites de carbone.</li>' +
    '<li><b>Bien commun</b> (non excluable, rival) ; tragédie des communs (Hardin, 1968) ; Ostrom (1990) ; <b>passager clandestin</b> ; <b>responsabilités communes mais différenciées</b>.</li></ul>' +
    '<h3>Chiffres</h3><ul><li>France : GES −34,3 % de 1990 à 2025 (Citepa) ; taxe carbone 44,6 €/t depuis 2018.</li><li>Parts des émissions de CO₂ fossile 2024 : Chine 32 %, États-Unis 13 %, Inde 8 %, UE 6 % (Global Carbon Budget 2025).</li><li>Finance climat : 100 Md$/an promis en 2009 ; 300 Md$/an d’ici 2035 (COP29).</li></ul>',

  bac: [
    { type: "Savoir-faire", origine: "Exercice du site (exemple simplifié)", t: "Taxe ou quotas : calculer le coût d’une réduction", enonce: '<p>Deux usines émettent 60 tonnes chacune ; le plafond est de 100 tonnes. Réduire une tonne coûte 20 € à A et 60 € à B (coûts constants).</p><ol><li>Coût total si chacune réduit de 10 tonnes ?</li><li>Coût total si A réduit de 20 tonnes et B de 0 ?</li><li>À quel prix A et B ont-elles toutes deux intérêt à échanger 10 quotas ?</li></ol>',
      corrige: '<ol><li>10 × 20 + 10 × 60 = 200 + 600 = 800 €.</li><li>20 × 20 = 400 € : moitié moins cher pour le même résultat (100 tonnes).</li><li>Entre 20 et 60 € le quota : au-dessus de 20 €, A gagne à réduire plus pour vendre ; en dessous de 60 €, B gagne à acheter plutôt qu’à réduire. À 40 €, chacune gagne 200 € par rapport à la situation sans échange.</li></ol>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet inventé pour le site", t: "Montrez que la mise en œuvre des instruments de l’action publique pour l’environnement peut se heurter à des dysfonctionnements.", enonce: "<p>3,5 points, sans document.</p>",
      corrige: '<div class="copie"><p>Les pouvoirs publics disposent de plusieurs instruments pour réduire les externalités négatives sur l’environnement : réglementation, taxation, marchés de quotas et subventions. Leur mise en œuvre peut toutefois échouer.</p><p>D’abord, un problème d’acceptabilité sociale : une taxe carbone renchérit l’énergie et pèse davantage sur les ménages modestes et ruraux, qui dépendent de la voiture. En France, la hausse prévue de la taxe carbone pour 2019 a été abandonnée après le mouvement des Gilets jaunes, parti en novembre 2018 d’une contestation du prix des carburants ; de même, l’écotaxe poids lourds a été abandonnée en 2014 après la mobilisation des Bonnets rouges.</p><p>Ensuite, l’influence des groupes d’intérêt : des secteurs émetteurs obtiennent des exemptions, des délais ou une distribution généreuse de quotas gratuits. Sur le marché européen de quotas, l’excès de quotas a longtemps maintenu un prix très bas, qui n’incitait guère à réduire les émissions, jusqu’aux réformes de la fin des années 2010. Ces dysfonctionnements réduisent l’efficacité des instruments.</p></div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice du site, données Global Carbon Budget", t: "Qui émet le CO₂ fossile ?", enonce: '<p>Document : le graphique « Qui émet le CO₂ fossile dans le monde ? (2024) » dans <a href="#r2:r2-4">le cours</a>.</p><ol><li>Quelle part des émissions mondiales représentent ensemble les quatre émetteurs du document ?</li><li>À l’aide du document et de vos connaissances, montrez que les inégalités de développement compliquent les négociations climatiques.</li></ol>',
      corrige: '<ol><li>Selon le Global Carbon Budget 2025, en 2024, la Chine (32 %), les États-Unis (13 %), l’Inde (8 %) et l’Union européenne (6 %) représentent ensemble 59 % des émissions mondiales de CO₂ d’origine fossile.</li><li>Le document montre que les grands émetteurs actuels comprennent des pays émergents (Chine, Inde) et des pays riches (États-Unis, Union européenne). Les pays riches ont émis l’essentiel des gaz accumulés depuis la révolution industrielle : les émergents leur demandent donc de faire davantage d’efforts et refusent de freiner une croissance dont ils ont besoin pour réduire la pauvreté. Les pays pauvres, qui émettent peu, réclament des financements pour s’adapter. D’où le principe des responsabilités communes mais différenciées (Rio, 1992) et les négociations sur les financements (300 milliards de dollars par an d’ici 2035, COP29). Ces désaccords s’ajoutent à la tentation du passager clandestin : chaque pays attend que les autres agissent.</li></ol>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet officiel : bac 2026, jour 1 (France), dissertation · plan du site", officiel: true, t: "Comment les questions environnementales peuvent-elles devenir un problème public ?", enonce: "<p>Les documents du sujet officiel ne sont pas reproduits ici. « Comment » : plan explicatif.</p>",
      corrige: '<p><b>Problématique.</b> Une dégradation de l’environnement n’entre pas d’elle-même dans le débat politique. Par quels processus et grâce à quels acteurs une question environnementale est-elle reconnue comme un problème appelant l’action des pouvoirs publics ?</p><p><b>I. Des acteurs qui construisent le problème</b><br>A. Les experts établissent et diffusent les faits (GIEC depuis 1988 ; rapports, alertes).<br>B. Les ONG et les mouvements citoyens le rendent visible et mobilisent (marches pour le climat 2019, Affaire du siècle 2021).<br>C. Les médias et les partis le portent dans l’espace public et la compétition électorale.</p><p><b>II. Une mise à l’agenda qui passe par des conflits et des coopérations</b><br>A. Des intérêts opposés : entreprises et lobbies, contestations sociales (Gilets jaunes, 2018).<br>B. Des coopérations : experts et ONG, entreprises qui innovent, citoyens associés (Convention citoyenne 2019-2020).<br>C. Des fenêtres d’opportunité : catastrophes, COP, élections.</p><p><b>III. À plusieurs échelles, de la mise à l’agenda à l’action publique</b><br>A. Mondiale : Rio 1992, Paris 2015.<br>B. Européenne et nationale : SEQE, loi Climat et résilience 2021, taxe carbone.<br>C. Locale : plans climat des collectivités ; tensions entre échelles.</p>' }
  ]
};

  chapo: "Un fils d’ouvrier devient-il plus souvent cadre qu’il y a quarante ans ? La société française est-elle plus « ouverte » ? Pour répondre, les sociologues construisent des tables de mobilité. Ce chapitre apprend à les fabriquer, à les lire sans se tromper de sens, à distinguer mobilité observée et fluidité, et à expliquer la mobilité par la structure des emplois, l’École et la famille.",
  essentiel: [

    "La <b>table de mobilité</b> croise origine (catégorie du père ou de la mère) et position (catégorie de l’individu). On en tire une <b>table de destinée</b> (lecture en ligne : que deviennent les enfants d’une origine ?) et une <b>table de recrutement</b> (lecture en colonne : d’où viennent les membres d’un groupe ?).",

  notions: ["mobilité sociale", "mobilité intergénérationnelle", "mobilité intragénérationnelle (professionnelle)", "mobilité géographique", "mobilité verticale (ascendante, descendante)", "mobilité horizontale", "table de mobilité", "table de destinée", "table de recrutement", "autorecrutement", "mobilité observée", "mobilité structurelle", "fluidité sociale", "rapport des chances relatives (odds ratio)", "reproduction sociale", "déclassement", "paradoxe d’Anderson", "capital économique, culturel, social", "configurations familiales"],
  sections: [
    { id: "s3-1", t: "Trois mobilités à ne pas confondre", h:
      '<p class="lede">La <b>mobilité sociale</b> désigne le changement de position sociale d’un individu. Le sociologue Pitirim Sorokin a posé le cadre dès 1927 (<i>Social Mobility</i>) : on peut circuler entre les groupes de la hiérarchie sociale, vers le haut ou vers le bas.</p>' +
      '<div class="def"><b>Mobilité intergénérationnelle</b> — changement de position sociale d’un individu par rapport à celle de ses parents (en France, on compare souvent la catégorie socioprofessionnelle du fils ou de la fille à celle du père, et de plus en plus à celle de la mère).</div>' +
      '<div class="ex"><p>Une fille d’agricultrice exploitante devenue infirmière (profession intermédiaire) connaît une mobilité intergénérationnelle ascendante. En 2015, 19,1 % des filles d’agricultrices sont dans ce cas (Insee, FQP 2014-2015).</p></div>' +
      '<div class="def"><b>Mobilité intragénérationnelle (ou professionnelle)</b> — changement de position au cours de la vie active d’un même individu : promotion, changement de métier, passage du salariat à l’indépendance, chômage.</div>' +
      '<div class="ex"><p>Un technicien promu ingénieur après une formation continue passe de profession intermédiaire à cadre : mobilité professionnelle ascendante, sans rien dire de ses parents.</p></div>' +
      '<div class="def"><b>Mobilité géographique</b> — changement de lieu de résidence (d’une commune, d’une région ou d’un pays à l’autre).</div>' +
      '<p>Les trois se combinent souvent : quitter une région peu dynamique pour une métropole facilite l’accès à un emploi qualifié. Une étude de l’Institut des politiques publiques (Kenedi et Sirugue, note n° 95, 2023) montre que les enfants des familles les plus modestes qui partent vers un département à hauts revenus atteignent en moyenne à peu près le même rang dans l’échelle des revenus que les enfants dont les parents se situaient au 75<sup>e</sup> centile (à l’entrée du quart le plus aisé) et qui sont restés dans leur département.</p>' +
      '<h3>Le sens de la mobilité</h3><ul><li><b>Verticale ascendante</b> : position plus élevée que celle du parent (fils d’employé devenu cadre).</li><li><b>Verticale descendante</b> : position moins élevée (fille de cadre devenue employée) ; on parle de <b>déclassement</b>.</li><li><b>Horizontale</b> ou « non verticale » : changement de groupe sans hiérarchie nette, par exemple d’agriculteur à ouvrier qualifié, ou d’artisan à profession intermédiaire. L’Insee distingue ici une mobilité « de statut » (salarié / indépendant).</li><li><b>Immobilité</b> ou <b>reproduction sociale</b> : même groupe que le parent.</li></ul>' +
      '<div class="attn"><p>Une mobilité géographique ou professionnelle n’est pas une mobilité sociale intergénérationnelle. Dans une copie, nomme précisément la mobilité dont tu parles et l’<b>étalon</b> de comparaison (le père ? la mère ? le premier emploi ?).</p></div>' },

    { id: "s3-2", t: "Les tables de mobilité : construction, intérêts, limites", h:
      '<p class="lede">Une <b>table de mobilité</b> est un tableau à double entrée qui croise l’origine sociale (en ligne, en général) et la position sociale (en colonne) d’un ensemble d’individus.</p>' +
      '<h3>Comment l’Insee les construit</h3><p>Les tables françaises viennent de l’enquête <b>Formation et qualification professionnelle (FQP)</b> : 1964, 1970, 1977, 1985, 1993, 2003 et 2014-2015 (dernière publiée). On interroge des personnes de <b>35 à 59 ans</b>, en emploi ou anciennement en emploi : à cet âge, la position est en principe stabilisée. On leur demande leur profession et celle qu’exerçaient leur père et leur mère pendant leur jeunesse. On obtient d’abord une <b>table d’effectifs</b>, puis deux tables de pourcentages.</p>' +
      '<div data-anim="s3-table"></div>' +
      '<div class="tbl"><table><thead><tr><th>Lecture</th><th>Table de destinée</th><th>Table de recrutement</th></tr></thead><tbody>' +
      '<tr><td><b>Calcul</b></td><td>Chaque case ÷ total de sa <b>ligne</b> (origine)</td><td>Chaque case ÷ total de sa <b>colonne</b> (position)</td></tr>' +
      '<tr><td><b>Question</b></td><td>Que deviennent les enfants d’une origine donnée ?</td><td>D’où viennent les membres d’un groupe ?</td></tr>' +
      '<tr><td><b>Phrase type</b></td><td>« Sur 100 fils de cadres, 49 sont cadres. »</td><td>« Sur 100 cadres, environ 33 sont fils de cadres. »</td></tr>' +
      '<tr><td><b>Diagonale</b></td><td>Taux d’<b>immobilité</b> (reproduction)</td><td>Taux d’<b>autorecrutement</b></td></tr></tbody></table></div>' +
      '<h3>La table de destinée des hommes en 2015</h3>' +
      '<div class="tbl"><table><thead><tr><th>Père \\ fils (en %)</th><th class="n">Agri.</th><th class="n">Art., comm.</th><th class="n">Cadres</th><th class="n">Prof. int.</th><th class="n">Emp. et ouv. qualifiés</th><th class="n">Emp. et ouv. non qualifiés</th><th class="n">Total</th></tr></thead><tbody>' +
      '<tr><td>Agriculteurs exploitants</td><td class="n"><b>26,7</b></td><td class="n">7,9</td><td class="n">8,5</td><td class="n">20,4</td><td class="n">27,4</td><td class="n">9,1</td><td class="n">100</td></tr>' +
      '<tr><td>Artisans, commerçants, chefs d’entreprise</td><td class="n">0,9</td><td class="n"><b>20,6</b></td><td class="n">23,1</td><td class="n">23,8</td><td class="n">23,6</td><td class="n">7,9</td><td class="n">100</td></tr>' +
      '<tr><td>Cadres</td><td class="n">0,2</td><td class="n">7,9</td><td class="n"><b>49,0</b></td><td class="n">25,4</td><td class="n">13,7</td><td class="n">3,8</td><td class="n">100</td></tr>' +
      '<tr><td>Professions intermédiaires</td><td class="n">0,6</td><td class="n">7,8</td><td class="n">26,5</td><td class="n"><b>31,1</b></td><td class="n">26,2</td><td class="n">7,7</td><td class="n">100</td></tr>' +
      '<tr><td>Employés et ouvriers qualifiés</td><td class="n">0,6</td><td class="n">7,2</td><td class="n">12,7</td><td class="n">26,8</td><td class="n"><b>42,6</b></td><td class="n">10,1</td><td class="n">100</td></tr>' +
      '<tr><td>Employés et ouvriers non qualifiés</td><td class="n">0,6</td><td class="n">6,5</td><td class="n">8,3</td><td class="n">18,7</td><td class="n">43,9</td><td class="n"><b>22,1</b></td><td class="n">100</td></tr>' +
      '<tr><td><i>Ensemble des fils</i></td><td class="n">2,8</td><td class="n">9,1</td><td class="n">20,4</td><td class="n">25,3</td><td class="n">32,4</td><td class="n">10,1</td><td class="n">100</td></tr></tbody></table></div>' +
      '<p class="src-l">Source : Insee, enquête FQP 2014-2015, Insee Première n° 1739 (février 2019). Champ : France métropolitaine, hommes de 35 à 59 ans actifs occupés ou anciens actifs occupés. Lecture : en 2015, 49,0 % des fils de cadres sont eux-mêmes cadres.</p>' +
      '<div data-graph="s3-dest"></div>' +
      '<details class="pli"><summary>Calculer la table de recrutement à partir de la destinée (méthode et résultat)</summary><div>' +
      '<p>En 2015, les pères des hommes de 35 à 59 ans se répartissent ainsi : agriculteurs 8,3 %, artisans et commerçants 13,0 %, cadres 13,9 %, professions intermédiaires 15,9 %, employés et ouvriers qualifiés 35,6 %, non qualifiés 13,1 % (Insee). Pour 1 000 fils, il y a donc 139 fils de cadres, dont 49,0 % sont cadres : 139 × 0,49 ≈ 68 cadres fils de cadres. En faisant de même pour toute la colonne, on trouve environ 203 cadres sur 1 000 hommes. D’où : 68 ÷ 203 ≈ <b>33,5 %</b> des cadres sont fils de cadres.</p>' +
      '<div class="tbl"><table><thead><tr><th>Origine \\ position (recrutement, en %)</th><th class="n">Agri.</th><th class="n">Art., comm.</th><th class="n">Cadres</th><th class="n">Prof. int.</th><th class="n">Emp. et ouv. qual.</th><th class="n">Emp. et ouv. non qual.</th></tr></thead><tbody>' +
      '<tr><td>Agriculteurs</td><td class="n"><b>80,6</b></td><td class="n">7,2</td><td class="n">3,5</td><td class="n">6,7</td><td class="n">7,0</td><td class="n">7,5</td></tr>' +
      '<tr><td>Artisans, commerçants</td><td class="n">4,3</td><td class="n"><b>29,5</b></td><td class="n">14,8</td><td class="n">12,3</td><td class="n">9,5</td><td class="n">10,2</td></tr>' +
      '<tr><td>Cadres</td><td class="n">1,0</td><td class="n">12,1</td><td class="n"><b>33,5</b></td><td class="n">14,0</td><td class="n">5,9</td><td class="n">5,3</td></tr>' +
      '<tr><td>Professions intermédiaires</td><td class="n">3,5</td><td class="n">13,6</td><td class="n">20,7</td><td class="n"><b>19,6</b></td><td class="n">12,9</td><td class="n">12,2</td></tr>' +
      '<tr><td>Emp. et ouv. qualifiés</td><td class="n">7,8</td><td class="n">28,2</td><td class="n">22,2</td><td class="n">37,8</td><td class="n"><b>46,9</b></td><td class="n">35,9</td></tr>' +
      '<tr><td>Emp. et ouv. non qualifiés</td><td class="n">2,9</td><td class="n">9,4</td><td class="n">5,3</td><td class="n">9,7</td><td class="n">17,8</td><td class="n"><b>28,9</b></td></tr>' +
      '<tr><td><i>Total</i></td><td class="n">100</td><td class="n">100</td><td class="n">100</td><td class="n">100</td><td class="n">100</td><td class="n">100</td></tr></tbody></table></div>' +
      '<p class="src-l">Calcul du site à partir des tables publiées par l’Insee (origines × destinées) ; les arrondis peuvent décaler certains chiffres de quelques dixièmes. L’Insee publie une autoreproduction des agriculteurs de 81 % en 2015.</p>' +
      '<p>Lecture : en 2015, environ 80 % des agriculteurs sont fils d’agriculteurs (fort <b>autorecrutement</b>), alors que les cadres viennent de tous les milieux : un tiers sont fils de cadres, mais plus d’un quart (27,5 %) sont fils d’employés ou d’ouvriers. C’est l’effet de la croissance du nombre de cadres : il faut bien les « recruter » ailleurs.</p></div></details>' +
      '<h3>Intérêts</h3><ul><li><b>Mesurer</b> l’ampleur de la mobilité et de la reproduction, et les <b>comparer dans le temps</b> (enquêtes répétées depuis 1964) et entre pays.</li><li>Distinguer deux questions : le <b>destin</b> des enfants d’une origine (égalité des chances) et la <b>composition</b> d’un groupe (homogénéité, conscience de classe possible).</li><li>Mettre en évidence la mobilité ascendante, descendante, la reproduction, les différences entre hommes et femmes.</li></ul>' +
      '<h3>Limites</h3><ul><li><b>Des catégories larges</b> : six groupes masquent beaucoup de mobilité interne (un fils d’ouvrier non qualifié devenu ouvrier qualifié est classé immobile dans la table habituelle en PCS).</li><li><b>Une hiérarchie discutable</b> : agriculteurs ou artisans ne se classent pas facilement au-dessus ou au-dessous des salariés ; la mobilité est alors dite « non verticale ».</li><li><b>Les nomenclatures changent</b> (PCS 1982, 2003, 2020) et le contenu d’une catégorie évolue : être cadre en 1977 et en 2015 n’a pas la même rareté.</li><li><b>Le choix de l’étalon</b> : longtemps, les études ont surtout comparé les fils à leur père ; or la comparaison des filles avec leur mère ou avec leur père change les conclusions (section 4).</li><li><b>Une photographie tardive</b> : les 35-59 ans d’aujourd’hui ont eu leurs parents en activité il y a 30 à 50 ans ; et la table ne dit rien des <b>causes</b> de la mobilité.</li><li>La table ne mesure que la catégorie socioprofessionnelle : ni le revenu, ni le patrimoine (voir la corrélation des revenus parents-enfants en <a href="#r1:r1-2">R1</a>).</li></ul>' },

    { id: "s3-3", t: "Mobilité observée, mobilité structurelle, fluidité sociale", h:
      '<div class="def"><b>Mobilité observée (ou brute)</b> — part des individus dont la position diffère de celle de leur parent. Elle se lit hors de la diagonale de la table d’effectifs.</div>' +
      '<div data-graph="s3-mob"></div>' +
      '<p>Lecture : selon l’Insee, la mobilité observée des hommes par rapport à leur père est presque stable depuis 40 ans (63,8 % en 1977, 65,2 % en 2015). Celle des femmes par rapport à leur mère progresse fortement (59,1 % en 1977, 70,5 % en 2015). Chez les hommes, la mobilité descendante double (7,2 % → 15,0 %).</p>' +
      '<h3>La composante structurelle</h3><div class="def"><b>Mobilité structurelle</b> — partie de la mobilité observée imposée par la différence entre la structure des emplois des pères (origines) et celle des fils (positions). Elle se mesure par l’écart entre les marges de la table.</div>' +
      '<div class="ex"><p>En 2015, 13,9 % des pères étaient cadres, mais 20,4 % des fils le sont ; 8,3 % des pères étaient agriculteurs, 2,8 % des fils. Même si chacun héritait autant que possible du groupe de son père, au moins 15,8 % des hommes auraient changé de groupe (indice de dissimilarité de l’Insee : la moitié de la somme des écarts entre les deux marges). Cela représente 24,2 % de la mobilité observée des hommes (15,8 ÷ 65,2) ; c’était 39,6 % en 1977. Pour les femmes par rapport à leur mère : 24,5 %, soit 34,8 % de leur mobilité.</p></div>' +
      '<div data-chain="s3-struct"></div>' +
      '<div data-anim="s3-structure"></div>' +
      '<p>Le reste de la mobilité observée est parfois appelé mobilité <b>nette</b> (ou de circulation) : celle qui ne s’explique pas mécaniquement par l’évolution des emplois. Cette décomposition est simple mais imparfaite ; les sociologues lui préfèrent aujourd’hui la mesure de la fluidité.</p>' +
      '<h3>La fluidité sociale : raisonner en chances relatives</h3>' +
      '<div class="def"><b>Fluidité sociale</b> — degré d’indépendance entre l’origine et la position sociale, une fois neutralisés les changements de structure. Une société parfaitement fluide est une société où les chances relatives d’accéder à une position ne dépendent pas de l’origine (égalité des chances).</div>' +
      '<p>On la mesure par le <b>rapport des chances relatives</b> (en anglais <i>odds ratio</i>). On compare deux origines et deux positions :</p>' +
      '<div class="ex"><p>En 2015, un fils de cadre a 49,0 % de chances d’être cadre et 3,8 % d’être employé ou ouvrier non qualifié, soit 12,9 fois plus de chances d’être cadre que non qualifié. Pour un fils d’employé ou d’ouvrier non qualifié : 8,3 % contre 22,1 %, soit 0,38. Le rapport des chances relatives vaut 12,9 ÷ 0,38 ≈ 34 (l’Insee publie 34,7 avec les données non arrondies). Il valait 165 en 1977.</p></div>' +
      '<div data-graph="s3-or"></div>' +
      '<p>Plus le rapport se rapproche de 1, plus la société est fluide. Il a beaucoup baissé depuis 1977 (avec une légère remontée entre 2003 et 2015), mais reste très loin de 1. Le sociologue <b>Louis-André Vallet</b> a montré dès la fin des années 1990 une hausse lente et régulière de la fluidité en France depuis les années 1950 ; à l’échelle internationale, <b>Robert Erikson et John Goldthorpe</b> (<i>The Constant Flux</i>, 1992) concluaient que la fluidité varie peu entre pays industrialisés et dans le temps.</p>' +
      '<h3>Plus mobile ne veut pas dire plus fluide</h3>' +
      '<div class="cle"><p>La mobilité observée peut augmenter <b>seulement parce que la structure change</b> (beaucoup de places de cadres créées) sans que les chances relatives des enfants d’ouvriers et de cadres se rapprochent. À l’inverse, une société dont la structure ne bouge plus peut devenir plus fluide sans que la mobilité observée augmente. C’est ce que suggère la France de 1977 à 2015 : mobilité des hommes presque stable (63,8 % → 65,2 %), fluidité en hausse (rapport de 165 à 34,7).</p></div>' +
      '<div class="aut"><span class="mono">CT</span><span class="an">Claude Thélot<small><i>Tel père, tel fils ?</i>, 1982</small></span><span class="ad">À partir des enquêtes FQP, il montre que la mobilité observée a augmenté pendant les Trente Glorieuses surtout sous l’effet de la mobilité structurelle, et que l’hérédité sociale reste forte. Il insiste sur la différence entre la mobilité « brute » et l’inégalité des chances.</span></div>' },

    { id: "s3-4", t: "Lire les tables : ascension, reproduction, déclassement, femmes et hommes", h:
      '<h3>1. La reproduction sociale reste forte aux deux extrémités</h3><p>La diagonale de la table de destinée de 2015 montre que 49,0 % des fils de cadres sont cadres et 42,6 % des fils d’employés ou d’ouvriers qualifiés sont dans le même groupe que leur père. Si l’on regroupe cadres et professions intermédiaires, <b>74,4 %</b> des fils de cadres occupent une position d’encadrement (calcul : 49,0 + 25,4). Le sociologue <b>Camille Peugny</b> parle de « destin au berceau » (<i>Le Destin au berceau</i>, 2013) pour souligner cette persistance.</p>' +
      '<h3>2. Une mobilité ascendante réelle mais souvent « courte »</h3><p>En 2015, 27,6 % des hommes sont en position plus élevée que leur père (Insee). Mais l’ascension se fait surtout vers le groupe juste au-dessus : 26,8 % des fils d’employés ou ouvriers qualifiés deviennent professions intermédiaires, seulement 12,7 % deviennent cadres. Les trajectoires longues (d’ouvrier non qualifié à cadre) restent rares : 8,3 %.</p>' +
      '<div class="ex"><p>Les « <b>transclasses</b> » (mot de la philosophe Chantal Jaquet, <i>Les Transclasses</i>, 2014) ou « transfuges de classe » sont ces personnes qui ont fait une longue ascension ; leurs récits (Annie Ernaux, Didier Eribon) décrivent le décalage culturel qu’elle provoque. Ces parcours existent, mais statistiquement ils restent des exceptions.</p></div>' +
      '<h3>3. Le déclassement</h3><div class="def"><b>Déclassement intergénérationnel</b> — situation d’un individu dont la position est inférieure à celle de son parent (mobilité descendante). On parle aussi de déclassement <b>scolaire</b> quand l’emploi occupé est moins qualifié que ce que permettrait le diplôme.</div>' +
      '<p>La mobilité descendante des hommes passe de 7,2 % (1977) à 15,0 % (2015). En 2015, 42,9 % des fils de cadres occupent une position inférieure à celle de leur père (calcul à partir de la table : 25,4 + 13,7 + 3,8), mais la plupart deviennent professions intermédiaires.</p>' +
      '<div data-chain="s3-declass"></div>' +
      '<div class="aut"><span class="mono">CP</span><span class="an">Camille Peugny<small><i>Le Déclassement</i>, 2009</small></span><span class="ad">Les générations nées dans les années 1960 connaissent davantage de déclassement que celles nées dans les années 1940 : elles sont plus diplômées, mais les places élevées n’ont pas augmenté au même rythme. Le déclassement nourrit frustration et défiance politique.</span></div>' +
      '<h3>4. Les spécificités de la mobilité des femmes</h3>' +
      '<div class="tbl"><table><thead><tr><th>En 2015 (en %)</th><th class="n">Hommes / père</th><th class="n">Femmes / mère</th><th class="n">Femmes / père</th></tr></thead><tbody>' +
      '<tr><td>Mobilité observée</td><td class="n">65,2</td><td class="n">70,5</td><td class="n">70,1</td></tr><tr><td>dont ascendante</td><td class="n">27,6</td><td class="n">39,8</td><td class="n">21,8</td></tr><tr><td>dont descendante</td><td class="n">15,0</td><td class="n">11,7</td><td class="n">25,0</td></tr><tr><td>Immobilité</td><td class="n">34,8</td><td class="n">29,5</td><td class="n">29,9</td></tr></tbody></table></div>' +
      '<p class="src-l">Source : Insee Première n° 1739, février 2019 (FQP 2014-2015). Le reste de la mobilité observée est « non verticale ».</p>' +
      '<ul><li><b>Comparées à leur mère</b>, les femmes connaissent beaucoup de mobilité ascendante (39,8 %) : les mères étaient souvent agricultrices ou employées peu qualifiées, et les filles ont profité de l’allongement des études et de la tertiarisation. Une part importante de cette mobilité est structurelle (34,8 %).</li><li><b>Comparées à leur père</b>, elles connaissent plus de mobilité descendante qu’ascendante (25,0 % contre 21,8 %) : à origine égale, elles occupent plus souvent des emplois d’employées, moins souvent de cadres. Seules 35,0 % des filles de cadres sont cadres, contre 49,0 % des fils.</li><li>Ces écarts traduisent la <b>ségrégation professionnelle</b> (emplois féminisés du tertiaire), le temps partiel et les carrières freinées par les charges familiales (voir <a href="#s1:s1-3">S1</a>).</li></ul>' +
      '<div class="attn"><p>Pour juger de la mobilité des femmes, précise toujours l’étalon : « par rapport à leur mère » ou « par rapport à leur père ». Les deux lectures sont justes, mais elles ne disent pas la même chose.</p></div>' },

    { id: "s3-5", t: "Les facteurs de la mobilité sociale", h:
      '<p class="lede">Le programme cite trois familles de facteurs. Une bonne copie les relie et montre leurs limites.</p>' +
      '<h3>1. L’évolution de la structure socioprofessionnelle</h3><p>La tertiarisation et l’élévation des qualifications ont créé des places en haut de l’échelle (cadres : 8,0 % de l’emploi en 1982, 23,8 % en 2025, Insee) et supprimé des places d’agriculteurs et d’ouvriers. C’est le moteur de la <b>mobilité structurelle</b>, majoritairement ascendante. Quand la structure se transforme moins vite, cette mobilité diminue : sa part dans la mobilité des hommes passe de 39,6 % en 1977 à 24,2 % en 2015.</p>' +
      '<div class="ex"><p>Pendant les Trente Glorieuses, l’exode rural fait passer les fils d’agriculteurs vers le salariat : en 2015 encore, seuls 26,7 % des fils d’agriculteurs sont agriculteurs, 27,4 % sont devenus employés ou ouvriers qualifiés et 20,4 % professions intermédiaires (Insee).</p></div>' +
      '<h3>2. Les niveaux de formation</h3><p>Le diplôme est le principal canal de l’ascension dans une société salariale : il donne accès aux emplois qualifiés. La <b>massification scolaire</b> (20,1 % de bacheliers dans une génération en 1970, 80,1 % en 2025 : voir <a href="#s2">S2</a>) a permis à de nombreux enfants de milieu populaire d’être plus diplômés que leurs parents.</p>' +
      '<p>Mais l’effet est ambigu :</p>' +
      '<div data-chain="s3-anderson"></div>' +
      '<div class="aut"><span class="mono">RB</span><span class="an">Raymond Boudon<small><i>L’Inégalité des chances</i>, 1973</small></span><span class="ad">Les choix scolaires des familles dépendent de leur position (calcul coûts / avantages / risques). Même si les inégalités face à l’école diminuent, la mobilité sociale peut rester stable, car la structure des positions et la concurrence pour les places ne changent pas au même rythme : la démocratisation scolaire n’entraîne pas automatiquement plus de mobilité.</span></div>' +
      '<div class="plus"><p>Le <b>paradoxe d’Anderson</b> (le sociologue américain C. Arnold Anderson, 1961) : un fils plus diplômé que son père n’occupe pas forcément une position plus élevée. En France, Marie Duru-Bellat a analysé cette « inflation scolaire » (<i>L’Inflation scolaire</i>, 2006) : quand tout le monde est plus diplômé, le diplôme protège moins.</p></div>' +
      '<p>Le diplôme reste pourtant décisif : il réduit fortement le risque de déclassement et de chômage, et son absence pèse plus lourd qu’hier.</p>' +
      '<h3>3. Les ressources et configurations familiales</h3>' +
      '<div data-chain="s3-famille"></div>' +
      '<div class="aut"><span class="mono">PB</span><span class="an">Pierre Bourdieu<small>1930-2002</small></span><span class="ad">Les familles transmettent un <b>capital économique</b> (patrimoine), <b>culturel</b> (savoirs, diplômes, aisance avec la culture scolaire) et <b>social</b> (relations). Ces capitaux se convertissent les uns dans les autres et assurent la <b>reproduction sociale</b> (<i>La Reproduction</i>, avec Jean-Claude Passeron, 1970).</span></div>' +
      '<div class="ex"><p>Le capital social joue dès l’entrée sur le marché du travail : stage obtenu par une connaissance, conseil d’orientation, premier emploi. Le sociologue américain Mark Granovetter a montré (« La force des liens faibles », 1973) que les relations éloignées (connaissances, anciens collègues) apportent des informations utiles pour trouver un emploi ; or l’étendue de ce réseau dépend du milieu social.</p></div>' +
      '<p>Mais la famille n’est pas un simple réservoir de capitaux : sa <b>configuration</b> compte. Bernard Lahire (<i>Tableaux de familles</i>, 1995) explique des réussites « paradoxales » en milieu populaire par l’ordre domestique, l’autorité, la place de l’écrit, la mobilisation d’un parent ou d’un aîné. La <b>taille de la fratrie</b>, le rang de naissance, la séparation des parents ou la <b>monoparentalité</b> (niveau de vie plus faible : voir <a href="#s1:s1-1">S1</a>) modifient aussi les ressources disponibles.</p>' +
      '<div class="cle"><p><b>Pour la dissertation</b> (sujet tombé au bac 2026 : « Les ressources et configurations familiales suffisent-elles à expliquer la mobilité sociale ? ») : la famille explique beaucoup de la reproduction, mais elle ne suffit pas. La structure des emplois crée ou ferme des places, l’École et le diplôme transforment les ressources familiales, et les politiques publiques (bourses, éducation prioritaire) pèsent aussi.</p></div>' }
  ],
  pieges: [
    { f: "« La table de destinée dit que 49 % des cadres sont fils de cadres. »", v: "Non : elle dit que 49,0 % des <b>fils de cadres</b> sont cadres (lecture en ligne). La part des cadres qui sont fils de cadres se lit dans la table de <b>recrutement</b> (environ 33 % en 2015)." },
    { f: "« La mobilité sociale augmente, donc l’égalité des chances progresse. »", v: "La mobilité observée peut venir de la seule <b>mobilité structurelle</b>. L’égalité des chances se mesure par la <b>fluidité</b> (rapport des chances relatives)." },
    { f: "« Un rapport des chances relatives de 34,7 signifie que les fils de cadres ont 34,7 % de chances de plus. »", v: "C’est un rapport de rapports : les chances d’être cadre plutôt que non qualifié sont environ 35 <b>fois</b> plus élevées pour un fils de cadre que pour un fils de non qualifié." },
    { f: "Confondre mobilité professionnelle et mobilité intergénérationnelle.", v: "La mobilité professionnelle se déroule au cours de la carrière d’un même individu ; l’intergénérationnelle compare deux générations." },
    { f: "« Les femmes connaissent surtout de la mobilité descendante. »", v: "C’est vrai <b>par rapport à leur père</b> (25,0 % de descendante). Par rapport à leur mère, elles connaissent surtout de la mobilité ascendante (39,8 %)." },
    { f: "« Plus de diplômés entraîne mécaniquement plus de mobilité. »", v: "Paradoxe d’Anderson et analyse de Boudon : si tout le monde progresse et que les places élevées n’augmentent pas au même rythme, la mobilité change peu." },
    { f: "Calculer une table de recrutement en divisant par le total des lignes.", v: "Recrutement : on divise par le total de la <b>colonne</b>. Destinée : par le total de la <b>ligne</b>. Vérifie que tes pourcentages totalisent 100 dans le bon sens." }
  ],
  retenir:
    '<h3>Définitions</h3><ul>' +
    '<li><b>Mobilité intergénérationnelle</b> : position de l’individu comparée à celle de son parent. <b>Professionnelle</b> (intragénérationnelle) : au cours de la carrière. <b>Géographique</b> : changement de lieu.</li>' +
    '<li><b>Table de mobilité</b> : croise origine et position (enquête FQP de l’Insee, 35-59 ans). <b>Destinée</b> : ÷ ligne, « que deviennent les fils de… ? ». <b>Recrutement</b> : ÷ colonne, « d’où viennent les… ? ».</li>' +
    '<li><b>Mobilité observée</b> : hors diagonale. <b>Structurelle</b> : imposée par l’écart entre les marges (½ Σ |origine − position|). <b>Fluidité</b> : chances relatives (odds ratio), 1 = égalité des chances.</li>' +
    '<li><b>Plus mobile ≠ plus fluide</b> : la mobilité peut venir de la seule structure.</li>' +
    '<li><b>Lectures</b> : reproduction (diagonale), mobilité ascendante souvent « courte », déclassement (Peugny), femmes : ascendantes par rapport à la mère, descendantes par rapport au père.</li>' +
    '<li><b>Facteurs</b> : structure socioprofessionnelle (tertiarisation) ; formation (massification, paradoxe d’Anderson, Boudon) ; famille (capitaux de Bourdieu, configurations de Lahire, fratrie, monoparentalité).</li></ul>' +
    '<h3>Chiffres à citer (Insee, FQP 2014-2015)</h3><ul><li>Mobilité observée 2015 : hommes / père 65,2 % ; femmes / mère 70,5 % ; part structurelle 24,2 % et 34,8 %.</li><li>Hommes : ascendante 27,6 %, descendante 15,0 % (7,2 % en 1977).</li><li>49,0 % des fils de cadres sont cadres ; 8,3 % des fils d’employés ou ouvriers non qualifiés.</li><li>Rapport des chances relatives cadres / non qualifiés : 165 (1977) → 34,7 (2015).</li></ul>',
  chainesFiche: ["s3-struct", "s3-anderson", "s3-famille", "s3-declass"],
  quiz: [
    { q: "Un technicien devenu ingénieur au cours de sa carrière connaît une mobilité…", c: ["professionnelle (intragénérationnelle) ascendante", "intergénérationnelle ascendante", "géographique", "structurelle"], r: 0, e: "On compare deux positions d’un même individu au cours de sa vie active, pas avec ses parents.", s: "s3-1" },
