  bac: [
    { type: "Savoir-faire", origine: "Exercice inventé pour le site, données Insee", t: "Passer d’une table de destinée à une table de recrutement", enonce:
      '<p>En 2015 (Insee, FQP), pour 1 000 hommes de 35 à 59 ans : 139 sont fils de cadres et 131 sont fils d’employés ou d’ouvriers non qualifiés. 49,0 % des fils de cadres et 8,3 % des fils de non qualifiés sont cadres. Au total, 203 hommes sur 1 000 sont cadres.</p><ol><li>Combien de cadres sont fils de cadres ? fils de non qualifiés ?</li><li>Calcule la part des cadres qui sont fils de cadres, puis fils de non qualifiés. Comment s’appelle ce type de pourcentage ?</li><li>Calcule le rapport des chances brutes d’être cadre entre fils de cadres et fils de non qualifiés, et rédige une phrase.</li></ol>',
      corrige: '<ol><li>139 × 0,490 ≈ 68 cadres fils de cadres ; 131 × 0,083 ≈ 11 cadres fils de non qualifiés.</li><li>68 ÷ 203 ≈ 33,5 % ; 11 ÷ 203 ≈ 5,4 % (5,3 % avec les données non arrondies). Ce sont des pourcentages de <b>recrutement</b> (lecture en colonne).</li><li>49,0 ÷ 8,3 ≈ 5,9 : « En 2015, selon l’Insee, un fils de cadre a environ 5,9 fois plus de chances d’être cadre qu’un fils d’employé ou d’ouvrier non qualifié. » Ce n’est pas encore un rapport des chances <b>relatives</b> (odds ratio), qui compare aussi les chances d’être non qualifié.</li></ol>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet inventé pour le site", t: "Montrez que la mobilité sociale observée comporte une composante structurelle.", enonce: "<p>4 points en 2026, 3,5 points à partir de la session 2027. Sans document.</p>",
      methode: "<p>Définis les deux notions, explique le mécanisme (changement de structure → places imposées), illustre par un exemple chiffré, puis nuance (la structure n’explique pas tout : fluidité).</p>",
      corrige: '<div class="copie"><p>La mobilité sociale observée est la part des individus qui occupent une position sociale différente de celle de leur parent. Selon l’Insee, elle concerne 65,2 % des hommes de 35 à 59 ans par rapport à leur père en 2015.</p><p>Une partie de cette mobilité est structurelle : elle s’explique par l’évolution de la structure des emplois entre la génération des parents et celle des enfants. Depuis les années 1950, la tertiarisation et l’élévation des qualifications ont fait reculer les emplois d’agriculteurs et d’ouvriers et multiplié ceux de cadres et de professions intermédiaires. Comme il y a moins de places d’agriculteurs pour les fils d’agriculteurs et plus de places de cadres que de pères cadres, une partie des enfants est obligée de changer de groupe. En 2015, 13,9 % des pères étaient cadres mais 20,4 % des fils le sont, et 8,3 % des pères étaient agriculteurs contre 2,8 % des fils. L’Insee estime ainsi que 15,8 % des hommes devaient changer de groupe, soit 24,2 % de leur mobilité observée.</p><p>Cette composante structurelle, surtout ascendante, explique qu’une société puisse être plus mobile sans être plus fluide : la mobilité structurelle ne dit rien de l’égalité des chances relatives.</p></div>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet inventé pour le site", t: "Présentez deux limites des tables de mobilité comme instrument de mesure de la mobilité sociale.", enonce: "<p>Sans document.</p>",
      corrige: '<div class="copie"><p>Les tables de mobilité croisent l’origine sociale (la catégorie socioprofessionnelle du père ou de la mère) et la position sociale des individus, à partir de l’enquête FQP de l’Insee. Elles mesurent la mobilité, mais imparfaitement.</p><p>D’abord, elles utilisent un petit nombre de catégories larges. La mobilité à l’intérieur d’une catégorie est invisible : un fils d’employé peu qualifié devenu employé qualifié est classé comme immobile. De plus, ces catégories ne sont pas toutes hiérarchisées : passer d’agriculteur à artisan n’est ni une ascension ni un déclassement, d’où une mobilité dite « non verticale ».</p><p>Ensuite, les comparaisons dans le temps sont fragiles, car la valeur d’une position change : être cadre était plus rare en 1977 (5,0 % des pères des hommes interrogés) qu’en 2015 (20,4 % des fils). Enfin, le choix de l’étalon modifie les conclusions : par rapport à leur mère, 39,8 % des femmes connaissent une mobilité ascendante en 2015, mais seulement 21,8 % par rapport à leur père (Insee).</p></div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice inventé pour le site, document Insee", t: "La mobilité des femmes et des hommes en 2015", enonce:
      '<p>Document : le tableau « En 2015 (en %) : hommes / père, femmes / mère, femmes / père » du <a href="#s3:s3-4">cours</a> (Insee Première n° 1739).</p><ol><li>Comparez la mobilité ascendante des femmes selon qu’on les compare à leur mère ou à leur père. (2 points)</li><li>À l’aide du document et de vos connaissances, montrez que la mobilité sociale des femmes présente des spécificités. (4 points)</li></ol>',
      corrige: '<ol><li>Selon l’Insee, en 2015, 39,8 % des femmes de 35 à 59 ans occupent une position plus élevée que celle de leur mère, contre 21,8 % par rapport à leur père : 18 points d’écart, soit environ 1,8 fois plus.</li><li>La mobilité des femmes dépend d’abord de l’étalon choisi. Par rapport à leur mère, elles connaissent une forte mobilité ascendante, en partie <b>structurelle</b> (34,8 % de leur mobilité) : leurs mères étaient souvent agricultrices ou employées peu qualifiées, alors qu’elles ont profité de la massification scolaire, de la tertiarisation et de la hausse de l’emploi qualifié féminin. Par rapport à leur père, en revanche, la mobilité descendante (25,0 %) l’emporte sur l’ascendante (21,8 %), et elle est bien plus forte que celle des hommes (15,0 %). À origine égale, les femmes occupent plus souvent des emplois d’employées et moins souvent des emplois de cadres : seules 35,0 % des filles de cadres sont cadres, contre 49,0 % des fils. Cela s’explique par la <b>ségrégation professionnelle</b> issue d’une socialisation différenciée, et par des carrières freinées par le temps partiel et la répartition inégale des tâches domestiques.</li></ol>' },
    { type: "Partie 3 · Raisonnement sur dossier", origine: "Sujet inventé pour le site", t: "Montrez que l’évolution de la structure socioprofessionnelle contribue à expliquer la mobilité sociale.", enonce: '<p>Appuie-toi sur le graphique de la mobilité observée, la table de destinée de 2015 et le graphique des PCS de 1982 à 2024 (<a href="#s1:s1-3">S1</a>).</p>',
      corrige: '<p><b>Introduction.</b> Définir mobilité sociale (intergénérationnelle) et structure socioprofessionnelle. Annonce : la transformation des emplois crée une mobilité structurelle, surtout ascendante ; son ralentissement explique aussi la montée du déclassement.</p><p><b>I. La transformation des emplois impose une mobilité.</b> Tertiarisation et qualification : cadres 8,0 % de l’emploi en 1982, 23,0 % en 2024 ; ouvriers 29,9 % → 18,0 % (Insee). Écart entre marges : 13,9 % de pères cadres, 20,4 % de fils cadres. Mobilité structurelle de 15,8 %, soit 24,2 % de la mobilité des hommes en 2015.</p><p><b>II. Une mobilité surtout ascendante.</b> Recul des agriculteurs (seuls 26,7 % des fils d’agriculteurs le restent) ; recrutement des cadres dans tous les milieux (plus d’un quart sont fils d’employés ou d’ouvriers) ; mobilité ascendante des femmes par rapport à leur mère (39,8 %).</p><p><b>III. Quand la structure bouge moins, d’autres effets apparaissent.</b> La part structurelle baisse (39,6 % en 1977, 24,2 % en 2015) ; le nombre de places élevées ne suit pas le nombre d’enfants de cadres : déclassement (descendante 7,2 % → 15,0 %).</p><p><b>Conclusion.</b> La structure explique une large part de la mobilité observée, mais pas l’égalité des chances, qui se mesure par la fluidité.</p>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet officiel : bac 2026, sujet 26-SESJ1JA1 (dissertation) · corrigé du site", officiel: true, t: "Les ressources et configurations familiales suffisent-elles à expliquer la mobilité sociale ?", enonce: "<p>Les quatre documents du sujet officiel ne sont pas reproduits ici. Construis la problématique et le plan, puis compare.</p>",
      corrige: '<p><b>Problématique.</b> La famille transmet des ressources (économiques, culturelles, sociales) et s’organise de manière plus ou moins favorable à la réussite. Ces ressources expliquent-elles à elles seules les trajectoires de mobilité, ou faut-il tenir compte de la structure des emplois et du système de formation ?</p><p><b>I. Les ressources et configurations familiales expliquent une grande part de la mobilité et de la reproduction.</b><br>A. Les capitaux transmis (Bourdieu) : 49,0 % des fils de cadres sont cadres, 8,3 % des fils de non qualifiés (Insee, 2015).<br>B. Les stratégies et l’information des familles (Boudon : calcul coûts / avantages selon la position ; capital social, Granovetter).<br>C. Les configurations familiales : réussites paradoxales (Lahire), fratrie, monoparentalité et niveau de vie plus faible.</p><p><b>II. Mais elles ne suffisent pas.</b><br>A. La structure des emplois crée ou ferme des places : mobilité structurelle (24,2 % de la mobilité des hommes en 2015 ; 39,6 % en 1977).<br>B. Le niveau de formation : massification (80,1 % de bacheliers en 2025), mais paradoxe d’Anderson et inflation scolaire.<br>C. Le genre et l’action publique : mobilité des femmes différente à origine égale ; politiques scolaires et sociales.</p><p><b>Conclusion.</b> La famille est un facteur central, mais ses effets passent par l’École et dépendent de la structure des emplois : c’est la combinaison des trois qui explique la mobilité.</p><div class="marge"><b>Piège :</b> ne pas traiter seulement de la reproduction ; le sujet porte sur la <b>mobilité</b>, donc aussi sur les ascensions et les déclassements.</div>' }
  ]
};

      var q = i === 0 ? 0 : i === 1 ? A.s(p, k / 3, (k + 1) / 3) : 1;
      var diag = j === k, fond = "carte";
      if (i >= 2 && i <= 3) fond = diag ? "moutardec" : "canardc";
      var opF = i === 2 ? A.s(p, 0, 0.4) : 1;
      s += A.r(x + 2, y + 2, cw - 4, rh - 4, { f: "carte", s: "ligne", r: 5 });
      if (fond !== "carte") s += A.r(x + 2, y + 2, cw - 4, rh - 4, { f: fond, r: 5, op: opF });
      if (i === 4 && k < 3) s += A.r(x + 2, y + 2, cw - 4, rh - 4, { f: (k === 0 || k === 2) ? "moutardec" : "carte2", r: 5, op: A.s(p, 0.1, 0.5) * 0.9 });
      if (i === 5) s += A.r(x + 2, y + 2, cw - 4, rh - 4, { f: (j === 0 || j === 2) ? "canardc" : "carte2", r: 5, op: A.s(p, 0.1, 0.5) * 0.9 });
      if (i === 6 && (k === 0 || k === 2) && (j === 0 || j === 2)) s += A.r(x + 2, y + 2, cw - 4, rh - 4, { f: "corailc", s: "corail", r: 5, op: A.s(p, 0, 0.3) });
      var val, txt;
      if (i <= 3) { val = Math.round(E[k][j] * q); txt = String(val); }
      else if (i === 4) { var m = A.s(p, 0.15, 0.7); val = A.l(E[k][j], D[k][j], m); txt = m < 1 ? A.fr(val, 0) : A.fr(val, 1) + " %"; }
      else if (i === 5) { var m2 = A.s(p, 0.15, 0.7); val = A.l(D[k][j], R[k][j], m2); txt = A.fr(val, 1) + " %"; }
      else { txt = A.fr(D[k][j], 1) + " %"; }
      s += A.t(x + cw / 2, y + 22, txt, { t: i >= 4 ? 11.5 : 12.5, g: (i === 2 && diag) || (i === 6 && (k === 0 || k === 2) && (j === 0 || j === 2)), a: "middle", op: i === 0 ? 0 : (i === 1 ? q : 1) });
    }
    var yb = yT + rh + 14;
    if (i === 0) {
      var tot = 0;
      L.forEach(function (v, k) { s += A.r(20 + 320 * tot / 1000, yb + 8, 320 * v / 1000 * qL, 22, { f: ["corail", "moutarde", "canard"][k], r: 3 }) + A.t(20 + 320 * (tot + v / 2) / 1000, yb + 48, noms[k] + " : " + v, { t: 11, a: "middle", c: "gris", op: qL }); tot += v; });
    } else if (i === 1) {
      s += A.t(180, yb + 22, "Lecture : 225 hommes sont fils du bas", { t: 12, a: "middle", op: A.s(p, 0.75, 1) }) + A.t(180, yb + 40, "et occupent une position du milieu.", { t: 12, a: "middle", op: A.s(p, 0.75, 1) });
    } else if (i === 2) {
      var g = A.s(p, 0.3, 1);
      s += A.jauge(20, yb + 18, 320, 545 * g, 1000, { c: "moutarde", l: "Immobilité (diagonale)", val: Math.round(545 * g) + " / 1 000" });
      s += A.jauge(20, yb + 52, 320, 455 * g, 1000, { c: "canard", l: "Mobilité observée (hors diagonale)", val: A.fr(45.5 * g, 1) + " %" });
    } else if (i === 3) {
      var g3 = A.s(p, 0.45, 1);
      s += A.t(180, yb + 14, "½ × (|100 − 200| + |300 − 400| + |600 − 400|) = 200", { t: 12, g: true, a: "middle", op: g3 });
      s += A.jauge(20, yb + 40, 320, 200 * g3, 455, { c: "corail", l: "Mobilité structurelle dans la mobilité observée", val: Math.round(200 * g3) + " / 455" });
    } else if (i === 4) {
      s += A.fl(14, y0 + rh, 300, y0 + rh, { c: "corail", p: A.s(p, 0, 0.3), sw: 2 }) + A.t(180, yb + 22, "Lecture en ligne : chaque ligne totalise 100 %.", { t: 12, a: "middle", op: A.s(p, 0.5, 0.9) }) + A.t(180, yb + 42, "« Sur 100 fils du bas, 55,8 restent en bas. »", { t: 12, g: true, a: "middle", op: A.s(p, 0.6, 1) });
    } else if (i === 5) {
      s += A.fl(x0 + 3 * cw + 1, y0 - 2, x0 + 3 * cw + 1, yT + 2, { c: "canard", p: A.s(p, 0, 0.3), sw: 2 }) + A.t(180, yb + 22, "Lecture en colonne : chaque colonne totalise 100 %.", { t: 12, a: "middle", op: A.s(p, 0.5, 0.9) }) + A.t(180, yb + 42, "« Sur 100 hommes du bas, 83,8 sont fils du bas. »", { t: 12, g: true, a: "middle", op: A.s(p, 0.6, 1) });
    } else {
      var g6 = A.s(p, 0.25, 0.6), g7 = A.s(p, 0.55, 0.9);
      s += A.t(180, yb + 6, "Fils du haut : 60 ÷ 15 = 4", { t: 11.5, a: "middle", op: g6 }) + A.t(180, yb + 22, "Fils du bas : 40 ÷ 335 ≈ 0,119", { t: 11.5, a: "middle", op: g6 });

      s += A.t(180, yb + 62, "(France 2015, vraies données : 34,7)", { t: 10.5, a: "middle", c: "gris", op: g7 });
    }
    return s;
  }
};

CH.s4 = {
  chapo: "Livreurs à vélo payés à la course, cadres en télétravail deux jours par semaine, intérimaires dans les entrepôts, jeunes en alternance : le travail a beaucoup changé. Ce chapitre définit précisément travail, emploi et chômage, apprend à juger de la qualité d’un emploi, retrace le passage du taylorisme au post-taylorisme, montre ce que le numérique transforme et pose une question décisive : le travail intègre-t-il encore ?",
  essentiel: [
    "Le <b>travail</b> est une activité de production de biens et de services, rémunérée ou non ; l’<b>emploi</b> est un travail rémunéré, exercé sous un <b>statut</b> (salarié ou non-salarié). Les <b>actifs</b> sont les personnes en emploi et les chômeurs ; les autres sont <b>inactifs</b>. Halo autour du chômage, sous-emploi et micro-entreprise rendent les <b>frontières</b> incertaines.",
    "La <b>qualité de l’emploi</b> se juge sur six descripteurs : conditions de travail, salaire, sécurité économique, horizon de carrière, potentiel de formation, variété des tâches. Elle est très inégale selon la catégorie, l’âge et le sexe.",
    "Le <b>taylorisme</b> divise le travail horizontalement et verticalement sous une hiérarchie stricte ; le <b>fordisme</b> y ajoute la chaîne et la consommation de masse. Le <b>post-taylorisme</b> mise sur la flexibilité, la recomposition des tâches et le management participatif : plus d’autonomie, mais un travail souvent intensifié.",
    "Le <b>numérique</b> brouille les frontières du travail (télétravail : 19,7 % des salariés en 2025 ; travail et hors travail), transforme les relations d’emploi (plateformes) et accroît le risque de <b>polarisation</b> des emplois.",
    "Le travail est source d’<b>intégration sociale</b> (Durkheim, Castel, Paugam) ; la <b>précarisation</b>, un <b>chômage</b> durablement élevé et la <b>polarisation de la qualité des emplois</b> peuvent affaiblir ce pouvoir intégrateur."

    { bo: "Connaître les principaux descripteurs de la qualité des emplois (conditions de travail, niveau de salaire, sécurité économique, horizon de carrière, potentiel de formation, variété des tâches).", clair: "Citer et illustrer les six descripteurs de la qualité d’un emploi.", voir: "s4-2" },
    { bo: "Comprendre les principales caractéristiques des modèles d’organisation taylorien (division du travail horizontale et verticale, relation hiérarchique stricte) et post-taylorien (flexibilité, recomposition des tâches, management participatif) ; comprendre les effets positifs et négatifs de l’évolution des formes de l’organisation du travail sur les conditions de travail.", clair: "Décrire taylorisme et post-taylorisme et peser leurs effets sur les conditions de travail.", voir: "s4-3" },

  notions: ["travail", "emploi", "activité, population active", "inactivité", "statut d’emploi (salarié, non-salarié)", "chômage au sens du BIT", "halo autour du chômage", "sous-emploi", "formes particulières d’emploi (CDD, intérim)", "micro-entrepreneur", "qualité de l’emploi", "taylorisme", "division horizontale et verticale du travail", "fordisme", "post-taylorisme", "flexibilité", "recomposition des tâches", "management participatif", "télétravail", "plateformes numériques", "polarisation des emplois", "intégration sociale", "précarisation", "désaffiliation"],
  sections: [
    { id: "s4-1", t: "Travail, emploi, activité, chômage : des frontières qui se brouillent", h:
      '<div class="def"><b>Travail</b> — activité humaine de production de biens et de services, rémunérée ou non. Faire la cuisine chez soi, animer bénévolement un club sportif ou livrer des repas sont trois formes de travail.</div>' +
      '<div class="def"><b>Emploi</b> — travail rémunéré et socialement reconnu, exercé dans un cadre juridique : le <b>statut d’emploi</b>. Les <b>salariés</b> travaillent pour un employeur, dans un lien de <b>subordination</b>, contre un salaire (CDI, CDD, intérim, fonctionnaires, apprentis). Les <b>non-salariés</b> (indépendants) travaillent pour leur compte : agriculteurs, artisans, commerçants, professions libérales, micro-entrepreneurs.</div>' +
      '<div class="def"><b>Activité</b> — participation au marché du travail. La <b>population active</b> regroupe les personnes en emploi (actifs occupés) et les <b>chômeurs</b> ; les autres (élèves, retraités, personnes au foyer) sont <b>inactives</b>.</div>' +
      '<div class="def"><b>Chômage au sens du Bureau international du travail (BIT)</b> — situation d’une personne de 15 ans ou plus qui n’a pas travaillé, ne serait-ce qu’une heure, pendant une semaine de référence, est disponible pour travailler dans les deux semaines et a cherché activement un emploi dans le mois précédent (ou en a trouvé un qui commence dans moins de trois mois).</div>' +
      '<div data-graph="s4-statut"></div>' +
      '<p>En 2025, selon l’Insee, 69,3 % des 15-64 ans sont en emploi, 7,7 % des actifs sont au chômage, et 86,5 % des personnes en emploi sont salariées. Les 15-24 ans sont beaucoup plus souvent en contrat temporaire ou en alternance : seuls 39,8 % sont en CDI ou fonctionnaires.</p>' +
      '<h3>Trois zones grises</h3>' +
      '<ul><li><b>Entre chômage et inactivité : le halo.</b> Des personnes souhaitent travailler mais ne sont pas comptées comme chômeuses parce qu’elles ne cherchent pas activement (découragement, problème de garde d’enfant) ou ne sont pas disponibles tout de suite. En 2025, 4,5 % des 15-64 ans sont dans ce <b>halo autour du chômage</b> ; avec les chômeurs, 10,3 % sont sans emploi et souhaitent travailler (Insee).</li>' +
      '<li><b>Entre emploi et chômage : le sous-emploi.</b> Des personnes à temps partiel voudraient travailler plus et sont disponibles (ou sont en chômage partiel). En 2025, 4,4 % des personnes en emploi sont en sous-emploi, 12,3 % des employés peu qualifiés (Insee). Elles ont un emploi, mais pas assez.</li>' +
      '<li><b>Entre salariat et indépendance.</b> Le régime de micro-entrepreneur (créé en 2009 sous le nom d’auto-entrepreneur) concerne 3,7 % des personnes en emploi en 2025. Un livreur ou un chauffeur qui ne travaille que pour une plateforme, aux tarifs qu’elle fixe, est juridiquement indépendant mais économiquement dépendant (section 5).</li></ul>' +
      '<div data-graph="s4-halo"></div>' +
      '<div data-anim="s4-bit"></div>' +
      '<div class="attn"><p>Ne confonds pas la <b>part</b> du chômage dans la population (5,8 % des 15-64 ans) et le <b>taux</b> de chômage, qui rapporte les chômeurs aux seuls actifs (7,7 % en 2025). Pour les 15-24 ans, l’écart est énorme : part de 8,5 % mais taux de 19,8 %, car beaucoup de jeunes sont inactifs (en études).</p></div>' },

    { id: "s4-2", t: "La qualité des emplois : six descripteurs", h:
      '<p class="lede">Deux emplois peuvent avoir le même salaire et être très différents. Le programme retient six <b>descripteurs</b> de la qualité d’un emploi.</p>' +
      '<div class="tbl"><table><thead><tr><th>Descripteur</th><th>Ce qu’il mesure</th><th>Exemple chiffré</th></tr></thead><tbody>' +
      '<tr><td><b>Conditions de travail</b></td><td>Pénibilité physique, rythme, autonomie, risques psychosociaux, horaires</td><td>64 % des ouvriers subissent au moins trois contraintes physiques, 7 % des cadres (2019)</td></tr>' +
      '<tr><td><b>Niveau de salaire</b></td><td>Rémunération, et ce qu’elle permet de vivre</td><td>Temps partiel : 26,6 % des femmes en emploi, 9,2 % des hommes (2025), d’où des salaires mensuels plus faibles</td></tr>' +
      '<tr><td><b>Sécurité économique</b></td><td>Stabilité du contrat, risque de perdre son emploi, protection sociale attachée</td><td>Un salarié sur cinq craint pour son emploi dans l’année (2019)</td></tr>' +
      '<tr><td><b>Horizon de carrière</b></td><td>Possibilités de promotion et de progression du salaire</td><td>Un CDI de cadre ouvre une carrière ; une succession de missions d’intérim, rarement</td></tr>' +
      '<tr><td><b>Potentiel de formation</b></td><td>Apprendre au travail, accéder à la formation continue</td><td>Les salariés les plus qualifiés accèdent davantage à la formation continue que les moins qualifiés</td></tr>' +
      '<tr><td><b>Variété des tâches</b></td><td>Diversité, autonomie, intérêt du travail</td><td>Travail répétitif : 69 % des ouvriers, 11 % des cadres (2019)</td></tr></tbody></table></div>' +
      '<p class="src-l">Sources : enquête Conditions de travail 2019 (Dares-Drees-DGAFP-Insee) ; Insee, enquête Emploi 2025.</p>' +
      '<div data-graph="s4-cond"></div>' +
      '<p>Lecture : en 2019, 54 % des ouvriers déclarent au moins trois contraintes de rythme, contre 22 % des cadres. Les cadres, en revanche, sont davantage interrompus par des tâches imprévues (73 % contre 66 % de l’ensemble des salariés) : leur travail est intense, mais plus autonome.</p>' +
      '<div class="cle"><p>Les descripteurs se <b>cumulent</b> : les emplois peu qualifiés combinent souvent salaire bas, temps partiel subi, contrat court, faible autonomie et peu de formation. C’est ce qu’on appelle la <b>polarisation de la qualité des emplois</b> (section 6).</p></div>' },

    { id: "s4-3", t: "Le modèle taylorien et le fordisme", h:
      '<div data-anim="s4-orga"></div>' +
      '<div class="aut"><span class="mono">FT</span><span class="an">Frederick W. Taylor<small>1856-1915</small></span><span class="ad">Ingénieur américain, auteur de <i>The Principles of Scientific Management</i> (1911). L’<b>organisation scientifique du travail</b> (OST) cherche « la seule bonne façon » (<i>one best way</i>) d’exécuter chaque tâche, mesurée au chronomètre.</span></div>' +
      '<p>Le modèle taylorien repose sur trois principes :</p><ul><li><b>Division verticale</b> : séparation entre ceux qui conçoivent (ingénieurs du bureau des méthodes) et ceux qui exécutent.</li><li><b>Division horizontale</b> : le travail est découpé en tâches élémentaires, chacune confiée à un ouvrier spécialisé qui répète les mêmes gestes.</li><li><b>Relation hiérarchique stricte</b> : contremaîtres qui contrôlent, temps imposés, salaire au rendement.</li></ul>' +
      '<div data-chain="s4-taylor"></div>' +
      '<div class="aut"><span class="mono">HF</span><span class="an">Henry Ford<small>1863-1947</small></span><span class="ad">En 1913, dans l’usine de Highland Park (Michigan), il installe la <b>chaîne de montage mobile</b> pour la Ford T : la pièce vient à l’ouvrier, le rythme est celui de la chaîne. Le 5 janvier 1914, il annonce la journée de travail payée <b>5 dollars</b>, environ le double du salaire courant, pour retenir des ouvriers qui démissionnaient en masse.</span></div>' +
      '<div data-chain="s4-ford"></div>' +
      '<div class="ex"><p>Avec la chaîne, le temps d’assemblage d’un châssis de Ford T passe, selon les chiffres de l’entreprise, de plus de douze heures à environ une heure et demie. Le prix de la voiture baisse fortement et elle devient accessible à une large clientèle, y compris aux ouvriers de Ford.</p></div>' +
      '<h3>Les limites</h3><p>Le sociologue Georges Friedmann parle du « <b>travail en miettes</b> » (1956) : le travail parcellisé est monotone, vide de sens et use les corps. Charlie Chaplin le caricature dans <i>Les Temps modernes</i> (1936). Absentéisme, rotation du personnel, malfaçons et grèves (celles des ouvriers spécialisés en France autour de 1968) en sont les symptômes. Le modèle est aussi <b>rigide</b> : il produit en grande série un produit standard (« la Ford T, de n’importe quelle couleur pourvu qu’elle soit noire », formule attribuée à Ford), alors que la demande se diversifie à partir des années 1970.</p>' },

    { id: "s4-4", t: "Le post-taylorisme : flexibilité, recomposition, participation", h:
      '<p class="lede">À partir des années 1970-1980, les entreprises cherchent une organisation plus <b>flexible</b>, capable de produire des séries variées, de bonne qualité, sans stocks. On parle de modèles <b>post-tayloriens</b>.</p>' +
      '<div data-chain="s4-post"></div>' +
      '<h3>1. La flexibilité</h3><ul><li><b>Productive</b> : produire « juste à temps », à la commande, avec des stocks minimaux (méthode <b>kanban</b> chez Toyota, théorisée par l’ingénieur Taiichi Ohno).</li><li><b>Quantitative</b> : ajuster le volume de travail, en interne (horaires variables, heures supplémentaires) ou en externe (CDD, intérim, sous-traitance).</li><li><b>Qualitative (ou fonctionnelle)</b> : des salariés polyvalents qui changent de poste selon les besoins.</li><li><b>Salariale</b> : une part du salaire liée aux résultats (primes, intéressement).</li></ul>' +
      '<h3>2. La recomposition des tâches</h3><p>On regroupe ce que le taylorisme avait séparé : <b>élargissement</b> (plusieurs tâches d’exécution), <b>enrichissement</b> (tâches de contrôle, de maintenance, de réglage), <b>rotation</b> entre postes, <b>équipes autonomes</b>. Volvo a ainsi organisé ses usines de Kalmar (1974) puis d’Uddevalla (1989) autour d’équipes qui assemblaient une grande partie de la voiture.</p>' +
      '<h3>3. Le management participatif</h3><p>Les salariés sont consultés et impliqués : cercles de qualité, groupes de résolution de problèmes, objectifs négociés, entretiens annuels. On attend d’eux initiative et engagement.</p>' +
      '<h3>Effets positifs et négatifs sur les conditions de travail</h3>' +
      '<div class="tbl"><table><thead><tr><th>Effets positifs</th><th>Effets négatifs</th></tr></thead><tbody>' +
      '<tr><td>Tâches plus variées, plus d’autonomie et de responsabilités</td><td><b>Intensification</b> : rythme fixé par le client, les délais, les objectifs</td></tr>' +
      '<tr><td>Compétences accrues, travail plus intéressant</td><td>Stress, risques psychosociaux, débordement sur la vie privée</td></tr>' +
      '<tr><td>Coopération dans l’équipe</td><td>Contrôle par les pairs et par les indicateurs ; précarité des salariés de la flexibilité externe (intérim, sous-traitance)</td></tr></tbody></table></div>' +
      '<div class="ex"><p>En 1984, 6 % des salariés déclaraient au moins trois contraintes de rythme ; ils sont environ un tiers aujourd’hui (34 % en 2019), selon les enquêtes Conditions de travail de la Dares (les définitions ont un peu évolué d’une enquête à l’autre). Le travail est moins parcellisé qu’à l’époque de Taylor, mais plus pressé.</p></div>' +
      '<div class="aut"><span class="mono">PA</span><span class="an">Philippe Askenazy<small><i>Les Désordres du travail</i>, 2004</small></span><span class="ad">Les nouvelles organisations (« productivisme réactif ») ont amélioré la productivité mais dégradé la santé au travail : troubles musculosquelettiques, accidents, stress, faute d’une prévention adaptée.</span></div>' +
      '<div class="attn"><p>Le taylorisme n’a pas disparu : on parle de <b>néo-taylorisme</b> dans les centres d’appels (scripts, temps de communication mesurés) ou dans les entrepôts de logistique (préparateurs guidés par une commande vocale ou un terminal qui fixe chaque geste). Les deux modèles coexistent.</p></div>' },

    { id: "s4-5", t: "Ce que le numérique change au travail", h:
      '<h3>1. Il brouille les frontières du travail</h3><p><b>Le lieu</b> : en 2025, 19,7 % des salariés télétravaillent au moins un jour par semaine, contre 4 % en 2019 avant la crise sanitaire ; c’est le cas de 51,7 % des cadres (Insee). <b>Le temps</b> : courriels et messageries prolongent le travail le soir et le week-end. La loi du 8 août 2016 a créé un <b>droit à la déconnexion</b>, entré en vigueur le 1<sup>er</sup> janvier 2017, que les entreprises de 50 salariés ou plus doivent organiser.</p>' +
      '<div class="ex"><p>Le télétravail apporte autonomie, moins de transports et une meilleure conciliation pour beaucoup de cadres ; mais il peut isoler, rendre le travail invisible et creuser l’écart avec les métiers qui ne peuvent pas être télétravaillés (ouvriers, soignants, caissières).</p></div>' +
      '<h3>2. Il transforme les relations d’emploi</h3><p>Les <b>plateformes</b> (VTC, livraison de repas, services à la tâche) mettent en relation clients et travailleurs indépendants. L’algorithme attribue les courses, fixe les prix, note les travailleurs : il joue une partie du rôle d’un employeur sans en avoir les obligations (cotisations, salaire minimum, congés).</p>' +
      '<div class="ex"><p>La Cour de cassation a requalifié en contrat de travail la relation d’un livreur avec Take Eat Easy (28 novembre 2018) puis celle d’un chauffeur avec Uber (4 mars 2020), en relevant un lien de subordination. La directive européenne 2024/2831 du 23 octobre 2024 sur le travail via une plateforme crée une présomption de salariat quand la plateforme contrôle le travail ; les États doivent la transposer d’ici décembre 2026.</p></div>' +
      '<h3>3. Il accroît le risque de polarisation des emplois</h3>' +
      '<div data-chain="s4-polar"></div>' +
      '<div class="def"><b>Polarisation des emplois</b> — hausse simultanée des emplois très qualifiés et des emplois peu qualifiés, au détriment des emplois intermédiaires.</div>' +
      '<p>Les économistes David Autor, Frank Levy et Richard Murnane (2003) ont montré que l’informatique remplace d’abord les <b>tâches routinières</b>, codifiables, qui sont souvent au milieu de l’échelle des salaires ; Maarten Goos et Alan Manning parlent de « <i>lousy and lovely jobs</i> » (2007). Selon l’OCDE (<i>Perspectives de l’emploi</i> 2017), entre 1995 et 2015, la part des emplois moyennement qualifiés a reculé de 9,5 points dans l’ensemble des pays de l’OCDE, quand celle des emplois très qualifiés progressait de 7,6 points et celle des emplois peu qualifiés de 1,9 point.</p>' +
      '<div class="plus"><p>En France, la hausse est surtout forte en haut de l’échelle (cadres : 23,8 % de l’emploi en 2025) ; le bas se maintient grâce aux services à la personne. L’intelligence artificielle générative pourrait toucher aussi des tâches qualifiées (rédaction, traduction, programmation) : ses effets sur l’emploi font encore débat.</p></div>' },

    { id: "s4-6", t: "Le travail, source d’intégration… fragilisée", h:
      '<div class="def"><b>Intégration sociale</b> — processus par lequel un individu est rattaché à la société : il y trouve une place, des liens et des règles partagées.</div>' +
      '<div data-chain="s4-integr"></div>' +
      '<div class="aut"><span class="mono">ÉD</span><span class="an">Émile Durkheim<small><i>De la division du travail social</i>, 1893</small></span><span class="ad">Dans les sociétés modernes, la division du travail rend les individus <b>complémentaires</b> et interdépendants : c’est la <b>solidarité organique</b>, qui remplace la solidarité mécanique fondée sur la ressemblance.</span></div>' +
      '<div class="aut"><span class="mono">RC</span><span class="an">Robert Castel<small><i>Les Métamorphoses de la question sociale</i>, 1995</small></span><span class="ad">Au XX<sup>e</sup> siècle, l’emploi salarié stable s’accompagne de droits (protection sociale, droit du travail) : c’est la <b>société salariale</b>. Quand l’emploi se précarise, les individus glissent d’une zone d’<b>intégration</b> vers une zone de <b>vulnérabilité</b>, puis de <b>désaffiliation</b> (perte d’emploi et de liens).</span></div>' +
      '<div class="aut"><span class="mono">SP</span><span class="an">Serge Paugam<small><i>Le Salarié de la précarité</i>, 2000</small></span><span class="ad">L’intégration professionnelle a deux dimensions : le rapport au <b>travail</b> (satisfaction) et le rapport à l’<b>emploi</b> (stabilité). D’où quatre types : intégration <b>assurée</b> (satisfait et stable), <b>laborieuse</b> (stable mais insatisfait), <b>incertaine</b> (satisfait mais instable), <b>disqualifiante</b> (ni l’un ni l’autre).</span></div>' +
      '<h3>Trois évolutions qui affaiblissent le pouvoir intégrateur</h3>' +
      '<ul><li><b>La précarisation</b> : contrats courts concentrés sur les jeunes (19,1 % des 15-24 ans en emploi sont en CDD en 2025) et sur les moins qualifiés ; intérim, temps partiel subi, faux indépendants des plateformes. Difficile de se projeter, de se loger, de construire une carrière.</li>' +
      '<li><b>Un chômage durablement élevé</b> : en 2025, le taux de chômage atteint 7,7 % (après un pic à 10,4 % en 2015), 19,8 % chez les 15-24 ans, et 23,1 % des chômeurs le sont depuis au moins un an (Insee). Le chômage de longue durée isole et disqualifie.</li>' +
      '<li><b>La polarisation de la qualité des emplois</b> : d’un côté des emplois stables, bien payés et autonomes ; de l’autre des emplois instables, pénibles et peu reconnus (12,3 % de sous-emploi chez les employés peu qualifiés). Le travail intègre alors très inégalement.</li></ul>' +
      '<div class="cle"><p>Le travail reste un puissant facteur d’intégration : la plupart des salariés sont en CDI (72,8 % des personnes en emploi en 2025) et 68 % estiment leur travail reconnu (2019). Mais cette intégration est devenue plus <b>inégale</b> : elle dépend de la qualité de l’emploi autant que du fait d’en avoir un.</p></div>' }
  ],

  retenir:
    '<h3>Définitions</h3><ul>' +
    '<li><b>Travail</b> : production de biens et services, rémunérée ou non. <b>Emploi</b> : travail rémunéré, sous un statut (salarié : subordination ; non-salarié : indépendant).</li>' +
    '<li><b>Actifs</b> = en emploi + chômeurs ; <b>inactifs</b> : les autres. <b>Chômeur BIT</b> : sans emploi, disponible, en recherche active.</li>' +
    '<li><b>Zones grises</b> : halo (4,5 % des 15-64 ans), sous-emploi (4,4 % des personnes en emploi), micro-entrepreneurs (3,7 %), plateformes.</li>' +
    '<li><b>Qualité de l’emploi</b> : conditions de travail, salaire, sécurité économique, horizon de carrière, formation, variété des tâches.</li>' +
    '<li><b>Taylor</b> (1911) : division verticale + horizontale, hiérarchie stricte, chronomètre. <b>Ford</b> (1913-1914) : chaîne mobile, standardisation, 5 dollars par jour, consommation de masse. Limites : travail en miettes (Friedmann), rigidité.</li>' +
    '<li><b>Post-taylorisme</b> : flexibilité (juste-à-temps, Ohno), recomposition des tâches (Volvo), management participatif. Effets : autonomie mais intensification (Askenazy).</li>' +
    '<li><b>Numérique</b> : télétravail et déconnexion ; plateformes et requalifications (Take Eat Easy 2018, Uber 2020, directive 2024/2831) ; polarisation (Autor ; OCDE : −9,5 points d’emplois intermédiaires, 1995-2015).</li>' +
    '<li><b>Intégration</b> : solidarité organique (Durkheim), société salariale et désaffiliation (Castel), quatre types d’intégration (Paugam). Affaiblie par précarisation, chômage persistant, polarisation de la qualité.</li></ul>' +
    '<h3>Chiffres à citer (Insee, 2025)</h3><ul><li>Taux d’emploi 15-64 ans 69,3 % ; chômage 7,7 % (15-24 ans : 19,8 %) ; CDD + intérim 9,4 % de l’emploi ; temps partiel 17,7 % (femmes 26,6 %, hommes 9,2 %).</li><li>Télétravail : 19,7 % des salariés, 51,7 % des cadres.</li></ul>',

  bac: [
    { type: "Savoir-faire", origine: "Exercice inventé pour le site, données Insee", t: "Part, taux et halo", enonce:
      '<p>En 2025, parmi les 15-24 ans, 8,5 % sont au chômage et 7,4 % dans le halo autour du chômage ; leur taux de chômage est de 19,8 % (Insee).</p><ol><li>Quelle part des 15-24 ans est sans emploi et souhaite travailler ?</li><li>Explique pourquoi le taux de chômage (19,8 %) est bien plus élevé que la part des chômeurs (8,5 %).</li><li>Déduis-en approximativement le taux d’activité des 15-24 ans, puis compare avec la donnée de l’Insee (43,0 %).</li></ol>',
      corrige: '<ol><li>8,5 + 7,4 = 15,9 % des 15-24 ans sont sans emploi et souhaitent travailler (c’est le chiffre publié par l’Insee).</li><li>La part rapporte les chômeurs à <b>toute</b> la population de l’âge ; le taux les rapporte aux seuls <b>actifs</b>. Or beaucoup de 15-24 ans sont inactifs (élèves, étudiants) : le dénominateur du taux est petit.</li><li>Taux de chômage = chômeurs ÷ actifs, donc actifs ÷ population = part des chômeurs ÷ taux de chômage = 8,5 ÷ 19,8 ≈ 0,43, soit environ 43 % : on retrouve le taux d’activité publié (43,0 %).</li></ol>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet inventé pour le site", t: "Montrez que les évolutions des formes d’emploi rendent plus incertaines les frontières entre emploi, chômage et inactivité.", enonce: "<p>Sans document.</p>",
      corrige: '<div class="copie"><p>Selon le Bureau international du travail, est en emploi toute personne qui a travaillé au moins une heure pendant une semaine de référence ; est chômeuse une personne sans emploi, disponible et qui recherche activement un emploi ; les autres sont inactives. Ces frontières, nettes dans la définition, deviennent floues dans la réalité.</p><p>D’abord, entre chômage et inactivité, des personnes souhaitent travailler sans remplir tous les critères du BIT, parce qu’elles sont découragées ou ne sont pas disponibles immédiatement : c’est le halo autour du chômage, qui concerne 4,5 % des 15-64 ans en 2025 selon l’Insee. Ensuite, entre emploi et chômage, des personnes en emploi à temps partiel voudraient travailler davantage : 4,4 % des personnes en emploi sont en sous-emploi. Elles travaillent, mais restent en partie dans la situation d’un chômeur. Enfin, la multiplication des contrats courts, de l’intérim et du statut de micro-entrepreneur (3,7 % des personnes en emploi) fait alterner les périodes d’emploi et de chômage, et brouille même la frontière entre salariat et indépendance, comme le montre le cas des livreurs des plateformes.</p></div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice inventé pour le site, document Dares-Insee", t: "Conditions de travail des salariés en 2019", enonce:
      '<p>Document : le graphique « Conditions de travail des salariés selon la catégorie, 2019 » du <a href="#s4:s4-2">cours</a>.</p><ol><li>Comparez la part des ouvriers et celle des cadres qui déclarent au moins trois contraintes de rythme. (2 points)</li><li>À l’aide du document et de vos connaissances, montrez que l’organisation du travail a des effets différents selon les catégories de salariés. (4 points)</li></ol>',
      corrige: '<ol><li>Selon l’enquête Conditions de travail de 2019, 54 % des ouvriers déclarent au moins trois contraintes de rythme, contre 22 % des cadres, soit 32 points d’écart : la proportion est environ 2,5 fois plus élevée chez les ouvriers.</li><li>Les ouvriers restent proches d’une organisation <b>taylorienne</b> : 69 % ont un travail répétitif et 42 % ne peuvent pas régler eux-mêmes les incidents, signe d’une division verticale forte (la conception et la décision leur échappent). Le post-taylorisme ne les a pas épargnés : flux tendus et juste-à-temps ajoutent des contraintes de rythme liées à la demande, d’où une <b>intensification</b>. Les employés connaissent aussi un travail souvent répétitif (56 %), notamment dans le commerce et les centres d’appels (néo-taylorisme). Les cadres bénéficient au contraire des aspects positifs des organisations post-tayloriennes : autonomie (seuls 17 % ne peuvent pas régler les incidents), tâches variées (11 % de travail répétitif), management participatif. Mais leur travail est aussi intense : 73 % doivent souvent s’interrompre pour une tâche imprévue, et le numérique prolonge leur travail hors du bureau.</li></ol>' },
    { type: "Partie 3 · Raisonnement sur dossier", origine: "Sujet inventé pour le site", t: "Montrez que certaines évolutions de l’emploi peuvent affaiblir le pouvoir intégrateur du travail.", enonce: '<p>Appuie-toi sur les graphiques « Les formes d’emploi en 2025 » et « Sans emploi et souhaitant travailler » du cours, et sur tes connaissances.</p>',
      corrige: '<p><b>Introduction.</b> Le travail intègre : il procure un revenu, des droits, une identité, des liens (Durkheim, Castel). Problème : trois évolutions fragilisent cette intégration.</p><p><b>I. La précarisation de l’emploi.</b> 9,4 % des personnes en emploi en CDD ou en intérim, mais 39,8 % seulement des 15-24 ans en CDI (Insee, 2025) ; sous-emploi (4,4 %, 12,3 % des employés peu qualifiés) ; plateformes. Intégration « incertaine » (Paugam), zone de vulnérabilité (Castel).</p><p><b>II. Un chômage persistant.</b> 7,7 % en 2025, 19,8 % chez les 15-24 ans ; 23,1 % des chômeurs depuis plus d’un an ; halo (4,5 %). Perte de revenu, de statut, de liens : risque de désaffiliation.</p><p><b>III. La polarisation de la qualité des emplois.</b> Emplois qualifiés autonomes et télétravaillables (51,7 % des cadres) contre emplois répétitifs et pénibles (69 % des ouvriers ont un travail répétitif). Intégration « laborieuse » ou « disqualifiante ».</p><p><b>Conclusion.</b> Le travail reste intégrateur pour la majorité (72,8 % en CDI ou fonctionnaires), mais de façon plus inégale.</p>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet inventé pour le site", t: "Les transformations de l’organisation du travail ont-elles amélioré les conditions de travail ?", enonce: "<p>Construis la problématique et le plan, puis compare.</p>",
      corrige: '<p><b>Problématique.</b> Depuis les années 1970, le modèle taylorien et fordiste a reculé au profit d’organisations flexibles et participatives, puis le numérique a transformé le travail. Ces changements, souvent présentés comme une libération du travail parcellisé, ont-ils réellement amélioré les conditions de travail, et pour qui ?</p><p><b>I. Des améliorations réelles</b><br>A. La fin du « travail en miettes » pour beaucoup : recomposition des tâches, autonomie, polyvalence (Volvo).<br>B. Le management participatif valorise l’initiative et les compétences.<br>C. Le numérique allège certaines tâches pénibles et permet le télétravail (19,7 % des salariés en 2025).</p><p><b>II. Mais une dégradation sur d’autres plans</b><br>A. L’intensification : 6 % des salariés avec au moins trois contraintes de rythme en 1984, 34 % en 2019 ; stress (Askenazy).<br>B. Le néo-taylorisme dans la logistique et les centres d’appels ; contrôle par les indicateurs et les algorithmes.<br>C. La flexibilité externe reporte l’insécurité sur les précaires (intérim, plateformes).</p><p><b>III. Des effets très inégaux</b><br>A. Ouvriers et employés cumulent contraintes et répétitivité (54 % et 29 % de contraintes de rythme), cadres autonomes mais interrompus.<br>B. Polarisation des emplois et de leur qualité.<br>C. Le rôle des règles : droit à la déconnexion (2016), requalification des travailleurs des plateformes (2018, 2020), directive européenne de 2024.</p>' }
  ]
};

CH.s5 = {
  chapo: "Voter, adhérer à un parti, militer dans un syndicat, donner du temps à une association, boycotter une marque, signer une pétition en ligne : l’engagement politique prend bien des formes. Pourquoi s’engager quand on pourrait laisser les autres agir à sa place ? Qui s’engage, et comment les causes, les acteurs et les modes d’action ont-ils changé ? Ce chapitre répond avec les données de l’Insee et les grands auteurs de la science politique.",
  essentiel: [
    "L’<b>engagement politique</b> désigne toutes les formes de participation à la vie publique : <b>vote</b>, <b>militantisme</b> (partis, syndicats), <b>engagement associatif</b>, <b>consommation engagée</b> (boycott, achat responsable). Le vote devient <b>intermittent</b> : en 2022, 47,2 % des inscrits ont voté à certains tours seulement, 37,0 % à tous (Insee).",
    "Le <b>paradoxe de l’action collective</b> (Olson, 1965) : un individu rationnel a intérêt à laisser les autres se mobiliser pour un bien collectif dont il profitera de toute façon (passager clandestin).",
    "Les individus s’engagent pourtant grâce aux <b>incitations sélectives</b> (Olson), aux <b>rétributions symboliques</b> (Gaxie, 1977) et quand la <b>structure des opportunités politiques</b> est favorable (Eisinger, Tarrow).",
    "L’engagement dépend de <b>variables sociodémographiques</b> : la <b>catégorie sociale</b> et le <b>diplôme</b> (abstention systématique : 30,4 % sans diplôme, 9,5 % pour les diplômés du supérieur en 2022), l’<b>âge et la génération</b> (vote systématique : 16,7 % des 18-24 ans, 53,7 % des 70-74 ans), le <b>sexe</b>.",
    "Les <b>objets</b> de l’action collective se diversifient (conflits du travail, nouveaux enjeux, luttes minoritaires), comme les <b>acteurs</b> (partis, syndicats, associations, groupements) et les <b>répertoires d’action</b> (Tilly) : grève et manifestation, mais aussi pétition en ligne, action en justice, occupation, désobéissance civile."
  ],

  ],
  notions: ["engagement politique", "participation électorale", "abstention (systématique, intermittente)", "militantisme", "engagement associatif", "consommation engagée (boycott, buycott)", "action collective", "bien collectif", "paradoxe de l’action collective", "passager clandestin", "incitations sélectives", "rétributions symboliques", "structure des opportunités politiques", "compétence politique", "effet d’âge, effet de génération", "conflits du travail", "nouveaux mouvements sociaux", "luttes minoritaires", "partis politiques", "syndicats", "associations", "groupements, groupes d’intérêt", "répertoire d’action collective"],
  sections: [
    { id: "s5-1", t: "Les formes variées de l’engagement politique", h:
      '<div class="def"><b>Engagement politique</b> — participation, individuelle ou collective, à la vie de la cité : choisir ses représentants, défendre une cause, peser sur une décision publique. Il va du geste ponctuel (voter, signer une pétition) à l’investissement durable (militer pendant des années).</div>' +
      '<h3>1. Le vote</h3><p>Forme d’engagement la plus répandue, le vote est un droit (suffrage universel masculin en 1848, étendu aux femmes par l’ordonnance du 21 avril 1944). La participation varie selon l’élection : près des trois quarts des inscrits ont voté au premier tour de la présidentielle de 2022 (73,7 %), 66,7 % au premier tour des législatives anticipées de 2024, le plus haut niveau pour un premier tour de législatives depuis 1997, et un peu plus de la moitié aux européennes de 2024.</p>' +
      '<div data-graph="s5-tend"></div>' +
      '<p>Lecture : selon l’Insee, en 2022, 37,0 % des inscrits ont voté à tous les tours de la présidentielle et des législatives, 47,2 % à certains tours seulement et 15,8 % à aucun. Depuis 2017, le <b>vote intermittent</b> dépasse le vote systématique : beaucoup votent pour l’élection qui leur paraît décisive (la présidentielle) et s’abstiennent aux autres. L’abstention n’est donc pas toujours un retrait : elle peut être un choix ponctuel.</p>' +
      '<h3>2. Le militantisme</h3><div class="def"><b>Militantisme</b> — engagement durable et actif au service d’une organisation ou d’une cause : coller des affiches, tracter, organiser des réunions, représenter ses collègues.</div><p>Il se fait dans les <b>partis politiques</b>, qui visent la conquête du pouvoir, et dans les <b>syndicats</b>, qui défendent les intérêts des salariés. Environ un salarié sur dix est syndiqué en France (environ 10 % en 2019, Dares, 2023), beaucoup plus dans la fonction publique que dans le privé.</p>' +
      '<h3>3. L’engagement associatif</h3><p>Les associations (loi du 1<sup>er</sup> juillet 1901) défendent des causes (environnement, droits humains, solidarité) ou rendent des services. En 2025, 21 % des Français de 15 ans ou plus font du bénévolat dans une association, soit environ 12 millions de personnes (baromètre France Bénévolat / Ifop). Toutes les associations ne sont pas politiques, mais beaucoup interpellent les pouvoirs publics (Restos du cœur, Greenpeace, Ligue des droits de l’homme).</p>' +
      '<h3>4. La consommation engagée</h3><div class="def"><b>Consommation engagée</b> — usage politique de ses achats : <b>boycott</b> (refuser d’acheter les produits d’une entreprise) ou <b>buycott</b> (acheter de préférence des produits jugés responsables : commerce équitable, produits locaux).</div><div class="ex"><p>Le label de commerce équitable Max Havelaar est créé en 1988 aux Pays-Bas. En 2001, un appel au boycott des produits Danone répond à l’annonce de fermetures d’usines de biscuits LU. La sociologue Sophie Dubuisson-Quellier (<i>La Consommation engagée</i>, 2009) montre que ces gestes individuels sont souvent organisés par des collectifs.</p></div>' +
      '<div class="plus"><p>On peut ajouter d’autres formes : signer une pétition (en ligne ou non), manifester, faire grève, s’exprimer sur les réseaux sociaux, participer à une consultation publique. Les mêmes personnes cumulent souvent plusieurs formes d’engagement.</p></div>' },

    { id: "s5-2", t: "Le paradoxe de l’action collective… et comment on le dépasse", h:
      '<div data-anim="s5-olson"></div>' +
      '<div class="aut"><span class="mono">MO</span><span class="an">Mancur Olson<small><i>Logique de l’action collective</i>, 1965</small></span><span class="ad">Économiste américain. Dans un <b>grand groupe</b>, la contribution de chacun au <b>bien collectif</b> (une hausse de salaire, une loi) est négligeable, alors que son coût est individuel ; comme le bien profitera à tous, chacun a intérêt à être <b>passager clandestin</b> (<i>free rider</i>). D’où le paradoxe : des individus qui ont un intérêt commun peuvent ne pas agir ensemble.</span></div>' +
      '<div data-chain="s5-olson"></div>' +
      '<div class="def"><b>Bien collectif</b> — bien ou avantage dont personne ne peut être exclu une fois qu’il est obtenu (la hausse de salaire négociée vaut pour tous les salariés de la branche, syndiqués ou non).</div>' +
      '<h3>1. Les incitations sélectives</h3><p>Olson lui-même donne la solution : réserver des <b>avantages</b> aux seuls membres (incitations positives) ou <b>sanctionner</b> ceux qui ne participent pas (incitations négatives).</p>' +
      '<div class="ex"><p>Positives : conseil juridique, assurances, formations, informations réservées aux adhérents d’un syndicat ou d’une association. Négatives : dans certains pays, le <i>closed shop</i> imposait d’être syndiqué pour être embauché ; la pression des collègues pendant une grève joue un rôle comparable.</p></div>' +
      '<h3>2. Les rétributions symboliques</h3><div class="aut"><span class="mono">DG</span><span class="an">Daniel Gaxie<small>« Économie des partis et rétributions du militantisme », 1977</small></span><span class="ad">Les militants sont aussi « payés » autrement qu’en argent : <b>reconnaissance</b>, sentiment d’utilité, amitiés et sociabilité, estime de soi, compétences acquises (prendre la parole, organiser), parfois une carrière (élu, permanent).</span></div>' +
      '<p>L’économiste Albert Hirschman (<i>Bonheur privé, action publique</i>, 1982) ajoute que l’engagement peut être une fin en soi : on s’engage aussi pour le plaisir d’agir ensemble, et l’on alterne des phases d’engagement public et de repli sur la vie privée au gré des déceptions.</p>' +
      '<h3>3. La structure des opportunités politiques</h3><div class="def"><b>Structure des opportunités politiques</b> — ensemble des caractéristiques du contexte politique qui rendent une mobilisation plus ou moins susceptible de réussir : ouverture des institutions, alliés au pouvoir, divisions entre élites, tolérance ou répression. La notion a été proposée par Peter Eisinger (1973) et développée notamment par Sidney Tarrow.</div>' +
      '<div class="ex"><p>Les défenseurs du mariage pour les couples de même sexe se sont mobilisés pendant des années ; la loi est adoptée le 17 mai 2013, après l’élection en 2012 d’une majorité qui l’avait inscrite à son programme. À l’inverse, les opposants (la « Manif pour tous ») ont rassemblé des foules très importantes sans obtenir le retrait du texte : une majorité stable leur fermait l’opportunité.</p></div>' +
      '<div data-chain="s5-depasser"></div>' +
      '<div class="plus"><p>Albert Hirschman (<i>Exit, Voice and Loyalty</i>, 1970) propose aussi trois réactions face à un mécontentement : la <b>défection</b> (partir, changer de fournisseur), la <b>prise de parole</b> (protester) et la <b>loyauté</b> (rester fidèle). La prise de parole est d’autant plus probable que la défection est difficile.</p></div>' },

    { id: "s5-3", t: "Qui s’engage ? Les variables sociodémographiques", h:
      '<p class="lede">L’engagement n’est pas réparti au hasard. Le programme cite quatre variables.</p>' +
      '<h3>1. La catégorie socioprofessionnelle</h3><div data-graph="s5-pcs"></div><p>Lecture : en 2022, 19,7 % des ouvriers inscrits (de 25 ans ou plus) n’ont voté à aucun tour, contre 6,8 % des cadres (Insee). Les cadres et les professions intermédiaires sont aussi surreprésentés parmi les adhérents de partis et les dirigeants d’associations. Le taux de syndicalisation est plus élevé chez les salariés de la fonction publique et les catégories intermédiaires que chez les ouvriers et employés du privé, notamment dans les petites entreprises.</p>' +
      '<h3>2. Le diplôme</h3><div data-graph="s5-dipl"></div><div data-chain="s5-diplome"></div><p>Le sociologue Daniel Gaxie parle de « <b>cens caché</b> » (1978) : alors que le suffrage censitaire a disparu, le sentiment d’incompétence politique tient encore une partie des moins diplômés à l’écart. L’effet est le plus fort chez les jeunes : en 2022, 50,3 % des 18-29 ans sans diplôme et non étudiants n’ont voté à aucun tour, contre 17,0 % des jeunes diplômés du supérieur (Insee).</p>' +
      '<h3>3. L’âge et la génération</h3><div data-graph="s5-age"></div><p>Lecture : en 2022, 16,7 % des inscrits de 18 à 24 ans ont voté à tous les tours, contre 53,7 % des 70-74 ans. Deux effets se combinent :</p><ul><li><b>Effet d’âge</b> (cycle de vie) : les jeunes sont moins « installés » (études, mobilité, pas encore de logement ni d’emploi stable, parfois mal inscrits) ; la participation augmente avec l’insertion, puis baisse au grand âge (55,3 % d’abstention systématique chez les 90 ans ou plus).</li><li><b>Effet de génération</b> : à âge égal, les générations récentes votent moins régulièrement. En 2002, 32,5 % des 18-24 ans votaient à tous les tours ; en 2022, 16,7 %. Le politiste Vincent Tiberj y voit moins un désintérêt qu’une citoyenneté plus <b>distante et critique</b> : le vote n’est plus vécu comme un devoir, mais il est complété par d’autres formes d’engagement (pétitions, manifestations, causes).</li></ul>' +
      '<h3>4. Le sexe</h3><p>Depuis les années 1980, femmes et hommes votent à peu près autant. Mais les femmes restent sous-représentées dans le militantisme partisan et les fonctions électives, malgré la loi sur la <b>parité</b> du 6 juin 2000. Leur engagement prend plus souvent d’autres formes :</p>' +
      '<div class="ex src"><p>Selon le baromètre jeunesse 2019 de l’INJEP (document repris dans un sujet officiel du bac 2026), 49 % des jeunes femmes déclarent avoir signé une pétition ou défendu une cause sur internet, contre 40 % des jeunes hommes ; les jeunes hommes sont plus présents dans l’engagement bénévole (43 % contre 31 %), l’adhésion à un parti (7 % contre 3 %) et les manifestations, grèves ou occupations (22 % contre 12 %).</p></div>' +
      '<div class="cle"><p>Ces variables se cumulent : un jeune ouvrier sans diplôme s’abstient bien plus souvent qu’une cadre retraitée. Elles agissent à travers la <b>socialisation politique</b> (famille, école, travail) et le sentiment de <b>compétence</b>.</p></div>' },

    { id: "s5-4", t: "Les transformations de l’action collective : objets, acteurs, répertoires", h:
      '<div class="def"><b>Action collective</b> — action concertée d’un groupe d’individus pour défendre des intérêts communs ou une cause.</div>' +
      '<h3>1. Des objets qui se diversifient</h3><p><b>Les conflits du travail</b> (salaires, emplois, conditions de travail, retraites) ont longtemps structuré l’action collective autour du mouvement ouvrier. Ils restent importants : en 2023, l’intersyndicale a organisé plusieurs mois de grèves et de manifestations contre la réforme des retraites, adoptée après l’usage de l’article 49.3 le 16 mars 2023.</p>' +
      '<div data-chain="s5-nms"></div>' +
      '<p>Le sociologue <b>Alain Touraine</b> parle dès les années 1970 de <b>nouveaux mouvements sociaux</b> : écologistes, féministes, régionalistes, qui défendent des valeurs et des modes de vie plus que des intérêts matériels. Le politiste Ronald Inglehart (<i>The Silent Revolution</i>, 1977) explique leur essor par la diffusion de valeurs <b>post-matérialistes</b> chez des générations qui ont grandi dans l’abondance.</p>' +
      '<p><b>Les luttes minoritaires</b> sont menées par des groupes dominés ou discriminés pour obtenir l’égalité des droits et la reconnaissance : Manifeste des 343 pour le droit à l’avortement (1971), loi Veil (17 janvier 1975) ; Marche pour l’égalité et contre le racisme (1983) ; mobilisations homosexuelles, d’Act Up dans la lutte contre le sida au PaCS (1999) puis au mariage pour tous (2013) ; mouvement #MeToo (2017) contre les violences sexuelles.</p>' +
      '<h3>2. Des acteurs plus nombreux</h3><div class="tbl"><table><thead><tr><th>Acteur</th><th>Ce qu’il fait</th><th>Évolution</th></tr></thead><tbody>' +
      '<tr><td><b>Partis politiques</b></td><td>Conquérir et exercer le pouvoir, sélectionner les candidats, proposer des programmes</td><td>Adhérents en baisse, méfiance ; essor de mouvements plus souples autour d’un leader</td></tr>' +
      '<tr><td><b>Syndicats</b></td><td>Défendre les intérêts des salariés, négocier, organiser les grèves</td><td>Environ 10 % de syndiqués ; représentativité fondée depuis 2008 sur les élections professionnelles</td></tr>' +
      '<tr><td><b>Associations</b></td><td>Défendre une cause, rendre des services, alerter, agir en justice</td><td>Très nombreuses, actives sur l’environnement, la santé, les droits</td></tr>' +
      '<tr><td><b>Groupements</b> (groupes d’intérêt, collectifs, coordinations)</td><td>Peser sur une décision précise (lobbying), mobiliser sans structure permanente</td><td>Collectifs éphémères, coordinations de grévistes, mobilisations nées sur les réseaux sociaux</td></tr></tbody></table></div>' +
      '<div class="ex"><p>Le mouvement des « gilets jaunes », lancé le 17 novembre 2018 contre la hausse de la taxe sur les carburants, s’est organisé sur les réseaux sociaux et sur les ronds-points, sans parti ni syndicat à sa tête et en refusant souvent les porte-parole.</p></div>' +
      '<h3>3. Des répertoires d’action qui changent</h3><div class="aut"><span class="mono">CT</span><span class="an">Charles Tilly<small><i>La France conteste, de 1600 à nos jours</i>, 1986</small></span><span class="ad">Le <b>répertoire d’action collective</b> est l’ensemble limité des moyens d’action qu’un groupe connaît et juge légitimes à une époque. En France, vers le milieu du XIX<sup>e</sup> siècle, on passe d’un répertoire <b>local et patronné</b> (charivaris, émeutes de subsistance) à un répertoire <b>national et autonome</b> (grève, manifestation, réunion publique, pétition).</span></div>' +
      '<p>Depuis la fin du XX<sup>e</sup> siècle, ce répertoire s’enrichit :</p><ul><li><b>Médiatisation et expertise</b> : actions spectaculaires pensées pour les caméras, contre-expertises scientifiques.</li><li><b>Numérique</b> : pétitions en ligne, mots-dièses, mobilisation rapide. La pétition « L’Affaire du siècle », lancée en décembre 2018, a réuni plus de deux millions de signatures.</li><li><b>Action en justice</b> : dans la même affaire, le tribunal administratif de Paris a reconnu le 3 février 2021 la carence fautive de l’État en matière climatique.</li><li><b>Occupation et désobéissance civile</b> : la « zone à défendre » de Notre-Dame-des-Landes (projet d’aéroport abandonné le 17 janvier 2018), actions non violentes d’Extinction Rebellion.</li><li><b>Échelle européenne et mondiale</b> : marches pour le climat coordonnées dans de nombreux pays en 2019.</li></ul>' +
      '<div class="attn"><p>Les anciens moyens ne disparaissent pas : la grève et la manifestation restent centrales (mobilisations de 2023). On dit plutôt que le répertoire s’<b>élargit</b> et que les militants combinent les formes.</p></div>' +
      '<div data-anim="s5-tilly"></div>' }
  ],
  pieges: [
    { f: "« L’abstention montre que les Français se désintéressent de la politique. »", v: "L’abstention est souvent <b>intermittente</b> (47,2 % de votants intermittents en 2022) et coexiste avec d’autres formes d’engagement (pétitions, associations, manifestations)." },
    { f: "« Le paradoxe d’Olson dit que les gens sont égoïstes. »", v: "Il dit qu’un individu <b>rationnel</b> peut avoir intérêt à ne pas participer à une action dont il profitera de toute façon. C’est un raisonnement sur les coûts et les gains, valable surtout dans les grands groupes." },
    { f: "Confondre incitations sélectives et rétributions symboliques.", v: "Les incitations sélectives sont des <b>avantages matériels ou sanctions</b> réservés aux membres (Olson). Les rétributions symboliques sont des gains <b>non matériels</b> : reconnaissance, liens, estime de soi (Gaxie)." },

  bac: [
    { type: "Savoir-faire", origine: "Exercice inventé pour le site, données Insee", t: "Lire et comparer des données de participation", enonce:
      '<p>En 2022, selon l’Insee, 30,4 % des inscrits sans diplôme et 9,5 % des diplômés du supérieur n’ont voté à aucun tour ; 28,8 % et 43,7 % ont voté à tous les tours. En 2002, l’abstention systématique était de 16,6 % et 5,9 %.</p><ol><li>Calcule l’écart en points et le rapport entre les deux groupes pour l’abstention systématique en 2022.</li><li>Calcule le taux de variation de l’abstention systématique des inscrits sans diplôme entre 2002 et 2022.</li><li>Rédige une phrase qui résume l’évolution.</li></ol>',
      corrige: '<ol><li>30,4 − 9,5 = 20,9 points ; 30,4 ÷ 9,5 ≈ 3,2 : l’abstention systématique est 3,2 fois plus fréquente chez les inscrits sans diplôme.</li><li>(30,4 − 16,6) ÷ 16,6 × 100 ≈ +83 % : elle a presque doublé (coefficient multiplicateur 1,83).</li><li>« Selon l’Insee, entre 2002 et 2022, l’abstention systématique a progressé dans tous les groupes, mais beaucoup plus chez les inscrits sans diplôme : l’écart avec les diplômés du supérieur passe de 10,7 à 20,9 points. »</li></ol>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet officiel : bac 2026, sujet 26-SESJ2G11 (épreuve composée), partie 1 · corrigé du site", officiel: true, t: "Vous présenterez deux formes d’engagement politique.", enonce: "<p>4 points (session 2026). Sans document.</p>",
      methode: "<p>Définis l’engagement politique ; pour chaque forme : définition, exemple précis et chiffré, éventuellement une évolution. Deux paragraphes distincts suffisent.</p>",
      corrige: '<div class="copie"><p>L’engagement politique désigne l’ensemble des formes de participation des individus à la vie publique, pour choisir leurs représentants, défendre une cause ou peser sur les décisions. Il prend des formes variées, dont le vote et la consommation engagée.</p><p>Le vote est la forme d’engagement la plus répandue : il permet aux citoyens de désigner leurs représentants. Il devient plus intermittent : selon l’Insee, en 2022, 37,0 % des inscrits ont voté à tous les tours de la présidentielle et des législatives, 47,2 % à certains tours seulement et 15,8 % à aucun. Beaucoup d’électeurs choisissent donc les élections qui leur paraissent décisives.</p><p>La consommation engagée consiste à utiliser ses achats comme un moyen d’action politique : boycotter les produits d’une entreprise dont on désapprouve les pratiques, ou au contraire privilégier des produits jugés responsables (buycott), comme ceux du commerce équitable. En 2001, par exemple, un appel au boycott des produits Danone a répondu à l’annonce de fermetures d’usines. Cette forme d’engagement, individuelle en apparence, est souvent organisée par des associations.</p></div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice inventé pour le site, document Insee", t: "Le vote systématique selon l’âge en 2002 et 2022", enonce:
      '<p>Document : le graphique « Le vote systématique selon l’âge, 2002 et 2022 » du <a href="#s5:s5-3">cours</a> (Insee).</p><ol><li>Comparez le vote systématique des 18-24 ans et des 70-74 ans en 2022. (2 points)</li><li>À l’aide du document et de vos connaissances, montrez que la participation électorale dépend de l’âge et de la génération. (4 points)</li></ol>',
      corrige: '<ol><li>Selon l’Insee, en 2022, 16,7 % des inscrits de 18 à 24 ans ont voté à tous les tours de la présidentielle et des législatives, contre 53,7 % des 70-74 ans : 37 points d’écart, soit une proportion environ 3,2 fois plus élevée chez les 70-74 ans.</li><li>La participation dépend d’abord de l’<b>âge</b> : le vote systématique augmente de 18 à 79 ans puis chute au grand âge (21,4 % à 90 ans ou plus). C’est un effet de cycle de vie : les jeunes, peu installés (études, mobilité, emploi instable, inscription parfois à un ancien domicile), votent par intermittence ; l’insertion professionnelle et familiale renforce l’intégration et la participation ; la santé et l’isolement la réduisent ensuite. Elle dépend aussi de la <b>génération</b> : à âge égal, la participation régulière a reculé, surtout chez les jeunes (32,5 % des 18-24 ans votaient à tous les tours en 2002, 16,7 % en 2022). Les générations récentes vivent moins le vote comme un devoir et pratiquent un vote intermittent, tout en recourant à d’autres formes d’engagement (pétitions, manifestations, associations) : une citoyenneté plus distante et critique.</li></ol>' },
    { type: "Partie 3 · Raisonnement sur dossier", origine: "Sujet officiel : bac 2026, sujet 26-SESJ2AG1 (épreuve composée), partie 3 · corrigé du site", officiel: true, t: "Vous montrerez que l’engagement politique dépend de variables sociodémographiques.", enonce: '<p>Le dossier officiel comprenait : un tableau de l’Insee sur les comportements de vote en 2022 selon l’âge, un extrait du baromètre jeunesse 2019 de l’INJEP sur les formes d’engagement des jeunes femmes et des jeunes hommes, un graphique de la Dares sur la syndicalisation selon le secteur et la catégorie (2013 et 2019). Utilise les données du cours.</p>',
      corrige: '<p><b>Introduction.</b> L’engagement politique regroupe vote, militantisme, engagement associatif, consommation engagée. Il n’est pas réparti au hasard : il varie selon l’âge et la génération, le sexe, le diplôme et la catégorie sociale.</p><p><b>I. L’âge et la génération.</b> Vote systématique 2022 : 17,3 % des 18-29 ans, 37,2 % des 30-64 ans, 47,7 % des 65 ans ou plus ; abstention systématique 23,7 % chez les 18-29 ans (document 1). Effet d’âge (installation) et effet de génération (citoyenneté distante, vote intermittent ; 32,5 % des 18-24 ans votaient à tous les tours en 2002).</p><p><b>II. Le sexe.</b> Vote désormais comparable ; mais formes différentes : jeunes femmes plus engagées en ligne (49 % contre 40 %), jeunes hommes plus présents dans les partis (7 % contre 3 %), le bénévolat et les manifestations (document 2) ; sous-représentation des femmes dans le militantisme partisan malgré la parité (2000).</p><p><b>III. Le diplôme et la catégorie sociale.</b> Abstention systématique 30,4 % sans diplôme, 9,5 % diplômés du supérieur ; ouvriers 19,7 %, cadres 6,8 % (Insee, 2022). Cens caché (Gaxie). Syndicalisation plus forte chez les cadres et professions intermédiaires du public que chez les ouvriers et employés du privé (document 3).</p><p><b>Conclusion.</b> Ces variables se cumulent et agissent par la socialisation et le sentiment de compétence politique.</p>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet inventé pour le site", t: "Comment expliquer que les individus s’engagent malgré le paradoxe de l’action collective ?", enonce: "<p>Construis la problématique et le plan, puis compare.</p>",
      corrige: '<p><b>Problématique.</b> Olson montre qu’un individu rationnel a intérêt à être passager clandestin. Pourtant, les grèves, les manifestations, les associations et les partis existent. Quels mécanismes rendent l’engagement rationnel, désirable ou possible ?</p><p><b>I. Un paradoxe réel</b><br>A. Bien collectif, coût individuel, contribution négligeable dans un grand groupe (Olson, 1965).<br>B. Des signes : environ 10 % de syndiqués, adhérents des partis en baisse, abstention systématique de 15,8 % en 2022.</p><p><b>II. Des gains individuels qui rendent l’engagement rationnel</b><br>A. Incitations sélectives positives (services aux adhérents) et négatives (closed shop, pression des pairs).<br>B. Rétributions symboliques (Gaxie) : reconnaissance, liens, compétences, carrière.<br>C. Le plaisir de l’action et les cycles d’engagement (Hirschman).</p><p><b>III. Un contexte et des ressources qui rendent l’engagement possible</b><br>A. Structure des opportunités politiques (mariage pour tous, 2013 ; Notre-Dame-des-Landes, 2018).<br>B. Ressources inégales : diplôme, PCS, âge (cens caché).<br>C. De nouveaux répertoires qui abaissent le coût de l’engagement (pétitions en ligne, réseaux sociaux).</p>' }
  ]
};

  /* ---------- calculatrice de savoir-faire ---------- */

    function aj(t, ou, route, texte) { INDEX.push({ t: t, ou: ou, r: route, x: texte, nt: sansAccent(t), nx: sansAccent(texte) }); }
    Object.keys(CH).forEach(function (id) {
      var ch = CH[id], q = QS[id];
      ch.sections.forEach(function (s) {
        var tx = texteDe(s.h.replace(/<div data-chain="([^"]+)"><\/div>/g, function (m, c) { return CHAINES[c] ? " " + CHAINES[c].t + " : " + texteChaine(CHAINES[c]) + " " : ""; }));
        aj(s.t, q.court, "#" + id + ":" + s.id, tx);
      });
      ch.cartes.forEach(function (c) { aj(texteDe(c.r), q.court + " · carte", "#" + id + "/cartes", texteDe(c.v)); });
      ch.bac.forEach(function (b, i) { aj(b.t, q.court + " · sujet", "#" + id + "/bac", texteDe(b.enonce)); });
      aj("À retenir : " + q.court, q.court + " · fiche", "#" + id + "/fiche", texteDe(ch.retenir));
    });
    PROG.forEach(function (c) { c.qs.forEach(function (q) { if (q.statut !== "red") aj(q.titre, "Bientôt · " + c.nom, "#" + q.id, q.objectifs.join(" ") + " " + q.notions.join(" ")); }); });
    AUTEURS.forEach(function (a) { aj(a.n, "Auteur · " + [a.ch].concat(a.aussi || []).map(function (c) { return QS[c].court; }).join(" · "), "#auteurs", texteDe(a.l)); });
    var tmp = document.createElement("div");
    [["#epreuve", "L'épreuve", EPREUVE], ["#outils", "Savoir-faire", OUTILS]].forEach(function (p) {
      tmp.innerHTML = p[2];
      $$("h2", tmp).forEach(function (h2) {
        var t = h2.textContent, x = "", n = h2.nextElementSibling;
        while (n && n.tagName !== "H2") { x += " " + n.textContent; n = n.nextElementSibling; }
        aj(t.replace(/^\S{1,3}(?=[A-ZÀ-Ý])/, ""), p[1], p[0], x.replace(/\s+/g, " "));
      });
    });
  }
  function chercher(qr) {
    var zone = $("#sres");
    var mots = sansAccent(qr).split(/\s+/).filter(function (m) { return m.length > 1; });
    if (!mots.length) { zone.innerHTML = '<p class="vide">Tape un mot : « destruction créatrice », « Bourdieu », « HOS », « coefficient multiplicateur »…</p>'; return; }
    if (!INDEX) construireIndex();
    var res = [];
    INDEX.forEach(function (e) {
      var sc = 0;
      for (var i = 0; i < mots.length; i++) {
        var inT = e.nt.indexOf(mots[i]) >= 0, inX = e.nx.indexOf(mots[i]) >= 0;
        if (!inT && !inX) return;
        sc += (inT ? 10 : 0) + (inX ? 1 : 0);
      }
      res.push({ e: e, sc: sc });
    });
    res.sort(function (a, b) { return b.sc - a.sc; });
    if (!res.length) { zone.innerHTML = '<p class="vide">Rien trouvé pour « ' + esc(qr) + " ». Essaie un autre mot, sans faute de frappe.</p>"; return; }
    zone.innerHTML = res.slice(0, 30).map(function (r) {
      var e = r.e, p = e.nx.indexOf(mots[0]), ext = "";
      if (p >= 0) { var d = Math.max(0, p - 60); ext = (d ? "…" : "") + esc(e.x.substr(d, 170)) + "…"; }
      else ext = esc(e.x.substr(0, 150)) + (e.x.length > 150 ? "…" : "");
      mots.forEach(function (m) {
        if (m.length < 3) return;
        var VAR = { a: "[aàâä]", e: "[eéèêë]", i: "[iîï]", o: "[oôö]", u: "[uùûü]", c: "[cç]" };
        ext = ext.replace(new RegExp("(" + m.split("").map(function (c) { return VAR[c] || c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("") + ")", "gi"), "<mark>$1</mark>");
      });
      return '<a href="' + e.r + '"><small>' + esc(e.ou) + "</small><b>" + esc(e.t) + "</b><span>" + ext + "</span></a>";
    }).join("");
  }

  /* ---------- démarrage ---------- */
  /* ---------- typographie française à l'affichage : espace insécable avant ? ! : ; » % et après « ---------- */
  function typoTexte(v) { return v.replace(/ ([?!:;»%])/g, "\u00a0$1").replace(/« /g, "«\u00a0"); }
  function typo(racine) {
    if (!racine) return;
    if (racine.nodeType === 3) { var t = typoTexte(racine.nodeValue); if (t !== racine.nodeValue) racine.nodeValue = t; return; }
    if (racine.nodeType !== 1 || /^(SCRIPT|STYLE|TEXTAREA|INPUT)$/.test(racine.tagName)) return;
    var w = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT, null), n;
    while ((n = w.nextNode())) { var v = typoTexte(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
  }
  function demarrer() {
    typo(document.body);
    if ("MutationObserver" in window) new MutationObserver(function (recs) {
      recs.forEach(function (r) {
        if (r.target.closest && r.target.closest("svg")) return;
        Array.prototype.forEach.call(r.addedNodes, typo);
      });
    }).observe(document.body, { childList: true, subtree: true });
    app = $("#app");
    $("#lat").innerHTML = navHTML();
    $("#b-menu").innerHTML = ic("menu"); $("#b-q").innerHTML = ic("loupe"); $("#b-th").innerHTML = ic("theme"); $("#b-th2").innerHTML = ic("theme");
    $("#q-ouvrir").insertAdjacentHTML("afterbegin", ic("loupe"));
    $("#s-fermer").innerHTML = ic("croix");
    $("#b-menu").onclick = function () { ouvrir("menu"); };
    $("#voile").onclick = function () { fermer(); };
    $("#lat").addEventListener("click", function (e) {
      var a = e.target.closest("a"); if (!a || couche !== "menu") return;
      e.preventDefault(); fermer(a.getAttribute("href"));
    });
    function ouvrirRech() { ouvrir("srch"); var i = $("#sq"); i.focus(); if (i.value) i.select(); chercher(i.value); }
    $("#b-q").onclick = ouvrirRech; $("#q-ouvrir").onclick = ouvrirRech;
    $("#b-th").onclick = basculerTheme; $("#b-th2").onclick = basculerTheme;
    $("#s-fermer").onclick = function () { fermer(); };
    $("#sq").addEventListener("input", function () { chercher(this.value); });
    $("#sres").addEventListener("click", function (e) { var a = e.target.closest("a"); if (!a) return; e.preventDefault(); fermer(a.getAttribute("href")); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && couche) { fermer(); return; }
      var tag = (e.target.tagName || "").toLowerCase();
      if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && tag !== "input" && tag !== "textarea")) { e.preventDefault(); if (!couche) ouvrirRech(); }
    });
    window.addEventListener("hashchange", function () {
      /* vidéo du chapitre : on la met en pause avant de quitter l'onglet */
      $$("iframe[data-serie]").forEach(function (fr) { try { fr.contentWindow.postMessage({ type: "serie-pause" }, "*"); } catch (e) {} });
      rendre();
    });
    /* vidéo du chapitre : hauteur du lecteur et du quiz transmise par la page de la vidéo */
    window.addEventListener("message", function (e) {
      var d = e.data || {};
      if (d.type === "serie-h" && d.h) $$("iframe[data-serie]").forEach(function (fr) { if (fr.contentWindow === e.source) fr.style.height = Math.ceil(d.h) + "px"; });
    });
    rendre();
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { }); });
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", demarrer); else demarrer();
})();
