<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faits &amp; Courbes — SES Terminale</title>
<meta name="apple-mobile-web-app-title" content="SES">
<meta name="description" content="Révisions de SES, spécialité Terminale : cours rédigés d'après le programme officiel, chiffres sourcés, mécanismes interactifs, quiz, cartes et sujets corrigés.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F6F3EC">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>(function(){try{if(!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches))document.documentElement.classList.add("mo");}catch(e){}})();</script>
<style>
:root{
  --papier:#F6F3EC; --carte:#FFFDF8; --carte2:#EFEAE0; --encre:#14232B; --encre2:#56636B; --ligne:#DDD5C7;
  --canard:#0B5563; --canard-f:#073E49; --canard-c:#DCEBEC;
  --corail:#E5533F; --corail-c:#FBE3DE; --moutarde:#D99A1E; --moutarde-c:#F7EBCB;
  --vert:#2E7D4F; --ombre:0 1px 2px rgba(20,35,43,.06),0 6px 18px rgba(20,35,43,.07); --ess-f:#14232B; --ess-t:#F6F3EC;
  --titre:"Avenir Next Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --texte:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Iowan Old Style","Noto Serif",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --papier:#0D181C; --carte:#14232A; --carte2:#1B2E36; --encre:#ECE6DA; --encre2:#A5B0B3; --ligne:#2A3F47;
    --canard:#5BB8C4; --canard-f:#8BD0D8; --canard-c:#173A42;
    --corail:#FF7B65; --corail-c:#3D2420; --moutarde:#F0BE4F; --moutarde-c:#3A311B;
    --vert:#6CC18E; --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); --ess-f:#1D3741; --ess-t:#ECE6DA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papier:#0D181C; --carte:#14232A; --carte2:#1B2E36; --encre:#ECE6DA; --encre2:#A5B0B3; --ligne:#2A3F47;
  --canard:#5BB8C4; --canard-f:#8BD0D8; --canard-c:#173A42;
  --corail:#FF7B65; --corail-c:#3D2420; --moutarde:#F0BE4F; --moutarde-c:#3A311B;
  --vert:#6CC18E; --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); --ess-f:#1D3741; --ess-t:#ECE6DA;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--papier);color:var(--encre);font:16px/1.62 var(--texte);overflow-x:hidden}
a{color:var(--canard)}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--titre);font-stretch:condensed;letter-spacing:-.01em;line-height:1.12;margin:0}
.num,.t-num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--moutarde);outline-offset:2px}

/* ---------- barre du haut (téléphone) et barre latérale ---------- */
.haut{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:6px;height:58px;padding:0 8px;
  background:var(--papier);border-bottom:3px double var(--ligne)}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--encre)}
.ib:hover{background:var(--carte2)}
.ib svg{width:22px;height:22px}
.logo{display:flex;align-items:baseline;gap:4px;text-decoration:none;color:var(--canard);font-family:var(--titre);font-weight:800;font-stretch:condensed;font-size:23px;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;flex:1;min-width:0}
.logo i{font-family:var(--serif);font-style:italic;color:var(--corail);font-weight:700;text-transform:none;font-size:1.05em}
.logo small{display:none}
.lat{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:60;background:var(--carte);border-right:1px solid var(--ligne);
  transform:translateX(-102%);visibility:hidden;overflow-y:auto;padding:16px 14px 90px;box-shadow:var(--ombre)}
.lat.ouv{transform:none;visibility:visible}
.voile{position:fixed;inset:0;z-index:55;background:rgba(8,20,24,.45);display:none}
.voile.on{display:block}
.lat .logo{font-size:26px;flex:none;display:block;line-height:1;margin:4px 4px 2px}
.lat .tag{font-size:12.5px;color:var(--encre2);margin:4px 4px 14px;letter-spacing:.02em}
.nav-t{font:700 11.5px/1 var(--texte);letter-spacing:.14em;text-transform:uppercase;color:var(--encre2);margin:18px 6px 6px}
.nav a{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border-radius:10px;text-decoration:none;color:var(--encre);font-size:15px;line-height:1.25}
.nav a:hover{background:var(--carte2)}
.nav a.act{background:var(--canard-c);color:var(--canard-f);font-weight:650}
.nav a .pc{flex:none;width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font:800 12px/1 var(--titre);background:var(--carte2);color:var(--canard)}
.nav a.act .pc{background:var(--canard);color:var(--carte)}
.nav a .bt{margin-left:auto;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--encre2);border:1px solid var(--ligne);border-radius:99px;padding:2px 7px}
.nav svg{width:20px;height:20px;flex:none;color:var(--canard)}
.lat-bas{margin:22px 6px 0;padding-top:12px;border-top:1px solid var(--ligne);font-size:12.5px;color:var(--encre2)}
@media (min-width:1000px){
  .haut{display:none}
  .lat{transform:none;visibility:visible;width:280px;box-shadow:none;padding-bottom:30px}
  .voile{display:none!important}
  .page{margin-left:280px}
  .outils-h{display:flex}
}
.outils-h{display:none;position:sticky;top:0;z-index:30;justify-content:flex-end;gap:6px;padding:8px 18px;background:linear-gradient(var(--papier) 70%,transparent)}
.rech-b{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:1px solid var(--ligne);border-radius:99px;background:var(--carte);color:var(--encre2);cursor:pointer;min-width:240px}
.rech-b svg{width:18px;height:18px}
.rech-b kbd{margin-left:auto;font:12px var(--texte);border:1px solid var(--ligne);border-radius:5px;padding:1px 6px}

/* ---------- contenu ---------- */
main{padding:0 16px 120px;max-width:780px;margin:0 auto}
@media (min-width:1000px){main{padding:0 32px 120px}}
.kick{display:inline-block;font:700 12px/1.3 var(--texte);letter-spacing:.13em;text-transform:uppercase;color:var(--corail)}
.kick.c{color:var(--canard)} .kick.m{color:var(--moutarde)}
.tete{padding:22px 0 14px;border-bottom:1px solid var(--ligne);margin-bottom:18px}
.tete h1{font-size:clamp(30px,8.4vw,48px);font-weight:800;margin:6px 0 10px;color:var(--encre)}
.tete.court{padding-bottom:6px;margin-bottom:6px;border:0}
.tete.court h1{font-size:clamp(22px,5.6vw,32px);margin-bottom:0}
.tete .chapo{font:19px/1.5 var(--serif);color:var(--encre);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pastille{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--carte2);color:var(--encre2);border:1px solid var(--ligne)}
.pastille.ok{background:var(--canard-c);color:var(--canard-f);border-color:transparent}
.pastille.non{background:var(--corail-c);color:var(--corail);border-color:transparent}
.pastille.bt{background:var(--moutarde-c);color:var(--encre);border-color:transparent}
h2.sec{font-size:clamp(25px,6.4vw,32px);font-weight:800;margin:34px 0 10px;padding-top:12px;border-top:3px solid var(--encre);display:flex;gap:10px;align-items:baseline}
h2.sec .n{font:800 15px/1 var(--titre);color:var(--carte);background:var(--corail);border-radius:6px;padding:5px 7px;flex:none;transform:translateY(-3px)}
h3{font-size:22px;font-weight:750;margin:26px 0 8px}
h4{font-size:18px;font-weight:700;margin:18px 0 6px}
p{margin:0 0 12px}
.lede{font:18px/1.55 var(--serif)}
ul,ol{padding-left:22px;margin:0 0 12px}
li{margin:4px 0}
.idee{scroll-margin-top:80px;border-radius:12px;transition:background .6s}
.idee.flash{background:var(--moutarde-c);box-shadow:0 0 0 8px var(--moutarde-c)}

/* encadrés */
.def,.ex,.aut,.plus,.attn,.cle{border-radius:12px;padding:12px 14px;margin:14px 0;position:relative}
.def{background:var(--carte);border:1px solid var(--ligne);border-left:5px solid var(--canard)}
.def b:first-child{color:var(--canard-f);font-family:var(--titre);font-size:18px;font-stretch:condensed;letter-spacing:.01em}
.ex{background:var(--moutarde-c);border:0}
.ex::before{content:"Exemple";display:block;font:800 11px/1 var(--texte);letter-spacing:.14em;text-transform:uppercase;color:var(--moutarde);margin-bottom:6px;filter:brightness(.8)}
.ex.src::before{content:"Exemple · hors cours, source citée"}
.aut{background:var(--carte);border:1px solid var(--ligne);display:grid;grid-template-columns:46px 1fr;gap:4px 12px}
.aut .mono{grid-row:span 2;width:46px;height:46px;border-radius:50%;background:var(--canard);color:var(--carte);display:flex;align-items:center;justify-content:center;font:800 17px/1 var(--titre)}
.aut .an{font:800 18px/1.2 var(--titre);font-stretch:condensed}
.aut .an small{font:500 12.5px var(--texte);color:var(--encre2);margin-left:6px}
.aut .ad{grid-column:2;font-size:15px}
.plus{border:1.5px dashed var(--canard);background:transparent}
.plus::before{content:"Pour aller plus loin";display:block;font:800 11px/1 var(--texte);letter-spacing:.14em;text-transform:uppercase;color:var(--canard);margin-bottom:6px}
.plus.hp::before{content:"Hors programme"}
.attn{background:var(--corail-c)}
.attn::before{content:"Attention";display:block;font:800 11px/1 var(--texte);letter-spacing:.14em;text-transform:uppercase;color:var(--corail);margin-bottom:6px}
.cle{background:var(--canard);color:#fff}
.cle a{color:#fff}
:root[data-theme="dark"] .cle{color:var(--papier)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cle{color:var(--papier)}}
.def p:last-child,.ex p:last-child,.plus p:last-child,.attn p:last-child{margin-bottom:0}
.src-l{display:block;font-size:12.5px;color:var(--encre2);margin-top:6px}
details.pli{border:1px solid var(--ligne);border-radius:12px;background:var(--carte);margin:14px 0}
details.pli>summary{cursor:pointer;list-style:none;padding:12px 14px;min-height:44px;font-weight:650;display:flex;gap:10px;align-items:center}
details.pli>summary::-webkit-details-marker{display:none}
details.pli>summary::before{content:"+";flex:none;width:24px;height:24px;border-radius:50%;background:var(--canard-c);color:var(--canard-f);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
details.pli[open]>summary::before{content:"–"}
details.pli>div{padding:0 14px 12px}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--ligne);border-radius:10px;background:var(--carte)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--ligne);text-align:left;vertical-align:top}
th{font-family:var(--texte);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--encre2);background:var(--carte2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{white-space:nowrap}
tr:last-child td{border-bottom:0}

/* chiffres-chocs */
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0}
.chiffre{background:var(--carte);border:1px solid var(--ligne);border-top:4px solid var(--corail);border-radius:4px 4px 12px 12px;padding:12px 14px}
.chiffre b{display:block;font:800 44px/1 var(--titre);font-stretch:condensed;color:var(--corail);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chiffre:nth-child(3n+2){border-top-color:var(--canard)} .chiffre:nth-child(3n+2) b{color:var(--canard)}
.chiffre:nth-child(3n+3){border-top-color:var(--moutarde)} .chiffre:nth-child(3n+3) b{color:var(--moutarde)}
.chiffre span{display:block;font-size:14.5px;margin-top:6px;line-height:1.4}
.chiffre small{display:block;font-size:12px;color:var(--encre2);margin-top:6px}

/* essentiel */
.essentiel{background:var(--ess-f);color:var(--ess-t);border-radius:14px;padding:16px 16px 6px;margin:6px 0 18px}
.essentiel .kick{color:var(--moutarde)}
.essentiel ol{list-style:none;padding:0;margin:10px 0 8px;counter-reset:e}
.essentiel li{counter-increment:e;display:grid;grid-template-columns:30px 1fr;gap:8px;margin:0 0 10px;font-size:15.5px;line-height:1.5}
.essentiel li::before{content:counter(e);font:800 22px/1 var(--titre);color:var(--moutarde)}
.objs{counter-reset:o;list-style:none;padding:0}
.objs li{counter-increment:o;background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:10px 12px 10px 48px;position:relative;margin:8px 0}
.objs li::before{content:counter(o);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--canard);color:var(--carte);display:flex;align-items:center;justify-content:center;font:800 13px/1 var(--titre)}
.objs .bo{font-size:13px;color:var(--encre2);display:block;margin-top:4px;font-style:italic}
.objs a{font-size:14px;font-weight:600}
.notions{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.notions span{font-size:13.5px;border:1px solid var(--canard);color:var(--canard-f);border-radius:99px;padding:3px 10px}

/* onglets de chapitre */
.onglets{position:sticky;top:58px;z-index:20;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:8px 16px;background:var(--papier);border-bottom:1px solid var(--ligne)}
@media (min-width:1000px){.onglets{top:60px;margin:0 0 16px;padding:8px 0}}
.onglets::-webkit-scrollbar{display:none}
.onglets a{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;text-decoration:none;color:var(--encre);font-weight:600;font-size:14.5px;border:1px solid var(--ligne);background:var(--carte)}
.onglets a.act{background:var(--encre);color:var(--papier);border-color:var(--encre)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--ligne);background:var(--carte);color:var(--encre);cursor:pointer;font-weight:600;text-decoration:none;font-size:15px}
.btn:hover{border-color:var(--canard)}
.btn.p{background:var(--canard);color:#fff;border-color:var(--canard)}
:root[data-theme="dark"] .btn.p{color:var(--papier)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:var(--papier)}}
.btn.c{background:var(--corail);border-color:var(--corail);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* chaînes causales */
.chaine{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:12px 12px 8px;margin:16px 0}
.chaine .ct{display:flex;align-items:center;gap:8px;font:800 17px/1.2 var(--titre);font-stretch:condensed;margin-bottom:8px}
.chaine .ct::before{content:"";flex:none;width:22px;height:12px;background:linear-gradient(90deg,var(--corail) 0 40%,transparent 40% 60%,var(--corail) 60%);-webkit-mask:linear-gradient(#000,#000);clip-path:polygon(0 35%,70% 35%,70% 0,100% 50%,70% 100%,70% 65%,0 65%)}
.chaine svg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.chaine .nd rect{stroke-width:1.5}
.chaine .nd text{font:14px var(--texte);fill:var(--encre)}
.chaine .nd.k-cause rect{fill:var(--canard);stroke:var(--canard)} .chaine .nd.k-cause text{fill:#fff}
:root[data-theme="dark"] .chaine .nd.k-cause text{fill:var(--papier)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chaine .nd.k-cause text{fill:var(--papier)}}
.chaine .nd.k-meca rect{fill:var(--carte);stroke:var(--canard)}
.chaine .nd.k-effet rect{fill:var(--corail-c);stroke:var(--corail)}
.chaine .nd.k-frein rect{fill:var(--moutarde-c);stroke:var(--moutarde)}
.chaine .fl{stroke:var(--encre2);stroke-width:1.6;fill:none}
.chaine .fl-t{font:italic 12px var(--serif);fill:var(--encre2);paint-order:stroke;stroke:var(--carte);stroke-width:5px;stroke-linejoin:round}
.chaine .tete-fl{fill:var(--encre2)}
.chaine .et.cache{display:none}
.chaine .cpt{font-size:13px;color:var(--encre2);margin-left:auto}
.chaine .btns{margin:8px 0 2px;align-items:center}
.chaine-texte{display:none}

/* graphiques */
.graph{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:12px;margin:16px 0;position:relative}
.graph .gt{font:800 17px/1.2 var(--titre);font-stretch:condensed;margin:0 0 2px}
.graph .gs{font-size:13px;color:var(--encre2);margin:0 0 8px}
.graph .zone{position:relative;overflow-x:auto}
.graph svg{display:block;width:100%;height:auto;touch-action:pan-y}
.graph .src-l{margin-top:4px}
.graph .ax{stroke:var(--ligne);stroke-width:1}
.graph .ax0{stroke:var(--encre2);stroke-width:1}
.graph .lb{font:11px var(--texte);fill:var(--encre2)}
.graph .lbv{font:700 11.5px var(--texte);fill:var(--encre)}
.graph .bulle{position:absolute;pointer-events:none;background:var(--encre);color:var(--papier);font-size:13px;line-height:1.35;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:3}
.graph .bulle b{font-family:var(--titre);font-size:15px}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.leg button{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border-radius:99px;border:1px solid var(--ligne);background:var(--carte);font-size:13px;cursor:pointer}
.leg button i{width:12px;height:12px;border-radius:3px;display:inline-block}
.leg button.off{opacity:.4}
.c1{fill:var(--canard);stroke:var(--canard)} .c2{fill:var(--corail);stroke:var(--corail)} .c3{fill:var(--moutarde);stroke:var(--moutarde)}
.c4{fill:var(--vert);stroke:var(--vert)} .c5{fill:#7B5EA7;stroke:#7B5EA7} .c6{fill:var(--encre2);stroke:var(--encre2)}

/* QCM, cartes, relier */
.q-carte{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:16px;margin:12px 0}
.q-prog{height:6px;background:var(--carte2);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.q-prog i{display:block;height:100%;background:var(--corail);border-radius:99px;transition:width .3s}
.q-q{font:700 19px/1.35 var(--texte);margin:6px 0 12px}
.q-ch{display:grid;gap:8px}
.q-ch button{text-align:left;min-height:48px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--ligne);background:var(--papier);cursor:pointer;line-height:1.4}
.q-ch button:hover:not([disabled]){border-color:var(--canard)}
.q-ch button.bon{border-color:var(--vert);background:color-mix(in srgb,var(--vert) 14%,var(--carte))}
.q-ch button.faux{border-color:var(--corail);background:var(--corail-c)}
.q-ch button[disabled]{cursor:default;color:var(--encre);opacity:1}
.q-exp{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--carte2);font-size:15px}
.q-exp b.v{color:var(--vert)} .q-exp b.f{color:var(--corail)}
.score{font:800 64px/1 var(--titre);color:var(--corail)}
.fc-zone{perspective:1200px;margin:12px 0}
.fc{position:relative;min-height:230px;cursor:pointer;border:0;padding:0;width:100%;background:none;display:block;text-align:left}
.fc .fa{position:absolute;inset:0;border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--ligne);box-shadow:var(--ombre)}
.fc .fa.r{background:var(--carte)}

  html.mo .vue{animation:mo-entre .45s cubic-bezier(.2,.7,.2,1)}

  html.mo .chaine .et.vient{animation:mo-pop .5s cubic-bezier(.2,.9,.3,1.25) both;transform-box:fill-box;transform-origin:50% 0}
  html.mo .chaine .fl.vient{stroke-dasharray:80;animation:mo-trace .5s ease-out both}
  html.mo .graph .bar{animation:mo-pousse .7s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:50% 100%}
  html.mo .graph .bar.neg{transform-origin:50% 0}
  html.mo .graph .hb{animation:mo-glisse .7s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:0 50%}
  html.mo .graph .ligne{stroke-dasharray:2000;animation:mo-trace2 1.4s ease-out both}
  html.mo .chiffre b{animation:mo-chiffre .6s cubic-bezier(.2,.7,.2,1) both}
  html.mo .fc{transition:transform .5s}
  html.mo .fc.tourne-anim{animation:mo-flip .45s ease-in-out}
  html.mo .q-exp,html.mo .q-ch button.bon{animation:mo-pop .35s ease-out}

  html.mo .rel button.ko{animation:mo-non .35s}
  html.mo .idee.flash{transition:background .6s,box-shadow .6s}
  html.mo .une .mast{animation:mo-mast .7s cubic-bezier(.2,.7,.2,1) both}
  html.mo .qc{transition:transform .2s,border-color .2s}
  html.mo .qc:hover{transform:translateY(-2px)}
}
@keyframes mo-entre{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes mo-pop{from{opacity:.001;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes mo-trace{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
@keyframes mo-trace2{from{stroke-dashoffset:2000}to{stroke-dashoffset:0}}
@keyframes mo-pousse{from{transform:scaleY(0)}to{transform:none}}
@keyframes mo-glisse{from{transform:scaleX(0)}to{transform:none}}
@keyframes mo-chiffre{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes mo-flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@keyframes mo-non{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes mo-mast{from{letter-spacing:.08em;opacity:.001}to{letter-spacing:-.01em;opacity:1}}

var EPREUVE = '' +
'<header class="tete"><span class="kick">Boîte à outils</span><h1>L’épreuve écrite et la méthode</h1><p class="chapo">Ce qui t’attend en juin 2027, d’après la note de service du 11 septembre 2026 qui s’applique à partir de la session 2027, et comment t’y prendre, étape par étape.</p></header>' +

'<h2 class="sec"><span class="n">1</span>Le format officiel</h2>' +
'<div class="tbl"><table><tbody>' +
'<tr><th>Durée</th><td>4 heures</td></tr>' +
'<tr><th>Coefficient</th><td>16, comme chacune des deux spécialités de Terminale</td></tr>' +
'<tr><th>Date</th><td>À la mi-juin : les écrits de spécialité de la session 2027 sont annoncés les 16, 17 et 18 juin 2027 (un jour par spécialité). Vérifie sur ta convocation.</td></tr>' +
'<tr><th>Choix</th><td>Deux sujets de nature différente au choix : une <b>dissertation</b> s’appuyant sur un dossier documentaire <b>ou</b> une <b>épreuve composée</b> de trois parties.</td></tr>' +
'<tr><th>Barème</th><td>Épreuve composée : partie 1 sur <b>3,5</b> points, partie 2 sur <b>5,5</b>, partie 3 sur <b>9</b>. Dans les deux sujets, <b>2 points sur 20</b> sont réservés à la maîtrise de l’orthographe et de la syntaxe.</td></tr>' +
'<tr><th>Calculatrice</th><td>Les sujets récents l’interdisent (sujet 2026 : « L’usage de la calculatrice et du dictionnaire n’est pas autorisé »). Entraîne-toi à calculer de tête et à la main.</td></tr>' +
'</tbody></table></div>' +
'<div class="attn"><p><b>Ce qui change en 2027.</b> Jusqu’en 2026, l’épreuve composée était notée 4 / 6 / 10. À partir de 2027, elle est notée 3,5 / 5,5 / 9, et 2 points évaluent spécifiquement l’orthographe et la syntaxe, selon une grille officielle (orthographe, construction des phrases, lexique, organisation du propos).</p></div>' +
'<h3>Les questions qui peuvent tomber à l’écrit</h3>' +
'<p>L’annexe I de la note de service retient neuf questions du programme :</p>' +
'<ul><li>Science économique : croissance ; commerce international ; chômage ; politiques économiques dans le cadre européen.</li><li>Sociologie et science politique : structure sociale ; mobilité sociale ; travail et emploi ; engagement politique.</li><li>Regards croisés : action publique pour l’environnement.</li></ul>' +
'<p><b>Trois questions du programme ne tombent pas à l’écrit</b> (ni à l’oral de contrôle, qui porte sur le même programme) : « Comment expliquer les crises financières et réguler le système financier ? », « Quelle est l’action de l’École sur les destins individuels et sur l’évolution de la société ? » et « Quelles inégalités sont compatibles avec les différentes conceptions de la justice sociale ? ». Elles restent au programme : ton professeur les traite, elles éclairent les autres chapitres (l’École explique une bonne part de la mobilité sociale) et elles peuvent nourrir ton Grand oral.</p>' +
'<p>Les notions de Première non approfondies en Terminale « doivent être connues et mobilisables », mais elles ne peuvent pas être le ressort essentiel du sujet.</p>' +
'<p>Les sujets sont construits pour couvrir plusieurs champs : la dissertation et la partie 3 de l’épreuve composée portent sur des champs différents, et les trois parties de l’épreuve composée portent sur trois questions différentes et au moins deux champs.</p>' +

'<h2 class="sec"><span class="n">2</span>L’épreuve composée</h2>' +
'<h3>Partie 1 · Mobilisation des connaissances (3,5 points)</h3>' +
'<p>Une question, sans document. On attend une réponse courte et construite (en pratique, une vingtaine de lignes) qui <b>répond exactement à la consigne</b>.</p>' +
'<ol><li>Repère le verbe : « montrez que » (un mécanisme qui va dans un sens), « présentez deux… » (exactement deux éléments, bien séparés), « expliquez » (le comment et le pourquoi), « distinguez » (deux notions et leur différence).</li><li>Définis les notions du sujet en une phrase.</li><li>Rédige un ou deux paragraphes <b>AEI</b> : <b>A</b>ffirmer l’idée, <b>E</b>xpliquer le mécanisme (une chaîne causale), <b>I</b>llustrer par un exemple précis, chiffré ou daté.</li></ol>' +
'<h3>Partie 2 · Étude d’un document (5,5 points)</h3>' +
'<p>Un document statistique (graphique, tableau, carte…) de 120 données au plus, et <b>deux questions</b>. La première demande en général de lire, comparer ou calculer ; la seconde de mobiliser le document <b>et</b> tes connaissances pour montrer quelque chose.</p>' +
'<ol><li>Lis le titre, la source, l’unité, le champ et la date avant tout chiffre.</li><li>Écris une <b>phrase de lecture</b> complète : « Selon l’Insee, en 2024, en France, 23,0 % des personnes en emploi sont cadres. »</li><li>Pour comparer, calcule : écart en points, taux de variation ou coefficient multiplicateur (voir <a href="#outils">Savoir-faire</a>).</li><li>Dans la question 2, cite des données précises du document, puis explique-les avec le cours.</li></ol>' +
'<h3>Partie 3 · Raisonnement s’appuyant sur un dossier documentaire (9 points)</h3>' +
'<p>Un sujet (souvent « Montrez que… » ou « À l’aide du dossier, vous montrerez… ») et deux ou trois documents de nature différente. On attend une introduction, un développement organisé et une conclusion. Il ne s’agit pas de discuter le sujet : on le démontre.</p>' +
'<ol><li><b>Introduction</b> : définitions, reformulation du sujet, annonce des deux ou trois idées.</li><li><b>Développement</b> : deux ou trois paragraphes AEI, chacun appuyé sur au moins un document cité précisément (« document 2 ») et sur tes connaissances.</li><li><b>Conclusion</b> : réponse claire au sujet en deux ou trois phrases.</li></ol>' +

'<h2 class="sec"><span class="n">3</span>La dissertation</h2>' +
'<p>Le sujet est une question à <b>problématiser</b>. Le dossier contient trois ou quatre documents strictement factuels (surtout statistiques). Il ne doit ni borner ta réflexion ni être commenté document par document : tes connaissances personnelles sont attendues.</p>' +
'<ol><li><b>Analyser le sujet</b> (20 à 30 minutes) : définis chaque mot, repère le type de question (« Dans quelle mesure… » appelle un plan qui nuance ; « Comment expliquer… » un plan explicatif), délimite le cadre (France ? pays développés ? période ?).</li><li><b>Exploiter le dossier</b> : pour chaque document, une ou deux idées et une donnée à citer.</li><li><b>Construire le plan</b> : deux ou trois parties, chacune avec deux ou trois sous-parties ; chaque sous-partie est un paragraphe AEI.</li><li><b>Rédiger l’introduction</b> : accroche (un fait daté), définitions, problématique (la tension que pose le sujet), annonce du plan.</li><li><b>Rédiger</b> en soignant les transitions, puis <b>conclure</b> : réponse à la problématique, ouverture.</li><li><b>Relire</b> au moins 10 minutes : 2 points dépendent de l’orthographe et de la syntaxe.</li></ol>' +
'<div class="ex"><p>Sujets de dissertation de la session 2026 (France) : « Comment les questions environnementales peuvent-elles devenir un problème public ? » (jour 1) et « Dans quelle mesure la politique européenne de la concurrence atteint-elle ses objectifs ? » (jour 2).</p></div>' +

'<h2 class="sec"><span class="n">4</span>Une copie modèle commentée</h2>' +
'<div class="exo"><div class="et"><span class="pastille ok">Partie 1 · 3,5 points</span><span class="pastille">Sujet inventé pour le site</span></div><h3>Montrez que l’innovation peut aider à reculer les limites écologiques de la croissance.</h3>' +
'<div class="copie"><p>La croissance économique, augmentation durable de la production mesurée par le PIB en volume, se heurte à des limites écologiques : épuisement des ressources, pollution, réchauffement climatique. L’innovation, c’est-à-dire l’application économique d’une invention, peut repousser ces limites de deux façons.</p>' +
'<p>D’abord, l’innovation permet de produire autant en consommant moins de ressources et en émettant moins de polluants. Une innovation de procédé améliore l’efficacité énergétique : chaque unité produite demande moins d’énergie, donc émet moins de gaz à effet de serre. C’est ce qu’on appelle le découplage. En France, selon le Citepa, les émissions de gaz à effet de serre ont baissé de 34,3 % entre 1990 et 2025 alors que le PIB en volume a augmenté d’environ 69 % selon l’Insee.</p>' +
'<p>Ensuite, l’innovation permet de substituer des ressources renouvelables ou abondantes à des ressources rares ou polluantes. Les innovations de produit, comme les panneaux photovoltaïques ou les batteries, rendent possible une production d’électricité et des transports moins émetteurs. Elles réduisent la dépendance aux énergies fossiles, ressources non renouvelables dont la combustion réchauffe le climat.</p>' +
'<p>L’innovation peut donc rendre la croissance plus soutenable, à condition que ses gains ne soient pas annulés par un effet rebond.</p></div>' +
'<div class="marge"><b>Définitions d’entrée :</b> croissance, limites écologiques, innovation. Le correcteur sait tout de suite que les notions sont maîtrisées.</div>' +
'<div class="marge"><b>Deux paragraphes, deux mécanismes distincts</b> (efficacité et substitution), chacun avec un connecteur, une explication causale (« donc ») et un exemple.</div>' +
'<div class="marge"><b>Exemple chiffré, daté et sourcé</b> : c’est ce qui fait la différence entre une copie moyenne et une très bonne copie.</div>' +
'<div class="marge"><b>Phrase finale nuancée</b> : l’effet rebond montre qu’on connaît la limite du raisonnement, sans sortir du sujet (on ne demande pas de discuter).</div></div>' +

'<h2 class="sec"><span class="n">5</span>Le paragraphe AEI et la chaîne causale</h2>' +
'<p>Chaque idée d’une copie de SES est un paragraphe qui <b>A</b>ffirme une idée, l’<b>E</b>xplique par un mécanisme (« en effet », « donc », « ce qui entraîne ») et l’<b>I</b>llustre par un fait précis. L’explication est le cœur de la note : c’est elle que tu entraînes avec les chaînes causales de chaque chapitre (bouton « Étape suivante »). Un bon test : chaque flèche de ta chaîne doit pouvoir se dire avec « donc ».</p>' +

'<h2 class="sec"><span class="n">6</span>Le Grand oral</h2>' +
'<p>À partir de la session 2027 (note de service du 10 septembre 2026) : <b>20 minutes</b> de préparation, <b>20 minutes</b> d’épreuve, <b>coefficient 8</b>.</p>' +
'<ul><li>Tu présentes au jury <b>deux questions</b> adossées à tes deux spécialités (une par spécialité, ou une transversale). Le jury en choisit une.</li><li><b>Premier temps (10 minutes)</b>, debout : tu expliques pourquoi tu as choisi cette question, puis tu la développes et tu y réponds. Le support éventuel préparé pendant les 20 minutes n’est pas noté.</li><li><b>Second temps (10 minutes)</b> : échange avec le jury, qui peut t’interroger sur tout le programme du cycle terminal de tes spécialités, en lien avec ta question.</li><li>Jury de deux professeurs de disciplines différentes ; aucun matériel autorisé hormis de quoi écrire.</li></ul>' +
'<div class="ex"><p>Idées de questions adossées à la SES : « L’intelligence artificielle va-t-elle creuser les inégalités de salaires ? » (progrès technique biaisé, É1) ; « Les droits de douane protègent-ils vraiment l’emploi industriel ? » (É2) ; « Pourquoi les enfants de cadres sont-ils si nombreux en classes préparatoires ? » (S2). Les questions absentes de l’écrit (crises financières, École, justice sociale) peuvent tout à fait servir ici.</p></div>' +

'<h2 class="sec"><span class="n">7</span>L’oral de contrôle (second groupe)</h2>' +
'<p>Si tu passes au second groupe en SES : 30 minutes de préparation, 20 minutes d’épreuve, sur le même programme que l’écrit. Tu choisis entre deux sujets. La question principale, sur 10 points, s’appuie sur deux documents courts ; trois questions simples sur 10 points suivent : deux de connaissances (6 points) dans deux champs différents et une de savoir-faire sur un document (4 points).</p>';

var OUTILS = '' +
'<header class="tete"><span class="kick">Boîte à outils</span><h1>Savoir-faire quantitatifs</h1><p class="chapo">Le programme exige de savoir calculer, lire et interpréter une série d’outils. Chacun est expliqué ici avec un vrai chiffre, et la calculatrice te sert de vérification. Le jour du bac, la calculatrice est interdite : apprends les ordres de grandeur.</p></header>' +
'<h2 class="sec"><span class="n">⚙</span>La calculatrice de savoir-faire</h2>' +
'<p>Taux de variation, coefficient multiplicateur et indice sont trois façons de dire la même chose. Change une valeur : tout se recalcule, avec la phrase à écrire dans ta copie.</p>' +
'<div data-calc></div>' +

'<h2 class="sec"><span class="n">1</span>Proportion et pourcentage de répartition</h2>' +
'<div class="def"><b>Proportion (part)</b> = effectif d’une partie ÷ effectif total × 100. Les parts d’un pourcentage de répartition totalisent 100 %.</div>' +
'<div class="ex"><p>En 2024, 14 169 000 femmes sont en emploi sur 29 022 000 personnes en emploi : 14 169 ÷ 29 022 × 100 ≈ 48,8 % (Insee, enquête Emploi 2024).</p></div>' +
'<p>Dans le tableau des catégories socioprofessionnelles de 2024, les six groupes totalisent 99,1 % ; les 0,9 % manquants sont les « non renseignés ». Un pourcentage de répartition se lit toujours par rapport à son total : vérifie que la somme fait 100 dans le bon sens (ligne ou colonne). Ce même outil sert à transformer une table de mobilité en tables de destinée et de recrutement (chapitre sur la mobilité).</p>' +

'<h2 class="sec"><span class="n">2</span>Taux de variation, points de pourcentage</h2>' +
'<div class="def"><b>Taux de variation</b> = (valeur d’arrivée − valeur de départ) ÷ valeur de départ × 100.</div>' +
'<div class="ex"><p>PIB en volume : 2 625,6 milliards d’euros 2020 en 2024, 2 646,7 en 2025. Taux de variation : (2 646,7 − 2 625,6) ÷ 2 625,6 × 100 ≈ +0,8 %. C’est le taux de croissance de 2025 (Insee).</p></div>' +
'<div class="attn"><p>Quand on compare deux <b>pourcentages</b>, l’écart s’exprime en <b>points de pourcentage</b>. Les cadres passent de 8,0 % de l’emploi en 1982 à 23,0 % en 2024 : <b>+15 points</b>. Leur part a augmenté de 187,5 % (15 ÷ 8 × 100), ce qui est une autre information. Écrire « +15 % » est faux.</p></div>' +

'<h2 class="sec"><span class="n">3</span>Coefficient multiplicateur et indice simple</h2>' +
'<div class="def"><b>Coefficient multiplicateur</b> = valeur d’arrivée ÷ valeur de départ = 1 + taux ÷ 100. <b>Indice</b> = valeur d’une date ÷ valeur de la date de base × 100.</div>' +
'<div class="ex"><p>Le PIB en volume passe de 309,1 milliards d’euros 2020 en 1950 à 2 646,7 en 2025 : il est multiplié par 8,56 (hausse de 756 %). Pour de grandes hausses, « multiplié par 8,6 » est bien plus lisible.</p><p>Proportion de bacheliers dans une génération, base 100 en 1970 (20,1 %) : l’indice vaut 80,1 ÷ 20,1 × 100 ≈ 398,5 en 2025. La proportion a presque quadruplé ; elle a gagné 60 points.</p></div>' +
'<p>Un indice se lit toujours par rapport à la base : un indice de 125 signifie +25 % depuis la base, pas depuis l’année précédente. Entre deux indices, on calcule un taux de variation, pas une différence.</p>' +

'<h2 class="sec"><span class="n">4</span>Taux de variation cumulé et taux moyen</h2>' +
'<div class="def"><b>Taux cumulé</b> : on multiplie les coefficients multiplicateurs successifs, puis on retire 1. <b>Taux de variation annuel moyen</b> = (CM global)<sup>1/n</sup> − 1, où n est le nombre de périodes.</div>' +
'<div class="ex"><p>Croissance du PIB en volume : +2,7 % en 2022, +1,6 % en 2023, +1,5 % en 2024, +0,8 % en 2025 (Insee). CM global = 1,027 × 1,016 × 1,015 × 1,008 ≈ 1,0676, soit +6,8 % en quatre ans et environ +1,6 % par an en moyenne. La somme des taux (6,6 %) est fausse.</p><p>Entre 1950 et 1973, le PIB en volume passe de 309,1 à 999,1 milliards d’euros 2020 : croissance annuelle moyenne d’environ 5,2 %. Entre 2007 et 2019, à peine 1,0 % par an.</p></div>' +

'<h2 class="sec"><span class="n">5</span>Moyenne arithmétique simple et pondérée</h2>' +
'<div class="def"><b>Moyenne pondérée</b> = somme des (valeur × poids) ÷ somme des poids.</div>' +
'<div class="ex"><p>Exemple inventé : un élève a 14 en SES (coefficient 16) et 10 en mathématiques (coefficient 16), 8 en philosophie (coefficient 8). Moyenne pondérée : (14 × 16 + 10 × 16 + 8 × 8) ÷ 40 = 448 ÷ 40 = 11,2. La moyenne simple des trois notes (10,7) ne tient pas compte du poids de chaque épreuve.</p></div>' +

'<h2 class="sec"><span class="n">6</span>Médiane, déciles et rapport inter-quantile</h2>' +
'<div class="def"><b>Médiane</b> : valeur qui partage une population en deux moitiés égales. <b>Déciles</b> : les neuf valeurs qui la partagent en dix groupes égaux. <b>Rapport interdécile</b> D9/D1 : combien de fois le seuil des 10 % les plus aisés dépasse le plafond des 10 % les plus modestes.</div>' +
'<div class="ex"><p>En 2024, en France métropolitaine, la moitié des personnes a un niveau de vie inférieur à 26 740 euros par an (2 228 euros par mois). Les 10 % les plus modestes ont moins de 13 970 euros (D1), les 10 % les plus aisés plus de 48 580 euros (D9) : D9/D1 ≈ 3,48 (Insee Première n° 2117).</p></div>' +
'<p>La médiane résiste aux valeurs extrêmes, la moyenne non : pour les revenus, la moyenne est tirée vers le haut par les très hauts revenus. L’<b>écart</b> inter-quantile est une différence (D9 − D1, en euros), le <b>rapport</b> est un quotient (sans unité).</p>' +

'<h2 class="sec"><span class="n">7</span>Courbe de Lorenz et coefficient de Gini</h2>' +
'<p>La <b>courbe de Lorenz</b> place en abscisse la part cumulée de la population (des plus modestes aux plus aisés) et en ordonnée la part cumulée des revenus qu’elle reçoit. Plus la courbe s’éloigne de la diagonale (égalité parfaite), plus la répartition est inégale. Le <b>coefficient de Gini</b> mesure cette surface : 0 = égalité parfaite, 1 = une seule personne reçoit tout.</p>' +
'<div class="ex"><p>Indice de Gini des niveaux de vie en France : 0,302 en 2024, son plus haut niveau depuis le début de la série en 1996 (Insee). Lecture et interprétation seulement : on ne te demandera pas de le calculer.</p></div>' +

'<h2 class="sec"><span class="n">8</span>Valeur nominale et valeur réelle</h2>' +
'<div class="def"><b>Valeur nominale</b> : en euros courants. <b>Valeur réelle</b> : corrigée de la hausse des prix (euros constants). Approximation utile : taux réel ≈ taux nominal − taux d’inflation. Calcul exact : CM réel = CM nominal ÷ CM des prix.</div>' +
'<div class="ex"><p>En 2024, le niveau de vie médian augmente de 3,8 % en euros courants ; l’inflation est de 2,0 %. En euros constants : 1,038 ÷ 1,020 ≈ 1,018, soit +1,8 % (Insee). Même logique pour un taux d’intérêt : un taux nominal de 3 % avec 2 % d’inflation donne un taux réel d’environ 1 %.</p></div>' +

'<h2 class="sec"><span class="n">9</span>Corrélation et causalité</h2>' +
'<p>Deux variables sont <b>corrélées</b> quand elles varient ensemble. Cela ne prouve pas que l’une cause l’autre : une troisième variable peut agir sur les deux, ou la causalité peut aller dans l’autre sens.</p>' +
'<div class="ex"><p>Depuis 1970, la proportion de bacheliers et le PIB ont tous deux augmenté en France. La corrélation est forte, mais elle ne dit pas à elle seule si l’éducation cause la croissance (capital humain), si la croissance permet de financer l’éducation, ou les deux. Il faut un mécanisme et des études qui isolent l’effet.</p></div>' +

'<h2 class="sec"><span class="n">10</span>Indice synthétique, tableau à double entrée, graphiques</h2>' +
'<p>Un <b>indice synthétique</b> agrège plusieurs indicateurs en un seul nombre (par exemple l’indice de développement humain, qui combine santé, éducation et niveau de vie) : on le lit et on l’interprète, en sachant qu’il dépend des choix de pondération.</p>' +
'<p><b>Tableau à double entrée</b> : repère d’abord dans quel sens les pourcentages totalisent 100. Exemple (Insee, 2024) : « 38,8 % des femmes en emploi sont employées » se lit dans la colonne des femmes, qui totalise 100 %. Ce n’est pas « 38,8 % des employés sont des femmes ».</p>' +
'<p><b>Graphiques</b> : diagramme de répartition (secteurs, barres empilées), série chronologique (courbe, histogramme), courbe de Lorenz. Toujours : titre, unité, source, échelle de l’axe (commence-t-il à zéro ?).</p>' +
'<p><b>Fonctions simples</b> (offre, demande, coût) : la <b>pente</b> indique la sensibilité au prix ; un <b>déplacement</b> de la courbe traduit le changement d’un autre facteur que le prix, un <b>mouvement le long</b> de la courbe traduit un changement de prix.</p>' +

'<h2 class="sec"><span class="n">✎</span>Entraîne-toi</h2>' +
'<div class="exo"><h3>Exercice 1 · Sans calculatrice</h3><div class="enon">La part des ouvriers dans l’emploi passe de 29,9 % en 1982 à 18,0 % en 2024 (Insee). Calcule l’écart, puis dis si la phrase « la part des ouvriers a baissé de 11,9 % » est juste.</div><details class="corr"><summary>Corrigé</summary><p>Écart : 18,0 − 29,9 = −11,9 <b>points</b>. La phrase est fausse : la baisse est de 11,9 points de pourcentage. En taux de variation, la part a baissé d’environ 40 % (11,9 ÷ 29,9 ≈ 0,398).</p></details></div>' +
'<div class="exo"><h3>Exercice 2 · Coefficient et indice</h3><div class="enon">En 2024, les exportations de biens et services de la France en volume valent 849,8 milliards d’euros 2020 ; en 2025, 869,5 (Insee). Calcule le taux de variation et l’indice 2025 base 100 en 2024.</div><details class="corr"><summary>Corrigé</summary><p>CM = 869,5 ÷ 849,8 ≈ 1,023, soit +2,3 % ; l’indice 2025 vaut environ 102,3. L’Insee publie bien +2,3 % pour les exportations en 2025.</p></details></div>' +
'<div class="exo"><h3>Exercice 3 · Taux annuel moyen</h3><div class="enon">La proportion de bacheliers dans une génération passe de 20,1 % en 1970 à 62,7 % en 1995 (DEPP). Sans calculatrice, estime le coefficient multiplicateur ; avec la calculatrice du site, trouve le taux annuel moyen sur ces 25 ans.</div><details class="corr"><summary>Corrigé</summary><p>CM = 62,7 ÷ 20,1 ≈ 3,1 (la proportion a un peu plus que triplé). Taux annuel moyen = 3,119<sup>1/25</sup> − 1 ≈ 4,7 % par an. La hausse est concentrée après 1985 : l’objectif de 80 % d’une génération au niveau du bac et la création du bac professionnel accélèrent la massification.</p></details></div>';

  sections: [
    { id: "e1-1", t: "Mesurer la croissance", h:
      '<p class="lede">La croissance économique est l’<b>augmentation durable de la production</b> de biens et de services d’un pays. On la mesure par le taux de variation du <b>produit intérieur brut (PIB) en volume</b>.</p>' +
      '<div class="def"><b>PIB</b> — somme des valeurs ajoutées produites sur le territoire pendant un an (plus les impôts sur les produits, moins les subventions). <b>En volume</b>, il est corrigé de la hausse des prix : on mesure les quantités produites, pas l’inflation.</div>' +
      '<p>Rappel de Première : un PIB qui augmente <b>en valeur</b> peut stagner en volume si seuls les prix montent. C’est donc toujours le PIB en volume qui mesure la croissance.</p>' +
      '<div data-graph="e1-pib"></div>' +
      '<p>Le graphique montre trois âges de la croissance française. Pendant les « Trente Glorieuses », la croissance est forte et régulière (5,2 % par an en moyenne de 1950 à 1973). Après les chocs pétroliers (1975 : −0,9 %), elle ralentit nettement. Depuis 2008, elle dépasse rarement 2 %, avec deux récessions : 2009 (−2,8 %, crise financière) et 2020 (−7,4 %, Covid), suivie d’un rattrapage en 2021 (+6,9 %).</p>' +
      '<div data-graph="e1-periodes"></div>' +
      '<div class="ex"><p>Le PIB en volume passe de 309,1 milliards d’euros 2020 en 1950 à 2 646,7 milliards en 2025 : il est multiplié par 8,6 (Insee). En 2025, il augmente de 0,8 %, après +1,5 % en 2024.</p></div>' +
      '<p>Croissance n’est pas <b>développement</b> : le développement est l’amélioration durable du bien-être (santé, éducation, niveau de vie). La croissance en fournit les moyens, sans le garantir. On distingue aussi la croissance <b>effective</b> (observée) de la croissance <b>potentielle</b> (celle que permettraient tous les facteurs pleinement employés), qui dépend des sources étudiées ci-dessous.</p>' },

    { id: "e1-2", t: "Les sources : des facteurs plus nombreux et mieux combinés", h:
      '<p class="lede">Pour produire plus, il n’y a que deux moyens : utiliser <b>plus de facteurs de production</b>, ou les utiliser <b>plus efficacement</b>.</p>' +
      '<div class="def"><b>Croissance extensive</b> — croissance due à l’augmentation des quantités de facteurs : plus de travailleurs ou d’heures travaillées, plus de capital (machines, bâtiments, logiciels).</div>' +
      '<div class="def"><b>Croissance intensive</b> — croissance due à la hausse de la productivité : on obtient plus de production avec les mêmes quantités de facteurs.</div>' +
      '<p>Il faut distinguer deux mesures de la productivité :</p>' +
      '<ul><li>la <b>productivité (apparente) du travail</b> = production ÷ quantité de travail (par emploi ou par heure). Elle augmente aussi quand chaque travailleur dispose de plus de capital ;</li><li>la <b>productivité globale des facteurs (PGF)</b> mesure l’efficacité de la <b>combinaison</b> du travail et du capital. C’est la part de la croissance que l’augmentation des quantités de facteurs n’explique pas.</li></ul>' +
      '<div class="aut"><span class="mono">RS</span><span class="an">Robert Solow<small>1924-2023 · Nobel 1987</small></span><span class="ad">Dans son modèle (1956), l’accumulation du capital seule s’essouffle : chaque machine supplémentaire rapporte moins que la précédente (rendements décroissants). Seul le progrès technique permet une croissance durable. En 1957, il mesure qu’aux États-Unis, de 1909 à 1949, environ 87,5 % de la hausse de la production par heure de travail vient du progrès technique et non du capital. Ce « <b>résidu</b> » est la PGF.</span></div>' +
      '<p>Le lien avec le <b>progrès technique</b> est direct : le progrès technique désigne l’ensemble des innovations qui améliorent les produits, les procédés et l’organisation. Il fait augmenter la PGF, donc permet de produire plus avec autant de facteurs. Les gains de productivité se transforment ensuite en croissance par la demande :</p>' +
      '<div data-chain="e1-pgf"></div>' +
      '<details class="pli"><summary>Activité : décomposer une croissance (exemple chiffré inventé)</summary><div><p>Une économie imaginaire croît de 2,0 % par an. Les économistes estiment que la hausse du travail contribue pour 0,4 point et celle du capital pour 0,6 point. La contribution de la PGF est le reste : 2,0 − 0,4 − 0,6 = <b>1,0 point</b>, soit la moitié de la croissance. C’est exactement la démarche de Solow : la PGF se mesure « en creux », comme un résidu. Ce résidu mesure aussi, en partie, notre ignorance : qualité du travail, organisation, institutions s’y mélangent.</p></div></details>' },

    { id: "e1-3", t: "Le progrès technique est endogène", h:
      '<p class="lede">Chez Solow, le progrès technique est <b>exogène</b> : il vient de l’extérieur du modèle, comme une « manne tombée du ciel ». Les théories de la <b>croissance endogène</b>, à partir des années 1980, expliquent au contraire qu’il est <b>produit par des décisions économiques</b>.</p>' +
      '<div class="def"><b>Innovation</b> — application économique d’une invention : nouveau produit, nouveau procédé de production, nouvelle organisation, nouveau débouché. L’<b>invention</b> est la découverte ; l’innovation est sa mise sur le marché.</div>' +
      '<p>Trois sources d’innovation sont mises en avant par les économistes :</p>' +
      '<div class="aut"><span class="mono">PR</span><span class="an">Paul Romer<small>né en 1955 · Nobel 2018</small></span><span class="ad">L’investissement en <b>recherche et développement</b> produit des connaissances. Or une connaissance est <b>non rivale</b> : l’utiliser n’empêche pas les autres de l’utiliser. Elle se diffuse et profite à d’autres entreprises : ce sont des <b>externalités positives</b>, qui rendent les rendements croissants.</span></div>' +
      '<div class="aut"><span class="mono">RL</span><span class="an">Robert Lucas<small>1937-2023 · Nobel 1995</small></span><span class="ad">Le <b>capital humain</b> (connaissances et compétences acquises par la formation et l’expérience) rend chacun plus productif, et rend aussi plus productifs ceux qui travaillent avec lui.</span></div>' +
      '<div class="aut"><span class="mono">RB</span><span class="an">Robert Barro<small>né en 1944</small></span><span class="ad">Les <b>dépenses publiques productives</b> (infrastructures de transport et de communication, recherche publique, éducation) augmentent la productivité des entreprises privées.</span></div>' +
      '<div data-chain="e1-endo"></div>' +
      '<div class="ex"><p>Les vaccins à ARN messager contre le Covid-19, mis sur le marché fin 2020 par BioNTech-Pfizer et Moderna, reposent sur des décennies de recherche, en grande partie publique et universitaire. Les travaux de Katalin Karikó et Drew Weissman sur la modification de l’ARN (article de 2005) leur ont valu le prix Nobel de médecine 2023. Recherche publique, R&D privée et capital humain se sont combinés : c’est la croissance endogène en action.</p></div>' +
      '<p>En France, l’effort de recherche atteint <b>2,18 % du PIB en 2023</b> (61,5 milliards d’euros de dépense intérieure de R&D, dont environ deux tiers exécutés par les entreprises), selon le ministère de l’Enseignement supérieur et de la Recherche.</p>' +
      '<p>Conséquence importante : si la croissance dépend de l’investissement en connaissances, l’<b>État a un rôle</b> à jouer, parce que le marché seul sous-investit dans les activités dont les bénéfices profitent aussi aux autres (externalités) : financement de la recherche fondamentale, de l’éducation, crédit d’impôt recherche.</p>' },

    { id: "e1-4", t: "Les institutions et la destruction créatrice", h:
      '<div class="def"><b>Institutions</b> — ensemble des règles qui encadrent les comportements dans une société : règles formelles (Constitution, lois, droits de propriété, contrats) et informelles (normes, coutumes). Douglass North (Nobel 1993) les appelle les « <b>règles du jeu</b> ».</div>' +
      '<p>Pourquoi investir ou innover si le fruit de l’effort peut être confisqué, copié sans contrepartie ou détruit par l’arbitraire ? Les <b>droits de propriété</b> (droit d’utiliser un bien, d’en tirer un revenu et de le céder) garantis par un <b>État de droit</b> sécurisent les gains futurs. Le <b>brevet</b> donne à l’innovateur un monopole d’exploitation temporaire (au plus vingt ans) en échange de la publication de son invention.</p>' +
      '<div data-chain="e1-inst"></div>' +
      '<div class="aut"><span class="mono">AR</span><span class="an">Daron Acemoglu et James Robinson<small>Nobel 2024 avec Simon Johnson</small></span><span class="ad">Des institutions <b>inclusives</b> (droits de propriété pour tous, concurrence, pouvoir politique partagé) favorisent la croissance ; des institutions <b>extractives</b>, qui permettent à une élite de capter les richesses, la bloquent.</span></div>' +
      '<div class="ex"><p>La Corée, divisée depuis la fin des années 1940, en est l’illustration la plus citée : même peuple, même culture et même géographie au départ, mais des institutions opposées. La Corée du Sud, économie de marché devenue démocratique, est aujourd’hui un pays riche et innovant ; la Corée du Nord, économie planifiée sous dictature, reste l’un des pays les plus pauvres du monde.</p></div>' +
      '<p>Mais la protection a un revers : un brevet trop long ou trop large freine la diffusion des connaissances. Les institutions doivent donc arbitrer entre <b>inciter</b> l’innovateur et <b>diffuser</b> l’innovation.</p>' +
      '<h3>La destruction créatrice</h3>' +
      '<div class="aut"><span class="mono">JS</span><span class="an">Joseph Schumpeter<small>1883-1950</small></span><span class="ad">L’<b>entrepreneur innovateur</b> est le moteur du capitalisme. Les innovations majeures arrivent <b>en grappes</b> et provoquent une « <b>destruction créatrice</b> » : les activités nouvelles remplacent les anciennes (<i>Capitalisme, socialisme et démocratie</i>, 1942).</span></div>' +
      '<div data-chain="e1-dc"></div>' +
      '<div class="ex"><p>Kodak, leader mondial de la pellicule photo, avait pourtant fabriqué dès 1975 le premier prototype d’appareil photo numérique. L’entreprise a tardé à basculer vers le numérique et s’est déclarée en faillite aux États-Unis en janvier 2012, pendant que le numérique, puis le smartphone, créaient de nouvelles entreprises et de nouveaux métiers.</p></div>' +
      '<div class="aut"><span class="mono">AH</span><span class="an">Philippe Aghion et Peter Howitt<small>Nobel 2025 avec Joel Mokyr</small></span><span class="ad">Leur modèle de 1992 fait de la destruction créatrice le cœur de la croissance : chaque innovation rend la précédente obsolète et procure à son auteur une rente temporaire. Le prix Nobel 2025 récompense cette « théorie de la croissance durable par la destruction créatrice ».</span></div>' +
      '<p>La destruction créatrice a un <b>coût social</b> : faillites, licenciements, reconversions difficiles, territoires en déclin. D’où l’idée de politiques qui l’accompagnent (formation, indemnisation du chômage, aide à la mobilité) sans la bloquer. Alfred Sauvy décrivait un <b>déversement</b> des emplois : les gains de productivité suppriment des postes dans un secteur, mais la hausse des revenus crée de nouveaux besoins, donc des emplois ailleurs.</p>' },

    { id: "e1-5", t: "Progrès technique et inégalités de revenus", h:
      '<p class="lede">Le progrès technique enrichit le pays dans son ensemble, mais pas tout le monde de la même façon. Trois mécanismes l’expliquent.</p>' +
      '<h3>1. Un progrès technique biaisé en faveur du travail qualifié</h3>' +
      '<p>Les technologies numériques sont <b>complémentaires</b> du travail qualifié (elles rendent un ingénieur, un analyste ou un médecin plus productifs) et <b>substituables</b> au travail peu qualifié et répétitif. La demande de travail qualifié augmente plus vite que celle de travail peu qualifié.</p>' +
      '<div data-chain="e1-biais"></div>' +
      '<div class="aut"><span class="mono">GK</span><span class="an">Claudia Goldin et Lawrence Katz<small><i>The Race between Education and Technology</i>, 2008</small></span><span class="ad">Les inégalités de salaires dépendent d’une <b>course</b> : si l’offre de diplômés augmente plus vite que la demande de qualifications, les écarts se réduisent ; sinon, ils se creusent. Claudia Goldin a reçu le prix Nobel en 2023 (pour ses travaux sur le travail des femmes).</span></div>' +
      '<h3>2. La polarisation des emplois</h3>' +
      '<p>L’automatisation remplace d’abord les <b>tâches routinières</b>, faciles à coder : saisie, guichet, travail à la chaîne. Ces emplois sont souvent au milieu de l’échelle des salaires. Les emplois très qualifiés (conception, encadrement) et certains emplois peu qualifiés non routiniers (aide à domicile, livraison, restauration) résistent mieux. L’emploi se <b>polarise</b> aux deux extrémités, et les salaires du milieu stagnent. L’économiste David Autor a documenté ce mécanisme aux États-Unis.</p>' +
      '<div class="ex"><p>Caisses automatiques dans les supermarchés, distributeurs de billets et banque en ligne, logiciels de comptabilité : ces innovations ont réduit le besoin de caissiers, guichetiers et employés de saisie, tandis que les emplois de développeurs et d’analystes de données augmentaient.</p></div>' +
      '<h3>3. Les rentes de l’innovation</h3>' +
      '<p>L’innovateur qui réussit obtient un pouvoir de marché temporaire (brevet, effet de réseau) : des revenus très élevés pour un petit nombre d’entrepreneurs, de dirigeants et d’actionnaires. Avec le numérique, un produit peut conquérir un marché mondial à coût presque nul : « le gagnant rafle presque tout ». Ces rentes nourrissent la hausse des très hauts revenus.</p>' +
      '<div class="plus"><p>Ces inégalités ne sont pas une fatalité : leur ampleur dépend de l’éducation (la « course » de Goldin et Katz), de la formation continue, de la fiscalité et de la concurrence (qui limite la durée des rentes). Philippe Aghion souligne que les inégalités nées de l’innovation s’accompagnent souvent de davantage de mobilité sociale que les rentes héritées.</p></div>' },

    { id: "e1-6", t: "Les limites écologiques de la croissance", h:
      '<div class="def"><b>Croissance soutenable</b> — croissance qui répond aux besoins du présent sans compromettre la capacité des générations futures à répondre aux leurs. Elle suppose de préserver un stock de capital (physique, humain, naturel, institutionnel) transmissible.</div>' +
      '<div class="def"><b>Capital naturel</b> — ensemble des ressources naturelles (sols, eau, forêts, énergies fossiles, minerais, biodiversité, climat stable) qui rendent des services à l’économie.</div>' +
      '<p>Produire, c’est prélever des ressources et rejeter des déchets. La croissance se heurte donc à trois limites, que le programme cite explicitement :</p>' +
      '<ul><li>l’<b>épuisement des ressources</b> non renouvelables (pétrole, gaz, minerais) et la surexploitation des ressources renouvelables (forêts, poissons, nappes d’eau) ;</li><li>la <b>pollution</b> de l’air, de l’eau et des sols ;</li><li>le <b>réchauffement climatique</b>, dû aux émissions de gaz à effet de serre.</li></ul>' +
      '<div data-chain="e1-limites"></div>' +
      '<div class="aut"><span class="mono">DM</span><span class="an">Donella Meadows (dir.)<small>rapport au Club de Rome, 1972</small></span><span class="ad"><i>The Limits to Growth</i> : dans un monde fini, une croissance exponentielle de la production et de la population conduit à l’épuisement des ressources et à une pollution croissante.</span></div>' +
      '<p>Ces dommages sont des <b>externalités négatives</b> : le pollueur ne paie pas le coût qu’il impose aux autres, donc le marché seul produit trop de pollution.</p>' +
      '<h3>L’innovation peut reculer ces limites</h3>' +
      '<ul><li>Elle améliore l’<b>efficacité</b> : produire autant avec moins d’énergie et de matières (moteurs plus sobres, isolation, recyclage).</li><li>Elle permet des <b>substitutions</b> : énergies renouvelables et nucléaire à la place des énergies fossiles, matériaux nouveaux.</li><li>Elle permet de <b>réparer</b> ou de <b>capter</b> : dépollution, captage du carbone (encore peu développé).</li></ul>' +
      '<div data-graph="e1-decouplage"></div>' +
      '<p>La France connaît un <b>découplage absolu</b> : ses émissions territoriales baissent pendant que son PIB augmente. Un découplage <b>relatif</b> serait une hausse des émissions moins rapide que celle du PIB.</p>' +
      '<div class="attn"><p>Ces émissions sont mesurées <b>sur le territoire</b>. Elles ne comptent pas les gaz émis à l’étranger pour fabriquer les biens que la France importe. L’empreinte carbone, qui les inclut, est plus élevée, et sa baisse doit être vérifiée séparément.</p></div>' +
      '<h3>Mais l’innovation a des limites</h3>' +
      '<div data-chain="e1-rebond"></div>' +
      '<div class="aut"><span class="mono">WJ</span><span class="an">William Stanley Jevons<small>1835-1882</small></span><span class="ad"><i>The Coal Question</i> (1865) : les machines à vapeur plus économes en charbon ont fait augmenter la consommation totale de charbon en Angleterre. C’est le « paradoxe de Jevons », forme extrême de l’effet rebond.</span></div>' +
      '<p>Le débat oppose deux conceptions de la soutenabilité :</p>' +
      '<div class="tbl"><table><thead><tr><th></th><th>Soutenabilité faible</th><th>Soutenabilité forte</th></tr></thead><tbody>' +
      '<tr><td><b>Idée</b></td><td>Les capitaux sont <b>substituables</b> : on peut compenser la perte de capital naturel par plus de capital physique, humain ou technologique.</td><td>Une partie du capital naturel est <b>critique</b> et irremplaçable (climat, biodiversité) : elle doit être préservée.</td></tr>' +
      '<tr><td><b>Place de l’innovation</b></td><td>Centrale : le progrès technique reculera les limites.</td><td>Insuffisante seule : il faut aussi des normes, des quotas, une sobriété.</td></tr>' +
      '<tr><td><b>Conséquence</b></td><td>La croissance peut continuer si l’on investit assez.</td><td>Certaines productions doivent baisser ; la croissance doit changer de contenu.</td></tr>' +
      '</tbody></table></div>' +
      '<p>L’action publique (taxes carbone, quotas d’émission, normes, subventions à l’innovation verte) est étudiée dans la question <a href="#r2">R2 Environnement</a>.</p>' }
  ],

  retenir:
    '<h3>Définitions</h3><ul>' +
    '<li><b>Croissance économique</b> : augmentation durable de la production, mesurée par le taux de variation du PIB en volume.</li>' +
    '<li><b>Productivité globale des facteurs</b> : efficacité de la combinaison du travail et du capital ; part de la croissance non expliquée par la hausse des quantités de facteurs (résidu de Solow).</li>' +
    '<li><b>Progrès technique</b> : ensemble des innovations (produit, procédé, organisation) qui augmentent la PGF.</li>' +
    '<li><b>Croissance endogène</b> : le progrès technique est produit par la croissance elle-même via la R&D (Romer), le capital humain (Lucas), les infrastructures publiques (Barro) ; externalités positives.</li>' +
    '<li><b>Institutions</b> : « règles du jeu » formelles et informelles (North) ; droits de propriété et brevets incitent à innover.</li>' +
    '<li><b>Destruction créatrice</b> : l’innovation détruit des activités anciennes en en créant de nouvelles (Schumpeter ; Aghion et Howitt).</li>' +
    '<li><b>Progrès technique biaisé</b> : il favorise la demande de travail qualifié ; polarisation des emplois ; rentes d’innovation.</li>' +
    '<li><b>Soutenabilité faible / forte</b> : substituabilité ou non du capital naturel. <b>Découplage</b> absolu ou relatif. <b>Effet rebond</b> (Jevons).</li></ul>' +
    '<h3>Chiffres à citer</h3><ul>' +
    '<li>PIB en volume ×8,6 entre 1950 et 2025 ; 5,2 %/an en 1950-1973, environ 1 %/an depuis 2007 ; +0,8 % en 2025 (Insee).</li>' +
    '<li>R&D : 2,18 % du PIB en 2023 (SIES).</li>' +
    '<li>Émissions de GES : −34,3 % entre 1990 et 2025 (Citepa) pour un PIB en hausse d’environ 69 %.</li></ul>' +
    '<h3>Auteurs</h3><ul><li>Solow (résidu, 1956-1957) · Romer, Lucas, Barro (croissance endogène) · North (institutions) · Acemoglu et Robinson (institutions inclusives) · Schumpeter (destruction créatrice) · Aghion et Howitt (Nobel 2025) · Sauvy (déversement) · Goldin et Katz (course éducation / technologie) · Meadows (1972) · Jevons (1865).</li></ul>',

    { r: "Progrès technique", v: "Ensemble des innovations qui améliorent les produits, les procédés et l’organisation, et font croître la PGF." },
    { r: "Innovation (vs invention)", v: "Application économique d’une invention : nouveau produit, procédé, organisation ou débouché. L’invention n’est que la découverte." },
    { r: "Croissance endogène", v: "Le progrès technique est produit par des décisions économiques (R&D, capital humain, infrastructures), financées par la croissance : cercle vertueux." },
    { r: "Externalité positive", v: "Effet favorable de l’activité d’un agent sur d’autres, sans contrepartie monétaire (ex. : diffusion des connaissances)." },
    { r: "Capital humain", v: "Connaissances et compétences acquises par la formation et l’expérience, qui augmentent la productivité (Lucas)." },
    { r: "Institutions", v: "Règles du jeu formelles (lois, droits de propriété) et informelles (normes) qui encadrent les comportements (North)." },
    { r: "Droits de propriété", v: "Droits d’utiliser un bien, d’en tirer un revenu et de le céder ; leur garantie incite à investir et innover." },
    { r: "Destruction créatrice", v: "Processus par lequel l’innovation fait disparaître des activités anciennes et en crée de nouvelles (Schumpeter, 1942)." },
    { r: "Progrès technique biaisé", v: "Progrès technique qui augmente surtout la demande de travail qualifié, et creuse les écarts de salaires." },
    { r: "Polarisation des emplois", v: "Recul des emplois intermédiaires routiniers au profit des emplois très qualifiés et des emplois peu qualifiés non routiniers." },
    { r: "Croissance soutenable", v: "Croissance qui répond aux besoins présents sans compromettre ceux des générations futures (préservation du capital transmis)." },
    { r: "Soutenabilité faible / forte", v: "Faible : capitaux substituables. Forte : une partie du capital naturel est irremplaçable." },
    { r: "Découplage absolu", v: "La production augmente pendant que les émissions ou prélèvements baissent (France 1990-2025 : PIB +69 %, GES −34,3 %)." },
    { r: "Effet rebond", v: "Les gains d’efficacité baissent le coût d’usage, d’où plus d’usage, qui annule une partie des économies (Jevons, 1865)." }
  ],
  bac: [
    { type: "Savoir-faire", origine: "Exercice du site, données Insee", t: "Calculer avec le PIB", enonce:
      '<p>PIB de la France en volume (milliards d’euros 2020) : 1950 : 309,1 ; 1973 : 999,1 ; 2007 : 2 233,0 ; 2019 : 2 504,6 ; 2024 : 2 625,6 ; 2025 : 2 646,7. Source : Insee.</p><ol><li>Calcule le coefficient multiplicateur entre 1950 et 1973, puis entre 2007 et 2019.</li><li>Calcule le taux de croissance de 2025.</li><li>Sachant que (999,1 / 309,1)<sup>1/23</sup> ≈ 1,052, rédige une phrase sur la croissance des Trente Glorieuses.</li></ol>',
      corrige: '<ol><li>1950-1973 : 999,1 ÷ 309,1 ≈ 3,23 : le PIB a été multiplié par 3,2 en 23 ans. 2007-2019 : 2 504,6 ÷ 2 233,0 ≈ 1,12 : +12 % en 12 ans seulement.</li><li>(2 646,7 − 2 625,6) ÷ 2 625,6 × 100 ≈ +0,8 %.</li><li>« Entre 1950 et 1973, selon l’Insee, le PIB de la France en volume a crû en moyenne d’environ 5,2 % par an : il a été multiplié par 3,2. »</li></ol><div class="marge"><b>Méthode :</b> un coefficient multiplicateur se lit « multiplié par » ; pour comparer deux périodes de longueurs différentes, on compare des taux <b>annuels moyens</b>, pas des taux globaux.</div>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet inventé pour le site", t: "Montrez que les institutions peuvent favoriser la croissance économique.", enonce: "<p>3,5 points. Réponds en une vingtaine de lignes, sans document.</p>",
      methode: "<p>Définir institutions et croissance ; deux mécanismes distincts, chacun en AEI : droits de propriété → incitation à innover ; institutions inclusives / État de droit → investissement et concurrence. Un exemple chacun.</p>",
      corrige: '<div class="copie"><p>Les institutions sont, selon Douglass North, les « règles du jeu » d’une société, formelles (lois, droits de propriété) ou informelles (normes). Elles peuvent favoriser la croissance, c’est-à-dire l’augmentation durable de la production, de deux façons.</p><p>D’abord, des droits de propriété garantis incitent à innover. Le brevet accorde à l’innovateur un monopole d’exploitation temporaire : il peut s’approprier les gains de son invention, ce qui l’incite à investir en recherche et développement. Les innovations augmentent la productivité globale des facteurs, donc la croissance. Sans cette protection, l’innovation serait copiée sans contrepartie et personne ne prendrait le risque de la financer.</p><p>Ensuite, des institutions inclusives favorisent l’investissement de tous. Selon Acemoglu et Robinson, quand l’État de droit protège chacun contre l’arbitraire et que la concurrence est ouverte, entrepreneurs et ménages investissent car leurs gains futurs sont sûrs. À l’inverse, des institutions extractives captent la richesse au profit d’une élite. La comparaison entre la Corée du Sud, riche et innovante, et la Corée du Nord, restée très pauvre, montre l’effet de ces institutions sur des populations au départ comparables.</p></div><div class="marge"><b>Barème indicatif :</b> définitions (0,5) ; deux mécanismes expliqués (2) ; exemples précis (1).</div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice du site, document Insee", t: "La croissance française depuis 1950", enonce:
      '<p>Document : le graphique « Taux de croissance du PIB de la France en volume, 1950-2025 » (Insee) dans <a href="#e1:e1-1">le cours</a>.</p><ol><li>À l’aide du document, comparez la croissance de 1950-1973 à celle des années 2010.</li><li>À l’aide du document et de vos connaissances, montrez que le ralentissement de la croissance peut s’expliquer par celui des gains de productivité.</li></ol>',
      corrige: '<ol><li>Selon l’Insee, la croissance du PIB en volume dépasse le plus souvent 4 % par an entre 1950 et 1973 (8,0 % en 1960, 7,1 % en 1969), soit 5,2 % par an en moyenne. Dans les années 2010, elle reste presque toujours sous 2,5 % (0,2 % en 2012, 2,1 % en 2017). En moyenne, elle est de 1,4 % par an de 2010 à 2019, soit près de quatre fois moins qu’entre 1950 et 1973.</li><li>La croissance intensive repose sur la hausse de la productivité globale des facteurs. Pendant les Trente Glorieuses, la France rattrapait le retard technologique sur les États-Unis : elle adoptait des techniques déjà inventées (production de masse, mécanisation agricole), d’où des gains de productivité très rapides et une croissance forte. Une fois le rattrapage achevé, il faut innover soi-même, ce qui est plus lent ; la tertiarisation pèse aussi, car les gains de productivité sont plus difficiles dans beaucoup de services. Moins de gains de productivité, c’est moins de baisse des coûts, moins de hausse du pouvoir d’achat et de la demande : la croissance ralentit, comme le montre le document après 1974 et surtout après 2008.</li></ol><div class="marge"><b>Méthode :</b> question 1 = données précises avec année, unité et source ; question 2 = un mécanisme (chaîne causale) relié au document.</div>' },
    { type: "Partie 3 · Raisonnement sur dossier", origine: "Sujet inventé pour le site", t: "À l’aide du dossier, montrez que l’innovation est une source de croissance économique.", enonce:
      '<p><b>Document 1</b> : effort de recherche de la France, 2,18 % du PIB en 2023 (61,5 milliards d’euros ; SIES). <b>Document 2</b> : graphique de la croissance française 1950-2025 (Insee). <b>Document 3</b> (texte factuel) : la mise au point des vaccins à ARN messager, fondée sur des recherches universitaires financées sur fonds publics, puis industrialisée par des entreprises en 2020.</p>',
      corrige: '<p><b>Introduction.</b> L’innovation est l’application économique d’une invention ; la croissance, l’augmentation durable de la production mesurée par le PIB en volume. On montrera que l’innovation stimule la croissance parce qu’elle accroît la productivité, puis parce qu’elle crée de nouveaux produits et entretient un cercle vertueux.</p><p><b>I. L’innovation accroît la productivité globale des facteurs.</b> Innovations de procédé → produire plus avec autant de facteurs → baisse des coûts → baisse des prix et hausse des revenus → hausse de la demande. Le document 2 montre une croissance forte quand les gains de productivité étaient élevés (5,2 % par an de 1950 à 1973). Solow : le résidu.</p><p><b>II. L’innovation crée de nouveaux produits et de nouveaux marchés.</b> Destruction créatrice (Schumpeter) : de nouvelles activités, de nouveaux emplois, de nouveaux investissements. Document 3 : les vaccins à ARN, nouveaux produits, nouvelle industrie.</p><p><b>III. Un cercle vertueux : la croissance finance l’innovation.</b> Croissance endogène : R&D (Romer), capital humain (Lucas), recherche publique (Barro). Document 1 : 61,5 milliards d’euros de R&D en 2023. Document 3 : la recherche publique a précédé l’innovation privée (externalités).</p><p><b>Conclusion.</b> L’innovation est une source majeure de croissance par la productivité et la création de nouveaux marchés, et la croissance lui fournit en retour ses moyens.</p><div class="marge"><b>Attendus :</b> chaque partie mobilise au moins un document cité précisément et un mécanisme. Pas de partie « limites » : on ne discute pas un « Montrez que ».</div>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet inventé pour le site", t: "Le progrès technique suffit-il à rendre la croissance soutenable ?", enonce: "<p>Construis la problématique et le plan détaillé, puis compare au corrigé.</p>",
      corrige: '<p><b>Problématique.</b> La croissance dégrade le capital naturel. Le progrès technique, qui repousse depuis deux siècles les limites de la production, peut-il à lui seul concilier croissance et préservation de l’environnement, ou faut-il d’autres leviers ?</p><p><b>I. Le progrès technique peut reculer les limites écologiques</b><br>A. Il améliore l’efficacité : moins d’énergie et de matières par unité produite (procédés, isolation, recyclage).<br>B. Il permet des substitutions : énergies bas carbone à la place des fossiles ; nouveaux matériaux.<br>C. Il permet un découplage : France 1990-2025, PIB en volume +69 %, émissions territoriales −34,3 % (Insee, Citepa). Soutenabilité faible : les capitaux sont substituables.</p><p><b>II. Mais il ne suffit pas</b><br>A. L’effet rebond annule une partie des gains (Jevons, 1865).<br>B. Le découplage est fragile : émissions importées (empreinte), rythme insuffisant au regard des objectifs (−50 % en 2030 par rapport à 1990).<br>C. Une partie du capital naturel est irremplaçable (soutenabilité forte) : biodiversité, climat.</p><p><b>III. Il doit être orienté et complété par l’action publique</b><br>A. Les externalités négatives appellent des instruments : taxation, quotas, normes (question R2).<br>B. Subventionner l’innovation verte, car le marché sous-investit dans les technologies propres (externalités).<br>C. Changer le contenu de la croissance : sobriété, services, réparation.</p><div class="marge"><b>Pourquoi ce plan ?</b> « Suffit-il » appelle un plan qui reconnaît le rôle du progrès technique (oui), montre ses limites (pas seul), puis propose une réponse construite (orienté et complété).</div>' }
  ]
};

CH.e2 = {
  chapo: "Pourquoi la France achète-t-elle des voitures allemandes tout en en vendant à l’Allemagne ? Pourquoi un smartphone « made in China » est-il surtout fabriqué ailleurs ? Ce chapitre explique sur quoi repose le commerce mondial, qui y gagne, qui y perd, et ce que valent les droits de douane.",
