  bac: [
    { type: "Savoir-faire", origine: "Exercice du site, données Insee", t: "Lire l’évolution des PCS", enonce: '<p>D’après l’Insee, la part des ouvriers dans l’emploi est de 29,9 % en 1982 et de 18,0 % en 2024 ; celle des cadres de 8,0 % et de 23,0 %.</p><ol><li>Calcule l’écart en points pour chaque catégorie.</li><li>Calcule le coefficient multiplicateur de la part des cadres.</li><li>Rédige une phrase de lecture pour 2024.</li></ol>',
      corrige: '<ol><li>Ouvriers : 18,0 − 29,9 = −11,9 points. Cadres : 23,0 − 8,0 = +15,0 points.</li><li>23,0 ÷ 8,0 ≈ 2,9 : la part des cadres a presque triplé.</li><li>« Selon l’Insee, en 2024, en France, 23,0 % des personnes en emploi sont cadres. »</li></ol>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet inventé pour le site", t: "Distinguez l’analyse des classes sociales de Marx et celle de Weber.", enonce: "<p>3,5 points, sans document.</p>",
      corrige: '<div class="copie"><p>Une classe sociale est un grand groupe d’individus qui occupent une position comparable dans la hiérarchie sociale. Marx et Weber en proposent deux analyses différentes.</p><p>Pour Marx, les classes se définissent par un critère unique : la place dans les rapports de production. La bourgeoisie possède les moyens de production, le prolétariat ne possède que sa force de travail, qu’il vend contre un salaire. La bourgeoisie s’approprie la plus-value : c’est l’exploitation. Les deux classes ont des intérêts opposés et entrent en conflit. Une classe n’existe pleinement que si elle passe de « classe en soi » (position commune) à « classe pour soi » (conscience et mobilisation) : l’approche est réaliste et conflictuelle.</p><p>Weber, au contraire, distingue trois dimensions de la hiérarchie sociale : l’ordre économique, où les classes se définissent par les chances d’accès aux biens et aux revenus ; l’ordre social, où les groupes de statut se définissent par le prestige ; l’ordre politique, où les partis visent le pouvoir. Ces dimensions ne coïncident pas toujours : un enseignant a plus de prestige que de revenu. L’approche est nominaliste : les classes sont des catégories construites par le sociologue, sans conscience ni conflit nécessaires. Elle conduit à une vision en termes de stratification.</p></div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice du site, document Insee", t: "Femmes, hommes et catégories socioprofessionnelles", enonce:
      '<p>Document : le graphique « Femmes et hommes en emploi selon la catégorie socioprofessionnelle, 2024 » (Insee) dans <a href="#s1:s1-3">le cours</a>.</p><ol><li>Comparez la part des employés parmi les femmes et parmi les hommes en emploi.</li><li>À l’aide du document et de vos connaissances, montrez que le sexe est un facteur de structuration de l’espace social.</li></ol>',
      corrige: '<ol><li>Selon l’Insee, en France en 2024, 38,8 % des femmes en emploi sont employées, contre 11,6 % des hommes en emploi : la proportion est 3,3 fois plus élevée chez les femmes (27,2 points d’écart).</li><li>Le sexe structure l’espace social car femmes et hommes n’occupent pas les mêmes positions. Le document montre une forte <b>ségrégation professionnelle</b> : les femmes sont concentrées dans les emplois d’employées (38,8 %) et les professions intermédiaires (27,3 %, santé, enseignement, social), les hommes chez les ouvriers (28,2 % contre 7,2 %). Le sexe <b>hiérarchise</b> aussi : les hommes sont plus souvent cadres (25,4 % contre 20,4 %) et chefs d’entreprise. Ces écarts s’expliquent par une socialisation différenciée qui oriente filles et garçons vers des formations et métiers différents, et par la répartition inégale des tâches domestiques, qui pèse sur les carrières féminines (temps partiel, plafond de verre). Il en résulte des écarts de salaire et de pouvoir.</li></ol>' },
    { type: "Partie 3 · Raisonnement sur dossier", origine: "Sujet officiel : bac 2026, jour 2 (France), partie 3 · corrigé du site", officiel: true, t: "Montrez que le revenu et le diplôme ne sont pas les seuls facteurs qui structurent et hiérarchisent l’espace social.", enonce: '<p>Les documents du sujet officiel ne sont pas reproduits ici : appuie-toi sur les données du cours (catégories selon le sexe, niveau de vie, pauvreté des familles monoparentales).</p>',
      corrige: '<p><b>Introduction.</b> L’espace social est l’ensemble des positions sociales, structuré en groupes et hiérarchisé selon l’accès aux ressources. Le revenu et le diplôme y jouent un rôle central, mais d’autres facteurs interviennent : la profession, le sexe, l’âge et la composition du ménage, le lieu de résidence.</p><p><b>I. La profession et le sexe structurent et hiérarchisent.</b> PCS : conditions de travail, prestige, mode de vie (cadres 23,0 % de l’emploi en 2024). Sexe : femmes employées 38,8 % contre 11,6 % des hommes (Insee) ; écarts de salaire, temps partiel.</p><p><b>II. La composition du ménage et le cycle de vie.</b> Familles monoparentales parmi les plus touchées par la pauvreté (Insee, 2024) ; jeunes plus exposés à la précarité ; patrimoine qui s’accumule avec l’âge.</p><p><b>III. Le lieu de résidence.</b> Concentration des ressources dans les métropoles ; quartiers prioritaires contre beaux quartiers ; entre-soi de la grande bourgeoisie (Pinçon et Pinçon-Charlot) ; effet sur la scolarité et les réseaux.</p><p><b>Conclusion.</b> Ces facteurs se cumulent avec le revenu et le diplôme : l’espace social est multidimensionnel.</p><div class="marge"><b>Piège du sujet :</b> ne pas faire une partie sur le revenu et le diplôme ; le sujet demande les <b>autres</b> facteurs.</div>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet inventé pour le site", t: "Les classes sociales permettent-elles encore de rendre compte de la société française actuelle ?", enonce: "<p>Construis la problématique et le plan, puis compare.</p>",
      corrige: '<p><b>Problématique.</b> La société française a profondément changé depuis les années 1950 (salarisation, tertiarisation, qualification, féminisation). Les classes sociales, définies par Marx ou Weber, décrivent-elles encore une société où les identités semblent plus individuelles, ou faut-il d’autres outils ?</p><p><b>I. Des classes sociales qui restent pertinentes</b><br>A. Des écarts objectifs durables et cumulatifs : niveau de vie (D9/D1 = 3,48 en 2024, Gini au plus haut depuis 1996), patrimoine, diplôme.<br>B. Une reproduction et un entre-soi : grande bourgeoisie « en soi et pour soi » (Pinçon et Pinçon-Charlot) ; classes populaires (42,8 % de l’emploi).<br>C. Des styles de vie qui restent distincts (Bourdieu).</p><p><b>II. Une pertinence remise en cause</b><br>A. Moyennisation (Mendras) et tertiarisation brouillent les frontières.<br>B. Hétérogénéité des classes : ouvriers des services, employés qualifiés ou non.<br>C. Affaiblissement de la conscience de classe et individualisation (Beck ; syndicalisation autour de 10 %).</p><p><b>III. Une analyse à enrichir</b><br>A. Des « classes sans conscience » (Chauvel) : classes en soi sans classes pour soi.<br>B. Articuler classe et genre (intersectionnalité), âge et territoire.<br>C. Une approche multidimensionnelle (Weber, Bourdieu) plutôt qu’une bipolarisation.</p>' }
  ]
};

  sections: [
    { id: "s2-1", t: "Ce que fait l’École dans une société démocratique", h:
      '<p class="lede">L’École n’est pas qu’un lieu d’apprentissage : c’est une institution qui façonne les individus et la société.</p>' +
      '<ul><li><b>Transmettre des savoirs</b> : lire, écrire, compter, raisonner, et des connaissances générales et professionnelles.</li><li><b>Socialiser</b> : transmettre les normes et les valeurs communes, former des citoyens. Pour Émile Durkheim, l’éducation est une « socialisation méthodique de la jeune génération » (<i>Éducation et sociologie</i>, 1922).</li><li><b>Qualifier et certifier</b> : délivrer des diplômes reconnus sur le marché du travail.</li><li><b>Favoriser l’égalité des chances</b> : dans une société démocratique, les positions sociales doivent être attribuées selon le <b>mérite</b> (le travail, les talents) et non selon la naissance. C’est l’idéal <b>méritocratique</b>.</li></ul>' +
      '<div class="def"><b>Égalité des chances</b> — situation où chacun, quelle que soit son origine, a la même probabilité d’accéder aux différentes positions sociales. À distinguer de l’égalité des <b>droits</b> (mêmes règles pour tous) et de l’égalité des <b>situations</b> (mêmes résultats).</div>' +
      '<div class="ex"><p>Quelques jalons : lois Ferry de 1881 (gratuité de l’école primaire publique) et de 1882 (instruction obligatoire de 6 à 13 ans, laïcité) ; scolarité obligatoire portée à 16 ans par la réforme Berthoin (1959) ; collège unique (réforme Haby, 1975) ; instruction obligatoire dès 3 ans et obligation de formation de 16 à 18 ans (loi de 2019, appliquée à partir de 2020 pour la formation).</p></div>' },

    { id: "s2-2", t: "Mesurer l’accès à l’École : la massification", h:
      '<div class="def"><b>Taux de scolarisation</b> — part des jeunes d’un âge donné qui sont scolarisés. <b>Taux d’accès à un diplôme</b> (ou à une formation) — part d’une génération qui obtient ce diplôme (ou entre dans cette formation).</div>' +
      '<div data-graph="s2-bac"></div>' +
      '<p>La proportion de bacheliers dans une génération passe de 20,1 % en 1970 à 62,7 % en 1995, puis à 80,1 % en 2025 (DEPP) : elle a gagné 60 points. La hausse est spectaculaire entre 1985 et 1995, après l’objectif fixé en 1985 de mener 80 % d’une génération au niveau du baccalauréat et la création du <b>bac professionnel</b> (premiers diplômés en 1987). Après un palier autour de 62 % de 1995 à 2008, elle repart avec la réforme de la voie professionnelle (bac pro en trois ans, à partir de 2009).</p>' +
      '<div class="def"><b>Massification scolaire</b> — forte hausse du nombre d’élèves et d’étudiants et de l’accès aux niveaux élevés d’enseignement.</div>' +
      '<div data-chain="s2-massif"></div>' +
      '<div class="attn"><p>Taux d’accès et taux de réussite sont différents : le taux de réussite au bac (part des candidats qui l’obtiennent) est bien plus élevé que la proportion de bacheliers dans une génération (part de <b>tous</b> les jeunes du même âge, y compris ceux qui ne se présentent pas).</p></div>' },

    { id: "s2-3", t: "Massification n’est pas démocratisation", h:
      '<div class="def"><b>Démocratisation scolaire</b> — réduction des inégalités d’accès aux diplômes et aux filières selon l’origine sociale. Antoine Prost distingue démocratisation <b>quantitative</b> (tout le monde accède plus loin : c’est la massification) et <b>qualitative</b> (les chances d’accès se rapprochent entre milieux sociaux).</div>' +
      '<p>Les inégalités face au diplôme se sont réduites : dix ans après leur entrée en sixième, 33 % des enfants d’ouvriers non qualifiés étaient sortis sans diplôme du secondaire, contre 8 % des enfants de cadres, pour les élèves entrés en 1995 (25 points d’écart) ; pour ceux entrés en 2007, c’est 19 % contre 4 % (15 points) (panels de la DEPP, Insee, <i>France, portrait social</i>, 2020). Mais les écarts se sont <b>déplacés</b> vers les filières.</p>' +
      '<div class="aut"><span class="mono">PM</span><span class="an">Pierre Merle<small>sociologue</small></span><span class="ad">Distingue la démocratisation <b>égalisatrice</b> (les écarts se réduisent), <b>uniforme</b> (tous progressent, écarts stables) et <b>ségrégative</b> (l’accès s’ouvre, mais les enfants des milieux populaires sont orientés vers les filières les moins valorisées).</span></div>' +
      '<div data-anim="s2-mass"></div>' +
      '<div data-graph="s2-filieres"></div>' +
      '<p>En 2023-2024, les enfants de cadres représentent 53,7 % des élèves de classes préparatoires et 64,9 % des élèves des écoles normales supérieures, alors que les cadres représentent 23,0 % des personnes en emploi en 2024. Les enfants d’ouvriers sont 6,4 % en classes préparatoires, mais 21,6 % en sections de technicien supérieur. À l’université, la part des enfants de cadres (34,9 %) est la même qu’en 2009 (Observatoire des inégalités). Le bac s’est ouvert, mais les filières restent hiérarchisées socialement : c’est une démocratisation <b>ségrégative</b>.</p>' +
      '<div class="attn"><p>Comparer la part des enfants de cadres en CPGE à la part des cadres dans l’emploi donne un <b>ordre de grandeur</b> de la surreprésentation, pas une mesure exacte : la population de référence (les parents de jeunes de 20 ans) n’est pas exactement celle des personnes en emploi.</p></div>' },

    { id: "s2-4", t: "Les facteurs d’inégalités de réussite : École et familles", h:
      '<p class="lede">Les inégalités de réussite scolaire selon l’origine sociale sont précoces et cumulatives. En France, l’écart de score en mathématiques entre élèves favorisés et défavorisés (quart supérieur et quart inférieur de l’indice socio-économique) atteint 113 points dans l’enquête PISA 2022, contre 93 en moyenne dans l’OCDE.</p>' +
      '<h3>1. Le rôle de l’École elle-même</h3>' +
      '<p>L’École n’est pas neutre :</p><ul><li><b>Effet établissement et ségrégation scolaire</b> : les élèves de milieux populaires sont concentrés dans certains établissements, où les enseignants sont souvent plus jeunes et changent plus souvent.</li><li><b>Attentes des enseignants</b> : l’« effet Pygmalion » (Rosenthal et Jacobson, 1968) montre que les attentes d’un enseignant envers un élève influencent ses progrès.</li><li><b>Orientation</b> : selon la DEPP, à résultats comparables en fin de troisième (moyenne entre 10 et 12), 91 % des enfants de cadres demandent une seconde générale et technologique, contre 59 % des enfants d’ouvriers non qualifiés (élèves entrés en sixième en 2007, DEPP, Note d’information n° 13.24).</li><li>Les savoirs et les codes valorisés (implicites, aisance à l’oral) sont plus proches de la culture des familles favorisées.</li></ul>' +
      '<h3>2. Le capital culturel</h3>' +
      '<div class="def"><b>Capital culturel</b> — ensemble des ressources culturelles d’un individu : connaissances, langage, goûts, diplômes, biens culturels. Pour Bourdieu, il existe à l’état <b>incorporé</b> (savoirs, manières de parler), <b>objectivé</b> (livres, instruments) et <b>institutionnalisé</b> (diplômes).</div>' +
      '<div class="aut"><span class="mono">BP</span><span class="an">Pierre Bourdieu et Jean-Claude Passeron<small><i>Les Héritiers</i>, 1964 ; <i>La Reproduction</i>, 1970</small></span><span class="ad">L’École évalue des compétences que certains élèves ont reçues dans leur famille. Ces « héritiers » réussissent, et leur réussite passe pour du talent : l’École légitime ainsi la reproduction des positions sociales.</span></div>' +
      '<div data-chain="s2-bourdieu"></div>' +
      '<h3>3. Les investissements familiaux</h3>' +
      '<p>Au-delà de ce qui se transmet sans y penser, les familles <b>investissent</b> : temps passé à aider aux devoirs, cours particuliers, activités culturelles et sportives, séjours linguistiques, connaissance des filières et de Parcoursup. Ces investissements demandent du temps, de l’argent et de l’information, inégalement répartis.</p>' +
      '<div class="aut"><span class="mono">BL</span><span class="an">Bernard Lahire<small><i>Tableaux de familles</i>, 1995</small></span><span class="ad">En étudiant des familles populaires, il montre que la transmission n’est jamais automatique : des <b>configurations familiales</b> (régularité, autorité, place de l’écrit, attention portée à la scolarité) expliquent des <b>réussites « paradoxales »</b> et, à l’inverse, des échecs en milieu favorisé.</span></div>' },

    { id: "s2-5", t: "Genre et stratégies des ménages", h:
      '<h3>4. La socialisation selon le genre</h3>' +
      '<div data-graph="s2-sexe"></div>' +
      '<p>En 2025, 85,4 % des filles d’une génération obtiennent le bac, contre 75,1 % des garçons ; l’écart est encore plus net pour le bac général (49,9 % contre 37,0 %), tandis que les garçons sont plus nombreux en bac professionnel (DEPP). Pourtant, les filles restent minoritaires dans les formations d’ingénieurs, le numérique et les classes préparatoires scientifiques.</p>' +
      '<div class="aut"><span class="mono">BE</span><span class="an">Christian Baudelot et Roger Establet<small><i>Allez les filles !</i>, 1992</small></span><span class="ad">Les filles ont dépassé les garçons dans la réussite scolaire, mais leurs choix d’orientation restent moins tournés vers les filières scientifiques et les plus rentables.</span></div>' +
      '<div data-chain="s2-genre"></div>' +
      '<p>Marie Duru-Bellat (<i>L’École des filles</i>, 1990) explique ces choix par une socialisation différenciée et par l’anticipation des rôles futurs. L’École participe aussi, souvent sans le vouloir, à ces écarts (attentes, conseils d’orientation, manuels).</p>' +
      '<h3>5. Les stratégies des ménages</h3>' +
      '<div class="aut"><span class="mono">RB</span><span class="an">Raymond Boudon<small><i>L’Inégalité des chances</i>, 1973</small></span><span class="ad">Approche par l’<b>individualisme méthodologique</b> : les inégalités résultent de l’agrégation de choix rationnels de familles qui, à chaque palier, comparent coûts, avantages et risques selon leur position sociale.</span></div>' +
      '<div data-anim="s2-boudon"></div>' +
      '<div data-chain="s2-boudon"></div>' +
      '<p>Les familles les mieux informées développent aussi des <b>stratégies</b> : choix de l’établissement (privé, contournement de la carte scolaire), options rares, classes à horaires aménagés. Agnès van Zanten (<i>Choisir son école</i>, 2009) montre que ces stratégies des classes moyennes et supérieures renforcent la ségrégation entre établissements. Une note de la DEPP montre de même que le choix du latin au collège est lié à l’origine sociale.</p>' +
      '<div class="cle"><p><b>À retenir :</b> aucun facteur n’explique seul les inégalités. Ils se cumulent et se combinent dans des <b>trajectoires individuelles</b> : un même capital culturel, des stratégies différentes, une configuration familiale particulière ou un enseignant décisif peuvent produire des parcours très différents.</p></div>' }
  ],

  bac: [
    { type: "Savoir-faire", origine: "Exercice du site, données DEPP", t: "Mesurer la massification", enonce: '<p>Proportion de bacheliers dans une génération (DEPP) : 1970 : 20,1 % ; 1985 : 29,4 % ; 1995 : 62,7 % ; 2025 : 80,1 %.</p><ol><li>Calcule l’indice de 2025, base 100 en 1970.</li><li>Compare les hausses de 1970-1985 et de 1985-1995 en points.</li><li>Pourquoi ces chiffres ne suffisent-ils pas à conclure à une démocratisation ?</li></ol>',
      corrige: '<ol><li>80,1 ÷ 20,1 × 100 ≈ 398,5 : la proportion a presque quadruplé.</li><li>1970-1985 : +9,3 points en 15 ans ; 1985-1995 : +33,3 points en 10 ans. La massification s’accélère fortement après 1985 (objectif de 80 % au niveau du bac, bac professionnel).</li><li>Ils mesurent l’accès de l’ensemble d’une génération (massification), pas les écarts entre milieux sociaux ni la répartition dans les filières. Il faudrait comparer les taux d’accès des enfants de cadres et d’ouvriers, et leur présence dans les filières sélectives.</li></ol>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet inventé pour le site", t: "Montrez que la massification scolaire ne s’est pas accompagnée d’une démocratisation complète.", enonce: "<p>3,5 points, sans document. Rappel : cette question n’est pas évaluée à l’écrit en 2027 ; l’exercice entraîne la méthode.</p>",
      corrige: '<div class="copie"><p>La massification scolaire est la forte hausse de l’accès aux niveaux élevés d’enseignement : la proportion de bacheliers dans une génération passe de 20,1 % en 1970 à 80,1 % en 2025 selon la DEPP. La démocratisation est la réduction des inégalités d’accès selon l’origine sociale. La première n’a entraîné la seconde que partiellement.</p><p>D’abord, les écarts face au diplôme se sont réduits mais n’ont pas disparu : selon les panels de la DEPP, l’écart de sortie sans diplôme entre enfants d’ouvriers non qualifiés et enfants de cadres passe de 25 points (entrés en sixième en 1995) à 15 points (entrés en 2007).</p><p>Surtout, les inégalités se sont déplacées vers les filières : c’est la démocratisation ségrégative décrite par Pierre Merle. Les enfants de milieux populaires accèdent davantage au bac, mais plus souvent au bac professionnel et aux formations courtes, tandis que les enfants de cadres dominent les filières sélectives. En 2023-2024, ils représentent 53,7 % des élèves de classes préparatoires, contre 6,4 % pour les enfants d’ouvriers, qui sont en revanche 21,6 % en sections de technicien supérieur (Observatoire des inégalités, d’après le ministère). Ces écarts s’expliquent notamment par le capital culturel et par les stratégies d’orientation des familles.</p></div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice du site, données ministère / Observatoire des inégalités", t: "Origine sociale et filières du supérieur", enonce: '<p>Document : le graphique « Qui étudie où ? » dans <a href="#s2:s2-3">le cours</a>.</p><ol><li>Comparez la part des enfants de cadres et d’ouvriers en classes préparatoires.</li><li>À l’aide du document et de vos connaissances, montrez que l’origine sociale influence les trajectoires de formation.</li></ol>',
      corrige: '<ol><li>Selon le ministère (repris par l’Observatoire des inégalités), en 2023-2024, 53,7 % des élèves de classes préparatoires sont enfants de cadres contre 6,4 % enfants d’ouvriers : environ 8,4 fois plus.</li><li>Le document montre une forte hiérarchie sociale des filières : plus une filière est sélective et prestigieuse, plus les enfants de cadres y sont nombreux (64,9 % en ENS) et les enfants d’ouvriers rares (2,0 %) ; à l’inverse, les enfants d’ouvriers sont mieux représentés en BTS (21,6 %), filière courte et professionnelle. Deux mécanismes l’expliquent. Le capital culturel transmis par les familles favorisées (Bourdieu et Passeron) facilite la réussite dans un système qui valorise leurs savoirs et leurs codes. Et les stratégies des familles (Boudon) : à résultats égaux, les familles populaires évaluent plus fortement les coûts et les risques d’études longues et choisissent plus souvent des formations courtes, ce que confirme la DEPP sur les vœux d’orientation en fin de troisième.</li></ol>' },
    { type: "Partie 3 · Raisonnement sur dossier", origine: "Sujet inventé pour le site", t: "À l’aide du dossier, montrez que la famille joue un rôle dans les inégalités de réussite scolaire.", enonce: '<p><b>Document 1</b> : PISA 2022, écart de 113 points en mathématiques entre élèves favorisés et défavorisés en France (OCDE : 93). <b>Document 2</b> : vœux d’orientation en fin de troisième, à moyenne de 10 à 12 : 91 % des enfants de cadres demandent une seconde générale et technologique contre 59 % des enfants d’ouvriers non qualifiés (DEPP). <b>Document 3</b> : graphique « Qui étudie où ? ».</p>',
      corrige: '<p><b>Introduction.</b> Les inégalités de réussite scolaire sont les écarts de résultats et de parcours entre élèves. La famille y contribue par ce qu’elle transmet, par ce qu’elle investit et par les choix qu’elle fait.</p><p><b>I. La famille transmet un capital culturel.</b> Langage, rapport à la lecture, connaissance des attentes scolaires (Bourdieu et Passeron). Document 1 : 113 points d’écart en mathématiques dès 15 ans.</p><p><b>II. La famille investit dans la scolarité.</b> Temps, aide aux devoirs, cours particuliers, activités ; configurations familiales (Lahire), qui expliquent aussi des réussites paradoxales.</p><p><b>III. La famille fait des choix d’orientation.</b> Coûts, avantages et risques selon la position sociale (Boudon). Document 2 : 91 % contre 59 % à résultats égaux. Document 3 : aboutissement de ces choix dans le supérieur (53,7 % contre 6,4 % en CPGE).</p><p><b>Conclusion.</b> La famille pèse par la transmission, l’investissement et la stratégie ; ces effets s’ajoutent au rôle de l’École elle-même.</p>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet inventé pour le site", t: "Comment expliquer les inégalités de réussite scolaire selon le milieu social ?", enonce: "<p>« Comment expliquer » appelle un plan explicatif (pas un oui / non).</p>",
      corrige: '<p><b>Problématique.</b> Malgré la massification, la réussite scolaire reste fortement liée à l’origine sociale. Ces inégalités tiennent-elles d’abord à ce que les familles transmettent, aux choix qu’elles font, ou au fonctionnement de l’École elle-même ?</p><p><b>I. Des inégalités héritées : le capital culturel et les investissements familiaux</b><br>A. Le capital culturel et la reproduction (Bourdieu et Passeron) ; PISA 2022.<br>B. Les investissements familiaux (temps, argent, information).<br>C. Des transmissions non mécaniques : configurations familiales (Lahire).</p><p><b>II. Des inégalités construites par les choix des familles</b><br>A. Le calcul coûts / avantages / risques et l’effet d’agrégation (Boudon) ; vœux en fin de troisième (DEPP).<br>B. Les stratégies d’établissement et d’options (van Zanten).<br>C. Le résultat : une démocratisation ségrégative (Merle) ; CPGE.</p><p><b>III. Des inégalités renforcées par l’École et croisées avec le genre</b><br>A. Ségrégation scolaire, attentes des enseignants (effet Pygmalion), orientation.<br>B. Les codes implicites valorisés par l’institution.<br>C. Le genre croise l’origine sociale : filles meilleures au bac, moins présentes en sciences (Baudelot et Establet).</p>' }
  ]

/* Point situé à la fraction q (0…1) de la longueur d'une ligne brisée */
function ANIM_LE_LONG(pts, q) {
  var L = 0, seg = [];
  for (var i = 1; i < pts.length; i++) { var d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
  var r = L * Math.max(0, Math.min(1, q));
  for (var j = 1; j < pts.length; j++) {
    if (seg[j - 1] >= r) { var f = seg[j - 1] ? r / seg[j - 1] : 0; return [pts[j - 1][0] + (pts[j][0] - pts[j - 1][0]) * f, pts[j - 1][1] + (pts[j][1] - pts[j - 1][1]) * f]; }
    r -= seg[j - 1];
  }
  return pts[pts.length - 1];
}

    { bo: "Comprendre les effets des fluctuations de l’activité économique sur le chômage conjoncturel.", clair: "Montrer comment un ralentissement de la demande crée du chômage, et comment il s’auto-entretient.", voir: "e3-4" },

  ],
  notions: ["chômage (au sens du BIT)", "population active", "taux de chômage", "taux d’emploi", "sous-emploi", "halo du chômage", "chômage structurel", "chômage conjoncturel", "appariement", "chômage frictionnel", "inadéquations spatiales et de qualifications", "asymétrie d’information", "salaire d’efficience", "salaire minimum", "règles de protection de l’emploi", "demande globale", "coût du travail", "formation", "flexibilisation", "rigidités du marché du travail"],
  sections: [
    { id: "e3-1", t: "Définir et mesurer le chômage", h:
      '<div class="def"><b>Chômeur au sens du BIT</b> — personne de 15 ans ou plus qui remplit trois conditions à la fois : être <b>sans emploi</b> pendant une semaine donnée (pas même une heure de travail) ; être <b>disponible</b> pour travailler dans les deux semaines ; avoir <b>cherché activement</b> un emploi dans les quatre dernières semaines (ou en avoir trouvé un qui commence dans moins de trois mois).</div>' +
      '<p>L’Insee le mesure chaque trimestre par l’<b>enquête Emploi</b>, selon cette définition internationale du Bureau international du travail. Il ne faut pas le confondre avec le nombre d’inscrits à France Travail (ex-Pôle emploi, devenu France Travail le 1er janvier 2024), qui repose sur des règles administratives.</p>' +
      '<div class="tbl"><table><thead><tr><th>Indicateur</th><th>Calcul</th><th class="n">2025</th></tr></thead><tbody>' +
      '<tr><td><b>Taux de chômage</b></td><td>chômeurs ÷ population active (personnes en emploi + chômeurs) × 100</td><td class="n">7,7 %</td></tr>' +
      '<tr><td><b>Taux d’emploi</b> (15-64 ans)</td><td>personnes en emploi ÷ population du même âge × 100</td><td class="n">69,3 %</td></tr>' +
      '</tbody></table></div><p class="src-l">Source : Insee, enquête Emploi 2025. Le taux d’emploi atteint son plus haut niveau depuis que l’Insee le mesure (1975).</p>' +
      '<div class="ex"><p>En 2025, 2 451 000 chômeurs et 29 383 000 personnes en emploi : 2 451 ÷ (29 383 + 2 451) × 100 ≈ 7,7 %. Le taux de chômage des 15-24 ans atteint 19,8 %, mais comme beaucoup de jeunes sont étudiants (inactifs), la <b>part</b> de chômeurs dans toute leur classe d’âge n’est que de 8,5 %.</p></div>' +
      '<div data-graph="e3-chomage"></div>' +
      '<p>Le chômage français a fortement augmenté après les chocs pétroliers (3,6 % en 1975, 10,6 % en 1994), puis il a fluctué au gré de la conjoncture : 7,4 % en 2008, 10,4 % en 2015, 7,3 % en 2022, 7,7 % en 2025. Les hommes, longtemps moins touchés que les femmes, ont désormais un taux proche du leur.</p>' +
      '<h3>Aux frontières du chômage</h3>' +
      '<div class="def"><b>Sous-emploi</b> — situation de personnes en emploi qui travaillent moins qu’elles ne le souhaitent : temps partiel subi (souhait de travailler plus et disponibilité) ou chômage partiel ou technique. En 2025, 4,4 % des personnes en emploi (Insee).</div>' +
      '<div class="def"><b>Halo autour du chômage</b> — personnes sans emploi, classées inactives par le BIT, mais proches du chômage : elles souhaitent travailler mais n’ont pas cherché, ou ne sont pas disponibles tout de suite. En 2025, 1,9 million de personnes (Insee).</div>' +
      '<div class="ex"><p>En 2020, pendant les confinements, de nombreux chômeurs n’ont pas pu chercher d’emploi : ils sont sortis du chômage BIT vers le halo, et le chômage partiel a concerné 4,3 % des personnes en emploi. Le taux de chômage a donc paradoxalement baissé (8,1 % contre 8,5 % en 2019) alors que l’activité s’effondrait.</p></div>' },

    { id: "e3-2", t: "Le chômage structurel : appariement et salaire d’efficience", h:
      '<div class="def"><b>Chômage structurel</b> — part du chômage qui ne dépend pas de la conjoncture : il persiste même quand l’activité est soutenue, à cause du fonctionnement du marché du travail et de ses institutions. Le <b>chômage conjoncturel</b>, lui, vient d’un ralentissement de l’activité.</div>' +
      '<h3>1. Les problèmes d’appariement</h3>' +
      '<p>L’<b>appariement</b> est la rencontre entre une offre d’emploi et un demandeur. Elle n’est ni immédiate ni automatique.</p>' +
      '<ul><li><b>Frictions</b> : chercher un emploi, comparer, postuler, passer des entretiens prend du temps, même quand il existe un poste qui convient. C’est le <b>chômage frictionnel</b>, inévitable dans une économie où les gens changent d’emploi.</li><li><b>Inadéquation de qualifications</b> : les emplois disponibles demandent des compétences que les chômeurs n’ont pas (et inversement), notamment quand la destruction créatrice déplace les emplois d’un secteur à l’autre.</li><li><b>Inadéquation spatiale</b> : les emplois ne sont pas là où vivent les chômeurs ; déménager coûte cher (logement, emploi du conjoint).</li></ul>' +
      '<div data-anim="e3-appariement"></div>' +
      '<div data-chain="e3-frictions"></div>' +
      '<div class="ex"><p>Le risque de chômage dépend fortement de la qualification : en 2025, 14,7 % des actifs sans diplôme ou avec le seul brevet sont au chômage, contre 5,3 % des diplômés du supérieur (Bac + 2 ou plus) ; 17,1 % des ouvriers peu qualifiés contre 4,0 % des cadres (Insee). Le progrès technique biaisé (<a href="#e1:e1-5">É1</a>) renforce ces écarts.</p></div>' +
      '<div data-graph="e3-diplome"></div>' +
      '<div class="plus"><p>La <b>courbe de Beveridge</b> relie le taux d’emplois vacants et le taux de chômage : si les deux augmentent ensemble, c’est le signe d’un appariement moins efficace. Peter Diamond, Dale Mortensen et Christopher Pissarides ont reçu le prix Nobel 2010 pour leurs travaux sur les marchés avec frictions de recherche.</p></div>' +
      '<h3>2. Les asymétries d’information : le salaire d’efficience</h3>' +
      '<p>Une <b>asymétrie d’information</b> existe quand une partie à un contrat en sait plus que l’autre. L’employeur ne connaît pas parfaitement l’effort ni la motivation de ses salariés. Selon la théorie du <b>salaire d’efficience</b>, il a alors intérêt à payer <b>plus</b> que le salaire du marché : cela motive (perdre cet emploi coûterait cher), réduit le départ des salariés formés et attire les meilleurs candidats.</p>' +
      '<div data-chain="e3-efficience"></div>' +
      '<div class="ex src"><p>Le 5 janvier 1914, Henry Ford annonce le « Five Dollar Day » à l’usine de Highland Park : 5 dollars pour une journée de 8 heures, contre environ 2,34 dollars pour 9 heures auparavant. Une partie de la somme est versée comme participation aux bénéfices, sous conditions de conduite. Le travail à la chaîne était si pénible que la rotation de la main-d’œuvre était énorme (environ 370 % en 1913, selon l’entreprise) ; avec ce salaire, les démissions et l’absentéisme chutent. Les historiens discutent encore de la part de ce motif. Exemple classique d’histoire économique, hors des documents du programme.</p></div>' +
      '<div class="aut"><span class="mono">SS</span><span class="an">Carl Shapiro et Joseph Stiglitz<small>1984</small></span><span class="ad">Leur modèle montre qu’avec un salaire d’efficience, le chômage est <b>involontaire</b> et durable : il sert même de « discipline » qui incite les salariés à l’effort. Stiglitz a reçu le prix Nobel 2001 (avec Akerlof et Spence) pour ses travaux sur les asymétries d’information.</span></div>' },

    { id: "e3-3", t: "Les institutions : salaire minimum et protection de l’emploi", h:
      '<p class="lede">Les <b>institutions du marché du travail</b> sont les règles qui l’encadrent : salaire minimum, contrats de travail, règles de licenciement, assurance chômage, négociation collective. Leurs effets sur le chômage structurel peuvent être positifs ou négatifs.</p>' +
      '<h3>1. Le salaire minimum</h3>' +
      '<div class="def"><b>SMIC</b> (salaire minimum interprofessionnel de croissance) — salaire horaire en dessous duquel aucun salarié ne peut être payé en France. Il est revalorisé chaque 1er janvier et automatiquement en cours d’année si l’inflation dépasse 2 % : 12,31 € brut de l’heure, soit 1 867,02 € brut par mois à temps plein (montant en vigueur en novembre 2026, service-public.fr).</div>' +
      '<div data-chain="e3-smic"></div>' +
      '<ul><li><b>Effet négatif possible</b> : si le salaire minimum dépasse la productivité de certains travailleurs (jeunes, peu qualifiés), les employeurs ne les embauchent pas.</li><li><b>Effets positifs possibles</b> : il soutient le pouvoir d’achat, donc la demande ; il rend le travail plus attractif que l’inactivité ; il fonctionne comme un salaire d’efficience (moins de départs, plus de motivation).</li></ul>' +
      '<div class="aut"><span class="mono">CK</span><span class="an">David Card et Alan Krueger<small>1994</small></span><span class="ad">En comparant les fast-foods du New Jersey, où le salaire minimum a augmenté en 1992, à ceux de la Pennsylvanie voisine, ils ne trouvent pas de baisse de l’emploi. Cette « expérience naturelle » a relancé le débat ; Card a reçu le prix Nobel 2021.</span></div>' +
      '<p>Pour limiter l’effet négatif sur l’emploi peu qualifié sans baisser le salaire du salarié, la France allège les cotisations sociales patronales au niveau du SMIC (voir plus bas).</p>' +
      '<h3>2. Les règles de protection de l’emploi</h3>' +
      '<div class="def"><b>Règles de protection de l’emploi</b> — ensemble des règles qui encadrent les licenciements et le recours aux contrats temporaires : préavis, motifs, indemnités, procédures, limites aux CDD et à l’intérim.</div>' +
      '<div data-chain="e3-protection"></div>' +
      '<p>Elles protègent les salariés contre les licenciements abusifs et stabilisent l’emploi en récession. Mais elles peuvent freiner les embauches en CDI et créer un <b>dualisme</b> du marché du travail : des salariés « insiders » protégés et des « outsiders » (jeunes, peu qualifiés) qui enchaînent contrats courts et chômage. Assar Lindbeck et Dennis Snower ont formalisé cette opposition (1988).</p>' +
      '<div class="ex"><p>En 2025, le chômage de longue durée (plus d’un an) touche 1,8 % des actifs, soit 23,1 % des chômeurs ; il concerne 39,1 % des chômeurs de 50 ans ou plus (Insee). Les règles qui protègent l’emploi en place peuvent rendre plus difficile le retour à l’emploi des chômeurs âgés.</p></div>' },

    { id: "e3-4", t: "Le chômage conjoncturel", h:
      '<div class="def"><b>Chômage conjoncturel</b> — chômage dû à un ralentissement de l’activité économique : la demande de biens et services baisse, les entreprises produisent moins et ont besoin de moins de travail.</div>' +
      '<div class="aut"><span class="mono">JK</span><span class="an">John Maynard Keynes<small>1883-1946</small></span><span class="ad"><i>Théorie générale de l’emploi, de l’intérêt et de la monnaie</i> (1936) : le niveau de l’emploi dépend de la <b>demande effective</b>, c’est-à-dire de la demande que les entreprises anticipent. Si elle est insuffisante, le chômage peut durer : c’est un chômage involontaire, que la baisse des salaires ne résout pas (elle réduirait encore la demande).</span></div>' +
      '<div data-anim="e3-spirale"></div>' +
      '<div data-chain="e3-conj"></div>' +
      '<div class="ex"><p>La crise de 2008-2009 : le PIB français recule de 2,8 % en 2009 (Insee) ; le taux de chômage passe de 7,4 % en 2008 à 9,1 % en 2009, puis continue de monter jusqu’à 10,4 % en 2015, car la reprise est lente et la zone euro connaît une seconde crise en 2011-2012.</p></div>' +
      '<p>L’emploi réagit avec retard : les entreprises commencent par réduire les heures supplémentaires et l’intérim, puis ne remplacent pas les départs, avant de licencier. À l’inverse, en reprise, elles attendent d’être sûres que l’activité repart avant d’embaucher. Les jeunes et les salariés en contrats courts sont les premiers touchés.</p>' +
      '<div class="attn"><p>Structurel et conjoncturel s’entremêlent : un chômage conjoncturel qui dure peut devenir structurel (les compétences des chômeurs de longue durée s’érodent, les employeurs s’en méfient). C’est l’effet d’<b>hystérèse</b>.</p></div>' },

    { id: "e3-5", t: "Quelles politiques contre le chômage ?", h:
      '<div class="tbl"><table><thead><tr><th>Politique</th><th>Chômage visé</th><th>Exemple en France</th><th>Limite</th></tr></thead><tbody>' +
      '<tr><td><b>Soutien de la demande globale</b> (budgétaire, monétaire)</td><td>Conjoncturel</td><td>Plan de relance de 2020 ; prise en charge massive du chômage partiel pendant la crise sanitaire.</td><td>Hausse de la dette publique ; une partie de la demande part en importations ; inefficace contre le chômage structurel.</td></tr>' +
      '<tr><td><b>Allègement du coût du travail</b></td><td>Structurel (peu qualifiés)</td><td>Réduction générale des cotisations patronales sur les bas salaires (depuis 2003) ; CICE (2013), transformé en baisse de cotisations en 2019.</td><td>Coût élevé pour les finances publiques ; effets d’aubaine ; risque de « trappe à bas salaires ».</td></tr>' +
      '<tr><td><b>Formation</b></td><td>Structurel (inadéquation des qualifications)</td><td>Compte personnel de formation (2015) ; apprentissage ; Plan d’investissement dans les compétences (2018).</td><td>Effets lents ; les formations profitent plus souvent aux plus qualifiés.</td></tr>' +
      '<tr><td><b>Flexibilisation</b></td><td>Structurel (rigidités)</td><td>Rupture conventionnelle (2008) ; ordonnances de septembre 2017 (barème des indemnités prud’homales).</td><td>Précarisation ; effet incertain sur le niveau de l’emploi ; les ajustements sont plus rapides dans les deux sens.</td></tr>' +
      '</tbody></table></div>' +
      '<h3>1. Soutenir la demande globale</h3><p>Contre le chômage conjoncturel, l’État peut augmenter ses dépenses ou baisser les impôts (politique <b>budgétaire</b>), la banque centrale baisser ses taux (politique <b>monétaire</b>). L’effet est amplifié par le <b>multiplicateur</b> : les revenus distribués sont en partie dépensés, ce qui crée d’autres revenus. Dans la zone euro, la politique monétaire est commune et les budgets nationaux sont encadrés (<a href="#e5">É5</a>).</p>' +
      '<div data-chain="e3-relance"></div>' +
      '<h3>2. Alléger le coût du travail</h3><p>Baisser les cotisations sociales patronales sur les bas salaires réduit le coût du travail peu qualifié <b>sans baisser le salaire net</b> : cela vise les emplois dont la productivité est proche du SMIC. Les évaluations trouvent des effets positifs sur l’emploi surtout pour les allègements ciblés au voisinage du SMIC.</p>' +
      '<h3>3. Former</h3><p>La formation améliore l’appariement en rapprochant les compétences des chômeurs de celles que demandent les entreprises. Elle agit sur la cause du chômage structurel, mais lentement.</p>' +
      '<h3>4. Flexibiliser</h3><p>Assouplir les règles d’embauche et de licenciement doit inciter les entreprises à embaucher. La <b>flexicurité</b> danoise combine licenciements faciles, indemnisation généreuse et politiques actives de retour à l’emploi : flexibilité pour l’entreprise, sécurité pour la personne plutôt que pour le poste.</p>' +
      '<div class="cle"><p><b>À retenir :</b> on choisit la politique selon le diagnostic. Contre un chômage conjoncturel, la relance de la demande ; contre un chômage structurel, des politiques de l’offre (coût du travail, formation, flexibilité). En pratique, les gouvernements combinent les deux.</p></div>' }
  ],

  bac: [
    { type: "Savoir-faire", origine: "Exercice du site, données Insee", t: "Calculer un taux de chômage", enonce: '<p>En 2025, en France, l’Insee compte 2 451 000 chômeurs au sens du BIT et 29 383 000 personnes en emploi.</p><ol><li>Calcule la population active, puis le taux de chômage.</li><li>Les 15-24 ans ont un taux de chômage de 19,8 % mais une « part de chômage » de 8,5 %. Explique la différence.</li></ol>',
      corrige: '<ol><li>Population active = 29 383 000 + 2 451 000 = 31 834 000. Taux de chômage = 2 451 ÷ 31 834 × 100 ≈ 7,7 %.</li><li>Le taux de chômage rapporte les chômeurs aux <b>actifs</b> ; la part de chômage les rapporte à <b>toute</b> la classe d’âge. Beaucoup de 15-24 ans étudient et sont inactifs : le dénominateur est bien plus grand, la part est donc plus faible.</li></ol>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet inventé pour le site", t: "Montrez que les problèmes d’appariement peuvent être à l’origine d’un chômage structurel.", enonce: "<p>3,5 points, sans document.</p>",
      corrige: '<div class="copie"><p>Le chômage structurel est la part du chômage qui ne dépend pas de la conjoncture. L’appariement est la rencontre entre une offre d’emploi et un demandeur d’emploi ; lorsqu’elle se fait mal, chômeurs et emplois vacants coexistent.</p><p>D’abord, les frictions : même lorsqu’un poste correspond à un chômeur, il faut du temps pour que l’information circule, que les candidatures soient examinées et que l’embauche se fasse. Pendant ce temps, la personne est au chômage : c’est le chômage frictionnel, qui existe même en période de forte activité.</p><p>Ensuite, les inadéquations. Inadéquation de qualifications : avec la destruction créatrice, les emplois créés demandent souvent des compétences que n’ont pas les personnes dont l’emploi a disparu ; en 2025, selon l’Insee, 14,7 % des actifs sans diplôme ou avec le brevet sont au chômage, contre 5,3 % des diplômés du supérieur. Inadéquation spatiale : les emplois sont concentrés dans certaines métropoles alors que des chômeurs vivent dans des territoires en déclin et ne peuvent pas déménager facilement. Dans ces deux cas, le chômage persiste même si la demande globale est soutenue : il est structurel.</p></div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice du site, document Insee", t: "Le chômage selon le diplôme", enonce: '<p>Document : le graphique « Qui est le plus exposé au chômage ? (2025) » dans <a href="#e3:e3-2">le cours</a>.</p><ol><li>Comparez le taux de chômage des actifs sans diplôme (ou avec le brevet) et celui des diplômés de Bac + 2 ou plus.</li><li>À l’aide du document et de vos connaissances, montrez que le chômage touche inégalement les actifs.</li></ol>',
      corrige: '<ol><li>Selon l’Insee, en 2025 en France, le taux de chômage des actifs sans diplôme ou avec le brevet est de 14,7 %, contre 5,3 % pour les diplômés de Bac + 2 ou plus : il est environ 2,8 fois plus élevé (9,4 points d’écart).</li><li>Le document montre une forte inégalité selon le diplôme et la qualification : 17,1 % de chômage pour les ouvriers peu qualifiés contre 4,0 % pour les cadres. Deux mécanismes l’expliquent. L’inadéquation des qualifications : le progrès technique biaisé et la tertiarisation augmentent la demande de travail qualifié et réduisent celle de travail peu qualifié et routinier. Le coût du travail : quand la productivité d’un emploi est proche du salaire minimum, l’employeur hésite à embaucher, d’où les allègements de cotisations ciblés sur les bas salaires. On peut ajouter que les jeunes (19,8 % de chômage) sont exposés car ils sont en phase d’insertion et occupent plus souvent des contrats courts, premiers supprimés quand l’activité ralentit.</li></ol>' },
    { type: "Partie 3 · Raisonnement sur dossier", origine: "Sujet inventé pour le site", t: "À l’aide du dossier, montrez que le chômage peut avoir des causes conjoncturelles.", enonce: '<p><b>Document 1</b> : le graphique « Le taux de chômage en France, 1975-2025 » (Insee). <b>Document 2</b> : le PIB en volume recule de 2,8 % en 2009 (Insee). <b>Document 3</b> (texte factuel) : en 2009, les entreprises réduisent l’intérim et les heures supplémentaires avant de supprimer des emplois.</p>',
      corrige: '<p><b>Introduction.</b> Le chômage conjoncturel est la part du chômage due à un ralentissement de l’activité. On montrera qu’un choc de demande réduit la production et l’emploi, puis que ce chômage peut s’auto-entretenir.</p><p><b>I. Un ralentissement de la demande réduit la production et l’emploi.</b> Demande effective (Keynes) : les entreprises produisent selon les ventes anticipées. Document 2 : récession de 2009. Document 3 : ajustement par l’intérim et les heures, puis l’emploi. Document 1 : 7,4 % en 2008, 9,1 % en 2009.</p><p><b>II. Le chômage conjoncturel s’auto-entretient.</b> Moins d’emplois → moins de revenus, épargne de précaution → moins de consommation et d’investissement → nouvelle baisse de la demande. Document 1 : la hausse continue jusqu’à 10,4 % en 2015 avec la crise de la zone euro. Risque d’hystérèse.</p><p><b>Conclusion.</b> Les fluctuations de l’activité expliquent une partie des variations du chômage, d’où les politiques de relance de la demande globale.</p>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet inventé pour le site", t: "Les politiques de l’offre sont-elles suffisantes pour lutter contre le chômage ?", enonce: "<p>Construis la problématique et le plan, puis compare.</p>",
      corrige: '<p><b>Problématique.</b> Les politiques de l’offre (coût du travail, formation, flexibilité) visent le chômage structurel. Peuvent-elles à elles seules faire baisser durablement le chômage, alors qu’une partie de celui-ci dépend de la demande ?</p><p><b>I. Les politiques de l’offre agissent sur le chômage structurel</b><br>A. Alléger le coût du travail peu qualifié (cotisations ; CICE devenu baisse de cotisations en 2019).<br>B. Former pour réduire les inadéquations (CPF, apprentissage).<br>C. Flexibiliser pour lever les rigidités (rupture conventionnelle, ordonnances de 2017 ; flexicurité).</p><p><b>II. Mais elles ont des limites</b><br>A. Effets d’aubaine, coût budgétaire, trappes à bas salaires.<br>B. Précarisation, dualisme du marché du travail.<br>C. Elles sont impuissantes face au chômage conjoncturel : 2009, PIB −2,8 %, chômage 7,4 % → 9,1 %.</p><p><b>III. Elles doivent être combinées à des politiques de la demande</b><br>A. Relance budgétaire et monétaire en récession (multiplicateur ; chômage partiel en 2020).<br>B. Éviter l’hystérèse : un chômage conjoncturel durable devient structurel.<br>C. Coordination européenne de la demande (<a href="#e5">É5</a>).</p>' }
  ]

      '<div data-chain="e4-bulle"></div>' +
      '<p>Le crédit joue souvent un rôle clé : on achète en empruntant, en espérant revendre plus cher. Quand les prix baissent, les emprunteurs doivent vendre pour rembourser, ce qui accélère le krach.</p>' +
      '<div class="ex"><p>La bulle internet : l’indice Nasdaq, riche en valeurs technologiques, atteint son sommet le 10 mars 2000, porté par des entreprises sans bénéfices dont on attendait des profits futurs considérables ; il perd environ 78 % jusqu’en octobre 2002.</p></div>' +
      '<div class="ex src"><p>La « tulipomanie » : dans les Provinces-Unies (actuels Pays-Bas), des bulbes de tulipes rares s’échangent à des prix extravagants, avant un effondrement en février 1637. Exemple classique, dont l’ampleur réelle est discutée par les historiens.</p></div>' },

    { id: "e4-3", t: "Paniques bancaires et faillites en chaîne", h:
      '<p class="lede">Une banque collecte des dépôts que les clients peuvent retirer à tout moment, et prête cet argent à long terme (crédits immobiliers, prêts aux entreprises). C’est la <b>transformation des échéances</b> : utile à l’économie, mais fragile.</p>' +
      '<div class="def"><b>Panique bancaire</b> (ruée bancaire) — retraits massifs et simultanés des déposants qui craignent de ne plus pouvoir récupérer leur argent. Comme la banque n’a pas toutes ses ressources disponibles, la crainte peut provoquer la faillite qu’elle redoutait.</div>' +
      '<div data-chain="e4-panique"></div>' +
      '<div class="aut"><span class="mono">DD</span><span class="an">Douglas Diamond et Philip Dybvig<small>1983 · Nobel 2022 avec Ben Bernanke</small></span><span class="ad">Leur modèle montre qu’une panique bancaire peut toucher une banque saine : si chacun croit que les autres vont retirer leurs dépôts, il est rationnel de se précipiter aussi. D’où l’utilité d’une garantie des dépôts.</span></div>' +
      '<div class="ex"><p>Le 9 mars 2023, les clients de Silicon Valley Bank, en Californie, demandent à retirer environ 42 milliards de dollars en une seule journée, alertés par des messages sur les réseaux sociaux. La banque est fermée par les autorités le lendemain, 10 mars 2023.</p></div>' +
      '<div class="def"><b>Faillites en chaîne</b> — les banques se prêtent entre elles et détiennent les mêmes types de titres : la faillite de l’une fait subir des pertes aux autres et répand la méfiance. On parle de <b>risque systémique</b>.</div>' +
      '<div data-anim="e4-contagion"></div>' +
      '<div data-chain="e4-chaine"></div>' +
      '<div class="ex"><p>Après la faillite de Lehman Brothers, le 15 septembre 2008, les banques ne savent plus lesquelles détiennent des titres toxiques : elles cessent de se prêter. Les banques centrales doivent fournir elles-mêmes les liquidités, et les États recapitalisent ou nationalisent des banques.</p></div>' },

    { id: "e4-4", t: "De la crise financière à l’économie réelle", h:
      '<p class="lede">L’<b>économie réelle</b> désigne la production de biens et de services, l’emploi et les revenus. Une crise financière la contamine par trois canaux.</p>' +
      '<h3>1. L’effet de richesse négatif</h3><p>La valeur des actions et des logements des ménages baisse : ils se sentent moins riches et consomment moins, surtout s’ils sont endettés. Les entreprises dont le cours s’effondre investissent moins.</p>' +
      '<h3>2. La baisse du prix du collatéral et les ventes forcées</h3><p>Le <b>collatéral</b> est un bien donné en garantie d’un prêt (le logement pour un crédit immobilier, des titres pour un prêt financier). Quand son prix baisse, la garantie ne couvre plus la dette : le prêteur exige un remboursement ou plus de garanties, et l’emprunteur doit <b>vendre en urgence</b>, ce qui fait encore baisser les prix. L’économiste Irving Fisher a décrit en 1933 cette spirale de la « déflation par la dette ».</p>' +
      '<h3>3. La contraction du crédit</h3><p>Les banques, qui ont subi des pertes et se méfient, réduisent leurs prêts et durcissent leurs conditions (<i>credit crunch</i>). Les entreprises ne peuvent plus financer leurs investissements ni même leur trésorerie ; les ménages n’obtiennent plus de crédits.</p>' +
      '<div data-chain="e4-reel"></div>' +
      '<div class="ex"><p>2008-2009 : avec la chute du commerce mondial et du crédit, le PIB de la France recule de 2,8 % en 2009 et son taux de chômage passe de 7,4 % à 9,1 % (Insee). La crise financière est devenue une crise économique et sociale.</p></div>' },

    { id: "e4-5", t: "Réguler le système bancaire et financier", h:
      '<div class="def"><b>Aléa moral</b> — situation où un agent, protégé contre les conséquences de ses actes, prend davantage de risques. Une banque qui sait qu’elle sera sauvée (« trop grosse pour faire faillite ») est incitée à prendre trop de risques.</div>' +
      '<div data-chain="e4-alea"></div>' +
      '<p>Le sauvetage des banques en 2008 a évité l’effondrement, mais il a renforcé cet aléa moral. D’où deux instruments, au programme :</p>' +
      '<h3>1. La supervision des banques par la banque centrale</h3><p>Une autorité contrôle la situation des banques : leurs risques, leurs fonds propres, leur organisation, et peut imposer des mesures. Dans la zone euro, la Banque centrale européenne supervise directement les grandes banques depuis le 4 novembre 2014 (mécanisme de surveillance unique), avec les autorités nationales comme l’ACPR en France. Des « tests de résistance » simulent des crises pour vérifier que les banques tiendraient.</p>' +
      '<h3>2. Le ratio de solvabilité</h3><div class="def"><b>Ratio de solvabilité</b> — rapport entre les <b>fonds propres</b> d’une banque (l’argent de ses actionnaires, qui absorbe les pertes) et ses actifs pondérés par leur risque. Plus il est élevé, plus la banque peut encaisser de pertes sans faire faillite.</div>' +
      '<p>Les accords de Bâle III (2010), négociés après la crise, exigent au minimum 4,5 % de fonds propres « durs » et 8 % de fonds propres au total, plus un coussin de conservation de 2,5 %. Plus de fonds propres, c’est aussi plus de « peau dans le jeu » pour les actionnaires : ils perdent leur mise si la banque prend trop de risques, ce qui réduit l’aléa moral.</p>' +
      '<div class="ex"><p>Après la crise de 1929, les États-Unis créent en 1933 une assurance fédérale des dépôts et séparent banques de dépôt et banques d’investissement (loi Glass-Steagall, abrogée en 1999). Aujourd’hui, dans l’Union européenne, les dépôts sont garantis jusqu’à 100 000 € par client et par banque.</p></div>' +
      '<div class="plus"><p>La <b>banque centrale prêteur en dernier ressort</b> fournit des liquidités aux banques solvables en difficulté passagère, pour éviter la contagion. Mais si elle sauve tout le monde, elle nourrit l’aléa moral : c’est pourquoi la supervision et les fonds propres viennent en amont.</p></div>' }
  ],

      corrige: '<div class="copie"><p>Une crise financière est une perturbation grave des marchés financiers et des banques ; l’économie réelle désigne la production, l’emploi et les revenus. La crise se transmet par trois canaux.</p><p>D’abord, l’effet de richesse négatif : la chute des cours boursiers et immobiliers réduit le patrimoine des ménages, qui consomment moins pour reconstituer leur épargne ou rembourser leurs dettes.</p><p>Ensuite, la baisse du prix du collatéral : les biens donnés en garantie des prêts perdent de la valeur, les emprunteurs doivent vendre en urgence, ce qui accentue la baisse des prix et les pertes (déflation par la dette décrite par Fisher en 1933).</p><p>Enfin, la contraction du crédit : les banques fragilisées prêtent moins, si bien que les entreprises réduisent leurs investissements. La demande baisse, la production recule et le chômage augmente : en France, le PIB a reculé de 2,8 % en 2009 et le chômage est passé de 7,4 % à 9,1 % (Insee).</p></div>' },

      corrige: '<p><b>Problématique.</b> Les crises financières semblent surgir brutalement. Elles résultent pourtant de mécanismes identifiables : des comportements qui alimentent les bulles, une fragilité propre aux banques, et une régulation parfois défaillante.</p><p><b>I. Des bulles alimentées par le mimétisme et les anticipations</b><br>A. Valeur fondamentale et bulle ; exemples (1929, internet 2000, immobilier américain 2006).<br>B. Mimétisme et prophéties autoréalisatrices.<br>C. Le rôle du crédit dans le gonflement puis l’éclatement.</p><p><b>II. Un système bancaire fragile qui propage la crise</b><br>A. Transformation des échéances et paniques (Diamond et Dybvig ; Silicon Valley Bank 2023).<br>B. Faillites en chaîne et risque systémique (1930-1933 ; Lehman 2008).<br>C. Transmission à l’économie réelle : richesse, collatéral, crédit.</p><p><b>III. Des crises favorisées par une régulation insuffisante</b><br>A. L’aléa moral des banques « trop grosses pour faire faillite ».<br>B. Une supervision en retard sur l’innovation financière (titrisation des subprimes).<br>C. Les réponses : supervision par la BCE (2014), ratios de solvabilité de Bâle III, garantie des dépôts.</p>' }

CH.e5 = {

  ],
  notions: ["intégration européenne", "marché unique", "union douanière", "zone euro", "politique de la concurrence", "entente", "abus de position dominante", "contrôle des concentrations", "aides d’État", "politique monétaire", "taux directeur", "inflation", "politique budgétaire", "multiplicateur", "stabilisateurs automatiques", "déficit public", "dette publique", "conjoncture", "Banque centrale européenne", "indépendance de la banque centrale", "Pacte de stabilité et de croissance", "coordination des politiques", "choc asymétrique"],
  sections: [
    { id: "e5-1", t: "L’intégration européenne : marché unique et zone euro", h:
      '<div class="def"><b>Intégration économique</b> — processus par lequel des pays suppriment progressivement les obstacles à leurs échanges, jusqu’à mettre en commun des politiques. Bela Balassa (1961) en distinguait les étapes : zone de libre-échange, union douanière, marché commun, union économique, intégration économique totale.</div>' +
      '<div class="tbl"><table><thead><tr><th>Date</th><th>Étape</th></tr></thead><tbody>' +
      '<tr><td>1957</td><td>Traité de Rome : Communauté économique européenne (six pays)</td></tr>' +
      '<tr><td>1968</td><td>Union douanière : plus de droits de douane entre membres, un tarif extérieur commun</td></tr>' +
      '<tr><td>1986</td><td>Acte unique européen : programme d’achèvement du marché intérieur</td></tr>' +
      '<tr><td>1992</td><td>Traité de Maastricht : Union européenne, projet de monnaie unique, critères de convergence</td></tr>' +
      '<tr><td>1er janvier 1993</td><td><b>Marché unique</b> : libre circulation des biens, des services, des capitaux et des personnes</td></tr>' +
      '<tr><td>1er janvier 1999</td><td><b>Euro</b> pour 11 pays (pièces et billets le 1er janvier 2002)</td></tr>' +
      '<tr><td>1er janvier 2026</td><td>La Bulgarie devient le 21e pays de la zone euro (l’Union compte 27 membres)</td></tr>' +
      '</tbody></table></div>' +
      '<div class="def"><b>Marché unique</b> — espace sans frontières intérieures où circulent librement les biens, les services, les capitaux et les personnes, avec des règles communes (normes, concurrence).</div>' +
      '<div data-chain="e5-marche"></div>' +
      '<p>Le marché unique favorise la croissance par les mécanismes du commerce entre pays comparables (<a href="#e2:e2-3">É2</a>) : un marché de plus de 400 millions de consommateurs permet des économies d’échelle ; la concurrence pousse à baisser les prix et à innover ; les entreprises s’implantent dans les autres pays membres. La libre circulation des capitaux facilite le financement des investissements.</p>' +
      '<div class="ex"><p>Avant 1993, un camion qui traversait l’Europe s’arrêtait à chaque frontière pour des contrôles et des formalités douanières. Avec le marché unique, ces contrôles disparaissent, et une norme technique reconnue dans un pays permet de vendre dans tous les autres.</p></div>' +
      '<div class="attn"><p>Les gains sont réels mais inégalement répartis : certaines régions et certains secteurs exposés à la concurrence ont perdu des emplois, et le marché des services reste moins intégré que celui des biens.</p></div>' },

    { id: "e5-2", t: "La politique européenne de la concurrence", h:
      '<p class="lede">La Commission européenne veille à ce que la concurrence ne soit pas faussée dans le marché unique. Objectif : des prix plus bas, plus de choix et plus d’innovation pour les consommateurs, et des règles du jeu égales pour toutes les entreprises.</p>' +
      '<div class="tbl"><table><thead><tr><th>Outil</th><th>Ce qui est interdit ou contrôlé</th><th>Exemple</th></tr></thead><tbody>' +
      '<tr><td><b>Ententes</b></td><td>Accords entre concurrents pour fixer les prix ou se partager les marchés</td><td>En 2016, amende de 2,93 milliards d’euros contre un cartel de constructeurs de camions qui s’étaient entendus sur les prix.</td></tr>' +
      '<tr><td><b>Abus de position dominante</b></td><td>Une entreprise dominante qui évince ses concurrents</td><td>Google sanctionné de 2,42 milliards d’euros en 2017 pour avoir favorisé son comparateur de prix ; amende confirmée par la Cour de justice de l’Union le 10 septembre 2024.</td></tr>' +
      '<tr><td><b>Contrôle des concentrations</b></td><td>Fusions qui réduiraient trop la concurrence</td><td>Fusion Siemens-Alstom (trains à grande vitesse, signalisation) interdite le 6 février 2019.</td></tr>' +
      '<tr><td><b>Aides d’État</b></td><td>Aides publiques qui avantagent certaines entreprises</td><td>Avantages fiscaux accordés par l’Irlande à Apple : récupération de 13 milliards d’euros, confirmée par la Cour de justice le 10 septembre 2024.</td></tr>' +
      '</tbody></table></div>' +
      '<h3>Les limites</h3>' +
      '<ul><li><b>Les « champions européens »</b> : en interdisant certaines fusions, l’Union empêcherait l’émergence de grandes entreprises capables de rivaliser avec les géants américains et chinois. Le refus de la fusion Siemens-Alstom a relancé ce débat ; le rapport de Mario Draghi sur la compétitivité européenne (septembre 2024) appelle à mieux tenir compte de l’innovation et de la taille mondiale.</li><li><b>La lenteur</b> : les procédures durent des années, alors que les marchés numériques évoluent très vite ; d’où le règlement sur les marchés numériques (DMA, 2022), qui fixe des obligations à l’avance aux très grandes plateformes.</li><li><b>Les aides d’État encadrées</b> limitent les politiques industrielles nationales, alors que les États-Unis et la Chine subventionnent massivement leurs industries.</li></ul>' +
      '<div class="ex"><p>Le sujet de dissertation du bac 2026 (jour 2) portait exactement sur ce point : « Dans quelle mesure la politique européenne de la concurrence atteint-elle ses objectifs ? ». Voir l’onglet <a href="#e5/bac">Sujets bac</a>.</p></div>' },

    { id: "e5-3", t: "Politique monétaire et politique budgétaire face à la conjoncture", h:
      '<div class="def"><b>Conjoncture</b> — situation économique à court terme : croissance, emploi, inflation. Les politiques conjoncturelles cherchent à la stabiliser : soutenir l’activité en récession, freiner l’inflation en surchauffe.</div>' +
      '<h3>1. La politique monétaire</h3>' +
      '<p>La banque centrale fixe ses <b>taux directeurs</b>, les taux auxquels les banques se refinancent auprès d’elle ou y déposent leurs liquidités. Ils se transmettent aux taux des crédits, donc à la demande.</p>' +
      '<div data-anim="e5-transmission"></div>' +
      '<div data-chain="e5-monetaire"></div>' +
      '<div data-graph="e5-bce"></div>' +
      '<p>Après la hausse de 2022-2023 puis les baisses de 2024-2025, la BCE a de nouveau relevé ses taux de 0,25 point en juin puis en septembre 2026 : le taux de la facilité de dépôt est de 2,50 % depuis le 16 septembre 2026, et il n’a pas changé lors de la réunion du 29 octobre 2026 (BCE, taux directeurs).</p>' +
      '<h3>2. La politique budgétaire</h3>' +
      '<p>L’État agit sur la demande par ses <b>dépenses</b> (investissements, prestations, salaires des fonctionnaires) et ses <b>recettes</b> (impôts, cotisations). Un <b>déficit public</b> apparaît quand les dépenses dépassent les recettes ; il s’ajoute à la <b>dette publique</b>.</p>' +
      '<div data-chain="e5-budgetaire"></div>' +
      '<p>L’effet est amplifié par le <b>multiplicateur keynésien</b> : un euro de dépense publique devient un revenu qui sera en partie dépensé, créant d’autres revenus. Il est réduit si une partie de la demande part en importations ou si les ménages épargnent par crainte des impôts futurs. Les <b>stabilisateurs automatiques</b> jouent sans décision nouvelle : en récession, les recettes fiscales baissent et les allocations chômage augmentent, ce qui soutient la demande.</p>' +
      '<div class="ex"><p>Pendant la crise sanitaire, la France a pris en charge le chômage partiel et lancé le plan France Relance (100 milliards d’euros, 2020) ; la BCE a lancé un programme d’achats d’urgence. En 2021, le PIB rebondit de 6,9 % (Insee).</p></div>' },

    { id: "e5-4", t: "Une monnaie, vingt et un budgets : les difficultés de la zone euro", h:
      '<h3>Une politique monétaire unique et indépendante</h3>' +
      '<p>La <b>Banque centrale européenne</b> (BCE), à Francfort, conduit la politique monétaire de toute la zone euro. Son mandat principal est la <b>stabilité des prix</b> : une inflation de 2 % à moyen terme. Elle est <b>indépendante</b> : ni les gouvernements ni les institutions européennes ne peuvent lui donner d’instructions. L’idée est de la protéger de la tentation de financer les États ou de stimuler l’économie avant une élection au prix de l’inflation.</p>' +
      '<h3>Des politiques budgétaires nationales mais encadrées</h3>' +
      '<p>Chaque État décide de son budget, mais les traités l’encadrent : le traité de Maastricht (1992) fixe des valeurs de référence de 3 % du PIB pour le déficit public et de 60 % pour la dette ; le Pacte de stabilité et de croissance (1997), réformé en 2024, organise la surveillance et peut aboutir à une procédure pour déficit excessif, ouverte contre la France en juillet 2024.</p>' +
      '<div data-graph="e5-budget"></div>' +
      '<p>Pourquoi ces règles ? Dans une union monétaire, un État trop endetté peut provoquer une crise qui touche tous les autres (comme la Grèce en 2010) et pousser la BCE à le secourir : les règles budgétaires évitent ce comportement de <b>passager clandestin</b>.</p>' +
      '<h3>Deux difficultés</h3>' +
      '<p><b>1. Le défaut de coordination.</b> Chaque État fixe son budget en fonction de sa situation, sans tenir compte des effets sur ses voisins (une relance allemande profite aussi aux exportations françaises). Le <b>policy mix</b> (combinaison des politiques monétaire et budgétaire) de la zone n’est donc le résultat d’aucune décision d’ensemble ; le budget de l’Union reste petit (environ 1 % de son revenu national).</p>' +
      '<p><b>2. Les chocs asymétriques.</b></p>' +
      '<div class="def"><b>Choc asymétrique</b> — événement qui touche un pays ou un groupe de pays de la zone, et pas les autres (ou pas de la même façon).</div>' +
      '<div data-anim="e5-choc"></div>' +
      '<div data-chain="e5-choc"></div>' +
      '<div class="aut"><span class="mono">RM</span><span class="an">Robert Mundell<small>1932-2021 · Nobel 1999</small></span><span class="ad">Sa théorie des <b>zones monétaires optimales</b> (1961) montre qu’une monnaie commune fonctionne bien si les pays subissent des chocs semblables, ou s’ils peuvent s’ajuster autrement : mobilité des travailleurs, flexibilité des salaires, transferts budgétaires.</span></div>' +

  bac: [
    { type: "Savoir-faire", origine: "Exercice du site, données BCE et Insee", t: "Points de pourcentage et ratios", enonce: '<p>Le taux de dépôt de la BCE passe de −0,50 % à 4,00 % entre juillet 2022 et septembre 2023. En 2025, le déficit public français est de 5,1 % du PIB et la dette de 115,6 % (Insee).</p><ol><li>De combien de points le taux a-t-il augmenté ? Pourquoi ne peut-on pas calculer de taux de variation ?</li><li>De combien de points le déficit dépasse-t-il la valeur de référence ? Et la dette ?</li></ol>',
      corrige: '<ol><li>4,00 − (−0,50) = +4,5 points. On ne calcule pas de taux de variation à partir d’une valeur négative ou nulle : il n’aurait pas de sens. Pour des taux, on raisonne en points.</li><li>Déficit : 5,1 − 3 = 2,1 points au-dessus de 3 %. Dette : 115,6 − 60 = 55,6 points au-dessus de 60 % ; elle représente près du double de la référence (115,6 ÷ 60 ≈ 1,93).</li></ol>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet officiel : bac 2026, jour 1 (France), partie 1 · corrigé du site", officiel: true, t: "Expliquez une difficulté soulevée par les chocs asymétriques dans la zone euro.", enonce: "<p>3,5 points, sans document.</p>",
      methode: "<p>Une seule difficulté, mais complètement expliquée : définir choc asymétrique et zone euro, dérouler le mécanisme, illustrer.</p>",
      corrige: '<div class="copie"><p>La zone euro regroupe 21 pays qui partagent une même monnaie et donc une même politique monétaire, conduite par la Banque centrale européenne. Un choc asymétrique est un événement qui touche un ou plusieurs pays de la zone, mais pas les autres.</p><p>La difficulté principale est que la politique monétaire unique ne peut pas répondre à un tel choc. Si un pays entre en récession alors que les autres sont en croissance, il aurait besoin d’une baisse des taux d’intérêt pour relancer le crédit, l’investissement et la consommation. Mais la BCE fixe un taux unique en fonction de la situation moyenne de la zone, qui ne correspond pas à la sienne. Il ne peut pas non plus dévaluer sa monnaie pour regagner en compétitivité, puisqu’il n’en a plus. Il ne lui reste que sa politique budgétaire, elle-même encadrée par les règles européennes (valeur de référence de 3 % du PIB pour le déficit). La récession et le chômage risquent donc d’y être plus longs.</p><p>Ainsi, après l’éclatement de sa bulle immobilière en 2008, l’Espagne a connu un taux de chômage de 26,1 % en 2013, contre 4,9 % en Allemagne (Eurostat, moyenne annuelle), alors que les deux pays avaient le même taux directeur.</p></div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice du site, données BCE", t: "Les taux de la BCE depuis 2021", enonce: '<p>Document : le graphique « Le taux de la facilité de dépôt de la BCE, 2021-2026 » dans <a href="#e5:e5-3">le cours</a>.</p><ol><li>Décrivez l’évolution du taux entre 2022 et 2025.</li><li>À l’aide du document et de vos connaissances, montrez comment la politique monétaire agit sur la conjoncture.</li></ol>',
      corrige: '<ol><li>Selon la BCE, le taux de la facilité de dépôt, négatif (−0,50 %) jusqu’au deuxième trimestre 2022, monte rapidement à partir de juillet 2022 pour atteindre 4 % au troisième trimestre 2023 (+4,5 points). Il reste à ce niveau jusqu’au printemps 2024, puis baisse par étapes jusqu’à 2 % au deuxième trimestre 2025.</li><li>En relevant ses taux, la BCE renchérit le refinancement des banques, qui augmentent les taux de leurs crédits. Ménages et entreprises empruntent moins : l’immobilier, l’investissement et la consommation ralentissent, la demande globale aussi, et les prix augmentent moins vite. C’est ce qui était recherché en 2022, quand l’inflation de la zone euro atteignait 10,6 % ; elle est revenue à 2,4 % en moyenne en 2024. Une fois l’inflation maîtrisée, la BCE a baissé ses taux à partir de juin 2024 pour soutenir une activité faible : le mécanisme joue alors dans l’autre sens. Les effets ne sont pas immédiats : il faut plusieurs trimestres pour qu’une décision se transmette aux prix.</li></ol>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet officiel : bac 2026, jour 2 (France), dissertation · plan du site", officiel: true, t: "Dans quelle mesure la politique européenne de la concurrence atteint-elle ses objectifs ?", enonce: "<p>Les documents du sujet officiel ne sont pas reproduits ici. Construis la problématique et le plan, puis compare.</p>",
      corrige: '<p><b>Problématique.</b> La politique européenne de la concurrence veut protéger les consommateurs (prix bas, choix, innovation) et garantir des règles égales dans le marché unique. Y parvient-elle, alors qu’on lui reproche d’affaiblir l’industrie européenne face aux géants américains et chinois ?</p><p><b>I. Une politique qui atteint largement ses objectifs</b><br>A. Elle sanctionne les ententes qui font monter les prix (cartel des camions, 2,93 milliards d’euros en 2016).<br>B. Elle limite les abus des entreprises dominantes, y compris étrangères (Google, 2017, confirmé en 2024).<br>C. Elle empêche les aides d’État qui faussent la concurrence entre pays membres (Apple en Irlande, 13 milliards, 2024) et contribue aux gains du marché unique.</p><p><b>II. Mais ses résultats sont limités</b><br>A. Des procédures lentes face aux marchés numériques, d’où le DMA (2022).<br>B. Elle peut empêcher l’émergence de champions européens (Siemens-Alstom, 2019 ; rapport Draghi, 2024).<br>C. Elle encadre les aides publiques quand les autres puissances subventionnent massivement leurs industries.</p><p><b>III. Des objectifs qu’il faut articuler avec d’autres politiques</b><br>A. Concilier concurrence et politique industrielle (assouplissement des aides pour la transition écologique).<br>B. Intégrer l’innovation et la dimension mondiale dans l’analyse des fusions.<br>C. Coordonner avec la politique commerciale (défense contre les subventions étrangères).</p>' }
  ]

  essentiel: [
