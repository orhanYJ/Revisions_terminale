  notions: ["commerce international", "exportations / importations", "solde commercial", "spécialisation internationale", "avantage absolu", "avantage comparatif", "coût d’opportunité", "dotations factorielles", "dotations technologiques", "commerce intra-branche / inter-branche", "différenciation horizontale / verticale", "économies d’échelle", "compétitivité-prix / hors-prix", "productivité des firmes", "chaîne de valeur", "firme multinationale", "investissement direct à l’étranger", "sous-traitance", "délocalisation", "libre-échange", "protectionnisme", "droits de douane", "barrières non tarifaires"],
  sections: [
    { id: "e2-1", t: "Le commerce mondial en chiffres", h:
      '<p class="lede">Le commerce international est l’échange de biens et de services entre pays. Une <b>exportation</b> est une vente à un non-résident ; une <b>importation</b>, un achat à un non-résident.</p>' +
      '<div data-graph="e2-monde"></div>' +
      '<p>En 2024, selon l’OMC, les exportations mondiales de marchandises atteignent 24 430 milliards de dollars (+2 %) et celles de services commerciaux 8 690 milliards (+9 %). La Chine est le premier exportateur de marchandises (3 580 milliards de dollars, soit environ 15 % du total) ; les États-Unis sont le premier importateur.</p>' +
      '<div class="def"><b>Solde commercial</b> — exportations moins importations de biens. Négatif : déficit ; positif : excédent. Le <b>taux de couverture</b> = exportations ÷ importations × 100.</div>' +
      '<div data-graph="e2-france"></div>' +
      '<p>La France affiche un déficit des échanges de biens : −69,2 milliards d’euros en 2025, contre environ −79 milliards en 2024, d’après la Douane. L’amélioration vient surtout des matériels de transport (aéronautique, automobile), des produits pharmaceutiques (solde record) et d’une facture énergétique plus faible. Un déficit n’est pas en soi une « perte » : il traduit aussi le fait que le pays consomme et investit plus qu’il ne produit, et achète des biens intermédiaires utiles à ses entreprises.</p>' +
      '<div class="plus"><p>Exportations et importations ne se mesurent pas tout à fait de la même façon : FAB (« franco à bord », valeur à la frontière du pays exportateur) ou CAF (« coût, assurance, fret », valeur à l’arrivée). Pour calculer un solde rigoureux, il faut les deux sur la même base, d’où le solde « FAB/FAB » publié par la Douane.</p></div>' },

    { id: "e2-2", t: "Les avantages comparatifs : technologies et dotations", h:
      '<div class="aut"><span class="mono">AS</span><span class="an">Adam Smith<small>1723-1790</small></span><span class="ad"><i>La Richesse des nations</i> (1776) : chaque pays doit se spécialiser dans les biens pour lesquels il a un <b>avantage absolu</b>, c’est-à-dire qu’il produit avec moins de travail que les autres. Limite : un pays qui n’a aucun avantage absolu serait exclu de l’échange.</span></div>' +
      '<div class="aut"><span class="mono">DR</span><span class="an">David Ricardo<small>1772-1823</small></span><span class="ad"><i>Des principes de l’économie politique et de l’impôt</i> (1817) : même un pays moins productif dans tous les biens gagne à l’échange s’il se spécialise là où son désavantage est le plus faible. C’est l’<b>avantage comparatif</b>, qui repose ici sur des différences de <b>technologie</b> (de productivité du travail).</span></div>' +
      '<p>L’exemple de Ricardo : nombre d’heures de travail nécessaires pour produire une unité de drap et une unité de vin.</p>' +
      '<div class="tbl"><table><thead><tr><th></th><th class="n">Drap</th><th class="n">Vin</th><th>Coût d’opportunité du drap</th></tr></thead><tbody>' +
      '<tr><td>Angleterre</td><td class="n">100 h</td><td class="n">120 h</td><td>100 ÷ 120 ≈ 0,83 unité de vin</td></tr>' +
      '<tr><td>Portugal</td><td class="n">90 h</td><td class="n">80 h</td><td>90 ÷ 80 = 1,125 unité de vin</td></tr></tbody></table></div>' +
      '<p>Le Portugal est plus productif dans les deux biens (avantage absolu partout). Mais produire du drap coûte relativement moins cher en Angleterre (0,83 unité de vin « sacrifiée », contre 1,125 au Portugal) : l’Angleterre a un avantage comparatif en drap, le Portugal en vin.</p>' +
      '<details class="pli"><summary>Le calcul du gain à l’échange</summary><div><p>Sans échange, chaque pays produit une unité de chaque bien : 2 draps et 2 unités de vin, avec 220 heures en Angleterre et 170 au Portugal. Si l’Angleterre consacre ses 220 heures au drap, elle en produit 2,2 ; si le Portugal consacre ses 170 heures au vin, il en produit 2,125. Avec les mêmes heures, le monde dispose de 0,2 drap et de 0,125 unité de vin en plus : c’est le gain de la spécialisation, à partager par l’échange.</p></div></details>' +
      '<div data-chain="e2-ricardo"></div>' +
      '<div class="def"><b>Dotations factorielles</b> — quantités de facteurs de production (travail plus ou moins qualifié, capital, terres, ressources naturelles) dont dispose un pays.</div>' +
      '<div class="aut"><span class="mono">HOS</span><span class="an">Heckscher, Ohlin et Samuelson<small>1919, 1933, années 1940</small></span><span class="ad">Le modèle <b>HOS</b> explique les avantages comparatifs par les dotations : un pays se spécialise dans les biens qui utilisent intensément le facteur dont il est <b>relativement abondant</b>, donc relativement bon marché.</span></div>' +
      '<div data-chain="e2-hos"></div>' +
      '<div class="ex"><p>Le Bangladesh, où le travail peu qualifié est abondant, est devenu l’un des premiers exportateurs mondiaux de vêtements. L’Australie, abondante en terres et en minerais, exporte surtout des matières premières (minerai de fer, charbon) et des produits agricoles.</p></div>' +
      '<div class="aut"><span class="mono">WL</span><span class="an">Wassily Leontief<small>1905-1999 · Nobel 1973</small></span><span class="ad">En 1953, il constate que les exportations américaines sont plus intensives en travail que leurs importations, alors que les États-Unis sont riches en capital : c’est le <b>paradoxe de Leontief</b>. On l’explique en distinguant le travail <b>qualifié</b>, abondant aux États-Unis : les dotations comprennent aussi le capital humain et la technologie.</span></div>' +
      '<p>Les avantages comparatifs ne sont pas figés : ils se <b>construisent</b> par l’investissement, l’éducation et les politiques industrielles. La Corée du Sud exportait surtout des produits textiles dans les années 1960 ; elle est aujourd’hui un grand exportateur de semi-conducteurs, d’automobiles et de navires.</p>' },

    { id: "e2-3", t: "Le commerce entre pays comparables", h:
      '<p class="lede">Ricardo et HOS expliquent bien les échanges entre pays <b>différents</b> (des vêtements contre des avions). Mais une grande partie du commerce mondial se fait entre pays riches et semblables, qui échangent des produits semblables.</p>' +
      '<div class="def"><b>Commerce intra-branche</b> — échange de produits d’une même branche entre deux pays (la France exporte des voitures en Allemagne et en importe). Le commerce <b>inter-branche</b> échange des produits de branches différentes.</div>' +
      '<p>Trois raisons, citées par le programme, l’expliquent :</p>' +
      '<ul><li><b>La différenciation des produits</b> : les consommateurs aiment la variété. Différenciation <b>horizontale</b> : des produits de même qualité mais de caractéristiques différentes (marques, styles, modèles). </li><li><b>La qualité des produits</b> : différenciation <b>verticale</b>, des gammes de qualité et de prix différents. Un même pays importe des produits d’entrée de gamme et exporte du haut de gamme.</li><li><b>La fragmentation de la chaîne de valeur</b> : les pays échangent des pièces et des composants d’un même produit (voir plus bas).</li></ul>' +
      '<div class="aut"><span class="mono">PK</span><span class="an">Paul Krugman<small>né en 1953 · Nobel 2008</small></span><span class="ad">La <b>nouvelle théorie du commerce international</b> (1979-1980) explique le commerce intra-branche par les <b>économies d’échelle</b> (rendements croissants) et le <b>goût pour la variété</b>. Chaque pays se spécialise dans certaines variétés produites en grande série.</span></div>' +
      '<div data-chain="e2-krugman"></div>' +
      '<div class="ex"><p>L’automobile entre la France et l’Allemagne : Renault et Stellantis vendent des voitures en Allemagne, Volkswagen, BMW et Mercedes en vendent en France. Les modèles diffèrent par le style et l’image (horizontale) et par la gamme (verticale : beaucoup de modèles allemands sont positionnés sur le haut de gamme).</p></div>' +
      '<p>Le marché unique européen, en supprimant les obstacles aux échanges entre pays proches, a fortement développé ce commerce intra-branche (question <a href="#e5">É5</a>).</p>' },

    { id: "e2-4", t: "Productivité des firmes et compétitivité du pays", h:
      '<div class="def"><b>Compétitivité</b> — aptitude d’une entreprise ou d’un pays à vendre ses produits face à la concurrence ; pour un pays, son <b>aptitude à exporter</b> (gagner ou garder des parts de marché).</div>' +
      '<ul><li><b>Compétitivité-prix</b> : vendre moins cher que les concurrents, à qualité égale. Elle dépend du coût unitaire de production (salaires, productivité), des marges et du taux de change.</li><li><b>Compétitivité hors-prix</b> : vendre grâce à autre chose que le prix : qualité, innovation, image de marque, design, service après-vente, délais.</li></ul>' +
      '<div data-chain="e2-compet"></div>' +
      '<p>Le coût salarial ne suffit pas à juger la compétitivité : un salaire plus élevé n’augmente pas le coût unitaire si la productivité augmente autant. C’est le <b>coût salarial unitaire</b> (coût du travail par unité produite) qui compte.</p>' +
      '<div class="aut"><span class="mono">MM</span><span class="an">Marc Melitz<small>né en 1968</small></span><span class="ad">Modèle des <b>firmes hétérogènes</b> (2003) : au sein d’un même pays et d’une même branche, les firmes ont des productivités très différentes. Seules les plus productives exportent.</span></div>' +
      '<div data-chain="e2-melitz"></div>' +
      '<div class="ex"><p>L’aéronautique illustre la compétitivité hors-prix française : un avion se vend sur sa fiabilité, sa consommation de carburant et le service, plus que sur son prix. En 2025, selon la Douane, l’amélioration du solde commercial de la France est portée par les matériels de transport, en particulier l’aéronautique, et par les produits pharmaceutiques.</p></div>' +
      '<div class="ex"><p>Ce mécanisme était le sujet de la partie 3 de l’épreuve composée du bac 2026 (jour 1) : « montrez que la productivité des firmes sous-tend la compétitivité d’un pays, c’est-à-dire son aptitude à exporter ». Voir l’onglet <a href="#e2/bac">Sujets bac</a>.</p></div>' },

    { id: "e2-5", t: "L’internationalisation de la chaîne de valeur", h:
      '<div class="def"><b>Chaîne de valeur</b> — ensemble des étapes qui ajoutent de la valeur à un produit : conception, recherche, fabrication des composants, assemblage, logistique, marketing, vente, services.</div>' +
      '<div class="def"><b>Firme multinationale (FMN)</b> — entreprise qui possède au moins une filiale de production à l’étranger, créée ou rachetée par un <b>investissement direct à l’étranger</b> (IDE), c’est-à-dire une prise de contrôle durable (au moins 10 % du capital par convention).</div>' +
      '<div data-chain="e2-cvm"></div>' +
      '<p>On parle de <b>décomposition internationale des processus productifs</b>. Les firmes y recourent pour réduire leurs coûts (main-d’œuvre, impôts), accéder à des compétences, se rapprocher de leurs marchés ou contourner des barrières douanières. Selon l’OCDE, environ <b>70 % du commerce international</b> fait intervenir des chaînes de valeur mondiales : services, matières premières, pièces et composants franchissent plusieurs frontières.</p>' +
      '<div data-graph="e2-iphone"></div>' +
      '<div class="ex"><p>En 2009, un iPhone 3G coûte environ 178,96 dollars à fabriquer. L’assemblage en Chine ne représente que 6,50 dollars, soit 3,6 % ; les composants viennent surtout de fournisseurs japonais, allemands, sud-coréens et américains ; la conception et la marque sont américaines. Pourtant, toute la valeur de l’appareil expédié vers les États-Unis est comptée comme une importation en provenance de Chine (Xing et Detert, 2010).</p></div>' +
      '<div class="ex"><p>L’Airbus A320 : des éléments produits en France, en Allemagne, en Espagne et au Royaume-Uni (où sont fabriquées les ailes) ; des lignes d’assemblage final à Toulouse, à Hambourg, à Tianjin en Chine et à Mobile aux États-Unis.</p></div>' +
      '<p>Pour mesurer correctement qui produit quoi, on raisonne donc en <b>commerce en valeur ajoutée</b> plutôt qu’en valeur brute. Les pénuries de 2020-2021 (masques, puis semi-conducteurs) ont montré la fragilité de chaînes très longues : certaines entreprises et certains États cherchent désormais à <b>relocaliser</b> ou à diversifier leurs fournisseurs.</p>' },

    { id: "e2-6", t: "Gagnants et perdants du commerce international", h:
      '<h3>1. Des gains moyens : la baisse des prix</h3>' +
      '<p>L’ouverture fait baisser les prix pour les consommateurs : la spécialisation selon les avantages comparatifs, les économies d’échelle et la concurrence étrangère abaissent les coûts et les marges. Elle élargit aussi la <b>variété</b> des produits disponibles. Ces gains sont dits « moyens » car ils profitent à l’ensemble des consommateurs, même s’ils sont inégalement répartis.</p>' +
      '<h3>2. Une réduction des inégalités entre pays</h3>' +
      '<p>Les pays émergents qui se sont ouverts et intégrés aux chaînes de valeur ont rattrapé une partie de leur retard : la Chine, membre de l’OMC depuis décembre 2001, est devenue le premier exportateur mondial de marchandises. Leur croissance a fait sortir des centaines de millions de personnes de la pauvreté et réduit l’écart de revenu moyen avec les pays riches.</p>' +
      '<div class="aut"><span class="mono">BM</span><span class="an">Branko Milanovic<small>né en 1953</small></span><span class="ad">Avec Christoph Lakner, il montre qu’entre 1988 et 2008 les revenus ont fortement progressé pour les classes moyennes des pays émergents et pour les plus riches du monde, mais peu pour les classes populaires et moyennes des pays riches : la « <b>courbe de l’éléphant</b> ».</span></div>' +
      '<h3>3. Une hausse des inégalités au sein de chaque pays</h3>' +
      '<p>Le théorème de <b>Stolper-Samuelson</b>, issu de HOS, prévoit que l’ouverture profite au facteur abondant et nuit au facteur rare. Dans un pays riche, le facteur rare est le travail peu qualifié.</p>' +
      '<div data-chain="e2-ineg"></div>' +
      '<div class="aut"><span class="mono">ADH</span><span class="an">Autor, Dorn et Hanson<small>« The China Syndrome », 2013</small></span><span class="ad">Les zones des États-Unis les plus exposées à la concurrence des importations chinoises ont perdu durablement des emplois industriels, avec des salaires plus bas et davantage de prestations sociales : c’est le « <b>choc chinois</b> ».</span></div>' +
      '<p>Ces effets se cumulent avec ceux du progrès technique biaisé (<a href="#e1:e1-5">É1</a>) : il est difficile de séparer ce qui vient du commerce et ce qui vient de l’automatisation.</p>' },

    { id: "e2-7", t: "Libre-échange ou protectionnisme ?", h:
      '<div class="def"><b>Libre-échange</b> — politique qui supprime les obstacles aux échanges internationaux. <b>Protectionnisme</b> — politique qui protège la production nationale de la concurrence étrangère.</div>' +
      '<p>Instruments du protectionnisme : <b>droits de douane</b> (taxes sur les importations), <b>quotas</b> (quantités maximales importées), <b>barrières non tarifaires</b> (normes techniques ou sanitaires, procédures), <b>subventions</b> aux producteurs nationaux.</p>' +
      '<div class="tbl"><table><thead><tr><th>Arguments du libre-échange</th><th>Arguments du protectionnisme</th></tr></thead><tbody>' +
      '<tr><td>Gains de la spécialisation (Ricardo, HOS), baisse des prix, variété.</td><td>Protéger les <b>industries naissantes</b> le temps qu’elles deviennent compétitives (List, 1841 : protectionnisme <b>éducateur</b>).</td></tr>' +
      '<tr><td>Concurrence : incite les firmes à innover ; seules les plus productives prospèrent (Melitz).</td><td>Protéger l’emploi et les territoires frappés par la concurrence (choc chinois) ; limiter les inégalités internes.</td></tr>' +
      '<tr><td>Diffusion des technologies et rattrapage des pays pauvres.</td><td>Indépendance stratégique : santé, énergie, défense, semi-conducteurs.</td></tr>' +
      '<tr><td>Le protectionnisme entraîne des représailles et coûte aux consommateurs.</td><td>Répondre à une concurrence jugée déloyale (subventions, dumping social ou environnemental).</td></tr>' +
      '</tbody></table></div>' +
      '<div data-chain="e2-protect"></div>' +
      '<div class="ex"><p>Années 1930 : le tarif Smoot-Hawley adopté par les États-Unis en juin 1930 et les représailles qui ont suivi ont accompagné l’effondrement du commerce mondial pendant la Grande Dépression. Après 1945, le GATT (1947) puis l’OMC (créée le 1er janvier 1995) organisent la baisse négociée des droits de douane.</p><p>2025 : le 2 avril, les États-Unis annoncent des « droits de douane réciproques », avec un taux minimum de 10 % sur la plupart des importations et des taux plus élevés pour de nombreux partenaires. Le protectionnisme est redevenu un instrument politique majeur.</p></div>' +
      '<div class="plus"><p>Entre les deux, il existe des positions intermédiaires : protectionnisme ciblé et temporaire, accords régionaux (Union européenne), clauses sociales et environnementales dans les traités, mécanisme d’ajustement carbone aux frontières de l’Union européenne.</p></div>' }
  ],
  pieges: [
    { f: "« Un pays moins productif dans tous les biens ne peut pas gagner à l’échange. »", v: "Faux : c’est tout l’apport de Ricardo. Il gagne en se spécialisant là où son désavantage est le plus faible (avantage comparatif)." },
    { f: "Confondre avantage absolu et avantage comparatif.", v: "Absolu : produire avec moins de travail que l’autre pays. Comparatif : produire avec un coût d’opportunité plus faible." },
    { f: "« Ricardo explique la spécialisation par les dotations en facteurs. »", v: "Ricardo : différences de technologie (productivité du travail). HOS : différences de dotations factorielles." },
    { f: "« La compétitivité, c’est uniquement vendre moins cher. »", v: "Il y a aussi la compétitivité hors-prix : qualité, innovation, image, services. Et c’est le coût <b>unitaire</b> qui compte, pas le salaire seul." },
    { f: "« Un iPhone importé de Chine, c’est de la valeur ajoutée chinoise. »", v: "Le commerce en valeur brute compte toute la valeur au dernier pays exportateur ; en valeur ajoutée, la Chine n’apporte qu’une petite part (3,6 % pour l’iPhone 3G)." },
    { f: "« Le commerce international augmente les inégalités. »", v: "Il faut préciser : il tend à <b>réduire</b> les inégalités <b>entre</b> pays et peut <b>accroître</b> celles <b>au sein</b> de chaque pays." },
    { f: "« Le protectionnisme protège l’emploi. »", v: "Il protège les emplois des secteurs protégés, mais renchérit les biens importés, pénalise les entreprises utilisatrices et peut entraîner des représailles qui détruisent des emplois exportateurs." }
  ],
  retenir:
    '<h3>Définitions</h3><ul>' +
    '<li><b>Avantage comparatif</b> (Ricardo, 1817) : se spécialiser là où le coût d’opportunité est le plus faible ; l’échange profite aux deux pays.</li>' +
    '<li><b>Dotations factorielles</b> (HOS) : un pays exporte les biens intensifs dans son facteur relativement abondant. Paradoxe de Leontief (1953).</li>' +
    '<li><b>Commerce intra-branche</b> : échange de produits similaires entre pays comparables ; différenciation horizontale (variété) et verticale (qualité) ; économies d’échelle (Krugman, Nobel 2008).</li>' +
    '<li><b>Compétitivité</b> : aptitude à exporter ; prix (coût unitaire, change, marges) et hors-prix (qualité, innovation). Seules les firmes les plus productives exportent (Melitz).</li>' +
    '<li><b>Chaîne de valeur internationalisée</b> : FMN, IDE (≥ 10 % du capital), sous-traitance ; environ 70 % du commerce passe par des chaînes de valeur mondiales (OCDE). iPhone 3G : 6,50 $ d’assemblage chinois sur 178,96 $.</li>' +
    '<li><b>Effets</b> : baisse des prix et variété ; inégalités entre pays en baisse (courbe de l’éléphant, Milanovic) ; inégalités internes en hausse (Stolper-Samuelson, choc chinois).</li>' +
    '<li><b>Protectionnisme</b> : droits de douane, quotas, normes, subventions ; protectionnisme éducateur (List, 1841).</li></ul>' +
    '<h3>Chiffres à citer</h3><ul><li>Commerce mondial 2024 : 24 430 milliards $ de marchandises, 8 690 milliards $ de services ; Chine 3 580 milliards $ (OMC).</li><li>France 2025 : solde des biens −69,2 milliards € (Douane).</li></ul>',

  bac: [
    { type: "Savoir-faire", origine: "Exercice du site (exemple de Ricardo)", t: "Calculer des avantages comparatifs", enonce:
      '<p>Pour produire une unité de drap, il faut 100 heures en Angleterre et 90 au Portugal ; pour une unité de vin, 120 heures en Angleterre et 80 au Portugal.</p><ol><li>Quel pays a un avantage absolu dans chaque bien ?</li><li>Calcule le coût d’opportunité du vin dans chaque pays et déduis-en les avantages comparatifs.</li><li>Montre que la spécialisation augmente la production totale.</li></ol>',
      corrige: '<ol><li>Le Portugal a un avantage absolu dans les deux biens (90 h < 100 h ; 80 h < 120 h).</li><li>Coût d’opportunité du vin = heures pour le vin ÷ heures pour le drap. Angleterre : 120 ÷ 100 = 1,2 unité de drap ; Portugal : 80 ÷ 90 ≈ 0,89. Le vin coûte relativement moins cher au Portugal : avantage comparatif du Portugal en vin, de l’Angleterre en drap.</li><li>Sans échange (une unité de chaque) : 2 draps et 2 vins. Spécialisés : l’Angleterre produit 220 ÷ 100 = 2,2 draps ; le Portugal 170 ÷ 80 = 2,125 vins. La production totale augmente de 0,2 drap et 0,125 vin avec le même travail.</li></ol>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet inventé pour le site", t: "Présentez deux effets du commerce international sur les inégalités.", enonce: "<p>3,5 points, sans document.</p>",
      methode: "<p>« Deux effets » : deux paragraphes nettement séparés. Ici, le plus clair est de distinguer inégalités <b>entre</b> pays (baisse) et <b>au sein</b> des pays (hausse).</p>",
      corrige: '<div class="copie"><p>Le commerce international, échange de biens et de services entre pays, a des effets opposés sur les inégalités selon l’échelle retenue.</p><p>D’une part, il réduit les inégalités entre pays. En s’ouvrant et en s’intégrant aux chaînes de valeur mondiales, des pays émergents ont exploité leurs avantages comparatifs, attiré des investissements étrangers et accéléré leur croissance, ce qui leur a permis de rattraper une partie de leur retard. La Chine, entrée à l’OMC en 2001, est devenue le premier exportateur mondial de marchandises (3 580 milliards de dollars en 2024 selon l’OMC). Milanovic montre que de 1988 à 2008 les classes moyennes des pays émergents ont parmi les plus forts gains de revenu au monde.</p><p>D’autre part, il peut accroître les inégalités au sein des pays riches. Selon le théorème de Stolper-Samuelson, l’ouverture nuit au facteur relativement rare, ici le travail peu qualifié : les importations de biens intensifs en travail peu qualifié et les délocalisations réduisent la demande de ce travail, donc son emploi et son salaire relatif, tandis que les qualifiés des secteurs exportateurs gagnent. Autor, Dorn et Hanson ont ainsi montré que les zones américaines les plus exposées aux importations chinoises ont perdu durablement des emplois industriels.</p></div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice du site, données Xing et Detert (2010)", t: "La chaîne de valeur de l’iPhone", enonce:
      '<p>Document : le graphique « Qui produit la valeur d’un iPhone 3G ? » dans <a href="#e2:e2-5">le cours</a> (coût total 178,96 $ ; composants achetés aux fournisseurs 172,46 $ ; assemblage en Chine 6,50 $).</p><ol><li>Calculez la part de l’assemblage chinois dans le coût de fabrication.</li><li>À l’aide du document et de vos connaissances, montrez que la production de l’iPhone illustre l’internationalisation de la chaîne de valeur.</li></ol>',
      corrige: '<ol><li>6,50 ÷ 178,96 × 100 ≈ 3,6 %. Selon Xing et Detert (2010), d’après iSuppli, l’assemblage en Chine représente environ 3,6 % du coût de fabrication d’un iPhone 3G en 2009 ; les composants, 96,4 %.</li><li>L’internationalisation de la chaîne de valeur consiste à répartir les étapes de production entre plusieurs pays. Pour l’iPhone, la conception est américaine (Apple), les composants (172,46 $ sur 178,96 $) viennent de fournisseurs de plusieurs pays (Japon, Allemagne, Corée du Sud, États-Unis), et l’assemblage final, intensif en main-d’œuvre, est réalisé en Chine, où ce travail est abondant et relativement bon marché. Chaque étape est placée là où elle est la plus rentable : on retrouve la logique des avantages comparatifs, appliquée non plus à des produits mais à des tâches. Les composants franchissent plusieurs frontières avant l’assemblage. Enfin, le commerce mesuré en valeur brute attribue tout l’appareil à la Chine, alors que sa valeur ajoutée y est faible : d’où l’intérêt du commerce en valeur ajoutée.</li></ol>' },
    { type: "Partie 3 · Raisonnement sur dossier", origine: "Sujet officiel : bac 2026, jour 1 (France), partie 3 · corrigé du site", officiel: true, t: "Montrez que la productivité des firmes sous-tend la compétitivité d’un pays, c’est-à-dire son aptitude à exporter.", enonce:
      '<p>Les documents du sujet officiel ne sont pas reproduits ici : entraîne-toi avec ceux du cours (solde commercial 2025, aéronautique, iPhone) et tes connaissances.</p>',
      corrige: '<p><b>Introduction.</b> La productivité mesure l’efficacité de la production (production par unité de facteur). La compétitivité d’un pays est son aptitude à exporter, c’est-à-dire à gagner des parts de marché face à la concurrence étrangère. On montrera que des firmes plus productives rendent le pays plus compétitif par les prix, puis hors prix, et que les exportations d’un pays reposent sur ses firmes les plus productives.</p><p><b>I. La productivité améliore la compétitivité-prix.</b> Hausse de productivité → baisse du coût salarial unitaire → les firmes peuvent baisser leurs prix à l’exportation sans réduire leurs marges → parts de marché. Un salaire élevé n’est pas un handicap si la productivité l’est aussi.</p><p><b>II. La productivité finance la compétitivité hors-prix.</b> Des coûts plus bas dégagent des marges → investissement en R&D, qualité, marque, service → produits différenciés, moins sensibles au prix (différenciation verticale). Exemple : aéronautique et pharmacie portent l’amélioration du solde des biens de la France en 2025 (Douane).</p><p><b>III. Les exportations reposent sur les firmes les plus productives.</b> Melitz : exporter a des coûts fixes ; seules les firmes les plus productives exportent ; l’ouverture les fait grandir et élève la productivité moyenne. La compétitivité d’un pays est donc d’abord celle d’une minorité de grandes firmes très productives.</p><p><b>Conclusion.</b> La productivité des firmes est le socle de la compétitivité du pays, par les prix comme hors prix ; elle dépend elle-même de l’innovation et du capital humain (<a href="#e1:e1-3">É1</a>).</p>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet inventé pour le site", t: "Le protectionnisme peut-il être une réponse efficace aux effets du commerce international ?", enonce: "<p>Construis la problématique et le plan, puis compare.</p>",
      corrige: '<p><b>Problématique.</b> Le commerce international procure des gains moyens mais fait des perdants. Taxer les importations permet-il de corriger ces effets sans détruire les gains de l’échange ?</p><p><b>I. Le protectionnisme peut répondre à certains effets du commerce</b><br>A. Protéger les secteurs et territoires exposés (choc chinois ; Stolper-Samuelson).<br>B. Laisser le temps à des industries naissantes ou stratégiques de devenir compétitives (List ; Corée du Sud).<br>C. Réduire la dépendance de chaînes de valeur trop longues (pénuries de 2020-2021).</p><p><b>II. Mais il est souvent inefficace, voire contre-productif</b><br>A. Il renchérit les biens importés : perte de pouvoir d’achat et hausse des coûts des entreprises utilisatrices de composants importés.<br>B. Il provoque des représailles : années 1930 (Smoot-Hawley) ; tensions commerciales de 2025.<br>C. Il protège des firmes peu productives et freine l’innovation (Melitz).</p><p><b>III. D’autres réponses peuvent être plus efficaces</b><br>A. Accompagner les perdants : formation, reconversion, aides territoriales.<br>B. Redistribuer une partie des gains de l’échange (fiscalité, protection sociale).<br>C. Réguler l’échange plutôt que le fermer : normes sociales et environnementales, ajustement carbone aux frontières, protection ciblée et temporaire.</p>' }
  ]
};

  notions: ["espace social", "structure sociale", "hiérarchisation", "catégorie socioprofessionnelle (PCS)", "niveau de vie", "diplôme", "ménage", "cycle de vie", "salarisation", "tertiarisation", "qualification", "féminisation", "classe sociale", "classe en soi / classe pour soi", "conscience de classe", "rapports de production", "stratification sociale", "groupe de statut", "moyennisation", "distances inter-classes / intra-classes", "rapports sociaux de genre", "identification subjective", "individualisation"],
  sections: [
    { id: "s1-1", t: "Un espace social structuré par de multiples facteurs", h:
      '<p class="lede">Les sociologues parlent d’<b>espace social</b> : les individus y occupent des positions différentes, plus ou moins proches et plus ou moins élevées. Cet espace est <b>structuré</b> (il existe des groupes qui se ressemblent) et <b>hiérarchisé</b> (ces positions donnent un accès inégal aux ressources : revenu, pouvoir, prestige).</p>' +
      '<p>Le programme cite sept facteurs.</p>' +
      '<h3>1. La catégorie socioprofessionnelle</h3><p>La profession résume beaucoup : revenu, diplôme, conditions de travail, mode de vie. C’est pourquoi l’Insee classe la population en PCS (section suivante).</p>' +
      '<h3>2. Le revenu</h3>' +
      '<div data-graph="s1-niveau"></div>' +
      '<p>En 2024, la moitié de la population vit avec moins de 26 740 euros par an et par unité de consommation (2 228 euros par mois pour une personne seule). Le seuil des 10 % les plus aisés est 3,48 fois plus élevé que le plafond des 10 % les plus modestes. Le taux de pauvreté atteint 15,4 % (9,8 millions de personnes), son plus haut niveau depuis 1996, et l’indice de Gini (0,302) est au plus haut depuis le début de la série (Insee). Le <b>patrimoine</b> est encore plus inégalement réparti que le revenu.</p>' +
      '<h3>3. Le diplôme</h3><p>Il conditionne l’accès aux emplois qualifiés, le salaire, le risque de chômage, et aussi les pratiques culturelles et la participation politique. Il est lui-même lié à l’origine sociale (question <a href="#s2">S2</a>).</p>' +
      '<h3>4. La composition du ménage</h3><p>Vivre seul, en couple, avec ou sans enfants change le niveau de vie (qui se calcule par unité de consommation). Les <b>familles monoparentales</b>, le plus souvent une mère avec ses enfants, sont avec les chômeurs les plus touchées par la pauvreté (Insee, 2024).</p>' +
      '<h3>5. La position dans le cycle de vie</h3><p>À diplôme égal, on gagne plus en milieu de carrière qu’au début ; le patrimoine s’accumule avec l’âge. Les jeunes cumulent emplois précaires et faible patrimoine. En 2024, le taux de pauvreté des retraités revient au niveau de celui des actifs (10,4 %).</p>' +
      '<h3>6. Le sexe</h3><p>Femmes et hommes n’occupent pas les mêmes positions : en 2024, 38,8 % des femmes en emploi sont employées contre 11,6 % des hommes, et 28,2 % des hommes sont ouvriers contre 7,2 % des femmes (Insee). Les femmes sont plus souvent à temps partiel et moins rémunérées.</p>' +
      '<h3>7. Le lieu de résidence</h3><p>Grandes métropoles, villes moyennes, espaces ruraux, quartiers prioritaires ou « beaux quartiers » : le territoire concentre les ressources (emplois qualifiés, grandes écoles, services) et façonne les fréquentations. Michel Pinçon et Monique Pinçon-Charlot ont montré comment la grande bourgeoisie entretient son entre-soi dans quelques quartiers et communes.</p>' +
      '<div class="attn"><p>Ces facteurs se <b>cumulent</b> et se renforcent : un diplôme élevé donne accès à un emploi de cadre, donc à un revenu élevé, qui permet d’habiter un quartier favorisé, où les enfants fréquentent des établissements réputés. C’est ce qu’a demandé le sujet du bac 2026 (jour 2, partie 3) : montrer que le revenu et le diplôme ne sont pas les seuls facteurs qui structurent et hiérarchisent l’espace social.</p></div>' },

    { id: "s1-2", t: "Les PCS, l’outil de l’Insee", h:
      '<div class="def"><b>Professions et catégories socioprofessionnelles (PCS)</b> — nomenclature de l’Insee qui classe la population selon la profession actuelle (ou l’ancienne), le statut (salarié ou non), la qualification, la taille de l’entreprise pour les indépendants et la nature de l’employeur (public ou privé) pour les salariés.</div>' +
      '<p>Créée en 1954 sous le nom de CSP, refondue en 1982 (PCS), rénovée en 2003 puis en 2020 (PCS 2020), elle regroupe des personnes à la situation sociale proche, qui ont souvent des comportements semblables. Au niveau le plus agrégé, six groupes pour les personnes en emploi :</p>' +
      '<div class="tbl"><table><thead><tr><th>Groupe socioprofessionnel</th><th class="n">Part de l’emploi en 2024</th></tr></thead><tbody>' +
      '<tr><td>1. Agriculteurs exploitants</td><td class="n">1,3 %</td></tr><tr><td>2. Artisans, commerçants et chefs d’entreprise</td><td class="n">6,8 %</td></tr><tr><td>3. Cadres et professions intellectuelles supérieures</td><td class="n">23,0 %</td></tr><tr><td>4. Professions intermédiaires</td><td class="n">25,2 %</td></tr><tr><td>5. Employés</td><td class="n">24,8 %</td></tr><tr><td>6. Ouvriers</td><td class="n">18,0 %</td></tr><tr><td><i>Non renseigné</i></td><td class="n">0,9 %</td></tr></tbody></table></div>' +
      '<p class="src-l">Source : Insee, enquête Emploi 2024.</p>' +
      '<p>La PCS 2020 propose aussi une <b>PCS Ménage</b>, qui classe les ménages d’après la profession de leurs membres : une manière de tenir compte du fait que la position sociale se joue souvent au niveau du couple.</p>' +
      '<div class="attn"><p>Les PCS ne sont pas des classes sociales. Elles sont construites pour la statistique, sans hypothèse sur la conscience ou les conflits de groupes. Mais elles servent à vérifier si des classes existent : les écarts de revenu, de diplôme ou de pratiques entre PCS sont-ils grands et durables ?</p></div>' },

    { id: "s1-3", t: "Les grandes évolutions depuis 1950", h:
      '<div data-graph="s1-pcs"></div>' +
      '<p>Le graphique résume quarante ans de transformations : les ouvriers passent de 29,9 % à 18,0 % de l’emploi, les agriculteurs de 7,5 % à 1,3 %, tandis que les cadres passent de 8,0 % à 23,0 %. En 2024, pour la première fois depuis 1982, les professions intermédiaires dépassent les employés (Insee). Quatre évolutions sont au programme.</p>' +
      '<h3>1. La salarisation</h3><p>La part des salariés dans l’emploi a fortement augmenté depuis les années 1950 avec le recul des agriculteurs exploitants et des petits commerçants et artisans. En 2024, 86,7 % des personnes en emploi sont salariées, dont 72,9 % en CDI ou fonctionnaires. On observe toutefois un léger regain des indépendants (13,3 %, plus haut niveau depuis 1999), porté par les micro-entrepreneurs (3,6 % de l’emploi) : plateformes de livraison, VTC, services.</p>' +
      '<h3>2. La tertiarisation</h3><p>En 2024, le tertiaire (commerce, transports, santé, éducation, administration, services aux entreprises) rassemble 76,6 % des emplois, contre 12,6 % pour l’industrie, 6,6 % pour la construction et 2,3 % pour l’agriculture (Insee). Ce mouvement concerne surtout les femmes : 87,0 % d’entre elles travaillent dans le tertiaire.</p>' +
      '<div data-chain="s1-tert"></div>' +
      '<h3>3. L’élévation du niveau de qualification</h3><p>Les cadres et professions intermédiaires représentent 48,1 % des personnes en emploi en 2024 (Insee). Les emplois d’ouvriers non qualifiés reculent avec l’automatisation et les délocalisations.</p>' +
      '<div data-chain="s1-qualif"></div>' +
      '<h3>4. La féminisation des emplois</h3><p>Les femmes représentent 48,8 % des personnes en emploi en 2024 (14,2 millions sur 29,0 millions). Leur taux d’emploi (66,2 % chez les 15-64 ans) reste inférieur à celui des hommes (71,5 %). Leur entrée massive dans l’emploi depuis les années 1960 s’explique par l’allongement de leurs études, la tertiarisation, la maîtrise de la fécondité et l’évolution des normes. Mais les emplois restent <b>genrés</b> :</p>' +
      '<div data-graph="s1-sexe"></div>' +
      '<p>Lecture : en 2024, 38,8 % des femmes en emploi sont employées (aides à domicile, secrétaires, agentes d’entretien, vendeuses), contre 11,6 % des hommes. La part des cadres progresse chez les femmes, mais reste plus faible que chez les hommes (20,4 % contre 25,4 %).</p>' },

    { id: "s1-4", t: "Les classes sociales : Marx et Weber", h:
      '<div class="def"><b>Classe sociale</b> — grand groupe d’individus qui partagent une position comparable dans la hiérarchie sociale (revenus, patrimoine, pouvoir, prestige) et, selon les approches, des intérêts, un mode de vie et une conscience communs.</div>' +
      '<div class="aut"><span class="mono">KM</span><span class="an">Karl Marx<small>1818-1883</small></span><span class="ad">Les classes se définissent par leur place dans les <b>rapports de production</b> : la <b>bourgeoisie</b> possède les moyens de production, le <b>prolétariat</b> n’a que sa force de travail à vendre. La société capitaliste tend à se <b>bipolariser</b> entre ces deux classes, dont les intérêts sont opposés.</span></div>' +
      '<div data-chain="s1-marx"></div>' +
      '<p>Pour Marx, une classe n’existe pleinement que si elle est à la fois <b>classe en soi</b> (une position objective commune) et <b>classe pour soi</b> (une conscience de ses intérêts et une mobilisation collective). C’est une approche <b>réaliste</b> : les classes existent réellement et sont en conflit (lutte des classes), moteur de l’histoire (<i>Manifeste du parti communiste</i>, avec Engels, 1848).</p>' +
      '<div class="aut"><span class="mono">MW</span><span class="an">Max Weber<small>1864-1920</small></span><span class="ad">La hiérarchie sociale a <b>trois dimensions</b> indépendantes : l’ordre <b>économique</b> (les <b>classes</b>, définies par les chances d’accès aux biens et aux revenus sur le marché), l’ordre <b>social</b> (les <b>groupes de statut</b>, définis par le prestige et l’honneur social, qui se traduisent par des styles de vie) et l’ordre <b>politique</b> (les <b>partis</b>, qui visent le pouvoir). <i>Économie et société</i>, 1922.</span></div>' +
      '<div class="tbl"><table><thead><tr><th></th><th>Marx</th><th>Weber</th></tr></thead><tbody>' +
      '<tr><td><b>Critère</b></td><td>Place dans les rapports de production</td><td>Trois ordres : économique, social, politique</td></tr>' +
      '<tr><td><b>Approche</b></td><td>Réaliste : les classes existent et s’opposent</td><td>Nominaliste : les classes sont des regroupements construits par le chercheur</td></tr>' +
      '<tr><td><b>Conscience</b></td><td>Indispensable (classe pour soi)</td><td>Pas nécessaire ; les classes ne sont pas forcément des communautés</td></tr>' +
      '<tr><td><b>Relations</b></td><td>Conflit, lutte des classes</td><td>Hiérarchie graduée : <b>stratification</b></td></tr>' +
      '</tbody></table></div>' +
      '<div class="ex"><p>Un professeur des écoles a un revenu moyen (ordre économique) mais un prestige plutôt élevé (ordre social) ; un commerçant aisé peut avoir un revenu supérieur et moins de prestige. Weber permet de penser ces décalages, que l’approche de Marx, centrée sur la propriété, laisse de côté.</p></div>' +
      '<div class="aut"><span class="mono">PB</span><span class="an">Pierre Bourdieu<small>1930-2002</small></span><span class="ad">Synthèse des deux traditions : l’espace social se lit selon le <b>volume</b> global de capital et sa <b>structure</b> (part du capital économique et du capital culturel). Les classes se distinguent aussi par leurs goûts et styles de vie (<i>La Distinction</i>, 1979).</span></div>' },

    { id: "s1-5", t: "Les classes sociales sont-elles encore pertinentes ?", h:
      '<p class="lede">Le programme cite quatre terrains de débat. Pour chacun, il faut connaître les arguments des deux côtés.</p>' +
      '<h3>1. Les distances entre classes (inter-classes)</h3>' +
      '<div class="aut"><span class="mono">HM</span><span class="an">Henri Mendras<small>1927-2003</small></span><span class="ad"><i>La Seconde Révolution française 1965-1984</i> (1988) : la hausse des revenus, la diffusion de la consommation de masse et la croissance des professions intermédiaires font émerger une vaste <b>constellation centrale</b>. La société prend la forme d’une <b>toupie</b> : c’est la <b>moyennisation</b>.</span></div>' +
      '<p>Mais d’autres constats montrent que les écarts ne disparaissent pas : les inégalités de niveau de vie atteignent en 2024 leur plus haut niveau depuis le début des séries en 1996 (Insee) ; le patrimoine est très concentré ; les écarts de réussite scolaire et d’accès aux grandes écoles restent forts.</p>' +
      '<div class="aut"><span class="mono">LC</span><span class="an">Louis Chauvel<small>né en 1967</small></span><span class="ad">« Le retour des classes sociales ? » (2001) : depuis les années 1980, la réduction des inégalités s’est arrêtée. Il parle de « <b>classes sans conscience</b> » : les écarts objectifs persistent, mais la conscience de classe s’est affaiblie.</span></div>' +
      '<h3>2. Les distances au sein des classes (intra-classes)</h3>' +
      '<p>Les grands groupes sont devenus <b>hétérogènes</b>. Les ouvriers ne sont plus surtout des hommes de la grande industrie : beaucoup travaillent dans la logistique, le transport, l’entretien. Les employés se divisent entre qualifiés et peu qualifiés (en 2024, 17,0 % des femmes en emploi sont employées peu qualifiées). Les cadres du public et ceux du privé n’ont ni les mêmes revenus ni les mêmes votes. Cette hétérogénéité affaiblit l’unité de chaque classe. À l’inverse, on peut regrouper ouvriers et employés en <b>classes populaires</b> : 42,8 % des personnes en emploi en 2024 (Insee), dont les conditions de vie restent proches.</p>' +
      '<h3>3. L’articulation avec les rapports sociaux de genre</h3>' +
      '<p>Raisonner seulement en classes oublie que les femmes et les hommes d’une même classe n’ont pas la même position : écarts de salaires, temps partiel, tâches domestiques, plafond de verre. La position sociale d’une femme a longtemps été mesurée par celle de son conjoint. Les rapports de genre <b>se combinent</b> aux rapports de classe : une ouvrière cumule deux formes de domination.</p>' +
      '<div class="plus"><p>La juriste Kimberlé Crenshaw a proposé en 1989 la notion d’<b>intersectionnalité</b> pour penser le croisement des rapports de classe, de genre et de race.</p></div>' +
      '<h3>4. Les identifications subjectives et l’individualisation</h3>' +
      '<p>Peu de personnes se disent aujourd’hui « ouvrier » ou « bourgeois » ; beaucoup se rangent dans une vaste « classe moyenne ». Les organisations qui portaient la conscience de classe ont reculé : environ un salarié sur dix est syndiqué en France (Dares, 2019).</p>' +
      '<div data-chain="s1-indiv"></div>' +
      '<div class="aut"><span class="mono">UB</span><span class="an">Ulrich Beck<small>1944-2015</small></span><span class="ad"><i>La Société du risque</i> (1986) : l’individu doit construire lui-même sa trajectoire ; les appartenances collectives, dont la classe, perdent de leur force.</span></div>' +
      '<p>À l’inverse, Michel Pinçon et Monique Pinçon-Charlot voient dans la <b>grande bourgeoisie</b> une classe encore pleinement « en soi et pour soi » : patrimoine transmis, réseaux, entre-soi résidentiel et scolaire, défense collective de ses intérêts.</p>' +
      '<div class="cle"><p><b>Conclusion à retenir :</b> les classes sociales au sens de Marx (conscience et lutte) sont moins visibles ; mais des écarts objectifs durables, cumulatifs et transmis entre générations existent toujours. D’où des positions intermédiaires : « classes sans conscience » (Chauvel), ou analyse multidimensionnelle de l’espace social (Weber, Bourdieu).</p></div>' }
  ],

  bac: [
    { type: "Savoir-faire", origine: "Exercice du site, données Insee", t: "Lire l’évolution des PCS", enonce: '<p>D’après l’Insee, la part des ouvriers dans l’emploi est de 29,9 % en 1982 et de 18,0 % en 2024 ; celle des cadres de 8,0 % et de 23,0 %.</p><ol><li>Calcule l’écart en points pour chaque catégorie.</li><li>Calcule le coefficient multiplicateur de la part des cadres.</li><li>Rédige une phrase de lecture pour 2024.</li></ol>',
      corrige: '<ol><li>Ouvriers : 18,0 − 29,9 = −11,9 points. Cadres : 23,0 − 8,0 = +15,0 points.</li><li>23,0 ÷ 8,0 ≈ 2,9 : la part des cadres a presque triplé.</li><li>« Selon l’Insee, en 2024, en France, 23,0 % des personnes en emploi sont cadres. »</li></ol>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet inventé pour le site", t: "Distinguez l’analyse des classes sociales de Marx et celle de Weber.", enonce: "<p>3,5 points, sans document.</p>",
      corrige: '<div class="copie"><p>Une classe sociale est un grand groupe d’individus qui occupent une position comparable dans la hiérarchie sociale. Marx et Weber en proposent deux analyses différentes.</p><p>Pour Marx, les classes se définissent par un critère unique : la place dans les rapports de production. La bourgeoisie possède les moyens de production, le prolétariat ne possède que sa force de travail, qu’il vend contre un salaire. La bourgeoisie s’approprie la plus-value : c’est l’exploitation. Les deux classes ont des intérêts opposés et entrent en conflit. Une classe n’existe pleinement que si elle passe de « classe en soi » (position commune) à « classe pour soi » (conscience et mobilisation) : l’approche est réaliste et conflictuelle.</p><p>Weber, au contraire, distingue trois dimensions de la hiérarchie sociale : l’ordre économique, où les classes se définissent par les chances d’accès aux biens et aux revenus ; l’ordre social, où les groupes de statut se définissent par le prestige ; l’ordre politique, où les partis visent le pouvoir. Ces dimensions ne coïncident pas toujours : un enseignant a plus de prestige que de revenu. L’approche est nominaliste : les classes sont des catégories construites par le sociologue, sans conscience ni conflit nécessaires. Elle conduit à une vision en termes de stratification.</p></div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice du site, document Insee", t: "Femmes, hommes et catégories socioprofessionnelles", enonce:
      '<p>Document : le graphique « Femmes et hommes en emploi selon la catégorie socioprofessionnelle, 2024 » (Insee) dans <a href="#s1:s1-3">le cours</a>.</p><ol><li>Comparez la part des employés parmi les femmes et parmi les hommes en emploi.</li><li>À l’aide du document et de vos connaissances, montrez que le sexe est un facteur de structuration de l’espace social.</li></ol>',
      corrige: '<ol><li>Selon l’Insee, en France en 2024, 38,8 % des femmes en emploi sont employées, contre 11,6 % des hommes en emploi : la proportion est 3,3 fois plus élevée chez les femmes (27,2 points d’écart).</li><li>Le sexe structure l’espace social car femmes et hommes n’occupent pas les mêmes positions. Le document montre une forte <b>ségrégation professionnelle</b> : les femmes sont concentrées dans les emplois d’employées (38,8 %) et les professions intermédiaires (27,3 %, santé, enseignement, social), les hommes chez les ouvriers (28,2 % contre 7,2 %). Le sexe <b>hiérarchise</b> aussi : les hommes sont plus souvent cadres (25,4 % contre 20,4 %) et chefs d’entreprise. Ces écarts s’expliquent par une socialisation différenciée qui oriente filles et garçons vers des formations et métiers différents, et par la répartition inégale des tâches domestiques, qui pèse sur les carrières féminines (temps partiel, plafond de verre). Il en résulte des écarts de salaire et de pouvoir.</li></ol>' },
    { type: "Partie 3 · Raisonnement sur dossier", origine: "Sujet officiel : bac 2026, jour 2 (France), partie 3 · corrigé du site", officiel: true, t: "Montrez que le revenu et le diplôme ne sont pas les seuls facteurs qui structurent et hiérarchisent l’espace social.", enonce: '<p>Les documents du sujet officiel ne sont pas reproduits ici : appuie-toi sur les données du cours (catégories selon le sexe, niveau de vie, pauvreté des familles monoparentales).</p>',
      corrige: '<p><b>Introduction.</b> L’espace social est l’ensemble des positions sociales, structuré en groupes et hiérarchisé selon l’accès aux ressources. Le revenu et le diplôme y jouent un rôle central, mais d’autres facteurs interviennent : la profession, le sexe, l’âge et la composition du ménage, le lieu de résidence.</p><p><b>I. La profession et le sexe structurent et hiérarchisent.</b> PCS : conditions de travail, prestige, mode de vie (cadres 23,0 % de l’emploi en 2024). Sexe : femmes employées 38,8 % contre 11,6 % des hommes (Insee) ; écarts de salaire, temps partiel.</p><p><b>II. La composition du ménage et le cycle de vie.</b> Familles monoparentales parmi les plus touchées par la pauvreté (Insee, 2024) ; jeunes plus exposés à la précarité ; patrimoine qui s’accumule avec l’âge.</p><p><b>III. Le lieu de résidence.</b> Concentration des ressources dans les métropoles ; quartiers prioritaires contre beaux quartiers ; entre-soi de la grande bourgeoisie (Pinçon et Pinçon-Charlot) ; effet sur la scolarité et les réseaux.</p><p><b>Conclusion.</b> Ces facteurs se cumulent avec le revenu et le diplôme : l’espace social est multidimensionnel.</p><div class="marge"><b>Piège du sujet :</b> ne pas faire une partie sur le revenu et le diplôme ; le sujet demande les <b>autres</b> facteurs.</div>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet inventé pour le site", t: "Les classes sociales permettent-elles encore de rendre compte de la société française actuelle ?", enonce: "<p>Construis la problématique et le plan, puis compare.</p>",
      corrige: '<p><b>Problématique.</b> La société française a profondément changé depuis les années 1950 (salarisation, tertiarisation, qualification, féminisation). Les classes sociales, définies par Marx ou Weber, décrivent-elles encore une société où les identités semblent plus individuelles, ou faut-il d’autres outils ?</p><p><b>I. Des classes sociales qui restent pertinentes</b><br>A. Des écarts objectifs durables et cumulatifs : niveau de vie (D9/D1 = 3,48 en 2024, Gini au plus haut depuis 1996), patrimoine, diplôme.<br>B. Une reproduction et un entre-soi : grande bourgeoisie « en soi et pour soi » (Pinçon et Pinçon-Charlot) ; classes populaires (42,8 % de l’emploi).<br>C. Des styles de vie qui restent distincts (Bourdieu).</p><p><b>II. Une pertinence remise en cause</b><br>A. Moyennisation (Mendras) et tertiarisation brouillent les frontières.<br>B. Hétérogénéité des classes : ouvriers des services, employés qualifiés ou non.<br>C. Affaiblissement de la conscience de classe et individualisation (Beck ; syndicalisation autour de 10 %).</p><p><b>III. Une analyse à enrichir</b><br>A. Des « classes sans conscience » (Chauvel) : classes en soi sans classes pour soi.<br>B. Articuler classe et genre (intersectionnalité), âge et territoire.<br>C. Une approche multidimensionnelle (Weber, Bourdieu) plutôt qu’une bipolarisation.</p>' }
  ]
};

CH.s2 = {
  chapo: "En 1970, un jeune sur cinq obtenait le bac ; en 2025, quatre sur cinq. L’École s’est ouverte à tous. Mais les enfants de cadres restent plus de huit fois plus nombreux que les enfants d’ouvriers en classes préparatoires. Ce chapitre explique ce que fait l’École, ce qui a changé, et pourquoi la réussite reste inégale.",
  essentiel: [
    "Dans une société démocratique, l’École <b>transmet des savoirs</b>, socialise et vise à favoriser l’<b>égalité des chances</b> : la position sociale doit dépendre du mérite et non de l’origine.",
    "Depuis les années 1950, l’accès à l’école s’est massivement ouvert : 20,1 % d’une génération obtient le bac en 1970, 80,1 % en 2025 (DEPP). C’est la <b>massification</b>.",

  notions: ["École", "socialisation", "égalité des chances", "méritocratie", "taux de scolarisation", "taux d’accès à un diplôme", "massification", "démocratisation (quantitative, qualitative, ségrégative)", "inégalités de réussite scolaire", "capital culturel", "investissements familiaux", "socialisation selon le genre", "stratégies des ménages", "reproduction sociale", "trajectoire individuelle"],
  sections: [
    { id: "s2-1", t: "Ce que fait l’École dans une société démocratique", h:
      '<p class="lede">L’École n’est pas qu’un lieu d’apprentissage : c’est une institution qui façonne les individus et la société.</p>' +
      '<ul><li><b>Transmettre des savoirs</b> : lire, écrire, compter, raisonner, et des connaissances générales et professionnelles.</li><li><b>Socialiser</b> : transmettre les normes et les valeurs communes, former des citoyens. Pour Émile Durkheim, l’éducation est une « socialisation méthodique de la jeune génération » (<i>Éducation et sociologie</i>, 1922).</li><li><b>Qualifier et certifier</b> : délivrer des diplômes reconnus sur le marché du travail.</li><li><b>Favoriser l’égalité des chances</b> : dans une société démocratique, les positions sociales doivent être attribuées selon le <b>mérite</b> (le travail, les talents) et non selon la naissance. C’est l’idéal <b>méritocratique</b>.</li></ul>' +
      '<div class="def"><b>Égalité des chances</b> — situation où chacun, quelle que soit son origine, a la même probabilité d’accéder aux différentes positions sociales. À distinguer de l’égalité des <b>droits</b> (mêmes règles pour tous) et de l’égalité des <b>situations</b> (mêmes résultats).</div>' +
      '<div class="ex"><p>Quelques jalons : lois Ferry de 1881 (gratuité de l’école primaire publique) et de 1882 (instruction obligatoire de 6 à 13 ans, laïcité) ; scolarité obligatoire portée à 16 ans par la réforme Berthoin (1959) ; collège unique (réforme Haby, 1975) ; instruction obligatoire dès 3 ans et obligation de formation de 16 à 18 ans (loi de 2019, appliquée à partir de 2020 pour la formation).</p></div>' },

    { id: "s2-2", t: "Mesurer l’accès à l’École : la massification", h:
      '<div class="def"><b>Taux de scolarisation</b> — part des jeunes d’un âge donné qui sont scolarisés. <b>Taux d’accès à un diplôme</b> (ou à une formation) — part d’une génération qui obtient ce diplôme (ou entre dans cette formation).</div>' +
      '<div data-graph="s2-bac"></div>' +
      '<p>La proportion de bacheliers dans une génération passe de 20,1 % en 1970 à 62,7 % en 1995, puis à 80,1 % en 2025 (DEPP) : elle a gagné 60 points. La hausse est spectaculaire entre 1985 et 1995, après l’objectif fixé en 1985 de mener 80 % d’une génération au niveau du baccalauréat et la création du <b>bac professionnel</b> (premiers diplômés en 1987). Après un palier autour de 62 % de 1995 à 2008, elle repart avec la réforme de la voie professionnelle (bac pro en trois ans, à partir de 2009).</p>' +
      '<div class="def"><b>Massification scolaire</b> — forte hausse du nombre d’élèves et d’étudiants et de l’accès aux niveaux élevés d’enseignement.</div>' +
      '<div data-chain="s2-massif"></div>' +
      '<div class="attn"><p>Taux d’accès et taux de réussite sont différents : le taux de réussite au bac (part des candidats qui l’obtiennent) est bien plus élevé que la proportion de bacheliers dans une génération (part de <b>tous</b> les jeunes du même âge, y compris ceux qui ne se présentent pas).</p></div>' },

    { id: "s2-3", t: "Massification n’est pas démocratisation", h:
      '<div class="def"><b>Démocratisation scolaire</b> — réduction des inégalités d’accès aux diplômes et aux filières selon l’origine sociale. Antoine Prost distingue démocratisation <b>quantitative</b> (tout le monde accède plus loin : c’est la massification) et <b>qualitative</b> (les chances d’accès se rapprochent entre milieux sociaux).</div>' +
      '<p>Les inégalités d’accès au bac se sont réduites : selon la DEPP (2020), l’écart d’accès au bac entre enfants de cadres et enfants d’ouvriers non qualifiés passe de 28 points pour les élèves entrés en sixième en 1995 à 15 points pour ceux entrés en 2007. Mais les écarts se sont <b>déplacés</b> vers les filières.</p>' +
      '<div class="aut"><span class="mono">PM</span><span class="an">Pierre Merle<small>sociologue</small></span><span class="ad">Distingue la démocratisation <b>égalisatrice</b> (les écarts se réduisent), <b>uniforme</b> (tous progressent, écarts stables) et <b>ségrégative</b> (l’accès s’ouvre, mais les enfants des milieux populaires sont orientés vers les filières les moins valorisées).</span></div>' +
      '<div data-graph="s2-filieres"></div>' +
      '<p>En 2023-2024, les enfants de cadres représentent 53,7 % des élèves de classes préparatoires et 64,9 % des élèves des écoles normales supérieures, alors que les cadres représentent 23,0 % des personnes en emploi en 2024. Les enfants d’ouvriers sont 6,4 % en classes préparatoires, mais 21,6 % en sections de technicien supérieur. À l’université, la part des enfants de cadres (34,9 %) est la même qu’en 2009 (Observatoire des inégalités). Le bac s’est ouvert, mais les filières restent hiérarchisées socialement : c’est une démocratisation <b>ségrégative</b>.</p>' +
      '<div class="attn"><p>Comparer la part des enfants de cadres en CPGE à la part des cadres dans l’emploi donne un <b>ordre de grandeur</b> de la surreprésentation, pas une mesure exacte : la population de référence (les parents de jeunes de 20 ans) n’est pas exactement celle des personnes en emploi.</p></div>' },

    { id: "s2-4", t: "Les facteurs d’inégalités de réussite : École et familles", h:
      '<p class="lede">Les inégalités de réussite scolaire selon l’origine sociale sont précoces et cumulatives. En France, l’écart de score en mathématiques entre élèves favorisés et défavorisés (quart supérieur et quart inférieur de l’indice socio-économique) atteint 113 points dans l’enquête PISA 2022, contre 93 en moyenne dans l’OCDE.</p>' +
      '<h3>1. Le rôle de l’École elle-même</h3>' +
      '<p>L’École n’est pas neutre :</p><ul><li><b>Effet établissement et ségrégation scolaire</b> : les élèves de milieux populaires sont concentrés dans certains établissements, où les enseignants sont souvent plus jeunes et changent plus souvent.</li><li><b>Attentes des enseignants</b> : l’« effet Pygmalion » (Rosenthal et Jacobson, 1968) montre que les attentes d’un enseignant envers un élève influencent ses progrès.</li><li><b>Orientation</b> : selon la DEPP, à résultats comparables en fin de troisième (moyenne entre 10 et 12), 91 % des enfants de cadres demandent une seconde générale et technologique, contre 59 % des enfants d’ouvriers non qualifiés.</li><li>Les savoirs et les codes valorisés (implicites, aisance à l’oral) sont plus proches de la culture des familles favorisées.</li></ul>' +
      '<h3>2. Le capital culturel</h3>' +
      '<div class="def"><b>Capital culturel</b> — ensemble des ressources culturelles d’un individu : connaissances, langage, goûts, diplômes, biens culturels. Pour Bourdieu, il existe à l’état <b>incorporé</b> (savoirs, manières de parler), <b>objectivé</b> (livres, instruments) et <b>institutionnalisé</b> (diplômes).</div>' +
      '<div class="aut"><span class="mono">BP</span><span class="an">Pierre Bourdieu et Jean-Claude Passeron<small><i>Les Héritiers</i>, 1964 ; <i>La Reproduction</i>, 1970</small></span><span class="ad">L’École évalue des compétences que certains élèves ont reçues dans leur famille. Ces « héritiers » réussissent, et leur réussite passe pour du talent : l’École légitime ainsi la reproduction des positions sociales.</span></div>' +
      '<div data-chain="s2-bourdieu"></div>' +
      '<h3>3. Les investissements familiaux</h3>' +
      '<p>Au-delà de ce qui se transmet sans y penser, les familles <b>investissent</b> : temps passé à aider aux devoirs, cours particuliers, activités culturelles et sportives, séjours linguistiques, connaissance des filières et de Parcoursup. Ces investissements demandent du temps, de l’argent et de l’information, inégalement répartis.</p>' +
      '<div class="aut"><span class="mono">BL</span><span class="an">Bernard Lahire<small><i>Tableaux de familles</i>, 1995</small></span><span class="ad">En étudiant des familles populaires, il montre que la transmission n’est jamais automatique : des <b>configurations familiales</b> (régularité, autorité, place de l’écrit, attention portée à la scolarité) expliquent des <b>réussites « paradoxales »</b> et, à l’inverse, des échecs en milieu favorisé.</span></div>' },

    { id: "s2-5", t: "Genre et stratégies des ménages", h:
      '<h3>4. La socialisation selon le genre</h3>' +
      '<div data-graph="s2-sexe"></div>' +
      '<p>En 2025, 85,4 % des filles d’une génération obtiennent le bac, contre 75,1 % des garçons ; l’écart est encore plus net pour le bac général (49,9 % contre 37,0 %), tandis que les garçons sont plus nombreux en bac professionnel (DEPP). Pourtant, les filles restent minoritaires dans les formations d’ingénieurs, le numérique et les classes préparatoires scientifiques.</p>' +
      '<div class="aut"><span class="mono">BE</span><span class="an">Christian Baudelot et Roger Establet<small><i>Allez les filles !</i>, 1992</small></span><span class="ad">Les filles ont dépassé les garçons dans la réussite scolaire, mais leurs choix d’orientation restent moins tournés vers les filières scientifiques et les plus rentables.</span></div>' +
      '<div data-chain="s2-genre"></div>' +
      '<p>Marie Duru-Bellat (<i>L’École des filles</i>, 1990) explique ces choix par une socialisation différenciée et par l’anticipation des rôles futurs. L’École participe aussi, souvent sans le vouloir, à ces écarts (attentes, conseils d’orientation, manuels).</p>' +
      '<h3>5. Les stratégies des ménages</h3>' +
      '<div class="aut"><span class="mono">RB</span><span class="an">Raymond Boudon<small><i>L’Inégalité des chances</i>, 1973</small></span><span class="ad">Approche par l’<b>individualisme méthodologique</b> : les inégalités résultent de l’agrégation de choix rationnels de familles qui, à chaque palier, comparent coûts, avantages et risques selon leur position sociale.</span></div>' +
      '<div data-chain="s2-boudon"></div>' +
      '<p>Les familles les mieux informées développent aussi des <b>stratégies</b> : choix de l’établissement (privé, contournement de la carte scolaire), options rares, classes à horaires aménagés. Agnès van Zanten (<i>Choisir son école</i>, 2009) montre que ces stratégies des classes moyennes et supérieures renforcent la ségrégation entre établissements. Une note de la DEPP montre de même que le choix du latin au collège est lié à l’origine sociale.</p>' +
      '<div class="cle"><p><b>À retenir :</b> aucun facteur n’explique seul les inégalités. Ils se cumulent et se combinent dans des <b>trajectoires individuelles</b> : un même capital culturel, des stratégies différentes, une configuration familiale particulière ou un enseignant décisif peuvent produire des parcours très différents.</p></div>' }
  ],
  pieges: [
    { f: "« La massification a démocratisé l’École. »", v: "La massification (plus d’élèves plus loin) ne garantit pas la démocratisation (réduction des écarts selon l’origine). Les inégalités se sont déplacées vers les filières : démocratisation ségrégative." },

  retenir:
    '<h3>Définitions</h3><ul>' +
    '<li><b>Fonctions de l’École</b> : transmettre des savoirs, socialiser (Durkheim), qualifier, favoriser l’égalité des chances (méritocratie).</li>' +
    '<li><b>Taux de scolarisation</b> ; <b>taux d’accès à un diplôme</b> (proportion de bacheliers dans une génération : 20,1 % en 1970, 62,7 % en 1995, 80,1 % en 2025).</li>' +
    '<li><b>Massification</b> : hausse du nombre d’élèves et de l’accès. <b>Démocratisation</b> : réduction des écarts selon l’origine ; quantitative / qualitative (Prost) ; égalisatrice, uniforme, <b>ségrégative</b> (Merle).</li>' +
    '<li><b>Rôle de l’École</b> : ségrégation, attentes (effet Pygmalion), orientation, codes implicites.</li>' +
    '<li><b>Capital culturel</b> (incorporé, objectivé, institutionnalisé) ; héritiers et reproduction (Bourdieu et Passeron, 1964 et 1970).</li>' +
    '<li><b>Investissements familiaux</b> ; configurations familiales et réussites paradoxales (Lahire, 1995).</li>' +
    '<li><b>Socialisation de genre</b> : filles meilleures au bac, moins en sciences (Baudelot et Establet ; Duru-Bellat).</li>' +
    '<li><b>Stratégies des ménages</b> : coûts / avantages / risques, effet d’agrégation (Boudon, 1973) ; choix d’établissement (van Zanten).</li></ul>' +
    '<h3>Chiffres à citer</h3><ul><li>CPGE 2023-2024 : 53,7 % d’enfants de cadres, 6,4 % d’enfants d’ouvriers (Observatoire des inégalités, d’après le ministère).</li><li>PISA 2022 : 113 points d’écart favorisés / défavorisés en maths (OCDE : 93).</li><li>Bac 2025 : filles 85,4 %, garçons 75,1 % d’une génération (DEPP).</li></ul>',

  bac: [
    { type: "Savoir-faire", origine: "Exercice du site, données DEPP", t: "Mesurer la massification", enonce: '<p>Proportion de bacheliers dans une génération (DEPP) : 1970 : 20,1 % ; 1985 : 29,4 % ; 1995 : 62,7 % ; 2025 : 80,1 %.</p><ol><li>Calcule l’indice de 2025, base 100 en 1970.</li><li>Compare les hausses de 1970-1985 et de 1985-1995 en points.</li><li>Pourquoi ces chiffres ne suffisent-ils pas à conclure à une démocratisation ?</li></ol>',
      corrige: '<ol><li>80,1 ÷ 20,1 × 100 ≈ 398,5 : la proportion a presque quadruplé.</li><li>1970-1985 : +9,3 points en 15 ans ; 1985-1995 : +33,3 points en 10 ans. La massification s’accélère fortement après 1985 (objectif de 80 % au niveau du bac, bac professionnel).</li><li>Ils mesurent l’accès de l’ensemble d’une génération (massification), pas les écarts entre milieux sociaux ni la répartition dans les filières. Il faudrait comparer les taux d’accès des enfants de cadres et d’ouvriers, et leur présence dans les filières sélectives.</li></ol>' },
    { type: "Partie 1 · Mobilisation des connaissances", origine: "Sujet inventé pour le site", t: "Montrez que la massification scolaire ne s’est pas accompagnée d’une démocratisation complète.", enonce: "<p>3,5 points, sans document. Rappel : cette question n’est pas évaluée à l’écrit en 2027 ; l’exercice entraîne la méthode.</p>",
      corrige: '<div class="copie"><p>La massification scolaire est la forte hausse de l’accès aux niveaux élevés d’enseignement : la proportion de bacheliers dans une génération passe de 20,1 % en 1970 à 80,1 % en 2025 selon la DEPP. La démocratisation est la réduction des inégalités d’accès selon l’origine sociale. La première n’a entraîné la seconde que partiellement.</p><p>D’abord, les écarts d’accès au bac se sont réduits mais n’ont pas disparu : selon la DEPP, l’écart entre enfants de cadres et d’ouvriers non qualifiés atteint encore 15 points pour les élèves entrés en sixième en 2007.</p><p>Surtout, les inégalités se sont déplacées vers les filières : c’est la démocratisation ségrégative décrite par Pierre Merle. Les enfants de milieux populaires accèdent davantage au bac, mais plus souvent au bac professionnel et aux formations courtes, tandis que les enfants de cadres dominent les filières sélectives. En 2023-2024, ils représentent 53,7 % des élèves de classes préparatoires, contre 6,4 % pour les enfants d’ouvriers, qui sont en revanche 21,6 % en sections de technicien supérieur (Observatoire des inégalités, d’après le ministère). Ces écarts s’expliquent notamment par le capital culturel et par les stratégies d’orientation des familles.</p></div>' },
    { type: "Partie 2 · Étude d’un document", origine: "Exercice du site, données ministère / Observatoire des inégalités", t: "Origine sociale et filières du supérieur", enonce: '<p>Document : le graphique « Qui étudie où ? » dans <a href="#s2:s2-3">le cours</a>.</p><ol><li>Comparez la part des enfants de cadres et d’ouvriers en classes préparatoires.</li><li>À l’aide du document et de vos connaissances, montrez que l’origine sociale influence les trajectoires de formation.</li></ol>',
      corrige: '<ol><li>Selon le ministère (repris par l’Observatoire des inégalités), en 2023-2024, 53,7 % des élèves de classes préparatoires sont enfants de cadres contre 6,4 % enfants d’ouvriers : environ 8,4 fois plus.</li><li>Le document montre une forte hiérarchie sociale des filières : plus une filière est sélective et prestigieuse, plus les enfants de cadres y sont nombreux (64,9 % en ENS) et les enfants d’ouvriers rares (2,0 %) ; à l’inverse, les enfants d’ouvriers sont mieux représentés en BTS (21,6 %), filière courte et professionnelle. Deux mécanismes l’expliquent. Le capital culturel transmis par les familles favorisées (Bourdieu et Passeron) facilite la réussite dans un système qui valorise leurs savoirs et leurs codes. Et les stratégies des familles (Boudon) : à résultats égaux, les familles populaires évaluent plus fortement les coûts et les risques d’études longues et choisissent plus souvent des formations courtes, ce que confirme la DEPP sur les vœux d’orientation en fin de troisième.</li></ol>' },
    { type: "Partie 3 · Raisonnement sur dossier", origine: "Sujet inventé pour le site", t: "À l’aide du dossier, montrez que la famille joue un rôle dans les inégalités de réussite scolaire.", enonce: '<p><b>Document 1</b> : PISA 2022, écart de 113 points en mathématiques entre élèves favorisés et défavorisés en France (OCDE : 93). <b>Document 2</b> : vœux d’orientation en fin de troisième, à moyenne de 10 à 12 : 91 % des enfants de cadres demandent une seconde générale et technologique contre 59 % des enfants d’ouvriers non qualifiés (DEPP). <b>Document 3</b> : graphique « Qui étudie où ? ».</p>',
      corrige: '<p><b>Introduction.</b> Les inégalités de réussite scolaire sont les écarts de résultats et de parcours entre élèves. La famille y contribue par ce qu’elle transmet, par ce qu’elle investit et par les choix qu’elle fait.</p><p><b>I. La famille transmet un capital culturel.</b> Langage, rapport à la lecture, connaissance des attentes scolaires (Bourdieu et Passeron). Document 1 : 113 points d’écart en mathématiques dès 15 ans.</p><p><b>II. La famille investit dans la scolarité.</b> Temps, aide aux devoirs, cours particuliers, activités ; configurations familiales (Lahire), qui expliquent aussi des réussites paradoxales.</p><p><b>III. La famille fait des choix d’orientation.</b> Coûts, avantages et risques selon la position sociale (Boudon). Document 2 : 91 % contre 59 % à résultats égaux. Document 3 : aboutissement de ces choix dans le supérieur (53,7 % contre 6,4 % en CPGE).</p><p><b>Conclusion.</b> La famille pèse par la transmission, l’investissement et la stratégie ; ces effets s’ajoutent au rôle de l’École elle-même.</p>' },
    { type: "Dissertation · plan détaillé", origine: "Sujet inventé pour le site", t: "Comment expliquer les inégalités de réussite scolaire selon le milieu social ?", enonce: "<p>« Comment expliquer » appelle un plan explicatif (pas un oui / non).</p>",

  /* ---------- calculatrice de savoir-faire ---------- */
  function nombre(v) { v = String(v).replace(/\s/g, "").replace(",", ".").replace("−", "-"); return v === "" ? NaN : +v; }
  function monterCalc(el) {

      if (mode === "moy") h += '<div class="champs"><label>Taux successifs en %, séparés par « ; »<input id="c-s" value="2,7 ; 1,6 ; 1,5 ; 0,8"></label></div><p class="src-l">Exemple chargé : croissance du PIB en volume de 2022 à 2025 (Insee).</p>';
      h += '<div class="res"></div><div class="phr"></div>';
      el.innerHTML = h;
      $$(".seg button", el).forEach(function (b) { b.onclick = function () { mode = b.getAttribute("data-m"); dessiner(); }; });
      $$("input", el).forEach(function (inp) { inp.addEventListener("input", function () { calculer(inp.id); }); });
      calculer();

      $(".res", el).innerHTML = items.map(function (x) { return "<div><b>" + x[1] + "</b><span>" + x[0] + "</span></div>"; }).join("");
      $(".phr", el).innerHTML = phrase;
    }

      if (mode === "deux") {
        var a = nombre($("#c-a", el).value), b = nombre($("#c-b", el).value);
        if (!isFinite(a) || !isFinite(b) || a === 0) { res([], "Entre deux nombres (le premier non nul)."); return; }
        var cm = b / a, t = (cm - 1) * 100;
        res([["Taux de variation = (V<sub>a</sub> − V<sub>d</sub>) / V<sub>d</sub> × 100", (t > 0 ? "+" : "") + fr(t, 1) + " %"], ["Coefficient multiplicateur = V<sub>a</sub> / V<sub>d</sub>", "× " + fr(cm, 2)], ["Indice de V<sub>a</sub>, base 100 = V<sub>d</sub>", fr(cm * 100, 1)], ["Variation absolue V<sub>a</sub> − V<sub>d</sub>", fr(b - a, 1)]],
          "Phrase type : « Entre les deux dates, la valeur a été multipliée par " + fr(cm, 2) + ", soit " + (t >= 0 ? "une hausse" : "une baisse") + " de " + fr(Math.abs(t), 1) + " %. »" + (cm >= 2 ? " Quand le coefficient dépasse 2, préfère « multipliée par » : c'est plus parlant qu'un pourcentage." : ""));

        if (source === "c-c") cmv = nombre(ci.value); else if (source === "c-i") cmv = nombre(ii.value) / 100; else cmv = 1 + nombre(ti.value) / 100;
        if (!isFinite(cmv)) { res([], ""); return; }
        if (source !== "c-t") ti.value = fr((cmv - 1) * 100, 2).replace("−", "-");
        if (source !== "c-c") ci.value = fr(cmv, 4).replace("−", "-");
        if (source !== "c-i") ii.value = fr(cmv * 100, 2).replace("−", "-");
        res([["Coefficient multiplicateur", "× " + fr(cmv, 4)], ["Taux de variation", fr((cmv - 1) * 100, 2) + " %"], ["Indice (base 100)", fr(cmv * 100, 2)]],
          "Les trois disent la même chose : CM = 1 + t/100 et indice = CM × 100. Un indice de " + fr(cmv * 100, 1) + " signifie " + (cmv >= 1 ? "une hausse" : "une baisse") + " de " + fr(Math.abs(cmv - 1) * 100, 1) + " % par rapport à la base.");
