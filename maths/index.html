/* ---------- Figures de l'espace en perspective cavalière (outils partagés par les chapitres 10 à 12) ----------
   CAV.vue({ox, oy, s, k, a, repere}) renvoie une projection P(x, y, z) → [X, Y] en pixels de la scène.
   Sans « repere » : x vers la droite, y fuyant (profondeur), z vers le haut (dessin du cube ABCDEFGH).
   Avec « repere: true » : x fuyant vers l'observateur (en bas à gauche), y vers la droite, z vers le haut. */
var CAV = (function () {
  "use strict";
  function vue(o) {
    var k = o.k || 0.5, a = (o.a || 40) * Math.PI / 180, c = Math.cos(a) * k, s = Math.sin(a) * k;
    return o.repere ? function (x, y, z) { return [o.ox + o.s * (y - c * x), o.oy - o.s * (z - s * x)]; }
      : function (x, y, z) { return [o.ox + o.s * (x + c * y), o.oy - o.s * (z + s * y)]; };
  }
  function ajoute(a, b) { var r = {}, k; for (k in a) r[k] = a[k]; for (k in b || {}) r[k] = b[k]; return r; }
  var TRAIT = "stroke:var(--encre);stroke-width:1.5;fill:none", CACHE = "stroke:var(--encre2);stroke-width:1.2;stroke-dasharray:4 3;fill:none";
  function seg(S, P, A, B, cache, at) { var a = P(A[0], A[1], A[2]), b = P(B[0], B[1], B[2]); return S.px.seg(a[0], a[1], b[0], b[1], "a-branche", ajoute({ style: cache ? CACHE : TRAIT }, at)); }
  function trait(S, P, A, B, cls, at) { var a = P(A[0], A[1], A[2]), b = P(B[0], B[1], B[2]); return S.px.seg(a[0], a[1], b[0], b[1], cls, at); }
  function fleche(S, P, A, B, f, cls, at) {
    f = f === undefined ? 1 : f; if (f <= 0.01) return null;
    var Bf = [A[0] + f * (B[0] - A[0]), A[1] + f * (B[1] - A[1]), A[2] + f * (B[2] - A[2])];
    var a = P(A[0], A[1], A[2]), b = P(Bf[0], Bf[1], Bf[2]);
    return S.px.fleche(a[0], a[1], b[0], b[1], cls || "g-c", ajoute({ "stroke-width": 2.6 }, at));
  }
  function poly(S, P, pts, cls, at) { return S.px.path(pts.map(function (q, i) { var p = P(q[0], q[1], q[2]); return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("") + "Z", cls || "a-plein", at); }
  function pt(S, P, A, cls, r, at) { var p = P(A[0], A[1], A[2]); return S.px.cercle(p[0], p[1], r || 3.5, cls || "g-pt", at); }
  function txt(S, P, A, s, cls, anc, dx, dy, at) { var p = P(A[0], A[1], A[2]); return S.px.txt(p[0] + (dx || 0), p[1] + (dy || 0), s, cls, anc || "middle", at); }
  function lerp3(A, B, t) { return [A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1]), A[2] + t * (B[2] - A[2])]; }
  /* angle droit en H, entre les directions u et v (unitaires, longueur r en unités de l'espace) */
  function droit(S, P, H, u, v, r) { var a = [H[0] + r * u[0], H[1] + r * u[1], H[2] + r * u[2]], b = [a[0] + r * v[0], a[1] + r * v[1], a[2] + r * v[2]], c = [H[0] + r * v[0], H[1] + r * v[1], H[2] + r * v[2]]; poly(S, P, [H, a, b, c], "a-craie", { style: "fill:none" }); }
  return { vue: vue, seg: seg, trait: trait, fleche: fleche, poly: poly, pt: pt, txt: txt, lerp3: lerp3, droit: droit };
})();

<p>Variante « par le volume » : si tu connais le volume $V$ d'un tétraèdre et l'aire $\mathcal B$ d'une face, la hauteur relative à cette face vaut $h=\frac{3V}{\mathcal B}$.</p>` },

  exos: [
    { niv: 1, t: "Calculs de base", enonce: R`<p>Repère orthonormé. $\vec u(2;-1;3)$, $\vec v(1;5;1)$, $A(1;0;2)$, $B(4;-2;8)$.</p><ol><li>Calculer $\vec u\cdot\vec v$. Que peut-on en déduire ?</li><li>Calculer $\|\vec u\|$ et la distance $AB$.</li><li>Déterminer le réel $m$ pour lequel $\vec w(m;2;-2)$ est orthogonal à $\vec u$.</li></ol>`,
      corrige: R`<ol><li>$\vec u\cdot\vec v=2-5+3=0$ : $\vec u$ et $\vec v$ sont orthogonaux.</li><li>$\|\vec u\|=\sqrt{4+1+9}=\sqrt{14}$. $\vec{AB}(3;-2;6)$, $AB=\sqrt{9+4+36}=7$.</li><li>$\vec u\cdot\vec w=2m-2-6=2m-8=0\iff m=4$.</li></ol>` },

    { niv: 2, t: "Une droite orthogonale à un plan", enonce: R`<p>Repère orthonormé. $A(1;1;0)$, $B(3;0;1)$, $C(0;2;2)$, $D(4;6;-1)$.</p><ol><li>Montrer que $A$, $B$, $C$ ne sont pas alignés.</li><li>Montrer que la droite $(AD)$ est orthogonale au plan $(ABC)$.</li><li>En déduire la distance du point $D$ au plan $(ABC)$.</li><li>Calculer $\vec{AB}\cdot\vec{AC}$, puis le cosinus et le sinus de l'angle $\alpha$ du triangle $ABC$ en $A$. En déduire l'aire du triangle $ABC$.</li><li>Calculer le volume du tétraèdre $ABCD$.</li></ol>`,
      corrige: R`<ol><li>$\vec{AB}(2;-1;1)$, $\vec{AC}(-1;1;2)$ : coordonnées non proportionnelles ($\frac{-1}2\neq\frac1{-1}$). Non colinéaires, donc $A$, $B$, $C$ non alignés.</li><li>$\vec{AD}(3;5;-1)$. $\vec{AD}\cdot\vec{AB}=6-5-1=0$ et $\vec{AD}\cdot\vec{AC}=-3+5-2=0$. $(AD)$ est orthogonale à deux droites sécantes du plan, $(AB)$ et $(AC)$ : elle est orthogonale au plan $(ABC)$.</li><li>$(AD)$ est orthogonale au plan et $A$ est dans le plan : $A$ est le projeté orthogonal de $D$. Distance : $AD=\sqrt{9+25+1}=\sqrt{35}\approx5{,}92$.</li><li>$\vec{AB}\cdot\vec{AC}=-2-1+2=-1$ ; $AB=AC=\sqrt6$. $\cos\alpha=\frac{-1}{6}$ (angle obtus), $\sin\alpha=\sqrt{1-\frac1{36}}=\frac{\sqrt{35}}6$. Aire : $\frac12\times\sqrt6\times\sqrt6\times\frac{\sqrt{35}}6=\frac{\sqrt{35}}2$.</li><li>$V=\frac13\times\frac{\sqrt{35}}2\times\sqrt{35}=\frac{35}6\approx5{,}83$.</li></ol>` },
    { niv: 2, t: "Projeté orthogonal sur une droite", enonce: R`<p>Repère orthonormé. La droite $(d)$ passe par $A(1;0;-1)$ et est dirigée par $\vec u(2;1;2)$. Soit $M(5;3;6)$.</p><ol><li>Le point $M$ appartient-il à $(d)$ ?</li><li>Déterminer les coordonnées du projeté orthogonal $H$ de $M$ sur $(d)$.</li><li>En déduire la distance de $M$ à la droite $(d)$.</li></ol>`,

    { niv: 3, t: "Distance et volume dans un tétraèdre (type bac)", enonce: R`<p>Repère orthonormé $(O;\vec i,\vec j,\vec k)$. On considère $A(2;0;0)$, $B(0;3;0)$, $C(0;0;6)$ et $\vec n(3;2;1)$.</p><ol><li>Montrer que $\vec n$ est normal au plan $(ABC)$.</li><li>Soit $H$ le projeté orthogonal de $O$ sur $(ABC)$. Justifier qu'il existe un réel $t$ tel que $\vec{OH}=t\vec n$, puis, en utilisant $\vec{AH}\cdot\vec n=0$, déterminer $t$ et les coordonnées de $H$.</li><li>En déduire la distance du point $O$ au plan $(ABC)$.</li><li>Calculer le volume du tétraèdre $OABC$ en prenant pour base le triangle $OAB$.</li><li>En déduire l'aire du triangle $ABC$.</li></ol>`,

/* Animation : le projeté orthogonal est le point le plus proche (démonstration du BO) */
ANIMS.projete3d = {
  titre: "Le projeté orthogonal, point le plus proche",
  vb: [360, 260],
  etapes: [
    { d: 3.5, l: R`Un plan $\mathcal P$, un point $M$ hors du plan et un point $A$ du plan. Quelle est la plus petite distance entre $M$ et un point de $\mathcal P$ ?` },
    { d: 4, l: R`On « laisse tomber » $M$ verticalement, c'est-à-dire orthogonalement au plan : il atteint $\mathcal P$ en $H$, le <b>projeté orthogonal</b> de $M$. Ici $MH=2$.` },
    { d: 6, l: R`Le point $A$ se déplace dans $\mathcal P$, sur un cercle de centre $H$. Le triangle $MHA$ reste rectangle en $H$ : $MA^2=MH^2+HA^2$, donc $MA>MH$ dès que $A\neq H$.` },
    { d: 4.5, l: R`$A$ se rapproche de $H$ : $HA$ diminue et $MA$ descend vers $MH$, sans jamais passer en dessous.` },
    { d: 4, l: R`$MA=MH$ seulement quand $A=H$ : $H$ est le point de $\mathcal P$ le plus proche de $M$, et la <b>distance de $M$ au plan</b> est $MH$.` }
  ],
  rendu: function (S, k, t) {
    var E = ANIM.e, P = CAV.vue({ ox: 190, oy: 200, s: 56, k: 0.55, a: 38 });
    CAV.poly(S, P, [[-2, -1.6, 0], [2.1, -1.6, 0], [2.1, 1.6, 0], [-2, 1.6, 0]], "a-plein");
    CAV.txt(S, P, [-2, -1.6, 0], "𝒫", "b", "start", 10, -6, { "font-size": 16 });
    var H = [0, 0, 0], M = [0, 0, 2], r0 = 1.5;
    var r = r0, th = -0.5;
    if (k === 2) th = -0.5 + 2 * Math.PI * E(t);
    if (k === 3) r = ANIM.l(r0, 0, E(t));
    if (k === 4) r = 0;
    var A = [r * Math.cos(th), r * Math.sin(th), 0];
    if (k >= 2) { var pts = []; for (var i = 0; i <= 48; i++) { var a = 2 * Math.PI * i / 48; pts.push(P(r0 * Math.cos(a), r0 * Math.sin(a), 0)); } S.px.path("M" + pts.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("L"), "a-craie"); }
    var desc = k === 1 ? E(ANIM.p(t, 0, 0.7)) : k >= 2 ? 1 : 0;
    if (k >= 1) {
      var bas = CAV.lerp3(M, H, desc);
      CAV.trait(S, P, M, bas, "g-c", { "stroke-width": 2.6 });
      if (desc > 0.98) { CAV.droit(S, P, H, [1, 0, 0], [0, 0, 1], 0.22); CAV.pt(S, P, H, "g-pt", 4.5); CAV.txt(S, P, H, "H", "b", "end", -8, 14); }
      else CAV.pt(S, P, bas, "g-pt", 3);
    }
    if (r > 0.02) {
      CAV.trait(S, P, M, A, "g-c2", { "stroke-width": 2.4 });
      if (k >= 2) CAV.trait(S, P, H, A, "g-c3", { "stroke-width": 2.2 });
      CAV.pt(S, P, A, "g-pt2", 4.5); CAV.txt(S, P, A, "A", "r", "start", 8, 12);
    }
    CAV.pt(S, P, M, "g-pt2", 4.5); CAV.txt(S, P, M, "M", "r", "start", 8, -2);
    var MA = Math.sqrt(4 + r * r), nf = ANIM.nf;
    var l1 = k === 0 ? "MA = " + nf(MA, 2) : "MH = 2  ·  HA = " + nf(r, 2), l2 = k === 0 ? "" : "MA = √(MH² + HA²) = " + nf(MA, 2);
    S.px.txt(8, 24, l1, "b", "start", { "font-size": 13 });
    if (l2) S.px.txt(8, 44, l2, "r", "start", { "font-size": 13 });
    if (k >= 4) S.px.math(4, 52, 144, 34, R`$d(M;\mathcal P)=MH$`, { opacity: E(t) });
  }
};

[thm|Représentation paramétrique]Soit $(d)$ la droite passant par $A(x_A;y_A;z_A)$ et de vecteur directeur $\vec u(a;b;c)$ (non nul). $M(x;y;z)\in(d)$ si et seulement s'il existe un réel $t$ tel que

[ex|Écrire une représentation paramétrique]$A(1;-2;3)$, $\vec u(2;1;-1)$ : $(d):\begin{cases}x=1+2t\\y=-2+t\\z=3-t\end{cases}$, $t\in\R$. Pour $t=0$ on retrouve $A$ ; pour $t=2$ on obtient $B(5;0;1)$.[/]

<p><b>Segment, demi-droite.</b> Avec $A$ et $B$, $M=A+t\vec{AB}$ décrit le segment $[AB]$ quand $t\in[0;1]$, la demi-droite $[AB)$ quand $t\geq0$.</p>` },
    { id: "cartesienne", titre: "Équation cartésienne d'un plan", html: R`
[thm|Équation cartésienne d'un plan]<ul><li>Le plan passant par $A$ et de vecteur normal $\vec n(a;b;c)$ a une équation de la forme $ax+by+cz+d=0$.</li><li>Réciproquement, si $a$, $b$, $c$ ne sont pas tous nuls, l'ensemble des points $M(x;y;z)$ tels que $ax+by+cz+d=0$ est un plan de vecteur normal $\vec n(a;b;c)$.</li></ul>[/]
[ex|Plan défini par un point et un vecteur normal]Plan passant par $A(1;2;-1)$ et normal à $\vec n(2;-1;3)$ : son équation est $2x-y+3z+d=0$. Comme $A$ est dans le plan : $2-2-3+d=0$, donc $d=3$. Équation : $2x-y+3z+3=0$.[/]
[ex|Lire un vecteur normal]Le plan $x-2z+5=0$ a pour vecteur normal $\vec n(1;0;-2)$ (le coefficient de $y$ est nul). Le plan $z=4$ est normal à $\vec k$ : il est parallèle au plan $(xOy)$, d'équation $z=0$.[/]
[meth|Équation du plan passant par trois points $A$, $B$, $C$]<ol><li>Vérifie que $A$, $B$, $C$ ne sont pas alignés.</li><li>Cherche $\vec n(a;b;c)$ tel que $\vec n\cdot\vec{AB}=0$ et $\vec n\cdot\vec{AC}=0$ : deux équations à trois inconnues, on fixe une inconnue (par exemple $c=1$, ou une valeur qui évite les fractions).</li><li>Écris $ax+by+cz+d=0$ et trouve $d$ avec $A$. Vérifie avec $B$ et $C$.</li></ol>[/]
[ex|Le plan qui coupe les trois axes]$A(1;0;0)$, $B(0;2;0)$, $C(0;0;3)$. $\vec{AB}(-1;2;0)$, $\vec{AC}(-1;0;3)$. Les conditions $-a+2b=0$ et $-a+3c=0$ donnent, avec $a=6$ : $b=3$, $c=2$. Équation $6x+3y+2z+d=0$ avec $A$ : $d=-6$. Plan : $6x+3y+2z-6=0$. Contrôle : $B$ donne $6-6=0$ ✓, $C$ donne $6-6=0$ ✓.[/]

[ex|Plan médiateur en équation]$A(1;0;2)$, $B(3;4;0)$ : milieu $I(2;2;1)$, $\vec{AB}(2;4;-2)$, que l'on peut remplacer par $(1;2;-1)$. Plan médiateur : $x+2y-z+d=0$ avec $I$ : $2+4-1+d=0$, $d=-5$. Équation : $x+2y-z-5=0$.[/]` },
    { id: "positions", titre: "Positions relatives en coordonnées", html: R`

<tr><td>Droite $(A;\vec u)$, plan de normal $\vec n$</td><td>$\vec u\cdot\vec n$</td><td>$\neq0$ : sécants (en un point) ; $=0$ : parallèles, et incluse si $A$ est dans le plan. Orthogonale au plan si $\vec u$ et $\vec n$ colinéaires.</td></tr>

[ex|Deux plans]$\mathcal P:2x-y+z-1=0$ et $\mathcal Q:-4x+2y-2z+7=0$ : $\vec n'(-4;2;-2)=-2\vec n$, normaux colinéaires ; les plans sont parallèles. Ils ne sont pas confondus : $(0;0;1)\in\mathcal P$ mais $-2+7\neq0$. Avec $\mathcal R:x+y-z=0$ : $\vec n\cdot\vec n''=2-1-1=0$, donc $\mathcal P$ et $\mathcal R$ sont perpendiculaires.[/]
[ex|Une droite et un plan]$(d):\begin{cases}x=1+2t\\y=-2+t\\z=3-t\end{cases}$ et $\mathcal P:x-y+z-6=0$. $\vec u(2;1;-1)$, $\vec n(1;-1;1)$ : $\vec u\cdot\vec n=2-1-1=0$, donc $(d)$ est parallèle à $\mathcal P$. Le point $A(1;-2;3)$ vérifie $1+2+3-6=0$ : il est dans $\mathcal P$, donc $(d)$ est <b>incluse</b> dans $\mathcal P$.[/]` },
    { id: "intersections", titre: "Intersections : droite et plan, deux droites", html: R`
<div data-anim="droitePlan"></div>
[meth|Intersection d'une droite et d'un plan]On remplace $x$, $y$, $z$ de la représentation paramétrique dans l'équation du plan : on obtient une équation du premier degré en $t$.
<ul><li>une unique solution $t_0$ : la droite et le plan sont <b>sécants</b> au point de paramètre $t_0$ ;</li><li>une équation impossible ($0t=5$) : <b>parallèles</b>, sans point commun ;</li><li>une équation toujours vraie ($0t=0$) : la droite est <b>incluse</b> dans le plan.</li></ul>[/]
[ex|Une droite qui traverse un plan]$\mathcal P:x+y+z-3=0$ et $(d):\begin{cases}x=t\\y=2-t\\z=-1+2t\end{cases}$. On remplace : $t+(2-t)+(-1+2t)-3=0$, soit $2t-2=0$, $t=1$. Point d'intersection : $I(1;1;1)$. Contrôle : $1+1+1-3=0$ ✓.[/]
[meth|Intersection de deux droites]On écrit les deux représentations avec <b>deux paramètres différents</b> ($t$ et $s$) et on résout le système de trois équations à deux inconnues : on trouve $t$ et $s$ avec deux équations, la troisième décide.[/]
[ex|Sécantes ou non coplanaires ?]$(d_1):\begin{cases}x=1+t\\y=2t\\z=3-t\end{cases}$ et $(d_2):\begin{cases}x=2+s\\y=1-s\\z=s\end{cases}$. Vecteurs $(1;2;-1)$ et $(1;-1;1)$ non colinéaires. Système : $1+t=2+s$ et $2t=1-s$. De la première, $s=t-1$ ; dans la seconde, $2t=2-t$, donc $t=\frac23$, $s=-\frac13$. Troisième équation : $3-t=\frac73$ et $s=-\frac13$ : $\frac73\neq-\frac13$. Pas de solution : les droites ne sont <b>pas coplanaires</b>.[/]
[ex|Avec un point commun]Remplaçons $(d_2)$ par $(d_3):\begin{cases}x=2+s\\y=2-s\\z=2+s\end{cases}$. $1+t=2+s$ et $2t=2-s$ donnent $s=t-1$ puis $2t=3-t$, $t=1$, $s=0$. Troisième : $3-1=2$ et $2+0=2$ ✓. Les droites sont sécantes en $(2;2;2)$.[/]
<p><span class="tag hp">Pour aller plus loin</span> <b>Intersection de deux plans sécants</b> : on pose $z=t$ (si possible) et on exprime $x$ et $y$ en fonction de $t$ avec les deux équations : on obtient une représentation paramétrique de la droite d'intersection. Exemple : $x+y-z=0$ et $x-y+z-2=0$ ; en additionnant, $2x=2$, $x=1$, puis $y=z-1$ : la droite $x=1$, $y=-1+t$, $z=t$. Approfondissement du programme.</p>` },
    { id: "projections", titre: "Projeté orthogonal et distance en coordonnées", html: R`
[meth|Projeté orthogonal de $M$ sur le plan $\mathcal P:ax+by+cz+d=0$]<ol><li>La droite $\Delta$ passant par $M$ et orthogonale à $\mathcal P$ est dirigée par $\vec n(a;b;c)$ : $x=x_M+at$, $y=y_M+bt$, $z=z_M+ct$.</li><li>Son intersection avec $\mathcal P$ est le projeté $H$ : on remplace et on résout en $t$.</li><li>Distance de $M$ au plan : $MH=|t|\times\|\vec n\|$.</li></ol>[/]
[ex|Un projeté sur un plan]$M(4;-1;3)$ et $\mathcal P:2x-y+2z-3=0$, $\vec n(2;-1;2)$, $\|\vec n\|=3$. $\Delta:x=4+2t$, $y=-1-t$, $z=3+2t$. On remplace : $2(4+2t)-(-1-t)+2(3+2t)-3=0$, soit $12+9t=0$, $t=-\frac43$. $H\left(\frac43;\frac13;\frac13\right)$ et $MH=\frac43\times3=4$.[/]
<p><span class="tag hp">Pour aller plus loin</span> En faisant ce calcul en général, $t=-\frac{ax_M+by_M+cz_M+d}{a^2+b^2+c^2}$, d'où la formule
$$d(M;\mathcal P)=\frac{|ax_M+by_M+cz_M+d|}{\sqrt{a^2+b^2+c^2}}.$$
Elle n'est pas au programme : au bac, on attend la méthode du projeté (mais la formule permet de vérifier). Ici : $\frac{|8+1+6-3|}{3}=4$ ✓.</p>
[meth|Projeté orthogonal de $M$ sur la droite $(A;\vec u)$]$H=A+t\vec u$ avec $\vec{HM}\cdot\vec u=0$. En coordonnées : on écrit $\vec{HM}$ en fonction de $t$, on développe le produit scalaire, on résout.[/]
[ex|Un projeté sur une droite]$(d):x=1+t$, $y=1+t$, $z=t$ (point $A(1;1;0)$, $\vec u(1;1;1)$) et $M(3;1;4)$. $\vec{HM}(2-t;-t;4-t)$ ; $\vec{HM}\cdot\vec u=6-3t=0$, $t=2$. $H(3;3;2)$, $\vec{HM}(0;-2;2)$, distance $MH=2\sqrt2$.[/]` },
    { id: "systemes", titre: "Traduire un problème par un système", html: R`
<p>Le programme demande de traduire des questions géométriques en <b>systèmes linéaires</b>, puis de les résoudre dans les cas simples et d'interpréter. Le principe : on écrit la relation vectorielle cherchée, coordonnée par coordonnée.</p>
[ex|Trois vecteurs forment-ils une base ?]$\vec u(1;2;0)$, $\vec v(0;1;1)$, $\vec w(1;0;-2)$. On cherche $\alpha$, $\beta$ avec $\vec w=\alpha\vec u+\beta\vec v$ : $\begin{cases}1=\alpha\\0=2\alpha+\beta\\-2=\beta\end{cases}$. On trouve $\alpha=1$, $\beta=-2$, et la deuxième ligne est vérifiée ($2-2=0$). Donc $\vec w=\vec u-2\vec v$ : les vecteurs sont <b>coplanaires</b>, ils ne forment pas une base.[/]
[ex|Coordonnées dans une base]Avec $\vec u(1;2;0)$, $\vec v(0;1;1)$, $\vec k(0;0;1)$, qui forment une base (vérifie-le), cherchons les coordonnées de $\vec t(3;4;1)$ : $\alpha\vec u+\beta\vec v+\gamma\vec k=(\alpha;2\alpha+\beta;\beta+\gamma)=(3;4;1)$. D'où $\alpha=3$, $\beta=4-6=-2$, $\gamma=1+2=3$. Donc $\vec t=3\vec u-2\vec v+3\vec k$.[/]
[ex|Coplanarité avec un paramètre]Pour quelle valeur de $k$ le point $D_k(0;0;k)$ est-il dans le plan $x-y+4z-5=0$ ? $4k-5=0$, $k=\frac54$. Avec une équation de plan, une coplanarité se teste en une ligne.[/]
[meth|Résoudre un système de trois équations]<ol><li>Isole une inconnue dans l'équation la plus simple.</li><li>Remplace dans les deux autres : tu obtiens deux équations à deux inconnues.</li><li>Résous, remonte, puis <b>vérifie dans les trois équations</b>.</li><li>Interprète : une solution, aucune, ou une infinité (une inconnue reste libre).</li></ol>[/]
<p><span class="tag hp">Pour aller plus loin</span> <b>Sphère</b> de centre $\Omega(a;b;c)$ et de rayon $r$ : $(x-a)^2+(y-b)^2+(z-c)^2=r^2$. Pour couper une sphère par une droite, on remplace la représentation paramétrique : on obtient une équation du second degré en $t$ (0, 1 ou 2 points communs). Approfondissement non exigible.</p>` }

<ul><li><b>Probabilité conditionnelle</b> : $P_A(B)=\frac{P(A\cap B)}{P(A)}$ si $P(A)\neq0$ ; donc $P(A\cap B)=P(A)\times P_A(B)$.</li>
<li><b>Arbre pondéré</b> : la somme des probabilités issues d'un même nœud vaut $1$ ; on multiplie le long d'un chemin ; on additionne les chemins qui mènent à un même événement.</li>
<li><b>Probabilités totales</b> : si $A_1,\dots,A_m$ forment une partition de l'univers, $P(B)=P(A_1\cap B)+\dots+P(A_m\cap B)$.</li>
<li><b>Indépendance</b> : $A$ et $B$ sont indépendants si $P(A\cap B)=P(A)\times P(B)$, c'est-à-dire $P_A(B)=P(B)$.</li>
<li><b>Variable aléatoire</b> : loi, espérance $E(X)=\sum x_iP(X=x_i)$, variance $V(X)=\sum(x_i-E(X))^2P(X=x_i)=E(X^2)-E(X)^2$, écart type $\sigma=\sqrt V$.</li>
<li><b>Chapitre 5</b> : $\binom nk$ compte les mots de $n$ lettres contenant exactement $k$ lettres S.</li></ul>`,

    { id: "succession", titre: "Succession d'épreuves indépendantes", html: R`
[def|Le modèle]On réalise successivement $n$ épreuves (expériences aléatoires) dont les univers sont $\Omega_1$, …, $\Omega_n$. L'univers de l'expérience globale est le <b>produit cartésien</b> $\Omega_1\times\dots\times\Omega_n$ : une issue est une liste $(x_1;\dots;x_n)$. Les épreuves sont <b>indépendantes</b> lorsque
$$P((x_1;\dots;x_n))=P(x_1)\times P(x_2)\times\dots\times P(x_n).$$[/]
<p>Concrètement : le résultat d'une épreuve n'influence pas les suivantes (lancers successifs, tirages <b>avec remise</b>, personnes choisies au hasard dans une très grande population). Sur un arbre, les probabilités des branches ne dépendent pas du chemin déjà parcouru.</p>
[ex|Un dé puis une pièce]On lance un dé équilibré puis une pièce équilibrée. $\Omega=\{1;\dots;6\}\times\{P;F\}$ a $12$ issues. $P((6;P))=\frac16\times\frac12=\frac1{12}$.[/]
[ex|Trois tirages avec remise]Une urne contient $3$ boules rouges et $2$ bleues ; on tire trois fois une boule <b>avec remise</b>. $P(RRB)=\frac35\times\frac35\times\frac25=\frac{18}{125}=0{,}144$. Les issues avec exactement une bleue sont $RRB$, $RBR$, $BRR$, de même probabilité : $3\times0{,}144=0{,}432$.[/]
[piege|Sans remise, plus d'indépendance]Si l'on tire <b>sans remise</b>, la composition de l'urne change : $P(RR)=\frac35\times\frac24=\frac3{10}$ et non $\left(\frac35\right)^2$. Ce n'est plus une succession d'épreuves indépendantes : on utilise des probabilités conditionnelles.[/]` },
    { id: "arbres", titre: "Deux ou trois épreuves quelconques : arbres et probabilités totales", html: R`
<p>Quand les épreuves ne sont pas indépendantes, l'arbre reste l'outil : chaque branche porte une probabilité <b>conditionnelle</b>.</p>
[ex|Un test de dépistage (valeurs d'illustration)]Une maladie touche $2\,\%$ d'une population. Un test est positif chez $95\,\%$ des malades et chez $10\,\%$ des personnes saines. $M$ : « malade », $T$ : « test positif ».
<ul><li>$P(M\cap T)=0{,}02\times0{,}95=0{,}019$ ; $P(\overline M\cap T)=0{,}98\times0{,}10=0{,}098$.</li><li>Probabilités totales : $P(T)=0{,}019+0{,}098=0{,}117$.</li><li>Sachant que le test est positif : $P_T(M)=\frac{0{,}019}{0{,}117}\approx0{,}162$.</li></ul>
Un test positif ne donne qu'environ $16\,\%$ de chances d'être malade : la maladie est rare, les faux positifs sont nombreux. C'est un grand classique du bac (sujet de juin 2025 sur les groupes sanguins, sujet de mai 2026 sur les abonnements).[/]
[meth|Lire un énoncé de probabilités conditionnelles]« Parmi les A, 30 % … » est une probabilité <b>conditionnelle</b> $P_A(\dots)$ (deuxième niveau de l'arbre). « 12 % des abonnés ont choisi A <b>et</b> … » est une intersection $P(A\cap\dots)$ (un chemin entier).[/]` },
    { id: "bernoulli", titre: "Épreuve de Bernoulli, loi de Bernoulli", html: R`
[def|Épreuve et loi de Bernoulli]Une <b>épreuve de Bernoulli</b> est une expérience à deux issues, appelées succès ($S$, probabilité $p$) et échec ($\overline S$, probabilité $1-p$). La variable $X$ qui vaut $1$ en cas de succès et $0$ en cas d'échec suit la <b>loi de Bernoulli</b> de paramètre $p$.[/]
[prop|Espérance et variance]$E(X)=0\times(1-p)+1\times p=p$ et $V(X)=E(X^2)-E(X)^2=p-p^2=p(1-p)$.[/]
[ex|Un lancer franc]Un joueur réussit un lancer franc avec la probabilité $0{,}7$. Le nombre de paniers marqués en un lancer suit la loi de Bernoulli de paramètre $0{,}7$ : $E=0{,}7$, $V=0{,}7\times0{,}3=0{,}21$.[/]
<p>Le « succès » est ce qu'on décide de compter : obtenir un $6$, tomber sur une pièce défectueuse, une personne de groupe O négatif… ce n'est pas forcément un événement heureux.</p>` },
    { id: "schema", titre: "Schéma de Bernoulli et loi binomiale", html: R`
[def|Schéma de Bernoulli, loi binomiale]Un <b>schéma de Bernoulli</b> de paramètres $n$ et $p$ est la répétition de $n$ épreuves de Bernoulli <b>identiques</b> (même $p$) et <b>indépendantes</b>. La variable $X$ égale au <b>nombre de succès</b> suit la <b>loi binomiale</b> de paramètres $n$ et $p$, notée $\mathcal B(n,p)$. Ses valeurs sont $0$, $1$, …, $n$.[/]
<div data-anim="arbreBinomial"></div>
[thm|Probabilité de $k$ succès]Si $X$ suit $\mathcal B(n,p)$, pour tout entier $k$ de $0$ à $n$ :
$$P(X=k)=\binom nk\,p^k\,(1-p)^{n-k}.$$[/]

    { id: "calculs", titre: "Calculer avec la loi binomiale : cumuls, seuils, intervalles", html: R`
<div data-w="binomiale"></div>
[prop|Les calculs usuels]<ul><li>$P(X\leq k)=P(X=0)+\dots+P(X=k)$ (fonction de répartition : <i>binomFRép</i>, <i>binomcdf</i> selon la calculatrice) ;</li><li>$P(X\geq k)=1-P(X\leq k-1)$ ; $P(X>k)=1-P(X\leq k)$ ;</li><li>$P(a\leq X\leq b)=P(X\leq b)-P(X\leq a-1)$ ;</li><li>$P(X\geq1)=1-P(X=0)=1-(1-p)^n$.</li></ul>[/]
[ex|Un problème de seuil]Chaque jour, un spot publicitaire est vu par une personne donnée avec la probabilité $0{,}1$, indépendamment des autres jours. Combien de jours faut-il pour que la probabilité de l'avoir vu au moins une fois dépasse $0{,}99$ ? On cherche le plus petit $n$ tel que $1-0{,}9^n\geq0{,}99$, soit $0{,}9^n\leq0{,}01$. Avec la calculatrice (tableau de valeurs) ou le logarithme : $n\geq\frac{\ln0{,}01}{\ln0{,}9}\approx43{,}7$. Réponse : $n=44$ jours.[/]
[ex|Un intervalle qui contient $X$ avec une probabilité d'au moins $95\,\%$]$X\sim\mathcal B(100;0{,}5)$ (nombre de « pile » sur $100$ lancers). $P(40\leq X\leq60)\approx0{,}965$ mais $P(41\leq X\leq59)\approx0{,}943$. L'intervalle $[40;60]$ est le plus petit intervalle centré sur $50$ qui contient $X$ avec une probabilité d'au moins $0{,}95$. Obtenir moins de $40$ ou plus de $60$ « pile » rend la pièce suspecte.[/]
[ex|Une probabilité conditionnelle sur une loi binomiale (bac, Amérique du Sud, novembre 2025)]$X\sim\mathcal B(20;0{,}85)$. $P_{(X\geq15)}(X\geq18)=\frac{P(X\geq18)}{P(X\geq15)}\approx0{,}434$ : l'événement $(X\geq18)$ est inclus dans $(X\geq15)$, donc leur intersection est $(X\geq18)$.[/]` },
    { id: "galton", titre: "La planche de Galton et la surréservation", html: R`
<div data-anim="galton"></div>
[ex|Pourquoi une loi binomiale ?]Sur une planche à $6$ rangées de clous, chaque clou envoie la bille à droite avec la probabilité $\frac12$, indépendamment des autres. Le numéro de la case d'arrivée est le nombre de « droite » : il suit $\mathcal B\left(6;\frac12\right)$. Il y a $\binom63=20$ chemins vers la case du milieu, contre $1$ seul vers chaque case extrême : d'où la forme en cloche, $P(X=3)=\frac{20}{64}\approx0{,}31$ et $P(X=0)=\frac1{64}\approx0{,}016$.[/]
[ex|La surréservation (exemple inventé)]Un avion a $200$ places. Chaque passager ayant acheté un billet se présente avec la probabilité $0{,}95$, indépendamment des autres. Si la compagnie vend $210$ billets, le nombre $X$ de passagers présents suit $\mathcal B(210;0{,}95)$ et $P(X>200)\approx0{,}393$ : près de $4$ fois sur $10$, des passagers resteraient à terre. L'algorithme du programme cherche le plus petit $k$ tel que $P(X>k)\leq\alpha$ : avec $\alpha=0{,}05$, on trouve $k=204$. Autrement dit, $210$ billets ne seraient raisonnables qu'avec $204$ places.[/]
[hist|Galton, Bernoulli]Jacques Bernoulli étudie la loi binomiale dans l'<i>Ars Conjectandi</i>, publié en 1713, après sa mort. La planche à clous est due au Britannique Francis Galton, qui s'intéressait à la répartition des caractères autour de la moyenne (fin du XIX<sup>e</sup> siècle).[/]
<p><span class="tag hp">Pour aller plus loin</span> <b>Loi géométrique</b> : le rang $T$ du premier succès dans une suite illimitée d'épreuves de Bernoulli vérifie $P(T=k)=(1-p)^{k-1}p$. Approfondissement non exigible.</p>` }

    { bo: true, t: "Expression de la probabilité de $k$ succès dans le schéma de Bernoulli", h: R`
<p>On répète $n$ fois une épreuve de Bernoulli de paramètre $p$, de façon indépendante. Une issue est un mot de $n$ lettres, chacune $S$ (succès) ou $E$ (échec) : un chemin de l'arbre.</p>
<p><b>Probabilité d'un chemin.</b> Les épreuves étant indépendantes, la probabilité d'une issue est le produit des probabilités de ses lettres. Un mot qui contient exactement $k$ lettres $S$ et $n-k$ lettres $E$ a donc pour probabilité $p^k(1-p)^{n-k}$, quel que soit l'ordre des lettres.</p>
<p><b>Nombre de chemins.</b> Un tel mot est déterminé par les positions de ses $k$ lettres $S$ : une partie à $k$ éléments de $\{1;\dots;n\}$. Il y en a $\binom nk$ (chapitre 5).</p>
<p><b>Conclusion.</b> L'événement $(X=k)$ est la réunion de ces $\binom nk$ issues, deux à deux disjointes, de même probabilité. Donc
$$P(X=k)=\binom nk\,p^k(1-p)^{n-k}.$$
CQFD. Contrôle : la somme vaut $\sum_{k=0}^n\binom nk p^k(1-p)^{n-k}=(p+1-p)^n=1$ (formule du binôme, <span class="tag hp">hors programme</span>).</p>` },

def surreservation(n, p, alpha):
    k = 0

        cumul = cumul + comb(n, k) * p**k * (1 - p)**(n - k)

    l.appendChild(s); ctrl.appendChild(l); return s;
  }
  function binomLoi(n, p) {
    var L = [], q = 1 - p, c = 1;
    for (var k = 0; k <= n; k++) { L.push(c * Math.pow(p, k) * Math.pow(q, n - k)); c = c * (n - k) / (k + 1); }

  }
  /* diagramme en bâtons : valeurs v[k], k = 0..n ; marque(k) → true pour colorier en rouge */
  function batons(scene, v, marque, opt) {
    opt = opt || {};

    scene.innerHTML = ""; scene.appendChild(svg);
    var X = function (k) { return ml + (k + 0.5) * (W - ml - mr) / (n + 1); }, Y = function (y) { return H - mb - y / ymax * (H - mt - mb); };
    var pasY = ymax > 0.5 ? 0.2 : ymax > 0.2 ? 0.1 : ymax > 0.1 ? 0.05 : ymax > 0.04 ? 0.02 : 0.01;
    for (var y = 0; y <= ymax + 1e-9; y += pasY) {

      var t = N("text", { x: ml - 4, y: Y(y) + 4, "text-anchor": "end", "class": "g-txt" }, svg); t.textContent = nf(y, 2);
    }
    N("line", { x1: ml, x2: W - mr, y1: Y(0), y2: Y(0), "class": "g-axe" }, svg);
    var w = Math.max(1.2, Math.min(18, (W - ml - mr) / (n + 1) * 0.72)), pasX = n <= 12 ? 1 : n <= 30 ? 5 : 10;

/* Interactif : la loi binomiale, ses cumuls et ses intervalles */

  var c = WPB.cadre(el, "Explorer la loi binomiale", "de");

  var mode = WPB.liste(c.ctrl, "Probabilité cherchée", ["P(X = k)", "P(X ≤ k)", "P(X ≥ k)", "P(a ≤ X ≤ b)"]);
  var a = WPB.curseur(c.ctrl, "k (ou a)", 0, 20, 1, 6, function (v) { return v; });
  var b = WPB.curseur(c.ctrl, "b", 0, 20, 1, 9, function (v) { return v; });
  var lb = b.parentNode;
  var occupe = false;
  function maj() {
    if (occupe) return;
    var N = +n.value, P = +p.value, m = +mode.value;
    a.max = N; b.max = N; if (+a.value > N) a.value = N; if (+b.value > N) b.value = N;
    occupe = true; a.dispatchEvent(new Event("input")); b.dispatchEvent(new Event("input")); occupe = false;
    lb.style.display = m === 3 ? "" : "none";

    WPB.batons(c.scene, L, dans, { label: "Loi binomiale" });
    var s = 0; L.forEach(function (v, k) { if (dans(k)) s += v; });
    var lab = ["P(X=" + A + ")", "P(X\\leq " + A + ")", "P(X\\geq " + A + ")", "P(" + A + "\\leq X\\leq " + B + ")"][m];
    var formule = m === 0 ? " $=\\binom{" + N + "}{" + A + "}\\times" + WPB.nf(P, 2) + "^{" + A + "}\\times" + WPB.nf(1 - P, 2) + "^{" + (N - A) + "}$" : m === 2 && A > 0 ? " $=1-P(X\\leq " + (A - 1) + ")$" : m === 3 && A > 0 ? " $=P(X\\leq " + B + ")-P(X\\leq " + (A - 1) + ")$" : "";
    c.note.innerHTML = TeX.fmt("$X\\sim\\mathcal B(" + N + ";" + WPB.nf(P, 2) + ")$. $" + lab + "$" + formule + " $\\approx" + WPB.nf(s, 4) + "$. Barres rouges : valeurs comptées. Espérance $np=" + WPB.nf(N * P, 2) + "$ : le diagramme culmine près de cette valeur.");
  }
  [n, p, a, b].forEach(function (i) { i.addEventListener("input", maj); });
  mode.onchange = maj;

};

  premiere: R`
<ul><li><b>Chapitre 14</b> : pour un échantillon de taille $n$, $E(M_n)=\mu$ et $V(M_n)=\frac Vn$, $\sigma(M_n)=\frac\sigma{\sqrt n}$.</li>
<li><b>Valeur absolue</b> : $|x-\mu|<\delta\iff\mu-\delta<x<\mu+\delta$ ; $|x-\mu|\geq\delta\iff x\leq\mu-\delta$ ou $x\geq\mu+\delta$.</li>
<li><b>Événement contraire</b> : $P(|X-\mu|<\delta)=1-P(|X-\mu|\geq\delta)$.</li>
<li><b>Seconde</b> : la fluctuation d'échantillonnage ; la fréquence observée sur un échantillon de taille $n$ s'écarte en général de $p$ de moins de $\frac1{\sqrt n}$.</li></ul>`,
  cours: [
    { id: "bt", titre: "L'inégalité de Bienaymé-Tchebychev", html: R`
[thm|Inégalité de Bienaymé-Tchebychev]Soit $X$ une variable aléatoire d'espérance $\mu$ et de variance $V$. Pour tout réel $\delta>0$ :
$$P(|X-\mu|\geq\delta)\leq\frac{V}{\delta^2}.$$
De façon équivalente, par passage au contraire : $P(|X-\mu|<\delta)\geq1-\frac{V}{\delta^2}$.[/]
<p><b>Ce que ça dit.</b> La variance contrôle la probabilité des grands écarts : plus $V$ est petit, moins $X$ a de chances de s'éloigner de sa moyenne. Et l'inégalité vaut pour <b>n'importe quelle</b> loi : on n'a besoin que de $\mu$ et $V$.</p>
[ex|Un dé]$\mu=3{,}5$, $V=\frac{35}{12}$. $P(|X-3{,}5|\geq2)\leq\frac{35/12}{4}=\frac{35}{48}\approx0{,}73$. En réalité, $|X-3{,}5|\geq2$ signifie $X\in\{1;6\}$ : probabilité $\frac13$. La majoration est vraie, mais large.[/]
[ex|Une loi binomiale]$X\sim\mathcal B(100;0{,}5)$ : $\mu=50$, $V=25$. $P(|X-50|\geq10)\leq\frac{25}{100}=0{,}25$, alors que le calcul exact donne environ $0{,}057$.[/]
<div data-anim="tchebychev"></div>
[ex|Un intervalle (bac, Amérique du Nord, 20 mai 2026)]Un prix $Z$ a pour espérance $9$ € et pour écart type $2$ €. « Il y a au moins $50\,\%$ de chances que le prix soit strictement compris entre $6$ et $12$ € » : $P(6<Z<12)=P(|Z-9|<3)\geq1-\frac{4}{9}=\frac59\approx0{,}56$. Affirmation justifiée.[/]
[meth|Utiliser l'inégalité]<ol><li>Identifie $\mu$ et $V$ (variance, pas écart type).</li><li>Écris l'événement sous la forme $|X-\mu|\geq\delta$ ou $|X-\mu|<\delta$ : l'intervalle doit être <b>centré</b> sur $\mu$.</li><li>Applique : $\leq\frac V{\delta^2}$, ou $\geq1-\frac V{\delta^2}$ pour le contraire.</li></ol>[/]` },
    { id: "ecarttype", titre: "L'écart type, unité naturelle de dispersion", html: R`
[prop|En nombre d'écarts types]Avec $\delta=k\sigma$ ($k>0$) : $P(|X-\mu|\geq k\sigma)\leq\frac{\sigma^2}{k^2\sigma^2}=\frac1{k^2}$.[/]
<div class="tab-wrap"><table><tr><th>Écart</th><th>Bienaymé-Tchebychev (toute loi)</th><th>$\mathcal B(100;0{,}5)$, calcul exact</th></tr>
<tr><td>$\geq\sigma$ ($\geq5$)</td><td>$\leq1$ : n'apprend rien</td><td>$\approx0{,}368$</td></tr>
<tr><td>$\geq2\sigma$ ($\geq10$)</td><td>$\leq0{,}25$</td><td>$\approx0{,}057$</td></tr>
<tr><td>$\geq3\sigma$ ($\geq15$)</td><td>$\leq0{,}111$</td><td>$\approx0{,}004$</td></tr></table></div>
<p>Le programme insiste : <b>des écarts de l'ordre de $\sigma$ sont normaux</b>, des écarts de quelques $\sigma$ deviennent improbables. L'inégalité garantit au plus $\frac14$ pour $2\sigma$, alors que pour beaucoup de lois rencontrées la probabilité réelle est de l'ordre de $0{,}05$. Le prix de l'universalité, c'est la grossièreté de la borne.</p>
[piege|Une borne au-dessus de $1$]Si $\delta\leq\sigma$, alors $\frac V{\delta^2}\geq1$ : l'inégalité est vraie mais n'apporte rien (une probabilité est toujours $\leq1$).[/]` },
    { id: "concentration", titre: "L'inégalité de concentration", html: R`
[thm|Inégalité de concentration]Soit $M_n$ la moyenne d'un échantillon de taille $n$ d'une variable aléatoire d'espérance $\mu$ et de variance $V$. Pour tout $\delta>0$ :
$$P(|M_n-\mu|\geq\delta)\leq\frac{V}{n\delta^2}.$$[/]
<p><b>D'où ça vient.</b> C'est Bienaymé-Tchebychev appliquée à $M_n$, dont l'espérance est $\mu$ et la variance $\frac Vn$ (chapitre 14). Le $n$ au dénominateur dit tout : à précision $\delta$ fixée, la borne tend vers $0$ quand $n$ grandit.</p>
<div data-anim="lgn"></div>
[ex|La moyenne de $100$ lancers de dé]$P(|M_{100}-3{,}5|\geq0{,}5)\leq\frac{35/12}{100\times0{,}25}\approx0{,}117$ : il y a au moins $88\,\%$ de chances que la moyenne de $100$ lancers soit strictement comprise entre $3$ et $4$.[/]
[ex|Fréquence d'un événement]Si $X_i$ suit la loi de Bernoulli de paramètre $p$, $M_n=F_n$ est la fréquence des succès, $\mu=p$, $V=p(1-p)\leq\frac14$. Donc $P(|F_n-p|\geq\delta)\leq\frac{p(1-p)}{n\delta^2}\leq\frac1{4n\delta^2}$, quelle que soit la valeur (inconnue) de $p$.[/]` },
    { id: "taille", titre: "Choisir une taille d'échantillon", html: R`
[meth|Taille suffisante pour une précision $\delta$ et un risque $\alpha$]On veut $P(|M_n-\mu|\geq\delta)\leq\alpha$, ou, ce qui revient au même, $P(|M_n-\mu|<\delta)\geq1-\alpha$. Il <b>suffit</b> que $\frac{V}{n\delta^2}\leq\alpha$, c'est-à-dire
$$n\geq\frac{V}{\alpha\delta^2}.$$
On prend le plus petit entier qui convient. C'est une condition suffisante : une taille plus petite peut convenir aussi, l'inégalité ne permet simplement pas de l'affirmer.[/]
<div data-w="concentration"></div>
[ex|Un sondage]Estimer une proportion à $\delta=0{,}05$ près avec un risque $\alpha=0{,}05$ : $\frac{p(1-p)}{n\times0{,}0025}\leq\frac{0{,}25}{0{,}0025\,n}\leq0{,}05$ dès que $n\geq2\,000$. Le calcul exact avec la loi binomiale (pour $p=0{,}5$) montre que $n=1\,000$ donne déjà une probabilité d'écart d'environ $0{,}002$ : la garantie de Bienaymé-Tchebychev est prudente.[/]
[ex|Bac, Métropole, 16 juin 2026]$E(M_n)=120$, $V(M_n)=\frac{1\,728}n$. On veut $P(114<M_n<126)\geq0{,}85$, c'est-à-dire $P(|M_n-120|<6)\geq0{,}85$. L'inégalité donne $P(|M_n-120|<6)\geq1-\frac{1\,728}{36n}=1-\frac{48}n$. Il suffit que $1-\frac{48}n\geq0{,}85$, soit $\frac{48}n\leq0{,}15$, $n\geq320$. Plus petit entier : $n=320$ familles.[/]
[ex|Bac, Métropole, 17 juin 2025]$E(M_N)=7{,}14$, $V(M_N)=\frac{6{,}63}N$ ; on veut $P(7<M_N<7{,}28)\geq0{,}95$, soit $P(|M_N-7{,}14|<0{,}14)\geq0{,}95$. Il suffit que $\frac{6{,}63}{N\times0{,}14^2}\leq0{,}05$, soit $N\geq\frac{6{,}63}{0{,}05\times0{,}0196}\approx6\,765{,}3$ : $N=6\,766$.[/]` },
    { id: "lgn", titre: "La loi des grands nombres", html: R`
[thm|Loi (faible) des grands nombres]Soit $M_n$ la moyenne d'un échantillon de taille $n$ d'une variable aléatoire d'espérance $\mu$. Pour tout réel $\delta>0$ :
$$\lim_{n\to+\infty}P(|M_n-\mu|\geq\delta)=0.$$[/]
<p><b>Lecture.</b> Aussi petite que soit la précision $\delta$ choisie, la probabilité que la moyenne de l'échantillon s'écarte de $\mu$ d'au moins $\delta$ tend vers $0$. Appliquée aux fréquences : la fréquence d'apparition d'un événement dans $n$ répétitions indépendantes se rapproche de sa probabilité. C'est ce qui justifie l'estimation d'une probabilité par une fréquence, les sondages, et toutes les simulations de ce site.</p>
[ex|Une pièce équilibrée]Avec $n=10\,000$ lancers, $P(|F_n-0{,}5|\geq0{,}01)\leq\frac{0{,}25}{10\,000\times0{,}0001}=0{,}25$ (calcul exact : environ $0{,}047$) ; avec $n=1\,000\,000$, la borne devient $0{,}0025$.[/]
[piege|La « loi des séries » n'existe pas]Après dix « pile », la pièce n'a pas « besoin » de faire « face » : les lancers sont indépendants, la probabilité reste $\frac12$. La loi des grands nombres ne dit pas que les écarts se <b>compensent</b> : l'écart absolu $S_n-np$ est typiquement de l'ordre de $\sqrt n$, il peut grandir ; c'est l'écart <b>relatif</b> $\frac{S_n}n-p$, de l'ordre de $\frac1{\sqrt n}$, qui tend vers $0$.[/]
[hist|Le « théorème d'or »]Jacques Bernoulli démontre la loi des grands nombres pour les fréquences dans l'<i>Ars Conjectandi</i> (1713), qu'il appelait son « théorème d'or ». Bienaymé (1853, publication en 1867) puis Tchebychev (1867) établissent l'inégalité qui porte leurs noms ; elle donne une démonstration bien plus simple de la loi des grands nombres.[/]
<p><span class="tag hp">Pour aller plus loin</span> Exemples du programme : un sondage ($n=1\,000$), le rapport de masculinité à la naissance ($n=10^6$), la demi-vie d'atomes radioactifs ($n\approx10^{23}$ atomes : la proportion désintégrée au bout d'une demi-vie est si concentrée autour de $\frac12$ que la décroissance paraît parfaitement régulière).</p>` }

/* Interactif : borne de Bienaymé-Tchebychev contre probabilité exacte, pour une fréquence */
WIDGETS.concentration = function (el) {
  var c = WPB.cadre(el, "La borne et la vraie probabilité", "graphe");
  var n = WPB.curseur(c.ctrl, "Taille de l'échantillon n", 10, 1000, 10, 100, function (v) { return v; });
  var p = WPB.curseur(c.ctrl, "Probabilité p", 0.05, 0.95, 0.05, 0.5);
  var d = WPB.curseur(c.ctrl, "Précision δ", 0.01, 0.2, 0.01, 0.05);
  function loi(N, P) {
    var L = new Array(N + 1), lc = 0, lp = Math.log(P), lq = Math.log(1 - P);
    for (var k = 0; k <= N; k++) { L[k] = Math.exp(lc + k * lp + (N - k) * lq); lc += Math.log(N - k) - Math.log(k + 1); }
    return L;
  }
  function maj() {
    var N = +n.value, P = +p.value, D = +d.value, L = loi(N, P), hors = 0, ymax = 0;
    L.forEach(function (v, k) { if (Math.abs(k / N - P) >= D - 1e-12) hors += v; if (v > ymax) ymax = v; });
    var borne = P * (1 - P) / (N * D * D);
    var W = 360, H = 200, ml = 12, mr = 12, mt = 26, mb = 22, svg = WPB.N("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Loi de la fréquence" });
    c.scene.innerHTML = ""; c.scene.appendChild(svg);
    var X = function (f) { return ml + f * (W - ml - mr); }, Y = function (y) { return H - mb - y / (ymax * 1.1) * (H - mt - mb); };
    WPB.N("rect", { x: X(Math.max(0, P - D)), y: mt - 4, width: X(Math.min(1, P + D)) - X(Math.max(0, P - D)), height: H - mb - mt + 4, "class": "g-bande" }, svg);
    WPB.N("line", { x1: ml, x2: W - mr, y1: Y(0), y2: Y(0), "class": "g-axe" }, svg);
    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) { var t = WPB.N("text", { x: X(f), y: H - mb + 15, "text-anchor": "middle", "class": "g-txt" }, svg); t.textContent = WPB.nf(f, 2); });
    var w = Math.max(1, (W - ml - mr) / (N + 1) * 0.8);
    L.forEach(function (v, k) {
      if (v < ymax * 1e-3) return;
      var dehors = Math.abs(k / N - P) >= D - 1e-12;
      WPB.N("rect", { x: X(k / N) - w / 2, y: Y(v), width: w, height: Y(0) - Y(v), style: "fill:" + (dehors ? "var(--rouge)" : "var(--bleu)") + ";fill-opacity:" + (dehors ? 0.9 : 0.5) }, svg);
    });
    var t2 = WPB.N("text", { x: ml, y: 16, "class": "g-lab b" }, svg); t2.textContent = "loi de la fréquence F (n = " + N + ")";
    var nmin = Math.ceil(P * (1 - P) / (0.05 * D * D) - 1e-9);
    c.note.innerHTML = TeX.fmt("Bande jaune : $|F-p|<\\delta$. Barres rouges : les écarts d'au moins $\\delta$. Probabilité exacte $P(|F-p|\\geq" + WPB.nf(D, 2) + ")\\approx" + WPB.nf(hors, 4) + "$ ; borne de Bienaymé-Tchebychev $\\frac{p(1-p)}{n\\delta^2}\\approx" + WPB.nf(borne, 4) + "$" + (borne >= 1 ? " (au moins $1$ : elle n'apprend rien)" : "") + ". Pour un risque de $5\\,\\%$, l'inégalité garantit le résultat dès $n\\geq" + nmin + "$.");
  }
  [n, p, d].forEach(function (i) { i.addEventListener("input", maj); });
  maj();
};

<h2>La méthode, pas à pas</h2>

<h2>Un corrigé commenté</h2>
<p><b>Sujet : bac 2025, Métropole, 17 juin 2025 (sujet 1), exercice 4, partie A</b> (<a href="https://www.apmep.fr/IMG/pdf/Metro_J1_17_06_2025_DV.pdf" target="_blank" rel="noopener">sujet sur le site de l'APMEP</a>). Résumé de l'énoncé : la superficie (en hectares) recouverte par la posidonie au 1er juillet de l'année $2024+n$ est $u_n$, avec $u_0=1$ et $u_{n+1}=-0{,}02u_n^2+1{,}3u_n$. On note $h(x)=-0{,}02x^2+1{,}3x$, admise croissante sur $[0;20]$.</p>
<div class="boite ex"><span class="lab">Question 1 · Calculer $u_1$</span><div class="corps"><p>$u_1=h(u_0)=-0{,}02\times1^2+1{,}3\times1=1{,}28$. Au 1er juillet 2025, la posidonie recouvrirait $1{,}28$ ha.</p><p class="stylo">Commentaire : on conclut dans le contexte, avec l'unité.</p></div></div>
<div class="boite ex"><span class="lab">Question 2a · Montrer que $1\leq u_n\leq u_{n+1}\leq20$</span><div class="corps"><p>Pour $n\in\N$, $P(n)$ : « $1\leq u_n\leq u_{n+1}\leq20$ ».</p><p><b>Initialisation</b> : $u_0=1$ et $u_1=1{,}28$, donc $1\leq1\leq1{,}28\leq20$.</p><p><b>Hérédité</b> : soit $k\in\N$ tel que $1\leq u_k\leq u_{k+1}\leq20$. La fonction $h$ est croissante sur $[0;20]$, donc $h(1)\leq h(u_k)\leq h(u_{k+1})\leq h(20)$, c'est-à-dire $1{,}28\leq u_{k+1}\leq u_{k+2}\leq18$, d'où $1\leq u_{k+1}\leq u_{k+2}\leq20$.</p><p><b>Conclusion</b> : par récurrence, $P(n)$ est vraie pour tout $n\in\N$.</p><p class="stylo">Commentaire : c'est la question la plus rentable. Le correcteur attend le mot « croissante » et le calcul de $h(1)$ et $h(20)$.</p></div></div>
<div class="boite ex"><span class="lab">Question 2b · En déduire que $(u_n)$ converge</span><div class="corps"><p>D'après 2a, la suite est croissante ($u_n\leq u_{n+1}$) et majorée par $20$. Toute suite croissante et majorée converge : $(u_n)$ converge vers une limite $L$, et $1\leq L\leq20$.</p></div></div>
<div class="boite ex"><span class="lab">Question 2c · Justifier que $L=15$</span><div class="corps"><p>$h$ est continue sur $[0;20]$ (fonction polynôme) et $u_{n+1}=h(u_n)$ : la limite vérifie $h(L)=L$. Or $h(x)=x\iff-0{,}02x^2+0{,}3x=0\iff-0{,}02x(x-15)=0\iff x=0$ ou $x=15$. Comme $L\geq1$, $L=15$.</p><p class="stylo">Commentaire : l'argument « $h$ continue » est indispensable (chapitre 4) ; l'exclusion de $0$ grâce à $L\geq1$ aussi.</p></div></div>
<div class="boite ex"><span class="lab">Question 3 · Seuil de 14 hectares</span><div class="corps"><p>a. La suite converge vers $15>14$ : l'intervalle ouvert $]14;16[$ contient $15$, donc il contient tous les termes à partir d'un certain rang. La superficie finira par dépasser $14$ ha.</p><p>b. Algorithme complété :</p>
[py]
def seuil():
    n = 0
    u = 1
    while u <= 14:
        n = n + 1
        u = -0.02 * u**2 + 1.3 * u
    return n
[/py]
<p>Il renvoie $18$ (calcul refait en Python : $u_{17}\approx13{,}79$ et $u_{18}\approx14{,}12$) : la superficie dépassera $14$ ha au 1er juillet 2042.</p></div></div>

  function melange(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function questions(id) {
    if (id !== "tout") return PARCH[id].qcm.map(function (q) { q.ch = id; return q; });
    var t = [];
    REDIGES.forEach(function (c) { c.qcm.forEach(function (q) { q.ch = c.id; t.push(q); }); });
    return melange(t).slice(0, 20);
  }
  function monteQCM(el, liste) {
    var i = 0, bons = 0, rep = false;
    function rendu() {
      if (i >= liste.length) {
        el.innerHTML = '<div class="qcm"><div class="haut">Terminé</div><div class="score">' + bons + " / " + liste.length + '</div><p>' + (bons === liste.length ? "Parfait. Reviens dans quelques jours pour vérifier que c'est durable." : bons >= liste.length * 0.7 ? "Bien. Relis les paragraphes des questions manquées." : "Reprends le cours des questions manquées, puis recommence.") + '</p><div class="bas"><button class="btn plein" type="button" data-re>Recommencer</button></div></div>';
        $("[data-re]", el).onclick = function () { i = 0; bons = 0; if (el.getAttribute("data-qcm") === "tout") liste = melange(liste); rendu(); };
        return;
      }
      var q = liste[i]; rep = false;
      var h = '<div class="qcm"><div class="haut"><span>Question ' + (i + 1) + " / " + liste.length + '</span><span class="barre"><i style="width:' + (100 * i / liste.length) + '%"></i></span><span>' + bons + " ✓</span></div>";
      if (el.getAttribute("data-qcm") === "tout") h += '<div style="font-size:.78rem;color:var(--rouge);font-weight:600">' + esc(PARCH[q.ch].court) + "</div>";
      var ordre = melange(q.c.map(function (_, k) { return k; }));
      h += '<div class="q">' + F(q.q) + '</div><div class="opts">' + ordre.map(function (k, pos) { return '<button type="button" class="opt" data-k="' + k + '"><span class="l">' + "abcd"[pos] + "</span><span>" + F(q.c[k]) + "</span></button>"; }).join("") + '</div><div class="suite"></div></div>';
      el.innerHTML = h;
      $$(".opt", el).forEach(function (b) {
        b.onclick = function () {
          if (rep) return; rep = true;
          var k = +b.getAttribute("data-k"), ok = k === q.r;
          if (ok) bons++;
          $$(".opt", el).forEach(function (x) { x.disabled = true; var kk = +x.getAttribute("data-k"); if (kk === q.r) x.classList.add("ok"); else if (kk === k) x.classList.add("ko"); });
          var lien = q.ref ? '<a class="btn" href="#' + q.ch + "/cours/" + q.ref + '">' + ic("retour") + " Revoir le paragraphe</a>" : "";
          $(".suite", el).innerHTML = '<div class="expl"><span class="v ' + (ok ? "ok" : "ko") + '">' + (ok ? "Juste." : "Pas tout à fait.") + "</span> " + F(q.e) + '</div><div class="bas"><button class="btn plein" type="button" data-next>' + (i + 1 < liste.length ? "Question suivante" : "Voir le score") + "</button>" + lien + "</div>";
          $("[data-next]", el).onclick = function () { i++; rendu(); var t = el.getBoundingClientRect().top; if (t < 70) window.scrollBy(0, t - 120); };
          $("[data-next]", el).focus({ preventScroll: true });
        };
      });
    }
    rendu();
  }

  /* ---------- flashcards ---------- */
  function cartes(id) {
    if (id !== "tout") return PARCH[id].cartes.map(function (c) { return { r: c[0], v: c[1], ch: id }; });
    var t = [];
    REDIGES.forEach(function (c) { c.cartes.forEach(function (k) { t.push({ r: k[0], v: k[1], ch: c.id }); }); });
    return melange(t);
  }
  function monteCartes(el, paquet) {
    var file = paquet.slice(), su = 0, total = paquet.length;
    function rendu() {
      if (!file.length) {
        el.innerHTML = '<div class="qcm"><div class="score">' + total + " / " + total + '</div><p>Paquet terminé. Tu as su ' + su + " carte" + (su > 1 ? "s" : "") + " du premier coup.</p><button class=\"btn plein\" type=\"button\" data-re>Recommencer</button></div>";
        $("[data-re]", el).onclick = function () { file = melange(paquet); su = 0; rendu(); };
        return;
      }
      var k = file[0];
      el.innerHTML = '<div class="flash"><div style="font-size:.84rem;color:var(--encre2);margin-bottom:6px">Reste ' + file.length + " carte" + (file.length > 1 ? "s" : "") + (el.getAttribute("data-cartes") === "tout" ? " · " + esc(PARCH[k.ch].court) : "") +
        '</div><button type="button" class="carte" aria-label="Retourner la carte"><span class="face r"><small>Question</small><span>' + F(k.r) + '</span></span><span class="face v"><small>Réponse</small><span>' + F(k.v) + '</span></span></button><div class="nav"><button type="button" class="btn" data-tourne>Retourner</button><button type="button" class="btn rouge" data-rev disabled>À revoir</button><button type="button" class="btn plein" data-su disabled>Je savais</button></div></div>';
      var carte = $(".carte", el);
      function tourne() { carte.classList.toggle("tourne"); $("[data-rev]", el).disabled = false; $("[data-su]", el).disabled = false; }
      carte.onclick = tourne; $("[data-tourne]", el).onclick = tourne;
      $("[data-su]", el).onclick = function () { if (!k.vu) su++; file.shift(); rendu(); };
      $("[data-rev]", el).onclick = function () { k.vu = true; file.shift(); file.splice(Math.min(3, file.length), 0, k); rendu(); };
    }
    rendu();
  }

  /* ---------- montage après rendu ---------- */
  function monte(page) {
    $$("[data-qcm]", page).forEach(function (el) { monteQCM(el, questions(el.getAttribute("data-qcm"))); });
    $$("[data-cartes]", page).forEach(function (el) { monteCartes(el, cartes(el.getAttribute("data-cartes"))); });
    $$("[data-w]", page).forEach(function (el) { var f = WIDGETS[el.getAttribute("data-w")]; if (f) { try { f(el); } catch (e) { el.textContent = ""; } } });
    ANIM.arreter();
    $$("[data-anim]", page).forEach(function (el) { try { ANIM.monte(el, el.getAttribute("data-anim")); } catch (e) { if (window.console) console.error(e); } });
    $$("[data-copie]", page).forEach(function (b) {
      b.onclick = function () {
        var t = b.closest(".code").querySelector("pre").textContent;
        var fin = function () { b.textContent = "Copié"; setTimeout(function () { b.textContent = "Copier"; }, 1400); };
        if (navigator.clipboard) navigator.clipboard.writeText(t).then(fin, function () {}); else fin();
      };
    });
    $$("[data-imprime]", page).forEach(function (b) { b.onclick = function () { window.print(); }; });
    var f = $("[data-filtre]", page);
    if (f) $$("button", f).forEach(function (b) {
      b.onclick = function () {
        $$("button", f).forEach(function (x) { x.classList.toggle("on", x === b); });
        var id = b.getAttribute("data-f"), q = $("[data-qcm]", page), c = $("[data-cartes]", page);
        if (q) { q.setAttribute("data-qcm", id); monteQCM(q, questions(id)); }
        if (c) { c.setAttribute("data-cartes", id); monteCartes(c, cartes(id)); }
      };
    });
  }

  /* ---------- routeur ---------- */
  var main = $("#page"), menu = $("#menu");

  /* Formules trop larges (petits téléphones) : une formule en ligne ne passe pas à la ligne au milieu d'une racine
     ou d'une fraction ; si elle dépasse son bloc, on réduit sa taille (jusqu'à 70 %) au lieu de la laisser
     déborder. Toutes les mesures d'abord, puis toutes les écritures. */
  var attente = 0;
  function ajusteMaths() {
    attente = 0;
    var mesures = [];
    $$("math[data-ajuste]", main).forEach(function (m) { m.style.fontSize = ""; m.removeAttribute("data-ajuste"); });
    $$("math", main).forEach(function (m) {
      if (m.closest("svg, td, th, pre, .face")) return;
      if (m.getAttribute("display") === "block") { if (m.scrollWidth > m.clientWidth + 1) mesures.push([m, m.clientWidth / m.scrollWidth]); return; }
      var w = m.getBoundingClientRect().width; if (!w) return;
      var b = m.parentElement; while (b && /^inline/.test(getComputedStyle(b).display)) b = b.parentElement;
      if (!b) return;
      var cs = getComputedStyle(b), dispo = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      if (w > dispo + 1) mesures.push([m, (dispo - 2) / w]);
    });
    mesures.forEach(function (x) { x[0].style.fontSize = (1.08 * Math.max(0.7, x[1])).toFixed(3) + "em"; x[0].setAttribute("data-ajuste", ""); });
  }
  function planifieAjuste() { if (!attente) attente = requestAnimationFrame(ajusteMaths); }
  if ("MutationObserver" in window) new MutationObserver(function (ms) {
    for (var i = 0; i < ms.length; i++) { var c = ms[i].target; if (!(c.closest && c.closest("svg"))) { planifieAjuste(); return; } }
  }).observe(main, { childList: true, subtree: true });
  window.addEventListener("resize", planifieAjuste);
  D.addEventListener("toggle", planifieAjuste, true);
  function route() {
    var h = decodeURIComponent(location.hash.replace(/^#/, "")) || "accueil";
    var p = h.split("/"), html = "", actif = p[0], cible = null, titre = "CQFD";
    var c = PARCH[p[0]];
    if (c && c.statut === "ok") {
      var o = p[1] || "cours";
      if (!ONGLETS.some(function (x) { return x[0] === o; })) o = "cours";
      var corps = { cours: pageCours, demos: pageDemos, python: pagePython, methodes: pageMethodes, exercices: pageExos, retenir: pageRetenir, qcm: pageQCM, cartes: pageCartes }[o](c);
      html = enteteCh(c, o) + corps;
      var i = REDIGES.indexOf(c);
      html += '<div class="suivant no-print">' + (i > 0 ? '<a class="btn" href="#' + REDIGES[i - 1].id + '">← ' + esc(REDIGES[i - 1].court) + "</a>" : "") + (i < REDIGES.length - 1 ? '<a class="btn" style="justify-content:flex-end" href="#' + REDIGES[i + 1].id + '">' + esc(REDIGES[i + 1].court) + " →</a>" : "") + "</div>";
      if (p[2]) cible = c.id + "-" + p[2];
      titre = c.court + " · CQFD";
    } else if (c) { html = pageBientot(c); titre = c.court + " · CQFD"; }
    else if (p[0] === "epreuve") { html = PAGES.epreuve(); titre = "L'épreuve · CQFD"; }
    else if (p[0] === "ressources") { html = PAGES.ressources(); titre = "Ressources · CQFD"; }
    else if (p[0] === "entrainement") { html = pageEntrainement(p[1]); titre = "Entraînement · CQFD"; }
    else { html = pageAccueil(); actif = "accueil"; }
    html += '<div class="pied">CQFD — carnet de maths de Terminale, spécialité. Contenu original rédigé d\'après le programme officiel (BO spécial n° 8 du 25 juillet 2019) et la définition de l\'épreuve (BO spécial n° 4 du 17 septembre 2026). Vérifie toujours avec ton professeur.</div>';
    main.innerHTML = html;
    main.classList.remove("entre"); void main.offsetWidth; main.classList.add("entre");
    D.title = titre;
    $$("a", menu).forEach(function (a) { a.classList.toggle("on", a.getAttribute("href") === "#" + actif); });
    fermeMenu();
    monte(main);
    if (cible) {
      var el = D.getElementById(cible);
      if (el) { setTimeout(function () { el.scrollIntoView({ behavior: reduit ? "auto" : "smooth", block: "start" }); el.classList.remove("eclaire"); void el.offsetWidth; el.classList.add("eclaire"); }, 60); return; }
    }
    window.scrollTo(0, 0);
  }

  function construireMenu() {
    var h = '<a href="#accueil">' + ic("maison") + " Accueil</a>";
    var parties = [];
    CH.forEach(function (c) { if (parties.indexOf(c.partie) < 0) parties.push(c.partie); });
    parties.forEach(function (pt) {
      h += "<h6>" + esc(pt) + "</h6>";
      CH.filter(function (c) { return c.partie === pt; }).forEach(function (c) {
        h += '<a href="#' + c.id + '"' + (c.statut === "ok" ? "" : ' class="bientot"') + '><span class="num">' + c.num + "</span>" + esc(c.court) + "</a>";
      });
    });
    h += "<h6>Préparer le bac</h6>";
    h += '<a href="#entrainement">' + ic("cible") + " Entraînement</a>";
    h += '<a href="#epreuve">' + ic("copie") + " L'épreuve</a>";
    h += '<a href="#ressources">' + ic("livres") + " Ressources</a>";
    menu.innerHTML = h;
  }
  function ouvreMenu() { menu.classList.add("ouvert"); $("#voile").classList.add("ouvert"); }
  function fermeMenu() { menu.classList.remove("ouvert"); $("#voile").classList.remove("ouvert"); }

  /* ---------- thème (bascule non mémorisée) ---------- */
  var THEMES = ["auto", "clair", "sombre"], ti = 0;
  function majTheme() {
    var t = THEMES[ti];
    if (t === "auto") H.removeAttribute("data-theme"); else H.setAttribute("data-theme", t);
    var b = $("#bTheme");
    b.innerHTML = ic(t === "auto" ? "auto" : t === "clair" ? "soleil" : "lune");
    b.setAttribute("aria-label", "Thème : " + (t === "auto" ? "automatique" : t) + " (changer)");
    b.title = b.getAttribute("aria-label");
  }

  /* ---------- recherche ---------- */
  var INDEX = null;
  function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function indexer() {
    INDEX = [];
    function aj(titre, lieu, texte, url) { var t = TeX.plat(texte); INDEX.push({ titre: TeX.plat(titre), lieu: lieu, texte: t, n: norm(TeX.plat(titre) + " " + t), url: url }); }
    CH.forEach(function (c) {
      var lieu = c.num + ". " + c.court;
      if (c.statut !== "ok") { aj(c.titre, lieu + " · bientôt", (c.contenus || []).concat(c.capacites || []).join(" "), "#" + c.id); return; }
      aj(c.titre, lieu, c.essentiel.join(" "), "#" + c.id);
      c.cours.forEach(function (s) { aj(s.titre, lieu + " · cours", s.html, "#" + c.id + "/cours/" + s.id); });
      (c.pieges || []).forEach(function (p) { aj("Piège : " + p.t, lieu, p.h, "#" + c.id + "/cours/pieges"); });
      c.demos.forEach(function (d) { aj(d.t, lieu + " · démonstration", d.h, "#" + c.id + "/demos"); });
      c.algos.forEach(function (a) { aj(a.t, lieu + " · Python", (a.avant || "") + " " + a.code, "#" + c.id + "/python"); });
      c.methodes.forEach(function (m) { aj(m.t, lieu + " · méthode", m.h, "#" + c.id + "/methodes"); });
      c.exos.forEach(function (e, i) { aj("Exercice " + (i + 1) + (e.t ? " : " + e.t : ""), lieu + " · exercices", e.enonce, "#" + c.id + "/exercices"); });
      c.cartes.forEach(function (k) { aj(k[0], lieu + " · flashcard", k[1], "#" + c.id + "/cartes"); });
    });
    aj("L'épreuve écrite de spécialité", "Préparer le bac", PAGES.texteEpreuve, "#epreuve");
    aj("Ressources", "Préparer le bac", PAGES.texteRessources, "#ressources");
  }
  function chercher(q) {
    var mots = norm(q).split(/\s+/).filter(function (m) { return m.length > 1; });
    if (!mots.length) return [];
    var r = [];
    INDEX.forEach(function (e) {
      var ok = mots.every(function (m) { return e.n.indexOf(m) >= 0; });
      if (!ok) return;
      var s = 0, nt = norm(e.titre);
      mots.forEach(function (m) { if (nt.indexOf(m) >= 0) s += 5; });
      if (/cours/.test(e.lieu)) s += 1;
      r.push({ e: e, s: s });
    });
    r.sort(function (a, b) { return b.s - a.s; });
    return r.slice(0, 40).map(function (x) { return x.e; });
  }
  function surligne(txt, mots) {
    var t = esc(txt), n = norm(txt);
    var pos = [];
    mots.forEach(function (m) { var i = n.indexOf(m); if (i >= 0) pos.push([i, i + m.length]); });
    if (!pos.length) return t;
    pos.sort(function (a, b) { return a[0] - b[0]; });
    var out = "", d = 0;
    pos.forEach(function (p) { if (p[0] < d) return; out += esc(txt.slice(d, p[0])) + "<mark>" + esc(txt.slice(p[0], p[1])) + "</mark>"; d = p[1]; });
    return out + esc(txt.slice(d));
  }
  function extrait(e, mots) {
    var n = norm(e.texte), i = -1;
    mots.forEach(function (m) { var k = n.indexOf(m); if (k >= 0 && (i < 0 || k < i)) i = k; });
    var d = Math.max(0, i - 50), t = e.texte.slice(d, d + 160);
    return (d > 0 ? "… " : "") + surligne(t, mots) + (d + 160 < e.texte.length ? " …" : "");
  }
  var srch = $("#srch"), sq = $("#sq"), sres = $("#sres"), enAttente = null;
  function ouvreRecherche() {
    if (!INDEX) indexer();
    if (srch.classList.contains("on")) return;
    srch.classList.add("on"); srch.setAttribute("aria-hidden", "false");
    history.pushState({ srch: 1 }, "", location.href);
    sq.value = ""; sres.innerHTML = '<div class="vide">Tape un mot : récurrence, gendarmes, asymptote, dichotomie, Pascal…</div>';
    setTimeout(function () { sq.focus(); }, 30);
  }
  function fermeRecherche() { srch.classList.remove("on"); srch.setAttribute("aria-hidden", "true"); }
  sq.addEventListener("input", function () {
    var q = sq.value, mots = norm(q).split(/\s+/).filter(function (m) { return m.length > 1; });
    var r = chercher(q);
    if (!q.trim()) { sres.innerHTML = ""; return; }
    sres.innerHTML = r.length ? r.map(function (e) { return '<a class="r" href="' + e.url + '" data-url="' + e.url + '"><small>' + esc(e.lieu) + "</small><b>" + surligne(e.titre, mots) + "</b><span>" + extrait(e, mots) + "</span></a>"; }).join("") : '<div class="vide">Aucun résultat. Essaie un autre mot.</div>';
  });
  sres.addEventListener("click", function (ev) {
    var a = ev.target.closest("a.r"); if (!a) return;
    ev.preventDefault(); enAttente = a.getAttribute("data-url");
    fermeRecherche(); history.back();
  });
  $("#sx").onclick = function () { fermeRecherche(); history.back(); };
  window.addEventListener("popstate", function () {
    if (srch.classList.contains("on")) fermeRecherche();
    if (enAttente) { var u = enAttente; enAttente = null; setTimeout(function () { if (location.hash === u) route(); else location.hash = u; }, 0); }
  });
  D.addEventListener("keydown", function (e) {
    if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !/input|textarea|select/i.test((e.target.tagName || "")))) { e.preventDefault(); ouvreRecherche(); }
    else if (e.key === "Escape") { if (srch.classList.contains("on")) { fermeRecherche(); history.back(); } else fermeMenu(); }
  });

  /* ---------- démarrage ---------- */
  construireMenu();
  $("#bMenu").onclick = function () { menu.classList.contains("ouvert") ? fermeMenu() : ouvreMenu(); };
  $("#voile").onclick = fermeMenu;
  $("#bCherche").onclick = ouvreRecherche;
  $("#bTheme").onclick = function () { ti = (ti + 1) % 3; majTheme(); };
  majTheme();
  window.addEventListener("hashchange", route);
  route();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
})();

</script>
