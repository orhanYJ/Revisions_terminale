<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>import bac · NSI Terminale</title>
<meta name="description" content="Révisions de la spécialité NSI en Terminale : récursivité, programmation objet, listes, piles, files, modularité et mise au point. Cours, code Python testé, QCM, cartes mémoire, exercices type bac.">
<meta name="theme-color" content="#F8F6EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1114" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if(!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))document.documentElement.classList.add("mo");</script>
<style>
/* import bac — NSI Terminale. Thème « terminal » (sombre, ardoise) et « listing papier » (clair). */
:root{
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "SF Mono", "Fira Code", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
  --r: 10px;
  --side: 286px;
  --lh: 1.62em;
  /* clair : listing papier, encre bleue */
  --bg: #F8F6EC; --bg2: #FFFEF8; --bg3: #EFEDE0; --zebre: #E7F0DF;
  --ligne: #D9D5C3; --ligne2: #C7C2AC;
  --encre: #1D2346; --encre2: #565B73; --encre3: #7C8094;
  --vert: #17733F; --vert-f: #E1F0E2; --ambre: #9A5800; --ambre-f: #FBEBCF;
  --rouge: #B3261E; --rouge-f: #F9E3DF; --bleu: #1F3A9E; --bleu-f: #E4E9F8;
  --violet: #6B3FA0;
  --accent: var(--bleu); --sur-accent: #FFFFFF;
  --k-kw: #9A2F12; --k-str: #17733F; --k-num: #6B3FA0; --k-com: #7C8094; --k-fn: #1F3A9E; --k-bi: #0E6E85; --k-self: #9A5800; --k-op: #1D2346;
  --code-bg: #FFFEF6; --code-enc: #1D2346; --gout: #A39F88;
  --ombre: 0 1px 0 rgba(29,35,70,.05), 0 6px 18px rgba(29,35,70,.07);
  --scan: none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #0A1114; --bg2: #0F181C; --bg3: #142127; --zebre: #121E23;
    --ligne: #213239; --ligne2: #2C424A;
    --encre: #D6E5DC; --encre2: #93AAA3; --encre3: #6D847F;
    --vert: #4FE08C; --vert-f: #11291E; --ambre: #FFB547; --ambre-f: #2A2112; --rouge: #FF7A70; --rouge-f: #2C1513;
    --bleu: #7CC4FF; --bleu-f: #10202D; --violet: #C9A8FF;
    --accent: var(--vert); --sur-accent: #06110B;
    --k-kw: #FFB547; --k-str: #8FE3A8; --k-num: #C9A8FF; --k-com: #6D847F; --k-fn: #7CC4FF; --k-bi: #5FD7E0; --k-self: #FF9E7A; --k-op: #D6E5DC;
    --code-bg: #0C1518; --code-enc: #D6E5DC; --gout: #3E5A5F;
    --ombre: 0 0 0 1px rgba(79,224,140,.04), 0 8px 24px rgba(0,0,0,.35);
    --scan: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
  }
}
:root[data-theme="dark"]{
  --bg: #0A1114; --bg2: #0F181C; --bg3: #142127; --zebre: #121E23;
  --ligne: #213239; --ligne2: #2C424A;
  --encre: #D6E5DC; --encre2: #93AAA3; --encre3: #6D847F;
  --vert: #4FE08C; --vert-f: #11291E; --ambre: #FFB547; --ambre-f: #2A2112; --rouge: #FF7A70; --rouge-f: #2C1513;
  --bleu: #7CC4FF; --bleu-f: #10202D; --violet: #C9A8FF;
  --accent: var(--vert); --sur-accent: #06110B;
  --k-kw: #FFB547; --k-str: #8FE3A8; --k-num: #C9A8FF; --k-com: #6D847F; --k-fn: #7CC4FF; --k-bi: #5FD7E0; --k-self: #FF9E7A; --k-op: #D6E5DC;
  --code-bg: #0C1518; --code-enc: #D6E5DC; --gout: #3E5A5F;
  --ombre: 0 0 0 1px rgba(79,224,140,.04), 0 8px 24px rgba(0,0,0,.35);
  --scan: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:var(--scan);color:var(--encre);font-family:var(--sans);font-size:17px;line-height:1.6;overflow-x:hidden}
a{color:var(--bleu);text-underline-offset:3px}
button{font:inherit;color:inherit}
code,kbd,pre,.mono{font-family:var(--mono);font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
:not(pre)>code{font-size:.88em;background:var(--bg3);border:1px solid var(--ligne);border-radius:5px;padding:.05em .35em;overflow-wrap:anywhere}
kbd{font-size:.8em;border:1px solid var(--ligne2);border-bottom-width:2px;border-radius:5px;padding:0 .4em;background:var(--bg2)}
h1,h2,h3,h4{font-family:var(--mono);line-height:1.25;letter-spacing:-.01em}
h1{font-size:1.65rem;margin:.2em 0 .4em}
h2{font-size:1.22rem;margin:2.1em 0 .7em;padding-bottom:.35em;border-bottom:1px dashed var(--ligne2)}
h2::before{content:"## ";color:var(--ambre)}
h3{font-size:1.04rem;margin:1.6em 0 .5em}
h3::before{content:"### ";color:var(--encre3)}
p{margin:.65em 0}
ul,ol{padding-left:1.3em}
li{margin:.25em 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muet{color:var(--encre2)}
.petit{font-size:.88em}
:focus-visible{outline:3px solid var(--ambre);outline-offset:2px}

/* ---------- barre du haut ---------- */
.barre{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;height:56px;padding:0 10px 0 8px;background:var(--bg2);border-bottom:1px solid var(--ligne)}
.barre .feux{display:none;gap:7px;margin:0 10px 0 6px}
.barre .feux i{width:12px;height:12px;border-radius:50%;display:block;background:#E5675C}
.barre .feux i:nth-child(2){background:#E8B04A}.barre .feux i:nth-child(3){background:#5DBE6A}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border:0;background:transparent;border-radius:9px;cursor:pointer;color:var(--encre)}
.ib:hover{background:var(--bg3)}
.ib svg{width:22px;height:22px}
.marque{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--encre);font-family:var(--mono);font-weight:700;font-size:1.06rem;white-space:nowrap;min-height:44px}
.marque .kw{color:var(--k-kw)}
.marque .bac{color:var(--vert)}
.curseur{display:inline-block;width:.55em;height:1.05em;background:var(--vert);vertical-align:-.15em;margin-left:2px}
html.mo .curseur{animation:clignote 1.06s steps(1) infinite}
@keyframes clignote{50%{opacity:0}}
.onglet-fichier{flex:1;min-width:0;display:flex;justify-content:center}
.onglet-fichier span{font-family:var(--mono);font-size:.84rem;color:var(--encre2);border:1px solid var(--ligne);border-bottom:2px solid var(--ambre);border-radius:7px 7px 0 0;padding:4px 12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg)}
.btn-cherche{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--ligne);border-radius:9px;background:var(--bg);cursor:pointer;color:var(--encre2);font-family:var(--mono);font-size:.85rem}
.btn-cherche svg{width:18px;height:18px}
.btn-cherche .t{display:none}
@media (max-width:640px){.onglet-fichier{display:none}.marque{flex:1}.code pre{font-size:.76rem}.code pre .l::before{width:2em;padding-right:.6em;margin-right:.5em}}

/* ---------- mise en page ---------- */
.cadre{display:block}
.lat{position:fixed;z-index:75;top:0;bottom:0;left:0;width:min(86vw,var(--side));background:var(--bg2);border-right:1px solid var(--ligne);transform:translateX(-102%);visibility:hidden;overflow-y:auto;padding:12px 10px 90px;font-family:var(--mono);font-size:.9rem}
.lat.ouvert{transform:none;visibility:visible}
html.mo .lat{transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility .26s}
.voile{position:fixed;inset:0;z-index:74;background:rgba(5,10,12,.45);display:none}
.voile.on{display:block}
.lat .titre-lat{font-size:.72rem;letter-spacing:.12em;color:var(--encre3);margin:10px 8px 6px;text-transform:uppercase}
.lat a{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;border-radius:8px;color:var(--encre);text-decoration:none}
.lat a:hover{background:var(--bg3)}
.lat a.actif{background:var(--vert-f);color:var(--vert);box-shadow:inset 3px 0 0 var(--vert)}
.lat a svg{width:18px;height:18px;flex:none;color:var(--encre3)}
.lat a.actif svg{color:var(--vert)}
.lat .dossier{display:flex;align-items:center;gap:8px;padding:6px 10px;color:var(--encre2)}
.lat .dossier svg{width:18px;height:18px;color:var(--ambre)}
.lat .ind{padding-left:22px}
.lat .ind2{padding-left:34px}
.lat .num{margin-left:auto;font-size:.75rem;color:var(--encre3)}
.lat .pied-lat{margin:18px 10px 0;font-size:.75rem;color:var(--encre3);line-height:1.5}
main{min-width:0}
.page{max-width:820px;margin:0 auto;padding:18px 16px 110px}
.page.large{max-width:1060px}
@media (min-width:1000px){
  .cadre{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
  .lat{position:sticky;top:56px;height:calc(100vh - 56px);transform:none;visibility:visible;width:auto;z-index:1;padding-bottom:30px}
  .voile,.btn-menu{display:none!important}
  .barre .feux{display:flex}
  .btn-cherche .t{display:inline}
  .page{padding:26px 34px 110px}
}

/* ---------- invite de commande (en-tête de page) ---------- */
.invite{font-family:var(--mono);font-size:.86rem;color:var(--encre2);margin:4px 0 2px;overflow-wrap:anywhere}
.invite .u{color:var(--vert)}.invite .d{color:var(--bleu)}.invite .c{color:var(--encre)}
html.mo .invite .c.tape{display:inline-block;vertical-align:bottom;white-space:nowrap;overflow:hidden;animation:tape .9s steps(28,end) both}
@keyframes tape{from{max-width:0}to{max-width:100%}}
.soustitre{color:var(--encre2);margin:0 0 14px}
.etiq{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.74rem;border:1px solid var(--ligne2);border-radius:999px;padding:2px 10px;color:var(--encre2);background:var(--bg2)}
.etiq.v{color:var(--vert);border-color:var(--vert)}
.etiq.a{color:var(--ambre);border-color:var(--ambre)}

/* ---------- onglets de chapitre ---------- */
.onglets{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ligne);margin:14px -16px 18px;padding:0 16px;position:sticky;top:56px;z-index:30;background:var(--bg)}
.onglets::-webkit-scrollbar{display:none}
.onglets a{flex:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;font-family:var(--mono);font-size:.86rem;color:var(--encre2);text-decoration:none;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;margin-bottom:-1px}
.onglets a .x{color:var(--encre3)}
.onglets a.on{background:var(--bg2);border-color:var(--ligne);color:var(--encre);box-shadow:inset 0 2px 0 var(--ambre)}
@media (min-width:1000px){.onglets{margin:14px 0 22px;padding:0}}

/* ---------- blocs de texte ---------- */
.essentiel{border:1px solid var(--ligne);border-radius:var(--r);background:var(--code-bg);font-family:var(--mono);font-size:.9rem;padding:12px 14px;box-shadow:var(--ombre)}
.essentiel .t{color:var(--encre3);margin-bottom:6px}
.essentiel ol{margin:0;padding:0;list-style:none;counter-reset:e}
.essentiel li{counter-increment:e;display:grid;grid-template-columns:2.2em 1fr;margin:.35em 0;font-family:var(--sans);font-size:1rem}
.essentiel li::before{content:"[" counter(e) "]";font-family:var(--mono);color:var(--vert);font-size:.85em;padding-top:.15em}
.attendus{list-style:none;padding:0}
.attendus li{display:grid;grid-template-columns:1.6em 1fr;gap:4px}
.attendus li::before{content:"✓";font-family:var(--mono);color:var(--vert);font-weight:700}
.idee{position:relative;margin:28px 0;scroll-margin-top:120px}
.idee>h3{margin-top:0}
.idee .num-idee{font-family:var(--mono);font-size:.75rem;color:var(--encre3)}
.idee.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,30%{background:var(--ambre-f);box-shadow:0 0 0 10px var(--ambre-f)}100%{background:transparent;box-shadow:0 0 0 10px transparent}}
.boite{border:1px solid var(--ligne);border-left-width:4px;border-radius:var(--r);padding:10px 14px;margin:14px 0;background:var(--bg2)}
.boite>.lab{font-family:var(--mono);font-size:.78rem;font-weight:700;letter-spacing:.02em;margin-bottom:4px}
.boite>:last-child{margin-bottom:0}
.def{border-left-color:var(--vert)}.def>.lab{color:var(--vert)}
.ex{border-left-color:var(--bleu)}.ex>.lab{color:var(--bleu)}
.attention{border-left-color:var(--rouge);background:var(--rouge-f)}.attention>.lab{color:var(--rouge)}
.hp{border-style:dashed;border-left-style:solid;border-left-color:var(--violet)}.hp>.lab{color:var(--violet)}
.retenir-b{border-left-color:var(--ambre);background:var(--ambre-f)}.retenir-b>.lab{color:var(--ambre)}
.histoire{border-left-color:var(--ambre);font-size:.95rem}
.histoire>.lab{color:var(--ambre)}
.histoire .commit{font-family:var(--mono);font-size:.82rem;color:var(--ambre)}
.histoire .commit b{color:var(--encre2);font-weight:400}
.tab-wrap{overflow-x:auto;margin:12px 0;border:1px solid var(--ligne);border-radius:var(--r);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--ligne);text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:.8rem;color:var(--encre2);background:var(--bg3);white-space:nowrap}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
details.repli{border:1px solid var(--ligne);border-radius:var(--r);margin:14px 0;background:var(--bg2)}
details.repli>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;padding:6px 14px;font-family:var(--mono);font-size:.9rem;list-style:none}
details.repli>summary::-webkit-details-marker{display:none}
details.repli>summary::before{content:"▸";color:var(--ambre);font-size:.9em}
details.repli[open]>summary::before{content:"▾"}
details.repli>.corps{padding:0 14px 12px}

/* ---------- code ---------- */
.code{margin:14px 0;border:1px solid var(--ligne);border-radius:var(--r);overflow:hidden;background:var(--code-bg);box-shadow:var(--ombre)}
.code .tete{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;min-height:36px;border-bottom:1px solid var(--ligne);background:var(--bg3);font-family:var(--mono);font-size:.76rem;color:var(--encre2)}
.code .tete .f{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code .tete .f::before{content:"● ";color:var(--ambre)}
.code .tete button{border:0;background:transparent;color:var(--encre2);cursor:pointer;font-family:var(--mono);font-size:.74rem;min-height:44px;margin:-4px 0;padding:0 8px;border-radius:6px}
.code .tete button:hover{background:var(--bg2);color:var(--encre)}
.code pre{margin:0;overflow-x:auto;-webkit-overflow-scrolling:touch;font-size:.84rem;line-height:var(--lh);padding:8px 0;color:var(--code-enc);tab-size:4}
.code pre .l{display:block;padding:0 14px 0 0;min-width:max-content}
.code pre .l::before{content:attr(data-n);display:inline-block;width:2.4em;padding-right:.9em;margin-right:.6em;text-align:right;color:var(--gout);border-right:1px solid var(--ligne);user-select:none;-webkit-user-select:none}
.code.zebre pre .l:nth-child(6n+4),.code.zebre pre .l:nth-child(6n+5),.code.zebre pre .l:nth-child(6n+6){background:var(--zebre)}
.code pre .l.vise{background:var(--ambre-f)!important;box-shadow:inset 3px 0 0 var(--ambre)}
.code pre .l.trou{background:var(--bleu-f)!important}
.sortie{border-top:1px dashed var(--ligne2);background:var(--bg2)}
.sortie .tete{background:transparent;border-bottom:0;min-height:30px}
.sortie .tete .f::before{content:"$ ";color:var(--vert)}
.sortie pre{padding:2px 14px 10px;color:var(--encre)}
.sortie .err-t{color:var(--rouge)}
.k-kw{color:var(--k-kw);font-weight:600}.k-str{color:var(--k-str)}.k-num{color:var(--k-num)}.k-com{color:var(--k-com);font-style:italic}
.k-fn{color:var(--k-fn)}.k-bi{color:var(--k-bi)}.k-self{color:var(--k-self);font-style:italic}.k-cls{color:var(--k-fn);font-weight:700}.k-pr{color:var(--vert);font-weight:700}.k-dec{color:var(--violet)}.k-tr{color:var(--rouge)}
.console .l .k-pr{user-select:none}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--ligne2);background:var(--bg2);cursor:pointer;font-family:var(--mono);font-size:.86rem;color:var(--encre);text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.prim,a.btn.prim{background:var(--accent);color:var(--sur-accent);border-color:var(--accent);font-weight:700}
.btn.petit{min-height:44px;padding:0 12px;font-size:.8rem}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:default}
html.mo .btn:active{transform:translateY(1px) scale(.98)}
.rangee{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* ---------- accueil ---------- */
.heros{display:grid;gap:18px;margin:6px 0 10px}
.terminal{border:1px solid var(--ligne);border-radius:12px;background:var(--code-bg);box-shadow:var(--ombre);overflow:hidden}
.terminal .tete{display:flex;align-items:center;gap:7px;padding:0 12px;height:32px;background:var(--bg3);border-bottom:1px solid var(--ligne);font-family:var(--mono);font-size:.74rem;color:var(--encre3)}
.terminal .tete i{width:10px;height:10px;border-radius:50%;background:#E5675C;display:block}.terminal .tete i:nth-child(2){background:#E8B04A}.terminal .tete i:nth-child(3){background:#5DBE6A}
.terminal .tete span{margin-left:8px}
.terminal pre{margin:0;padding:12px 14px 14px;font-size:.86rem;line-height:1.7;overflow-x:auto;white-space:pre}
.terminal .pr{color:var(--vert);font-weight:700}.terminal .rep{color:var(--encre2)}.terminal .ok{color:var(--ambre)}
html.mo .terminal .ligne{display:block;opacity:0;animation:apparait .01s linear forwards}
@keyframes apparait{to{opacity:1}}
.heros h1{font-size:2.05rem;margin:0}
.heros h1 .kw{color:var(--k-kw)}.heros h1 .bac{color:var(--vert)}
.heros .acc{font-size:1.06rem;color:var(--encre2);margin:.4em 0 0}
@media (min-width:860px){.heros{grid-template-columns:1fr 1.05fr;align-items:center}}
.grille{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin:14px 0}
.carte-ch{display:flex;flex-direction:column;gap:6px;border:1px solid var(--ligne);border-radius:12px;padding:14px;background:var(--bg2);text-decoration:none;color:var(--encre);box-shadow:var(--ombre);min-height:44px;position:relative;overflow:hidden}
.carte-ch:hover{border-color:var(--accent)}
.carte-ch .fic{font-family:var(--mono);font-size:.78rem;color:var(--ambre)}
.carte-ch .nom{font-family:var(--mono);font-weight:700;font-size:1.02rem}
.carte-ch .desc{font-size:.9rem;color:var(--encre2)}
.carte-ch .pied{margin-top:auto;font-family:var(--mono);font-size:.74rem;color:var(--vert)}
html.mo .carte-ch{transition:transform .18s,border-color .18s}
html.mo .carte-ch:hover{transform:translateY(-2px)}
.rubrique{margin:16px 0;border:1px solid var(--ligne);border-radius:12px;overflow:hidden;background:var(--bg2)}
.rubrique>.tete{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--ligne);font-family:var(--mono);font-size:.9rem;font-weight:700}
.rubrique>.tete .n{color:var(--ambre)}
.item-prog{border-bottom:1px solid var(--ligne);scroll-margin-top:70px}
.item-prog:last-child{border-bottom:0}
.item-prog>summary,.item-prog>a{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 14px;cursor:pointer;list-style:none;color:var(--encre);text-decoration:none}
.item-prog>summary::-webkit-details-marker{display:none}
.item-prog .st{flex:none;font-family:var(--mono);font-size:.7rem;border-radius:999px;padding:1px 8px;border:1px solid}
.item-prog .st.ok{color:var(--vert);border-color:var(--vert)}
.item-prog .st.bt{color:var(--encre3);border-color:var(--ligne2)}
.item-prog .ti{flex:1}
.item-prog .corps{padding:2px 14px 14px;font-size:.93rem}
.item-prog .corps h4{font-size:.8rem;color:var(--encre2);margin:10px 0 4px}
.item-prog .corps h4::before{content:"# ";color:var(--encre3)}

/* ---------- QCM ---------- */
.qcm-score{position:sticky;top:104px;z-index:20;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.86rem;padding:8px 12px;border:1px solid var(--ligne);border-radius:10px;background:var(--bg2);margin-bottom:14px}
.qcm-score .barre-p{flex:1;min-width:24px;height:8px;border-radius:5px;background:var(--bg3);overflow:hidden}
.qcm-score .barre-p i{display:block;height:100%;background:var(--vert);width:0}
html.mo .qcm-score .barre-p i{transition:width .35s}
.q{border:1px solid var(--ligne);border-radius:12px;padding:12px 14px;margin:14px 0;background:var(--bg2)}
.q .enonce{font-weight:600}
.q .enonce .nq{font-family:var(--mono);color:var(--ambre);font-weight:700;margin-right:6px}
.q .choix{display:grid;gap:8px;margin-top:10px}
.q .choix button{display:flex;align-items:flex-start;gap:10px;text-align:left;min-height:44px;padding:10px 12px;border-radius:9px;border:1px solid var(--ligne2);background:var(--bg);cursor:pointer;line-height:1.45}
.q .choix button .lt{font-family:var(--mono);font-weight:700;color:var(--encre3)}
.q .choix button:hover:not(:disabled){border-color:var(--accent)}
.q .choix button.bon{border-color:var(--vert);background:var(--vert-f)}
.q .choix button.bon .lt{color:var(--vert)}
.q .choix button.faux{border-color:var(--rouge);background:var(--rouge-f)}
.q .choix button.faux .lt{color:var(--rouge)}
.q .choix button:disabled{cursor:default}
.q .expl{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--bg3);font-size:.95rem}
.q .expl .v{font-family:var(--mono);font-weight:700}
.q .expl .v.ok{color:var(--vert)}.q .expl .v.ko{color:var(--rouge)}
.q .lien-revoir{display:inline-flex;align-items:center;gap:6px;margin-top:6px;min-height:44px;font-family:var(--mono);font-size:.84rem}
.q .lien-revoir svg{width:16px;height:16px;flex:none}
.qcm-score .sc{white-space:nowrap}
.qcm-score .btn{flex:none;padding:0 10px}
@media (max-width:420px){.qcm-score{gap:8px;padding:6px 10px;font-size:.78rem}}
html.mo .q.repondu.ok{animation:pouls .45s}
html.mo .q.repondu.ko{animation:secoue .35s}
@keyframes pouls{50%{box-shadow:0 0 0 6px var(--vert-f)}}
@keyframes secoue{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ---------- cartes mémoire ---------- */
.fc-zone{display:grid;gap:12px;justify-items:center}
.fc{display:block;width:100%;max-width:560px;min-height:230px;perspective:1100px;cursor:pointer;border:0;padding:0;background:transparent;color:inherit;font:inherit}
.fc .in{display:block;position:relative;width:100%;min-height:230px;transform-style:preserve-3d}
html.mo .fc .in{transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.fc.tourne .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:18px 20px;border-radius:14px;border:1px solid var(--ligne);background:var(--bg2);box-shadow:var(--ombre);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:left;overflow:auto}
.fc .face .lab{font-family:var(--mono);font-size:.74rem;color:var(--encre3)}
.fc .face .txt{font-size:1.08rem}
.fc .recto .txt{font-family:var(--mono);font-weight:700;font-size:1.12rem}
.fc .verso{transform:rotateY(180deg);background:var(--code-bg);border-color:var(--vert)}
.fc-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-family:var(--mono);font-size:.86rem}

/* ---------- exercices ---------- */
.exo{border:1px solid var(--ligne);border-radius:12px;margin:18px 0;background:var(--bg2);overflow:hidden}
.exo>.tete{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--ligne)}
.exo>.tete .t{font-family:var(--mono);font-weight:700;flex:1;min-width:12em}
.exo>.corps{padding:4px 14px 14px}
.exo .question{margin:14px 0 6px;font-weight:600}
.exo .question .nq{font-family:var(--mono);color:var(--ambre);margin-right:6px}
.reponse{margin:8px 0;border:1px dashed var(--ligne2);border-radius:10px}
.reponse>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;font-family:var(--mono);font-size:.85rem;color:var(--vert);list-style:none}
.reponse>summary::-webkit-details-marker{display:none}
.reponse>summary::before{content:"▸ ";}
.reponse[open]>summary::before{content:"▾ ";}
.reponse>.corps{padding:0 12px 10px}
.bareme{font-family:var(--mono);font-size:.76rem;color:var(--ambre)}

/* ---------- widgets ---------- */
.w{border:1px solid var(--ligne2);border-radius:14px;margin:18px 0;background:var(--bg2);box-shadow:var(--ombre);overflow:hidden}
.w>.tete{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--ligne);font-family:var(--mono);font-size:.85rem}
.w>.tete .lab{color:var(--vert);font-weight:700}
.w>.tete .lab::before{content:"▶ "}
.w>.corps{padding:12px 14px}
.w .choix-w{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.w .choix-w button{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--ligne2);background:var(--bg);cursor:pointer;font-family:var(--mono);font-size:.8rem}
.w .choix-w button.on{background:var(--accent);color:var(--sur-accent);border-color:var(--accent)}
.w .msg{font-size:.95rem;padding:10px 12px;border-radius:10px;background:var(--bg3);min-height:3.2em;margin:10px 0}
.w .msg b{font-family:var(--mono)}
.w .cmd{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.w .cmd .cpt{font-family:var(--mono);font-size:.8rem;color:var(--encre2);margin-left:auto}
.w input[type=text]{font:inherit;font-family:var(--mono);min-height:44px;width:7em;padding:0 10px;border-radius:9px;border:1px solid var(--ligne2);background:var(--bg);color:var(--encre)}
/* pile d'appels */
.pa{display:grid;gap:12px}
@media (min-width:720px){.pa{grid-template-columns:1.15fr 1fr}}
.pa .code{margin:0}
.pa .pile{display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:6px;min-height:210px;padding:10px;border:1px dashed var(--ligne2);border-radius:10px;background:var(--bg);position:relative}
.pa .pile::after{content:"fond de la pile";position:absolute;bottom:-1px;left:50%;transform:translate(-50%,50%);font-family:var(--mono);font-size:.68rem;color:var(--encre3);background:var(--bg2);padding:0 6px}
.pa .pile .vide{font-family:var(--mono);font-size:.8rem;color:var(--encre3);text-align:center;margin:auto}
.cadre-pile{font-family:var(--mono);font-size:.8rem;border:1px solid var(--ligne2);border-left:4px solid var(--bleu);border-radius:8px;padding:6px 10px;background:var(--bg2)}
.cadre-pile .nm{font-weight:700}
.cadre-pile .vr{color:var(--encre2)}
.cadre-pile.actif{border-left-color:var(--ambre);background:var(--ambre-f)}
.cadre-pile.renvoie{border-left-color:var(--vert);background:var(--vert-f)}
.cadre-pile .rv{color:var(--vert);font-weight:700}
html.mo .cadre-pile.neuf{animation:empile .32s cubic-bezier(.2,.8,.2,1)}
@keyframes empile{from{transform:translateY(-14px);opacity:0}}
.titre-pile{font-family:var(--mono);font-size:.76rem;color:var(--encre2);margin-bottom:4px}
.arbre-appels{margin-top:10px;overflow-x:auto;border:1px dashed var(--ligne2);border-radius:10px;background:var(--bg)}
.arbre-appels svg{display:block;min-width:520px;width:100%;height:auto}
.arbre-appels text{font-family:var(--mono);font-size:12px;fill:var(--encre)}
.arbre-appels .nd rect{fill:var(--bg2);stroke:var(--ligne2)}
.arbre-appels .nd.attente rect{stroke:var(--bleu)}
.arbre-appels .nd.actif rect{fill:var(--ambre-f);stroke:var(--ambre);stroke-width:2}
.arbre-appels .nd.fini rect{fill:var(--vert-f);stroke:var(--vert)}
.arbre-appels .nd.cache{opacity:.16}
.arbre-appels line{stroke:var(--ligne2);stroke-width:1.5}
.arbre-appels line.vu{stroke:var(--encre3)}
/* pile / file manipulables */
.pf{display:grid;gap:12px}
@media (min-width:720px){.pf{grid-template-columns:1fr 1fr}}
.scene-pf{min-height:250px;border:1px dashed var(--ligne2);border-radius:10px;background:var(--bg);padding:12px;display:flex;align-items:center;justify-content:center;overflow-x:auto}
.tube{display:flex;flex-direction:column-reverse;gap:6px;width:150px;min-height:220px;padding:8px;border:3px solid var(--encre3);border-top:0;border-radius:0 0 12px 12px}
.tube.file{flex-direction:row;width:auto;min-width:100%;min-height:70px;border:3px solid var(--encre3);border-left:0;border-right:0;border-radius:0;align-items:center;padding:8px 6px}
.elt{font-family:var(--mono);font-weight:700;display:flex;align-items:center;justify-content:center;height:40px;min-width:54px;border-radius:8px;background:var(--bleu-f);border:2px solid var(--bleu);color:var(--encre)}
.elt.haut{border-color:var(--ambre);background:var(--ambre-f)}
html.mo .elt.entre{animation:entre-p .3s cubic-bezier(.2,.8,.2,1)}
html.mo .tube.file .elt.entre{animation:entre-f .3s cubic-bezier(.2,.8,.2,1)}
@keyframes entre-p{from{transform:translateY(-40px);opacity:0}}
@keyframes entre-f{from{transform:translateX(40px);opacity:0}}
.repere{font-family:var(--mono);font-size:.7rem;color:var(--encre3);text-align:center}
.journal{font-family:var(--mono);font-size:.8rem;line-height:1.6;background:var(--code-bg);border:1px solid var(--ligne);border-radius:10px;padding:8px 10px;height:220px;overflow:auto;white-space:pre-wrap}
.journal .p{color:var(--vert)}.journal .e{color:var(--rouge)}.journal .r{color:var(--encre2)}
/* liste chaînée */
.lc{overflow-x:auto;border:1px dashed var(--ligne2);border-radius:10px;background:var(--bg);padding:10px 6px;-webkit-overflow-scrolling:touch}
.lc svg{display:block;height:auto}
.lc text{font-family:var(--mono);font-size:14px;fill:var(--encre)}
.lc .mai rect{fill:var(--bg2);stroke:var(--bleu);stroke-width:2}
.lc .mai.visite rect{fill:var(--ambre-f);stroke:var(--ambre)}
.lc .mai .sep{stroke:var(--bleu);stroke-width:2}
.lc .fl{stroke:var(--encre2);stroke-width:2;fill:none}
.lc .pt{fill:var(--encre2)}
.lc .none{fill:var(--encre3);font-size:13px}
.lc .tete-l{fill:var(--vert);font-size:12px;font-weight:700}
html.mo .lc .mai.neuf{animation:pop .35s cubic-bezier(.2,.9,.3,1.3);transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* UML */
.uml{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.uml .svgz{overflow-x:auto;border:1px dashed var(--ligne2);border-radius:10px;background:var(--bg)}
.uml .svgz svg{display:block;width:100%;height:auto;max-height:520px}
.uml .svgz text{font-family:var(--mono);font-size:13px;fill:var(--encre)}
.uml .cl rect{fill:var(--bg2);stroke:var(--encre2);stroke-width:1.5}
.uml .cl .bandeau{fill:var(--bleu-f)}
.uml .cl .sep{stroke:var(--encre2);stroke-width:1}
.uml .ob rect{fill:var(--vert-f);stroke:var(--vert);stroke-width:1.5}
.uml .ob .titre{font-weight:700;text-decoration:underline}
.uml .nomvar rect{fill:var(--ambre-f);stroke:var(--ambre)}
.uml .lien{stroke:var(--encre3);stroke-width:1.5;fill:none}
.uml .lien.inst{stroke-dasharray:5 4}
.uml .lien.ref{stroke:var(--ambre);stroke-width:2}
.uml .tete-f{fill:var(--encre3)}.uml .tete-ref{fill:var(--ambre)}
.uml .maj{fill:var(--ambre)!important;font-weight:700}
html.mo .uml .trace{stroke-dasharray:var(--len,600);stroke-dashoffset:0;animation:trace .7s ease-out}
@keyframes trace{from{stroke-dashoffset:var(--len,600)}}
html.mo .uml .ob.neuf,html.mo .uml .nomvar.neuf{animation:fondu .45s ease-out}
@keyframes fondu{from{opacity:0;transform:translateY(6px)}}
.uml .legende{font-size:.85rem;color:var(--encre2)}

/* ---------- recherche plein écran ---------- */
#srch{position:fixed;inset:0;z-index:90;display:none;background:var(--bg);background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#srch.on{display:block}
#srch .boite-r{max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:12px 16px}
#srch .champ{display:flex;align-items:center;gap:8px;border:1px solid var(--accent);border-radius:12px;background:var(--bg2);padding:0 6px 0 12px;box-shadow:var(--ombre)}
#srch .champ .pr{font-family:var(--mono);color:var(--vert);font-weight:700}
#srch input{flex:1;min-width:0;border:0;background:transparent;color:var(--encre);font-family:var(--mono);font-size:1.05rem;height:52px;outline:none}
#srch .res{flex:1;overflow-y:auto;margin-top:12px;padding-bottom:40px}
#srch .res a{display:block;padding:10px 12px;border-radius:10px;border:1px solid transparent;text-decoration:none;color:var(--encre);margin-bottom:4px;background:var(--bg2)}
#srch .res a:hover,#srch .res a.sel{border-color:var(--accent)}
#srch .res .o{display:block;font-family:var(--mono);font-size:.74rem;color:var(--ambre)}
#srch .res .x{display:block;font-size:.88rem;color:var(--encre2);margin-top:2px}
#srch .res mark{background:var(--ambre-f);color:inherit;border-radius:3px}
#srch .aide{font-family:var(--mono);font-size:.8rem;color:var(--encre3);padding:14px 4px}

/* ---------- divers ---------- */
.pied{border-top:1px dashed var(--ligne2);margin-top:44px;padding-top:14px;font-size:.82rem;color:var(--encre3);font-family:var(--mono)}
.nav-ch{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px}
.fiche{border:1px solid var(--ligne);border-radius:12px;padding:6px 18px 16px;background:var(--bg2)}
.fiche h2{margin-top:1.2em}
.liens li{margin:.55em 0}
.liens .src{font-family:var(--mono);font-size:.74rem;color:var(--encre3)}
.gratuit{font-family:var(--mono);font-size:.7rem;color:var(--vert);border:1px solid var(--vert);border-radius:999px;padding:0 7px;margin-left:4px;white-space:nowrap}
.payant{font-family:var(--mono);font-size:.7rem;color:var(--encre3);border:1px solid var(--ligne2);border-radius:999px;padding:0 7px;margin-left:4px;white-space:nowrap}
.chiffres{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:12px 0}
.chiffres div{border:1px solid var(--ligne);border-radius:12px;padding:12px;background:var(--bg2)}
.chiffres b{display:block;font-family:var(--mono);font-size:1.45rem;color:var(--vert)}
.chiffres span{font-size:.86rem;color:var(--encre2)}
.copie{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.copie .ligne-c>*{min-width:0}
@media (min-width:760px){.copie .ligne-c{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}}
.copie .marge{font-size:.9rem;border-left:3px solid var(--rouge);padding:4px 10px;color:var(--rouge);font-style:italic;background:var(--rouge-f);border-radius:0 8px 8px 0;align-self:start}
.copie .marge.ok{border-color:var(--vert);color:var(--vert);background:var(--vert-f)}

@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    --bg:#fff;--bg2:#fff;--bg3:#F1F0E8;--zebre:#EEF4EA;--ligne:#CFCBB8;--ligne2:#BDB8A2;--encre:#111;--encre2:#444;--encre3:#666;
    --vert:#17733F;--vert-f:#E1F0E2;--ambre:#9A5800;--ambre-f:#FBEBCF;--rouge:#B3261E;--rouge-f:#F9E3DF;--bleu:#1F3A9E;--bleu-f:#E4E9F8;--violet:#6B3FA0;
    --k-kw:#9A2F12;--k-str:#17733F;--k-num:#6B3FA0;--k-com:#666;--k-fn:#1F3A9E;--k-bi:#0E6E85;--k-self:#9A5800;--k-op:#111;--code-bg:#fff;--code-enc:#111;--gout:#999;--scan:none;--ombre:none}
  body{background:#fff;color:#000;font-size:11pt}
  .code .tete button,.curseur{display:none!important}
  .barre,.lat,.voile,.onglets,.asr-btn,#srch,.rangee,.pied,.nav-ch,.no-print{display:none!important}
  .cadre{display:block}
  .page{max-width:none;padding:0}
  .fiche{border:0;padding:0}
  .code,.boite{box-shadow:none;break-inside:avoid}
  h2{break-after:avoid}
  a{color:#000}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* entrée de page (mouvement seulement si html.mo ; le contenu reste visible sans animation) */
html.mo .page.entree>*{animation:monte .32s cubic-bezier(.2,.8,.2,1)}
html.mo .page.entree>*:nth-child(n+6){animation-duration:.45s}
@keyframes monte{from{opacity:.25;transform:translateY(8px)}}
html.mo .essentiel li{animation:monte .4s cubic-bezier(.2,.8,.2,1) backwards}
html.mo .essentiel li:nth-child(2){animation-delay:.05s}html.mo .essentiel li:nth-child(3){animation-delay:.1s}html.mo .essentiel li:nth-child(4){animation-delay:.15s}html.mo .essentiel li:nth-child(5){animation-delay:.2s}
/* lecteur commun des animations */
.w.anim .scene{min-height:120px;border:1px dashed var(--ligne2);border-radius:10px;background:var(--bg);padding:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.w.anim .scene svg{display:block;max-width:100%;height:auto;margin:0 auto}
.w>.tete .sous{margin-left:auto;color:var(--encre3);font-size:.76rem}
.w .cmd .cpt.mono{font-family:var(--mono);white-space:nowrap}
.res-sql{margin:0;border:0;border-radius:0}
.res-sql table{font-family:var(--mono);font-size:.82rem;width:auto;min-width:50%}
.res-sql th,.res-sql td{padding:5px 12px}
/* animation : table de hachage */
.hash-calc{font-size:.8rem;color:var(--ambre);background:var(--ambre-f);border-radius:8px;padding:6px 10px;margin-bottom:8px;overflow-wrap:anywhere}
.hash-table{display:grid;gap:4px}
.hash-table .bk{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:38px;padding:3px 6px;border-radius:8px;border:1px solid var(--ligne)}
.hash-table .bk.vise{border-color:var(--ambre);box-shadow:inset 3px 0 0 var(--ambre)}
.hash-table .ix{color:var(--encre3);font-size:.78rem;width:2.4em}
.hash-table .vide{color:var(--encre3);font-size:.74rem}
.hash-table .lien-c{color:var(--encre3)}
.puce{display:inline-flex;align-items:center;font-family:var(--mono);font-size:.8rem;padding:3px 9px;border-radius:999px;border:1.5px solid var(--bleu);background:var(--bleu-f);color:var(--encre)}
.puce.vu{border-color:var(--ambre);background:var(--ambre-f)}
.puce.trouve{border-color:var(--vert);background:var(--vert-f);font-weight:700}
.puce.passe{opacity:.55}
.puce.neuf{border-color:var(--vert)}
html.mo .puce.neuf,html.mo .puce.vu,html.mo .puce.trouve{animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.hash-liste{display:flex;flex-wrap:wrap;gap:6px}
/* tables de base de données */
.table-bd{display:inline-block;vertical-align:top;margin:6px 8px 6px 0;max-width:100%}
.table-bd table{width:auto;font-size:.82rem}
.table-bd th,.table-bd td{padding:5px 10px}
.table-bd caption{caption-side:top;text-align:left;font-weight:700;color:var(--ambre);padding:6px 10px 2px}
.table-bd th.pk{text-decoration:underline;text-underline-offset:3px;color:var(--encre)}

class Duree:
    """Une durée stockée en secondes (entier positif ou nul)."""

    def __init__(self, heures, minutes, secondes):
        self.total = heures * 3600 + minutes * 60 + secondes

    def en_hms(self):
        h = self.total // 3600
        m = (self.total % 3600) // 60
        s = self.total % 60
        return (h, m, s)

    def ajouter(self, autre):
        return Duree(0, 0, self.total + autre.total)   # nouvel objet, self intact

    def est_plus_longue(self, autre):
        return self.total > autre.total

def test_duree():

    assert Duree(1, 2, 3).en_hms() == (1, 2, 3)

    assert Duree(0, 59, 59).ajouter(Duree(0, 0, 1)).en_hms() == (1, 0, 0)

class Parking:
    def __init__(self, nb_places):
        self.places = [None] * nb_places

    def nb_libres(self):
        n = 0
        for p in self.places:
            if p is None:
                n = n + 1
        return n

    def est_plein(self):
        return self.nb_libres() == 0

    def garer(self, vehicule):
        for i in range(len(self.places)):
            if self.places[i] is None:
                self.places[i] = vehicule
                return i
        return -1

    def sortir(self, immat):
        for i in range(len(self.places)):
            v = self.places[i]
            if v is not None and v.immat == immat:
                self.places[i] = None
                return True
        return False

    def nb_motos(self):
        return len([v for v in self.places if v is not None and v.categorie == "moto"])

    { id: "i1", t: "Pourquoi des objets ?", h: `
<p>Jusqu’ici, tu as représenté des données avec des types construits (listes, tuples, dictionnaires) et tu les as traitées avec des fonctions séparées. Ça marche, mais rien ne relie les données à leurs traitements, et rien n’empêche une incohérence :</p>
[[c1-dict]]
<p>La <b>programmation orientée objet</b> (POO) regroupe dans un même type les <b>données</b> (attributs) et les <b>traitements</b> (méthodes) qui leur sont propres. On fabrique ainsi ses propres types, avec une interface claire : « voilà ce qu’on peut faire avec un compte ».</p>
<p>En Python, tu utilises déjà des objets sans le savoir : un entier, une chaîne, une liste sont des objets, et <code>append</code> ou <code>upper</code> sont des méthodes.</p>
[[c1-deja]]
<div class="boite histoire"><div class="lab"># git log --histoire</div>
<p><span class="commit">1967 <b>·</b></span> Ole-Johan Dahl et Kristen Nygaard (Oslo) créent <b>Simula 67</b>, premier langage à classes et objets, pour des simulations.<br>
<span class="commit">années 1970 <b>·</b></span> Alan Kay et son équipe du Xerox PARC développent <b>Smalltalk</b> et popularisent l’expression « programmation orientée objet ».<br>
<span class="commit">1991 <b>·</b></span> Guido van Rossum publie <b>Python</b>, où toute valeur est un objet.</p></div>` },

    { id: "i2", t: "Classe et objet (instance)", h: `
<div class="boite def"><div class="lab">"""définitions"""</div>
<p>Une <b>classe</b> définit un nouveau type : elle décrit les attributs et les méthodes communs à tous ses objets.<br>
Un <b>objet</b>, ou <b>instance</b>, est une valeur de ce type, créée par <b>instanciation</b> : <code>Compte("Ada", 100)</code>.<br>
Un <b>attribut</b> est une variable attachée à un objet ; une <b>méthode</b> est une fonction définie dans la classe.</p></div>
<p>Exemple fil rouge : un compte bancaire. Par convention, le nom d’une classe commence par une majuscule (<code>Compte</code>, <code>ListeChainee</code>).</p>
[[c1-compte]]
[[c1-usage]]
<p>Chaque objet possède <b>ses propres</b> attributs : déposer sur <code>c1</code> ne change pas <code>c2</code>. Le schéma suivant montre ce qui se passe en mémoire, ligne par ligne.</p>
[[w-uml]]
<div class="boite ex"><div class="lab"># diagramme de classe (UML)</div><p>À l’écrit, une classe est souvent donnée sous la forme d’un rectangle en trois cases : le <b>nom</b>, les <b>attributs</b> (avec leur type), les <b>méthodes</b> (avec leurs paramètres, sans <code>self</code>). C’est une notation de l’UML (<i>Unified Modeling Language</i>) ; il suffit de savoir la lire et la traduire en Python.</p></div>` },

    { id: "i3", t: "Le constructeur __init__ et self", h: `
<p>Quand tu écris <code>c1 = Compte("Ada", 100)</code>, Python :</p>
<ol><li>crée un objet vide de type <code>Compte</code> ;</li><li>appelle <code>__init__(objet, "Ada", 100)</code> : le paramètre <code>self</code> reçoit le nouvel objet ;</li><li>renvoie l’objet, dont la référence est rangée dans <code>c1</code>.</li></ol>
<p>La méthode <code>__init__</code> s’appelle le <b>constructeur</b> (plus exactement l’initialiseur). Son rôle est de créer les attributs avec <code>self.nom = valeur</code>. Elle ne renvoie rien.</p>
<div class="boite retenir-b"><div class="lab"># à retenir</div><p><code>self</code> est le premier paramètre de toute méthode : c’est l’objet sur lequel la méthode travaille. Dans la classe, on écrit <code>self.solde</code> ; à l’extérieur, on écrit <code>c1.solde</code>. Le mot <code>self</code> n’est qu’une convention, mais tout le monde la respecte.</p></div>
<p>Les paramètres peuvent avoir une <b>valeur par défaut</b> (<code>solde=0</code>), comme pour toute fonction. Attention aux valeurs par défaut <b>mutables</b> (une liste) : voir les pièges.</p>` },

    { id: "i4", t: "Les méthodes : agir sur l’objet", h: `
<p>Une méthode est une fonction écrite dans la classe, dont le premier paramètre est <code>self</code>. L’appel <code>c.deposer(5)</code> est un raccourci pour <code>Compte.deposer(c, 5)</code> :</p>
[[c1-self]]
<p>Une méthode peut <b>modifier</b> l’objet (<code>deposer</code>), <b>renvoyer</b> une valeur calculée à partir des attributs (<code>retirer</code> renvoie un booléen), ou les deux. Elle peut aussi appeler une autre méthode du même objet (<code>self.autre_methode()</code>) ou d’un autre objet reçu en paramètre :</p>
[[c1-appel-methode]]
<p>Ici, un attribut <code>historique</code> contient une liste : un objet peut contenir n’importe quelle valeur, y compris d’autres objets.</p>` },

    { id: "i5", t: "Accéder aux attributs, les protéger, afficher un objet", h: `
<p>On lit et on écrit un attribut avec la notation pointée <code>objet.attribut</code>. Python n’empêche pas d’écrire n’importe quoi :</p>
[[c1-acces]]
<p>Pour garder l’objet cohérent, on passe plutôt par des méthodes. Une méthode qui renvoie un attribut s’appelle un <b>accesseur</b> (<i>getter</i>) ; une méthode qui le modifie en vérifiant la valeur, un <b>mutateur</b> (<i>setter</i>). Un attribut dont le nom commence par <code>_</code> est « privé par convention » : Python ne bloque rien, c’est un avertissement entre programmeurs.</p>
[[c1-accesseurs]]
<p>Sans méthode <code>__str__</code>, <code>print(c)</code> affiche seulement quelque chose comme <code>&lt;__main__.Compte object at 0x7f…&gt;</code> (une adresse qui change à chaque exécution). Avec <code>__str__</code>, tu choisis le texte affiché ; elle doit <b>renvoyer</b> une chaîne, pas l’afficher.</p>
<div class="boite hp"><div class="lab"># pour aller plus loin</div><p>L’<b>encapsulation</b> (cacher l’implémentation derrière une interface de méthodes) est une idée centrale de la POO, mais le programme de Terminale n’exige que le vocabulaire et l’usage des accesseurs que l’énoncé te donne.</p></div>` },

    { id: "i6", t: "Références et alias : la mutation partagée", h: `
<p>Une variable ne « contient » pas un objet : elle contient une <b>référence</b> (l’adresse de l’objet en mémoire). L’affectation <code>b = a</code> copie la référence, pas l’objet. On dit que <code>b</code> est un <b>alias</b> de <code>a</code> :</p>
[[c1-alias]]
<ul><li><code>a is b</code> teste si les deux noms désignent <b>le même objet</b> ;</li>
<li><code>a == c</code> compare deux objets ; pour une classe qui ne définit pas <code>__eq__</code>, <code>==</code> se comporte comme <code>is</code>, d’où <code>False</code> alors que les attributs sont égaux.</li></ul>
<p>Même chose quand on passe un objet à une fonction : la fonction reçoit une référence vers <b>le même</b> objet et peut le modifier. C’est un <b>effet de bord</b>, voulu ici, mais source de bugs quand il ne l’est pas (chapitre 4).</p>
[[c1-fonction-objet]]
<div class="boite ex"><div class="lab"># vérifie tes réponses</div><p>Pour voir les références, colle ces programmes dans <a href="https://pythontutor.com/" target="_blank" rel="noopener">Python Tutor</a> : il dessine les variables et les flèches vers les objets.</p></div>` },

    { id: "i7", t: "Des objets qui contiennent des objets", h: `
<p>Un attribut peut contenir une liste d’objets : c’est la <b>composition</b>. Une banque possède des comptes, une médiathèque des livres, une partie des joueurs.</p>
[[c1-banque]]
<p>Un attribut peut aussi contenir <b>un</b> autre objet de la même classe. C’est l’idée du <b>maillon</b> d’une liste chaînée : chaque maillon connaît sa valeur et le maillon suivant. Tu la retrouveras au chapitre 3.</p>
[[c1-maillon]]
<p>La programmation objet sert ainsi à <b>implémenter des structures de données</b> : pile, file, arbre, graphe. C’est pour cela qu’elle est rangée dans la rubrique « Structures de données » du programme.</p>` },

<div class="boite hp"><div class="lab"># pour aller plus loin — non exigible, mais fréquent dans les sujets</div>
<p>Les méthodes dont le nom est entouré de deux tirets bas sont appelées par Python dans des situations précises : <code>__init__</code> à la création, <code>__str__</code> par <code>print</code>, <code>__eq__</code> par <code>==</code>, <code>__add__</code> par <code>+</code>, <code>__len__</code> par <code>len()</code>, <code>__lt__</code> par <code>&lt;</code>.</p></div>
[[c1-speciales]]
<p>Un attribut défini directement dans la classe (hors de toute méthode) est un <b>attribut de classe</b> : il est partagé par tous les objets. À ne pas confondre avec les attributs d’instance créés par <code>self.x = …</code>.</p>
[[c1-attr-classe]]` },

    { id: "i9", t: "Ce qui est hors programme : héritage et polymorphisme", h: `
<p>Le programme précise : « On n’aborde pas ici tous les aspects de la programmation objet comme le polymorphisme et l’héritage. » Tu peux les croiser, il faut savoir les reconnaître, pas les maîtriser.</p>
<div class="boite hp"><div class="lab"># hors programme</div>
<p>L’<b>héritage</b> permet de définir une classe à partir d’une autre (<code>class Chat(Animal)</code>) : elle récupère ses attributs et méthodes et peut en redéfinir. Le <b>polymorphisme</b> : un même appel (<code>x.parler()</code>, ou <code>len(x)</code>) produit un comportement adapté au type de <code>x</code>.</p></div>

<p>La POO est l’un des trois <b>paradigmes</b> au programme, avec l’impératif et le fonctionnel (chapitre « Paradigmes de programmation », bientôt). Un même programme peut mélanger les paradigmes.</p>` }

class ListeChainee:
    def __init__(self):
        self.tete = None                 # liste vide

    def est_vide(self):
        return self.tete is None

    def ajouter_tete(self, v):           # coût constant
        self.tete = Maillon(v, self.tete)

    def supprimer_tete(self):            # coût constant
        assert not self.est_vide(), "liste vide"
        v = self.tete.valeur
        self.tete = self.tete.suivant
        return v

    def ajouter_queue(self, v):          # coût linéaire : on parcourt tout
        if self.tete is None:
            self.tete = Maillon(v)
        else:
            m = self.tete
            while m.suivant is not None:
                m = m.suivant
            m.suivant = Maillon(v)

    def longueur(self):                  # coût linéaire
        n = 0
        m = self.tete
        while m is not None:
            n = n + 1
            m = m.suivant
        return n

    def __str__(self):
        morceaux = []
        m = self.tete
        while m is not None:
            morceaux.append(str(m.valeur))
            m = m.suivant
        return " -> ".join(morceaux + ["None"])

class Pile:
    """Pile implémentée avec une liste Python : le sommet est la FIN de la liste."""

    def __init__(self):
        self.contenu = []

    def est_vide(self):
        return len(self.contenu) == 0

    def empiler(self, x):
        self.contenu.append(x)           # coût constant

    def depiler(self):
        if self.est_vide():
            raise IndexError("dépiler une pile vide")
        return self.contenu.pop()        # coût constant

    def sommet(self):
        if self.est_vide():
            raise IndexError("pile vide")
        return self.contenu[-1]

    def taille(self):
        return len(self.contenu)

def evaluer_npi(expression):
    """Évalue une expression en notation polonaise inverse (NPI),
    par exemple "3 4 + 2 *", qui vaut (3 + 4) * 2."""
    p = Pile()
    for jeton in expression.split():
        if jeton in ["+", "-", "*", "/"]:
            b = p.depiler()              # le 2e opérande est au sommet
            a = p.depiler()
            if jeton == "+":
                p.empiler(a + b)
            elif jeton == "-":
                p.empiler(a - b)
            elif jeton == "*":
                p.empiler(a * b)
            else:
                p.empiler(a / b)
        else:
            p.empiler(int(jeton))
    return p.depiler()

print(evaluer_npi("3 4 + 2 *"))          # (3 + 4) * 2
print(evaluer_npi("10 2 8 * + 3 -"))     # 10 + 2 * 8 - 3`, { deps: ["c3-pile-liste"], out: "14\n23" });

class File2P:
    """File réalisée avec deux piles (deux listes Python utilisées en piles)."""

    def __init__(self):
        self.entree = []        # on empile ici à chaque enfiler
        self.sortie = []        # on dépile ici à chaque défiler

        return self.entree == [] and self.sortie == []

    def enfiler(self, x):
        self.entree.append(x)

            raise IndexError("défiler une file vide")
        return self.sortie.pop()

def bien_parenthesee(expr):
    p = []
    for c in expr:
        if c == "(":
            p.append(c)
        elif c == ")":
            if len(p) == 0:          # fermante sans ouvrante
                return False
            p.pop()
    return len(p) == 0               # il ne doit rester aucune ouvrante

def bien_parenthesee_multi(expr):
    """Même chose avec (), [] et {}."""
    ouvrante = {")": "(", "]": "[", "}": "{"}
    p = []
    for c in expr:
        if c in "([{":
            p.append(c)
        elif c in ")]}":
            if len(p) == 0 or p.pop() != ouvrante[c]:
                return False
    return len(p) == 0

def test():
    assert bien_parenthesee("(a+b)*(c-d)")
    assert bien_parenthesee("")                      # chaîne vide
    assert not bien_parenthesee("((a)")              # le bug de la version fournie
    assert not bien_parenthesee(")(")
    assert bien_parenthesee_multi("f(x[2]) + {y}")
    assert not bien_parenthesee_multi("(a]")
    assert not bien_parenthesee_multi("([)]")        # croisées : un compteur ne verrait rien
    assert not bien_parenthesee_multi("[")

class File:
    def __init__(self):
        self.elements = []

    def est_vide(self):
        return self.elements == []

    def enfiler(self, x):
        self.elements.append(x)

    def defiler(self):
        assert not self.est_vide(), "file vide"
        return self.elements.pop(0)          # la TÊTE, pas la fin

    def taille(self):
        return len(self.elements)

def josephe(n, k):
    f = File()
    for i in range(1, n + 1):
        f.enfiler(i)
    ordre = []
    while not f.est_vide():
        for _ in range(k - 1):               # les k-1 premiers passent derrière
            f.enfiler(f.defiler())
        ordre.append(f.defiler())            # le k-ième sort
    return ordre

def test():
    f = File()
    for x in [1, 2, 3]:
        f.enfiler(x)
    assert f.defiler() == 1 and f.taille() == 2      # FIFO
    assert josephe(7, 3) == [3, 6, 2, 7, 5, 1, 4]
    assert josephe(1, 5) == [1]
    assert josephe(5, 1) == [1, 2, 3, 4, 5]
    assert josephe(41, 3)[-1] == 31

test()
print("tous les tests passent")`, { fichier: "josephe.py", out: "tous les tests passent" });

"""Module pile : une pile, vue uniquement à travers ces fonctions.

    p = creer_pile()      crée une pile vide
    est_vide(p)           True si p est vide
    empiler(p, x)         ajoute x au sommet de p
    depiler(p)            retire et renvoie le sommet de p (p non vide)
"""

def creer_pile():
    return []

def est_vide(p):
    return len(p) == 0

def empiler(p, x):
    p.append(x)

def depiler(p):
    assert not est_vide(p), "dépiler une pile vide"
    return p.pop()`, { fichier: "pile.py", out: "" });

from pile import creer_pile, est_vide, empiler, depiler

def inverser(mot):
    p = creer_pile()
    for lettre in mot:

    resultat = ""
    while not est_vide(p):

def indice_max(t):
    """Renvoie l'indice de la première occurrence du maximum de t.

    Précondition : t est une liste de nombres non vide.
    Postcondition : le résultat i vérifie 0 <= i < len(t)
                    et t[i] >= t[j] pour tout indice j.

    >>> indice_max([3, 9, 2, 9])
    1
    """
    assert len(t) > 0, "la liste ne doit pas être vide"

def moyenne(notes):
    """Renvoie la moyenne des nombres de la liste notes (non vide)."""
    assert len(notes) > 0, "liste vide"
    return sum(notes) / len(notes)

def mediane(notes):
    """Renvoie la médiane de la liste notes (non vide), sans la modifier."""
    assert len(notes) > 0, "liste vide"
    t = sorted(notes)                    # copie triée : notes n'est pas modifiée
    n = len(t)
    if n % 2 == 1:
        return t[n // 2]
    return (t[n // 2 - 1] + t[n // 2]) / 2

def test_stats():
    assert moyenne([10]) == 10
    assert moyenne([12, 8, 15, 10]) == 11.25
    assert mediane([7]) == 7                      # un seul élément
    assert mediane([3, 1, 2]) == 2                # taille impaire
    assert mediane([12, 8, 15, 10]) == 11.0       # taille paire
    releve = [12, 8, 15, 10]
    mediane(releve)
    assert releve == [12, 8, 15, 10]              # pas d'effet de bord
    try:
        moyenne([])
        assert False, "moyenne([]) aurait dû lever une erreur"
    except AssertionError as e:
        assert str(e) == "liste vide"

test_stats()
print("tous les tests passent")`, { fichier: "stats.py", out: "tous les tests passent" });

def est_bissextile(annee):
    """Divisible par 4 mais pas par 100, ou divisible par 400."""
    return (annee % 4 == 0 and annee % 100 != 0) or annee % 400 == 0

def jours_dans_mois(mois, annee):

    elif mois in [4, 6, 9, 11]:

def occurrences(texte):
    """Renvoie un dictionnaire {caractère: nombre d'apparitions}."""
    compte = {}
    for c in texte:
        if c in compte:
            compte[c] = compte[c] + 1
        else:
            compte[c] = 1              # première rencontre
    return compte

def plus_frequent(compte):
    """Clé de plus grande valeur (la première rencontrée en cas d'égalité)."""
    meilleur = None
    for c in compte:
        if meilleur is None or compte[c] > compte[meilleur]:
            meilleur = c
    return meilleur

occ = occurrences("abracadabra")
print(occ)
print(plus_frequent(occ), occ[plus_frequent(occ)])`, { out: "{'a': 5, 'b': 2, 'r': 2, 'c': 1, 'd': 1}\na 5" });

def recherche_liste(couples, cle):
    """couples : liste de (clé, valeur). Renvoie (valeur, nombre de comparaisons)."""
    n = 0
    for k, v in couples:
        n = n + 1
        if k == cle:
            return v, n
    return None, n

C("c5-hachage", String.raw`
def code(cle, taille):
    """Fonction de hachage SIMPLIFIÉE (pour comprendre) : somme des codes des
    caractères, modulo la taille de la table. Python en utilise une bien meilleure."""
    return sum(ord(c) for c in cle) % taille

class TableHachage:
    def __init__(self, taille=8):
        self.cases = [[] for _ in range(taille)]     # une liste de couples par case

    def ajouter(self, cle, valeur):
        case = self.cases[code(cle, len(self.cases))]
        for i in range(len(case)):
            if case[i][0] == cle:
                case[i] = (cle, valeur)              # clé déjà présente : on remplace
                return
        case.append((cle, valeur))                   # sinon on ajoute (collision possible)

    def lire(self, cle):
        for k, v in self.cases[code(cle, len(self.cases))]:   # une seule case à fouiller
            if k == cle:
                return v
        raise KeyError(cle)

t = TableHachage()
for fruit, qte in [("pomme", 12), ("kiwi", 30), ("melon", 4), ("citron", 18),
                   ("figue", 9), ("poire", 7), ("cerise", 25)]:
    t.ajouter(fruit, qte)
print(code("poire", 8), t.cases[7])
print(t.lire("poire"), t.lire("cerise"))`, { out: "7 [('citron', 18), ('poire', 7)]\n7 25" });

def inverser(d):
    """d associe des élèves à leur groupe, par exemple {"Ada": "A", "Alan": "B", "Grace": "A"}.

def inverser(d):
    res = {}
    for eleve, groupe in d.items():
        if groupe not in res:
            res[groupe] = []          # première fois qu'on voit ce groupe
        res[groupe].append(eleve)
    return res

def plus_grand_groupe(d):
    """Groupe qui compte le plus d'élèves (le premier rencontré en cas d'égalité)."""
    inv = inverser(d)
    meilleur = None
    for g in inv:
        if meilleur is None or len(inv[g]) > len(inv[meilleur]):
            meilleur = g
    return meilleur

    assert inverser(d) == {"A": ["Ada", "Grace"], "B": ["Alan"]}
    assert inverser({}) == {}
    assert inverser({"Linus": "C"}) == {"C": ["Linus"]}
    assert plus_grand_groupe(d) == "A"
    assert plus_grand_groupe({}) is None

def depouiller(bulletins, candidats):
    """Renvoie {candidat: nombre de voix}, sans compter les bulletins invalides."""
    resultats = {c: 0 for c in candidats}
    for b in bulletins:
        if b in resultats:
            resultats[b] = resultats[b] + 1
    return resultats

def vainqueurs(resultats):
    """Liste des candidats qui ont le maximum de voix (plusieurs en cas d'égalité)."""
    maxi = max(resultats.values())
    return [c for c in resultats if resultats[c] == maxi]

def maximum(t, g, d):
    """Plus grand élément de t entre les indices g et d inclus (g <= d)."""
    if g == d:                       # un seul élément : c'est lui
        return t[g]
    m = (g + d) // 2                 # 1. diviser en deux moitiés
    a = maximum(t, g, m)             # 2. régner : résoudre chaque moitié
    b = maximum(t, m + 1, d)
    if a > b:                        # 3. combiner les deux réponses
        return a
    return b

def dicho(t, x, g, d):
    """Indice de x dans le tableau trié t entre g et d inclus, ou -1."""

def fusion(a, b):
    """Fusionne deux listes triées a et b en une seule liste triée."""
    res = []
    i, j = 0, 0
    while i < len(a) and j < len(b):
        if a[i] <= b[j]:             # on prend le plus petit des deux "en tête"
            res.append(a[i])
            i = i + 1
        else:
            res.append(b[j])
            j = j + 1
    return res + a[i:] + b[j:]       # l'une des deux listes est épuisée : on recopie l'autre

def rotation(img, x, y, n):
    """Tourne d'un quart de tour (sens horaire), SUR PLACE, le carré de côté n
    dont le coin en haut à gauche est img[y][x]. n est une puissance de 2."""
    if n == 1:                                   # un pixel : rien à faire

def creer_image(n):
    return [[n * i + j for j in range(n)] for i in range(n)]

def rotation(img, x, y, n):
    if n == 1:
        return
    h = n // 2
    rotation(img, x, y, h)
    rotation(img, x + h, y, h)
    rotation(img, x, y + h, h)
    rotation(img, x + h, y + h, h)
    for i in range(h):
        for j in range(h):
            hg = img[y + i][x + j]
            img[y + i][x + j] = img[y + h + i][x + j]

            img[y + h + i][x + h + j] = img[y + i][x + h + j]
            img[y + i][x + h + j] = hg

def rotation_copie(img):

def fusion_rec(a, b):
    """Version récursive de la fusion (a et b triées)."""
    if a == []:
        return b
    if b == []:
        return a
    if a[0] <= b[0]:
        return [a[0]] + fusion_rec(a[1:], b)
    return [b[0]] + fusion_rec(a, b[1:])

def tri_inv(t):
    """Renvoie (liste triée, nombre d'inversions de t)."""
    if len(t) <= 1:
        return t, 0
    m = len(t) // 2
    g, ig = tri_inv(t[:m])
    d, id_ = tri_inv(t[m:])
    res, i, j, inv = [], 0, 0, ig + id_
    while i < len(g) and j < len(d):
        if g[i] <= d[j]:
            res.append(g[i]); i = i + 1
        else:
            res.append(d[j]); j = j + 1
            inv = inv + len(g) - i      # d[j] est plus petit que TOUS les restants de g
    return res + g[i:] + d[j:], inv

def fib_memo(n, memo):

def fib_table(n):
    """Méthode ascendante : on remplit le tableau f du plus petit au plus grand."""
    f = [0] * (n + 1)
    if n >= 1:
        f[1] = 1
    for k in range(2, n + 1):
        f[k] = f[k - 1] + f[k - 2]   # les deux valeurs sont déjà dans le tableau
    return f

def rendu_glouton(s, pieces):
    """pieces est triée dans l'ordre DÉCROISSANT. Prend toujours la plus grosse pièce possible."""
    res = []
    for p in pieces:
        while s >= p:
            res.append(p)
            s = s - p
    return res

def rendu_memo(s, pieces, memo):
    if s == 0:
        return 0
    if s not in memo:
        meilleur = s
        for p in pieces:
            if p <= s:
                meilleur = min(meilleur, 1 + rendu_memo(s - p, pieces, memo))
        memo[s] = meilleur

def rendu_dyn(S, pieces):
    """nb[s] = nombre minimal de pièces pour rendre s ; choix[s] = une pièce à donner en premier."""
    nb = [0] + [S + 1] * S           # S + 1 joue le rôle de « l'infini »
    choix = [0] * (S + 1)
    for s in range(1, S + 1):        # du plus petit montant au plus grand
        for p in pieces:
            if p <= s and nb[s - p] + 1 < nb[s]:
                nb[s] = nb[s - p] + 1
                choix[s] = p
    return nb, choix

def pieces_rendues(S, choix):
    res = []
    while S > 0:
        res.append(choix[S])
        S = S - choix[S]
    return res

def plssc(a, b):
    """Table L : L[i][j] = longueur de la plus longue sous-séquence commune
    à a[:i] (les i premiers caractères de a) et b[:j]."""
    n, m = len(a), len(b)
    L = [[0] * (m + 1) for _ in range(n + 1)]   # ligne 0 et colonne 0 : mot vide
    for i in range(1, n + 1):
        for j in range(1, m + 1):
            if a[i - 1] == b[j - 1]:                 # même dernier caractère
                L[i][j] = L[i - 1][j - 1] + 1
            else:                                    # on renonce à l'un des deux
                L[i][j] = max(L[i - 1][j], L[i][j - 1])
    return L

def reconstruire(a, b, L):
    """Remonte la table depuis la case en bas à droite."""
    i, j, res = len(a), len(b), []
    while i > 0 and j > 0:
        if a[i - 1] == b[j - 1]:
            res.append(a[i - 1])
            i, j = i - 1, j - 1
        elif L[i - 1][j] >= L[i][j - 1]:
            i = i - 1
        else:
            j = j - 1
    return "".join(reversed(res))

def alignement(a, b, ident=1, diff=-1, trou=-1):
    """Score maximal d'un alignement de a et b, et un alignement qui l'atteint."""
    n, m = len(a), len(b)
    S = [[0] * (m + 1) for _ in range(n + 1)]
    for i in range(1, n + 1):
        S[i][0] = i * trou                       # a[:i] aligné face à des trous
    for j in range(1, m + 1):
        S[0][j] = j * trou
    for i in range(1, n + 1):
        for j in range(1, m + 1):
            diag = S[i - 1][j - 1] + (ident if a[i - 1] == b[j - 1] else diff)
            S[i][j] = max(diag, S[i - 1][j] + trou, S[i][j - 1] + trou)
    i, j, ha, hb = n, m, "", ""                  # reconstruction depuis la fin
    while i > 0 or j > 0:
        if i > 0 and j > 0 and S[i][j] == S[i - 1][j - 1] + (ident if a[i - 1] == b[j - 1] else diff):
            ha, hb = a[i - 1] + ha, b[j - 1] + hb
            i, j = i - 1, j - 1
        elif i > 0 and S[i][j] == S[i - 1][j] + trou:
            ha, hb = a[i - 1] + ha, "-" + hb
            i = i - 1
        else:
            ha, hb = "-" + ha, b[j - 1] + hb
            j = j - 1
    return S[n][m], ha, hb

print(hb)`, { out: "2\nG-ATTACA\nGCA-TGCA" });

    nb = [0] * (S + 1)

def plssc_memo(a, b, memo=None):
    if memo is None:
        memo = {}
    if a == "" or b == "":
        return 0
    if (a, b) not in memo:
        if a[-1] == b[-1]:
            memo[(a, b)] = 1 + plssc_memo(a[:-1], b[:-1], memo)
        else:
            memo[(a, b)] = max(plssc_memo(a[:-1], b, memo), plssc_memo(a, b[:-1], memo))
    return memo[(a, b)]

def table(a, b):
    L = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
    for i in range(1, len(a) + 1):
        for j in range(1, len(b) + 1):
            if a[i - 1] == b[j - 1]:
                L[i][j] = L[i - 1][j - 1] + 1
            else:
                L[i][j] = max(L[i - 1][j], L[i][j - 1])
    return L

def sous_sequence(a, b):
    L = table(a, b)
    i, j, res = len(a), len(b), ""
    while i > 0 and j > 0:
        if a[i - 1] == b[j - 1]:
            res = a[i - 1] + res
            i, j = i - 1, j - 1
        elif L[i - 1][j] >= L[i][j - 1]:
            i = i - 1
        else:
            j = j - 1
    return res

def est_sous_sequence(s, mot):
    k = 0
    for c in mot:
        if k < len(s) and c == s[k]:
            k = k + 1
    return k == len(s)

def test():
    assert plssc_memo("CHIEN", "NICHE") == 3
    assert plssc_memo("ABCDEFGHIJKLMNOP", "PONMLKJIHGFEDCBA") == 1
    assert plssc_memo("", "ABC") == 0
    for a, b in [("CHIEN", "NICHE"), ("PYTHON", "PHOTON"), ("ACGTTGCA", "TGCATGCA")]:
        s = sous_sequence(a, b)
        assert len(s) == plssc_memo(a, b) == table(a, b)[len(a)][len(b)]
        assert est_sous_sequence(s, a) and est_sous_sequence(s, b)

test()

def somme_max_rec(p, i, j):
    """Meilleure somme d'un chemin qui part de la case (i, j) et descend jusqu'en bas."""
    if i == len(p) - 1:
        return p[i][j]

def recherche_naive(texte, motif):
    """Liste des positions où motif apparaît dans texte."""
    n, m = len(texte), len(motif)
    positions = []
    for i in range(n - m + 1):              # chaque position possible de la fenêtre
        j = 0
        while j < m and texte[i + j] == motif[j]:
            j = j + 1                       # on compare de GAUCHE à DROITE
        if j == m:                          # tout le motif correspond
            positions.append(i)
    return positions

def table_decalage(motif):
    """Pour chaque caractère du motif SAUF le dernier : distance entre sa
    dernière occurrence et la fin du motif. Les autres caractères : len(motif)."""
    m = len(motif)
    d = {}
    for i in range(m - 1):                  # le dernier caractère est exclu
        d[motif[i]] = m - 1 - i             # une occurrence plus à droite écrase la précédente
    return d

def horspool(texte, motif):
    n, m = len(texte), len(motif)
    d = table_decalage(motif)               # prétraitement du motif, une seule fois
    positions = []
    i = 0                                   # position de la fenêtre dans le texte
    while i <= n - m:
        j = m - 1
        while j >= 0 and texte[i + j] == motif[j]:
            j = j - 1                       # on compare de DROITE à GAUCHE
        if j < 0:
            positions.append(i)
        i = i + d.get(texte[i + m - 1], m)  # saut lu dans la table, selon le caractère
    return positions                        # du texte sous la DERNIÈRE case du motif

def naive_c(texte, motif):
    n, m, c = len(texte), len(motif), 0
    for i in range(n - m + 1):
        j = 0
        while j < m:
            c = c + 1
            if texte[i + j] != motif[j]:
                break
            j = j + 1
    return c

def horspool_c(texte, motif):
    n, m, c = len(texte), len(motif), 0
    d = table_decalage(motif)
    i = 0
    while i <= n - m:
        j = m - 1
        while j >= 0:
            c = c + 1
            if texte[i + j] != motif[j]:
                break
            j = j - 1
        i = i + d.get(texte[i + m - 1], m)
    return c

def boyer_moore_simple(texte, motif):
    """Règle du « mauvais caractère » : on aligne le caractère du texte qui a
    provoqué l'échec avec sa dernière occurrence dans le motif."""
    n, m = len(texte), len(motif)
    derniere = {}
    for k in range(m):
        derniere[motif[k]] = k              # indice de la dernière occurrence
    positions = []
    i = 0
    while i <= n - m:
        j = m - 1
        while j >= 0 and texte[i + j] == motif[j]:
            j = j - 1
        if j < 0:
            positions.append(i)
            i = i + 1
        else:
            i = i + max(1, j - derniere.get(texte[i + j], -1))
    return positions

/* Base d'exemple : une petite bibliothèque. Les tables affichées et le script SQL sont produits à partir des mêmes données. */
var BIB = {
  Auteur: { cols: ["id_auteur", "nom", "prenom", "naissance"], cle: "id_auteur", lignes: [
    [1, "Hugo", "Victor", 1802], [2, "Sand", "George", 1804], [3, "Verne", "Jules", 1828], [4, "Zola", "Émile", 1840], [5, "Colette", "Sidonie-Gabrielle", 1873]] },
  Livre: { cols: ["id_livre", "titre", "annee", "id_auteur"], cle: "id_livre", etr: { id_auteur: "Auteur" }, lignes: [
    [1, "Les Misérables", 1862, 1], [2, "Notre-Dame de Paris", 1831, 1], [3, "Les Contemplations", 1856, 1], [4, "Indiana", 1832, 2],
    [5, "La Mare au diable", 1846, 2], [6, "De la Terre à la Lune", 1865, 3], [7, "Germinal", 1885, 4], [8, "L'Assommoir", 1877, 4]] },
  Emprunt: { cols: ["id_emprunt", "id_livre", "adherent", "date_emprunt"], cle: "id_emprunt", etr: { id_livre: "Livre" }, lignes: [
    [1, 7, "Ada", "2026-10-02"], [2, 1, "Alan", "2026-10-05"], [3, 7, "Grace", "2026-10-20"], [4, 6, "Ada", "2026-11-03"]] }
};
function bibSql() {
  var types = { id_auteur: "INTEGER", nom: "TEXT", prenom: "TEXT", naissance: "INTEGER", id_livre: "INTEGER", titre: "TEXT", annee: "INTEGER", id_emprunt: "INTEGER", adherent: "TEXT", date_emprunt: "TEXT" };
  var s = [];
  Object.keys(BIB).forEach(function (t) {
    var T = BIB[t], def = T.cols.map(function (c) { return "    " + c + " " + types[c] + (c === T.cle ? " PRIMARY KEY" : "") + (T.etr && T.etr[c] ? " REFERENCES " + T.etr[c] + "(" + c + ")" : ""); });
    s.push("CREATE TABLE " + t + " (\n" + def.join(",\n") + "\n);");
  });
  Object.keys(BIB).forEach(function (t) {
    BIB[t].lignes.forEach(function (l) { s.push("INSERT INTO " + t + " VALUES (" + l.map(function (v) { return typeof v === "number" ? v : "'" + String(v).replace(/'/g, "''") + "'"; }).join(", ") + ");"); });
  });
  return s.join("\n");
}
function bibTable(t, opts) {
  opts = opts || {};
  var T = BIB[t];
  return '<div class="tab-wrap table-bd"><table><caption class="mono">' + t + '</caption><tr>' + T.cols.map(function (c) { return "<th" + (c === T.cle ? ' class="pk"' : T.etr && T.etr[c] ? ' class="fk"' : "") + ">" + (T.etr && T.etr[c] ? "#" : "") + c + "</th>"; }).join("") + "</tr>" +
    T.lignes.map(function (l) { return "<tr>" + l.map(function (v) { return "<td>" + String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</td>"; }).join("") + "</tr>"; }).join("") + "</table></div>";
}

livres = [{"titre": "Germinal", "id_auteur": 4}, {"titre": "Indiana", "id_auteur": 2},
          {"titre": "Les Misérables", "id_auteur": 1}]
auteurs = [{"id_auteur": 1, "nom": "Hugo"}, {"id_auteur": 2, "nom": "Sand"},
           {"id_auteur": 4, "nom": "Zola"}]

def jointure(livres, auteurs):
    """Version naïve : deux boucles imbriquées, len(livres) x len(auteurs) comparaisons."""
    res = []
    for l in livres:
        for a in auteurs:
            if l["id_auteur"] == a["id_auteur"]:
                res.append((l["titre"], a["nom"]))
    return res

def jointure_index(livres, auteurs):
    """Version avec un dictionnaire id -> nom : un seul parcours de chaque table."""
    index = {a["id_auteur"]: a["nom"] for a in auteurs}
    return [(l["titre"], index[l["id_auteur"]]) for l in livres if l["id_auteur"] in index]

def test():
    attendu = [("Germinal", "Zola"), ("Indiana", "Sand"), ("Les Misérables", "Hugo")]
    assert jointure(livres, auteurs) == attendu
    assert jointure_index(livres, auteurs) == attendu
    assert jointure([], auteurs) == []

  idees: [
    { id: "i1", t: "Pourquoi une base de données ?", h: `
<p>En Première, tu as manipulé des données en table : un fichier CSV lu en Python. Cela devient insuffisant dès que les données sont <b>nombreuses</b> (des millions de lignes), <b>partagées</b> (plusieurs programmes ou utilisateurs en même temps), <b>liées</b> entre elles (un livre et son auteur), et qu’elles doivent rester <b>cohérentes</b> et <b>durables</b> malgré les pannes.</p>
<p>Une <b>base de données</b> est un ensemble organisé de données ; un <b>système de gestion de bases de données</b> (SGBD) est le logiciel qui la stocke et répond aux requêtes. Exemples de SGBD relationnels : SQLite (inclus dans Python et dans chaque téléphone), PostgreSQL, MySQL, Oracle. Les plus grands systèmes gèrent des volumes de l’ordre du pétaoctet (10<sup>15</sup> octets).</p>
<div class="boite histoire"><div class="lab"># git log --histoire</div><p><span class="commit">1970 <b>·</b></span> Edgar F. Codd, chercheur chez IBM, publie <i>A Relational Model of Data for Large Shared Data Banks</i> : le modèle relationnel.<br><span class="commit">années 1970 <b>·</b></span> IBM développe le langage SEQUEL, qui deviendra <b>SQL</b>.</p></div>` },
