<div class="boite def"><div class="lab">"""définitions"""</div>
<p>Une <b>relation</b> (une table) est un ensemble de <b>n-uplets</b> (les lignes, ou enregistrements). Chaque colonne est un <b>attribut</b>, qui prend ses valeurs dans un <b>domaine</b> (entier, texte, date…). Le <b>schéma d’une relation</b> donne son nom et ses attributs avec leurs domaines : <code>Auteur(id_auteur : INT, nom : TEXT, prenom : TEXT, naissance : INT)</code>.</p></div>
<p>Dans la table Auteur ci-dessus, la ligne <code>(3, 'Verne', 'Jules', 1828)</code> est un n-uplet ; <code>naissance</code> est un attribut de domaine « entier ». Une relation est un <b>ensemble</b> : l’ordre des lignes n’a pas de sens et deux lignes ne peuvent pas être identiques.</p>` },

    { id: "i3", t: "Clé primaire, clé étrangère, schéma relationnel", h: `
<div class="boite def"><div class="lab">"""définitions"""</div>
<p>Une <b>clé primaire</b> est un attribut (ou un groupe d’attributs) dont la valeur identifie <b>une seule</b> ligne de la table : <code>id_auteur</code> pour Auteur. Une <b>clé étrangère</b> est un attribut qui contient la clé primaire d’une ligne d’une autre table : <code>Livre.id_auteur</code> fait référence à <code>Auteur.id_auteur</code>.</p></div>
<p>Le <b>schéma relationnel</b> d’une base est l’ensemble des schémas de ses relations. Notation courante à l’écrit (clé primaire soulignée, clé étrangère précédée de #) :</p>
<p class="mono petit">Auteur(<u>id_auteur</u>, nom, prenom, naissance)<br>Livre(<u>id_livre</u>, titre, annee, #id_auteur)<br>Emprunt(<u>id_emprunt</u>, #id_livre, adherent, date_emprunt)</p>
<p>Pourquoi un identifiant numérique plutôt que le nom ? Deux auteurs peuvent porter le même nom, et un nom peut changer : la clé primaire doit être unique et stable. Grâce aux clés étrangères, l’auteur n’est écrit qu’<b>une fois</b> et chaque livre y renvoie.</p>` },

    { id: "i4", t: "Les contraintes d’intégrité", h: `
<p>Le SGBD refuse toute modification qui rendrait la base incohérente. Trois contraintes sont au programme :</p>
<ul><li><b>Contrainte de domaine</b> : chaque valeur appartient au domaine de son attribut.</li>
<li><b>Contrainte de relation</b> (ou d’entité) : la clé primaire est unique (et non vide).</li>
[[c6-err-pk]]
<li><b>Contrainte de référence</b> : une clé étrangère doit désigner une ligne qui existe.</li></ul>
[[c6-err-fk]]
<p>Elle joue aussi à la suppression : on ne peut pas supprimer un auteur dont des livres dépendent encore. Il faut d’abord supprimer (ou modifier) les lignes qui y font référence.</p>
[[c6-err-suppr]]
<div class="boite hp"><div class="lab"># remarque technique</div><p>SQLite ne vérifie les clés étrangères que si l’on active <code>PRAGMA foreign_keys = ON</code> (c’est le cas pour les exemples de cette page). Les autres SGBD les vérifient par défaut. SQLite est aussi souple sur les domaines : il accepte parfois un texte dans une colonne entière.</p></div>` },

    { id: "i5", t: "Structure, contenu et anomalies de conception", h: `
<p>La <b>structure</b> d’une base est son schéma (les tables, leurs attributs, leurs clés) ; son <b>contenu</b> est l’ensemble des lignes à un instant donné. La structure change rarement ; le contenu, tout le temps.</p>
<p>Un mauvais schéma provoque des <b>redondances</b> : la même information est écrite plusieurs fois. Exemple : tout mettre dans une seule table.</p>
[[c6-redondance]]
<ul><li><b>Anomalie de mise à jour</b> : l’année de naissance de Hugo est écrite trois fois ; une faute dans une seule copie rend la base contradictoire (1802 ou 1820 ?).</li>
<li><b>Anomalie d’insertion</b> : impossible d’ajouter un auteur qui n’a pas encore de livre dans la base sans laisser des cases vides.</li>
<li><b>Anomalie de suppression</b> : supprimer le dernier livre d’un auteur efface aussi tout ce qu’on savait de l’auteur.</li></ul>
<p>Le remède : <b>découper</b> en plusieurs tables reliées par des clés (Auteur et Livre), pour que chaque information soit écrite une seule fois.</p>` },

    { id: "i6", t: "Interroger : SELECT, FROM, WHERE, ORDER BY", h: `
<p>Une requête d’interrogation dit <b>quelles colonnes</b> (SELECT), <b>de quelle table</b> (FROM), <b>pour quelles lignes</b> (WHERE) et <b>dans quel ordre</b> (ORDER BY). Le résultat est lui-même une table.</p>
[[c6-select]]
<p><code>SELECT *</code> garde toutes les colonnes ; les conditions se combinent avec <code>AND</code>, <code>OR</code>, <code>NOT</code> ; les chaînes s’écrivent entre apostrophes simples.</p>
[[c6-etoile]]
<p><code>DISTINCT</code> supprime les doublons du résultat ; <code>ORDER BY … DESC</code> trie par ordre décroissant.</p>
[[c6-distinct]]
<p>Les <b>fonctions d’agrégation</b> résument toutes les lignes sélectionnées en une seule : <code>COUNT</code>, <code>SUM</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code>. <code>AS</code> renomme une colonne du résultat.</p>
[[c6-agregats]]
[[c6-avg]]
<div class="boite attention"><div class="lab">⚠ limite du programme</div><p>Pas de <code>GROUP BY</code> ni de <code>HAVING</code> au bac : une agrégation porte sur toutes les lignes retenues par le WHERE.</p></div>` },

    { id: "i7", t: "Croiser les tables : la jointure", h: `
<p>Pour afficher le titre d’un livre <b>et</b> le nom de son auteur, il faut réunir les deux tables : c’est une <b>jointure</b>. <code>JOIN … ON</code> assemble chaque ligne de la première table avec la ligne de la seconde qui vérifie la condition, presque toujours « clé étrangère = clé primaire ».</p>
[[c6-jointure]]
[[w-jointure]]
<p>On peut enchaîner plusieurs jointures. Préfixer les attributs par le nom de leur table (<code>Livre.titre</code>) lève toute ambiguïté quand deux tables ont un attribut de même nom.</p>
[[c6-jointure3]]
<p>Une jointure ne garde que les lignes qui se correspondent : Colette n’a aucun livre, elle n’apparaît dans aucun résultat de jointure avec Livre.</p>
[[c6-colette]]` },

    { id: "i8", t: "Mettre à jour : INSERT, UPDATE, DELETE", h: `
<p><code>INSERT INTO</code> ajoute des lignes, en donnant les valeurs dans l’ordre des colonnes, ou en nommant les colonnes :</p>
[[c6-insert]]
<p><code>UPDATE … SET … WHERE</code> modifie les lignes qui vérifient la condition :</p>
[[c6-update]]
<p><code>DELETE FROM … WHERE</code> supprime les lignes qui vérifient la condition (les dates au format AAAA-MM-JJ se comparent comme des chaînes) :</p>
[[c6-delete]]
<div class="boite attention"><div class="lab">⚠ le WHERE oublié</div><p>Sans WHERE, <code>UPDATE</code> modifie <b>toutes</b> les lignes et <code>DELETE FROM Emprunt</code> vide toute la table. Toujours écrire (et relire) la condition.</p></div>` },

    { id: "i9", t: "Le rôle du SGBD, et SQL depuis Python", h: `
<p>Le programme demande d’identifier les services d’un SGBD, sans détailler leur fonctionnement :</p>
<div class="tab-wrap"><table><tr><th>service</th><th>ce que ça veut dire</th><th>exemple</th></tr>
<tr><td>persistance</td><td>les données survivent à l’arrêt du programme et aux pannes</td><td>après une coupure de courant, les emprunts enregistrés sont toujours là</td></tr>
<tr><td>accès concurrents</td><td>plusieurs utilisateurs modifient la base en même temps sans la corrompre</td><td>deux bibliothécaires ne peuvent pas prêter le même exemplaire au même instant</td></tr>
<tr><td>efficacité</td><td>le SGBD choisit comment exécuter la requête et utilise des index</td><td>trouver un livre parmi des millions sans tout parcourir</td></tr>
<tr><td>sécurisation des accès</td><td>comptes, mots de passe, droits de lecture ou d’écriture par table</td><td>un adhérent consulte le catalogue mais ne modifie pas les emprunts</td></tr></table></div>

def puissance_dynamique(c, v, f):
    """Puissance (W) dissipée en commutant : P = C * V**2 * f
    c : capacité commutée (F), v : tension (V), f : fréquence (Hz)."""
    return c * v ** 2 * f

normal = puissance_dynamique(1e-9, 1.0, 3e9)     # valeurs d'ordre de grandeur
econome = puissance_dynamique(1e-9, 0.8, 2e9)    # tension ET fréquence baissées
print(round(normal, 2), "W ->", round(econome, 2), "W")
print("économie :", round(100 * (1 - econome / normal)), "%")`, { out: "3.0 W -> 1.28 W\néconomie : 57 %" });

BLOCS = {"cpu_perf": 2000, "cpu_eco": 300, "gpu": 1500, "npu": 800,
         "isp": 600, "modem": 900, "affichage": 400}

def puissance(actifs):
    """Renvoie la puissance totale (en mW) des blocs de la liste actifs."""
    total = 0
    for b in actifs:
        assert b in BLOCS, "bloc inconnu : " + b
        total = total + BLOCS[b]
    return total

def autonomie(energie_wh, actifs):
    """Autonomie en heures : énergie (Wh) divisée par la puissance (W)."""
    assert len(actifs) > 0, "aucun bloc actif"
    return energie_wh / (puissance(actifs) / 1000)       # mW -> W

def bloc_le_plus_gourmand(actifs):
    """Renvoie le nom du bloc actif qui consomme le plus."""
    meilleur = actifs[0]
    for b in actifs:
        if BLOCS[b] > BLOCS[meilleur]:
            meilleur = b
    return meilleur

jeu = ["cpu_perf", "gpu", "affichage", "modem"]
musique = ["cpu_eco", "modem"]
assert puissance(jeu) == 4800 and puissance([]) == 0
assert autonomie(15, jeu) == 3.125
assert round(autonomie(15, musique), 1) == 12.5
assert bloc_le_plus_gourmand(jeu) == "cpu_perf"

    { id: "i1", t: "Point de départ : le modèle de von Neumann", h: `
<p>En Première, tu as vu le modèle de <b>von Neumann</b> (1945) : une <b>unité arithmétique et logique</b> qui calcule, une <b>unité de contrôle</b> qui enchaîne les instructions, une <b>mémoire</b> qui contient à la fois le programme et les données, des <b>entrées-sorties</b>, le tout relié par des <b>bus</b>.</p>
<p>Dans un ordinateur de bureau, ces fonctions sont réparties sur des composants <b>séparés</b>, assemblés sur une carte mère : le processeur dans son support, des barrettes de RAM qu’on peut changer, une carte graphique enfichée dans un connecteur PCI Express, un disque, une carte réseau. Chaque composant est une puce (ou plusieurs), et ils communiquent par des pistes de cuivre de plusieurs centimètres.</p>
<div class="boite def"><div class="lab">"""définition"""</div><p>Un <b>circuit intégré</b> (une « puce ») est un morceau de silicium sur lequel sont gravés des millions ou des milliards de <b>transistors</b>, les interrupteurs électroniques qui réalisent les portes logiques de Première.</p></div>
<div class="boite histoire"><div class="lab"># git log --histoire</div><p><span class="commit">1971 <b>·</b></span> Intel commercialise le <b>4004</b>, premier microprocesseur sur une seule puce : environ 2 300 transistors. <span class="commit">1965 <b>·</b></span> Gordon Moore avait observé que le nombre de transistors d’une puce doublait à intervalle régulier (il retiendra en 1975 un doublement tous les deux ans) : c’est la « loi de Moore », une observation et non une loi physique. Cette miniaturisation est ce qui a rendu possible le SoC.</p></div>` },

    { id: "i2", t: "Qu’est-ce qu’un système sur puce ?", h: `
<div class="boite def"><div class="lab">"""définition"""</div><p>Un <b>système sur puce</b> (SoC, <i>System on Chip</i>) est un circuit intégré unique qui regroupe <b>tous les composants d’un ordinateur</b> ou presque : un ou plusieurs processeurs, un processeur graphique, des mémoires, des contrôleurs et des interfaces. Le programme le dit ainsi : il regroupe « dans un seul circuit nombre de fonctions autrefois effectuées par des circuits séparés assemblés sur une carte électronique ».</p></div>
<p><b>Exemples</b> (fiches techniques des fabricants) :</p>
<ul><li>l’<b>Apple A17 Pro</b> (2023, iPhone 15 Pro) : gravure en 3 nm, environ 19 milliards de transistors, un CPU de 6 cœurs (2 performants, 4 économes), un GPU de 6 cœurs, un accélérateur d’IA de 16 cœurs ;</li>
<li>le <b>Broadcom BCM2711</b> du Raspberry Pi 4 (2019) : 4 cœurs ARM Cortex-A72 à 1,5 GHz, un GPU, des contrôleurs vidéo, USB, Ethernet ; tout le nano-ordinateur tient autour de cette puce ;</li>
<li>l’<b>Apple M1</b> (2020), SoC d’ordinateurs portables : environ 16 milliards de transistors, avec une mémoire « unifiée » partagée par le CPU et le GPU.</li></ul>
<p>Le programme ajoute une remarque : un SoC est <b>conçu de façon logicielle</b> (on décrit ses circuits dans des langages de description de matériel, on les simule avant de les graver) et ses blocs sont accessibles aux programmes par des <b>API</b>, comme une bibliothèque.</p>
<div class="boite hp"><div class="lab"># microcontrôleur ou SoC ?</div><p>Un <b>microcontrôleur</b> est un petit système sur puce pour les objets simples : la carte micro:bit (version 2) utilise un nRF52833, avec un cœur ARM Cortex-M4 à 64 MHz, 512 Ko de mémoire flash et 128 Ko de RAM, et une radio Bluetooth, tout sur la même puce. Même idée qu’un SoC de téléphone, à une échelle mille fois plus petite.</p></div>` },

    { id: "i3", t: "Les composants d’un SoC de téléphone", h: `
<p>Voici les blocs que cite le programme, avec leur rôle. C’est la liste à savoir reconnaître sur un schéma.</p>
<div class="tab-wrap"><table><tr><th>composant</th><th>rôle</th><th>exemple</th></tr>
<tr><td><b>microprocesseur</b> (CPU), souvent multicœur</td><td>exécute les programmes (système, applications)</td><td>cœurs performants pour les tâches lourdes, cœurs économes pour les tâches légères</td></tr>
<tr><td><b>mémoires locales</b> (caches, SRAM)</td><td>gardent près des cœurs les données et instructions utilisées</td><td>un accès au cache coûte quelques cycles, un accès à la RAM externe plus d’une centaine</td></tr>
<tr><td><b>contrôleur mémoire</b></td><td>fait le lien avec la RAM, à l’extérieur de la puce</td><td>RAM LPDDR souvent soudée sur le SoC</td></tr>
<tr><td><b>accélérateur graphique</b> (GPU)</td><td>calcule les images (jeux, interface), en parallèle sur des centaines d’unités simples</td><td>affichage fluide d’un jeu en 3D</td></tr>
<tr><td><b>contrôleurs vidéo</b></td><td>envoient l’image à l’écran ; décodent ou encodent les vidéos</td><td>lire une vidéo sans faire travailler le CPU</td></tr>
<tr><td><b>interfaces radio</b></td><td>modem 4G / 5G, Wi-Fi, Bluetooth, GPS</td><td>passer un appel, recevoir une notification</td></tr>
<tr><td><b>interfaces filaires</b></td><td>USB, lien vers la mémoire flash, l’appareil photo, l’écran</td><td>brancher le téléphone à un ordinateur</td></tr>
<tr><td><b>gestion d’énergie</b></td><td>règle tension et fréquence de chaque bloc, coupe les blocs inutiles</td><td>écran éteint : GPU coupé</td></tr>
<tr><td><b>réseau sur puce</b> (NoC)</td><td>relie tous les blocs entre eux, comme un petit réseau interne</td><td>l’image va de l’ISP à la RAM puis au GPU</td></tr></table></div>
<p>S’y ajoutent souvent des circuits spécialisés : processeur d’image (<b>ISP</b>) pour l’appareil photo, accélérateur d’intelligence artificielle (<b>NPU</b>), processeur de signal (<b>DSP</b>) pour le son, bloc de sécurité qui garde les clés de chiffrement.</p>
<p>Ce qui reste <b>hors</b> de la puce : la batterie, l’écran, les capteurs, l’antenne, la mémoire flash de stockage, souvent la RAM (soudée juste au-dessus du SoC, dans le même empilement), et une puce de gestion d’alimentation qui fournit les tensions à partir de la batterie.</p>
[[w-arch-soc]]` },

    { id: "i4", t: "Avantage 1 : la vitesse", h: `
<p>Pourquoi est-ce plus rapide quand tout est sur la même puce ? Trois raisons.</p>
<ol><li><b>Les distances sont courtes.</b> Un signal électrique ne va pas plus vite que la lumière. À 3 GHz, un cycle d’horloge dure un tiers de nanoseconde : pendant ce temps, même la lumière ne parcourt que 10 cm.
[[soc-cycle]]
Entre deux puces d’une carte mère, il faut plusieurs cycles pour faire l’aller-retour ; entre deux blocs d’un SoC séparés de quelques millimètres, beaucoup moins.</li>
<li><b>Les liaisons sont plus nombreuses et plus larges.</b> Sur une carte, chaque fil entre deux puces passe par une broche, et le nombre de broches est limité. Dans la puce, on peut tirer des milliers de connexions entre deux blocs : plus de données passent à chaque cycle.</li>
<li><b>Des circuits spécialisés</b> font mieux qu’un programme : décoder une vidéo, corriger une photo ou chiffrer des données avec un bloc dédié est beaucoup plus rapide qu’avec des instructions générales sur le CPU.</li></ol>
<p>Le CPU passe une grande partie de son temps à <b>attendre la mémoire</b>. Les mémoires locales (caches) intégrées à côté des cœurs réduisent ces attentes : l’exercice écrit de ce chapitre le chiffre.</p>` },

    { id: "i5", t: "Avantage 2 : la consommation", h: `
<p>Sur un téléphone, l’énergie est la contrainte principale (batterie, chaleur). L’intégration aide de plusieurs façons.</p>
<ul><li><b>Des fils courts consomment moins</b> : à chaque changement de 0 à 1, il faut charger électriquement le fil ; un fil de quelques millimètres dans la puce demande bien moins d’énergie qu’une piste de carte mère et les circuits d’entrée-sortie qui la pilotent.</li>
<li><b>Couper ce qui ne sert pas</b> : le bloc de gestion d’énergie coupe l’alimentation du GPU quand l’écran est éteint, ou ralentit l’horloge d’un cœur peu occupé. Musique écran éteint : seuls quelques blocs restent alimentés.</li>

  idees: [
    { id: "i1", t: "Des données hiérarchiques", h: `
<p>Les listes, piles et files rangent les données en ligne. Beaucoup de données sont <b>hiérarchiques</b> : un élément « contient » ou « commande » plusieurs autres.</p>
<ul><li>l’arborescence des fichiers : un dossier contient des fichiers et des sous-dossiers ;</li>
<li>une page web : la balise <code>&lt;html&gt;</code> contient <code>&lt;head&gt;</code> et <code>&lt;body&gt;</code>, qui contiennent d’autres balises (le DOM) ;</li>
<li>un tableau de tournoi (quarts, demies, finale), un arbre généalogique ;</li>
<li>une expression arithmétique : dans (3 + 4) × (6 − 1), la multiplication porte sur deux sous-expressions.</li></ul>
<div class="boite def"><div class="lab">"""vocabulaire"""</div><p>Un <b>arbre</b> est formé de <b>nœuds</b> reliés par des <b>arêtes</b>. Le nœud du haut est la <b>racine</b>. Chaque nœud (sauf la racine) a un unique <b>parent</b> ; ses <b>enfants</b> sont les nœuds qui lui sont reliés en dessous. Un nœud sans enfant est une <b>feuille</b>. Une <b>branche</b> est un chemin de la racine à une feuille.</p></div>` },

    { id: "i2", t: "L’arbre binaire, une structure récursive", h: `
<div class="boite def"><div class="lab">"""définition"""</div><p>Un <b>arbre binaire</b> est soit <b>vide</b>, soit formé d’un nœud, la <b>racine</b>, qui porte une valeur, et de deux arbres binaires : le <b>sous-arbre gauche</b> et le <b>sous-arbre droit</b>. Chaque nœud a donc au plus deux enfants, et on distingue gauche et droit.</p></div>
<p>En Python, on représente un nœud par un objet (chapitre 1) dont deux attributs référencent les sous-arbres, et l’arbre vide par <code>None</code>, exactement comme le maillon d’une liste chaînée (chapitre 3), mais avec deux « suivants ».</p>
[[c7-noeud]]
<p>Cet arbre sert d’exemple dans tout le chapitre : racine A ; feuilles D, G et F ; le sous-arbre gauche de A a pour racine B.</p>` },

    { id: "i3", t: "Mesurer un arbre : taille et hauteur", h: `
<p>La <b>taille</b> est le nombre de nœuds. La <b>hauteur</b> est le nombre de nœuds de la plus longue branche. Les deux se calculent par la même idée récursive : une réponse pour l’arbre vide, puis une combinaison des réponses des deux sous-arbres.</p>
[[c7-mesures]]
<div class="boite attention"><div class="lab">⚠ deux conventions pour la hauteur</div><p>Ici : arbre vide → 0, arbre réduit à sa racine → 1 (on compte les nœuds). Certains sujets comptent les <b>arêtes</b> : racine seule → 0 et arbre vide → −1. La différence est toujours de 1. <b>Lis la définition donnée par l’énoncé</b> et applique-la.</p></div>
<p><b>Encadrement</b> (convention « nœuds ») : un arbre binaire de hauteur <i>h</i> a au moins <i>h</i> nœuds (un « peigne », une seule branche) et au plus 2<sup><i>h</i></sup> − 1 nœuds (tous les niveaux pleins : 1 + 2 + 4 + … + 2<sup><i>h</i>−1</sup>). Inversement, avec <i>n</i> nœuds, la hauteur est comprise entre ⌈log₂(<i>n</i> + 1)⌉ et <i>n</i>.</p>
[[c7-encadrement]]` },

    { id: "i4", t: "Les trois parcours en profondeur", h: `
<p>Parcourir un arbre, c’est visiter chaque nœud une fois. En profondeur, on explore entièrement un sous-arbre avant l’autre ; la seule question est de savoir <b>quand</b> on traite la racine :</p>
<div class="tab-wrap"><table><tr><th>parcours</th><th>ordre</th><th>sur l’arbre exemple</th></tr>
<tr><td>préfixe</td><td>racine, gauche, droit</td><td><code>A B D E G C F</code></td></tr>
<tr><td>infixe</td><td>gauche, racine, droit</td><td><code>D B G E A C F</code></td></tr>
<tr><td>suffixe (ou postfixe)</td><td>gauche, droit, racine</td><td><code>D G E B F C A</code></td></tr></table></div>
[[c7-parcours]]
<p>Choisis un parcours et avance pas à pas : les appels s’empilent comme au chapitre 2, et le numéro d’ordre s’affiche sur chaque nœud traité.</p>
[[w-parcours-arbre]]
<p>Astuce pour l’écrit : fais le tour de l’arbre en longeant les nœuds par la gauche ; le préfixe note un nœud quand on passe <b>à sa gauche</b>, l’infixe quand on passe <b>dessous</b>, le suffixe quand on passe <b>à sa droite</b>.</p>` },

    { id: "i5", t: "Le parcours en largeur, avec une file", h: `
<p>Le parcours <b>en largeur</b> visite les nœuds <b>niveau par niveau</b>, de gauche à droite : A, puis B et C, puis D, E et F, puis G. Il n’est pas récursif : il utilise une <b>file</b> (chapitre 3). On enfile la racine ; tant que la file n’est pas vide, on défile un nœud, on le traite et on enfile ses enfants.</p>
[[c7-largeur]]
<p>Pourquoi une file ? Les enfants d’un nœud passent <b>après</b> tous les nœuds déjà en attente, donc après le reste du niveau courant. Avec une <b>pile</b> à la place de la file, on obtiendrait un parcours en profondeur. Le même schéma servira pour les graphes (chapitre 8). Dans l’animation ci-dessus, choisis « en largeur » pour voir la file évoluer.</p>` },

    { id: "i6", t: "Un exemple d’utilisation : les arbres d’expressions", h: `
<p>Une expression arithmétique se représente par un arbre dont les feuilles sont les nombres et les nœuds internes les opérations. Pour l’évaluer, on évalue d’abord les deux sous-arbres, puis on applique l’opération : c’est un parcours <b>suffixe</b>.</p>
[[c7-expression]]
<p>Le parcours suffixe écrit l’expression en <b>notation polonaise inverse</b>, celle que l’on évalue avec une pile (chapitre 3). Le parcours infixe, avec des parenthèses, redonne l’écriture habituelle. Les compilateurs et les calculatrices utilisent ce genre d’arbre pour analyser les expressions.</p>` },

    { id: "i7", t: "L’arbre binaire de recherche (ABR)", h: `
<div class="boite def"><div class="lab">"""définition"""</div><p>Un <b>arbre binaire de recherche</b> est un arbre binaire dont les nœuds portent des <b>clés</b> comparables, tel que, pour chaque nœud, toutes les clés de son sous-arbre gauche sont <b>inférieures</b> à sa clé et toutes celles de son sous-arbre droit sont <b>supérieures</b> (les doublons sont soit interdits, soit placés d’un côté choisi, ici à droite).</p></div>
<p>Conséquence : le parcours <b>infixe</b> d’un ABR donne ses clés <b>dans l’ordre croissant</b>. Pour <b>rechercher</b> une clé, on la compare à la racine : égale, trouvée ; plus petite, on continue à gauche ; plus grande, à droite. Pour <b>insérer</b>, on descend de la même façon jusqu’à une place vide, où l’on crée une feuille.</p>
[[c7-abr]]
[[w-abr]]
<p>La plus petite clé est tout en bas à gauche :</p>
[[c7-minimum]]` },

    { id: "i8", t: "Coût : tout dépend de la hauteur", h: `
<p>Recherche et insertion suivent <b>une seule branche</b> : elles font au plus <i>h</i> comparaisons, où <i>h</i> est la hauteur. Si l’arbre est <b>équilibré</b> (tous les niveaux presque pleins), <i>h</i> vaut environ log₂ <i>n</i> : une vingtaine de comparaisons pour un million de clés, comme la recherche dichotomique. Mais l’arbre dépend de l’<b>ordre d’insertion</b> : des clés insérées déjà triées donnent un « peigne » de hauteur <i>n</i>, et la recherche redevient linéaire.</p>
[[c7-degenere]]
<div class="boite hp"><div class="lab"># pour aller plus loin : les arbres équilibrés</div><p>Les arbres AVL (Adelson-Velsky et Landis, 1962) ou rouge-noir se rééquilibrent à chaque insertion par des « rotations », pour garantir une hauteur de l’ordre de log₂ <i>n</i>. Les index des bases de données (chapitre 6) utilisent des arbres équilibrés de la famille des B-arbres.</p></div>` },

    { id: "i9", t: "Programmer par classe : un ABR comme objet", h: `
<p>Le programme cite les arbres comme exemple de programmation par classe. On peut cacher les nœuds derrière une classe qui offre une interface simple (ajouter, contient, trie) : c’est la séparation interface / implémentation du chapitre 3.</p>
[[c7-classe]]
<p>Les chaînes se comparent dans l’ordre alphabétique (plus précisément, l’ordre des codes des caractères) : le parcours infixe les renvoie triées. Un ABR peut ainsi servir de dictionnaire <b>ordonné</b>, ce que le dictionnaire de Python (chapitre 5) ne fait pas.</p>` }

  titre: "L’épreuve de NSI",

<div class="chiffres"><div><b>3 h 30</b><span>partie écrite, sur 20, coefficient 0,75</span></div><div><b>1 h</b><span>partie pratique sur ordinateur, sur 20, coefficient 0,25</span></div><div><b>16</b><span>coefficient de la spécialité dans le bac</span></div><div><b>2 / 20</b><span>maîtrise de la langue à l’écrit (nouveau en 2027)</span></div></div>

<h2>Le format officiel</h2>
<p>Texte de référence : <b>note de service du 11 septembre 2026</b> (BO spécial n° 4 du 17 septembre 2026), applicable <b>à partir de la session 2027</b>. Elle remplace la note du 4 juillet 2025 (session 2026), dont elle garde la structure.</p>
<div class="tab-wrap"><table>
<tr><th></th><th>partie écrite</th><th>partie pratique</th></tr>
<tr><td>durée</td><td>3 h 30</td><td>1 h</td></tr>
<tr><td>note</td><td>sur 20, coefficient 0,75</td><td>sur 20 (au demi-point), coefficient 0,25</td></tr>
<tr><td>contenu</td><td>3 exercices indépendants, tous à traiter</td><td>« programmer sur ordinateur une application informatique à partir d’un document fourni »</td></tr>
<tr><td>matériel</td><td>calculatrice non autorisée (mention portée sur les sujets)</td><td>un ordinateur avec Python</td></tr>
<tr><td>évaluation</td><td>copie corrigée ; 2 points sur 20 pour la maîtrise de la langue</td><td>dialogue avec un professeur-examinateur, qui suit au plus 4 candidats à la fois et ne peut pas être ton professeur de l’année</td></tr>
</table></div>
<p><b>Note de l’épreuve</b> = 0,75 × écrit + 0,25 × pratique, sur 20. Exemple : 12 à l’écrit et 16 en pratique donnent 0,75 × 12 + 0,25 × 16 = <b>13</b>. Cette note compte avec un <b>coefficient 16</b> dans le baccalauréat. Les candidats individuels ou d’établissements hors contrat sont dispensés de la pratique : leur note est celle de l’écrit.</p>
<h3>Sur quoi porte l’épreuve</h3>
<p>Sur <b>tout le programme de Terminale</b>. Les notions de Première non approfondies en Terminale « doivent être connues et mobilisables », mais elles « ne peuvent cependant pas constituer un ressort essentiel du sujet ».</p>
<div class="boite ex"><div class="lab"># et les parties exclues ?</div><p>Pour les sessions 2022 et 2023, quand l’écrit avait lieu au printemps, une note de service du 12 juillet 2021 retirait certaines parties du programme de l’évaluation. Ces dispositions ont été <b>abrogées</b>, et les notes de service en vigueur (session 2026 et session 2027) n’excluent <b>aucune</b> partie : tout le programme de Terminale peut tomber à l’écrit. Les sujets récents mélangent d’ailleurs plusieurs rubriques dans un même exercice (par exemple, en 2025 : « graphes et programmation orientée objet », « algorithmique, récursivité et files »).</p></div>
<h3>La partie pratique en détail</h3>
<p>Les sujets sont tirés d’une <b>banque nationale</b> publiée au plus tard le 24 mars de chaque session (adresse officielle donnée par la note de service : <code>sujets.examens-concours.gouv.fr/delos/public/bgt/nsi</code>). L’établissement retient une liste de sujets, le jury en attribue un à chaque candidat.</p>
<p>Depuis la session 2026, un sujet est un petit projet : un document et un fichier Python fournis, puis une série de questions (compléter une fonction, écrire des tests, trouver et corriger une erreur, expliquer un résultat), avec des moments d’échange avec l’examinateur. Pour la session 2026, la banque comptait 23 sujets, publiés le 26 mars 2026, et la grille nationale évaluait quatre compétences : <b>programmation (35 %)</b>, <b>compréhension (25 %)</b>, <b>autonomie (20 %)</b> et <b>oral (20 %)</b>, chacune notée « insuffisant, fragile, suffisant ou maîtrisé » puis convertie en note sur 20 (d’après les documents de formation académiques de la session 2026 ; la grille de 2027 sera confirmée avec la banque).</p>
<p class="muet petit">Avant 2026, la pratique comportait deux exercices notés sur 10 : un algorithme du programme à écrire, puis un programme « à trous » à compléter. Beaucoup d’annales en ligne suivent encore ce format : elles restent un bon entraînement.</p>
<h3>Oral de contrôle (second groupe)</h3>
<p>20 minutes de préparation, 20 minutes d’oral. L’examinateur propose au moins deux questions portant sur des parties différentes du programme.</p>

<h2>Méthode pour l’écrit, pas à pas</h2>
<ol>
<li><b>Lire tout le sujet (10 min).</b> Chaque exercice commence par « Cet exercice porte sur… » : repère les thèmes, commence par celui que tu maîtrises le mieux, et numérote clairement (Exercice 2, question 3.b).</li>
<li><b>Répartir le temps.</b> Environ 1 h par exercice, proportionnellement aux points, et 20 à 30 min de relecture. Ne reste jamais bloqué plus de 5 min sur une question : les questions suivantes sont souvent faisables en admettant le résultat d’avant.</li>
<li><b>Questions « que renvoie / qu’affiche ».</b> Fais un tableau des variables à chaque tour de boucle ou dessine la pile des appels (chapitre 2). Écris le résultat <b>et</b> la justification.</li>
<li><b>Questions de code.</b> Recopie la signature (<code>def f(t, x):</code>), indente nettement (des traits verticaux aident), réutilise les fonctions déjà définies dans le sujet, respecte l’interface imposée (pile, file, classe) et n’importe pas de bibliothèque que l’énoncé n’autorise pas.</li>
<li><b>Questions de justification.</b> Une phrase complète avec le vocabulaire exact : « cas de base », « appel récursif », « LIFO », « clé primaire », « coût linéaire ». Depuis 2027, l’orthographe, la syntaxe, le lexique et l’organisation du propos valent 2 points.</li>
<li><b>Relecture.</b> Un <code>return</code> mal placé (dans la boucle), un <code>self</code> oublié, un cas vide non traité : ce sont les erreurs qui coûtent le plus de points.</li>
</ol>

<h2>Méthode pour la partie pratique</h2>
<ol>
<li><b>Lis le document</b> et <b>exécute le fichier fourni tel quel</b> avant de toucher à quoi que ce soit : tu vois ce qui marche déjà.</li>
<li><b>Avance par petits pas</b> : une fonction, puis tout de suite un essai dans la console, puis des <code>assert</code> (chapitre 4).</li>
<li><b>Pour une question « trouver l’erreur »</b> : reproduis-la sur l’entrée la plus simple, lis la dernière ligne de la trace, formule la cause avant de corriger.</li>
<li><b>Prépare-toi à expliquer</b>, c’est une partie de la note. Questions typiques d’un examinateur : quels sont les paramètres et leurs types ? que renvoie la fonction ? écris sa docstring ; la fonction est-elle récursive, quel est son cas de base ? pourquoi la boucle se termine-t-elle ? pourquoi <code>for</code> plutôt que <code>while</code> ? quelle différence entre <code>/</code> et <code>//</code>, entre <code>==</code> et <code>is</code>, entre <code>sorted(t)</code> et <code>t.sort()</code> ? que représente <code>self</code> ? quel est le coût ?</li>
<li><b>Autonomie</b> : cherche d’abord seul, mais si tu es bloqué, demande à l’examinateur plutôt que de perdre tout le temps restant.</li>
</ol>
<p>Pour t’entraîner : les exercices « type épreuve pratique » de chaque chapitre, puis la banque officielle et les sites d’exercices de la page <a href="#ressources">Ressources</a>.</p>

<h2>Copie modèle commentée</h2>
<p class="muet">Exercice inventé pour le site (4 points), suivi d’une copie rédigée et des remarques d’un correcteur.</p>
<div class="exo"><div class="tete"><span class="t">sujet · récursivité</span><span class="etiq a">4 points</span></div><div class="corps">
<p>On considère la fonction suivante, où <code>t</code> est une liste d’entiers et <code>i</code> un indice.</p>[[ep-mystere|nosortie]]
<ol><li>Que renvoie <code>mystere([4, 7, 2, 9, 6], 0)</code> ? Détailler les appels. <span class="bareme">(1 pt)</span></li>
<li>Quel est le rôle de cette fonction ? Proposer un nom plus explicite. <span class="bareme">(1 pt)</span></li>
<li>Combien d’appels sont faits pour une liste de <i>n</i> éléments ? Que se passe-t-il avec une liste de 5 000 éléments ? <span class="bareme">(1 pt)</span></li>
<li>Écrire une version itérative. <span class="bareme">(1 pt)</span></li></ol></div></div>
<div class="copie">
<div class="ligne-c"><div><p><b>1.</b> mystere(t, 0) → 4 est pair : 1 + mystere(t, 1) → 7 impair : mystere(t, 2) → 2 pair : 1 + mystere(t, 3) → 9 impair : mystere(t, 4) → 6 pair : 1 + mystere(t, 5) → i = 5 = len(t) : cas de base, renvoie 0. En remontant : 0, 1, 1, 2, 2, 3. La fonction renvoie <b>3</b>.</p></div><div class="marge ok">Descente et remontée détaillées, cas de base nommé : 1/1.</div></div>
<div class="ligne-c"><div><p><b>2.</b> Elle compte les éléments pairs de t à partir de l’indice i. Nom proposé : <code>nb_pairs_depuis</code>.</p></div><div class="marge ok">Réponse précise (« à partir de l’indice i ») et nom explicite : 1/1.</div></div>
<div class="ligne-c"><div><p><b>3.</b> Il y a un appel par indice de 0 à n, donc n + 1 appels. Avec 5 000 éléments il y aurait 5 001 appels imbriqués, ça fait trop.</p></div><div class="marge">« Ça fait trop » est insuffisant : il fallait dire que la pile d’exécution dépasse la limite de 1 000 appels de Python, qui lève une <code>RecursionError</code>. 0,5/1.</div></div>
<div class="ligne-c"><div>[[ep-copie-q4|nosortie]]</div><div class="marge ok">Version itérative juste, avec docstring ; le cas de la liste vide fonctionne (renvoie 0). 1/1.</div></div>
</div>
<p><b>Total : 3,5 / 4.</b> Ce qui fait la différence : nommer les notions (cas de base, pile d’exécution, RecursionError) et justifier chaque réponse au lieu de donner seulement le résultat.</p>

<h2>Le Grand oral</h2>
<p>Note de service du 10 septembre 2026, applicable à partir de la session 2027 : <b>20 minutes de préparation, 20 minutes d’épreuve, coefficient 8</b>.</p>
<ul><li>Tu présentes au jury <b>deux questions</b> adossées à tes deux spécialités (une par spécialité, ou transversales). Le jury en choisit une.</li>
<li><b>Premier temps (10 min)</b>, debout : tu expliques pourquoi tu as choisi cette question, puis tu la développes et tu y réponds. Tu peux préparer un support pendant les 20 minutes ; il n’est pas évalué.</li>
<li><b>Second temps (10 min)</b> : échange avec le jury (deux professeurs, dont l’un représente une de tes spécialités), qui peut t’interroger sur tout le programme de cycle terminal de tes spécialités, en lien avec ta question.</li></ul>
<p>Pistes de questions en NSI, à construire avec ton professeur : « Un programme peut-il détecter tous les bugs d’un autre programme ? » (calculabilité, problème de l’arrêt) ; « Comment un GPS trouve-t-il un itinéraire ? » (graphes, recherche de chemin) ; « Pourquoi le cadenas HTTPS protège-t-il un paiement en ligne ? » (chiffrement symétrique et asymétrique) ; « La récursivité, élégance ou danger ? » (pile d’exécution, coût) ; « Comment une base de données gère-t-elle des millions d’accès en même temps ? » (SGBD).</p>`

  /* ---------- QCM ---------- */
  function qcmHTML(liste, cle, c) {
    var st = etat.qcm[cle] || (etat.qcm[cle] = { rep: {} });
    var h = '<div class="qcm-score" data-score="' + cle + '"><span class="sc"></span><span class="barre-p"><i></i></span><button class="btn petit" type="button" data-raz="' + cle + '">recommencer</button></div>';

        q.c.map(function (ch, j) { return '<button type="button" data-j="' + j + '"><span class="lt">' + "ABCDE"[j] + '</span><span>' + ch + "</span></button>"; }).join("") + '</div><div class="slot"></div></div>';

  function initQCM(zone, liste, cle) {
    var st = etat.qcm[cle] || (etat.qcm[cle] = { rep: {} });
    function maj() {
      var n = 0, ok = 0;
      Object.keys(st.rep).forEach(function (k) { n++; if (st.rep[k] === liste[k].a) ok++; });
      $(".sc", zone).textContent = ok + " / " + n + " juste" + (ok > 1 ? "s" : "") + " · " + liste.length + " q.";
      $(".barre-p i", zone).style.width = (100 * n / liste.length) + "%";
    }
    function montre(qel, k, j, anim) {
      var q = liste[k], bon = j === q.a;
      $$(".choix button", qel).forEach(function (b, i) { b.disabled = true; if (i === q.a) b.classList.add("bon"); else if (i === j) b.classList.add("faux"); });
      var ref = q.ref ? q.ref.split(":") : null;
      var lien = ref ? '<a class="lien-revoir" href="#' + ref[0] + "/" + ref[1] + '">' + ic("retour") + "Revoir le paragraphe</a>" : "";
      $(".slot", qel).innerHTML = '<div class="expl"><span class="v ' + (bon ? "ok" : "ko") + '">' + (bon ? "✔ Exact. " : "✘ Non : la bonne réponse est " + "ABCDE"[q.a] + ". ") + "</span>" + q.e + "<br>" + lien + "</div>";
      qel.classList.add("repondu", bon ? "ok" : "ko");
      if (anim === false) qel.classList.remove("ok", "ko");
    }
    $$(".q", zone).forEach(function (qel) {
      var k = +qel.getAttribute("data-k");
      if (st.rep[k] !== undefined) montre(qel, k, st.rep[k], false);
      $$(".choix button", qel).forEach(function (b) {
        b.addEventListener("click", function () {
          if (st.rep[k] !== undefined) return;
          st.rep[k] = +b.getAttribute("data-j");
          montre(qel, k, st.rep[k]);
          maj();
        });
      });
    });
    var raz = $("[data-raz]", zone);
    raz.addEventListener("click", function () { st.rep = {}; if (cle === "entr") etat.entr = null; render(); });
    maj();
  }
  function tousQCM() {

    CH.forEach(function (c) { c.qcm.forEach(function (q) { var x = Object.assign({}, q); x.ref = x.ref || null; if (x.ref && x.ref.indexOf(":") < 0) x.ref = c.id + ":" + x.ref; x.ch = c; t.push(x); }); });

      msg(mode === "pile" ? "Une <b>pile</b> : on ajoute et on retire <b>du même côté</b>, le sommet. Le dernier entré est le premier sorti (LIFO)." : vue2 ? "Une file réalisée avec <b>deux piles</b> : on empile dans <code>entree</code> ; pour défiler, on dépile <code>sortie</code>, et si elle est vide on y verse d’abord toute la pile <code>entree</code>, ce qui remet les éléments dans le bon ordre." : "Une <b>file</b> : on ajoute à la queue, on retire à la tête. Le premier entré est le premier sorti (FIFO).");
      boutons(); dessine(false);
    }
    $$(".choix-w button", z).forEach(function (b) { b.addEventListener("click", function () { changer(b.getAttribute("data-m")); }); });
    $$("[data-o]", z).forEach(function (b) {
      b.addEventListener("click", function () {
        var o = b.getAttribute("data-o");
        if (o === "in") {
          var v = inp.value.trim() || String(cpt);
          if (data.length >= 7) { msg("Assez pour l’affichage : 7 éléments au plus ici (une vraie pile n’a pas cette limite)."); return; }
          data.push(v); if (vue2) entree.push(v); cpt++;
          log(nom() + (mode === "pile" ? ".empiler(" : ".enfiler(") + (isNaN(+v) ? '"' + v + '"' : v) + ")");
          msg(mode === "pile" ? "<b>" + esc(v) + "</b> est posé au sommet." : "<b>" + esc(v) + "</b> rejoint la queue de la file." + (vue2 ? " (empilé dans <code>entree</code>)" : ""));
          inp.value = String(cpt); dessine(true);
        } else if (o === "out") {
          if (!data.length) { log(nom() + (mode === "pile" ? ".depiler()" : ".defiler()"), "IndexError: " + (mode === "pile" ? "pile vide" : "file vide"), true); msg("Erreur : on ne peut pas retirer un élément d’une structure vide. Teste <code>est_vide()</code> avant."); return; }
          var r;
          if (mode === "pile") { r = data.pop(); msg("On retire le <b>sommet</b> : " + esc(r) + ", le dernier arrivé."); }
          else {
            r = data.shift();
            if (vue2) {
              var tr = "";
              if (!sortie.length) { var n = entree.length; while (entree.length) sortie.push(entree.pop()); tr = " La pile <code>sortie</code> était vide : on y a d’abord versé les " + n + " éléments de <code>entree</code> (leur ordre s’inverse)."; }
              sortie.pop(); msg("On dépile <code>sortie</code> : <b>" + esc(r) + "</b>, le premier arrivé." + tr);
            } else msg("On retire la <b>tête</b> : " + esc(r) + ", le premier arrivé.");
          }
          log(nom() + (mode === "pile" ? ".depiler()" : ".defiler()"), isNaN(+r) ? "'" + r + "'" : r); dessine(false);
        } else if (o === "vide") { log(nom() + ".est_vide()", data.length ? "False" : "True"); msg(data.length ? "La structure contient " + data.length + " élément(s)." : "Elle est vide."); }
        else changer(vue2 ? "file2" : mode);
      });
    });
    changer(mode);
  };

  /* ---- 3. liste chaînée qui se construit ---- */
  WIDGETS["liste-chainee"] = function (z) {
    var vals = [3, 5, 8], visite = -1, neuf = -1, occupe = false, cpt = 0;
    var CODES = {
      tete: "def ajouter_tete(self, v):\n    self.tete = Maillon(v, self.tete)",
      queue: "def ajouter_queue(self, v):\n    if self.tete is None:\n        self.tete = Maillon(v)\n    else:\n        m = self.tete\n        while m.suivant is not None:\n            m = m.suivant\n        m.suivant = Maillon(v)",
      suppr: "def supprimer_tete(self):\n    v = self.tete.valeur\n    self.tete = self.tete.suivant\n    return v",
      long: "def longueur(self):\n    n = 0\n    m = self.tete\n    while m is not None:\n        n = n + 1\n        m = m.suivant\n    return n"
    };
    z.innerHTML = '<div class="w"><div class="tete"><span class="lab">liste chaînée qui se construit</span></div><div class="corps"><div class="lc"></div>' +
      '<div class="cmd" style="margin-top:10px"><label class="sr" for="lc-v">valeur</label><input type="text" id="lc-v" maxlength="3" value="1" autocomplete="off"><button class="btn petit prim" type="button" data-o="tete">ajouter en tête</button><button class="btn petit" type="button" data-o="queue">ajouter en queue</button><button class="btn petit" type="button" data-o="suppr">supprimer la tête</button><button class="btn petit" type="button" data-o="long">longueur()</button><button class="btn petit" type="button" data-o="raz">recommencer</button></div>' +
      '<div class="msg" aria-live="polite"></div><div class="zc"></div></div></div>';
    function dessine() {
      var W = 104, X0 = 20, Y = 44, n = vals.length, larg = Math.max(X0 + n * W + 90, 330);
      var s = '<svg viewBox="0 0 ' + larg + ' 100" width="' + larg + '" role="img" aria-label="Liste chaînée de ' + n + ' maillons">';
      s += '<text class="tete-l" x="' + X0 + '" y="18">tete</text><path class="fl" d="M' + (X0 + 14) + " 24 L" + (X0 + 14) + " " + (Y - 4) + '"/><path class="pt" d="M' + (X0 + 9) + " " + (Y - 9) + " L" + (X0 + 14) + " " + (Y - 1) + " L" + (X0 + 19) + " " + (Y - 9) + 'z"/>';
      vals.forEach(function (v, k) {
        var x = X0 + k * W;
        s += '<g class="mai' + (k === visite ? " visite" : "") + (k === neuf ? " neuf" : "") + '"><rect x="' + x + '" y="' + Y + '" width="72" height="36" rx="6"/><line class="sep" x1="' + (x + 44) + '" y1="' + Y + '" x2="' + (x + 44) + '" y2="' + (Y + 36) + '"/><text x="' + (x + 22) + '" y="' + (Y + 23) + '" text-anchor="middle">' + esc(v) + '</text><circle class="pt" cx="' + (x + 58) + '" cy="' + (Y + 18) + '" r="4"/></g>';
        var x2 = x + W;
        s += '<path class="fl" d="M' + (x + 62) + " " + (Y + 18) + " L" + (x2 - 6) + " " + (Y + 18) + '"/><path class="pt" d="M' + (x2 - 12) + " " + (Y + 13) + " L" + (x2 - 4) + " " + (Y + 18) + " L" + (x2 - 12) + " " + (Y + 23) + 'z"/>';
      });
      s += '<text class="none" x="' + (X0 + n * W) + '" y="' + (Y + 23) + '">None</text></svg>';
      if (!n) s = s.replace("M" + (X0 + 14) + " 24 L" + (X0 + 14) + " " + (Y - 4), "M" + (X0 + 14) + " 24 L" + (X0 + 14) + " " + (Y - 4));
      $(".lc", z).innerHTML = s;
    }
    function code(k) { $(".zc", z).innerHTML = '<div class="code zebre"><div class="tete"><span class="f">méthode de ListeChainee</span></div><pre><code>' + lignes(hlPy(CODES[k])) + "</code></pre></div>"; }
    function msg(t) { $(".msg", z).innerHTML = t; }
    function parcours(jusqua, fin) {
      if (!MO() || jusqua < 0) { visite = -1; fin(); return; }
      occupe = true; var k = 0;
      (function pas() {
        visite = k; dessine();
        if (k >= jusqua) { setTimeout(function () { visite = -1; occupe = false; fin(); }, 380); return; }
        k++; setTimeout(pas, 380);
      })();
    }
    $$("[data-o]", z).forEach(function (b) {
      b.addEventListener("click", function () {
        if (occupe) return;
        var o = b.getAttribute("data-o"), inp = $("input", z), v = inp.value.trim() || String(++cpt);
        neuf = -1;
        if (o === "tete") {
          if (vals.length >= 8) { msg("8 maillons au plus pour l’affichage."); return; }
          vals.unshift(v); neuf = 0; code("tete"); dessine();
          msg("Nouveau maillon <b>" + esc(v) + "</b> dont le suivant est l’ancienne tête. <b>Aucun maillon parcouru</b> : coût constant, quelle que soit la longueur.");
        } else if (o === "queue") {
          if (vals.length >= 8) { msg("8 maillons au plus pour l’affichage."); return; }
          code("queue");
          var n = vals.length;
          parcours(n - 1, function () { vals.push(v); neuf = vals.length - 1; dessine(); msg("Pour atteindre le dernier maillon, il a fallu <b>parcourir les " + n + " maillons</b> depuis la tête : coût proportionnel à la longueur."); });
        } else if (o === "suppr") {
          code("suppr");
          if (!vals.length) { msg("<b>AttributeError</b> : la liste est vide, <code>self.tete</code> vaut None et None n’a pas d’attribut <code>valeur</code>."); return; }
          var r = vals.shift(); dessine(); msg("On renvoie <b>" + esc(r) + "</b> et la tête devient le maillon suivant. Coût constant. Le maillon retiré n’est plus référencé : Python libère sa mémoire.");
        } else if (o === "long") {
          code("long");
          var m = vals.length;
          parcours(m - 1, function () { dessine(); msg("<code>longueur()</code> renvoie <b>" + m + "</b> : on a suivi les liens maillon par maillon jusqu’à None (" + m + " pas)."); });
        } else { vals = [3, 5, 8]; cpt = 0; dessine(); msg("Liste de départ : 3 → 5 → 8 → None."); $(".zc", z).innerHTML = ""; }
        inp.value = String(isNaN(+v) ? 1 : +v + 1);
      });
    });
    dessine(); msg("Chaque maillon contient une <b>valeur</b> et une <b>référence</b> vers le maillon suivant ; le dernier pointe vers <code>None</code>. Ajoute, retire, mesure : regarde combien de maillons sont parcourus.");
  };

  /* ---- 4. diagramme de classe et objets en mémoire ---- */
  WIDGETS.uml = function (z) {
    var ETAPES = [
      { l: "class Compte: ...", m: "La <b>classe</b> est un plan : elle décrit les attributs (données) et les méthodes (actions). À ce stade, <b>aucun objet n’existe</b>." },
      { l: 'c1 = Compte("Ada", 100)', m: "<b>Instanciation</b> : Python fabrique un objet, appelle <code>__init__</code> avec <code>self</code> = ce nouvel objet, puis range dans <code>c1</code> une <b>référence</b> vers lui." },
      { l: 'c2 = Compte("Alan")', m: "Un second objet, <b>indépendant</b> du premier. Le solde n’a pas été donné : la valeur par défaut 0 s’applique." },
      { l: "c1.deposer(50)", m: "Appel de méthode : <code>self</code> reçoit l’objet désigné par <code>c1</code>. Seul cet objet est modifié." },
      { l: "c3 = c1", m: "<b>Aucun objet n’est copié</b> : <code>c3</code> est un deuxième nom pour le même objet (un <i>alias</i>). <code>c3 is c1</code> vaut True." },
      { l: "c3.retirer(30)", m: "On passe par <code>c3</code>… mais l’objet est celui de <code>c1</code> : <code>c1.solde</code> vaut désormais 120. C’est la <b>mutation partagée</b>." },
      { l: "print(c1.solde, c2.solde)", m: "Affiche <code>120 0</code>." }
    ];
    var k = 0;
    z.innerHTML = '<div class="w"><div class="tete"><span class="lab">classe, objets et références</span></div><div class="corps uml"><div class="svgz"></div><div class="code"><div class="sortie" style="border-top:0"><div class="tete"><span class="f">ligne exécutée</span></div><pre class="ligne-ex"></pre></div></div><div class="msg" aria-live="polite"></div><div class="cmd"><button class="btn petit" type="button" data-c="raz">' + ic("debut") + 'recommencer</button><button class="btn petit prim" type="button" data-c="suiv">ligne suivante' + ic("suite") + '</button><span class="cpt"></span></div></div></div>';
    function fleche(x, y, cl) { return '<path class="' + cl + '" d="M' + (x - 5) + " " + (y + 8) + " L" + x + " " + y + " L" + (x + 5) + " " + (y + 8) + 'z"/>'; }
    function dessine(nouv) {
      var et = $(".svgz", z).clientWidth < 600;
      var G = et ? { W: 400, H: 420, cx: 75, o1: [150, 200], o2: [150, 306], ow: 222, v1: [10, 230], v2: [10, 328], v3: [10, 180], leg: 408 }
                 : { W: 640, H: 380, cx: 200, o1: [190, 214], o2: [420, 214], ow: 200, v1: [18, 226], v2: [18, 276], v3: [18, 176], leg: 365 };
      var s = '<svg viewBox="0 0 ' + G.W + " " + G.H + '" role="img" aria-label="Diagramme de la classe Compte et des objets créés">';
      var X = G.cx;
      s += '<g class="cl"><rect x="' + X + '" y="8" width="250" height="150" rx="4"/><rect class="bandeau" x="' + (X + 1) + '" y="9" width="248" height="26"/><text x="' + (X + 125) + '" y="27" text-anchor="middle" font-weight="700">Compte</text><line class="sep" x1="' + X + '" y1="35" x2="' + (X + 250) + '" y2="35"/>' +
        '<text x="' + (X + 12) + '" y="54">titulaire : str</text><text x="' + (X + 12) + '" y="72">solde : int</text><line class="sep" x1="' + X + '" y1="82" x2="' + (X + 250) + '" y2="82"/>' +
        '<text x="' + (X + 12) + '" y="101">__init__(titulaire, solde=0)</text><text x="' + (X + 12) + '" y="119">deposer(montant)</text><text x="' + (X + 12) + '" y="137">retirer(montant) : bool</text></g>';
      var s1 = k >= 5 ? 120 : k >= 3 ? 150 : 100;
      function objet(o, n, tit, sol, maj, neuf) {
        return '<g class="ob' + (neuf ? " neuf" : "") + '"><rect x="' + o[0] + '" y="' + o[1] + '" width="' + G.ow + '" height="74" rx="6"/><text class="titre" x="' + (o[0] + 10) + '" y="' + (o[1] + 20) + '">objet ' + n + ' : Compte</text><text x="' + (o[0] + 10) + '" y="' + (o[1] + 42) + '">titulaire = "' + tit + '"</text><text x="' + (o[0] + 10) + '" y="' + (o[1] + 62) + '" class="' + (maj ? "maj" : "") + '">solde = ' + sol + "</text></g>";
      }
      function nomv(v, t, neuf) { return '<g class="nomvar' + (neuf ? " neuf" : "") + '"><rect x="' + v[0] + '" y="' + v[1] + '" width="58" height="30" rx="5"/><text x="' + (v[0] + 29) + '" y="' + (v[1] + 20) + '" text-anchor="middle">' + t + "</text></g>"; }
      function ref(d, len, xe, ye) { return '<path class="lien ref trace" style="--len:' + len + '" d="' + d + '"/><path class="tete-ref" d="M' + (xe - 8) + " " + (ye - 5) + " L" + xe + " " + ye + " L" + (xe - 8) + " " + (ye + 5) + 'z"/>'; }
      if (k >= 1) {
        var ix = G.o1[0] + G.ow / 2;
        s += '<path class="lien inst trace" style="--len:60" d="M' + ix + " " + G.o1[1] + " L" + ix + ' 166"/>' + fleche(ix, 160, "tete-f");
        s += objet(G.o1, 1, "Ada", s1, nouv === 3 || nouv === 5, nouv === 1);
        var y1 = G.v1[1] + 15;
        s += nomv(G.v1, "c1", nouv === 1) + ref("M" + (G.v1[0] + 58) + " " + y1 + " L" + (G.o1[0] - 8) + " " + y1, 140, G.o1[0], y1);
      }
      if (k >= 2) {
        s += objet(G.o2, 2, "Alan", 0, false, nouv === 2);
        var y2 = G.v2[1] + 15;
        if (et) {
          var xr = G.o2[0] + G.ow, yr = G.o2[1] + 20;
          s += '<path class="lien inst trace" style="--len:300" d="M' + xr + " " + yr + " L" + (xr + 16) + " " + yr + " L" + (xr + 16) + " 100 L" + (X + 258) + ' 100"/><path class="tete-f" d="M' + (X + 258) + " 95 L" + (X + 250) + " 100 L" + (X + 258) + ' 105z"/>';
          s += nomv(G.v2, "c2", nouv === 2) + ref("M" + (G.v2[0] + 58) + " " + y2 + " L" + (G.o2[0] - 8) + " " + y2, 140, G.o2[0], y2);
        } else {
          s += '<path class="lien inst trace" style="--len:110" d="M520 214 L430 166"/>' + '<path class="tete-f" d="M427 172 L426 162 L435 165z"/>';
          s += nomv(G.v2, "c2", nouv === 2) + '<path class="lien ref trace" style="--len:560" d="M76 291 L100 291 L100 340 L520 340 L520 296"/>' + '<path class="tete-ref" d="M515 304 L520 296 L525 304z"/>';
        }

      if (k >= 4) {
        var y3 = G.v3[1] + 15, ye = G.o1[1] + 14, xm = G.v3[0] + 58 + 40;
        s += nomv(G.v3, "c3", nouv === 4) + ref("M" + (G.v3[0] + 58) + " " + y3 + " L" + xm + " " + y3 + " L" + xm + " " + ye + " L" + (G.o1[0] - 8) + " " + ye, 220, G.o1[0], ye);
      }
      s += '<text x="10" y="' + G.leg + '" class="legende" style="font-size:11px;fill:var(--encre3)">' + (et ? "→ référence · - - → « est une instance de »" : "noms (variables)     → référence      - - → « est une instance de »") + "</text></svg>";
      $(".svgz", z).innerHTML = s;
      $(".ligne-ex", z).innerHTML = hlPy(ETAPES[k].l) + (k === 6 ? '\n<span class="muet">120 0</span>' : "");
      $(".msg", z).innerHTML = ETAPES[k].m;
      $(".cpt", z).textContent = "ligne " + (k + 1) + " / " + ETAPES.length;
      $('[data-c="suiv"]', z).disabled = k >= ETAPES.length - 1;
    }
    $$("[data-c]", z).forEach(function (b) { b.addEventListener("click", function () { if (b.getAttribute("data-c") === "raz") { k = 0; dessine(0); } else if (k < ETAPES.length - 1) { k++; dessine(k); } }); });
    dessine(0);
  };

  /* ---- lecteur commun des animations pas à pas ----
     lecteur(zone, { titre, sous, choix: [{k, t}], etapes: function (k) -> [{msg, ...}],
                     prepare: function (scene, k, etapes), dessine: function (scene, etape, i, etapes, saut), vitesse: ms })
     Chaque étape porte sa légende (msg, en HTML). « saut » vaut true quand on recule ou qu'on recharge :
     le dessin est alors instantané ; sinon il peut s'animer (sous html.mo). */
  function lecteur(z, o) {
    var etapes = [], i = 0, jeu = null, cle = o.choix ? o.choix[0].k : null;
    z.innerHTML = '<div class="w anim"><div class="tete"><span class="lab">' + esc(o.titre) + "</span>" + (o.sous ? '<span class="sous">' + o.sous + "</span>" : "") + '</div><div class="corps">' +
      (o.choix ? '<div class="choix-w">' + o.choix.map(function (c) { return '<button type="button" data-k="' + esc(c.k) + '">' + c.t + "</button>"; }).join("") + "</div>" : "") +
      '<div class="scene"></div><div class="msg" aria-live="polite"></div><div class="cmd"><button class="btn petit" type="button" data-c="debut" aria-label="Revenir au début">' + ic("debut") + '</button><button class="btn petit" type="button" data-c="prec" aria-label="Étape précédente">' + ic("retour") + '</button><button class="btn petit prim" type="button" data-c="suiv">étape' + ic("suite") + '</button><button class="btn petit" type="button" data-c="jeu">' + ic("lecture") + '<span>lecture</span></button><span class="cpt mono"></span></div></div></div>';
    var scene = $(".scene", z);
    function stop() { if (jeu) { clearInterval(jeu); jeu = null; } var b = $('[data-c="jeu"]', z); if (b) b.innerHTML = ic("lecture") + "<span>lecture</span>"; }
    function dessine(saut) {
      var e = etapes[i], n = etapes.length, plein = Math.round(10 * (i + 1) / n);
      o.dessine(scene, e, i, etapes, saut || !MO());
      $(".msg", z).innerHTML = e.msg || "";
      $(".cpt", z).textContent = "[" + "#".repeat(plein) + ".".repeat(10 - plein) + "] " + (i + 1) + "/" + n;
      $('[data-c="prec"]', z).disabled = i === 0; $('[data-c="debut"]', z).disabled = i === 0;
      $('[data-c="suiv"]', z).disabled = i === n - 1;
    }
    function charger(k) {
      cle = k; stop(); etapes = o.etapes(k); i = 0;
      $$(".choix-w button", z).forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-k") === String(k)); });
      if (o.prepare) o.prepare(scene, k, etapes);
      dessine(true);
    }
    $$(".choix-w button", z).forEach(function (b) { b.addEventListener("click", function () { charger(b.getAttribute("data-k")); }); });
    $$("[data-c]", z).forEach(function (b) {
      b.addEventListener("click", function () {
        var c = b.getAttribute("data-c");
        if (c === "debut") { stop(); i = 0; dessine(true); }
        else if (c === "prec") { stop(); if (i > 0) { i--; dessine(true); } }
        else if (c === "suiv") { stop(); if (i < etapes.length - 1) { i++; dessine(false); } }
        else if (jeu) stop();
        else {
          if (i >= etapes.length - 1) { i = 0; dessine(true); }
          b.innerHTML = ic("pause") + "<span>pause</span>";
          jeu = setInterval(function () { if (!document.body.contains(z)) { stop(); return; } if (i < etapes.length - 1) { i++; dessine(false); } else stop(); }, o.vitesse || 1400);
        }
      });
    });
    charger(cle);
    return { charger: charger };
  }
  var OUTILS = { $: $, $$: $$, esc: esc, ic: ic, MO: MO, hlPy: hlPy, hlSql: hlSql, lignes: lignes, lecteur: lecteur, codeHTML: codeHTML };
  window.NSI_OUTILS = OUTILS;

  window.NSI = { render: render, codeHTML: codeHTML, chercher: function (q) { if (!INDEX) construireIndex(); return chercher(q); } };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", demarrer); else demarrer();
})();
