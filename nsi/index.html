<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>import bac — NSI Terminale</title>
<meta name="apple-mobile-web-app-title" content="NSI">
<meta name="description" content="Révisions de la spécialité NSI en Terminale : récursivité, programmation objet, listes, piles, files, modularité et mise au point. Cours, code Python testé, QCM, cartes mémoire, exercices type bac.">
<meta name="theme-color" content="#F8F6EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1114" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if(!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))document.documentElement.classList.add("mo");</script>
<style>
/* import bac — NSI Terminale. Thème « terminal » (sombre, ardoise) et « listing papier » (clair). */
:root{
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "SF Mono", "Fira Code", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
  --r: 10px;
  --side: 286px;
  --lh: 1.62em;
  /* clair : listing papier, encre bleue */
  --bg: #F8F6EC; --bg2: #FFFEF8; --bg3: #EFEDE0; --zebre: #E7F0DF;
  --ligne: #D9D5C3; --ligne2: #C7C2AC;
  --encre: #1D2346; --encre2: #565B73; --encre3: #7C8094;
  --vert: #17733F; --vert-f: #E1F0E2; --ambre: #9A5800; --ambre-f: #FBEBCF;
  --rouge: #B3261E; --rouge-f: #F9E3DF; --bleu: #1F3A9E; --bleu-f: #E4E9F8;
  --violet: #6B3FA0;
  --accent: var(--bleu); --sur-accent: #FFFFFF;
  --k-kw: #9A2F12; --k-str: #17733F; --k-num: #6B3FA0; --k-com: #7C8094; --k-fn: #1F3A9E; --k-bi: #0E6E85; --k-self: #9A5800; --k-op: #1D2346;
  --code-bg: #FFFEF6; --code-enc: #1D2346; --gout: #A39F88;
  --ombre: 0 1px 0 rgba(29,35,70,.05), 0 6px 18px rgba(29,35,70,.07);
  --scan: none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #0A1114; --bg2: #0F181C; --bg3: #142127; --zebre: #121E23;
    --ligne: #213239; --ligne2: #2C424A;
    --encre: #D6E5DC; --encre2: #93AAA3; --encre3: #6D847F;
    --vert: #4FE08C; --vert-f: #11291E; --ambre: #FFB547; --ambre-f: #2A2112; --rouge: #FF7A70; --rouge-f: #2C1513;
    --bleu: #7CC4FF; --bleu-f: #10202D; --violet: #C9A8FF;
    --accent: var(--vert); --sur-accent: #06110B;
    --k-kw: #FFB547; --k-str: #8FE3A8; --k-num: #C9A8FF; --k-com: #6D847F; --k-fn: #7CC4FF; --k-bi: #5FD7E0; --k-self: #FF9E7A; --k-op: #D6E5DC;
    --code-bg: #0C1518; --code-enc: #D6E5DC; --gout: #3E5A5F;
    --ombre: 0 0 0 1px rgba(79,224,140,.04), 0 8px 24px rgba(0,0,0,.35);
    --scan: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
  }
}
:root[data-theme="dark"]{
  --bg: #0A1114; --bg2: #0F181C; --bg3: #142127; --zebre: #121E23;
  --ligne: #213239; --ligne2: #2C424A;
  --encre: #D6E5DC; --encre2: #93AAA3; --encre3: #6D847F;
  --vert: #4FE08C; --vert-f: #11291E; --ambre: #FFB547; --ambre-f: #2A2112; --rouge: #FF7A70; --rouge-f: #2C1513;
  --bleu: #7CC4FF; --bleu-f: #10202D; --violet: #C9A8FF;
  --accent: var(--vert); --sur-accent: #06110B;
  --k-kw: #FFB547; --k-str: #8FE3A8; --k-num: #C9A8FF; --k-com: #6D847F; --k-fn: #7CC4FF; --k-bi: #5FD7E0; --k-self: #FF9E7A; --k-op: #D6E5DC;
  --code-bg: #0C1518; --code-enc: #D6E5DC; --gout: #3E5A5F;
  --ombre: 0 0 0 1px rgba(79,224,140,.04), 0 8px 24px rgba(0,0,0,.35);
  --scan: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:var(--scan);color:var(--encre);font-family:var(--sans);font-size:17px;line-height:1.6;overflow-x:hidden}
a{color:var(--bleu);text-underline-offset:3px}
button{font:inherit;color:inherit}
code,kbd,pre,.mono{font-family:var(--mono)}
:not(pre)>code{font-size:.88em;background:var(--bg3);border:1px solid var(--ligne);border-radius:5px;padding:.05em .35em;overflow-wrap:anywhere}
kbd{font-size:.8em;border:1px solid var(--ligne2);border-bottom-width:2px;border-radius:5px;padding:0 .4em;background:var(--bg2)}
h1,h2,h3,h4{font-family:var(--mono);line-height:1.25;letter-spacing:-.01em}
h1{font-size:1.65rem;margin:.2em 0 .4em}
h2{font-size:1.22rem;margin:2.1em 0 .7em;padding-bottom:.35em;border-bottom:1px dashed var(--ligne2)}
h2::before{content:"## ";color:var(--ambre)}
h3{font-size:1.04rem;margin:1.6em 0 .5em}
h3::before{content:"### ";color:var(--encre3)}
p{margin:.65em 0}
ul,ol{padding-left:1.3em}
li{margin:.25em 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muet{color:var(--encre2)}
.petit{font-size:.88em}
:focus-visible{outline:3px solid var(--ambre);outline-offset:2px}

/* ---------- barre du haut ---------- */
.barre{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;height:56px;padding:0 10px 0 8px;background:var(--bg2);border-bottom:1px solid var(--ligne)}
.barre .feux{display:none;gap:7px;margin:0 10px 0 6px}
.barre .feux i{width:12px;height:12px;border-radius:50%;display:block;background:#E5675C}
.barre .feux i:nth-child(2){background:#E8B04A}.barre .feux i:nth-child(3){background:#5DBE6A}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border:0;background:transparent;border-radius:9px;cursor:pointer;color:var(--encre)}
.ib:hover{background:var(--bg3)}
.ib svg{width:22px;height:22px}
.marque{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--encre);font-family:var(--mono);font-weight:700;font-size:1.06rem;white-space:nowrap;min-height:44px}
.marque .kw{color:var(--k-kw)}
.marque .bac{color:var(--vert)}
.curseur{display:inline-block;width:.55em;height:1.05em;background:var(--vert);vertical-align:-.15em;margin-left:2px}
html.mo .curseur{animation:clignote 1.06s steps(1) infinite}
@keyframes clignote{50%{opacity:0}}
.onglet-fichier{flex:1;min-width:0;display:flex;justify-content:center}
.onglet-fichier span{font-family:var(--mono);font-size:.84rem;color:var(--encre2);border:1px solid var(--ligne);border-bottom:2px solid var(--ambre);border-radius:7px 7px 0 0;padding:4px 12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg)}
.btn-cherche{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--ligne);border-radius:9px;background:var(--bg);cursor:pointer;color:var(--encre2);font-family:var(--mono);font-size:.85rem}
.btn-cherche svg{width:18px;height:18px}
.btn-cherche .t{display:none}
@media (max-width:640px){.onglet-fichier{display:none}.marque{flex:1}.code pre{font-size:.76rem}.code pre .l::before{width:2em;padding-right:.6em;margin-right:.5em}}

/* ---------- mise en page ---------- */
.cadre{display:block}
.lat{position:fixed;z-index:75;top:0;bottom:0;left:0;width:min(86vw,var(--side));background:var(--bg2);border-right:1px solid var(--ligne);transform:translateX(-102%);visibility:hidden;overflow-y:auto;padding:12px 10px 90px;font-family:var(--mono);font-size:.9rem}
.lat.ouvert{transform:none;visibility:visible}
html.mo .lat{transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility .26s}
.voile{position:fixed;inset:0;z-index:74;background:rgba(5,10,12,.45);display:none}
.voile.on{display:block}
.lat .titre-lat{font-size:.72rem;letter-spacing:.12em;color:var(--encre3);margin:10px 8px 6px;text-transform:uppercase}
.lat a{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;border-radius:8px;color:var(--encre);text-decoration:none}
.lat a:hover{background:var(--bg3)}
.lat a.actif{background:var(--vert-f);color:var(--vert);box-shadow:inset 3px 0 0 var(--vert)}
.lat a svg{width:18px;height:18px;flex:none;color:var(--encre3)}
.lat a.actif svg{color:var(--vert)}
.lat .dossier{display:flex;align-items:center;gap:8px;padding:6px 10px;color:var(--encre2)}
.lat .dossier svg{width:18px;height:18px;color:var(--ambre)}
.lat .ind{padding-left:22px}
.lat .ind2{padding-left:34px}
.lat .num{margin-left:auto;font-size:.75rem;color:var(--encre3)}
.lat .pied-lat{margin:18px 10px 0;font-size:.75rem;color:var(--encre3);line-height:1.5}
main{min-width:0}
.page{max-width:820px;margin:0 auto;padding:18px 16px 110px}
.page.large{max-width:1060px}
@media (min-width:1000px){
  .cadre{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
  .lat{position:sticky;top:56px;height:calc(100vh - 56px);transform:none;visibility:visible;width:auto;z-index:1;padding-bottom:30px}
  .voile,.btn-menu{display:none!important}
  .barre .feux{display:flex}
  .btn-cherche .t{display:inline}
  .page{padding:26px 34px 110px}
}

/* ---------- invite de commande (en-tête de page) ---------- */
.invite{font-family:var(--mono);font-size:.86rem;color:var(--encre2);margin:4px 0 2px;overflow-wrap:anywhere}
.invite .u{color:var(--vert)}.invite .d{color:var(--bleu)}.invite .c{color:var(--encre)}
html.mo .invite .c.tape{display:inline-block;vertical-align:bottom;white-space:nowrap;overflow:hidden;animation:tape .9s steps(28,end) both}
@keyframes tape{from{max-width:0}to{max-width:100%}}
.soustitre{color:var(--encre2);margin:0 0 14px}
.etiq{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.74rem;border:1px solid var(--ligne2);border-radius:999px;padding:2px 10px;color:var(--encre2);background:var(--bg2)}
.etiq.v{color:var(--vert);border-color:var(--vert)}
.etiq.a{color:var(--ambre);border-color:var(--ambre)}

/* ---------- onglets de chapitre ---------- */
.onglets{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ligne);margin:14px -16px 18px;padding:0 16px;position:sticky;top:56px;z-index:30;background:var(--bg)}
.onglets::-webkit-scrollbar{display:none}
.onglets a{flex:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;font-family:var(--mono);font-size:.86rem;color:var(--encre2);text-decoration:none;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;margin-bottom:-1px}
.onglets a .x{color:var(--encre3)}
.onglets a.on{background:var(--bg2);border-color:var(--ligne);color:var(--encre);box-shadow:inset 0 2px 0 var(--ambre)}
@media (min-width:1000px){.onglets{margin:14px 0 22px;padding:0}}

/* ---------- blocs de texte ---------- */
.essentiel{border:1px solid var(--ligne);border-radius:var(--r);background:var(--code-bg);font-family:var(--mono);font-size:.9rem;padding:12px 14px;box-shadow:var(--ombre)}
.essentiel .t{color:var(--encre3);margin-bottom:6px}
.essentiel ol{margin:0;padding:0;list-style:none;counter-reset:e}
.essentiel li{counter-increment:e;display:grid;grid-template-columns:2.2em 1fr;margin:.35em 0;font-family:var(--sans);font-size:1rem}
.essentiel li::before{content:"[" counter(e) "]";font-family:var(--mono);color:var(--vert);font-size:.85em;padding-top:.15em}
.attendus{list-style:none;padding:0}
.attendus li{display:grid;grid-template-columns:1.6em 1fr;gap:4px}
.attendus li::before{content:"✓";font-family:var(--mono);color:var(--vert);font-weight:700}
.idee{position:relative;margin:28px 0;scroll-margin-top:120px}
.idee>h3{margin-top:0}
.idee .num-idee{font-family:var(--mono);font-size:.75rem;color:var(--encre3)}
.idee.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,30%{background:var(--ambre-f);box-shadow:0 0 0 10px var(--ambre-f)}100%{background:transparent;box-shadow:0 0 0 10px transparent}}
.boite{border:1px solid var(--ligne);border-left-width:4px;border-radius:var(--r);padding:10px 14px;margin:14px 0;background:var(--bg2)}
.boite>.lab{font-family:var(--mono);font-size:.78rem;font-weight:700;letter-spacing:.02em;margin-bottom:4px}
.boite>:last-child{margin-bottom:0}
.def{border-left-color:var(--vert)}.def>.lab{color:var(--vert)}
.ex{border-left-color:var(--bleu)}.ex>.lab{color:var(--bleu)}
.attention{border-left-color:var(--rouge);background:var(--rouge-f)}.attention>.lab{color:var(--rouge)}
.hp{border-style:dashed;border-left-style:solid;border-left-color:var(--violet)}.hp>.lab{color:var(--violet)}
.retenir-b{border-left-color:var(--ambre);background:var(--ambre-f)}.retenir-b>.lab{color:var(--ambre)}
.histoire{border-left-color:var(--ambre);font-size:.95rem}
.histoire>.lab{color:var(--ambre)}
.histoire .commit{font-family:var(--mono);font-size:.82rem;color:var(--ambre)}
.histoire .commit b{color:var(--encre2);font-weight:400}
.tab-wrap{overflow-x:auto;margin:12px 0;border:1px solid var(--ligne);border-radius:var(--r);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--ligne);text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:.8rem;color:var(--encre2);background:var(--bg3);white-space:nowrap}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
details.repli{border:1px solid var(--ligne);border-radius:var(--r);margin:14px 0;background:var(--bg2)}
details.repli>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;padding:6px 14px;font-family:var(--mono);font-size:.9rem;list-style:none}
details.repli>summary::-webkit-details-marker{display:none}
details.repli>summary::before{content:"▸";color:var(--ambre);font-size:.9em}
details.repli[open]>summary::before{content:"▾"}
details.repli>.corps{padding:0 14px 12px}

/* ---------- code ---------- */
.code{margin:14px 0;border:1px solid var(--ligne);border-radius:var(--r);overflow:hidden;background:var(--code-bg);box-shadow:var(--ombre)}
.code .tete{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;min-height:36px;border-bottom:1px solid var(--ligne);background:var(--bg3);font-family:var(--mono);font-size:.76rem;color:var(--encre2)}
.code .tete .f{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code .tete .f::before{content:"● ";color:var(--ambre)}
.code .tete button{border:0;background:transparent;color:var(--encre2);cursor:pointer;font-family:var(--mono);font-size:.74rem;min-height:44px;margin:-4px 0;padding:0 8px;border-radius:6px}
.code .tete button:hover{background:var(--bg2);color:var(--encre)}
.code pre{margin:0;overflow-x:auto;-webkit-overflow-scrolling:touch;font-size:.84rem;line-height:var(--lh);padding:8px 0;color:var(--code-enc);tab-size:4}
.code pre .l{display:block;padding:0 14px 0 0;min-width:max-content}
.code pre .l::before{content:attr(data-n);display:inline-block;width:2.4em;padding-right:.9em;margin-right:.6em;text-align:right;color:var(--gout);border-right:1px solid var(--ligne);user-select:none;-webkit-user-select:none}
.code.zebre pre .l:nth-child(6n+4),.code.zebre pre .l:nth-child(6n+5),.code.zebre pre .l:nth-child(6n+6){background:var(--zebre)}
.code pre .l.vise{background:var(--ambre-f)!important;box-shadow:inset 3px 0 0 var(--ambre)}
.code pre .l.trou{background:var(--bleu-f)!important}
.sortie{border-top:1px dashed var(--ligne2);background:var(--bg2)}
.sortie .tete{background:transparent;border-bottom:0;min-height:30px}
.sortie .tete .f::before{content:"$ ";color:var(--vert)}
.sortie pre{padding:2px 14px 10px;color:var(--encre)}
.sortie .err-t{color:var(--rouge)}
.k-kw{color:var(--k-kw);font-weight:600}.k-str{color:var(--k-str)}.k-num{color:var(--k-num)}.k-com{color:var(--k-com);font-style:italic}
.k-fn{color:var(--k-fn)}.k-bi{color:var(--k-bi)}.k-self{color:var(--k-self);font-style:italic}.k-cls{color:var(--k-fn);font-weight:700}.k-pr{color:var(--vert);font-weight:700}.k-dec{color:var(--violet)}.k-tr{color:var(--rouge)}
.console .l .k-pr{user-select:none}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--ligne2);background:var(--bg2);cursor:pointer;font-family:var(--mono);font-size:.86rem;color:var(--encre);text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.prim,a.btn.prim{background:var(--accent);color:var(--sur-accent);border-color:var(--accent);font-weight:700}
.btn.petit{min-height:44px;padding:0 12px;font-size:.8rem}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:default}
html.mo .btn:active{transform:translateY(1px) scale(.98)}
.rangee{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* ---------- accueil ---------- */
.heros{display:grid;gap:18px;margin:6px 0 10px}
.terminal{border:1px solid var(--ligne);border-radius:12px;background:var(--code-bg);box-shadow:var(--ombre);overflow:hidden}
.terminal .tete{display:flex;align-items:center;gap:7px;padding:0 12px;height:32px;background:var(--bg3);border-bottom:1px solid var(--ligne);font-family:var(--mono);font-size:.74rem;color:var(--encre3)}
.terminal .tete i{width:10px;height:10px;border-radius:50%;background:#E5675C;display:block}.terminal .tete i:nth-child(2){background:#E8B04A}.terminal .tete i:nth-child(3){background:#5DBE6A}
.terminal .tete span{margin-left:8px}
.terminal pre{margin:0;padding:12px 14px 14px;font-size:.86rem;line-height:1.7;overflow-x:auto;white-space:pre}
.terminal .pr{color:var(--vert);font-weight:700}.terminal .rep{color:var(--encre2)}.terminal .ok{color:var(--ambre)}
html.mo .terminal .ligne{display:block;opacity:0;animation:apparait .01s linear forwards}
@keyframes apparait{to{opacity:1}}
.heros h1{font-size:2.05rem;margin:0}
.heros h1 .kw{color:var(--k-kw)}.heros h1 .bac{color:var(--vert)}
.heros .acc{font-size:1.06rem;color:var(--encre2);margin:.4em 0 0}
@media (min-width:860px){.heros{grid-template-columns:1fr 1.05fr;align-items:center}}
.grille{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin:14px 0}
.carte-ch{display:flex;flex-direction:column;gap:6px;border:1px solid var(--ligne);border-radius:12px;padding:14px;background:var(--bg2);text-decoration:none;color:var(--encre);box-shadow:var(--ombre);min-height:44px;position:relative;overflow:hidden}
.carte-ch:hover{border-color:var(--accent)}
.carte-ch .fic{font-family:var(--mono);font-size:.78rem;color:var(--ambre)}
.carte-ch .nom{font-family:var(--mono);font-weight:700;font-size:1.02rem}
.carte-ch .desc{font-size:.9rem;color:var(--encre2)}
.carte-ch .pied{margin-top:auto;font-family:var(--mono);font-size:.74rem;color:var(--vert)}
html.mo .carte-ch{transition:transform .18s,border-color .18s}
html.mo .carte-ch:hover{transform:translateY(-2px)}
.rubrique{margin:16px 0;border:1px solid var(--ligne);border-radius:12px;overflow:hidden;background:var(--bg2)}
.rubrique>.tete{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--ligne);font-family:var(--mono);font-size:.9rem;font-weight:700}
.rubrique>.tete .n{color:var(--ambre)}
.item-prog{border-bottom:1px solid var(--ligne);scroll-margin-top:70px}

class Duree:
    """Une durée stockée en secondes (entier positif ou nul)."""

    def __init__(self, heures, minutes, secondes):
        self.total = heures * 3600 + minutes * 60 + secondes

    def en_hms(self):
        h = self.total // 3600
        m = (self.total % 3600) // 60
        s = self.total % 60
        return (h, m, s)

    def ajouter(self, autre):
        return Duree(0, 0, self.total + autre.total)   # nouvel objet, self intact

    def est_plus_longue(self, autre):
        return self.total > autre.total

    { id: "i3", t: "Le constructeur __init__ et self", h: `
<p>Quand tu écris <code>c1 = Compte("Ada", 100)</code>, Python :</p>
<ol><li>crée un objet vide de type <code>Compte</code> ;</li><li>appelle <code>__init__(objet, "Ada", 100)</code> : le paramètre <code>self</code> reçoit le nouvel objet ;</li><li>renvoie l’objet, dont la référence est rangée dans <code>c1</code>.</li></ol>
<p>La méthode <code>__init__</code> s’appelle le <b>constructeur</b> (plus exactement l’initialiseur). Son rôle est de créer les attributs avec <code>self.nom = valeur</code>. Elle ne renvoie rien.</p>
<div class="boite retenir-b"><div class="lab"># à retenir</div><p><code>self</code> est le premier paramètre de toute méthode : c’est l’objet sur lequel la méthode travaille. Dans la classe, on écrit <code>self.solde</code> ; à l’extérieur, on écrit <code>c1.solde</code>. Le mot <code>self</code> n’est qu’une convention, mais tout le monde la respecte.</p></div>
<p>Les paramètres peuvent avoir une <b>valeur par défaut</b> (<code>solde=0</code>), comme pour toute fonction. Attention aux valeurs par défaut <b>mutables</b> (une liste) : voir les pièges.</p>` },

    { id: "i4", t: "Les méthodes : agir sur l’objet", h: `
<p>Une méthode est une fonction écrite dans la classe, dont le premier paramètre est <code>self</code>. L’appel <code>c.deposer(5)</code> est un raccourci pour <code>Compte.deposer(c, 5)</code> :</p>
[[c1-self]]
<p>Une méthode peut <b>modifier</b> l’objet (<code>deposer</code>), <b>renvoyer</b> une valeur calculée à partir des attributs (<code>retirer</code> renvoie un booléen), ou les deux. Elle peut aussi appeler une autre méthode du même objet (<code>self.autre_methode()</code>) ou d’un autre objet reçu en paramètre :</p>
[[c1-appel-methode]]
<p>Ici, un attribut <code>historique</code> contient une liste : un objet peut contenir n’importe quelle valeur, y compris d’autres objets.</p>` },

    { id: "i5", t: "Accéder aux attributs, les protéger, afficher un objet", h: `
<p>On lit et on écrit un attribut avec la notation pointée <code>objet.attribut</code>. Python n’empêche pas d’écrire n’importe quoi :</p>
[[c1-acces]]
<p>Pour garder l’objet cohérent, on passe plutôt par des méthodes. Une méthode qui renvoie un attribut s’appelle un <b>accesseur</b> (<i>getter</i>) ; une méthode qui le modifie en vérifiant la valeur, un <b>mutateur</b> (<i>setter</i>). Un attribut dont le nom commence par <code>_</code> est « privé par convention » : Python ne bloque rien, c’est un avertissement entre programmeurs.</p>
[[c1-accesseurs]]
<p>Sans méthode <code>__str__</code>, <code>print(c)</code> affiche seulement quelque chose comme <code>&lt;__main__.Compte object at 0x7f…&gt;</code> (une adresse qui change à chaque exécution). Avec <code>__str__</code>, tu choisis le texte affiché ; elle doit <b>renvoyer</b> une chaîne, pas l’afficher.</p>
<div class="boite hp"><div class="lab"># pour aller plus loin</div><p>L’<b>encapsulation</b> (cacher l’implémentation derrière une interface de méthodes) est une idée centrale de la POO, mais le programme de Terminale n’exige que le vocabulaire et l’usage des accesseurs que l’énoncé te donne.</p></div>` },

    { id: "i6", t: "Références et alias : la mutation partagée", h: `
<p>Une variable ne « contient » pas un objet : elle contient une <b>référence</b> (l’adresse de l’objet en mémoire). L’affectation <code>b = a</code> copie la référence, pas l’objet. On dit que <code>b</code> est un <b>alias</b> de <code>a</code> :</p>
[[c1-alias]]
<ul><li><code>a is b</code> teste si les deux noms désignent <b>le même objet</b> ;</li>
<li><code>a == c</code> compare deux objets ; pour une classe qui ne définit pas <code>__eq__</code>, <code>==</code> se comporte comme <code>is</code>, d’où <code>False</code> alors que les attributs sont égaux.</li></ul>
<p>Même chose quand on passe un objet à une fonction : la fonction reçoit une référence vers <b>le même</b> objet et peut le modifier. C’est un <b>effet de bord</b>, voulu ici, mais source de bugs quand il ne l’est pas (chapitre 4).</p>
[[c1-fonction-objet]]
<div class="boite ex"><div class="lab"># vérifie tes réponses</div><p>Pour voir les références, colle ces programmes dans <a href="https://pythontutor.com/" target="_blank" rel="noopener">Python Tutor</a> : il dessine les variables et les flèches vers les objets.</p></div>` },

    { id: "i7", t: "Des objets qui contiennent des objets", h: `
<p>Un attribut peut contenir une liste d’objets : c’est la <b>composition</b>. Une banque possède des comptes, une médiathèque des livres, une partie des joueurs.</p>
[[c1-banque]]
<p>Un attribut peut aussi contenir <b>un</b> autre objet de la même classe. C’est l’idée du <b>maillon</b> d’une liste chaînée : chaque maillon connaît sa valeur et le maillon suivant. Tu la retrouveras au chapitre 3.</p>
[[c1-maillon]]
<p>La programmation objet sert ainsi à <b>implémenter des structures de données</b> : pile, file, arbre, graphe. C’est pour cela qu’elle est rangée dans la rubrique « Structures de données » du programme.</p>` },

    { id: "i8", t: "Méthodes spéciales et attributs de classe", h: `
<div class="boite hp"><div class="lab"># pour aller plus loin — non exigible, mais fréquent dans les sujets</div>
<p>Les méthodes dont le nom est entouré de deux tirets bas sont appelées par Python dans des situations précises : <code>__init__</code> à la création, <code>__str__</code> par <code>print</code>, <code>__eq__</code> par <code>==</code>, <code>__add__</code> par <code>+</code>, <code>__len__</code> par <code>len()</code>, <code>__lt__</code> par <code>&lt;</code>.</p></div>
[[c1-speciales]]
<p>Un attribut défini directement dans la classe (hors de toute méthode) est un <b>attribut de classe</b> : il est partagé par tous les objets. À ne pas confondre avec les attributs d’instance créés par <code>self.x = …</code>.</p>
[[c1-attr-classe]]` },

    { id: "i9", t: "Ce qui est hors programme : héritage et polymorphisme", h: `
<p>Le programme précise : « On n’aborde pas ici tous les aspects de la programmation objet comme le polymorphisme et l’héritage. » Tu peux les croiser, il faut savoir les reconnaître, pas les maîtriser.</p>
<div class="boite hp"><div class="lab"># hors programme</div>
<p>L’<b>héritage</b> permet de définir une classe à partir d’une autre (<code>class Chat(Animal)</code>) : elle récupère ses attributs et méthodes et peut en redéfinir. Le <b>polymorphisme</b> : un même appel (<code>x.parler()</code>, ou <code>len(x)</code>) produit un comportement adapté au type de <code>x</code>.</p></div>
[[c1-heritage]]
<p>La POO est l’un des trois <b>paradigmes</b> au programme, avec l’impératif et le fonctionnel (chapitre « Paradigmes de programmation », bientôt). Un même programme peut mélanger les paradigmes.</p>` }
  ],
  pieges: [
    { t: "Oublier self dans la définition d’une méthode", h: `[[c1-p-self]]<p>Python passe toujours l’objet comme premier argument : la méthode reçoit 2 arguments (l’objet et 5) alors qu’elle n’en attend qu’un.</p>` },
    { t: "Oublier « self. » devant un attribut", h: `[[c1-p-pointself]]<p>Sans <code>self.</code>, <code>solde</code> est une variable locale de la méthode, qui n’existe pas encore. Il faut écrire <code>self.solde = self.solde + montant</code>.</p>` },
    { t: "Mal écrire __init__", h: `[[c1-p-init]]<p>Deux tirets bas avant et deux après : <code>__init__</code>. Sinon, Python ne trouve pas de constructeur et refuse les arguments.</p>` },
    { t: "Une liste comme valeur par défaut", h: `[[c1-p-defaut]]<p>La valeur par défaut est évaluée <b>une seule fois</b>, à la définition : tous les objets créés sans argument partagent la même liste. La correction classique utilise <code>None</code> :</p>[[c1-p-defaut-ok]]` },
    { t: "Confondre la classe et l’objet", h: `[[c1-p-classe]]<p><code>solde</code> est un attribut d’<b>instance</b> : il n’existe qu’une fois l’objet créé. On écrit <code>c = Compte(10)</code> puis <code>c.solde</code>.</p>` },
    { t: "Croire que b = a copie l’objet", h: `<p><code>b = a</code> crée un alias : toute modification faite par <code>b</code> se voit par <code>a</code>. Pour une copie, on construit un nouvel objet : <code>b = Compte(a.titulaire, a.solde)</code>.</p>` },
    { t: "Oublier les parenthèses d’un appel de méthode", h: `<p><code>c.get_solde</code> sans parenthèses ne calcule rien : c’est la méthode elle-même (Python affiche <code>&lt;bound method …&gt;</code>). Il faut <code>c.get_solde()</code>. Une comparaison <code>c.get_solde &gt; 0</code> lève même une <code>TypeError</code>.</p>` }
  ],
  retenir: `
<h2>Vocabulaire</h2>
<div class="tab-wrap"><table><tr><th>mot</th><th>sens</th><th>en Python</th></tr>
<tr><td>classe</td><td>plan d’un nouveau type</td><td><code>class Compte:</code></td></tr>

<tr><td>attribut</td><td>donnée propre à l’objet</td><td><code>self.solde</code> / <code>c.solde</code></td></tr>
<tr><td>méthode</td><td>fonction de la classe, 1er paramètre <code>self</code></td><td><code>def deposer(self, m):</code> / <code>c.deposer(5)</code></td></tr>
<tr><td>constructeur</td><td>initialise les attributs</td><td><code>def __init__(self, …):</code></td></tr>
<tr><td>self</td><td>l’objet sur lequel la méthode travaille</td><td><code>c.deposer(5)</code> ≡ <code>Compte.deposer(c, 5)</code></td></tr>
<tr><td>accesseur / mutateur</td><td>méthode qui lit / modifie un attribut</td><td><code>get_solde()</code>, <code>deposer()</code></td></tr>

<h2>Squelette à connaître par cœur</h2>

<h2>Les réflexes</h2>
<ul><li>Chaque méthode commence par <code>self</code> ; chaque attribut s’écrit <code>self.x</code> dans la classe.</li>

<li>Une méthode qui doit donner un résultat le <b>renvoie</b> (<code>return</code>) ; <code>__str__</code> renvoie une chaîne.</li>

    { code: "c1-x2", niv: "moyen", rep: "<code>b2 = b1</code> crée un alias : on ajoute 3 à la liste du seul objet existant, donc <code>b1.contenu</code> vaut <code>[1, 2, 3]</code> et <code>b1 is b2</code> est vrai. <code>b3</code> est un autre objet ; sans <code>__eq__</code>, <code>==</code> compare les identités : False, même si les contenus sont égaux." },
    { code: "c1-x3", niv: "moyen", rep: "<code>doubler</code> modifie l’attribut (largeur 6) puis renvoie l’aire calculée avec la nouvelle largeur : 6 × 4 = 24. Le second <code>aire()</code> donne aussi 24." },

  ep: [
    { titre: "Médiathèque", enonce: `<p>On gère les livres d’une médiathèque. Le fichier fourni contient deux classes et une méthode à compléter. La méthode <code>nombre_disponibles</code> est déjà écrite… mais elle contient une erreur.</p>[[c1-ep1-fourni]]`,

    { titre: "Durées", enonce: `<p>Une durée est stockée par un seul attribut : son nombre total de secondes. Deux lignes sont à compléter et la méthode <code>ajouter</code> ne respecte pas sa documentation.</p>[[c1-ep2-fourni]]`,
      questions: [
        { q: "Compléter <code>en_hms</code> (lignes 10 et 11).", c: `<p>Après avoir retiré les heures, il reste <code>self.total % 3600</code> secondes ; les minutes en sont le quotient par 60. Les secondes sont le reste de la division par 60 : <code>m = (self.total % 3600) // 60</code> et <code>s = self.total % 60</code>.</p>` },

        { q: "Écrire une méthode <code>est_plus_longue(autre)</code> et un jeu de tests complet.", c: `[[c1-ep2-corr]]` },

      ] }

  ecrit: { titre: "Un parking (programmation objet)", points: "≈ 6 points · 45 min", note: "Exercice inventé pour le site, au format de l’épreuve écrite (questions progressives, code à écrire sur la copie).",
    enonce: `<p>Un parking possède un nombre fixe de places, numérotées à partir de 0. On utilise les classes suivantes.</p>[[c1-ecrit-code]]`,
    questions: [
      { q: "On exécute le code ci-dessous. Qu’affiche-t-il ? Justifier.", pts: "0,5 pt", code: "[[c1-ecrit-q1|nosortie]]", c: `<p>Affichage : <code>3 voiture None</code>. Une place sur 4 est occupée ; <code>p.places[2]</code> est l’objet <code>v</code>, dont l’attribut <code>categorie</code> vaut <code>"voiture"</code> ; la place 0 est libre et vaut <code>None</code>.</p>` },
      { q: "Dessiner le diagramme de la classe <code>Parking</code> (nom, attributs, méthodes).", pts: "0,5 pt", c: `<p>Trois cases : <code>Parking</code> / <code>places : list</code> / <code>__init__(nb_places)</code>, <code>nb_libres() : int</code> (et les méthodes ajoutées aux questions suivantes).</p>` },
      { q: "Écrire la méthode <code>est_plein(self)</code> qui renvoie True si aucune place n’est libre. On utilisera <code>nb_libres</code>.", pts: "1 pt", c: `<p><code>return self.nb_libres() == 0</code> : appel d’une méthode du même objet par <code>self.</code>. Pas besoin de <code>if … return True else return False</code> : la comparaison est déjà un booléen.</p>` },
      { q: "Écrire la méthode <code>garer(self, vehicule)</code> qui place le véhicule sur la première place libre et renvoie son numéro, ou renvoie −1 si le parking est plein.", pts: "1,5 pt", c: `<p>Parcours par indice (on a besoin du numéro de place) ; on renvoie dès qu’on a garé. Le <code>return -1</code> est après la boucle.</p>` },
      { q: "Écrire la méthode <code>sortir(self, immat)</code> qui libère la place du véhicule dont l’immatriculation est <code>immat</code> et renvoie True, ou renvoie False s’il n’est pas dans le parking.", pts: "1,5 pt", c: `<p>Piège : une place libre vaut <code>None</code>, et <code>None.immat</code> lève une <code>AttributeError</code>. Il faut tester <code>v is not None</code> <b>avant</b> <code>v.immat</code> (le <code>and</code> s’arrête au premier faux).</p>[[c1-ecrit-corr]]` },
      { q: `On écrit <code>v = Vehicule("AB-123-CD", "voiture")</code>, puis <code>p.garer(v)</code>, puis <code>v.categorie = "moto"</code>. Le véhicule garé est-il modifié ? Expliquer.`, pts: "1 pt", c: `<p>Oui. La liste <code>p.places</code> contient une <b>référence</b> vers l’objet <code>v</code>, pas une copie : modifier l’objet par <code>v</code> modifie le véhicule garé (mutation partagée).</p>` }

def vol(n):
    """Temps de vol de n : nombre d'étapes pour atteindre 1."""
    if n == 1:
        return 0
    if n % 2 == 0:
        return 1 + vol(n // 2)
    return 1 + vol(3 * n + 1)

def altitude(n):
    """Plus grande valeur atteinte par la suite qui part de n."""
    if n == 1:
        return 1
    if n % 2 == 0:
        suivant = n // 2
    else:
        suivant = 3 * n + 1
    return max(n, altitude(suivant))

    etapes = 0
    while n != 1:
        if n % 2 == 0:
            n = n // 2
        else:

        etapes = etapes + 1
    return etapes

<ul><li><b>Descente</b> : chaque nouvel appel <b>empile</b> un cadre. Les variables <code>n</code> de chaque appel sont <b>différentes</b>.</li>
<li><b>Remontée</b> : quand un appel renvoie son résultat, son cadre est <b>dépilé</b> et l’appel du dessous reprend là où il s’était arrêté.</li></ul>
<p>Avance pas à pas pour voir les cadres s’empiler puis se dépiler :</p>
[[w-pile-appels|fact]]
<p>On peut aussi « voir » la pile en affichant les appels avec une marge proportionnelle à la profondeur :</p>
[[c2-trace]]
<p>La pile est exactement la structure du chapitre 3 : le dernier appel commencé est le premier terminé (LIFO).</p>` },

    { id: "i4", t: "Terminaison et RecursionError", h: `
<p>Une fonction récursive <b>se termine</b> si chaque chaîne d’appels finit par atteindre un cas de base. Pour le justifier, on exhibe une quantité entière positive qui <b>diminue strictement</b> à chaque appel (on parle de <b>variant</b>) : ici <code>n</code>, qui passe à <code>n − 1</code> et s’arrête à 0.</p>
<p>La pile d’exécution a une taille limitée. Python refuse plus de 1 000 niveaux d’appels imbriqués par défaut et lève <code>RecursionError</code>, même si la fonction est juste :</p>
[[c2-limite]]
<p>Si le cas de base n’est jamais atteint, on obtient la même erreur : c’est l’équivalent récursif d’une boucle infinie.</p>
[[c2-negatif]]
<p>Pour s’en protéger, on écrit la <b>précondition</b> avec une assertion (chapitre 4) :</p>
[[c2-precondition]]
<div class="boite hp"><div class="lab"># pour aller plus loin</div><p><code>sys.setrecursionlimit(10000)</code> relève la limite, mais la pile réelle du système peut alors déborder et faire planter Python : c’est une rustine, pas une solution. Contrairement à d’autres langages, Python n’optimise pas les appels récursifs terminaux.</p></div>` },

    { id: "i5", t: "Récursif ou itératif ?", h: `
<p>Tout algorithme récursif peut s’écrire avec des boucles (au besoin en gérant soi-même une pile), et inversement. La version itérative de la factorielle n’empile aucun cadre :</p>
[[c2-iter]]
<div class="tab-wrap"><table><tr><th></th><th>récursif</th><th>itératif</th></tr>
<tr><td>lisibilité</td><td>très proche d’une définition mathématique ou d’une structure récursive (arbre, liste chaînée)</td><td>naturel pour un parcours simple</td></tr>
<tr><td>mémoire</td><td>un cadre de pile par appel en cours</td><td>quelques variables</td></tr>
<tr><td>limite en Python</td><td>environ 1 000 appels imbriqués</td><td>aucune</td></tr></table></div>
<p>À l’écrit, on te demande souvent l’un <b>puis</b> l’autre : sache passer de <code>return n * f(n - 1)</code> à une boucle qui accumule le résultat.</p>
<div class="boite histoire"><div class="lab"># git log --histoire</div><p><span class="commit">1958 <b>·</b></span> John McCarthy conçoit <b>LISP</b>, un langage où la récursivité est l’outil central.<br><span class="commit">1960 <b>·</b></span> <b>ALGOL 60</b> autorise les procédures récursives, qui s’appuient sur une pile d’exécution.</p></div>` },

    { id: "i6", t: "Plusieurs appels : Fibonacci et l’arbre d’appels", h: `
<p>La suite de Fibonacci est définie par F(0) = 0, F(1) = 1 et F(<i>n</i>) = F(<i>n</i> − 1) + F(<i>n</i> − 2). La traduction directe fait <b>deux</b> appels récursifs : les appels forment un <b>arbre</b>.</p>
[[c2-fib]]
<p>Le nombre d’appels explose : 2 692 537 appels pour F(30), parce que les mêmes valeurs sont recalculées encore et encore (F(28) est calculé 2 fois, F(27) 3 fois, F(26) 5 fois…). Le coût est <b>exponentiel</b>. Dans le schéma, choisis <code>fibonacci(4)</code> : l’arbre se construit pendant que la pile monte et descend.</p>
[[w-pile-appels|fib]]
<p>La profondeur de la pile, elle, ne dépasse pas <i>n</i> : l’arbre est large, pas profond.</p>
<div class="boite hp"><div class="lab"># pour aller plus loin : mémoïsation</div><p>On mémorise chaque résultat dans un dictionnaire pour ne le calculer qu’une fois. C’est le point de départ de la <b>programmation dynamique</b> (au programme, chapitre à venir).</p>[[c2-memo]]</div>` },

    { id: "i7", t: "Diviser l’exposant par 2 : la puissance rapide", h: `
<p>Pour calculer a<sup>n</sup>, la méthode naïve (a<sup>n</sup> = a × a<sup>n−1</sup>) fait <i>n</i> + 1 appels. Or a<sup>10</sup> = (a<sup>5</sup>)², a<sup>5</sup> = a × (a<sup>2</sup>)², a<sup>2</sup> = (a<sup>1</sup>)², a<sup>1</sup> = a × (a<sup>0</sup>)² : en <b>divisant l’exposant par 2</b> à chaque appel, on n’en fait que 5.</p>
[[c2-puissance]]
<div class="tab-wrap"><table><tr><th>exposant n</th><th>appels (naïf)</th><th>appels (rapide)</th></tr>
<tr><td>10</td><td>11</td><td>5</td></tr><tr><td>1 000</td><td>1 001</td><td>11</td></tr><tr><td>1 000 000</td><td>RecursionError</td><td>21</td></tr></table></div>
<p>Le nombre d’appels de la version rapide vaut ⌊log₂ <i>n</i>⌋ + 2 pour <i>n</i> ≥ 1 : c’est un coût <b>logarithmique</b>. Le programme insiste sur ce passage de <i>n</i> à log₂ <i>n</i>. C’est aussi un premier exemple de <b>diviser pour régner</b>. (Le dernier calcul ci-dessus, 2<sup>1 000 000</sup>, demande 21 appels.)</p>
[[c2-puissance-naive-ko]]` },

    { id: "i8", t: "Récursivité sur les chaînes et les tableaux", h: `
<p>Une chaîne ou une liste peut se voir récursivement : « vide », ou « un premier élément suivi du reste ». D’où des fonctions très courtes :</p>
[[c2-chaines]]
<p>Le découpage <code>ch[1:]</code> crée une <b>copie</b> à chaque appel, ce qui coûte du temps. Pour les tableaux, on préfère passer un <b>indice</b> en paramètre (comme <code>somme_liste</code>), ce qui évite toute copie. C’est ainsi qu’on écrit la <b>recherche dichotomique</b> de Première en version récursive :</p>
[[c2-dicho]]
<p>Le variant est la taille de la zone <code>d − g + 1</code>, divisée par deux environ à chaque appel : environ 20 appels suffisent pour un tableau d’un million d’éléments.</p>` },

    { id: "i9", t: "Des exemples de domaines variés : Hanoï et fractales", h: `
<p>Les <b>tours de Hanoï</b> : déplacer une pile de <i>n</i> disques d’un piquet à un autre, un disque à la fois, sans jamais poser un disque sur un plus petit. La solution récursive tient en trois lignes : déplacer les <i>n</i> − 1 disques du dessus sur le piquet intermédiaire, déplacer le grand, reposer les <i>n</i> − 1 dessus.</p>
[[c2-hanoi]]
<p>Il faut 2<sup>n</sup> − 1 déplacements (7 pour 3 disques, 1 023 pour 10). Le casse-tête a été publié en 1883 par le mathématicien français Édouard Lucas.</p>
<p>Les <b>fractales</b> sont des figures qui contiennent des copies réduites d’elles-mêmes : la récursivité les dessine naturellement. Version texte du triangle de Sierpinski :</p>
[[c2-sierpinski]]
<p>Le module <code>turtle</code> permet de dessiner de la même façon le flocon de von Koch ou un arbre fractal : chaque branche porte deux branches plus petites. Plus tard, tu retrouveras la récursivité partout : arbres, parcours de graphes, tri fusion.</p>` }
  ],
  pieges: [
    { t: "Oublier le return devant l’appel récursif", h: `[[c2-p-return]]<p>Sans <code>return</code>, la fonction renvoie <code>None</code>. L’appel du dessus essaie alors de calculer <code>2 + None</code>. Le cas récursif doit <b>renvoyer</b> la combinaison : <code>return n + somme(n - 1)</code>.</p>` },
    { t: "Un cas de base jamais atteint", h: `[[c2-p-pair]]<p>Avec un pas de 2, un nombre impair saute par-dessus 0. Il faut un cas de base pour 1 (<code>if n == 1: return False</code>) ou un test <code>n &lt;= 1</code>. Vérifie toujours que <b>toutes</b> les valeurs atteignent un cas de base.</p>` },

class ListeChainee:
    def __init__(self):
        self.tete = None                 # liste vide

    def est_vide(self):
        return self.tete is None

    def ajouter_tete(self, v):           # coût constant
        self.tete = Maillon(v, self.tete)

    def supprimer_tete(self):            # coût constant
        assert not self.est_vide(), "liste vide"
        v = self.tete.valeur
        self.tete = self.tete.suivant
        return v

    def ajouter_queue(self, v):          # coût linéaire : on parcourt tout
        if self.tete is None:
            self.tete = Maillon(v)
        else:
            m = self.tete
            while m.suivant is not None:
                m = m.suivant
            m.suivant = Maillon(v)

    def longueur(self):                  # coût linéaire
        n = 0
        m = self.tete
        while m is not None:
            n = n + 1
            m = m.suivant
        return n

    def __str__(self):
        morceaux = []
        m = self.tete
        while m is not None:
            morceaux.append(str(m.valeur))
            m = m.suivant
        return " -> ".join(morceaux + ["None"])

class Pile:
    """Pile implémentée avec une liste Python : le sommet est la FIN de la liste."""

    def __init__(self):
        self.contenu = []

    def est_vide(self):
        return len(self.contenu) == 0

    def empiler(self, x):
        self.contenu.append(x)           # coût constant

    def depiler(self):
        if self.est_vide():
            raise IndexError("dépiler une pile vide")
        return self.contenu.pop()        # coût constant

    def sommet(self):
        if self.est_vide():
            raise IndexError("pile vide")
        return self.contenu[-1]

    def taille(self):
        return len(self.contenu)

for x in [1, 2, 3]:

print(p.depiler(), p.sommet(), p.taille())`, { fichier: "pile.py", out: "3 2 2" });

def evaluer_npi(expression):
    """Évalue une expression en notation polonaise inverse (NPI),
    par exemple "3 4 + 2 *", qui vaut (3 + 4) * 2."""
    p = Pile()
    for jeton in expression.split():
        if jeton in ["+", "-", "*", "/"]:
            b = p.depiler()              # le 2e opérande est au sommet
            a = p.depiler()
            if jeton == "+":
                p.empiler(a + b)
            elif jeton == "-":
                p.empiler(a - b)
            elif jeton == "*":
                p.empiler(a * b)
            else:
                p.empiler(a / b)
        else:
            p.empiler(int(jeton))
    return p.depiler()

print(evaluer_npi("10 2 8 * + 3 -"))     # 10 + 2 * 8 - 3`, { deps: ["c3-pile-liste"], out: "14\n23" });

class File2P:
    """File réalisée avec deux piles (deux listes Python utilisées en piles)."""

    def __init__(self):
        self.entree = []        # on empile ici à chaque enfiler
        self.sortie = []        # on dépile ici à chaque défiler

    def est_vide(self):
        return self.entree == [] and self.sortie == []

    def enfiler(self, x):
        self.entree.append(x)

    def defiler(self):
        if self.sortie == []:
            while self.entree != []:                  # on renverse entree
                self.sortie.append(self.entree.pop()) # dans sortie
        if self.sortie == []:
            raise IndexError("défiler une file vide")
        return self.sortie.pop()

def bien_parenthesee(expr):
    p = []
    for c in expr:
        if c == "(":
            p.append(c)
        elif c == ")":
            if len(p) == 0:          # fermante sans ouvrante
                return False
            p.pop()
    return len(p) == 0               # il ne doit rester aucune ouvrante

def bien_parenthesee_multi(expr):
    """Même chose avec (), [] et {}."""
    ouvrante = {")": "(", "]": "[", "}": "{"}
    p = []
    for c in expr:
        if c in "([{":
            p.append(c)
        elif c in ")]}":
            if len(p) == 0 or p.pop() != ouvrante[c]:
                return False
    return len(p) == 0

def test():

    assert bien_parenthesee("")                      # chaîne vide
    assert not bien_parenthesee("((a)")              # le bug de la version fournie
    assert not bien_parenthesee(")(")
    assert bien_parenthesee_multi("f(x[2]) + {y}")
    assert not bien_parenthesee_multi("(a]")
    assert not bien_parenthesee_multi("([)]")        # croisées : un compteur ne verrait rien

class File:
    def __init__(self):
        self.elements = []

    def est_vide(self):
        return self.elements == []

    def enfiler(self, x):
        self.elements.append(x)

    def defiler(self):
        assert not self.est_vide(), "file vide"
        return self.elements.pop(0)          # la TÊTE, pas la fin

    def taille(self):
        return len(self.elements)

def josephe(n, k):
    f = File()
    for i in range(1, n + 1):
        f.enfiler(i)
    ordre = []
    while not f.est_vide():
        for _ in range(k - 1):               # les k-1 premiers passent derrière
            f.enfiler(f.defiler())
        ordre.append(f.defiler())            # le k-ième sort
    return ordre

def test():
    f = File()
    for x in [1, 2, 3]:
        f.enfiler(x)
    assert f.defiler() == 1 and f.taille() == 2      # FIFO
    assert josephe(7, 3) == [3, 6, 2, 7, 5, 1, 4]
    assert josephe(1, 5) == [1]
    assert josephe(5, 1) == [1, 2, 3, 4, 5]
    assert josephe(41, 3)[-1] == 31

test()
print("tous les tests passent")`, { fichier: "josephe.py", out: "tous les tests passent" });

[[c3-tad-longueur]]
<div class="boite attention"><div class="lab">⚠ ne pas confondre</div><p>Le type <code>list</code> de Python n’est <b>pas</b> une liste chaînée : c’est un <b>tableau dynamique</b> (cases contiguës en mémoire, qu’on agrandit au besoin). Le mot « liste » désigne donc deux choses différentes : lis bien l’énoncé.</p></div>` },

    { id: "i3", t: "La liste chaînée : des maillons reliés", h: `
<p>Une <b>liste chaînée</b> est une implémentation de la liste : chaque <b>maillon</b> (ou cellule) contient une <b>valeur</b> et une <b>référence</b> vers le maillon suivant ; le dernier maillon pointe vers <code>None</code>. On ne garde que la référence du premier maillon : la <b>tête</b>.</p>
[[c3-maillon]]
[[w-liste-chainee]]
<p>Pour atteindre un maillon, il faut suivre les liens depuis la tête : on ne peut pas sauter directement à la case <i>i</i> comme dans un tableau.</p>
[[c3-maillon-fonctions]]
<div class="boite histoire"><div class="lab"># git log --histoire</div><p><span class="commit">1955-1956 <b>·</b></span> Allen Newell, Cliff Shaw et Herbert Simon inventent les listes chaînées pour leur langage IPL, consacré à l’intelligence artificielle.</p></div>` },

    { id: "i4", t: "Une classe ListeChainee", h: `
<p>On regroupe la tête et les opérations dans une classe. Remarque le coût de chaque méthode : il dépend du nombre de maillons à parcourir.</p>
[[c3-liste-chainee]]
<ul><li><code>ajouter_tete</code> et <code>supprimer_tete</code> ne touchent qu’au premier maillon : <b>coût constant</b>, quelle que soit la longueur.</li>
<li><code>ajouter_queue</code> et <code>longueur</code> parcourent toute la liste : <b>coût linéaire</b>. On peut rendre <code>ajouter_queue</code> constant en gardant aussi une référence vers le dernier maillon (c’est ce que fait la file de l’idée 8).</li></ul>` },

    { id: "i5", t: "Tableau ou liste chaînée : comparer les coûts", h: `
<div class="tab-wrap"><table><tr><th>opération</th><th>tableau dynamique (<code>list</code> de Python)</th><th>liste chaînée</th></tr>
<tr><td>lire ou modifier l’élément d’indice <i>i</i></td><td>constant : <code>t[i]</code></td><td>linéaire (suivre <i>i</i> liens)</td></tr>
<tr><td>ajouter / retirer à la fin</td><td>constant (en moyenne) : <code>append</code>, <code>pop()</code></td><td>linéaire, ou constant avec une référence vers la queue</td></tr>
<tr><td>ajouter / retirer au début</td><td>linéaire : <code>insert(0, x)</code>, <code>pop(0)</code> décalent tout</td><td>constant</td></tr>
<tr><td>longueur</td><td>constant : <code>len(t)</code></td><td>linéaire (ou constant si on tient un compteur)</td></tr></table></div>
<p>Aucune structure n’est meilleure partout : on choisit selon les opérations les plus fréquentes. Pour une file d’attente de 100 000 clients, défiler avec <code>pop(0)</code> décale 99 999 éléments à chaque client servi ; avec une liste chaînée, rien n’est décalé.</p>` },

    { id: "i6", t: "La pile (LIFO) et ses implémentations", h: `
<div class="boite def"><div class="lab">"""définition"""</div><p>Une <b>pile</b> (<i>stack</i>) est une structure où l’on ajoute et retire <b>du même côté</b>, le <b>sommet</b> : le dernier élément entré est le premier sorti, en anglais <b>LIFO</b> (<i>Last In, First Out</i>).</p></div>
<p>Exemples : la pile d’assiettes, le bouton « Retour » du navigateur, l’annulation <kbd>Ctrl</kbd>+<kbd>Z</kbd> (on annule la dernière action), la pile d’exécution des appels de fonction (chapitre 2).</p>
[[w-pile-file|pile]]
<p><b>Implémentation 1</b>, avec une liste Python dont la fin est le sommet :</p>
[[c3-pile-liste]]
<p><b>Implémentation 2</b>, avec des maillons dont la tête est le sommet. L’interface est identique : un programme qui utilise la pile ne voit pas la différence.</p>
[[c3-pile-chainee]]
<p>Dépiler une pile vide est une erreur : l’implémentation lève une exception, et le programme qui l’utilise doit tester <code>est_vide()</code> avant.</p>
[[c3-pile-vide]]` },

    { id: "i7", t: "Une pile pour calculer : la notation polonaise inverse", h: `
<p>En <b>notation polonaise inverse</b> (NPI), l’opérateur s’écrit <b>après</b> ses deux opérandes : <code>3 4 +</code> signifie 3 + 4, et <code>3 4 + 2 *</code> signifie (3 + 4) × 2. Plus besoin de parenthèses. L’évaluation se fait avec une pile : un nombre est empilé ; un opérateur dépile deux nombres et empile le résultat.</p>
[[c3-npi]]
<p>Attention à l’ordre : le premier nombre dépilé est le <b>second</b> opérande (pour <code>10 3 -</code>, on dépile 3 puis 10 et on calcule 10 − 3).</p>
<div class="boite histoire"><div class="lab"># git log --histoire</div><p><span class="commit">1955 <b>·</b></span> Friedrich L. Bauer et Klaus Samelson (Munich) décrivent l’évaluation des expressions à l’aide d’une pile, le « principe de la cave » (<i>Kellerprinzip</i>).<br><span class="commit">1972 <b>·</b></span> La calculatrice de poche HP-35 de Hewlett-Packard fonctionne en NPI.</p></div>` },

    { id: "i8", t: "La file (FIFO) et ses implémentations", h: `
<div class="boite def"><div class="lab">"""définition"""</div><p>Une <b>file</b> (<i>queue</i>) est une structure où l’on ajoute d’un côté (la <b>queue</b>) et retire de l’autre (la <b>tête</b>) : le premier entré est le premier sorti, <b>FIFO</b> (<i>First In, First Out</i>).</p></div>
<p>Exemples : la file d’attente d’un guichet, la file d’impression, les touches tapées au clavier en attente de traitement, l’ordonnancement de processus, le parcours en largeur d’un arbre ou d’un graphe (chapitres à venir).</p>
[[w-pile-file|file]]
<p><b>Implémentation 1</b>, avec une liste Python : simple, mais <code>pop(0)</code> a un coût linéaire.</p>
[[c3-file-liste]]
<p><b>Implémentation 2</b>, avec des maillons et <b>deux références</b>, tête et queue : enfiler et défiler en temps constant.</p>
[[c3-file-chainee]]
<p><b>Implémentation 3</b>, avec <b>deux piles</b> (exemple cité par le programme) : on empile dans <code>entree</code> ; pour défiler, on dépile <code>sortie</code>, et si elle est vide on y verse d’abord toute la pile <code>entree</code>, ce qui inverse l’ordre et remet le plus ancien au sommet. Choisis « file avec deux piles » dans le schéma ci-dessus pour le voir.</p>
[[c3-file-2piles]]
<p>Un transfert coûte cher, mais chaque élément n’est transféré <b>qu’une fois</b> : sur une longue suite d’opérations, le coût moyen par opération reste constant (on parle de coût <b>amorti</b>).</p>
<div class="boite hp"><div class="lab"># pour aller plus loin</div><p>Le module standard <code>collections</code> fournit <code>deque</code>, une file à deux bouts efficace.</p>[[c3-deque]]</div>` },

    { id: "i9", t: "Choisir la bonne structure", h: `
<div class="tab-wrap"><table><tr><th>situation</th><th>structure</th><th>pourquoi</th></tr>
<tr><td>annuler les dernières actions d’un éditeur</td><td>pile</td><td>on annule la plus récente d’abord</td></tr>
<tr><td>vérifier des parenthèses, évaluer une expression</td><td>pile</td><td>la dernière ouvrante doit être fermée en premier</td></tr>
<tr><td>servir des clients, des impressions, des requêtes dans l’ordre d’arrivée</td><td>file</td><td>premier arrivé, premier servi</td></tr>
<tr><td>accéder souvent à l’élément n° <i>i</i></td><td>tableau (<code>list</code>)</td><td>accès en temps constant</td></tr>
<tr><td>insérer et supprimer souvent en tête</td><td>liste chaînée</td><td>pas de décalage</td></tr>
<tr><td>retrouver une valeur à partir d’une clé (nom → numéro)</td><td>dictionnaire</td><td>recherche par clé (chapitre à venir)</td></tr></table></div>
<p>À l’écrit, une question classique : « Pourquoi utiliser une pile plutôt qu’une file ici ? » La réponse se justifie toujours par l’ordre de sortie voulu (LIFO ou FIFO).</p>` }
  ],
  pieges: [
    { t: "Confondre la pile et la file", h: `<p>Pile : on retire le <b>dernier</b> ajouté (LIFO). File : on retire le <b>premier</b> ajouté (FIFO). Avec une liste Python : pile = <code>append</code> + <code>pop()</code> ; file = <code>append</code> + <code>pop(0)</code>.</p>` },

"""Module pile : une pile, vue uniquement à travers ces fonctions.

    p = creer_pile()      crée une pile vide
    est_vide(p)           True si p est vide
    empiler(p, x)         ajoute x au sommet de p

def creer_pile():

def moyenne(notes):
    """Renvoie la moyenne des nombres de la liste notes (non vide)."""
    assert len(notes) > 0, "liste vide"
    return sum(notes) / len(notes)

def mediane(notes):
    """Renvoie la médiane de la liste notes (non vide), sans la modifier."""
    assert len(notes) > 0, "liste vide"
    t = sorted(notes)                    # copie triée : notes n'est pas modifiée
    n = len(t)
    if n % 2 == 1:
        return t[n // 2]
    return (t[n // 2 - 1] + t[n // 2]) / 2

def test_stats():
    assert moyenne([10]) == 10
    assert moyenne([12, 8, 15, 10]) == 11.25
    assert mediane([7]) == 7                      # un seul élément
    assert mediane([3, 1, 2]) == 2                # taille impaire
    assert mediane([12, 8, 15, 10]) == 11.0       # taille paire
    releve = [12, 8, 15, 10]
    mediane(releve)
    assert releve == [12, 8, 15, 10]              # pas d'effet de bord
    try:
        moyenne([])
        assert False, "moyenne([]) aurait dû lever une erreur"
    except AssertionError as e:
        assert str(e) == "liste vide"

test_stats()

def est_bissextile(annee):
    """Divisible par 4 mais pas par 100, ou divisible par 400."""
    return (annee % 4 == 0 and annee % 100 != 0) or annee % 400 == 0

def jours_dans_mois(mois, annee):
    assert 1 <= mois <= 12, "mois invalide"
    if mois == 2:
        if est_bissextile(annee):
            return 29
        return 28
    elif mois in [4, 6, 9, 11]:
        return 30
    else:                                  # tous les autres mois : 31 jours
        return 31

def date_valide(jour, mois, annee):
    return 1 <= mois <= 12 and 1 <= jour <= jours_dans_mois(mois, annee)

def test_dates():
    assert est_bissextile(2024) and est_bissextile(2000)
    assert not est_bissextile(2026) and not est_bissextile(1900)
    assert jours_dans_mois(12, 2026) == 31           # le mois oublié
    assert jours_dans_mois(2, 2028) == 29
    assert date_valide(29, 2, 2024)

    assert not date_valide(0, 1, 2026)
    assert not date_valide(1, 13, 2026)              # pas d'appel avec mois = 13

def ajouter(stock, produit, quantite):
    """Ajoute quantite unités de produit au stock."""

    "Une <b>API</b> décrit ce qu’on peut appeler (noms, paramètres, résultats) sans montrer comment c’est fait.",
    "Une <b>spécification</b> fixe préconditions et postconditions ; les <b>assertions</b> (<code>assert</code>) les vérifient à l’exécution.",
    "Un <b>jeu de tests</b> couvre les cas normaux et les cas limites (vide, un élément, bornes, doublons, négatifs).",
    "Lire une erreur commence par la <b>dernière ligne</b> de la trace : son type (<code>TypeError</code>, <code>IndexError</code>…) indique la cause, les lignes au-dessus disent où."
  ],
  attendus: [
    "Utiliser des API ou des bibliothèques ; exploiter leur documentation.",
    "Créer des modules simples et les documenter.",
    "Répondre aux causes typiques de bugs listées par le programme : typage, effets de bord non désirés, débordements dans les tableaux, instruction conditionnelle non exhaustive, choix des inégalités, comparaisons et calculs entre flottants, mauvais nommage des variables.",
    "Prolonger le travail de Première : spécification, assertions, documentation, construction de jeux de tests ; apprendre à anticiper ses erreurs."
  ],
  intro: `<div class="boite ex"><div class="lab"># pourquoi ce chapitre compte double</div><p>Il est transversal : il sert dans tous les autres chapitres, et c’est le cœur de la <b>partie pratique</b> (1 h sur machine) : écrire une fonction, la tester avec des assertions, trouver et corriger un bug, expliquer son code à l’examinateur.</p></div>`,
  idees: [
    { id: "i1", t: "Pourquoi découper un programme en modules", h: `
<p>Un programme de plusieurs milliers de lignes dans un seul fichier devient illisible. On le découpe en <b>modules</b> : des fichiers <code>.py</code> qui regroupent des fonctions (ou des classes) sur un même thème. Avantages : chaque module se comprend, se teste et se corrige seul ; on le <b>réutilise</b> dans d’autres programmes ; plusieurs personnes travaillent en parallèle.</p>
[[c4-geometrie]]
[[c4-main]]
<p>Le test <code>if __name__ == "__main__":</code> est vrai seulement quand on exécute le fichier lui-même (Python donne alors à <code>__name__</code> la valeur <code>"__main__"</code>) ; quand le fichier est importé, <code>__name__</code> vaut <code>"geometrie"</code>. On y range les tests du module : ils ne s’exécutent pas chez ceux qui l’importent.</p>` },

    { id: "i2", t: "Importer : les trois écritures", h: `
<p>Python est fourni avec une <b>bibliothèque standard</b> de modules (<code>math</code>, <code>random</code>, <code>time</code>, <code>collections</code>…). Il y a trois façons d’importer :</p>
<div class="tab-wrap"><table><tr><th>écriture</th><th>utilisation</th><th>remarque</th></tr>
<tr><td><code>import math</code></td><td><code>math.sqrt(2)</code></td><td>on voit d’où vient chaque nom</td></tr>
<tr><td><code>from math import sqrt, pi</code></td><td><code>sqrt(2)</code></td><td>plus court ; seulement les noms choisis</td></tr>
<tr><td><code>import random as rd</code></td><td><code>rd.randint(1, 6)</code></td><td>un alias plus court</td></tr></table></div>
[[c4-imports]]
<p>À éviter : <code>from module import *</code>, qui importe tous les noms d’un coup et peut écraser silencieusement les tiens (deux fonctions de même nom dans deux modules : la dernière importée gagne).</p>` },

    { id: "i3", t: "API et documentation : lire avant d’appeler", h: `
<div class="boite def"><div class="lab">"""définition"""</div><p>Une <b>API</b> (<i>Application Programming Interface</i>) est l’ensemble des fonctions, classes et constantes qu’un module (ou un service) met à disposition, avec leur <b>contrat</b> : paramètres attendus, valeur renvoyée, erreurs possibles. On s’en sert sans connaître le code qui est derrière.</p></div>
<p>Lire la documentation évite des erreurs bêtes. Exemple classique : <code>random.randint(a, b)</code> peut renvoyer <code>b</code>, alors que <code>range(a, b)</code> s’arrête avant <code>b</code>.</p>
[[c4-randint]]
<p>La documentation d’une fonction Python est sa <b>docstring</b>, la chaîne placée juste sous le <code>def</code>. <code>help(fonction)</code> l’affiche dans la console ; elle est aussi rangée dans <code>fonction.__doc__</code>.</p>
[[c4-doc]]
<div class="boite histoire"><div class="lab"># git log --histoire</div><p><span class="commit">23/09/1999 <b>·</b></span> La sonde <b>Mars Climate Orbiter</b> est perdue en arrivant sur Mars. Un logiciel au sol fournissait des impulsions en livres-force·seconde ; le logiciel de navigation les attendait en newtons·seconde (facteur d’environ 4,45). Chaque partie marchait ; c’est le <b>contrat</b> entre les deux (les unités) qui n’était pas respecté.</p></div>
<div class="boite hp"><div class="lab"># pour aller plus loin</div><p>Le mot API désigne aussi les services web qu’on interroge par Internet (météo, cartes, horaires de transport) : on envoie une requête documentée, on reçoit des données, souvent au format JSON. Même idée : un contrat, pas de code visible.</p></div>` },

    { id: "i4", t: "Créer et documenter un module", h: `
<p>Un module bien conçu a une <b>interface</b> claire et documentée : la docstring du module dit à quoi il sert et liste ses fonctions ; chaque fonction a sa docstring. C’est exactement la séparation interface / implémentation du chapitre 3.</p>
[[c4-pile-module]]
[[c4-pile-usage]]
<p>Le programme principal n’utilise que les quatre fonctions de l’interface. Si l’on réécrit <code>pile.py</code> avec des maillons, <code>main.py</code> n’a pas à changer.</p>
<div class="boite retenir-b"><div class="lab"># une bonne docstring dit</div><ul><li>ce que fait la fonction (une phrase, au présent) ;</li><li>ce que sont les paramètres (type, contraintes : la <b>précondition</b>) ;</li><li>ce qui est renvoyé ou modifié (la <b>postcondition</b>), en signalant tout effet de bord ;</li><li>éventuellement un exemple d’appel <code>&gt;&gt;&gt;</code>.</li></ul></div>` },

    { id: "i5", t: "Spécification et assertions", h: `
<div class="boite def"><div class="lab">"""définitions"""</div><p>La <b>spécification</b> d’une fonction décrit ce qu’elle doit faire, sans dire comment. La <b>précondition</b> est ce qui doit être vrai quand on l’appelle ; la <b>postcondition</b>, ce qui est garanti quand elle a fini (si la précondition était vraie).</p></div>
[[c4-spec]]
<p>L’instruction <code>assert condition, "message"</code> ne fait rien si la condition est vraie, et arrête le programme avec <code>AssertionError: message</code> sinon. Placée au début d’une fonction, elle vérifie la précondition : une erreur d’appel est détectée tout de suite, avec un message clair, au lieu de produire un résultat faux plus loin.</p>
[[c4-assert-ko]]
<div class="boite hp"><div class="lab"># pour aller plus loin</div><p>Lancé avec <code>python3 -O</code>, Python ignore les <code>assert</code>. Les assertions servent donc à <b>détecter les erreurs de programmation</b>, pas à contrôler ce que tape un utilisateur : pour cela, on teste avec <code>if</code> ou on lève une exception (idée 7).</p></div>` },

    { id: "i6", t: "Tester : construire un jeu de tests", h: `
<p>Un <b>test</b> appelle une fonction sur une entrée choisie et compare le résultat à celui attendu. On les regroupe dans une fonction <code>test_…()</code> faite d’assertions. Un bon <b>jeu de tests</b> couvre :</p>
<ul><li>des cas <b>normaux</b>, dont tu connais la réponse ;</li><li>les cas <b>limites</b> : structure vide, un seul élément, premier et dernier élément, valeurs égales, nombres négatifs, zéro, flottants ;</li><li>les cas qui ont déjà provoqué un bug (pour qu’il ne revienne pas).</li></ul>
[[c4-tests]]
<p>Les tests montrent la <b>présence</b> de bugs, jamais leur absence : selon une formule célèbre de l’informaticien Edsger Dijkstra, tester peut montrer qu’il y a des erreurs, pas qu’il n’y en a pas. Une fonction qui passe tous tes tests peut encore être fausse sur un cas oublié : c’est pourquoi on choisit les cas limites avec soin.</p>
<div class="boite hp"><div class="lab"># outil pratique : doctest</div><p>Le module <code>doctest</code> exécute les exemples <code>&gt;&gt;&gt;</code> écrits dans les docstrings et vérifie que la sortie est bien celle indiquée. La documentation sert alors aussi de test.</p>[[c4-doctest]]</div>` },

    { id: "i7", t: "Les exceptions : lire une trace, lever, rattraper", h: `
<p>Quand une instruction ne peut pas s’exécuter, Python lève une <b>exception</b> : si personne ne la rattrape, le programme s’arrête et affiche une <b>trace</b> (<i>traceback</i>). Les types à reconnaître :</p>
[[c4-exceptions]]
<div class="tab-wrap"><table><tr><th>exception</th><th>cause habituelle</th></tr>
<tr><td><code>SyntaxError</code>, <code>IndentationError</code></td><td>code mal écrit (deux-points oubliés, indentation incohérente) : rien n’est exécuté</td></tr>
<tr><td><code>NameError</code></td><td>nom inconnu : faute de frappe, variable pas encore définie</td></tr>
<tr><td><code>TypeError</code></td><td>opération impossible sur ce type (<code>"a" + 1</code>, appel avec un mauvais nombre d’arguments)</td></tr>
<tr><td><code>ValueError</code></td><td>bon type mais valeur impossible (<code>int("douze")</code>)</td></tr>
<tr><td><code>IndexError</code></td><td>indice hors du tableau</td></tr>
<tr><td><code>KeyError</code></td><td>clé absente d’un dictionnaire</td></tr>
<tr><td><code>AttributeError</code></td><td>attribut ou méthode inexistant (souvent sur <code>None</code>)</td></tr>
<tr><td><code>ZeroDivisionError</code></td><td>division par zéro</td></tr>
<tr><td><code>RecursionError</code></td><td>trop d’appels récursifs imbriqués</td></tr>
<tr><td><code>AssertionError</code></td><td>une assertion est fausse</td></tr></table></div>
<p><b>Lire une trace</b> : la dernière ligne donne le type et le message ; au-dessus, les appels en cours, du plus ancien au plus récent (c’est la pile d’exécution du chapitre 2). La ligne fautive est la plus basse qui appartient à <b>ton</b> code.</p>
[[c4-trace]]
<p>Ici, le bug n’est pas dans <code>moyenne</code> mais dans les données : la liste d’Alan est vide. Une fonction peut <b>lever</b> elle-même une exception avec <code>raise</code> pour signaler un appel impossible, avec un message utile :</p>
[[c4-raise]]
<p>On peut <b>rattraper</b> une exception prévue avec <code>try … except</code> : le programme continue au lieu de s’arrêter.</p>
[[c4-try]]` },

    { id: "i8", t: "Les causes typiques de bugs (liste du programme)", h: `
<p>Le programme cite précisément ces causes. Pour chacune : le symptôme et la correction.</p>
<h3>Problèmes de typage</h3>
[[c4-b-typage]]
<p><code>input()</code> renvoie toujours une chaîne ; <code>"17" + 1</code> est impossible. Convertir avec <code>int()</code> ou <code>float()</code>. Inversement, <code>"17" * 2</code> ne lève pas d’erreur… et donne <code>"1717"</code>.</p>
<h3>Effets de bord non désirés</h3>
[[c4-b-effet]]
<p>Une liste passée en paramètre n’est pas copiée (chapitre 1, alias) : la modifier dans la fonction modifie celle de l’appelant. Si ce n’est pas voulu, travailler sur une copie (<code>list(t)</code>, <code>t[:]</code>) ; si c’est voulu, l’écrire dans la docstring.</p>
[[c4-b-effet-ok]]
<h3>Débordements dans les tableaux</h3>
[[c4-b-debordement]]
<p>Les indices d’un tableau de longueur <i>n</i> vont de 0 à <i>n</i> − 1. Les erreurs « à un près » (<i>off-by-one</i>) sont les plus fréquentes : vérifier la première et la dernière itération.</p>
<h3>Instruction conditionnelle non exhaustive</h3>
[[c4-b-exhaustif]]
<p>Un <code>if … elif …</code> sans <code>else</code> laisse des cas sans réponse : la fonction renvoie <code>None</code>. Vérifier que <b>tous</b> les cas sont couverts (ici, ajouter <code>else: return 0</code>).</p>
<h3>Choix des inégalités</h3>
[[c4-b-inegalite]]
<p><code>&lt;</code> ou <code>&lt;=</code> ? Teste à la main le cas le plus petit (un seul élément) : avec <code>g &lt; d</code>, la boucle ne s’exécute pas du tout quand <code>g == d</code>.</p>
<h3>Comparaisons et calculs entre flottants</h3>
[[c4-b-flottants]]
<p>Les flottants sont stockés en binaire avec une précision limitée : 0,1 n’a pas d’écriture binaire finie. On ne teste jamais l’égalité de deux flottants avec <code>==</code> : on compare leur écart à une petite tolérance.</p>
<div class="boite histoire"><div class="lab"># git log --histoire</div><p><span class="commit">04/06/1996 <b>·</b></span> Vol 501 d’<b>Ariane 5</b> : environ 40 secondes après le décollage, la fusée se détruit. Un logiciel repris d’Ariane 4 convertissait un flottant sur 64 bits en entier sur 16 bits ; la valeur, plus grande avec la nouvelle fusée, ne tenait plus dans 16 bits. Débordement non traité : un problème de typage aux conséquences très concrètes.</p></div>
<h3>Mauvais nommage des variables</h3>
[[c4-b-nommage]]
<p>Ne jamais nommer une variable comme une fonction de Python (<code>max</code>, <code>min</code>, <code>sum</code>, <code>list</code>, <code>str</code>, <code>len</code>, <code>input</code>). Éviter aussi <code>l</code>, <code>O</code>, <code>I</code> (confondus avec 1 et 0), et les noms qui mentent (<code>moyenne</code> pour une somme). Un bon nom évite un commentaire.</p>` },

    { id: "i9", t: "Une méthode pour déboguer", h: `
<ol><li><b>Lire</b> le message d’erreur en entier, en commençant par la dernière ligne.</li>
<li><b>Reproduire</b> : trouver l’entrée la plus simple qui provoque le bug, et l’écrire comme un test.</li>
<li><b>Localiser</b> : afficher les valeurs intermédiaires (<code>print</code>), ou exécuter <b>pas à pas</b> avec le débogueur de ton éditeur (Thonny, par exemple, montre la pile et les variables) ou dans <a href="https://pythontutor.com/" target="_blank" rel="noopener">Python Tutor</a>.</li>
<li><b>Comprendre</b> avant de corriger : formuler pourquoi le programme fait ce qu’il fait.</li>
<li><b>Corriger</b>, puis relancer <b>tous</b> les tests (une correction peut en casser une autre).</li></ol>
<p>Expliquer son code ligne par ligne à quelqu’un, ou même à un objet posé sur le bureau, fait souvent apparaître l’erreur : c’est la méthode du « canard en plastique » (<i>rubber duck debugging</i>). C’est aussi exactement ce que demande l’examinateur pendant la partie pratique.</p>
<div class="boite histoire"><div class="lab"># git log --histoire</div><p><span class="commit">09/09/1947 <b>·</b></span> Sur le calculateur Harvard Mark II, l’équipe où travaille Grace Hopper trouve un papillon de nuit coincé dans un relais et le colle dans le cahier de bord avec la mention « First actual case of bug being found ». Le mot <i>bug</i> désignait déjà un défaut technique avant cette date, mais l’anecdote l’a rendu célèbre en informatique.</p></div>` }
  ],
  pieges: [
    { t: "Mettre des parenthèses à assert", h: `[[c4-p-assert]]<p><code>assert</code> n’est pas une fonction : avec des parenthèses, on teste un tuple non vide, toujours vrai. Python avertit (<code>SyntaxWarning</code>) mais ne s’arrête pas. Écrire <code>assert x &gt; 0, "x doit être positif"</code>.</p>` },
    { t: "Rattraper toutes les exceptions", h: `[[c4-p-except]]<p>Un <code>except:</code> sans type cache aussi les vraies erreurs (faute de frappe, bug de logique). Toujours préciser le type attendu : <code>except ValueError:</code>.</p>` },
    { t: "Nommer son fichier comme un module de Python", h: `<p>Un fichier <code>random.py</code> ou <code>math.py</code> dans ton dossier est importé <b>à la place</b> du module standard : <code>import random</code> charge ton fichier, et <code>random.randint</code> provoque une <code>AttributeError</code>. Renommer le fichier.</p>` },
    { t: "Écrire un test qui ne teste rien", h: `<p><code>assert indice_max([3, 9])</code> ne compare à rien : il vérifie seulement que le résultat est « vrai » (non nul). Un test compare toujours à une valeur attendue : <code>assert indice_max([3, 9]) == 1</code>.</p>` },
    { t: "Corriger le symptôme au lieu de la cause", h: `<p>Entourer l’appel fautif d’un <code>try</code> pour « faire disparaître » l’erreur, ou ajouter un <code>if</code> pour un cas particulier, sans comprendre pourquoi il se produit, déplace le bug. Remonte la trace jusqu’à la vraie cause (souvent une donnée inattendue, comme une liste vide).</p>` },
    { t: "Comparer des flottants avec ==", h: `<p><code>0.1 + 0.2 == 0.3</code> vaut False. Utiliser <code>abs(a - b) &lt; 1e-9</code> ou <code>math.isclose(a, b)</code>.</p>` }
  ],
  retenir: `
<h2>Squelette d’une fonction propre</h2>
[[c4-retenir]]
<h2>Modules</h2>
<ul><li><code>import m</code> → <code>m.f()</code> · <code>from m import f</code> → <code>f()</code> · <code>import m as x</code> → <code>x.f()</code>. Éviter <code>import *</code>.</li>
<li><code>if __name__ == "__main__":</code> : code exécuté seulement quand on lance le fichier lui-même (tests du module).</li>
<li>API : contrat (noms, paramètres, résultats, erreurs) sans le code. Lire la doc : <code>help(f)</code>, <code>f.__doc__</code>.</li></ul>
<h2>Exceptions à reconnaître</h2>
<div class="tab-wrap"><table><tr><th>exception</th><th>cause</th></tr>
<tr><td>NameError</td><td>nom inconnu</td></tr><tr><td>TypeError</td><td>type incompatible, mauvais nombre d’arguments</td></tr><tr><td>ValueError</td><td>valeur impossible (<code>int("a")</code>)</td></tr><tr><td>IndexError</td><td>indice hors limites</td></tr><tr><td>KeyError</td><td>clé absente</td></tr><tr><td>AttributeError</td><td>attribut absent (souvent sur None)</td></tr><tr><td>ZeroDivisionError</td><td>division par zéro</td></tr><tr><td>RecursionError</td><td>trop d’appels imbriqués</td></tr><tr><td>AssertionError</td><td>assertion fausse</td></tr></table></div>
<h2>Les 7 causes de bugs du programme</h2>
<ol><li>Typage : <code>input()</code> renvoie une chaîne.</li><li>Effet de bord non désiré : une liste en paramètre n’est pas copiée.</li><li>Débordement : indices de 0 à len − 1.</li><li>Conditionnelle non exhaustive : un cas oublié renvoie None.</li><li>Inégalités : tester le plus petit cas (&lt; ou &lt;=).</li><li>Flottants : jamais de == ; une tolérance.</li><li>Nommage : pas de <code>max = …</code>, des noms qui disent la vérité.</li></ol>
<h2>Tester</h2>
<p>Cas normaux + cas limites (vide, 1 élément, bornes, doublons, négatifs, 0) + anciens bugs. Les tests montrent la présence de bugs, pas leur absence.</p>`,
  predis: [
    { code: "c4-x1", niv: "moyen", rep: "<code>ajoute(2, a)</code> modifie la liste <code>a</code> elle-même et la renvoie : <code>b</code> est <code>a</code>. <code>ajoute(3)</code> part d’une liste neuve grâce à <code>None</code> : [3]." },
    { code: "c4-x2", niv: "facile", rep: "1 / 4 = 0.25. Pour 0, la division lève <code>ZeroDivisionError</code>, rattrapée par le <code>except</code> : la fonction renvoie None." },
    { code: "c4-x3", niv: "moyen", rep: "Dix additions de 0.1 donnent 0.9999999999999999 (erreurs d’arrondi binaire) : <code>total == 1</code> est faux. Arrondi à 2 décimales, on retrouve 1.0, égal à 1." },
    { code: "c4-x4", niv: "difficile", rep: "<code>f</code> crée une <b>nouvelle</b> liste (<code>t + [0]</code>) : <code>b</code> vaut [1, 0] et <code>a</code> n’est pas touchée. Puis <code>g</code> modifie <code>a</code> sur place : <code>a</code> devient [1, 0] et <code>c</code> est <code>a</code>. Au moment du print, les trois valent [1, 0] (mais <code>b</code> est un objet différent)." },
    { code: "c4-x5", niv: "facile", rep: "9 n’est pas dans la liste : <code>i</code> atteint 3 et <code>t[3]</code> déborde. Il manquait une condition <code>i &lt; len(t)</code> <b>avant</b> <code>t[i] != 9</code>." }
  ],
  ep: [
    { titre: "Statistiques sur des notes", enonce: `<p>Le module <code>stats.py</code> doit fournir deux fonctions documentées. L’une est à écrire, l’autre ne respecte pas sa documentation.</p>[[c4-ep1-fourni]]`,
      questions: [
        { q: "Compléter <code>moyenne</code> en vérifiant la précondition par une assertion.", c: `<p><code>assert len(notes) &gt; 0, "liste vide"</code> puis <code>return sum(notes) / len(notes)</code>.</p>` },
        { q: "Exécuter le programme fourni. La médiane est-elle juste ? La documentation est-elle respectée ?", c: `[[c4-ep1-sortie]]<p>La médiane (11.0) est juste, mais <code>releve</code> a été trié : <code>notes.sort()</code> trie la liste <b>sur place</b>, donc celle de l’appelant. C’est un effet de bord non désiré, contraire à « sans la modifier ». Correction : <code>t = sorted(notes)</code>, qui renvoie une nouvelle liste triée.</p>` },
        { q: "Écrire <code>test_stats()</code> : cas normaux, tailles paire et impaire, un seul élément, absence d’effet de bord, liste vide.", c: `[[c4-ep1-corr]]` },
        { q: "À l’oral : quelle différence entre <code>sorted(t)</code> et <code>t.sort()</code> ?", c: `<p><code>t.sort()</code> est une méthode qui trie la liste <code>t</code> elle-même et renvoie <code>None</code>. <code>sorted(t)</code> est une fonction qui renvoie une <b>nouvelle</b> liste triée et laisse <code>t</code> intacte.</p>` }

    { titre: "Dates valides", enonce: `<p>On veut vérifier qu’une date existe dans le calendrier grégorien. Une année est bissextile si elle est divisible par 4 mais pas par 100, ou si elle est divisible par 400 (2000 l’était, 1900 non).</p>[[c4-ep2-fourni]]`,

def mystere(t, i):
    if i == len(t):
        return 0
    if t[i] % 2 == 0:
        return 1 + mystere(t, i + 1)

def nb_pairs(t):
    """Renvoie le nombre d'éléments pairs de la liste d'entiers t."""
    n = 0
    for x in t:
        if x % 2 == 0:
            n = n + 1
    return n

print(nb_pairs([4, 7, 2, 9, 6]), nb_pairs([]))`, { fichier: "copie.py", out: "3 0" });
